visualDna:
  aesthetic: 'Eighties commercial airbrush painting: frisket-masked shapes filled with seamless sprayed gradients, chrome reflections and hard pin-point star highlights.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Sunset gradients of magenta, orange and violet, chrome surfaces reflecting a horizon split into sky color above and brown ground below, cyan accents.
  lighting_and_shadow: 'Idealized glossy light: long smooth gradients across every form, sharp white specular stars on edges, strong rim light.'
  texture_and_material: Grainless illustration-board surface, crisp frisket-cut edges, a faint spray stipple only in the deepest gradients.
  camera_and_composition: Keep the requested framing; forms are idealized and streamlined, often set against a large glowing horizon or sky.
  atmosphere_and_mood: Slick, optimistic and glamorous, dreamy commercial fantasy.
  rendering_and_quality: Perfectly smooth gradients with masked hard edges and sparkle highlights; no brush marks, no digital noise.
  key_features: seamless sprayed gradients; frisket-masked hard edges; chrome horizon reflections; star-sparkle highlights; sunset magenta and cyan palette
  creative_brief: "Eighties commercial airbrush painting: frisket-masked shapes filled with seamless sprayed gradients, chrome reflections and hard pin-point star highlights. Carry it through seamless sprayed gradients, frisket-masked hard edges, chrome horizon reflections, star-sparkle highlights, sunset magenta and cyan palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
