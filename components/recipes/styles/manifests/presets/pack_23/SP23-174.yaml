  aesthetic: 'Voxel heightmap landscape: early terrain engines that drew hills from columns of colored pixels, rolling blocky landscapes stretching to a fogged horizon.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; set the subject over rolling terrain built from pixel columns.
  color_and_tone: Earthy greens, browns and a hazy blue horizon.
  lighting_and_shadow: Baked slope shading and haze, kept consistent across the whole image.
  texture_and_material: Pixel-column terrain, jagged ridges and flat sky, kept consistent across the whole image.
  camera_and_composition: Low flying view over hills to the horizon.
  atmosphere_and_mood: Keep the requested mood with vast early freedom.
  rendering_and_quality: Authentic column terrain with blocky ridges, kept consistent across the whole image.
  creative_brief: "Voxel heightmap landscape: early terrain engines that drew hills from columns of colored pixels, rolling blocky landscapes stretching to a fogged horizon. Carry it through pixel column terrain, rolling hills, hazy horizon, low flight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
