  color_and_tone: Pure black ink and white paper only, kept consistent across the whole image.
  lighting_and_shadow: No gradation; black and white masses only, kept consistent across the whole image.
  texture_and_material: Solid black fills, hairlines, dotted patterns and white space.
  camera_and_composition: Tall asymmetric composition with vast black or white areas.
  atmosphere_and_mood: Keep the requested mood with sly decadent menace.
  rendering_and_quality: Precise elegant line with dramatic black masses, kept consistent across the whole image.
  creative_brief: "Decadent black-line illustration: fin-de-siècle pen drawing of pure black masses and fine hairlines, sinuous figures, peacock patterns and elegant sinister wit. Carry it through pure black masses, hairlines, peacock patterns, sinuous figures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
