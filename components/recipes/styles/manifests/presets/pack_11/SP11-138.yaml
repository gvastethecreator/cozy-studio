visualDna:
  aesthetic: "Weaving draft: a weaver's grid with threading, tie-up and treadling blocks around a drawdown that reveals the woven pattern."
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: encoded as a weaving draft whose drawdown pattern of filled squares forms the subject, with threading, tie-up and treadling grids around it."
  color_and_tone: Black filled squares on graph paper, sometimes one accent color.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Pencil or ink squares on printed graph paper, with the drafting tools visible in the line quality.
  camera_and_composition: Classic four-block draft layout with the drawdown largest, laid out as a real sheet of this drawing type.
  atmosphere_and_mood: Methodical, patient, crafty and precise, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Weaving Draft Grid as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: threading; tie-up; treadling; drawdown pattern
