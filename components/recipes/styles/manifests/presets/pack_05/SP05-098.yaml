visualDna:
  aesthetic: >-
    Bright cel illustration with rounded silhouettes, simplified volume, and a clean, cooperative
    balance of warm and cool color.
  subject_treatment: >-
    Retain the requested forms and action; round transitions and group details into readable,
    friendly shapes.
  color_and_tone: >-
    Clear blue accents pair with warm cream and softened earth tones; adapt the mix to specified
    colors.
  lighting_and_shadow: >-
    Even diffuse light keeps forms open, with soft highlights that gently describe rounded volume.
  texture_and_material: >-
    Smooth cel shading and lightly satin highlights simplify surfaces while preserving their
    original material identity.
  camera_and_composition: >-
    Respect the requested framing; use repeated rounded shapes and clear spacing to keep the focal
    area uncluttered.
  atmosphere_and_mood: >-
    Optimistic and generous in tone, without requiring a group or civic scene.
  rendering_and_quality: >-
    Use stable silhouettes, soft shadow edges, and clean color blocking with little surface noise.
  key_features: >-
    Rounded form, clear blue accents, warm-cool harmony, and uncluttered cel shading give the image
    an easy brightness.
  creative_brief: >-
    Keep the requested subject, action, and location; lend them rounded forms and cooperative color
    balance without adding a fantasy community.
