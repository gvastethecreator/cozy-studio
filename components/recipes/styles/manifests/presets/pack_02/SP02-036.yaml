visualDna:
  aesthetic: '1930s rubber-hose cartoon: black-and-white animation with boneless bouncing limbs, pie-cut eyes and everything alive and dancing to the beat.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Black, white and grey on aged cream, high contrast, slight film flicker.
  lighting_and_shadow: No rendered light; flat fills and occasional grey tone.
  texture_and_material: Thick uniform ink lines, white gloves, film grain, scratches and gate weave.
  camera_and_composition: Characters bouncing in rhythm, objects with faces joining the dance, simple stage-like settings.
  atmosphere_and_mood: Bouncy and surreal, a cheerful world with a strange undertone.
  rendering_and_quality: Vintage 1930s print texture; original characters, no mouse or cat mascots.
  key_features: boneless rubber-hose limbs; pie-cut eyes; black and white; objects with faces dancing; film flicker
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies 1930s Rubber Hose Cartoon as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
