visualDna:
  aesthetic: >-
    Ink stippling models form with directionally organized points and short marks, using controlled
    spacing and scale rather than random noise.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Place stipple along existing forms
    and contours without obscuring defining features.
  color_and_tone: >-
    Retain the requested palette and value relationships. Use point density to support tone without
    forcing a single-color treatment or blurred transparency.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Concentrate points in existing shadow areas
    while keeping light areas clear and open.
  texture_and_material: >-
    Keep point scale controlled and the mark pattern selective. Do not spread grain evenly over the
    image or replace material cues with a generic dot texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Stipple does not require a page,
    border, lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Stipple describes tonal construction without adding content
    or context.
  rendering_and_quality: >-
    Resolve silhouette and major value groups before smaller points. Keep spacing open enough that
    important details remain readable when reduced.
avoidRules:
  - random or uniform dot noise across the image
  - stipple too small to remain legible at reduced size
  - unrequested page, border, lettering, or period motifs
