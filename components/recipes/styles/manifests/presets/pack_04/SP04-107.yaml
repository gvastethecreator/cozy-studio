visualDna:
  aesthetic: 'Infant board book graphics: huge simple shapes in black, white and one red, with bold stripes, dots and spirals a baby can see.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Pure black and white with a single bright red accent; no other hues and no midtones.
  lighting_and_shadow: No lighting at all; shapes are flat and read only by contrast.
  texture_and_material: Printed matte board with slightly rounded corners, solid ink areas and crisp pattern fills.
  camera_and_composition: One subject filling the frame, centered and head-on, with big bold patterns inside the shapes.
  atmosphere_and_mood: Calm, clear and captivating for the very youngest eyes.
  rendering_and_quality: Maximal contrast and minimal detail; no gradients, no small parts and no busy background.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies High-Contrast Baby Board Book as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: black white and red only; huge flat shapes; stripe dot and spiral patterns; centered head-on subject; rounded board corners
