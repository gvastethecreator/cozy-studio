visualDna:
  aesthetic: 'Gothic Revival architecture: pointed arches, lancet and traceried windows, buttresses, steep roofs with pinnacles and crockets, applied with nineteenth-century precision.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Pale limestone ashlar or polychrome red and yellow brick banding, slate-grey roofs, dark leaded glass; muted overall with stained glass colour inside.
  lighting_and_shadow: Soft overcast or low slanting light that deepens tracery and buttress shadows; interiors lit in coloured shafts from stained glass.
  texture_and_material: Dressed limestone with sharp mouldings, carved crockets and finials, polychrome brick, slate roofs, cast-iron cresting, leaded stained glass.
  camera_and_composition: Keep the requested view; strong verticals, pointed arches framing depth, spires or gables breaking the skyline.
  atmosphere_and_mood: Aspiring, solemn and romantic, piety rendered in stone.
  rendering_and_quality: Detailed architectural photograph with legible tracery and moulding, straight verticals, no ruin or horror decay unless requested.
  key_features: pointed lancet arches; stone tracery windows; pinnacles and crockets; polychrome brick banding; steep slate roofs
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gothic Revival as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
