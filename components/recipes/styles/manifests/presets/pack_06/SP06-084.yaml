visualDna:
  aesthetic: 'Pre-rendered sprite: the subject modeled and ray-traced on a 90s workstation, then shrunk and color-reduced into a low-resolution game sprite.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Glossy CG color crunched into a small shared palette; smooth gradients break into ordered dither and banding.
  lighting_and_shadow: Baked studio lighting with bright Phong specular hot spots and soft ray-traced shadows frozen into the sprite.
  texture_and_material: Plastic-smooth CG surfaces, chrome reflections, a jagged one-pixel dark matte halo where the sprite was cut from its render background.
  camera_and_composition: Keep the requested view; the subject reads as a finished 3D model locked into a small sprite frame.
  atmosphere_and_mood: Shiny and futuristic in a 90s way, technology showing off.
  rendering_and_quality: Sharp downsampled pixels over rendered shading; no hand-placed pixel clusters.
  key_features: ray-traced model shrunk to sprite; Phong highlights; ordered dither; jagged matte halo; small palette
  creative_brief: "Pre-rendered sprite: the subject modeled and ray-traced on a 90s workstation, then shrunk and color-reduced into a low-resolution game sprite. Carry it through ray-traced model shrunk to sprite, Phong highlights, ordered dither, jagged matte halo, small palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
