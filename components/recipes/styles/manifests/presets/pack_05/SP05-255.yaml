  color_and_tone: Ruby, sapphire and emerald hues with bright gold, clear and saturated, shifting warm to cool along the lines.
  lighting_and_shadow: Luminous edge highlights and crisp contained glow, with faceted gem glints on focal points.
  texture_and_material: Smooth cel fills, fine facet breaks and small sparkle accents.
  camera_and_composition: Keep the requested view; rising diagonals and vertical lift carry the eye upward.
  atmosphere_and_mood: Buoyant, optimistic and energetic, everything lifting toward the sky.
  rendering_and_quality: Sharp contours and bright color separation, with glow reserved for small focal accents.
  key_features: upward-sweeping lines; ruby-sapphire-emerald hues; faceted gem glints; crisp contained glow; rising diagonals
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gem-Facet Rising-Line Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
