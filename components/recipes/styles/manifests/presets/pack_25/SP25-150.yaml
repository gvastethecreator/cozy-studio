visualDna:
  aesthetic: 'Floating Assembly Presentation: the real components of a product or package suspended apart on clear axes, with a small assembled view for control.'
  subject_treatment: Suspend the prompt's existing components apart on clear axes in an orderly presentation, keeping their number, relationships and the exact brand artwork.
  color_and_tone: Constant source materials and colors on a quiet neutral background.
  lighting_and_shadow: One common soft light with gentle shadows on every floating part.
  texture_and_material: Original thickness and detail kept, with no new internal parts.
  camera_and_composition: Ordered suspended layout with a small assembled control view.
  atmosphere_and_mood: Clarity of parts and a light exhibition feel, calm and clean.
  rendering_and_quality: Every component could return to its place without changing shape.
  creative_brief: "Floating Assembly Presentation: the real components of a product or package suspended apart on clear axes, with a small assembled view for control. Carry it through suspended parts, clear axes, assembled control, exact part count. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: suspended parts; clear axes; assembled control; exact part count
