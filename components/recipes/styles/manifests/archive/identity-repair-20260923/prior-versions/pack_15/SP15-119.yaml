visualDna:
  aesthetic: >-
    Assemble irregular broken planes around a few taut connecting lines, using uneven edges and
    contrasting worn surfaces to show reuse.
  subject_treatment: >-
    Preserve the requested content and silhouette; apply patch-like repairs and uneven joins to existing
    forms without inventing spacecraft debris.
  color_and_tone: >-
    Balance scorched charcoal and oxide tones with weathered canvas or wood hues, a small ember-like
    highlight, and one cool pale accent.
  lighting_and_shadow: Use localized glints along joined edges and broad shadows that expose changes in material and plane.
  texture_and_material: >-
    Contrast worn metal, salt-weathered wood, and patched canvas with smoother repaired areas; vary
    texture by plane instead of coating everything in rust.
  camera_and_composition: >-
    Keep the requested crop; use a few taut curves, patch edges, and gaps to link existing masses without
    forcing a vessel or debris-field layout.
  atmosphere_and_mood: >-
    Suggest resourcefulness under pressure through visible repair, imbalance, and restrained sparks of
    heat.
  rendering_and_quality: >-
    Keep joins and material changes readable; limit grit and small fragments so the main structure holds
    together.
avoidRules:
  - floating debris added only to signal salvage
  - uniform rust or damage across all surfaces
  - dense tethers that obscure the main form
assets:
  defaultImage: /assets/recipes/styles/defaults/SP15-119.webp
attributes:
  negativePrompt: >-
    floating debris added only to signal salvage, uniform rust or damage across all surfaces, dense
