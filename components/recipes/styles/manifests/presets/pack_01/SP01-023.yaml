visualDna:
  aesthetic: 'Action-camera point of view: a tiny ultra-wide camera strapped to a helmet, chest, handlebar or pole, seeing about 150 degrees with a bulging fisheye curve.'
  subject_treatment: Keep the prompt subject, action and setting; this preset owns the camera position and lens, so re-stage only the viewpoint as described.
  color_and_tone: Punchy small-sensor color, bright saturated skies and foliage, slightly crunchy contrast, shadows that block quickly.
  lighting_and_shadow: Whatever the outdoors gives, usually hard sun; flare streaks when the sun enters the dome, no added light.
  texture_and_material: Over-sharpened fine detail, spray and mud droplets on the lens dome, motion blur only at the extreme edges.
  camera_and_composition: 'Mounted camera close to the action: strong barrel distortion, curved horizon, a piece of the wearer or their gear (hands, helmet rim, handlebar, ski tips) intruding at the frame edge, deep focus everywhere.'
  atmosphere_and_mood: Immersive and breathless, the viewer strapped into the motion with no safe distance.
  rendering_and_quality: 'Consumer action-cam realism: crisp center, stretched corners, no cinematic depth of field or smooth grading.'
  key_features: 150-degree fisheye; curved horizon; wearer or gear in frame; droplets on the dome; deep focus
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies GoPro Wide as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
