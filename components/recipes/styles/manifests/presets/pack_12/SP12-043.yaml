visualDna:
  aesthetic: 'In-game screenshot look informed by Earth Defense Force 5 gameplay: third-person arcade shooter capture with giant insects/kaiju scale, city harbor destruction, squad chaos, and unapologetic HUD readability. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Earth Defense Force 5-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Earth Defense Force 5-informed palette: concrete grey, ocean blue, explosion orange, armor
    red/blue, monster green, and bright targeting UI. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through daylight city exposure, rocket explosions, laser beams, smoke plumes,
    and monster-hit flashes. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from low-to-mid budget city assets, oversized creatures, military armor, rubble,
    water, and many projectile effects. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person battlefield camera with player small against huge enemies, evacuation
    routes, squad markers, and urban scale chaos. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: 'Earth Defense Force 5-derived mood: campy, massive, panicked, arcade-military, and destructive; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: busy arcade HUD is coherent:
    health, weapon ammo, radar, ally markers, and target reticles can be visible. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Earth Defense Force 5 gameplay screenshots; third-person arcade shooter capture with giant
    insects/kaiju scale, city harbor destruction, squad chaos, and unapologetic HUD readability;
    concrete grey, ocean blue, explosion orange, armor red/blue, monster green, and bright targeting
    UI; daylight city exposure, rocket explosions, laser beams, smoke plumes, and monster-hit
    flashes; low-to-mid budget city assets, oversized creatures, military armor, rubble, water, and
    many projectile effects; third-person battlefield camera with player small against huge enemies,
    evacuation routes, squad markers, and urban scale chaos; campy, massive, panicked,
    arcade-military, and destructive; HUD guidance: busy arcade HUD is coherent: health, weapon
    ammo, radar, ally markers, and target reticles can be visible
  creative_brief: "EDF Harbor Kaiju Evacuation: in-game screenshot language informed by Earth Defense Force 5, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
