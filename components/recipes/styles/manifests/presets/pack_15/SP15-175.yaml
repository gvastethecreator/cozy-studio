visualDna:
  aesthetic: 'Slimepunk: slime molds as living computers and urban planners, with yellow veined networks spreading across maps, streets and machines.'
  subject_treatment: Keep the prompt's subject and setting; let branching yellow slime-mold networks spread across its surfaces, connecting points like living maps.
  color_and_tone: Vivid slime yellow and orange veins against dark soil, grey concrete and pale petri glass.
  lighting_and_shadow: Soft diffuse light with a glossy wet sheen on every slime vein and pulse.
  texture_and_material: Wet branching veins, pulsating fans, petri glass, oat flakes and damp stone.
  camera_and_composition: Top-down map-like views of networks and close macro views of pulsing fans.
  atmosphere_and_mood: Uncanny and clever, a brainless organism that plans better than any engineer.
  rendering_and_quality: Glossy organic illustration with intricate branching network detail.
  creative_brief: "Slimepunk: slime molds as living computers and urban planners, with yellow veined networks spreading across maps, streets and machines. Carry it through yellow slime networks, map-like branching, wet sheen, pulsing fans. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: yellow slime networks; map-like branching; wet sheen; pulsing fans
