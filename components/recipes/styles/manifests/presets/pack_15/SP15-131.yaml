  aesthetic: 'Diverpunk: an undersea industrial age of copper hard-hat divers, air hoses, diving bells and riveted underwater stations.'
  subject_treatment: Keep the prompt's subject and setting; take it underwater with hard-hat diving gear, air hoses and riveted structures.
  color_and_tone: Deep sea green and blue with polished copper, brass and pale shafts of light.
  lighting_and_shadow: Sunbeams from the surface and lamp beams from helmets in murky water.
  texture_and_material: Copper helmets with bolted faceplates, canvas suits, rubber hoses and barnacled iron.
  camera_and_composition: Low seafloor views looking up at hoses rising to the surface.
  atmosphere_and_mood: Slow and weighty, every step an effort in a silent, dangerous world.
  rendering_and_quality: Moody period illustration with suspended particles and gleaming copper.
