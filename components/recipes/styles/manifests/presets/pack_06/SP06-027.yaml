visualDna:
  aesthetic: 'Chalk dust drawing on a dark slate board: soft white and pale colored chalk rubbed into tone with the fingertips, with ghostly half-erased earlier marks behind.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Dusty white and a few pale chalk colors on near-black green or charcoal slate; values built by chalk pressure and rubbing.
  lighting_and_shadow: 'Reversed value logic: light is what you draw, the dark board is the shadow; soft glow from rubbed chalk halos.'
  texture_and_material: Gritty chalk strokes broken by the board surface, finger-rubbed dust clouds, ghost smears of wiped drawings, powder along the bottom edge.
  camera_and_composition: Keep the requested framing; the drawing floats on the dark board with empty dark space around it.
  atmosphere_and_mood: Temporary and dreamy, a drawing that could be wiped away.
  rendering_and_quality: Soft dusty edges, broken strokes and rubbed glow; no readable writing, no clean vector lines.
  key_features: white chalk on dark slate; finger-rubbed dust tone; ghost erasure smears; broken gritty strokes; light as the drawn element
  creative_brief: "Chalk dust drawing on a dark slate board: soft white and pale colored chalk rubbed into tone with the fingertips, with ghostly half-erased earlier marks behind. Carry it through white chalk on dark slate, finger-rubbed dust tone, ghost erasure smears, broken gritty strokes, light as the drawn element. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
