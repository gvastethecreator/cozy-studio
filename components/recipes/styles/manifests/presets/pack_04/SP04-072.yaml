visualDna:
  aesthetic: 'Ballpoint drawing: a cheap blue ballpoint pen building tone through obsessive layered crosshatching and pressure changes on notebook paper.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Ballpoint blue from pale grey-blue to near-navy, on off-white notebook stock with faint ruled lines.
  lighting_and_shadow: Value built by pressure and hatch layering; the darkest areas have a slight glossy ink sheen.
  texture_and_material: Continuous looping hatch strokes, ink blobs at stroke turns, embossed grooves in the paper and faint ruled lines.
  camera_and_composition: Keep the requested view, the drawing sitting on the notebook page with open margins.
  atmosphere_and_mood: Obsessive and personal, hours of patient scribbling.
  rendering_and_quality: Dense realistic hatching in one blue ink; no color fills and no marker.
  key_features: blue ballpoint only; layered crosshatch; pressure-led values; ink blobs; ruled notebook paper
  creative_brief: "Ballpoint drawing: a cheap blue ballpoint pen building tone through obsessive layered crosshatching and pressure changes on notebook paper. Carry it through blue ballpoint only, layered crosshatch, pressure-led values, ink blobs, ruled notebook paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
