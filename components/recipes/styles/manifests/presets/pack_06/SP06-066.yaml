visualDna:
  aesthetic: 'Trash polka: realistic black-and-grey rendering violently interrupted by bold red brush swaths, smeared circles, bars and ink splatter.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Strictly black, grey scale and one blood-red on off-white; red is always flat and graphic, never shaded.
  lighting_and_shadow: Dramatic realist lighting inside the grey rendering; the red graphics ignore light entirely.
  texture_and_material: Soft graphite or ink-wash realism against dry-brush red strokes, splatter dots, drips and stamped abstract bars.
  camera_and_composition: Keep the requested view; one large red gesture cuts diagonally across the subject, with smaller circles and bars as counterweights.
  atmosphere_and_mood: Aggressive and chaotic, beauty and vandalism fighting on one surface.
  rendering_and_quality: Crisp contrast between photographic grey detail and raw red marks; no third color.
  key_features: black-grey realism; flat red brush swaths; splatter and drips; abstract bars; off-white ground
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Trash Polka as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
