visualDna:
  aesthetic: >-
    Build the graphic anime treatment from loose broken brush contours crossed by saturated
    overpaint and simple sturdy forms interrupted by irregular organic slabs. Let eruptive sprays
    and overlapping arcs tied to existing motion set its rhythm; use acid pink, yellow-green, and
    cyan against deep indigo for color and rough pencil, dry brush, and controlled paint spatter
    for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use loose broken brush contours crossed by
    saturated overpaint for edge work, simple sturdy forms interrupted by irregular organic slabs
    for form simplification, and eruptive sprays and overlapping arcs tied to existing motion only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with acid pink, yellow-green, and cyan against deep indigo. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: flat intense colors with rough, unlit edges. Keep shadows grouped
    and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with rough pencil, dry brush, and controlled paint spatter,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use clear focal zones with turbulent color gathered
    around existing forms to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey candid emotional intensity and visual overload,
    while preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with raw line crossings, acidic color bursts, and sturdy readable silhouettes; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    loose broken brush contours crossed by saturated overpaint; simple sturdy forms interrupted by
    irregular organic slabs; acid pink, yellow-green, and cyan against deep indigo; eruptive
    sprays and overlapping arcs tied to existing motion; rough pencil, dry brush, and controlled
    paint spatter; clear focal zones with turbulent color gathered around existing forms.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with loose broken brush
    contours crossed by saturated overpaint, simple sturdy forms interrupted by irregular organic
    slabs, and acid pink, yellow-green, and cyan against deep indigo; use eruptive sprays and
    overlapping arcs tied to existing motion only where movement is already present, and apply
    rough pencil, dry brush, and controlled paint spatter as the drawing finish.
