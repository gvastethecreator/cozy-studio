visualDna:
  aesthetic: 'String art: taut straight threads between pins forming curves by envelope.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is drawn by taut threads stretched between pins, curves emerging from straight lines."
  color_and_tone: Bright thread colors on dark board, used consistently across subject and background.
  lighting_and_shadow: Soft light on threads, expressed through the style rather than photographic lighting.
  texture_and_material: Taut threads, pins and board, visible at a glance as the signature of the style.
  camera_and_composition: Pinned outline with thread envelopes, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Precise, handmade, delicate and mathematical, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp thread finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "String art: taut straight threads between pins forming curves by envelope. Carry it through taut threads, pin outlines, curve envelopes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: taut threads; pin outlines; curve envelopes
