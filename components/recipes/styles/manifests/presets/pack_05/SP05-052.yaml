visualDna:
  aesthetic: 'Surveillance-feed anime rendering: cold cyan duotone, fine horizontal scanlines at a fixed pitch, and thin ruled bracket marks framing forms without any characters.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Icy cyan and deep slate duotone with one saturated red signal; every other hue collapses into the two-tone ramp.
  lighting_and_shadow: Flat cold top light like a low-lux sensor exposure; shadows crushed to slate and highlights clipped to pale cyan.
  texture_and_material: Uniform two-pixel scanline texture over everything, slight interlace doubling on moving edges, and faint sensor noise in darks.
  camera_and_composition: Keep the requested view; add thin corner bracket marks and a small crosshair tick around the focal form, never readable data.
  atmosphere_and_mood: Clinical, watchful and judgemental, the feeling of being assessed.
  rendering_and_quality: Clean anime line under a scanline overlay, two-value duotone, crisp bracket marks, and no letters or numerals.
  key_features: cyan-slate duotone; fixed-pitch scanlines; corner bracket marks without text; interlace doubling; single red signal
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Surveillance Verdict Grid as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
