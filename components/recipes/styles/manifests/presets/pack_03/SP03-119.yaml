visualDna:
  aesthetic: 'Photoreal digital human: an adult face and body built from layered skin shading of epidermis, dermis and blood, with groomed strand hair and wet, refractive eyes.'
  subject_treatment: Keep the prompt subject, pose, setting and camera; render people as original photoreal adult digital humans, and leave non-human subjects in their own form at the same skin-level fidelity.
  color_and_tone: Natural skin with red undertones in ears, nostrils and lips, uneven pigmentation, a slight flush and a true neutral grade.
  lighting_and_shadow: Soft key with a clear catchlight, light bleeding red through thin skin at the edges of shadows.
  texture_and_material: Pores, fine vellus hair, micro wrinkles, freckles and moles, strand-level brows and lashes and a wet meniscus on the eye.
  camera_and_composition: Keep the requested view; an 85 mm portrait feel with one eye tack sharp.
  atmosphere_and_mood: Intimate and unsettlingly present, a person who was never there.
  rendering_and_quality: Path-traced skin and eye caustics with asymmetry kept, never waxy, airbrushed or doll-like.
  creative_brief: "Photoreal digital human: an adult face and body built from layered skin shading of epidermis, dermis and blood, with groomed strand hair and wet, refractive eyes. Carry it through layered subsurface skin, strand hair and lashes, refractive wet eyes, pores and vellus hair, red light bleed in thin skin. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: layered subsurface skin; strand hair and lashes; refractive wet eyes; pores and vellus hair; red light bleed in thin skin
