visualDna:
  aesthetic: "Material Register Books: apparent changes of paper, ink and density follow the book's sections and hierarchy."
  subject_treatment: Change the apparent paper, ink and density of the prompt's publication by section with one clear rule, every title and supplied word exact.
  color_and_tone: A palette per register with constant text contrast and clear section changes.
  lighting_and_shadow: A flat content view plus a soft-lit material presentation.
  texture_and_material: Distinct but sober apparent papers presented as a visual study.
  camera_and_composition: Each change of material matching an editorial function.
  atmosphere_and_mood: Narrative tactility and section memory, crafted and meaningful.
  rendering_and_quality: Crisp book whose content still works on a uniform stock.
  creative_brief: "Material Register Books: apparent changes of paper, ink and density follow the book's sections and hierarchy. Carry it through section paper changes, one rule, constant contrast, tactile sections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: section paper changes; one rule; constant contrast; tactile sections
