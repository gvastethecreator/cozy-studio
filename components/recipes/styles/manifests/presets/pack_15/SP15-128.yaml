visualDna:
  aesthetic: 'Loompunk: a textile-mill world where punch-card looms compute, thread is data and whole cities are woven on colossal machines.'
  subject_treatment: Keep the prompt's subject and setting; weave it into looms, thread and punch-card mechanisms so pattern becomes the technology.
  color_and_tone: Undyed linen cream, indigo, madder red and polished wood with bright thread accents.
  lighting_and_shadow: Tall mill windows throwing parallel beams across rows of looms and floating fibers.
  texture_and_material: Warp threads, punch cards, shuttles, wooden frames and cloth bolts.
  camera_and_composition: Long rows of looms receding in perspective and close views of threads crossing.
  atmosphere_and_mood: Rhythmic and industrious, the clatter of machines weaving patterns that think.
  rendering_and_quality: Intricate period illustration with precise thread and card detail.
  creative_brief: "Loompunk: a textile-mill world where punch-card looms compute, thread is data and whole cities are woven on colossal machines. Carry it through punch-card looms, warp threads, mill windows, woven patterns. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: punch-card looms; warp threads; mill windows; woven patterns
