visualDna:
  aesthetic: 'Papercraft construction: the subject scored, folded and glued from cardstock, with visible glue tabs, layered pop-up planes and tracing-paper windows at tabletop scale.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Kraft brown, off-white card and muted matte printed colors, with milky tracing-paper whites where light passes through.
  lighting_and_shadow: Warm desk lamp from one side, thin crisp shadows under every fold, backlight glowing through the tracing-paper panes.
  texture_and_material: Paper fibre, crisp score lines, cut edges showing one-millimetre card thickness, glue tabs and slight warping of large panels.
  camera_and_composition: Keep the requested view as a tabletop macro with shallow depth of field so folds and tabs read at scale.
  atmosphere_and_mood: Patient, precise and quietly delightful, a world made with a craft knife.
  rendering_and_quality: Tabletop macro photograph of a real paper model; flat printed faces, no gloss and no CG smoothness.
  key_features: scored and folded cardstock; visible glue tabs; layered pop-up planes; tracing-paper windows; tabletop macro depth of field
  creative_brief: "Papercraft construction: the subject scored, folded and glued from cardstock, with visible glue tabs, layered pop-up planes and tracing-paper windows at tabletop scale. Carry it through scored and folded cardstock, visible glue tabs, layered pop-up planes, tracing-paper windows, tabletop macro depth of field. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
