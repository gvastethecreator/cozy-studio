visualDna:
  aesthetic: 'Victorian steamwork architecture: brick and cast-iron buildings wrapped in riveted copper boiler plate, exterior pipe runs, dial clusters and venting steam as working building services.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Soot-dark brick red, copper brown, verdigris green and amber gaslight in foggy grey air; warm-cool split.
  lighting_and_shadow: Pools of amber gaslight, steam plumes catching and diffusing the light, dim smoggy daylight behind.
  texture_and_material: Rows of rivets, soot streaks, oil staining, cast-iron lattice girders and dial faces without readable numbers.
  camera_and_composition: Keep the requested view; dense vertical pipe runs and chimneys organize the facade into strong vertical rhythm.
  atmosphere_and_mood: Industrious, humid and clanking, a city that runs on pressure and coal.
  rendering_and_quality: Engraving-like detail density in metalwork with soft steam; not a glass conservatory and not a vehicle scene.
  key_features: riveted copper boiler plate; exterior pipe runs; dial clusters without numbers; venting steam; amber gaslight in smog
  creative_brief: "Victorian steamwork architecture: brick and cast-iron buildings wrapped in riveted copper boiler plate, exterior pipe runs, dial clusters and venting steam as working building services. Carry it through riveted copper boiler plate, exterior pipe runs, dial clusters without numbers, venting steam, amber gaslight in smog. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
