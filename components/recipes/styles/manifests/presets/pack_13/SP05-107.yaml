visualDna:
  aesthetic: 'Gou Tanabe manga look as in his Lovecraft adaptations: dense organic crosshatching, cosmic horror, grotesque bodies and heavy black atmosphere.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Tanabe realism, dense hatching and grotesque organic forms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with dense hatching, true to the Gou Tanabe palette.
  lighting_and_shadow: Candle and eldritch glow, lit the way Gou Tanabe lights its scenes.
  texture_and_material: Dense organic crosshatching, with the surface finish of Gou Tanabe.
  camera_and_composition: Oppressive horror compositions, framed the way Gou Tanabe composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with visceral cosmic horror.
  rendering_and_quality: Dense cosmic horror manga illustration, in the recognizable hand of Gou Tanabe.
  key_features: Gou Tanabe hatching; cosmic horror; grotesque
  creative_brief: "Gou Tanabe manga look as in his Lovecraft adaptations: dense organic crosshatching, cosmic horror, grotesque bodies and heavy black atmosphere. Carry it through Gou Tanabe hatching, cosmic horror, grotesque. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
