visualDna:
  aesthetic: >-
    Borrowed Faces Fate Archive acts as a transferable mythic-noir router: borrowed translated into
    dark symbolic behavior, faces translated into dark symbolic behavior plus fate translated into
    dark symbolic behavior fused with kami and yokai myth-noir with boundary seals, wet ink, foxfire
    glow, paper-lantern hush, and legalistic supernatural bargains; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    identity slippage, borrowed contour, and unstable likeness plus layered identity planes and
    face-like pattern drift; forms should inherit silhouette pressure, emblem logic, ritual posture,
    edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through borrowed-weighted accent roles over disciplined dark values, faces-weighted
    accent roles over disciplined dark values plus fate-weighted accent roles over disciplined dark
    values together with ink black, foxfire blue, wet vermilion, lantern cream, snow white, cypress
    green, moon silver, and rain-dark indigo; values stay separated, accents feel intentional, and
    the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use borrowed-weighted rim behavior, occult glow, and charged shadow, faces-weighted rim
    behavior, occult glow, and charged shadow plus fate-weighted rim behavior, occult glow, and
    charged shadow with paper lantern bloom, rain reflections, dawn hush, foxfire edges,
    snow-diffused glow, and narrow supernatural rim light; shadows must carry omen weight, rims
    should clarify form, and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render painted skin, mask lacquer, and rubbed pigment plus aged paper, sealed dust, brittle
    edges, and indexed relic marks alongside washi paper, wet ink, lacquer, sealed cord, rain gloss,
    snow powder, scale shimmer, bell metal, and carved wood grain; surface scale, patina, residue,
    gloss, grain, and carved or sealed edges must remain coherent across characters, objects,
    scenes, and abstractions.
  camera_and_composition: >-
    Frame with threaded causality and weighted intersections plus classified archive grids and
    preserved-fragment spacing plus asymmetric seal placement, crossing lines, boundary panels,
    kagura motion arcs, vow-path rhythm, and quiet negative space; the style should support
    portraits, objects, architecture, creatures, symbols, and full scenes through reusable spatial
    grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through uncertain selfhood and ritual disguise, inevitability with trickster
    intelligence plus forbidden knowledge under preservation pressure and uncanny politeness,
    whispered threat, old bargain logic, purification silence, weather command, and ambiguous mercy;
    the image can become severe, sensual, sacred, violent, quiet, or strange when prompt X asks for
    it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with borrowed recognition with denoised dark editorial polish and controlled material
    truth plus faces recognition with denoised dark editorial polish and controlled material truth
    and refined illustrated finish with clean ink edges, denoised darks, readable glow, and no chibi
    or slapstick drift; prioritize clean denoise, readable dark values, strong silhouette hierarchy,
    tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    borrowed translated into dark symbolic behavior, faces translated into dark symbolic behavior
    plus fate translated into dark symbolic behavior; identity slippage, borrowed contour, and
    unstable likeness plus layered identity planes and face-like pattern drift; painted skin, mask
    lacquer, and rubbed pigment plus aged paper, sealed dust, brittle edges, and indexed relic
    marks; borrowed-weighted rim behavior, occult glow, and charged shadow, faces-weighted rim
    behavior, occult glow, and charged shadow plus fate-weighted rim behavior, occult glow, and
    charged shadow; threaded causality and weighted intersections plus classified archive grids and
    preserved-fragment spacing
  creative_brief: >-
    Apply Borrowed Faces Fate Archive after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies borrowed translated
    into dark symbolic behavior, faces translated into dark symbolic behavior plus fate translated
    into dark symbolic behavior, identity slippage, borrowed contour, and unstable likeness plus
    layered identity planes and face-like pattern drift, borrowed-weighted accent roles over
    disciplined dark values, faces-weighted accent roles over disciplined dark values plus
    fate-weighted accent roles over disciplined dark values, borrowed-weighted rim behavior, occult
    glow, and charged shadow, faces-weighted rim behavior, occult glow, and charged shadow plus
    fate-weighted rim behavior, occult glow, and charged shadow, painted skin, mask lacquer, and
    rubbed pigment plus aged paper, sealed dust, brittle edges, and indexed relic marks plus
    threaded causality and weighted intersections plus classified archive grids and
    preserved-fragment spacing, finish discipline, and negative controls without requiring a fixed
    deity, ritual, prop bundle, location, or sample composition.
