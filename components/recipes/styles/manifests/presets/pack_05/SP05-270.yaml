visualDna:
  aesthetic: Dual-stroke anime ink in which contours begin as angular knife-cut lines at the edges of the image and melt into round soft watercolor strokes as they approach the focal form.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Quiet ink neutrals with a warm ochre, blush or coral wash blooming only around the focal form.
  lighting_and_shadow: Defined edge highlights on the angular outer lines turn into soft reflected wash near the center of attention.
  texture_and_material: Dry crisp line ends at the periphery and wet watercolor blooms with cauliflower edges near the focal form.
  camera_and_composition: Keep the requested framing; hardness radiates from the frame edges and softness gathers at the focus.
  atmosphere_and_mood: Harshness softening into compassion; a cold world with one warm center.
  rendering_and_quality: Two clearly legible stroke families in a gradient from angular to round, with the warm bloom contained.
  key_features: angular cuts melting into round strokes; warm bloom at the focal form; dry periphery and wet center; ink neutrals with coral; hard-to-soft gradient
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cursed Severance Compassion Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
