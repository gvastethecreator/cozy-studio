visualDna:
  aesthetic: 'Gekiga dramatic manga: realistic adult proportions drawn with a split, dry-loaded brush, gritty screentone and cinematic framing instead of cute stylization.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Black ink and white paper with coarse gray screentone; dirty midtones and heavy black masses.
  lighting_and_shadow: Low hard light with deep shadow pools, faces half lost in black, sweat and rain catching white highlights.
  texture_and_material: Dry-brush streaks with broken bristle edges, scraped highlights, weathered skin, cloth and wood.
  camera_and_composition: 'Film-like framing: long-lens close-ups, low angles and silent wide shots with small figures.'
  atmosphere_and_mood: Bleak, adult and unsentimental, hardship shown without heroics.
  rendering_and_quality: Realistic faces and anatomy, rough brush energy, no big sparkling eyes and no chibi proportions.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gekiga Drybrush Realism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: split dry-brush strokes; realistic adult proportions; coarse screentone grit; deep shadow pools; cinematic long-lens framing
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - big sparkling eyes
  - chibi proportions
  - clean vector line
  - watermark
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
