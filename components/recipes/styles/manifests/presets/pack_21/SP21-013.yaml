visualDna:
  aesthetic: 'Singed paper burn-through: an image made by scorching and burning paper, with browned gradients, charred edges and holes burned clean through.'
  subject_treatment: Form the prompt's subject from scorch tones and burned-through openings, keeping its silhouette and main forms clearly readable.
  color_and_tone: Cream paper browning through amber and umber to black char at the burned edges.
  lighting_and_shadow: Tone comes from scorch depth; holes let light or a dark backing show through.
  texture_and_material: Curled charred edges, delicate ash rims, heat-browned halos and crisp burned holes.
  camera_and_composition: The sheet shown flat or slightly curled, with burned openings shaping the subject.
  atmosphere_and_mood: Dramatic, fragile and dangerous, an image made by fire.
  rendering_and_quality: Authentic scorch gradients and real char edges, never painted brown or clean cuts.
  creative_brief: "Singed paper burn-through: an image made by scorching and burning paper, with browned gradients, charred edges and holes burned clean through. Carry it through scorch gradients, charred hole edges, ash rims, curled paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: scorch gradients; charred hole edges; ash rims; curled paper
