visualDna:
  aesthetic: 'In-game screenshot look informed by Fez gameplay: pixel-art perspective-puzzle capture with rotating 2D/3D spaces, blocky caverns, glyph-like forms, and tiny character scale. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Fez-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Fez-informed palette: pastel sky blue, cave purple, moss green, golden cube glow, black
    pixel outlines, and soft pink highlights. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through simple ambient glow, cube sparkle, cave opening light, and flat pixel
    shadow. Lighting must clarify the playable route, threat, focal subject, or objective and avoid
    generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from chunky pixel blocks, mossy tiles, ladders, doors, mysterious glyph shapes
    without readable text, and clean sprite edges. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with orthographic puzzle-platform frame with vertical shafts, rotatable landmarks,
    hidden paths, and one-screen spatial clarity. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: 'Fez-derived mood: mysterious, gentle, clever, retro, and contemplative; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: very minimal HUD; small
    collected-cube indicators or map hints can appear but the puzzle space should dominate. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Fez gameplay screenshots; pixel-art perspective-puzzle capture with rotating 2D/3D spaces,
    blocky caverns, glyph-like forms, and tiny character scale; pastel sky blue, cave purple, moss
    green, golden cube glow, black pixel outlines, and soft pink highlights; simple ambient glow,
    cube sparkle, cave opening light, and flat pixel shadow; chunky pixel blocks, mossy tiles,
    ladders, doors, mysterious glyph shapes without readable text, and clean sprite edges;
    orthographic puzzle-platform frame with vertical shafts, rotatable landmarks, hidden paths, and
    one-screen spatial clarity; mysterious, gentle, clever, retro, and contemplative; HUD guidance:
    very minimal HUD; small collected-cube indicators or map hints can appear but the puzzle space
    should dominate
  creative_brief: "Fez Echo Cavern Puzzle: in-game screenshot language informed by Fez, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
