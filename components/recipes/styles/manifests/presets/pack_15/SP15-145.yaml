visualDna:
  aesthetic: 'Satpunk: a world obsessed with satellites, of rooftop dishes, orbital junk, uplink shrines and people tracking lights across the sky.'
  subject_treatment: Keep the prompt's subject and setting; point dishes and antennas toward the sky and show satellites or orbital debris overhead.
  color_and_tone: Night sky indigo with white satellite streaks, dish silver and warm window lights.
  lighting_and_shadow: Starlight, satellite glints and warm light from rooftop shacks.
  texture_and_material: Weathered satellite dishes, cable bundles, solar panels and scrap antenna forests.
  camera_and_composition: Rooftops full of dishes pointing up, with long-exposure satellite trails in the sky.
  atmosphere_and_mood: Yearning and connected, people listening to the sky for voices from orbit.
  rendering_and_quality: Detailed night illustration with fine satellite trails and dish textures.
  creative_brief: "Satpunk: a world obsessed with satellites, of rooftop dishes, orbital junk, uplink shrines and people tracking lights across the sky. Carry it through rooftop dish forests, satellite trails, orbital debris, uplink shacks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
