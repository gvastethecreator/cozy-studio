visualDna:
  aesthetic: 'Toon shader: 3D forms rendered with flat cel bands and inked outlines so they read like hand-drawn animation.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Flat saturated fills with one darker shadow band and a small highlight.
  lighting_and_shadow: Hard stepped shading ramp from one key light, with crisp shadow shapes.
  texture_and_material: Clean flat color, black or colored outline of variable width.
  camera_and_composition: Keep the requested view; outlines clarifying every silhouette.
  atmosphere_and_mood: Lively and graphic, animation in three dimensions.
  rendering_and_quality: Clean cel-shaded 3D; original designs only, no franchise characters.
  key_features: flat cel shadow bands; inked outlines; hard shading steps; saturated fills; 3D form
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Toon Shader (Cel Shaded) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
