visualDna:
  aesthetic: 'Ground-penetrating radar profile: a grey radargram where buried objects appear as bright hyperbola arcs and buried surfaces as bands.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Grey banded background with black-and-white hyperbolas; sometimes a copper tint.
  lighting_and_shadow: No conventional light; brightness shows only how strongly the buried material reflects.
  texture_and_material: Horizontal ringing bands, crisp arcs over pipes, stones and cavities.
  camera_and_composition: Long horizontal profile, surface along the top, depth downward.
  atmosphere_and_mood: Curious and archaeological, secrets just beneath the feet.
  rendering_and_quality: Credible field radargram look without any depth scales, grids or text.
  creative_brief: "Ground-penetrating radar profile: a grey radargram where buried objects appear as bright hyperbola arcs and buried surfaces as bands. Carry it through hyperbola arcs over buried objects, banded background, horizontal profile, void reflections, grey radargram. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hyperbola arcs over buried objects; banded background; horizontal profile; void reflections; grey radargram
