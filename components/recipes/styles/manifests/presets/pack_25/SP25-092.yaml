visualDna:
  aesthetic: 'Layered Route Displays: routes placed on separate graphic planes so crossings never confuse, while node positions stay fixed.'
  subject_treatment: Separate the prompt's routes onto distinct planes while keeping every node position and connection exactly as supplied; keep labels exact.
  color_and_tone: Color or value per layer, backed by line style or label.
  lighting_and_shadow: Minimal graphic depth, each shadow clearly separate from any route.
  texture_and_material: Clean planes and uniform strokes with explicit occlusions.
  camera_and_composition: One shared projection, any layer isolatable without moving nodes.
  atmosphere_and_mood: Navigable complexity and stable context, clear to follow.
  rendering_and_quality: Crossings between separate layers never read as links or new nodes.
  creative_brief: "Layered Route Displays: routes placed on separate graphic planes so crossings never confuse, while node positions stay fixed. Carry it through layered routes, fixed nodes, shared projection, explicit occlusion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: layered routes; fixed nodes; shared projection; explicit occlusion
