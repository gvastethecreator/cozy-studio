visualDna:
  aesthetic: Blend checker or tile geometry with reflective planes, washed gradients, and soft cathode-like halos.
  subject_treatment: >-
    Preserve requested content and action; use reflection and haze as selective rendering cues instead of
    adding a screen, arcade, or retail interior.
  color_and_tone: >-
    Mix aqua, magenta, peach, violet, and phosphor green against cream and charcoal, following any
    specified palette.
  lighting_and_shadow: >-
    Contain glow around selected edges and reflected color; retain readable shadows and requested light
    direction.
  texture_and_material: >-
    Contrast smooth reflective color planes, thin metallic glints, shallow reflections, and restrained
    grain.
  camera_and_composition: >-
    Preserve requested framing; balance one broad geometric plane with a clear anchor and reflective
    color band.
  atmosphere_and_mood: >-
    Let synthetic nostalgia or unease emerge from pastel color and reflection while following the
    requested mood.
  rendering_and_quality: Keep geometry crisp, reflections shallow, and haze subordinate to the forms.
avoidRules:
  - generic gradient without material structure
  - bloom that erases the grid
  - reflections that create a second scene
