visualDna:
  aesthetic: 'Forensic evidence photography: a flat, objective record of an object or trace with a scale reference and even flash, meant for measurement, not emotion.'
  subject_treatment: Keep the prompt subject and action; this preset owns the documentary evidence framing with scale reference, and the setting stays the prompt's.
  color_and_tone: Neutral accurate color, white balance for a grey card, no grading.
  lighting_and_shadow: Even on-axis or ring flash, or a low oblique light to reveal impressions.
  texture_and_material: Surface detail, cracks, prints and fibers recorded sharply.
  camera_and_composition: Camera square to the surface, black-and-white scale bar beside the object, plain markers without numbers.
  atmosphere_and_mood: Detached and procedural, calm clarity about something that went wrong.
  rendering_and_quality: Documentation-grade sharpness; no gore, drama or readable case numbers.
  key_features: scale bar beside the object; even flash; camera square to the surface; neutral color; plain evidence markers
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Forensic Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
