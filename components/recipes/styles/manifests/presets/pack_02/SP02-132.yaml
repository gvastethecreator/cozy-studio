visualDna:
  aesthetic: 'Italian neorealism: postwar black-and-white cinema shot in real streets and courtyards with non-actors, available light and plain, honest framing.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Soft grey black and white with open shadows and hazy daylight.
  lighting_and_shadow: Natural daylight and overcast skies; no studio lighting or glamour.
  texture_and_material: Worn clothes, rubble, laundry lines, cracked plaster and cobbles.
  camera_and_composition: Eye-level medium and wide shots, people embedded in crowds and real places, long lenses rare.
  atmosphere_and_mood: Humane and aching, ordinary struggle filmed with compassion.
  rendering_and_quality: Grainy postwar film stock; no stylization and no heroic posing.
  creative_brief: "Italian neorealism: postwar black-and-white cinema shot in real streets and courtyards with non-actors, available light and plain, honest framing. Carry it through real locations, non-actor faces, available daylight, eye-level framing, soft grey black and white. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: real locations; non-actor faces; available daylight; eye-level framing; soft grey black and white
