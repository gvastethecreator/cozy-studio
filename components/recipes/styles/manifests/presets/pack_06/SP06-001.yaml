visualDna:
  aesthetic: 'Classic studio oil painting: transparent warm darks laid in thin, opaque lead-white lights built up thick, and form turned by a strong single light in the academic chiaroscuro manner.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Earth palette of raw umber, burnt sienna, yellow ochre and vermilion with lead white; deep warm shadows, one cool accent, values grouped into a clear light mass and dark mass.
  lighting_and_shadow: One high side light at roughly a four-to-one ratio; the shadow side dissolves into the dark ground while lit planes turn through soft half-tones to small thick highlights.
  texture_and_material: Linen canvas weave visible in thin darks, raised bristle-brush impasto only in the brightest lights, a faint amber varnish film over the whole surface.
  camera_and_composition: Keep the requested framing; the dark ground swallows the edges so the lit area becomes the focal point.
  atmosphere_and_mood: Grave and weighty, a quiet drama carried by the fall of light.
  rendering_and_quality: Lost edges in shadow, found edges on the light side, thick lights over thin darks; brushwork stays visible up close and resolves at a distance.
  key_features: thin transparent darks and thick lights; single side light chiaroscuro; earth palette with lead white; linen weave in shadows; amber varnish glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Oil Painting (Classic) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
