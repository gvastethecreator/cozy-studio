  lighting_and_shadow: Pattern fills stand in for shadow, kept consistent across the whole image.
  texture_and_material: Checker, dot and line pattern fills and crisp pixels.
  camera_and_composition: Small framed scene with clean negative space, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with quiet crafted mystery.
