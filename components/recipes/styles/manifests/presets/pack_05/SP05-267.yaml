visualDna:
  aesthetic: 'Hiroaki Samura Blade of the Immortal manga look: raw pencil and ink drawing, loose sketchy energy, elaborate exotic weapons, ronin and historical Edo grit.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Samura designs, scruffy scarred faces, loose sketchy hair and elaborate period clothing with strange weapons. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pencil grey, black ink wash and dried ink sepia with no bright color.
  lighting_and_shadow: Natural light suggested by sketchy pencil shading and ink wash.
  texture_and_material: Loose raw pencil lines, ink wash, visible sketch construction and dry brush.
  camera_and_composition: Dynamic sketchy sword duels alternating with quiet Edo-period street and teahouse moments.
  atmosphere_and_mood: Keep the requested mood with raw ronin grit.
  rendering_and_quality: Raw pencil-and-ink historical manga illustration with sketchy energy.
  key_features: Hiroaki Samura pencil; raw sketch; exotic weapons; Edo grit
  creative_brief: "Hiroaki Samura Blade of the Immortal manga look: raw pencil and ink drawing, loose sketchy energy, elaborate exotic weapons, ronin and historical Edo grit. Carry it through Hiroaki Samura pencil, raw sketch, exotic weapons, Edo grit. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
