visualDna:
  aesthetic: 'High-tech architecture: the building turned inside out, with structure, ducts, lifts and stairs carried on the outside, tension rods, cast steel nodes and prefabricated panels on show.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Silver steel and white with colour-coded services — blue for air, green for water, yellow for electrics, red for circulation; clean and bright.
  lighting_and_shadow: Crisp daylight with a web of thin shadow from rods and trusses; lit glass lift cars and stair tubes at night.
  texture_and_material: Painted tubular steel trusses, cast steel joints, stainless tension cables, corrugated and glass panels, external ducts in gloss enamel.
  camera_and_composition: Keep the requested view; close enough to read the joints and colour-coded ducts, strong repetition of structural bays.
  atmosphere_and_mood: Optimistic, engineered and transparent, a machine shown working.
  rendering_and_quality: Sharp architectural photograph with precise joints and clean enamel colours, no hidden services.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies High-Tech Exposed Structure as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
