visualDna:
  aesthetic: >-
    Glacier Ice translates natural material behavior into form: start from Compressed ancient ice,
    Smooth but cracked, and Massive, then turn natural formation, growth, erosion, and geological or
    biological irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Cracks and bubbles: preserve identity and pose while
    letting forms grow, erode, polish, fracture, or soften through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Deep Cyan/Blue as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Internal glow define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Glacier Ice without hiding the prompt
    subject.
  texture_and_material: >-
    Render Smooth but cracked through organic variation, non-repeating edge wear, local pores,
    growth marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber,
    pores, or surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Massive as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Freezing, ancient by using age, weather, habitat pressure, and sensory
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Arctic, cold material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Compressed ancient ice; Cracks and bubbles; Smooth but cracked; Internal glow; Massive
  creative_brief: >-
    Route any subject through Glacier Ice as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Summon the compressed time of glacial ice,
    where millennia of pressure have squeezed air into blue oblivion and internal cracks map the
    stress of slow, patient movement. An internal luminescence should glow from within, a cyan heart
    beating in frozen sleep that deepens toward the center. The material must feel ancient, patient,
    and terrifyingly fragile. Use Glacier Ice as portable surface/render behavior over any input:
    map its texture, light response, edge wear, color chemistry, and tactile rhythm onto the subject
    instead of requiring a literal material sample, macro tile, wall, landscape, source object, or
    scene where the material naturally appears.
