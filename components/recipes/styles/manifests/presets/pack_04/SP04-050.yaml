visualDna:
  aesthetic: 'Industrial vehicle design sketch: alcohol marker and colored pencil on grey toned paper, with confident ellipses, construction lines and white gouache highlights.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a vehicle design sheet with a low three-quarter hero view and a smaller side elevation on one ground line, and that layout replaces the requested framing.
  color_and_tone: Grey paper ground, cool grey marker ramps, one bold body color, black tires and glazing, white pencil and gouache highlights.
  lighting_and_shadow: 'Studio sketch convention: body sides fade from lit top to dark lower edge, and the glazing carries one crisp horizon reflection line.'
  texture_and_material: Streaky overlapping marker passes, visible construction ellipses, pastel-dust gradients on large panels, crisp ink in panel gaps.
  camera_and_composition: Low three-quarter hero view with an exaggerated wide stance, a smaller side elevation below, wheels or tracks sitting on a shared ground line.
  atmosphere_and_mood: Fast, confident and aspirational, a machine that already wants to move.
  rendering_and_quality: 'Design-studio sketch finish: construction lines left visible, a quick marker drop shadow, no photographic environment.'
  key_features: alcohol marker on grey paper; white gouache highlights; construction ellipses; hero three-quarter plus side elevation; one bold body color
  creative_brief: "Industrial vehicle design sketch: alcohol marker and colored pencil on grey toned paper, with confident ellipses, construction lines and white gouache highlights. Carry it through alcohol marker on grey paper, white gouache highlights, construction ellipses, hero three-quarter plus side elevation, one bold body color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
