visualDna:
  aesthetic: 'Emissive-only lighting: the scene lit solely by glowing emissive shapes — tubes, panels and trims — with no other lights at all.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Saturated emissive colors on dark surfaces, colored reflections and bounce.
  lighting_and_shadow: Soft shadows from long light shapes, glossy floors reflecting each emitter.
  texture_and_material: Glossy and metallic surfaces picking up colored streaks from the emitters.
  camera_and_composition: Keep the requested framing; emissive shapes visible in frame.
  atmosphere_and_mood: Moody and electric, darkness drawn with glowing lines.
  rendering_and_quality: Clean emissive GI with bloom; no readable signage.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Emissive Neon Geometry as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: emissive shapes as only light; colored glossy reflections; soft long shadows; dark surfaces; bloom
