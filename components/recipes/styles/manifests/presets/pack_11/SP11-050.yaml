  lighting_and_shadow: Backlight through the glass with rim glints, expressed through the style rather than photographic lighting.
  texture_and_material: Condensation, ice, citrus peel and glass refraction, visible at card size as the signature of the style.
  camera_and_composition: Macro framing at glass height, arranged so the subject still reads at card size.
  atmosphere_and_mood: Glamorous, nocturnal, cool and sensual, driven by the construction, color and rhythm.
