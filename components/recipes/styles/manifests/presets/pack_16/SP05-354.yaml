visualDna:
  aesthetic: 'Motorsport anime of precision and data: racing lines, telemetry graphics, apex points and engineers watching screens of abstract data.'
  subject_treatment: Keep the prompt's subject and action; overlay clean abstract telemetry shapes (racing lines, apex markers, speed arcs) without readable numbers.
  color_and_tone: Asphalt grey, curb red and white with cyan data-line overlays.
  lighting_and_shadow: Bright track daylight or floodlit night racing with clean reflections on bodywork.
  texture_and_material: Glossy bodywork, rubber marbles, carbon parts and glowing vector overlays.
  camera_and_composition: Overhead track views with racing lines drawn on, and low trackside shots at the apex.
  atmosphere_and_mood: Calculated and intense, victory measured in tiny margins and perfect lines.
  rendering_and_quality: Crisp technical anime with clean vector overlays and polished mechanical detail.
  key_features: racing line overlay; apex markers; curbs; telemetry shapes
  creative_brief: "Motorsport anime of precision and data: racing lines, telemetry graphics, apex points and engineers watching screens of abstract data. Carry it through racing line overlay, apex markers, curbs, telemetry shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
