visualDna:
  aesthetic: 'Interlocking Baseline Type: letters share feet and fittings along one recognizable baseline, locking together without merging.'
  subject_treatment: Letter the requested words so selected letters share feet and fittings along one baseline, keeping word spaces and every character readable.
  color_and_tone: One ink with clear gaps between letters, the fit never relying on color.
  lighting_and_shadow: Flat rendering with letters standing directly on the page.
  texture_and_material: Firm stems and feet with optically compensated joins.
  camera_and_composition: A continuous baseline created by relationships rather than an added bar.
  atmosphere_and_mood: Stability and connection, with small pauses keeping the word legible.
  rendering_and_quality: Crisp lettering where each letter still works when pulled out alone.
  creative_brief: "Interlocking Baseline Type: letters share feet and fittings along one recognizable baseline, locking together without merging. Carry it through shared feet, interlocking fits, true baseline, kept word spaces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared feet; interlocking fits; true baseline; kept word spaces
