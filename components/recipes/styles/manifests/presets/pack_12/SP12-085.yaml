visualDna:
  aesthetic: >-
    Lords of the Fallen (2023) contemporary third-person dark fantasy, mixing medieval religious
    excess with pallid Umbral bodily architecture and warm/cold realm contrast.
  color_and_tone: >-
    Use restrained grounded values for the living space and a deliberate pallid/blue-green shift for
    the dead-space influence. Keep actor silhouettes readable through the shift and avoid a
    full-frame color wash.
  lighting_and_shadow: >-
    Show game-world light and deep shadow with a localized transition cue. Keep contact points,
    paths and enemy shape readable in the dark.
  texture_and_material: >-
    Use grounded dark medieval stone and iron with high-resolution surface response. Where the
    dead-realm layer is requested, introduce pallid bone-like root vaults, membranous stone seams
    and waxy organic accretions attached coherently to the same spatial structure, not a blue fog
    overlay.
  camera_and_composition: >-
    Use a close third-person gameplay camera and compose a traversable area around the requested
    subject and action. If the prompt shows a realm change, hold the camera position and spatial
    anchors so the change remains legible.
  rendering_and_quality: >-
    Read as a 2023 real-time game capture with high-resolution surfaces, dark but legible
    silhouettes and a coherent same-space realm shift.
  subject_treatment: >-
    Preserve the requested subject and action. If the prompt shows a realm change, make the altered
    state visible around that same subject; do not add a playable hero, threat or lamp by default.
  atmosphere_and_mood: >-
    Retain a dark-medieval gameplay environment while following the scene and event requested; a
    dual-realm transition is optional, not compulsory.
avoidRules:
  - isometric or first-person camera
  - two unrelated places pasted together
  - transition light that hides path, subject or nearby forms
  - unrequested canonical protagonist, boss, shrine or lore symbol
  - unrequested HUD, logo, interface or captions; preserve explicitly requested UI and text
  - anime, manga or cel-shaded grammar
