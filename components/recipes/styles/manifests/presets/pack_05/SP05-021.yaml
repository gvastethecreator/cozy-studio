visualDna:
  aesthetic: 'Journey-adventure anime at its most animated: tapered black-ink contours that thicken at turns, limbs stretched into smear frames, and dust or leaf trails curling behind fast motion.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Clear teal and warm orange against ink-dark and paper-light neutrals.
  lighting_and_shadow: Golden-hour hard two-step shadows with small white edge cuts.
  texture_and_material: Smooth cel flats with sparse dry-ink grain; smears drawn as stretched, tapered shapes.
  camera_and_composition: Keep the requested framing; open diagonal flow with rising arcs and unblocked negative space.
  atmosphere_and_mood: Buoyant resolve and forward curiosity, the road ahead always open and bright.
  rendering_and_quality: Crisp silhouettes and flat fills, with smears and trails only on motion already present.
  key_features: stretched limb smear frames; tapered ink contour; curling dust and leaf trails; teal and orange; two-step shadow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Teal-Orange Sakuga Smear as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
