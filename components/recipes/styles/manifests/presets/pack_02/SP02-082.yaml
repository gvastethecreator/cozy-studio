visualDna:
  aesthetic: 'Use this drawing language: Naive doodle drawing with hesitant overlapping lines, uneven circles, simple symbols, crayon overrun, eraser traces, and flat improvised space. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply loose graphite lines, overlapping attempts, visible erasures, and uncertain pen pressure to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use primary wax-crayon colors, crayon overrun, marker bleed, and bright paper tones as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat color with little modeled shading as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render notebook-paper grain, crayon-wax buildup, and marker-bleed marks as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Let uneven scale and flat symbol spacing follow the supplied silhouette; keep false starts visible and avoid imposing perspective or a scene.
  atmosphere_and_mood: Innocent, joyful, and freely improvised; keep the mood open to the source subject.
  rendering_and_quality: Finish with openly amateur crayon marks, uneven fill, visible construction attempts, and no polished cleanup.
  key_features: hesitant overlapping lines; uneven circles; crayon overrun; visible erasures; flat symbol spacing
  creative_brief: Render the supplied content with loose graphite lines, overlapping attempts, visible erasures, and uncertain pen pressure. Use primary wax-crayon colors, crayon overrun, marker bleed, and bright paper tones as style colors while honoring any explicit color instructions. Apply notebook-paper grain, crayon-wax buildup, and marker-bleed marks as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
