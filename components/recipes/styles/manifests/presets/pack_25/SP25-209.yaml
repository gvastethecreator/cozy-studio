visualDna:
  aesthetic: 'Continuous Caption Trails: captions and references follow the images in one coherent path that runs across the pages.'
  subject_treatment: Link the prompt's captions and references to their images through one continuous ranked path across the pages, each caption tied to one image.
  color_and_tone: Legible text and anchors with a subordinate path line.
  lighting_and_shadow: Flat layout with source image light untouched and no shadows over text.
  texture_and_material: Clean type and discreet connectors with clear, plain ground under captions.
  camera_and_composition: Captions near or clearly connected, with continuous numbering.
  atmosphere_and_mood: Editorial companionship and flow that is easy and pleasant to follow.
  rendering_and_quality: Crisp spread where no caption crosses another text or points twice.
  creative_brief: "Continuous Caption Trails: captions and references follow the images in one coherent path that runs across the pages. Carry it through caption trail, one image per caption, continuous numbering, discreet path. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: caption trail; one image per caption; continuous numbering; discreet path
avoidRules:
  - orphan captions
  - crossing connections
  - decorative numbering
  - invented quotes, authors or data
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
