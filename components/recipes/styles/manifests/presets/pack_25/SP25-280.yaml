visualDna:
  aesthetic: 'Flat-Art and Mockup Pair: the isolated master artwork shown beside the same artwork applied to the product, clearly labeled as a pair.'
  subject_treatment: Show the prompt's isolated artwork beside the same instance applied to the product, every letter and proportion identical in both panels.
  color_and_tone: Declared source colors, with light and material changes only in the mockup.
  lighting_and_shadow: Unlit flat art and a descriptively lit mockup side by side.
  texture_and_material: Clean transparent master art and an independent product surface.
  camera_and_composition: Two separate panels with the mockup referencing the art's anchors.
  atmosphere_and_mood: A transparent presentation of what was designed and how it looks.
  rendering_and_quality: Clean pair where the applied art matches the flat master exactly.
  creative_brief: "Flat-Art and Mockup Pair: the isolated master artwork shown beside the same artwork applied to the product, clearly labeled as a pair. Carry it through flat master, applied mockup, identical art, two panels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flat master; applied mockup; identical art; two panels
avoidRules:
  - art rebuilt from the mockup
  - opaque background on the flat art
  - lettering changed between panels
  - changed garment cut or seams
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
