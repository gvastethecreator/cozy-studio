visualDna:
  aesthetic: Broad opaque brush-ink strokes turn through the requested forms in long, pressure-shaped sweeps.
  subject_treatment:
    Preserve the requested subject and gesture. Use a few continuous brush passes to establish its
    large forms, keeping small details subordinate to the stroke path.
  color_and_tone:
    Favor strong ink and ground separation within the requested palette. Keep accents sparse and
    use the colored ink to support shape hierarchy, not add motifs.
  lighting_and_shadow:
    Turn forms through overlap and changes in stroke width. Keep major light and dark regions connected
    rather than shading every surface.
  texture_and_material:
    Show a loaded, smooth stroke core with a controlled taper at entry or release. Keep the deposit
    opaque and continuous, distinct from dry split-bristle drag or translucent pooling.
  camera_and_composition:
    Respect the prompt's viewpoint and placement. Let stroke arcs follow existing direction and leave
    room around important contours.
  atmosphere_and_mood:
    Express the requested tone through pace, stroke weight and open ground without imposing a cultural
    setting or calligraphic text.
  rendering_and_quality:
    Maintain a clear hierarchy between broad sweeps and restrained detail. Avoid scratchy bristle
    fringes, wash blooms and decorative marks unrelated to the subject.
avoidRules:
  - split-bristle dry drag
  - translucent wash blooms
  - unrequested calligraphy or symbols
