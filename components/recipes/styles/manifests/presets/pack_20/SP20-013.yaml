visualDna:
  aesthetic: 'Anthotype fade: a sun print made on paper coated with crushed plant juice, where light slowly bleaches the color and leaves the image in pale, fragile tints.'
  subject_treatment: Render the prompt's subject as a faded plant-pigment sun print, keeping its silhouette and major shapes while fine detail dissolves into soft bleached tones.
  color_and_tone: Faded berry violet, turmeric yellow or spinach green tints bleaching toward pale cream.
  lighting_and_shadow: Exposed areas bleached pale, protected areas holding stronger plant color, with soft blurred boundaries.
  texture_and_material: Uneven brushed plant juice coating, streaks, speckles of pulp and soft paper fibers.
  camera_and_composition: Contact-print framing with objects or silhouettes laid flat and a ragged coated border.
  atmosphere_and_mood: Fragile, botanical and ephemeral, an image already disappearing.
  rendering_and_quality: Soft organic sun print with uneven coating and bleached tints, never sharp or saturated.
  creative_brief: "Anthotype fade: a sun print made on paper coated with crushed plant juice, where light slowly bleaches the color and leaves the image in pale, fragile tints. Carry it through plant juice coating, sun-bleached tints, soft edges, ragged coated border. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: plant juice coating; sun-bleached tints; soft edges; ragged coated border
