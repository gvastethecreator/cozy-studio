attributes:
  negativePrompt: >-
    flat, 2d icon, wrong medium, flat 2d paintover, muddy AI noise, uncontrolled texture chatter,
    watermark, readable text, signature, accidental photorealism, generic smooth mesh, wrong
    geometry language, messy topology
