visualDna:
  aesthetic: 'Cut-paper silhouette: the subject reduced to a single solid black shape cut from paper, with all information carried by the outline.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Solid flat black shape on white or pale cream paper, no interior greys, one optional flat background tone.
  lighting_and_shadow: No modeling at all; the silhouette itself is the only value, shaped as if backlit.
  texture_and_material: Crisp scissor-cut edges with tiny irregularities, fine cut details such as lace, hair strands and leaf tips, paper grain.
  camera_and_composition: Keep the requested subject but pose it in profile or side view so the outline reads clearly.
  atmosphere_and_mood: Elegant, clear and a little theatrical, like a shadow play.
  rendering_and_quality: One unbroken black mass with intricate cut edges; no interior lines, no gradients, no highlights.
  key_features: single solid black shape; profile readable outline; scissor-cut edge detail; no interior modeling; flat paper ground
  creative_brief: "Cut-paper silhouette: the subject reduced to a single solid black shape cut from paper, with all information carried by the outline. Carry it through single solid black shape, profile readable outline, scissor-cut edge detail, no interior modeling, flat paper ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
