visualDna:
  aesthetic: >-
    High-contrast anime cel illustration cuts silhouettes sharply and uses sparse technical
    accents and controlled red marks.
  subject_treatment: >-
    Keep subject and proportions; use angular articulation without adding blasts, crosses,
    interfaces, or props.
  color_and_tone: >-
    Charcoal, blue gray, bone; signal red is a small focal accent.
  lighting_and_shadow: >-
    Hard directional key, broken shadow blocks, sparse highlights, no screen glow.
  texture_and_material: >-
    Clean flat cels with fine hatch in selected dark planes; no grid overlay.
  camera_and_composition: >-
    Respect camera; pressure comes from compressed spacing, not panels.
  atmosphere_and_mood: >-
    Constrained visual pressure only when it suits the requested tone.
  rendering_and_quality: >-
    Crisp separation, readable mids, sparse red, precise lines, no fake UI text.
  key_features: >-
    Hard-cut silhouette, compressed negative space, sparse signal red, precise cel shadows
  creative_brief: >-
    Apply a visual treatment centered on hard-cut silhouette, compressed negative space,
    sparse signal red, precise cel shadows. Preserve the exact subject, action, count, age,
    costume, setting, camera, and mood. Add nothing outside the prompt.
