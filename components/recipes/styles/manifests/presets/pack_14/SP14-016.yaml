    jurisdiction, dualities, lineage marks, and sovereign symbolism; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    coiling line logic and renewal-through-danger contour, cenote shaping silhouette rhythm, contour
    pressure, and symbolic edge control plus sun shaping silhouette rhythm, contour pressure, and
    symbolic edge control; forms should inherit silhouette pressure, emblem logic, ritual posture,
    edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through cenote teal, limestone gray, obsidian black, and solar yellow plus sun gold,
    cinder orange, and hard black contrast together with mineral darks, royal metal, storm blue,
    cinder orange, tidal green, funeral rose, sun-gold, and cold ivory accents; values stay
    separated, accents feel intentional, and the dark palette supports the requested content rather
    than swallowing it.
