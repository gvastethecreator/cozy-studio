visualDna:
  aesthetic: 'Soft-Block Ligatures: soft compact letterforms joined in a few friendly ligatures, with the rest of the word kept separate.'
  subject_treatment: Letter the requested words in soft compact forms joining only a few compatible pairs, with open counters and every character in order.
  color_and_tone: One ink with wide counters and an optional accent kept outside the word.
  lighting_and_shadow: Flat soft shapes with a matte, even finish.
  texture_and_material: Tense soft contours, smooth even joins and clean open counters.
  camera_and_composition: Ligatures grouped with pauses between pairs, the word never squeezed.
  atmosphere_and_mood: Closeness and playful compactness, without ever losing its precision.
  rendering_and_quality: Crisp lettering where every ligature keeps the count and order of letters.
  creative_brief: "Soft-Block Ligatures: soft compact letterforms joined in a few friendly ligatures, with the rest of the word kept separate. Carry it through soft blocks, few ligatures, open counters, friendly rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft blocks; few ligatures; open counters; friendly rhythm
