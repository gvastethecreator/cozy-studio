visualDna:
  aesthetic: 'Mechanical Index Displays: index bands that click into discrete positions behind a stable reading window, like a mechanical selector.'
  subject_treatment: Show the prompt's selection as bands locked into discrete positions with one stable reading window; keep every option name exact.
  color_and_tone: Light values for the selection, neutrals for available positions and one alert accent.
  lighting_and_shadow: Flat light with a tiny seating shadow where each band settles.
  texture_and_material: Clean index surfaces, visible slots and well-defined position edges.
  camera_and_composition: Selected reading centered in its window, neighbors clearly subordinate.
  atmosphere_and_mood: Precise mechanical change and a firm pause, satisfying and exact.
  rendering_and_quality: The active position has exactly one reading and never sits between two values.
  creative_brief: "Mechanical Index Displays: index bands that click into discrete positions behind a stable reading window, like a mechanical selector. Carry it through index bands, discrete positions, reading window, firm selection. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: index bands; discrete positions; reading window; firm selection
