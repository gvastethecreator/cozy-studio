visualDna:
  aesthetic: Ceremonial anime ink with measured concentric rings of warm-to-dark value falloff spreading from the brightest area, and evenly spaced brush marks like ritual steps.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Amber, cream and charcoal; prompt colors warm toward amber near the center and cool toward charcoal at the rim.
  lighting_and_shadow: A small warm bloom from an existing bright area, falling off in four to six visible value steps with readable shadows.
  texture_and_material: Smooth luminous washes bounded by crisp ink rings, clean rather than smoky or glittering.
  camera_and_composition: Keep the requested framing; the radial value rhythm centers on the brightest point already in the scene.
  atmosphere_and_mood: Solemn ritual cadence, the stillness before a judgment.
  rendering_and_quality: Stepped radial value bands, crisp ink boundaries and a controlled bloom that never washes out form.
  key_features: concentric stepped value rings; amber, cream and charcoal; warm bloom from existing light; evenly spaced brush marks; ritual cadence
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Lantern Retribution Ritual Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
