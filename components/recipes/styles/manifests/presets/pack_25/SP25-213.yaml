visualDna:
  aesthetic: 'Pocket-Scale Intimacy: compact pages with short texts and detail images, a close reading rhythm made for the hand.'
  subject_treatment: Compose the prompt's publication at pocket scale with short texts, one clear detail per page and generous margins, the title exact.
  color_and_tone: High contrast and a reduced palette, with small text kept strong.
  lighting_and_shadow: Flat layout with margins and gutter left clean.
  texture_and_material: Clean type and a very discreet paper texture.
  camera_and_composition: Short columns, detail images and an intimate rhythm without micro text.
  atmosphere_and_mood: Closeness and attention, like a notebook kept in a coat pocket.
  rendering_and_quality: Crisp small pages where all text stays legible at the declared size.
  creative_brief: "Pocket-Scale Intimacy: compact pages with short texts and detail images, a close reading rhythm made for the hand. Carry it through pocket format, short texts, one detail per page, intimate rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pocket format; short texts; one detail per page; intimate rhythm
