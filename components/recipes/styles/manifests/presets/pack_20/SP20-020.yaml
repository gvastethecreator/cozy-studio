visualDna:
  aesthetic: 'Gel plate layers: monoprints pulled from a soft gelatin plate, stacking translucent paint layers with leaf, lace and stencil impressions.'
  subject_treatment: Build the prompt's subject from stencil and object impressions pulled from a soft plate, keeping its silhouette clear among layered textures.
  color_and_tone: Translucent layered acrylic colors, often teal, coral and mustard, overlapping into new tones.
  lighting_and_shadow: No modeled light; depth comes from stacked translucent layers and ghost prints.
  texture_and_material: Brayer marks, leaf vein impressions, lace patterns, ghost prints and soft blotchy edges.
  camera_and_composition: Collage-like layered composition with the subject as a crisp stencil shape over textures.
  atmosphere_and_mood: Playful, botanical and experimental, a studio full of happy accidents.
  rendering_and_quality: Authentic layered monoprint textures with real impressions, never digital overlays.
  creative_brief: "Gel plate layers: monoprints pulled from a soft gelatin plate, stacking translucent paint layers with leaf, lace and stencil impressions. Carry it through translucent paint layers, leaf and lace impressions, brayer marks, stencil subject. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: translucent paint layers; leaf and lace impressions; brayer marks; stencil subject
