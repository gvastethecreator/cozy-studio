visualDna:
  aesthetic: 'Impossible perspective: architecture and objects that connect in geometrically impossible loops and staircases.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: the setting's structure loops impossibly — stairs rising into themselves, walls that are floors."
  color_and_tone: Neutral stone greys and creams, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Even, precise light, supporting the dream logic without adding stock props.
  texture_and_material: Precise line and stone, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Puzzling, precise, infinite and uncanny, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: impossible loops; stairs into themselves; walls as floors
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Impossible Perspective as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
