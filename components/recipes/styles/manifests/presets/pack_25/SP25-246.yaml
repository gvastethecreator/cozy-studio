visualDna:
  aesthetic: 'Nested Border Rhythms: border bands of different scales coordinated with an inner field and specially designed corners.'
  subject_treatment: Design a bordered surface from the prompt's subject with nested bands of different scales, dedicated corner pieces and a calm inner field.
  color_and_tone: Clear hierarchy between outer border, transition and inner field.
  lighting_and_shadow: Flat print surface with bands lying on one plane.
  texture_and_material: Crisp contours, modules per run and corners with continuous thickness.
  camera_and_composition: Side, corner and center treated as distinct functions within set margins.
  atmosphere_and_mood: Progressive framing, a bold outer rhythm answered by a fine inner one.
  rendering_and_quality: Clean design with resolved corners and no stretched runs.
  creative_brief: "Nested Border Rhythms: border bands of different scales coordinated with an inner field and specially designed corners. Carry it through nested bands, designed corners, calm center, framing rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: nested bands; designed corners; calm center; framing rhythm
