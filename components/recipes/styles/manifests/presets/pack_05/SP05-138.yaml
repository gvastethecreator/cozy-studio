visualDna:
  aesthetic: 'Cinematic ink anime: severe dry sumi-brush blacks, long still holds, and a single thin neon edge of magenta or cyan on otherwise matte darkness.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Deep indigo, ink black and bone white, with one neon magenta or cyan edge line.
  lighting_and_shadow: Low hard light from one side, broad matte shadow masses, the neon edge on a single contour only.
  texture_and_material: Dry brush grain at contour tails, matte dark fields and sparse speck grain.
  camera_and_composition: Keep the requested content; organize it in wide horizontal bands like a cinema frame, with deliberate empty space and one strong diagonal.
  atmosphere_and_mood: Quiet grief hardening into resolve, long silences held before a single decisive edge.
  rendering_and_quality: Precise dark contour, minimal detail, and exactly one neon edge in the frame.
  key_features: severe sumi-brush black; single neon edge line; wide horizontal banding; long still hold; matte indigo darks
  creative_brief: "Cinematic ink anime: severe dry sumi-brush blacks, long still holds, and a single thin neon edge of magenta or cyan on otherwise matte darkness. Carry it through severe sumi-brush black, single neon edge line, wide horizontal banding, long still hold, matte indigo darks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
