visualDna:
  aesthetic: >-
    Metal Gear concept-illustration language, paired with MGS3 fieldcraft: expressive brush-ink
    silhouettes, interrupted contours, dry-brush drag and sparse translucent color over confident
    tactical design.
  subject_treatment: >-
    Preserve explicit identity and action. Shape anatomy and mechanical forms with tapering black
    gestures, selected precise joints and unresolved edges; unspecified equipment has practical
    military-industrial construction.
  color_and_tone: >-
    Bone paper, deep ink, smoke grey and olive with one muted ochre or crimson accent. Leave large
    areas unpainted; explicit colors become selective washes.
  lighting_and_shadow: >-
    Light is expressed through untouched paper and abrupt black shadow shapes; a few grey washes
    describe volume without photoreal shading.
  texture_and_material: >-
    Broken ink edges, brush pressure, translucent wash and occasional sharp technical line;
    distinguish straps, hard plates and organic surfaces through mark direction rather than
    photographic texture.
  camera_and_composition: >-
    An assertive oblique gesture balanced by open paper and a few structural marks. Preserve the
    requested viewpoint; no mandatory jungle, gun or game camera.
  atmosphere_and_mood: >-
    Controlled urgency, secrecy and tactical concentration; the unfinished mark carries energy
    without obscuring the subject.
  rendering_and_quality: >-
    High-contrast gestural ink-and-wash concept illustration with naturalistic structure. No generic
    realistic jungle painting, anime face, smooth CGI or uniform grunge filter.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
