visualDna:
  aesthetic: 'Quiet body-horror anime without gore: slow, wrong changes in ordinary people, shown through posture, shadow and small details.'
  subject_treatment: Keep the prompt's subject and setting; show one subtle wrong change in the figure (an extra joint of shadow, a stretched limb, a face that stays too still).
  color_and_tone: Pale domestic colors going slightly sickly, cream walls, grey skin tones and a faint green cast.
  lighting_and_shadow: Soft window light with one shadow that does not match the figure casting it.
  texture_and_material: Clean everyday surfaces, fabric and skin drawn simply so the one wrong detail stands out.
  camera_and_composition: Still, ordinary framing that lingers too long, the change placed near the edge.
  atmosphere_and_mood: Unsettling and slow, a familiar person becoming a little less familiar each day.
  rendering_and_quality: Restrained prestige anime where horror lives in small precise details.
  creative_brief: "Quiet body-horror anime without gore: slow, wrong changes in ordinary people, shown through posture, shadow and small details. Carry it through ordinary scene, one wrong detail, mismatched shadow, lingering frame. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
