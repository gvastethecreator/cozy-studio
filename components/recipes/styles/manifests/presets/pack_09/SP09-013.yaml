visualDna:
  aesthetic: 'Bird feathers: overlapping contour feathers with barbs, shafts and iridescent sheen.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in overlapping feathers laid in rows like plumage.'
  color_and_tone: Brown, cream, black and iridescent blue-green, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft backlight showing feather barbs, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Overlapping feathers with visible barbs and shafts, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Light, graceful, alive and soft, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: overlapping feathers; barbs and shafts; plumage rows; iridescent sheen
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bird Feathers as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - fur
