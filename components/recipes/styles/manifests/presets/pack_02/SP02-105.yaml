  atmosphere_and_mood: Loud and over-animated; let the line boil and stretched timing carry the excitement.
  rendering_and_quality: Finish with unstable ink edges, motion smears, and expressive stretched contours.
  key_features: vibrating contours; stretched expression geometry; smear frames; squash and stretch; rough pencil marks
  creative_brief: 'Render the supplied content with vibrating outlines, stretched smear frames, contour boil, and high-energy cartoon scribble. Use warm yellow, candy red, chlorine blue, warm peach, and muted gray as style colors while honoring any explicit color instructions. Apply cel-paint wobble, analog-TV softness, warm color haze, and rough pencil marks as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag. Use it as a reusable look on any subject.'
