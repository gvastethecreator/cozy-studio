visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on The Long Dark gameplay screenshots:
    first-person winter survival capture with sparse cabins, snowfields, simple painterly realism,
    resource scarcity, and weather danger. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable The Long Dark-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a The Long Dark-informed palette: snow blue, pine green, cabin brown, muted red cloth, grey
    sky, and lantern amber. Keep value grouping legible at gameplay distance, with color accents
    behaving like route, danger, pickup, team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through overcast snowlight, aurora glow, flashlight beams, stove fire, and
    low-contrast blizzard fade. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from stylized snow, frosted wood, cloth gloves, simple tools, animal tracks, ice
    crystals, and painterly terrain planes. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person exploration framing with hands/tools, distant shelter silhouette,
    trail logic, and survival-object readability. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a The Long Dark-derived mood: isolated, cold, quiet, practical, and tense. The preset can
    become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but it
    should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: survival meters, temperature
    icons, condition warnings, and small inventory cues can appear but should remain austere.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    The Long Dark gameplay screenshots; first-person winter survival capture with sparse cabins,
    snowfields, simple painterly realism, resource scarcity, and weather danger; snow blue, pine
    green, cabin brown, muted red cloth, grey sky, and lantern amber; overcast snowlight, aurora
    glow, flashlight beams, stove fire, and low-contrast blizzard fade; stylized snow, frosted wood,
    cloth gloves, simple tools, animal tracks, ice crystals, and painterly terrain planes;
    first-person exploration framing with hands/tools, distant shelter silhouette, trail logic, and
    survival-object readability; isolated, cold, quiet, practical, and tense; HUD guidance: survival
    meters, temperature icons, condition warnings, and small inventory cues can appear but should
    remain austere
  creative_brief: >-
    Use Long Dark Frozen Survival as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from The Long Dark: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
