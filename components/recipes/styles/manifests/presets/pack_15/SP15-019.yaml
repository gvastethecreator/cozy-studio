visualDna:
  aesthetic: >-
    Repair Union Commons operates as a portable punk-spectrum router: combine Repair Union Commons
    identity cues through repair benches; turbine arcs; patched utility silhouettes; tarp planes;
    tool-steel accents; Repairpunk commons poster language built from hands-on tool culture with
    repair-climate punk grammar with civic stewardship, solar shade, recycled infrastructure,
    drought adaptation, seed archives, rain systems, and optimistic constraint, so the preset
    supplies retrofit style behavior rather than a required venue, mascot, prop bundle, or card
    composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through repair
    seams, modular shade panels, civic tool marks, reused materials, plant-tech edges, condensation
    systems, and cooperative maintenance silhouettes; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through sun yellow, sage, white ceramic, recycled aluminum, dry ochre, leaf green,
    rain blue, and calm public-service neutrals; keep dominant, support, and accent values readable,
    avoid muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
    Use hard solar panels of light, greenhouse diffusion, rain reflections, condenser glow,
    shade-cloth cuts, and bright civic air; lighting should reveal the punk system, preserve the
    user's subject, separate near and distant value planes, and avoid crushed blacks or noisy dark
    texture.
  texture_and_material: >-
    Render ceramic tile, repaired metal, woven shade cloth, seedlings, rain pipes, recycled plastic,
    aluminum frames, and chalky dust; keep material scale coherent, surface marks motivated, and
    tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through civic repair hierarchy, canopy rhythm, modular infrastructure, readable
    maintenance paths, and generous space around the prompt subject as reusable framing grammar for
    characters, creatures, objects, vehicles, environments, symbols, or full scenes without one
    required card layout.
  atmosphere_and_mood: >-
    Carry mood through organized optimism, public care, dry resilience, communal invention,
    practical tenderness, and climate-aware patience; the tone may become adult, romantic, violent,
    comic, sensual, eerie, civic, or strange when prompt X asks, while the punk family remains
    legible.
  rendering_and_quality: >-
    Finish with bright solarpunk/repair illustration with clean surfaces, restrained texture, no
    beige sameness, and no generic glass-utopia gloss; prioritize clean denoise, bold readable
    shapes, controlled grit, prompt preservation, no watermark, no readable text, and no generic
    concept-art polish.
  key_features: >-
    repair benches; turbine arcs; patched utility silhouettes; tarp planes; tool-steel accents;
    Repairpunk commons poster language built from hands-on tool culture
  creative_brief: >-
    Use Repair Union Commons after prompt X as a transferable punk-spectrum layer: prompt X supplies
    subject, action, setting, tone, and intensity, while the preset supplies repair benches, turbine
    arcs, patched utility silhouettes, tarp planes, tool-steel accents, Repairpunk commons poster
    language built from hands-on tool culture, color logic, light response, material behavior,
    composition rhythm, mood pressure, and finish discipline without requiring a fixed venue, fixed
    cast, fixed machine, repeated prop bundle, or sample-card composition.
