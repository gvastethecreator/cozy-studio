visualDna:
  aesthetic: 'Carved Relief Pictograms: broad reliefs and carved hollows with one or two levels of depth define the icon under a simple outer silhouette.'
  subject_treatment: Carve the prompt's subject as a broad relief with one or two levels of hollowing, keeping a simple outer silhouette.
  color_and_tone: Clear value relationships between raised surface and hollow, one optional accent.
  lighting_and_shadow: Soft raking light revealing the carving with gentle, readable shade.
  texture_and_material: Matte finish of minimal grain, with stone or metal only as options.
  camera_and_composition: Relief concentrated in one region, with a smooth resting zone beside it.
  atmosphere_and_mood: Serene solidity, with information discovered slowly through carved depth.
  rendering_and_quality: Planes and hollows stay distinct even with every texture removed.
  creative_brief: "Carved Relief Pictograms: broad reliefs and carved hollows with one or two levels of depth define the icon under a simple outer silhouette. Carry it through broad relief, two carving levels, raking light, smooth rest zone. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: broad relief; two carving levels; raking light; smooth rest zone
