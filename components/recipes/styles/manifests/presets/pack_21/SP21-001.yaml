visualDna:
  aesthetic: Cut-paper illustration made from a small hierarchy of flat colored shapes with visible layered depth.
  subject_treatment:
    Represent the requested subject through cut shapes without replacing its identity with a toy
    or changing its body proportions.
  color_and_tone:
    Use broad paper-color regions chosen from the requested palette. Limit small accents and maintain
    clear neighboring values.
  lighting_and_shadow:
    Use shallow consistent contact shadows between paper layers to reveal overlap. These support
    shadows do not replace lighting requested within the represented scene.
  texture_and_material:
    Keep edges mostly clean with slight hand-cut variation. Show paper thickness sparingly at
    overlaps, not around every internal detail.
  camera_and_composition:
    Preserve requested viewpoint, pose and frame. Depth comes from the illustration layers
    rather than a new isometric camera.
  atmosphere_and_mood:
    Keep the requested mood; paper construction does not require a cute, childlike or cheerful
    subject.
  rendering_and_quality:
    Use legible layer order, consistent thickness and restrained fiber detail. Avoid a pile
    of disconnected paper objects.
avoidRules:
  - unrequested toy proportions
  - inconsistent layer shadows
  - excessive edge fibers
