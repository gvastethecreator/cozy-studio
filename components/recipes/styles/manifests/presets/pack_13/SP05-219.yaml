visualDna:
  aesthetic: 'Plain graphic planes, thin even contours, and blunt shadow shapes give the drawing restrained flat clarity.'
  subject_treatment: 'Preserve identity, proportions, pose, action, and count; stylize shadow edges without distorting expression or altering count.'
  color_and_tone: 'Use simple color relationships and controlled contrast; the prompt sets hue and saturation rather than a fixed palette.'
  lighting_and_shadow: 'Keep stated lighting direction; define one or two firm shadow shapes without inventing another light source.'
  texture_and_material: 'Favor smooth color fields and minimal surface grain; retain material detail needed to recognize each form.'
  camera_and_composition: 'Keep camera, crop, scale, spacing, and count; clarity comes from plane separation within the given arrangement.'
  atmosphere_and_mood: 'Follow the requested mood; understated graphics do not prescribe an emotional tone.'
  rendering_and_quality: 'Use clean shapes and limited shadow edges with no unfinished marks or added glow.'
  key_features: 'Thin even contour; plain color planes; blunt shadow shapes; low surface grain; restrained flat clarity.'
  creative_brief: "Separate forms with plain color planes and deliberate shadows. Keep subject, action, count, camera, and mood as requested; add no new motif. Use it as a reusable look on any subject."
