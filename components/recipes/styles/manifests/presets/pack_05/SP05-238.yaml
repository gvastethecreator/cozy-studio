  aesthetic: 'Studio Trigger SSSS.Gridman look (2018): tokusatsu-homage giants and kaiju in quiet suburbs, silent pastel towns, power lines, and CG giants with rubber-suit charm.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Trigger designs, quiet pastel school or casual clothes, and giants with tokusatsu rubber-suit proportions. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pastel sky blue, power-line grey, kaiju navy and hero red.
  lighting_and_shadow: Quiet pastel suburban daylight broken by glowing hero beams and kaiju flashes.
  texture_and_material: Clean cel with CG giant models and painted suburbs.
  camera_and_composition: Low suburban angles with giants towering between power lines.
  atmosphere_and_mood: Keep the requested mood with uncanny quiet spectacle.
  rendering_and_quality: Stylish Trigger frame mixing quiet suburbs and tokusatsu spectacle.
  key_features: Gridman tokusatsu giants; pastel suburbs; power lines; kaiju
  creative_brief: "Studio Trigger SSSS.Gridman look (2018): tokusatsu-homage giants and kaiju in quiet suburbs, silent pastel towns, power lines, and CG giants with rubber-suit charm. Carry it through Gridman tokusatsu giants, pastel suburbs, power lines, kaiju. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
