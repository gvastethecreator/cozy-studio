visualDna:
  aesthetic: 'David Mazzucchelli page look of the late 1980s: reduced expressive line, flat muted colors on newsprint, grimy city noir, spare storytelling and figures defined by silhouette and gesture.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; reduce the subject to spare expressive line in a grimy, muted-color city at night. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted flat newsprint colors in rust, olive and dirty violet.
  lighting_and_shadow: Grimy streetlight rendered as flat color and black.
  texture_and_material: Printed comic page on off-white paper with slight ink spread and paper tooth.
  camera_and_composition: Spare noir panels with few, telling details, framed the way David Mazzucchelli composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with grim quiet resolve.
  rendering_and_quality: Faithful Mazzucchelli reduced noir page, in the recognizable hand of David Mazzucchelli.
  creative_brief: "David Mazzucchelli page look of the late 1980s: reduced expressive line, flat muted colors on newsprint, grimy city noir, spare storytelling and figures defined by silhouette and gesture. Carry it through Mazzucchelli reduced line, muted noir color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Mazzucchelli reduced line; muted noir color
