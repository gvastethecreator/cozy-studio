visualDna:
  aesthetic: 'Cybernetic hive infrastructure: recursive grids of cube-shell alcoves stacked on service frames, dense conduit bundles and graphite panels, each cell lit phosphor green.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the recursive cube-cell grid and conduit surfaces, and it never bends, loops or breaks the requested structure.
  color_and_tone: Graphite, black and phosphor green with pale steel conduit highlights; monochrome green on dark.
  lighting_and_shadow: Green glow from inside each cell, darkness between them, faint haze giving depth to the grid.
  texture_and_material: Matte graphite panels, braided conduit bundles, cable trays, identical cube cells repeating to infinity.
  camera_and_composition: Keep the requested layout; walls become repeating cell grids receding in deep one-point perspective.
  atmosphere_and_mood: Relentless and mechanical, a place built for processes rather than people.
  rendering_and_quality: Precise hard-surface rendering with exact repetition; no concrete, no dusk sky, no gold.
  key_features: recursive cube-cell alcoves; conduit bundles on service frames; graphite panels; phosphor-green cell glow; deep one-point repetition
  creative_brief: "Cybernetic hive infrastructure: recursive grids of cube-shell alcoves stacked on service frames, dense conduit bundles and graphite panels, each cell lit phosphor green. Carry it through recursive cube-cell alcoves, conduit bundles on service frames, graphite panels, phosphor-green cell glow, deep one-point repetition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
