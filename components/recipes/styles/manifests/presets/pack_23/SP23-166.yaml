visualDna:
  aesthetic: 'Clay-scanned early CGI creature: early nineties computer creatures scanned from sculpted clay maquettes, glossy plasticky shading, low polygon smoothing and simple ray-traced shadows.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject as an early CGI model built from a scanned clay sculpture.
  color_and_tone: Saturated plasticky colors with glossy white highlights, kept consistent across the whole image.
  lighting_and_shadow: Hard ray-traced shadows and simple point lights, kept consistent across the whole image.
  texture_and_material: Smooth faceted surfaces, visible polygon edges and plastic sheen.
  camera_and_composition: Creature posed on a flat plane or simple background.
  atmosphere_and_mood: Keep the requested mood with proud early digital wonder.
  rendering_and_quality: Authentic early CGI look with slight faceting, kept consistent across the whole image.
  creative_brief: "Clay-scanned early CGI creature: early nineties computer creatures scanned from sculpted clay maquettes, glossy plasticky shading, low polygon smoothing and simple ray-traced shadows. Carry it through scanned clay creature, plastic sheen, hard shadows, faceted smoothing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: scanned clay creature; plastic sheen; hard shadows; faceted smoothing
