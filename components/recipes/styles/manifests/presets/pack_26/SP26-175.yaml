  aesthetic: 'Fortiche Production look of the 2010s and 2020s: 3D animated characters with hand-painted textures and brushstroke surfaces, 2D effects and graffiti overlays, stylized painted light and steampunk-industrial cities.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; paint the subject as a 3D character with visible brushstroke textures and hand-drawn 2D effects. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Toxic teal and magenta against warm brass and grime.
  lighting_and_shadow: Painted dramatic rim light and glowing chemical accents.
  texture_and_material: Hand-painted 3D textures with brushstrokes and 2D effect overlays.
  camera_and_composition: Dynamic animated series framing with painted depth, framed the way Fortiche composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with raw painted intensity.
  rendering_and_quality: Faithful Fortiche painted-3D animation frame, in the recognizable hand of Fortiche.
  creative_brief: "Fortiche Production look of the 2010s and 2020s: 3D animated characters with hand-painted textures and brushstroke surfaces, 2D effects and graffiti overlays, stylized painted light and steampunk-industrial cities. Carry it through Fortiche painted 3D, brushstroke textures, 2D FX. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
