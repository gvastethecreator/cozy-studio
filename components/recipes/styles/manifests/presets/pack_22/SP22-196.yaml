visualDna:
  aesthetic: >-
    Continuous planar transitions and tension lines suggest folded-sheet structure while preserving
    the existing silhouette and spatial arrangement.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let fold-like planes follow existing
    geometry without redesigning the subject as origami.
  color_and_tone: >-
    Retain the requested palette and color relationships. Keep fold shadows close to the existing
    surface colors rather than imposing a paper color.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use value changes along planes and creases
    without adding a new light source or arbitrary folds.
  texture_and_material: >-
    Keep surfaces smooth and use crease detail only where the form supports it. Preserve represented
    materials instead of applying paper grain to the whole image.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Fold cues do not fragment the image or
    add floating parts, a page, border, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Folded-plane shading changes how forms are rendered, not what
    the subject is or where it is.
  rendering_and_quality: >-
    Establish the full silhouette and broad planes first, then place restrained crease accents. Keep
    transitions continuous and avoid arbitrary fragmentation.
avoidRules:
  - arbitrary folds, fragments or floating pieces
  - forced paper texture or color
  - unrequested frame, lettering or layout
