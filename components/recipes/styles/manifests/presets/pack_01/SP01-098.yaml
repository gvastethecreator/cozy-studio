visualDna:
  aesthetic: 'Cross-processed slide film: E-6 reversal film developed in C-41 negative chemistry, giving harsh contrast and violently shifted color.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Cyan-green shadows, acid yellow highlights, boosted saturation, skin shifted toward yellow-orange or magenta; whites often blown.
  lighting_and_shadow: Bright sun and high contrast; highlights clip early, shadows go deep cyan-black.
  texture_and_material: Punchy medium grain, crisp edges, flat blown areas in skies and skin highlights.
  camera_and_composition: Keep the requested framing; sunlit subjects and open sky show the color clash most clearly.
  atmosphere_and_mood: Loud and sunburnt, rebellious color clashing in harsh bright sun.
  rendering_and_quality: Chemical color shift in the emulsion, not an Instagram split-tone; no vignette or light leaks unless asked.
  creative_brief: "Cross-processed slide film: E-6 reversal film developed in C-41 negative chemistry, giving harsh contrast and violently shifted color. Carry it through cyan-green shadows, acid yellow highlights, blown whites, boosted saturation, harsh contrast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cyan-green shadows; acid yellow highlights; blown whites; boosted saturation; harsh contrast
