visualDna:
  aesthetic: >-
    OSB Board treats fabrication as visible style language: start from Chipboard, Compressed chips,
    and Random chips, then turn manufacturing process, tooling marks, seams, tolerances, and
    industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Wood chips: preserve identity and pose while letting forms
    carry manufactured seams, tolerances, pressure marks, and finish logic through edge profile,
    surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Tan, Brown as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Rough define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal OSB Board without hiding the prompt subject.
  texture_and_material: >-
    Render Compressed chips through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Random chips as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Industrial, cheap by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Construction, rough material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Chipboard; Wood chips; Compressed chips; Rough; Random chips
  creative_brief: >-
    Route any subject through OSB Board as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Compose the chaotic mosaic of oriented
    strand board where random wood chips and flakes are compressed into a field of tan confetti
    under amber resin, every fragment a different shape locked into accidental harmony. The surface
    should feel rough and industrial, a texture of engineered expedience that wears its construction
    proudly. Capture the accidental beauty of the cheap, structure assembled from forest fragments.
    Use OSB Board as portable surface/render behavior over any input: map its texture, light
    response, edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a
    literal material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
