visualDna:
  aesthetic: 'Precisely inked forms sit in clean planar color, with selective luminous edges and a clear value break attached to forms already in the image.'
  subject_treatment: 'Keep the prompted subject and proportions intact; apply light or edge contrast only to existing forms, without adding another form.'
  color_and_tone: 'Balance grounded midtones with a limited vivid accent; any unusual hue belongs to a prompted element and never replaces explicit colors.'
  lighting_and_shadow: 'Separate flat cel shadows from soft localized light; use a glow only when the source content or prompt supplies a luminous element.'
  texture_and_material: 'Use smooth, controlled fills with a fine line edge and restrained halo where justified; avoid grain that changes the material.'
  camera_and_composition: 'Preserve crop, viewpoint, scale, count, and spacing; express a visual pivot through value and color contrast inside the requested frame.'
  atmosphere_and_mood: 'Follow the requested mood; let contrast affect visual emphasis only, not the emotional reading.'
  rendering_and_quality: 'Keep forms crisp beside a soft light accent when one is requested; add no new graphic event.'
  key_features: 'Precise contour; flat color planes; selective edge luminosity; localized value pivot; restrained effects.'
  creative_brief: 'Contrast stable inked shapes with a small, justified luminous accent. Preserve subject, action, count, camera, and mood; add no narrative event.'
