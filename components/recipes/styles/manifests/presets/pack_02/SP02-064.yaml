visualDna:
  aesthetic: >-
    Neon Noir acts as a transferable cinematic-media router: start from Midnight neon-noir lighting
    style prioritizing reflective chroma bleed, sparse luminance islands, and cinematic cool
    isolation, Bi-chromatic reflections, dark-field contrast architecture, emissive point-source
    rhythm, moisture-driven specular response and portable lighting and atmosphere system built from
    light transport, exposure behavior, optical distortion, volumetric density, reflection, and
    camera response, then apply the media behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Silhouette-first framing, minimal contour clutter,
    negative-space emphasis, edge readability under low-key illumination; preserve the requested
    subject while letting the named light, atmosphere, or optical effect transform silhouette,
    depth, value, and surface response, keeping the requested identity, silhouette, action, object
    function, or setting legible.
  color_and_tone: >-
    Build color with Cyan-magenta bi-chromatic core, electric blue mids, restrained hot-pink
    accents, deep near-black foundations; use color as light temperature, spectral split, water
    attenuation, neon bounce, candle warmth, night conversion, prism dispersion, or atmospheric
    scattering, with deliberate value grouping, accent control, and process-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Localized emissive practicals, controlled bounce pools, specular spill
    choreography, selective halo diffusion; make the named light behavior visible through caustics,
    rim separation, bokeh, flare, strobe pulses, volumetric rays, split contrast, or softbox
    falloff, so exposure and shadow structure support the media process without overwriting the
    requested content.
  texture_and_material: >-
    Render Wet-sheen reflectivity model, micro-surface puddle mirrors, slick asphalt-like gloss
    response, fine rain haze grain; surface detail should reveal particles, lens bloom, refraction,
    mist, glow halos, exposure rolloff, liquid distortion, or optical streaks without hiding prompt
    detail, keeping artifact scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Perspective neutrality with reflective depth doubling and
    compositional pull generated by light gradients; compose around light direction, reflection
    planes, depth layers, exposure zones, silhouette edges, lens distortion, or atmospheric
    perspective without forcing a location, with frame rhythm, spacing, edge hierarchy, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Solitary, tense, nocturnal, melancholic, atmospheric; derive mood from
    illumination physics: intimacy, dread, wonder, glamour, sacred haze, underwater quiet, neon
    danger, or temporal flash energy, letting the media style alter interpretation without demanding
    a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Filmic low-light polish with clean contrast control, moody saturation restraint, and
    high reflection legibility; finish with believable exposure, clean denoise, readable subjects,
    and controlled optical artifacts rather than random glow or crushed darkness, clean denoised
    surfaces where appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    Midnight neon-noir lighting style prioritizing reflective chroma bleed, sparse luminance
    islands, and cinematic cool isolation; Bi-chromatic reflections, dark-field contrast
    architecture, emissive point-source rhythm, moisture-driven specular response; Cyan-magenta
    bi-chromatic core, electric blue mids, restrained hot-pink accents, deep near-black foundations;
    Wet-sheen reflectivity model, micro-surface puddle mirrors, slick asphalt-like gloss response,
    fine rain haze grain; Perspective neutrality with reflective depth doubling and compositional
    pull generated by light gradients
  creative_brief: >-
    Apply Neon Noir as a cinematic-media preset over prompt X: preserve the user's requested
    subject, then route lens behavior, palette, light, signal or film texture, composition, mood,
    and final media craft through Midnight neon-noir lighting style prioritizing reflective chroma
    bleed, sparse luminance islands, and cinematic cool isolation, Bi-chromatic reflections,
    dark-field contrast architecture, emissive point-source rhythm, moisture-driven specular
    response, Wet-sheen reflectivity model, micro-surface puddle mirrors, slick asphalt-like gloss
    response, fine rain haze grain without requiring the card image's original subject.
