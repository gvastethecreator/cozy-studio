visualDna:
  aesthetic: 'Honeycomb pattern: tessellated hexagon cells as a surface motif.'
  subject_treatment: "Apply this motif printed or woven onto the surface of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: tessellated hexagon cells."
  color_and_tone: Gold, amber or monochrome, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Hexagonal cells with raised edges, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Orderly, organic, natural and precise, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: hexagon tessellation
  creative_brief: "Honeycomb pattern: tessellated hexagon cells as a surface motif. Carry it through hexagon tessellation. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
