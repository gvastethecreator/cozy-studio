visualDna:
  aesthetic: 'Masaaki Yuasa animation look: rubbery elastic bodies, reality bending with emotion, flat bold colors and exhilarating long sprints.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Yuasa elasticity, stretchy limbs and simplified faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Flat bold colors and sudden psychedelic shifts, true to the Masaaki Yuasa palette.
  lighting_and_shadow: Flat graphic light, lit the way Masaaki Yuasa lights its scenes.
  texture_and_material: Loose lines and flat color, with the surface finish of Masaaki Yuasa.
  camera_and_composition: Warping sprint compositions, framed the way Masaaki Yuasa composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with exhilarating rubbery freedom.
  rendering_and_quality: Elastic expressive animation frame, in the recognizable hand of Masaaki Yuasa.
  key_features: Masaaki Yuasa elasticity; warping reality; sprints
  creative_brief: "Masaaki Yuasa animation look: rubbery elastic bodies, reality bending with emotion, flat bold colors and exhilarating long sprints. Carry it through Masaaki Yuasa elasticity, warping reality, sprints. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
