visualDna:
  aesthetic: '8-bit home computer multicolor bitmap: double-wide pixels at 160 by 200 from a fixed palette of sixteen muted colors.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Fixed dusty palette of browns, lilac, light blue, olive, pink-grey and mustard; at most three colors plus a shared background per character cell.
  lighting_and_shadow: Light stated by palette steps and horizontal dither; blocky cell-aligned shadows.
  texture_and_material: Pixels twice as wide as tall, color boundaries snapping to 4 by 8 cells, fine horizontal dither patterns.
  camera_and_composition: Keep the requested view; broad shapes that survive the coarse horizontal resolution.
  atmosphere_and_mood: Homely and melancholic, the glow of a bedroom computer.
  rendering_and_quality: Strict wide pixels and cell color limits; no colors outside the fixed sixteen.
  key_features: double-wide pixels; fixed 16 muted colors; 4x8 cell color limit; horizontal dither; bedroom-computer glow
  creative_brief: "8-bit home computer multicolor bitmap: double-wide pixels at 160 by 200 from a fixed palette of sixteen muted colors. Carry it through double-wide pixels, fixed 16 muted colors, 4x8 cell color limit, horizontal dither, bedroom-computer glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
