visualDna:
  aesthetic: >-
    Rhythmic brush contours and contained washes move between dense and open areas, describing motion
    and overlap through line. This is a technique study scoped to the cited medieval Japanese emaki
    corpus, not a request for a handscroll format or continuous story.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, action and pose. Use contour rhythm to clarify
    existing movement and overlapping forms without adding actors, events or changing the action.
  color_and_tone: >-
    Preserve the requested colors and tonal range. Keep washes contained and value transitions legible
    without forcing pale antique paper, gold, flames or a fixed palette.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Brush rhythm can describe form but does not create
    photographic depth of field, a dramatic light source or a new setting.
  texture_and_material: >-
    Keep brush marks and washes local to contours and color areas. Preserve the actual materials in the
    image; do not add scroll-paper texture or aging across the full surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and composition, including vertical or square
    formats. Do not extend the scene into a horizontal handscroll or continuous narrative.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. The historical scope is the cited medieval Japanese emaki
    source; do not infer a Japanese location, samurai, palace, battle or calligraphy from that label.
  rendering_and_quality: >-
    Keep brush contours purposeful, washes contained and empty areas deliberate. Preserve edge clarity
    without photographic blur or broad pigment bleed that obscures the requested subject.
avoidRules:
  - unrequested horizontal handscroll or continuous narrative
  - unrequested Japanese architecture, samurai or battle scene
  - unrequested calligraphy, flames or aged paper
  - photographic depth of field or global blur
