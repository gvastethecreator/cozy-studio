visualDna:
  aesthetic: 'Cosmetic gloss still life: beauty-product advertising built on liquid highlights, creamy textures and translucent color.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Cream, blush, pearl and one translucent accent color; soft luminous whites.
  lighting_and_shadow: Very large soft source for creamy gradients, glossy kicker cards making ribbon highlights on curved surfaces.
  texture_and_material: Smears, swirls and drops of product with gel sheen, pearlescent shimmer or cream peaks; glassy packaging.
  camera_and_composition: Gentle macro, product plus a texture swatch or drop, clean surface with a soft reflection.
  atmosphere_and_mood: Sensorial and smooth, texture you want to touch presented with calm luxury.
  rendering_and_quality: Premium beauty campaign polish; no grit, harsh contrast or clutter.
  key_features: ribbon gloss highlights; product swirls and drops; pearl and blush palette; creamy gradients; soft reflection
  creative_brief: "Cosmetic gloss still life: beauty-product advertising built on liquid highlights, creamy textures and translucent color. Carry it through ribbon gloss highlights, product swirls and drops, pearl and blush palette, creamy gradients, soft reflection. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
