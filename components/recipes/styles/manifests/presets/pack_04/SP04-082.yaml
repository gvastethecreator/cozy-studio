visualDna:
  aesthetic: 'Paintover demonstration: the same frame shown as a raw photobash collage and then as a painted-over concept, side by side.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a split frame, the raw photo collage on one side and the resolved paintover of the identical composition on the other, and that layout replaces the requested framing.
  color_and_tone: Raw half with mismatched photo color and exposure; painted half pulled into one grade and simplified value groups.
  lighting_and_shadow: The raw collage shows conflicting light directions; the paintover resolves them into one dominant key and clean shadows.
  texture_and_material: Hard cut edges and visible stock seams on the raw side; painted strokes knitting fragments together and removing noise on the other.
  camera_and_composition: Identical composition repeated in two halves or three stages across, same horizon and perspective, so the progress reads instantly.
  atmosphere_and_mood: Instructive and satisfying, chaos resolved into intent.
  rendering_and_quality: Process-demonstration finish, the paintover side at concept-final level and the raw side left deliberately crude.
  key_features: split before-and-after frame; raw photo collage with seams; resolved paintover; identical composition; one unifying grade
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Photobash Paintover Iteration as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
