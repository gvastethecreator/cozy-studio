visualDna:
  aesthetic: 'Precision anime cel organized on an invisible modular grid: forms repeat at measured intervals and align to shared horizontals and verticals.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Repeated elements already in the prompt line up at even intervals; never add a map, board, chart or symbols.
  color_and_tone: Indigo, muted gold and small cyan notes over clean neutral greys, with crisp mid-key contrast.
  lighting_and_shadow: Even top light producing identical short shadows under every repeated form, with no implied screen glow.
  texture_and_material: Smooth flat fills and exact hard-edged line breaks, with no painterly texture anywhere.
  camera_and_composition: Keep the requested view; frontal or high orthogonal angles are preferred where alignment and rhythm read clearly.
  atmosphere_and_mood: Orderly and collaborative, many parts moving as one.
  rendering_and_quality: Sparse balanced graphic marks, stable forms and a clear focal priority inside the repetition.
  key_features: invisible modular grid; repeated forms at even intervals; identical short shadows; indigo-gold-cyan palette; hard-edged flats
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Systemic Cooperation Grid Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
