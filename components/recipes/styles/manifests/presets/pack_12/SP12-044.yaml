  lighting_and_shadow: Dramatic theatrical light with sharp black shadows, lit the way Persona 5 2016 lights its levels.
  texture_and_material: Cel shading with halftone, torn paper and graphic shapes.
  camera_and_composition: Dynamic tilted angles through palace interiors, framed the way Persona 5 2016 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with stylish rebellious heist.
  rendering_and_quality: Authentic stylized anime JRPG screen, matching real Persona 5 2016 screenshots.
