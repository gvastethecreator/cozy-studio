visualDna:
  aesthetic: 'Mycelium network: the subject built from branching white fungal threads and nodes.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is woven from branching mycelial threads and glowing nodes."
  color_and_tone: White threads on dark soil or glowing blue-green, used consistently across subject and background.
  lighting_and_shadow: Soft glow at nodes, expressed through the style rather than photographic lighting.
  texture_and_material: Fine branching hyphae and nodes, visible at card size as the signature of the style.
  camera_and_composition: Network fill across the frame, arranged so the subject still reads at card size.
  atmosphere_and_mood: Organic, interconnected, eerie and alive, driven by the construction, color and rhythm.
  rendering_and_quality: Fine detailed finish, with clean, deliberate marks and no accidental noise.
  key_features: branching hyphae; glowing nodes; network
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mycelium Network as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
