  texture_and_material: Flat painterly shapes and soft gradients, with the in-engine surface finish of Firewatch 2016.
  camera_and_composition: First-person view from a lookout, framed the way Firewatch 2016 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with wistful lonely warmth.
  rendering_and_quality: Authentic painterly first-person screen, matching real Firewatch 2016 screenshots.
