visualDna:
  aesthetic:
    Build a tactile late-analog design language from chunky rounded rectangles, cassette-window shapes,
    paired reels, slider rows, and cable loops, with the geometry applied selectively to forms rather than
    requiring a cassette as the subject.
  subject_treatment:
    Preserve the requested subject and action; give unspecified equipment, clothing panels,
    or environmental edges molded analog contours, smoked windows, and a few mechanical controls without adding
    a full control console.
  color_and_tone:
    Favor warm cream, amber, graphite, and restrained teal or blue-green indicators; keep the
    large masses warm and quiet, with small colored signals providing contrast.
  lighting_and_shadow:
    Use broad panel highlights, soft amber lamp glow, and dark window recesses to reveal
    molded depth; keep reflections graphic and localized instead of glossy product photography.
  texture_and_material:
    Contrast matte molded plastic, brushed metal edges, translucent smoked inserts, and
    visible tape-like ribbons; use wear at corners and controls, not a blanket vintage filter.
  camera_and_composition:
    Organize the focal form through nested rounded frames and linked ribbons or cable
    curves; preserve depth and action, and avoid arranging every image as a centered device catalog shot.
  atmosphere_and_mood:
    "Suggest an intimate, repairable analog future: practical, lived-in, and quietly optimistic,
    with the source subject's own emotional tone intact."
  rendering_and_quality:
    Use clean illustrated surfaces, readable control silhouettes, and restrained grain;
    separate large panel geometry from tiny buttons at thumbnail scale.
avoidRules:
  - a required cassette deck or weather station
  - modern glossy touch-screen minimalism
  - dense controls that collapse into noise
