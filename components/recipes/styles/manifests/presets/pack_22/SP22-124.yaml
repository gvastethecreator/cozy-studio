visualDna:
  aesthetic: >-
    Construct a relief-print image from broad positive shapes and incisive negative cuts. Vary the
    carved contour and direct cut marks along the form instead of using conventional soft shading.
  subject_treatment: >-
    Preserve the requested identity, action and proportions. Translate existing details into
    positive and negative shapes without adding symbols, lore or a new subject.
  color_and_tone: >-
    Respect the requested palette and saturation. Organize its colors into distinct printable value
    regions; do not force monochrome or add colors that were not requested.
  lighting_and_shadow: >-
    Follow the requested lighting. Describe its existing shadow with cut shapes and reserved lights
    without imposing darkness or a new source.
  texture_and_material: >-
    Direct cut marks along the local form and keep broad printed areas clear. Do not add a physical
    substrate texture or change the material of the depicted subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and layout. Use cut shapes to clarify the existing
    arrangement without restaging it.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Relief-print vocabulary changes mark-making only; it
    does not determine the scene's genre or lore.
  rendering_and_quality: >-
    Prioritize clear silhouettes, broad value groups and readable negative spaces. Keep cuts
    directional and deliberate, with no photographic halftone or excess microline.
avoidRules:
  - unrequested occult symbols, sigils, or lore
  - cut marks that close important negative spaces
  - unrequested text or lettering
  - unrequested horror or violence
