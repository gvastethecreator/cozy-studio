visualDna:
  aesthetic: 'Improvised cardboard construction: reused shipping boxes cut with a craft knife, folded flaps, packing-tape joints and black marker linework drawn directly on the card.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Kraft brown with darker corrugation edges, shiny clear and brown tape, black marker, one or two poster-paint accents.
  lighting_and_shadow: Soft window daylight from one side, gentle shadows, glare streaks only on the packing tape.
  texture_and_material: Exposed corrugated flutes at every cut edge, crushed corners, wrinkled tape, uneven hand-cut openings.
  camera_and_composition: Keep the requested view on a plain floor or table; the improvised joins stay visible and honest.
  atmosphere_and_mood: Resourceful and cheeky, ambition built from whatever boxes were at hand.
  rendering_and_quality: Natural-light photograph of a real cardboard build; imperfect cuts are part of the charm.
  key_features: reused box cardboard; exposed corrugated flutes; packing-tape joints; marker linework on card; hand-cut openings
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Corrugated Cardboard Improvisation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
