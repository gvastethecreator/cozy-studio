visualDna:
  aesthetic: 'Drypoint: lines scratched directly into a copper or plastic plate with a hard needle, throwing up a ridge of burr that holds extra ink.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Warm black ink on cream paper; lines have soft rich halos of ink, plate tone left in places.
  lighting_and_shadow: Shadows built by clustered scratched lines whose burr blooms into soft velvety darks.
  texture_and_material: Fuzzy, feathered line edges from the burr, sharp thin lines where the burr wore off, scratchy nervous marks, embossed plate mark.
  camera_and_composition: Keep the requested framing; sketchy economical line work with rich dark accents.
  atmosphere_and_mood: Nervous, intimate and raw, a quick scratched thought.
  rendering_and_quality: Velvety burr halos around scratched lines, no acid-even line quality, no flat tone areas.
  key_features: burr-haloed scratched lines; velvety soft darks; nervous scratchy marks; plate tone; embossed plate mark
  creative_brief: "Drypoint: lines scratched directly into a copper or plastic plate with a hard needle, throwing up a ridge of burr that holds extra ink. Carry it through burr-haloed scratched lines, velvety soft darks, nervous scratchy marks, plate tone, embossed plate mark. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
