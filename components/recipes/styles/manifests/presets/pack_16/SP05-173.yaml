visualDna:
  aesthetic: >-
    A dust-warm 90s cel style joins softly painted background planes, simple clean contours and muted
    amber-cool contrast. Its named restraint comes from quiet spacing and low visual force, not a
    pacifist narrative.
  subject_treatment: >-
    Keep the requested identity, gesture and proportions. Use gentle contour emphasis and economical
    interior marks; do not add companions, an airship or a peaceful event.
  color_and_tone: >-
    When color is open, pair dusty amber, muted brown and soft blue-green. Preserve requested hues and
    keep saturation low with a few warm focal notes.
  lighting_and_shadow: >-
    Use broad, soft-edged light transitions and uncomplicated cel shadows. Preserve requested lighting
    and avoid imposing sunset or golden-hour light.
  texture_and_material: >-
    Use softly brushed background paint with clean foreground fills and subtle dust-like grain. Keep
    the grain in the rendering, not on the subject's material.
  camera_and_composition: >-
    Favor open spacing and gentle horizontal rhythm within the existing framing. Preserve viewpoint
    and placement; do not widen the scene or add landscape.
  atmosphere_and_mood: >-
    Let quietness emerge from held gestures, sparse detail and warm-cool balance. Preserve the
    requested action and mood; do not require pacifism or melancholy.
  rendering_and_quality: >-
    Keep edges clean on focal forms and softer in background planes, with restrained detail and no
    motion effects.
  key_features: >-
    softly painted backgrounds; dust-muted amber and blue-green; open spacing with quiet cel contours
  creative_brief: 'Restyle the requested content with low-saturation cel color, gentle background paint and quiet spacing. Preserve its subject, action, setting and framing; add no airship, companion or sunset. Use it as a reusable look on any subject.'
