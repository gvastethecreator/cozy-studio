  color_and_tone: High-contrast black and white or near-mono with flashes of sweaty skin tone and red.
  lighting_and_shadow: Harsh direct flash freezing motion against deep black backgrounds.
  texture_and_material: Sweat, denim, basement brick, low pipes, cables and grainy flash photo texture.
  camera_and_composition: Wide-angle crowd-level shots with bodies mid-air and fists in the frame.
  atmosphere_and_mood: Explosive, cathartic and communal, total energy in a tiny room.
  rendering_and_quality: Grainy high-contrast rendering with frozen motion and deep blacks.
