visualDna:
  aesthetic: 'Silent-film expressionist horror anime: slanted walls, painted shadows, crooked streets and stark black-and-white contrast.'
  subject_treatment: Keep the prompt's subject and setting; distort the architecture around it into slanted, angular shapes with painted shadows.
  color_and_tone: High-contrast black, white and grey with a faint sepia or green tint.
  lighting_and_shadow: Painted hard-edged shadows and light shapes that do not follow real light direction.
  texture_and_material: Flat painted sets, angular doors and streets, and grainy film texture.
  camera_and_composition: Tilted, theatrical frames with sharp diagonals and exaggerated perspective.
  atmosphere_and_mood: Feverish and theatrical, a nightmare built from crooked painted scenery.
  rendering_and_quality: Graphic prestige anime with bold angular design and film grain.
  creative_brief: "Silent-film expressionist horror anime: slanted walls, painted shadows, crooked streets and stark black-and-white contrast. Carry it through slanted sets, painted shadows, stark contrast, film grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
