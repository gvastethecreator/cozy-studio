visualDna:
  aesthetic: 'Twilight architectural exterior: a building photographed at blue hour with every window lit, balancing warm interiors against a deep blue sky.'
  subject_treatment: Keep the prompt subject and setting; show the building whole, with its interior lights on and no added crowds.
  color_and_tone: Deep cobalt sky, warm amber windows, slate and stone in cool mid-tones.
  lighting_and_shadow: Ambient sky as a huge soft source, interior and facade lights as warm points; tripod long exposure.
  texture_and_material: Glassy windows, smooth long-exposure water and sky, crisp masonry.
  camera_and_composition: Tripod, corrected verticals, building centered or on a third, reflection in water or wet stone when present.
  atmosphere_and_mood: Inviting and serene, warmth glowing inside against the cooling dusk.
  rendering_and_quality: Clean long exposure with no noise; not an HDR listing look.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Architectural Twilight Exterior as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: blue-hour sky; every window lit amber; tripod long exposure; corrected verticals; smooth water reflections
