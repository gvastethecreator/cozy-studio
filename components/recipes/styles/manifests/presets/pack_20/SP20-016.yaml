visualDna:
  aesthetic: 'Solvent transfer ghost: a toner photocopy burnished face-down onto paper with solvent, leaving a reversed, patchy and streaked ghost of the image.'
  subject_treatment: Transfer the prompt's subject as a mirrored ghost of a photocopy, keeping its shape recognizable while patches fail to transfer.
  color_and_tone: Faded black or brown toner on off-white paper, with occasional pale color from a color copy.
  lighting_and_shadow: Photographic light survives in broken form, shadows transferred heavier than highlights.
  texture_and_material: Burnishing streaks in one direction, missing patches, solvent haze and paper fiber showing through.
  camera_and_composition: Collage-like placement with rough transfer edges and possibly overlapping transfers.
  atmosphere_and_mood: Fragile, nostalgic and uncanny, like a faded memory rubbed off.
  rendering_and_quality: Authentic patchy transfer with directional streaks, never a clean print.
  creative_brief: "Solvent transfer ghost: a toner photocopy burnished face-down onto paper with solvent, leaving a reversed, patchy and streaked ghost of the image. Carry it through burnishing streaks, missing patches, faded toner, rough edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: burnishing streaks; missing patches; faded toner; rough edges
