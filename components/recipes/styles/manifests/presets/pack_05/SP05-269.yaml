visualDna:
  aesthetic: Layered gray ink-wash illustration where translucent washes stack like smoke over everything except a few crisp negative-space windows that keep chosen contours razor-exact.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Cool graphite, smoke gray and silver; the local prompt hues show only inside the clear windows.
  lighting_and_shadow: Broad soft transitions under the washes, with a few sharply bounded highlight islands on surfaces already catching light.
  texture_and_material: Three to five stacked transparent wash layers with pooled edges and fine graphite dust, never literal smoke.
  camera_and_composition: Keep the requested camera; the clear windows sit on the focal area while the periphery hides behind more wash layers.
  atmosphere_and_mood: Withheld, calculating stillness; the viewer sees only what the artist chooses.
  rendering_and_quality: 'Selective clarity: razor contours inside the windows, veiled forms elsewhere, values still readable throughout.'
  key_features: stacked translucent gray washes; crisp negative-space windows; graphite and silver; pooled wash edges; selective clarity
  creative_brief: "Layered gray ink-wash illustration where translucent washes stack like smoke over everything except a few crisp negative-space windows that keep chosen contours razor-exact. Carry it through stacked translucent gray washes, crisp negative-space windows, graphite and silver, pooled wash edges, selective clarity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
