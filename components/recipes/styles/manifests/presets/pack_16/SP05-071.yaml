visualDna:
  aesthetic: >-
    Warm-liminal cel painting: translucent amber and peach glazes meet cool blue-gray contours
    through long soft transition bands.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Distinguish
    adjacent shapes with a clean silhouette break rather than inventing a connection.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, balance amber, peach, and
    muted blue-gray while keeping explicit object colors intact.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use gentle warm bounce and cool shadow
    only as motivated by existing light; add no lamps or rays.
  texture_and_material: >-
    Apply texture only to materials already present. Keep washes transparent and grain fine;
    texture only existing surfaces, never added decorative detail.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Use existing negative gaps
    and transitions as intervals without adding doorways or borders.
  atmosphere_and_mood: >-
    Preserve specified emotion; liminal spacing and warm light impose no fantasy or reverie.
  rendering_and_quality: >-
    Retain clear silhouette edges across soft gradients and keep highlights sparse and
    source-based.
  key_features: >-
    Amber-peach glaze; blue-gray contour; soft transition bands; open negative intervals.
  creative_brief: "Use amber-peach glaze; blue-gray contour; soft transition bands; open negative intervals. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
