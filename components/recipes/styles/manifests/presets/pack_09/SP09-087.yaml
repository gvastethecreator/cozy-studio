visualDna:
  aesthetic: 'Ash fall coating: fine grey volcanic ash settled over the target, softening edges.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: fine grey ash settles on every upward face, softening edges and filling crevices. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Monochrome grey ash over faint original colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Diffuse hazy light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Fine powdery ash drifts and settled layers, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Silent, eerie, suspended and bleak, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ash Fall Coating as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: grey ash drifts; softened edges; monochrome; surface-level damage; structure intact
