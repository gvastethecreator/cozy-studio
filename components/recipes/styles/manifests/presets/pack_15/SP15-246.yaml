visualDna:
  aesthetic: 'Candlepunk: a world lit only by candles, with dripping wax cities, chandelier forests, candle-maker guilds and faces glowing in warm flickering pools.'
  subject_treatment: Keep the prompt's subject and setting; light it only by candles, with dripping wax and flickering warm pools of light.
  color_and_tone: Warm candle gold and honey amber against deep brown-black shadow.
  lighting_and_shadow: Many small flickering flames creating warm pools and deep soft shadows.
  texture_and_material: Dripping wax, tallow, wicks, iron candelabras, soot and smoke.
  camera_and_composition: Intimate close groupings and vast halls glittering with countless flames.
  atmosphere_and_mood: Warm, fragile and hushed, a world that could go dark with one breath.
  rendering_and_quality: Low-key warm illustration with soft flame glow and wax detail.
  creative_brief: "Candlepunk: a world lit only by candles, with dripping wax cities, chandelier forests, candle-maker guilds and faces glowing in warm flickering pools. Carry it through candle-only light, dripping wax, chandelier halls, flickering pools. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: candle-only light; dripping wax; chandelier halls; flickering pools
