    Data Center Grid acts as a transferable architecture/interior router: modular containment
    panels, perforated steel, cable-routing logic, blue/amber status LEDs, thermal-lane compression;
    fuse it with civic infrastructure grammar with public-use wear, technical service logic,
    institutional material memory, and specialty-space performance; route spatial grammar, material
    behavior, scale, ornament, and light over prompt X without requiring the default sample anchor,
    fixed spatial set, landscape setup, or object sample.
  subject_treatment: >-
    Preserve prompt subject, action, and context while translating any requested subject through
    infrastructure anchors, service junctions, public-scale material wear, modular containment,
    utility grids, and readable built function; treat modular containment panels, perforated steel,
    cable-routing logic, blue/amber status LEDs, thermal-lane compression as massing, edge, surface,
    joinery, threshold, or ornament behavior rather than a mandatory building scene.
  color_and_tone: >-
    Map color through civic neutrals, safety accents, oxidized metal, ceramic or concrete value
    blocks, damp fluorescents, and specialty glow cues; let source cues such as modular containment
    panels, perforated steel, cable-routing logic, blue/amber status LEDs, thermal-lane compression
    decide accent hierarchy, material temperature, and value separation while staying attached to
    the requested content.
  lighting_and_shadow: >-
    Use fluorescent pressure, institutional bounce, service LEDs, humid or aquatic diffusion, buried
    low light, and public-space shadow compression; make light reveal joints, relief, material
    depth, scale, and atmosphere from modular containment panels, perforated steel, cable-routing
    logic, blue/amber status LEDs, thermal-lane compression without replacing prompt X with a stock
    architectural render.
  texture_and_material: >-
    Render tile, steel, concrete, glass, acrylic, brass, paper, bone-mineral substitutes, cables,
    patina, water stains, and public-use abrasion; prioritize the tactile signals in modular
    containment panels, perforated steel, cable-routing logic, blue/amber status LEDs, thermal-lane
    compression, with believable surface response, denoised grain, coherent wear, and no generic
    wallpaper texture.
  camera_and_composition: >-
    Frame through tight infrastructure detail crops, service-grid repetition, compressed public
    thresholds, wayfinding rhythm, and specialty-space section logic; convert modular containment
    panels, perforated steel, cable-routing logic, blue/amber status LEDs, thermal-lane compression
    into reusable perspective, crop, depth, section, modular rhythm, and negative-space rules
    instead of one fixed style sample layout.
  atmosphere_and_mood: >-
    Carry mood through public memory, controlled utility, preservation, overload, reverence, damp
    atmosphere, or quiet abandonment without turning into narrative scene; the preset can support
    adult, strange, sensual, severe, playful, ominous, quiet, or monumental prompts when prompt X
