visualDna:
  aesthetic: >-
    Remake-era psychological-horror art direction as naturalistic concept painting: intimate
    human detail against damp, oppressive ordinary spaces and dense low-visibility atmosphere.
  subject_treatment: >-
    Preserve identity and action; give the subject contemporary skin, hair, cloth, and silhouette
    detail against a more threatening environment without adding a mandatory monster.
  color_and_tone: >-
    Near-monochrome fog gray, blue-green shadow, faded olive, and dirty warm interior light;
    isolated red/amber events interrupt rather than recolor the entire image.
  lighting_and_shadow: >-
    Broad, low-contrast outdoor fog and cold sky contrast with dark rooms and single warm practical
    lamps. Keep wet reflected highlights small and localized.
  texture_and_material: >-
    Damp pavement, worn facades, heavy cloth and touched interior fixtures; selective tactile detail
    and small reflected highlights make decay physical without showroom polish.
  camera_and_composition: >-
    Preserve requested camera and crop. Bring the focal human action close against receding obscured
    depth, using glass, doorways or reflection to separate uncertain layers.
  atmosphere_and_mood: >-
    Heavy, intimate, grief-stricken, and hesitant; silence and distance carry more weight than
    action spectacle.
  rendering_and_quality: >-
    Contemporary naturalistic concept painting with detailed focal forms, broad layered mist and
    controlled damp highlights. Painted edges and atmosphere, distinct from the capture profile and
    the 2001 distressed illustration.
avoidRules:
