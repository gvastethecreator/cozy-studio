visualDna:
  aesthetic: 'Botanical dissection plate: the whole plant in watercolor and fine line, surrounded by dissected flower parts, fruit sections and magnified details.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a botanical plate with the whole plant plus dissected flower, fruit and section studies, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: True botanical color in transparent watercolor on white, greens and petal hues accurate and unsaturated.
  lighting_and_shadow: Soft even light from upper left, shadows only as form modeling, no cast shadows on the paper.
  texture_and_material: Fine sepia outline, layered watercolor glazes, visible leaf venation and hairs on stems.
  camera_and_composition: Main plant specimen tall at the center, small numbered-style details arranged around it without any numbers.
  atmosphere_and_mood: Calm, precise and scholarly, a plant taken apart with care.
  rendering_and_quality: Scientific accuracy in every part, clean white paper, no decorative border or captions.
  creative_brief: "Botanical dissection plate: the whole plant in watercolor and fine line, surrounded by dissected flower parts, fruit sections and magnified details. Carry it through whole specimen plus dissections, flower and fruit sections, magnified details, watercolor over fine line, white ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whole specimen plus dissections; flower and fruit sections; magnified details; watercolor over fine line; white ground
