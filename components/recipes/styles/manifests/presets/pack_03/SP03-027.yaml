visualDna:
  aesthetic: 'Metaballs: the subject built from implicit blobby spheres that merge smoothly where they touch, like liquid clay.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Glossy soft colors or iridescent candy tones, smooth gradients.
  lighting_and_shadow: Soft studio light with broad glossy highlights on the rounded blobs.
  texture_and_material: Perfectly smooth merged surfaces, no seams, bulging joints.
  camera_and_composition: Keep the requested view; the blob construction visible at the joints.
  atmosphere_and_mood: Playful and organic, forms that seem ready to flow apart.
  rendering_and_quality: Clean implicit-surface render without any visible polygon edges or seams.
  key_features: merging blob spheres; seamless joints; glossy smooth surface; soft studio light; liquid forms
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Metaballs as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - brand logo
  - franchise likeness
  - readable text
  - readable letters
  - changing the requested camera view
  - sharp
  - geometric
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
