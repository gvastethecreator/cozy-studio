visualDna:
  aesthetic: >-
    Electricity/Lightning behaves like a controlled elemental effect layer: start from Tesla coil
    arc, Plasma, and Branching, then turn motion, temperature, particles, translucency, refraction,
    glow, and transient energy behavior into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Jagged bolts: preserve identity and pose while letting
    forms emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Blue, White, Purple as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Bright flash define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Electricity/Lightning without hiding the
    prompt subject.
  texture_and_material: >-
    Render Plasma through flow direction, particle density, turbulence, glow falloff, splashes,
    trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Branching as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Shocking, fast by using movement, danger, spectacle, instability, temperature, and
    sensory intensity; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with High energy material clarity: physically coherent reflectance, clean contact detail,
    controlled micro-texture, readable silhouette behavior, and no noisy stock-texture overlay.
  key_features: Tesla coil arc; Jagged bolts; Plasma; Bright flash; Branching
  creative_brief: >-
    Route any subject through Electricity/Lightning as a transferable elemental/FX visual system
    while preserving the prompt's subject, action, and setting. Compose the branching violence of
    electrical discharge where plasma bolts fork through darkness in veins of blue-white-purple
    energy, each tendril a tree of light that grows and dies in the same instantaneous moment. The
    arc should feel fierce and directional, a pathfinding intelligence seeking ground through the
    path of least resistance. Capture the architecture of pure force, energy made visible as
    sculpture. Use Electricity/Lightning as portable surface/render behavior over any input: map its
    texture, light response, edge wear, color chemistry, and tactile rhythm onto the subject instead
    of requiring a literal material sample, macro tile, wall, landscape, source object, or scene
    where the material naturally appears.
