visualDna:
  aesthetic: 'Recognition chart: several related variants of the subject shown as solid black silhouettes in top, front and side view, like a spotter card.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a recognition chart of related types, each shown as black silhouettes in top, front and side views, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Solid black silhouettes on off-white card, thin grey ruled rows, no other color.
  lighting_and_shadow: No light or interior detail; identification rests on silhouette alone.
  texture_and_material: Crisp filled shapes, faint grey rules, slightly worn printed card stock.
  camera_and_composition: Rows of types, each row with its top, front and side view aligned at one scale.
  atmosphere_and_mood: Alert and methodical, knowing a shape before it arrives.
  rendering_and_quality: Exact silhouettes without type names, codes or numbers.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Three-View Recognition Chart as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: black silhouettes; top, front and side per type; ruled rows; one scale; worn card stock
