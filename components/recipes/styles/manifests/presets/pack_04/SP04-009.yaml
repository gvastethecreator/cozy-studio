visualDna:
  aesthetic: '1960s underground comix: nervous dip-pen line with obsessive crosshatching, lumpy rubbery anatomy and every inch of the drawing crammed with detail.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Black ink on white with dense crosshatch midtones; if color appears it is a cheap flat two-tone overlay.
  lighting_and_shadow: Shadow built only from layered hatch webs, deepest where the clutter piles up.
  texture_and_material: Wobbly contour, sweat drops and stink lines, hatch fields on every surface, cheap paper tooth.
  camera_and_composition: Slightly fisheye staging, oversized feet and hands in front, background clutter filling every gap.
  atmosphere_and_mood: Subversive, sweaty and gleefully rude, an anxious joke told loudly.
  rendering_and_quality: Hand-forged anti-polish ink with visible wobble; never clean vector line or smooth color.
  key_features: obsessive crosshatching; nervous dip-pen wobble; rubbery lumpy anatomy; sweat and stink lines; crammed detail
  creative_brief: "1960s underground comix: nervous dip-pen line with obsessive crosshatching, lumpy rubbery anatomy and every inch of the drawing crammed with detail. Carry it through obsessive crosshatching, nervous dip-pen wobble, rubbery lumpy anatomy, sweat and stink lines, crammed detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
