    Flint Engine Tradecraft operates as a portable punk-spectrum router: combine Flint Engine
    Tradecraft identity cues through flint planes; compact engine blocks; leather tool rolls; smoke
    plumes; carved wheels; carved wheel geometry with primitive/stone/salvage punk grammar with
    low-tech engines, carved mechanics, rope kinetics, mud-brick power, bone signal rigs, and
    windcraft reuse, so the preset supplies retrofit style behavior rather than a required venue,
    mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through flint
    planes, basalt massing, rope geometry, carved wheels, rawhide lashings, mud-brick modules,
    sailcloth patches, and hand-built power logic; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through flint gray, clay red, rawhide tan, ochre, tar gray, storm blue, copper green,
    bone white, smoke black, and sea blue; keep dominant, support, and accent values readable, avoid
    muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
    Use firelight blocks, smoky daylight, polished stone glints, water reflections, storm rim, and
    warm clay bounce; lighting should reveal the punk system, preserve the user's subject, separate
    near and distant value planes, and avoid crushed blacks or noisy dark texture.
  texture_and_material: >-
    Render flint facets, basalt blocks, hide, rope, carved wood, mud brick, driftwood, patched
    canvas, copper stains, and smoke-softened edges; keep material scale coherent, surface marks
    motivated, and tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through compact engine rhythm, lash-and-wheel diagonals, windcraft arcs, ritual timing
    channels, and clear subject scale without commerce-system or trade setup lock as reusable
    framing grammar for characters, creatures, objects, vehicles, environments, symbols, or full
    scenes without one required card layout.
  atmosphere_and_mood: >-
    Carry mood through primal invention, tactile tradecraft, stark mobility, ancient precision,
    communal warmth, and rough salvage optimism; the tone may become adult, romantic, violent,
    comic, sensual, eerie, civic, or strange when prompt X asks, while the punk family remains
    legible.
  rendering_and_quality: >-
    Finish with drawn salvage-punk illustration with clean matte surfaces, denoised smoke,
    low-to-moderate detail, and no dusty photoreal survivalism; prioritize clean denoise, bold
    readable shapes, controlled grit, prompt preservation, no watermark, no readable text, and no
    generic concept-art polish.
  key_features: >-
