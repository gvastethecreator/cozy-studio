visualDna:
  aesthetic: 'Typographic Data Fields: numbers, units and labels arranged as aligned typographic blocks with a strict, meaningful hierarchy.'
  subject_treatment: Arrange the prompt's numbers, units and labels as aligned typographic blocks ranked by relevance, every figure, sign and unit exact.
  color_and_tone: High contrast for the main reading, secondary tones for context.
  lighting_and_shadow: Flat typography where prominence comes from size, weight and space.
  texture_and_material: Sober type with distinct numerals and clean separators.
  camera_and_composition: Alignment by decimal or unit with room for long values and signs.
  atmosphere_and_mood: An editorial reading rhythm that stays fully verifiable.
  rendering_and_quality: Crisp numbers with units never split from their values.
  creative_brief: "Typographic Data Fields: numbers, units and labels arranged as aligned typographic blocks with a strict, meaningful hierarchy. Carry it through aligned numbers, units beside values, strict hierarchy, verifiable figures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: aligned numbers; units beside values; strict hierarchy; verifiable figures
avoidRules:
  - added percentages
  - numbers turned into patterns
  - sizes implying undeclared proportions
  - invented values, links or measurements
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
