visualDna:
  aesthetic: 'Flat opaque gouache illustration: chalky matte color applied in even single-layer shapes, with small dry-brush textures inside each shape.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Chalky mid-saturation palette with a lot of white mixed in, muted teal, mustard, brick red and dusty pink; each area a solid unbroken tone.
  lighting_and_shadow: 'Graphic lighting: one flat shadow shape per form, painted as a darker solid tone rather than modeled.'
  texture_and_material: Dead-matte powdery surface, faint streaks where the brush ran dry, slight paper tooth showing through lighter colors.
  camera_and_composition: Keep the requested framing; simplify forms into clean overlapping silhouettes with little interior detail.
  atmosphere_and_mood: Cheerful and tidy, a mid-century picture-book calm.
  rendering_and_quality: Crisp shape edges with small dry-brush speckle, no glossy highlights, no transparent washes, no line art outline.
  key_features: flat chalky opaque shapes; one flat shadow per form; dry-brush streaks; dead-matte surface; muted mid-century palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gouache (Flat) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
