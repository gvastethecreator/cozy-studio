visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Into the Breach gameplay screenshots: compact
    pixel tactics capture with small grid islands, clear enemy intent arrows, mech silhouettes, and
    deterministic puzzle-combat readability. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Into the Breach-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Into the Breach-informed palette: muted teal water, rust mech metal, acid bug green,
    orange danger tiles, grey city blocks, and UI-blue grid markers. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through flat tactical light, explosion flashes, laser lines, shield glows, and
    crisp tile-state highlights. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from tiny pixel buildings, readable mechs, bugs, cracked ground, smoke tiles, and
    compact UI panels. Materials should feel like in-engine game assets captured during play, with
    enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with orthographic grid with 8x8-ish battlefield discipline, attack previews, push
    vectors, and civilian-objective clarity. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Into the Breach-derived mood: cerebral, compact, tense, deterministic, and elegant. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: grid markers, turn UI, unit
    panels, objective pips, and attack previews are central to the style. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Into the Breach gameplay screenshots; compact pixel tactics capture with small grid islands,
    clear enemy intent arrows, mech silhouettes, and deterministic puzzle-combat readability; muted
    teal water, rust mech metal, acid bug green, orange danger tiles, grey city blocks, and UI-blue
    grid markers; flat tactical light, explosion flashes, laser lines, shield glows, and crisp
    tile-state highlights; tiny pixel buildings, readable mechs, bugs, cracked ground, smoke tiles,
    and compact UI panels; orthographic grid with 8x8-ish battlefield discipline, attack previews,
    push vectors, and civilian-objective clarity; cerebral, compact, tense, deterministic, and
    elegant; HUD guidance: grid markers, turn UI, unit panels, objective pips, and attack previews
    are central to the style
  creative_brief: >-
    Use Into the Breach Astral Tactics as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Into the Breach: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
