  - image_edit
  - style_preset_card
tags:
  - 3d-and-cgi-rendering
  - materials
visualDna:
  aesthetic: >-
    Chrome & Metal acts as a transferable CGI-style router: start from Highly reflective surface,
    Reflection, anisotropic highlights and shader-material system built from reflectance,
    refraction, scattering, phase behavior, procedural structure, and physically coherent surface
    response, then apply the 3D/render behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Sharp reflections; preserve the prompt subject while
    wrapping or transforming forms through the material behavior named by the preset, keeping the
    requested identity, silhouette, pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Silver, Gold, Copper, anodized tones; let palette follow absorption,
    dispersion, subsurface tint, metallic reflectance, patina, mineral veining, transparency, or
    fluid coloration, with deliberate value grouping, exposure control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through HDRI environment reflection, specular bounce; make highlights, caustics,
    shadow softness, transmission, internal glow, rim fuzz, photon paths, or specular lobe shape
    explain the material, so value structure supports the renderer and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Polished, mirror grade chrome; surface detail should keep scale-consistent shaders,
    bumps, strands, droplets, veining, casting marks, melt edges, weave, or simulated fluid motion,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for Chrome & Metal: close three quarter or macro
    material framing, strong highlight planes, readable surface curvature, and controlled depth;
    compose to demonstrate material behavior across silhouette, thickness, contact edges, reflection
    zones, and readable material transitions, with scale, spacing, edge rhythm, and visual hierarchy
    doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Sleek, futuristic, precision luxury; derive mood from luxury, fragility, tactile
    attraction, gross elasticity, scientific precision, craft, permanence, or uncanny material
    transformation, letting the renderer alter interpretation without demanding a specific story,
    location, or character.
  rendering_and_quality: >-
    Finish with Automotive finish, showroom gloss; finish with coherent shader response, clean
    denoise, readable forms, and no stock texture overlay pretending to be material simulation,
    clean denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Highly reflective surface; Reflection, anisotropic highlights; Silver, Gold, Copper, anodized
    tones; Polished, mirror grade chrome; Lookdev camera for Chrome & Metal: close three quarter or
    macro material framing, strong highlight planes, readable surface curvature, and controlled
    depth
  creative_brief: >-
    Apply Chrome & Metal as a CGI/render preset over prompt X: preserve the user's requested
    subject, then route modeling, shader response, lighting, material scale, composition, mood, and
    final render craft through Highly reflective surface, Reflection, anisotropic highlights,
    Polished, mirror grade chrome without requiring the card image's original subject.
avoidRules:
  - matte
  - rough
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - readable text
  - signature
  - wrong material
  - pasted stock texture
  - flat color fill
  - shaderless surface
