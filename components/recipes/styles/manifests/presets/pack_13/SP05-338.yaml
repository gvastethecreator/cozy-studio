  creative_brief: "Atsushi Ohkubo manga look as in Fire Force: angular graphic designs, triangle grins, bold ember effects and stylish street-level combustion. Carry it through Ohkubo angular grins, embers, combustion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
