visualDna:
  aesthetic: >-
    Ornate anime ink layers fine engraved contours over broad black and pale cel planes.
  subject_treatment: >-
    Keep pose, garments, proportions; enrich only surfaces already present.
  color_and_tone: >-
    Black, bone, deep scarlet, antique gold, pale blue in distinct value-led blocks.
  lighting_and_shadow: >-
    High-contrast directional light with crisp boundaries; add no dramatic source.
  texture_and_material: >-
    Sparse hatch and polished highlights only where shown material supports them.
  camera_and_composition: >-
    Preserve framing; use opposing diagonals inside existing forms, no forced portrait pose.
  atmosphere_and_mood: >-
    Boldness comes from line contrast, not a court or conflict scene.
  rendering_and_quality: >-
    Legible outer contour, sparse layered ornament, no decorative frame.
  key_features: >-
    Engraved contour, black-bone contrast, scarlet-gold accents, disciplined diagonals
  creative_brief: 'Apply a visual treatment centered on engraved contour, black-bone contrast, scarlet-gold accents, disciplined diagonals. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
