visualDna:
  aesthetic: >-
    Elastic timing: compact stroke clusters release into long tapered arcs, alternating
    compressed and stretched mark intervals.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Elasticity
    lives in line cadence, never in body distortion or invented motion.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use clear cobalt or sky
    blue, fresh green, and small warm ochre or coral accents, subject to explicit color
    instructions.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep natural source light bright and clean
    with crisp shadow edges; add no flare or artificial gleam.
  texture_and_material: >-
    Apply texture only to materials already present. Combine smooth color planes with sparse
    soft brush marks; avoid rubbery shine or deformation texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let existing contours and
    gaps alternate between squeezed and extended intervals without rearrangement.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Maintain the requested emotion; stretch-release is a
    visual beat, not a summer mood.
  rendering_and_quality: >-
    Hold proportions and leading edges stable while varied stroke lengths create the elastic
    rhythm.
  key_features: >-
    Compressed-to-stretched cadence; tapered arcs; bright planes; intact silhouette.
  creative_brief: >-
    Use compressed-to-stretched cadence; tapered arcs; bright planes; intact silhouette. Keep
    the requested subjects, action, setting, palette, framing and mood; add no scene content.
