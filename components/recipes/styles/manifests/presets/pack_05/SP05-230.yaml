visualDna:
  aesthetic: 'Ink-wash megastructure manga plate: ruler-drawn pen lines, vast flat fields of diluted gray wash, dry-brush edges, and highlights scratched out in white.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Charcoal, slate and blue-black wash values with sparse cold white scratch highlights and at most a hint of cyan.
  lighting_and_shadow: Faint cold light from one distant source; most of the plate falls into layered gray wash with hard ruled shadow edges.
  texture_and_material: Granulating ink wash pooling at edges, dry-brush drag on large planes, and fine ruled hatching in the far distance.
  camera_and_composition: Keep the requested view and scale; leave huge empty wash areas and long converging ruled lines around the subject.
  atmosphere_and_mood: Immense silence and scale, a stillness older than anyone inside it.
  rendering_and_quality: Sparse ruled pen line, layered wash values and white scratch highlights, with restrained detail and no glow.
  key_features: ruler-drawn pen lines; vast gray ink-wash fields; dry-brush drag; scratched-out white highlights; long converging ruled lines
  creative_brief: "Ink-wash megastructure manga plate: ruler-drawn pen lines, vast flat fields of diluted gray wash, dry-brush edges, and highlights scratched out in white. Carry it through ruler-drawn pen lines, vast gray ink-wash fields, dry-brush drag, scratched-out white highlights, long converging ruled lines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
