visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine etched contours with occasional acute angular
    turns and ornamental asymmetrical forms broken by compact angular shapes. Let slow interlacing
    curves interrupted by crisp directional marks set its rhythm; use muted jade, chalk, and dark
    wine accents for color and dry ink grain with fine crosshatching in selected shadow areas for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine etched contours with occasional acute
    angular turns for edge work, ornamental asymmetrical forms broken by compact angular shapes
    for form simplification, and slow interlacing curves interrupted by crisp directional marks
    only where movement is already requested.
  color_and_tone: >-
    Build value groups with muted jade, chalk, and dark wine accents. Place the strongest contrast
    on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: low-key shadow fields interrupted by small pale highlights. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with dry ink grain with fine crosshatching in selected shadow areas,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use layered shallow spacing with a clear focal path and
    no prescribed setting to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey ornate restraint with a watchful edge, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with fine etched detail, quiet dark values, and carefully limited accents; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    fine etched contours with occasional acute angular turns; ornamental asymmetrical forms broken
    by compact angular shapes; muted jade, chalk, and dark wine accents; slow interlacing curves
    interrupted by crisp directional marks; dry ink grain with fine crosshatching in selected
    shadow areas; layered shallow spacing with a clear focal path and no prescribed setting.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine etched contours
    with occasional acute angular turns, ornamental asymmetrical forms broken by compact angular
    shapes, and muted jade, chalk, and dark wine accents; use slow interlacing curves interrupted
    by crisp directional marks only where movement is already present, and apply dry ink grain
    with fine crosshatching in selected shadow areas as the drawing finish.
