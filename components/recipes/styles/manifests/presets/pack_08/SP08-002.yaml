visualDna:
  aesthetic: 'Streetwear hype styling: oversized drop-shoulder layers, heavyweight hoodies, statement pieces without printed graphics and coveted sneakers stacked with attitude.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: oversized heavyweight hoodie or boxy jacket, baggy cargo or track pants, chunky statement sneakers, crossbody bag and a beanie or cap worn low.'
  color_and_tone: Washed black, bone, olive and one loud accent such as safety orange or electric blue.
  lighting_and_shadow: Hard urban daylight or flash with strong contrast, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Heavyweight fleece, nylon shells, ripstop cargo and suede-and-mesh sneakers.
  camera_and_composition: Low-angle full figure emphasizing sneakers and oversized silhouette, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Confident, cool, collectible and street-proud, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Crisp, high-contrast street editorial finish, with believable fabric weight, seams and fit detail.
  key_features: oversized drop-shoulder layers; chunky statement sneakers; crossbody bag; washed black with loud accent; low-angle framing
  creative_brief: "Streetwear hype styling: oversized drop-shoulder layers, heavyweight hoodies, statement pieces without printed graphics and coveted sneakers stacked with attitude. Carry it through oversized drop-shoulder layers, chunky statement sneakers, crossbody bag, washed black with loud accent, low-angle framing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
