visualDna:
  aesthetic: >-
    Soft painted cel work with fading contours, delicate speckled texture, and light that spreads
    across broad planes.
  subject_treatment: >-
    Preserve the requested subject and gesture; soften secondary edges while keeping the focal
    silhouette precise.
  color_and_tone: >-
    Muted sage, pale amber, and blue-gray carry gentle contrast; use the requested colors when
    specified.
  lighting_and_shadow: >-
    Wide, soft-edged light and gradual shadow transitions create a quiet sense of distance without
    adding a source.
  texture_and_material: >-
    Fine pigment grain and translucent layers soften surfaces without changing what they are made
    of.
  camera_and_composition: >-
    Keep the requested viewpoint; distribute detail from clear focal forms to quieter, more open
    surroundings.
  atmosphere_and_mood: >-
    Wistful and still, with no imposed grief or backstory.
  rendering_and_quality: >-
    Let contours recede selectively under smooth tonal fades; keep anatomy and object structure
    stable.
  key_features: >-
    Soft horizon-like gradients, faded line edges, fine flecks, and restrained light preserve a
    reflective calm.
  creative_brief: >-
    Give the requested content a time-softened cel finish through fading contours, quiet color, and
    gentle light, without adding memory objects or a fantasy scene.
