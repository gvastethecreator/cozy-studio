visualDna:
  aesthetic: 'Pop-up book photograph: the subject engineered in folded, die-cut cardstock that rises out of the gutter of an open book.'
  subject_treatment: Keep the prompt subject, action and identity; this preset explicitly owns the open-book pop-up construction with folds, tabs and layers rising from the page, and nothing else about the request changes.
  color_and_tone: Printed cardstock colors with kraft and white edges visible at every cut, a few bright accents.
  lighting_and_shadow: Directional light from above the book, casting real shadows from each raised layer onto the page.
  texture_and_material: Matte printed card, crisp folds, v-fold hinges, pull tabs, slightly fuzzy cut edges.
  camera_and_composition: Three-quarter view of the open book on a table, layers stepping back from the spine.
  atmosphere_and_mood: Surprising and delightful, a world unfolding as the page opens.
  rendering_and_quality: Believable paper engineering with real depth; never a flat printed page.
  key_features: die-cut cardstock layers; v-fold hinges and pull tabs; open book gutter; real paper shadows; three-quarter view
  creative_brief: "Pop-up book photograph: the subject engineered in folded, die-cut cardstock that rises out of the gutter of an open book. Carry it through die-cut cardstock layers, v-fold hinges and pull tabs, open book gutter, real paper shadows, three-quarter view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
