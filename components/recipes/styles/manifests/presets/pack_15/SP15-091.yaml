visualDna:
  aesthetic:
    A dry-climate adaptation language shaped by heat management, scarce water, mineral resources,
    wind erosion and deliberate shade; resource logic reaches beyond dune palettes.
  subject_treatment:
    Preserve subject and locks. Restyle open forms with layered shade, water-saving channels,
    dust-ready seals, mineral surfaces and repairable resource systems. When compatible, make at least one
    resource route or dust seal visibly functional on an existing form; preserve the requested layout and do
    not add landscape or survival props unless requested.
  color_and_tone:
    Use sun-bleached mineral values, ochre, clay, salt-white, oxidized copper and deep shade
    flexibly. Respect palette; avoid mandatory orange monochrome.
  lighting_and_shadow:
    Honor stated lighting. Where unspecified, use strong light-to-shade organization for
    heat adaptation, without forcing sunset or a blazing sun.
  texture_and_material:
    Distinguish porous ceramic, woven shade, stone, mineral crust and weathered metal with
    controlled abrasion. Treat salt-crust and kite-industry cues as resource expressions.
  camera_and_composition:
    Preserve view and crop. Use shade bands and resource routes to organize the subject;
    do not require dunes, caravan or settlement.
  atmosphere_and_mood:
    Suggest resilience, ingenuity or exposure through environmental adaptation while following
    requested mood; do not force scarcity or survival drama.
  rendering_and_quality:
    Use broad dry planes, decisive shade silhouettes and sparse mineral grain. Make adaptation
    read at thumbnail scale; avoid cracks, haze and texture-only treatment.
avoidRules:
  - Do not require dunes, caravans, mines, kites, turbines or survival plot.
  - Do not reduce the style to salt crust, dust or an orange filter.
  - Connect resource systems to the design rather than scattering props.
