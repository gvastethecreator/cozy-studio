visualDna:
  aesthetic:
    'Differentiate necropunk by visible function: one connected funerary interface or relic-like
    mechanism on an existing fitting, joint, seam, or control area shows ongoing operation through a
    restrained signal and a small regrowth seam; keep bone secondary so the result does not read as Bonepunk.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; give one compatible existing fitting,
    joint, seam, or control area a visible funerary function. Keep its controls or signal visibly connected
    to the host form; do not add a corpse, grave, new apparatus, or bone-built room.
  color_and_tone:
    Use soot, tarnished metal, dried-earth tones, and a restrained green or ember signal on the active
    mechanism; reserve bone for a small component and retain the scene's other materials.
  lighting_and_shadow:
    Preserve the requested base illumination; confine any glow or ember to the operating interface so the
    mechanism reads without turning the room into a dark laboratory.
  texture_and_material:
    Favor aged metal, worn enamel, binding cord, and a small renewed seam joined to the operating signal;
    if bone is used, keep it as one component, not the dominant material or architecture.
  camera_and_composition:
    Show how the interface connects to and operates on an existing focal form; preserve the requested
    camera and action without adding a separate machine or rebuilding surrounding objects.
  atmosphere_and_mood:
    Carry the uncanny tension of death put to work and matter returning to function, while
    allowing the requested tone to range beyond horror.
  rendering_and_quality:
    Keep one connected control or joint, its operating signal, and its regrowth edge visually distinct;
    communicate death put to work without depending on bone construction, corpses, or extra iconography.
avoidRules:
  - a required corpse, graveyard, or antique telephone
  - decay rendered as uniform grime rather than integrated construction
  - unrequested gore that overwhelms the intended image
  - dominant bone construction, bone-built furniture, or bone architecture that makes the style read as Bonepunk
  - nonfunctional bone ornament without a visible operating funerary interface
