visualDna:
  aesthetic: >-
    Build the graphic anime treatment from sparse crisp outlines that gain weight on emphasis
    beats and simple forms staged against open fields, radial outlines, and graphic fragments. Let
    long restraint followed by a brief, disproportionate punctuation set its rhythm; use mostly
    black and white with muted color and one bright warm accent for color and smooth cel fills and
    clean untouched negative space for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use sparse crisp outlines that gain weight on
    emphasis beats for edge work, simple forms staged against open fields, radial outlines, and
    graphic fragments for form simplification, and long restraint followed by a brief,
    disproportionate punctuation only where movement is already requested.
  color_and_tone: >-
    Build value groups with mostly black and white with muted color and one bright warm accent.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: clean silhouette separation with exaggerated light-dark contrast.
    Keep shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth cel fills and clean untouched negative space, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use a simple focal stage with broad empty areas and
    oversized graphic punctuation to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey dry deadpan humor and gentle absurdity, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with simple legible shapes, precise timing, and minimal background detail; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    sparse crisp outlines that gain weight on emphasis beats; simple forms staged against open
    fields, radial outlines, and graphic fragments; mostly black and white with muted color and
    one bright warm accent; long restraint followed by a brief, disproportionate punctuation;
    smooth cel fills and clean untouched negative space; a simple focal stage with broad empty
    areas and oversized graphic punctuation.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with sparse crisp outlines
    that gain weight on emphasis beats, simple forms staged against open fields, radial outlines,
    and graphic fragments, and mostly black and white with muted color and one bright warm accent;
    use long restraint followed by a brief, disproportionate punctuation only where movement is
    already present, and apply smooth cel fills and clean untouched negative space as the drawing
    finish.
