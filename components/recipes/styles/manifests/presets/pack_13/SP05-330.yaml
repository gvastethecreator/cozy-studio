  - image_edit
  - style_preset_card
tags:
  - anime-character-and-lifestyle
  - anime-style-spectrum
visualDna:
  aesthetic: >-
    Use dry, uneven ink, a compact flat palette, repeated small hatch marks and catalog-like
    spacing; derive pattern only from forms already present.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep colors flat and limited,
    preserving prompt-critical hues and material identity.
  lighting_and_shadow: >-
    Use simple flat values and minimal shadow; do not add theatrical light.
  texture_and_material: >-
    Show slightly irregular ink edges and a few repeated hatches; no labels or fabricated cultural
    ornament.
  camera_and_composition: >-
    Separate existing forms with clear breathing room while preserving layout and count; do not
    create a page or display.
  atmosphere_and_mood: >-
    Deadpan folklore is carried by dry line and repetition, not by assigning a culture or mythology.
  rendering_and_quality: >-
    Apply the mark system without inventing cultural motifs, labels, folk costume, props or a
    catalog page. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Dry uneven ink; compact flats; repeated small hatch; catalog-like spacing; deadpan restraint.
  creative_brief: "Apply this visual treatment to the requested content: Dry uneven ink; compact flats; repeated small hatch; catalog-like spacing; deadpan restraint. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - polished sheen erasing dry-ink irregularity
  - hatch marks obscuring subject contours
  - unrequested cultural motif or label
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-330.webp
attributes:
