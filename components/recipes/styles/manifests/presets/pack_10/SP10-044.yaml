visualDna:
  aesthetic: >-
    Solarpunk becomes a transferable surreal symbolic transformation system: start from Nature and
    tech harmony and Plants everywhere, then route prompt content through impossible logic, dream
    scale, symbolic displacement, liminal staging, and psychic texture without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Art Nouveau curves to bend, displace, fuse,
    haunt, miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene;
    preserve anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Green, Gold, White; use color as emotional unreliability, nostalgic
    drift, uncanny contrast, or symbolic temperature, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Sunlight drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Leaves, glass as the tactile or mark-making basis; surfaces should support the illusion
    with believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to
    figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Plants everywhere as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Optimistic, bright as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Utopian, hopeful: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Nature and tech harmony; Art Nouveau curves; Green, Gold, White; Sunlight; Leaves, glass; Plants
    everywhere; Optimistic, bright; Utopian, hopeful; Plants everywhere
  creative_brief: >-
    Apply solarpunk symbiosis to the input: chlorophyll greens, warm sunlight, visible renewable
    tech, botanical circuitry, and optimistic repair detail should make any subject feel
    ecologically integrated without forcing buildings.
avoidRules:
  - industrial
  - dirty
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
