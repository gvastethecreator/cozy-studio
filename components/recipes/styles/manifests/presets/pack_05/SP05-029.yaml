visualDna:
  aesthetic: >-
    Build the graphic anime treatment from rough, varied contours with torn and overdrawn edges
    and hard collage blocks mixed with wonky, simplified pop shapes. Let discontinuous jumps,
    stutters, and sudden holds set its rhythm; use abrupt complementary color blocks with black
    and small white breaks for color and screen-print halftone, paper-cut edges, and controlled
    registration slip for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use rough, varied contours with torn and overdrawn
    edges for edge work, hard collage blocks mixed with wonky, simplified pop shapes for form
    simplification, and discontinuous jumps, stutters, and sudden holds only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with abrupt complementary color blocks with black and small white breaks.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: flat graphic separations with little modeled volume. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with screen-print halftone, paper-cut edges, and controlled
    registration slip, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use tilted modular panels of varied size with a clear
    central reading path to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey irreverent playfulness and quick shifts in
    emphasis, while preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with rough printed edges, deliberate misalignment, and legible broad shapes; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    rough, varied contours with torn and overdrawn edges; hard collage blocks mixed with wonky,
    simplified pop shapes; abrupt complementary color blocks with black and small white breaks;
    discontinuous jumps, stutters, and sudden holds; screen-print halftone, paper-cut edges, and
    controlled registration slip; tilted modular panels of varied size with a clear central
    reading path.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with rough, varied
    contours with torn and overdrawn edges, hard collage blocks mixed with wonky, simplified pop
    shapes, and abrupt complementary color blocks with black and small white breaks; use
    discontinuous jumps, stutters, and sudden holds only where movement is already present, and
    apply screen-print halftone, paper-cut edges, and controlled registration slip as the drawing
    finish.
