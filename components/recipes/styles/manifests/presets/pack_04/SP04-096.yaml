visualDna:
  aesthetic: 'Upgrade progression sheet: the same weapon or item shown in four or five tiers side by side, growing from crude utility to ornate masterwork.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a row of four or five upgrade tiers of the subject on one baseline, crude on the left and masterwork on the right, and that layout replaces the requested framing.
  color_and_tone: 'Tier-coded palette: raw iron and wood first, then steel, then gilt and enamel, the final tier with one controlled glowing accent.'
  lighting_and_shadow: Identical soft light on every tier, the final tier adding its own restrained inner glow.
  texture_and_material: 'Materials upgrade step by step: rust and splinters, polished steel, engraved gold and set gems.'
  camera_and_composition: Tiers lined up at the same scale and angle with even spacing on a shared baseline.
  atmosphere_and_mood: Rewarding and aspirational, progress readable at a glance.
  rendering_and_quality: Game-asset paint finish with a consistent proportion baseline, so each upgrade reads as evolution.
  key_features: four or five tiers; crude to masterwork progression; tier-coded materials; shared baseline; one glowing final accent
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Weapon Tier Progression as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
