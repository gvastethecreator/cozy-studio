visualDna:
  aesthetic: 'Bleach-drawn colored paper: lines and shapes drawn with bleach on dark dyed paper, lifting the dye into unexpected pale oranges, pinks and creams.'
  subject_treatment: Draw the prompt's subject in bleached lines and lifted patches on dyed paper, keeping its outline and features clear.
  color_and_tone: Deep navy, black or purple paper with bleached marks turning rust orange, pink or pale cream.
  lighting_and_shadow: Light areas are lifted with more bleach; darks stay the original paper dye.
  texture_and_material: Soft bleach bleed edges, brush and nib marks, uneven lifting and slight paper cockling.
  camera_and_composition: Graphic composition with glowing pale lines standing out from the dark sheet.
  atmosphere_and_mood: Mysterious, glowing and unexpected, light pulled from darkness.
  rendering_and_quality: Authentic bleach-lift colors and soft edges, never white paint on dark paper.
  creative_brief: "Bleach-drawn colored paper: lines and shapes drawn with bleach on dark dyed paper, lifting the dye into unexpected pale oranges, pinks and creams. Carry it through bleach lines on dark paper, rust and pink lifted tones, soft bleed, cockled sheet. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bleach lines on dark paper; rust and pink lifted tones; soft bleed; cockled sheet
