visualDna:
  aesthetic: 'Line etching: lines drawn with a needle through an acid-resistant ground on a copper plate, bitten in acid, inked into the grooves and printed under heavy pressure.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Warm brown-black ink on cream paper with a faint grey plate tone left by incomplete wiping; darker lines where the plate was bitten longer.
  lighting_and_shadow: 'Values made by line density and bite depth: open parallel lines in light, deep cross-hatched and re-bitten lines in shadow.'
  texture_and_material: Free, slightly wavering needle lines with blunt ends, lines raised in relief on damp-pressed paper, a sunken plate-mark rectangle around the image.
  camera_and_composition: Keep the requested framing inside the embossed plate mark, with a clean margin of paper around it.
  atmosphere_and_mood: Intimate and inquisitive, the look of an old printed book plate.
  rendering_and_quality: Line-only tone with bitten depth variation, plate tone and embossed plate mark; no solid flat blacks and no halftone dots.
  key_features: needle-drawn bitten lines; varied bite depth; grey plate tone; embossed plate mark; warm black on cream paper
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Etching as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
