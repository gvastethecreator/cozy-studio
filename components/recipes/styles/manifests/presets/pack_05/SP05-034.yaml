visualDna:
  aesthetic: 'Kohei Horikoshi manga and anime look as in My Hero Academia: American-comic crosshatching on faces and muscles, chunky heroic costumes, big expressive eyes and bold primary color on bright cel.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Horikoshi designs, stocky heroic bodies, messy hair, crosshatched cheeks and elbows, and practical hero-suit costumes with bulky boots. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold primary red, cobalt blue and sunny yellow with clean white highlights and warm skin tones.
  lighting_and_shadow: Bright daylight with crisp cel shadows plus heavy crosshatched shading on dramatic close-ups.
  texture_and_material: Visible pen crosshatching over clean digital cel paint, speed lines and dust bursts around impacts.
  camera_and_composition: Heroic low angles, fists thrust at the lens and comic-panel close-ups on determined faces.
  atmosphere_and_mood: Keep the requested mood with earnest heroic determination.
  rendering_and_quality: Energetic shonen television frame mixing American comic hatching with bright anime cel.
  key_features: Horikoshi crosshatching; chunky hero costumes; primary colors; heroic low angles
  creative_brief: "Kohei Horikoshi manga and anime look as in My Hero Academia: American-comic crosshatching on faces and muscles, chunky heroic costumes, big expressive eyes and bold primary color on bright cel. Carry it through Horikoshi crosshatching, chunky hero costumes, primary colors, heroic low angles. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
