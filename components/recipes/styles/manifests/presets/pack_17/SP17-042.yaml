  rendering_and_quality: Clean textile-inspired illustration with simplified forms and controlled fabric texture.
  creative_brief: >-
    Reusable visual system for any subject needing medieval tapestry flatness, woven color blocks,
    courtly legend tone, and quiet uncanny form. Apply after prompt X: prompt X supplies subject,
    action, setting, tone, and intensity, while this preset supplies a style grammar of Tapestry
    Creature Legend; courtly beasts; decorative flora; quiet narrative panels; woven legend logic
    with flat courtly silhouettes; thread block color, mood, material behavior, framing logic, and
    denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster,
    readable text, or sample-card composition.
  key_features: >-
    Tapestry Creature Legend; courtly beasts; decorative flora; quiet narrative panels; woven legend
