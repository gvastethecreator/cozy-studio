visualDna:
  aesthetic: >-
    Use broken pale strokes, powder halos, smudge ghosts and erased traces against a dark slate-like
    value field.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep a limited pale-on-dark
    palette unless the prompt specifies other colors.
  lighting_and_shadow: >-
    Use chalk highlights and soft powder falloff to reveal form; avoid polished specular light.
  texture_and_material: >-
    Show chalk dust, drag, gaps and erasure memory; preserve the underlying material in the drawn
    form.
  camera_and_composition: >-
    Let broken marks and open dark field shape the composition; maintain the requested crop and
    placement.
  atmosphere_and_mood: >-
    Fragile contour and erased traces suggest impermanence without adding a written message.
  rendering_and_quality: >-
    Use chalk mark behavior on any subject; add no letters, formulae, chalkboard or diagram. Keep
    important silhouettes and joins legible; no watermark, unrequested text or interface.
  key_features: >-
    Broken chalk cadence; powder halo; smudge ghost; erasure trace; slate-grain field.
  creative_brief: 'Apply this visual treatment to the requested content: Broken chalk cadence; powder halo; smudge ghost; erasure trace; slate-grain field. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - unbroken contours erasing chalk-stroke breaks
  - glossy highlights hiding powder texture
  - erasure smudges masking essential forms
