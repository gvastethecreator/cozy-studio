visualDna:
  aesthetic: 'Camouflage: disruptive organic blotch pattern for concealment.'
  subject_treatment: "Apply this motif printed or woven onto the surface of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: organic camouflage blotches in 3-4 tones."
  color_and_tone: Woodland greens, desert tans or urban greys, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Printed ripstop or paint, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Military, rugged, hidden and practical, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: camouflage blotches
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Camouflage as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - pattern covering the whole scene instead of the target
  - military insignia
  - bright
  - neon
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
