visualDna:
  aesthetic: >-
    Combine restrained hand-modeled surface variation and short sculptural light transitions with a
    controlled raster finish; keep tactile irregularity deliberate rather than grainy.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Use modeled
    variations to describe existing forms without changing anatomy, silhouette or material identity.
  color_and_tone: >-
    Retain the requested palette and value hierarchy. Keep color coherent across raster clusters and do
    not impose an unrequested narrow palette.
  lighting_and_shadow: >-
    Follow the requested lighting direction and use compact highlights and short shadows to describe
    existing form without adding a light source or melting the geometry.
  texture_and_material: >-
    Use measured irregularity at a consistent scale, translated into a controlled raster. Preserve the
    requested material character rather than turning every subject into clay or ceramic.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing, pose and spatial relationships. Tactile raster
    treatment does not require a game view or a staged display.
  atmosphere_and_mood: >-
    Retain the requested environment and mood; a tactile surface treatment does not add content or
    setting details.
  rendering_and_quality: >-
    Keep raster clusters distinct and surface variations selective. Resolve the silhouette and broad
    values before detail, with no indiscriminate grain or smear.
avoidRules:
  - indiscriminate grain or raster noise
  - unrequested changes to anatomy, silhouette or represented material
  - melted forms or details that alter identity or function
