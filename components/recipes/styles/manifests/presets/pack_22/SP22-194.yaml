visualDna:
  aesthetic: >-
    Fine brush-controlled accents and crisp transitions suggest careful small-scale painting while
    leaving the depicted subject at its requested scale.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Refine only existing features and
    keep the subject's shape and material recognizable.
  color_and_tone: >-
    Retain the requested palette. Use precise value accents within existing colors instead of adding
    miniature-style color coding or metallic details.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep environmental light separate from painted
    accents and do not add a product-lighting setup.
  texture_and_material: >-
    Use matte, small-brush detail only where it supports the existing surface. Do not convert the
    subject into a physical model or apply one material to every part.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Do not shrink or rotate the view, or
    add a base, display, frame, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Fine-scale brushwork changes detail handling, not the scene
    or physical size of the subject.
  rendering_and_quality: >-
    Resolve silhouette and major planes first, then add selective fine accents. Keep details crisp and
    subordinate to the full-size composition.
avoidRules:
  - physical scale change, base, or display arrangement
  - detail patterns that alter identity or material
  - unrequested frame, lettering or layout
