visualDna:
  aesthetic: >-
    Fire & Magma behaves like a controlled elemental effect layer: start from Lava flow, Rock and
    liquid, and Melting rock, then turn motion, temperature, particles, translucency, refraction,
    glow, and transient energy behavior into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Crust cracks: preserve identity and pose while letting
    forms emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Orange, Black, Red as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Emissive glow define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Fire & Magma without hiding the prompt
    subject.
  texture_and_material: >-
    Render Rock and liquid through flow direction, particle density, turbulence, glow falloff,
    splashes, trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores,
    or surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Melting rock as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Dangerous, intense by using movement, danger, spectacle, instability, temperature,
    and sensory intensity; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Volcanic, hot material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Lava flow; Crust cracks; Rock and liquid; Emissive glow; Melting rock
  creative_brief: >-
    Route any subject through Fire & Magma as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Summon the living heat of flowing magma
    where black crust cracks open to reveal rivers of orange incandescence pulsing beneath, a
    material that is its own illumination. The skin should feel like a cooling scab over liquid
    fire, the fissures mapping the flow of creation itself across a surface of elemental birth.
    Capture the terror and beauty of a planet still forming. Use Fire & Magma as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
