visualDna:
  aesthetic: 'Victorian mansion interior: heavy carved mahogany and walnut, dado and picture rails, patterned wallpaper, brocade and velvet layered at high density.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Oxblood, bottle green, plum and deep gold with dark wood; low-key overall, gaslight amber highlights, little clear white.
  lighting_and_shadow: Gaslight and oil lamps with etched glass shades, heavy curtains holding back daylight, warm pools and deep corners.
  texture_and_material: Carved hardwood with French polish, flocked or damask wallpaper, velvet and brocade with fringes, encaustic floor tile, aged brass fittings.
  camera_and_composition: Keep the requested view; dense layered framing from doorway or rail, pattern on every plane, one lamp or window as the light anchor.
  atmosphere_and_mood: Stifling, opulent and secretive behind drawn drapery.
  rendering_and_quality: Warm low-light photograph with legible pattern and carving, controlled shadow, no ghost-story props unless requested.
  key_features: carved mahogany with French polish; damask wallpaper; velvet and brocade layers; gaslight amber pools; encaustic tile floor
  creative_brief: "Victorian mansion interior: heavy carved mahogany and walnut, dado and picture rails, patterned wallpaper, brocade and velvet layered at high density. Carry it through carved mahogany with French polish, damask wallpaper, velvet and brocade layers, gaslight amber pools, encaustic tile floor. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
