visualDna:
  aesthetic: 'Stealth art direction: the world divided into readable lit and unlit zones, cool blue shadow where you hide and warm pools where you are seen.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: Deep blue-violet shadows, warm sodium or lantern pools, very little midtone between them.
  lighting_and_shadow: Hard-edged light pools with clear boundaries, moonlight as cool fill, strong occluder shadows.
  texture_and_material: Rough stone, tiled roofs, wooden shutters and cloth, details visible in light and lost in shadow.
  camera_and_composition: Keep the requested view; when unspecified, an oblique high angle that shows the hiding path and the light to avoid.
  atmosphere_and_mood: Silent and tense, patience measured in footsteps.
  rendering_and_quality: Clean value design where shadow and light zones read at a glance.
  key_features: lit and unlit zones; hard-edged light pools; cool blue shadows; warm lantern light; visible hiding path
  creative_brief: "Stealth art direction: the world divided into readable lit and unlit zones, cool blue shadow where you hide and warm pools where you are seen. Carry it through lit and unlit zones, hard-edged light pools, cool blue shadows, warm lantern light, visible hiding path. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - weapon requirement
  - guard requirement
  - muddy midtones
  - watermark
  - text
  - literal rooftop requirement
  - wrong medium
  - generic AI gloss
  - muddy noise
  - uncontrolled texture chatter
  - readable text
  - signature
  - low resolution
  - readable UI text
  - logo clutter
  - generic screenshot
  - unplayable visual clutter
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
