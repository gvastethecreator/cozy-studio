  lighting_and_shadow: Soft even studio light suggested by careful hatch gradients and bare paper highlights.
  texture_and_material: Fine riso grain, crisp fine line, delicate stipple, light soy-ink sheen, and soft cream paper tooth.
  camera_and_composition: Calm centered study composition with generous margins, a single clearly isolated subject, and small supporting details placed with care.
  atmosphere_and_mood: Gentle, scholarly, earthy, and quietly uncanny.
  rendering_and_quality: Pristine two-color reproduction with fine line clarity, controlled grain, and no grime.
