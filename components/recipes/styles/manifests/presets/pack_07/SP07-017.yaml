visualDna:
  aesthetic: 'Maximalist decor: more is more, with pattern on pattern, gallery-hung frames floor to ceiling, jewel-tone velvet, gilded trim and collected objects on every surface.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Saturated jewel tones — emerald, sapphire, ruby, saffron — on dark lacquered walls, with gold as the binding accent; high saturation, medium-low key.
  lighting_and_shadow: Many warm lamps with fabric shades, picture lights over frames, glints on gilt and lacquer; no single dominant source.
  texture_and_material: Cut velvet, chinoiserie or botanical wallpaper, high-gloss lacquered walls, animal-print and ikat textiles, gilded frames, glazed ceramics.
  camera_and_composition: Keep the requested view; dense frontal framing with a gallery wall behind, pattern layers from foreground to back.
  atmosphere_and_mood: Theatrical, indulgent and joyful, a room that performs.
  rendering_and_quality: 'Rich editorial photograph: every pattern crisp, colors saturated but controlled, no messy clutter pile.'
  key_features: pattern on pattern; floor-to-ceiling gallery wall; jewel-tone velvet; high-gloss lacquered walls; gilded trim
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Maximalist Decor as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
