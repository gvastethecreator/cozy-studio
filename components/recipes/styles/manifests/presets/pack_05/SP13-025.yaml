  aesthetic: 'Ryotaro Makihara sakuga as in his Mob Psycho and Fate action: rough energetic lines, big vertical motion, crackling lightning-like effects and bold stylized smears.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with rough energetic lines, stretched limbs climbing or rising, and clothes whipping upward. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Deep storm blues with bright electric yellow and white effect accents.
  lighting_and_shadow: Crackling lightning-like effect light and storm backlight on climbing figures.
  texture_and_material: Rough energetic lines, crackle effects and stylized smears.
  camera_and_composition: Vertical upward compositions with figures rising toward the top of the frame.
  atmosphere_and_mood: Keep the requested mood with surging upward momentum.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  key_features: Ryotaro Makihara rough energy; vertical motion; crackling effects
  creative_brief: "Ryotaro Makihara sakuga as in his Mob Psycho and Fate action: rough energetic lines, big vertical motion, crackling lightning-like effects and bold stylized smears. Carry it through Ryotaro Makihara rough energy, vertical motion, crackling effects. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
