visualDna:
  aesthetic: "Bioluminescent light: living organisms glowing cyan, green or blue as the scene's only illumination in darkness."
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Electric cyan, aqua and green glows against deep navy and black.
  lighting_and_shadow: Many small cold sources — plankton, fungi, insects, algae — lighting nearby surfaces softly from below or around.
  texture_and_material: Wet surfaces, water, skin and leaves catching speckled glow.
  camera_and_composition: Keep requested framing; make the glowing organisms the visible light sources.
  atmosphere_and_mood: Eerie and magical, cold living sparks floating in a vast quiet darkness.
  rendering_and_quality: Clean long-exposure darkness without noise, the glowing specks crisp and individually visible.
  key_features: living light sources; cyan-green glow; dark surroundings; speckled illumination; wet reflections
  creative_brief: "Bioluminescent light: living organisms glowing cyan, green or blue as the scene's only illumination in darkness. Carry it through living light sources, cyan-green glow, dark surroundings, speckled illumination, wet reflections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
