visualDna:
  aesthetic: 'Ink-wash action painting: calligraphic sumi strokes with fine tapers form contours and motion, bleeding into wet watercolor washes of jewel color over broad cel silhouettes.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Garnet, jade and lapis jewel accents on warm pale paper neutrals, with dark ink.
  lighting_and_shadow: Soft luminous edges and grouped cel shadows; washes glow where paper shows through.
  texture_and_material: Wet-in-wet bleeds, bloom rings at wash edges and dry-brush flicks at stroke ends.
  camera_and_composition: Keep the requested framing; choreographed curves balanced by open paper margins.
  atmosphere_and_mood: Graceful intensity and ceremonial poise, strength expressed as a single flowing brush gesture.
  rendering_and_quality: Broad color washes, controlled ornament and smooth calligraphic edges.
  key_features: calligraphic sumi strokes; wet jewel-color washes; bloom rings; open paper margins; dry-brush flicks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Painterly Blade Fantasy as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
