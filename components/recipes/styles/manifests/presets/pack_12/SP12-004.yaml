visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Skies of Arcadia gameplay screenshots:
    Dreamcast-era skyfaring JRPG capture with bright airships, cloud ocean horizons, chunky low-poly
    fantasy machinery, and adventurous encounter staging. Apply this after prompt X; prompt X
    supplies the subject, action, setting, and intensity while this preset supplies capture
    language, camera grammar, material behavior, playable readability, and finish. Do not recreate
    an exact official level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Skies of Arcadia-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Skies of Arcadia-informed palette: cloud white, sky blue, lacquer red, brass gold, emerald
    hull paint, and saturated heroic primary accents. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through soft blue daylight, cloud bounce, simple specular highlights, engine
    glow, and theatrical battle flashes. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from low-poly ship hulls, painted sails, brass trim, wooden decks, chunky
    character proportions, and clean early-console textures. Materials should feel like in-engine
    game assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person exploration or turn-based battle framing with airship scale, readable
    menus if useful, and optimistic sky depth. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Skies of Arcadia-derived mood: buoyant, swashbuckling, colorful, and classic-console
    adventurous. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: JRPG command windows or battle
    meters are allowed when they feel like era-correct gameplay UI, not pasted text blocks. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Skies of Arcadia gameplay screenshots; Dreamcast-era skyfaring JRPG capture with bright
    airships, cloud ocean horizons, chunky low-poly fantasy machinery, and adventurous encounter
    staging; cloud white, sky blue, lacquer red, brass gold, emerald hull paint, and saturated
    heroic primary accents; soft blue daylight, cloud bounce, simple specular highlights, engine
    glow, and theatrical battle flashes; low-poly ship hulls, painted sails, brass trim, wooden
    decks, chunky character proportions, and clean early-console textures; third-person exploration
    or turn-based battle framing with airship scale, readable menus if useful, and optimistic sky
    depth; buoyant, swashbuckling, colorful, and classic-console adventurous; HUD guidance: JRPG
    command windows or battle meters are allowed when they feel like era-correct gameplay UI, not
    pasted text blocks
  creative_brief: >-
    Use Arcadia Cloudship JRPG as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Skies of Arcadia: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
