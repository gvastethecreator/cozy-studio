visualDna:
  aesthetic: >-
    Build a clean, layered-color rendering with softly drawn contours and restrained surface detail.
    Let color layers read clearly while remaining integrated rather than imitating a specific press.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and scene. Apply layer separation to
    existing forms without adding motifs or changing their function.
  color_and_tone: >-
    Retain the requested palette and color relationships. Organize them as interpreted print-like
    layers without imposing a historical palette, yellowing or fixed hues.
  lighting_and_shadow: >-
    Follow the requested illumination and contrast. Keep value separations coherent with that light
    and do not introduce a new source or scene.
  texture_and_material: >-
    Keep the reproduction surface clean with controlled layer edges. Do not simulate a specific press,
    paper aging or physical damage.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Do not add a card frame, typography,
    logo or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Layered color changes the rendering of existing content,
    not its period, location or story.
  rendering_and_quality: >-
    Resolve silhouette and broad color groups first, then retain only small details that support
    recognition. Keep edges legible without adding marks or lettering.
avoidRules:
  - unrequested registration shifts, print wear or yellowed paper
  - unrequested card frame, logo, serial number or lettering
  - invented details that change identity or function
