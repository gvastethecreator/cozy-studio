  lighting_and_shadow: Hazy golden city light, neon at night, soft painted shadows.
  texture_and_material: Wobbly pen lines, scratchy hatching, extremely dense painted clutter.
  camera_and_composition: Fisheye rooftop views, vertiginous falls, crowded street panoramas.
  atmosphere_and_mood: Keep the requested mood with scrappy mythic tenderness.
  rendering_and_quality: Dense idiosyncratic hand-drawn feature frame packed with crooked city clutter.
  key_features: Taiyo Matsumoto wobbly line; crooked dense city; fisheye rooftops; scratchy textures
  creative_brief: "Taiyo Matsumoto's manga as filmed by Studio 4°C in Tekkonkinkreet: a crooked hand-drawn city of tangled wires, signs and alleys, wobbly lines and lopsided figures leaping between rooftops. Carry it through Taiyo Matsumoto wobbly line, crooked dense city, fisheye rooftops, scratchy textures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
