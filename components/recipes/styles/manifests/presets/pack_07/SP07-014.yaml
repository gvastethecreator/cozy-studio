visualDna:
  aesthetic: 'Cyberpunk apartment: a cramped high-rise unit retrofitted by its tenant, with salvaged panels, surface-run cable bundles, stacked hardware and colored light from signs outside.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Near-black and gunmetal base with magenta and cyan neon spill from outside, amber CRT or LED pockets inside; saturated color only in light, not surfaces.
  lighting_and_shadow: Night; neon from the window as the strongest source, tinted rim light on edges, small warm practicals, deep crushed corners.
  texture_and_material: Scratched powder-coated metal, zip-tied cable looms, water-stained ceiling tiles, reclaimed plastic panels, condensation on glass.
  camera_and_composition: Keep the requested view; tight wide-angle framing that makes the room feel small, layers of cable and hardware framing the subject.
  atmosphere_and_mood: Cramped, electric and lonely under a city that never sleeps.
  rendering_and_quality: 'Cinematic low-light photograph: coloured light kept clean, grime specific, no readable screens or signs.'
  key_features: surface-run cable bundles; salvaged metal panels; magenta and cyan neon spill; amber small practicals; cramped wide-angle frame
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cyberpunk Apartment as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
