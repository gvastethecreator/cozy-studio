visualDna:
  aesthetic: 'Scandinavian-style minimalist chic: few pieces, perfect proportions and quiet surfaces, where cut and fabric quality do all the talking.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: two or three clean-lined pieces — long wool coat, fluid trousers, simple knit — with no visible hardware, prints or accessories beyond one understated object."
  color_and_tone: Oatmeal, bone, stone grey, camel and black; low contrast and no saturated accent.
  lighting_and_shadow: Soft overcast or large window light; long gentle shadows.
  texture_and_material: Boiled wool, heavy cotton, cashmere and matte leather with visible weave.
  camera_and_composition: Calm, spacious composition with plenty of negative space around the figure.
  atmosphere_and_mood: Serene, precise, confident and understated, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Clean, soft-contrast editorial finish, with believable fabric weight, seams and fit detail.
  key_features: few perfect pieces; bone and camel palette; no prints or hardware; soft window light; generous negative space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Minimalist Chic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
