visualDna:
  aesthetic: 'Modular dungeon environment render: corridors and halls assembled from repeating stone wall, arch, pillar and floor kit pieces on a snap grid.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies a dark medieval dungeon assembled from snap-grid stone kit pieces, arches and torch sconces; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Cold grey-green stone in deep shadow, warm amber torch pools, rare accents of rusted iron and faded red cloth.
  lighting_and_shadow: Wall-mounted torches every few modules each throw a warm pool with hard falloff; darkness between them is near black.
  texture_and_material: Trim-sheet stone blocks with beveled edges, damp moss in seams, iron grates, rope and dripping water decals.
  camera_and_composition: Keep the requested camera; kit repetition creates a rhythm of arches receding into darkness.
  atmosphere_and_mood: Oppressive and cold, every archway promising something waiting.
  rendering_and_quality: Game-engine level art with baked GI, light dust in torch beams and visible but tasteful module repetition.
  creative_brief: "Modular dungeon environment render: corridors and halls assembled from repeating stone wall, arch, pillar and floor kit pieces on a snap grid. Carry it through snap-grid stone kit pieces, repeating arches, torch pools with hard falloff, trim-sheet bevels, moss in seams. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: snap-grid stone kit pieces; repeating arches; torch pools with hard falloff; trim-sheet bevels; moss in seams
