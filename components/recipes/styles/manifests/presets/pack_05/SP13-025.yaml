visualDna:
  aesthetic: >-
    Use strong vertical spacing, rising rhythm, and directional force bands to emphasize upward
    motion when it is part of the requested action. Preserve other requested motion directions and
    use white-blue accents only where they fit the existing palette.
  subject_treatment: >-
    Preserve the requested subject identities and count, action, pose, props, wardrobe, setting,
    and tone. Restyle only contour emphasis, gesture rhythm, and edge direction. Do not add, remove,
    replace, or duplicate people, opponents, props, or scene elements.
  color_and_tone: >-
    Preserve the requested palette and emotional temperature. Where compatible, use restrained
    white-blue accents and value separation to clarify vertical layers without recoloring the scene.
  lighting_and_shadow: >-
    Use directional highlights along existing forms to clarify height and motion. Follow the
    requested lighting context; do not introduce lightning, flashes, sparks, or new light sources.
  texture_and_material: >-
    Keep surface detail controlled and attached to existing forms. Use fine vertical motion marks
    only where the requested movement supports them; preserve requested materials and add no dust,
    smoke, sparks, or debris unless requested.
  camera_and_composition: >-
    When the requested camera leaves room for interpretation, use vertical layering, height
    contrast, and open space along the movement path. Emphasize bottom-to-top flow when the action
    rises; keep the requested direction and viewpoint intact otherwise.
  atmosphere_and_mood: >-
    Let the requested tone lead. Create lift through spacing and line direction without imposing
    danger, heroism, electrical force, or a more intense emotion than requested.
  rendering_and_quality: >-
    Use powerful but controlled contours, stable anatomy or object structure, and clear vertical
    separation. Keep accents and motion marks subordinate to the requested subject and action.
  key_features: >-
    Vertical spacing, rising rhythm when appropriate, directional force bands, white-blue accents
    where compatible, and clear preservation of the requested motion.
  creative_brief: >-
    Emphasize upward movement when requested through vertical spacing, force bands, and open headroom.
    Preserve the requested subject, count, props, setting, action, and tone.
