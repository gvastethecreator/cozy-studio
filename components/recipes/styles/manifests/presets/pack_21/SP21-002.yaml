visualDna:
  aesthetic: Wash illustration with selectively reserved dry marks that interrupt translucent pigment layers.
  subject_treatment:
    Keep the requested subject and its proportions. Use reserved marks to clarify important boundaries
    rather than drawing decorative symbols over it.
  color_and_tone:
    Use transparent washes from the requested palette, retaining light support in chosen areas and
    allowing a few intentional overlaps.
  lighting_and_shadow:
    Describe illumination through wash value and untouched support. Keep the brightest reserved
    marks consistent with the focal structure.
  texture_and_material:
    Let wet pigment pool against selected resist boundaries. Alternate smooth wash passages
    with sparse dry marks; do not apply the effect uniformly.
  camera_and_composition:
    Respect requested framing and camera. Use the resist pattern to guide attention within
    the existing arrangement.
  atmosphere_and_mood:
    Follow the user tone through wash density and mark spacing without requiring a dreamy setting
    or childish drawing.
  rendering_and_quality:
    Keep washes transparent, protected lines deliberate and important contours legible. Avoid
    random crayon scribbles.
avoidRules:
  - uniform resist scribble
  - opaque muddy washes
  - unmotivated decorative symbols
