visualDna:
  aesthetic: >-
    A drawing technique, not a copy of any work: razor-edged silhouettes, long graphic slashes,
    dense black cutouts and a flat vermilion/cream/navy poster palette.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use vermilion, cream, navy and
    decisive black masses; preserve prompt-critical colors and keep the palette flat.
  lighting_and_shadow: >-
    Hard, graphic light and shadow carve planes; any glint or highlight follows the prompted
    material.
  texture_and_material: >-
    Favor sharp contour, clean flat fills and selective rough ink edges; no generic metallic gloss.
  camera_and_composition: >-
    Use long diagonals to reinforce the existing direction of action; preserve crop and do not
    impose a racing angle.
  atmosphere_and_mood: >-
    Velocity is conveyed by slashing line and poster contrast; keep still or quiet prompts still
    when requested.
  rendering_and_quality: >-
    Apply graphic edge and palette logic to any subject; add no vehicle, weapon, action pose or
    copied frame. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Razorline silhouette; black cutout pools; vermilion/cream/navy blocks; long slashes;
    poster-value contrast.
  creative_brief: 'Apply this visual treatment to the requested content: Razorline silhouette; black cutout pools; vermilion/cream/navy blocks; long slashes; poster-value contrast. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - slashes misaligned with requested action direction
  - black cutouts erasing subject-defining detail
  - hard color blocks merging adjacent forms
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
