visualDna:
  aesthetic: 'Airbrushed chrome noir illustration: mirror surfaces rendered as hard black-and-white bands with a reflected horizon line, deep black masses, and pinpoint star glints.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Black, pewter, silver and smoke, with tiny magenta or cyan reflections caught in the chrome.
  lighting_and_shadow: Hard single key from above and behind; chrome reads through sharp reflected bands, a horizon line across curved surfaces, and starburst glints.
  texture_and_material: Seamless airbrushed gradients and mirror polish with minimal scuffing, against a background that falls into velvet black.
  camera_and_composition: Keep the requested view; isolate the subject against black with generous negative space and one elegant reflective contour.
  atmosphere_and_mood: Poised, cool and seductive noir elegance, stillness with a knife edge.
  rendering_and_quality: Masked-airbrush smoothness, crisp hard-edged reflection bands and starburst glints; no plastic 3D CG look.
  key_features: airbrushed chrome banding; reflected horizon line; velvet black background; pinpoint starburst glints; tiny magenta and cyan reflections
  creative_brief: "Airbrushed chrome noir illustration: mirror surfaces rendered as hard black-and-white bands with a reflected horizon line, deep black masses, and pinpoint star glints. Carry it through airbrushed chrome banding, reflected horizon line, velvet black background, pinpoint starburst glints, tiny magenta and cyan reflections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
