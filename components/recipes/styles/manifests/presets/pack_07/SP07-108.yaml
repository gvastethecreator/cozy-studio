visualDna:
  aesthetic: 'Naturalistic perennial drift: large sweeps of grasses interwoven with repeated perennials, planted as a self-sustaining matrix and left standing through winter for structure and seedheads.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Straw, bronze and silver grasses with drifts of purple, rust and white flowers; in winter, browns and blacks rimed with frost; soft, textured, harmonious.
  lighting_and_shadow: Low backlight through grass plumes and seedheads, frost glitter in winter, soft shadows in the matrix.
  texture_and_material: Moor grass and switchgrass, coneflowers, sea holly, burnet, ironweed, dried umbels and seed spheres, mown paths cutting through.
  camera_and_composition: Keep the requested view; low among the plants with drifts overlapping in depth, a mown path or single subject in the middle distance.
  atmosphere_and_mood: Wild yet composed, a meadow designed to age beautifully.
  rendering_and_quality: Natural-light photograph with specific seedhead structure and backlit plumes, no bedding annuals or bare mulch.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Naturalistic Perennial Drift as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: grass matrix with repeated perennial drifts; seedheads left for winter; backlit plumes; mown path through; bronze and purple palette
