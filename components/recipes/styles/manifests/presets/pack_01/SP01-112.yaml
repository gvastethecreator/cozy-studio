visualDna:
  aesthetic: 'High-ISO night reportage: handheld at ISO 6400–12800 with no flash, using only the practical light of fires, lamps and windows.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Warm practicals against deep blue-black, slightly muddy saturation, color noise in the shadows.
  lighting_and_shadow: Small pools of practical light, faces lit from one side, large areas of near-black.
  texture_and_material: Visible luminance and color noise, slight motion softness in hands, glowing embers or flames.
  camera_and_composition: Wide aperture shallow focus, 35 mm handheld, subject turned toward the light source.
  atmosphere_and_mood: Hushed and nocturnal, work carrying on while the rest of the world sleeps.
  rendering_and_quality: Honest digital high-ISO noise and soft focus falloff; no flash, no noise reduction smear.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies High-ISO Night Reportage as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: no flash; practical light pools; high-ISO noise; shallow handheld focus; deep blue-black shadows
