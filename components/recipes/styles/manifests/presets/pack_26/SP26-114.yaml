visualDna:
  aesthetic: 'Mati Klarwein visionary cover painting look of around 1970: hyper-detailed surreal oil painting, mirrored symmetric bodies and landscapes, African and cosmic imagery and lush saturated color.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; paint the subject as hyper-detailed surreal symmetric visionary oil imagery. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Lush saturated jungle green, sky blue and flesh gold.
  lighting_and_shadow: Glowing visionary painted light, lit the way Mati Klarwein lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Symmetric wraparound painted composition, framed the way Mati Klarwein composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with lush visionary spirituality.
  rendering_and_quality: Faithful visionary painted album cover, in the recognizable hand of Mati Klarwein.
  creative_brief: "Mati Klarwein visionary cover painting look of around 1970: hyper-detailed surreal oil painting, mirrored symmetric bodies and landscapes, African and cosmic imagery and lush saturated color. Carry it through Klarwein visionary oil, symmetry, lush surreal. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Klarwein visionary oil; symmetry; lush surreal
