visualDna:
  aesthetic: >-
    Lowbrow (Pop Surrealism) becomes a transferable surreal symbolic transformation system: start
    from Cartoonish fine art, Cute but dark, and Big eyes, then route prompt content through
    impossible logic, dream scale, symbolic displacement, liminal staging, and psychic texture
    without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Smooth painting to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Vibrant, candy; use color as emotional unreliability, nostalgic drift,
    uncanny contrast, or symbolic temperature, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Soft drive the light response: shape light through impossible shadows, memory haze, stage
    stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Acrylic as the tactile or mark-making basis; surfaces should support the illusion with
    believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Big eyes as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Playful, creepy as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Juxtapoz, weird: finish with deliberate weirdness, controlled realism, and no generic
    fantasy scene lock, preserving prompt X as the base content and the preset as the style router.
  key_features: >-
    Cartoonish fine art; Smooth painting; Vibrant, candy; Soft; Acrylic; Big eyes; Playful, creepy;
    Juxtapoz, weird; Cute but dark
  creative_brief: >-
    Route any subject through Lowbrow (Pop Surrealism) as a transferable surreal or dream-logic
    visual system: preserve prompt intent while converting scale, causality, symbolism, edge
    behavior, mood, and spatial contradiction through this preset. Apply lowbrow pop-surrealism over
    the input with candy-vibrant acrylic smoothness, cartoon exaggeration, cute-dark tension,
    big-eye motifs only when characters or icons exist, and polished weirdness that sits between toy
    shelf and gallery wall. Keep the subject flexible; make it playful, creepy, and self-aware
    without forcing a mascot.
avoidRules:
  - serious
  - fine art
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
