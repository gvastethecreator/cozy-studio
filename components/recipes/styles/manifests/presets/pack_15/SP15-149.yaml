  aesthetic: 'Serverpunk: people living inside colossal data centers, among humming rack canyons, cooling fog, cable rivers and blinking status lights.'
  subject_treatment: Keep the prompt's subject and setting; place it among server racks, cable trays and cooling fog, with blinking lights as the environment.
  color_and_tone: Cold steel grey and deep blue with thousands of tiny green, amber and blue status lights.
  lighting_and_shadow: Blinking rack lights in darkness, cold aisle blue and warm aisle amber.
  texture_and_material: Perforated steel racks, cable trays, raised floor tiles and condensation fog.
  camera_and_composition: Endless aisle perspectives and tall vertical canyons of racks rising into darkness.
  atmosphere_and_mood: Humming and cold, a hidden world that never sleeps while everyone else does.
  rendering_and_quality: Precise illustration with deep perspective and countless small lights.
