visualDna:
  aesthetic: >-
    Wood Grain becomes a transferable material surface transformation system: start from Tree rings,
    Directional grain, and Knots, then route prompt content through physical surface grain,
    reflectance, damage, joinery, pores, seams, and tactile structure without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Flowing lines to coat, wrap, weather, polish,
    crack, scale, link, or embed forms while preserving the prompt composition; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Brown, Tan; let color follow material depth, veins, patina, oxidation,
    fiber direction, shimmer, or manufactured finish, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Varnish gloss drive the light response: show reflectance honestly through gloss, matte
    falloff, iridescence, metallic shear, or micro-shadow, avoiding generic glamour lighting unless
    the prompt explicitly asks for it.
  texture_and_material: >-
    Render Wood as the tactile or mark-making basis; surface behavior needs coherent grain, chips,
    cracks, pores, links, flakes, scales, strands, or inclusions, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Knots as reusable spatial grammar: support macro texture studies and full-scene
    use through directional grain, repeat, drape, fracture, or patch rhythm, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Rustic, solid as the emotional register; derive mood from durability, luxury, decay,
    tactility, craft, armor, novelty, or contamination, without flattening strong, strange, darker,
    or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Natural, warm: finish with material clarity, controlled micro-detail, and no stock
    texture pasted over forms, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Tree rings; Flowing lines; Brown, Tan; Varnish gloss; Wood; Knots; Rustic, solid; Natural, warm;
    Directional grain
  creative_brief: >-
    Apply wood-grain structure to the input: growth rings, warm cellulose striations, knots,
    directional fibers, and varnished or raw grain shifts should make forms feel grown and carved
    without requiring trees.
avoidRules:
  - metal
  - stone
  - wrong material
  - generic stock texture
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
