visualDna:
  aesthetic: 'Woodworm rot: wood riddled with tiny boreholes and soft dry-rot cracking.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the wooden target is riddled with small boreholes and cubic dry-rot cracks. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Grey-brown wood with dark holes and pale dust, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft side light showing holes, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Boreholes, frass dust and cubic rot cracks, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Decrepit, old, fragile and eerie, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Woodworm rot: wood riddled with tiny boreholes and soft dry-rot cracking. Carry it through woodworm boreholes, cubic dry rot, frass dust, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: woodworm boreholes; cubic dry rot; frass dust; surface-level damage; structure intact
