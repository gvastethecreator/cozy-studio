visualDna:
  aesthetic: 'Half-Drop Repeat Layout: one module repeated with every other column dropped by half its height, the edges matching exactly.'
  subject_treatment: Repeat the prompt's pattern module with alternate columns dropped by half, keeping the module's content and orientation exactly the same.
  color_and_tone: Palette inherited from the module with no recolor between instances.
  lighting_and_shadow: Any light baked into the module kept, no shadows between tiles.
  texture_and_material: The same artwork in every instance, never redrawn per tile.
  camera_and_composition: Alternate columns offset by 50 percent with checkable edge matches.
  atmosphere_and_mood: A diagonal cadence born purely from the offset.
  rendering_and_quality: Exact placements and no blurry interpolation in the mosaic.
  creative_brief: "Half-Drop Repeat Layout: one module repeated with every other column dropped by half its height, the edges matching exactly. Carry it through half-drop offset, exact module, matching edges, diagonal cadence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: half-drop offset; exact module; matching edges; diagonal cadence
