visualDna:
  aesthetic: "Paper-negative pinhole print: a box camera with a pinhole exposing photographic paper, contact-printed into a positive with the paper negative's texture."
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Warm sepia or neutral grey, soft low contrast, dark corners.
  lighting_and_shadow: Long daylight exposure; moving things ghosted or missing.
  texture_and_material: Paper fiber pattern printed through, uniform softness, curved-plane stretching.
  camera_and_composition: Keep the requested framing; wide stretched edges from a curved paper plane.
  atmosphere_and_mood: Quiet and handmade, a slow image from a box and a needle hole.
  rendering_and_quality: Contact-printed paper-negative look; distinct from the modern long-exposure pinhole in pack_01.
  key_features: paper-negative fiber texture; uniform pinhole softness; curved-plane stretch; dark corners; ghosted motion
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pinhole Camera as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
