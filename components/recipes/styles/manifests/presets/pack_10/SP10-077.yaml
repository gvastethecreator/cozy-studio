visualDna:
  aesthetic: 'Chalkboard art: chalk drawing on a slate board with smudges and hand-drawn diagram marks.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is chalk-drawn with arrows, circles and underlines on slate."
  color_and_tone: White and pastel chalk on dark slate, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Chalk strokes and smudges, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Educational, handmade, charming and nostalgic, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  key_features: chalk strokes; slate; smudges; illustrative only
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chalkboard Art as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - readable labels or numbers
  - scannable or functional code
  - claims of accurate measurement
  - pen
  - ink
  - random text labels
  - unreadable diagram clutter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
