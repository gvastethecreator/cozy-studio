visualDna:
  aesthetic: 'Small-Multiple Field Notes: equal panels repeat framing, scale and variables, each with one short note on what changed.'
  subject_treatment: Repeat the prompt's subject in equal panels with the same framing, scale and axes, adding one short note per panel; keep every value exact.
  color_and_tone: One shared palette with accents reserved for the same phenomenon in every panel.
  lighting_and_shadow: Identical light for compared objects and flat charts left unshaded.
  texture_and_material: The same edge and texture treatment on every sample.
  camera_and_composition: A regular grid with aligned titles, one visible common scale and one legend.
  atmosphere_and_mood: Calm comparative cadence, repetition making the changes easy to spot.
  rendering_and_quality: Crisp sheet with aligned axes and no panel enlarged for emphasis.
  creative_brief: "Small-Multiple Field Notes: equal panels repeat framing, scale and variables, each with one short note on what changed. Carry it through equal panels, common scale, one note per panel, single legend. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal panels; common scale; one note per panel; single legend
