visualDna:
  aesthetic: 'Horror manga drawn with obsessive fine lines: thousands of parallel pen strokes accumulate into dread, and ordinary surfaces slowly turn into spirals, holes or patterns.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Black and white only, with suffocating fields of dense hatching and a few stark unhatched faces.
  lighting_and_shadow: Flat, sourceless dread light; darkness is built by line density, and voids stay pitch black.
  texture_and_material: Micro-line hatching, spiral and concentric motifs creeping over skin, wood and cloth, clean white faces left untouched.
  camera_and_composition: Calm, symmetrical staging that makes the one wrong element unbearable; slow reveal of the anomaly in the center.
  atmosphere_and_mood: Claustrophobic, uncanny and quietly escalating toward horror.
  rendering_and_quality: Precise fine-pen draftsmanship with realistic faces and relentless line density; no gore splash, no cute shapes.
  key_features: obsessive fine-line hatching; creeping spiral patterns; realistic unhatched faces; symmetrical calm staging; pitch-black voids
  creative_brief: "Horror manga drawn with obsessive fine lines: thousands of parallel pen strokes accumulate into dread, and ordinary surfaces slowly turn into spirals, holes or patterns. Carry it through obsessive fine-line hatching, creeping spiral patterns, realistic unhatched faces, symmetrical calm staging, pitch-black voids. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
