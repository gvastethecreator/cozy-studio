visualDna:
  aesthetic: >-
    Build local highlights and form with dry, broken scumbles over the image's existing deeper
    values. Let the brushed light emerge from pigment on the surface.
  subject_treatment: >-
    Preserve the requested identity, structure and material. Follow each existing surface with
    scumbled marks without changing its shape.
  color_and_tone: >-
    Respect the requested palette and value range. Place brighter pigment locally where the described
    light supports it.
  lighting_and_shadow: >-
    Follow the requested light sources, direction and intensity. Keep brighter scumbles local to
    those lit areas and preserve the original shadow pattern.
  texture_and_material: >-
    Use directional dry-brush layers with the underlying paint visible between marks. Keep the
    scumble texture on the image surface without replacing the depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and arrangement. Keep the brighter brushwork within
    the forms and regions already present in the composition.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Brushwork changes the rendering, not the story or
    tone.
  rendering_and_quality: >-
    Keep luminous marks local and edges shaped by brushwork while preserving the silhouette.
avoidRules:
  - turning a solid subject into a ghost
  - digital halo or continuous outer glow
  - highlights unrelated to the requested light
  - unrequested horror or violence
