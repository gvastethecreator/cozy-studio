visualDna:
  aesthetic: >-
    Velvet Fabric makes hand-feel and pressure visible across the image: start from Luxury cloth,
    Fuzzy, and Soft drape, then turn touch, softness, pile, fiber density, nap direction,
    compression, and hand-feel into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Soft folds: preserve identity and pose while letting forms
    compress, fuzz, soften, catch fibers, and show tactile pressure through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Deep Red or Blue as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Rim light sheen define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Velvet Fabric without hiding the prompt
    subject.
  texture_and_material: >-
    Render Fuzzy through fiber structure, tactile depth, soft occlusion, fuzz, pile direction, and
    pressure marks; keep grain scale, residue, buildup, fractures, fiber, pores, or surface tension
    coherent across the whole image.
  camera_and_composition: >-
    Compose around Soft drape as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Rich, soft by using physical touch, comfort, irritation, warmth, dryness, and
    surface softness; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Royal, theater material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Luxury cloth; Soft folds; Fuzzy; Rim light sheen; Soft drape
  creative_brief: >-
    Route any subject through Velvet Fabric as a transferable tactile-surface visual system while
    preserving the prompt's subject, action, and setting. Summon the deep luxury of velvet where
    piled fibers catch light at the crest of each soft fold, creating a landscape of deep shadows
    and rich highlights that shift with the angle of view. The surface should feel like visual
    touch, a textile that drinks light and returns it as color deepened by surrounding darkness.
    Render the sensuality of fabric that seems to breathe. Use Velvet Fabric as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
