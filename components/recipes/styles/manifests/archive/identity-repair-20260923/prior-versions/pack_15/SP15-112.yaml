visualDna:
  aesthetic: >-
    Shape pointed silhouettes and lace-like curves from deep dark masses, punctuated by narrow red and
    cool highlights.
  subject_treatment: >-
    Preserve the requested content; translate contours into pointed edges, fine looping linework, and
    controlled value cuts without requiring a vampire figure.
  color_and_tone: >-
    Favor deep, muted shadows with restrained oxblood or red accents and small cool metallic glints; keep
    midtones open.
  lighting_and_shadow: Use thin cool edge light and a few saturated highlights against grouped, readable shadows.
  texture_and_material: >-
    Contrast velvet-matte blocks, glasslike gloss, and fine interlaced lines without covering forms in
    noise.
  camera_and_composition: >-
    Preserve the requested crop and focal hierarchy; use repeated vertical points and open dark intervals
    as rhythm.
  atmosphere_and_mood: Create nocturnal romantic severity through restraint, pointed rhythm, and selective contrast.
  rendering_and_quality: Keep dark forms separated, linework fine but visible, and glints small enough to preserve silhouette.
avoidRules:
  - uniform black fill that merges adjacent forms
  - ornamental lines that obscure the main silhouette
  - blood, fangs, or vampire imagery unless requested
