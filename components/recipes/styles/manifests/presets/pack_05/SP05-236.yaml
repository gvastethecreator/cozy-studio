visualDna:
  aesthetic: >-
    Compact, blunt industrial drawing with dense silhouette masses, short functional seam lines,
    mud-rust wear, and pragmatic low-saturation color.
  subject_treatment: >-
    Keep the requested subject’s identity and proportions. Make its existing forms read with
    blunt contour weight and compact shadows; do not add chassis or armor.
  color_and_tone: >-
    Use iron gray, dark olive, earth brown, and oxidized orange, with small pale highlights and
    little saturation.
  lighting_and_shadow: >-
    Group forms into firm, close-set cel shadows with minimal rim light; let wear and structure
    read without dramatic effects.
  texture_and_material: >-
    Preserve each material while adding compressed scuffs, rubbed edges, and restrained mud-like
    marks only where appropriate.
  camera_and_composition: >-
    Honor the requested crop and scale. Keep detail dense near the existing focal form and avoid
    enlarging or compressing the subject.
  atmosphere_and_mood: >-
    Convey practical endurance with close value grouping, muted color, and minimal flourish.
  rendering_and_quality: >-
    Use sturdy contours, compact shadow planes, subtle surface wear, and clear separation
    despite dense detail.
  key_features: >-
    Blunt compact contours; dense shadow groups; mud-rust wear; low-saturation utility palette.
  creative_brief: >-
    Preserve the requested subject and scale. Apply blunt contour weight, close-set shadows, and
    muted worn color; add no chassis, armor, or survival equipment.
