visualDna:
  aesthetic: 'Kunihiko Ikuhara direction look as in Mawaru Penguindrum and Yurikuma: flat pictogram icons, repeated symbolic stock shots, theatrical allegory and bold graphic signage.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with stylized elegant designs and pictogram-like symbolic figures. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold flat pink, red, black and white, true to the Kunihiko Ikuhara palette.
  lighting_and_shadow: Theatrical flat lighting, lit the way Kunihiko Ikuhara lights its scenes.
  texture_and_material: Flat graphic pictograms and clean cel, with the surface finish of Kunihiko Ikuhara.
  camera_and_composition: Symmetrical symbolic compositions, framed the way Kunihiko Ikuhara composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with ritual allegorical theater.
  rendering_and_quality: Graphic allegorical animation frame, in the recognizable hand of Kunihiko Ikuhara.
  key_features: Ikuhara pictograms; allegory; symbolic repetition
  creative_brief: "Kunihiko Ikuhara direction look as in Mawaru Penguindrum and Yurikuma: flat pictogram icons, repeated symbolic stock shots, theatrical allegory and bold graphic signage. Carry it through Ikuhara pictograms, allegory, symbolic repetition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
