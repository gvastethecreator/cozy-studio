visualDna:
  aesthetic: 'Hand-painted texture CGI: chunky stylized 3D forms whose lighting, highlights and occlusion are painted straight into the color texture and rendered almost unlit.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; rebuild it with chunky stylized proportions of large hands, feet and shoulders (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: Warm saturated painted palette, highlights painted as pale warm strokes and shadows as cool purple washes in the texture.
  lighting_and_shadow: Mostly flat, unlit shading where the painted texture carries form, with only a soft ambient and a faint rim.
  texture_and_material: Visible brush strokes on armor, cloth and skin, painted edge highlights on every bevel, no specular or normal maps.
  camera_and_composition: Keep the requested view; a slightly high three-quarter angle suits the chunky silhouette.
  atmosphere_and_mood: Warm and adventurous, the friendly heft of an old online fantasy world.
  rendering_and_quality: Diffuse-only painted look on low-poly silhouettes, with no photoreal shading or glossy reflections.
  creative_brief: "Hand-painted texture CGI: chunky stylized 3D forms whose lighting, highlights and occlusion are painted straight into the color texture and rendered almost unlit. Carry it through painted-in highlights and shadows, chunky proportions, visible brush strokes in textures, diffuse-only shading, bright edge highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: painted-in highlights and shadows; chunky proportions; visible brush strokes in textures; diffuse-only shading; bright edge highlights
avoidRules:
  - forced T-pose
