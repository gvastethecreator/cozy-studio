  color_and_tone: Near-monochrome grey-blue and black with pale skin tones and faint teal glows.
  lighting_and_shadow: Dim cold light, stark shadows and glowing android eyes.
  texture_and_material: Moody digital cel with gothic architecture and fog.
  camera_and_composition: Gothic architectural wide shots and eerie close-ups on pale faces.
  atmosphere_and_mood: Keep the requested mood with cold existential dread.
  rendering_and_quality: Moody near-monochrome Manglobe television frame with gothic fog.
  key_features: Ergo Proxy cyber-goth; monochrome grey-blue; domed city; androids
  creative_brief: "Manglobe Ergo Proxy look (2006): dark cyber-goth domed cities, grey-blue monochrome palettes, gothic architecture, AutoReiv androids and existential dread. Carry it through Ergo Proxy cyber-goth, monochrome grey-blue, domed city, androids. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
