visualDna:
  aesthetic: 'Mediterranean villa interior: thick lime-rendered masonry walls, rounded arches and deep window reveals, terracotta floors and handmade glazed tile, wrought iron.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Sun-warm lime white, terracotta, ochre and olive, with cobalt or majolica tile accents; bright but softened by bounce off the walls.
  lighting_and_shadow: Strong sun through small deep openings and louvered shutters, slatted light bars on the floor, cool shaded interiors with warm reflected bounce.
  texture_and_material: Hand-applied lime plaster with soft undulation, worn terracotta tiles, glazed hand-painted tile, chestnut beams and cane ceilings, matte wrought iron.
  camera_and_composition: Keep the requested view; frame through an arch or deep reveal, bright opening against cool shade, thick wall depth visible.
  atmosphere_and_mood: Unhurried, sunlit and cool within, a thick-walled refuge from heat.
  rendering_and_quality: Natural-light photograph with softly rounded plaster edges and honest wear, no postcard resort styling.
  key_features: thick lime-rendered walls; rounded arches and deep reveals; worn terracotta floor; majolica tile accent; slatted shutter light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mediterranean Villa as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
