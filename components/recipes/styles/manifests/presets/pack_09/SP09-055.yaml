visualDna:
  aesthetic: >-
    Crystal/Gemstone translates natural material behavior into form: start from Raw amethyst,
    Geometric growth, and Sharp points, then turn natural formation, growth, erosion, and geological
    or biological irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Facets: preserve identity and pose while letting forms
    grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Purple, White base as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Internal reflection define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Crystal/Gemstone without hiding the prompt
    subject.
  texture_and_material: >-
    Render Geometric growth through organic variation, non-repeating edge wear, local pores, growth
    marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Sharp points as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Mystical, valuable by using age, weather, habitat pressure, and sensory
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Precious, magic material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Raw amethyst; Facets; Geometric growth; Internal reflection; Sharp points
  creative_brief: >-
    Route any subject through Crystal/Gemstone as a transferable natural-material visual system
    while preserving the prompt's subject, action, and setting. Apply raw amethyst growth as
    crystalline structure over the input: purple facets, white mineral base, pointed terminations,
    internal reflections, and lattice corridors of light. If gem, cave, magic, tech, or ornament
    exists, amplify it; otherwise let crystal clusters grow from edges and planes without requiring
    a literal gemstone display.
avoidRules:
