name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for core asset smoke
        run: bunx playwright install --with-deps chromium

      - name: Release validation
        run: bun run validate:release

  portability-windows:
    name: Windows portability smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migration fixture
        run: bun run apps/local-server/src/dbMigrationFixture.ts

      - name: Studio init (isolated storage)
        env:
          STUDIO_LIBRARY_DIR: ${{ runner.temp }}/studio-library
          STUDIO_IMAGES_DIR: ${{ runner.temp }}/studio-images
        run: bun run studio:init

      - name: Local API health smoke
        run: bun run portability:smoke

  portability-macos:
    name: macOS portability smoke
    runs-on: macos-latest
    # Runs on pushes to main, not on pull requests. docs/PLATFORMS.md requires this per-OS smoke.
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migration fixture
        run: bun run apps/local-server/src/dbMigrationFixture.ts

      - name: Studio init (isolated home)
        run: |
          export HOME="${RUNNER_TEMP}/studio-home"
          export TEMP="${RUNNER_TEMP}/studio-temp"
          mkdir -p "$HOME" "$TEMP"
          bun run studio:init

      - name: Local API health smoke
        run: bun run portability:smoke

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
