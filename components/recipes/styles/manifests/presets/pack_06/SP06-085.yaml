visualDna:
  aesthetic: 'Visual novel screen: a waist-up cel-shaded character sprite standing over a softly blurred painted background, with an empty translucent dialogue box.'
  subject_treatment: 'Keep the prompt subject and action recognizable; this preset owns the visual-novel screen layout: a waist-up sprite over a softened background and an empty text box across the bottom, and adds no score, health bar, logo or readable interface text.'
  color_and_tone: Clean cel color on the sprite with two-tone shadows; background slightly desaturated and warm or cool by time of day.
  lighting_and_shadow: Soft ambient light on the sprite with a thin rim light matching the background; no cast shadow on the backdrop.
  texture_and_material: Crisp anti-aliased lineart on the sprite, painterly or photo-based background with gentle blur, frosted empty text panel.
  camera_and_composition: Static frontal screen; the sprite stands centered or at one third, the empty box covers the bottom quarter.
  atmosphere_and_mood: Intimate and still, a pause before someone speaks.
  rendering_and_quality: Sharp sprite against soft backdrop; the dialogue box stays blank with no names or words.
  key_features: waist-up cel sprite; blurred painted backdrop; empty translucent text box; rim light; static frontal screen
  creative_brief: "Visual novel screen: a waist-up cel-shaded character sprite standing over a softly blurred painted background, with an empty translucent dialogue box. Carry it through waist-up cel sprite, blurred painted backdrop, empty translucent text box, rim light, static frontal screen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
