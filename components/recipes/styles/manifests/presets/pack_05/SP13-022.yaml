visualDna:
  aesthetic: 'Norio Matsumoto sakuga as in his fight scenes: loose rough flowing lines, bodies drawn with elastic weight, swooping camera turns and scenes that feel painted in motion rather than posed.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with loose expressive lines that stretch and bend with motion, hair and clothes streaming in fluid rough strokes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted naturalistic palette with sudden bright accents where motion peaks, kept loose and painterly.
  lighting_and_shadow: Soft natural light that shifts as the camera swoops, with rough painted shadow shapes.
  texture_and_material: Loose rough pencil-like lines, painterly smears and minimal cleanup that keeps the drawing alive.
  camera_and_composition: Steep vertigo angles, swooping camera rotations and figures seen from dizzying heights.
  atmosphere_and_mood: Keep the requested mood with dizzying fluid motion.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  key_features: Norio Matsumoto loose line; swooping camera; elastic bodies; vertigo
  creative_brief: "Norio Matsumoto sakuga as in his fight scenes: loose rough flowing lines, bodies drawn with elastic weight, swooping camera turns and scenes that feel painted in motion rather than posed. Carry it through Norio Matsumoto loose line, swooping camera, elastic bodies, vertigo. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
