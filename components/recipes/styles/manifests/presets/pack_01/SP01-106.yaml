visualDna:
  aesthetic: 'Slow-shutter drag: a quarter to one second exposure where one still subject stays sharp while everything moving streaks around it.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Natural color; moving areas blend into soft ribbons of mixed hue.
  lighting_and_shadow: Dim daylight, dusk or interior light that allows a long shutter without blowing out.
  texture_and_material: Ghosted walkers, smeared cloaks, streaked wheels and birds; the still subject crisp in texture.
  camera_and_composition: Tripod or braced camera; still subject centered or on a third, motion flowing past on both sides.
  atmosphere_and_mood: Calm inside rush, a single point of stillness while the world streams past.
  rendering_and_quality: Optical motion blur with a genuinely sharp anchor, not a digital radial blur.
  creative_brief: "Slow-shutter drag: a quarter to one second exposure where one still subject stays sharp while everything moving streaks around it. Carry it through one sharp still subject, streaked moving crowd, quarter-second exposure, ghosted figures, stillness versus flow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one sharp still subject; streaked moving crowd; quarter-second exposure; ghosted figures; stillness versus flow
