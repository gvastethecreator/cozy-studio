visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Rollerdrome gameplay screenshots: comic-shaded
    arena shooter capture with roller-skate trick lines, clean concrete arenas, stunt trajectories,
    and readable enemy targets. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Rollerdrome-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Rollerdrome-informed palette: cream concrete, black ink outlines, orange jumpsuit, red
    danger marks, teal shadows, and poster-flat sky colors. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through flat graphic daylight, rimmed outlines, explosion bursts, and stylized
    target highlights. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from cel-shaded ramps, arena rails, impact smoke, graphic blood, simple crowds,
    and crisp inked edges. Materials should feel like in-engine game assets captured during play,
    with enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person action-sport framing with trick arcs, enemy spacing, ammo pickups, and
    readable arena loops. The frame should read as a plausible gameplay capture; include UI/HUD only
    when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Rollerdrome-derived mood: stylish, dangerous, sporty, satirical, and kinetic. The preset
    can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but
    it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: score, combo, ammo, slow-mo,
    and enemy indicators are coherent here; keep them graphic and compact. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Rollerdrome gameplay screenshots; comic-shaded arena shooter capture with roller-skate trick
    lines, clean concrete arenas, stunt trajectories, and readable enemy targets; cream concrete,
    black ink outlines, orange jumpsuit, red danger marks, teal shadows, and poster-flat sky colors;
    flat graphic daylight, rimmed outlines, explosion bursts, and stylized target highlights;
    cel-shaded ramps, arena rails, impact smoke, graphic blood, simple crowds, and crisp inked
    edges; third-person action-sport framing with trick arcs, enemy spacing, ammo pickups, and
    readable arena loops; stylish, dangerous, sporty, satirical, and kinetic; HUD guidance: score,
    combo, ammo, slow-mo, and enemy indicators are coherent here; keep them graphic and compact
  creative_brief: >-
    Use Rollerdrome Arena Trick Combat as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Rollerdrome: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
