visualDna:
  aesthetic: 'Color-Coded Function Modules: modules told apart by shape and color make their function and swap-ability visible at a glance.'
  subject_treatment: Split the prompt's product into modules by function, each recognizable by shape, joint and color together.
  color_and_tone: A palette by role backed by structural contrast.
  lighting_and_shadow: One neutral common light shared by every module.
  texture_and_material: Coherent materials across pieces and connectors of visible scale.
  camera_and_composition: Accessible modules, clear connections and one dominant main mass.
  atmosphere_and_mood: System clarity and understandable modularity, grown-up and friendly.
  rendering_and_quality: Clean concept render where every module still reads in monochrome.
  creative_brief: "Color-Coded Function Modules: modules told apart by shape and color make their function and swap-ability visible at a glance. Carry it through function modules, shape and color coding, visible connectors, one main mass. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: function modules; shape and color coding; visible connectors; one main mass
