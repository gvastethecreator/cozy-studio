visualDna:
  aesthetic: 'Diapered ground miniature: figures set against backgrounds of tiny repeating checkers, lozenges and gold dots, a gothic device that replaces sky with jewel-like pattern.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; place the subject in front of a flat repeating diaper-pattern background instead of a real setting.
  color_and_tone: Checkered vermilion, blue and gold backgrounds with bright figure colors.
  lighting_and_shadow: Soft modeling on figures, none on the flat patterned ground.
  texture_and_material: Tiny painted lozenges, gold dots and fine white linework.
  camera_and_composition: Figures on a narrow ground strip in front of the pattern wall.
  atmosphere_and_mood: Keep the requested mood with jewel-box theatricality, kept consistent across the whole image.
  rendering_and_quality: Crisp regular pattern with neatly painted figures, kept consistent across the whole image.
  creative_brief: "Diapered ground miniature: figures set against backgrounds of tiny repeating checkers, lozenges and gold dots, a gothic device that replaces sky with jewel-like pattern. Carry it through checkered backgrounds, gold dots, lozenge pattern, ground strip. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: checkered backgrounds; gold dots; lozenge pattern; ground strip
