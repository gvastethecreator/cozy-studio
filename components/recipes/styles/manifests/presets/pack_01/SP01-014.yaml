visualDna:
  aesthetic: 'Cinestill 800T: tungsten-balanced motion-picture stock with its anti-halation layer removed, so every bright light blooms with a red-orange halo.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Cool teal and cyan shadows from the tungsten balance, warm amber practicals, and saturated red-orange halation rings; daylight turns bluish.
  lighting_and_shadow: Night and interior practicals — lamps, lanterns, bulbs, fire — as point sources; halation glows around each one and around bright edges.
  texture_and_material: Medium, visible grain from the fast emulsion; soft glow on glossy surfaces near lights.
  camera_and_composition: Keep the requested framing; include at least one practical light so its red halo shows.
  atmosphere_and_mood: Nocturnal and melancholic, warm halos glowing against cool empty shadow.
  rendering_and_quality: 'Motion-picture negative look: soft rolloff, halation in-camera rather than painted glow, no digital bloom filter.'
  key_features: red-orange halation halos; tungsten teal shadows; amber practicals; fast-film grain; night cinema stock
  creative_brief: "Cinestill 800T: tungsten-balanced motion-picture stock with its anti-halation layer removed, so every bright light blooms with a red-orange halo. Carry it through red-orange halation halos, tungsten teal shadows, amber practicals, fast-film grain, night cinema stock. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
