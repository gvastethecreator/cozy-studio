visualDna:
  aesthetic: 'In-camera double exposure: two images superimposed on the same film, with the darker areas of one revealing the other.'
  subject_treatment: Keep the prompt subject as the primary image and blend a second image that belongs to the prompt inside its dark areas, without inventing unrelated scenery.
  color_and_tone: Soft, low-contrast blend; highlights of one image washing out the other.
  lighting_and_shadow: The first image lit so its silhouette or shadows leave room for the second.
  texture_and_material: Translucent overlaps, soft edges where the two images meet.
  camera_and_composition: A clear primary silhouette with the secondary image fitted inside it.
  atmosphere_and_mood: Dreamlike and memory-laden, two moments sharing one frame.
  rendering_and_quality: Optical superimposition look; not a hard digital cutout.
  key_features: two superimposed images; second image inside the dark areas; soft translucent blend; primary silhouette; dreamlike
  creative_brief: "In-camera double exposure: two images superimposed on the same film, with the darker areas of one revealing the other. Carry it through two superimposed images, second image inside the dark areas, soft translucent blend, primary silhouette, dreamlike. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
