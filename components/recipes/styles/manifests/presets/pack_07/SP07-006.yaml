visualDna:
  aesthetic: 'Brutalist architecture: cast-in-place concrete left raw, showing board-formed plank grain and tie holes, heavy cantilevered upper masses and deep-set repetitive window bays.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Mineral greys from warm oatmeal to cold blue-grey, rain streaks darkening vertical faces; almost no applied color, contrast carried by shadow.
  lighting_and_shadow: Raking side light that pulls out plank texture, deep black shadow under cantilevers and inside window reveals, overcast light for heaviness.
  texture_and_material: Board-marked concrete with timber grain printed in it, bush-hammered ribbed panels, regular formwork tie holes, water staining and lichen at drips.
  camera_and_composition: Keep the requested view; low angle to stress weight, strong horizontal overhangs, repetitive bays running out of frame, people small at the base.
  atmosphere_and_mood: Monumental, severe and honest, weight made visible.
  rendering_and_quality: Architectural photograph with crisp plank grain and sharp shadow edges, straight verticals, no smooth plaster or glossy cladding.
  key_features: board-formed concrete with plank grain; formwork tie holes; heavy cantilevered masses; deep-set repetitive window bays; rain-streaked grey faces
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Brutalist Architecture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
