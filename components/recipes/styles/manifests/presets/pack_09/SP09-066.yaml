visualDna:
  aesthetic: >-
    Sand (Beach) translates natural material behavior into form: start from Wet compacted sand,
    Grainy, and Compaction marks, then turn natural formation, growth, erosion, and geological or
    biological irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Ripples: preserve identity and pose while letting forms
    grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Beige as the material palette, with controlled value separation, local color variation, and
    hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Sunlight define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Sand (Beach) without hiding the prompt subject.
  texture_and_material: >-
    Render Grainy through organic variation, non-repeating edge wear, local pores, growth marks, and
    natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Compaction marks as reusable material rhythm: macro-friendly for texture tasks,
    but able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Relaxing, warm by using age, weather, habitat pressure, and sensory association;
    the material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Wet, granular material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Wet compacted sand; Ripples; Grainy; Sunlight; Compaction marks
  creative_brief: >-
    Route any subject through Sand (Beach) as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Apply wet compacted sand as granular
    surface logic: beige ripples, dense water-darkened grain, tiny crystalline sparkle, shallow
    compaction marks, and sunlight caught in miniature ridges. If beach, shore, footprint, or
    terrain exists, reinforce it; otherwise transform planes and bases into damp sand texture
    without requiring vacation scenery.
