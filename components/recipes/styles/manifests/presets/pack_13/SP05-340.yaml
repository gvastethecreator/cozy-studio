visualDna:
  aesthetic: >-
    Use fine tapered contours, delicate line-weight changes and restrained soft shadow to create
    refined tension; do not apply lash or facial detail to non-facial forms.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: choose muted, rich color and
    controlled contrast; honor requested colors without defaulting to monochrome.
  lighting_and_shadow: >-
    Keep light soft and local, with a crisp accent only at existing focal edges.
  texture_and_material: >-
    Use smooth fine ink and soft tonal transitions; avoid plush texture that obscures the underlying
    material.
  camera_and_composition: >-
    Guide attention with elegant taper and quiet spacing while preserving the original crop and
    layout.
  atmosphere_and_mood: >-
    Refinement is carried by control and line rhythm; follow the prompted mood and avoid forced
    sensuality.
  rendering_and_quality: >-
    Transfer the contour method to any form without adding eyelashes, eyes, makeup, pose or persona.
    Keep important silhouettes and joins legible; no watermark, unrequested text or interface.
  key_features: >-
    Tapered contour; delicate line weight; restrained shadow; muted richness; quiet refined tension.
  creative_brief: >-
    Apply this visual treatment to the requested content: Tapered contour; delicate line weight;
    restrained shadow; muted richness; quiet refined tension. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - thick contours obscuring delicate taper
  - highlights flattening line-weight variation
  - tangled marks obscuring source form
