visualDna:
  aesthetic: 'Pixel diorama: flat pixel-art sprites and pixel textures placed inside a real 3D miniature set, lit with modern bloom and tilt-shift depth of field.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a high tilted camera over a miniature 3D diorama in which characters stay flat pixel sprites, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Warm storybook palette with saturated pixel textures, glowing warm point lights and cool ambient shadows.
  lighting_and_shadow: Real-time point lights, soft bloom around lamps and fires, sprites casting soft 3D shadows onto the set.
  texture_and_material: Chunky pixel textures on 3D blocks, flat billboarded character sprites, particle dust and water shimmer.
  camera_and_composition: High oblique camera over a floating chunk of the world, strong tilt-shift blur at the top and bottom of frame.
  atmosphere_and_mood: Nostalgic and wondrous, a remembered childhood game rebuilt as a toy set.
  rendering_and_quality: Crisp pixel sprites against depth-blurred 3D surroundings; no pixel scaling blur on the sprites.
  key_features: pixel sprites in 3D diorama; tilt-shift blur; bloom point lights; pixel textures on blocks; floating world chunk
  creative_brief: "Pixel diorama: flat pixel-art sprites and pixel textures placed inside a real 3D miniature set, lit with modern bloom and tilt-shift depth of field. Carry it through pixel sprites in 3D diorama, tilt-shift blur, bloom point lights, pixel textures on blocks, floating world chunk. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - flat 2D tile map
  - motion blur
  - inconsistent proportions
  - changing costume
  - background scene
  - literal town requirement
  - npc crowd requirement
  - watermark
  - text
  - wrong medium
  - generic AI gloss
  - muddy noise
  - uncontrolled texture chatter
  - readable text
  - signature
  - readable UI text
  - logo clutter
  - generic screenshot
  - unplayable visual clutter
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
