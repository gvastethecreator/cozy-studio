visualDna:
  aesthetic: >-
    Serpent Kami Oath Path acts as a transferable mythic-noir router: sworn obligation made clearly
    expressed as dark symbolic order, serpent translated into dark symbolic behavior plus kami
    translated into dark symbolic behavior fused with kami and yokai myth-noir with boundary seals,
    wet ink, foxfire glow, paper-lantern hush, and legalistic supernatural bargains; it carries
    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    coiling line logic and renewal-through-danger contour plus oath-bound contour and
    promise-weighted silhouette pressure; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through sealing-wax red, black vow shadow, and pale witness marks, serpent-weighted
    accent roles over disciplined dark values plus kami-weighted accent roles over disciplined dark
    values together with ink black, foxfire blue, wet vermilion, lantern cream, snow white, cypress
    green, moon silver, and rain-dark indigo; values stay separated, accents feel intentional, and
    the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use narrow witness glints and solemn rim separation, serpent-weighted rim behavior, occult glow,
    and charged shadow plus kami-weighted rim behavior, occult glow, and charged shadow with paper
    lantern bloom, rain reflections, dawn hush, foxfire edges, snow-diffused glow, and narrow
    supernatural rim light; shadows must carry omen weight, rims should clarify form, and glow
    should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render scale sheen, black mineral, and sinuous edge highlights plus wax, cord, old paper, rubbed
    metal, and pressure marks alongside washi paper, wet ink, lacquer, sealed cord, rain gloss, snow
    powder, scale shimmer, bell metal, and carved wood grain; surface scale, patina, residue, gloss,
    grain, and carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with looping curves and oath-path movement, oath-line diagonals and binding intervals plus
    path-like diagonals and chosen-route emphasis plus asymmetric seal placement, crossing lines,
    boundary panels, kagura motion arcs, vow-path rhythm, and quiet negative space; the style should
    support portraits, objects, architecture, creatures, symbols, and full scenes through reusable
    spatial grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through sworn obligation and irreversible consequence plus obligation moving through
    uncertainty and uncanny politeness, whispered threat, old bargain logic, purification silence,
    weather command, and ambiguous mercy; the image can become severe, sensual, sacred, violent,
    quiet, or strange when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with clean vow-sign readability with severe dark editorial polish plus serpent
    recognition with denoised dark editorial polish and controlled material truth and refined
    illustrated finish with clean ink edges, denoised darks, readable glow, and no chibi or
    slapstick drift; prioritize clean denoise, readable dark values, strong silhouette hierarchy,
    tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    sworn obligation made clearly expressed as dark symbolic order, serpent translated into dark
    symbolic behavior plus kami translated into dark symbolic behavior; coiling line logic and
    renewal-through-danger contour plus oath-bound contour and promise-weighted silhouette pressure;
    scale sheen, black mineral, and sinuous edge highlights plus wax, cord, old paper, rubbed metal,
    and pressure marks; narrow witness glints and solemn rim separation, serpent-weighted rim
    behavior, occult glow, and charged shadow plus kami-weighted rim behavior, occult glow, and
    charged shadow; looping curves and oath-path movement, oath-line diagonals and binding intervals
    plus path-like diagonals and chosen-route emphasis
  creative_brief: >-
    Apply Serpent Kami Oath Path after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies sworn obligation
    made clearly expressed as dark symbolic order, serpent translated into dark symbolic behavior
    plus kami translated into dark symbolic behavior, coiling line logic and renewal-through-danger
    contour plus oath-bound contour and promise-weighted silhouette pressure, sealing-wax red, black
    vow shadow, and pale witness marks, serpent-weighted accent roles over disciplined dark values
    plus kami-weighted accent roles over disciplined dark values, narrow witness glints and solemn
    rim separation, serpent-weighted rim behavior, occult glow, and charged shadow plus
    kami-weighted rim behavior, occult glow, and charged shadow, scale sheen, black mineral, and
