visualDna:
  aesthetic: 'Fungal miniature construction: the subject grown and assembled from mushroom caps, gills and bracket fungi, with moss and lichen as the finish.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Cream, tan and rust caps with pale speckles, damp moss green and a violet or orange accent fungus; humid mid tones.
  lighting_and_shadow: Low misty forest light, soft glow under the caps, spore dust catching a narrow shaft of sun.
  texture_and_material: Matte fungal skin, fine gill fans on undersides, speckling, damp moss, spore dust in the air.
  camera_and_composition: Keep the requested view as a forest-floor macro with shallow depth of field and a mossy base.
  atmosphere_and_mood: Damp, secret and gently eerie, something grown overnight.
  rendering_and_quality: Macro nature photograph of real fungal material; no fairy-cottage cliché and no creatures.
  key_features: mushroom caps and gills as structure; bracket fungus ledges; cream speckling; spore dust in a light shaft; forest-floor macro
  creative_brief: "Fungal miniature construction: the subject grown and assembled from mushroom caps, gills and bracket fungi, with moss and lichen as the finish. Carry it through mushroom caps and gills as structure, bracket fungus ledges, cream speckling, spore dust in a light shaft, forest-floor macro. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
