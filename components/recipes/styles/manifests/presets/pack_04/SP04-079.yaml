visualDna:
  aesthetic: 'Blackletter calligraphy: the subject drawn with a broad-edged nib in textura strokes, vertical columns, broken curves and diamond terminals, like a gothic illuminated initial.'
  subject_treatment: Keep the prompt subject recognizable and build its form out of broad-nib blackletter strokes and flourishes; the strokes read as letter-like pattern, never as readable words.
  color_and_tone: Dense black ink on parchment beige with antique gold leaf and a touch of vermilion.
  lighting_and_shadow: No modeled light; contrast comes from thick-thin stroke weight and burnished gold catching light.
  texture_and_material: Crisp broad-nib strokes with sharp corners, hairline flourishes, vellum grain and slightly raised gilding.
  camera_and_composition: Keep the requested view with tight vertical rhythm and ornamental flourishes filling the space.
  atmosphere_and_mood: Solemn, gothic and ceremonial, like a page from a chained book.
  rendering_and_quality: Precise pen-built strokes with consistent nib angle; no readable text.
  key_features: broad-nib textura strokes; diamond terminals; hairline flourishes; gold leaf; vellum grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Calligraphy (Blackletter) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
