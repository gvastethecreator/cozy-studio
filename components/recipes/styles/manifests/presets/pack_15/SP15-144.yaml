visualDna:
  aesthetic: 'Pagerpunk: a late-90s telecom underground of beepers, phone booths, flip phones and payphone codes whispered across the city.'
  subject_treatment: Keep the prompt's subject and setting; place it among pagers, payphones, cords and blinking displays without readable text.
  color_and_tone: Translucent teal and purple plastics, payphone silver and sodium streetlight orange.
  lighting_and_shadow: Streetlights, backlit green pager screens and phone booth glow in the night.
  texture_and_material: Translucent plastic shells, coiled phone cords, scratched booth glass and belt clips.
  camera_and_composition: Night streets with phone booths as islands of light and close-ups of blinking devices.
  atmosphere_and_mood: Nostalgic and conspiratorial, secret messages beeping in pockets across the city.
  rendering_and_quality: Grainy late-90s illustration with glowing small screens and plastic sheen.
  creative_brief: "Pagerpunk: a late-90s telecom underground of beepers, phone booths, flip phones and payphone codes whispered across the city. Carry it through pagers, payphone booths, coiled cords, green backlit screens. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pagers; payphone booths; coiled cords; green backlit screens
