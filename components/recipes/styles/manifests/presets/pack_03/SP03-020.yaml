visualDna:
  aesthetic: 'Glazed porcelain: fine white ceramic with a glassy glaze, milky translucency at thin edges and tiny crackle lines.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Milky white or celadon, optional cobalt blue painted accents, soft pooled glaze color.
  lighting_and_shadow: Soft broad highlights on the glaze, light glowing through thin rims.
  texture_and_material: Smooth glaze, fine crackle network, pooled glaze in hollows, crisp rims.
  camera_and_composition: Keep the requested framing; soft studio or window light.
  atmosphere_and_mood: Delicate and precious, beauty that could break at a touch.
  rendering_and_quality: Glazed ceramic with subtle translucency; not matte plaster.
  key_features: glassy white glaze; translucent thin rims; fine crackle; cobalt painted accents; pooled glaze
  creative_brief: "Glazed porcelain: fine white ceramic with a glassy glaze, milky translucency at thin edges and tiny crackle lines. Carry it through glassy white glaze, translucent thin rims, fine crackle, cobalt painted accents, pooled glaze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
