visualDna:
  aesthetic: 'Isometric Wire Icons: thin line icons drawn in one strict isometric projection, so every object reads as a small precise volume made of wire.'
  subject_treatment: Draw the prompt's subject or requested objects as thin line icons in one shared isometric projection, all edges on the same three axes.
  color_and_tone: One ink line on a plain ground, with an optional single accent on the active face.
  lighting_and_shadow: Line-only volumes, depth coming from the projection alone.
  texture_and_material: Uniform thin wire lines with neat corners where three edges meet.
  camera_and_composition: Same isometric angle and scale for every icon, aligned on a shared grid.
  atmosphere_and_mood: Technical, tidy and quietly dimensional, like a tiny blueprint.
  rendering_and_quality: Clean vector wireframes with no hidden-line mistakes or broken axes.
  creative_brief: "Isometric Wire Icons: thin line icons drawn in one strict isometric projection, so every object reads as a small precise volume made of wire. Carry it through strict isometric axes, thin wire lines, shared grid, tiny volumes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: strict isometric axes; thin wire lines; shared grid; tiny volumes
