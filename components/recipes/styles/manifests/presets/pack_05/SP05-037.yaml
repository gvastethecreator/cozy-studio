visualDna:
  aesthetic: "Hirohiko Araki JoJo's Bizarre Adventure look: flamboyant fashion-model poses, muscular angular bodies, lipstick-like shading, bold unexpected colors and menacing sound-effect atmosphere without letters."
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Araki designs, angular muscular bodies, strong jaws, stylish outlandish outfits and twisted fashion-magazine poses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Wild unexpected color swaps, magenta skies, lime shadows and gold highlights.
  lighting_and_shadow: Dramatic stylized lighting with bold shadow shapes and color inversions.
  texture_and_material: Heavy inked contours, hatching, bold flat color and dramatic shadow shapes.
  camera_and_composition: Twisted dramatic poses, dutch angles and menacing close-ups.
  atmosphere_and_mood: Keep the requested mood with flamboyant bizarre bravado.
  rendering_and_quality: Flamboyant manga illustration with fashion-pose drama and bizarre menace.
  key_features: Araki poses; bizarre fashion; wild colors; menacing atmosphere
  creative_brief: "Hirohiko Araki JoJo's Bizarre Adventure look: flamboyant fashion-model poses, muscular angular bodies, lipstick-like shading, bold unexpected colors and menacing sound-effect atmosphere without letters. Carry it through Araki poses, bizarre fashion, wild colors, menacing atmosphere. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
