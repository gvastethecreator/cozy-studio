visualDna:
  aesthetic: 'Casino sensory grid: a windowless, clockless interior designed to hold attention, with low mirrored and gilded ceilings, busy patterned carpet, chandeliers and endless reflections.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Saturated red, gold and purple with green felt and pink-blue neon accents; everything warm and bright, no daylight tones anywhere.
  lighting_and_shadow: Hundreds of small pot lights and chandeliers from a low ceiling, glowing edges and neon strips, almost no shadow, no time of day.
  texture_and_material: Loud geometric or floral wool carpet, mirrored ceiling panels, polished brass trim, lacquered wood, green baize, crystal drops, glossy lacquer.
  camera_and_composition: Keep the requested view; compress space with a low ceiling and reflections, fill the frame edge to edge with pattern and light.
  atmosphere_and_mood: Dazzling, timeless and slightly suffocating, a trap for attention.
  rendering_and_quality: Saturated interior photograph with crisp reflections and glints, no readable signs or screens.
  key_features: windowless low mirrored ceiling; busy patterned carpet; hundreds of pot lights; red gold and neon; endless reflections
  creative_brief: "Casino sensory grid: a windowless, clockless interior designed to hold attention, with low mirrored and gilded ceilings, busy patterned carpet, chandeliers and endless reflections. Carry it through windowless low mirrored ceiling, busy patterned carpet, hundreds of pot lights, red gold and neon, endless reflections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
