visualDna:
  aesthetic: Classic fluorescent pink and deep federal-blue risograph pairing, overlapping into electric purple, with bold graphic contour, coarse halftone gradients, and poster-like flatness.
  subject_treatment: 'Translate any prompt into a punchy two-spot-color separation: blue carries structure and shadow, fluorescent pink carries energy, skin, glow, or motion, and their overlap marks the most important forms.'
  color_and_tone: Fluorescent pink, federal blue, overprint violet, and bright white paper.
  lighting_and_shadow: Glow and light sources are pink halftone blooms; shadows are blue masses; overlaps create saturated violet depth.
  texture_and_material: Coarse halftone dot gradients, visible drum grain, slight ink offset, and fluorescent ink saturation that never turns to gradient mush.
  camera_and_composition: Bold centered or diagonal composition with big flat color shapes, strong silhouette, and poster-like breathing room, without typography.
  atmosphere_and_mood: Loud, playful, nocturnal, and a little dangerous.
  rendering_and_quality: Crisp two-color riso reproduction with clean dot structure and pure spot-color fields.
  creative_brief: "Classic fluorescent pink and deep federal-blue risograph pairing, overlapping into electric purple, with bold graphic contour, coarse halftone gradients, and poster-like flatness. Carry it through fluorescent pink plus federal blue, violet overprint, coarse halftone gradients, bold flat poster shapes, glow as pink dots. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fluorescent pink plus federal blue; violet overprint; coarse halftone gradients; bold flat poster shapes; glow as pink dots
