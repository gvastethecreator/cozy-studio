visualDna:
  aesthetic: '3D app icon: the subject simplified into a glossy rounded object inside a soft squircle tile, readable at tiny size.'
  subject_treatment: Keep the prompt subject and action; this preset owns the front-facing squircle icon framing, and nothing else about the request changes.
  color_and_tone: Vibrant gradients on soft pastel backgrounds with clean glossy highlights.
  lighting_and_shadow: Soft top light, subtle inner glow and a small drop shadow under the tile.
  texture_and_material: Smooth plastic, glass and soft matte clay; no fine noise.
  camera_and_composition: Front-facing centered squircle with the simplified subject inside.
  atmosphere_and_mood: Friendly and polished, instantly recognizable at a glance.
  rendering_and_quality: UI-grade icon render with no text or brand marks.
  key_features: squircle tile; simplified glossy subject; soft top light; vibrant gradient; small drop shadow
  creative_brief: "3D app icon: the subject simplified into a glossy rounded object inside a soft squircle tile, readable at tiny size. Carry it through squircle tile, simplified glossy subject, soft top light, vibrant gradient, small drop shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - brand logo
  - franchise likeness
  - readable text
  - readable letters
  - flat
  - 2d icon
  - wrong medium
