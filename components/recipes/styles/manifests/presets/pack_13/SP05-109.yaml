visualDna:
  aesthetic: 'Masashi Kishimoto manga look: dynamic ninja action choreography, radial impact lines, afterimages and sharp detailed panels.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Kishimoto designs, sharp eyes and dynamic action poses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with dynamic tone, true to the Masashi Kishimoto palette.
  lighting_and_shadow: Impact flashes, lit the way Masashi Kishimoto lights its scenes.
  texture_and_material: Sharp ink and radial lines, with the surface finish of Masashi Kishimoto.
  camera_and_composition: Dynamic action choreography, framed the way Masashi Kishimoto composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with kinetic martial energy.
  rendering_and_quality: Dynamic action manga illustration, in the recognizable hand of Masashi Kishimoto.
  key_features: Kishimoto choreography; impact lines; afterimages
  creative_brief: "Masashi Kishimoto manga look: dynamic ninja action choreography, radial impact lines, afterimages and sharp detailed panels. Carry it through Kishimoto choreography, impact lines, afterimages. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
