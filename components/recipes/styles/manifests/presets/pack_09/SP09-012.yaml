visualDna:
  aesthetic: 'Snake scales: overlapping keeled or smooth scales with iridescent sheen and patterned bands.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in overlapping snake scales with patterned bands following its form.'
  color_and_tone: Olive, emerald, black and gold banding with iridescence, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Raking light that shows each scale edge, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Overlapping keeled scales with glossy iridescent sheen, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Sleek, dangerous, hypnotic and exotic, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: overlapping snake scales; patterned bands; iridescent sheen; scale edges
  creative_brief: "Snake scales: overlapping keeled or smooth scales with iridescent sheen and patterned bands. Carry it through overlapping snake scales, patterned bands, iridescent sheen, scale edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
