visualDna:
  aesthetic: 'Mumblecore: low-budget indie cinema shot on consumer video in real apartments with available light and improvised, awkward conversation.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Ungraded natural daylight color, slightly flat, mixed window and lamp white balance.
  lighting_and_shadow: 'Whatever the room offers: a window, a ceiling lamp, a laptop glow.'
  texture_and_material: Soft consumer-video texture, lived-in clutter, unmade beds and mismatched mugs.
  camera_and_composition: Handheld medium shots, accidental framing, heads cut off, people talking off-camera.
  atmosphere_and_mood: Awkward and intimate, small uncertain moments between people.
  rendering_and_quality: Unpolished indie realism; no cinematic grade or glamour.
  key_features: available light apartments; consumer video softness; handheld accidental framing; lived-in clutter; awkward intimacy
  creative_brief: "Mumblecore: low-budget indie cinema shot on consumer video in real apartments with available light and improvised, awkward conversation. Carry it through available light apartments, consumer video softness, handheld accidental framing, lived-in clutter, awkward intimacy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
