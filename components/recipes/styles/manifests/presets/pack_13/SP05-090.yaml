visualDna:
  aesthetic: 'Soft ink contours sit under translucent tonal veils, with selected focal edges kept crisp against gentler color transitions.'
  subject_treatment: 'Preserve identity, proportions, expression, and action; soften contour edges and shadow transitions, never age, pose, or facial structure.'
  color_and_tone: 'Use subdued warm and cool midtones with gently faded transitions; retain explicit colors and avoid an automatic vintage cast.'
  lighting_and_shadow: 'Follow the requested light direction and soften shadow boundaries without changing their source or adding backlight.'
  texture_and_material: 'Layer smooth color glazing over subtle pencil grain; preserve the texture and reflectance of each described material.'
  camera_and_composition: 'Hold crop, viewpoint, distance, and count; create depth with tonal softness rather than an added vignette or focal object.'
  atmosphere_and_mood: 'Keep the requested mood and intensity; haze changes edge softness, not the story or emotional reading.'
  rendering_and_quality: 'Blend shadows gently while maintaining decisive contours and readable values; avoid blur over the whole image.'
  key_features: 'Translucent tonal veils; faded but prompt-led color; selective crisp contours; soft shadow transitions; faint pencil grain.'
  creative_brief: "Use translucent color and softened edges around a few decisive lines. Preserve the user's subject, action, count, camera, and emotional tone without adding a narrative filter. Use it as a reusable look on any subject."
