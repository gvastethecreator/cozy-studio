visualDna:
  aesthetic: 'Seam-Aware Topography: graphic bands that follow the seams and panel changes of a garment, splitting and rejoining at planned points.'
  subject_treatment: Print the prompt's garment with graphic bands that use its real seams as guides, splitting and rejoining at planned points without changing the cut.
  color_and_tone: Enough contrast with the base fabric, colored by path rather than by fake height.
  lighting_and_shadow: Flat art as the source, with mockup light following the garment only.
  texture_and_material: Controlled ink edges with the fabric weave kept independent.
  camera_and_composition: Anchors at shoulder, side and hem, bands pausing at every opening.
  atmosphere_and_mood: A wrapping asymmetric flow that moves with the body.
  rendering_and_quality: Clean print with front and back matching and measured margins.
  creative_brief: "Seam-Aware Topography: graphic bands that follow the seams and panel changes of a garment, splitting and rejoining at planned points. Carry it through seam-following bands, planned splits, front and back match, flat art. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: seam-following bands; planned splits; front and back match; flat art
