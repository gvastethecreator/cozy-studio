visualDna:
  aesthetic: 'Soft Containment Interface: expressive soft-edged containers group tasks by hierarchy with consistent inner spacing.'
  subject_treatment: Group the prompt's screen into soft-edged containers shaped by hierarchy, one large primary container and compact secondary groups; keep requested labels exact.
  color_and_tone: One neutral main surface and at most two color roles for activity and attention.
  lighting_and_shadow: Soft shadows only between functional levels, with every other surface flat.
  texture_and_material: Matte surfaces and soft edges with related radii throughout.
  camera_and_composition: Large primary container, compact secondary groups and consistent inner spacing.
  atmosphere_and_mood: Closeness and breathing room, expressive in shape but still a serious tool.
  rendering_and_quality: Container shapes reinforce grouping and keep every control aligned.
  creative_brief: "Soft Containment Interface: expressive soft-edged containers group tasks by hierarchy with consistent inner spacing. Carry it through soft containers, hierarchy by size, consistent padding, two color roles. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft containers; hierarchy by size; consistent padding; two color roles
