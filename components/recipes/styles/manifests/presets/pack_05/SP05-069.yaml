visualDna:
  aesthetic: Grounded low-fantasy anime ink with scuffed matte planes, chipped contour edges and narrow slices of light that show how everyday things are made and worn.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Worn stone gray, dull iron, undyed linen and subdued earth accents with no saturated color.
  lighting_and_shadow: Restrained practical-looking contrast with narrow slices of light laid across a few planes.
  texture_and_material: Sparse abrasion, rubbed pigment and chipped edges on wood, iron and leather; every material keeps its identity.
  camera_and_composition: Keep the requested camera, subject count and arrangement; this treatment never adds an adventurer.
  atmosphere_and_mood: Tactile, practical, lived-in grit without forced danger.
  rendering_and_quality: Chipped contour edges, matte planes and clear construction logic in every object.
  key_features: chipped contour edges; scuffed matte planes; stone gray, iron and linen; narrow light slices; rubbed pigment
  creative_brief: "Grounded low-fantasy anime ink with scuffed matte planes, chipped contour edges and narrow slices of light that show how everyday things are made and worn. Carry it through chipped contour edges, scuffed matte planes, stone gray, iron and linen, narrow light slices. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
