visualDna:
  aesthetic: 'Clay UI: interface elements rendered as soft extruded matte clay — rounded panels, pill buttons and knobs — with friendly depth.'
  subject_treatment: Keep the prompt subject and action; this preset owns the extruded soft-clay interface layout, with every control blank and textless, and nothing else about the request changes.
  color_and_tone: Soft pastel palette, cream backgrounds, one accent color.
  lighting_and_shadow: Large soft light, gentle contact shadows, inner shadows on pressed buttons.
  texture_and_material: Matte clay with tiny surface grain, rounded bevels.
  camera_and_composition: Front-facing or slightly tilted panel filling the frame.
  atmosphere_and_mood: Friendly and tactile, controls you want to squeeze.
  rendering_and_quality: Clean soft-clay render; no readable labels or numbers.
  key_features: extruded matte clay UI; pastel palette; pill buttons and knobs; soft contact shadows; textless controls
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Clay UI as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
