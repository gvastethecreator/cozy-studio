visualDna:
  aesthetic: 'Film creature hide: the subject covered in massive, wrinkled, scarred hide with layered displacement, wet sheen in the folds and dust caked on high points.'
  subject_treatment: Keep the prompt subject, action, pose, setting and camera view and rebuild its surfaces in this organic CGI method; never force a T-pose and never turn a requested object into an avatar.
  color_and_tone: Grey-brown to slate hide with pale scar tissue, darker wet creases and dusty lighter ridges.
  lighting_and_shadow: Overcast soft key with a hard rim, glancing light revealing every wrinkle and scale edge.
  texture_and_material: Multi-scale displacement of big folds, medium wrinkles, fine cracks and pebbled scales, with scars, dried mud and moss.
  camera_and_composition: Keep the requested view; a long-lens close-up on a flank or face sells the scale.
  atmosphere_and_mood: Heavy and ancient, an animal older than the landscape.
  rendering_and_quality: Feature-VFX surfacing where wetness, dust and scars follow the anatomy, with no rubber-suit sheen.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Photoreal Creature Hide as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: multi-scale hide displacement; wet creases and dusty ridges; scar tissue; glancing light; long-lens scale
