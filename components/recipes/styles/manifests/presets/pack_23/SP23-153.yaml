visualDna:
  aesthetic: 'Selective colored outline: pixel art where outlines change color with the light, dark on the shadow side, light or colored on the lit side, blending sprites into their scene.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; outline the subject with colored lines that lighten on its lit side.
  color_and_tone: Outline colors drawn from neighboring fills, kept consistent across the whole image.
  lighting_and_shadow: Directional light reflected in outline color, kept consistent across the whole image.
  texture_and_material: One-pixel colored outlines and clean fills, kept consistent across the whole image.
  camera_and_composition: Clear sprite silhouette within a scene, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with soft integrated charm.
  rendering_and_quality: Refined outlines that read cleanly, kept consistent across the whole image.
  creative_brief: "Selective colored outline: pixel art where outlines change color with the light, dark on the shadow side, light or colored on the lit side, blending sprites into their scene. Carry it through colored outlines, lit-side light line, dark shadow line, integrated sprite. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: colored outlines; lit-side light line; dark shadow line; integrated sprite
