visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Quake III Arena gameplay screenshots: retro
    arena-FPS capture with gothic sci-fi arenas, rocket jumps, saturated pickups, sharp corridors,
    and old-school HUD symmetry. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Quake III Arena-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Quake III Arena-informed palette: lava orange, gunmetal grey, blood red, toxic green
    pickups, electric blue armor, and black stone. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through hard colored arena lights, lava glow, weapon flashes, pickup glow, and
    simple baked shadow contrast. Lighting must clarify the playable route, threat, focal subject,
    or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from chunky late-90s 3D geometry, gothic metal, skull motifs without logos, jump
    pads, ammo boxes, and low-detail texture tiling. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person arena view with centered weapon, opponent sightlines, pickup route
    loops, vertical jumps, and speed lanes. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Quake III Arena-derived mood: aggressive, competitive, old-school, brutal, and fast. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: classic FPS HUD is welcome:
    health/armor, ammo, weapon icon, crosshair, and score timer can appear. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Quake III Arena gameplay screenshots; retro arena-FPS capture with gothic sci-fi arenas, rocket
    jumps, saturated pickups, sharp corridors, and old-school HUD symmetry; lava orange, gunmetal
    grey, blood red, toxic green pickups, electric blue armor, and black stone; hard colored arena
    lights, lava glow, weapon flashes, pickup glow, and simple baked shadow contrast; chunky
    late-90s 3D geometry, gothic metal, skull motifs without logos, jump pads, ammo boxes, and
    low-detail texture tiling; first-person arena view with centered weapon, opponent sightlines,
    pickup route loops, vertical jumps, and speed lanes; aggressive, competitive, old-school,
    brutal, and fast; HUD guidance: classic FPS HUD is welcome: health/armor, ammo, weapon icon,
    crosshair, and score timer can appear
  creative_brief: >-
    Use Quake Arena Obsidian Trial as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Quake III Arena: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
