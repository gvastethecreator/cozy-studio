visualDna:
  aesthetic: 'Low-poly 3D: forms reduced to a few hundred flat triangular facets, each facet a single shaded tone.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Vivid stylized colors, facet-to-facet value steps, gradient skies.
  lighting_and_shadow: Single sun with flat per-facet shading; crisp shadow triangles.
  texture_and_material: No textures; the geometry of the facets is the texture.
  camera_and_composition: Keep the requested view; silhouettes stay readable despite the reduction.
  atmosphere_and_mood: Clean and playful, the world simplified into crystal shards.
  rendering_and_quality: Crisp flat-shaded facets without smoothing or texture maps.
  key_features: visible triangular facets; flat per-facet shading; no textures; vivid palette; readable silhouettes
  creative_brief: "Low-poly 3D: forms reduced to a few hundred flat triangular facets, each facet a single shaded tone. Carry it through visible triangular facets, flat per-facet shading, no textures, vivid palette, readable silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
