visualDna:
  aesthetic: 'Tarnished dark-fantasy concept-art language, a technique study rather than a copy of any work: compact iron masses and gaunt organic forms, severe silhouettes, damp mineral environments and physically oppressive weight.'
  subject_treatment: >-
    Preserve explicit identity, action and count. Design unspecified contours with a burdened center
    of gravity, narrow joint gaps and contrasts between protective mass and frail exposed form; use
    shell-like layering where compatible.
  color_and_tone: >-
    Blackened iron, peat brown, lichen olive and cold ash; isolate small tarnished gold highlights
    against broad near-black planes. Explicit subject colors remain legible.
  lighting_and_shadow: >-
    Low grazing light reveals ridges while cavities remain dark; a few wet specular edges describe
    mass without turning the whole image glossy.
  texture_and_material: >-
    Pitted iron, frayed binding, chalky mineral crust and slick organic recesses; texture follows
    construction and contact, with broad quiet areas between wear.
  camera_and_composition: >-
    Weight-bearing diagonals and compressed foreground masses against spare distant monoliths. Keep
    requested viewpoint; favor a strongly grounded anchor over panoramic decoration.
  atmosphere_and_mood: >-
    Ancient, exhausted and alien; protection feels borrowed and fragile. Solemn physical
    vulnerability rather than triumphant heroic fantasy.
  rendering_and_quality: >-
    Dense painterly concept art with sculpted value masses and controlled hard highlights; visibly
    painted transitions, not a photograph of medieval cosplay.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
