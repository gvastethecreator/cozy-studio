visualDna:
  aesthetic: >-
    A deadpan anime rhythm made from minimal expression shifts, restrained contour and
    contrast between stillness and sudden emphasis.
  subject_treatment: >-
    Preserve the subject and action. Keep expression changes small and gesture economical,
    aligned with the requested tone.
  color_and_tone: >-
    Use the prompt's colors. With no palette specified, maintain even color grouping and
    reserve stronger contrast for the focal change.
  lighting_and_shadow: >-
    Keep lighting straightforward and shapes readable. Use shadow blocks only to direct
    attention, not to add spectacle.
  texture_and_material: >-
    Use clean digital ink and limited surface noise; follow the materials actually depicted
    and keep background painting softly integrated.
  camera_and_composition: >-
    Respect the supplied camera and layout. A composed hold followed by a visual beat may
    express timing within that frame.
  atmosphere_and_mood: >-
    Dry understatement or absurd contrast may appear when requested; otherwise follow the
    prompt's tone and emotional stakes.
  rendering_and_quality: >-
    Maintain stable linework and clear silhouettes; reserve effects for the prompted action
    and keep small expression details crisp.
  key_features: >-
    Minimal expression shift; economical gesture; stillness contrasted with a sudden visual
    beat; clean ink and controlled value emphasis.
  creative_brief: >-
    Use restrained acting and timing contrast while preserving the given subject, action,
    setting and camera; let the prompt set the tone.
