visualDna:
  aesthetic: >-
    Real Estate (HDR) acts as a transferable photographic style router: begin from Real estate HDR
    brightness, Shadowless HDR visibility, and commercial photographic system built from sellable
    clarity, controlled studio craft, material desirability, and brand-neutral polish, then apply
    the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Wide angle; preserve prompt identity while making silhouette,
    surface, freshness, scale, and product-like value immediately readable, keeping the original
    subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Saturated, even; use palette as campaign control: clean whites, luxury neutrals,
    appetite warmth, cool tech accents, automotive reflections, or interior harmony, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use No shadows (HDR); shape light with softboxes, reflectors, rim lines, HDR fill, glossy
    kickers, window balance, or packshot sweep shadows, preserving believable exposure, shadow
    density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Sharp; render metal, glass, fabric, food surface, condensation, cosmetic gel,
    architecture finish, and clean contact shadows with precise detail, avoiding both waxy smoothing
    and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Unnatural dynamic range; compose for catalog clarity, top-down order, hero
    compression, architectural verticals, lifestyle layout, or premium macro depth, with lens
    distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Bright, selling; derive mood from appetite, trust, luxury, engineering,
    cleanliness, freshness, aspiration, or frictionless retail function, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Listing-photo oversaturation; finish with professional photo polish, accurate
    material response, clean retouching, and no fake logo, UI, or unreadable label clutter,
    high-resolution photographic detail, and disciplined denoise without losing natural grain where
    the preset needs it.
  key_features: >-
    Real estate HDR brightness; Shadowless HDR visibility; Saturated, even; No shadows (HDR);
    Unnatural dynamic range
  creative_brief: >-
    Apply Real Estate (HDR) as a photographic preset over prompt X: preserve the user's requested
    subject, then route Real estate HDR brightness, Saturated, even, No shadows (HDR), Sharp, and
    Unnatural dynamic range through optics, exposure, palette, surface response, timing, and finish
    without requiring the card image's original subject.
