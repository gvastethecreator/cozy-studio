visualDna:
  aesthetic: >-
    Use this drawing language: Soft hand-drawn TV-cartoon language with low viewpoint, chunky
    outlines, oversized nearby forms, rounded perspective, soft crayon edge, and gentle color.
    Apply it to the supplied content without requiring a particular cast, place, or story.
  subject_treatment: >-
    Apply chunky uneven outlines, nervous hand-drawn curves, simplified forms, and soft wobble
    marks to the supplied subject while preserving its identity, silhouette, requested action,
    actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: >-
    Use soft TV pastels, warm beige, toy-box primaries, soft blue, and faded marker colors as
    style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use bright flat fill with soft low-angle shadowing as a visual treatment, while respecting
    any lighting instructions in the request.
  texture_and_material: >-
    Render dry marker edges, paper-like color fill, and softened scan texture as drawn or
    printed surface marks over the existing material; do not change the subject's actual
    substance or function.
  camera_and_composition: >-
    Use a low viewpoint and relative scale to enlarge nearby forms; keep depth rounded and
    simple while retaining the requested setting.
  atmosphere_and_mood: >-
    Curious, rambunctious, and chaotic; let the supplied subject carry the energy.
  rendering_and_quality: >-
    Finish with soft cel color, chunky hand-drawn contour, paper-like fill, and gentle scan
    texture.
  key_features: >-
    low viewpoint; chunky outlines; rounded perspective; soft crayon edges; gentle TV palette
  creative_brief: >-
    Render the supplied content with chunky uneven outlines, nervous hand-drawn curves,
    simplified forms, and soft wobble marks. Use soft TV pastels, warm beige, toy-box primaries,
    soft blue, and faded marker colors as style colors while honoring any explicit color
    instructions. Apply dry marker edges, paper-like color fill, and softened scan texture as
    drawn or printed marks over the existing material, without changing what the subject is made
    of or how it functions. Preserve the requested subject, action, and setting; follow the
    supplied composition and add no unrequested cast, location, lettering, or gag.
