visualDna:
  aesthetic: 'Crystal and gemstone: faceted translucent crystal with internal refractions and color zones.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is carved from gem crystal with facets and inner refractions.'
  color_and_tone: Amethyst purple, emerald, sapphire or clear quartz, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Point lights producing refraction and fire, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Faceted crystal with inclusions and internal reflections, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Precious, magical, cold and brilliant, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: faceted gem crystal; internal refraction; inclusions; spectral fire
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Crystal/Gemstone as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
avoidRules:
  - material applied to the background instead of the target
