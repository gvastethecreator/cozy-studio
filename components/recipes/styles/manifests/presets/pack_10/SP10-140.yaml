visualDna:
  aesthetic: 'Mind map: a central node with radiating branches and doodle icons.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is at the center with radiating branches of related doodles."
  color_and_tone: Colorful branches on white, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Hand-drawn marker lines, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Creative, energetic, playful and personal, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Mind map: a central node with radiating branches and doodle icons. Carry it through central node, radiating branches, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: central node; radiating branches; illustrative only
