visualDna:
  aesthetic: 'Origami 3D: the subject folded from single uncut sheets of paper, with crisp creases and geometric planes.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Natural paper tones or single bold colored sheets, subtle patterned papers.
  lighting_and_shadow: Directional light catching every crease, soft shadows between planes.
  texture_and_material: Crisp folds, paper grain, slight translucency at edges.
  camera_and_composition: Keep the requested view; folded planes turned to the light.
  atmosphere_and_mood: Elegant and precise, form made only from folds.
  rendering_and_quality: Pure fold geometry, no cuts or glue; distinct from layered papercraft.
  key_features: single-sheet folds; crisp creases; geometric planes; paper grain; no cuts
  creative_brief: "Origami 3D: the subject folded from single uncut sheets of paper, with crisp creases and geometric planes. Carry it through single-sheet folds, crisp creases, geometric planes, paper grain, no cuts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
