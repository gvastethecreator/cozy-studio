visualDna:
  aesthetic: >-
    Build the graphic anime treatment from strong dark contours paired with measured ornamental
    lines and radiating rings, sharp triangular cuts, and compact graphic masses. Let rising
    spirals paired with short straight cuts set its rhythm; use charcoal and ivory with bright
    orange, scarlet, and warm yellow for color and dense flat color with limited speckle and
    painted accent marks for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use strong dark contours paired with measured
    ornamental lines for edge work, radiating rings, sharp triangular cuts, and compact graphic
    masses for form simplification, and rising spirals paired with short straight cuts only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with charcoal and ivory with bright orange, scarlet, and warm yellow. Place
    the strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: bright warm accents against decisive silhouette shadows. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with dense flat color with limited speckle and painted accent marks,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use centered graphic pressure with broad negative space,
    fitted to the requested frame to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey formal energy held in order, while preserving the
    prompt's emotional intent.
  rendering_and_quality: >-
    Finish with strong silhouette cuts, limited warm bloom, and carefully placed geometry; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    strong dark contours paired with measured ornamental lines; radiating rings, sharp triangular
    cuts, and compact graphic masses; charcoal and ivory with bright orange, scarlet, and warm
    yellow; rising spirals paired with short straight cuts; dense flat color with limited speckle
    and painted accent marks; centered graphic pressure with broad negative space, fitted to the
    requested frame.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with strong dark contours
    paired with measured ornamental lines, radiating rings, sharp triangular cuts, and compact
    graphic masses, and charcoal and ivory with bright orange, scarlet, and warm yellow; use
    rising spirals paired with short straight cuts only where movement is already present, and
    apply dense flat color with limited speckle and painted accent marks as the drawing finish.
