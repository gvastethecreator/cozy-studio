  lighting_and_shadow: Dim noir light cut by red optic glow.
  texture_and_material: Meticulous pen detail with dense mechanical hatching on armor plates.
  camera_and_composition: Grim rainy noir alleys and looming low-angle armored figures.
  atmosphere_and_mood: Keep the requested mood with grim armored menace.
  rendering_and_quality: Meticulous noir manga illustration with dense armored mechanical detail.
  key_features: Kamui Fujiwara detail; red optics; armored troops; noir
  creative_brief: "Kamui Fujiwara Kerberos manga art look: meticulous realistic armored police troops with glowing red optics, dense mechanical detail and grim alternate-postwar noir. Carry it through Kamui Fujiwara detail, red optics, armored troops, noir. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
