visualDna:
  aesthetic: Anime vertigo frame from a steep high oblique looking down past the subject into deep space, where the subject's line of travel crosses a strong architectural or terrain edge in a clean X.
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the steep high oblique viewpoint and the X-crossing of travel line and edge line, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the far depth drops in value so the two crossing paths separate by contrast.
  lighting_and_shadow: Crisp highlights on the crossing edges only, following the prompt's light; no sparks or energy effects.
  texture_and_material: Fine directional marks attached to the moving subject; surfaces below simplify into flat value bands with distance.
  camera_and_composition: A 70 to 80 degree down-angle through a wide lens, horizon out of frame, with the crossing point placed on a third and generous air around it.
  atmosphere_and_mood: Vertigo and suspended breath created by height and direction, never by a collision.
  rendering_and_quality: Firm 2D contours, stable structure under steep perspective and both crossing paths readable at a glance.
  key_features: steep 70-80 degree down-angle; X-crossing of travel line and edge line; wide lens; far depth dropping in value; horizon out of frame
  creative_brief: "Anime vertigo frame from a steep high oblique looking down past the subject into deep space, where the subject's line of travel crosses a strong architectural or terrain edge in a clean X. Carry it through steep 70-80 degree down-angle, X-crossing of travel line and edge line, wide lens, far depth dropping in value, horizon out of frame. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
