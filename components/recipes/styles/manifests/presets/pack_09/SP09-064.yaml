visualDna:
  aesthetic: >-
    Mud (Cracked) turns material failure into the main visual language: start from Cracked dry mud,
    Dry clay, and Curled plates, then turn damage history, contamination, corrosion, staining,
    abrasion, and material breakdown into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Puzzle cracks: preserve identity and pose while letting
    forms age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Tan, Brown as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Hard dry light define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Mud (Cracked) without hiding the prompt
    subject.
  texture_and_material: >-
    Render Dry clay through layer loss, residue buildup, chipped edges, stains, cracks, and uneven
    surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface tension
    coherent across the whole image.
  camera_and_composition: >-
    Compose around Curled plates as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Thirsty, hot by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Arid, brittle material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Cracked dry mud; Puzzle cracks; Dry clay; Hard dry light; Curled plates
  creative_brief: >-
    Route any subject through Mud (Cracked) as a transferable weathering-and-decay visual system
    while preserving the prompt's subject, action, and setting. Apply cracked-mud desiccation to the
    input: tan-brown puzzle plates, curled brittle edges, shrinking-clay gaps, and thin shadows
    under hard dry light. If ground, terrain, clay, skin-like surface, or object exists, fracture it
    directly; otherwise use drought geometry as surface pattern without forcing a desert landscape.
