visualDna:
  aesthetic: 'Crystal-grown architecture: walls and towers built from clustered hexagonal quartz and amethyst prisms, cleavage planes serving as floors, light travelling inside the stone.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Sapphire, amethyst violet and milky white quartz with thin spectral fringes at every edge; cool, saturated jewel tones.
  lighting_and_shadow: Light enters one face and exits another, casting caustics and small rainbow dispersions across floors; glow from inside the prisms.
  texture_and_material: Hard hexagonal facets, cloudy inclusions, frosted fracture surfaces at the base of each cluster, razor-sharp terminations.
  camera_and_composition: Keep the requested view; prism clusters radiate from a base so silhouettes stay spiky and asymmetric.
  atmosphere_and_mood: Cold, resonant and otherworldly, a building that seems to have crystallized overnight.
  rendering_and_quality: Refraction-accurate glass rendering with crisp facets; distinct from ice, which is cyan, bubbled and melting.
  key_features: hexagonal quartz and amethyst prisms; internal light transmission; caustics and rainbow dispersion; frosted fracture bases; spiky asymmetric silhouettes
  creative_brief: "Crystal-grown architecture: walls and towers built from clustered hexagonal quartz and amethyst prisms, cleavage planes serving as floors, light travelling inside the stone. Carry it through hexagonal quartz and amethyst prisms, internal light transmission, caustics and rainbow dispersion, frosted fracture bases, spiky asymmetric silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
