visualDna:
  aesthetic: >-
    Describe existing forms with simple faceted color planes, opaque fills and selective narrow edge
    accents. Keep facets aligned to the original geometry rather than reshaping the subject.
  subject_treatment: >-
    Preserve the requested identity, function, count, pose, action, proportions and geometry. Use
    plane boundaries to clarify form without adding ornaments or changing what it is made of.
  color_and_tone: >-
    Retain the requested palette and color relationships. Organize existing colors into opaque fields
    and use restrained edge accents drawn from that palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Faceted values should support existing form
    and shadows without adding metallic shine or a new light source.
  texture_and_material: >-
    Preserve represented materials. Use clean color fields and selective edge accents as drawing
    choices, not as a demand to convert surfaces into a different physical material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Faceting follows current
    perspective and does not create new geometry or graphic elements.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Faceted color treatment changes visual construction,
    not the scene, period or narrative.
  rendering_and_quality: >-
    Keep plane scale and edge accents consistent across the image. Avoid uniform metallic outlines,
    excessive facets or changes to the original silhouette.
avoidRules:
  - unrequested geometry or material changes
  - uniform metallic edging, excess facets or forced hues
  - unrequested ornament, lettering or added graphic elements
