visualDna:
  aesthetic: 'Bibliographic classicism: the material language of a great old reading room — oak shelving bays, cast-iron galleries, brass rails and rolling ladders, leather and gilt under a coffered ceiling.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Oak brown, oxblood and bottle-green leather, worn gold leaf, brass, and green-glass lamp light; warm amber midtones, dark corners.
  lighting_and_shadow: Soft top light from a lantern or clerestory, green-shaded task lamps making warm pools, deep shadow in the shelving bays.
  texture_and_material: Quarter-sawn oak bays with carved end panels, brass rails and ladders on tracks, cast-iron spiral stairs, leather and cloth spines, card-drawer cabinets, worn gilding.
  camera_and_composition: Keep the requested view; stack vertical tiers of shelving or galleries, one warm lamp pool as the focus, no centred aisle.
  atmosphere_and_mood: Studious, hushed and venerable, knowledge stored in wood and brass.
  rendering_and_quality: Warm low-light photograph with legible joinery and brass wear, spines without readable titles.
  key_features: oak shelving bays with rolling brass ladders; cast-iron galleries; green-shaded lamp pools; worn gilt coffering; leather spines
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bibliographic Classicism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
