visualDna:
  aesthetic: 'Material-Inlaid Navigation: letters and symbols inlaid flush into walls and floors through joints and controlled contrast.'
  subject_treatment: Inlay the prompt's sign text and symbols flush into the existing surface, keeping outlines and contrast independent of the material, every word exact.
  color_and_tone: Contrast through value and finish, with color added only when allowed.
  lighting_and_shadow: Frontal and side light tested, with reflections never the only contrast.
  texture_and_material: Conceptual inlay matching the surface with thin joints and clear edges.
  camera_and_composition: Sign related to existing joints without being cut by them.
  atmosphere_and_mood: A discreet, materially integrated presence that still communicates first.
  rendering_and_quality: Clean inlay with exact letters shown from more than one angle.
  creative_brief: "Material-Inlaid Navigation: letters and symbols inlaid flush into walls and floors through joints and controlled contrast. Carry it through flush inlay, joint-aware, value contrast, exact letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flush inlay; joint-aware; value contrast; exact letters
