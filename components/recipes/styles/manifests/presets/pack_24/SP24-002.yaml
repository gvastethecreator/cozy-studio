visualDna:
  aesthetic: >-
    Silent Hill 2 (2001) psychological art direction translated into distressed painted
    illustration: inward grief, sickly stillness and ordinary space dissolving into uncertain
    memory.
  subject_treatment: >-
    Preserve the requested person and action; make faces or gestures feel withdrawn, while a small
    number of sharp details persist inside softened spatial information.
  color_and_tone: >-
    Tarnished blue-green, dirty cream and deep brown-black with one weak amber accent; isolated pale
    features against unfilled darkness.
  lighting_and_shadow: >-
    Low, quiet illumination and long unfilled dark areas; isolate small pools of light instead of
    adding modern cinematic rim light or spectacle.
  texture_and_material: >-
    Smoky rubbed charcoal, thin tarnished color washes and selective grain around worn domestic
    materials. Abrasion interrupts edges rather than coating every surface in uniform dirt.
  camera_and_composition: >-
    Preserve requested camera and crop. Use a quiet isolated anchor, disproportionate negative space
    and a subtle mismatch between reflection and physical space.
  atmosphere_and_mood: >-
    Still, sickly, lonely, and inward-looking; tension comes from waiting, distant noise, and the
    sense that memory itself is unreliable.
  rendering_and_quality: >-
    Distressed painterly psychological-horror illustration with lost edges, rubbed value fields and
    a few sharply resolved details; no PS2 geometry, screenshot framing or glossy modern realism.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
