visualDna:
  aesthetic: >-
    Sinuous linework of varied density works with delicate transparent watercolor to describe existing
    joints, volume and movement. This study is anchored to Arthur Rackham's 1910 pen-and-ink and
    watercolor illustration, not to medieval art or its pictured story.
  subject_treatment: >-
    Preserve requested identity, function, proportions, count and action. Let curved lines follow the
    existing structure without adding roots, creatures, trees or changing a subject's anatomy.
  color_and_tone: >-
    Preserve the requested palette. Use restrained transparent washes and protected light areas without
    imposing woodland greens, browns or a muted fantasy palette.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Vary line density to describe existing
    volume without inventing a dramatic scene or a new light source.
  texture_and_material: >-
    Keep hatching local to joints, contours and volume. Preserve the depicted material whether metal,
    fabric, ceramic or another surface; do not apply a global paper grain or convert objects to wood.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and spatial relationships. Do not add a forest,
    landscape, frame or storybook page around the subject.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. The source is a specific early-twentieth-century British
    illustrator's work, not a medieval style attribution or an instruction to depict fantasy.
  rendering_and_quality: >-
    Keep line rhythm distinct from wash edges and preserve important contours. Use color delicately and
    leave enough clear space for the requested form to remain immediately recognizable.
avoidRules:
  - unrequested roots, trees, forest or dragon
  - unrequested storybook setting or page frame
  - imposed woodland palette or aged paper texture
  - false attribution of the 1910 source as medieval art
