visualDna:
  aesthetic: >-
    Long, continuous curves and gently undulating interior rhythms carry the drawing, with a variable
    contour and clean, print-like color areas.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Let ornamental curves follow
    existing contours; do not add hair, flowers, figures or new motifs.
  color_and_tone: >-
    Preserve the requested hues and relationships, using flat color with restrained soft modeling rather
    than introducing a fixed palette.
  lighting_and_shadow: >-
    Respect the requested illumination and keep soft modeling within existing forms; do not add a halo or
    a new light source to support the curves.
  texture_and_material: >-
    Keep the printed illustration clean, with controlled line variation and limited surface effects;
    preserve the materials already represented.
  camera_and_composition: >-
    Retain the requested viewpoint, framing, crop and placement. Curving rhythms adapt to the existing
    composition instead of changing pose or adding a decorative border.
  atmosphere_and_mood: >-
    Maintain the requested setting and tone. Flowing ornament does not imply a floral, romantic or
    historical theme.
  rendering_and_quality: >-
    Use continuous, varied-weight lines and restrained internal curves to guide form; keep the silhouette
    clear and avoid dense detail that competes with the subject.
avoidRules:
  - unrequested flowers, flowing hair motifs or figures
  - unrequested symbols or borders
  - extra details that alter identity or function
