visualDna:
  aesthetic: 'Lineless triangular color-facet animation: forms built from flat translucent triangles, with shadows cut as complementary-colored shards instead of darker values.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Ember orange, hot yellow and electric cyan over charcoal; overlapping shards produce magenta and lime where they cross.
  lighting_and_shadow: 'No modeled light: each plane gets a flat warm or cool triangle, highlights are pale yellow shards and shadows are cyan shards.'
  texture_and_material: Perfectly flat translucent fills with visible overlaps between shards and no outlines, grain or brush marks.
  camera_and_composition: Keep the requested view; break the background into giant diagonal triangles that counter-slant against the subject.
  atmosphere_and_mood: Rebellious, loud and joyful, a riot of shards moving to a three-beat rhythm.
  rendering_and_quality: Lineless vector facets with clean overlaps, bounded color fields and no soft glow or gradients.
  key_features: lineless triangular facets; complementary-colored shadow shards; ember orange, yellow and cyan triad; translucent shard overlaps; counter-slanting background triangles
  creative_brief: "Lineless triangular color-facet animation: forms built from flat translucent triangles, with shadows cut as complementary-colored shards instead of darker values. Carry it through lineless triangular facets, complementary-colored shadow shards, ember orange, yellow and cyan triad, translucent shard overlaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
