visualDna:
  aesthetic: 'Visual kei: theatrical rock fashion with dramatic hair, heavy makeup and ornate layered costumes mixing gothic, aristocratic and punk elements.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: an ornate layered costume — brocade or leather coat, lace, buckles, chains, asymmetric cuts — with sculpted teased hair and bold stage makeup."
  color_and_tone: Black, deep purple, blood red, silver and white with metallic accents.
  lighting_and_shadow: Dramatic stage lighting with colored rim light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Brocade, leather, PVC, lace, feathers and metal hardware, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Dramatic three-quarter or full figure pose, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Theatrical, androgynous, dark and glamorous, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Glossy, high-contrast stage finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Visual Kei as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ornate layered costume; teased sculpted hair; heavy stage makeup; brocade and buckles; colored rim light
