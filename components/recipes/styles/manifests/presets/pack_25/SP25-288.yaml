visualDna:
  aesthetic: 'Perforated Light Sign Systems: letters and symbols formed by perforations in a plate lit softly from within, readable day and night.'
  subject_treatment: Form the prompt's sign words from perforations in a plate with soft inner light, continuous supports and a readable unlit state, every character exact.
  color_and_tone: Contrast between plate and light, readable when the light is off.
  lighting_and_shadow: Contained, even inner light with a limited halo.
  texture_and_material: Conceptual plate of steady thickness with clear, legible holes.
  camera_and_composition: Text with a reserve around it and fixings outside the characters.
  atmosphere_and_mood: A sober night presence that is still recognizable by day.
  rendering_and_quality: Clean sign shown on and off with identical geometry.
  creative_brief: "Perforated Light Sign Systems: letters and symbols formed by perforations in a plate lit softly from within, readable day and night. Carry it through perforated letters, soft inner light, day and night, continuous supports. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: perforated letters; soft inner light; day and night; continuous supports
