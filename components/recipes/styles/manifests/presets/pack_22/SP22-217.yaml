visualDna:
  aesthetic: >-
    Define forms with precise vector curves and cleanly bounded color areas, using gradients to model
    the actual volume rather than as generic decoration.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Let curves clarify
    existing contours without simplifying away distinctive features.
  color_and_tone: >-
    Keep the requested palette. Confine smooth tonal transitions to surfaces where they describe form;
    do not replace specified colors or impose a branded gradient scheme.
  lighting_and_shadow: >-
    Follow the requested illumination and let contained gradients express its existing falloff without
    inventing a light source or glow.
  texture_and_material: >-
    Maintain a clean digital surface with smooth contours and no print grain. Preserve the represented
    material instead of making every surface glossy.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Vector curves do not require
    a poster, icon sheet or alternate layout.
  atmosphere_and_mood: >-
    Retain the requested setting and mood; smooth vector rendering does not introduce a theme or
    narrative on its own.
  rendering_and_quality: >-
    Keep curves deliberate and gradients attached to the volumes they describe. Resolve silhouette and
    large color areas before small transitions.
avoidRules:
  - generic gradients detached from the depicted form
  - unrequested glow or surface texture
  - details that alter identity or function
