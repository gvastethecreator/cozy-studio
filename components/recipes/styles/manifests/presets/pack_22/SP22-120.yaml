visualDna:
  aesthetic: >-
    Use a structured ink drawing with a strong outer silhouette and selective internal lines that
    explain connections, overlaps and surface form. Keep construction marks subordinate to the
    image.
  subject_treatment: >-
    Preserve the requested identity, proportions, anatomy where relevant, and action. Describe
    visible structure without injuring or redesigning the subject.
  color_and_tone: >-
    Respect the requested palette and contrast. Keep open values around the subject and concentrate
    darker hatching only where it supports form; do not force monochrome.
  lighting_and_shadow: >-
    Follow the requested light. Align line weight and hatching with its existing shadow pattern
    instead of inventing another source or changing the time of day.
  texture_and_material: >-
    Fit directional hatching to each form's geometry. Keep marks selective so the depicted surface
    remains distinct from the ink used to describe it.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and composition. Describe structure within the given
    frame without changing its layout.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Structural linework changes the rendering, not the
    scene's genre or emotional intention.
  rendering_and_quality: >-
    Give the silhouette first priority, then use a clear secondary level of detail. Keep line groups
    readable and omit annotations that were not requested.
avoidRules:
  - unrequested exposed organs, injury, or anatomical alteration
  - unrequested labels, measurements, or diagram annotations
  - crosshatching that obscures the silhouette
  - unrequested horror or violence
