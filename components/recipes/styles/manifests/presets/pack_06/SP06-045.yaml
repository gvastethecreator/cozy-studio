visualDna:
  aesthetic: 'Collagraph: a printing plate collaged from card, sand, fabric, glue and leaves, inked both into its recesses and on its surface and printed with deep embossing.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Earthy layered inks, rust, ochre, slate and moss, often two colors wiped differently into the same plate.
  lighting_and_shadow: 'Tone comes from how much ink each material holds: rough sand prints dark, smooth glue prints pale.'
  texture_and_material: Deeply embossed paper, gritty sand textures, fabric weave imprints, crisp cut-card edges, varnish-smooth light areas.
  camera_and_composition: Keep the requested framing; forms simplified into collaged shapes with distinct material textures.
  atmosphere_and_mood: Earthy, tactile and experimental, a print you want to touch.
  rendering_and_quality: Heavy material textures and embossing define each area; no fine line drawing and no recognizable pasted photos.
  key_features: collaged material plate; sand and fabric textures; deep embossing; earthy intaglio-and-relief inking; cut-card shape edges
  creative_brief: "Collagraph: a printing plate collaged from card, sand, fabric, glue and leaves, inked both into its recesses and on its surface and printed with deep embossing. Carry it through collaged material plate, sand and fabric textures, deep embossing, earthy intaglio-and-relief inking, cut-card shape edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
