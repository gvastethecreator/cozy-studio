visualDna:
  aesthetic: 'Pyro volume simulation: fire and smoke rendered as a physically simulated volume, with rolling pyroclastic billows, turbulent vortices and incandescent cores.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Blackbody fire from white-yellow core through orange to deep red edges, feeding into charcoal and brown smoke.
  lighting_and_shadow: The fire is the key light, lighting its own smoke from inside and throwing flickering orange onto nearby surfaces.
  texture_and_material: Dense cauliflower billows, thin wispy tendrils at the edges, embers and sparks advected by the flow.
  camera_and_composition: Keep the requested location and camera; the plume shows a clear direction of rise and expansion.
  atmosphere_and_mood: Dangerous and immense, heat you can read in the motion.
  rendering_and_quality: High-resolution volumetric render with self-shadowed smoke and temperature-driven emission; no painted or cartoon flames.
  key_features: pyroclastic billows; blackbody color ramp; self-lit smoke; advected embers; clear rise direction
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies VFX Simulation (Fire/Smoke) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
