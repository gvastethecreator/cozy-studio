visualDna:
  aesthetic: Relief-print illustration organized into solid ink masses and deliberate carved gaps.
  subject_treatment:
    Translate the requested forms into interlocking positive and negative shapes. Preserve defining
    proportions and recognizable contours; simplify internal detail rather than changing identity.
  color_and_tone:
    Use a dark ink and a lighter ground with decisive value separation. Honor explicitly requested
    colors; use any accent only where it improves separation.
  lighting_and_shadow:
    Describe illumination through a small number of joined shadow masses. Carve narrow light
    channels into the ink instead of using photographic gradients.
  texture_and_material:
    Place short cut marks along curvature and load-bearing edges. Keep broad ink areas quiet,
    with occasional transfer irregularity confined to their boundaries.
  camera_and_composition:
    Preserve requested camera and framing. Use scale hierarchy and open gaps between adjacent
    silhouettes to keep the existing composition legible.
  atmosphere_and_mood:
    Express the requested mood through the weight and spacing of ink, without importing a narrative
    genre or mandatory motif.
  rendering_and_quality:
    Maintain crisp carved boundaries, confident solid blacks and selective marks. Do not cover
    the whole image with uniform distress.
avoidRules:
  - uniform scratch overlay
  - accidental closed negative spaces
  - photographic gradient fills
