visualDna:
  aesthetic: 'Seamless pixel tileset sheet: an environment assembled from repeating square pixel tiles of grass, stone, water and walls that fit together seamlessly into a scene.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; build the subject's environment from clearly repeating seamless tiles.
  color_and_tone: Cohesive limited palette shared across tiles, kept consistent across the whole image.
  lighting_and_shadow: Consistent top-left light on every tile, kept consistent across the whole image.
  texture_and_material: Repeating stone, grass and water tiles with seamless edges.
  camera_and_composition: Top-down or side view showing the tile rhythm.
  atmosphere_and_mood: Keep the requested mood with orderly handcrafted worlds.
  rendering_and_quality: Clean tiling with subtle variation tiles, kept consistent across the whole image.
  creative_brief: "Seamless pixel tileset sheet: an environment assembled from repeating square pixel tiles of grass, stone, water and walls that fit together seamlessly into a scene. Carry it through seamless tiles, repeating rhythm, shared palette, variation tiles. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: seamless tiles; repeating rhythm; shared palette; variation tiles
