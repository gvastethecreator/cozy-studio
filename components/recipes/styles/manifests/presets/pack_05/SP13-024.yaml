visualDna:
  aesthetic: Anime key frame of the peak instant of the requested action, placed at the hub of radiating structural lines, with one element of the scene enlarged in the foreground for extreme scale contrast.
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the peak-moment framing with radiating structure lines and a huge-scale foreground element, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; strongest value contrast sits at the hub, with restrained crimson or gold accents only if already present.
  lighting_and_shadow: Contrast concentrated at the point of action using the existing light; no flashes, explosions or sparks.
  texture_and_material: Decisive hard-edged forms; existing debris or droplets only when the prompt already has them.
  camera_and_composition: Low wide angle with the foreground element filling a third of the frame and scene lines radiating from the action point.
  atmosphere_and_mood: Monumental emphasis on one instant, weighty without triumph or aggression.
  rendering_and_quality: Hard controlled strokes, stable structure and a single unmistakable focal hub.
  key_features: peak instant at the hub; radiating structural lines; huge-scale foreground element; low wide angle; hub-centered contrast
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Monumental Impact Burst Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
