visualDna:
  aesthetic: >-
    Quiet-spaced line design: long uninterrupted fine contours, broad matte color fields, and
    deliberate blank intervals.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Let existing
    contours run in phrase-like lengths with pauses, without music symbols or instruments.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor slate blue, pale
    cyan, ivory, and a faint warm neutral; preserve requested colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep illumination soft and even with clear
    plane separation; avoid stage lighting and bloom.
  texture_and_material: >-
    Apply texture only to materials already present. Use clean matte fills with very little
    grain; add no decorative notation or sound marks.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let existing empty areas
    provide rhythm without changing count or positions.
  atmosphere_and_mood: >-
    Keep the requested emotion; quiet is mark density and spacing, not a mood instruction.
  rendering_and_quality: >-
    Maintain fine lines, open midtones, and unbroken feature edges without soft-focus drift.
  key_features: >-
    Long fine contours; broad matte fields; intentional blank intervals; low mark density.
  creative_brief: >-
    Use long fine contours; broad matte fields; intentional blank intervals; low mark density.
    Keep the requested subjects, action, setting, palette, framing and mood; add no scene
    content.
