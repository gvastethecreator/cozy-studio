visualDna:
  aesthetic: >-
    Seedpunk builds a living-form rhythm from nested pod silhouettes, varied seed-scale repeats and small
    dispersed marks, with contained shapes opening into space.
  subject_treatment: >-
    Preserve the requested subject and anatomy. Use rounded nested contours or small repeated marks only
    where existing forms support them; do not turn the subject into a plant, seed packet or archive.
  color_and_tone: >-
    Keep the user's palette, using soil, clay, deep green or marigold accents only when compatible.
    Maintain separation among nested forms and avoid a fixed botanical scheme.
  lighting_and_shadow: >-
    Follow the requested light. Use broad matte shadow shapes to reveal shell-like layers without adding
    dew, glow or a new source.
  texture_and_material: >-
    Preserve existing materials. Where organic surfaces are present, use subtle dry grain and clear
    outer-versus-inner surface contrast; do not add soil or paper texture everywhere.
  camera_and_composition: >-
    Preserve camera, crop and placement. Use nested scale and measured spacing within existing shapes
    rather than imposing a drawer grid or botanical still life.
  atmosphere_and_mood: >-
    Suggest latent growth and stored potential through compact-to-open rhythm, not a harvest, archive or
    community story.
  rendering_and_quality: >-
    Keep pod-like silhouettes clean, repeat marks sparse and local, and surface variation controlled so
    small forms remain distinct at thumbnail size.
avoidRules:
  - Do not add seed packets, drawers, planters, flowers or an archive unless requested.
  - Avoid decorative dots that erase the subject's real structure.
  - Do not impose a childlike palette or uniform paper grain.
