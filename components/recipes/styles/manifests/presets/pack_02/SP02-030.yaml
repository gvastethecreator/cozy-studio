  creative_brief: >-
    Apply Nature Documentary as a cinematic-media preset over prompt X: preserve the user's
    requested subject, then route lens behavior, palette, light, signal or film texture,
    composition, mood, and final media craft through Premium nature documentary, BBC Earth-style
    patience, global spectacle, Telephoto reverence, slow-motion clarity, natural spectacle, Ultra
