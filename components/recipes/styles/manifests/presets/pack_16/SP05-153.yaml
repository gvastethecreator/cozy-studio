visualDna:
  aesthetic: >-
    Techno-noir digital anime combines luminous edges, fine scan-like marks and
    ornate dark shadow.
  subject_treatment: >-
    Keep the requested identity and action intact. Place synthetic glow only on existing
    luminous forms.
  color_and_tone: >-
    When palette is open, use cyan, black, violet and screen-green accents sparingly. Keep
    explicit color choices intact.
  lighting_and_shadow: >-
    Use restrained monitor-like bloom, scanline glow and synthetic rim on existing luminous
    forms.
  texture_and_material: >-
    Use fine horizontal marks and controlled ink grain where they support the depicted
    surface; keep material detail prompt-led.
  camera_and_composition: >-
    Respect the supplied frame and viewpoint; let luminous edges contrast with dark masses.
  atmosphere_and_mood: >-
    A cool techno-gothic tension is available when it matches the prompt's mood.
  rendering_and_quality: >-
    Keep luminous edges sharp, bloom contained and dark contours legible against softly
    integrated backgrounds.
  key_features: >-
    Luminous edge; restrained monitor-like bloom; fine scan-like marks; ornate
    shadow against clean digital surfaces.
  creative_brief: >-
    Apply synthetic light and scan-like detail only where compatible with the
    requested image. Preserve its content and composition.
