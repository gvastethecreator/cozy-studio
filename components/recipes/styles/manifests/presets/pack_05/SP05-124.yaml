visualDna:
  aesthetic: >-
    Build the graphic anime treatment from razor-clean contours with crisp ultramarine vectors and
    nested curves and pointed framing wedges around a focal area. Let taut accelerating curves
    that converge without implying a new action set its rhythm; use electric blue, ink black,
    white, and cool cyan for color and clean graphic layers with hard-edged glow for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use razor-clean contours with crisp ultramarine
    vectors for edge work, nested curves and pointed framing wedges around a focal area for form
    simplification, and taut accelerating curves that converge without implying a new action only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with electric blue, ink black, white, and cool cyan. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard blue-white separation with restrained glow. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean graphic layers with hard-edged glow, preserving depicted
    materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use concentric focal hierarchy and compressed visual
    space within the given crop to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey concentrated visual focus and clear hierarchy,
    while preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with sharp vector lines, compressed spacing, and bright blue value accents; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    razor-clean contours with crisp ultramarine vectors; nested curves and pointed framing wedges
    around a focal area; electric blue, ink black, white, and cool cyan; taut accelerating curves
    that converge without implying a new action; clean graphic layers with hard-edged glow;
    concentric focal hierarchy and compressed visual space within the given crop.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with razor-clean contours
    with crisp ultramarine vectors, nested curves and pointed framing wedges around a focal area,
    and electric blue, ink black, white, and cool cyan; use taut accelerating curves that converge
    without implying a new action only where movement is already present, and apply clean graphic
    layers with hard-edged glow as the drawing finish.
