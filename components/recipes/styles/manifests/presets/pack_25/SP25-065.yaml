visualDna:
  aesthetic: 'Open-Frame Utility: partial borders, shared guide lines and sober grounds define regions without boxing everything into cards.'
  subject_treatment: Divide the prompt's workspace with partial borders and shared guides, leaving open the sides that add no grouping; keep requested labels exact.
  color_and_tone: Close neutral values for surfaces and high contrast for text and focus.
  lighting_and_shadow: Separation carried by space, line and contrast on flat surfaces.
  texture_and_material: Sober planes and lines of consistent weight on plain grounds.
  camera_and_composition: Guides align content across open regions so no block needs its own frame.
  atmosphere_and_mood: Technical lightness and one continuous workspace, finished and deliberate.
  rendering_and_quality: Partial borders end with intent and keep interactive limits clear.
  creative_brief: "Open-Frame Utility: partial borders, shared guide lines and sober grounds define regions without boxing everything into cards. Carry it through partial borders, shared guides, open regions, high-contrast focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
