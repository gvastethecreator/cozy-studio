visualDna:
  aesthetic: >-
    Prop Design acts as a transferable illustration router: start from Prop-design presentation
    style with isolated artifact focus, material storytelling, and game-ready readability, Isolated,
    orthographic view, material breakdown and production concept-art system built from iteration
    discipline, silhouette testing, material exploration, design readability, and pitch-ready visual
    decisions, then apply the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Clean technical-art contouring with form-break accents,
    silhouette-first readability, and callout-friendly structure; preserve the requested subject
    while routing it through design exploration, asset logic, value blocking, scale cues, iteration
    rows, paintover marks, or production-readability constraints, keeping the requested identity,
    silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Material render, PBR-reference, asset-library spectrum; use color as concept
    decision-making: mood scripts, material swatches, faction accents, environment atmosphere, asset
    tier contrast, or readable pass separation, with deliberate value grouping, accent control, and
    process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Studio, product-isolation light, neutral-pedestal, process-led value
    structure, readable highlights, and style-specific shadow behavior; shape light for ideation
    clarity through value block-in, keyframe contrast, material test highlights, callout
    illumination, or pitch-frame atmosphere, so value structure supports the illustration process
    and does not overwrite the requested content.
  texture_and_material: >-
    Render Wear and tear, production design clarity, iteration logic, silhouette readability,
    material exploration, and concept-art decision pressure; surface detail should reveal brush
    passes, photobash integration, low-poly facets, callout texture, massing blocks, costume
    fabrics, foliage clusters, or weapon material tiers when named, keeping material scale coherent
    and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Compose for Prop Design using its key spatial cues: Isolated,
    orthographic view, material breakdown; compose through production hierarchy, variants,
    orthographic logic, isometric staging, silhouette grids, iteration boards, or cinematic keyframe
    balance without locking one finished illustration, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Valuable, useful, item-card significance, inventory worth; derive mood from
    exploration, worldbuilding pressure, tactical design, creature unease, kitbash utility,
    cinematic intent, or production-room clarity, letting the style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with RPG item, detailed, asset-sheet polish, loot-table charm; finish with concept-art
    usefulness, readable decisions, controlled roughness, and no generic fantasy wallpaper or
    overpolished final render when iteration is intended, clean denoised surfaces where appropriate,
    and enough process evidence to make the style recognizable.
  key_features: >-
    Prop-design presentation style with isolated artifact focus, material storytelling, and
    game-ready readability; Isolated, orthographic view, material breakdown; Material render,
    PBR-reference, asset-library spectrum; Wear and tear, production design clarity, iteration
    logic, silhouette readability, material exploration, and concept-art decision pressure
  creative_brief: >-
    Apply Prop Design as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Prop-design presentation style with isolated artifact focus, material storytelling, and
    game-ready readability, Isolated, orthographic view, material breakdown, Wear and tear,
    production design clarity, iteration logic, silhouette readability, material exploration, and
    concept-art decision pressure without requiring the card image's original subject.
