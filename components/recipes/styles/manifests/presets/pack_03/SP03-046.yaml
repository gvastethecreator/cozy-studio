visualDna:
  aesthetic: >-
    Game Asset (PBR) acts as a transferable CGI-style router: start from Game asset PBR
    optimization, Asset ready PBR, normal map detail and hard-surface and product-CGI system built
    from bevel logic, manufactured surfaces, PBR maps, studio reflections, mechanical detailing, and
    premium reveal, then apply the 3D/render behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Normal map details; preserve the prompt subject while
    giving it engineered silhouette logic, panel hierarchy, assembly clarity, product-grade surface
    control, or UI-material precision, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Albedo map; use color as manufactured finish: anodized metal, gunmetal, glass
    tint, enamel, ceramic, product neutrals, neon gas, or controlled brand-neutral accents, with
    deliberate value grouping, exposure control, and medium-specific limits rather than generic
    color wash.
  lighting_and_shadow: >-
    Handle light through Marmoset asset viewer lighting, turntable glory; shape light through studio
    strips, rim edges, reflection cards, display glow, automotive flow lines, gemstone fire, or
    product reveal gradients, so value structure supports the renderer and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Roughness/Metalness, PBR surfacing; surface detail should show bevels, panel seams,
    normal maps, brushed metal, glass layers, stone facets, neon tubing, mechanical wear, or clean
    UI translucency, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for Game Asset (PBR): three quarter or orthographic
    framing, clean silhouette read, material highlights, controlled depth, and vertical card
    composition; compose for engineered readability through exploded spacing, hero compression,
    orthographic clarity, packshot discipline, part hierarchy, or premium macro scale, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Functional, clean, asset showcase; derive mood from precision, luxury, tactical
    engineering, clean retail desire, transhuman unease, or high-end interface tactility, letting
    the renderer alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Game ready, portfolio turntable; finish with exact edges, believable PBR response,
    controlled reflections, and no fake labels, muddy grime, or random greeble clutter, clean
    denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Game asset PBR optimization; Asset ready PBR, normal map detail; Albedo map;
    Roughness/Metalness, PBR surfacing; Lookdev camera for Game Asset (PBR): three quarter or
    orthographic framing, clean silhouette read, material highlights, controlled depth, and vertical
    card composition
  creative_brief: >-
    Apply Game Asset (PBR) as a CGI/render preset over prompt X: preserve the user's requested
    subject, then route modeling, shader response, lighting, material scale, composition, mood, and
    final render craft through Game asset PBR optimization, Asset ready PBR, normal map detail,
    Roughness/Metalness, PBR surfacing without requiring the card image's original subject.
avoidRules:
