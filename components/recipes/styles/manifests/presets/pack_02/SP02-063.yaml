visualDna:
  aesthetic: 'Cinematic chiaroscuro key: one large soft source high to the side with heavy negative fill, producing deep contrast ratios and sculpted faces.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Warm umber highlights, near-black shadows, muted period grade.
  lighting_and_shadow: Single key at 45 degrees and above, black flags on the fill side for an 8:1 ratio, a lit triangle on the shadow cheek.
  texture_and_material: Skin, wool and wood modeled by soft-edged falloff into darkness.
  camera_and_composition: Keep the requested framing; faces turned toward the key.
  atmosphere_and_mood: Grave and intimate, a hush before a decision.
  rendering_and_quality: Low-key film exposure with detail kept in the midtones.
  key_features: single high side key; negative fill; 8:1 contrast ratio; lit cheek triangle; umber grade
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cinematic Chiaroscuro Key as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
