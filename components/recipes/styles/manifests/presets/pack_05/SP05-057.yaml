visualDna:
  aesthetic: >-
    A refined, wistful style pairing sleek broken contours, delicate curved line accents, and
    polished highlight bands with softened edges and gentle color transitions.
  subject_treatment: >-
    Preserve the subject’s identity and proportions. Let its existing contours alternate between
    clean, sleek edges and a few delicate, interrupted lines.
  color_and_tone: >-
    Blend muted rose, apricot, pale gold, and blue-gray, keeping dark values soft and the
    warm-cool balance delicate.
  lighting_and_shadow: >-
    Use soft-edged cel shadows with thin sunset-like highlights across existing forms; do not
    introduce ruins or a literal sunset.
  texture_and_material: >-
    Retain the requested materials. Suggest polish with restrained luminous streaks, fine
    surface lines, and gentle tonal transitions.
  camera_and_composition: >-
    Keep the prompt’s camera and layout. Use graceful curves and a slight offset in detail
    density to create a tender, unsettled rhythm.
  atmosphere_and_mood: >-
    Express melancholy through softened contrast, quiet spacing, and delicate interruptions,
    without adding flowers, alarms, or a romance scene.
  rendering_and_quality: >-
    Combine precise silhouettes with soft shadow edges, clean gradients, and sparse fine detail;
    avoid glossy over-rendering.
  key_features: >-
    Sleek interrupted contours; soft cel shadows; rose-apricot and blue-gray palette; delicate
    polished glints.
  creative_brief: >-
    Preserve the specified subject and setting. Apply refined contours, gentle rose-and-blue
    transitions, and sparse polished highlights; add no suit, ruins, flowers, or alarm devices.
