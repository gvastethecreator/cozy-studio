visualDna:
  aesthetic: 'Scrap Princess OSR art: chaotic raw scribbled line, frantic body horror, splattered ink, collage fragments and punk outsider intensity.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in chaotic raw scribbled line with splattered ink and body-horror intensity. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with splatter and sickly accents, true to the Scrap Princess palette.
  lighting_and_shadow: Harsh raw contrast, lit the way Scrap Princess lights its scenes.
  texture_and_material: Frantic scribble, ink splatter and collage scraps, with the surface finish of Scrap Princess.
  camera_and_composition: Frantic crowded composition, framed the way Scrap Princess composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with feverish outsider horror.
  rendering_and_quality: Raw scribbled OSR horror art, in the recognizable hand of Scrap Princess.
  creative_brief: "Scrap Princess OSR art: chaotic raw scribbled line, frantic body horror, splattered ink, collage fragments and punk outsider intensity. Carry it through Scrap Princess scribble, splatter, body horror. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Scrap Princess scribble; splatter; body horror
