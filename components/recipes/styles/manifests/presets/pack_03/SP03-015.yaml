  camera_and_composition: >-
    Structure the image through scale rhythm, spacing, and composition rules shaped by fingerprinted
    clay, stop-motion pose increments, miniature set lighting, handmade material charm; compose
    through projection, topology readability, object grouping, axis discipline, exploded or arranged
    parts, or stylized scale rhythm, with scale, spacing, edge rhythm, and visual hierarchy doing
