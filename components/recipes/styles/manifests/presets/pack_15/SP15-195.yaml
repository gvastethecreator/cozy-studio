  color_and_tone: Golden brown, olive and bottle green kelp in cool blue-green water with sun shafts.
  lighting_and_shadow: Sun shafts slanting down through the kelp canopy into cool green gloom below.
  texture_and_material: Glossy kelp blades, gas-filled floats, woven kelp rope, driftwood and sea urchins.
  camera_and_composition: Tall vertical frames with kelp stalks rising like columns and figures climbing them.
  atmosphere_and_mood: Swaying, calm and cathedral-like, a forest that breathes with the tide.
  rendering_and_quality: Luminous underwater illustration with layered swaying stalks and soft light shafts.
