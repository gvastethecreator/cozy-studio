visualDna:
  aesthetic: 'The Behemoth Castle Crashers (2008) look: Dan Paladin thick-outline 2D cartoon, round-headed characters with simple faces, bright flat colors and side-scrolling co-op brawling.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as round-headed thick-outline cartoon figures with tiny dot eyes and chunky gear. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright flat grass green, sky blue and primary colors.
  lighting_and_shadow: Flat cartoon light with no gradients, lit the way Castle Crashers 2008 lights its levels.
  texture_and_material: Thick outlines and flat vector fills, with the in-engine surface finish of Castle Crashers 2008.
  camera_and_composition: Side-scrolling brawler view, framed the way Castle Crashers 2008 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with silly co-op mayhem.
  rendering_and_quality: Authentic cartoon brawler screen, matching real Castle Crashers 2008 screenshots.
  key_features: Castle Crashers thick outlines; round heads; co-op brawl
  creative_brief: 'The Behemoth Castle Crashers (2008) look: Dan Paladin thick-outline 2D cartoon, round-headed characters with simple faces, bright flat colors and side-scrolling co-op brawling. Carry it through Castle Crashers thick outlines, round heads, co-op brawl. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
