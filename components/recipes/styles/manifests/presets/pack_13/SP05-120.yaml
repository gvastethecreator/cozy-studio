  color_and_tone: Thermal white, red, amber and cold blue, true to the Ghost in the Shell SAC_2045 palette.
  lighting_and_shadow: Heat-signature glow, lit the way Ghost in the Shell SAC_2045 lights its scenes.
  texture_and_material: Cel-shaded CG with thermal gradients, with the surface finish of Ghost in the Shell SAC_2045.
  camera_and_composition: Tactical thermal compositions, framed the way Ghost in the Shell SAC_2045 composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cold tactical scan.
  rendering_and_quality: Cel-shaded thermal CG frame, in the recognizable hand of Ghost in the Shell SAC_2045.
  key_features: SAC_2045 thermal; heat signatures; tactical
  creative_brief: "Production I.G and Sola Ghost in the Shell SAC_2045 look (2020): cel-shaded CG, tactical thermal views, heat signatures and cold cyber operations. Carry it through SAC_2045 thermal, heat signatures, tactical. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
