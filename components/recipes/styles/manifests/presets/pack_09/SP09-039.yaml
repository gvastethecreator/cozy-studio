visualDna:
  aesthetic: 'Frosted: a crust of feathery hoarfrost crystals growing over the target''s surfaces.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: hoarfrost crystals grow in feathery spikes over the target, thicker on edges.'
  color_and_tone: White and pale blue frost over darker surfaces, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Cold backlight sparkling on crystals, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Feathery hoarfrost needles and rime crust, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Cold, crisp, silent and delicate, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: feathery hoarfrost needles; rime crust; cold sparkle
  creative_brief: "Frosted: a crust of feathery hoarfrost crystals growing over the target's surfaces. Carry it through feathery hoarfrost needles, rime crust, cold sparkle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
