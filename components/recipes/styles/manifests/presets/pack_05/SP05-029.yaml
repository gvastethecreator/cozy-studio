  color_and_tone: Punk pink, lime green, sky blue and suburban beige.
  lighting_and_shadow: Bright suburban light with sudden flashes and explosions.
  texture_and_material: Loose energetic cel, manga panel inserts and rough smears.
  camera_and_composition: Frantic cuts, manga panel layouts and wild angles.
  atmosphere_and_mood: Keep the requested mood with chaotic adolescent rush.
  rendering_and_quality: Frenetic 2000 Gainax frame with punk rock energy and manga panel cuts.
  key_features: FLCL chaos; Sadamoto designs; manga panels; suburban robots
  creative_brief: "Gainax FLCL look (2000) with Yoshiyuki Sadamoto designs: chaotic punk energy, manga-panel cutaways, suburban towns, giant robots bursting out and rock-driven editing. Carry it through FLCL chaos, Sadamoto designs, manga panels, suburban robots. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
