visualDna:
  aesthetic: 'High-Contrast Quiet UI: strong contrast reserved for text, focus and actions while large areas of the screen stay silent.'
  subject_treatment: Reserve strong contrast in the prompt's screen for reading, focus and actions, leaving wide calm areas around them; keep requested labels exact.
  color_and_tone: White and charcoal with one optional accent, every grey still readable.
  lighting_and_shadow: Separation through value and space on an even, quiet surface.
  texture_and_material: Uniform surfaces, minimal borders and precise states with clear control edges.
  camera_and_composition: Few attention zones, one clear main column and grouped secondary controls.
  atmosphere_and_mood: Visual silence and decisiveness, energy focused on the current task.
  rendering_and_quality: Focus stands out without the whole interface sharing one contrast level.
  creative_brief: "High-Contrast Quiet UI: strong contrast reserved for text, focus and actions while large areas of the screen stay silent. Carry it through silent areas, reserved contrast, one main column, clear focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: silent areas; reserved contrast; one main column; clear focus
