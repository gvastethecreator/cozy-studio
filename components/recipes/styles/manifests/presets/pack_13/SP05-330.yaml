visualDna:
  aesthetic: 'Shigeru Mizuki yokai manga look: cartoony simple characters against extremely detailed stippled realistic backgrounds, catalog-like yokai portraits and deadpan folklore.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people cartoony and simple, and spirits as odd deadpan yokai. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with dense stipple and hatching, true to the Shigeru Mizuki palette.
  lighting_and_shadow: Dim eerie light via stippling, lit the way Shigeru Mizuki lights its scenes.
  texture_and_material: Dense stippled backgrounds and simple cartoon figures, with the surface finish of Shigeru Mizuki.
  camera_and_composition: Catalog-like portraits and detailed scenes, framed the way Shigeru Mizuki composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with deadpan folkloric eeriness.
  rendering_and_quality: Classic yokai manga illustration, in the recognizable hand of Shigeru Mizuki.
  key_features: Shigeru Mizuki stipple; cartoon figures; yokai catalog
  creative_brief: "Shigeru Mizuki yokai manga look: cartoony simple characters against extremely detailed stippled realistic backgrounds, catalog-like yokai portraits and deadpan folklore. Carry it through Shigeru Mizuki stipple, cartoon figures, yokai catalog. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
