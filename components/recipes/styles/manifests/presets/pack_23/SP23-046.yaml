visualDna:
  aesthetic: >-
    Pair expressive ink contours with irregular but controlled fills. Set compact areas of shape against
    fine extensions, keeping line energy varied without turning it into distortion.
  subject_treatment: >-
    Preserve requested identity, anatomy, count, pose, action and proportions. Keep irregularity in the
    mark-making; change anatomy or reinterpret form only when the user explicitly authorizes it.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Use irregular fill edges as a graphic
    treatment rather than forcing unusual colors or extreme contrast.
  lighting_and_shadow: >-
    Follow the requested light and shadow structure. Keep line weight and fill from inventing shadows,
    highlights or spatial drama not present in the request.
  texture_and_material: >-
    Vary ink density and fill edges selectively while preserving material identity. Avoid uniform
    speckling, blanket noise or surface effects that change the depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, arrangement and spatial relationships. Keep
    perspective faithful to the request; do not impose framing or staged composition.
  atmosphere_and_mood: >-
    Preserve the user's requested mood. Energetic contours and irregular fills do not require changes
    to the subject, theme or narrative.
  rendering_and_quality: >-
    Maintain a clear hierarchy between compact filled shapes and fine line extensions. Keep the subject
    recognizable and use irregularity with intent rather than exaggerating it everywhere.
avoidRules:
  - unrequested anatomy, identity or proportion changes
  - unrequested thematic or narrative additions
  - forced unusual palette or extreme contrast
  - uniform ink noise, speckling or perspective distortion
