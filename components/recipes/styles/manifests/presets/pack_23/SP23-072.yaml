visualDna:
  aesthetic: 'Medieval herbal codex: flat stylized plant portraits with roots, leaves and flowers laid out whole on the page, sometimes with the creatures or people linked to the plant.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; present the subject as a whole stylized plant specimen or beside one.
  color_and_tone: Leaf greens, earthy root browns, flower reds and blues on vellum.
  lighting_and_shadow: Flat with light shading on leaves, kept consistent across the whole image.
  texture_and_material: Pigment washes, ink outlines, pale vellum and faint stains.
  camera_and_composition: Whole plant from root to flower centered and upright.
  atmosphere_and_mood: Keep the requested mood with curious healing lore.
  rendering_and_quality: Clear symmetrical specimen with naive stylization, kept consistent across the whole image.
  creative_brief: "Medieval herbal codex: flat stylized plant portraits with roots, leaves and flowers laid out whole on the page, sometimes with the creatures or people linked to the plant. Carry it through whole plant with roots, flat specimen, vellum, linked creature. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whole plant with roots; flat specimen; vellum; linked creature
