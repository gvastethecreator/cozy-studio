visualDna:
  aesthetic: >-
    Clear-lined illustration pairs a continuous silhouette with restrained soft volume. The exterior
    contour carries more weight than the interior marks, keeping the form distinct without excess detail.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep existing features recognizable;
    do not add eyes, limbs or character traits to inanimate subjects.
  color_and_tone: >-
    Prioritize the requested local colors and use a small, soft shadow range. Preserve color relationships
    and avoid letting shading replace the subject's actual palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep shading soft and contained within forms
    without adding a new source or unsupported highlights.
  texture_and_material: >-
    Keep surfaces clean and use small marks selectively. Preserve represented materials instead of
    replacing them with a generic illustration texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Clear contours do not require
    a specimen pose or a changed arrangement.
  atmosphere_and_mood: >-
    Keep the requested tone and setting. A character-oriented contour style does not anthropomorphize
    objects or add a narrative.
  rendering_and_quality: >-
    Use a heavier outer contour and lighter interior lines, with soft volume kept subordinate to shape.
    Preserve a continuous silhouette and avoid uniform line weight.
avoidRules:
  - unrequested anthropomorphic features
  - uniformly heavy interior linework
