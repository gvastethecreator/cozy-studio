visualDna:
  aesthetic: >-
    Source-informed video-game style router for original first-person survival-horror captures:
    industrial orbital freight corridors, analog devices, emergency light, maintenance clutter,
    hostile unseen threat pressure, and diegetic survival readability. Borrow the restrained
    first-person tension of Alien Isolation-like games, but land as a different fictional station
    with different signage shapes, creature logic, tools, UI icons, and architecture.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable first-person survival-horror
    screenshot subject: keep clear threat/object function, hiding route, device/tool scale,
    interactable affordance, and escape decision without copying source creatures or locations.
  color_and_tone: >-
    Use an orbital survival palette: sodium amber, emergency red, dirty teal, gunmetal grey, pale
    screen green, wet black, and worn white panels. Keep value grouping legible without pixel-art
    downgrade.
  lighting_and_shadow: >-
    Light the image through flickering tube lights, rotating alarm glow, flashlight cones, terminal
    phosphor, and occluded corridor darkness. Lighting must clarify the playable route, threat,
    focal subject, or objective and avoid generic cinematic bloom that destroys screenshot
    readability.
  texture_and_material: >-
    Build surfaces from worn bulkheads, cassette-future interfaces, condensation, rubber seals,
    scratched glass, cable bundles, and analog tech grime. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person camera, foreground hand/device/tool, tight corridor or service room
    route, cover/hiding affordance, distant threat clue, and one survival decision. Avoid retro
    pixel rendering and cinematic poster framing.
  atmosphere_and_mood: >-
    Carry an original orbital breach mood: anxious, industrial, hunted, analog, claustrophobic, and
    quiet.
  rendering_and_quality: >-
    Finish as coherent first-person survival-horror screenshot style, not pixel art and not concept
    art: diegetic motion tracker/device pips, sparse status lights, and environmental objective cues
    can appear. Maintain heavy-denoise clarity, readable route, and no readable signage/logos.
  key_features: >-
    Alien: Isolation gameplay screenshots; retro-futurist space-station survival horror capture with
    narrow corridors, maintenance panels, emergency alarms, and vulnerable first-person stealth;
    dirty cream plastic, warning orange, medical green monitors, deep black vents, and cold
    fluorescent blue; flickering tube lights, rotating alarm glow, flashlight cones, terminal
    phosphor, and occluded corridor darkness; worn bulkheads, cassette-future interfaces,
    condensation, rubber seals, scratched glass, cable bundles, and analog tech grime; first-person
    corridor composition with motion-tracker depth, hiding spots, doorway silhouettes, and
    claustrophobic route uncertainty; anxious, analog, hunted, industrial, and breath-held; HUD
    guidance: coherent survival UI can include a motion tracker, small objective marker, or diegetic
    device screen; avoid arcade overlays
  creative_brief: >-
    Use Orbital Freight Breach as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through first-person survival-horror references: analog devices, industrial
    corridors, hostile unseen pressure, diegetic HUD, and playable escape/hiding decisions. Avoid
    direct Alien Isolation cloning, exact station copies, creature silhouette copying, and retro
    pixel downgrade.
