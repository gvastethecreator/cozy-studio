visualDna:
  aesthetic: 'Brand-Shape Set Build: the product presented inside a studio set built from oversized versions of its own brand shapes and colors.'
  subject_treatment: Present the prompt's product inside a studio set made from giant physical versions of its own brand shapes and colors, the product and brand text kept exact.
  color_and_tone: The brand palette turned into bold physical set blocks with one neutral floor.
  lighting_and_shadow: Clean studio light with crisp shadows cast by the giant shapes.
  texture_and_material: Matte painted set pieces, smooth and handmade-looking, beside the real product.
  camera_and_composition: Product at the center of a graphic set, shapes framing but never covering it.
  atmosphere_and_mood: Playful, bold and art-directed, a brand you can walk into.
  rendering_and_quality: Crisp editorial set photography with the product and label razor sharp.
  creative_brief: "Brand-Shape Set Build: the product presented inside a studio set built from oversized versions of its own brand shapes and colors. Carry it through giant brand shapes, painted set, bold palette, product at center. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: giant brand shapes; painted set; bold palette; product at center
