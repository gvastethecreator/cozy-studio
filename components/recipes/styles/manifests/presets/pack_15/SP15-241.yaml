visualDna:
  aesthetic: 'Grimoirepunk: living spellbooks that breathe, bite and fly, with chained libraries, glowing illuminated diagrams, leather covers with eyes and pages turning in the wind.'
  subject_treatment: Keep the prompt's subject and setting; surround it with living spellbooks, chained shelves and glowing unreadable diagrams.
  color_and_tone: Aged parchment, oxblood leather and iron black with glowing violet and gold diagrams.
  lighting_and_shadow: Light rising from glowing open pages into dark library spaces.
  texture_and_material: Cracked leather, iron chains, brittle parchment, wax seals and dust.
  camera_and_composition: Towering chained shelves and books in flight across library halls.
  atmosphere_and_mood: Forbidden and alive, knowledge that wants to escape.
  rendering_and_quality: Detailed atmospheric illustration with glowing page light and aged textures.
  creative_brief: "Grimoirepunk: living spellbooks that breathe, bite and fly, with chained libraries, glowing illuminated diagrams, leather covers with eyes and pages turning in the wind. Carry it through living books, chained shelves, glowing diagrams, flying pages. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: living books; chained shelves; glowing diagrams; flying pages
