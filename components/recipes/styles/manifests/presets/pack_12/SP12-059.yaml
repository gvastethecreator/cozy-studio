visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Dota 2 gameplay screenshots: MOBA gameplay
    capture with isometric hero combat, lanes, ability bar, minimap, creep waves, and dense but
    disciplined teamfight readability. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Dota 2-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Dota 2-informed palette: Radiant green, Dire red, magic purple, gold UI accents, river
    blue, and dark terrain shadows. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through spell effects, tower beams, hero glows, fog-of-war darkness, and crisp
    particle silhouettes. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from fantasy terrain, hero equipment without copying exact heroes, creeps,
    towers, trees, stone paths, and polished ability effects. Materials should feel like in-engine
    game assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with high isometric battlefield view with lane hierarchy, team spacing, ability ranges,
    minimap, and objective pressure. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Dota 2-derived mood: competitive, tactical, magical, high-information, and tense. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: MOBA HUD is central: ability
    bar, minimap, hero status, cooldowns, items, and teamfight markers can be visible. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Dota 2 gameplay screenshots; MOBA gameplay capture with isometric hero combat, lanes, ability
    bar, minimap, creep waves, and dense but disciplined teamfight readability; Radiant green, Dire
    red, magic purple, gold UI accents, river blue, and dark terrain shadows; spell effects, tower
    beams, hero glows, fog-of-war darkness, and crisp particle silhouettes; fantasy terrain, hero
    equipment without copying exact heroes, creeps, towers, trees, stone paths, and polished ability
    effects; high isometric battlefield view with lane hierarchy, team spacing, ability ranges,
    minimap, and objective pressure; competitive, tactical, magical, high-information, and tense;
    HUD guidance: MOBA HUD is central: ability bar, minimap, hero status, cooldowns, items, and
    teamfight markers can be visible
  creative_brief: >-
    Use Dota Prismatic Hero Draft Arena as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Dota 2: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
