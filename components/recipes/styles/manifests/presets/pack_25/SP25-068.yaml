visualDna:
  aesthetic: 'Chromatic Function Blocks: bold color blocks consistently mark roles and actions, always backed by shape, icon or fixed position.'
  subject_treatment: Assign the prompt's screen areas to a few recurring color blocks by role, each backed by shape or position; keep requested labels exact.
  color_and_tone: Short palette of strong colors on neutral surfaces, meaning never carried by color alone.
  lighting_and_shadow: Flat rendering with hierarchy from mass and contrast.
  texture_and_material: Smooth blocks, precise edges and minimal interior detail.
  camera_and_composition: Each role keeps its place and relative size, with calm reading zones between.
  atmosphere_and_mood: Graphic energy and instant orientation, with room to rest the eye.
  rendering_and_quality: Roles verified in greyscale and with complete labels.
  creative_brief: "Chromatic Function Blocks: bold color blocks consistently mark roles and actions, always backed by shape, icon or fixed position. Carry it through role color blocks, shape backup, fixed positions, neutral surfaces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: role color blocks; shape backup; fixed positions; neutral surfaces
