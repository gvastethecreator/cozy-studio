visualDna:
  aesthetic: >-
    Digital anime linework organized by repeated geometry, measured axes and controlled
    value contrast.
  subject_treatment: >-
    Preserve the requested subject and action. Use abstract diagram-like contours only where
    they clarify existing forms.
  color_and_tone: >-
    Retain explicit hues; if none are given, rely on value separation and one restrained
    accent.
  lighting_and_shadow: >-
    Use a defined rim, compact glow and blocked shadow to clarify form; keep effects
    subordinate to the subject.
  texture_and_material: >-
    Fine etched or chalk-like marks may describe existing surfaces; keep them nonverbal and
    subordinate to the subject.
  camera_and_composition: >-
    Retain the requested camera; measured axes, repetition or symmetry may organize existing
    shapes when compatible.
  atmosphere_and_mood: >-
    Use visual constraint and spacing to support the mood requested in the prompt.
  rendering_and_quality: >-
    Balance crisp geometry and ink edges with softly painted backgrounds; preserve
    readability and limit glow.
  key_features: >-
    Repeated geometry; measured axes; rule-like spacing; fine nonverbal marks; rim light and
    compact glow.
  creative_brief: "Apply geometric line organization and restrained light to existing forms. Preserve the prompt's content and frame; markings remain abstract and nonverbal. Use it as a reusable look on any subject."
