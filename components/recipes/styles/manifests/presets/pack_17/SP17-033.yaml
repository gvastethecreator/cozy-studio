  color_and_tone: Warm ivory paper, clean black ink, open white space, and optional pale gray wash kept smooth and sparse.
  lighting_and_shadow: Flat symbolic light, clean shadow blocks, and no realistic night lighting.
  texture_and_material: Smooth paper, crisp ink, simple engraving marks, and tidy white gaps instead of dirty xerox grain.
  camera_and_composition: Centered tarot-card symmetry, tall vertical frame, simple arch or moon shape, and no readable titles or numbers.
  atmosphere_and_mood: Carry the prompt through Ominous, devotional, quiet, fatalistic, and non graphic; fatalistic omen calm, scholastic weirdness, bestiary curiosity, devotional monochrome, and archaic symbolic restraint; the tone should follow prompt X while preserving the preset's medieval-zine identity.
  rendering_and_quality: Clean monochrome illustration with controlled line weight, large shapes, and limited mark density.
  creative_brief: 'Original horror tarot visual system for medieval omens, relics, saints, beasts, or occult card imagery without text. Apply after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies a style grammar of Bone Tarot Horror Arcana; Black and white horror tarot card language with medieval bones; veils; crowns; moons; quiet omen symbols, mood, material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster, readable text, or sample-card composition.'
