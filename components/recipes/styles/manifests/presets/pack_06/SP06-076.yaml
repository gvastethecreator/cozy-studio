visualDna:
  aesthetic: 'Fumage: soot from a candle flame deposited on paper in plumes, the subject coaxed out of the smoke and refined by erasing and scratching.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Warm brown-black soot on white or cream paper, with only density variation; no added color.
  lighting_and_shadow: 'Light is the bare paper: erased and lifted areas become highlights inside velvety smoke darks.'
  texture_and_material: Velvety carbon plumes, feathery smoke edges, eraser lifts, needle-scratched lines and occasional small scorch marks.
  camera_and_composition: Keep the requested view; the subject condenses out of drifting soot with its edges dissolving into open paper.
  atmosphere_and_mood: Ethereal and dark, forms half-summoned from vapor.
  rendering_and_quality: Delicate soot gradients with crisp lifted highlights; no brush strokes or ink washes.
  key_features: candle soot plumes; eraser-lifted highlights; feathery edges; scorch marks; brown-black on cream
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fumage (Smoke Art) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
