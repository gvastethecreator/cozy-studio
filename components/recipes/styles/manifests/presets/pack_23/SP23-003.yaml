visualDna:
  aesthetic: >-
    Fine contours, small luminous pigment areas and selective opaque highlights give existing forms
    a precise illuminated-miniature finish on a light ground.
  subject_treatment: >-
    Keep the requested identity, proportions and action clear. Concentrate ornamental detail only
    within requested forms and preserve the silhouette without adding accessories.
  color_and_tone: >-
    Use a light, restrained ground and small vivid areas drawn from the requested palette. Do not
    make gold or another metallic color mandatory.
  lighting_and_shadow: >-
    Place small opaque highlights on already lit planes and keep shadow shapes compact. Respect the
    requested light direction without adding a source or halo effect.
  texture_and_material: >-
    Combine fine drawn contours with flat, controlled pigment accents. Keep surface texture subtle
    and distinct from the material of the depicted subject.
  camera_and_composition: >-
    Preserve the requested frame, scale, viewpoint and arrangement. Keep detail within the existing
    composition without adding a manuscript page, ornamental border or background panel.
  atmosphere_and_mood: >-
    Let the contrast between clean masses and precise highlights carry a quiet sense of refinement.
    Preserve the requested mood without implying a religious scene or historical setting.
  rendering_and_quality: >-
    Keep fine lines clean, highlights small and detail concentrated. Maintain a clear hierarchy
    between primary forms and decorative marks.
avoidRules:
  - unrequested halos or ornamental framing
  - unrequested metallic backdrop
