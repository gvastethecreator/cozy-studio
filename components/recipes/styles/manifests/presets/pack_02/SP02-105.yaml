  color_and_tone: Use warm yellow, candy red, chlorine blue, warm peach, and muted gray as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use warm flat illumination with slight heat-haze color shifts as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render cel-paint wobble, analog-TV softness, warm color haze, and rough pencil marks as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
