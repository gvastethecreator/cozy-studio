visualDna:
  aesthetic: >-
    Scratch-like marks reveal form through directional lights and broad value masses, using partial
    bright contours rather than outlining every edge.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Direct the light marks along
    existing form without adding scratches or changing the subject.
  color_and_tone: >-
    Keep the requested palette and value relationships. If a dark field is specified, reveal its
    values with lighter cuts; otherwise preserve the existing colors and tonal range.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Express existing highlights with incisive
    directional marks without adding a new source or making every shadow black.
  texture_and_material: >-
    Keep scratch-like marks purposeful and attached to form. Do not add decorative scratches,
    chalkboard texture or a uniform dark surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add a page, border, lettering
    or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Directional cuts describe light and volume without changing
    the depicted scene.
  rendering_and_quality: >-
    Establish the large silhouette and values first, then use a few clean directional cuts to reveal
    form. Keep bright details selective and legible.
avoidRules:
  - forced black field or monochrome palette
  - decorative scratches or chalkboard text
  - unrequested page, border, lettering, or period motifs
