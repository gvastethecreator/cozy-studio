visualDna:
  aesthetic:
    'Make bone an engineered material through a few articulated ivory plates, carved struts,
    marrow-like channels, or tendon and hide bindings integrated into compatible existing forms; keep
    bone construction distinctive without converting the whole scene.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; apply bone construction to selected
    compatible joints or structural accents while retaining the main material and architecture of the
    requested scene. Do not rebuild all furniture or the room in bone.
  color_and_tone:
    Center chalk ivory, warm bone, smoke, rawhide, and muted earth, with dark joints or one cool
    accent to separate construction layers; do not reduce bone identity to a cream palette alone.
  lighting_and_shadow:
    Use directional light and carved inner shadows to reveal wall thickness, joints, and
    articulated overlaps; keep the silhouette clear against the background.
  texture_and_material:
    Show polished, carved, or weathered bone as a localized worked component alongside the existing
    material, with tendon-like cord, hide, or sparse wood where compatible; keep anatomical detail stylized.
  camera_and_composition:
    Keep one or two braces or joints close to the focal form, with open intervals that show their support
    function; preserve the requested focal hierarchy and room layout.
  atmosphere_and_mood:
    Suggest austere, uncanny ingenuity and a tactile relationship between organic material
    and engineered form, while keeping the prompt's emotional tone.
  rendering_and_quality:
    Make bone joints, carved edges, and structural connections obvious at thumbnail scale;
    avoid relying on pale coloring or fine texture alone.
avoidRules:
  - a compulsory signal horn, rigging scene, or anatomical skeleton subject
  - bone color used as a substitute for visible bone construction
  - gore where it is not requested
  - unrequested full-scene conversion into bone architecture or all-bone furniture
