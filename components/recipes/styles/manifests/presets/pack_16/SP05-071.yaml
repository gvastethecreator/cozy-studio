  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with simple round Ghibli faces, dot-highlight eyes, natural bodies, and spirits as soft odd creatures. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Lacquer red, lantern gold, twilight teal and deep water blue.
  lighting_and_shadow: Warm lantern glow at dusk, steam haze and calm daylight over water.
  texture_and_material: Hand-painted backgrounds full of architectural detail, clean cel lines and drifting steam.
  camera_and_composition: Wide architectural establishing shots, quiet waiting moments, long corridors.
  atmosphere_and_mood: Keep the requested mood with dreamy liminal enchantment.
  rendering_and_quality: Classic Ghibli hand-drawn feature frame with rich painted detail.
  key_features: Ghibli bathhouse architecture; lanterns; spirits; steam; round simple faces
  creative_brief: "Hayao Miyazaki and Studio Ghibli feature animation as in Spirited Away: sprawling red-lacquer bathhouse architecture, lantern-lit spirit streets, quiet trains over water and strange gentle spirits. Carry it through Ghibli bathhouse architecture, lanterns, spirits, steam, round simple faces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
