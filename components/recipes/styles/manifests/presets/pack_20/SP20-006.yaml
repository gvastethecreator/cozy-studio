visualDna:
  aesthetic: >-
    Intaglio tonal illustration with a rocked plate tooth holding a broad velvety dark field, then
    scraped or burnished open into measured lights.
  subject_treatment: >-
    Preserve the requested silhouette, identity and proportions. Model existing planes by opening
    tonal light from dark fields rather than outlining every form with engraved lines.
  color_and_tone: >-
    Use the requested palette while retaining a strong dark-to-light range. Make midtones emerge
    between dense plate blacks and carefully lifted highlights.
  lighting_and_shadow: >-
    Follow the requested illumination. Let the brightest existing planes appear burnished from the
    inked field, with shadows remaining broad and connected.
  texture_and_material: >-
    Keep the fine plate-tooth softness consistent inside tonal areas. Avoid scratches or paper grain
    as substitutes for the even, ink-bearing mezzotint ground.
  camera_and_composition: >-
    Preserve the requested crop and viewpoint. Keep large dark passages inside the existing forms
    rather than turning them into a vignette around the image.
  atmosphere_and_mood: >-
    Carry the requested mood through the amount and placement of dark mass and the width of lifted
    lights; do not imply a genre or setting.
  rendering_and_quality: >-
    Maintain smooth, legible tonal transitions with selective crisp edges where forms meet. Avoid
    crosshatch as the primary value mechanism or crushed black fields that erase focal detail.
avoidRules:
  - engraved crosshatching as the primary value mechanism
  - vignette-shaped darkening outside depicted forms
  - crushed shadows that erase focal details
