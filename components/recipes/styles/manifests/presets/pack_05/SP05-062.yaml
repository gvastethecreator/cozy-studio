visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around split translucent lacquer
    planes, a few membrane-thin overlaps, and restrained crimson seams on the specified
    nonhuman or object form. For color and surface, retain prompted hues with
    deep red as a narrow accent against black, bone, or the subject's own material
    colors. Metamorphic tension can remain abstract and quiet; preserve the user's mood
    without implying hunger, violence, or identity loss
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through split translucent lacquer planes, a
    few membrane-thin overlaps, and restrained crimson seams on the specified nonhuman
    or object form; use detail selectively and keep the actual form easy to read. Do not
    introduce a person, face, body, robe, or humanoid silhouette. Add no unrequested
    subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain prompted hues with
    deep red as a narrow accent against black, bone, or the subject's own material
    colors. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use thin transmitted edges and
    localized red bounce only on the existing person-free subject. Keep shadow detail
    and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; layer polished lacquer against soft translucent
    film without converting the subject into a mask, emblem, or specimen. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    the requested subject count, action, pose, and framing while keeping the image
    entirely free of people. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Metamorphic tension can remain abstract
    and quiet; preserve the user's mood without implying hunger, violence, or identity
    loss. Darkness and tension are optional tonal pressure, never a requirement to add
    danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and split translucent lacquer planes, a few
    membrane-thin overlaps, and restrained crimson seams on the specified nonhuman or
    object form; keep focal edges crisp, texture controlled, and dark values legible.
    Avoid photoreal or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    split translucent lacquer planes, a few membrane-thin overlaps, and restrained
    crimson seams on the specified nonhuman or object form; retain prompted hues with
    deep red as a narrow accent against black, bone, or the subject's own material
    colors; use thin transmitted edges and localized red bounce only on the existing
    person-free subject; layer polished lacquer against soft translucent film without
    converting the subject into a mask, emblem, or specimen; and preserve the requested
    subject count, action, pose, and framing while keeping the image entirely free of
    people. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use split translucent lacquer planes, a few
    membrane-thin overlaps, and restrained crimson seams on the specified nonhuman or
    object form, retain prompted hues with deep red as a narrow accent against black,
    bone, or the subject's own material colors, use thin transmitted edges and localized
    red bounce only on the existing person-free subject, and layer polished lacquer
    against soft translucent film without converting the subject into a mask, emblem, or
    specimen; the prompt supplies all scene content. Do not add unrequested characters,
    objects, source-specific lore, readable symbols, or a default action.
