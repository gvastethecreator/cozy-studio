visualDna:
  aesthetic: 'Dance step diagram: old instruction-book footprints on a floor plan, with curved arrows and dotted paths showing the steps.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: translated into a floor diagram of footprints, turning arrows, dotted paths and partner positions, the subject implied by the pattern and small silhouette markers."
  color_and_tone: Black footprints and red arrows on cream paper, following the conventions of this drawing type.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Printed ink on old book paper with slight dot gain.
  camera_and_composition: Top-down floor view with the path spiraling or zigzagging.
  atmosphere_and_mood: Playful, rhythmic, nostalgic and clear, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dance Step Diagram as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: footprints; turning arrows; dotted paths; partner markers
