visualDna:
  aesthetic: 'Late-war anime drama: thin, slightly scratchy contours over brush-textured painted backgrounds, desaturated like old wartime photographs under a soft film grain.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Charcoal, ash grey, dust ochre and faded khaki, with worn crimson or tarnished gold as the only accent.
  lighting_and_shadow: Diffuse smoky daylight, soft graded shadows, and a narrow pale rim separating figures from haze.
  texture_and_material: Visible bristle marks in skies, walls and smoke; faint grain laid evenly over the cels.
  camera_and_composition: Keep the requested framing; asymmetric compositions set small figures against large, heavy painted masses.
  atmosphere_and_mood: Mournful gravity and the weight of consequence.
  rendering_and_quality: Thin lines with soft modelled cel shading, painterly backgrounds and restrained color.
  key_features: brush-textured painted backgrounds; desaturated wartime palette; thin scratchy contour; soft film grain; small figures against heavy masses
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Colossal War Drama as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
