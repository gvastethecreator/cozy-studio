visualDna:
  aesthetic: >-
    Drive tapered wedges through sweeping counter-curves and long motion arcs, combining streamlined
    contours with sharp directional accents.
  subject_treatment: >-
    Preserve the requested subject, pose, and action; translate existing shapes into tapered profiles and
    curved velocity lines without adding rockets or transit hardware.
  color_and_tone: >-
    Contrast midnight or oxide-dark masses with cream highlights and a small orange, red, or plasma-blue
    accent; retain explicit palette requests.
  lighting_and_shadow: >-
    Use narrow specular edge cuts and directional highlights to reinforce the sweep of each curve, with
    clear dark separations.
  texture_and_material: >-
    Pair smooth reflective accents with matte color planes and a few dusty or canvas-like marks, keeping
    texture secondary to velocity shapes.
  camera_and_composition: >-
    Maintain the requested camera and crop; use diagonals, arcs, and negative space to carry direction
    through the existing composition.
  atmosphere_and_mood: >-
    Create adventurous retro-futurist momentum through long curves, crisp edges, and controlled color
    sparks.
  rendering_and_quality: Keep wedges and arcs distinct at small scale, with clean specular cuts and no dense surface detail.
avoidRules:
  - literal rocket, train, or cockpit as a default subject
  - starfield or motion streaks that dominate the focal shape
  - reflection bands that merge adjacent contours
