visualDna:
  aesthetic: 'Techno-brutalist megablock: board-marked concrete modules stacked and cantilevered into a mountain-like mass, service conduits and cable stays strung across the facades, rust-black steel panels.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Warm grey concrete, rust black, oxide-orange rain streaks, pinpoints of sodium amber and utility green; muted overall.
  lighting_and_shadow: Flat overcast dusk sky, deep black recesses between modules, hundreds of tiny utility lights; no dramatic sun.
  texture_and_material: Board-formed concrete with tie holes and rain staining, rusted cladding, sagging cable bundles and patched conduit runs.
  camera_and_composition: Keep the requested view; telephoto compression stacks the modules into a wall, looking up at the overhangs.
  atmosphere_and_mood: Oppressive, dense and labyrinthine, a structure that keeps growing by accretion.
  rendering_and_quality: Matte photographic grit, detailed module repetition, restrained glow; not the sober single-slab look of classic brutalism.
  key_features: stacked cantilevered concrete modules; conduits and cable stays across facades; rust-black panels; telephoto compression; tiny utility lights at dusk
  creative_brief: "Techno-brutalist megablock: board-marked concrete modules stacked and cantilevered into a mountain-like mass, service conduits and cable stays strung across the facades, rust-black steel panels. Carry it through stacked cantilevered concrete modules, conduits and cable stays across facades, rust-black panels, telephoto compression, tiny utility lights at dusk. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
