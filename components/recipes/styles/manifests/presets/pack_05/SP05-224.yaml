visualDna:
  aesthetic: 'Clean digital architectural anime: ruler-straight hairline contours traced from a 3D layout, near-white fills, and overexposed bloom on every bright plane.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: White, cool gray and pale steel dominate, with one deep ultramarine shadow tone and a single tiny red or cyan signal accent.
  lighting_and_shadow: Flat shadowless daylight blown toward white with bloom spilling over edges; one crisp ultramarine shadow band where planes turn away.
  texture_and_material: Seamless glossy surfaces with hairline panel seams and almost no grain; reflections drawn as flat pale-blue strips.
  camera_and_composition: Keep the requested view; enforce perfectly vertical lines, parallel spacing and large empty white negative space around the subject.
  atmosphere_and_mood: Severe, antiseptic and silent, order so complete that it becomes uneasy.
  rendering_and_quality: Hairline vector precision, bloom-softened whites, one flat shadow band per form, and no hand-drawn wobble anywhere.
  key_features: ruler-straight hairline contours; overexposed white bloom; single ultramarine shadow band; hairline panel seams; vast white negative space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Sterile Arcology Severity as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
