visualDna:
  aesthetic: 'Screenpunk: a city of giant screens where building facades are displays, faces loom across towers and people live in the glow.'
  subject_treatment: Keep the prompt's subject and setting; surround it with huge glowing screens and let their color spill over everything.
  color_and_tone: Saturated screen colors spilling over dark streets, faces tinted by whatever the screens show.
  lighting_and_shadow: Screen light as the dominant source, shifting colors on wet surfaces and faces.
  texture_and_material: Visible pixel grids up close, glass towers, wet asphalt and umbrellas.
  camera_and_composition: Tiny people below colossal screen faces and pixel close-ups.
  atmosphere_and_mood: Overwhelming and mesmerizing, a city that is always watching you back.
  rendering_and_quality: Vivid illustration with glowing screens and pixel grid detail.
  creative_brief: "Screenpunk: a city of giant screens where building facades are displays, faces loom across towers and people live in the glow. Carry it through building-sized screens, spilled screen color, pixel grids, tiny people. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: building-sized screens; spilled screen color; pixel grids; tiny people
