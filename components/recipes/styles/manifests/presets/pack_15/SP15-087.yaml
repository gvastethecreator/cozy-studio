visualDna:
  aesthetic:
    An optimistic ecological-future language of renewable energy, passive climate control, regenerative
    materials and shared, repairable systems; solar, wind, seed stewardship and rain capture are compatible
    expressions.
  subject_treatment:
    Preserve subject and locks. Restyle open forms with modular solar geometry, breathable
    shade, renewable mechanisms, repairable joins and living or reclaimed materials; choose systems that fit,
    not a garden. For ordinary interiors, preserve the requested room and existing props; show a visible
    passive-climate or renewable function on an existing element and a localized repairable or reclaimed join.
    Do not substitute advocacy posters, slogans or added eco-themed set dressing for working design unless requested.
  color_and_tone:
    Use sun-warmed ochre, clay, leaf, teal, recycled-metal neutrals and generous light as flexible
    relationships. Respect palettes and keep ecological details subordinate.
  lighting_and_shadow:
    Honor stated lighting. When unspecified, use broad daylight planes and clear shade geometry;
    add no sun disk, glow or fixed time of day.
  texture_and_material:
    Favor recycled metal, solar glass, matte ceramics, durable fibers and repaired surfaces
    where compatible. Distinguish living, manufactured and reclaimed materials without leaf wallpaper.
  camera_and_composition:
    Preserve crop and viewpoint. Use modular overlaps and open circulation; do not require
    a city, farm, greenhouse or utopian skyline.
  atmosphere_and_mood:
    Express practical optimism, collective agency or stewardship through working design
    while following requested tone. Community scenes are optional.
  rendering_and_quality:
    Use architectural illustration, matte print planes and selective hand-painted texture.
    Make sustainable mechanisms read at thumbnail scale without fine-detail clutter. In ordinary interiors,
    avoid invented advocacy posters, slogans and eco-themed set dressing unless requested.
avoidRules:
  - Do not turn every subject into a city, garden, farm, seed archive or solar farm.
  - Do not substitute a green wash or leaf wallpaper for ecological design.
  - Respect explicit material, palette and lighting instructions.
  - Do not add advocacy posters, slogans or extra eco-themed set dressing to ordinary interiors unless requested.
