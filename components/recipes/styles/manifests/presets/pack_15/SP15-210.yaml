  color_and_tone: Faded concrete greys and brick red with bright hand-painted mural colors and warm lamps.
  lighting_and_shadow: Mixed light from broken windows, string lights and candles in dim rooms.
  texture_and_material: Cracked plaster, scrap wood, painted walls, mattresses, salvaged doors and plants.
  camera_and_composition: Busy interiors packed with people, handmade furniture and layered repairs.
  atmosphere_and_mood: Defiant, crowded and warm, a home built by people who refused to leave.
  rendering_and_quality: Richly cluttered illustration with layered textures and warm pockets of light.
