visualDna:
  aesthetic: >-
    Graphic anime ink sets opposed forms against sharply divided planes and broad black
    contours.
  subject_treatment: >-
    Preserve pose and form; sharpen existing angles without adding a duel, emblem, or prop.
  color_and_tone: >-
    Black, paper ivory, oxblood, small vermilion; value split leads over color.
  lighting_and_shadow: >-
    Directional hard light and decisive shadow blocks; accents only on depicted surfaces.
  texture_and_material: >-
    Opaque cel masses with sparse engraved hatch; ornament only when already requested.
  camera_and_composition: >-
    Respect framing; counterbalance existing shapes with diagonals, never a stage layout.
  atmosphere_and_mood: >-
    Visual opposition and pauses add tension while preserving the prompt's mood.
  rendering_and_quality: >-
    Forceful contours, flat shadows, few accents, no decorative clutter.
  key_features: >-
    Opposed value planes, emphatic ink, diagonal counterbalance, vermilion accents
  creative_brief: "Apply a visual treatment centered on opposed value planes, emphatic ink, diagonal counterbalance, vermilion accents. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject."
