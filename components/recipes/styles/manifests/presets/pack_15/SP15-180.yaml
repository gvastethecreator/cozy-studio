  aesthetic: 'Termitepunk: cities built like termite mounds, with towering earthen spires, natural ventilation shafts, tunnels and colony-scale cooperation.'
  subject_treatment: Keep the prompt's subject and setting; house it in towering earthen mounds full of tunnels and ventilation chimneys.
  color_and_tone: Red earth, ochre clay and dusty savanna gold with cool shadowed tunnel browns.
  lighting_and_shadow: Hot savanna sun on mound exteriors and cool shafts of light inside tunnels.
  texture_and_material: Packed red earth, tunnel walls, ventilation holes and dry grass.
  camera_and_composition: Towering mound skylines and cutaway views of tunnel networks.
  atmosphere_and_mood: Industrious and ancient, a society as patient and cooperative as a colony.
  rendering_and_quality: Earthy detailed illustration with clearly readable tunnel architecture.
  creative_brief: "Termitepunk: cities built like termite mounds, with towering earthen spires, natural ventilation shafts, tunnels and colony-scale cooperation. Carry it through earthen spires, ventilation shafts, tunnel networks, red earth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
