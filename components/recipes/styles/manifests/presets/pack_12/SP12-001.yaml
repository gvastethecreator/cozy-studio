visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Katana ZERO gameplay screenshots: 2D neo-noir
    action-platformer capture with side-view rooms, instant-death combat spacing, motel interiors,
    glass partitions, and cinematic pixel staging. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Katana ZERO-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Katana ZERO-informed palette: black hotel shadow, red blood accents, sodium amber, teal
    window light, magenta signage, and small white bullet highlights. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through hard interior cuts, neon spill through windows, slash trails, muzzle
    flashes, and time-slow contrast pulses. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from chunky pixel silhouettes, glossy tile, wood paneling, rain glass, smoke
    puffs, shattered props, and clean sprite edges. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with strict side-on room composition with readable platform lanes, enemy spacing, door
    exits, throwable props, and action freeze timing. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Katana ZERO-derived mood: stylish, brutal, nocturnal, tense, and choreographed like a
    one-screen execution puzzle. The preset can become adult, violent, eerie, seductive, cozy,
    tactical, or absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal HUD; use tiny combat
    prompts or replay/timer cues only when they help the screenshot feel playable. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Katana ZERO gameplay screenshots; 2D neo-noir action-platformer capture with side-view rooms,
    instant-death combat spacing, motel interiors, glass partitions, and cinematic pixel staging;
    black hotel shadow, red blood accents, sodium amber, teal window light, magenta signage, and
    small white bullet highlights; hard interior cuts, neon spill through windows, slash trails,
    muzzle flashes, and time-slow contrast pulses; chunky pixel silhouettes, glossy tile, wood
    paneling, rain glass, smoke puffs, shattered props, and clean sprite edges; strict side-on room
    composition with readable platform lanes, enemy spacing, door exits, throwable props, and action
    freeze timing; stylish, brutal, nocturnal, tense, and choreographed like a one-screen execution
    puzzle; HUD guidance: minimal HUD; use tiny combat prompts or replay/timer cues only when they
    help the screenshot feel playable
  creative_brief: >-
    Use Katana Zero Neo-Noir Sideview as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Katana ZERO: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
