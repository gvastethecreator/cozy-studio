visualDna:
  aesthetic: 'Debossing: artwork pressed down into thick board.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is pressed into thick board as a recessed impression."
  color_and_tone: Tonal board color, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Recessed impression in thick board, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Solid, tactile, minimal and premium, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Debossing: artwork pressed down into thick board. Carry it through recessed impression, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: recessed impression; physical print process
