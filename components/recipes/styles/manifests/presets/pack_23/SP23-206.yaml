  aesthetic: 'Gamebook ink illustration: the full-page black-and-white ink illustrations of eighties choose-your-path adventure books, dense hatching, lurid monsters and dramatic perspective.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; draw the subject as a dramatic full-page black ink moment of choice or danger.
  color_and_tone: Black ink on white with dense tonal hatching.
  lighting_and_shadow: High-contrast hatching and solid black shadows, kept consistent across the whole image.
  texture_and_material: Pen hatching, stippling and paper grain, kept consistent across the whole image.
  camera_and_composition: Dramatic perspective from the reader's point of view.
  atmosphere_and_mood: Keep the requested mood with pulpy second-person peril.
  rendering_and_quality: Dense energetic ink with clear focal action, kept consistent across the whole image.
  creative_brief: "Gamebook ink illustration: the full-page black-and-white ink illustrations of eighties choose-your-path adventure books, dense hatching, lurid monsters and dramatic perspective. Carry it through full-page ink, dense hatching, reader viewpoint, lurid monsters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: full-page ink; dense hatching; reader viewpoint; lurid monsters
