visualDna:
  aesthetic: >-
    Black Particle Fugitive Style acts as a transferable anime-battle/worlds router: Black Particle
    Fugitive Style; combine it with dark fantasy and seinen anime grammar with moral pressure, heavy
    shadow, body unease, noir materiality, ritual dread, and mature visual restraint; named titles,
    studios, or lineage words may guide style, but they must not require canon cast, title-scene
    replication, screenshots, logos, or one fixed card concept.
  subject_treatment: >-
    Preserve prompt subject, action, and context while restyling silhouette, material response,
    gesture rhythm, effect hierarchy, and detail priority through the preset lineage; apply Black
    Particle Fugitive Style as portable contour, motion grammar, surface language, and emotional
    pressure without requiring canon elements or a default action setup.
  color_and_tone: >-
    Map color through charcoal black, rust red, bone, sickly neon, winter blue, mineral pale, dirty
    gold, and disciplined blood-or-danger accents; let Black Particle Fugitive Style choose accent
    intensity, value contrast, emotional temperature, and power-system separation while staying
    attached to prompt X.
  lighting_and_shadow: >-
    Use low ritual glow, security red, winter overcast, neon despair, smoky bounce, blade-like rim,
    and deep occlusion with no crushed detail; make light clarify impact, silhouette, machinery or
    magic, material depth, and mood from Black Particle Fugitive Style without replacing prompt X
    with a stock anime frame.
  texture_and_material: >-
    Render crosshatch grain, soot, concrete, wet fabric, oxidized metal, paper, ash, mineral
    fracture, blood-ink accents, and denoised grime; keep the tactile or effect cues in Black
    Particle Fugitive Style controlled, denoised, and coherent across bodies, objects, environments,
    abstractions, and action.
  camera_and_composition: >-
    Frame through oppressive negative space, surveillance framing, ritual symmetry, fugitive
    diagonals, compressed civic space, and slow fatal closeups; convert Black Particle Fugitive
    Style into reusable perspective, timing, rhythm, scale, cut-in, and negative-space rules instead
    of one fixed style sample layout.
  atmosphere_and_mood: >-
    Carry mood through doom weight, suspicion, guilt, nihilism, compassion under violence,
    loneliness, retribution, and adult dread without gore shortcuts; the preset can become brutal,
    erotic, comic, tragic, quiet, grotesque, heroic, romantic, or strange when prompt X asks for it
    while keeping the anime-battle lineage readable.
  rendering_and_quality: >-
    Finish with mature seinen finish with controlled darkness, stable structure, restrained texture,
    no splatter-only horror, no photoreal grime, and no watermark/text; prioritize stable anatomy or
    object structure, readable effects, controlled grain, heavy denoise for noisy darks, no
    watermark, no fake readable text, no signature, no photoreal or 3D-render drift.
  key_features: >-
    Black Particle Fugitive Style; scarred contour, restrained deformation, severe silhouettes,
    vulnerable posture, occult or noir edge language, and readable psychological pressure;
    crosshatch grain, soot, concrete, wet fabric, oxidized metal, paper, ash, mineral fracture,
    blood-ink accents, and denoised grime; oppressive negative space, surveillance framing, ritual
    symmetry, fugitive diagonals, compressed civic space, and slow fatal closeups; mature seinen
    finish with controlled darkness, stable structure, restrained texture, no splatter-only horror,
    no photoreal grime, and no watermark/text
  creative_brief: >-
    Apply Black Particle Fugitive Style after prompt X as a transferable anime-battle/worlds layer:
    prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies
    Black Particle Fugitive Style, dark fantasy and seinen anime grammar with moral pressure, heavy
    shadow, body unease, noir materiality, ritual dread, and mature visual restraint, finish
    discipline, and negative controls without forcing canon cast, title scene, screenshot, card
    pose, default monster, default combat prop, or prompt-literal card.
