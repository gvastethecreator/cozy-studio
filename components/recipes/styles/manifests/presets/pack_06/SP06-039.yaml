visualDna:
  aesthetic: 'Risograph print: a stencil duplicator pushing soy inks through a drum, one spot color per pass, with grainy dither and loose registration.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Fluorescent pink, teal, sunflower yellow and blue riso inks overlapping into new transparent colors; blacks rarely pure.
  lighting_and_shadow: Tone made by grainy stochastic dither per color layer; shadows as denser dither or an overlapping second ink.
  texture_and_material: Soft uncoated paper with ink sitting slightly grainy, roller streaks, occasional ink set-off, colors shifted a few millimeters.
  camera_and_composition: Keep the requested framing; graphic shapes with generous paper white.
  atmosphere_and_mood: Playful, indie and bright, a small-press zine energy.
  rendering_and_quality: Grainy transparent spot-color layers with loose registration; no digital gradients and no crisp CMYK dots.
  key_features: fluorescent spot-color layers; grainy dither tone; transparent overprints; loose registration shift; soft uncoated paper
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Risograph as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
