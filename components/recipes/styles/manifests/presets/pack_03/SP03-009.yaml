visualDna:
  aesthetic: 'Digital clay sculpt: a raw viewport render of a sculpted model under a matcap material, with brush strokes and clay texture still visible.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Single matcap tone — red wax, grey clay or brown clay — with a baked highlight and dark cavities.
  lighting_and_shadow: 'Matcap shading only: a fixed studio highlight, no cast shadows, no global illumination.'
  texture_and_material: Brush strokes, pinched edges, clay buildup, polygon-free smoothness.
  camera_and_composition: Bust or full figure centered on a dark viewport background.
  atmosphere_and_mood: Raw and artistic, form discovered under the sculptor's hand.
  rendering_and_quality: Viewport sculpt look; no textures, no scene lighting, no UI.
  key_features: matcap red wax or grey clay; visible brush strokes; no cast shadows; dark viewport background; centered bust
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies ZBrush Digital Clay Sculpt as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
