visualDna:
  aesthetic: 'Velvet: short dense pile that darkens and brightens as it bends, showing finger-brushed trails.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is upholstered in velvet whose pile reverses where touched, leaving darker brushed trails.'
  color_and_tone: Jewel velvet colors shifting light to dark with pile direction.
  lighting_and_shadow: Low raking light to show pile direction, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Dense short pile with brushed trails and crush marks.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Soft, rich, inviting and intimate, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: directional velvet pile; brushed dark trails; crush marks
  creative_brief: "Velvet: short dense pile that darkens and brightens as it bends, showing finger-brushed trails. Carry it through directional velvet pile, brushed dark trails, crush marks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
