visualDna:
  aesthetic: 'Seismic reflection section: a vertical slice of the ground built from echo traces, showing rock layers as stacked wiggly bands.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Black-and-white wiggle traces or a red-white-blue polarity scale.
  lighting_and_shadow: No conventional light; band strength shows only how strongly each layer reflects.
  texture_and_material: Dense horizontal striping, faults as offsets, domes and channels bending the layers.
  camera_and_composition: Wide horizontal cross-section of the ground with depth increasing downward.
  atmosphere_and_mood: Deep and geological, hidden history pressed into layers.
  rendering_and_quality: Credible seismic profile with no depth numbers or annotations.
  creative_brief: "Seismic reflection section: a vertical slice of the ground built from echo traces, showing rock layers as stacked wiggly bands. Carry it through stacked reflection bands, wiggle traces, fault offsets, red-white-blue polarity, wide cross-section. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked reflection bands; wiggle traces; fault offsets; red-white-blue polarity; wide cross-section
