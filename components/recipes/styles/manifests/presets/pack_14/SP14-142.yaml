visualDna:
  aesthetic:
    Hellenic epic noir with terracotta-red and black figure-ground, precise incised contours, bronze
    highlights, and ordered mythic gesture. The image should feel like a composed epic illustration, not an
    object plate.
  subject_treatment:
    Preserve the requested subject, action, ethnicity, anatomy, and every explicit costume
    or equipment lock. Keep requested contemporary clothing and objects contemporary. On one suitable existing
    edge or fitting, place one narrow meander or palmette with enough contrast to read at thumbnail size. When
    a long open edge exists, let the motif follow that edge without changing its material or silhouette; use
    incised contour and clay-black figure-ground elsewhere. Do not add Greek actors, deities, costume, laurel
    emblems or classical architecture as recognition shortcuts.
  color_and_tone:
    Anchor the palette in clay red, black, pale ground, and restrained bronze or olive, with
    sea-blue or muted gold available as a focal accent. Map explicit prompt colors into the same strong figure-ground
    hierarchy.
  lighting_and_shadow:
    Use crisp silhouette separation, sculpted cast shadows, and glints that pick out bronze
    edges or incised details. Keep faces and gesture legible; a dawn, oracle glow, or fire is never required.
  texture_and_material:
    Keep each requested material identifiable. Contrast dry painted-slip treatment, fine incision and restrained
    bronze on fitting surfaces; pair a selective bronze highlight with an incised line or one edge-following
    meander. Do not turn bags, rubber, pavement or a modern frame into pottery or stone.
  camera_and_composition:
    Honor the requested view, staging and place category. Build any frieze-like rhythm from the requested
    subject and existing geometry, never from invented colonnades, temple fronts or a decorative frame.
  atmosphere_and_mood:
    Convey tragic consequence, civic pressure, honor, and restraint while allowing the prompt's
    own emotional tone. Heroism and solemnity are optional.
  rendering_and_quality:
    'Use authored contour-and-paint illustration: broad black and clay-red masses, expressive
    profiles, incised inner marks, and selective metallic detail. Keep the focal action readable at thumbnail
    size and avoid pseudo-inscriptions.'
avoidRules:
  - Preserve explicit identity, ethnicity, costume, and action locks; do not make a requested person Greek by
    default.
  - Do not force a deity, temple, vase, laurel, spear, or battle into the scene; adapt Hellenic motifs to unspecified
    design details where they fit.
  - Avoid pseudo-Greek writing, ornamental borders unrelated to the composition, and a flat museum-object presentation.
