visualDna:
  aesthetic: 'Clipping-plane section shader: the model sliced cleanly by a flat plane, the cut face capped with a grid of solid voxels colored by the material inside.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Beauty-rendered outer half in its own colors; the cut face in flat saturated section colors per interior material.
  lighting_and_shadow: Normal three-point light on the model; the section cap lit flat so the voxel grid reads evenly.
  texture_and_material: Stepped voxel blocks along the cut, one color per inner material, straight clean plane edge where the model ends.
  camera_and_composition: Keep the requested camera; turn the cut plane toward the viewer so the section fills a large part of the frame.
  atmosphere_and_mood: Curious and revealing, like opening a book of the object.
  rendering_and_quality: Crisp CG section with no torn or broken edges; the removed half is simply absent, never exploded.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Voxel Cross-Section Cutaway as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: flat clipping plane; voxelized section cap; one color per interior material; beauty-lit outer half; no explosion
