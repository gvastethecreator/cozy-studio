visualDna:
  aesthetic: 'Isometric digital illustration: scenes drawn in parallel projection with 30-degree axes and no vanishing point, like a detailed miniature diorama.'
  subject_treatment: Keep the prompt's subject and setting but show them in true isometric projection; this preset owns the camera angle and the tidy diorama cut-out, not the content.
  color_and_tone: 'Bright clean palette with three consistent face tones per object: top light, left mid, right dark.'
  lighting_and_shadow: Fixed light from the upper left, consistent face shading on every block, short soft cast shadows.
  texture_and_material: Smooth clean surfaces with small crisp details such as windows, crates and plants, no heavy texture.
  camera_and_composition: True isometric parallel projection, all verticals vertical, the scene cut out as a square or hexagonal block on a plain background.
  atmosphere_and_mood: Orderly, charming and toy-like, a whole world you could hold.
  rendering_and_quality: Strict parallel lines, consistent 30-degree angles, three-tone face shading; no perspective convergence, no UI.
  key_features: parallel 30-degree projection; no vanishing point; three-tone face shading; diorama cut-out block; small crisp details
  creative_brief: "Isometric digital illustration: scenes drawn in parallel projection with 30-degree axes and no vanishing point, like a detailed miniature diorama. Carry it through parallel 30-degree projection, no vanishing point, three-tone face shading, diorama cut-out block, small crisp details. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
