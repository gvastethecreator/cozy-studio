  color_and_tone: Bottle green, cream, brick red, soft charcoal, and one metallic gold spot; colors are opaque and never blend.
  lighting_and_shadow: Graphic light built from layered flat shapes; gold catches implied light as the brightest accent.
  texture_and_material: Thick matte ink with slight edge ridges, micro pinholes, faint screen mesh, and smooth heavy cotton paper.
  camera_and_composition: Compact, carefully composed miniature image with a centered focal subject, clean edges, and small breathing margin of paper, without lettering.
  atmosphere_and_mood: Precious, calm, ceremonial, and collectible.
  rendering_and_quality: 'Pristine craft-print finish: exact layer registration, no grain noise, crisp shape edges, and luxurious restraint.'
