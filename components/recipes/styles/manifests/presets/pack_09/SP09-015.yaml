visualDna:
  aesthetic: >-
    Honeycomb Wax translates natural material behavior into form: start from Bee hive, Waxy, sticky,
    and Melting edge, then turn natural formation, growth, erosion, and geological or biological
    irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Hexagons: preserve identity and pose while letting forms
    grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Golden Yellow as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Subsurface scattering define the light response: highlights, occlusion, translucency,
    specular scatter, matte falloff, or rim behavior should reveal Honeycomb Wax without hiding the
    prompt subject.
  texture_and_material: >-
    Render Waxy, sticky through organic variation, non-repeating edge wear, local pores, growth
    marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Melting edge as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Warm, busy by using age, weather, habitat pressure, and sensory association; the
    material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Organic, sweet material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Bee hive; Hexagons; Waxy, sticky; Subsurface scattering; Melting edge
  creative_brief: >-
    Route any subject through Honeycomb Wax as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Capture the golden geometry of beeswax
    hexagons, where instinct engineers perfection in translucent amber walls that glow with
    subsurface warmth. Light should penetrate the wax like it penetrates memory, warm and diffused,
    revealing the sticky sweetness held within each cell. The surface must hum with the ghost of
    industry, geometry sweetened by purpose. Use Honeycomb Wax as portable surface/render behavior
    over any input: map its texture, light response, edge wear, color chemistry, and tactile rhythm
    onto the subject instead of requiring a literal material sample, macro tile, wall, landscape,
    source object, or scene where the material naturally appears.
