visualDna:
  aesthetic: 'Oil-paint animation: every frame painted in thick oils on canvas, so brushstrokes move and swirl from frame to frame.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Rich oil color, strong complementary contrasts, blended impasto highlights.
  lighting_and_shadow: Painted light and shadow with directional strokes following form.
  texture_and_material: Visible canvas weave, thick impasto ridges, strokes shifting between frames.
  camera_and_composition: Film framing painted over, with brush direction following motion.
  atmosphere_and_mood: Vivid and devoted, a painting that breathes.
  rendering_and_quality: Hand-painted frame look; not a digital oil filter; no famous paintings copied.
  key_features: painted frame by frame; swirling brush direction; impasto ridges; canvas weave; complementary color
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Oil Paint Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
