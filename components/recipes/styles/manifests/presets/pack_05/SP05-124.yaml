visualDna:
  aesthetic: 'Hyper-focused competition anime: razor-clean contours, extreme wide-lens foreshortening, and eyes that trail streaks of ultramarine light while backgrounds dissolve into converging blue vectors.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Electric ultramarine, ink black, white and cool cyan; skin in cool pale tones.
  lighting_and_shadow: Hard blue-white rim from behind, cyan underlight on faces, deep blue shadow planes.
  texture_and_material: Clean vector layers with hard-edged glow bands and no grain.
  camera_and_composition: Keep the requested framing; exaggerate foreshortening toward the lens and aim concentric wedges at the focal eye.
  atmosphere_and_mood: Predatory concentration, ego sharpened to a point.
  rendering_and_quality: Sharp vector lines, glowing eye-light trails, and a background reduced to converging vectors.
  key_features: ultramarine eye-light trails; extreme wide-lens foreshortening; converging blue vector backgrounds; blue-white rim; hard-edged glow
  creative_brief: "Hyper-focused competition anime: razor-clean contours, extreme wide-lens foreshortening, and eyes that trail streaks of ultramarine light while backgrounds dissolve into converging blue vectors. Carry it through ultramarine eye-light trails, extreme wide-lens foreshortening, converging blue vector backgrounds, blue-white rim, hard-edged glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
