visualDna:
  aesthetic: >-
    Build the graphic anime treatment from precise angular outlines with fine ornamental repeats
    and layered geometric forms and clean branching curves. Let parallel arcs that gather and
    release in distinct beats set its rhythm; use deep green, black, ivory, and restrained gold
    for color and polished cel fills with thin etched line details for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use precise angular outlines with fine ornamental
    repeats for edge work, layered geometric forms and clean branching curves for form
    simplification, and parallel arcs that gather and release in distinct beats only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with deep green, black, ivory, and restrained gold. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: clear cel shadows with selected bright edge accents. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with polished cel fills with thin etched line details, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use orderly clusters linked by broad diagonals and open
    gaps to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey upbeat charge held within formal structure, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with precise linework, green-black contrast, and ornamental detail kept selective; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    precise angular outlines with fine ornamental repeats; layered geometric forms and clean
    branching curves; deep green, black, ivory, and restrained gold; parallel arcs that gather and
    release in distinct beats; polished cel fills with thin etched line details; orderly clusters
    linked by broad diagonals and open gaps.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with precise angular
    outlines with fine ornamental repeats, layered geometric forms and clean branching curves, and
    deep green, black, ivory, and restrained gold; use parallel arcs that gather and release in
    distinct beats only where movement is already present, and apply polished cel fills with thin
    etched line details as the drawing finish.
