visualDna:
  aesthetic: 'Alcohol marker rendering: broad chisel-tip markers laid in fast parallel streaks and blended while wet, finished with a fineliner outline and white gel highlights.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Clean transparent layered color, cool greys for shadows under hue layers, bright saturated accents, crisp white paper highlights.
  lighting_and_shadow: 'Studio product lighting: two or three layered value steps per form, reflected light on edges, white gel pen specular dots.'
  texture_and_material: Visible parallel streak direction, darker overlaps where strokes crossed, slight bleed at edges on smooth marker paper.
  camera_and_composition: Keep the requested framing; the rendered object may sit on a loose marker background swatch with the paper white around it.
  atmosphere_and_mood: Quick, confident and professional, a design studio sketch.
  rendering_and_quality: Streaky but controlled marker passes, thin ink outlines, gel pen highlights; no paint texture and no pencil smudging.
  key_features: chisel-tip parallel streaks; cool grey marker shadows; fineliner outline; white gel highlights; marker background swatch
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Alcohol Marker Rendering as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
