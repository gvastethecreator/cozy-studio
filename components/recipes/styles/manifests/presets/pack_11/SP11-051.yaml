visualDna:
  aesthetic: >-
    Bakery Window operates as a portable source-router layer: combine Artisan bakehouse texture,
    crust-and-crumb warmth, pastry laminate detail, yeast-rise glow with culinary presentation logic
    with edible surface behavior, plating structure, gloss, freshness, and commercial appetite cues,
    so the preset supplies visual behavior rather than a fixed card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms plate,
    glaze, slice, stack, melt, drizzle, arrange, chill, steam, or stylize through edible material
    logic through Crust cracks, ear-score lines, boule-dome contour, baguette-slash,
    croissant-laminate layers; identity stays readable through construction grammar, proportion,
    edge logic, and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through appetite-driven hues, ingredient contrast, caramelization, freshness accents,
    creamy highlights, and controlled richness; keep hue roles intentional, value separation clear,
    and palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Warm yellow, bakery-window morning, incandescent-gold, crust-sheen catch, steam-haze
    diffusion plus editorial food lighting with glossy highlights, soft appetite shadows,
    condensation sparkle, and texture reveal as the light-response contract, with readable
    hierarchy, controlled contact detail, and no lighting choice that erases the user's requested
    content.
  texture_and_material: >-
    Render Flour, flaky crust, dusting-flour, shatter-crust, air-pocket honeycomb, butter-laminate,
    steam-gelatinized starch plus sauce viscosity, crumb structure, gelatin shine, raw sheen, baked
    crust, ice, foam, steam, and surface freshness; surface scale, residue, gloss, grain, fiber,
    pores, edges, or signal artifacts must remain coherent across figures, objects, and
    environments.
  camera_and_composition: >-
    Compose with Rising dough, proofed-volume, oven-spring bloom, ear-and-gringe expansion,
    scoring-blade slash plus plating geometry, negative space, ingredient rhythm, commercial
    clarity, and edible detail scale as reusable framing grammar, allowing cards, portraits,
    objects, scenes, and abstract prompts to inherit the style without one required layout.
  atmosphere_and_mood: >-
    Carry mood through freshness, indulgence, premium service, comfort, celebration, appetite, and
    sensory immediacy; the emotional tone should feel specific to Bakery Window while still obeying
    the prompt's subject and context.
  rendering_and_quality: >-
    Finish with appetizing material truth, precise gloss control, clean detail priority, and no
    messy cafeteria drift; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Artisan bakehouse texture, crust-and-crumb warmth, pastry laminate detail, yeast-rise glow;
    Crust cracks, ear-score lines, boule-dome contour, baguette-slash, croissant-laminate layers;
    Flour, flaky crust, dusting-flour, shatter-crust, air-pocket honeycomb, butter-laminate,
    steam-gelatinized starch; Warm yellow, bakery-window morning, incandescent-gold, crust-sheen
    catch, steam-haze diffusion; Rising dough, proofed-volume, oven-spring bloom, ear-and-gringe
    expansion, scoring-blade slash
  creative_brief: >-
    Use Bakery Window after prompt X as a transferable style layer: prompt X supplies subject,
    action, and setting, while the preset supplies Artisan bakehouse texture, crust-and-crumb
    warmth, pastry laminate detail, yeast-rise glow, Crust cracks, ear-score lines, boule-dome
    contour, baguette-slash, croissant-laminate layers, Flour, flaky crust, dusting-flour,
    shatter-crust, air-pocket honeycomb, butter-laminate, steam-gelatinized starch, Warm yellow,
    bakery-window morning, incandescent-gold, crust-sheen catch, steam-haze diffusion, Rising dough,
    proofed-volume, oven-spring bloom, ear-and-gringe expansion, scoring-blade slash plus portion
    geometry, garnish rhythm, sauce motion, melt behavior, crumb, steam, condensation, and service
    polish, palette behavior, light response, material treatment, and finish discipline without
    requiring one specimen, prop bundle, product still, or card composition.
