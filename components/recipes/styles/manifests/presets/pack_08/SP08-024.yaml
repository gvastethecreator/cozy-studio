visualDna:
  aesthetic: '1950s rockabilly: hot-rod Americana wardrobe — cuffed selvedge jeans, bowling shirts, swing dresses, leather jackets and pompadours or victory rolls.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: cuffed dark jeans with a rolled tee or bowling shirt and leather jacket, or a polka-dot swing dress with petticoat; pompadour or victory-roll hair and saddle shoes or creepers.'
  color_and_tone: Cherry red, black, cream, turquoise and polka-dot white, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Warm diner neon or sunny chrome glare, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Selvedge denim, leather, rayon, polka-dot cotton and chrome, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Confident full figure, often leaning or mid-dance, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Swaggering, flirtatious, retro and fun, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Saturated, glossy retro finish, with believable fabric weight, seams and fit detail.
  key_features: cuffed jeans and leather jacket; polka-dot swing dress; pompadour and victory rolls; cherry red and turquoise
  creative_brief: "1950s rockabilly: hot-rod Americana wardrobe — cuffed selvedge jeans, bowling shirts, swing dresses, leather jackets and pompadours or victory rolls. Carry it through cuffed jeans and leather jacket, polka-dot swing dress, pompadour and victory rolls, cherry red and turquoise. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
