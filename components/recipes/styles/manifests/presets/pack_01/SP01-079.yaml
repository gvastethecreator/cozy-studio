visualDna:
  aesthetic: 'Booking photograph: deadpan frontal documentation with a height chart, flat light and bureaucratic indifference.'
  subject_treatment: Subject faces straight into the lens, shoulders square, neutral or defiant expression; disheveled details tell the story.
  color_and_tone: Flat grays and institutional off-whites, slightly green fluorescent cast.
  lighting_and_shadow: Flat on-camera flash, hard shadow on the height chart behind.
  texture_and_material: Harsh skin detail, bruises, smeared makeup, torn collars — rendered plainly.
  camera_and_composition: Centered head-and-shoulders against horizontal height lines without readable numbers.
  atmosphere_and_mood: Deadpan, bleak, and darkly funny.
  rendering_and_quality: Documentary flatness, no flattering retouch.
  key_features: height-line backdrop; flat on-camera flash; deadpan frontal pose; institutional color cast; disheveled detail
  creative_brief: "Booking photograph: deadpan frontal documentation with a height chart, flat light and bureaucratic indifference. Carry it through height-line backdrop, flat on-camera flash, deadpan frontal pose, institutional color cast, disheveled detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
