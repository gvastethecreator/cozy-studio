visualDna:
  aesthetic: >-
    Create scale through broad depth planes, firm foreground contours, and clean distant value
    bands rather than added spectacle.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Keep the
    primary silhouette clear without adding cast, props, or conflict.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use natural greens, pale
    gold, slate blue, and clear neutrals while retaining user-specified colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use a broad natural source and gradual
    near-to-far falloff; add no rays or supernatural glow.
  texture_and_material: >-
    Apply texture only to materials already present. Let brush scale soften with distance only
    across surfaces already shown; keep near contours deliberate.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Distinguish existing depths
    through value and scale contrast, without widening or adding a horizon.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Carry the supplied emotional tone; environmental
    scale is not an epic conflict or mythic event.
  rendering_and_quality: >-
    Maintain near-to-far hierarchy, crisp essential edges, and restrained background detail.
  key_features: >-
    Broad depth planes; natural green-gold-blue range; firm foreground contour; distant value
    bands.
  creative_brief: 'Use broad depth planes; natural green-gold-blue range; firm foreground contour; distant value bands. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
