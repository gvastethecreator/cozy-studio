visualDna:
  aesthetic: 'Contemporary digital superhero comic: clean variable-weight digital inks under glossy rendered color with gradients, specular hits and composited FX glows.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Teal-and-orange cool-warm contrast, luminous gradient ramps, saturated energy colors against dark desaturated skies.
  lighting_and_shadow: Strong rim lights from two sides, volumetric rays and lens flares, hard specular highlights on armor and wet surfaces.
  texture_and_material: Smooth airbrushed gradients, reflective armor plates, fine digital grain and glowing particle overlays.
  camera_and_composition: Widescreen low angle, heroic muscular proportions, debris and particles pulling depth toward the lens.
  atmosphere_and_mood: Intense blockbuster seriousness, every moment framed as a cinematic climax.
  rendering_and_quality: Crisp digital line art with glossy full rendering and controlled bloom; original costume designs only, never a known hero.
  key_features: glossy digital color; dual rim light; volumetric rays and flares; specular armor; widescreen low angle
  creative_brief: "Contemporary digital superhero comic: clean variable-weight digital inks under glossy rendered color with gradients, specular hits and composited FX glows. Carry it through glossy digital color, dual rim light, volumetric rays and flares, specular armor, widescreen low angle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
