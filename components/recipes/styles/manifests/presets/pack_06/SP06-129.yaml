visualDna:
  aesthetic: 'Watercolor pencil drawing: colored lines hatched with water-soluble pencils, then partly brushed with clean water so some strokes melt into washes while others stay crisp.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Fresh mid-saturated colors, stronger where pencil was pressed hard; dissolved areas slightly brighter and more transparent than the dry lines.
  lighting_and_shadow: Directional light with shadows hatched in dry pencil and lit areas dissolved into a pale wash, or the reverse.
  texture_and_material: Pencil hatching still visible under washes, soft bleeding where water touched, paper white between strokes, watercolor paper tooth.
  camera_and_composition: Keep the requested framing; the drawing stays sketchy at the edges with dry lines trailing off.
  atmosphere_and_mood: Fresh and light, an outdoor sketchbook page in progress.
  rendering_and_quality: A deliberate mix of crisp dry pencil strokes and melted wash zones, hatching ghosts under water; no opaque paint.
  creative_brief: "Watercolor pencil drawing: colored lines hatched with water-soluble pencils, then partly brushed with clean water so some strokes melt into washes while others stay crisp. Carry it through dry pencil hatching beside dissolved washes, ghost strokes under water, soft bleed edges, paper white gaps, sketchy trailing edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: dry pencil hatching beside dissolved washes; ghost strokes under water; soft bleed edges; paper white gaps; sketchy trailing edges
