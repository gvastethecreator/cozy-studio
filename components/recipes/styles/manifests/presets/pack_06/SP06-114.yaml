visualDna:
  aesthetic: 'Gacha character card: a vertical collectible card with an ornate iridescent foil frame around a clean anime-painted character illustration.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a vertical collectible-card frame with a foil border and rarity gems around the subject, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Bright clean anime color in the art window, rainbow holographic foil and gold filigree on the frame.
  lighting_and_shadow: Glamorous key light on the character, sparkle and lens-flare bursts, foil catching rainbow reflections.
  texture_and_material: Holographic foil shimmer, embossed gold filigree, faceted rarity gems, particle bursts and petals in the art.
  camera_and_composition: Vertical card; the character breaks slightly out of the art window, ornate border hierarchy, star gems at top.
  atmosphere_and_mood: Dazzling and precious, the thrill of a rare pull.
  rendering_and_quality: Polished anime finish with crisp foil edges; no stats, numbers or name banner.
  key_features: vertical card; iridescent foil frame; rarity gems; clean anime paint; figure breaking the frame
  creative_brief: "Gacha character card: a vertical collectible card with an ornate iridescent foil frame around a clean anime-painted character illustration. Carry it through vertical card, iridescent foil frame, rarity gems, clean anime paint, figure breaking the frame. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
