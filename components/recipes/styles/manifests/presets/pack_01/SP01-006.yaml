visualDna:
  aesthetic: 'Front-camera smartphone selfie: arm-length wide lens, casual social framing, computational processing, and the charm of an unplanned moment.'
  subject_treatment: Subject holds the phone (arm or shoulder visible), face slightly distorted by the wide lens, expression playful, tired, or mid-reaction.
  color_and_tone: 'Phone HDR look: lifted shadows, slightly punchy saturation, warm skin smoothing, bright sky retained.'
  lighting_and_shadow: Whatever light is available — window, screen glow, flash-less night, harsh sun — with the flat evenness of HDR merging.
  texture_and_material: Mild computational smoothing and sharpening halos, small noise in shadows, real everyday clothing.
  camera_and_composition: Wide 24–26 mm equivalent from arm length, face large and off-center, background context partially cut, occasional tilt.
  atmosphere_and_mood: Spontaneous, personal, and shareable.
  rendering_and_quality: Convincing phone image, not a professional portrait; no studio polish.
  creative_brief: "Front-camera smartphone selfie: arm-length wide lens, casual social framing, computational processing, and the charm of an unplanned moment. Carry it through arm-length wide lens, phone HDR, computational smoothing, tilted casual framing, visible arm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: arm-length wide lens; phone HDR; computational smoothing; tilted casual framing; visible arm
