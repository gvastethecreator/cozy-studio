visualDna:
  aesthetic: 'Voxel art: the subject built from small uniform cubes on a strict grid, like 3D pixels, with soft global illumination.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Limited palette per material, stepped color shading between voxels.
  lighting_and_shadow: Soft sky light and ambient occlusion in the cube corners.
  texture_and_material: Uniform cube faces, visible grid, no smooth curves.
  camera_and_composition: Keep the requested view; the voxel scale fine enough to read details.
  atmosphere_and_mood: Cheerful and constructive, a world you could build block by block.
  rendering_and_quality: Clean voxel render with soft occlusion; no mining-game textures or characters.
  key_features: uniform cube voxels; strict grid; stepped palette shading; soft ambient occlusion; no curves
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Voxel Art as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - brand logo
  - franchise likeness
  - readable text
  - readable letters
  - changing the requested camera view
  - mining game textures
  - curves
  - smooth
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
