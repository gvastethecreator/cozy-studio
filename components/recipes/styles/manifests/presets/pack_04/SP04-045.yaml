visualDna:
  aesthetic: 'Hand-pulled gig poster screenprint: bold illustrated image in three spot inks with halftone shading, overprints and squeegee imperfections.'
  subject_treatment: Keep the prompt subject and action; this preset owns the bold single-image gig print composition, with no lettering band, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Three spot inks, for example cream, teal and blood red, plus black; overprints make extra colors.
  lighting_and_shadow: Tone made from coarse halftone dots, flat print lighting with punchy contrast.
  texture_and_material: Fibrous poster stock, squeegee drag, ink density variation and slight misregistration.
  camera_and_composition: Large central emblem-like subject, strong silhouette, decorative elements radiating from it.
  atmosphere_and_mood: Loud, raw and energetic, printed the night before the show.
  rendering_and_quality: Visible print-shop process with thick ink contours; no digital gradients and no band names.
  key_features: three spot inks plus black; coarse halftone; overprint colors; squeegee drag; central emblem subject
  creative_brief: "Hand-pulled gig poster screenprint: bold illustrated image in three spot inks with halftone shading, overprints and squeegee imperfections. Carry it through three spot inks plus black, coarse halftone, overprint colors, squeegee drag, central emblem subject. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - invented slogans
  - fake lettering
  - empty title plate
  - real musician likeness
  - concert crowd
  - band on stage
  - digital gradient
  - official card scene
  - fixed thumbnail subject
