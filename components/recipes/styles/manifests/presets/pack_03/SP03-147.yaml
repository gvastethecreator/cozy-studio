visualDna:
  aesthetic: 'Curvature and cavity bake: the model shown as mid grey where flat, white on convex edges and dark in concave creases, the map texture artists use for wear.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Neutral 50% grey base, crisp white edge lines on ridges, dark charcoal in grooves; no hue.
  lighting_and_shadow: No light direction at all; values come only from local surface bending, unlike soft ambient occlusion.
  texture_and_material: Thin bright ridges on every bevel and chip, fine dark lines in engravings, broad flats evenly grey.
  camera_and_composition: Keep the requested camera; close views show hard-surface and carved detail best.
  atmosphere_and_mood: Precise and tactile, every worn edge traced like a map.
  rendering_and_quality: Crisp baked-texture look with pixel-sharp edge lines, no ambient-occlusion blur and no cast shadows.
  creative_brief: "Curvature and cavity bake: the model shown as mid grey where flat, white on convex edges and dark in concave creases, the map texture artists use for wear. Carry it through mid-grey flats, white convex edge lines, dark concave grooves, no light direction, sharp engraved detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mid-grey flats; white convex edge lines; dark concave grooves; no light direction; sharp engraved detail
