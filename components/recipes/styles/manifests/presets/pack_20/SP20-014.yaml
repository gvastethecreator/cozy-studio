visualDna:
  aesthetic: 'Plank-grain relief: a relief print cut from soft plank wood, where the natural grain prints as rippling lines inside every flat color area.'
  subject_treatment: Carve the prompt's subject into simple flat shapes whose wood grain shows through the ink, keeping its silhouette and pose readable.
  color_and_tone: Two to four flat ink colors such as indigo, rust and ochre, each carrying visible grain striations.
  lighting_and_shadow: No modeled light; value comes from flat color shapes and carved white gaps.
  texture_and_material: Flowing wood grain lines, knot rings and cut-edge chatter printed inside every color block.
  camera_and_composition: Bold simplified composition with large color shapes and grain running in one direction.
  atmosphere_and_mood: Rustic, warm and handmade, with the living tree still visible.
  rendering_and_quality: Authentic relief print with grain inside flats and carved edges, never smooth vector fills.
  creative_brief: "Plank-grain relief: a relief print cut from soft plank wood, where the natural grain prints as rippling lines inside every flat color area. Carry it through wood grain in flats, knot rings, carved chatter, bold simple shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: wood grain in flats; knot rings; carved chatter; bold simple shapes
