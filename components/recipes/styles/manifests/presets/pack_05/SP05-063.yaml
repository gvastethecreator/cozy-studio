visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around hard black and crimson
    value blocks edged by fine tapered linework that decorates only contours already
    present. For color and surface, keep the requested colors while using
    crimson, ink black, and restrained pale contrast as a hierarchy, not a fixed
    palette. Authority can feel composed or theatrical through hierarchy alone and must
    follow the prompt's emotional direction
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through hard black and crimson value blocks
    edged by fine tapered linework that decorates only contours already present; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep the requested colors
    while using crimson, ink black, and restrained pale contrast as a hierarchy, not a
    fixed palette. Keep values legible across the prompted light and dark range; do not
    crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use crisp controlled
    highlights and clean shadow edges without introducing a glowing symbol or
    architectural light source. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine flat opaque pigment with sparse etched
    detail; avoid filling quiet areas with ornament. Keep texture subordinate to form
    and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    existing balance and viewpoint; let color-block proportions, not imposed symmetry,
    carry authority. Use the mark rhythm inside the supplied composition rather than
    replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Authority can feel composed or theatrical
    through hierarchy alone and must follow the prompt's emotional direction. Darkness
    and tension are optional tonal pressure, never a requirement to add danger or
    rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and hard black and crimson value blocks edged by
    fine tapered linework that decorates only contours already present; keep focal edges
    crisp, texture controlled, and dark values legible. Avoid photoreal or 3D-render
    drift, watermark, logo, and fake readable text.
  key_features: >-
    hard black and crimson value blocks edged by fine tapered linework that decorates
    only contours already present; keep the requested colors while using crimson, ink
    black, and restrained pale contrast as a hierarchy, not a fixed palette; use crisp
    controlled highlights and clean shadow edges without introducing a glowing symbol or
    architectural light source; combine flat opaque pigment with sparse etched detail;
    avoid filling quiet areas with ornament; and preserve existing balance and
    viewpoint; let color-block proportions, not imposed symmetry, carry authority. The
    five cues should read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use hard black and crimson value blocks edged
    by fine tapered linework that decorates only contours already present, keep the
    requested colors while using crimson, ink black, and restrained pale contrast as a
    hierarchy, not a fixed palette, use crisp controlled highlights and clean shadow
    edges without introducing a glowing symbol or architectural light source, and
    combine flat opaque pigment with sparse etched detail; avoid filling quiet areas
    with ornament; the prompt supplies all scene content. Do not add unrequested
    characters, objects, source-specific lore, readable symbols, or a default action.
