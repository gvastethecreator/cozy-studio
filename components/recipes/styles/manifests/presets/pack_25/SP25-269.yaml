visualDna:
  aesthetic: 'Sleeve-to-Body Continuity: one graphic path crossing from sleeve to body through explicit matching points at the seam.'
  subject_treatment: Run one graphic path from the prompt's sleeve onto the body through matching anchor pairs at the seam, keeping direction and width on both sides.
  color_and_tone: One main color that makes continuity easy to check.
  lighting_and_shadow: Flat panel art and even mockup light with the crossing visible.
  texture_and_material: Clean graphic edges with the seam area left clean and clear.
  camera_and_composition: Marked matching points on sleeve and torso in a neutral pose.
  atmosphere_and_mood: A wrapping motion around the body with one dominant direction.
  rendering_and_quality: Clean print documented per panel with the crossing matched.
  creative_brief: "Sleeve-to-Body Continuity: one graphic path crossing from sleeve to body through explicit matching points at the seam. Carry it through sleeve-to-body path, matching anchors, kept width, neutral pose. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sleeve-to-body path; matching anchors; kept width; neutral pose
