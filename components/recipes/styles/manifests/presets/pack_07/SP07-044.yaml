visualDna:
  aesthetic: 'Postindustrial ecological promenade: an abandoned industrial site turned public landscape, keeping rails, concrete and steel ruins while pioneer planting and walkways thread through them.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Rust orange, concrete grey, blackened steel, the straw and silver of grasses, birch white and fresh greens; muted with seasonal colour in the planting.
  lighting_and_shadow: Overcast or low sidelight across rough surfaces, structures silhouetted, soft light through grasses.
  texture_and_material: Weathered concrete, riveted steel frames, old rails and sleepers, gravel ballast, birch saplings, switchgrass and asters, raised boardwalks and grated steel paths.
  camera_and_composition: Keep the requested view; show the industrial relic and the planting layered together, a walkway leading through, no postcard hero shot.
  atmosphere_and_mood: Resilient, quiet and hopeful, industry giving way to growth.
  rendering_and_quality: Documentary landscape photograph with specific rust, seedheads and ballast, no generic plaza paving.
  key_features: industrial relics kept in place; pioneer birch and grasses; raised steel and timber walkways; rails and ballast; rust and concrete palette
  creative_brief: "Postindustrial ecological promenade: an abandoned industrial site turned public landscape, keeping rails, concrete and steel ruins while pioneer planting and walkways thread through them. Carry it through industrial relics kept in place, pioneer birch and grasses, raised steel and timber walkways, rails and ballast, rust and concrete palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
