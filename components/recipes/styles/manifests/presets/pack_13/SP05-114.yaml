visualDna:
  aesthetic: >-
    Use stitched contour accents, crosswise weave marks, seam breaks and frayed edges only where the
    source form supports a textile reading.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: retain the source palette and
    use thread-like accents sparingly; do not recolor every surface as cloth.
  lighting_and_shadow: >-
    Use soft diffuse value and small seam shadows; respect the prompt's actual illumination.
  texture_and_material: >-
    Show thread, weave, stitch and fray as controlled mark vocabulary while preserving each depicted
    material.
  camera_and_composition: >-
    Let seams clarify existing construction and boundaries; preserve camera, silhouette and
    arrangement.
  atmosphere_and_mood: >-
    Tactility comes from the stitch rhythm; do not turn every object into fabric or add a frame.
  rendering_and_quality: >-
    Transfer textile marks selectively to any subject without adding hoop, garment, cloth prop or
    embroidery motif. Keep important silhouettes and joins legible; no watermark, unrequested text
    or interface.
  key_features: >-
    Stitched contour; crosswise weave/hatch; patch seams; selective fray; sashiko-like rhythm only
    when source pattern supports it.
  creative_brief: 'Apply this visual treatment to the requested content: Stitched contour; crosswise weave/hatch; patch seams; selective fray; sashiko-like rhythm only when source pattern supports it. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - weave marks obscuring nontextile material cues
  - stitches detached from existing seams
  - fray replacing the source silhouette
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-114.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
