visualDna:
  aesthetic: 'Production character turnaround: clean line with flat color and a single occlusion pass, one design shown in front, three-quarter, side and back views.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a turnaround layout of front, three-quarter, side and back views at one height, plus a row of expression heads, and that layout replaces the requested framing.
  color_and_tone: Flat local colors with one soft occlusion pass on a neutral mid-grey ground, plus a strip of unlabeled palette chips.
  lighting_and_shadow: Neutral frontal studio light with only ambient occlusion in the recesses, so colors read identically in every view.
  texture_and_material: Crisp consistent linework; fabric, leather and metal described with minimal shorthand so every seam, strap and fastening stays legible.
  camera_and_composition: Orthographic views aligned on shared guide lines for head, waist and feet, evenly spaced, with small expression heads in a row below.
  atmosphere_and_mood: Neutral and exact, a calm handoff to modelers and animators.
  rendering_and_quality: Identical proportions in every view with no perspective drift; callout lines point to details without any words.
  key_features: front, three-quarter, side and back views; shared height guide lines; flat color plus occlusion; expression head row; unlabeled palette chips
  creative_brief: "Production character turnaround: clean line with flat color and a single occlusion pass, one design shown in front, three-quarter, side and back views. Carry it through front, three-quarter, side and back views, shared height guide lines, flat color plus occlusion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - readable annotations
  - readable text
  - brand logo
  - franchise likeness
  - lone cloaked figure on a cliff edge
  - dynamic action pose
  - perspective drift between views
  - scenic background
  - background
  - action
  - official card scene
