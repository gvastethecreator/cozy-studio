visualDna:
  aesthetic: 'Etched Glass Instruments: permanent scales etched into glass plates, with the active reading lit separately in front.'
  subject_treatment: Etch the prompt's permanent scales into glass plates and show the active reading as a separate bright layer; keep every value and label exact.
  color_and_tone: Low-contrast etched scales and higher-value active data in one light color.
  lighting_and_shadow: Soft side light catching the glass edge, the front reading kept crisp.
  texture_and_material: Sober glass with visible edge thickness and fine etching, clean and clear.
  camera_and_composition: Frontal or near-frontal plates with aligned scales and undistorted data.
  atmosphere_and_mood: Transparent precision and instrumental lightness, grounded and physical.
  rendering_and_quality: Etching and live data never read as the same state.
  creative_brief: "Etched Glass Instruments: permanent scales etched into glass plates, with the active reading lit separately in front. Carry it through etched scales, separate active reading, glass edge light, frontal plates. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: etched scales; separate active reading; glass edge light; frontal plates
