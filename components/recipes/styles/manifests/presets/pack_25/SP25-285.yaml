visualDna:
  aesthetic: 'Open-Frame Signage: partial frames with two or three active edges group information on minimal supports, the opening pointing somewhere meaningful.'
  subject_treatment: Frame the prompt's sign information with two or three edges on a minimal support, the open side pointing with the hierarchy, every word and arrow exact.
  color_and_tone: A solid contrasting reading field with a secondary frame.
  lighting_and_shadow: Existing light with no frame shadow over information.
  texture_and_material: Minimal matte support and precise contours with a solid reading field.
  camera_and_composition: The frame opening answering hierarchy or direction, text inside the reserve.
  atmosphere_and_mood: Structural lightness and a calm, contained sense of orientation.
  rendering_and_quality: Clean sign with deliberate open edges and aligned text.
  creative_brief: "Open-Frame Signage: partial frames with two or three active edges group information on minimal supports, the opening pointing somewhere meaningful. Carry it through partial frame, active edges, solid reading field, meaningful opening. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: partial frame; active edges; solid reading field; meaningful opening
