visualDna:
  aesthetic: 'Parallel Reading Registers: two reading paths run side by side in columns or bands, linked by clear anchors and with distinct jobs.'
  subject_treatment: Build the prompt's pages as two complementary reading paths linked by numbered anchors, each with its own rhythm, every title and supplied word exact.
  color_and_tone: Registers told apart by weight, position and value as well as color.
  lighting_and_shadow: Flat layout with both texts living on the same page plane.
  texture_and_material: 'Sharp type, sober dividers and plain reading areas with no texture under the text.'
  camera_and_composition: Related columns or bands of flexible length with shared reference alignments.
  atmosphere_and_mood: Editorial dialogue and layered reading, thoughtful and clear.
  rendering_and_quality: Crisp layout where each path can be read alone or crossed without losing order.
  creative_brief: "Parallel Reading Registers: two reading paths run side by side in columns or bands, linked by clear anchors and with distinct jobs. Carry it through two reading paths, numbered anchors, distinct rhythms, shared alignments. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two reading paths; numbered anchors; distinct rhythms; shared alignments
avoidRules:
  - two unrelated texts
  - columns of equal priority
  - ambiguous reading order
  - invented quotes, authors or data
  - real brand or trademark
