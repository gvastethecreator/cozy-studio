  color_and_tone: Locked garment and print colors on a neutral contrasting background.
  lighting_and_shadow: Broad front-side light with folds kept clear of the design.
  texture_and_material: Moderate fabric texture and defined seams, the garment in new condition.
  camera_and_composition: Full garment or a declared crop on a steady axis with the print readable.
  atmosphere_and_mood: Sober product presentation, focused, uncluttered and quietly confident.
  rendering_and_quality: Sleeves, collar and torso proportions match the garment pattern.
