visualDna:
  aesthetic:
    Contour-led drawing with continuous changes of pressure and deliberate tension between straight segments
    and curved arcs.
  subject_treatment:
    Follow the requested subject with economical lines that swell at turns and taper at releases.
    Retain identifying proportions and the requested gesture.
  color_and_tone:
    Keep line and ground strongly separated. Use the user palette in broad restrained fills rather
    than many small color patches.
  lighting_and_shadow:
    Suggest volume with selective overlap, sparse shadow shapes and line-weight changes, not
    complete shaded modeling.
  texture_and_material:
    Make the stroke visibly continuous, with occasional dry starts and clean tapered ends. Avoid
    mechanically uniform outlines.
  camera_and_composition:
    Keep the requested viewpoint and placement. Establish hierarchy through stroke weight
    and omission of secondary edges.
  atmosphere_and_mood:
    Translate the user tone through the tension and openness of the line. Do not automatically
    add a comic expression or childish proportions.
  rendering_and_quality:
    Resolve important contours cleanly while allowing secondary lines to remain open. Keep
    joints, overlaps and tangencies readable.
avoidRules:
  - uniform-width outlines
  - redundant tracing contours
  - unrequested facial exaggeration
