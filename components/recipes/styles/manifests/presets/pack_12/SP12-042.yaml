visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Control gameplay screenshots: third-person
    paranormal action capture with brutalist interiors, red astral corruption, floating debris, and
    supernatural combat geometry. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Control-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Control-informed palette: concrete grey, Federal red, black office void, fluorescent
    white, amber desk lamps, and pale psychic blue. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through overhead fluorescents, red threshold glow, object-of-power bloom, muzzle
    flashes, and deep brutalist shadow. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from concrete slabs, office furniture, papers, floating rubble, glass partitions,
    and bureaucratic paranormal material contrast. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with over-shoulder action camera with levitation depth, cover objects, enemy
    silhouettes, and architectural scale axes. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Control-derived mood: uncanny, bureaucratic, oppressive, clean, and reality-bent. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: health/energy bars, objective
    markers, and ability reticles can appear but should remain sleek and minimal. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Control gameplay screenshots; third-person paranormal action capture with brutalist interiors,
    red astral corruption, floating debris, and supernatural combat geometry; concrete grey, Federal
    red, black office void, fluorescent white, amber desk lamps, and pale psychic blue; overhead
    fluorescents, red threshold glow, object-of-power bloom, muzzle flashes, and deep brutalist
    shadow; concrete slabs, office furniture, papers, floating rubble, glass partitions, and
    bureaucratic paranormal material contrast; over-shoulder action camera with levitation depth,
    cover objects, enemy silhouettes, and architectural scale axes; uncanny, bureaucratic,
    oppressive, clean, and reality-bent; HUD guidance: health/energy bars, objective markers, and
    ability reticles can appear but should remain sleek and minimal
  creative_brief: >-
    Use Control Rift Laboratory as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Control: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
