visualDna:
  aesthetic: Cool noir anime ink where every reflective surface is drawn as short broken reflection bars and thin interference lines, like light sliding over wet steel.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Steel blue, charcoal and muted silver, with a faint oil-slick violet-green on glossy edges.
  lighting_and_shadow: The original light source is kept; its reflections break into narrow discontinuous bands and dark detail stays visible.
  texture_and_material: Enamel-like sheen on glossy materials and quiet graphite grain on matte ones.
  camera_and_composition: Keep the requested framing; repeated reflection lengths pace the image in a steady horizontal rhythm.
  atmosphere_and_mood: Cool, grieving restraint in which mourning shows as stillness.
  rendering_and_quality: Clean ink forms with crisp, regular reflection bars; no machinery or gadgets are added.
  key_features: broken reflection bars; thin interference lines; steel blue and silver; oil-slick edge tint; enamel sheen against graphite matte
  creative_brief: "Cool noir anime ink where every reflective surface is drawn as short broken reflection bars and thin interference lines, like light sliding over wet steel. Carry it through broken reflection bars, thin interference lines, steel blue and silver, oil-slick edge tint, enamel sheen against graphite matte. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
