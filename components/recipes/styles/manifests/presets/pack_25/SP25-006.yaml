visualDna:
  aesthetic: 'Elastic Loop Wordmarks: letters of the exact requested word connected by one or two controlled loops that keep rhythm and counters open.'
  subject_treatment: Set the requested word exactly and connect a few letters with one or two loops that grow out of compatible strokes, keeping the full letter skeletons.
  color_and_tone: One dominant ink with generous open counters and clear separation inside each loop.
  lighting_and_shadow: Flat reading, with elasticity expressed through curve tension and stroke changes.
  texture_and_material: Clean curves, contained terminals and continuous weight, with local optical tuning.
  camera_and_composition: Linked zones alternate with resting spaces, keeping word spaces clearly open.
  atmosphere_and_mood: Elastic and friendly, with one expansive gesture that never floods the whole word.
  rendering_and_quality: The word reads first, and the path of the loop is discovered a moment later.
  creative_brief: "Elastic Loop Wordmarks: letters of the exact requested word connected by one or two controlled loops that keep rhythm and counters open. Carry it through controlled loops, exact word, open counters, one expansive gesture. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: controlled loops; exact word; open counters; one expansive gesture
