visualDna:
  aesthetic: 'Skateboard deck graphic: 80s punk screenprint artwork with dripping slime, bold iconography and thick black keylines, printed flat in loud spot colors.'
  subject_treatment: Keep the prompt subject intact and render it as a flat screenprinted deck-style graphic; the board itself is never drawn or added.
  color_and_tone: Toxic green, hot pink, electric purple and yellow spot colors on black, with slime drips.
  lighting_and_shadow: No rendered light; flat spot colors with cel-style halftone shading.
  texture_and_material: Screenprint misregistration, thick keylines, drippy slime edges, worn print scuffs.
  camera_and_composition: Tall centered emblem composition with the subject rising out of flames or slime.
  atmosphere_and_mood: Rebellious and loud, pure street-culture swagger in every drip.
  rendering_and_quality: Flat screenprint art only; no skateboard object, no brand or magazine names.
  key_features: flat spot-color screenprint; dripping slime; thick keylines; tall emblem composition; misregistration
  creative_brief: "Skateboard deck graphic: 80s punk screenprint artwork with dripping slime, bold iconography and thick black keylines, printed flat in loud spot colors. Carry it through flat spot-color screenprint, dripping slime, thick keylines, tall emblem composition, misregistration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
