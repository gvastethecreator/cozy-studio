visualDna:
  aesthetic: '90s sitcom set look: a bright three-wall studio set lit by an even overhead wash, staged so every actor faces the audience side.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Warm beige, cream and wood tones with one or two cheerful accent colors; low contrast.
  lighting_and_shadow: Flat overhead studio wash from many fixtures, soft multiple shadows, no dark corners anywhere on the set.
  texture_and_material: Floral sofas, wood paneling, kitchen counters and knickknacks, all clean and new-looking.
  camera_and_composition: Wide proscenium framing from the missing fourth wall, actors spread in a shallow arc, doors and stairs visible.
  atmosphere_and_mood: Cozy and comic, a safe living room where every problem resolves by the end.
  rendering_and_quality: Clean broadcast color of the set itself; tape artifacts belong to Analog Sitcom Multicam, not here.
  key_features: three-wall studio set; flat overhead wash; actors staged toward the fourth wall; beige and cream palette; proscenium framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies 90s Sitcom as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
