visualDna:
  aesthetic: >-
    Shift color through undulating internal bands: hue and value drift across stable silhouettes
    while fine contours preserve shape.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Variation stays
    in color and mark rhythm, never subject mutation.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use layered green, bronze,
    aqua, and a few rose or violet notes; avoid rainbow shifts and honor explicit palette.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow the actual source; permit local hue
    changes between planes but no psychedelic glow or new light effect.
  texture_and_material: >-
    Apply texture only to materials already present. Build thin translucent washes and fine
    stippled transitions without turning the image into noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let color rhythm follow
    existing shapes and depth without adding patterns or warped axes.
  atmosphere_and_mood: >-
    Keep requested mood; chromatic variation is not hallucination, comedy, or disorientation.
  rendering_and_quality: >-
    Keep silhouettes stable, internal transitions controlled, and small details readable under
    layered color.
  key_features: >-
    Undulating internal color; stable contours; layered green-bronze values; restrained stipple.
  creative_brief: 'Use undulating internal color; stable contours; layered green-bronze values; restrained stipple. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
