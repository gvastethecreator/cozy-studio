  color_and_tone: Color per zone backed by name and symbol, with contrast against the site materials.
  lighting_and_shadow: The site light kept, the field readable in bright and shaded parts.
  texture_and_material: Conceptual paint or vinyl of even coverage with precise edges.
  camera_and_composition: Field tied to the entrance and destination, hardware and circulation left clear.
  atmosphere_and_mood: A clear transition between areas with a confident spatial identity.
  rendering_and_quality: Clean application aligned to real edges with the building scale kept.
