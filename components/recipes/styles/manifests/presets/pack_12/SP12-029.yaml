visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Subnautica gameplay screenshots: first-person
    underwater survival capture with alien reefs, submarine tools, oxygen pressure, creature scale,
    and readable swim depth. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Subnautica-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Subnautica-informed palette: tropical cyan, coral orange, kelp green, deep blue, white
    suit plastic, and bioluminescent violet. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through sun shafts through water, flashlight cones, creature glow, base LEDs,
    and pressure-dark abyss gradients. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from soft coral, glass domes, bubbles, fins, titanium tools, alien flora, wet
    plastic, and refracted water haze. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person swim framing with tool/hand foreground, oxygen-route urgency, reef
    silhouettes, and base/navigation landmarks. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Subnautica-derived mood: wonderful, vulnerable, aquatic, exploratory, and quietly
    terrifying. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: oxygen, depth,
    health/food/water, quick slots, and compass are essential if kept like survival-game UI.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Subnautica gameplay screenshots; first-person underwater survival capture with alien reefs,
    submarine tools, oxygen pressure, creature scale, and readable swim depth; tropical cyan, coral
    orange, kelp green, deep blue, white suit plastic, and bioluminescent violet; sun shafts through
    water, flashlight cones, creature glow, base LEDs, and pressure-dark abyss gradients; soft
    coral, glass domes, bubbles, fins, titanium tools, alien flora, wet plastic, and refracted water
    haze; first-person swim framing with tool/hand foreground, oxygen-route urgency, reef
    silhouettes, and base/navigation landmarks; wonderful, vulnerable, aquatic, exploratory, and
    quietly terrifying; HUD guidance: oxygen, depth, health/food/water, quick slots, and compass are
    essential if kept like survival-game UI
  creative_brief: >-
    Use Subnautica Coral Reef Survival as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Subnautica: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
