visualDna:
  aesthetic: 'Hexagonal force-field shader: a transparent energy dome or shell around the named subject, fresnel-bright at its rim, tiled with faint hexagon cells that flare at impact points.'
  subject_treatment: Keep the prompt subject, setting, camera and normal CGI beauty render; this shader adds only its one named effect on the stated geometry, computed in the renderer rather than photographed.
  color_and_tone: One energy hue (teal, gold or violet) over the unchanged scene, bright white-hot rings at impacts.
  lighting_and_shadow: The shield adds soft light on nearby surfaces; impacts throw brief bright pulses, the scene light otherwise unchanged.
  texture_and_material: Hex cell grid visible mostly near the rim and around impacts, expanding ripple rings, scrolling noise inside cells.
  camera_and_composition: Keep the requested camera; the dome edge crosses the frame so the fresnel rim reads.
  atmosphere_and_mood: Tense and protective, a barrier holding under strain.
  rendering_and_quality: Real-time VFX shader finish with clean additive glow; the subject stays sharp behind the shell.
  creative_brief: "Hexagonal force-field shader: a transparent energy dome or shell around the named subject, fresnel-bright at its rim, tiled with faint hexagon cells that flare at impact points. Carry it through fresnel-bright dome rim, hexagon cell tiling, impact ripple rings, single energy hue, subject clear behind the shell. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fresnel-bright dome rim; hexagon cell tiling; impact ripple rings; single energy hue; subject clear behind the shell
