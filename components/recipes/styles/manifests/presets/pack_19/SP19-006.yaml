visualDna:
  aesthetic: Direct ink drawing on paper shaped by absorbent blot-lift marks taken from still-wet washes.
  subject_treatment:
    Preserve the requested subject, silhouette and proportions. Build its forms with brushed ink,
    then lift selected lights with absorbent contact while the paper remains wet.
  color_and_tone:
    Honor the requested palette. Use retained ink for dark anchors and lifted paper-toned passages
    for light; keep accents subordinate to the subject's color identity.
  lighting_and_shadow:
    Follow the requested light direction with local lifted highlights and connected brushed shadows;
    do not introduce a new lamp or photographic lighting setup.
  texture_and_material:
    Show soft-edged absorbent lift marks and residual ink tide lines only where the wet paper was
    touched. The image remains a direct drawing, with no plate grain or transferred impression.
  camera_and_composition:
    Retain the requested frame and viewpoint. Place lifted lights along existing planes so the
    subject remains readable within its original arrangement.
  atmosphere_and_mood:
    Let the balance of retained and lifted ink carry the requested mood without requiring paper
    damage, archival props or a nostalgic scene.
  rendering_and_quality:
    Keep one coherent direct drawing, controlled wet edges and a clear focal silhouette. Avoid
    monotype transfer marks, global blur and random distress.
avoidRules:
  - plate-transfer or ghost impressions
  - uniform erasure of all detail
  - random distress overlay
