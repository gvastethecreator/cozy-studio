visualDna:
  aesthetic: 'Stitched-Edge Symbols: cut pieces of flat material joined by large controlled stitches that explain how the parts connect.'
  subject_treatment: Join the prompt's subject from a few cut pieces with large visible stitches where they meet, keeping the silhouette clean.
  color_and_tone: Limited colors per piece with controlled contrast for the thread.
  lighting_and_shadow: Diffuse light with minimal raised relief along the thread line.
  texture_and_material: Matte surfaces, stitches of consistent scale and clean cut edges.
  camera_and_composition: A few large pieces with one focal seam, most edges left plain.
  atmosphere_and_mood: Handmade closeness and a repairable build, warm and tidy.
  rendering_and_quality: The figure reads without the stitches, which only add the relationship.
  creative_brief: "Stitched-Edge Symbols: cut pieces of flat material joined by large controlled stitches that explain how the parts connect. Carry it through cut pieces, large stitches, one focal seam, repairable build. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cut pieces; large stitches; one focal seam; repairable build
