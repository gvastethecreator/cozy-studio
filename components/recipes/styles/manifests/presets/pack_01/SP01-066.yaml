visualDna:
  aesthetic: >-
    Automotive Photography acts as a transferable photographic style router: begin from Automotive
    commercial polish, Reflective speed isolation, and commercial photographic system built from
    sellable clarity, controlled studio craft, material desirability, and brand-neutral polish, then
    apply the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Sleek curves; preserve prompt identity while making silhouette,
    surface, freshness, scale, and product-like value immediately readable, keeping the original
    subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Metallic paint; use palette as campaign control: clean whites, luxury neutrals,
    appetite warmth, cool tech accents, automotive reflections, or interior harmony, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Studio sweep or motion blur; shape light with softboxes, reflectors, rim lines, HDR fill,
    glossy kickers, window balance, or packshot sweep shadows, preserving believable exposure,
    shadow density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Reflection; render metal, glass, fabric, food surface, condensation, cosmetic gel,
    architecture finish, and clean contact shadows with precise detail, avoiding both waxy smoothing
    and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Motion blur wheels; compose for catalog clarity, top-down order, hero
    compression, architectural verticals, lifestyle layout, or premium macro depth, with lens
    distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Fast, powerful; derive mood from appetite, trust, luxury, engineering,
    cleanliness, freshness, aspiration, or frictionless retail function, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Top Gear, expensive; finish with professional photo polish, accurate material
    response, clean retouching, and no fake logo, UI, or unreadable label clutter, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: >-
    Automotive commercial polish; Reflective speed isolation; Metallic paint; Studio sweep or motion
    blur; Motion blur wheels
  creative_brief: >-
    Apply Automotive Photography as a photographic preset over prompt X: preserve the user's
    requested subject, then route Automotive commercial polish, Metallic paint, Studio sweep or
    motion blur, Reflection, and Motion blur wheels through optics, exposure, palette, surface
    response, timing, and finish without requiring the card image's original subject.
