visualDna:
  aesthetic: 'Room-scale VR environment render: the scene built as an optimized real-time level seen from standing eye height, with baked lighting and everything sharp for stereo viewing.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Bright, clean, slightly saturated colors with lifted shadows so nothing collapses to black inside a headset.
  lighting_and_shadow: Baked lightmaps with soft precomputed shadows and light probes; no dynamic flicker, no heavy volumetrics.
  texture_and_material: Simplified geometry with clean bevels, crisp mid-resolution textures, large readable surfaces and props sized for a hand to grab.
  camera_and_composition: Keep the requested location seen at about 1.6 m eye height with a wide 100–110° field of view; near-field objects within arm reach create presence.
  atmosphere_and_mood: Embodied and inviting, a space you feel you could step into and touch.
  rendering_and_quality: No depth of field, no motion blur and no film grain; stable, evenly sharp real-time render ready for stereo.
  key_features: standing eye height; wide field of view; baked lightmaps; props within arm reach; no depth of field
  creative_brief: "Room-scale VR environment render: the scene built as an optimized real-time level seen from standing eye height, with baked lighting and everything sharp for stereo viewing. Carry it through standing eye height, wide field of view, baked lightmaps, props within arm reach, no depth of field. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
