  color_and_tone: Black, red tartan, bleach white and one shock color in the hair.
  lighting_and_shadow: Harsh flash or grimy club light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Worn leather, studs, safety pins, ripped cotton, tartan wool and metal chains.
  camera_and_composition: Aggressive, close or full figure with energy, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Rebellious, raw, loud and anti-establishment, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Gritty, contrasty finish, with believable fabric weight, seams and fit detail.
  key_features: safety pins and rips; studded leather; tartan bondage trousers; spiked dyed hair; harsh flash
