visualDna:
  aesthetic: 'Flung-ink splash: ink thrown and splashed onto paper in bold bursts, then given just enough brush marks to become mountains, trees or creatures.'
  subject_treatment: Build the prompt's subject from splashed and flung ink bursts, then clarify it with a few precise brush touches so it stays recognizable.
  color_and_tone: Black ink in every dilution from dense to watery grey on white paper, with at most one small color accent.
  lighting_and_shadow: Light comes from the white paper left between splashes; darkness comes from where the ink landed heaviest.
  texture_and_material: Radiating spatter, droplet trails, pooled splash centers and a few sharp brush accents on absorbent paper.
  camera_and_composition: Asymmetric composition with splash energy flowing diagonally and large areas of empty paper.
  atmosphere_and_mood: Explosive, spontaneous and poetic, a landscape born from an accident.
  rendering_and_quality: Bold uncontrolled splash forms tamed by few careful strokes, never a neat illustration.
  creative_brief: "Flung-ink splash: ink thrown and splashed onto paper in bold bursts, then given just enough brush marks to become mountains, trees or creatures. Carry it through thrown ink bursts, droplet trails, few clarifying strokes, empty paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thrown ink bursts; droplet trails; few clarifying strokes; empty paper
