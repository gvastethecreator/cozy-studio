visualDna:
  aesthetic:
    'An aquatic synthetic/digital language: electric turquoise and coral accents, liquid-glass gradients,
    pearlescent surfaces, bubble lenses and coral-like circuitry make forms fluid, virtual and marine.'
  subject_treatment:
    Preserve subject and locks. Restyle open silhouettes, surfaces and interfaces with flowing
    synthetic curves, tidal bands, iridescent modules or coral-circuit branching; keep it aquatic-digital,
    not merely nautical. Integrate bubble-lens and coral-circuit details into existing forms; do not add posters,
    slogans or separate aquatic decor unless requested.
  color_and_tone:
    Use saturated aqua, cyan, teal and sea-glass with coral pink, violet or acid-lime accents
    and deep-blue contrast. Respect palette; where it is open, reserve saturated accents for selected existing
    surfaces and keep large room planes light or neutral to avoid a blue wash.
  lighting_and_shadow:
    Honor stated light and sources. Where unspecified, use luminous gradients and tight
    pearlescent highlights on synthetic surfaces, not forced underwater rays or glow.
  texture_and_material:
    Distinguish liquid glass, iridescent polymer, translucent shell composites and matte
    digital panels. Apply wet gloss selectively.
  camera_and_composition:
    Preserve viewpoint and placement. Let tide bands and digital geometry guide the eye
    without requiring ocean, vessel, reef or sea creature.
  atmosphere_and_mood:
    Convey fluidity, playful synthetic futurism, depth or electronic calm in the requested
    tone. Mangrove structures remain one possible ecological expression.
  rendering_and_quality:
    Use smooth graphic gradients, crisp digital contours and high-contrast synthetic details.
    Make aquatic-digital character read at thumbnail scale without reef clutter.
avoidRules:
  - Do not reduce Seapunk to mariner equipment, industrial pressure lines or a blue filter.
  - Do not require vessel, reef, underwater scene, settlement or marine animal.
  - Avoid all-over wet gloss, unrelated circuitry and unsupported glow.
