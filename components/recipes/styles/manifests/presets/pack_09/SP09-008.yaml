visualDna:
  aesthetic: 'Mossy rock: weathered stone covered in cushions of green moss and lichen.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target turns into weathered stone covered with thick moss cushions and lichen patches.'
  color_and_tone: Vivid moss green, lichen yellow and grey stone, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft, damp forest light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Velvety moss cushions, crusty lichen and damp stone, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Ancient, quiet, overgrown and living, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: moss cushions; lichen patches; damp weathered stone; forest green
  creative_brief: "Mossy rock: weathered stone covered in cushions of green moss and lichen. Carry it through moss cushions, lichen patches, damp weathered stone, forest green. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
