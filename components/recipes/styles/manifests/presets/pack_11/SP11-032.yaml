visualDna:
  aesthetic: >-
    Latte Art operates as a portable source-router layer: combine Microfoam surface drawing,
    espresso-crema contrast, barista flow geometry, sip-away temporary art with culinary
    presentation logic with edible surface behavior, plating structure, gloss, freshness, and
    commercial appetite cues, so the preset supplies visual behavior rather than a fixed card scene
    or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms plate,
    glaze, slice, stack, melt, drizzle, arrange, chill, steam, or stylize through edible material
    logic through Soft foam edges, pour-line curves, rosetta-leaf ripple, tulip-stack layers,
    heart-pour symmetry; identity stays readable through construction grammar, proportion, edge
    logic, and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through appetite-driven hues, ingredient contrast, caramelization, freshness accents,
    creamy highlights, and controlled richness; keep hue roles intentional, value separation clear,
    and palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Overhead soft warmth, surface-spot highlights, crema-gloss catch, steamed-milk sheen plus
    editorial food lighting with glossy highlights, soft appetite shadows, condensation sparkle, and
    texture reveal as the light-response contract, with readable hierarchy, controlled contact
    detail, and no lighting choice that erases the user's requested content.
  texture_and_material: >-
    Render Microfoam bubbles, velvet-milk surface, crema-oil slick, silky-pour viscosity, latte-art
    canvas plus sauce viscosity, crumb structure, gelatin shine, raw sheen, baked crust, ice, foam,
    steam, and surface freshness; surface scale, residue, gloss, grain, fiber, pores, edges, or
    signal artifacts must remain coherent across figures, objects, and environments.
  camera_and_composition: >-
    Compose with Liquid surface, pour-path flow, surface-tension boundary, optional cup-rim
    curvature plus plating geometry, negative space, ingredient rhythm, commercial clarity, and
    edible detail scale as reusable framing grammar, allowing cards, portraits, objects, scenes, and
    abstract prompts to inherit the style without one required layout.
  atmosphere_and_mood: >-
    Carry mood through freshness, indulgence, premium service, comfort, celebration, appetite, and
    sensory immediacy; the emotional tone should feel specific to Latte Art while still obeying the
    prompt's subject and context.
  rendering_and_quality: >-
    Finish with appetizing material truth, precise gloss control, clean detail priority, and no
    messy cafeteria drift; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Microfoam surface drawing, espresso-crema contrast, barista flow geometry, sip-away temporary
    art; Soft foam edges, pour-line curves, rosetta-leaf ripple, tulip-stack layers, heart-pour
    symmetry; Microfoam bubbles, velvet-milk surface, crema-oil slick, silky-pour viscosity,
    latte-art canvas; Overhead soft warmth, surface-spot highlights, crema-gloss catch, steamed-milk
    sheen; Liquid surface, pour-path flow, surface-tension boundary, optional cup-rim curvature
  creative_brief: >-
    Use Latte Art after prompt X as a transferable style layer: prompt X supplies subject, action,
    and setting, while the preset supplies Microfoam surface drawing, espresso-crema contrast,
    barista flow geometry, sip-away temporary art, Soft foam edges, pour-line curves, rosetta-leaf
    ripple, tulip-stack layers, heart-pour symmetry, Microfoam bubbles, velvet-milk surface,
    crema-oil slick, silky-pour viscosity, latte-art canvas, Overhead soft warmth, surface-spot
    highlights, crema-gloss catch, steamed-milk sheen, Liquid surface, pour-path flow,
    surface-tension boundary, optional cup-rim curvature plus portion geometry, garnish rhythm,
