visualDna:
  aesthetic: 'Diazo line print: an old ammonia whiteprint copy of a drawing, with blue-violet or sepia lines on pale paper and uneven developing haze.'
  subject_treatment: Show the prompt's subject as a copied line drawing, keeping its outline and structure clear while the process tints and softens the lines.
  color_and_tone: Blue-violet or brown lines on off-white paper with a faint tinted haze in large areas.
  lighting_and_shadow: No modeled light; hatched or filled areas from the original drawing print as tinted tone.
  texture_and_material: Slightly fuzzy lines, streaky ammonia development, faded edges and folded copy creases.
  camera_and_composition: Technical or illustrative layout on a large sheet, with wide margins and fold lines.
  atmosphere_and_mood: Archival, practical and faded, like plans found in an old office.
  rendering_and_quality: Authentic copied line work with process haze and creases, never crisp digital lines.
  creative_brief: "Diazo line print: an old ammonia whiteprint copy of a drawing, with blue-violet or sepia lines on pale paper and uneven developing haze. Carry it through blue-violet lines, ammonia haze, fold creases, fuzzy copy edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: blue-violet lines; ammonia haze; fold creases; fuzzy copy edges
