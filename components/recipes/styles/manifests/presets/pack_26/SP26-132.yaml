  aesthetic: 'Peter Saville Factory Records cover look of the late 1970s and 1980s: austere minimalism, classical paintings or scientific data cropped cool, pale colors, tiny or absent type and precise modernism.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; reduce the subject to an austere minimal image, data chart or classical fragment with tiny type. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pale cream, cool grey and one muted accent.
  lighting_and_shadow: Flat cool printed light, lit the way Peter Saville lights its scenes.
  texture_and_material: Matte uncoated sleeve with precise print, with the surface finish of Peter Saville.
  camera_and_composition: Centered austere minimal composition, framed the way Peter Saville composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cool austere melancholy.
  rendering_and_quality: Faithful Factory-era minimal cover, in the recognizable hand of Peter Saville.
  creative_brief: "Peter Saville Factory Records cover look of the late 1970s and 1980s: austere minimalism, classical paintings or scientific data cropped cool, pale colors, tiny or absent type and precise modernism. Carry it through Saville austere minimalism, tiny type, cool. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
