visualDna:
  aesthetic: >-
    Build the graphic anime treatment from narrow dark contours with selective cold edge light and
    vertical forms rising through deep layered shadow blocks. Let narrow vertical sweeps
    punctuated by short bright accents set its rhythm; use black and indigo with cold cyan
    highlights for color and smooth shadow gradients with crisp luminous edges for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use narrow dark contours with selective cold edge
    light for edge work, vertical forms rising through deep layered shadow blocks for form
    simplification, and narrow vertical sweeps punctuated by short bright accents only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with black and indigo with cold cyan highlights. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: deep value falloff with restrained cool rims. Keep shadows grouped
    and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth shadow gradients with crisp luminous edges, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use tall stacked planes and strong vertical scale within
    the existing frame to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey quiet awe and controlled intensity, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with dark tonal depth, thin cyan edges, and a clear vertical hierarchy; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    narrow dark contours with selective cold edge light; vertical forms rising through deep
    layered shadow blocks; black and indigo with cold cyan highlights; narrow vertical sweeps
    punctuated by short bright accents; smooth shadow gradients with crisp luminous edges; tall
    stacked planes and strong vertical scale within the existing frame.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with narrow dark contours
    with selective cold edge light, vertical forms rising through deep layered shadow blocks, and
    black and indigo with cold cyan highlights; use narrow vertical sweeps punctuated by short
    bright accents only where movement is already present, and apply smooth shadow gradients with
    crisp luminous edges as the drawing finish.
