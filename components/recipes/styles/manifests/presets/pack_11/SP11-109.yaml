visualDna:
  aesthetic: 'Terahertz scan: a soft, blurry, low-resolution image that sees through paper, cloth and plastic but not metal or water.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: a soft false-color intensity map where cloth, paper and wood fade away and metal and wet objects show as bright solid shapes."
  color_and_tone: Blue-to-yellow false-color intensity, exactly as the instrument maps its signal.
  lighting_and_shadow: No light; intensity is reflected terahertz signal, because the image shows signal, not ordinary light.
  texture_and_material: Blurry pixels, speckle and soft edges, as real instrument artifacts rather than decoration.
  camera_and_composition: Frontal scan of a person or package, matching how this instrument actually frames data.
  atmosphere_and_mood: Clinical, eerie, intrusive and quiet, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Terahertz Package Scan as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: sees through cloth; bright metal; soft blur
