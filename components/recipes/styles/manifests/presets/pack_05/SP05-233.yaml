visualDna:
  aesthetic: >-
    Disciplined survival graphics with sealed angular divisions, compact high-contrast shapes,
    exact seam lines, and restrained caution-color accents.
  subject_treatment: >-
    Preserve the requested form and identity. Emphasize its existing structural divisions with
    thick clean outlines and compact shadow planes; add no suit or equipment.
  color_and_tone: >-
    Pair cold white, steel, charcoal, and deep blue with a small amber caution accent; keep the
    palette practical and controlled.
  lighting_and_shadow: >-
    Use crisp cel-shadow bands and hard edge highlights to separate surfaces; avoid suggesting
    vacuum lighting or a sealed chamber.
  texture_and_material: >-
    Keep depicted materials recognizable while adding fine scuffs, tight seam marks, and limited
    grain in protected areas.
  camera_and_composition: >-
    Honor the requested camera. Group existing contours compactly and maintain clear separation
    between forms without forcing a survival layout.
  atmosphere_and_mood: >-
    Suggest disciplined endurance through compact values, exact linework, and restrained accents
    rather than peril or confinement.
  rendering_and_quality: >-
    Use stable outlines, hard shadow separation, minimal glow, and carefully rationed surface
    detail.
  key_features: >-
    Sealed angular divisions; compact value groups; cool steel palette; restrained amber
    signals.
  creative_brief: >-
    Preserve the requested subject and composition. Apply compact angular contours, crisp shadow
    bands, and restrained caution accents; add no spacesuit, equipment, or chamber.
