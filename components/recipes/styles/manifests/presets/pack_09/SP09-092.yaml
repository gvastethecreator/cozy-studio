visualDna:
  aesthetic: 'Memory foam: slow-rebound foam holding fresh imprints of hands and objects.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of dense memory foam with fresh handprint and pressure imprints slowly recovering."
  color_and_tone: Pale grey, blue or white foam, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light showing imprint depth, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Open-cell foam with deep slow-rebound imprints, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Soft, quiet, strange and yielding, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Memory foam: slow-rebound foam holding fresh imprints of hands and objects. Carry it through memory foam, handprint imprints, slow rebound. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: memory foam; handprint imprints; slow rebound
