  aesthetic: 'Dave Sutherland early role-playing module look: crude earnest ink drawings, stiff heroic figures, simple dungeon architecture and seventies amateur-professional charm.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in crude earnest seventies ink with stiff heroic figures and simple architecture. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink on off-white, true to the Dave Sutherland palette.
  lighting_and_shadow: Flat simple ink light, lit the way Dave Sutherland lights its scenes.
  texture_and_material: Black ink on cheap paper with photocopy grain and slight bleed.
  camera_and_composition: Straightforward frontal composition, framed the way Dave Sutherland composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with earnest early adventure.
  rendering_and_quality: Early seventies dungeon module ink drawing, in the recognizable hand of Dave Sutherland.
  creative_brief: "Dave Sutherland early role-playing module look: crude earnest ink drawings, stiff heroic figures, simple dungeon architecture and seventies amateur-professional charm. Carry it through Sutherland crude earnest ink, stiff heroes, simple dungeons. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
