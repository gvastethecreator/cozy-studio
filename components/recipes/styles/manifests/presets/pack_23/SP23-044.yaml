visualDna:
  aesthetic: >-
    Combine fine descriptive line with calm painted masses and contained color. Create visual interest
    through line rhythm, spacing and shape relationships without adding narrative content.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, anatomy and proportions. Apply fine
    lines to clarify existing details without changing subject attributes or adding content.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. Keep color measured and organized within
    the chosen hues; do not impose a palette or saturation level.
  lighting_and_shadow: >-
    Follow the requested lighting and shadows. Use painted masses to reinforce the existing structure
    without imposing a different light source or heightened drama.
  texture_and_material: >-
    Keep line density selective and paint-like areas calm. Preserve the actual materials; do not add
    grime, generalized surface wear or paper texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, arrangement and focus. Do not impose a new
    scene hierarchy or layout.
  atmosphere_and_mood: >-
    Preserve the user's requested setting and mood. Graphic delicacy or irregularity does not require
    a particular genre, period or narrative.
  rendering_and_quality: >-
    Keep descriptive linework crisp, painted masses quiet and color restrained only as requested.
    Balance detail and open space so marks support rather than replace the subject.
avoidRules:
  - unrequested changes to subject attributes or added content
  - forced palette, lighting or mood
  - grime, blanket texture or generalized wear
  - unrequested text, framing or layout
