visualDna:
  aesthetic: 'Concept art keyframe: one painted production illustration that sells the mood and design of a world moment, with clear focal hierarchy and painted-over photo textures.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Mood-driven limited palette, one dominant temperature with a contrasting accent at the focal point; values grouped for instant read.
  lighting_and_shadow: Strong dramatic lighting design such as god rays, backlight or firelight guiding the eye to the focal point.
  texture_and_material: Loose painted surfaces with photobashed texture detail painted over, crisp design detail only where it matters.
  camera_and_composition: Keep the requested subject in a single cinematic keyframe with clear foreground, midground and background; never a sheet of multiple views.
  atmosphere_and_mood: Moody and evocative, the story of a whole world in one frame.
  rendering_and_quality: Detail concentrated at the focal point, loose elsewhere, paint over photo texture; no multi-panel board, no callouts, no text.
  key_features: single cinematic keyframe; focal hierarchy; painted-over photo texture; dramatic lighting design; mood-driven limited palette
  creative_brief: "Concept art keyframe: one painted production illustration that sells the mood and design of a world moment, with clear focal hierarchy and painted-over photo textures. Carry it through single cinematic keyframe, focal hierarchy, painted-over photo texture, dramatic lighting design, mood-driven limited palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
