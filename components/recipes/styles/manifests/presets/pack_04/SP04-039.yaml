visualDna:
  aesthetic: >-
    Movie Poster (Painted) acts as a transferable illustration router: start from Hand-painted epic
    poster style with airbrushed montage drama, nostalgic theatrical promise, and maximal emotional
    compression, Airbrushed montage composition, theatrical light contrast, high-impact focal
    stacking, title-safe lead archetype spacing and editorial graphic system built from poster
    hierarchy, symbolic compression, typography-as-shape, reproduction limits, and immediate visual
    argument, then apply the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Soft-airbrush contour blending, compositional silhouette
    subjects stacking, and montage-guided directional flow toward focal hierarchy; preserve the
    requested subject while converting it into emblem, poster form, editorial metaphor, collage
    fragment, fashion gesture, or information hierarchy, keeping the requested identity, silhouette,
    pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Bold warm-cool oppositions with theatrical amber/cyan pushes, luminous
    atmospheric transitions, and poster-grade chroma emphasis; use color as communication pressure:
    ink plates, propaganda contrast, deco metallic restraint, psychedelic vibration, Bauhaus
    primaries, vector flatness, or vintage print fade, with deliberate value grouping, accent
    control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through emblematic rim/backlight layering with dramatic key splits, glow accents,
    and stage-like contrast separation; make light serve graphic hierarchy through flat poster
    contrast, airbrush gradients, screenprint layers, symbolic rays, collage mismatch, or painted
    cover drama, so value structure supports the illustration process and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Subtle painted-surface grain with airbrush mist transitions and matte poster-print finish
    cues; surface detail should reveal screenprint ink, risograph grain, paper stock, cut-paper
    edges, vector fields, album-cover wear, or editorial print finish, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Layered montage depth with overlapping portrait scales and symbolic
    depth field expansion for mythic scope; compose through graphic hierarchy, diagonal force,
    asymmetrical grid, ornamental framing, cover impact, information grouping, or fashion elongation
    without readable slogan dependency, with scale, spacing, edge rhythm, and visual hierarchy doing
    the style work.
  atmosphere_and_mood: >-
    Keep the mood Cinematic, nostalgic, anticipatory, grand, emotional; derive mood from propaganda
    urgency, luxe modernity, counterculture heat, editorial wit, travel nostalgia, music-poster
    grit, or cover-story seduction, letting the style alter interpretation without demanding a
    specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Classic illustrated one-sheet fidelity emphasizing narrative condensation, iconic
    readability, and high-drama polish; finish as deliberate graphic communication with crisp shape
    logic, controlled print artifacts, and no random poster text or literal advertisement clutter,
    clean denoised surfaces where appropriate, and enough process evidence to make the style
    recognizable.
  key_features: >-
    Hand-painted epic poster style with airbrushed montage drama, nostalgic theatrical promise, and
    maximal emotional compression; Airbrushed montage composition, theatrical light contrast,
    high-impact focal stacking, title-safe lead archetype spacing; Bold warm-cool oppositions with
    theatrical amber/cyan pushes, luminous atmospheric transitions, and poster-grade chroma
    emphasis; Subtle painted-surface grain with airbrush mist transitions and matte poster-print
    finish cues; Layered montage depth with overlapping portrait scales and symbolic depth field
    expansion for mythic scope
  creative_brief: >-
    Apply Movie Poster (Painted) as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Hand-painted epic poster style with airbrushed montage drama, nostalgic theatrical
    promise, and maximal emotional compression, Airbrushed montage composition, theatrical light
    contrast, high-impact focal stacking, title-safe lead archetype spacing, Subtle painted-surface
    grain with airbrush mist transitions and matte poster-print finish cues without requiring the
    card image's original subject.
