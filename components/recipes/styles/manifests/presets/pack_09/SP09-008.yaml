visualDna:
  aesthetic: >-
    Mossy Rock translates natural material behavior into form: start from Stone covered in green,
    Velvet moss on hard stone, and Softened edges, then turn natural formation, growth, erosion, and
    geological or biological irregularity into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Fuzzy outline: preserve identity and pose while letting
    forms grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Grey stone, Green moss as the material palette, with controlled value separation, local
    color variation, and hue shifts that follow the subject's form rather than flattening it into a
    pasted texture.
  lighting_and_shadow: >-
    Let Soft dappled light define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Mossy Rock without hiding the prompt
    subject.
  texture_and_material: >-
    Render Velvet moss on hard stone through organic variation, non-repeating edge wear, local
    pores, growth marks, and natural scale shifts; keep grain scale, residue, buildup, fractures,
    fiber, pores, or surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Softened edges as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Ancient, quiet by using age, weather, habitat pressure, and sensory association;
    the material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Damp, ancient material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: >-
    Stone covered in green; Fuzzy outline; Velvet moss on hard stone; Soft dappled light; Softened
    edges
  creative_brief: >-
    Route any subject through Mossy Rock as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Apply moss-on-stone contrast to the input:
    velvet green growth softening grey mineral hardness, fuzzy ridges catching soft dappled light,
    damp edges, and softened silhouettes. If rock, ruin, plant, or terrain exists, intensify it;
    otherwise use moss colonization as surface behavior without forcing a woodland floor.
