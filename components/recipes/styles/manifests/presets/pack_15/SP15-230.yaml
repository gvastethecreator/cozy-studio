visualDna:
  aesthetic: 'Faxpunk: a world transmitted by fax, with curling thermal paper, streaky grey scan lines, crushed contrast and endless paper spilling from machines.'
  subject_treatment: Keep the prompt's subject and setting; render it as a streaky fax transmission on curling thermal paper, spilling from a machine.
  color_and_tone: Faded grey and black on warm thermal paper white, with fading brown edges.
  lighting_and_shadow: Harsh office fluorescent light with crushed fax contrast in the image itself.
  texture_and_material: Curling thermal paper, streaky horizontal scan lines, toner speckle and grain.
  camera_and_composition: Images emerging line by line from machines, paper piling on office floors.
  atmosphere_and_mood: Urgent and bureaucratic, messages from far away arriving slowly.
  rendering_and_quality: Low-fidelity fax rendering with streaks, speckle and crushed tones.
  creative_brief: "Faxpunk: a world transmitted by fax, with curling thermal paper, streaky grey scan lines, crushed contrast and endless paper spilling from machines. Carry it through curling thermal paper, scan streaks, crushed contrast, spilling paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: curling thermal paper; scan streaks; crushed contrast; spilling paper
