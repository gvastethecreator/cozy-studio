visualDna:
  aesthetic: >-
    Chalk (Dry) makes hand-feel and pressure visible across the image: start from Sidewalk drawing,
    Powdery, and Smear, then turn touch, softness, pile, fiber density, nap direction, compression,
    and hand-feel into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Dusty stroke: preserve identity and pose while letting
    forms compress, fuzz, soften, catch fibers, and show tactile pressure through edge profile,
    surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Pastel as the material palette, with controlled value separation, local color variation, and
    hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Chalk (Dry) without hiding the prompt subject.
  texture_and_material: >-
    Render Powdery through fiber structure, tactile depth, soft occlusion, fuzz, pile direction, and
    pressure marks; keep grain scale, residue, buildup, fractures, fiber, pores, or surface tension
    coherent across the whole image.
  camera_and_composition: >-
    Compose around Smear as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Playful, temporary by using physical touch, comfort, irritation, warmth, dryness,
    and surface softness; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Temporary, dry material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Sidewalk drawing; Dusty stroke; Powdery; Matte; Smear
  creative_brief: >-
    Route any subject through Chalk (Dry) as a transferable tactile-surface visual system while
    preserving the prompt's subject, action, and setting. Render the powdery ephemera of dry chalk
    dragged across rough surface, leaving a trail of pigmented dust that hovers between presence and
    erasure, pastel color clinging to texture by the faintest of bonds. The mark should feel
    temporary and defiant, a streak of powdered joy that knows it will not survive the next breeze.
    Capture the beauty of the fugitive, art that accepts its own dissolution. Use Chalk as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
