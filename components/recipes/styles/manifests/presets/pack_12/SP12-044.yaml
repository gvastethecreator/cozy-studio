visualDna:
  aesthetic: >-
    Source-informed video-game style router for original stylized palace infiltration JRPG captures:
    third-person stealth route, theatrical palace interiors, masked enemies, graphic UI accents,
    sharp color blocking, and readable ambush/combat transitions. Borrow the stylish readability of
    Persona-like palace gameplay, but land as a different fictional mask-heist JRPG with different
    costumes, symbols, UI icons, menus, and palace motifs.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable stylized palace run screenshot
    subject: keep clear player/enemy/object function, stealth route, ambush distance, cover, and
    interaction affordance without copying source costumes or characters.
  color_and_tone: >-
    Use a stylized palace palette: velvet red, black lacquer, ivory floor light, gold trim, cyan UI
    accent, violet shadow, and theatrical spot color. Keep silhouettes crisp and graphic.
  lighting_and_shadow: >-
    Light the image through stage spotlights, palace glow, high-contrast cel shadows, attack
    flashes, and stylized menu-like transitions. Lighting must clarify the playable route, threat,
    focal subject, or objective and avoid generic cinematic bloom that destroys screenshot
    readability.
  texture_and_material: >-
    Build surfaces from slick cel-shaded characters without copying cast likeness, ornate palace
    props, masks, velvet, cards, and graphic overlays. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person infiltration or combat camera, palace route depth, enemy spacing,
    cover/ambush affordance, and abstract UI shapes. Avoid board-command framing and menu-screen
    composition.
  atmosphere_and_mood: >-
    Carry an original velvet-mask palace mood: stylish, theatrical, rebellious, sly, luxurious, and
    kinetic.
  rendering_and_quality: >-
    Finish as coherent stylized third-person JRPG gameplay screenshot style, not concept art:
    contextual action icons, turn/ambush cues, and graphic UI shapes can appear but must be
    non-readable. Maintain heavy-denoise clarity, crisp silhouettes, and no readable menu text.
  key_features: >-
    Persona 5 Royal gameplay screenshots; stylish JRPG palace capture with angular UI energy,
    red-black fashion, stealth ambush framing, and surreal luxury interiors; crimson red, black,
    cream, gold, saturated blue shadows, and graphic white accents; stage spotlights, palace glow,
    high-contrast cel shadows, attack flashes, and stylized menu-like transitions; slick cel-shaded
    characters without copying cast likeness, ornate palace props, masks, velvet, cards, and graphic
    overlays; third-person palace exploration or turn-based combat framing with ambush angles, enemy
    weaknesses, and dramatic UI rhythm; rebellious, decadent, theatrical, sharp, and stylish; HUD
    guidance: bold JRPG battle/exploration UI is part of the style: angular panels, turn icons, and
    command shapes can appear without readable logo text
  creative_brief: >-
    Use Velvet Mask Palace Run as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through stylized palace JRPG references: third-person stealth/combat
    camera, theatrical color blocking, masked enemies, palace route affordances, and abstract UI
    grammar. Avoid direct Persona cloning, exact costumes, board-command camera, and readable menu
    text.
