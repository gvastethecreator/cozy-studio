visualDna:
  aesthetic: 'Early digital compact camera: a 2–3 megapixel point-and-shoot from the early 2000s with a tiny sensor, harsh flash and heavy JPEG compression.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Cool or yellowish white balance errors, clipped highlights, noisy muddy shadows.
  lighting_and_shadow: Harsh on-camera flash at night, flat bright subjects, black backgrounds.
  texture_and_material: JPEG block artifacts, purple fringing on bright edges, oversharpening halos.
  camera_and_composition: Snapshot framing, deep focus, subjects centered, slight red-eye.
  atmosphere_and_mood: Awkward and nostalgic, the early days of posting everything.
  rendering_and_quality: Low-resolution digital compact look with no readable date overlay.
  key_features: tiny-sensor noise; harsh on-camera flash; JPEG blocks; purple fringing; clipped highlights
  creative_brief: "Early digital compact camera: a 2–3 megapixel point-and-shoot from the early 2000s with a tiny sensor, harsh flash and heavy JPEG compression. Carry it through tiny-sensor noise, harsh on-camera flash, JPEG blocks, purple fringing, clipped highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
