  color_and_tone: Black ink with optional red, indigo and ochre color work.
  lighting_and_shadow: Soft side light to show skin and ink, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Skin with healed ink, linework and shading, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the figure.
  atmosphere_and_mood: Ceremonial, bold, personal and striking, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
