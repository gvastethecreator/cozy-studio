    char, and dry mineral dust, charred metal, tarnish, and sharp ceremonial edges plus ash, smoke,
    polished bowl surfaces, and old paper plus edict-like hierarchy and formal spacing, ash
    converted into repeatable spatial rhythm and symbolic hierarchy plus crown converted into
    repeatable spatial rhythm and symbolic hierarchy, finish discipline, and negative controls
    without requiring a fixed deity, ritual, prop bundle, location, or sample composition.
