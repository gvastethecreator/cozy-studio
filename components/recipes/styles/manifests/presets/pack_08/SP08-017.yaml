visualDna:
  aesthetic: 'Tech-industry uniform: a repeated, disciplined outfit — black knit, slim dark trousers, minimalist sneakers — optimized to remove choice.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a fine black knit or plain tee, slim dark trousers or jeans and matte minimalist sneakers, worn identically and without decoration."
  color_and_tone: Black, charcoal and one cool grey; high tonal discipline.
  lighting_and_shadow: Clean, cool light; soft product-launch glow, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Merino knit, technical cotton and matte synthetic sneaker uppers.
  camera_and_composition: Centered, symmetrical, keynote-like framing with clean backgrounds, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Focused, controlled, austere and a little cultish, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Sleek, low-noise finish, with believable fabric weight, seams and fit detail.
  key_features: black merino knit; slim dark trousers; minimalist sneakers; tonal discipline; keynote framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tech-Industry Uniform as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
