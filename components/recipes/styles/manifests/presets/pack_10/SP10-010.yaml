visualDna:
  aesthetic: 'Voronoi: space divided into irregular cells around seed points, like cracked earth or cells.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is divided into Voronoi cells that follow its form, with thicker cell walls at contours."
  color_and_tone: Organic gradient colors per cell, used consistently across subject and background.
  lighting_and_shadow: Soft shading inside each cell, expressed through the style rather than photographic lighting.
  texture_and_material: Irregular cells with clean borders, visible at card size as the signature of the style.
  camera_and_composition: Cellular fill across subject and ground, arranged so the subject still reads at card size.
  atmosphere_and_mood: Organic, cellular, scientific and modern, driven by the construction, color and rhythm.
  rendering_and_quality: Clean generative finish, with clean, deliberate marks and no accidental noise.
  key_features: Voronoi cells; seed points; cellular borders
  creative_brief: "Voronoi: space divided into irregular cells around seed points, like cracked earth or cells. Carry it through Voronoi cells, seed points, cellular borders. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
