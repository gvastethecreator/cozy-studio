visualDna:
  aesthetic: 'Edge detection line pass: a post-process that draws black lines wherever depth or surface direction jumps, on plain white, with no shading and no triangle wires.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Black lines on white only; line weight heavier at silhouettes and lighter at inner creases.
  lighting_and_shadow: No lighting at all; lines come from depth and normal discontinuities, never from shadows.
  texture_and_material: Uniform computed strokes without taper, occasional doubled or broken lines at thin geometry, no hatching.
  camera_and_composition: Keep the requested camera and perspective; dense mechanical detail yields the richest line work.
  atmosphere_and_mood: Clean and schematic, a scene reduced to its edges.
  rendering_and_quality: Screen-space Sobel filter look with pixel-even lines; no hand-drawn wobble, no mesh wireframe.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Edge Detection Line Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: lines from depth and normal jumps; heavier silhouette lines; white fill; no shading; no mesh triangles
