visualDna:
  aesthetic: 'Data-Ribbon Environments: one continuous band of supplied information runs along the walls, turning the space into a readable timeline.'
  subject_treatment: Run the prompt's supplied data as one continuous band along existing walls, with repeated headers and units and no number cut at a corner.
  color_and_tone: Categories keep their color through the space, one accent for a selected item.
  lighting_and_shadow: Site light kept, with any screens never glaring over content.
  texture_and_material: An explicitly defined print or screen band with crisp type.
  camera_and_composition: Data in readable stretches with pauses and repeated headers.
  atmosphere_and_mood: An informative continuity that follows the cadence of the architecture.
  rendering_and_quality: Clean band with exact values and a static label where nothing is live.
  creative_brief: "Data-Ribbon Environments: one continuous band of supplied information runs along the walls, turning the space into a readable timeline. Carry it through continuous data band, repeated headers, units kept, static label. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: continuous data band; repeated headers; units kept; static label
