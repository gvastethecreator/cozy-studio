visualDna:
  aesthetic: >-
    Measured linework: fine ruled contours, small angular details, and broad cel masses
    separated by an even visual cadence.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Model existing
    forms with articulated contours and regular line intervals; the mechanical rhythm belongs to
    drawing, never added parts.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, slate blue and charcoal
    hold the field; muted amber and cream punctuate it in small, separated areas.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Set narrow warm highlights against cool
    ambient shadow, attached to supplied illumination and existing reflective surfaces.
  texture_and_material: >-
    Apply texture only to materials already present. Mix smooth painted planes with precise
    short hatching at complex edges; keep broad fills clean and material-neutral.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Repeat spacing and align
    value bands within existing forms; invent no machinery, repeated objects, or new axis.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Use crisp-to-open mark contrast as cadence only;
    carry the emotion the user supplied.
  rendering_and_quality: >-
    Keep focal contours precise, midtones open, and tiny dark marks sparse; leave flat areas
    free of speckle.
  key_features: >-
    Measured contour beats; slate-and-amber split; crisp micro-hatch; evenly repeated value
    intervals.
  creative_brief: >-
    Use measured contour beats; slate-and-amber split; crisp micro-hatch; evenly repeated value
    intervals. Keep the requested subjects, action, setting, palette, framing and mood; add no
    scene content.
