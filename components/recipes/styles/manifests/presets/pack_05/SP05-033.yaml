  aesthetic: 'Tatsuki Fujimoto manga look as in Chainsaw Man and Fire Punch: loose chaotic ink, cinematic paneling, deadpan absurdity, splattered black and sudden brutal action.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Fujimoto designs, scruffy plain faces, loose sketchy lines, casual clothes and absurd deadpan expressions. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink and splatter, grey tone and stark white space.
  lighting_and_shadow: Flat cinematic light with blown-out whites and heavy black splatter.
  texture_and_material: Loose scratchy ink, heavy black splatter, rough tone and blown-out white paper.
  camera_and_composition: Cinematic film-like panels, deadpan wides and chaotic action.
  atmosphere_and_mood: Keep the requested mood with deadpan chaotic brutality.
  rendering_and_quality: Loose cinematic manga illustration with chaotic energy and deadpan timing.
  key_features: Fujimoto loose ink; cinematic panels; deadpan absurdity; splatter
  creative_brief: "Tatsuki Fujimoto manga look as in Chainsaw Man and Fire Punch: loose chaotic ink, cinematic paneling, deadpan absurdity, splattered black and sudden brutal action. Carry it through Fujimoto loose ink, cinematic panels, deadpan absurdity, splatter. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
