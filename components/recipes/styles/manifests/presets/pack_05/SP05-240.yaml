visualDna:
  aesthetic: 'Studio Trigger Kill la Kill look (2013): Hiroyuki Imaishi flat angular graphics, huge dramatic poses, red-black-white color blocks, thick outlines and explosive over-the-top battles.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Sushio designs, angular faces, huge exaggerated poses and bold uniforms with sharp shapes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Red, black and white color blocks with explosive yellow flashes.
  lighting_and_shadow: Flat graphic lighting with dramatic silhouettes and flashes.
  texture_and_material: Thick outlines, flat colors, bold shapes and speed lines.
  camera_and_composition: Extreme dramatic poses, low angles and explosive framing.
  atmosphere_and_mood: Keep the requested mood with explosive riotous bravado.
  rendering_and_quality: Bold hyper-energetic Trigger television frame with graphic color blocking.
  key_features: Kill la Kill color blocks; Imaishi angles; huge poses; thick outlines
  creative_brief: "Studio Trigger Kill la Kill look (2013): Hiroyuki Imaishi flat angular graphics, huge dramatic poses, red-black-white color blocks, thick outlines and explosive over-the-top battles. Carry it through Kill la Kill color blocks, Imaishi angles, huge poses, thick outlines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
