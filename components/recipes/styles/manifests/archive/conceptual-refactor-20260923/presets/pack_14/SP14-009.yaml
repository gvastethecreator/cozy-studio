visualDna:
  aesthetic: >-
    Abyssal Leviathan Chapel acts as a transferable mythic-noir router: abyssal negative-space
    pressure plus sacred-architecture pressure without a required locale fused with pantheon-scale
    legend grammar with regalia pressure, mythic jurisdiction, dualities, lineage marks, and
    sovereign symbolism; it carries symbol, omen, ritual authority, and mature editorial restraint
    without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    immense submerged mass and abyssal contour pressure, abyssal shaping silhouette rhythm, contour
    pressure, and symbolic edge control plus sacred-architecture pressure shaping silhouette rhythm,
    contour pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem
    logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or prop
    set.
  color_and_tone: >-
    Map color through deep ultramarine-black and cold green undertones, leviathan-weighted accent
    roles over disciplined dark values plus sacred-architecture pressure-weighted accent roles over
    disciplined dark values together with mineral darks, royal metal, storm blue, cinder orange,
    tidal green, funeral rose, sun-gold, and cold ivory accents; values stay separated, accents feel
    intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use submerged edge glow and swallowed highlights plus narrow devotional rays and cold abyssal
    contrast with oracular backglow, storm breaks, solar slashes, underwater gloom, firelit
    judgment, and sculptural chiaroscuro; shadows must carry omen weight, rims should clarify form,
    and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render wet black mineral sheen and pressure-dark gradients, leviathan-inflected patina, residue,
    grain, and tactile edge behavior plus sacred-architecture pressure-inflected patina, residue,
    grain, and tactile edge behavior alongside bronze, stone, glass, thorn, bone, water, smoke,
    root, scale, feather, hammered iron, and polished relic surfaces; surface scale, patina,
    residue, gloss, grain, and carved or sealed edges must remain coherent across characters,
    objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with vertical nave-like rhythm converted into abstract hierarchy, abyssal converted into
    repeatable spatial rhythm and symbolic hierarchy plus leviathan converted into repeatable
    spatial rhythm and symbolic hierarchy plus frieze rhythm, ring authority, mirrored duality,
    oath-path diagonals, heraldic massing, and mythic scale contrast; the style should support
    portraits, objects, architecture, creatures, symbols, and full scenes through reusable spatial
    grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through subaqueous dread and monumental silence plus sacred verticality-scale dread
    translated into form and austere grandeur, cosmic obligation, sacred violence, stewardship,
    trial, inheritance, and severe ceremonial beauty; the image can become severe, sensual, sacred,
    violent, quiet, or strange when prompt X asks for it, while the preset supplies mythic
    consequence.
  rendering_and_quality: >-
    Finish with abyssal recognition with denoised dark editorial polish and controlled material
    truth plus leviathan recognition with denoised dark editorial polish and controlled material
    truth and painterly myth-noir polish with grounded material physics, denoised darks, and strong
    form hierarchy; prioritize clean denoise, readable dark values, strong silhouette hierarchy,
    tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    abyssal negative-space pressure plus sacred-architecture pressure without a required locale;
    immense submerged mass and abyssal contour pressure, abyssal shaping silhouette rhythm, contour
    pressure, and symbolic edge control plus sacred-architecture pressure shaping silhouette rhythm,
    contour pressure, and symbolic edge control; wet black mineral sheen and pressure-dark
    gradients, leviathan-inflected patina, residue, grain, and tactile edge behavior plus
    sacred-architecture pressure-inflected patina, residue, grain, and tactile edge behavior;
    submerged edge glow and swallowed highlights plus narrow devotional rays and cold abyssal
    contrast; vertical nave-like rhythm converted into abstract hierarchy, abyssal converted into
    repeatable spatial rhythm and symbolic hierarchy plus leviathan converted into repeatable
    spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Abyssal Leviathan Chapel after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies abyssal
    negative-space pressure plus sacred-architecture pressure without a required locale, immense
    submerged mass and abyssal contour pressure, abyssal shaping silhouette rhythm, contour
    pressure, and symbolic edge control plus sacred-architecture pressure shaping silhouette rhythm,
    contour pressure, and symbolic edge control, deep ultramarine-black and cold green undertones,
    leviathan-weighted accent roles over disciplined dark values plus sacred-architecture
    pressure-weighted accent roles over disciplined dark values, submerged edge glow and swallowed
    highlights plus narrow devotional rays and cold abyssal contrast, wet black mineral sheen and
    pressure-dark gradients, leviathan-inflected patina, residue, grain, and tactile edge behavior
    plus sacred-architecture pressure-inflected patina, residue, grain, and tactile edge behavior
    plus vertical nave-like rhythm converted into abstract hierarchy, abyssal converted into
    repeatable spatial rhythm and symbolic hierarchy plus leviathan converted into repeatable
    spatial rhythm and symbolic hierarchy, finish discipline, and negative controls without
    requiring a fixed deity, ritual, prop bundle, location, or sample composition.
