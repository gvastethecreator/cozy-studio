visualDna:
  aesthetic: 'CNC billet machining: the subject carved from a solid block of aluminum, with scalloped toolpath marks, pocketed recesses and crisp chamfers left by the mill.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Bright bare aluminum with selective anodized accents in deep red, cobalt blue or satin black.
  lighting_and_shadow: Studio key with a strip light so the concentric and parallel toolpath scallops shimmer as anisotropic highlights.
  texture_and_material: Ball-end mill scallops on curves, flat facing marks, pocket fillets, drilled holes and deburred chamfers.
  camera_and_composition: Keep the requested view; the angle shows both a toolpath-textured curve and a crisp pocket.
  atmosphere_and_mood: Precise and luxurious, weight and accuracy you can almost feel.
  rendering_and_quality: Machining evidence on every surface, never smooth cast metal or molded plastic.
  creative_brief: "CNC billet machining: the subject carved from a solid block of aluminum, with scalloped toolpath marks, pocketed recesses and crisp chamfers left by the mill. Carry it through solid billet aluminum, toolpath scallops, pocketed recesses, deburred chamfers, anodized accents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: solid billet aluminum; toolpath scallops; pocketed recesses; deburred chamfers; anodized accents
