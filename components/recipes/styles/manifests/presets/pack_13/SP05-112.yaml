visualDna:
  aesthetic: >-
    Combine sharp stencil edges, overspray halos, gravity-led drips and particulate grain; keep the
    marks energetic without introducing letters or tags.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use punchy cyan/magenta accents
    where compatible, with prompt colors remaining readable.
  lighting_and_shadow: >-
    Use flat painted values with a soft overspray halo around selected edges; avoid simulated neon
    light unless requested.
  texture_and_material: >-
    Layer stencil-cut shapes, atomized pigment, drips and rough grain; keep these as rendering
    marks, not new objects.
  camera_and_composition: >-
    Let the spray marks follow existing silhouettes and directional emphasis; do not force a mural
    wall or recompose the frame.
  atmosphere_and_mood: >-
    Wildstyle energy comes from edge and pigment contrast; preserve the prompt's tone, including
    gentle subjects.
  rendering_and_quality: >-
    Apply the spray technique to any subject without adding graffiti letters, wall, logo, tag or
    lettering. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Stencil edge; overspray halo; paint drips; particulate grain; bold contour energy; cyan/magenta
    accents.
  creative_brief: "Apply this visual treatment to the requested content: Stencil edge; overspray halo; paint drips; particulate grain; bold contour energy; cyan/magenta accents. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uniform airbrush edges erasing stencil cuts
  - overspray obscuring source contours
  - gravity-inconsistent drips
assets:
