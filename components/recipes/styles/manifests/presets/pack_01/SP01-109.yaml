visualDna:
  aesthetic: 'Low oblique aerial: a camera in a helicopter or small plane looking down at 30–45 degrees from a few hundred meters, showing relief, depth and often the horizon.'
  subject_treatment: Keep the prompt subject, action and setting; this preset owns the camera position and lens, so re-stage only the viewpoint as described.
  color_and_tone: Natural landscape color with atmospheric blue in the distance.
  lighting_and_shadow: Low raking sun at dawn or dusk that carves terrain relief and casts long shadows from structures.
  texture_and_material: Fields, cliffs, walls, water and roads read as relief and texture; people tiny but visible.
  camera_and_composition: Angled downward view with depth receding to a high horizon or distant haze; subject in the near third.
  atmosphere_and_mood: Expansive and exploratory, the land revealed as a whole shape at once.
  rendering_and_quality: Aerial survey clarity with haze falloff; distinct from a straight-down drone view and from tilt-shift miniature blur.
  creative_brief: "Low oblique aerial: a camera in a helicopter or small plane looking down at 30–45 degrees from a few hundred meters, showing relief, depth and often the horizon. Carry it through 30–45 degree downward angle, raking dawn light, terrain relief, distant haze and horizon, tiny human scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: 30–45 degree downward angle; raking dawn light; terrain relief; distant haze and horizon; tiny human scale
