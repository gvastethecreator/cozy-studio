visualDna:
  aesthetic: 'Anime pass-by staging: the moving subject sweeps past extremely close to the lens, a large part of it cropped and softly blurred in the near foreground, while the setting behind stays sharp.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the pass-by framing where part of the subject sweeps across the lens, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the near-lens part reads as a large dark or saturated mass against a lighter background.
  lighting_and_shadow: Existing light on the background; the passing part is mostly in its own shadow with a bright edge.
  texture_and_material: Soft defocus on the near-lens part only, with crisp cel detail on everything beyond it.
  camera_and_composition: Static eye-level camera; the passing subject fills one side of the frame, cut by two frame edges, while the background occupies the rest.
  atmosphere_and_mood: A sudden whoosh, the viewer almost brushed by the movement.
  rendering_and_quality: Controlled focus split between the soft near mass and the sharp background, with the subject still identifiable.
  creative_brief: "Anime pass-by staging: the moving subject sweeps past extremely close to the lens, a large part of it cropped and softly blurred in the near foreground, while the setting behind stays sharp. Carry it through subject sweeping past the lens, cropped by two frame edges, soft near-lens defocus, sharp background, bright edge on passing mass. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: subject sweeping past the lens; cropped by two frame edges; soft near-lens defocus; sharp background; bright edge on passing mass
