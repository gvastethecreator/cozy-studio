visualDna:
  aesthetic: 'Storybook colored pencil: soft layered wax pencil built up in directional strokes on toothy paper, cozy interiors and animals drawn with warmth.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Muted warm-cool layers, honey, rust, moss and dusty blue, blended by glazing one pencil over another.
  lighting_and_shadow: Diffuse warm lamplight with low contrast, shadows built by denser layered hatching.
  texture_and_material: Visible paper tooth speckling through every stroke, directional hatching following form, soft burnished areas.
  camera_and_composition: Close, cozy framing at child or animal eye level, soft edges falling off toward the paper.
  atmosphere_and_mood: Quiet, reflective and warm, a bedtime-story hush.
  rendering_and_quality: Intimate hand-pressure nuance with visible strokes; no ink line and no paint.
  key_features: layered wax pencil; paper tooth speckle; directional hatching; honey and moss palette; cozy close framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Storybook Colored Pencil as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
