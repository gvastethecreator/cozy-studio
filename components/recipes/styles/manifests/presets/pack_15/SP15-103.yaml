visualDna:
  aesthetic:
    'Make modular synthesis the graphic system through socket-like circles, grouped control ticks,
    routed cable-like lines, compact waveforms, and sharp divisions drawn on compatible existing forms;
    do not build new equipment or a control-room environment.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; apply modular grids, cable paths, and
    signal-color accents as localized marks on compatible existing surfaces. Do not replace a room with
    control panels or add a synthesizer, instrument, or studio unless requested.
  color_and_tone:
    Use graphite, cream, cobalt, magenta, and cyan with small LED-like points; keep broad dark
    and light masses distinct and use saturated color to mark active signal paths.
  lighting_and_shadow:
    Preserve the requested light source, direction, and intensity; keep any indicator-like glow small and
    localized rather than turning the room into a lit control station or flooding it with neon.
  texture_and_material:
    Use panel-like divisions, cable-like strokes, and control marks only where existing surfaces support
    them; preserve the scene's materials and keep wear at edges rather than applying a uniform filter.
  camera_and_composition:
    Route short repeated signal marks along existing forms while preserving the requested composition;
    keep the focal subject separate from dense control detail.
  atmosphere_and_mood:
    Suggest experimental electronic energy and handmade technical confidence, without forcing
    a performance venue or a specific era.
  rendering_and_quality:
    Keep panel geometry, cable paths, and waveforms crisp and simplified; maintain enough
    negative space for the main subject to read at thumbnail scale.
avoidRules:
  - a required synthesizer or musician
  - cassette-deck windows and reel motifs as the dominant language
  - dense controls or cable tangles that obscure the subject
  - control-panel walls or synth-studio architecture replacing the requested setting
