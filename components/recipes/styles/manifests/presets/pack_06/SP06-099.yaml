visualDna:
  aesthetic: 'Handheld stylus memo animation: jaggy black pen lines at 256 by 192 on a white memo page, with a faint onion-skin of the previous frame.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Black ink on white with at most one red or blue ink accent; no shading colors.
  lighting_and_shadow: No lighting; shadows drawn as simple stamp-pattern fills or scribbled hatching.
  texture_and_material: Aliased one to three pixel pen strokes, stamped dot and stripe patterns, faint light-grey onion-skin lines.
  camera_and_composition: Keep the requested view; a loose doodle centered on the page with motion lines and a ghosted previous pose.
  atmosphere_and_mood: Playful and amateur, a joke animated between classes.
  rendering_and_quality: Low-resolution jaggy lines kept crude and lively; no device, frame counter or interface drawn.
  key_features: jaggy black stylus lines; one red or blue accent; onion-skin ghost frame; stamp-pattern fills; 256x192 page
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Stylus Memo Flipbook Doodle as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
