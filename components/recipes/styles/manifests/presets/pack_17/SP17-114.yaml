visualDna:
  aesthetic: Elegant etched line combined with granular sepia aquatint tone fields, stepped value layers, and soft warm paper, like a refined travel-plate or naturalist etching.
  subject_treatment: 'Render the requested subject with a light etched contour and two to four stepped aquatint tones that separate foreground, subject and distance; mood comes from tonal order rather than detail.'
  color_and_tone: Sepia brown ink in stepped tones, warm cream paper, and occasional deeper umber accent.
  lighting_and_shadow: Soft atmospheric daylight described by stepped aquatint grains; distance fades to pale tone.
  texture_and_material: Fine rosin grain, crisp etched line, soft plate edges, and slight ink wipe variation.
  camera_and_composition: Airy landscape or portrait composition with clear depth layers and calm negative space.
  atmosphere_and_mood: Wistful, elegant, calm, and slightly melancholic.
  rendering_and_quality: 'Refined print finish: grains even, stepped tones clean, line delicate, no muddiness.'
  creative_brief: "Elegant etched line combined with granular sepia aquatint tone fields, stepped value layers, and soft warm paper, like a refined travel-plate or naturalist etching. Carry it through granular sepia aquatint, stepped tone layers, delicate etched line, atmospheric depth, refined calm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: granular sepia aquatint; stepped tone layers; delicate etched line; atmospheric depth; refined calm
