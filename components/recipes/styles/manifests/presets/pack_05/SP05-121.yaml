visualDna:
  aesthetic: 'Polished digital cel anime whose motion and energy trails are drawn as woodblock-print elements: curling wave crests, stylized flame tongues and wind bands in flat graded color.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Winter blue, warm amber and cream on figures; trails in indigo-to-white or vermilion-to-gold bokashi gradients.
  lighting_and_shadow: Soft cinematic key with a warm glow where a trail passes, cool grouped shadows elsewhere.
  texture_and_material: Smooth digital cel on figures; trails with flat print color, carved outline and faint paper grain.
  camera_and_composition: Keep the requested framing; trails curve in nested arcs around the subject and leave it fully legible.
  atmosphere_and_mood: Ceremonial grace and restrained resolve, motion flowing like a performed rite rather than a brawl.
  rendering_and_quality: Clear contrast between soft digital shading on figures and flat printed trails; garment patterns kept small.
  key_features: woodblock-print effect trails; bokashi-graded waves and flames; clean digital cel figures; winter blue and amber; nested trail arcs
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Printed-Wave Effect Trail Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
