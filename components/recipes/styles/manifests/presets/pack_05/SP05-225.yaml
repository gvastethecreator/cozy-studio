visualDna:
  aesthetic: >-
    Rough kinetic illustration with dented-edge marks, short spark-like strokes, compact
    directional forms, and visible hand-worked grit.
  subject_treatment: >-
    Retain the requested subject and silhouette. Use broken contours, localized dents, and quick
    directional hatching on existing forms; add no scrap parts or tools.
  color_and_tone: >-
    Combine iron, dusty ochre, rust, and charcoal, with small bright amber accents against muted
    values.
  lighting_and_shadow: >-
    Cut firm shadows beneath edges and use brief warm glints to sharpen movement; do not require
    sparks or a welding source.
  texture_and_material: >-
    Keep the original material readable while layering scuffs, scratches, rubbed paint, and
    uneven hand-drawn marks in focused areas.
  camera_and_composition: >-
    Keep the requested crop. Carry speed with compact diagonals and short repeated strokes
    inside the existing layout.
  atmosphere_and_mood: >-
    Express resilience through rough but controlled mark-making, warm accents, and persistent
    forward rhythm.
  rendering_and_quality: >-
    Mix firm cel shadows with scratchy line texture; maintain a clear contour and avoid uniform
    distress or visual noise.
  key_features: >-
    Dented-edge marks; compact motion strokes; iron and rust palette; hand-worked surface grit.
  creative_brief: >-
    Preserve the prompt’s subject and framing. Apply scratched contours, compact directional
    strokes, and muted iron-and-rust color; add no scrap, tools, or sparks.
