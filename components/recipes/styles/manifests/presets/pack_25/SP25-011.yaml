visualDna:
  aesthetic: 'Gesture-to-Geometry Marks: one continuous gesture reduced to two taut curves and a single controlled break with a rhythmic signature.'
  subject_treatment: Reduce the prompt's subject to one movement of two tense curves and one characteristic break that keeps the original direction; set requested text exactly.
  color_and_tone: One ink at a steady weight, with expression carried by the path itself.
  lighting_and_shadow: Flat graphic rendering, where apparent speed comes from the path and its terminals.
  texture_and_material: Clean edges and minimal stroke swell, crisp enough to cut from vinyl.
  camera_and_composition: Off-center inflection point balanced by a wide empty region beside the gesture.
  atmosphere_and_mood: Held energy in a rhythmic signature, disciplined rather than spontaneous.
  rendering_and_quality: The small version keeps the same number of inflections and the same direction.
  creative_brief: "Gesture-to-Geometry Marks: one continuous gesture reduced to two taut curves and a single controlled break with a rhythmic signature. Carry it through two taut curves, single break, off-center inflection, held energy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two taut curves; single break; off-center inflection; held energy
