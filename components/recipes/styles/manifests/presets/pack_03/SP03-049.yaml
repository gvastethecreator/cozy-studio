visualDna:
  aesthetic: 'Character model presentation: a finished 3D character standing on flat grey, lit evenly so proportions, costume construction and materials read without drama.'
  subject_treatment: Keep the prompt character and costume; use a relaxed A-pose or T-pose only when the prompt leaves the pose open, keep any requested pose or action, and show one front view unless a turnaround is requested. An object stays an object on the same grey stage.
  color_and_tone: Neutral mid-grey backdrop, accurate unstylized skin and fabric colors, no color grade or tinted light.
  lighting_and_shadow: Large soft key and near-equal fill with a faint rim, shadows short and low in contrast so no detail hides.
  texture_and_material: Clean fabric weaves, leather seams, buckles and subsurface skin, every material clearly separated from the next.
  camera_and_composition: Full figure centered with a long lens at chest height, feet visible on a soft contact shadow.
  atmosphere_and_mood: Neutral and ready, a character waiting for its first animation.
  rendering_and_quality: Production-clean model with symmetric construction, no background props, no swatch panels and no text.
  key_features: neutral A-pose or T-pose only when unposed; flat grey backdrop; even soft lighting; full figure centered; material separation
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Character Design (T-Pose) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - forced T-pose
  - object turned into an avatar
  - franchise likeness
  - readable text
  - logo
  - material swatch panels
  - extra views unless requested
  - background
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
assets:
  defaultImage: /assets/recipes/styles/defaults/SP03-049.webp
