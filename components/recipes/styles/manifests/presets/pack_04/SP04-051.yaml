visualDna:
  aesthetic: 'Creature design study: one painted creature in a readable hero pose, surrounded by anatomical inset studies of skull, limb mechanics and skin.'
  subject_treatment: 'Keep the prompt subject and its identity as the thing being designed; this deliverable owns a creature study sheet: one painted hero pose with graphite anatomy insets and a small human silhouette for scale, and that layout replaces the requested framing.'
  color_and_tone: Natural biological palette with camouflage logic, warning colors only where they would evolve, on a warm parchment-grey sheet.
  lighting_and_shadow: Soft overhead key with a thin rim light that separates the silhouette from the sheet ground.
  texture_and_material: Painted skin, scales, keratin and wet membranes at believable scale; inset studies in graphite line with light washes.
  camera_and_composition: Hero creature in three-quarter view filling two thirds of the sheet, insets arranged in the remaining third, a small human silhouette for scale.
  atmosphere_and_mood: Plausible and unsettling, an animal that could have evolved somewhere.
  rendering_and_quality: Hero painted near finish, insets deliberately looser, callout lines that carry no words.
  key_features: one painted hero pose; graphite anatomy insets; skull and limb studies; human scale silhouette; evolved camouflage palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Creature Design as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable annotations
  - readable text
  - brand logo
  - franchise likeness
  - lone cloaked figure on a cliff edge
  - several unrelated creatures
  - cartoon mascot proportions
  - cute
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic fantasy wallpaper
  - overpolished final render
  - unclear design callouts
  - random kitbash clutter
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
