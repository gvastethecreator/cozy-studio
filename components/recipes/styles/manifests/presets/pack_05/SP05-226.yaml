visualDna:
  aesthetic: 'Copperplate-engraving cyber-gothic rendering: dense parallel burin hatching, pointed ornamental filigree traced along existing edges, and a single crimson spot color.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Blue-black ink on cold bone paper with one narrow crimson signal; midtones are built only from hatch density.
  lighting_and_shadow: 'Hard directional light carved by line density: tight crosshatch in shadow, open paper for highlights, crimson for emissive points.'
  texture_and_material: Engraved swelling lines, fine stipple on curved surfaces, and pointed-arch filigree edging on existing contours.
  camera_and_composition: Keep the requested view; frame with tall vertical rhythms of hatching and deep black masses at the edges.
  atmosphere_and_mood: Solemn funereal dread, elegance carved into cold metal.
  rendering_and_quality: Engraving line with swelling and tapering strokes, a controlled hatch value scale and sparse crimson; no painterly color.
  key_features: parallel burin hatching; pointed filigree edging; blue-black ink on bone; single crimson spot color; stipple on curves
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cyber-Goth Mausoleum Dread as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
