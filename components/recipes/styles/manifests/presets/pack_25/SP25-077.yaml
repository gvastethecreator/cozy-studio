visualDna:
  aesthetic: 'Timeline-Centered Workspace: a workspace organized around one timeline where selection, events, properties and transport stay synchronized.'
  subject_treatment: Build the prompt's workspace around a dominant timeline with a synchronized inspector and a stable transport; keep every requested time and label exact.
  color_and_tone: Color by role or track with redundant cues, selection distinct from playback.
  lighting_and_shadow: Flat design or minimal functional depth across the time scale.
  texture_and_material: Clean time rulers, consistent marks and readable content blocks.
  camera_and_composition: Dominant timeline, synchronized inspector and transport in a fixed place.
  atmosphere_and_mood: Task continuity and temporal orientation in one connected workspace.
  rendering_and_quality: One time position matches the selection, marker and properties.
  creative_brief: "Timeline-Centered Workspace: a workspace organized around one timeline where selection, events, properties and transport stay synchronized. Carry it through dominant timeline, synced inspector, fixed transport, exact times. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: dominant timeline; synced inspector; fixed transport; exact times
