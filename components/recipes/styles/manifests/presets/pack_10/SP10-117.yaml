visualDna:
  aesthetic: 'Ikat: resist-dyed yarns woven into blurred-edge geometric motifs.'
  subject_treatment: "Apply this motif dyed into the yarn before weaving of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: blurred-edge diamond and hook motifs."
  color_and_tone: Indigo, madder red, ochre and cream, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Woven threads with feathered edges, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at a glance.
  atmosphere_and_mood: Handcrafted, rich, earthy and vibrant, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  creative_brief: "Ikat: resist-dyed yarns woven into blurred-edge geometric motifs. Carry it through blurred-edge ikat motifs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: blurred-edge ikat motifs
