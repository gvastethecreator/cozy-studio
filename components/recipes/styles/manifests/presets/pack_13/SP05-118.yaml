visualDna:
  aesthetic: >-
    Separate the subject from its ground with a warm rim contour and restrained flare haze; use
    silhouette only where the prompt's lighting supports it.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: build a warm-to-cool transition
    around the rim while retaining the prompted palette and readable interior values.
  lighting_and_shadow: >-
    Keep backlight direction consistent with the prompt; use small bloom and soft falloff, not a
    forced sunset.
  texture_and_material: >-
    Use clean silhouette edges, delicate rim color and minimal haze; keep material texture visible.
  camera_and_composition: >-
    Use sky-like negative space only when the source composition includes open background; do not
    add a horizon or reframe.
  atmosphere_and_mood: >-
    Longing is conveyed through separation and light falloff; preserve the prompt's mood and facial
    detail if requested.
  rendering_and_quality: >-
    Apply the backlight treatment to any requested form without forcing a sky, sunset, person or
    romantic pose. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Warm rim contour; silhouette separation; restrained flare haze; twilight color transition;
    posture-led emphasis.
  creative_brief: "Apply this visual treatment to the requested content: Warm rim contour; silhouette separation; restrained flare haze; twilight color transition; posture-led emphasis. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - rim bloom washing out silhouette detail
  - flare crossing the focal contour
  - edge light conflicting with prompted light direction
assets:
