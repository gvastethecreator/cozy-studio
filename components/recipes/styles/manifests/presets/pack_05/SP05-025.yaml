visualDna:
  aesthetic: 'Psychological-thriller anime: fine deliberate black strokes, gothic chiaroscuro at sharp dramatic angles, bone-white fields and one isolated vermilion accent.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Ink black and bone white with a single restrained vermilion accent.
  lighting_and_shadow: Firm black-to-white shadow blocks with minimal midtone; faces split by hard light.
  texture_and_material: Dry matte paper grain over otherwise clean flat fields.
  camera_and_composition: Keep the requested content; static asymmetric balance at a steep Dutch or overhead angle, one isolated accent.
  atmosphere_and_mood: Cerebral suspense and controlled stillness, every shadow suggesting a calculation in progress.
  rendering_and_quality: Crisp edges, limited color, and quiet fields around the accent.
  key_features: gothic chiaroscuro; fine deliberate black stroke; bone-white fields; single vermilion accent; steep dramatic angle
  creative_brief: "Psychological-thriller anime: fine deliberate black strokes, gothic chiaroscuro at sharp dramatic angles, bone-white fields and one isolated vermilion accent. Carry it through gothic chiaroscuro, fine deliberate black stroke, bone-white fields, single vermilion accent, steep dramatic angle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
