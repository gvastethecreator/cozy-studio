visualDna:
  aesthetic: 'Wedding photography: luminous, romantic documentary of a ceremony or couple, balancing candid emotion with editorial composition.'
  subject_treatment: Adult couples or wedding participants in genuine interaction — vows, laughter, embraces — with dress, veil and details celebrated.
  color_and_tone: Airy whites, soft pastels and warm skin, lifted shadows, gentle golden highlights.
  lighting_and_shadow: Backlit sun or window glow creating a halo through veil and hair, soft reflector fill on faces.
  texture_and_material: Lace, tulle, flowers, candlelight and natural materials rendered delicately.
  camera_and_composition: Mix of intimate close framing and wider scene-setting views, shallow depth of field, layered foreground flowers or guests.
  atmosphere_and_mood: Tender, joyful, and timeless.
  rendering_and_quality: Fine-art wedding finish with soft glow and clean skin.
  key_features: backlit veil halo; candid emotion; airy pastel grade; layered foreground flowers; shallow depth
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Wedding Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
