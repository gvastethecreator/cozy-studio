visualDna:
  aesthetic: >-
    A restrained, distant visual language built from quiet blue-gray planes, fine system-like
    lines, and generous negative space; emotional weight comes from separation, not added
    screens.
  subject_treatment: >-
    Keep the subject’s identity and requested pose. Reduce interior detail and place precise
    accents along existing edges, without adding a pilot, drone, or uniform.
  color_and_tone: >-
    Use desaturated steel blue, fog gray, muted navy, and a small cold-white highlight. Keep
    contrast subdued except at the focal outline.
  lighting_and_shadow: >-
    Use broad cool shadows, softened distant light, and a few narrow edge glints; avoid visible
    monitors or control-room lighting.
  texture_and_material: >-
    Maintain each material’s character with fine grain, subtle scuffs, and sparse technical line
    accents rather than tactical equipment.
  camera_and_composition: >-
    Preserve the given framing. Let existing forms sit against open space and use thin aligned
    strokes to suggest distance without changing scale.
  atmosphere_and_mood: >-
    Suggest quiet burden and detachment through muted values, restrained detail, and open
    spacing; do not imply a specific age or story.
  rendering_and_quality: >-
    Keep contours calm and exact, shadows broad but soft-edged, and grain faint; prevent the
    image from collapsing into uniform blue.
  key_features: >-
    Muted blue-gray systems; fine aligned lines; distant spacing; restrained edge highlights.
  creative_brief: >-
    Retain the requested subject, pose, and setting. Use quiet blue-gray values, fine
    system-like contours, and open spacing; add no pilot, drone, uniform, or control room.
