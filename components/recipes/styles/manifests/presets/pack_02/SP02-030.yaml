visualDna:
  aesthetic: >-
    Nature Documentary acts as a transferable cinematic-media router: start from Premium nature
    documentary, BBC Earth-style patience, global spectacle, Telephoto reverence, slow-motion
    clarity, natural spectacle and broadcast-media system built from signal texture, studio or field
    capture, graphic package hierarchy, interlacing, compression, and live-transmission rhythm, then
    apply the media behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Treat subjects as believable filmed or broadcast subjects
    under Nature Documentary: casting, wardrobe, props, motion cues, and silhouette hierarchy follow
    2. TV And Broadcast cinematic and broadcast grammar without locking to one plot beat; preserve
    the requested subject while treating it as a broadcast capture, package segment, demo frame,
    replay, surveillance feed, music-video signal, or live information object, keeping the requested
    identity, silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with Natural, vibrant, savannah gold, ocean teal, rainforest emerald; use color
    through signal-safe palettes, studio blue, warning red, chroma spill, VHS drift, SD primaries,
    radar overlays, or cheap late-night product gloss, with deliberate value grouping, accent
    control, and process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Golden hour, magic-hour rim, dappled canopy, underwater shaft; shape light
    through even studio key, practical video exposure, screen glow, floodlight, surveillance
    flatness, confessional softness, or signal-break flicker, so exposure and shadow structure
    support the media process without overwriting the requested content.
  texture_and_material: >-
    Render Ultra HD, 8K natural texture, fine surface detail; surface detail should show video
    sharpness, scanlines, crawl bands, interlace, tape noise, chroma-key edge, compression blocks,
    or broadcast graphics as visual texture, keeping artifact scale coherent and avoiding noisy
    filler texture.
  camera_and_composition: >-
    Structure the image through Slow motion, motion freeze, droplet suspension; compose through
    safe-title zones, lower-third-like geometry, split screens, scorebug rhythm, crawl lanes,
    multicam framing, or video-package layout without readable text dependency, with frame rhythm,
    spacing, edge hierarchy, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Majestic, patient reverence, untamed spectacle; derive mood from live urgency,
    cheap sincerity, public-access awkwardness, sales pressure, institutional watching, stadium
    tension, or music-video rebellion, letting the media style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Premium UHD documentary finish with natural texture clarity, patient telephoto
    detail, clean color, invisible-camera restraint, and no artificial set feel; finish as coherent
    broadcast signal with clean graphic hierarchy, intentional compression, and no anchor, desk,
    logo, UI screenshot, or readable caption requirement, clean denoised surfaces where appropriate,
    and enough process evidence to make the style recognizable.
  key_features: >-
    Premium nature documentary, BBC Earth-style patience, global spectacle; Telephoto reverence,
    slow-motion clarity, natural spectacle; Natural, vibrant, savannah gold, ocean teal, rainforest
    emerald; Ultra HD, 8K natural texture, fine surface detail; Slow motion, motion freeze, droplet
