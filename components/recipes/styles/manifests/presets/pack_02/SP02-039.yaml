visualDna:
  aesthetic: 'Mid-century modernist animation: 1950s design-led cartoons with flat geometric shapes, angular silhouettes and limited movement.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Limited palette of mustard, teal, coral and black on off-white, flat fills.
  lighting_and_shadow: No modeled light; shadows as flat geometric shapes.
  texture_and_material: Dry brush textures, printed-paper grain, thin expressive lines.
  camera_and_composition: Flat staging with lots of negative space, characters as angular silhouettes, abstract background shapes.
  atmosphere_and_mood: Witty and cool, jazz-age rhythm in a few elegant shapes.
  rendering_and_quality: Mid-century graphic design finish; not realistic or 3D.
  key_features: flat geometric reduction; angular silhouettes; limited mustard-teal palette; negative space; dry brush texture
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mid-Century Modernist Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - realistic
  - 3d
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - watermark
  - logo clutter
  - generic stock footage
  - uncontrolled noise
  - random cartoon face
  - unreadable motion smear
  - fake subtitles
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
