visualDna:
  aesthetic: 'Old-school tattoo flash sheet: several bold traditional designs painted on paper, arranged as a sheet a tattooer would hang on the wall.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: redrawn as one or more flash designs with heavy black outlines, solid black fills and flat watercolor color, spaced across a paper sheet with small filler designs around it."
  color_and_tone: 'Traditional flash palette: black, red, yellow, green and skin tone on aged cream paper.'
  lighting_and_shadow: No realistic lighting; color is flat with simple black shading.
  texture_and_material: Watercolor on toothy paper, pinholes, tape marks and yellowed edges.
  camera_and_composition: Flat sheet layout with the main design large and small fillers around it.
  atmosphere_and_mood: Bold, timeless, tough and handcrafted, driven by the construction, color and rhythm.
  rendering_and_quality: Clean hand-painted flash with steady linework, with clean, deliberate marks and no accidental noise.
  key_features: heavy black outlines; flat watercolor fills; flash-sheet layout; aged paper
