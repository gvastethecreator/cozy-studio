visualDna:
  aesthetic: 'Kentaro Miura manga style: obsessive engraving-like crosshatching, monumental dark fantasy compositions, heavily worn plate armor and grotesque demonic anatomy drawn with baroque detail under apocalyptic storm skies.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; give figures weighty muscular anatomy, scarred faces, battered armor and cloth rendered stroke by stroke, never a lone black-armored swordsman with a slab-like greatsword. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Near-monochrome ink blacks and bone greys with sparing dried-blood red and cold storm blue.
  lighting_and_shadow: Harsh storm light cutting out silhouettes, dense hatched shadows swallowing half of every form.
  texture_and_material: Dense pen crosshatching, stippled grime, scratched metal, torn leather, rain streaks drawn as fine lines.
  camera_and_composition: Low monumental angles and sweeping double-page panoramas where tiny figures face colossal horrors.
  atmosphere_and_mood: Keep the requested mood with grim defiant endurance against overwhelming darkness.
  rendering_and_quality: Meticulous hand-inked manga illustration with painterly-level detail density, no digital smoothness.
  creative_brief: "Kentaro Miura manga style: obsessive engraving-like crosshatching, monumental dark fantasy compositions, heavily worn plate armor and grotesque demonic anatomy drawn with baroque detail under apocalyptic storm skies. Carry it through Kentaro Miura crosshatching, monumental dark fantasy, grotesque demons, battered armor, storm skies. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Kentaro Miura crosshatching; monumental dark fantasy; grotesque demons; battered armor; storm skies
