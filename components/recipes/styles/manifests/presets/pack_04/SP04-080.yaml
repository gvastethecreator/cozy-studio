visualDna:
  aesthetic: 'Brush pen ink drawing: a flexible synthetic brush tip laying thick-to-thin single strokes, dry-brush breaks at speed and grey water-brush washes.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Carbon black and two diluted grey washes on white absorbent paper, generous negative space.
  lighting_and_shadow: Shadow as bold wet black strokes, midtones as grey washes, light as untouched paper.
  texture_and_material: One-breath tapering strokes, dry-brush fractures, soft wash blooms and fiber feathering at stroke ends.
  camera_and_composition: Keep the requested view with asymmetric placement and open white space around the subject.
  atmosphere_and_mood: Quick, confident and alive, each stroke committed.
  rendering_and_quality: Economical gestural ink with visible stroke order; no pencil underdrawing and no digital fill.
  key_features: thick-to-thin brush strokes; dry-brush fractures; grey water washes; open negative space; one-breath gestures
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Brush Pen Ink as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
