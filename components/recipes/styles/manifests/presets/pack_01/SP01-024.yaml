visualDna:
  aesthetic: 'Drone nadir aerial: the camera pointing straight down from 60 to 120 meters, turning the ground into a flat map of shapes, paths and shadows.'
  subject_treatment: Keep the prompt subject, action and setting; this preset owns the camera position and lens, so re-stage only the viewpoint as described.
  color_and_tone: Clean saturated color, strong local hues against neutral ground, shadows as dark graphic shapes.
  lighting_and_shadow: Low sun gives long shadows that reveal height; noon light flattens everything into pattern.
  texture_and_material: Surfaces read as texture fields — water, sand, roofs, crops, snow — with people and objects reduced to small marks.
  camera_and_composition: Perfectly top-down, no horizon, flattened perspective, subject placed as a small shape inside a larger pattern, strong symmetry or diagonal lines.
  atmosphere_and_mood: Detached and epic, the familiar world turned into an abstract map seen from far above.
  rendering_and_quality: Sharp drone survey clarity with no tilt-shift blur, fisheye curve or oblique angle.
  key_features: straight-down nadir view; flattened map perspective; long shadows reveal height; tiny human marks; pattern fields
  creative_brief: "Drone nadir aerial: the camera pointing straight down from 60 to 120 meters, turning the ground into a flat map of shapes, paths and shadows. Carry it through straight-down nadir view, flattened map perspective, long shadows reveal height, tiny human marks, pattern fields. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
