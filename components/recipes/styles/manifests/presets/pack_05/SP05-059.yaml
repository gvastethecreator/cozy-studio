visualDna:
  aesthetic: 'Layered-transparency cyber anime: semi-transparent cel planes stacked in screen blend, refraction ripples where layers overlap, and thin teal line contours.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Teal, glass green, slate and silver-white; overlaps brighten toward pale aqua and never form readable content.
  lighting_and_shadow: Even cool technical light with thin refracted highlights on edges and soft cel shadows seen through translucent layers.
  texture_and_material: Glassy translucent planes, faint refraction warping at overlaps, and an optical-camouflage shimmer outlining partly invisible forms.
  camera_and_composition: Keep the requested view; offset two or three translucent echoes of the subject slightly in depth behind it.
  atmosphere_and_mood: Calm analytical focus, a mind reading the world in layers.
  rendering_and_quality: Crisp teal line, clean translucent fills, refraction ripples and sparse abstract hexagon marks; no legible text.
  key_features: stacked translucent cel planes; refraction ripples at overlaps; optical-camouflage shimmer; teal and glass-green palette; offset depth echoes
  creative_brief: "Layered-transparency cyber anime: semi-transparent cel planes stacked in screen blend, refraction ripples where layers overlap, and thin teal line contours. Carry it through stacked translucent cel planes, refraction ripples at overlaps, optical-camouflage shimmer, teal and glass-green palette, offset depth echoes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
