visualDna:
  aesthetic: >-
    Silent Hill 4: The Room (2004) first-person apartment exploration: modest PS2-era geometry,
    dirty domestic surfaces and an impossible bodily threshold invading a closed ordinary room.
  subject_treatment: >-
    Preserve the requested identity, count and action while expressing the selected gameplay view.
    Room view stays embodied and immediate; exploration view keeps the playable figure and route
    legible.
  color_and_tone: >-
    Aged warm neutrals and muted green-gray in domestic space; colder, darker contrast elsewhere
    when appropriate.
  lighting_and_shadow: >-
    Dim practical light and shaped corners transition to deeper visibility loss; keep route cues
    usable.
  texture_and_material: >-
    Period PS2 environment detail, worn domestic surfaces, and hostile materials when scene supports
    them.
  camera_and_composition: >-
    Choose one coherent mode for the requested action: embodied first-person observation for a
    domestic refuge, or external third-person movement for hostile exploration. Never combine both
    views in a split screen; preserve requested output aspect ratio.
  atmosphere_and_mood: >-
    A provisional refuge under gradual invasion; safety declines while play spaces remain
    understandable.
  rendering_and_quality: Original 2004 PS2 capture character with restrained detail, not modern remake density.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
