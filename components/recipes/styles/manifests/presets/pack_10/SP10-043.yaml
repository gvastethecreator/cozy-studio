name: Dark Fantasy
category: 4. Surrealism & Dream
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - surrealism-and-dream
visualDna:
  aesthetic: >-
    Dark Fantasy becomes a transferable surreal symbolic transformation system: start from Souls
    game aesthetic, Fog, and Skeleton, then route prompt content through impossible logic, dream
    scale, symbolic displacement, liminal staging, and psychic texture without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Detailed, scratchy to bend, displace, fuse,
    haunt, miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene;
    preserve anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Desaturated, Black; use color as emotional unreliability, nostalgic
    drift, uncanny contrast, or symbolic temperature, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Gloom drive the light response: shape light through impossible shadows, memory haze, stage
    stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Rot, rust as the tactile or mark-making basis; surfaces should support the illusion with
    believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Skeleton as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Hopeless, grand as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Beksinski, nightmare: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Souls game aesthetic; Detailed, scratchy; Desaturated, Black; Gloom; Rot, rust; Skeleton;
    Hopeless, grand; Beksinski, nightmare; Fog
  creative_brief: >-
    Route any subject through Dark Fantasy as a transferable surreal-nightmare visual system:
    desaturated black weight, rot and rust texture, scratchy detail, foglike depth, skeletal
    structure, and mythic despair should make the input feel ancient, corroded, and hopeless without
    requiring a specific locale, character role, architecture, or story premise.
avoidRules:
  - happy
  - bright
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
