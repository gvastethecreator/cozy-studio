visualDna:
  aesthetic: >-
    Cinematic Dream-Collapse Surrealism Style acts as a transferable anime-prestige router:
    feature-film anime blocking and deliberate camera grammar, alongside a dream anime direction
    shaped by era-aware line economy and genre tone; fuse it with prestige anime film craft with
    auteur composition, painterly environments, subtle acting, cinematic atmosphere, and careful
    color script; it routes era, genre, line economy, cel or digital finish, and performance tone
    without locking prompt content to the source title or sample image.
  subject_treatment: >-
    Preserve the prompt subject, action, and context while restyling forms through deforming
    silhouettes and controlled breakdown of form, alongside contours paced by cinematic tension,
    readable pose energy, and silhouette discipline; identity should remain readable through anime
    contour, expression economy, pose energy, shape simplification, and effect hierarchy instead of
    a required canon character or title scene.
  color_and_tone: >-
    Map color through dream pastels, saturated unreality, and soft dark contrast, alongside a
    cinematic accent system held inside disciplined cel values; anchor it in painterly color
    scripts, luminous sky hues, rain-soft values, warm interiors, muted grief tones, and saturated
    dream accents; keep value separation clean, cel flats intentional, accents purposeful, and
    palette behavior attached to the requested content.
  lighting_and_shadow: >-
    Use cinematic bounce, controlled bloom, and graded shadow, alongside dream bloom and unstable
    glow; combine it with cinematic natural light, rain reflections, sky glow, dream bloom,
    painterly bounce, and delicate rim separation; shadows should read as anime light design, rims
    should clarify form, and glow or effects should support the prompt rather than replacing it.
  texture_and_material: >-
    Render cel paint and ink grain tuned to cinematic material contrast, alongside cel paint and ink
    grain tuned to dream material contrast; anchor surfaces in gouache-like backgrounds, watercolor
    gradients, fine linework, film grain, hand-painted light, and soft atmospheric texture; cel
    edges, painted surfaces, grain, cloth, metal, water, sweat, smoke, or atmosphere must stay
    coherent across people, objects, environments, action, and abstractions.
  camera_and_composition: >-
    Frame around wide inserts, close emotional cuts, and scene-to-scene rhythm, alongside surreal
    transitions and elastic visual logic and falling axes, broken perspective, and unstable visual
    gravity, then extend it with feature-film blocking, environmental scale, poetic negative space,
    quiet inserts, dream logic, and controlled camera distance; the style should support portraits,
    props, machines, performances, landscapes, symbols, and full scenes through reusable anime
    staging grammar instead of one fixed card layout.
  atmosphere_and_mood: >-
    Carry mood through identity failure and dream pressure, alongside unreality, disorientation, and
    poetic collapse; braid it with lyrical longing, ecological awe, intimacy, metaphysical grief,
    dream collapse, humanist warmth, and mature wonder; the preset can become funny, sensual,
    violent, quiet, tragic, romantic, or strange when prompt X asks for it while preserving the
    chosen anime lineage.
  rendering_and_quality: >-
    Finish with clean anime finishing that keeps cinematic identity readable without noisy denoise,
    alongside clean anime finishing that keeps dream identity readable without noisy denoise;
    enforce prestige anime film finish with painterly clarity, careful denoise, expressive acting,
    and no stock fantasy shortcut; prioritize clean denoise, stable anatomy or object structure,
    readable effects, controlled grain, no watermark, no fake text, no signature, and no photoreal
    or 3D-render drift.
  key_features: >-
    feature-film anime blocking and deliberate camera grammar, alongside a dream anime direction
    shaped by era-aware line economy and genre tone; deforming silhouettes and controlled breakdown
    of form, alongside contours paced by cinematic tension, readable pose energy, and silhouette
    discipline; cel paint and ink grain tuned to cinematic material contrast, alongside cel paint
    and ink grain tuned to dream material contrast; cinematic bounce, controlled bloom, and graded
    shadow, alongside dream bloom and unstable glow; wide inserts, close emotional cuts, and
    scene-to-scene rhythm, alongside surreal transitions and elastic visual logic and falling axes,
    broken perspective, and unstable visual gravity
  creative_brief: >-
    Apply Cinematic Dream-Collapse Surrealism Style after prompt X as a transferable anime-prestige
    layer: prompt X supplies subject, action, setting, tone, and intensity, while this preset
    supplies feature-film anime blocking and deliberate camera grammar, alongside a dream anime
    direction shaped by era-aware line economy and genre tone, alongside deforming silhouettes and
    controlled breakdown of form, alongside contours paced by cinematic tension, readable pose
    energy, and silhouette discipline; dream pastels, saturated unreality, and soft dark contrast,
    alongside a cinematic accent system held inside disciplined cel values; cinematic bounce,
    controlled bloom, and graded shadow, alongside dream bloom and unstable glow; cel paint and ink
    grain tuned to cinematic material contrast, alongside cel paint and ink grain tuned to dream
    material contrast and wide inserts, close emotional cuts, and scene-to-scene rhythm, alongside
    surreal transitions and elastic visual logic and falling axes, broken perspective, and unstable
    visual gravity, finish discipline, and negative controls without requiring a fixed canon cast,
    title scene, prop bundle, location, sport, instrument, weapon, or card composition.
