visualDna:
  aesthetic: >-
    Webtoon Style acts as a transferable illustration router: start from Vertical-scroll webcomic
    language with mobile-first readability, Vertical pacing gaps, beat-driven panel stacking,
    gradient-backed emphasis moments and comic-illustration system built from ink hierarchy,
    panel-era color, contour exaggeration, print artifacts, and sequential-art readability, then
    apply the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Clean digital linework with controlled contour
    simplification; preserve the requested subject while translating form into panel-ready
    silhouettes, expressive contour weight, stylized anatomy, speed emphasis, or graphic restraint
    only when the preset calls for it, keeping the requested identity, silhouette, pose, object
    function, or setting legible.
  color_and_tone: >-
    Build color with Saturated full-color palette with flat-to-soft-cel value staging; treat color
    as comic production language: four-color plates, limited spot color, manga monochrome, digital
    flats, noir contrast, webtoon gradients, or painted page atmosphere, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Soft cel shading with selective rim accents for depth separation; make
    light read through ink spotting, cel-like value blocks, dramatic rim separation, flat print
    fill, or painted page modeling rather than generic studio illumination, so value structure
    supports the illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Crisp screen-native finish with minimal analog noise; surface detail should reveal paper
    tooth, newsprint dots, screen tones, digital brush layers, ink pools, gutter discipline, or
    pixel cells at a scale that supports the drawing, keeping material scale coherent and avoiding
    noisy filler texture.
  camera_and_composition: >-
    Structure the image through Stylized proportions tuned for expressive designed subjects
    readability; compose with panel logic, silhouette clarity, speech-shape space, page rhythm,
    close-up drama, or scroll pacing without requiring a fixed comic-page scene, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Emotion-forward, dramatic, contemporary digital storytelling; derive mood from
    era, genre pressure, satire, melodrama, horror obsession, pulp energy, or graphic-novel
    seriousness, letting the style alter interpretation without demanding a specific story,
    location, or actor.
  rendering_and_quality: >-
    Finish with Polished episodic panel rendering optimized for long-scroll consumption; finish with
    clear ink decisions, readable stylization, controlled artifacting, and no generic superhero
    costume or random comic text replacing the prompt, clean denoised surfaces where appropriate,
    and enough process evidence to make the style recognizable.
  key_features: >-
    Vertical-scroll webcomic language with mobile-first readability; Vertical pacing gaps,
    beat-driven panel stacking, gradient-backed emphasis moments; Saturated full-color palette with
    flat-to-soft-cel value staging; Crisp screen-native finish with minimal analog noise; Stylized
    proportions tuned for expressive designed subjects readability
  creative_brief: >-
    Apply Webtoon Style as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Vertical-scroll webcomic language with mobile-first readability, Vertical pacing gaps,
    beat-driven panel stacking, gradient-backed emphasis moments, Crisp screen-native finish with
    minimal analog noise without requiring the card image's original subject.
avoidRules:
  - black and white
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic superhero costume
  - random speech text
  - fake lettering
  - photo-real costume render
