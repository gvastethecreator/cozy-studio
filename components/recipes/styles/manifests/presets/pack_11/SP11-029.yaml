visualDna:
  aesthetic: 'Embroidery: the subject stitched in thread on fabric in a hoop.'
  subject_treatment: "Rebuild the prompt's subject as a physical crafted object made this way, keeping its identity, pose and action readable: embroidered with satin, stem and French-knot stitches on linen in a hoop."
  color_and_tone: Thread colors on linen, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Soft light, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Satin stitches, knots and linen weave, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at a glance.
  atmosphere_and_mood: Delicate, handmade, patient and cozy, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: embroidery stitches; hoop; linen
  creative_brief: "Embroidery: the subject stitched in thread on fabric in a hoop. Carry it through embroidery stitches, hoop, linen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
