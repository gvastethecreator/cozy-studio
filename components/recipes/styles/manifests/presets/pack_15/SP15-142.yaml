visualDna:
  aesthetic: 'Fiberpunk: a city threaded with glowing optical fibers, where data travels as visible light through cables, clothing and even hair.'
  subject_treatment: Keep the prompt's subject and setting; weave thin glowing fibers through it so light pulses along cables, fabric or strands.
  color_and_tone: Deep night navy and black with thread-thin cyan, magenta and gold light lines.
  lighting_and_shadow: Light emitted only from fiber tips and strands, faint glows on nearby faces.
  texture_and_material: Bundles of glass fiber, woven light fabrics, braided cables and dark matte surfaces.
  camera_and_composition: Close views of glowing strands and wide views of cities laced with light threads.
  atmosphere_and_mood: Delicate and electric, information made into something you could almost touch.
  rendering_and_quality: Luminous illustration with fine thread-like light and deep darks.
  creative_brief: "Fiberpunk: a city threaded with glowing optical fibers, where data travels as visible light through cables, clothing and even hair. Carry it through glowing fibers, light pulses, woven light fabric, dark city. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: glowing fibers; light pulses; woven light fabric; dark city
