visualDna:
  aesthetic: >-
    Material-aware digital painting combines clear planes with restrained granular variation that
    follows the actual surface rather than becoming a global texture effect.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Add pores, fractures or grain only
    where they fit the represented material; do not turn skin, fabric or manufactured forms to stone.
  color_and_tone: >-
    Distinguish materials through value and local color relationships instead of noisy contrast. Keep the
    palette requested by the user.
  lighting_and_shadow: >-
    Follow the requested lighting. Let value describe surface differences without adding sparkle, harsh
    glints or unsupported sources of light.
  texture_and_material: >-
    Keep grain at a controlled scale within each material and vary it only where the surface warrants it.
    Preserve smooth and rough areas as distinct instead of covering them uniformly.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Material texture does not
    require a close-up or altered arrangement.
  atmosphere_and_mood: >-
    Keep the requested mood. Granular surfaces do not imply age, decay, geology or a fantasy setting.
  rendering_and_quality: >-
    Keep major forms clear and texture subordinate to them. Make surface variation legible at a useful
    scale without letting noise replace edges or material boundaries.
avoidRules:
  - texture noise that ignores material boundaries
  - stone-like conversion of unrelated surfaces
