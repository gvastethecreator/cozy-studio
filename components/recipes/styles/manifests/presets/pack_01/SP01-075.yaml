visualDna:
  aesthetic: 'Urban exploration photography: abandoned buildings recorded on a tripod, with decay, light shafts and silence as the subject.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Desaturated rust, moss green, peeling pastel paint and grey concrete, with warm or cold light shafts.
  lighting_and_shadow: Natural light through collapsed roofs, broken windows and doorways; long exposure keeps the shadows detailed.
  texture_and_material: Peeling paint, rust bloom, fallen plaster, moss and ivy invading floors, dust in the beams.
  camera_and_composition: 16–24 mm symmetrical view down a hall or nave, wide foreground debris, at most one small human figure for scale.
  atmosphere_and_mood: Lonely and hushed, time pressing on a room that everyone has left.
  rendering_and_quality: Tripod-sharp exposure with restrained HDR; no fake grunge overlay or horror props.
  key_features: abandoned interior; light shafts through collapse; peeling paint and rust; symmetrical wide view; tiny human scale
  creative_brief: "Urban exploration photography: abandoned buildings recorded on a tripod, with decay, light shafts and silence as the subject. Carry it through abandoned interior, light shafts through collapse, peeling paint and rust, symmetrical wide view, tiny human scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
