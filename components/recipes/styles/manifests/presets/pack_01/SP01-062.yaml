visualDna:
  aesthetic: 'Corporate stock photography: bright, safe, generic imagery with smiling people collaborating in clean spaces — the look, deliberately, of the stock library.'
  subject_treatment: Keep the prompt subject and setting; stage people in friendly collaborative poses with broad smiles and tidy clothing, as stock photos do.
  color_and_tone: Bright high-key exposure, cool blue-white tint, clean whites, low contrast.
  lighting_and_shadow: Even soft institutional light from big windows or panels; almost no shadow.
  texture_and_material: Clean glass walls, white desks and potted plants; skin smoothed and clothes wrinkle-free.
  camera_and_composition: Eye level, 35–50 mm, a group arranged around one object they all look at, shallow background blur.
  atmosphere_and_mood: Relentlessly positive and bland, optimism that is a little too perfect to believe.
  rendering_and_quality: Glossy generic stock finish; no screens with readable UI and no real brands.
  key_features: bright blue-white high key; group around one object; broad smiles; glass office blur; sanitized sameness
  creative_brief: "Corporate stock photography: bright, safe, generic imagery with smiling people collaborating in clean spaces — the look, deliberately, of the stock library. Carry it through bright blue-white high key, group around one object, broad smiles, glass office blur, sanitized sameness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
