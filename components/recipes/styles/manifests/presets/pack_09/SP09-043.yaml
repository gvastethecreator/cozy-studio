visualDna:
  aesthetic: 'Slime and goo: thick translucent slime dripping, stretching and pooling on the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: glossy slime coats parts of the target, stretching into strands and pooling below.'
  color_and_tone: Lime, violet or clear slime with glossy highlights, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Backlight for translucency and wet highlights, so the effect lights the target and casts believable local light.
  texture_and_material: Viscous slime with strands, drips and bubbles, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Gross, playful, strange and sticky, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: dripping slime strands; glossy pools; contained around the target
  creative_brief: "Slime and goo: thick translucent slime dripping, stretching and pooling on the target. Carry it through dripping slime strands, glossy pools, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
