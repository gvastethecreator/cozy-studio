visualDna:
  aesthetic: 'Pop silkscreen: the subject as a flat screen print in loud commodity colors, sometimes repeated in a grid with off-register color.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: flattened into high-contrast photographic shadows printed over flat color blocks, with slightly misregistered color layers."
  color_and_tone: 'Loud flat colors: hot pink, acid yellow, turquoise and black.'
  lighting_and_shadow: Harsh flash contrast reduced to black shapes, expressed through the style rather than photographic lighting.
  texture_and_material: Silkscreen ink, off-register edges and flat paper, visible at card size as the signature of the style.
  camera_and_composition: Single frontal panel or a grid of repeats in different colorways.
  atmosphere_and_mood: Bold, ironic, graphic and cool, driven by the construction, color and rhythm.
  rendering_and_quality: Clean silkscreen print with deliberate misregistration, with clean, deliberate marks and no accidental noise.
  key_features: flat color blocks; black photo shadows; off-register; repeat grid
  creative_brief: "Pop silkscreen: the subject as a flat screen print in loud commodity colors, sometimes repeated in a grid with off-register color. Carry it through flat color blocks, black photo shadows, off-register, repeat grid. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
