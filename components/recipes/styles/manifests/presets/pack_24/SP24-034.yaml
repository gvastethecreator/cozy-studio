  aesthetic: 'Rooftop surveillance night: a lone observer watching a rain-slick city from rooftops, painted in noir gouache with neon reflections and deep silhouettes.'
  subject_treatment: Place the prompt's subject on a nighttime rooftop above a city, keeping it clear as a strong silhouette.
  color_and_tone: Inky blues and blacks with neon magenta and teal reflections on wet surfaces.
  lighting_and_shadow: City glow from below, rim light on the silhouette and deep rooftop shadow.
  texture_and_material: Wet roof tar, rain, water tanks, antennas and binocular glass.
  camera_and_composition: Figure on a roof edge with the city spread below, strong diagonals.
  atmosphere_and_mood: Patient, watchful and alone, the city never notices.
  rendering_and_quality: Noir gouache painting with crisp silhouettes and glowing reflections.
  creative_brief: "Rooftop surveillance night: a lone observer watching a rain-slick city from rooftops, painted in noir gouache with neon reflections and deep silhouettes. Carry it through rooftop silhouette, rain-slick city below, neon reflections, binoculars. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
