visualDna:
  aesthetic: 'Aerochrome color infrared: a false-color reversal film where healthy foliage turns red and magenta and skies go deep cyan-blue.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Hot pink, crimson and magenta vegetation, deep teal sky and water, pale yellow skin.
  lighting_and_shadow: Bright sunlight with a yellow filter; glowing infrared-reflective foliage.
  texture_and_material: Fine grain, slightly soft infrared focus, white bloom on the brightest leaves.
  camera_and_composition: Keep the requested framing; vegetation or sky visible where possible.
  atmosphere_and_mood: Psychedelic and uncanny, the familiar world recolored.
  rendering_and_quality: False-color film look; the black-and-white infrared belongs to pack_01.
  key_features: magenta and red foliage; deep cyan sky; pale yellow skin; infrared bloom; false-color reversal
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Infrared Film (Aerochrome) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
