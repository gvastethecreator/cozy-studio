  aesthetic: 'Valve Half-Life 2 (2004) look: first-person Source engine view of an Eastern European city under alien occupation, brutalist citadel, canals, rusty metal and overgrown ruins.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as tired resistance citizens in blue work clothes and scavenged gear, seen from first person. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Desaturated teal, concrete grey, rust brown and faded green.
  lighting_and_shadow: "Overcast flat light with crisp dark shadows under ledges and a slightly hazy distance."
  texture_and_material: "Rust, concrete and grime textures that look sharp from afar but blurry up close, simple blocky debris."
  camera_and_composition: First-person view with a weapon at screen right.
  atmosphere_and_mood: Keep the requested mood with grim occupied resistance.
  rendering_and_quality: "A 2004 PC frame at 1024 by 768 in first person: muted teal-grey city, a weapon at bottom right, health and ammo number shapes at the bottom."
  key_features: Half-Life 2 City 17; citadel; canals; first-person
  creative_brief: 'Valve Half-Life 2 (2004) look: first-person Source engine view of an Eastern European city under alien occupation, brutalist citadel, canals, rusty metal and overgrown ruins. Carry it through Half-Life 2 City 17, citadel, canals, first-person. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
