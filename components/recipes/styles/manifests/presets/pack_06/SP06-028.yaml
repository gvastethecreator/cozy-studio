visualDna:
  aesthetic: 'Scratchboard drawing: a black ink layer over white clay scratched away with a knife and wire brush, so every mark is a white line pulled out of darkness.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Pure black and white; greys only as density of fine white scratched lines, optional thin color glaze over scratched whites.
  lighting_and_shadow: 'Subtractive light: forms emerge where scratches gather thickest, deep shadow stays solid unscratched black.'
  texture_and_material: Razor-thin crisp white lines, stippled scratch dots, wire-brush fur texture, a matte clay surface.
  camera_and_composition: Keep the requested framing; a strong single light source makes subjects emerge from black.
  atmosphere_and_mood: Dramatic, nocturnal and precise, carved out of the dark.
  rendering_and_quality: Consistently crisp white scratched lines following the form; no grey wash, no black drawn lines on white.
  key_features: white lines scratched from black; wire-brush fur texture; stippled scratch dots; solid black shadows; form-following line direction
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Clayboard Scratch Drawing as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
