visualDna:
  aesthetic: >-
    Elegant anime cel illustration uses long tapered contours, fine ornamental turns, and
    nested shapes.
  subject_treatment: >-
    Keep anatomy and costume as prompted; place filigree only along existing edges or
    surfaces.
  color_and_tone: >-
    Warm ivory, peacock teal, jade, cobalt, antique gold; decisive dark anchors.
  lighting_and_shadow: >-
    Broad even light with small warm edge notes and crisp separating shadows.
  texture_and_material: >-
    Fine line and matte cel fill; detail textiles or metals only when shown.
  camera_and_composition: >-
    Maintain the camera; measured vertical rhythm and balanced space, no added architecture.
  atmosphere_and_mood: >-
    Refinement comes through poised line spacing; preserve the requested emotion.
  rendering_and_quality: >-
    Clean thin-to-thick contour, selective ornament, stable values, no crowded trim.
  key_features: >-
    Tapered ornamental contour, nested cel shapes, jade-cobalt accents, measured vertical
    balance
  creative_brief: 'Apply a visual treatment centered on tapered ornamental contour, nested cel shapes, jade-cobalt accents, measured vertical balance. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
