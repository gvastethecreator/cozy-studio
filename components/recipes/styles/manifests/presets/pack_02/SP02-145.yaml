visualDna:
  aesthetic: '1980s pocket Instamatic: a tiny 110 negative enlarged into a small grainy print, with a flash bar and fixed-focus lens.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Saturated but slightly muddy color, warm skin, cool shadows, glossy print.
  lighting_and_shadow: Flash bar at close range, bright center, dark falloff.
  texture_and_material: Heavy grain from the tiny negative, soft overall focus, glossy surface.
  camera_and_composition: Keep the requested framing; subjects centered and a little too far away.
  atmosphere_and_mood: Everyday and affectionate, a small memory in a shoebox.
  rendering_and_quality: Tiny-negative enlargement look; softer than 35 mm film.
  creative_brief: "1980s pocket Instamatic: a tiny 110 negative enlarged into a small grainy print, with a flash bar and fixed-focus lens. Carry it through heavy 110 grain, soft fixed focus, flash bar hot center, saturated muddy color, glossy small print. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: heavy 110 grain; soft fixed focus; flash bar hot center; saturated muddy color; glossy small print
