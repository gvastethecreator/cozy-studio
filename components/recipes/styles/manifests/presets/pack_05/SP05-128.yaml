visualDna:
  aesthetic: 'Studio Pierrot Bleach: Thousand-Year Blood War look (2022): stark black-and-white inversions, negative-image impact frames, Tite Kubo elegant fashion silhouettes and operatic spiritual battles.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Kubo-derived designs, tall elegant silhouettes, sharp fashionable uniforms and dramatic calm faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Stark black, white and red with sudden negative inversions of the palette.
  lighting_and_shadow: Negative-inverted impact frames, spiritual pressure glows and hard silhouettes.
  texture_and_material: Crisp cel with ink-like black splits and flat negative-image effects.
  camera_and_composition: Operatic stillness, sudden inversion cuts and elegant silhouette framing.
  atmosphere_and_mood: Keep the requested mood with operatic cold grandeur.
  rendering_and_quality: Striking modern Pierrot frame with black-and-white negative effects.
  key_features: Negative inversion; stark black-white-red; elegant silhouettes; operatic battle
  creative_brief: "Studio Pierrot Bleach: Thousand-Year Blood War look (2022): stark black-and-white inversions, negative-image impact frames, Tite Kubo elegant fashion silhouettes and operatic spiritual battles. Carry it through Negative inversion, stark black-white-red, elegant silhouettes, operatic battle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
