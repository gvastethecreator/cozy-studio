visualDna:
  aesthetic: 'Streamline Moderne architecture: horizontal speed lines, rounded corners and curved end walls, porthole windows, glass block and ship-like railings on smooth white render.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: White or cream render with pale mint, sky blue or salmon trim, chrome and stainless steel; sunny, clean, high-key.
  lighting_and_shadow: Strong sun sliding around curved corners in a smooth gradient, thin shadow bands under horizontal fins.
  texture_and_material: Smooth render with triple speed-line grooves, glass block curved walls, tubular steel ship railings, porthole windows, stainless steel trim.
  camera_and_composition: Keep the requested view; three-quarter view on a rounded corner so horizontals sweep around it.
  atmosphere_and_mood: Breezy, fast and sunny, a building dressed as an ocean liner.
  rendering_and_quality: Clean photograph with smooth curved gradients and crisp horizontals, no Art Deco zigzags or vertical crowns.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Streamline Moderne as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
