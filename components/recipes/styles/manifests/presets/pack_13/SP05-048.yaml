visualDna:
  aesthetic: >-
    Decisive anime contours shift from firm outer strokes to fast tapered accents and cel
    shadows.
  subject_treatment: >-
    Retain anatomy, costume, gesture; follow existing movement without adding adventure
    props.
  color_and_tone: >-
    Clay red, deep blue, sand, cool gray; red is an accent, not hair color.
  lighting_and_shadow: >-
    Brisk directional light against firm cool shadows; reflections stay on visible surfaces.
  texture_and_material: >-
    Smooth opaque color with sparse dry-brush edges; no simulated wind or dust.
  camera_and_composition: >-
    Preserve camera and count; use diagonals only when action supports them.
  atmosphere_and_mood: >-
    Resolve comes through a clear silhouette when appropriate; do not impose romance.
  rendering_and_quality: >-
    Legible action, crisp cel bands, sparse texture, no unrequested motion blur.
  key_features: >-
    Decisive tapered line, clay-red accent, firm cel shadows, gesture-led diagonals
  creative_brief: "Apply a visual treatment centered on decisive tapered line, clay-red accent, firm cel shadows, gesture-led diagonals. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject."
