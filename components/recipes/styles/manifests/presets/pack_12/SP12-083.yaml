visualDna:
  aesthetic: >-
    A 2015 PS4-generation real-time action-horror frame whose Gothic environment is experienced from
    immediately behind the playable hunter. The environment rises around a human-scale figure
    instead of being reduced to an elevated ARPG playfield.
  subject_treatment: >-
    Preserve the requested subjects and action. When hunters are appropriate, favor a lean elongated
    silhouette, layered worn leather coat tails, high collar, compact headwear and asymmetrical
    equipment. Keep the active arm, weapon shape and footing readable against nearby threats.
    Trick-weapon construction may characterize requested equipment; do not force a hunter, enemy or
    specific weapon into unrelated subjects.
  color_and_tone: >-
    Retain blue-gray and blue-black shadow, soot-dark stone and timber, and restrained umber; add
    small amber gaslight or candle points and scene-dependent warm sky or blood accents. Avoid an
    unbroken clean cyan cast.
  lighting_and_shadow: >-
    Use low-key 2015-era real-time light with cool high-window beams and sparse warm practicals.
    Preserve midtone on the coat, weapon, footing, and route so the hunt reads as play.
  texture_and_material: >-
    Bring out worn leather, stained cloth, iron, old glass, damp stone, and soot in localized areas.
    Keep the Gothic architecture varied and weathered instead of uniformly pristine blue glass.
  camera_and_composition: >-
    Use a close over-the-shoulder third-person camera at human height. Place the playable figure
    near the lower foreground and let rails, floor lines, tall windows, and columns lead forward
    into the playable space; do not switch to an isometric or first-person view.
  atmosphere_and_mood: >-
    Keep immediate architectural oppression and uncertain depth around the player while leaving the
    route and requested action legible. A hunt, enemy, or attack is not mandatory.
  rendering_and_quality: >-
    Keep restrained PS4-era real-time detail and stable human-height camera scale; avoid a smooth
    promotional monster portrait or a spotless cinematic cathedral.
avoidRules:
  - isometric or first-person view
  - static fashion portrait in place of gameplay-scale framing
  - unreadable subject/architecture overlap
  - unrequested canonical hunter, weapon, boss or landmark
  - unrequested HUD, logo, interface or captions; preserve explicitly requested UI and text
  - anime, manga or cel-shaded grammar
