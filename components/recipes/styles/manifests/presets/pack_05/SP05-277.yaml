visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around irregular scraped strokes
    with slight contour offsets, alternating rust-red marks and restrained cool neon
    edge slips. For color and surface, respect the prompt colors and pair
    oxidized orange-red with a contained violet or cyan note over stable midtones.
    Adolescent dread may be tender, energetic, or absent according to the prompt; avoid
    turning it into a forced urban threat
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through irregular scraped strokes with
    slight contour offsets, alternating rust-red marks and restrained cool neon edge
    slips; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; respect the prompt colors and
    pair oxidized orange-red with a contained violet or cyan note over stable midtones.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; place colored rim accents only
    on existing edges that can catch them; preserve ambient value and avoid an invented
    neon source. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; mix dry scraped pigment with tiny oxidized
    specks, never distressing every surface or changing its material identity. Keep
    texture subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; keep the
    original composition intact and use broken stroke intervals to add unease inside
    existing negative space. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Adolescent dread may be tender, energetic,
    or absent according to the prompt; avoid turning it into a forced urban threat.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and irregular scraped strokes with slight
    contour offsets, alternating rust-red marks and restrained cool neon edge slips;
    keep focal edges crisp, texture controlled, and dark values legible. Avoid photoreal
    or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    irregular scraped strokes with slight contour offsets, alternating rust-red marks
    and restrained cool neon edge slips; respect the prompt colors and pair oxidized
    orange-red with a contained violet or cyan note over stable midtones; place colored
    rim accents only on existing edges that can catch them; preserve ambient value and
    avoid an invented neon source; mix dry scraped pigment with tiny oxidized specks,
    never distressing every surface or changing its material identity; and keep the
    original composition intact and use broken stroke intervals to add unease inside
    existing negative space. The five cues should read as one mark-and-value system, not
    as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use irregular scraped strokes with slight
    contour offsets, alternating rust-red marks and restrained cool neon edge slips,
    respect the prompt colors and pair oxidized orange-red with a contained violet or
    cyan note over stable midtones, place colored rim accents only on existing edges
    that can catch them; preserve ambient value and avoid an invented neon source, and
    mix dry scraped pigment with tiny oxidized specks, never distressing every surface
    or changing its material identity; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
