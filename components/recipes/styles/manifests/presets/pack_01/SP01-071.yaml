visualDna:
  aesthetic: 'Flat lay: objects arranged on a surface and photographed straight down at exactly 90 degrees with measured spacing.'
  subject_treatment: Keep the prompt's object exactly — shape, proportions, color and supplied design; this preset owns the straight-down camera and the arranged layout.
  color_and_tone: Coordinated palette of three or four colors, matte surface background.
  lighting_and_shadow: Soft overhead or window light with small, consistent soft shadows to one side.
  texture_and_material: Background surface (linen, slate, wood, paper) visible and even; objects crisp.
  camera_and_composition: Exactly top-down, no perspective, objects in a grid or radial arrangement with equal gaps and negative space.
  atmosphere_and_mood: Orderly and satisfying, everything placed with patient intent.
  rendering_and_quality: Crisp editorial flat lay; no tilted camera and no clutter pile.
  key_features: exact 90-degree overhead; measured spacing; coordinated palette; soft consistent shadows; negative space
  creative_brief: "Flat lay: objects arranged on a surface and photographed straight down at exactly 90 degrees with measured spacing. Carry it through exact 90-degree overhead, measured spacing, coordinated palette, soft consistent shadows, negative space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
