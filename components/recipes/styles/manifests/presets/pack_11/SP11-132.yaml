visualDna:
  aesthetic: 'Axonometric drawing: a building shown in a parallel projection from above with crisp lines and flat color.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: drawn in parallel axonometric projection, often exploded or cut open, with flat color fills."
  color_and_tone: Flat pastel fills with black lines, following the conventions of this drawing type.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Clean lines on white, with the drafting tools visible in the line quality.
  camera_and_composition: Axonometric view floating on white, laid out as a real sheet of this drawing type.
  atmosphere_and_mood: Clear, modern, analytic and elegant, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Axonometric Architectural Drawing as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: axonometric projection; flat fills; cut-away
