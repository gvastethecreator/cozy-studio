visualDna:
  aesthetic: 'Nested Object Tokens: two simplified objects fit into each other so their relationship, not a pile of accessories, tells what the app does.'
  subject_treatment: Fit the prompt's subject together with one related object so the fit explains the function, each keeping its one essential trait.
  color_and_tone: Two color families for the two pieces, their values well apart in greyscale.
  lighting_and_shadow: One soft shared light with visible contact where the pieces meet.
  texture_and_material: Discreet tactile surfaces with one consistent finish for both pieces.
  camera_and_composition: Primary piece holds most of the mass, the secondary filling a void without hiding it.
  atmosphere_and_mood: Complicity and a satisfying fit, with nothing extra piled on top.
  rendering_and_quality: The relationship reads at small size and stays clear without an outer container.
  creative_brief: "Nested Object Tokens: two simplified objects fit into each other so their relationship, not a pile of accessories, tells what the app does. Carry it through two fitted objects, relationship metaphor, shared light, no clutter. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two fitted objects; relationship metaphor; shared light; no clutter
