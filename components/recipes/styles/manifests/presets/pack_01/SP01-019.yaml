visualDna:
  aesthetic: 'Black-and-white infrared film behind a deep red filter: living foliage glows white, clear skies turn nearly black, and highlights bloom with soft halation.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: 'Monochrome with inverted landscape values: snow-white leaves and grass, near-black sky and water, luminous milky skin; no false color.'
  lighting_and_shadow: Strong sunlight works best; bright infrared reflectors glow and spread light into their surroundings; shadows deep but soft-edged.
  texture_and_material: Pronounced grain, a dreamy bloom around white foliage, skin smoothed to porcelain by infrared penetration, dark veins sometimes visible.
  camera_and_composition: Keep the requested framing; include vegetation or sky where the prompt allows so the value inversion reads.
  atmosphere_and_mood: Otherworldly and frozen, familiar landscapes turned pale as ghost light.
  rendering_and_quality: Monochrome infrared negative look; not the pink-and-cyan color infrared owned by Photography Eras.
  key_features: white glowing foliage; near-black sky; halation bloom; milky skin; pronounced grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Black-and-White Infrared Film as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
