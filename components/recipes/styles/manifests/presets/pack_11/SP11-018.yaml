visualDna:
  aesthetic: 'Balloon art: the subject twisted from long modeling balloons.'
  subject_treatment: "Rebuild the prompt's subject as a physical crafted object made this way, keeping its identity, pose and action readable: twisted from inflated modeling balloons with visible twists and knots."
  color_and_tone: Glossy balloon colors, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Bright light with glossy highlights, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Latex balloons with twists, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at card size.
  atmosphere_and_mood: Playful, festive, silly and bright, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: twisted balloons; glossy latex
  creative_brief: "Balloon art: the subject twisted from long modeling balloons. Carry it through twisted balloons, glossy latex. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
