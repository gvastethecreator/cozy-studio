visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Total War: Three Kingdoms gameplay screenshots:
    large-scale strategy capture with massed units, siege camps, marsh terrain, formation banners,
    and command-camera battlefield hierarchy. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Total War: Three Kingdoms-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Total War: Three Kingdoms-informed palette: bronze armor, marsh green, dusty tan, banner
    red, smoke grey, and muted gold. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through overcast campaign daylight, fire arrows, campfires, smoke haze, and
    armor glints. Lighting must clarify the playable route, threat, focal subject, or objective and
    avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from troop formations, polearms, muddy ground, siege towers, canvas camps,
    banners without readable script, and terrain clutter. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with elevated battlefield camera with army lines, flanking routes, unit cards, minimap
    logic, and objective spacing. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Total War: Three Kingdoms-derived mood: historical, strategic, muddy, disciplined, and
    large-scale. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: unit cards, formation markers,
    minimap, morale bars, and command icons can appear as coherent strategy UI. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Total War: Three Kingdoms gameplay screenshots; large-scale strategy capture with massed units,
    siege camps, marsh terrain, formation banners, and command-camera battlefield hierarchy; bronze
    armor, marsh green, dusty tan, banner red, smoke grey, and muted gold; overcast campaign
    daylight, fire arrows, campfires, smoke haze, and armor glints; troop formations, polearms,
    muddy ground, siege towers, canvas camps, banners without readable script, and terrain clutter;
    elevated battlefield camera with army lines, flanking routes, unit cards, minimap logic, and
    objective spacing; historical, strategic, muddy, disciplined, and large-scale; HUD guidance:
    unit cards, formation markers, minimap, morale bars, and command icons can appear as coherent
    strategy UI
  creative_brief: >-
    Use Total War Bronze Marsh Siege as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Total War: Three Kingdoms: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
