  aesthetic: 'Quantized Pixel Unfolding: styleframes where whole pixel clusters rearrange step by step on one fixed logical grid.'
  subject_treatment: Show the prompt's subject unfolding in keyframes of whole pixel clusters on one fixed grid, same palette and piece count and exact words.
  color_and_tone: A limited constant palette with hard pixel edges.
  lighting_and_shadow: Shading in whole-pixel value bands with crisp steps.
  texture_and_material: Square pixels with quantized edges, each cluster a unit of motion.
  camera_and_composition: A fixed logical grid and stable frame with room to unfold.
  atmosphere_and_mood: A discrete cadence of opening, moving and fitting, like a small puzzle.
  rendering_and_quality: Crisp keyframes aligned to the pixel grid with clusters kept.
  creative_brief: "Quantized Pixel Unfolding: styleframes where whole pixel clusters rearrange step by step on one fixed logical grid. Carry it through pixel clusters, fixed grid, step-by-step unfold, limited palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
