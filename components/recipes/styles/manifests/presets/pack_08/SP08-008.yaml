    asymmetry, bondage-strap tension, drainpipe jeans; identity stays readable as silhouette, fit,
    layering, body-volume logic, edge behavior, and styling hierarchy shift into this preset.
  color_and_tone: >-
    Map color through identity colors, denim or leather anchors, subculture accents, worn neutrals,
