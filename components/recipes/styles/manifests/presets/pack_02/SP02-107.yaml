visualDna:
  aesthetic: >-
    Use this drawing language: Pastel uncanny-cartoon language with large quiet negative spaces,
    small high-contrast disruptions, sudden scale shifts, dusty cel grain, and abrupt inset
    shapes. Apply it to the supplied content without requiring a particular cast, place, or
    story.
  subject_treatment: >-
    Apply sparse outlines, tiny panic marks, abrupt inset contours, and empty-space framing to
    the supplied subject while preserving its identity, silhouette, requested action, actual
    material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: >-
    Use dusty pink, bruise purple, muted beige, moonlit blue, alarm red, and faded pastel yellow
    as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use isolated highlights and sudden contrast shifts within the existing scene as a visual
    treatment, while respecting any lighting instructions in the request.
  texture_and_material: >-
    Render grainy cel texture, dusty color, dry pastel marks, and a smooth inset only when
    requested as drawn or printed surface marks over the existing material; do not change the
    subject's actual substance or function.
  camera_and_composition: >-
    Expand quiet negative space and reserve abrupt scale shifts or inset forms for a focal
    disruption; preserve the requested setting.
  atmosphere_and_mood: >-
    Lonely, surreal, and tense; let negative space create unease without setting a location.
  rendering_and_quality: >-
    Finish with dusty pastel color, grainy cel texture, and a deliberately sharp shift in
    smoothness only if requested.
  key_features: >-
    quiet negative space; sparse contour; sudden scale shifts; dusty cel grain; abrupt inset
    shapes
  creative_brief: >-
    Render the supplied content with sparse outlines, tiny panic marks, abrupt inset contours,
    and empty-space framing. Use dusty pink, bruise purple, muted beige, moonlit blue, alarm
    red, and faded pastel yellow as style colors while honoring any explicit color instructions.
    Apply grainy cel texture, dusty color, dry pastel marks, and a smooth inset only when
    requested as drawn or printed marks over the existing material, without changing what the
    subject is made of or how it functions. Preserve the requested subject, action, and setting;
    follow the supplied composition and add no unrequested cast, location, lettering, or gag.
