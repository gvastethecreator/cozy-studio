  aesthetic: 'Victorian revival illumination: nineteenth-century chromolithographed imitations of medieval illumination, too perfect and too bright, with crisp gold, geometric borders and saturated color.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; frame the subject in immaculate neo-gothic borders printed in saturated color.
  color_and_tone: Saturated crimson, ultramarine, emerald and bright printed gold.
  lighting_and_shadow: Flat with slight printed modeling, kept consistent across the whole image.
  texture_and_material: Chromolithograph ink, printed gold and smooth paper, kept consistent across the whole image.
  camera_and_composition: Central panel with elaborate symmetric borders, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with earnest Victorian grandeur.
  rendering_and_quality: Crisp mechanical perfection of revival ornament, kept consistent across the whole image.
  creative_brief: "Victorian revival illumination: nineteenth-century chromolithographed imitations of medieval illumination, too perfect and too bright, with crisp gold, geometric borders and saturated color. Carry it through neo-gothic border, saturated chromolithograph, printed gold, symmetry. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: neo-gothic border; saturated chromolithograph; printed gold; symmetry
