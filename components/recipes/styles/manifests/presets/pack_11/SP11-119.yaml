  camera_and_composition: Top-down satellite view, matching how this instrument actually frames data.
  atmosphere_and_mood: Vast, turbulent, moody and planetary, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
