visualDna:
  aesthetic: 'Radial Relationship Graphics: one named center, rings and arcs sort relationships outward, angle marking identity rather than amount.'
  subject_treatment: Arrange the prompt's entities around one named center in rings by relationship type, each link drawn once and angle carrying no quantity; keep labels exact.
  color_and_tone: Color by ring or class backed by node shape.
  lighting_and_shadow: Flat layers separated by distance on one plane.
  texture_and_material: Clean arcs, consistent node sizes and exterior labels without tangles.
  camera_and_composition: A clearly named center, rings with distinct jobs and a legend outside the circle.
  atmosphere_and_mood: An orderly expansion from one central idea outward.
  rendering_and_quality: Crisp radial diagram with clean tangents and horizontal labels.
  creative_brief: "Radial Relationship Graphics: one named center, rings and arcs sort relationships outward, angle marking identity rather than amount. Carry it through named center, relationship rings, single links, outside legend. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: named center; relationship rings; single links; outside legend
