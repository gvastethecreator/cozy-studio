visualDna:
  aesthetic: 'Reverse glass painting: opaque paint applied to the back of a glass pane in reverse order, outlines and highlights first and background last, viewed through the glossy glass.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Bright flat folk colors, crimson, cobalt, emerald and yellow, with dark outline strokes and patches of metallic foil showing through unpainted areas.
  lighting_and_shadow: No modeled shadow; volume suggested only by a few painted highlight strokes, and a glassy sheen reflects across the whole surface.
  texture_and_material: Perfectly flat paint seen through glass, crisp first-laid outlines, crumpled gold or silver foil backing glittering in the gaps, faint glass reflection.
  camera_and_composition: Keep the requested framing; forms are flat, frontal and decorative, filled edge to edge with ornament in the spaces.
  atmosphere_and_mood: Naive, festive and devout, bright as a village feast day.
  rendering_and_quality: Uniform opaque color behind crisp outlines, glossy glass surface over everything, foil sparkle; no brush texture and no gradients.
  creative_brief: "Reverse glass painting: opaque paint applied to the back of a glass pane in reverse order, outlines and highlights first and background last, viewed through the glossy glass. Carry it through paint behind glass seen through a glossy pane, outlines laid first, flat bright folk colors, crumpled foil backing, decorative frontal layout. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: paint behind glass seen through a glossy pane; outlines laid first; flat bright folk colors; crumpled foil backing; decorative frontal layout
