visualDna:
  aesthetic: >-
    Manga (Shojo) acts as a transferable illustration router: start from Romantic manga visual
    language with decorative emotional emphasis, Decorative overlays, ornamental borders,
    emotion-forward closeups and comic-illustration system built from ink hierarchy, panel-era
    color, contour exaggeration, print artifacts, and sequential-art readability, then apply the
    visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Fine delicate linework, elegant curves, expressive facial
    detailing; preserve the requested subject while translating form into panel-ready silhouettes,
    expressive contour weight, stylized anatomy, speed emphasis, or graphic restraint only when the
    preset calls for it, keeping the requested identity, silhouette, pose, object function, or
    setting legible.
  color_and_tone: >-
    Build color with Monochrome with soft gray tone bands and light ornamental accents; treat color
    as comic production language: four-color plates, limited spot color, manga monochrome, digital
    flats, noir contrast, webtoon gradients, or painted page atmosphere, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Diffused glow, soft bloom highlights, low-contrast value transitions; make
    light read through ink spotting, cel-like value blocks, dramatic rim separation, flat print
    fill, or painted page modeling rather than generic studio illumination, so value structure
    supports the illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Floral/sparkle screentone motifs and airy texture overlays; surface detail should reveal
    paper tooth, newsprint dots, screen tones, digital brush layers, ink pools, gutter discipline,
    or pixel cells at a scale that supports the drawing, keeping material scale coherent and
    avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Stylized facial proportion and lyrical panel-space treatment;
    compose with panel logic, silhouette clarity, speech-shape space, page rhythm, close-up drama,
    or scroll pacing without requiring a fixed comic-page scene, with scale, spacing, edge rhythm,
    and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Tender, dreamy, introspective, mood carried by Manga (Shojo) craft, material
    pressure, and visual restraint; derive mood from era, genre pressure, satire, melodrama, horror
    obsession, pulp energy, or graphic-novel seriousness, letting the style alter interpretation
    without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Polished emotional panel rendering with graceful line control; finish with clear ink
    decisions, readable stylization, controlled artifacting, and no generic superhero costume or
    random comic text replacing the prompt, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    Romantic manga visual language with decorative emotional emphasis; Decorative overlays,
    ornamental borders, emotion-forward closeups; Monochrome with soft gray tone bands and light
    ornamental accents; Floral/sparkle screentone motifs and airy texture overlays; Stylized facial
    proportion and lyrical panel-space treatment
  creative_brief: >-
    Apply Manga (Shojo) as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Romantic manga visual language with decorative emotional emphasis, Decorative overlays,
    ornamental borders, emotion-forward closeups, Floral/sparkle screentone motifs and airy texture
    overlays without requiring the card image's original subject.
