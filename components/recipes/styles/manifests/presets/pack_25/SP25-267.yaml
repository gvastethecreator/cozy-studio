visualDna:
  aesthetic: 'Negative-Space Garment Prints: unprinted fabric becomes part of the motif, forming a second figure against the ink.'
  subject_treatment: Print the prompt's garment so the unprinted fabric forms a second figure between ink masses, the reserves showing the true fabric color.
  color_and_tone: Strong ink-to-fabric contrast, the reserve exactly the garment color.
  lighting_and_shadow: Flat art first, with even mockup light so shadows never read as gaps.
  texture_and_material: Solid controlled ink and clean voids showing the real weave.
  camera_and_composition: Off-center motif with openings protected from seams and folds.
  atmosphere_and_mood: Print economy and a clear, satisfying double reading of the motif.
  rendering_and_quality: Clean print with an explicit ink mask and true transparency.
  creative_brief: "Negative-Space Garment Prints: unprinted fabric becomes part of the motif, forming a second figure against the ink. Carry it through fabric as figure, ink masses, double reading, true reserves. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fabric as figure; ink masses; double reading; true reserves
