visualDna:
  aesthetic: 'Impossible circulation: stairs, ramps and walkways that connect into closed loops, climbing forever yet returning to their start, built as solid architecture.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into a closed impossible circulation loop of stairs, ramps or channels, and that advertised structural change is the purpose of the preset.
  color_and_tone: Pale board-formed concrete, warm limestone and clear sky blue; calm, even and believable.
  lighting_and_shadow: One consistent midday sun with crisp shadows, making the impossible connections look physically real.
  texture_and_material: Board-formed concrete, worn stair nosings, limestone treads, simple iron railings.
  camera_and_composition: Elevated near-isometric view chosen so the loop closes exactly at the viewpoint.
  atmosphere_and_mood: Calm and quietly dizzying, a structure that makes sense until it does not.
  rendering_and_quality: Architectural photograph realism, not lithograph linework or tessellated print, which belongs to Escher Style.
  key_features: closed circulation loops; endlessly ascending stairs; built concrete and limestone; consistent midday sun; elevated near-isometric view
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Impossible Circulation Optical Paradox as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
