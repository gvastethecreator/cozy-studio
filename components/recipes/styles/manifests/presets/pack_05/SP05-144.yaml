  lighting_and_shadow: Warm Edo sun on dusty streets and lantern glow in teahouses at night.
  texture_and_material: Loose cel with graffiti touches and stuttered freeze-frames.
  camera_and_composition: Record-scratch freeze frames, stuttered cuts and low breakdance camera angles.
  atmosphere_and_mood: Keep the requested mood with cool rhythmic swagger.
  rendering_and_quality: Stylish 2004 Manglobe television frame with hip-hop editing rhythm.
  key_features: Champloo hip-hop; record-scratch edits; Edo swagger; Nakazawa designs
  creative_brief: "Manglobe Samurai Champloo look (2004) by Shinichiro Watanabe: Edo period mixed with hip-hop swagger, record-scratch stutter editing, graffiti touches and Kazuto Nakazawa designs. Carry it through Champloo hip-hop, record-scratch edits, Edo swagger, Nakazawa designs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
