visualDna:
  aesthetic: 'Type-as-Architecture Graphics: huge letters aligned with the proportions, joints and openings of the real space.'
  subject_treatment: Set the prompt's words at architectural scale, aligned with the existing joints, heights and openings, the word complete and the building unchanged.
  color_and_tone: Contrast adapted to the support with large reserves.
  lighting_and_shadow: Architectural light kept, reading checked from more than one angle.
  texture_and_material: Mural graphics with controlled edges, separate from structure.
  camera_and_composition: Baseline, height or module tied to real joints and planes.
  atmosphere_and_mood: A spatial presence that amplifies identity without dominating the building.
  rendering_and_quality: Clean supergraphic with exact words and verifiable alignments.
  creative_brief: "Type-as-Architecture Graphics: huge letters aligned with the proportions, joints and openings of the real space. Carry it through architectural scale type, joint alignment, complete word, intact building. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
