visualDna:
  aesthetic: 'Pulled-string ink: an ink-soaked string laid between folded paper and pulled out, leaving mirrored feathery trails that are then read as the subject.'
  subject_treatment: Shape the prompt's subject from symmetrical string-pull trails, adding only minimal brush details so it becomes recognizable.
  color_and_tone: One or two ink colors, often black and one bright accent, with mirrored density on both sides of the fold.
  lighting_and_shadow: No modeled light; density of the dragged trails creates dark and pale zones.
  texture_and_material: Fine feathered strand marks, looping drag trails, a faint center fold crease and soft blotted edges.
  camera_and_composition: Mirror-symmetric composition around a central fold, the subject rising from the crease.
  atmosphere_and_mood: Uncanny, elegant and organic, like something grown rather than drawn.
  rendering_and_quality: Authentic dragged strand marks with minimal added strokes, never a clean digital mirror.
  creative_brief: "Pulled-string ink: an ink-soaked string laid between folded paper and pulled out, leaving mirrored feathery trails that are then read as the subject. Carry it through mirrored strand trails, center fold crease, feathered drags, minimal added detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mirrored strand trails; center fold crease; feathered drags; minimal added detail
