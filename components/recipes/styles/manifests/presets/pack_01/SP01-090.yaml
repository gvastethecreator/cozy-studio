visualDna:
  aesthetic: 'Dappled canopy light: sun filtered through leaves scattering bright coin-shaped patches across the subject and ground.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Warm sunlit patches with cool green-tinted shade between them.
  lighting_and_shadow: Hard sun broken by foliage into many small soft-edged spots; the subject moves between light and shade.
  texture_and_material: Leaf shadows patterning skin, fabric and stone; glowing translucent leaves overhead.
  camera_and_composition: Keep requested framing; the dapple pattern must fall across the main subject.
  atmosphere_and_mood: Peaceful and summery, a slow flicker of warm light and cool shade.
  rendering_and_quality: Natural contrast with bright spots held, not clipped.
  creative_brief: "Dappled canopy light: sun filtered through leaves scattering bright coin-shaped patches across the subject and ground. Carry it through leaf-filtered sun spots, green shade, dapple on subject, translucent leaves, summer calm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
