visualDna:
  aesthetic: 'Film storyboard page: rough pencil and grey-marker panels drawn for shot communication, with camera arrows and motion arrows.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a storyboard page of four to six panels in reading order that break the action into shots, and that layout replaces the requested framing.
  color_and_tone: Greyscale graphite and two or three cool grey marker tones, with one red pencil reserved for movement and camera arrows.
  lighting_and_shadow: Just enough value to separate foreground, subject and background in each panel, with bold shadow shapes for drama.
  texture_and_material: Fast pencil contours, quick marker fills, loose hatching, and panels ruled with a slightly wobbly marker border.
  camera_and_composition: Four to six framed panels with varied shot sizes (wide, medium, insert close-up) and arrows for pans, pushes and subject motion.
  atmosphere_and_mood: Kinetic and clear, a sequence you can already hear.
  rendering_and_quality: Quick and legible drawing with simplified figures, no rendered finish, blank margins instead of written shot notes.
  key_features: four to six ruled panels; varied shot sizes; red pencil motion arrows; grey marker values; blank note margins
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Storyboard Sketch as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
