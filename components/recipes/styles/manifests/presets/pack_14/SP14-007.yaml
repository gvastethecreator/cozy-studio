    roles over disciplined dark values plus infiltration-weighted accent roles over disciplined dark
    values together with velvet black, sealing-wax red, old ivory, tarnished brass, moonsteel blue,
    rain gloss, and restrained poisonous glow; values stay separated, accents feel intentional, and
    the dark palette supports the requested content rather than swallowing it.
