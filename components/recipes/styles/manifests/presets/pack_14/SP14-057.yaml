    Keep the user's prompt subject, action, and context intact while reshaping identity through
    heavy rooted silhouettes and ancient branching mass, constellation-like emphasis and small
    decisive contour marks plus council-weighted mass and decision-bearing contour; forms should
    inherit silhouette pressure, emblem logic, ritual posture, edge weight, and motif placement
    instead of a mandatory actor or prop set.
