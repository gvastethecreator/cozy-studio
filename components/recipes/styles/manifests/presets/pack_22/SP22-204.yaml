visualDna:
  aesthetic: >-
    Use delicate contours, drawn shading and a clear hierarchy between the overall form and small
    surface marks. Keep the result a fine colored drawing rather than a photograph.
  subject_treatment: >-
    Preserve requested identity, proportions, pose, action and scene. Descriptive detail clarifies
    the existing subject without adding scientific, narrative or labeling content.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use clear local colors and controlled
    darks without forcing a limited plate palette.
  lighting_and_shadow: >-
    Follow the requested illumination and value pattern. Use delicate drawn shading to describe
    existing forms without flattening them or inventing a new light source.
  texture_and_material: >-
    Keep fine colored drawing marks selective and respect the requested materials. Avoid a literal
    printed plate surface, paper aging or texture that obscures the subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Do not convert the image into a
    framed plate or add labels, captions, callouts or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Descriptive clarity affects rendering only; it does not
    assign an educational purpose, era or new setting.
  rendering_and_quality: >-
    Make the main silhouette and large forms clear before adding restrained surface detail. Keep
    contours delicate and avoid photographic rendering or invented annotations.
avoidRules:
  - scientific names, labels, callouts or plate layout
  - photographic rendering or detail that obscures the main form
  - unrequested frame, lettering or layout
