visualDna:
  aesthetic: 'Color vector CRT: the subject drawn only as glowing beam lines on pure black, with no pixels and no filled surfaces.'
  subject_treatment: Keep the prompt subject, action and camera view; convert every form into its edges, including hidden edges seen through the transparent wireframe.
  color_and_tone: Three or four saturated line colors such as cyan, magenta, yellow and green on absolute black.
  lighting_and_shadow: No shading; brighter dots where the beam lingers at vertices and a soft phosphor bloom around every line.
  texture_and_material: Perfectly sharp vector lines with slight glow, short phosphor persistence trails and faint beam flicker.
  camera_and_composition: Keep the requested view; geometry simplified to a few dozen strong edges that read instantly.
  atmosphere_and_mood: Electric and austere, a whole world drawn in light.
  rendering_and_quality: Clean continuous lines with vertex hot spots; no raster jaggies and no fills.
  key_features: glowing beam lines; transparent wireframe; vertex hot spots; phosphor bloom; black void
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vector Arcade Wireframe as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
