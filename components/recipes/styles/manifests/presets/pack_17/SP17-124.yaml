visualDna:
  aesthetic: 'Dark painterly monotype: ink painted on a plate and printed once, with wiped-out lights, finger and rag marks, oxide red and black, and faded ghost second-pull areas.'
  subject_treatment: 'Any prompt subject becomes a spectral apparition: bold wiped shapes carry the form, edges dissolve into ghost-print haze, and the image feels pulled from memory.'
  color_and_tone: Black, oxide rust red, dirty gray ghost tones, and cream paper.
  lighting_and_shadow: Wiped-out light shapes against dark painted ink; a single area of pale luminous paper.
  texture_and_material: Brush and rag wipe marks, fingerprints, reticulated ink, and ghost-print softness.
  camera_and_composition: Dramatic close or looming composition with large dark mass and a single luminous shape.
  atmosphere_and_mood: Haunted, violent, feverish, and dark.
  rendering_and_quality: Painterly print quality with purposeful marks; dark but not muddy; subject readable.
  creative_brief: "Dark painterly monotype: ink painted on a plate and printed once, with wiped-out lights, finger and rag marks, oxide red and black, and faded ghost second-pull areas. Carry it through single-pull monotype, wiped-out lights, rag and finger marks, oxide red and black, ghost second-pull haze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: single-pull monotype; wiped-out lights; rag and finger marks; oxide red and black; ghost second-pull haze
