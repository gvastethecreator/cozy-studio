visualDna:
  aesthetic: 'Hero splash art: a painterly 3D-looking champion with exaggerated heroic proportions exploding out of a diagonal composition in ability-colored effects.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a diagonal heroic splash composition built around one champion-like focal figure, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: 'Saturated complementary palette: warm hero lighting against cool environment, each ability given one signature glow color.'
  lighting_and_shadow: Strong key from the ability effect, bright rim light, deep shaped shadows that sculpt big forms.
  texture_and_material: Soft painted gradients over sculpted forms, crisp hard-surface armor edges, swirling particle and energy trails.
  camera_and_composition: Low to mid heroic angle on a strong diagonal; big-medium-small shape hierarchy, background simplified into effects.
  atmosphere_and_mood: Triumphant and kinetic, a hero at the peak of power.
  rendering_and_quality: Polished painterly finish with clean silhouette; effects never hide the face or pose.
  key_features: diagonal splash; exaggerated heroic proportions; ability-color rim light; particle trails; sculpted painted forms
  creative_brief: "Hero splash art: a painterly 3D-looking champion with exaggerated heroic proportions exploding out of a diagonal composition in ability-colored effects. Carry it through diagonal splash, exaggerated heroic proportions, ability-color rim light, particle trails, sculpted painted forms. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
