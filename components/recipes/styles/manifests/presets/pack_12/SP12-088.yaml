visualDna:
  aesthetic: >-
    Represent a Blasphemous (2019)-style 2D gameplay frame: pixel-authored character and effects in
    a side-scrolling world whose platform path remains obvious even against monumental gothic
    scenery. Keep the impression of deliberate high-resolution pixel craft and severe dark massing,
    not a screenshot-shaped generic retro filter.
  subject_treatment: >-
    Keep the playable figure at a readable sprite scale against the route, ledges and any immediate
    threat. Preserve the requested character identity and action; use a distinctive silhouette and
    limited accent pixels, without substituting The Penitent One or a named enemy.
  color_and_tone: >-
    Anchor the scene in deep blue-black and charcoal stone, with cold slate or pale distant
    architecture and selective carmine, ember-orange or old-gold action cues. Maintain enough
    contrast between foreground route, player, threat and far background for play to read; do not
    force every location into one fixed palette.
  lighting_and_shadow: >-
    Use pixel-edged pools of warm effect light or cool ambient distance against dark foreground
    masses. Keep platform edges, feet and hazards crisp and visible; do not add soft 3D bloom or
    indistinct fog over the route.
  texture_and_material: >-
    Render platforms, masonry, cloth and effects as 2019-era clusters with coherent relative pixel
    scale. Preserve the hand-authored edges and occasional ornamental detail while allowing quieter
    spans of solid dark value; avoid painted brush texture, realistic 3D surface response and fake
    scanlines.
  camera_and_composition: >-
    Lock to a strict side-scrolling gameplay plane with a horizontal route, visible footing and a
    gap, obstacle or enemy ahead. A portrait card may crop to one compact section of the longer
    world, but must not tilt the camera or remove the lateral movement read. Keep enough route to
    judge the next action.
  atmosphere_and_mood: >-
    Capture a playable beat of dangerous traversal or combat through an oppressive gothic layer and
    sharp effects. Keep the scene active and navigable; a shrine, boss, gore or religious event
    appears only when the prompt calls for it.
  rendering_and_quality: >-
    Use crisp 2D sprite and tile rendering consistent with the 2019 release, with layered scenery
    and gameplay-sized silhouettes. UI may be included when requested or when the reference calls
    for it; if absent, do not fabricate meters, labels or icons.
avoidRules:
  - unrequested use of The Penitent One, named bosses, exact room layouts or promotional key art
  - changing the side-scroll plane or inventing an alternate camera
  - unrequested gore, named religious props, copied meters or fabricated interface text
  - filtering non-pixel subjects with uniform scanlines or blur
