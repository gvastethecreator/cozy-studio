visualDna:
  aesthetic: Distressed utilitywear with patched layers, field-repair seams and practical bulk; damage is carried by the garments rather than the wearer or setting.
  subject_treatment: Rebuild existing clothes with worn hems, reinforced patches, wrapped cuffs and layered denim or flannel. Preserve the person's face, anatomy, pose and role; show no wounds or zombie transformation.
  color_and_tone: Use muted, worn cloth values with a small emergency-orange accent only when it suits the prompt; keep the original palette and scene intact.
  lighting_and_shadow: Respect the requested location and light. Reveal fabric wear with soft contrast; do not create overcast gloom, dust haze or emergency lighting.
  texture_and_material: Use abraded denim, cotton, flannel, leather and cloth or tape patches. Show fraying and repair with no blood, gore or bodily damage.
  camera_and_composition: Keep the requested crop, viewpoint and pose. Make patched seams and protective layering legible without adding gear outside the frame.
  atmosphere_and_mood: Communicate improvised resilience through repairs and layered construction, without declaring an outbreak, survivor role or danger.
  rendering_and_quality: Vary scuffs, seams and patch edges with control; distinguish fabric wear from stains and keep the original subject readable.
  key_features: Patched denim and flannel; taped repair seams; wrapped cuffs; layered protective bulk.
  creative_brief: 'Turn the requested clothing into repaired utilitywear with patched fabric, taped seams and wrapped cuffs. Preserve wearer, identity, anatomy, pose, role, scene and framing; add no wounds, weapons, zombies or outbreak setting. Use it as a reusable look on any subject.'
