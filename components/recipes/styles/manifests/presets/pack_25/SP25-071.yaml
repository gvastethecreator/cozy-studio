visualDna:
  aesthetic: 'Monospace Archive Interface: monospaced text, index codes and constant column widths build a calm, trustworthy technical library.'
  subject_treatment: Organize the prompt's records in monospaced text and index columns of stable width, keeping every requested code, name and date exact.
  color_and_tone: Neutrals plus one navigation accent, codes set apart from titles by value and weight.
  lighting_and_shadow: Crisp flat text with a clean screen and sharp characters.
  texture_and_material: Sober surfaces and discreet separators on a clean, quiet ground.
  camera_and_composition: Columns of predictable width with explicit truncation only where allowed.
  atmosphere_and_mood: A reliable technical archive, orderly and quietly confident.
  rendering_and_quality: Codes, dates and long names keep their reading and alignment.
  creative_brief: "Monospace Archive Interface: monospaced text, index codes and constant column widths build a calm, trustworthy technical library. Carry it through monospaced columns, index codes, stable widths, one accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: monospaced columns; index codes; stable widths; one accent
