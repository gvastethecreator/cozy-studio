visualDna:
  aesthetic: 'Biopunk: living technology grown from flesh, veins and tissue in wet labs and organic cities.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: fused with grown organic machinery: veins, tendons, membranes, growth vats and pulsing tubes."
  color_and_tone: Flesh pinks, bile yellow, sick green and dark red.
  lighting_and_shadow: Wet lab light and bioluminescent glow, expressed through the style rather than photographic lighting.
  texture_and_material: Wet skin, membrane, cartilage and glass vats, visible at card size as the signature of the style.
  camera_and_composition: Close, claustrophobic framing, arranged so the subject still reads at card size.
  atmosphere_and_mood: Unsettling, visceral, strange and feverish, driven by the construction, color and rhythm.
  rendering_and_quality: Detailed painterly render with wet surfaces, with clean, deliberate marks and no accidental noise.
  key_features: grown machinery; veins; membranes; vats; bioluminescence
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Biopunk as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
