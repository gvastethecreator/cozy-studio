visualDna:
  aesthetic: 'Romanesque hieratic panel: rigid frontal figures with patterned drapery, bold banded backgrounds and stylized flattened space like twelfth-century painted books and walls.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; stylize bodies into stiff patterned forms with drapery folds drawn as nested curves.
  color_and_tone: Strong red, ochre, deep blue and green in banded backgrounds.
  lighting_and_shadow: Flat patterned shading with parallel fold lines instead of real light.
  texture_and_material: Matte pigment, heavy outlines and nested fold patterns.
  camera_and_composition: Frontal symmetric figures on horizontal color bands, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with stern timeless power.
  rendering_and_quality: Bold stylized clarity with consistent patterned folds, kept consistent across the whole image.
  creative_brief: "Romanesque hieratic panel: rigid frontal figures with patterned drapery, bold banded backgrounds and stylized flattened space like twelfth-century painted books and walls. Carry it through banded backgrounds, nested drapery folds, frontal figures, heavy outlines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: banded backgrounds; nested drapery folds; frontal figures; heavy outlines
