visualDna:
  aesthetic: 'Long fluid contours and low-frequency color transitions give the image a light drifting surface while forms remain as still or active as requested.'
  subject_treatment: 'Keep the original pose, proportions, action, and count; soften line cadence and tonal edges without changing posture or direction.'
  color_and_tone: 'Use gentle neighboring hues and low contrast where allowed; preserve strong or saturated colors explicitly requested.'
  lighting_and_shadow: 'Use broad soft transitions while maintaining the stated light direction and enough shadow structure to describe form.'
  texture_and_material: 'Keep surfaces smooth with thin brush trails along existing edges; do not imply movement that is absent from the prompt.'
  camera_and_composition: "Preserve crop, viewpoint, scale, spacing, and count; maintain the input's balance without forcing open space or a paused composition."
  atmosphere_and_mood: "Follow the requested emotional intensity; softness does not alter the scene's energy."
  rendering_and_quality: 'Keep essential boundaries crisp beneath gentle transitions; avoid a uniform blur or low-detail wash.'
  key_features: 'Long fluid contours; neighboring color shifts; broad soft transitions; sparse edge trails; stable form boundaries.'
  creative_brief: "Apply gentle contour flow and tonal drift without changing pose or motion. Keep subject, action, count, camera, and mood as requested. Use it as a reusable look on any subject."
