visualDna:
  aesthetic: 'Groomed fur and hair: the target covered in simulated strands with clumping, flyaways and soft light passing through the tips.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Natural or dyed fur color, lighter translucent tips, darker dense roots.
  lighting_and_shadow: Rim light glowing through strand tips, soft self-shadowing inside the coat.
  texture_and_material: Clumped strands, visible parting lines, stray flyaways and a clear wind-combed direction.
  camera_and_composition: Keep the requested framing; a silhouette against light shows the fuzz.
  atmosphere_and_mood: Soft and huggable, warmth you can almost feel.
  rendering_and_quality: Individual strand rendering with depth; not a painted fur texture.
  key_features: simulated strands with clumping; glowing rim through tips; flyaways; self-shadowing; wind direction
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fur & Hair as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the surroundings
  - changing the camera
  - converting every object in the scene
  - readable text
  - logo
  - bald
  - smooth
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - wrong material
  - pasted stock texture
  - flat color fill
  - shaderless surface
  - text
  - readable labels
  - UI overlay
  - franchise likeness
