visualDna:
  aesthetic: 'Translucent Work Layers: an interface modifier that separates stacked panels with soft transparency and background blur while foreground content stays sharp.'
  subject_treatment: Change only the optical separation between the prompt's interface layers with transparency and blur, keeping content, layout and every label unchanged.
  color_and_tone: Source colors kept, with an opaque enough backing behind critical text.
  lighting_and_shadow: Depth separated by blur alone, calm and even across layers.
  texture_and_material: Discreet translucent surfaces with readable edges, closer to frosted film than glossy glass.
  camera_and_composition: Positions, sizes and stacking order of the input kept exactly.
  atmosphere_and_mood: Calm depth with visible context, never competing with reading.
  rendering_and_quality: Foreground text and controls stay crisp over complex backgrounds.
  creative_brief: "Translucent Work Layers: an interface modifier that separates stacked panels with soft transparency and background blur while foreground content stays sharp. Carry it through frosted layers, background blur, sharp foreground, unchanged layout. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: frosted layers; background blur; sharp foreground; unchanged layout
