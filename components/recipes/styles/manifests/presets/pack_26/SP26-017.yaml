  aesthetic: 'Keita Amemiya creature and armor design look: ornate organic armor, baroque demon knights, sculptural textures and dark tokusatsu elegance.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters as ornate armored beings with organic sculptural textures and baroque silhouettes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Dark metal, bone, gold and deep red, true to the Keita Amemiya palette.
  lighting_and_shadow: Dramatic sculptural lighting, lit the way Keita Amemiya lights its scenes.
  texture_and_material: Ornate sculpted armor detail, with the surface finish of Keita Amemiya.
  camera_and_composition: Full-body heroic design paintings, framed the way Keita Amemiya composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with dark ornate menace.
  rendering_and_quality: Ornate armor design illustration, in the recognizable hand of Keita Amemiya.
  creative_brief: "Keita Amemiya creature and armor design look: ornate organic armor, baroque demon knights, sculptural textures and dark tokusatsu elegance. Carry it through Amemiya organic armor, baroque demons, sculptural detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
