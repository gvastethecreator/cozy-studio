visualDna:
  aesthetic: >-
    Velvet-edged intaglio drawing uses fine directional lines and softly accumulated shadow, with
    a slightly diffused edge that stays distinct from sharp burin engraving.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let softness follow the line
    marks without blurring the subject or changing its features.
  color_and_tone: >-
    Keep the requested palette and value relationships. Use gentle tonal density with localized darks
    rather than imposing muted colors or monochrome.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Build soft shadow density along existing forms
    while retaining clean highlights and original light placement.
  texture_and_material: >-
    Suggest a velvety ink edge through restrained, directional softness. Preserve material distinction
    and avoid global blur, wash or unrequested surface aging.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. A softer line does not add a page,
    border, lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Intaglio line softness changes the mark, not the depicted
    scene.
  rendering_and_quality: >-
    Establish silhouette and large values first, then layer fine lines with gentle density changes.
    Keep edges soft but controlled, not blurred.
avoidRules:
  - global blur or watercolor-like wash
  - forced muted palette or unrequested surface aging
  - unrequested page, border, lettering, or period motifs
