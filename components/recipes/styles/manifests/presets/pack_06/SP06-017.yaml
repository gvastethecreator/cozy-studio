visualDna:
  aesthetic: 'Expressive charcoal drawing: willow vine charcoal swept in broad gestures, pushed into velvety blacks with compressed charcoal and wiped or erased back to light.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Deep matte velvet black with no sheen, smoky greys rubbed with the side of the hand, bright lights pulled out with a kneaded eraser.
  lighting_and_shadow: Big dramatic light and shadow masses; shadows fused into one dark shape, light carved out subtractively.
  texture_and_material: Rough laid paper with charcoal dust caught in the ridges, finger smudges, broken dragged strokes and fallen black powder.
  camera_and_composition: Keep the requested framing; gestural construction lines and corrections stay visible around the main forms.
  atmosphere_and_mood: Raw and physical, energy caught in fast sweeping gestures.
  rendering_and_quality: Soft lost edges, smeared tones and eraser lifts next to a few hard compressed accents; no graphite shine, no clean line work.
  key_features: velvet matte blacks; smudged smoky greys; kneaded-eraser lifted lights; visible gesture lines; charcoal dust on laid paper
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Charcoal (Expressive) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
