visualDna:
  aesthetic: >-
    Use faceted contour shading, internal refraction and narrow prismatic edge splits as a cool
    refractive rendering; do not freeze or crystallize the subject.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: favor an icy blue range with
    small spectral accents while retaining colors necessary to identify the subject.
  lighting_and_shadow: >-
    Use transmitted highlights and restrained refractive bloom; obey the prompt's light source and
    keep shadow detail.
  texture_and_material: >-
    Render crisp facets and fine frost-like branching as surface marks, not physical ice replacing
    the material.
  camera_and_composition: >-
    Facet the existing planes without imposing hexagonal symmetry or changing camera and silhouette.
  atmosphere_and_mood: >-
    Cool clarity is the visual treatment; preserve warmth, darkness or texture requested by the
    prompt.
  rendering_and_quality: >-
    Apply refraction as a drawing effect while preserving material, temperature and identity; add no
    ice, snow or frozen setting. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Faceted shading; internal refraction; icy blue bias; restrained prism edges; fine frost-like
    surface marks.
  creative_brief: >-
    Apply this visual treatment to the requested content: Faceted shading; internal refraction; icy
    blue bias; restrained prism edges; fine frost-like surface marks. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - refraction bloom obscuring facet boundaries
  - frost marks replacing source material cues
  - facets changing source geometry
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-115.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
    unrequested default-image characters, costume details, props or setting, unrequested
