visualDna:
  aesthetic: >-
    Cardboard treats fabrication as visible style language: start from Shipping box, Paper pulp, and
    Creased, then turn manufacturing process, tooling marks, seams, tolerances, and industrial
    material behavior into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Corrugation lines: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Kraft brown as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Cardboard without hiding the prompt subject.
  texture_and_material: >-
    Render Paper pulp through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Creased as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Trash, storage by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Cheap, disposable material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Shipping box; Corrugation lines; Paper pulp; Matte; Creased
  creative_brief: >-
    Route any subject through Cardboard as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Capture the humble architecture of
    corrugated cardboard where a hidden fluted layer creates ribs of structure beneath a kraft-paper
    skin of warm brown, edges softened by handling and corners creased with use. The surface should
    feel dry and fibrous, a material whose very appearance suggests disposability rendered
    permanent. Render the poetics of the temporary, the shipping box as inadvertent portrait. Use
    Cardboard as portable surface/render behavior over any input: map its texture, light response,
    edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a literal
    material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
