  lighting_and_shadow: Soft, bright, slightly dreamy light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Faux fur, vinyl, lace, spikes, plastic charms and glitter.
  camera_and_composition: Playful full figure with cute-creepy props, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Cute, spooky, ironic and whimsical, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Soft, clean, pastel finish, with believable fabric weight, seams and fit detail.
  key_features: goth silhouettes in pastels; platform creepers; spiked choker; bat and skull charms; pastel hair
  creative_brief: "Pastel goth: creepy-cute fusion of goth silhouettes in candy pastels — platform shoes, spiked chokers, bat and skull motifs in lilac and mint. Carry it through goth silhouettes in pastels, platform creepers, spiked choker, bat and skull charms, pastel hair. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
