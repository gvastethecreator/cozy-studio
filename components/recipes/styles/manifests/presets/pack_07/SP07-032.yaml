visualDna:
  aesthetic: 'Metropolitan transit patina: the worn public skin of an old underground railway, with bevelled glazed tile, riveted steel columns, tactile safety edges and decades of grime in every joint.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Cream and white tile yellowed by age, one faded colour band as abstract wayfinding, safety yellow, green-grey painted steel, grime darkening the grout; flat fluorescent cast.
  lighting_and_shadow: Rows of fluorescent tubes giving flat greenish light, dim pools between fixtures, hard shadows under beams, deeper darkness toward tunnel mouths.
  texture_and_material: Bevelled subway tile with chipped corners, riveted I-beam columns layered with paint, tactile dimpled platform edge, worn terrazzo, rust weeping from bolts.
  camera_and_composition: Keep the requested view; favour oblique or side views across tiled walls and columns rather than a centred vanishing corridor.
  atmosphere_and_mood: Tired, public and nocturnal, the city worn smooth by millions of passing hands.
  rendering_and_quality: Low-light documentary photograph with specific grime and chips, abstract colour bands only, no readable maps or signs.
  key_features: chipped bevelled subway tile; riveted painted steel columns; tactile yellow safety edge; fluorescent greenish light; grime-dark grout
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Metropolitan Transit Patina as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
