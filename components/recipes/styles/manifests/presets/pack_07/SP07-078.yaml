visualDna:
  aesthetic: >-
    Cybernetic Hive Infrastructure acts as a transferable architecture/interior router: cube-shell
    alcoves, dense conduit bundles, graphite panels, phosphor-green glow, recursive service grids;
    fuse it with megastructure and impossible-space grammar with macro scale, recursive surfaces,
    habitat logic, optical paradox, and spatial contradiction; route spatial grammar, material
    behavior, scale, ornament, and light over prompt X without requiring the default sample anchor,
    fixed spatial set, landscape setup, or object sample.
  subject_treatment: >-
    Preserve prompt subject, action, and context while translating any requested subject through
    civilization-scale shell logic, recursive modules, curved habitat bands, monolithic severity,
    non-euclidean transitions, and compact utility systems; treat cube-shell alcoves, dense conduit
    bundles, graphite panels, phosphor-green glow, recursive service grids as massing, edge,
    surface, joinery, threshold, or ornament behavior rather than a mandatory building scene.
  color_and_tone: >-
    Map color through near-black structure, solar gold, technical beige, copper-brass, cyan or blue
    glow, graphite ribs, and controlled atmospheric haze; let source cues such as cube-shell
    alcoves, dense conduit bundles, graphite panels, phosphor-green glow, recursive service grids
    decide accent hierarchy, material temperature, and value separation while staying attached to
    the requested content.
  lighting_and_shadow: >-
    Use rim light at scale, utility panel glow, star or solar emission, soft beacon light, paradox
    shadow, and depth-defining atmospheric falloff; make light reveal joints, relief, material
    depth, scale, and atmosphere from cube-shell alcoves, dense conduit bundles, graphite panels,
    phosphor-green glow, recursive service grids without replacing prompt X with a stock
    architectural render.
  texture_and_material: >-
    Render technical panels, copper-brass surfaces, graphite fins, matte black planes, circular
    hatches, retention straps, tactile glass, and braided cabling; prioritize the tactile signals in
    cube-shell alcoves, dense conduit bundles, graphite panels, phosphor-green glow, recursive
    service grids, with believable surface response, denoised grain, coherent wear, and no generic
    wallpaper texture.
  camera_and_composition: >-
    Frame through macro-detail framing, looped circulation, horizon wrap, radial collector geometry,
    repeated modules, impossible thresholds, and severe scale cues; convert cube-shell alcoves,
    dense conduit bundles, graphite panels, phosphor-green glow, recursive service grids into
    reusable perspective, crop, depth, section, modular rhythm, and negative-space rules instead of
    one fixed style sample layout.
  atmosphere_and_mood: >-
    Carry mood through awe, utility, paradox, spatial uncanniness, engineered civilization, or
    symbolic restraint without forcing a cockpit/control-room scene; the preset can support adult,
    strange, sensual, severe, playful, ominous, quiet, or monumental prompts when prompt X asks for
    them while keeping the architectural identity readable.
  rendering_and_quality: >-
    Finish with clean impossible-space finish with coherent recursion, scale readability, no named
    franchise interior, no central-console dependency; keep clean denoise, legible construction,
    stable object or anatomy structure when applicable, no watermark, no fake readable text, no
    logo, no camera prop, and no prompt-literal card copy.
  key_features: >-
    cube-shell alcoves, dense conduit bundles, graphite panels, phosphor-green glow, recursive
    service grids; civilization-scale shell logic, recursive modules, curved habitat bands,
    monolithic severity, non-euclidean transitions, and compact utility systems; technical panels,
    copper-brass surfaces, graphite fins, matte black planes, circular hatches, retention straps,
    tactile glass, and braided cabling; macro-detail framing, looped circulation, horizon wrap,
    radial collector geometry, repeated modules, impossible thresholds, and severe scale cues
  creative_brief: >-
    Apply Cybernetic Hive Infrastructure after prompt X as a transferable architecture/interior
    style layer: prompt X supplies subject, action, setting, tone, and intensity, while this preset
    supplies cube-shell alcoves, dense conduit bundles, graphite panels, phosphor-green glow,
