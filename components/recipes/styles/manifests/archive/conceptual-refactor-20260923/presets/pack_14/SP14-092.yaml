visualDna:
  aesthetic: >-
    Equinox Balance Axis acts as a transferable mythic-noir router: equinox translated into dark
    symbolic behavior, balance translated into dark symbolic behavior plus axis translated into dark
    symbolic behavior fused with cosmological omen design with orbital law, astral records, meridian
    axes, eclipse timing, and catastrophic elegance; it carries symbol, omen, ritual authority, and
    mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    equinox shaping silhouette rhythm, contour pressure, and symbolic edge control, balance shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus axis shaping silhouette
    rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette pressure,
    emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or
    prop set.
  color_and_tone: >-
    Map color through equinox-weighted accent roles over disciplined dark values, balance-weighted
    accent roles over disciplined dark values plus axis-weighted accent roles over disciplined dark
    values together with void black, star salt, eclipse gold, lunar blue, nebula bruise, comet
    white, auroral green, and severe red warning notes; values stay separated, accents feel
    intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use balanced dawn-and-dusk illumination, balance-weighted rim behavior, occult glow, and charged
    shadow plus axis-weighted rim behavior, occult glow, and charged shadow with planetary rim
    light, occult backlight, starfall sparks, auroral veils, lunar frost, and signal-like bell
    illumination; shadows must carry omen weight, rims should clarify form, and glow should behave
    as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render equinox-inflected patina, residue, grain, and tactile edge behavior, balance-inflected
    patina, residue, grain, and tactile edge behavior plus axis-inflected patina, residue, grain,
    and tactile edge behavior alongside astrolabe glass, salt crust, meteor dust, black paper, brass
    rings, celestial chalk, basin water, and scorched archive grain; surface scale, patina, residue,
    gloss, grain, and carved or sealed edges must remain coherent across characters, objects,
    scenes, and abstractions.
  camera_and_composition: >-
    Frame with equalized halves and hinge-like balance plus axis symmetry, counterweight spacing,
    and measured tension plus orbital spirals, meridian cuts, radial verdicts, balance axes, archive
