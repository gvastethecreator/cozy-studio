visualDna:
  aesthetic: 'Nested System Explainers: nested containers matching the real levels of a system, with named gates wherever links cross a boundary.'
  subject_treatment: Nest the prompt's system levels as containers that match its real hierarchy, links crossing only through named gates; keep every name exact.
  color_and_tone: Palette by depth in moderate contrast with one color for the selection.
  lighting_and_shadow: Flat levels separated by lines, margins and header bands.
  texture_and_material: Flat surfaces and borders growing thinner toward the detail.
  camera_and_composition: A header on every container, even inner margins and declared ports.
  atmosphere_and_mood: Progressive discovery from whole to detail with clear limits.
  rendering_and_quality: Crisp diagram with exact nesting and each node shown once.
  creative_brief: "Nested System Explainers: nested containers matching the real levels of a system, with named gates wherever links cross a boundary. Carry it through nested containers, named gates, header per level, exact hierarchy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: nested containers; named gates; header per level; exact hierarchy
