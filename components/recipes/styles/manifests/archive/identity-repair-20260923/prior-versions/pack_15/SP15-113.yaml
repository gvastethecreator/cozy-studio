visualDna:
  aesthetic: >-
    Build strong forms from chalky bone-white planes, tapered organic contours, and rhythmic dark
    tension-lines.
  subject_treatment: >-
    Preserve the requested subject and defining anatomy; use porous pale planes and restrained repeated
    accents without requiring horns, sails, or a skeleton.
  color_and_tone: >-
    Use bone white against soot, earth, or muted green, with a rawhide note and small cool highlight;
    preserve explicit palette requests.
  lighting_and_shadow: >-
    Separate pale planes with broad cool shadows and narrow storm-edged light; keep translucent layers
    distinct from flat white fill.
  texture_and_material: >-
    Combine dry limewashed grain with selective hide-like translucence and sparse fibrous marks; keep
    texture distinct from cracks or decay.
  camera_and_composition: >-
    Keep the requested crop; arrange tapered forms, tension-lines, and open gaps around its existing
    focal point.
  atmosphere_and_mood: >-
    Suggest austere, weathered force through pale-versus-dark contrast, repeated rhythm, and measured
    spacing.
  rendering_and_quality: >-
    Keep pale surfaces and linear marks distinct, with deliberate edges and sparse texture for thumbnail
    clarity.
avoidRules:
  - literal skeleton anatomy when not requested
  - horn-like extensions that alter the subject silhouette
  - uniform chalk texture across every surface
