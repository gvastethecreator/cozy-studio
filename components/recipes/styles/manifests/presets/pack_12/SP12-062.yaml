visualDna:
  aesthetic: 'In-game screenshot look informed by Yakuza 0 gameplay: third-person urban brawler/adventure capture with dense Japanese nightlife, street fights, karaoke warmth, and readable pedestrian scale. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Yakuza 0-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Yakuza 0-informed palette: neon pink, koi red, warm storefront yellow, black suit fabric,
    wet asphalt, and electric blue signage shapes. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through street neon, club lights, vending-machine glow, fight impact flashes,
    and rain reflections. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from urban pavement, suits, leather shoes, shopfronts without readable logos,
    bicycles, bottles, and crowded nightlife props. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person street camera with brawler spacing, alley depth, NPC crowd edges, and
    nightlife landmark density. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Yakuza 0-derived mood: melodramatic, adult, funny, dangerous, and neon-social; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: health/heat bars, minimap,
    money/combo cues, and small objective markers can appear as coherent urban action UI. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Yakuza 0 gameplay screenshots; third-person urban brawler/adventure capture with dense Japanese
    nightlife, street fights, karaoke warmth, and readable pedestrian scale; neon pink, koi red,
    warm storefront yellow, black suit fabric, wet asphalt, and electric blue signage shapes; street
    neon, club lights, vending-machine glow, fight impact flashes, and rain reflections; urban
    pavement, suits, leather shoes, shopfronts without readable logos, bicycles, bottles, and
    crowded nightlife props; third-person street camera with brawler spacing, alley depth, NPC crowd
    edges, and nightlife landmark density; melodramatic, adult, funny, dangerous, and neon-social;
    HUD guidance: health/heat bars, minimap, money/combo cues, and small objective markers can
    appear as coherent urban action UI
  creative_brief: "Yakuza Neon Koi District: in-game screenshot language informed by Yakuza 0, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
