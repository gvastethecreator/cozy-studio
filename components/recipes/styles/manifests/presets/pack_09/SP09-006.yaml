visualDna:
  aesthetic: 'Carrara marble: white marble with soft grey veining, polished or finely carved.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is carved from white Carrara marble with grey veins following its form.'
  color_and_tone: Warm white with soft grey veining, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft diffused light showing subsurface glow, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Fine crystalline marble with translucent edges and polished or chiselled finish.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Classical, serene, pure and timeless, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: white Carrara marble; grey veining; translucent glow; carved detail
  creative_brief: "Carrara marble: white marble with soft grey veining, polished or finely carved. Carry it through white Carrara marble, grey veining, translucent glow, carved detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
