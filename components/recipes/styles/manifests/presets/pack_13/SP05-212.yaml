visualDna:
  aesthetic: 'Evenly weighted fine outlines and immaculate flat planes are interrupted by one tiny alignment shift in an existing edge or repeated mark.'
  subject_treatment: 'Retain every prompted form, pose, expression, and count; jitter stays at a contour or color edge, never in anatomy or action.'
  color_and_tone: 'Keep relationships orderly and mostly restrained, with one limited accent where the prompt allows it.'
  lighting_and_shadow: 'Use even fill and compact crisp shadows; preserve supplied lighting without inventing another source.'
  texture_and_material: 'Favor clean polished fills; add fine grain only when an existing material calls for it.'
  camera_and_composition: 'Preserve crop, viewpoint, scale, spacing, and count; create tension through tiny internal misalignment, not a new layout.'
  atmosphere_and_mood: 'Keep the requested mood; a small visual stutter does not set the emotional reading.'
  rendering_and_quality: 'Maintain sharp boundaries, smooth fields, and one deliberate irregularity; avoid unprompted surface marks.'
  key_features: 'Even contour weight; immaculate color planes; crisp compact shadows; localized alignment shift; limited accent color.'
  creative_brief: 'Set precise, clean drawing against a single restrained edge irregularity. Keep subject, action, count, camera, and mood; add no new motif. Use it as a reusable look on any subject.'
