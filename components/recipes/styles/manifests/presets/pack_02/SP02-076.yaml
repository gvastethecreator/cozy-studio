    behavior, Halo, glowing outline, edge definition and portable lighting and atmosphere system
    built from light transport, exposure behavior, optical distortion, volumetric density,
    reflection, and camera response, then apply the media behavior to prompt X instead of recreating
    a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Treat subjects as believable filmed or broadcast subjects
    under Rim Lighting: casting, wardrobe, props, motion cues, and silhouette hierarchy follow 5.
    Lighting And Atmosphere cinematic and broadcast grammar without locking to one plot beat;
    preserve the requested subject while letting the named light, atmosphere, or optical effect
    transform silhouette, depth, value, and surface response, keeping the requested identity,
    silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with Dark with white edge, black core, silver perimeter, hair-light gold; use color
    as light temperature, spectral split, water attenuation, neon bounce, candle warmth, night
    conversion, prism dispersion, or atmospheric scattering, with deliberate value grouping, accent
    control, and process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Backlight, rim-only separation, edge-defining key; make the named light
    behavior visible through caustics, rim separation, bokeh, flare, strobe pulses, volumetric rays,
    split contrast, or softbox falloff, so exposure and shadow structure support the media process
    without overwriting the requested content.
  texture_and_material: >-
    Render Silhouette detail, edge texture, haloed perimeter; surface detail should reveal
    particles, lens bloom, refraction, mist, glow halos, exposure rolloff, liquid distortion, or
    optical streaks without hiding prompt detail, keeping artifact scale coherent and avoiding noisy
    filler texture.
  camera_and_composition: >-
    Structure the image through Camera language native to Rim Lighting: genre-aware framing, lens
    designed subjects, focal hierarchy, motion cue, and style-led vertical composition; compose
    around light direction, reflection planes, depth layers, exposure zones, silhouette edges, lens
    distortion, or atmospheric perspective without forcing a location, with frame rhythm, spacing,
    edge hierarchy, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood emblematic, mystery, defined presence, emerging from shadow; derive mood from
    illumination physics: intimacy, dread, wonder, glamour, sacred haze, underwater quiet, neon
    danger, or temporal flash energy, letting the media style alter interpretation without demanding
    a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Dramatic, separation, subject-pop, depth-carving, finished Rim Lighting media craft
    with clear process evidence and controlled detail; finish with believable exposure, clean
    denoise, readable subjects, and controlled optical artifacts rather than random glow or crushed
    darkness, clean denoised surfaces where appropriate, and enough process evidence to make the
    style recognizable.
  key_features: >-
    Edge glow, Rim Lighting light transport, optical artifacts, exposure discipline, atmosphere
