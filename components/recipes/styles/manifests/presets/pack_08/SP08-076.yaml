  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments made of thick translucent gel that sags, drips and traps bubbles.'
  color_and_tone: Translucent lime, magenta, amber or clear gel, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Backlight and rim light for translucency, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Thick glossy gel with drips, bubbles and stretched strands.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Strange, sensual, playful and alien, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: translucent gel garments; drips and strands; trapped bubbles; backlit glow
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Viscous Gel Couture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
