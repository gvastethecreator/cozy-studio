visualDna:
  aesthetic: 'Topographic Thread Bands: sinuous bands that keep their spacing like layers of flat cord, compressing and relaxing across the surface.'
  subject_treatment: Build a repeating surface of sinuous flat bands inspired by the prompt's subject, keeping spacing steady and entries matching exits at the edges.
  color_and_tone: A short sequential palette that separates each band from its neighbors.
  lighting_and_shadow: Optional soft side light, the path working just as well flat.
  texture_and_material: Longitudinal texture following each band and never crossing it.
  camera_and_composition: Wide curves across the tile with minimum radii and matching edges.
  atmosphere_and_mood: Slow sustained flow with calm compression and open expansions.
  rendering_and_quality: 'Clean repeat where bands never collide and keep a stable width.'
  creative_brief: "Topographic Thread Bands: sinuous bands that keep their spacing like layers of flat cord, compressing and relaxing across the surface. Carry it through sinuous flat bands, steady spacing, matching edges, slow flow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sinuous flat bands; steady spacing; matching edges; slow flow
