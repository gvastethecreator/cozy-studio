visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around eroded straight contours
    and fine powdery grain that make broad planes feel sun-faded without adding a sun or
    setting. For color and surface, respect prompt colors but lower their
    saturation toward warm concrete gray, dust, and muted ochre highlights. Mystery can
    come from softened detail and partially withheld edges without requiring an urban
    clue or danger
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through eroded straight contours and fine
    powdery grain that make broad planes feel sun-faded without adding a sun or setting;
    use detail selectively and keep the actual form easy to read. Add no unrequested
    subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; respect prompt colors but
    lower their saturation toward warm concrete gray, dust, and muted ochre highlights.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; broaden existing highlights
    into a soft bleached falloff while preserving the stated direction and time of
    light. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use dry mineral speckle and gently abraded edges
    only on compatible surfaces; do not turn unrelated materials into concrete. Keep
    texture subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; organize
    detail into broad quiet planes and a few exact edges within the existing camera and
    crop. Use the mark rhythm inside the supplied composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Mystery can come from softened detail and
    partially withheld edges without requiring an urban clue or danger. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and eroded straight contours and fine powdery
    grain that make broad planes feel sun-faded without adding a sun or setting; keep
    focal edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    eroded straight contours and fine powdery grain that make broad planes feel
    sun-faded without adding a sun or setting; respect prompt colors but lower their
    saturation toward warm concrete gray, dust, and muted ochre highlights; broaden
    existing highlights into a soft bleached falloff while preserving the stated
    direction and time of light; use dry mineral speckle and gently abraded edges only
    on compatible surfaces; do not turn unrelated materials into concrete; and organize
    detail into broad quiet planes and a few exact edges within the existing camera and
    crop. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use eroded straight contours and fine powdery
    grain that make broad planes feel sun-faded without adding a sun or setting, respect
    prompt colors but lower their saturation toward warm concrete gray, dust, and muted
    ochre highlights, broaden existing highlights into a soft bleached falloff while
    preserving the stated direction and time of light, and use dry mineral speckle and
    gently abraded edges only on compatible surfaces; do not turn unrelated materials
    into concrete; the prompt supplies all scene content. Do not add unrequested
    characters, objects, source-specific lore, readable symbols, or a default action.
