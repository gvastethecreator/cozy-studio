visualDna:
  aesthetic: 'Wrong-face family portraits: formal studio portraits painted with perfect poise, except that faces are subtly too smooth, too still or slightly misplaced.'
  subject_treatment: Render the prompt's subject as a formal posed portrait, keeping clothing and pose precise while the face is calm but subtly wrong.
  color_and_tone: Muted studio browns, sepia and dusty rose with porcelain-pale skin tones.
  lighting_and_shadow: Soft old studio light from one side, smooth gradients and a dark mottled backdrop.
  texture_and_material: Painted canvas backdrop, lace collars, velvet chairs and slightly glossy varnish.
  camera_and_composition: Centered frontal posed portrait with figures arranged stiffly in rows.
  atmosphere_and_mood: Polite, formal and deeply unnerving, a family that is not quite right.
  rendering_and_quality: Careful academic portrait painting with smooth finish and subtle distortions.
  creative_brief: "Wrong-face family portraits: formal studio portraits painted with perfect poise, except that faces are subtly too smooth, too still or slightly misplaced. Carry it through formal posed portraits, subtly wrong faces, studio backdrop, stiff symmetry. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: formal posed portraits; subtly wrong faces; studio backdrop; stiff symmetry
