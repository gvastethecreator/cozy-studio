visualDna:
  aesthetic: 'Art Nouveau decorative lithograph: a figure framed by a circular halo, flowing whiplash contours and botanical arabesques that merge into an ornamental border.'
  subject_treatment: Keep the prompt subject and action; this preset owns the halo-and-arabesque decorative panel with its integrated floral border, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Peach, sage, ivory and muted gold, soft flat tints with dark brown contour.
  lighting_and_shadow: Flat luminous light, halo glowing behind the head, minimal soft modeling on faces and hands.
  texture_and_material: Stone-lithograph grain, flat ink tints, mosaic-like patterning in the halo and garments.
  camera_and_composition: Tall vertical panel, figure centered before a circular nimbus, hair and plants curling into the frame.
  atmosphere_and_mood: Romantic, reverent and ornamental, a quiet devotion to nature.
  rendering_and_quality: Confident brown contour of varied weight, pattern-rich but orderly; no straight modernist geometry.
  key_features: circular halo behind the figure; whiplash curves; botanical arabesque border; peach sage and gold; lithograph grain
  creative_brief: "Art Nouveau decorative lithograph: a figure framed by a circular halo, flowing whiplash contours and botanical arabesques that merge into an ornamental border. Carry it through circular halo behind the figure, whiplash curves, botanical arabesque border, peach sage and gold, lithograph grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
