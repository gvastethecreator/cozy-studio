visualDna:
  aesthetic: 'Layered Paper Controls: a few overlapping flat sheets with discreet edges show grouping and editing state like tidy index cards.'
  subject_treatment: Stack the prompt's screen as a few overlapping planes with minimal edges that show groups and edit state; keep requested labels exact.
  color_and_tone: Close values with one selection accent and well-contrasted text.
  lighting_and_shadow: A short even shadow only on planes that truly overlap.
  texture_and_material: Smooth graphic paper-like surfaces with crisp edges and no visible fibre.
  camera_and_composition: Few stack levels, visible tabs and content aligned across layers.
  atmosphere_and_mood: Editorial tactility and order, like handled cards on a clean desk.
  rendering_and_quality: At most one depth level per function, text always sharp and frontal.
  creative_brief: "Layered Paper Controls: a few overlapping flat sheets with discreet edges show grouping and editing state like tidy index cards. Carry it through overlapping sheets, visible tabs, short shadows, sharp text. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overlapping sheets; visible tabs; short shadows; sharp text
