visualDna:
  aesthetic: 'A two-tempo ink drawing keeps steady thin contours at rest and switches to sharp wedges or localized elastic arcs at action peaks already present in the request.'
  subject_treatment: 'Keep identity, anatomy, and silhouette; bend only existing contour segments when the requested gesture supports it, never duplicating or resizing the subject.'
  color_and_tone: 'Use a quiet middle-value base with brief high-chroma accents on existing forms; the prompt controls the palette and its emotional meaning.'
  lighting_and_shadow: 'Set flat cel planes against crisp hard shadow cuts; keep contrast local and invent no additional light source.'
  texture_and_material: 'Keep fills smooth and edges clean; add a few short gesture marks only along movement the prompt already describes.'
  camera_and_composition: 'Lock crop, viewpoint, scale, spacing, and count; create impact through local contrast rather than a new angle, insert, or zoom.'
  atmosphere_and_mood: 'Preserve the source mood; sharpen a requested comic beat through line timing without making neutral action comedic.'
  rendering_and_quality: 'Keep resting forms stable and readable; confine elastic distortion to small contour accents and return immediately to the original shape.'
  key_features: 'Steady resting line against sharp gesture marks; localized elastic arcs; short action accents; flat shadows with abrupt value contrast.'
  creative_brief: 'Use still contours and quick elastic marks to distinguish existing action peaks. Preserve subject, action, count, camera, and mood; add no punchline prop, duplicate, or forced expression. Use it as a reusable look on any subject.'
