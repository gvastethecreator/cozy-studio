visualDna:
  aesthetic: 'Figure-Ground Reversal Patterns: shapes and the spaces between them are equally designed, so either one can be read as the figure.'
  subject_treatment: Build a repeating surface from the prompt's subject where the masses and the gaps are equally complex and share every edge, readable either way.
  color_and_tone: Two balanced values that keep contrast when inverted.
  lighting_and_shadow: Flat surface with figure and ground equally crisp.
  texture_and_material: One family of edges and minimal interior detail.
  camera_and_composition: Alternating reading zones with both structures continuous at the edges.
  atmosphere_and_mood: A calm perceptual flicker between two equally strong organizations.
  rendering_and_quality: Clean repeat with shared contours and stable reading when reduced.
  creative_brief: "Figure-Ground Reversal Patterns: shapes and the spaces between them are equally designed, so either one can be read as the figure. Carry it through equal figure and ground, shared edges, both polarities, perceptual flip. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal figure and ground; shared edges; both polarities; perceptual flip
