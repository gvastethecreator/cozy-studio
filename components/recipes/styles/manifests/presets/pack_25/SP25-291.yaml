visualDna:
  aesthetic: 'Quiet Museum Labels: a sober typographic hierarchy of title, identification and context text, set close to the object without competing with it.'
  subject_treatment: Set the prompt's label as a calm hierarchy of title, identification and context near its object, every supplied word exact and nothing invented.
  color_and_tone: High reading contrast with a minimal accent for the index.
  lighting_and_shadow: The gallery light respected, with the label never re-lit.
  texture_and_material: A matte label support with crisp type and a minimal paper texture.
  camera_and_composition: Clear gap between label and object, a contained reading width.
  atmosphere_and_mood: Silent contextual attention that always lets the object lead the room.
  rendering_and_quality: Clean label with exact text and an unmistakable link to its object.
  creative_brief: "Quiet Museum Labels: a sober typographic hierarchy of title, identification and context text, set close to the object without competing with it. Carry it through sober hierarchy, title and context, beside the object, exact text. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sober hierarchy; title and context; beside the object; exact text
