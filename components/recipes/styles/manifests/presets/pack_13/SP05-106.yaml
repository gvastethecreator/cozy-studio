  aesthetic: 'Sunrise The Big O look (1999) by Keiichi Sato: art deco retro city, geometric architecture, noir gentlemen and giant retro robots.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Sato designs, noir suits and elegant retro dresses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Deco gold, black and muted sepia, true to the The Big O Sunrise palette.
  lighting_and_shadow: Noir city light, lit the way The Big O Sunrise lights its scenes.
  texture_and_material: Analog cel with geometric deco architecture, with the surface finish of The Big O Sunrise.
  camera_and_composition: Geometric noir compositions, framed the way The Big O Sunrise composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with noir art deco elegance.
  rendering_and_quality: Retro deco television frame, in the recognizable hand of The Big O Sunrise.
  key_features: The Big O art deco; geometric city; noir
  creative_brief: "Sunrise The Big O look (1999) by Keiichi Sato: art deco retro city, geometric architecture, noir gentlemen and giant retro robots. Carry it through The Big O art deco, geometric city, noir. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
