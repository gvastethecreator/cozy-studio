visualDna:
  aesthetic: >-
    Fine, disciplined contours and compact color fields carry the main forms, with small-scale
    geometric rhythm used only where ornament is explicitly allowed. This study is scoped to the
    cited thirteenth-century Armenian-Cilician manuscript reference associated with T'oros Roslin;
    it is not a universal Armenian or Cilician style label.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, action and details. Keep the main reading
    ahead of fine ornament, and use geometric detail only on existing surfaces that the user permits
    for ornament; do not add motifs or reshape forms.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Use compact color areas and measured
    contrast without imposing a fixed manuscript palette, gold accents or jewel colors.
  lighting_and_shadow: >-
    Preserve the requested lighting and shadows. Fine line and color organization do not imply gem
    highlights, candlelight or a new source of illumination.
  texture_and_material: >-
    Keep ornament within user-permitted areas and render it as a graphic detail system. Preserve the
    actual materials of depicted subjects; do not turn them into jewelry, gemstones or a manuscript
    page.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and arrangement. Do not add a folio, border, frame or
    illuminated-page layout.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. The regional reference identifies a specific Armenian-Cilician
    corpus and does not authorize religious imagery, historical characters or a sacred scene.
  rendering_and_quality: >-
    Keep the principal subject legible before adding fine detail. Use crisp lines and restrained
    geometric accents without micro-pattern noise, decorative clutter or unrequested surface coverage.
avoidRules:
  - unrequested Armenian lettering, crosses or religious symbols
  - unrequested motifs borrowed from other cultural traditions
  - ornament on surfaces the user has not permitted
  - unrequested folio border or illuminated-page layout
