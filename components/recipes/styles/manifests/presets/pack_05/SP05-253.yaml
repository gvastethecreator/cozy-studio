visualDna:
  aesthetic: Refined high-key anime cel with glass-green translucence and delicate veinlike linework, like a pressed-specimen plate under clear light.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Veinlike strokes echo existing contours only; never add plants, a laboratory or bookshelves.
  color_and_tone: Glass green, pale cream and muted gold in a high key where whites dominate.
  lighting_and_shadow: Soft high-key daylight with clean reflected highlights and no visible glow source.
  texture_and_material: Transparent layered washes, fine vein detail and tidy painted surfaces.
  camera_and_composition: Keep the requested view; orderly spacing with plenty of pale ground around the subject.
  atmosphere_and_mood: Serene, clean and composed, like cool air in the morning.
  rendering_and_quality: Thin crisp contours over transparent washes with minimal bloom and no clutter.
  key_features: glass-green translucence; veinlike linework; high-key cream ground; transparent washes; muted gold accents
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Glass-Green High-Key Herbarium Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
