visualDna:
  aesthetic: 'Traditional tattoo flash: bold black outlines that will hold, flat opaque fills and emblem-like motifs painted on a flash sheet.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Classic flash palette of red, yellow, green and black with skin-tone negative space on aged cream paper.
  lighting_and_shadow: Black whip-shading on one side of each form, flat color otherwise, no realistic light.
  texture_and_material: Heavy even outlines, watercolor-flat fills, slight paper aging and pinholes in the corners.
  camera_and_composition: Keep the requested subject as a centered emblem with a compact silhouette, framed by simple ornament.
  atmosphere_and_mood: Proud, sturdy and timeless, a motif meant to last a lifetime.
  rendering_and_quality: Clean flash painting with bold simplified shapes; banners left empty with no words.
  key_features: bold black outline; red yellow green black palette; whip shading; emblem silhouette; empty banners
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tattoo Flash (Traditional) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
