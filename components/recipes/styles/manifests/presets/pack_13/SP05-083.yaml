visualDna:
  aesthetic: 'Thin, even contour lines and flat low-contrast cel fields give forms a calm, economical finish; expression changes stay small and clearly drawn.'
  subject_treatment: 'Retain the requested design and pose; keep facial features restrained and proportionate, with no added reactions or assumed relationships.'
  color_and_tone: 'Choose a narrow, muted range with neighboring hues and gentle value steps; preserve explicit colors and avoid a fixed pastel scheme.'
  lighting_and_shadow: 'Use broad even illumination and only shallow shadow shapes; preserve harder shadows when the prompt calls for them.'
  texture_and_material: 'Keep surfaces smooth and detail sparse, with faint grain only where it does not obscure the original material.'
  camera_and_composition: 'Keep the exact requested framing and count; support readable spacing inside the layout the user supplies.'
  atmosphere_and_mood: 'Let the requested emotion set facial intensity and contrast; low-key rendering must not flatten a strong expression.'
  rendering_and_quality: 'Favor precise line closure, simple shadow grouping, and consistent edge weight; retain enough detail to identify every prompted form.'
  key_features: 'Uniform fine contours; low-contrast color blocks; shallow shadow shapes; restrained feature marks; relaxed detail density.'
  creative_brief: "Render with quiet line weight and narrow value steps, letting small feature changes carry expression. Preserve the prompted subject, action, count, camera, and mood. Use it as a reusable look on any subject."
