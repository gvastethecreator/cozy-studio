visualDna:
  aesthetic: 'Hard-vacuum anime lighting: one unfiltered point-source key, pitch-black shadows with zero fill, razor terminator lines, and thick clean outlines.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Cold white, steel and charcoal with pure black shadows and a small amber caution accent.
  lighting_and_shadow: 'Single harsh sun with no atmosphere: lit planes blaze white, turned planes drop straight to black, and nothing bounces.'
  texture_and_material: Tight seam marks, micro-scuffs and grit on lit faces only; shadows carry no detail at all.
  camera_and_composition: Keep the requested view; let large black shadow shapes cut the frame into sharp lit and unlit zones.
  atmosphere_and_mood: Disciplined endurance, silent and exacting, where one mistake is final.
  rendering_and_quality: Thick stable outlines, binary lit-or-black shading, razor terminator edges and minimal glow.
  key_features: single unfiltered point-source key; zero-fill pitch-black shadows; razor terminator line; cold white and steel palette; amber caution accent
  creative_brief: "Hard-vacuum anime lighting: one unfiltered point-source key, pitch-black shadows with zero fill, razor terminator lines, and thick clean outlines. Carry it through single unfiltered point-source key, zero-fill pitch-black shadows, razor terminator line, cold white and steel palette, amber caution accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
