  aesthetic: 'Hologrampunk: a world covered in cheap holographic foil and lenticular prints, with rainbow diffraction shifts, shimmering stickers and images that change as you move.'
  subject_treatment: Keep the prompt's subject and setting; render its surfaces as shimmering holographic foil and lenticular prints with rainbow shifts.
  color_and_tone: Rainbow diffraction over silver foil with shifting cyan, magenta and gold bands.
  lighting_and_shadow: Sharp point light creating rainbow flares and shifting bands on foil.
  texture_and_material: Holographic foil, lenticular ridges, diffraction patterns and glossy laminate.
  camera_and_composition: Close views of shimmering surfaces with images appearing to shift angle.
  atmosphere_and_mood: Dazzling, cheap and magical, a trick of light you want to keep.
  rendering_and_quality: Crisp iridescent rendering with diffraction rainbows and fine ridges.
  creative_brief: "Hologrampunk: a world covered in cheap holographic foil and lenticular prints, with rainbow diffraction shifts, shimmering stickers and images that change as you move. Carry it through rainbow diffraction, lenticular ridges, silver foil, shifting images. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
