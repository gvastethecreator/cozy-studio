visualDna:
  aesthetic: >-
    A measured digital anime treatment where precise edge separation and grouped
    shadows create a controlled image.
  subject_treatment: >-
    Retain the requested identity, pose and action. Clarify form with disciplined contours
    and selective edge light.
  color_and_tone: >-
    If color is open, use cool blue and white accents against restrained dark neutrals.
    Preserve explicit palette choices and keep values clearly separated.
  lighting_and_shadow: >-
    Pair broad, even illumination with a precise rim and compact shadow groups. Use
    nocturnal contrast only when it suits the requested scene.
  texture_and_material: >-
    Keep digital ink fine, surfaces controlled and grain low. Add screen-like glow only to
    luminous elements already present.
  camera_and_composition: >-
    Keep the requested camera and staging. Establish order through clean separation and
    spacing.
  atmosphere_and_mood: >-
    Detachment or unease may come from measured spacing and cool contrast when compatible
    with the requested tone.
  rendering_and_quality: >-
    Preserve clean line hierarchy, crisp silhouettes and soft background integration; avoid
    bloom that obscures small forms.
  key_features: >-
    Precise rim separation; broad even light with grouped shadows; controlled
    digital surfaces; measured spacing and clean silhouettes.
  creative_brief: 'Use cool value separation, precise edges and grouped shadows only where they fit the prompt. Keep its camera, subject and intended mood. Use it as a reusable look on any subject.'
