visualDna:
  aesthetic: 'Orbitalpunk: working-class life on crowded orbital rings and stations, with spinning habitat wheels, patched modules, laundry in zero wind and the planet always below.'
  subject_treatment: Keep the prompt's subject and setting; move it onto a crowded spinning orbital habitat with the planet curving below the windows.
  color_and_tone: Worn white and grey modules, blue planet glow and warm interior lights against black space.
  lighting_and_shadow: Hard unfiltered sunlight and deep space shadow, softened by planet glow.
  texture_and_material: Scuffed composite panels, patched insulation, handrails, cables and small portholes.
  camera_and_composition: Curved horizons of habitat rings with the planet filling half the frame.
  atmosphere_and_mood: Cramped, lively and fragile, a neighborhood spinning above the world.
  rendering_and_quality: Clean detailed illustration with crisp hard light and planet glow.
  creative_brief: "Orbitalpunk: working-class life on crowded orbital rings and stations, with spinning habitat wheels, patched modules, laundry in zero wind and the planet always below. Carry it through spinning habitat rings, patched modules, planet below, crowded neighborhoods. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
