visualDna:
  aesthetic: 'Glacier ice: dense blue ice with trapped bubbles, fracture planes and melt-smoothed surfaces.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of glacier ice with blue depths and trapped bubbles.'
  color_and_tone: Deep cyan-blue with white frosted edges, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Backlight showing blue translucency, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Dense ice with bubbles, fractures and melt ridges, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Cold, ancient, pure and silent, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: deep blue glacier ice; trapped bubbles; fracture planes; translucent depth
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Glacier Ice as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
