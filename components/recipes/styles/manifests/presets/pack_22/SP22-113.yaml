visualDna:
  aesthetic: >-
    Resolved sketch-painting compresses form into economical value masses and long expressive strokes
    while retaining complete, intentional construction.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify secondary marks, but finish
    important anatomy, object structure and identifying details.
  color_and_tone: >-
    Let broad value blocks lead before smaller color details. Preserve the requested palette and keep
    adjacent forms distinguishable.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern with a few clear painted groups. Open strokes do not
    change the light direction or remove needed form information.
  texture_and_material: >-
    Use long, directional brush marks and selective visible corrections. Keep each mark tied to form;
    avoid decorative strokes unrelated to the subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. An expressive finish does not
    imply a new gesture or cropped composition.
  atmosphere_and_mood: >-
    Keep the requested tone. Visible brushwork does not make the image a loose study, unfinished scene
    or dramatic event.
  rendering_and_quality: >-
    Leave strokes open only in secondary areas where identity and structure remain clear. Keep the image
    complete, with deliberate corrections rather than missing construction.
avoidRules:
  - unfinished anatomy or structure
  - decorative brushwork unrelated to form
