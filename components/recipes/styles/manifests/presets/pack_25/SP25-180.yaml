visualDna:
  aesthetic: 'Material Transformation Sequence: the same form shown in three stages as it turns from one material into another, shape and copy intact.'
  subject_treatment: Show the prompt's subject in three stages of one material transformation, with the same framing, matching points and exact copy.
  color_and_tone: Palette evolving with the material while brand colors stay protected.
  lighting_and_shadow: Coherent light between stages with explicit optical changes only.
  texture_and_material: Defined start, middle and end materials, one clean transformation.
  camera_and_composition: The same framing across three stages with persistent matching points.
  atmosphere_and_mood: A clear transformation and a material surprise, almost magical.
  rendering_and_quality: Geometry and copy survive every stage unless a change is authorized.
  creative_brief: "Material Transformation Sequence: the same form shown in three stages as it turns from one material into another, shape and copy intact. Carry it through three stages, one material change, same framing, matching points. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three stages; one material change; same framing; matching points
