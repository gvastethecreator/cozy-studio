visualDna:
  aesthetic: 'Crayon lithography: the image drawn with greasy crayon and wash on a grained limestone, then printed so every grain of the stone appears in the tone.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Soft velvety blacks and warm greys, sometimes one or two flat color stones; a very wide tonal range from pale grain to rich solids.
  lighting_and_shadow: Painterly modeling with soft crayon gradients and wash puddles, bright lights scraped back to paper.
  texture_and_material: Fine even stone grain in every tone, crayon drag marks, reticulated wash patterns, scraped white lines.
  camera_and_composition: Keep the requested framing; loose drawing with a sketchy vignette fading into the paper.
  atmosphere_and_mood: Soft, atmospheric and immediate, a drawing multiplied by stone.
  rendering_and_quality: Grainy crayon tones and liquid washes with no plate mark and no embossing; sits flat on the paper.
  key_features: limestone grain in every tone; greasy crayon drag; reticulated tusche washes; scraped highlights; no plate mark
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Lithography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
