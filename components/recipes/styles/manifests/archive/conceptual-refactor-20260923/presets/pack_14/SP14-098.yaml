visualDna:
  aesthetic: >-
    Ash-Crown Residue Authority acts as a transferable mythic-noir router: ash translated into dark
    symbolic behavior, crown translated into dark symbolic behavior plus residue translated into
    dark symbolic behavior fused with symbolist myth-noir iconography with emblem logic, relic
    pressure, occult negative space, and adult editorial restraint; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    regalia-like silhouette emphasis and authority-bearing contour, ash shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus residue shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through ash gray, char black, and dim ember warmth, crown-weighted accent roles over
    disciplined dark values plus residue-weighted accent roles over disciplined dark values together
    with blackened neutrals, relic gold, ash white, bruised crimson, oxidized green, and one
    disciplined omen accent; values stay separated, accents feel intentional, and the dark palette
    supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use low ember haze and powder-soft falloff, crown-weighted rim behavior, occult glow, and
    charged shadow plus residue-weighted rim behavior, occult glow, and charged shadow with
    eclipse-like falloff, thin halo edges, candle-density glow, and shadow that behaves like
    symbolic weight; shadows must carry omen weight, rims should clarify form, and glow should
    behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render powdered ash, soot residue, matte char, and dry mineral dust, charred metal, tarnish, and
    sharp ceremonial edges plus ash residue, rubbed pigment, wax smear, and forensic dust alongside
    obsidian polish, ash residue, salt-bone grain, tarnished metal, wax, velvet, paper, and
    carved-stone tactility; surface scale, patina, residue, gloss, grain, and carved or sealed edges
    must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with ash converted into repeatable spatial rhythm and symbolic hierarchy, crown converted
    into repeatable spatial rhythm and symbolic hierarchy plus residue converted into repeatable
    spatial rhythm and symbolic hierarchy plus icon axes, seal geometry, threshold spacing,
    processional rhythm, and diagram-like symbolic hierarchy; the style should support portraits,
    objects, architecture, creatures, symbols, and full scenes through reusable spatial grammar
    instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through mourning, aftermath, and burned authority plus authority proven by traces
    rather than spectacle and hushed authority, occult elegance, grief, accusation, secrecy, and a
    sense of ancient systems still operating; the image can become severe, sensual, sacred, violent,
    quiet, or strange when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with ash recognition with denoised dark editorial polish and controlled material truth
