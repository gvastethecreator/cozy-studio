visualDna:
  aesthetic: 'Loose brush contours, open paper gaps, and simple geometric underpainting give forms a fresh hand-painted energy.'
  subject_treatment: 'Preserve the prompted design, proportions, pose, and action; vary stroke edges without reshaping the figure or object.'
  color_and_tone: 'Balance a light base with a few confident saturated accents; let the user set the hue and avoid a fixed seasonal palette.'
  lighting_and_shadow: 'Use broad light planes with broken brush shadow edges; follow the described source and keep depth readable.'
  texture_and_material: 'Show dry-brush skips and sparse pencil grain as surface treatment; render existing materials recognizably beneath the marks.'
  camera_and_composition: 'Keep exact framing, viewpoint, scale, and count; use asymmetry within existing shapes without rearranging the composition.'
  atmosphere_and_mood: 'Preserve the requested feeling; loose marks describe brushwork, not a required emotion.'
  rendering_and_quality: 'Leave a controlled handmade edge while keeping anatomy and object boundaries legible; avoid a uniformly rough finish.'
  key_features: 'Loose directional brushwork; geometric underpainting; visible paper gaps; broken shadow edges; selective pencil grain.'
  creative_brief: 'Combine confident brush edges with simple color geometry and visible gaps. Keep the original subject, action, count, camera, and mood unchanged.'
