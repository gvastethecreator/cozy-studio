  color_and_tone: Sepia and red chalk on aged paper, following the conventions of this drawing type.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Iron-gall ink, red chalk and foxing, with the drafting tools visible in the line quality.
  camera_and_composition: Several sketches arranged loosely on one page, laid out as a real sheet of this drawing type.
  atmosphere_and_mood: Curious, brilliant, restless and old, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Renaissance invention notebook: sepia pen sketches of machines and studies scattered across a page with dense mirror-script marks. Carry it through sepia sketches, script marks, red chalk, aged page. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
