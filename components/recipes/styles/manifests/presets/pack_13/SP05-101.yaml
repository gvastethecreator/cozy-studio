visualDna:
  aesthetic: 'Koji Yamamura independent animation look as in Mt. Head: hand-drawn fluid pencil and watercolor, abstract flowing forms and painterly metamorphosis.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with fluid hand-drawn lines that melt into abstract painterly forms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Watercolor blues, sepia and soft washes, true to the Koji Yamamura palette.
  lighting_and_shadow: Soft painterly light, lit the way Koji Yamamura lights its scenes.
  texture_and_material: Pencil and watercolor texture, with the surface finish of Koji Yamamura.
  camera_and_composition: Flowing metamorphic compositions, framed the way Koji Yamamura composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with fluid dreamy metamorphosis.
  rendering_and_quality: Painterly independent animation frame, in the recognizable hand of Koji Yamamura.
  key_features: Koji Yamamura fluidity; watercolor; metamorphosis
  creative_brief: "Koji Yamamura independent animation look as in Mt. Head: hand-drawn fluid pencil and watercolor, abstract flowing forms and painterly metamorphosis. Carry it through Koji Yamamura fluidity, watercolor, metamorphosis. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uniform opaque fills erasing pigment blooms
  - continuous hard outlines enclosing every form
  - wash bleed obscuring the silhouette
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
