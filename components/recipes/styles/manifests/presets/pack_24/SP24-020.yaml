visualDna:
  aesthetic: 'Deep-sea pressure dread: cramped submersible interiors and black ocean depths, riveted hulls creaking while vast unseen shapes pass beyond tiny portholes.'
  subject_treatment: Place the prompt's subject inside or just outside a deep-sea vessel, keeping it clear in a small pool of light surrounded by black water.
  color_and_tone: Black ocean blue, rusted brass, dim green instrument glow and pale headlamp beams.
  lighting_and_shadow: Tiny pools of light, instrument glow and headlamp beams dissolving into total darkness.
  texture_and_material: Riveted steel, condensation, brass gauges, thick porthole glass and drifting particles.
  camera_and_composition: Claustrophobic interiors or small lit figures against enormous black water.
  atmosphere_and_mood: Crushing, silent and immense, something large is passing.
  rendering_and_quality: Dark painterly realism with precise small highlights and heavy darkness.
  creative_brief: "Deep-sea pressure dread: cramped submersible interiors and black ocean depths, riveted hulls creaking while vast unseen shapes pass beyond tiny portholes. Carry it through cramped submersible, tiny portholes, black depths, passing unseen shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cramped submersible; tiny portholes; black depths; passing unseen shapes
