visualDna:
  aesthetic: 'Business casual: polished but relaxed workwear — unstructured blazer, knit or open collar, tailored trousers — made for long days.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: an unstructured blazer or cardigan, open-collar shirt or fine knit, tailored trousers or midi skirt and simple leather shoes."
  color_and_tone: Navy, grey, camel, white and soft blue, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Even, soft daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Wool-blend suiting, cotton poplin, fine knits and leather, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Natural three-quarter framing in a workplace or transit setting.
  atmosphere_and_mood: Competent, approachable and composed, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Clean, natural editorial finish, with believable fabric weight, seams and fit detail.
  key_features: unstructured blazer; open collar; tailored trousers; soft neutral palette; composed ease
  creative_brief: "Business casual: polished but relaxed workwear — unstructured blazer, knit or open collar, tailored trousers — made for long days. Carry it through unstructured blazer, open collar, tailored trousers, soft neutral palette, composed ease. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
