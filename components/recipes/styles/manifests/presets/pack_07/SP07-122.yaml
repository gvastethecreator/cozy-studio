visualDna:
  aesthetic: 'Unassembled model kit: the subject broken into injection-molded parts still attached to rectangular sprue frames by thin gates, ready to be clipped.'
  subject_treatment: Keep the requested subject, its identity and pose; this preset owns the flat unassembled sprue-frame layout of its parts, and a requested object stays that object instead of becoming a building.
  color_and_tone: One plastic color per frame, such as light grey, olive, sand or clear, on a neutral cutting mat; flat and even.
  lighting_and_shadow: Soft overhead light with small crisp shadows under each frame and gloss on the clear parts.
  texture_and_material: Smooth molded plastic, thin gates, ejector-pin circles, a few parts already clipped with white stress marks.
  camera_and_composition: Top-down or low-angle view of two to four frames laid on a mat; the subject is recognisable from its parts.
  atmosphere_and_mood: Anticipation and order, the whole subject waiting to be built.
  rendering_and_quality: Clean photograph of real plastic frames; part numbers left as blank tabs, never readable.
