visualDna:
  aesthetic: 'Overlaypunk: a world seen through augmented reality, where floating icons, virtual creatures and painted-on skins cover a shabby real city.'
  subject_treatment: Keep the prompt's subject and setting; layer floating wordless overlays, virtual creatures and bright skins over the real scene.
  color_and_tone: Dull real-world greys and browns under bright candy-colored virtual overlays.
  lighting_and_shadow: Real daylight or streetlight, with overlays glowing flatly without real shadows.
  texture_and_material: Flat glowing virtual shapes floating over worn real surfaces.
  camera_and_composition: Split views where overlays and reality misalign at the edges.
  atmosphere_and_mood: Playful and hollow, a beautiful illusion painted over a tired world.
  rendering_and_quality: Clean illustration contrasting flat virtual layers with detailed reality.
  creative_brief: "Overlaypunk: a world seen through augmented reality, where floating icons, virtual creatures and painted-on skins cover a shabby real city. Carry it through floating overlays, virtual creatures, misaligned edges, dull reality beneath. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: floating overlays; virtual creatures; misaligned edges; dull reality beneath
