visualDna:
  aesthetic: 'Porcelain doll transformation: the figure rendered as glazed bisque porcelain with painted features, fine cracks and ball-joint seams.'
  subject_treatment: 'Apply this material to the whole figure as a deliberate transformation while keeping identity, face structure, pose and setting readable: glazed porcelain skin with painted cheeks and lashes, hairline cracks and visible joint seams at neck, elbows and knees.'
  color_and_tone: Porcelain white, blush pink and painted accents, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Soft studio light with glaze highlights, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Glazed and bisque porcelain with crackle and painted detail.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the figure.
  atmosphere_and_mood: Uncanny, fragile, eerie and beautiful, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: glazed porcelain skin; painted features; hairline cracks; ball-joint seams
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Porcelain Doll as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
