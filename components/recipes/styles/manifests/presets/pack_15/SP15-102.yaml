visualDna:
  aesthetic:
    'Give the image skate-deck graphic energy through grip-tape grain, layered plywood edges, hand-cut
    board-art shapes, and compressed diagonals applied to existing compatible forms, not to a new board
    or setting.'
  subject_treatment:
    Preserve the requested subject, action, pose, lighting, and framing; translate compatible existing
    clothing or object surfaces into deck-art shapes, grip-tape blocks, or curved graphic lines. Do not add
    a skatepark, graffiti wall, or skull artwork to communicate the style.
  color_and_tone:
    Pair concrete gray and worn wood with punchy board-art colors such as black, cream, red,
    and electric green; maintain high contrast and allow the requested palette to lead.
  lighting_and_shadow:
    Preserve the requested light source, direction, and time of day; use crisp local shadows to emphasize
    existing curves and edges without implying a different setting or action.
  texture_and_material:
    Distinguish gritty grip surface, layered plywood, worn rubber, and printed or painted
    deck graphics; keep scuffs localized to contact edges.
  camera_and_composition:
    Preserve the requested camera and framing; use compressed diagonals within the existing composition
    rather than changing perspective or implying a new action.
  atmosphere_and_mood:
    Feel independent, kinetic, and homemade, with the source scene's mood and intensity
    preserved.
  rendering_and_quality:
    Use bold contour, simplified motion accents, and readable board-art shapes; prevent
    surface abrasion and speed lines from dissolving anatomy or silhouette.
avoidRules:
  - a mandatory skateboard, ramp, or airborne trick
  - sportswear advertising polish
  - motion marks obscuring the subject
  - unrequested skulls, tags, lettering, or graffiti walls replacing deck and grip cues
