visualDna:
  aesthetic: 'Modular Journal Entries: repeatable entry modules that take short or long texts and optional images without losing their family look.'
  subject_treatment: Build the prompt's journal from repeatable entry modules that stretch for short and long texts and optional images, every field and title exact.
  color_and_tone: Common palette with one accent by status or section.
  lighting_and_shadow: Flat layout with source image light preserved throughout.
  texture_and_material: Clean surfaces, discreet dividers and consistent sharp type.
  camera_and_composition: Flexible-height modules with title, body and notes in stable places.
  atmosphere_and_mood: A diary rhythm and continuity that never turns into identical cards.
  rendering_and_quality: Crisp page where short and long entries keep all their fields.
  creative_brief: "Modular Journal Entries: repeatable entry modules that take short or long texts and optional images without losing their family look. Carry it through entry modules, flexible height, stable fields, diary rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: entry modules; flexible height; stable fields; diary rhythm
