visualDna:
  aesthetic: >-
    A restrained digital anime treatment built from delicate contours, soft
    compositing and gentle value contrast.
  subject_treatment: >-
    Keep the supplied identity, action and pose. Use economical facial marks and quiet
    contour changes so expression remains subtle without prescribing a relationship.
  color_and_tone: >-
    When no palette is specified, favor pale blue-gray and soft gray with small blush or
    amber accents. Preserve every requested color and attach accents to forms already
    present.
  lighting_and_shadow: >-
    Use diffuse illumination with a restrained warm counterlight and a fine separating rim;
    keep forms legible.
  texture_and_material: >-
    Blend clean digital fills with softly painted backgrounds, matching surface treatment to
    the materials in the prompt.
  camera_and_composition: >-
    Preserve the requested framing and viewpoint. Let the existing gesture read clearly,
    using open space only where the supplied composition allows it.
  atmosphere_and_mood: >-
    Understated expression and cool-warm contrast can support a quiet or intimate tone when
    requested; follow the prompt's emotional direction.
  rendering_and_quality: >-
    Keep facial and object contours fine but readable, transitions soft, and background
    color integrated without blurring the subject.
  key_features: >-
    Delicate contour economy; diffuse light with small warm accents; pale cool fields when
    palette is open; soft integration between digital forms and painted backgrounds.
  creative_brief: 'Apply the quiet contour, diffuse light and optional cool-warm palette after the prompt is set. Preserve its subject, action, setting and framing; texture only materials already present. Use it as a reusable look on any subject.'
