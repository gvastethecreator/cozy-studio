visualDna:
  aesthetic: Interleave sweeping bands and rounded color planes with alternating bright pulses and open intervals.
  subject_treatment: >-
    Preserve the requested content and action; carry flow through existing contours without adding care
    equipment or a venue.
  color_and_tone: >-
    Use vivid blue, magenta, or acid green in measured bursts against deep charcoal and a small warm
    foil-like highlight.
  lighting_and_shadow: Let light follow selected bands, with broad dark intervals between pulses.
  texture_and_material: >-
    Contrast smooth satin-like areas, flexible foil-like color, and matte shadows without specifying
    objects.
  camera_and_composition: Keep the requested framing; guide the eye with two or three flowing curves and clear breathing space.
  atmosphere_and_mood: Create communal energy through rhythm, color, and movement while following the requested mood.
  rendering_and_quality: Keep pulses distinct and curves smooth; avoid flattening the image into a full-field glow.
avoidRules:
  - all-over saturated light
  - curves that cross into an unreadable knot
  - a fixed gathering or performance scene
