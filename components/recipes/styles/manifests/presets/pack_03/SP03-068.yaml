visualDna:
  aesthetic: 'Photogrammetry scan render: the scene rebuilt from hundreds of photographs as a dense triangulated mesh with photo-projected texture and the flaws of a real capture.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Natural, slightly flat photo albedo with the capture-day light baked in; true-to-life stains, lichen and dirt color.
  lighting_and_shadow: Soft neutral render light over delit textures, so baked-in shadows and new shading coexist faintly.
  texture_and_material: Micro-detailed real surface texture, smeared or stretched texels in occluded undersides, small mesh holes and blobby thin parts.
  camera_and_composition: Keep the requested location and view; scan edges fade to ragged mesh borders where coverage ends.
  atmosphere_and_mood: Grounded and documentary, a real place frozen as data.
  rendering_and_quality: Scan-library realism with honest artifacts; never a clean hand-modeled asset.
  key_features: photo-projected texture; stretched texels in occlusion; ragged mesh border; blobby thin parts; baked capture light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies 3D Scan (Photogrammetry) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
