visualDna:
  aesthetic: >-
    Explicit velocity grammar: compressed forms lead into open space while fine contours
    lengthen into tapered smears along existing motion.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Stretch contour
    rhythm only where motion is present, with no added action or afterimage.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, hold cobalt, midnight blue,
    and violet as deep fields with small white or cyan accents; honor any explicit palette.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep the supplied source; align bright rim
    emphasis with existing movement, but add no trails, stars, or glow.
  texture_and_material: >-
    Apply texture only to materials already present. Use clean fine ink and sparse color grain;
    motion remains contour behavior, not new particles or effects.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Compress drawn-mark
    intervals behind the existing action vector and open their spacing ahead, without moving
    subjects or tilting the camera.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Velocity is line rhythm only; retain the user's
    emotional tone and stakes.
  rendering_and_quality: >-
    Keep the moving silhouette recognizable and its leading edge sharp; never blur
    identity-bearing details.
  key_features: >-
    Tapered speed contours; compressed-to-open spacing; cobalt-violet field; legible action
    silhouette.
  creative_brief: "Use tapered speed contours; compressed-to-open spacing; cobalt-violet field; legible action silhouette. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
