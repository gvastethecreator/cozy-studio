  aesthetic: 'Star chart: constellation lines, star dots and coordinate grid on dark blue.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is drawn as a constellation over a celestial grid."
  color_and_tone: Dark blue with gold and white stars, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Engraved celestial chart, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Mystical, navigational, calm and cosmic, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Star chart: constellation lines, star dots and coordinate grid on dark blue. Carry it through constellation lines, coordinate grid, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: constellation lines; coordinate grid; illustrative only
