visualDna:
  aesthetic: 'Black velvet painting: bright opaque paint laid over black velvet so the fabric itself is the darkest value and forms glow out of the dark.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Deep velvet black everywhere the paint is thin; saturated turquoise, magenta, gold and moonlight white on the lit edges only.
  lighting_and_shadow: 'Glowing rim light: forms exist only where light hits them, the shadow side left as bare black velvet.'
  texture_and_material: Soft velvet pile catching the paint, fuzzy edges where the brush dragged across the nap, a slight sheen on the black.
  camera_and_composition: Keep the requested framing; the subject is centered and emerges from surrounding darkness.
  atmosphere_and_mood: Kitsch yet sincere, nocturnal and theatrical in its glow.
  rendering_and_quality: Soft fuzzy transitions into bare black, bright luminous lights, no painted background tone at all.
  key_features: bare black velvet as shadow; glowing rim-lit edges; saturated turquoise, magenta and gold; velvet pile fuzz; subject emerging from darkness
  creative_brief: "Black velvet painting: bright opaque paint laid over black velvet so the fabric itself is the darkest value and forms glow out of the dark. Carry it through bare black velvet as shadow, glowing rim-lit edges, saturated turquoise, magenta and gold, velvet pile fuzz. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
