visualDna:
  aesthetic: >-
    Anime line combines rounded contours, selectively pooled dark shapes, and small
    reflective accents.
  subject_treatment: >-
    Keep relationships, distance, pose, count; assume no couple, walk, or night scene.
  color_and_tone: >-
    Deep teal, amber, pewter blue, natural subject neutrals, restrained contrast.
  lighting_and_shadow: >-
    Warm accents against cool values only when supported; otherwise retain prompt lighting.
  texture_and_material: >-
    Broken reflections only on wet or glossy surfaces already depicted; dry forms stay
    matte.
  camera_and_composition: >-
    Preserve crop and spacing; neither close in nor separate subjects unless requested.
  atmosphere_and_mood: >-
    Intimacy only if requested; retain humor, action, or distance as intended.
  rendering_and_quality: >-
    Small highlights, open blacks, clean contours, no rain haze or cinematic blur.
  key_features: >-
    Rounded contour, teal-amber accent, localized reflections, spacing follows the prompt
  creative_brief: 'Apply a visual treatment centered on rounded contour, teal-amber accent, localized reflections, spacing follows the prompt. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
