  color_and_tone: Hyper-saturated ruby red, emerald green and sapphire blue, creamy skin, luminous highlights.
  lighting_and_shadow: Bright high-key studio light with colored backlights and a follow spot on the lead.
  texture_and_material: Satin, tulle, sequins, painted canvas skies and polished stage floors.
  camera_and_composition: Wide proscenium framing or high crane shots of symmetrical group formations, lead centered.
  atmosphere_and_mood: Joyous and theatrical, dreamlike spectacle with no shadow of doubt.
  rendering_and_quality: Dye-transfer saturation and gentle softness; painted backdrops obviously painted.
  key_features: three-strip saturation; painted backdrops; high-key studio light; crane-shot formations; satin and sequins
