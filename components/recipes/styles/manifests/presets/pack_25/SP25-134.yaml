visualDna:
  aesthetic: 'Serial Number Rhythm: typographic sequences and indexes structure the identity like a numbered collection, never like real shipping labels.'
  subject_treatment: Use the prompt's supplied numbers and indexes as a typographic rhythm across the range, the name small but legible and every number exact.
  color_and_tone: One dominant ink with a sequence accent and a clear name hierarchy.
  lighting_and_shadow: Neutral reading light on a calm, evenly lit board.
  texture_and_material: Crisp ink on sober stock with typography as the only ornament.
  camera_and_composition: The sequence organizes the layout while the main information stays fixed.
  atmosphere_and_mood: Collector rhythm and precision, the pleasure of a numbered set.
  rendering_and_quality: Every number matches the supplied data and never reads as a quantity or claim.
  creative_brief: "Serial Number Rhythm: typographic sequences and indexes structure the identity like a numbered collection, never like real shipping labels. Carry it through giant index numbers, numbered set, small name, one ink. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: giant index numbers; numbered set; small name; one ink
