visualDna:
  aesthetic: >-
    Architectural Visualization acts as a transferable CGI-style router: start from Architectural
    visualization render system, Straight verticals, daylight material truth and hard-surface and
    product-CGI system built from bevel logic, manufactured surfaces, PBR maps, studio reflections,
    mechanical detailing, and premium reveal, then apply the 3D/render behavior to prompt X instead
    of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Straight verticals; preserve the prompt subject while
    giving it engineered silhouette logic, panel hierarchy, assembly clarity, product-grade surface
    control, or UI-material precision, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Beige, White, Wood, natural material tones; use color as manufactured finish:
    anodized metal, gunmetal, glass tint, enamel, ceramic, product neutrals, neon gas, or controlled
    brand-neutral accents, with deliberate value grouping, exposure control, and medium-specific
    limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Sunlight, window daylight simulation; shape light through studio strips,
    rim edges, reflection cards, display glow, automotive flow lines, gemstone fire, or product
    reveal gradients, so value structure supports the renderer and does not overwrite the requested
    content.
  texture_and_material: >-
    Render Realistic materials, lived in warmth; surface detail should show bevels, panel seams,
    normal maps, brushed metal, glass layers, stone facets, neon tubing, mechanical wear, or clean
    UI translucency, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for Architectural Visualization: three quarter or
    orthographic framing, clean silhouette read, material highlights, controlled depth, and vertical
    card composition; compose for engineered readability through exploded spacing, hero compression,
    orthographic clarity, packshot discipline, part hierarchy, or premium macro scale, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Aspirational, clean, designer curated; derive mood from precision, luxury,
    tactical engineering, clean retail desire, transhuman unease, or high-end interface tactility,
    letting the renderer alter interpretation without demanding a specific story, location, or
    character.
  rendering_and_quality: >-
    Finish with Real estate brochure, lifestyle luxury; finish with exact edges, believable PBR
    response, controlled reflections, and no fake labels, muddy grime, or random greeble clutter,
    clean denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Architectural visualization render system; Straight verticals, daylight material truth; Beige,
    White, Wood, natural material tones; Realistic materials, lived in warmth; Lookdev camera for
    Architectural Visualization: three quarter or orthographic framing, clean silhouette read,
    material highlights, controlled depth, and vertical card composition
  creative_brief: >-
    Apply Architectural Visualization as a CGI/render preset over prompt X: preserve the user's
    requested subject, then route modeling, shader response, lighting, material scale, composition,
    mood, and final render craft through Architectural visualization render system, Straight
    verticals, daylight material truth, Realistic materials, lived in warmth without requiring the
    card image's original subject.
avoidRules:
  - messy
  - lived in
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - readable text
  - signature
  - random greeble clutter
  - fake labels
  - muddy grime
  - organic blob shape
