  lighting_and_shadow: Moonlight or lantern light, expressed through the style rather than photographic lighting.
  texture_and_material: Cel with ink-wash backgrounds, visible at card size as the signature of the style.
  camera_and_composition: Wide standoff frames and extreme close-ups of eyes and hilts.
  atmosphere_and_mood: Tense, still, lethal and poetic, driven by the construction, color and rhythm.
  rendering_and_quality: Clean on-model anime frame or key visual with deliberate line and cel decisions.
