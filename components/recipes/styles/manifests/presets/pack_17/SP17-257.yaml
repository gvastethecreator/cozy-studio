  lighting_and_shadow: Cosmic ominous glow, lit the way Peter Mullen lights its scenes.
  texture_and_material: Dense detailed ink textures, with the surface finish of Peter Mullen.
  camera_and_composition: Crowded pulp composition, framed the way Peter Mullen composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with dense pulp cosmic horror.
  rendering_and_quality: Dense cosmic horror ink illustration, in the recognizable hand of Peter Mullen.
