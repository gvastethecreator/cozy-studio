  color_and_tone: Pastel pink, teal, lavender and chrome, used consistently across subject and background.
  lighting_and_shadow: Soft even fluorescent light with gradient skies, expressed through the style rather than photographic lighting.
  texture_and_material: Glossy tiles, marble, chrome and low-res image grain, visible at card size as the signature of the style.
  camera_and_composition: Symmetrical frontal framing with empty space, arranged so the subject still reads at card size.
  atmosphere_and_mood: Dreamy, ironic, lonely and nostalgic, driven by the construction, color and rhythm.
  rendering_and_quality: Glossy digital collage finish with mild pixel grain, with clean, deliberate marks and no accidental noise.
  key_features: empty mall; marble bust; palms; pastel gradients; low-res grain
