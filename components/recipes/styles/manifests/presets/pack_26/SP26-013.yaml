visualDna:
  aesthetic: 'Tohl Narita kaiju and alien design look from sixties tokusatsu: abstract modernist creature shapes, sculptural suits built for actors, bold patterns and strange elegant silhouettes.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design giant creatures as wearable suit designs with modernist abstract shapes and bold patterns. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold modernist colors on paper with watercolor washes.
  lighting_and_shadow: Flat design-sheet light, lit the way Tohl Narita lights its scenes.
  texture_and_material: Watercolor and pencil design sketches, with the surface finish of Tohl Narita.
  camera_and_composition: Front and side suit-design views on paper, framed the way Tohl Narita composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with strange modernist wonder.
  rendering_and_quality: Sixties kaiju design sketch, in the recognizable hand of Tohl Narita.
  creative_brief: "Tohl Narita kaiju and alien design look from sixties tokusatsu: abstract modernist creature shapes, sculptural suits built for actors, bold patterns and strange elegant silhouettes. Carry it through Tohl Narita modernist kaiju, suit design, abstract shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Tohl Narita modernist kaiju; suit design; abstract shapes
