visualDna:
  aesthetic: >-
    Abrasive neon-noir rendering with distressed ink, dense crosshatch, hard surface glints, and
    saturated signals cutting through shadow.
  subject_treatment: >-
    Keep the requested subject and silhouette intact. Use rough hatch clusters and precise neon
    edge accents on existing contours; add no weapon or costume.
  color_and_tone: >-
    Set toxic green, hot red, and magenta against black and smoky gray; keep the vivid color
    concentrated in small areas.
  lighting_and_shadow: >-
    Use hard cel-shadow blocks with clipped red or green highlights; avoid creating neon signs
    or a nighttime street.
  texture_and_material: >-
    Respect each depicted material while adding scratched ink, worn patches, and coarse hatching
    in selected regions.
  camera_and_composition: >-
    Respect the prompt’s camera. Use abrupt contrast shifts and angled detail clusters within
    the frame, not forced close-ups.
  atmosphere_and_mood: >-
    Make the image feel tense and abrasive through compressed values, irregular marks, and sharp
    color interruptions, not criminal subject matter.
  rendering_and_quality: >-
    Keep rough texture controlled against clean silhouette edges; separate colors clearly and
    prevent darks from filling with noise.
  key_features: >-
    Distressed crosshatch; toxic green and hot red; sharp surface glints; compressed noir
    shadows.
  creative_brief: >-
    Retain the requested subject, action, and setting. Apply distressed ink, sparse toxic-neon
    accents, and hard shadow blocks; add no weapon, costume, signage, or street.
