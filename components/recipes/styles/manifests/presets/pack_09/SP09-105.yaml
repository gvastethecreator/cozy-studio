visualDna:
  aesthetic: 'Shadow tendrils: black smoky tendrils reaching out from the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: dark tendrils reach from the target like living smoke.'
  color_and_tone: Deep black with violet edges, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Contrast light making tendrils read, so the effect lights the target and casts believable local light.
  texture_and_material: Smoky tendrils with soft edges, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Ominous, dark, supernatural and creeping, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Shadow tendrils: black smoky tendrils reaching out from the target. Carry it through black shadow tendrils, violet edges, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: black shadow tendrils; violet edges; contained around the target
