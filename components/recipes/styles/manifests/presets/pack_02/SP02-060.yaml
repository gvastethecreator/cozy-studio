visualDna:
  aesthetic: 'Night-vision intensifier: starlight amplified by an image tube and shown in phosphor green inside a round eyepiece view.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Monochrome phosphor green, bright green highlights, black-green shadows.
  lighting_and_shadow: Amplified faint light; any real light source blooms into a halo; eyes of animals shine brightly.
  texture_and_material: Scintillation noise, grainy gain, slight blur at the tube edges.
  camera_and_composition: Circular eyepiece vignette, subject within the bright center.
  atmosphere_and_mood: Hidden and tense, the dark seen through someone watching it.
  rendering_and_quality: Intensifier-tube look with noise and bloom; no crosshair text or numbers.
  key_features: phosphor green monochrome; round eyepiece vignette; scintillation noise; bloom halos; eyeshine
  creative_brief: "Night-vision intensifier: starlight amplified by an image tube and shown in phosphor green inside a round eyepiece view. Carry it through phosphor green monochrome, round eyepiece vignette, scintillation noise, bloom halos, eyeshine. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
