visualDna:
  aesthetic: 'Cast bronze: the target as a bronze casting with polished high points, dark recesses and green-blue verdigris patina in the crevices.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Warm brown-gold bronze, bright polished wear spots, verdigris green and turquoise in recesses.
  lighting_and_shadow: Directional light raking the cast forms, warm specular on rubbed areas.
  texture_and_material: Casting texture, chased details, patina streaks, polished wear where hands touch.
  camera_and_composition: Keep the requested framing; a plinth only if the prompt includes one.
  atmosphere_and_mood: Monumental and weathered, a form that has stood for centuries.
  rendering_and_quality: Real metal with layered patina and wear, never painted plastic.
  key_features: cast bronze sheen; verdigris in crevices; polished wear spots; raking light; casting texture
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bronze Statue as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
