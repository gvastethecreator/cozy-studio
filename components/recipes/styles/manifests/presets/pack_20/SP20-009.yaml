visualDna:
  aesthetic: >-
    Printed illustration made from a deliberately built collagraph plate: raised shapes and recessed
    textures retain different amounts of ink and transfer them as controlled marks.
  subject_treatment: >-
    Preserve the requested identity, geometry and arrangement. Let plate seams and surface variations
    describe existing forms instead of attaching new collage pieces to the depicted subject.
  color_and_tone: >-
    Respect the requested palette. Separate broad values through ink held on raised plate areas and
    selective recess marks, not through arbitrary extra colors.
  lighting_and_shadow: >-
    Follow the requested illumination. Use plate-retained ink and open support to describe existing
    lights and shadows without casting a new light across the image.
  texture_and_material: >-
    Keep plate texture selective and scaled to the form it describes. Preserve the materials already
    depicted; do not paste a blanket collage texture over them.
  camera_and_composition: >-
    Honor the requested crop, viewpoint and layout. Plate marks stay within the existing composition
    and do not create a frame or product mockup.
  atmosphere_and_mood: >-
    Carry the requested mood through the density and spacing of printed plate marks, without implying
    handmade paper scraps or a craft-table setting.
  rendering_and_quality: >-
    Keep printed edges, recessed textures and open gaps distinct. Suggest ink transfer from a plate,
    not visible extrusion or a shadowed relief surface on the support.
avoidRules:
  - pasted collage material over depicted surfaces
  - deep embossed edges or support cast shadows
  - uniform plate texture across the whole image
assets:
  defaultImage: /assets/recipes/styles/defaults/SP20-009.webp
attributes:
