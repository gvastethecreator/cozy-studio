visualDna:
  aesthetic:
    'Show ingenious appropriate technology through visible load paths: rope tension, wooden wheels,
    ceramic or clay modules, hand-built joints, and woven connections make energy or function understandable
    at a glance.'
  subject_treatment:
    Preserve the requested subject and action; translate unspecified structures into repairable
    hand-built components and visible connections without inventing a generator, cell array, or machine.
  color_and_tone:
    Use wood, clay, stone, rawhide, and woven neutrals with one restrained blue or copper signal;
    keep functional components differentiated by value.
  lighting_and_shadow:
    Use broad natural or workshop light with warm edge highlights that reveal how pieces
    meet and where tension passes.
  texture_and_material:
    Keep timber, clay, woven fiber, rope, and sparse metal distinct and matte; use tool
    marks and join wear where construction requires them.
  camera_and_composition:
    Arrange modules and lines with open intervals so load paths and cause-and-effect
    stay readable; preserve the requested crop and focal hierarchy.
  atmosphere_and_mood:
    Suggest resourcefulness, accessible craft, and practical independence rather than primitive
    savagery or generic survivalism.
  rendering_and_quality:
    Favor simplified construction logic and crisp join silhouettes; keep small knots,
    cell details, and grain subordinate to the overall form.
avoidRules:
  - a required generator, battery, or cooling apparatus
  - tangled lines obscuring connections
  - dust or microtexture covering all materials
