visualDna:
  aesthetic: 'Overscale Placement Graphics: one huge motif placed in relation to the torso, sleeve or back, deliberately larger than a normal print area.'
  subject_treatment: Place one oversized motif from the prompt's subject against the real edges of torso, sleeve or back, deciding what may crop off and keeping the essential part.
  color_and_tone: A short palette with one broad contrast focus, the base color used as a reserve.
  lighting_and_shadow: Neutral presentation light and a flat main artwork.
  texture_and_material: Broad graphic edges with detail kept in one protected zone.
  camera_and_composition: An intentionally off-center motif with its crop decided in advance.
  atmosphere_and_mood: A single bold idea with large pauses, confident and loud.
  rendering_and_quality: Clean print where the focus reads flat and applied.
  creative_brief: "Overscale Placement Graphics: one huge motif placed in relation to the torso, sleeve or back, deliberately larger than a normal print area. Carry it through oversized motif, planned crop, body-edge placement, one idea. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: oversized motif; planned crop; body-edge placement; one idea
avoidRules:
