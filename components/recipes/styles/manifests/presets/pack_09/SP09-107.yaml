visualDna:
  aesthetic: 'Petal storm: a swirl of flower petals spiraling around the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: petals swirl in a spiral around the target, some resting on it.'
  color_and_tone: Pink, white or crimson petals, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Soft backlight on petals, so the effect lights the target and casts believable local light.
  texture_and_material: Floating petals with motion, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Romantic, graceful, fleeting and poetic, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Petal storm: a swirl of flower petals spiraling around the target. Carry it through swirling petals, spiral motion, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: swirling petals; spiral motion; contained around the target
