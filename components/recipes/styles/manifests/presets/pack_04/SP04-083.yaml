visualDna:
  aesthetic: 'Gesture energy sketch: fast charcoal pencil and brush-pen lines chasing the action, with repeated search lines, a line of action and motion trails.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: Monochrome graphite or charcoal on cream paper, with one red or blue col-erase pencil for the line of action.
  lighting_and_shadow: 'Minimal value: a few dark accents at weight-bearing points and folds, no modeled light.'
  texture_and_material: Layered search lines, smudged charcoal, broken contours and whip-fast tapering strokes.
  camera_and_composition: Keep the requested view; the figure sits large on the page with motion arcs carrying past the edges.
  atmosphere_and_mood: Explosive, loose and alive, movement caught mid-breath.
  rendering_and_quality: Unfinished drawing, energy placed before anatomy, no clean-up pass or rendering.
  key_features: layered search lines; colored line of action; charcoal smudges; motion arcs off the page; no clean-up
  creative_brief: "Gesture energy sketch: fast charcoal pencil and brush-pen lines chasing the action, with repeated search lines, a line of action and motion trails. Carry it through layered search lines, colored line of action, charcoal smudges, motion arcs off the page, no clean-up. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
