visualDna:
  aesthetic: >-
    Organize the requested forms into flat color planes with rhythmic curves, economical lines and
    selective patterns integrated only into surfaces already present.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Use overlaps and
    selective contour to clarify existing forms without altering anatomy or adding motifs.
  color_and_tone: >-
    Preserve the requested palette and separate major planes cleanly. Keep patterns within existing
    color areas rather than introducing new hues or decorative symbols.
  lighting_and_shadow: >-
    Follow the requested light direction and use overlap and value to establish depth without realistic
    volumetric lighting or additional light sources.
  texture_and_material: >-
    Keep the surface flat and clean. Integrate pattern into existing surfaces only when it supports
    their form; do not turn pattern into all-over ornament.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing, pose and spatial arrangement. Flat-plane rendering
    does not prescribe a setting or page layout.
  atmosphere_and_mood: >-
    Retain the requested setting and mood. Graphic rhythms affect rendering without adding a location
    or narrative.
  rendering_and_quality: >-
    Keep contours economical, curves deliberate and silhouettes readable. Use overlap and value for
    depth while keeping internal pattern secondary.
avoidRules:
  - unrequested motifs or narrative content
  - pattern applied across unrelated surfaces
  - added details that alter identity or function
