visualDna:
  aesthetic: >-
    Bioluminescent Forest acts as a transferable CGI-style router: start from Bioluminescent alien
    ecology, Avatar/Pandora style wonder, connected organic glow, Glow in dark, floating spores and
    environment and worldbuilding CGI system built from spatial design, modular assets, atmospheric
    scale, simulation logic, scan fidelity, and explorable depth, then apply the 3D/render behavior
    to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Glowing organic silhouettes, spore halos, branching
    luminous networks; preserve the prompt subject while embedding it in the preset's world-scale
    CGI logic; environmental systems, scan detail, map elevation, VFX volume, or scientific
    structure should appear only when named by the preset, keeping the requested identity,
    silhouette, pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Blue, Purple night, cyan bloom; use color through atmospheric grading, neon
    bloom, scientific false color, scan albedo, bioluminescent glow, map coding, or pyro
    temperature, with deliberate value grouping, exposure control, and medium-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Plant glow, ambient bioluminescence; shape light with atmospheric depth,
    emissive ecology, VR bake, modular level lighting, smoke self-light, or scan-matched
    illumination, so value structure supports the renderer and does not overwrite the requested
    content.
  texture_and_material: >-
    Render Organic, alien, phosphorescent; surface detail should show modular kits, photogrammetry
    scan grain, terrain relief, vegetation glow, pyro volume, map elevation, or simulation
    particles, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Production preview camera for Bioluminescent organic canopy:
    readable hero scale, near field/midground/support field depth, clean silhouette, and practical
    vertical crop; compose through spatial readability, player-scale cues, isometric elevation,
    explorable layers, environment silhouettes, or simulation flow, with scale, spacing, edge
    rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Wonder, magic, spiritual awe, connected biology calm; derive mood from immersion,
    navigability, alien wonder, technical explanation, decay, abstract spatial rhythm, or procedural
    spectacle, letting the renderer alter interpretation without demanding a specific story,
    location, or character.
  rendering_and_quality: >-
    Finish with Fantasy, magical, otherworldly immersion; finish with coherent world scale, readable
    depth, optimized detail hierarchy, and no empty wallpaper or generic vista-only render, clean
    denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Bioluminescent alien ecology, Avatar/Pandora style wonder, connected organic glow; Glow in dark,
    floating spores; Blue, Purple night, cyan bloom; Organic, alien, phosphorescent; Production
    preview camera for Bioluminescent organic canopy: readable hero scale, near
    field/midground/support field depth, clean silhouette, and practical vertical crop
  creative_brief: >-
    Apply Bioluminescent Forest as a CGI/render preset over prompt X: preserve the user's requested
    subject, then route modeling, shader response, lighting, material scale, composition, mood, and
    final render craft through Bioluminescent alien ecology, Avatar/Pandora style wonder, connected
    organic glow, Glow in dark, floating spores, Organic, alien, phosphorescent without requiring
    the card image's original subject.
