visualDna:
  aesthetic: 'Stark psychological anime framing: flat unshaded silhouettes against one saturated color field, sparse thin line, and pen-hatched interiors held like a still frame.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Black, bone and one flooding field of violet, sickly green or vermilion; everything else stays near-monochrome.
  lighting_and_shadow: 'Mostly shapeless light: silhouettes cut against the lit color field, a thin bone-white rim line, and hatched gloom inside forms.'
  texture_and_material: Fine G-pen crosshatching inside dark shapes, flat untextured color fields, and faint cel dust.
  camera_and_composition: Keep the requested view; push the subject off-center against a large empty field and hold the frame static and tense.
  atmosphere_and_mood: Existential unease, quiet dread and isolation, a held breath that lasts too long.
  rendering_and_quality: Flat color fields, silhouette clarity, pen-hatched interiors and a thin bone rim; no ornament and no glow.
  key_features: flat saturated color field; black silhouettes; G-pen crosshatched interiors; off-center composition with a huge void; thin bone rim line
  creative_brief: "Stark psychological anime framing: flat unshaded silhouettes against one saturated color field, sparse thin line, and pen-hatched interiors held like a still frame. Carry it through flat saturated color field, black silhouettes, G-pen crosshatched interiors, off-center composition with a huge void, thin bone rim line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
