  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is printed in glossy raised thermographic ink."
  color_and_tone: Glossy black or colored raised ink, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Puffy glossy raised ink, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Tactile, formal, glossy and crisp, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
