visualDna:
  aesthetic: >-
    Combine broad opaque color planes and confident ink contours with small, controlled raster
    accents. Keep the main forms broad and quiet while clusters clarify selected existing details.
  subject_treatment: >-
    Preserve the requested subject, identity, function, count, pose, action and proportions. Use
    raster accents only to distinguish details that already exist; add no content or symbols.
  color_and_tone: >-
    Retain the requested palette and color relationships. Reuse existing colors in compact accents
    without forcing neon, glow or additional hues.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Keep accents subordinate to existing value groups
    and avoid adding luminous effects or new light sources.
  texture_and_material: >-
    Keep broad areas opaque and matte with clean contours. Restrict raster clusters to selected details
    rather than pixelating the full image or replacing depicted materials.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. This rendering method
    does not alter the requested composition or add graphic elements.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Ink, opaque planes and small raster accents change the
    rendering only, not the scene or narrative.
  rendering_and_quality: >-
    Establish broad planes and legible contours first. Add only a few aligned raster clusters where
    they improve separation; avoid noise, all-over pixelation and competing styles.
avoidRules:
  - unrequested symbols, luminous effects or added content
  - all-over pixelation, raster noise or color shifts
  - unrequested lettering or added graphic elements
