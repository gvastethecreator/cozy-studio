visualDna:
  aesthetic: 'Islamic geometric pattern: star-and-polygon tessellations built from compass and straightedge.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is filled or outlined with interlaced star-and-polygon tessellation."
  color_and_tone: Lapis blue, turquoise, gold, white and terracotta, used consistently across subject and background.
  lighting_and_shadow: Flat or tile-glaze sheen, expressed through the style rather than photographic lighting.
  texture_and_material: Interlaced strapwork, stars and rosettes, visible at card size as the signature of the style.
  camera_and_composition: Radial symmetric tessellation, arranged so the subject still reads at card size.
  atmosphere_and_mood: Harmonious, infinite, sacred and precise, driven by the construction, color and rhythm.
  rendering_and_quality: Precise, crisp geometric finish, with clean, deliberate marks and no accidental noise.
  key_features: star-and-polygon tessellation; interlaced strapwork; radial symmetry
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Islamic Geometric as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - religious text
  - figurative
  - random
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
