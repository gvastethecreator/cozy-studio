visualDna:
  aesthetic: 'Oriented strand board: pressed wood flakes in a chaotic mosaic of strands.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of OSB with visible pressed wood strands."
  color_and_tone: Golden tan and brown flakes, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Flat light for the strand pattern, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Pressed wood strands with resin and rough edges, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Raw, industrial, rough and practical, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: pressed wood strands; OSB mosaic; rough edges
  creative_brief: "Oriented strand board: pressed wood flakes in a chaotic mosaic of strands. Carry it through pressed wood strands, OSB mosaic, rough edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
