  rendering_and_quality: Rich, warm editorial finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Equestrian heritage: riding-inspired dressing — tailored hacking jackets, jodhpurs, tall leather boots, quilted vests and silk scarves. Carry it through hacking jacket and jodhpurs, tall riding boots, silk scarf, chestnut and olive palette, country morning light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
