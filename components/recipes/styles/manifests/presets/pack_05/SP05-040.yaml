visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine formal outlines with repeated luminous tracings
    and nested curved bands, folded planes, and recurring abstract motifs. Let concentric ripples
    and gently folding curves set its rhythm; use nocturnal navy and ivory with restrained cyan or
    gold accents for color and clean matte fields with thin luminous line accents for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine formal outlines with repeated luminous
    tracings for edge work, nested curved bands, folded planes, and recurring abstract motifs for
    form simplification, and concentric ripples and gently folding curves only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with nocturnal navy and ivory with restrained cyan or gold accents. Place
    the strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: controlled edge glow against firm, dark shadow shapes. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean matte fields with thin luminous line accents, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use balanced symbolic spacing within the requested crop,
    with room around the focus to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey calm formality with subtle tension, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with precise linework, measured repetition, and glow kept tightly controlled; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    fine formal outlines with repeated luminous tracings; nested curved bands, folded planes, and
    recurring abstract motifs; nocturnal navy and ivory with restrained cyan or gold accents;
    concentric ripples and gently folding curves; clean matte fields with thin luminous line
    accents; balanced symbolic spacing within the requested crop, with room around the focus.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine formal outlines
    with repeated luminous tracings, nested curved bands, folded planes, and recurring abstract
    motifs, and nocturnal navy and ivory with restrained cyan or gold accents; use concentric
    ripples and gently folding curves only where movement is already present, and apply clean
    matte fields with thin luminous line accents as the drawing finish.
