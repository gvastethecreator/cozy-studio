visualDna:
  aesthetic: >-
    Use controlled fine-brush edges, compact value modeling and selective brush texture. Concentrate
    small marks where they clarify form while keeping the overall image flat and pictorial.
  subject_treatment: >-
    Preserve the requested subject identity, scale, proportions, pose, action and scene. Small-format
    handling is a detail hierarchy only; do not turn the subject into a miniature object.
  color_and_tone: >-
    Retain the requested palette and color relationships. Balance pictorial color and tonal detail
    without adding metallic shine, laminate gloss or a standard collector palette.
  lighting_and_shadow: >-
    Follow the requested lighting and contrast. Use compact brush modeling and small reserves to
    describe existing forms without introducing a new light source.
  texture_and_material: >-
    Use selective brush marks while preserving each represented material. Avoid applying one painted
    surface indiscriminately or changing the subject into a physical model.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Do not create a pedestal, display
    base, diorama, border or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Fine-brush detail describes the image treatment, not a
    miniature scene or collectible display.
  rendering_and_quality: >-
    Establish the silhouette and large value groups before selective fine details. Keep edge control
    deliberate and omit invented signatures, numbering or certificates.
avoidRules:
  - physical miniature, figurine, display base or diorama
  - uniform laminate shine or indiscriminate brush texture
  - unrequested frame, signature, number or certificate
