visualDna:
  aesthetic: 'Uneven Tessellation Fields: related pieces at two scales share complementary edges and a few orientations, covering the field with no gaps.'
  subject_treatment: Cover a surface with pieces based on the prompt's subject at two scales, with complementary edges and a few allowed orientations, leaving no accidental gaps.
  color_and_tone: Palette by piece family with enough contrast to inspect the edges.
  lighting_and_shadow: Flat geometric art, verified before any material rendering.
  texture_and_material: Exact shared edges made of clearly defined curves or straight segments.
  camera_and_composition: Uneven distribution of scales with neighbor rules and no central patch.
  atmosphere_and_mood: Irregularity with clear kinship, varied but never improvised.
  rendering_and_quality: Clean coverage with no overlaps or unauthorized gaps.
  creative_brief: "Uneven Tessellation Fields: related pieces at two scales share complementary edges and a few orientations, covering the field with no gaps. Carry it through two-scale pieces, complementary edges, limited rotations, full coverage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two-scale pieces; complementary edges; limited rotations; full coverage
