  lighting_and_shadow: Bright even studio light with colored fill, crisp shadows on painted sets.
  texture_and_material: Silk robes, lacquered wood, painted backdrops, stage dust kicked up by footwork.
  camera_and_composition: Wide staging for full-body action, sudden crash zooms onto faces, fighters mid-air or mid-strike.
