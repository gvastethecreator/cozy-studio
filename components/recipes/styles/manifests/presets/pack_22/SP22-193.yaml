visualDna:
  aesthetic: >-
    Broad soft-edged shapes use compact fiber texture and restrained layered contours, keeping the
    image graphic and its forms clearly identifiable.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep existing features legible and
    apply soft edge cues without redesigning the subject.
  color_and_tone: >-
    Keep the requested palette and color relationships. Use matte color areas and gentle contact
    shadows without shifting hues toward a preset craft palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use soft local shadows between existing forms
    without adding seams or raised edges everywhere.
  texture_and_material: >-
    Suggest a compact low-frequency fiber edge only where surface detail is useful. Preserve other
    requested materials and keep stitching selective rather than universal.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Soft layered edges do not add a frame,
    lettering or decorative layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Fiber texture is a surface cue, not a new subject or scene.
  rendering_and_quality: >-
    Establish simple contours and large color areas first, then add limited fiber detail. Keep edges
    compact and small features readable.
avoidRules:
  - stitching or fibers across every surface
  - softened contours that obscure identity
  - unrequested frame, lettering or layout
