visualDna:
  aesthetic: 'Day for night: a scene shot in daylight and underexposed, graded blue so it reads as moonlit night, with telltale hard sun shadows.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Deep blue-grey grade, dark sky, crushed shadows, faint color left in highlights.
  lighting_and_shadow: Hard sunlight used as "moonlight", sharp shadows and backlight glints that real moonlight would not give.
  texture_and_material: Sun glints on water and metal turned to cold silver.
  camera_and_composition: Keep the requested framing; sky darkened with a filter, no visible sun.
  atmosphere_and_mood: Uneasy and stylized, a night that feels too bright.
  rendering_and_quality: Classic film trick look; not a real low-light exposure.
  key_features: daylight underexposed; blue night grade; hard sun shadows; darkened sky; silver glints
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Day for Night as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
