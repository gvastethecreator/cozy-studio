visualDna:
  aesthetic: >-
    Screened print illustration in which a controlled dot or line lattice encodes continuous tones
    through changes in mark size and coverage rather than an added surface pattern.
  subject_treatment: >-
    Preserve the requested silhouette, proportions and recognizable detail. Let the screen resolve
    existing tonal forms instead of dissolving contours into generic dots.
  color_and_tone: >-
    Respect the requested palette and carry value through screen coverage within each ink. Keep light,
    middle and dark regions distinct without color fringing or crushed dot fields.
  lighting_and_shadow: >-
    Follow the requested illumination. Increase dot coverage through existing shadow planes and open
    the screen across lit areas, keeping transitions tied to the forms.
  texture_and_material: >-
    Keep the screen frequency and angle consistent within each printed ink, with dot size changing
    according to tone. Do not project the screen onto depicted materials or fill flat support with dots.
  camera_and_composition: >-
    Preserve framing and viewpoint. Maintain enough dot scale for the requested output size while
    keeping the focal silhouette and existing composition clear.
  atmosphere_and_mood: >-
    Retain the requested mood through contrast and screen density; the reproduction method does not
    imply a comic page, newspaper, poster or retro scene.
  rendering_and_quality: >-
    Resolve dot edges cleanly, avoid moire between screen angles and keep unprinted highlights open.
    The halftone must carry tonal information rather than sit as a uniform overlay.
avoidRules:
  - uniform dots over highlights and open support
  - moire patterns or uncontrolled screen angles
  - unrequested page frames or lettering
assets:
  defaultImage: /assets/recipes/styles/defaults/SP20-010.webp
attributes:
