visualDna:
  aesthetic: 'Weirdcore mood: off-putting low-fi uncanniness with odd framing and wrong details.'
  subject_treatment: "Keep the prompt's subject, setting and composition, and shift only the mood, palette and atmosphere: the image becomes low-fi, oddly framed and subtly wrong without adding text."
  color_and_tone: Oversaturated or washed low-fi colors, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Harsh flash or flat light, supporting the dream logic without adding stock props.
  texture_and_material: Low-resolution grain, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at a glance.
  atmosphere_and_mood: Disturbing, nostalgic, wrong and strange, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: low-fi wrongness; odd framing
  creative_brief: "Weirdcore mood: off-putting low-fi uncanniness with odd framing and wrong details. Carry it through low-fi wrongness, odd framing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
