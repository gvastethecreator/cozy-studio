visualDna:
  aesthetic: >-
    Source-informed video-game style router for original co-op cavern extraction captures:
    first-person cave traversal, mineral glow, team tools, creature pressure, drilling routes,
    extraction objective readability, and chunky stylized rock geometry. Borrow the co-op mining
    pressure of Deep Rock-like games, but land as a different fictional extraction crew with
    different suits, tools, creatures, UI icons, and cave motifs.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable cavern extraction screenshot
    subject: keep clear team/object/threat role, tool scale, route affordance, mineral/resource
    logic, and enemy spacing without copying source classes or creatures.
  color_and_tone: >-
    Use a basalt extraction palette: black rock, mineral cyan, hazard orange, worklight yellow,
    drill metal grey, fungus violet, and team-color accents. Keep value grouping legible in dark
    caves without pixel-art downgrade.
  lighting_and_shadow: >-
    Light the image through thrown flares, headlamps, muzzle flashes, mineral luminescence, zipline
    glow, and darkness swallowed by cave depth. Lighting must clarify the playable route, threat,
    focal subject, or objective and avoid generic cinematic bloom that destroys screenshot
    readability.
  texture_and_material: >-
    Build surfaces from chunky voxel-like rock, crystals, dirt, drills, armor plates, bug carapace,
    and industrial mining tools. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person tool/weapon camera, foreground mining or combat affordance, mid-ground
    teammate/objective, cave route depth, and extraction pressure. Avoid strategy overview and
    generic cave concept art.
  atmosphere_and_mood: >-
    Carry an original basalt crew mood: rowdy, hazardous, subterranean, cooperative, crunchy, and
    resource-hungry.
  rendering_and_quality: >-
    Finish as coherent first-person co-op extraction screenshot style, not pixel art and not concept
    art: ammo/tool pips, teammate markers, mineral/objective icons, and hazard cues can appear
    abstractly. Maintain heavy-denoise clarity and readable silhouettes.
  key_features: >-
    Deep Rock Galactic gameplay screenshots; first-person co-op mining shooter capture with dwarven
    silhouettes, dark caves, mineral glow, extraction pressure, and class-based readability; black
    cave, neon green minerals, orange flares, blue shield lights, red hazard glow, and dusty grey
    rock; thrown flares, headlamps, muzzle flashes, mineral luminescence, zipline glow, and darkness
    swallowed by cave depth; chunky voxel-like rock, crystals, dirt, drills, armor plates, bug
    carapace, and industrial mining tools; first-person combat-mining composition with weapon/tool
    foreground, tunnel routes, swarm lanes, and objective minerals; rowdy, cooperative,
    subterranean, dangerous, and workmanlike; HUD guidance: class HUD, ammo, flares, objective
    counter, teammate outlines, and extraction timer can appear coherently
  creative_brief: >-
    Use Basalt Crew Extraction as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through co-op cavern extraction references: first-person tools, mineral
    glow, cave routes, team spacing, creature pressure, and extraction objective readability. Avoid
    direct Deep Rock cloning, exact class silhouettes, readable mission UI, and retro pixel
    downgrade.
