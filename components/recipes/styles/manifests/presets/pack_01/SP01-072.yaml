visualDna:
  aesthetic: >-
    Tilt-Shift (Miniature) acts as a transferable photographic style router: begin from Miniature
    tilt-shift effect, Miniature effect, and technical capture system built from diagnostic optics,
    surveillance position, scientific sensor behavior, and evidence-grade readability, then apply
    the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Blur top and bottom; preserve prompt identity while translating
    it through device constraints, evidence logic, extreme scale, or diagnostic signal, keeping the
    original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Saturated; use palette as sensor output: thermal gradients, monochrome electron
    depth, CCTV compression, medical neutral color, or astrophotographic false color, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Daylight; make light come from device behavior, flash documentation, emissive heat,
    telescope exposure, glass reflections, or clinical illumination, preserving believable exposure,
    shadow density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Toylike surface crispness; render scan noise, compression, measurement surfaces, medical
    cleanliness, forensic detail, microtexture, or signal artifacts as capture evidence, avoiding
    both waxy smoothing and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Selective focus plane; compose through mounted POV, deadpan documentation,
    miniature focal bands, abstract cropping, evidence scale, or instrument framing, with lens
    distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Tiny, cute; derive mood from surveillance, diagnosis, evidence, scientific
    alienness, minimalism, procedural restraint, or technical unease, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Miniature diorama realism; finish with exact capture logic, readable signal,
    controlled artifacts, and no cinematic beauty-lighting overwrite, high-resolution photographic
    detail, and disciplined denoise without losing natural grain where the preset needs it.
  key_features: Miniature tilt-shift effect; Miniature effect; Saturated; Daylight; Selective focus plane
  creative_brief: >-
    Apply Tilt-Shift (Miniature) as a photographic preset over prompt X: preserve the user's
    requested subject, then route Miniature tilt-shift effect, Saturated, Daylight, Toylike surface
    crispness, and Selective focus plane through optics, exposure, palette, surface response,
    timing, and finish without requiring the card image's original subject.
