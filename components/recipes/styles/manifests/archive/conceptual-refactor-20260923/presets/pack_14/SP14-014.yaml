    repeatable spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Aegean Titan Judgment after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies aegean translated
