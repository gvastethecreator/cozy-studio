visualDna:
  aesthetic: >-
    Poetic Reflex Focus Style acts as a transferable anime-prestige router: a poetic anime direction
    shaped by era-aware line economy and genre tone, alongside a reflex anime direction shaped by
    era-aware line economy and genre tone; fuse it with sports and performance anime direction with
    kinetic timing, competitive psychology, body mechanics, rhythm, and impact clarity; it routes
    era, genre, line economy, cel or digital finish, and performance tone without locking prompt
    content to the source title or sample image.
  subject_treatment: >-
    Preserve the prompt subject, action, and context while restyling forms through micro-gesture
    precision and focused eye-line logic, alongside contours paced by poetic tension, readable pose
    energy, and silhouette discipline; identity should remain readable through anime contour,
    expression economy, pose energy, shape simplification, and effect hierarchy instead of a
    required canon character or title scene.
  color_and_tone: >-
    Map color through a poetic accent system held inside disciplined cel values, alongside a reflex
    accent system held inside disciplined cel values; anchor it in team color blocks, gym-light
    neutrals, night-race blues, stage glow, brass warmth, sweat highlights, and impact accents; keep
    value separation clean, cel flats intentional, accents purposeful, and palette behavior attached
    to the requested content.
  lighting_and_shadow: >-
    Use a poetic light logic using cel rim, glow behavior, and blocked shadow, alongside a reflex
    light logic using cel rim, glow behavior, and blocked shadow; combine it with arena-like cel
    light, spotlight cuts, reflective sweat, motion streaks, instrument gleam, and high-pressure rim
    highlights; shadows should read as anime light design, rims should clarify form, and glow or
    effects should support the prompt rather than replacing it.
  texture_and_material: >-
    Render cel paint and ink grain tuned to poetic material contrast, alongside cel paint and ink
    grain tuned to reflex material contrast; anchor surfaces in jersey fabric, skin highlight,
    rubber, polished floor, instrument brass, stage dust, road grit, and speed-line overlays; cel
    edges, painted surfaces, grain, cloth, metal, water, sweat, smoke, or atmosphere must stay
    coherent across people, objects, environments, action, and abstractions.
  camera_and_composition: >-
    Frame around poetic stillness, reflex focus, and off-center detail cuts, alongside anticipation
    spacing and reaction timing, then extend it with vertical rallies, diagonal breakaways, spin
    arcs, duel spacing, ensemble grouping, and precise impact timing; the style should support
    portraits, props, machines, performances, landscapes, symbols, and full scenes through reusable
    anime staging grammar instead of one fixed card layout.
  atmosphere_and_mood: >-
    Carry mood through quiet concentration and sensory precision, alongside reflex emotional
    pressure and genre-specific tone; braid it with rivalry, obsession, comeback grit, vulnerable
    performance, team trust, training method, and euphoric release; the preset can become funny,
    sensual, violent, quiet, tragic, romantic, or strange when prompt X asks for it while preserving
    the chosen anime lineage.
  rendering_and_quality: >-
    Finish with clean anime finishing that keeps poetic identity readable without noisy denoise,
    alongside clean anime finishing that keeps reflex identity readable without noisy denoise;
    enforce high-energy anime finish with clear motion, believable anatomy, denoised effects, and no
    sports-photo realism; prioritize clean denoise, stable anatomy or object structure, readable
    effects, controlled grain, no watermark, no fake text, no signature, and no photoreal or
    3D-render drift.
  key_features: >-
    a poetic anime direction shaped by era-aware line economy and genre tone, alongside a reflex
    anime direction shaped by era-aware line economy and genre tone; micro-gesture precision and
    focused eye-line logic, alongside contours paced by poetic tension, readable pose energy, and
    silhouette discipline; cel paint and ink grain tuned to poetic material contrast, alongside cel
