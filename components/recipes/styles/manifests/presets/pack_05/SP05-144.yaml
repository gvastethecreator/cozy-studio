visualDna:
  aesthetic: >-
    Build the graphic anime treatment from loose ink-brush contours with uneven, scratchlike
    breaks and relaxed flattened forms and offbeat asymmetrical blocks. Let syncopated pauses with
    a loose, delayed follow-through set its rhythm; use dusty gold, warm brown, and subdued
    blue-gray for color and fine vinyl-like scratches and dry print grain over warm flats for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use loose ink-brush contours with uneven,
    scratchlike breaks for edge work, relaxed flattened forms and offbeat asymmetrical blocks for
    form simplification, and syncopated pauses with a loose, delayed follow-through only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with dusty gold, warm brown, and subdued blue-gray. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: soft warm-cool bands with few hard shadow groups. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with fine vinyl-like scratches and dry print grain over warm flats,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use offbeat visual balance with relaxed weight on one
    side to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey unhurried swagger and easy rhythm, while preserving
    the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with warm dusty color, scratch texture, and deliberately uneven spacing; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    loose ink-brush contours with uneven, scratchlike breaks; relaxed flattened forms and offbeat
    asymmetrical blocks; dusty gold, warm brown, and subdued blue-gray; syncopated pauses with a
    loose, delayed follow-through; fine vinyl-like scratches and dry print grain over warm flats;
    offbeat visual balance with relaxed weight on one side.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with loose ink-brush
    contours with uneven, scratchlike breaks, relaxed flattened forms and offbeat asymmetrical
    blocks, and dusty gold, warm brown, and subdued blue-gray; use syncopated pauses with a loose,
    delayed follow-through only where movement is already present, and apply fine vinyl-like
    scratches and dry print grain over warm flats as the drawing finish.
