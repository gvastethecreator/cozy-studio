visualDna:
  aesthetic: 1990s action-romance anime cel with sharp angular features, long tapered strokes and everything, hair, cloth and grass, caught in one hard wind.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Pointed chins, narrow noses and hair and cloth swept in one direction; motion follows the prompt action and no battle is added.
  color_and_tone: Carmine red accents slicing through cool blue-grey and slate in high contrast.
  lighting_and_shadow: Hard directional edge light with crisp shadow breaks under one bright open sky.
  texture_and_material: Smooth fills with dry-brush wind streaks and tapered hatching along cloth folds.
  camera_and_composition: Keep the requested view; strong tilted diagonals and overlapping angled shapes carry the motion.
  atmosphere_and_mood: Emotionally forward and dramatic, longing carried on the wind.
  rendering_and_quality: Clear silhouettes, crisp edges and few but decisive tapered marks.
  key_features: carmine accents; angular 1990s features; one-direction wind sweep; long tapered strokes; tilted diagonals
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Carmine Angular Windswept Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
