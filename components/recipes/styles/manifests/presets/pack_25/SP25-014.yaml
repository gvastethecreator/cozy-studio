visualDna:
  aesthetic: 'Fold-Edge Insignia: changes of direction read as the edges of one folded sheet, the plane and its crease defining the sign.'
  subject_treatment: Form the prompt's subject from one broad sheet with a few changes of plane, letting folded edges rather than a band define the sign; set requested text exactly.
  color_and_tone: Two complementary plane values plus a silhouette that holds in solid black.
  lighting_and_shadow: Very limited optional shading, the fold edge always present in the flat construction.
  texture_and_material: Clean sheet with minimal visual thickness and deliberate crisp corners.
  camera_and_composition: Main plane facing the viewer, the second plane working as a counterweight.
  atmosphere_and_mood: Stability with a surprise at the edge, like a figure about to unfold.
  rendering_and_quality: Every drawn edge corresponds to a plane, with purposeful facets only.
  creative_brief: "Fold-Edge Insignia: changes of direction read as the edges of one folded sheet, the plane and its crease defining the sign. Carry it through folded sheet, crease edges, two-plane contrast, counterweight plane. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: folded sheet; crease edges; two-plane contrast; counterweight plane
