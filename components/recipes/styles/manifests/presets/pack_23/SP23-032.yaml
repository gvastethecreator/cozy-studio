visualDna:
  aesthetic: >-
    A matte, painted-image quality is translated into compressed values, selective detail and visible
    dither. Keep the marks tied to form and lighting instead of applying a single noise texture over
    the whole image.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, anatomy, action and proportions. Simplify
    existing forms through selective painted value groups without deforming anatomy, changing wardrobe
    or adding a weapon, role or scene.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. Compress transitions into a modest set of
    painted values while keeping all specified colors; do not impose monochrome or a fixed hardware
    palette.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow shape. Translate existing transitions into
    visible, restrained dither and compressed painted values without inventing a new light source.
  texture_and_material: >-
    Keep a matte visual finish and selective surface detail. The paint-like treatment describes the
    rendering, not a physical coating; preserve each requested material and avoid global grain or
    uniform noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, scale and arrangement. Do not impose a game
    screenshot, scene, interface or framing convention.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. This rendering treatment does not transfer any source
    setting, period or narrative to an unrelated subject.
  rendering_and_quality: >-
    Ensure forms and volume remain intentional when residual dither is reduced. Keep detail selective,
    values compact and texture subordinate to the subject rather than dissolving it into noise.
avoidRules:
  - unrequested anatomy or wardrobe changes
  - unrequested weapons, characters or narrative setting
  - forced monochrome or fixed historical palette
  - global grain, noise or dither that obscures intentional form
