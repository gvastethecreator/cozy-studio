visualDna:
  aesthetic: 'Blotted line transfer: lines drawn in wet ink on non-absorbent paper and pressed onto a second sheet, leaving broken, beaded and slightly doubled contours.'
  subject_treatment: Render the prompt's subject as transferred ink lines that break into beads and gaps, then add flat color shapes so it stays recognizable.
  color_and_tone: Black blotted lines with optional flat hand-applied color areas in slightly offset positions.
  lighting_and_shadow: No modeled light; the broken line and flat color shapes carry the whole image.
  texture_and_material: Beaded dotted contours, uneven ink pickup, faint doubled ghost lines and flat color fills off register.
  camera_and_composition: Clear graphic placement of the subject on a pale ground, often centered and illustrative.
  atmosphere_and_mood: Playful, stylish and slightly nostalgic, like a mid-century illustration.
  rendering_and_quality: Authentic broken transfer lines, never clean continuous vector strokes.
  creative_brief: "Blotted line transfer: lines drawn in wet ink on non-absorbent paper and pressed onto a second sheet, leaving broken, beaded and slightly doubled contours. Carry it through beaded broken lines, ghost doubles, offset flat color, pale ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: beaded broken lines; ghost doubles; offset flat color; pale ground
