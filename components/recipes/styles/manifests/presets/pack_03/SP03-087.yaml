visualDna:
  aesthetic: 'Baked lightmap mobile render: a low-poly game scene whose light and shadow are painted into textures in advance, with vertex colors and unlit fake glows.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Warm saturated vertex colors, soft baked shadows, glow cards around lamps.
  lighting_and_shadow: Static baked soft shadows and ambient occlusion; nothing moves with the light.
  texture_and_material: Low-poly shapes, low-res textures, blurry lightmap seams, simple alpha foliage cards.
  camera_and_composition: Isometric or three-quarter game camera over a compact scene.
  atmosphere_and_mood: Cozy and toy-like, a pocket world that runs anywhere.
  rendering_and_quality: Mobile game render look; no real-time GI and no HUD.
  creative_brief: "Baked lightmap mobile render: a low-poly game scene whose light and shadow are painted into textures in advance, with vertex colors and unlit fake glows. Carry it through baked soft shadows, low-poly shapes, vertex color warmth, glow cards, lightmap seams. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: baked soft shadows; low-poly shapes; vertex color warmth; glow cards; lightmap seams
