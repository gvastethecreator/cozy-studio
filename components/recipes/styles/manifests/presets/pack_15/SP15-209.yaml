visualDna:
  aesthetic: 'Alpinepunk: villages and monasteries on impossible mountain peaks, with cable-car towns, avalanche walls, prayer-flag bridges and climbers who never come down.'
  subject_treatment: Keep the prompt's subject and setting; perch it on steep snowy peaks with cable lines, stone walls and thin clouds below.
  color_and_tone: Snow white, granite grey and deep sky blue with bright flag colors and warm wood.
  lighting_and_shadow: Crisp high-altitude sun with deep blue shadows and clouds glowing below.
  texture_and_material: Granite, packed snow, ice, weathered timber, steel cable and wool.
  camera_and_composition: Dizzying high views with peaks above clouds and cable cars crossing between.
  atmosphere_and_mood: Thin-aired, spiritual and daring, a people living above the clouds.
  rendering_and_quality: Crisp bright illustration with sharp ridges and clear atmospheric depth.
  creative_brief: "Alpinepunk: villages and monasteries on impossible mountain peaks, with cable-car towns, avalanche walls, prayer-flag bridges and climbers who never come down. Carry it through cable-car towns, peaks above clouds, avalanche walls, prayer-flag bridges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cable-car towns; peaks above clouds; avalanche walls; prayer-flag bridges
