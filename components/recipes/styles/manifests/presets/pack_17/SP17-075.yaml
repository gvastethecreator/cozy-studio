visualDna:
  aesthetic: >-
    Abrasive fantasy print built from a few hard stencil masks, opaque ink fields, and slight
    overspray at selected edges. The stencil layers define the mark language, not a fixed flyer scene.
  subject_treatment: >-
    Preserve the requested subject, silhouette, action, count, and distinctive features. Translate
    forms into a small hierarchy of connected mask shapes and reserve gaps for important details.
  color_and_tone: >-
    Preserve explicit palette choices. If none are specified, use near-black and bone with one
    aggressive pigment accent; keep the number of flat colors low and separate their value roles.
  lighting_and_shadow: >-
    Follow the requested lighting. Describe form with discrete mask-shaped shadows and a few clean
    highlights; overspray is a surface mark, not a new light source or aura.
  texture_and_material: >-
    Use crisp masked boundaries with only sparse spray feathering or ink skips. Keep the print wear
    on the reproduction layer and retain the actual material of the depicted objects.
  camera_and_composition: >-
    Preserve the requested framing, view, and spatial relationships. Stencil shapes must follow the
    given layout without adding a title band, border, emblem, or centered icon.
  atmosphere_and_mood: >-
    Let sharp color blocks, uneven edges, and open gaps reinforce the requested tone. Do not invent
    rebellion, danger, ritual, or a particular dungeon event.
  rendering_and_quality: >-
    Keep each pigment layer legible, silhouettes clean at small scale, and overspray controlled.
    Avoid gradients, photographic dirt, and muddy merges between mask shapes.
avoidRules:
  - unrequested props, emblems, or occult marks
  - fixed flyer, badge, or title layout
  - broad airbrush gradients
  - overspray that hides silhouette or detail
  - distressed wear on the depicted material
