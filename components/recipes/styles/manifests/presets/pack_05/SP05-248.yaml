visualDna:
  aesthetic: "Manga-derived cel painting with a naturalist's eye: fine brown pen lineart describing joints, scales, seams and grain over flat earthy fills with cutaway-diagram clarity."
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Functional structure is spelled out, how a hinge, shell or knot works, with selective detail on the focal object; never add a kitchen, meal or creature carcass.
  color_and_tone: Earthy moss green, ochre, rust and warm paper neutrals in a mid key, lightly saturated, with small notes of lichen blue.
  lighting_and_shadow: Even overcast light with a warm reflected bounce under forms and a single cool shadow tone; no dramatic sources.
  texture_and_material: Pen hatching on shadowed planes, stippled organic surfaces and visible paper tooth under flat watercolor-like fills.
  camera_and_composition: Keep the requested view; the focal object is centered like a specimen plate with a generous margin and clear overlaps.
  atmosphere_and_mood: Curious, grounded and companionable, the pleasure of understanding how things work.
  rendering_and_quality: Crisp pen detail on the focal form and simpler blocks beyond it; every mark explains structure rather than decorating.
  key_features: fine brown pen lineart; specimen-plate clarity; earthy moss and ochre fills; stippled organic texture; warm reflected bounce
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Naturalist Sketchbook Anime Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
