visualDna:
  aesthetic: >-
    A dramatic anime composition shaped by opposing visual masses, rising diagonals and
    clean digital linework.
  subject_treatment: >-
    Keep the requested identities and actions. Emphasize clear silhouettes and directional
    gestures while keeping subject count unchanged.
  color_and_tone: >-
    Follow the specified palette; when open, use deliberate value contrast rather than a
    fixed color scheme.
  lighting_and_shadow: >-
    Use grouped shadow and selective edge highlights to separate opposing forms while
    keeping existing light sources intact.
  texture_and_material: >-
    Use economical ink contours and integrate painted backgrounds; render only the materials
    the prompt names.
  camera_and_composition: >-
    Preserve the requested camera. Arrange existing masses along upward diagonals with
    defiant spacing only when the composition supports it.
  atmosphere_and_mood: >-
    Grand tension or defiance may follow the prompt's own mood.
  rendering_and_quality: >-
    Keep silhouette hierarchy strong and background transitions soft enough to preserve
    depth and legibility.
  key_features: >-
    Opposing masses; rising diagonals; defiant spacing; clean contours and grouped shadow.
  creative_brief: 'Use opposing shape masses and upward diagonals as compositional treatment, not as a new scene. Preserve the requested action, viewpoint and tone. Use it as a reusable look on any subject.'
