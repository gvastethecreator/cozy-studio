visualDna:
  aesthetic: >-
    Mortal Kombat 1 (2023) visual direction translated into polished painted illustration:
    naturalistic athletic anatomy, ornate martial tailoring, lush ceremonial color and precise
    theatrical action.
  subject_treatment: >-
    Preserve explicit identity and action. Show poised, physically committed gestures, elegant
    asymmetrical fabric shapes and clean costume accents; supernatural color accents follow the
    action when appropriate.
  color_and_tone: >-
    Rich jade, royal blue, vermilion, warm skin and brushed gold against luminous scenic color.
    Avoid the uniformly gritty brown treatment of older fighting games.
  lighting_and_shadow: >-
    Bright cinematic key light and cool fill define athletic forms; small localized emissive accents
    coexist with readable daylight or jewel-toned ambience.
  texture_and_material: >-
    Fine woven cloth, embossed trims, brushed metal and taut skin; contrast delicate ceremonial
    finish with disciplined physical force.
  camera_and_composition: >-
    A legible arc of action and an offset balancing shape, with ornamental depth behind the subject.
    Explicit framing stays intact; no obligatory two-fighter game plane.
  atmosphere_and_mood: >-
    Regal spectacle and immediate martial danger, luxurious and vivid rather than monochrome
    grimdark.
  rendering_and_quality: >-
    Polished naturalistic digital painting with precise anatomy and rich controlled color; painted
    key art, not anime cel shading or a glossy fashion photograph.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
