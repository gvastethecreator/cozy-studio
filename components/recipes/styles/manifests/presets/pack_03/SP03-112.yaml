visualDna:
  aesthetic: 'Fine watchmaking macro: the subject built from a miniature mechanical movement of polished bridges, toothed wheels, ruby jewel bearings and blued screws.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; rebuild it as a miniature mechanical watch movement of bridges, wheels and jewel bearings that follows its silhouette (a declared construction change), delivered as one hero image, never a multi-view sheet.
  color_and_tone: Rhodium silver and warm gold bridges, deep red jewels and heat-blued steel screws against a dark ground.
  lighting_and_shadow: Small ring and strip lights create crisp highlights on the bevels and sweeping bands across the decorated plates.
  texture_and_material: Striped and circular-grained plate finishing, mirror-polished beveled edges, fine gear teeth and hairspring coils.
  camera_and_composition: Macro lens at close focus with shallow depth, one wheel or the balance held in sharp focus.
  atmosphere_and_mood: Meticulous and hushed, the heartbeat of a tiny machine.
  rendering_and_quality: Microscopic finishing detail rendered cleanly, with no dial numerals, engraved words or maker marks.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Horology Macro Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: polished bridges and gears; ruby jewel bearings; blued screws; striped and grained plate finishing; macro shallow depth
