visualDna:
  aesthetic: 'Telephoto street compression: a 300–600 mm lens from far away, stacking distant layers so near and far press into one flat wall.'
  subject_treatment: Keep the prompt subject, action and setting; this preset owns the camera position and lens, so re-stage only the viewpoint as described.
  color_and_tone: Muted, slightly hazy color from the air between camera and subject; shapes over detail.
  lighting_and_shadow: Backlight or side light through atmosphere; heat shimmer and haze soften far planes.
  texture_and_material: Repeated shapes stacking (roofs, heads, cloaks, chimneys) into dense pattern.
  camera_and_composition: Extremely narrow field of view, flattened depth, huge background objects (sun, moon, towers) looming behind small subjects, shallow focus on one layer.
  atmosphere_and_mood: Crowded and dreamlike, distance collapsed so everything seems to press together.
  rendering_and_quality: Long-lens rendering with atmospheric softness; no wide-angle perspective lines.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Telephoto Compression Street as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: extreme telephoto compression; stacked layers; giant background sun or moon; heat haze; flattened depth
