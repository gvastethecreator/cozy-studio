visualDna:
  aesthetic: 'Digitized actor sprite: early-nineties game sprites made from photographed costumed actors, low-resolution photo pixels with harsh cutout edges and limited colors.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; show the subject as a digitized costumed photo cut out into a low-res sprite.
  color_and_tone: Photographic colors reduced to a limited palette, kept consistent across the whole image.
  lighting_and_shadow: Flat studio lighting from the original photo shoot.
  texture_and_material: Photo pixels, jagged cutout edges and costume fabric.
  camera_and_composition: Full-body figure on a painted fantasy backdrop, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with earnest low-budget spectacle.
  rendering_and_quality: Authentic low-res digitized look with jagged edges, kept consistent across the whole image.
  creative_brief: "Digitized actor sprite: early-nineties game sprites made from photographed costumed actors, low-resolution photo pixels with harsh cutout edges and limited colors. Carry it through photographed actor, jagged cutout, limited palette, painted backdrop. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
