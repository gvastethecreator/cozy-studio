visualDna:
  aesthetic: 'Daytime soap opera: high-gloss video with heavy diffusion, melodramatic close-ups and slow zooms onto shocked faces.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Warm glowing skin, creamy highlights, soft pastel interiors, bloom around every light.
  lighting_and_shadow: Soft frontal key, strong backlight halo on hair, diffusion filter spreading highlights.
  texture_and_material: Silk, satin, polished wood and chandeliers, all rendered with video smoothness.
  camera_and_composition: Tight close-ups and two-shots, slow push-ins, one face turned toward the lens.
  atmosphere_and_mood: Melodramatic and glossy, a secret about to be revealed.
  rendering_and_quality: High-frame-rate video gloss with diffusion bloom; no film grain.
  key_features: diffusion bloom; hair backlight halo; melodramatic close-up; slow push-in; video gloss
  creative_brief: "Daytime soap opera: high-gloss video with heavy diffusion, melodramatic close-ups and slow zooms onto shocked faces. Carry it through diffusion bloom, hair backlight halo, melodramatic close-up, slow push-in, video gloss. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
