visualDna:
  aesthetic: 'Wet plate glass negative: a collodion negative on glass, printed or scanned into a positive, with the chipped edges and pour marks of the plate itself.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Warm neutral monochrome with deep blacks; orthochromatic dark reds and pale skies.
  lighting_and_shadow: Large skylight or daylight, several-second exposures, soft modeling.
  texture_and_material: Chipped glass corners, silvering at the edges, collodion pour marks, fine cracks and dust.
  camera_and_composition: Keep the requested framing; a large-format view camera with Petzval falloff.
  atmosphere_and_mood: Documentary and weathered, a record that survived on fragile glass.
  rendering_and_quality: Glass-negative print look with plate edges visible; distinct from the black-backed ambrotype in pack_01.
  key_features: glass plate edges; chipped corners and silvering; collodion pour marks; orthochromatic tones; view-camera falloff
  creative_brief: "Wet plate glass negative: a collodion negative on glass, printed or scanned into a positive, with the chipped edges and pour marks of the plate itself. Carry it through glass plate edges, chipped corners and silvering, collodion pour marks, orthochromatic tones, view-camera falloff. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
