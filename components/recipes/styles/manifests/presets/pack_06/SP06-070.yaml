visualDna:
  aesthetic: 'Pinned planning board: sketches, prints and index cards about the subject pinned to cork and linked by colored thread in a hopeful working plan.'
  subject_treatment: Keep the prompt subject as the hero of the arrangement with its identity, clothing and anatomy unchanged; this preset owns the cork planning-board layout of pinned cards, prints and linking thread.
  color_and_tone: Warm cork brown, cream cards and white prints, with two or three thread and pushpin colors coding the plan.
  lighting_and_shadow: Soft window light from one side; pins and curled cards cast small crisp shadows on the cork.
  texture_and_material: Granular cork, curled index cards, glossy prints, pencil sketches, pushpins and taut cotton thread.
  camera_and_composition: Frontal board view; the largest pinned image of the subject at center, thread radiating to smaller steps around it.
  atmosphere_and_mood: Hopeful and busy, a plan still taking shape.
  rendering_and_quality: Readable layering, taut thread lines and clear pinned depth; no legible notes.
  key_features: cork board; pushpins; index-card sketches; colored thread links; central hero print
  creative_brief: "Pinned planning board: sketches, prints and index cards about the subject pinned to cork and linked by colored thread in a hopeful working plan. Carry it through cork board, pushpins, index-card sketches, colored thread links, central hero print. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
