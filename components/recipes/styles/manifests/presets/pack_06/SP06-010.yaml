visualDna:
  aesthetic: 'Pointillist dot painting: the whole image built from small round dots of pure color placed side by side so the eye mixes them at a distance.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Pure unmixed dots in complementary pairs, orange against blue, red against green; mid-tones made by interleaving two colors rather than blending them.
  lighting_and_shadow: 'Clear daylight with luminous haloes: lighter dots gather along a form where it meets a dark area, darker dots where it meets a light one.'
  texture_and_material: Uniform small dots of slightly raised oil paint on a white ground, dot size constant across the picture.
  camera_and_composition: Keep the requested framing; forms become calm, geometric silhouettes with stiff, orderly contours.
  atmosphere_and_mood: Still, shimmering and orderly, a moment frozen in bright air.
  rendering_and_quality: No strokes, lines or blended areas at all; every value produced by dot density and color pairing.
  key_features: uniform dots of pure color; complementary color pairs; optical mixing; contrast haloes at edges; stiff geometric silhouettes
  creative_brief: "Pointillist dot painting: the whole image built from small round dots of pure color placed side by side so the eye mixes them at a distance. Carry it through uniform dots of pure color, complementary color pairs, optical mixing, contrast haloes at edges, stiff geometric silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
