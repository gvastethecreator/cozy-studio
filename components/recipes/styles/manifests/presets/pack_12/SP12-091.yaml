visualDna:
  aesthetic: >-
    Mortal Kombat 1 (2023) polished real-time fighting-game frame with naturalistic fighters, ornate
    martial costume, jewel-toned scenery and precisely readable side-on action.
  subject_treatment: >-
    Preserve requested fighter identities and action while giving each a distinct martial
    silhouette: close-fitted layered tunics, crossed torso panels, segmented bracers, reinforced
    boots, varied collars or combat masks, and readable athletic anatomy. Assign equipment and
    supernatural power design by character role instead of dressing everyone in smooth wuxia robes.
    Include a secondary assist fighter only when requested.
  color_and_tone: >-
    Distinct fighter color identities—such as crimson and black, icy blue and steel, or ivory and
    dark violet—separate against lush jewel-toned stage scenery and luminous natural skies. Honor
    explicit colors. Avoid reducing the entire roster to jade, gold silk and amber magic.
  lighting_and_shadow: >-
    Use stage lighting that shapes bodies and action while keeping silhouettes and contact points
    readable. Do not add fatality lighting or effects unless requested.
  texture_and_material: >-
    Differentiate stitched woven fabric, folded leather bindings, satin accent panels, fitted
    engraved metal and natural skin under 2023 real-time stage lighting. Concentrate ornament at
    functional collars, bracers and belts; retain large costume color blocks rather than covering
    everything with gold filigree or making it generic robe fabric.
  camera_and_composition: >-
    Use a side-on fighting plane with enough horizontal room to show the active pair, their spacing
    and the ground line. Keep the playfield level and action readable; do not turn the frame into a
    third-person camera or cinematic close-up.
  atmosphere_and_mood: >-
    Show a plausible exchange, wind-up or recovery beat. Match the requested intensity and do not
    force gore, a finishing move or a tournament narrative.
  rendering_and_quality: >-
    Use high-detail, semi-realistic 3D game-character rendering: sculpted anatomy, textured skin,
    stitched and wrapped cloth, scuffed hard armor, and sharp impact lighting. Keep power effects
    compact and tied to a visible hit or block.
avoidRules:
  - >-
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
    unrequested named roster characters, copied exact arenas or signature fatalities; retain the
    reference game costume and equipment design vocabulary
  - switching the match plane to third-person roaming or a 2D pixel treatment
  - unrequested gore, move names, round text or fabricated health bars
  - key-art posing that hides playable spacing
