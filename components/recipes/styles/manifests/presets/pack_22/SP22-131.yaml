visualDna:
  aesthetic: >-
    Story illustration builds compact forms from soft, dry-material texture, combining chalk-like edges
    with brief line accents instead of crisp vector contours.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep the soft texture within form
    boundaries and retain the contours needed to recognize the subject.
  color_and_tone: >-
    Maintain broad value separation and use the palette requested by the user. Do not force desaturation
    or a limited childlike color scheme.
  lighting_and_shadow: >-
    Follow the requested lighting direction and contrast. Use the material's soft marks to shape shadows
    without adding haze or a new light source.
  texture_and_material: >-
    Let velvet-like grain show most in midtones and remain controlled within each painted form. Do not
    make a uniform paper texture or erase actual material differences.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Chalk texture does not require
    a page layout or altered subject arrangement.
  atmosphere_and_mood: >-
    Keep the requested mood. Dry texture and story illustration do not prescribe childishness or a
    particular narrative.
  rendering_and_quality: >-
    Combine chalky edges with short, selective line accents. Keep shapes complete and textured, avoiding
    both vector-clean fills and grain that overwhelms the midtones.
avoidRules:
  - forced palette desaturation
  - vector-clean fills
