visualDna:
  aesthetic: 'Architectural visualization raytrace: interiors and buildings rendered with sun-and-sky daylight, clean glass and a warm neutral exposure for presentations.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Warm neutral whites, honey wood, soft blue sky, compressed highlights in windows.
  lighting_and_shadow: Physical sun and sky through large windows, soft bounce filling rooms, crisp window shadows on floors.
  texture_and_material: Oak, concrete, linen, clear and frosted glass, polished stone with blurred reflections.
  camera_and_composition: Two-point perspective with straight verticals, wide lens at eye height.
  atmosphere_and_mood: Serene and aspirational, a space waiting to be lived in.
  rendering_and_quality: Clean archviz render with no clutter and no oversaturated HDR look.
  key_features: sun and sky through big windows; straight verticals; warm neutral exposure; polished stone reflections; clean glass
  creative_brief: "Architectural visualization raytrace: interiors and buildings rendered with sun-and-sky daylight, clean glass and a warm neutral exposure for presentations. Carry it through sun and sky through big windows, straight verticals, warm neutral exposure, polished stone reflections, clean glass. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
