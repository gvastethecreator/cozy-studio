visualDna:
  aesthetic: >-
    Brush ink carves volume from large dark groups and open reserves, using defined brush edges and a
    few dry marks instead of dense hatching.
  subject_treatment: >-
    Preserve the requested identity, pose, action and scene. Describe existing forms with light reserves
    and dark masses without adding a genre role or crime-related detail.
  color_and_tone: >-
    Keep any requested colors and accents. Let deep ink provide contrast without applying an automatic
    monochrome filter over specified hues.
  lighting_and_shadow: >-
    Follow the requested lighting and place dark brush groups according to its direction; do not invent
    night lighting, a rim source or a dramatic glow.
  texture_and_material: >-
    Favor solid ink shapes, defined brush edges and a few dry marks; retain material differences through
    selective mark-making and avoid dense crosshatching.
  camera_and_composition: >-
    Maintain the requested viewpoint, crop, framing and relative placement. Value contrast follows the
    existing composition rather than creating a new silhouette or setting.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. High contrast describes the forms and does not imply a
    nighttime city, crime scene or particular costume.
  rendering_and_quality: >-
    Separate the large dark masses from clear reserves, with deliberate brush boundaries and restrained
    detail; keep the image readable at reduced size.
avoidRules:
  - unrequested crime, night setting or costume cues
  - forced monochrome over a specified color palette
