    characters, creatures, objects, vehicles, environments, symbols, or full scenes without one
    required card layout.
  atmosphere_and_mood: >-
    Carry mood through uncanny compassion, humid care, biological intimacy, ecological intelligence,
    soft dread, and experimental tenderness; the tone may become adult, romantic, violent, comic,
    sensual, eerie, civic, or strange when prompt X asks, while the punk family remains legible.
  rendering_and_quality: >-
    Finish with denoised biopunk illustration with controlled organic texture, readable anatomy or
    object structure, and no gore-shock shortcut; prioritize clean denoise, bold readable shapes,
    controlled grit, prompt preservation, no watermark, no readable text, and no generic concept-art
