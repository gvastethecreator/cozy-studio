visualDna:
  aesthetic: 'Segmented Instrument Glyphs: icons built from a limited vocabulary of straight shared segments with constant joints, like discrete instrument displays.'
  subject_treatment: Construct the prompt's subject or requested actions from a small set of straight segments with steady joints, building true metaphors rather than numbers.
  color_and_tone: One solid ink on a continuous ground, with unlit segments shown only when states are asked for.
  lighting_and_shadow: Flat segments whose segmented character lives entirely in the form.
  texture_and_material: Consistent segment ends and visible joints even at small sizes.
  camera_and_composition: Segments assigned by function rather than forced into one fixed matrix.
  atmosphere_and_mood: Discrete technical rhythm with regular pauses that never block meaning.
  rendering_and_quality: Each segment maps to a real part of the symbol.
  creative_brief: "Segmented Instrument Glyphs: icons built from a limited vocabulary of straight shared segments with constant joints, like discrete instrument displays. Carry it through shared straight segments, steady joints, display vocabulary, true metaphors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared straight segments; steady joints; display vocabulary; true metaphors
