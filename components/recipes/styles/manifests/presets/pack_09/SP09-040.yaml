visualDna:
  aesthetic: 'Oil stains: dark glossy oil and grease stains soaking into the target.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: dark glossy oil and grease stains soak into the surfaces with iridescent edges. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Black-brown stains with iridescent sheen, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Hard light for glossy spots, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Oil stains, grease smears and iridescent film, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Mechanical, gritty, working and dirty, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: oil stains; grease smears; iridescent film; surface-level damage; structure intact
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Oil Stains as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
