visualDna:
  aesthetic: 'Open-Frame Wordmarks: chosen parts of the letter outlines stay open while rhythm and proportion keep the exact word readable.'
  subject_treatment: Set the requested word exactly and open selected terminals or joins, keeping enough distinctive strokes that every character stays itself.
  color_and_tone: One ink on a continuous ground, each letter complete through structure alone.
  lighting_and_shadow: Flat rendering, with the openings left clean and the contours implied by rhythm.
  texture_and_material: Clean graphic strokes with consistent opening size tuned per scale.
  camera_and_composition: Steady baseline and word rhythm, openings spread so they never form a stripe.
  atmosphere_and_mood: Deliberate lightness and continuity by suggestion, never fragile to read.
  rendering_and_quality: The word stays recognizable when reduced, and no opening creates a different letter.
  creative_brief: "Open-Frame Wordmarks: chosen parts of the letter outlines stay open while rhythm and proportion keep the exact word readable. Carry it through open letter outlines, exact word, spread openings, light rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: open letter outlines; exact word; spread openings; light rhythm
avoidRules:
  - ambiguous characters
