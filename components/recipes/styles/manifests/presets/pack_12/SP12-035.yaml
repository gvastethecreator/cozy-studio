visualDna:
  aesthetic: >-
    Source-informed video-game style router for original vertical defense deckbuilder captures:
    stacked lane combat, infernal lift floors, monster units, card hand silhouettes, resource pips,
    and readable defense choices. Borrow the vertical lane logic of Monster Train-like games, but
    land as a different fictional deck-defense game with different vehicle/structure logic, unit
    silhouettes, UI frames, symbols, and floor anatomy.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable stacked deck-defense screenshot
    subject: keep clear unit/object role, lane position, floor hierarchy, incoming threat, resource
    pressure, and interaction affordances without copying source characters or named IP elements.
  color_and_tone: >-
    Use a vertical defense deckbuilder palette: infernal red, parchment beige, icy blue, gold UI
    trim, purple monster magic, black iron, ember orange, and siege-shadow grey. Keep value grouping
    legible at gameplay distance, with color accents behaving like lane pressure, danger, resource,
    team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through card glow, furnace or lift-core light, spell bursts, impact flashes, and
    clean floor separation. Lighting must clarify lane hierarchy, incoming threat, focal unit, or
    defensive objective and avoid generic cinematic bloom that destroys board readability.
  texture_and_material: >-
    Build surfaces from illustrated unit tokens, chunky lane sprites, custom UI frames, metal lift
    platforms, siege machinery, chains, furnace metal, and painterly fantasy effects. Materials
    should feel like in-engine game assets captured during play, with enough texture identity to
    separate units, lanes, hazards, and interactables.
  camera_and_composition: >-
    Compose with 2D stacked-board hierarchy: multiple defended floors or lift decks, card
    silhouettes at bottom, enemy intent icons, resource pips, and one clear defensive decision. All
    card and UI markings must stay wordless and numberless.
  atmosphere_and_mood: >-
    Carry an original infernal decklift mood: strategic, hellish, playful, crunchy, siege-like, and
    board-game readable.
  rendering_and_quality: >-
    Finish as coherent in-engine vertical deck-defense screenshot style, not concept art: card hand,
    resource pips, draw pile, unit state icons, and floor indicators are core, but no readable card
    text, no stat numbers, no exact train-floor UI, and no fake logos. Maintain heavy-denoise
    clarity and crisp focal hierarchy.
  key_features: >-
    original vertical defense deckbuilder gameplay screenshots; stacked lane combat; infernal lift
    floors; monster or unit tokens; card hand silhouettes; resource pips; readable defense choices;
    infernal red, parchment beige, icy blue, gold trim, purple magic, black iron; furnace light and
    floor separation; 2D stacked-board hierarchy with defended floors, enemy intent icons, resource
    pips, and one clear defensive decision; HUD guidance: wordless card hand, resource pips, draw
    pile, unit state icons, and floor indicators only
  creative_brief: >-
    Use Infernal Decklift Defense as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through vertical defense deckbuilder references: stacked lane camera,
    card-hand grammar, resource pressure, infernal vehicle/structure surfaces, and readable board
    state. Avoid menus, logos, exact characters, exact levels, direct Monster Train cloning,
    readable text, and stat numbers.
