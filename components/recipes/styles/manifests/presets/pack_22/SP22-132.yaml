visualDna:
  aesthetic: >-
    Painted poster illustration condenses volume into highly readable shapes, decisive brush marks and
    contrast-led contours, with a restrained suggestion of print reproduction.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify secondary forms while keeping
    the main subject's structure and defining features clear.
  color_and_tone: >-
    Establish focal and secondary color areas with clear value hierarchy. Respect the requested palette
    rather than imposing a fixed poster scheme.
  lighting_and_shadow: >-
    Follow the requested lighting. Use contrast to organize readable forms without adding dramatic light
    or changing the depicted time and mood.
  texture_and_material: >-
    Use painted marks with moderate, restrained print-like variation. Do not impose a paper stock, border
    finish or physical card treatment.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not impose lettering, a
    poster layout, dramatic diagonals or multiple scenes unless requested.
  atmosphere_and_mood: >-
    Keep the requested tone and setting. Poster-like clarity does not add a cast, story beat or dramatic
    atmosphere.
  rendering_and_quality: >-
    Keep the focal forms highly legible with decisive brushwork and contrast edges. Simplify secondary
    areas without introducing typographic or layout elements into the illustration.
avoidRules:
  - unrequested poster lettering or credits
  - unrequested multi-scene restaging
