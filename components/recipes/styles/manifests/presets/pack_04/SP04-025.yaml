visualDna:
  aesthetic: 'Felt-tip marker drawing: broad water-based marker strokes that streak, overlap into darker mixes and bleed slightly into cheap paper.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Saturated marker gamut, hot pink, lime, cyan and orange, darker where strokes overlap.
  lighting_and_shadow: Minimal modeling; a second pass of the same marker makes the shadow.
  texture_and_material: Parallel stroke streaks, bleed halos at edges, dried-out marker gaps and a few smudges.
  camera_and_composition: Loose gestural perspective, simple figures with bold outlines drawn in black marker.
  atmosphere_and_mood: Casual, energetic and improvised, drawn fast at the kitchen table.
  rendering_and_quality: Visible hand-speed decisions and streaky fills; no paint, no smooth gradients.
  key_features: streaky marker fills; overlap darkening; bleed halos; black marker outlines; saturated hot palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Felt Tip Marker as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
