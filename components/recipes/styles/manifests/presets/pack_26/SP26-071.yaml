  aesthetic: 'Chip Kidd book jacket look: witty conceptual design, a single clever object or photo, bold graphic type integrated with the image and playful visual puns.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; turn the subject into one clever conceptual object or photographic pun. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold flat background color with one striking image.
  lighting_and_shadow: Clean studio product light on the object, lit the way Chip Kidd lights its scenes.
  texture_and_material: Crisp photographic or graphic print on jacket paper.
  camera_and_composition: Centered conceptual image with integrated type, framed the way Chip Kidd composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with witty conceptual cleverness.
  rendering_and_quality: Witty conceptual jacket design, in the recognizable hand of Chip Kidd.
  creative_brief: "Chip Kidd book jacket look: witty conceptual design, a single clever object or photo, bold graphic type integrated with the image and playful visual puns. Carry it through Chip Kidd concept, visual pun, integrated type, bold color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
