visualDna:
  aesthetic: 'Backlit silhouette lighting: the light source behind the subject, exposure set for the bright background so the subject falls to a black shape.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Luminous background color — sky, fire, fog or window — with a black subject.
  lighting_and_shadow: Strong backlight only; thin halo where light wraps edges; no front fill at all.
  texture_and_material: 'Detail lives in the glowing background: haze, clouds, sparks or dust.'
  camera_and_composition: Keep requested framing; separate the subject outline from other dark shapes against the brightest area.
  atmosphere_and_mood: Iconic and mysterious, meaning carried by outline, gesture and negative space.
  rendering_and_quality: Pure black shape without muddy detail; smooth bright background gradient.
  key_features: light behind subject; black shape; edge halo; bright background exposure; clean outline
  creative_brief: "Backlit silhouette lighting: the light source behind the subject, exposure set for the bright background so the subject falls to a black shape. Carry it through light behind subject, black shape, edge halo, bright background exposure, clean outline. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
