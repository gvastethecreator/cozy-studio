  aesthetic: Refined almanac-style risograph with moss green and oxblood inks, delicate cross-hatched line work, fine stipple, and the quiet order of an old herbal page without any lettering.
  subject_treatment: 'Render any prompt subject with patient natural-history care: clear contour, measured hatch, and plant-like decorative restraint, so creatures, people, objects, and places feel observed rather than dramatized.'
