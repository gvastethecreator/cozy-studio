visualDna:
  aesthetic: >-
    Macro Photography acts as a transferable photographic style router: begin from Extreme close-up,
    Tiny world, and field and nature photographic system built from natural light, patient timing,
    environmental scale, and credible ecology, then apply the photographic behavior to prompt X
    instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Shallow depth of field; preserve prompt identity while giving
    it field realism, habitat pressure, natural scale, or macro/wildlife observation cues, keeping
    the original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Vibrant detail; grade through natural atmosphere, silver-black fine-art values,
    underwater blue shift, sky exposure, foliage color, or animal camouflage, with value separation
    and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Ring flash; use weather, sun angle, water absorption, night-sky exposure, diffused field
    light, or telephoto background separation, preserving believable exposure, shadow density,
    highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Enlarged surface microtexture; render fur, feathers, plant texture, rock, water, star
    noise, mist, mud, and environmental micro-detail without plastic artificiality, avoiding both
    waxy smoothing and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Blurry depth field; compose through long-lens compression, macro proximity,
    horizon scale, field patience, eye-level empathy, or monumental stillness, with lens distance,
    depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Alien, detailed; derive mood from patience, wilderness pressure, wonder, cosmic
    quiet, companion warmth, or fine-art environmental grandeur, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Scientific, abstract; finish as believable field photography with clean detail,
    natural restraint, and no oversaturated postcard or zoo snapshot look, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: Extreme close-up; Tiny world; Vibrant detail; Ring flash; Blurry depth field
  creative_brief: >-
    Apply Macro Photography as a photographic preset over prompt X: preserve the user's requested
    subject, then route Extreme close-up, Vibrant detail, Ring flash, Enlarged surface microtexture,
    and Blurry depth field through optics, exposure, palette, surface response, timing, and finish
    without requiring the card image's original subject.
