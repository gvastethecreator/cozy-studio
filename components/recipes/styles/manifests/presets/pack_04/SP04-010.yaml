visualDna:
  aesthetic: 'Painted graphic novel: every image fully painted in gouache and watercolor from observation, forms built by value and edge with almost no outline.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Naturalistic chroma, warm skin against muted greens and grays, one saturated heraldic accent per image.
  lighting_and_shadow: Classical soft key from high side, gentle fill and a warm spotlight isolating faces and hands.
  texture_and_material: Visible brushwork, dry gouache over wet washes, fabric and metal painted with observed folds and dents.
  camera_and_composition: Realist proportions, grounded eye-level staging, painted portrait-weight close-ups within a single image.
  atmosphere_and_mood: Solemn and reverent, legends treated as living people.
  rendering_and_quality: Fine-art painted finish with anatomical and textile fidelity; no ink outlines and no digital gloss.
  key_features: fully painted gouache; outline-free forms; warm soft key; observed fabric and metal; realist proportions
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Graphic Novel (Painted) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - ink outlines
  - cel shading
  - line art
  - cartoon
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
