visualDna:
  aesthetic: 'Studio M2 Pluto look (2023): faithful Naoki Urasawa realism in animation, humanlike robots, grieving detectives, noir European cities and quiet mournful science fiction.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people and robots with Urasawa-derived realism, individualized faces, trench coats and subtle mechanical seams. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted noir grey, cold blue, warm lamp amber and dim rain tones.
  lighting_and_shadow: Noir rain light, warm interior lamps and cold reflections.
  texture_and_material: Realistic digital cel with painted European noir cities.
  camera_and_composition: Detective noir framing in rainy streets and quiet emotional close-ups on robot faces.
  atmosphere_and_mood: Keep the requested mood with mournful machine noir.
  rendering_and_quality: Faithful realist animation frame with mournful noir and Urasawa restraint.
  key_features: Pluto realism; humanlike robots; noir detective; grief
  creative_brief: "Studio M2 Pluto look (2023): faithful Naoki Urasawa realism in animation, humanlike robots, grieving detectives, noir European cities and quiet mournful science fiction. Carry it through Pluto realism, humanlike robots, noir detective, grief. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
