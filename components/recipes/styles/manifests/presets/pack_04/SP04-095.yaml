visualDna:
  aesthetic: 'Foliage design kit: a library sheet of isolated plant assets, from trees to groundcover, designed as one family sharing a shape language.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns an asset-library sheet of isolated vegetation arranged in rows by size, themed after the subject or biome, and that layout replaces the requested framing.
  color_and_tone: Species palette with seasonal or blight variants side by side on a neutral light ground.
  lighting_and_shadow: Consistent top-left daylight on every plant with flat, small contact shadows.
  texture_and_material: Painted leaf clusters grouped into readable masses, bark and stem detail only at close scale.
  camera_and_composition: Assets in rows from tall trees to small groundcover, all at one scale with a human silhouette, no scene around them.
  atmosphere_and_mood: Lush and organized, a biome sorted for building.
  rendering_and_quality: Game-art painted finish, crisp silhouettes, each asset ready to cut out.
  key_features: isolated plant assets in rows; one shared shape language; seasonal variants; human scale silhouette; neutral ground
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Foliage Design Kit as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable annotations
  - readable text
  - brand logo
  - franchise likeness
  - lone cloaked figure on a cliff edge
  - full landscape scene
  - overlapping plants
  - no plants
  - no vegetation
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
