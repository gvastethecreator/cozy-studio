visualDna:
  aesthetic: 'Acid etching: surfaces eaten by acid into pitted, frosted and bubbled zones with bright residue edges.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: acid pits, frosted zones and bubbled corrosion eat into the surfaces in splash patterns. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Frosted pale zones and yellow-green residue, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Cold light on pitted surfaces, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Pitted, frosted and bubbled corrosion, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Toxic, alarming, chemical and harsh, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Acid etching: surfaces eaten by acid into pitted, frosted and bubbled zones with bright residue edges. Carry it through acid pits, frosted zones, splash patterns, residue edges, surface-level damage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: acid pits; frosted zones; splash patterns; residue edges; surface-level damage; structure intact
