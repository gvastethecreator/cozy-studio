visualDna:
  aesthetic: 'Tite Kubo Bleach manga look: elegant elongated fashion figures, vast blank white space, dramatic cold poses, clean confident lines and stylish sword silhouettes.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Kubo elegance, tall slender bodies, sharp faces, fashionable robes and coats and cool detached poses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Mostly white space and black ink, with minimal tone.
  lighting_and_shadow: Bright blank white light and sharp black shadows.
  texture_and_material: Clean confident line, sparse detail and flat black fills.
  camera_and_composition: Minimal compositions with figures floating in white space.
  atmosphere_and_mood: Keep the requested mood with cool elegant detachment.
  rendering_and_quality: Elegant minimal manga illustration with fashion poise and vast empty whites.
  key_features: Tite Kubo white space; elongated elegance; cool poses; clean line
  creative_brief: "Tite Kubo Bleach manga look: elegant elongated fashion figures, vast blank white space, dramatic cold poses, clean confident lines and stylish sword silhouettes. Carry it through Tite Kubo white space, elongated elegance, cool poses, clean line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
