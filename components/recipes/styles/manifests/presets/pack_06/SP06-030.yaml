visualDna:
  aesthetic: 'Continuous line drawing: the whole image drawn with one unbroken line of even weight that never lifts from the paper.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: One black line on white; no fill, no shading, no second color.
  lighting_and_shadow: No shading; volume is suggested only by the line doubling back and overlapping itself.
  texture_and_material: Smooth paper, a single smooth fineliner stroke with loops where it travels between forms.
  camera_and_composition: Keep the requested framing; the line enters at one side and exits at another, connecting every part of the subject.
  atmosphere_and_mood: Graceful, minimal and playful, a single thought in one stroke.
  rendering_and_quality: Even weight, fluid curves, simplified but recognizable forms, visible connecting loops; no breaks, no sketchy repeats.
  key_features: one unbroken line; even line weight; connecting loops between forms; no fill or shading; simplified elegant contours
  creative_brief: "Continuous line drawing: the whole image drawn with one unbroken line of even weight that never lifts from the paper. Carry it through one unbroken line, even line weight, connecting loops between forms, no fill or shading, simplified elegant contours. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
