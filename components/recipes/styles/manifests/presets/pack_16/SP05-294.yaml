visualDna:
  aesthetic: 'Masaaki Yuasa feature animation as in Mind Game: mixed media collage of photo faces, rough sketches and flat animation, bodies stretching wildly and styles mutating mid-scene.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Yuasa elasticity, rubbery stretched limbs, simplified faces that can suddenly become rough sketches or photo cutouts. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Mutating psychedelic palettes, lava orange, sea green, hot pink and inky black.
  lighting_and_shadow: Wildly changing colored light with no fixed source.
  texture_and_material: 'Mixed media: rough pencil, flat cel, photo collage and painted textures.'
  camera_and_composition: Warped perspective, runaway zooms, style changes within one frame.
  atmosphere_and_mood: Keep the requested mood with euphoric psychedelic freedom.
  rendering_and_quality: Anarchic experimental Studio 4°C frame mixing drawing, paint and photo collage.
  key_features: Yuasa elasticity; mixed media collage; mutating styles; psychedelic color
  creative_brief: "Masaaki Yuasa feature animation as in Mind Game: mixed media collage of photo faces, rough sketches and flat animation, bodies stretching wildly and styles mutating mid-scene. Carry it through Yuasa elasticity, mixed media collage, mutating styles, psychedelic color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
