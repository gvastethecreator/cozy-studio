  creative_brief: 'Reusable visual system for any subject needing degraded pulp zine finish, sword and sorcery momentum, tape scan wear, and lurid handmade drama. Apply after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies a style grammar of Tape Scanned Sword & Sorcery; Old sword and sorcery paperback art degraded through photocopy; harsh ink; lurid flat color; tape scanned sword and sorcery pulp with theatrical silhouette pressure; black slab shadow, mood, material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster, readable text, or sample-card composition.'
