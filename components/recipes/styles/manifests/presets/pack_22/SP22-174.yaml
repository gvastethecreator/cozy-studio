visualDna:
  aesthetic: >-
    Fine engraved linework models surfaces with sharp, variable-width strokes and small crossing
    hatches that follow the form instead of scribbling over it.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use line networks to describe
    visible planes without adding detail or changing the subject.
  color_and_tone: >-
    Keep the requested palette and value relationships. Build tonal variation through line density
    without reducing a colored request to black and white.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Increase hatch density only within existing
    shadow areas and leave requested highlights open.
  texture_and_material: >-
    Keep the ink clean and the line scale controlled. Let marks follow the represented surfaces
    without adding paper grain or a mechanical screen pattern.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Line density does not require a page,
    border, lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Engraved line changes the mark structure without changing
    the depicted scene.
  rendering_and_quality: >-
    Establish the contour and major values before fine hatching. Keep line spacing open enough that
    detail remains distinct when the image is reduced.
avoidRules:
  - moire or hatch detail that disappears at reduced size
  - scribbled shading that ignores form direction
  - unrequested page, border, lettering, or period motifs
