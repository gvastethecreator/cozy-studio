visualDna:
  aesthetic: 'Theatrical follow spot: a hard circular beam from above isolating the subject on a dark stage, with a visible pool of light at their feet.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Neutral or warm white beam, black surroundings, optional colored gel wash behind.
  lighting_and_shadow: Hard high spot with a crisp circular edge on the floor, short dark shadow under the subject, faint beam visible in haze.
  texture_and_material: Stage dust in the beam; costume fabrics and props sharply lit.
  camera_and_composition: Keep requested framing; include the pool or edge of the spot.
  atmosphere_and_mood: Lonely and theatrical, a single figure held in a circle of attention.
  rendering_and_quality: Crisp circular beam edge, deep clean blacks outside it, and controlled highlights inside.
  creative_brief: "Theatrical follow spot: a hard circular beam from above isolating the subject on a dark stage, with a visible pool of light at their feet. Carry it through circular follow spot, light pool on floor, dark stage, visible beam in haze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: circular follow spot; light pool on floor; dark stage; visible beam in haze
