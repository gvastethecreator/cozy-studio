visualDna:
  aesthetic: 'Stellar shell megastructure: a star enclosed by a shell or swarm of near-black hexagonal panels and graphite heat fins, solar gold light leaking through every gap.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the star-enclosing shell setting and its planet-sized scale, and it never bends, loops or breaks the requested structure.
  color_and_tone: Graphite black panels, molten solar gold and white-hot corona; the only colors are black, gold and white.
  lighting_and_shadow: The star as a single blinding backlight; panels silhouetted, corona rim light on every edge.
  texture_and_material: Hexagonal panel tiling, ribbed heat fins, micrometeor pitting and panel gaps at planetary scale.
  camera_and_composition: Keep the requested geometry; the curvature of the shell and tiny scale cues convey planet-sized distance.
  atmosphere_and_mood: Awesome, cold and silent, engineering on the scale of a star.
  rendering_and_quality: Hard-edged space rendering with controlled bloom; no ornate gold filigree or baroque trim.
  key_features: near-black hexagonal shell panels; graphite heat fins; solar gold leaking through gaps; corona rim light; planet-scale curvature
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Stellar Shell Megastructure as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
