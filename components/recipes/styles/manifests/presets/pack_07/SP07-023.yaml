visualDna:
  aesthetic: 'Parametric architecture: facades and roofs generated by algorithm, with ribs, louvres or panels that change size, rotation and spacing gradually across doubly curved surfaces.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Mostly white and pale grey composite with glass, occasional warm timber louvres; value gradients created by changing rib density.
  lighting_and_shadow: Low sun raking across fins so shadow density shifts continuously along the surface; soft embedded linear light at night.
  texture_and_material: Glass-fibre reinforced concrete and composite panels, CNC-cut aluminium fins, laminated timber ribs, seamless joints between panels.
  camera_and_composition: Keep the requested view; follow one sweeping curve across the frame, show how the rib pattern gradates from dense to open.
  atmosphere_and_mood: Fluid, precise and futuristic, a surface that seems to breathe.
  rendering_and_quality: Clean architectural photograph with continuous gradients in fin spacing, smooth curves without faceting errors.
  key_features: gradated fin and louvre spacing; doubly curved white surfaces; algorithmic panel rotation; seamless composite joints; raking light through ribs
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Parametric Architecture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
