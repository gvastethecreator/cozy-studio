visualDna:
  aesthetic: 'Printpunk: a world driven by printing presses, where pamphlets, posters and giant rotary presses power revolutions and city life.'
  subject_treatment: Keep the prompt's subject and setting; fill it with presses, paper stacks, ink rollers and blank posters (no readable text).
  color_and_tone: Paper cream, black ink and oxblood red with steel press grey.
  lighting_and_shadow: Workshop lamps and skylights over presses, crisp shadows of hanging sheets.
  texture_and_material: Metal type blocks, ink rollers, paper stacks, iron presses and ink-stained aprons.
  camera_and_composition: Crowded workshops with sheets hanging overhead and presses in the foreground.
  atmosphere_and_mood: Urgent and rebellious, ideas spreading faster than anyone can stop them.
  rendering_and_quality: Engraving-like period illustration with crisp lines and ink texture.
  creative_brief: "Printpunk: a world driven by printing presses, where pamphlets, posters and giant rotary presses power revolutions and city life. Carry it through rotary presses, hanging sheets, ink rollers, blank posters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rotary presses; hanging sheets; ink rollers; blank posters
