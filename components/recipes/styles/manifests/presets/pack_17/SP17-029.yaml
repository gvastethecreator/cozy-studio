    Apocalyptic iron reliquary fantasy with sacred-industrial mass, scorched liturgical metal, riveted
    devotional forms, and catastrophic medieval machinery.
  subject_treatment: >-
    Transform any prompt subject into a heavy reliquary silhouette with riveted armor planes, caged-glass
    accents, penitential geometry, and sacred machine ornament without forcing a specific construct or scene.
  color_and_tone: Furnace black, rust red, sacred gold, bone ivory, soot gray, and emerald reliquary glow.
  lighting_and_shadow: Furnace underlight and shrine glow illuminate large armor planes while preserving denoised dark fields.
  texture_and_material: >-
    Riveted iron, scorched enamel, reliquary glass, cracked bone, chainmail, ash, and soot cleaned of ugly
    speckle.
  camera_and_composition: >-
    Monumental vertical framing with clear focal hierarchy, massive central forms, separated material planes,
    and readable sacred-industrial depth that adapts to the user's subject.
  atmosphere_and_mood: Sacred, industrial, catastrophic, penitential, and mythic.
  rendering_and_quality: >-
    Detailed dark fantasy digital illustration with clean black control, defined linework, polished material
    separation, and heavy denoise.
  creative_brief: >-
    Apply this as a reusable style router over any prompt: preserve the user's subject while adding
    iron-reliquary mass, sacred machinery, furnace-black contrast, and apocalyptic devotional pressure.
