visualDna:
  aesthetic: >-
    French New Wave acts as a transferable cinematic-media router: start from French New Wave lens
    grammar, film stock behavior, genre blocking, projection texture, and cinematic color grade and
    cinematic genre system built from lens grammar, film stock, blocking pressure, edit rhythm,
    production design, grain, and color grade, then apply the media behavior to prompt X instead of
    recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Define French New Wave through line, mass, contour,
    spacing, and rhythm. Keep forms readable, intentional, and reusable beyond one literal scene;
    preserve the requested subject while staging it as filmed material through blocking, wardrobe
    pressure, lens distance, movement cues, or genre-era performance texture only when useful,
    keeping the requested identity, silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with process-native palette relationships, deliberate contrast, and signal or film
    color logic for French New Wave; treat color as cinema process: film emulsion, lab timing, gel
    lighting, period stock response, genre grade, faded print, or projection decay, with deliberate
    value grouping, accent control, and process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through process-led exposure structure, readable highlights, and style-specific
    shadow behavior; make light feel motivated by cinematic setup through keyed contrast, practical
    spill, hard noir cuts, musical glow, exploitation underexposure, or analog animation glow, so
    exposure and shadow structure support the media process without overwriting the requested
    content.
  texture_and_material: >-
    Render lens grammar, film stock behavior, genre blocking, projection texture, and cinematic
    color grade; surface detail should reveal film grain, gate weave, scratches, halation, acetate
    texture, projection damage, optical compositing, or photographed production surfaces, keeping
    artifact scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through scale rhythm, frame hierarchy, lens distance, and composition rules
    specific to French New Wave; compose through lens choice, blocking, aspect-ratio pressure,
    frame-within-frame logic, handheld unease, symmetrical staging, or genre silhouette hierarchy,
    with frame rhythm, spacing, edge hierarchy, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood mood carried by French New Wave media process, signal pressure, and visual
    restraint; derive mood from cinematic tradition, performance tone, genre stakes, projection
    damage, auteur restraint, camp excess, or analog spectacle, letting the media style alter
    interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with finished French New Wave media craft with clear process evidence and controlled
    detail; finish as credible moving-image language with controlled film artifacts, readable
    subject identity, and no mandatory plot scene, franchise copy, or fake caption text, clean
    denoised surfaces where appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    French New Wave lens grammar, film stock behavior, genre blocking, projection texture, and
    cinematic color grade; process-native palette relationships, deliberate contrast, and signal or
    film color logic for French New Wave; scale rhythm, frame hierarchy, lens distance, and
    composition rules specific to French New Wave
  creative_brief: >-
    Apply French New Wave as a cinematic-media preset over prompt X: preserve the user's requested
    subject, then route lens behavior, palette, light, signal or film texture, composition, mood,
    and final media craft through French New Wave lens grammar, film stock behavior, genre blocking,
    projection texture, and cinematic color grade without requiring the card image's original
    subject.
