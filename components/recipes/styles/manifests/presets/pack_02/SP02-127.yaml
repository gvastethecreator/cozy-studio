  aesthetic: 'Interlaced music-video glow: 90s cable performance video with blown colored gels, soft-focus bloom and dreamy interlaced motion.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Magenta, electric blue and amber gels, blooming highlights, soft glowing skin.
  lighting_and_shadow: Colored backlights through haze, soft frontal glow, lens diffusion.
  texture_and_material: Interlace lines on movement, chroma smear, motion echo trails.
  camera_and_composition: Slow circling moves around a performer, silhouettes against colored haze.
  atmosphere_and_mood: Dreamy and romantic, a slow song made visible.
  rendering_and_quality: Analog video glow; distinct from fisheye glam and grunge distress.
  key_features: blown colored gels; soft-focus bloom; interlace motion echo; haze silhouettes; slow circling camera
  creative_brief: "Interlaced music-video glow: 90s cable performance video with blown colored gels, soft-focus bloom and dreamy interlaced motion. Carry it through blown colored gels, soft-focus bloom, interlace motion echo, haze silhouettes, slow circling camera. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
