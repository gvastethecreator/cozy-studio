visualDna:
  aesthetic: 'Feather couture: garments built from layered feathers — ostrich, peacock, crow or swan — with soft, moving edges.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments made of layered feathers arranged like plumage, with soft moving edges and iridescence.'
  color_and_tone: Raven black, swan white, peacock teal or dyed jewel feathers.
  lighting_and_shadow: Soft backlight to reveal feather edges and sheen, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Layered feathers with visible barbs, shafts and iridescence, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Extravagant, avian, graceful and wild, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: layered feather plumage; soft moving edges; iridescent sheen; backlit barbs
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Feathers as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
