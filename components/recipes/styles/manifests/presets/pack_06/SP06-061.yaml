visualDna:
  aesthetic: 'Analog cut-paper collage: the subject assembled from scissor-cut pieces of different printed sources, each fragment keeping its own print texture, halftone and color.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Mismatched printed sources held together by one dominant hue family; halftone skin tones, flat construction-paper blocks and one saturated accent fragment.
  lighting_and_shadow: Each fragment keeps the light of its source photo; a thin, soft drop shadow under every lifted paper edge gives a millimetre of physical depth.
  texture_and_material: Crisp scissor edges with slight wobble, coated magazine stock beside matte paper, visible halftone rosettes, glue-stick sheen and one or two lifted corners.
  camera_and_composition: Keep the requested view; the silhouette is readable first, then the eye discovers that each area comes from a different printed source.
  atmosphere_and_mood: Witty and handmade, a familiar form made strange by its stitched-together sources.
  rendering_and_quality: Clean cut edges, consistent paper scale and legible fragment boundaries; never a digital blend or a soft transition between pieces.
  key_features: scissor-cut printed fragments; halftone rosettes; soft paper drop shadows; mixed coated and matte stock; one accent fragment
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Analog Cut-Paper Collage as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
