visualDna:
  aesthetic: >-
    Airy digital cel painting built from crisp crystalline edges, translucent color planes, and soft
    cyan depth.
  subject_treatment: >-
    Keep the requested forms and action; define silhouettes with clean tapered contours, gentle edge
    bloom, and selective facet highlights.
  color_and_tone: >-
    Favor cyan, ice blue, and pearl with a small blush accent, adapting saturation when the prompt
    supplies a palette.
  lighting_and_shadow: >-
    Broad cool ambient light holds the planes together, with crisp refraction-like highlights and
    restrained bloom.
  texture_and_material: >-
    Blend smooth digital gradients with pinpoint glossy marks while preserving the represented
    material instead of turning it to glass.
  camera_and_composition: >-
    Retain the requested framing; suggest depth through clear overlapping planes, open spacing, and
    calm perspective.
  atmosphere_and_mood: >-
    Luminous, tender, and spacious; follow the requested emotional tone.
  rendering_and_quality: >-
    Clean cel edges, soft transitions, sharp glints, and controlled glow keep forms legible.
  key_features: >-
    Crystalline edge breaks, cyan depth, pearl highlights, and gentle romantic spacing over polished
    cel forms.
  creative_brief: >-
    Keep the requested subject, action, and place intact; restyle them with translucent planes,
    crystalline highlights, cyan depth, and quiet romantic softness.
