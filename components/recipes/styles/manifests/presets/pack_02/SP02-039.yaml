visualDna:
  aesthetic: >-
    UPA Style (Mid-Century) acts as a transferable cinematic-media router: start from 50s
    minimalism, UPA mid-century animation design with flat geometric reduction, jazz-era negative
    space, angular silhouettes, and limited modernist color, Flatness, limited animation, graphic
    silhouette and animation-production system built from motion-era drawing, cel paint, CG polish,
    stop-motion material, vector layers, camera multiplane, and shape acting, then apply the media
    behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Graphic, graphic shape simplification, crisp abstract
    contour, and minimal animation-ready construction that keeps the prompt readable; preserve the
    requested subject while translating it through cel shapes, squash, puppet material, vector rigs,
    CG feature polish, rotoscoped trace, or painted-frame continuity, keeping the requested
    identity, silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with Offset blocks, teal, mustard, brick red, charcoal, cream; use color as
    animation pipeline evidence: cel palettes, painted backgrounds, limited UPA flats, stop-motion
    set tones, digital compositing, or comic-offset halftone, with deliberate value grouping, accent
    control, and process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Flat graphic, negative space contrast; make light follow the animation
    method through cel shadows, painted depth, puppet set lighting, CG bounce, flat graphic value,
    or rotoscope edge shimmer, so exposure and shadow structure support the media process without
    overwriting the requested content.
  texture_and_material: >-
    Render Paper, matte, poster-print, graphic-design surface; surface detail should reveal acetate
    grain, paper line, clay/fabric puppet material, vector fills, oil smears, pixel cells, or CG
    shader smoothness when named, keeping artifact scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Abstract shapes, geometric reduction, angular stylization; compose
    through animation readability, pose clarity, painted-plate rhythm, squash arcs, graphic staging,
    multiplane depth, or frame-by-frame motion logic, with frame rhythm, spacing, edge hierarchy,
    and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Jazz, modern, mid-century optimism, cool intellectual; derive mood from feature
    warmth, rubber-hose chaos, stop-motion tactility, graphic modernism, anime atmosphere, or
    experimental motion craft, letting the media style alter interpretation without demanding a
    specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Design, flat, modernist composition, elegant simplicity; finish with
    production-faithful animation surfaces, readable shapes, controlled artifacts, and no exact
    studio-character copy or random cartoon face substitution, clean denoised surfaces where
    appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    50s minimalism, UPA mid-century animation design with flat geometric reduction, jazz-era
    negative space, angular silhouettes, and limited modernist color; Flatness, limited animation,
    graphic silhouette; Offset blocks, teal, mustard, brick red, charcoal, cream; Paper, matte,
    poster-print, graphic-design surface; Abstract shapes, geometric reduction, angular stylization
  creative_brief: >-
    Apply UPA Style (Mid-Century) as a cinematic-media preset over prompt X: preserve the user's
    requested subject, then route lens behavior, palette, light, signal or film texture,
    composition, mood, and final media craft through 50s minimalism, UPA mid-century animation
    design with flat geometric reduction, jazz-era negative space, angular silhouettes, and limited
    modernist color, Flatness, limited animation, graphic silhouette, Paper, matte, poster-print,
    graphic-design surface without requiring the card image's original subject.
