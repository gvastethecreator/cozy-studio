  aesthetic: 'Seedpunk: guardians of seeds and soil, with seed vaults, pollination rigs, crop libraries and farmers as heroes of the future.'
  subject_treatment: Keep the prompt's subject and setting; fill it with seeds, drawers of samples, sprouting trays and hand-built farming tools.
  color_and_tone: Earthy browns and seed golds with fresh sprout green and vault steel.
  lighting_and_shadow: Warm lamps over seed drawers and sunlight falling on fields.
  texture_and_material: Seed packets without text, wooden drawers, clay pots, soil and jute sacks.
  camera_and_composition: Rows of seed drawers and sprouting trays, or tiny figures in giant fields.
  atmosphere_and_mood: Patient and precious, the future of the world held in tiny grains.
  rendering_and_quality: Detailed botanical illustration with rich natural textures in every seed and leaf.
