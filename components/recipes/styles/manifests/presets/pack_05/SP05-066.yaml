visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around fine branching seam lines
    and pale faceted planes that follow existing form rather than adding anatomy or
    cutaway detail. For color and surface, preserve prompt hues and favor
    bone, ceramic gray, and a very limited crimson stress accent. Thriller tension can
    live in a controlled contour irregularity; do not make the request anatomical,
    graphic, or threatening
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through fine branching seam lines and pale
    faceted planes that follow existing form rather than adding anatomy or cutaway
    detail; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; preserve prompt hues and
    favor bone, ceramic gray, and a very limited crimson stress accent. Keep values
    legible across the prompted light and dark range; do not crush midtones or dim a
    bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use precise pale edge glints
    against soft shadow, keeping surfaces readable and avoiding clinical spotlighting.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine matte porcelain-like fields with tiny dry
    cracks only where the original material supports them. Keep texture subordinate to
    form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; keep the
    prompt's subject and crop fixed; direct seam detail along existing contours without
    exposing new interior structures. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Thriller tension can live in a controlled
    contour irregularity; do not make the request anatomical, graphic, or threatening.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and fine branching seam lines and pale faceted
    planes that follow existing form rather than adding anatomy or cutaway detail; keep
    focal edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    fine branching seam lines and pale faceted planes that follow existing form rather
    than adding anatomy or cutaway detail; preserve prompt hues and favor bone, ceramic
    gray, and a very limited crimson stress accent; use precise pale edge glints against
    soft shadow, keeping surfaces readable and avoiding clinical spotlighting; combine
    matte porcelain-like fields with tiny dry cracks only where the original material
    supports them; and keep the prompt's subject and crop fixed; direct seam detail
    along existing contours without exposing new interior structures. The five cues
    should read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use fine branching seam lines and pale faceted
    planes that follow existing form rather than adding anatomy or cutaway detail,
    preserve prompt hues and favor bone, ceramic gray, and a very limited crimson stress
    accent, use precise pale edge glints against soft shadow, keeping surfaces readable
    and avoiding clinical spotlighting, and combine matte porcelain-like fields with
    tiny dry cracks only where the original material supports them; the prompt supplies
    all scene content. Do not add unrequested characters, objects, source-specific lore,
    readable symbols, or a default action.
