visualDna:
  aesthetic: >-
    Digital painting models volume with dense, continuous tonal transitions and small, controlled brush
    irregularities. Edge softness varies by form instead of blurring the whole image.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep shapes specific, soften selected
    contours and concentrate crisp detail in identity-defining areas.
  color_and_tone: >-
    Build rich midtones while retaining separation in dark values. Respect the requested palette and
    preserve distinct local colors.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern through gradual painted transitions. Keep the existing
    direction and contrast; do not add glow or flatten shadows.
  texture_and_material: >-
    Use subtle brush irregularities without cosmetic smoothing. Preserve the differences between
    represented materials rather than softening them into a uniform surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Soft rendering does not
    require a tighter portrait crop or altered focus plane.
  atmosphere_and_mood: >-
    Keep the requested mood. Soft transitions do not imply haze, romance, nostalgia or a dreamlike scene.
  rendering_and_quality: >-
    Connect broad forms with controlled transitions and limit the sharpest detail to focal identity
    features. Avoid global blur while retaining a smooth painted finish.
avoidRules:
  - global blur
  - material-erasing retouch
