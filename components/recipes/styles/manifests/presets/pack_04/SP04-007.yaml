visualDna:
  aesthetic: 'Franco-Belgian clear line: one uniform ink contour around every form, flat unshaded color and meticulously drawn backgrounds equal in clarity to the figures.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Flat bright album colors, clear sky blues, brick reds and ochres, local color with no modeling.
  lighting_and_shadow: Even daylight without hatching; at most a single flat darker tone for cast shadows under objects.
  texture_and_material: Smooth printed album paper, clean color fills, no brush texture, no hatching, no screentone.
  camera_and_composition: Calm eye-level or slightly high view, every object readable, architecture and vehicles drawn with draftsman precision.
  atmosphere_and_mood: Lucid, curious adventure told with calm intelligence and gentle irony.
  rendering_and_quality: Constant contour width, closed shapes, exact edges; the clarity of the line is the whole style.
  key_features: uniform clear-line contour; flat album color; no hatching; precise backgrounds; calm eye-level view
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Franco-Belgian (Ligne Claire) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - crosshatching
  - painterly texture
