visualDna:
  aesthetic:
    Build a lived-in DIY look from patched denim, canvas and leather, hand-sewn repairs, safety-pin
    joins, and plain fabric patches with uneven stitching; keep patches free of imposed names, logos,
    slogans, or political symbols.
  subject_treatment:
    Preserve the requested subject, action, identity, and setting; apply repair language only to compatible
    existing garments, fabric, or equipment. Do not assign a band, brand, political identity, or new
    costume to the subject.
  color_and_tone:
    Use charcoal, worn denim blue, canvas tan, faded red, and restrained ochre; keep patches
    and stitched repair areas distinct from the base garment.
  lighting_and_shadow:
    Use honest, directional light with broad shadows that reveal folds, patch overlaps,
    and fastenings; keep faces and focal objects readable.
  texture_and_material:
    Show frayed hems, plain patched panels, uneven stitches, and rubbed leather only at local
    wear points; do not add symbols or use all-over dirt as a substitute for construction.
  camera_and_composition:
    Let garment construction and hand-marked patches support the requested focal subject;
    favor grounded, slightly rough contours without forcing a boot-level portrait.
  atmosphere_and_mood:
    Feel self-sufficient, communal, and resistant to polish, with emotional register set
    by the prompt rather than by automatic bleakness.
  rendering_and_quality:
    Keep seams and patch silhouettes bold enough to read small; use controlled abrasion
    and strong underlying drawing.
avoidRules:
  - blanket grime or decay on every surface
  - a required jacket, band, or street gathering
  - tiny stitches and pins replacing readable form
  - unrequested slogans, logos, brand names, band names, or political symbols
