visualDna:
  aesthetic: >-
    Tar turns material failure into the main visual language: start from Sticky black goo, Viscous,
    and Slow flow, then turn damage history, contamination, corrosion, staining, abrasion, and
    material breakdown into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Thick drips: preserve identity and pose while letting forms
    age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Black as the material palette, with controlled value separation, local color variation, and
    hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Glossy define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Tar without hiding the prompt subject.
  texture_and_material: >-
    Render Viscous through layer loss, residue buildup, chipped edges, stains, cracks, and uneven
    surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface tension
    coherent across the whole image.
  camera_and_composition: >-
    Compose around Slow flow as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Heavy, sticky by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Road work, trap material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Sticky black goo; Thick drips; Viscous; Glossy; Slow flow
  creative_brief: >-
    Route any subject through Tar as a transferable weathering-and-decay visual system while
    preserving the prompt's subject, action, and setting. Summon the slow gravity of thick tar
    oozing in glossy black drips of endless viscosity, a liquid that seems to forget it should flow
    but moves anyway, heavy with its own darkness. The surface should catch highlights like dark
    mirrors, depth without reflection, thick bodies catching light at their rounded crests. Capture
    the aesthetics of heaviness, the material that time forgot to finish. Use Tar as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
