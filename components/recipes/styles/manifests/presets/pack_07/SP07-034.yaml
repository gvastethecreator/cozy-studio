visualDna:
  aesthetic: 'Institutional ruin patina: an abandoned public building decaying in place, with paint peeling in curls, collapsed ceiling tiles, rust bleeding from fixtures and plants reclaiming the floor.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Faded institutional green, cream and pale blue paint over grey plaster, rust orange streaks, moss green on floors, cool daylight; desaturated with one living green.
  lighting_and_shadow: Daylight through broken skylights and dirty windows in soft shafts, dust in the air, darker rooms beyond.
  texture_and_material: Lead paint delaminating in curled flakes, water-stained plaster, sagging acoustic tiles, corroded radiators and light fittings, moss and saplings through cracked floor tile.
  camera_and_composition: Keep the requested view; show the room function through its leftover fixtures, light shaft crossing the frame, no centred corridor.
  atmosphere_and_mood: Melancholic, quiet and abandoned, time settling in dust.
  rendering_and_quality: Urban-exploration photograph with precise decay detail, no gore, creatures or horror staging.
  key_features: curled delaminating paint; collapsed ceiling tiles; rust-bleed from fixtures; moss through cracked floor; dusty skylight shafts
  creative_brief: "Institutional ruin patina: an abandoned public building decaying in place, with paint peeling in curls, collapsed ceiling tiles, rust bleeding from fixtures and plants reclaiming the floor. Carry it through curled delaminating paint, collapsed ceiling tiles, rust-bleed from fixtures, moss through cracked floor, dusty skylight shafts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
