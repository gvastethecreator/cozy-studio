visualDna:
  aesthetic: 'Starlight low-light camera: an ultra-sensitive sensor that turns a moonless night into a grainy, washed grey daylight.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Desaturated grey-blue near-monochrome, black sky full of stars, faint color noise.
  lighting_and_shadow: Flat amplified starlight with almost no shadows; any lamp blows out completely.
  texture_and_material: Heavy fine grain, smeared motion on moving subjects, soft detail.
  camera_and_composition: Wide surveillance or wildlife view, stars visible in the sky.
  atmosphere_and_mood: Uncanny and hushed, night that looks wrongly like day.
  rendering_and_quality: Low-light sensor look without green tint; distinct from tube night vision.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Starlight Low-Light Camera as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: moonless night made grey daylight; heavy grain; stars visible; blown lamps; no green tint
