visualDna:
  aesthetic: 'Weather channel forecast graphic: a composited map with isobars, weather symbols and temperature gradients, rendered in broadcast graphic style.'
  subject_treatment: Keep the prompt subject as the content of the graphic; this preset owns the on-screen layout, and every band, panel or symbol stays free of readable text.
  color_and_tone: Blue-to-red temperature gradients, green land, white isobars, bright yellow suns.
  lighting_and_shadow: Soft 3D map shading and glowing symbols; no scene lighting.
  texture_and_material: Satellite-style terrain texture, translucent cloud layers and softly beveled weather symbols.
  camera_and_composition: Map view tilted slightly in 3D, symbols placed over regions, clean layered composition.
  atmosphere_and_mood: Helpful and orderly, the sky explained in shapes and colors.
  rendering_and_quality: Broadcast forecast graphics with no readable place names or numbers.
  key_features: composited forecast map; isobar lines; weather symbols; temperature gradient; textless 3D map
  creative_brief: "Weather channel forecast graphic: a composited map with isobars, weather symbols and temperature gradients, rendered in broadcast graphic style. Carry it through composited forecast map, isobar lines, weather symbols, temperature gradient, textless 3D map. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
