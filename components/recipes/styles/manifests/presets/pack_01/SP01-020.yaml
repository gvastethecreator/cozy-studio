visualDna:
  aesthetic: 'Expired color negative: film long past its date, fogged by age and heat, with a lifted base, drifting color casts and weak contrast.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Milky lifted blacks, overall green, magenta or brown cast that drifts across the frame, faded saturation, muddy but readable skin.
  lighting_and_shadow: Low contrast; shadows fogged grey, highlights dull; best when overexposed so the image survives the fog.
  texture_and_material: Coarse clumped grain, blotchy dye clouds, occasional faint mottling; no scratches drawn as overlay.
  camera_and_composition: Keep the requested framing; no borders, light leaks only if faint and at an edge.
  atmosphere_and_mood: Wistful and unreliable, the image half dissolved like an old memory.
  rendering_and_quality: Chemical aging in the emulsion itself, not a generic vintage filter or a torn-paper texture.
  key_features: fogged lifted blacks; drifting color cast; coarse clumped grain; low contrast; faded dyes
  creative_brief: "Expired color negative: film long past its date, fogged by age and heat, with a lifted base, drifting color casts and weak contrast. Carry it through fogged lifted blacks, drifting color cast, coarse clumped grain, low contrast, faded dyes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
