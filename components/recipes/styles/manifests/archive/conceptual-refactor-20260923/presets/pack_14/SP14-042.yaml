    translated into dark symbolic behavior fused with kami and yokai myth-noir with boundary seals,
    wet ink, foxfire glow, paper-lantern hush, and legalistic supernatural bargains; it carries
    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    oath-bound contour and promise-weighted silhouette pressure, willow shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus fox shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through sealing-wax red, black vow shadow, and pale witness marks, willow-weighted
    accent roles over disciplined dark values plus fox-weighted accent roles over disciplined dark
