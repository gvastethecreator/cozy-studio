packId: pack_06
name: Pastel (Soft)
category: 2. Drawing & Sketching
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - essential-art-styles
  - drawing-and-sketching
visualDna:
  aesthetic: >-
    Pastel (Soft) acts as a transferable art-medium router: start from Chalk pastel drawing, Chalky
    finish and drawing-media system built from mark pressure, line economy, paper tooth, erasure,
    hatching, dust, and tool-specific edge behavior, then apply the medium behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Smudged, powdery; preserve the prompt subject while
    rebuilding it through line weight, contour, hatch density, smudge, scratch, wax, stylus, or
    marker stroke logic, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Matte, vibrant, blended; treat color as tool-limited material: graphite value,
    charcoal black, ink density, sanguine earth, wax pencil, marker bleed, chalk dust, or metallic
    trace, with deliberate value grouping, accent control, and medium-specific limits rather than
    generic color wash.
  lighting_and_shadow: >-
    Handle light through Soft, diffuse; represent light through mark spacing, exposed paper, tonal
    rubbing, crosshatch density, erased highlights, or flat diagrammatic value control, so value
    structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Textured paper, dust; make paper grain, tooth, dust, ink bite, wax buildup, scratch
    coating, vellum smoothness, or marker streaks visible at the right scale, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Soft edges; structure forms through line rhythm, gesture, technical
    geometry, blank space, contour continuity, and readable silhouette logic, with scale, spacing,
    edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Dreamy, atmospheric; derive mood from study, immediacy, precision, roughness,
    temporary mark-making, craft intimacy, or disciplined draftsmanship, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Fine art, degas style; finish with honest drawing marks, stable anatomy or object
    structure, clean negative space, and no painterly fill replacing the chosen tool, clean denoised
    surfaces where appropriate, and enough craft evidence to make the medium recognizable.
  key_features: Chalk pastel drawing; Chalky finish; Matte, vibrant, blended; Textured paper, dust; Soft edges
  creative_brief: >-
    Apply Pastel (Soft) as an art-style preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Chalk
    pastel drawing, Chalky finish, Textured paper, dust without requiring the card image's original
    subject.
