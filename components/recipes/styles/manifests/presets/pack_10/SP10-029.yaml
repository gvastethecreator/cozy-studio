visualDna:
  aesthetic: 'Halftone: the image built from dots of varying size in a regular screen.'
  subject_treatment: "Re-render the prompt's image entirely in this representation unit so the subject reads from the pattern of units: values are rebuilt as regular halftone dots at a fixed screen angle."
  color_and_tone: CMYK or single-ink dots, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Regular dot screen, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Graphic, printed, retro and bold, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: regular halftone dot screen; fixed angle
  creative_brief: "Halftone: the image built from dots of varying size in a regular screen. Carry it through regular halftone dot screen, fixed angle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
