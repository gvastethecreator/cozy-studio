visualDna:
  aesthetic: >-
    Keep geometric facets visible while using small painted textures to carry volume information.
    Reinforce existing folds and surfaces with short tonal ramps, bounded soft shading and clear
    polygonal contours.
  subject_treatment: >-
    Preserve the requested subject, identity, anatomy, count, pose, action and proportions. Clarify
    existing forms through painted texture and visible facets without adding a protagonist, changing
    clothing or introducing armor.
  color_and_tone: >-
    Preserve requested colors and value relationships. Keep painted ramps short and consistent with
    the supplied palette; do not apply a fixed historical or game-derived color grade.
  lighting_and_shadow: >-
    Follow the requested lighting and shadow. Allow limited softness within existing forms while
    keeping facet boundaries legible; do not introduce dramatic angles of view, aberration or glow.
  texture_and_material: >-
    Use small painted texture to describe the actual surfaces and folds already present. Keep texture
    material-specific and subordinate to form; do not add costume, armor or aging effects.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, perspective, orientation and arrangement. Do not impose an
    upward-looking view, ruined city, cinematic frame or video artifact.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Faceted 3D construction is a rendering approach, not a
    request for fantasy, ruin, combat or a period setting.
  rendering_and_quality: >-
    Balance clearly readable polygons with volume-bearing surface detail. Keep soft shading limited,
    ramps short and contours geometric; avoid aberration, blur and featureless low-poly reduction.
avoidRules:
  - unrequested upward-looking camera, ruined city or cinematic scene
  - unrequested protagonist, armor or costume change
  - video aberration, chromatic fringing or simulated signal damage
  - texture that hides facet boundaries or changes material identity
