visualDna:
  aesthetic: >-
    Comedic anime drawing varies contour weight and spacing for readable beats without
    changing scale.
  subject_treatment: >-
    Keep proportions and identity; exaggerate only requested expression or gesture, never
    height contrast.
  color_and_tone: >-
    Sun yellow, turquoise, tomato red, ivory, charcoal in bold separated blocks.
  lighting_and_shadow: >-
    Bright even cel light and one dark anchor; no stage-like lighting.
  texture_and_material: >-
    Clean color surfaces with short accent hatch; no symbols without a prompt cue.
  camera_and_composition: >-
    Respect framing and count; alternate dense and open areas without resizing forms.
  atmosphere_and_mood: >-
    Humor only when requested; preserve quiet or serious moods when asked.
  rendering_and_quality: >-
    Crisp silhouette, squash limited to expression, no stars or excess effects.
  key_features: >-
    Variable contour rhythm, vivid color blocks, timing through space, expression without
    scale change
  creative_brief: 'Apply a visual treatment centered on variable contour rhythm, vivid color blocks, timing through space, expression without scale change. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
