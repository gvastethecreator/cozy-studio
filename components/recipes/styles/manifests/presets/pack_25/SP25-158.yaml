  color_and_tone: Bright miniature colors around the product, with its own palette kept.
  lighting_and_shadow: Soft sunlight with a long product shadow falling across the tiny world.
  texture_and_material: Model-railway miniatures, tiny figures and the product's real material.
  camera_and_composition: Low tilt-shift view with the product rising like a monument.
  atmosphere_and_mood: Wonder and humor, a small world gathering around something enormous.
  rendering_and_quality: Crisp miniature photography with selective focus and a sharp label.
  creative_brief: "Giant Product Miniature World: the product shown towering over a detailed miniature world, with tiny figures reacting to it like a landmark. Carry it through giant product, miniature world, tiny figures, tilt-shift focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
