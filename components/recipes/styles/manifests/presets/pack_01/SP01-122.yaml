visualDna:
  aesthetic: 'Milky Way nightscape: a wide fast lens on a tripod capturing the galactic core arching over a landscape subject, stars as points, not trails.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Deep blue-black sky, warm dusty core of the Milky Way, faint green airglow, landscape in cool dim tones.
  lighting_and_shadow: Starlight and faint airglow; foreground softly lit by a low-level light or a glowing tent or window.
  texture_and_material: Dense star fields, dark dust lanes, silhouetted terrain edges.
  camera_and_composition: 14–24 mm, landscape subject in the lower third, the arch or band of the Milky Way rising above it.
  atmosphere_and_mood: Awestruck and quiet, a small earth under an enormous sky.
  rendering_and_quality: Clean high-ISO exposure, pinpoint stars, no painted galaxies.
  creative_brief: "Milky Way nightscape: a wide fast lens on a tripod capturing the galactic core arching over a landscape subject, stars as points, not trails. Carry it through Milky Way arch over land, pinpoint stars, landscape in lower third, faint airglow, wide fast lens. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Milky Way arch over land; pinpoint stars; landscape in lower third; faint airglow; wide fast lens
