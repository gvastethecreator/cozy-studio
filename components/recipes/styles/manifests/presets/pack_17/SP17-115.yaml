visualDna:
  aesthetic: Old master study combining sanguine red chalk modeling with corroded brown iron-gall pen lines, white chalk heightening, and toned buff paper.
  subject_treatment: 'Any prompt subject is studied rather than illustrated: red chalk builds volume, brown pen lines assert key contours and details, and white chalk marks the highest lights.'
  color_and_tone: Sanguine red, iron-gall brown-black, white chalk, and buff or light ochre paper.
  lighting_and_shadow: Soft studio light from one side; red chalk shadows, paper midtones, and white chalk highlights.
  texture_and_material: Chalk grain on laid paper, slightly bleeding iron-gall ink, corrosion halos, and faint rubbed smudges.
  camera_and_composition: Study composition with one main figure or subject plus optional small secondary detail studies of hands, heads, or parts, arranged without text.
  atmosphere_and_mood: Thoughtful, sensual, classical, and alive.
  rendering_and_quality: 'Master-drawing quality: confident marks, anatomical clarity, and clean paper.'
  creative_brief: "Old master study combining sanguine red chalk modeling with corroded brown iron-gall pen lines, white chalk heightening, and toned buff paper. Carry it through sanguine chalk volume, iron-gall pen contours, white chalk highlights, buff laid paper, study-sheet vitality. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sanguine chalk volume; iron-gall pen contours; white chalk highlights; buff laid paper; study-sheet vitality
