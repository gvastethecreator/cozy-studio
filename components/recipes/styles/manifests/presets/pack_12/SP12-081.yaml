visualDna:
  aesthetic: >-
    A faithful high-resolution 3D remaster presented at the compact, fixed scale of a classic
    action-RPG play frame. Keep the small actor, surrounding threats, terrain, and effect shapes
    legible together; do not turn the frame into a character close-up.
  subject_treatment: >-
    Preserve the requested actor, action, enemies, and objects. When gameplay figures are present,
    show their full in-world silhouettes at small scale and separate overlapping bodies or spell
    effects enough to read the encounter; do not add a hero, monster, or loot without a prompt for
    it.
  color_and_tone: >-
    Dark earth, blue-black stone and bone-white material planes with intense localized ice-blue,
    poison-green or ember effects; keep requested colors and separate effect silhouettes clearly.
  lighting_and_shadow: >-
    Use the game's contrast between a dim cavern and small pools of fire or spell light. Bright
    effects can flare strongly against the dark floor, but they should leave the actor, target
    silhouettes, and route around them understandable.
  texture_and_material: >-
    Suggest the 2021 remaster's rebuilt 3D surfaces with crisp stone, armor, and effect boundaries
    at game scale. Preserve material distinction and the original screen hierarchy instead of
    filling the small frame with cinematic micro-detail.
  camera_and_composition: >-
    Use a stable elevated three-quarter/isometric ARPG view. Keep the playable figure small relative
    to the area, with a diagonal floor plane and nearby targets arranged as a readable local
    encounter; avoid a free camera, shoulder-level follow view, or portrait crop.
  atmosphere_and_mood: >-
    Retain the original game's compressed dungeon danger and fast read of threats, terrain, and
    effects. Combat is not mandatory if the requested content is exploration or another gameplay
    action.
  rendering_and_quality: >-
    Read as a 2021 remaster of a classic game: restored 3D geometry, sharper edges and spell
    effects, and older compact screen-space scale. Include interface elements only when the prompt
    asks for a gameplay UI or capture; preserve explicitly requested text and interface details.
avoidRules:
  - free-camera portrait blur that breaks the elevated gameplay view
  - unrequested canonical figures, skills or item designs
  - effect bloom that hides target and silhouette separation
  - unrequested game marks or interface overlays; preserve explicitly requested UI and text
  - anime, manga or cel-shaded grammar
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
