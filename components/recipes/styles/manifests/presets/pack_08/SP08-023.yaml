visualDna:
  aesthetic: 'Lolita fashion: doll-like Victorian-Rococo silhouettes — bell-shaped petticoated skirts, lace, bows, blouses with high collars and bonnets.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a bell-shaped knee-length dress over petticoats, high-collared lace blouse, bonnet or bow headdress, frilled socks and round-toe strap shoes."
  color_and_tone: Sweet pastels, classic burgundy and navy, or gothic black and white.
  lighting_and_shadow: Soft, even, romantic light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Cotton lace, chiffon ruffles, satin ribbons, jacquard and pearls.
  camera_and_composition: Full figure with the bell silhouette clearly visible, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Elegant, doll-like, whimsical and composed, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Delicate, detailed finish, with believable fabric weight, seams and fit detail.
  key_features: bell-shaped petticoat skirt; lace and bows; bonnet; frilled socks; doll-like elegance
  creative_brief: "Lolita fashion: doll-like Victorian-Rococo silhouettes — bell-shaped petticoated skirts, lace, bows, blouses with high collars and bonnets. Carry it through bell-shaped petticoat skirt, lace and bows, bonnet, frilled socks, doll-like elegance. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
