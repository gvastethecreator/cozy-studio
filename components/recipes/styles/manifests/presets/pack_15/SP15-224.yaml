  aesthetic: 'Filmpunk: a culture built around physical celluloid, with projection booths, film strips hung like laundry, splicing benches and beams of light through dust.'
  subject_treatment: Keep the prompt's subject and setting; surround it with reels, hanging film strips, projectors and projected beams of light.
  color_and_tone: Warm amber projector light, deep cinema reds and blacks with sepia celluloid tones.
  lighting_and_shadow: A single bright projector beam cutting through dusty darkness.
  texture_and_material: Celluloid strips, metal reels, brass projectors, velvet seats, floating dust.
  camera_and_composition: Dark rooms crossed by beams, with film strips looping through the frame.
  atmosphere_and_mood: Romantic, flickering and nostalgic, dreams made of light and plastic.
  rendering_and_quality: Warm cinematic illustration with light beams and fine dust particles.
  creative_brief: "Filmpunk: a culture built around physical celluloid, with projection booths, film strips hung like laundry, splicing benches and beams of light through dust. Carry it through projector beams, hanging film strips, splicing benches, floating dust. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: projector beams; hanging film strips; splicing benches; floating dust
