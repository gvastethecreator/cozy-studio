visualDna:
  aesthetic: 'Use this drawing language: Full-frame marker doodle with scratchy permanent-marker strokes, malformed freehand symbols, restless edge crowding, ink feather, paper tooth, and correction-mark accents. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply assertive permanent-marker strokes, irregular doodle scratches, malformed margin marks, and brisk hatching to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use toxic marker green, black ink, red correction pen, highlighter yellow, notebook blue, and cheap purple as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat fill with sharp overhead-like glare accents as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render marker bleed, scratched graphic marks, notebook-paper tooth, ink feathering, and smudged graphite as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Spread freehand marks toward the edges for restless page energy; keep symbols abstract and add no readable fake text.
  atmosphere_and_mood: Messy, restless, and rebellious; let line and mark carry the energy while preserving the source context.
  rendering_and_quality: Finish with ink feather, correction marks, paper texture, and a rough unpolished line.
  key_features: scratchy marker strokes; irregular doodle marks; edge crowding; ink feather; paper tooth; correction accents
  creative_brief: Render the supplied content with assertive permanent-marker strokes, irregular doodle scratches, malformed margin marks, and brisk hatching. Use toxic marker green, black ink, red correction pen, highlighter yellow, notebook blue, and cheap purple as style colors while honoring any explicit color instructions. Apply marker bleed, scratched graphic marks, notebook-paper tooth, ink feathering, and smudged graphite as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
