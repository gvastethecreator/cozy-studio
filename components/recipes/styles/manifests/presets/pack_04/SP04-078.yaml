visualDna:
  aesthetic: 'Street stencil art: the subject cut into a one- or two-layer stencil with bridges and sprayed onto a wall.'
  subject_treatment: Keep the prompt subject, action, setting and framing; apply only this print or drawing technique, without adding slogans, borders, frames or a poster layout.
  color_and_tone: Black spray with at most one accent color, usually red, on a gray concrete or brick wall.
  lighting_and_shadow: Light reduced to two or three posterized levels; shadows are solid black islands.
  texture_and_material: Overspray halos, drips, bridge gaps in the shapes, rough wall texture showing through.
  camera_and_composition: Keeps the requested framing and subject, placed on a wall surface without placards, slogans or frames.
  atmosphere_and_mood: Rebellious, quick and direct, an image left overnight.
  rendering_and_quality: Hard-edged posterized silhouettes with stencil bridges; never freehand shading or protest signs.
  key_features: cut stencil bridges; black spray plus one red; overspray halos and drips; posterized levels; wall texture
  creative_brief: "Street stencil art: the subject cut into a one- or two-layer stencil with bridges and sprayed onto a wall. Carry it through cut stencil bridges, black spray plus one red, overspray halos and drips, posterized levels, wall texture. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
