visualDna:
  aesthetic: 'Cloisonné: glossy colored enamel fields separated by fine gold wire cells.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: glossy enamel fields in gold wire cells cover the surfaces. The decorative surface pattern is the point: make its figure, veining or motif the first read."
  color_and_tone: Turquoise, cobalt, coral, gold, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Glossy light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Enamel and gold wire, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Ornate, precious, bright and refined, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cloisonné Enamel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: enamel in gold wire cells; decorative surface pattern
