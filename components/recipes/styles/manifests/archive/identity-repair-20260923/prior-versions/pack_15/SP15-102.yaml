visualDna:
  aesthetic: >-
    Drive forms with rising diagonals and broad concave curves, broken by short scuffed marks and chunky
    color blocks; motion comes from their alternation.
  subject_treatment: >-
    Preserve the requested subject and action; redirect existing edges and internal divisions into a
    kinetic rhythm without changing camera or content.
  color_and_tone: Pair warm neutral planes with one sharp electric green or blue accent and open charcoal shadows.
  lighting_and_shadow: Use directional value cuts and a few contained edge glints that follow existing contours.
  texture_and_material: >-
    Favor scuffed matte surfaces, abrupt edge changes, and broad material transitions rather than
    detailed hardware.
  camera_and_composition: Keep the requested crop; use one sweeping curve and counter-diagonal to imply momentum.
  atmosphere_and_mood: Suggest improvised speed and defiance through rising rhythm and open intervals.
  rendering_and_quality: Keep curves and color blocks bold, with motion marks attached to existing forms.
avoidRules:
  - detached speed marks that imply a different action
  - line tangles that erase the main form
  - uniformly polished surfaces
