visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through ritual architecture, mythic scale, ceremonial lanes, relic energy,
    and sacred spatial order, using the preset as art direction rather than a required scene,
    mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express ritual hierarchy, artifact
    weight, ceremonial route pressure, and mythic trial readability without forcing a temple scene.
  color_and_tone: >-
    Grade the image with prismatic blue-white with sharp color splits; sun-baked ochre, bone white,
    and hot shadow blue; mineral gold, moonlit blue, jade, orchid, volcanic green, marble white, and
    prismatic ritual accents; keep tonal hierarchy strong enough for gameplay readability, thumbnail
    clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with crystal refraction and caustic shards; heat haze and hard desert sun;
    altar glow, rune bounce, moon shafts, crystal caustics, brazier halos, and sacred backlight; use
    highlights and shadow pockets to reveal routes, hazards, factions, or focal threats without
    hiding prompt content.
  texture_and_material: >-
    Build surfaces from stone steps, offerings, and worn gates; carved stone, polished relic metal,
    paper talismans, wet moss, lacquer, crystal, incense haze, and worn ritual cloth; make props,
    clothing, creatures, vehicles, architecture, and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from ritual architecture, mythic scale, ceremonial lanes,
    relic energy, and sacred spatial order: lane rhythm, scale contrast, objective hierarchy,
    readable negative space, encounter depth, and motion vectors should adapt to portraits, objects,
    creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood reverent, mysterious, dangerous, mythic, ceremonial, and charged with old power;
    the result can be adult, harsh, seductive, eerie, or violent when prompt X asks for it, but the
    preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as ornate but legible game-art finish with disciplined focal hierarchy and no generic
    fantasy postcard staging; preserve clean focal hierarchy, believable material response,
    heavy-denoise clarity, and no readable UI, text, logos, or stock key-art gloss.
  creative_brief: >-
    Apply this as a reusable visual router over any prompt: preserve the user's subject while adding
    prismatic mythic light, mineral ceremonial geometry, sun-washed palette, and readable
    adventure-game polish without forcing a fixed scene, character, prop, or story beat.
  key_features: >-
    Crystal, Desert, Shrine; ritual architecture, mythic scale, ceremonial lanes, relic energy, and
    sacred spatial order; prismatic blue-white with sharp color splits; crystal refraction and
    caustic shards; stone steps, offerings, and worn gates; ceremonial path and altar focal point;
    reverent, mysterious, dangerous, mythic, ceremonial, and charged with old power
