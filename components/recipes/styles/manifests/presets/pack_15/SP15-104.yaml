visualDna:
  aesthetic:
    'Build a streetpunk identity from defiant clothing and equipment: tartan panels, patched leather,
    studs or spikes, improvised fastenings, and hand-marked street graphics form a tough, visibly assembled
    silhouette.'
  subject_treatment:
    Preserve the requested subject and action; style compatible unspecified clothing, gear,
    and surfaces with DIY fastenings, tartan, patched leather, or a few stickers and stencil marks without
    adding a protest scene.
  color_and_tone:
    Use black, worn leather brown, tartan red or green, and sharp cyan or amber street accents;
    let clothing and equipment provide the main graphic blocks, with street marks secondary.
  lighting_and_shadow:
    Use direct streetlight or daylight to reveal garment layers, fastenings, leather edges,
    and a few graphic marks; keep form dimensional rather than flattening it into a paper collage.
  texture_and_material:
    Separate patched leather, tartan cloth, metal studs, stitched joins, and occasional
    painted or adhesive marks; concentrate wear at seams and contact points.
  camera_and_composition:
    Keep the subject's silhouette and clothing/equipment shapes prominent; use a few
    angular street-graphic accents for rhythm while preserving depth and requested camera.
  atmosphere_and_mood:
    Feel immediate, public, and self-organized, with a defiant or convivial tone determined
    by the requested content.
  rendering_and_quality:
    Make studs, fastenings, tartan patches, and leather silhouettes legible at thumbnail
    scale; keep street graphics bold but secondary and avoid legible slogans or branded tags.
avoidRules:
  - a required protest, alley, or poster wall
  - unrequested readable slogans or logos
  - flattening the whole image into pasted paper
