visualDna:
  aesthetic: >-
    Print-influenced cel painting with inky blue blocks, fine hatchwork, paper grain, and crisp edge
    registration.
  subject_treatment: >-
    Keep the prompt's subject and action; simplify them into clear masses with selective etched line
    detail.
  color_and_tone: >-
    Cream, deep indigo, and restrained amber create printlike contrast; preserve any explicit color
    direction.
  lighting_and_shadow: >-
    Broad flat light and precise shadow shapes keep the image graphic, with small highlights used
    sparingly.
  texture_and_material: >-
    Fine hatch marks and paperlike grain add a printed finish without turning the subject into
    printed matter.
  camera_and_composition: >-
    Respect the supplied framing; balance flat graphic masses and small details without adding pages
    or presses.
  atmosphere_and_mood: >-
    Quietly studious and composed, with mood set by the requested scene.
  rendering_and_quality: >-
    Use clean boundaries, controlled hatching, and subtle grain to keep the print influence legible.
  key_features: >-
    Inky value blocks, cream highlights, fine hatching, and crisp registration shape a distinctive
    cel-print finish.
  creative_brief: >-
    Give the requested content a tactile printlike cel treatment while keeping its existing objects,
    action, and location intact.
