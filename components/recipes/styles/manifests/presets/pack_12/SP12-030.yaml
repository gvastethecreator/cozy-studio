visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Cuphead gameplay screenshots: 1930s rubber-hose
    boss-fight capture with hand-inked characters, carnival props, flat stage lanes, and chaotic
    projectile readability. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Cuphead-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Cuphead-informed palette: aged paper cream, circus red, mustard yellow, black ink,
    turquoise shadows, and candy pink highlights. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through flat animation lighting, painted stage glow, muzzle-flash pops, and
    film-flicker value shifts. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from ink outlines, cel paint, watercolor backgrounds, film grain,
    squash-and-stretch sprites, and hand-drawn projectile shapes. Materials should feel like
    in-engine game assets captured during play, with enough texture identity to separate props,
    terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with side-view boss arena with bullet lanes, player jump space, phase props, and vintage
    cartoon stage composition. The frame should read as a plausible gameplay capture; include UI/HUD
    only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Cuphead-derived mood: manic, theatrical, cruelly playful, vintage, and precise. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: small health/cards/super meter
    can appear as period-styled gameplay UI; avoid modern overlays. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Cuphead gameplay screenshots; 1930s rubber-hose boss-fight capture with hand-inked characters,
    carnival props, flat stage lanes, and chaotic projectile readability; aged paper cream, circus
    red, mustard yellow, black ink, turquoise shadows, and candy pink highlights; flat animation
    lighting, painted stage glow, muzzle-flash pops, and film-flicker value shifts; ink outlines,
    cel paint, watercolor backgrounds, film grain, squash-and-stretch sprites, and hand-drawn
    projectile shapes; side-view boss arena with bullet lanes, player jump space, phase props, and
    vintage cartoon stage composition; manic, theatrical, cruelly playful, vintage, and precise; HUD
    guidance: small health/cards/super meter can appear as period-styled gameplay UI; avoid modern
    overlays
  creative_brief: >-
    Use Cuphead Carnival Boss as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through capture references from Cuphead: camera, HUD grammar, material language,
    color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the
    reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key
    art.
