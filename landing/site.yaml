preview:
  variant: walkthrough
  navLabel: How it works
  kicker: How it works
  title: Three steps. That’s it.
  image: { src: assets/create.webp, light: assets/create-light.webp, alt: Cozy Studio with a paper collage style, a prompt and the finished picture }
  steps:
    - { title: Pick a style, body: "Film, paint, anime, print, pixel art.", x: 13, y: 15, radius: 11 }
    - { title: Say what you want, body: Plain words. Add a picture if you like., x: 13, y: 43, radius: 11 }
    - { title: Keep it, body: It lands in Pictures/Cozy Studio as a PNG., x: 62, y: 46, radius: 26 }

skill:
  variant: handoff
  navLabel: Agents
  kicker: Agent-ready
  title: Or let your agent brew it.
  accent: brew it.
  lede: Ask your coding agent for Cozy Studio. It follows the repo’s own guide, starts the app and makes pictures with it. You only sign in.
  prompt: Set up Cozy Studio from github.com/gvastethecreator/cozy-studio, then make me a giant black cat over a city as a stained glass window.
  agents: [Codex, Claude Code, Cursor, any coding agent]
  steps:
    - { kind: read, text: Reads AGENTS.md and the setup skill }
    - { kind: run, text: bun install }
    - { kind: run, text: bun run studio:init }
    - { kind: run, text: bun run dev }
    - { kind: you, text: Sign in to ChatGPT in Settings }
    - { kind: make, text: Makes the picture with ChatGPT }
  result:
    src: assets/deck/cat-harry-clarke.webp
    alt: A giant black cat and a city as a jewel-toned stained glass window
    caption: Pictures/Cozy Studio/2026-09-29_harry-clarke_giant-black-cat-taller-than-skyscrapers.png

screens:
  navLabel: Screens
  kicker: Inside the app
  title: A look inside.
  lede: Create, browse the styles, keep your library, choose where the files go.
  head: true
  images:
    - { src: assets/create.webp, light: assets/create-light.webp, alt: "Create: a paper collage style, a prompt and the finished picture", caption: Create }
    - { src: assets/screens/styles.webp, light: assets/screens/styles-light.webp, alt: "Style explorer: collections of styles by what they are for", caption: Style explorer }
    - { src: assets/screens/library.webp, light: assets/screens/library-light.webp, alt: "Library: every picture in the workspace", caption: Library }
    - { src: assets/screens/output.webp, light: assets/screens/output-light.webp, alt: "Settings: where pictures are saved and how they are named", caption: Output settings }

setup:
  variant: script
  navLabel: Install
  kicker: Install
  title: Make a cup. Install it.
  lede: Free and open source. You need Bun and a browser.
  items:
    - command: "git clone https://github.com/gvastethecreator/cozy-studio"
    - command: cd cozy-studio
    - command: bun install
    - command: "bun run studio:onboard --setup"
    - command: "bun run studio:init"
    - command: bun run dev
  verification: open localhost:17222 and sign in

closing:
  text: Go create something.
  accent: something.
  lede: Free and open source. It runs on your computer.
  action: { label: Get Cozy Studio, href: "#setup" }
