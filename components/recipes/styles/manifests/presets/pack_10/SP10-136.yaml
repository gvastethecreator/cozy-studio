  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Map base with isobars, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Scientific, dynamic, clear and calm, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Weather map: isobars, front symbols and pressure cells. Carry it through isobars, front symbols, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
