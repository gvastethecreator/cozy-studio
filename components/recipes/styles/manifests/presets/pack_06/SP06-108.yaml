visualDna:
  aesthetic: 'Visual-novel backdrop: a clean anime-painted location with no characters, graded in neon night color and staged for a character to stand in later.'
  subject_treatment: Keep the prompt setting and camera; paint it as an empty story backdrop, and add characters only when the prompt names them.
  color_and_tone: Deep indigo base with magenta and cyan neon washes, warm practical lights as small accents.
  lighting_and_shadow: Soft neon spill on surfaces, gentle bloom around signs and windows, smooth gradient shadows.
  texture_and_material: Clean anime background painting, crisp architectural lines, soft gradient skies and glossy reflective floors.
  camera_and_composition: Eye-level, near-symmetrical framing with an open central area where a character could stand; lower quarter kept calm.
  atmosphere_and_mood: Wistful and quiet, a place waiting for its scene.
  rendering_and_quality: Polished, uncluttered backdrop with blank signs; no people, dialogue boxes or words.
  key_features: empty anime backdrop; neon magenta and cyan wash; bloom; open central stage; blank signs
  creative_brief: "Visual-novel backdrop: a clean anime-painted location with no characters, graded in neon night color and staged for a character to stand in later. Carry it through empty anime backdrop, neon magenta and cyan wash, bloom, open central stage, blank signs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
