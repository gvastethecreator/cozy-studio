visualDna:
  aesthetic: 'French New Wave: early-1960s handheld cinema on fast black-and-white film, real locations, available light and jump-cut spontaneity.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Grey-rich black and white or pale muted color; overexposed skies and windows.
  lighting_and_shadow: Available daylight and practical lamps only; no studio lighting setups.
  texture_and_material: Visible grain, slight softness, real worn interiors and streets.
  camera_and_composition: Handheld 35 mm, off-balance framing, actors glancing into the lens, sudden cropped gestures.
  atmosphere_and_mood: Restless and playful, youthful improvisation with a touch of melancholy.
  rendering_and_quality: Loose documentary cinema look; no polished studio perfection.
  key_features: handheld black and white; available light; glances into the lens; off-balance framing; overexposed windows
  creative_brief: "French New Wave: early-1960s handheld cinema on fast black-and-white film, real locations, available light and jump-cut spontaneity. Carry it through handheld black and white, available light, glances into the lens, off-balance framing, overexposed windows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
