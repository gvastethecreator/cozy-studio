visualDna:
  aesthetic: 'Variable Rhythm Sequence: the same lettering shown in three frames as its width, weight or counters change, every letter traceable.'
  subject_treatment: Show the requested words in three frames as width, weight or counters change within declared limits, every letter kept and traceable.
  color_and_tone: A stable palette, with color never replacing geometric continuity.
  lighting_and_shadow: Flat or constant low-relief light with no flashes hiding jumps.
  texture_and_material: Coherent contours between frames with a stable finish.
  camera_and_composition: Same text, baseline and anchors across comparable frames.
  atmosphere_and_mood: A readable typographic rhythm and a calm, controlled transformation over time.
  rendering_and_quality: Every letter can be followed from the first frame to the last.
  creative_brief: "Variable Rhythm Sequence: the same lettering shown in three frames as its width, weight or counters change, every letter traceable. Carry it through three frames, controlled change, fixed baseline, traceable letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three frames; controlled change; fixed baseline; traceable letters
avoidRules:
  - new letters
  - uncontrolled simultaneous changes
  - sequence shown as a working variable font
  - copying a commercial typeface
