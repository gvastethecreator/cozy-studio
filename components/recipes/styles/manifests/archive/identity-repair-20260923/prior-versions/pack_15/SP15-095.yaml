visualDna:
  aesthetic: >-
    Mycopunk builds organic rhythm from branching mycelial paths, repeated cap-like forms and sparse
    spore-scale marks, combining network growth with soft material edges.
  subject_treatment: >-
    Preserve requested identity, shape, action and connections. Follow compatible contours with branching
    or cellular marks; do not turn the subject into a fungus, transit system or weather scene.
  color_and_tone: >-
    Keep requested colors and values primary. Use muted clay, deep organic tones and small cool or
    luminous accents only where they help separate the branching network.
  lighting_and_shadow: >-
    Respect stated light direction and contrast. Add no spore glow, weather effect or night setting
    unless requested.
  texture_and_material: >-
    Preserve the actual surface. Use localized soft grain or velvety variation only where it fits; do not
    make every material damp, fuzzy or spore-covered.
  camera_and_composition: >-
    Preserve viewpoint and arrangement. Let branching paths and repeated shapes follow existing space
    without requiring a transit map, tower or growth landscape.
  atmosphere_and_mood: >-
    Suggest interconnection and gradual growth through branching rhythm and spacing while keeping the
    requested mood; do not add a fungal signal network story.
  rendering_and_quality: >-
    Vary line scale between main branches and small spore marks, keeping the network open and legible.
    Avoid random tendrils, dense dots and detail that merges into a mass.
avoidRules:
  - Do not add transit routes, spore towers, message clouds or fungal characters unless requested.
  - Avoid random tendrils, all-over spores and forced dampness.
  - Keep branch marks subordinate to the requested subject.
