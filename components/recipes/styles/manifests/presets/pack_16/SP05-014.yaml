visualDna:
  aesthetic: >-
    A jazzy 90s cel treatment built from loose ink cuts, off-beat diagonals and deep, quiet shadow
    shapes. Its space-noir signal is lonely scale and selective amber light, not a required genre
    setting.
  subject_treatment: >-
    Keep the requested identity and gesture. Let contours alternate between loose curves and decisive
    angular cuts; use only the movement and expression already present.
  color_and_tone: >-
    When open, favor smoky indigo, muted violet, ink black and restrained amber. Preserve specified
    colors and let one warm note break the cool value field.
  lighting_and_shadow: >-
    Shape existing light into slanted highlights against large cel shadows. Use soft haze-like
    transitions sparingly; do not add a spotlight, monitor or physical smoke.
  texture_and_material: >-
    Combine confident ink strokes, painted cel fills and a faint film-grain veil. Keep haze in the
    image treatment and match highlights to the actual surface.
  camera_and_composition: >-
    Use syncopated spacing, off-center balance and generous negative space within the supplied frame.
    Preserve camera position and subject arrangement.
  atmosphere_and_mood: >-
    Make the rhythm cool, reflective and slightly wry through pauses and asymmetry. Keep the requested
    emotion; do not add a caper, romance or science-fiction story.
  rendering_and_quality: >-
    Keep silhouettes crisp, shadow edges intentional and background detail quiet. Allow a few
    painterly transitions without turning the image into soft-focus realism.
  key_features: >-
    off-beat diagonals and negative space; cool indigo-violet shadows; sparse amber highlights over
    expressive ink cuts
  creative_brief: 'Apply the syncopated ink, cool noir values and selective amber accents to the requested content. Preserve its scene, subject, action and framing; add no spacecraft, club, detective or genre props. Use it as a reusable look on any subject.'
