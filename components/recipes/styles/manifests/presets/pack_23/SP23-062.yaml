visualDna:
  aesthetic: 'Drollery margin grotesques: absurd hybrid creatures and comic scenes drawn in the margins of medieval books, rabbits fighting knights, snails jousting and bottoms with faces.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; turn the subject into an absurd hybrid or role reversal drawn small on bare vellum.
  color_and_tone: Light washes of blue, red and green with touches of gold on pale vellum.
  lighting_and_shadow: Almost no shading; small washes and pen lines only.
  texture_and_material: Fine pen lines, light washes and blank vellum space.
  camera_and_composition: Small figures isolated in a large empty margin or climbing vine tendrils.
  atmosphere_and_mood: Keep the requested mood with irreverent medieval mischief.
  rendering_and_quality: Quick witty drawing with clear silhouettes and generous blank space.
  creative_brief: "Drollery margin grotesques: absurd hybrid creatures and comic scenes drawn in the margins of medieval books, rabbits fighting knights, snails jousting and bottoms with faces. Carry it through hybrid creatures, role reversals, vine tendrils, blank margin space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hybrid creatures; role reversals; vine tendrils; blank margin space
