  aesthetic: 'Makoto Shinkai feature animation as in Weathering With You: rain-soaked photoreal Tokyo streets painted digitally, water droplets as main actors, sudden sunbeams breaking through storm clouds.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with clean slender Shinkai-era designs, clear bright eyes, wet hair strands and modern raincoats and school or city clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Wet slate grey, neon reflections, storm blue and sudden gold sunlight on puddles.
  lighting_and_shadow: Overcast diffusion broken by sharp sunbeams, rain streaks catching light, glowing puddle reflections.
  texture_and_material: Detailed digital rain, droplet splashes, reflective asphalt, crisp cel characters over painted backgrounds.
  camera_and_composition: Low puddle-level views, rooftop wides under enormous clouds, close shots of hands and droplets.
  atmosphere_and_mood: Keep the requested mood with wistful rainy romance.
  rendering_and_quality: Glossy contemporary Shinkai frame with photographic rain detail and light bloom.
  key_features: Shinkai rain; puddle reflections; sunbeams through clouds; detailed Tokyo; clean designs
  creative_brief: "Makoto Shinkai feature animation as in Weathering With You: rain-soaked photoreal Tokyo streets painted digitally, water droplets as main actors, sudden sunbeams breaking through storm clouds. Carry it through Shinkai rain, puddle reflections, sunbeams through clouds, detailed Tokyo, clean designs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
