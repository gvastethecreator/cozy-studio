visualDna:
  aesthetic: >-
    Illuminated illustration built from compact silhouettes and interlaced contour paths, with
    ornament contained within requested forms rather than supplied as free-standing symbols.
  subject_treatment: >-
    Simplify existing forms into legible masses while preserving identity, proportions and function.
    Apply interlace only to surfaces or contours explicitly suited to that treatment.
  color_and_tone: >-
    Use restrained opaque pigments with clear value separations and generous unmarked areas. Keep
    ornament density local rather than filling every available surface.
  lighting_and_shadow: >-
    Use matte, mostly graphic value groups with minimal gradual shading. Follow the requested
    illumination without introducing a new light source.
  texture_and_material: >-
    Keep pigment matte and marks flat. Build interlace as controlled line and pattern construction,
    not as paper grain or woven material pasted over the depicted subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, scale, crop, placement and spatial relationships. Let compact
    silhouettes read within that frame without creating a page or border.
  atmosphere_and_mood: >-
    Create measured visual rhythm by alternating patterned and quiet areas. Preserve the requested
    tone without implying religious or historical narrative.
  rendering_and_quality: >-
    Keep pattern crossings clear, contours distinct and detail selective. Leave enough open space for
    the requested forms to remain legible and functional.
avoidRules:
  - interlace outside explicitly ornamented areas
  - unrequested religious symbols or page borders
