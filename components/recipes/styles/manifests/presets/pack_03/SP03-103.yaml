visualDna:
  aesthetic: 'RGB colored shadows: three lights in red, green and blue from different directions, so white surfaces glow neutral while each shadow turns a vivid color.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: White-lit areas neutral, shadows in cyan, magenta and yellow where one light is blocked.
  lighting_and_shadow: Three hard point lights; overlapping colored shadows fanning out behind objects.
  texture_and_material: Matte white or pale surfaces show the colored shadows best.
  camera_and_composition: Keep the requested framing; shadows falling on a floor or wall.
  atmosphere_and_mood: Playful and scientific, color born from light itself.
  rendering_and_quality: Accurate additive color mixing; not colored gels on a dark scene.
  creative_brief: "RGB colored shadows: three lights in red, green and blue from different directions, so white surfaces glow neutral while each shadow turns a vivid color. Carry it through red, green and blue lights, cyan-magenta-yellow shadows, white neutral lit areas, fanned shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: red, green and blue lights; cyan-magenta-yellow shadows; white neutral lit areas; fanned shadows; additive mixing
