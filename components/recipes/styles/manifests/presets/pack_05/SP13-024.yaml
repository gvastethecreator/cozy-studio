visualDna:
  aesthetic: >-
    Emphasize the strongest moment of the requested action with hard-edged forms, compact radiating
    vectors, and clear scale contrast. Let the existing scene supply any debris or impact cues; do
    not turn the action into an explosion or collision.
  subject_treatment: >-
    Preserve the requested subject identities and count, action, pose, props, wardrobe, setting,
    and tone. Restyle only contour emphasis, scale relationships, and edge rhythm. Do not add,
    remove, replace, or duplicate people, opponents, props, or scene elements.
  color_and_tone: >-
    Preserve the requested palette and emotional temperature. Where compatible, use restrained
    crimson or gold accents and strong value separation to focus attention on the existing action.
  lighting_and_shadow: >-
    Concentrate contrast around the requested action using the lighting already present in the
    scene. Do not invent flashes, explosions, sparks, electricity, machinery, or magic.
  texture_and_material: >-
    Use decisive edges and controlled surface detail to distinguish foreground, subject, and
    background. Preserve requested materials and add debris, dust, smoke, or grit only when the
    request includes them.
  camera_and_composition: >-
    When the requested camera leaves room for interpretation, use foreground-to-background scale
    contrast and radiating diagonals centered on the existing action. Preserve its direction and
    do not imply a collision that the request does not contain.
  atmosphere_and_mood: >-
    Let the requested tone lead. Create emphasis through scale and contrast without imposing
    triumph, danger, aggression, or a more intense emotion than requested.
  rendering_and_quality: >-
    Use hard, controlled strokes, stable anatomy or object structure, and a clear action focal
    point. Keep effects and detail subordinate so the requested subject and action stay legible.
  key_features: >-
    Hard-edged forms, scale contrast, compact radiating vectors, decisive contour emphasis, and
    controlled focal contrast applied to the requested action.
  creative_brief: >-
    Give the requested action a strong focal moment through controlled scale contrast, hard strokes,
    and radiating vectors. Preserve the requested subject, count, props, setting, action, and tone.
