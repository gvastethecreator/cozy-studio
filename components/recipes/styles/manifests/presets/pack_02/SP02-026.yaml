visualDna:
  aesthetic: 'Live sports broadcast: an HD telephoto camera on the rail following the action under floodlights, with the flat, bright look of a live feed.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Saturated field color, bright floodlit whites, clean neutral broadcast grading.
  lighting_and_shadow: Stadium floodlights from several directions creating multiple soft shadows.
  texture_and_material: Sharp HD detail on athletes, slightly compressed crowd behind.
  camera_and_composition: Long telephoto from the side, athletes compressed against a blurred crowd, action centered.
  atmosphere_and_mood: Electric and immediate, the moment happening live.
  rendering_and_quality: Clean HD live feed; any scorebug reduced to a textless shape or omitted.
  key_features: rail telephoto; floodlit multiple shadows; compressed crowd; saturated field color; live HD feed
  creative_brief: "Live sports broadcast: an HD telephoto camera on the rail following the action under floodlights, with the flat, bright look of a live feed. Carry it through rail telephoto, floodlit multiple shadows, compressed crowd, saturated field color, live HD feed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
