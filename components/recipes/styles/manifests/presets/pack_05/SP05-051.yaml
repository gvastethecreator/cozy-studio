visualDna:
  aesthetic: >-
    Fast, precise illustration built from segmented contours, tapered motion strokes, reflective
    edge accents, and alloy-like panel rhythm; speed comes from the marks, not added machinery.
  subject_treatment: >-
    Keep the requested anatomy and object shape intact. Clarify its existing edges with clean
    contour breaks and swept strokes; add no prostheses, armor, or mechanical limbs.
  color_and_tone: >-
    Set cyan and fuchsia against graphite and pearl, with a restrained warning-red accent.
    Reserve the brightest color for existing focal edges and motion.
  lighting_and_shadow: >-
    Separate forms with crisp cel-shadow planes; trace selected edges with narrow cool
    reflections and hot glints, without requiring a new light source.
  texture_and_material: >-
    Preserve each requested material. Suggest polished alloy through painted highlight bands and
    fine scuffs rather than replacing the subject’s surface.
  camera_and_composition: >-
    Honor the requested view and crop. Use diagonal strokes, tapered repeats, and varied line
    lengths to imply speed inside the existing composition.
  atmosphere_and_mood: >-
    Create urgency through forward line flow, compressed values, and bright accents while
    leaving the prompt’s emotional direction intact.
  rendering_and_quality: >-
    Use sharp ink boundaries, a few decisive cel-shadow values, controlled glow, and clean
    detail hierarchy; keep textures crisp rather than noisy.
  key_features: >-
    Segmented precision contours; cyan-fuchsia edge accents; reflective glints; diagonal speed
    rhythm.
  creative_brief: >-
    Preserve the specified subject, action, and setting. Apply segmented contours, cyan-fuchsia
    accents, and tapered motion marks to existing forms; add no prostheses, armor, or machinery.
