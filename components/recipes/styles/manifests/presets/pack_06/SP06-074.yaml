visualDna:
  aesthetic: 'Paint over photo: a photographic print partly covered by opaque acrylic swipes, drips and gestural strokes that hide, extend or redraw the image.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Muted photographic tones against bold, saturated paint; one paint color dominates, another answers.
  lighting_and_shadow: Photo light stays under the paint; the paint catches its own gloss and ridge highlights.
  texture_and_material: Loaded brush drag, palette-knife smears, drips running down the print, dry-brush edges over the photo grain.
  camera_and_composition: Keep the photo framing; paint covers roughly a third of the image and follows or breaks its main lines.
  atmosphere_and_mood: Restless and abstracted, reality partly overruled by a gesture.
  rendering_and_quality: Clear boundary between photograph and physical paint; no digital brush imitation.
  key_features: photographic print base; opaque acrylic swipes; drips; palette-knife smears; one dominant paint color
  creative_brief: "Paint over photo: a photographic print partly covered by opaque acrylic swipes, drips and gestural strokes that hide, extend or redraw the image. Carry it through photographic print base, opaque acrylic swipes, drips, palette-knife smears, one dominant paint color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
