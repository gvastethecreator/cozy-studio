  aesthetic: 'First-person dungeon crawl frame: a static first-person view down a stone grid corridor with symmetrical walls stepping back into darkness and a monster filling the center square.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; show the subject face-on in the center of a symmetrical stepped corridor view.
  color_and_tone: Limited palette of stone greys, torch orange and deep black.
  lighting_and_shadow: Distance darkness in discrete steps, torchlit near walls.
  texture_and_material: Pixelated brick walls, flat floor tiles and dithered darkness.
  camera_and_composition: Perfectly symmetrical one-point perspective corridor, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with claustrophobic step-by-step dread.
  rendering_and_quality: Crisp pixel walls with discrete depth steps, kept consistent across the whole image.
  creative_brief: "First-person dungeon crawl frame: a static first-person view down a stone grid corridor with symmetrical walls stepping back into darkness and a monster filling the center square. Carry it through symmetrical corridor, stepped depth, center monster, torch light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
