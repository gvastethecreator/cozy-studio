visualDna:
  aesthetic: >-
    Treat the named lineage as technique reference: sturdy, hand-drawn contours, clearly articulated
    joins and practical mechanical detail balanced by human warmth.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use warm ochre, brass or earth
    accents where useful, while keeping the prompt's colors and material distinctions.
  lighting_and_shadow: >-
    Use readable cel shadows and warm reflected accents; maintain the light direction requested.
  texture_and_material: >-
    Give constructed parts clear seams, joints and wear only when those parts exist; keep linework
    sturdy rather than cold or clinical.
  camera_and_composition: >-
    Use ensemble-like clarity to separate parts and figures already present; preserve count,
    placement and framing.
  atmosphere_and_mood: >-
    Mechanical warmth balances competence and approachability; do not force grimness, armor or
    sentiment into the prompt.
  rendering_and_quality: >-
    Apply the line and structural clarity to any subject; do not add armor, machinery, characters or
    a copied scene. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Sturdy contour; articulated joins; practical mechanical detail; warm accents; readable ensemble
    staging.
  creative_brief: "Apply this visual treatment to the requested content: Sturdy contour; articulated joins; practical mechanical detail; warm accents; readable ensemble staging. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - unreadable joins on constructed parts
  - sterile plastic sheen obscuring drawn contour
  - structural detail invented on unconstructed forms
