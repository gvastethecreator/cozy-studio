visualDna:
  aesthetic: 'Red-carpet gala formalwear: floor-length gowns and sharp black-tie, built for flashbulbs, with trains, capes and statement jewelry.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a floor-length gown with train, cape or dramatic neckline, or a sharply tailored tuxedo, plus one statement piece of jewelry."
  color_and_tone: Jewel tones — emerald, ruby, sapphire — or metallic gold and black.
  lighting_and_shadow: Flashbulb-bright key with sparkling highlights and dark falloff, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Satin, silk velvet, sequins, crystal embroidery and patent leather.
  camera_and_composition: Full-length framing with the train or cape spread, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Glamorous, triumphant and theatrical, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: High-shine gala finish with crisp detail, with believable fabric weight, seams and fit detail.
  key_features: floor-length gown with train; black-tie tailoring; jewel tones; flashbulb sparkle; statement jewelry
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Red Carpet Gown as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
