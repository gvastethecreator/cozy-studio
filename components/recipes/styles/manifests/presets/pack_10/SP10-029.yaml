schemaVersion: 1
id: SP10-029
packId: pack_10
name: Halftone Pattern
category: 3. Digital Glitch & Noise
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - digital-glitch-and-noise
visualDna:
  aesthetic: >-
    Halftone Pattern becomes a transferable digital signal artifact system: start from CMYK dots,
    Rosette pattern, and Moire pattern, then route prompt content through compression errors, scan
    hardware, pixel logic, channel shifts, and broken media encoding without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Dot grid to corrupt, quantize, sort, smear,
    scan, posterize, or channel-split forms without losing silhouette intent; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Cyan, Magenta, Yellow, Black; bind color to device behavior: phosphor
    masks, CMYK dots, RGB offsets, tape bleed, or indexed palettes, with enough value control that
    the subject remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: make light feel emitted, scanned, clipped, banded, or sampled
    rather than normally photographed, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Paper print as the tactile or mark-making basis; texture should come from pixels,
    scanlines, blocks, dither matrices, data drag, or print dots, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Moire pattern as reusable spatial grammar: use raster alignment, artifact seams,
    frame tears, grid pressure, and controlled signal breakdown, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Retro, graphic as the emotional register; derive mood from damaged playback, obsolete
    interfaces, surveillance, latency, and media failure, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Pop art, print: finish with intentional artifacts, sharp enough structure, and no
    random muddy AI noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    CMYK dots; Dot grid; Cyan, Magenta, Yellow, Black; Flat; Paper print; Moire pattern; Retro,
    graphic; Pop art, print; Rosette pattern
  creative_brief: >-
    Route any subject through Halftone Pattern as a transferable signal-distortion visual system:
    preserve prompt intent while converting form, motion, edge fidelity, pixel structure,
    compression behavior, and digital failure rhythm through this preset. Apply halftone print logic
    to the input: angled dot screens, CMYK rosette texture, size-modulated circles, and press-like
    color separation should make forms resolve from printed particles.
avoidRules:
  - smooth gradient
  - clean photo realism
  - random AI smear
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
