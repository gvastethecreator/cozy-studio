visualDna:
  aesthetic: 'Dual-Scale Symbols: a bold primary silhouette holds a second inner structure that appears only at large sizes and never harms reduction.'
  subject_treatment: Design the prompt's subject as a self-sufficient primary silhouette plus a secondary inner structure that adds meaning when enlarged; set requested text exactly.
  color_and_tone: Robust main contrast, with lower contrast reserved for the large-scale inner detail.
  lighting_and_shadow: Flat graphic rendering, with both scales living in the drawing itself.
  texture_and_material: Simple main edges, with detail grouped in one zone rather than spread as texture.
  camera_and_composition: Global and inner scales kept separate, detail away from critical contour zones.
  atmosphere_and_mood: Instant recognition followed by slow discovery, like a secret in plain sight.
  rendering_and_quality: A small version may drop the inner layer without changing the main meaning.
  creative_brief: "Dual-Scale Symbols: a bold primary silhouette holds a second inner structure that appears only at large sizes and never harms reduction. Carry it through bold outer silhouette, hidden inner layer, scale discovery, clean reduction. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bold outer silhouette; hidden inner layer; scale discovery; clean reduction
