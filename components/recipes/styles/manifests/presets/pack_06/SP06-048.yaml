visualDna:
  aesthetic: 'Digital matte painting: a painted and photo-integrated environment extension that makes a scene read as vast and real, as for a film establishing shot.'
  subject_treatment: Keep the prompt's subject and setting, and open the view into a wide establishing shot of vast scale; this preset owns that scale and depth, not a new subject.
  color_and_tone: 'Naturalistic filmic color with strong aerial perspective: saturated near planes, hazy desaturated blue-grey far planes.'
  lighting_and_shadow: One consistent sun or sky direction across every plane, matching shadow angles, volumetric haze between layers.
  texture_and_material: Photographic surface detail in the foreground blended seamlessly with painted mid and far planes, no visible seams.
  camera_and_composition: Wide establishing view with tiny figures or structures to prove scale; foreground, midground and background layers clearly stacked.
  atmosphere_and_mood: Epic, awe-inspiring and still, a world that feels enormous.
  rendering_and_quality: Seamless blend of painted and photographic detail, consistent perspective and light; no collage seams and no cartoon shapes.
  key_features: wide establishing shot; tiny scale figures; seamless photo and paint blend; aerial perspective haze; stacked depth planes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Matte Painting Extension as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
