visualDna:
  aesthetic: 'Shag carpet: long looped or cut shag pile covering the target like a rug.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in long shag carpet pile."
  color_and_tone: Retro orange, avocado, mustard or cream shag, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Warm indoor light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Long shag strands with deep pile, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Retro, cozy, kitsch and soft, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: long shag pile; retro colors; deep strands
  creative_brief: "Shag carpet: long looped or cut shag pile covering the target like a rug. Carry it through long shag pile, retro colors, deep strands. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
