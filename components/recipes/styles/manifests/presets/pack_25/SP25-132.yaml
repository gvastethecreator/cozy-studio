visualDna:
  aesthetic: 'Patchwork Information Panels: information blocks of different scales assembled under shared rules of margin, alignment and type.'
  subject_treatment: Assemble the prompt's supplied information into blocks of different scales under constant margins, alignment and type; keep every word exact.
  color_and_tone: A few role-based color fields with enough contrast for text in every block.
  lighting_and_shadow: Flat design and neutral presentation light with every panel crisp.
  texture_and_material: Even ink, precise edges and texture-less reading areas.
  camera_and_composition: One dominant panel with secondary blocks articulated around it.
  atmosphere_and_mood: Organized editorial richness and a sense of one designed whole.
  rendering_and_quality: Every panel shares one margin logic and no information is repeated.
  creative_brief: "Patchwork Information Panels: information blocks of different scales assembled under shared rules of margin, alignment and type. Carry it through modular panels, shared margins, one dominant block, role colors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: modular panels; shared margins; one dominant block; role colors
avoidRules:
  - ornamental patchwork
  - redundant blocks
  - low contrast in one panel
  - invented ingredients, certifications or legal text
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
