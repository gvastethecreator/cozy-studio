visualDna:
  aesthetic: >-
    Use a unified photographic response with selectively cut contours, coherent scale and minimal
    overlap. Keep the collage legible and integrated rather than chaotic.
  subject_treatment: >-
    Preserve the identity and count of requested subjects and the existing scene. Apply cut edges only
    along boundaries already supported by the composition; do not add people, objects or text.
  color_and_tone: >-
    Retain the requested palette and value relationships. Unify the photographic pieces gently
    without forcing a faded print palette or color shift.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep highlights and shadows consistent across
    the existing elements without adding a new source or scene.
  texture_and_material: >-
    Keep photographic surfaces visually compatible, with discreet cut or overlap edges where they
    clarify existing forms. Do not add a literal backing sheet or extra cutout props.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Use only the requested elements and
    keep overlaps minimal; do not rearrange them into a montage layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Collage cues change how existing image elements meet, not
    the location, period or narrative.
  rendering_and_quality: >-
    Keep scale relationships coherent and edges selective. Avoid chaotic layering, newspaper scraps,
    added captions or any invented source material.
avoidRules:
  - added people, objects, text or source material
  - chaotic cutouts, incoherent scale or excessive overlap
  - unrequested frame, backing sheet or layout
