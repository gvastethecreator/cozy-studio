visualDna:
  aesthetic: >-
    Build the drawing from dry-pen strokes, angular crosshatching and broken contours. Let line
    direction and narrow unmarked gaps describe volume through the ink itself.
  subject_treatment: >-
    Preserve the requested identity, proportions and function. Keep the main contour open where
    appropriate, and add measured internal branches only where they clarify the existing form.
  color_and_tone: >-
    Respect the requested palette. Use hatch density and reserved gaps to separate dark and light
    values without imposing monochrome when colors are specified.
  lighting_and_shadow: >-
    Follow the requested light direction and intensity. Translate shadow into line direction and
    density; keep the lit areas open without adding a new light source or setting.
  texture_and_material: >-
    Keep the dry, slightly broken quality inside the pen strokes. Let hatching follow the drawn
    structure rather than adding uniform grain over the depicted materials.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and arrangement. Keep the existing silhouettes and
    negative spaces readable within that composition.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Angular line rhythm is a drawing behavior and does
    not set the scene's genre or emotional intensity.
  rendering_and_quality: >-
    Establish the silhouette and broad value groups before small marks. Keep open gaps visible at
    reduced size; stop hatching before it closes the form or obscures identity.
avoidRules:
  - unrequested thorn, monster, or vegetation motifs
  - internal branches that alter the subject's identity or function
  - hatch density that closes important light gaps
  - unrequested horror or violence
