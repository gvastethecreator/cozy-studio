  lighting_and_shadow: Heroic backlight and dramatic space explosions blooming behind giant robots.
  texture_and_material: Hand-painted cel with detailed airbrushed mech painting and grain.
  camera_and_composition: Monumental heroic robot poses and huge space battle wides with fleets.
  atmosphere_and_mood: Keep the requested mood with hot-blooded heroic sacrifice.
  rendering_and_quality: Heroic 1988 Gainax OVA frame with hot-blooded energy.
