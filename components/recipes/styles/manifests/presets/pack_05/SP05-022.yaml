visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine variable contours with long tapered ends and
    intentional gaps and elongated, fashion-like forms set against broad black-white divisions.
    Let slow winding curves and measured drift set its rhythm; use monochrome black and ivory with
    a restrained violet accent for color and matte dark fields offset by translucent ink-like
    bands for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine variable contours with long tapered ends
    and intentional gaps for edge work, elongated, fashion-like forms set against broad
    black-white divisions for form simplification, and slow winding curves and measured drift only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with monochrome black and ivory with a restrained violet accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: severe cel shadows with a narrow violet-white rim. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with matte dark fields offset by translucent ink-like bands,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use vertical balance, wide negative spaces, and one
    curving visual path to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey cool composure with latent tension, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with precise contours, sharp value blocks, and very few luminous accents; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    fine variable contours with long tapered ends and intentional gaps; elongated, fashion-like
    forms set against broad black-white divisions; monochrome black and ivory with a restrained
    violet accent; slow winding curves and measured drift; matte dark fields offset by translucent
    ink-like bands; vertical balance, wide negative spaces, and one curving visual path.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine variable
    contours with long tapered ends and intentional gaps, elongated, fashion-like forms set
    against broad black-white divisions, and monochrome black and ivory with a restrained violet
    accent; use slow winding curves and measured drift only where movement is already present, and
    apply matte dark fields offset by translucent ink-like bands as the drawing finish.
