visualDna:
  aesthetic: 'Tie-dye: radial or spiral dye bursts with soft bleeding edges.'
  subject_treatment: "Apply this motif dyed into the fabric of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: spiral or radial dye bursts with soft edges."
  color_and_tone: Saturated rainbow or indigo, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Dyed cotton with bleed, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Joyful, free, hippie and bright, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: tie-dye spirals; bleeding edges
  creative_brief: "Tie-dye: radial or spiral dye bursts with soft bleeding edges. Carry it through tie-dye spirals, bleeding edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
