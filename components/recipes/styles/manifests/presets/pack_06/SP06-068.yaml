visualDna:
  aesthetic: 'Photocopied zine page: marker drawing, ballpoint hatching and halftoned photo scraps pasted up, then copied twice so everything shares the toner.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Black toner on grey-white copy paper with one hand-added fluorescent highlighter color; midtones break into coarse halftone.
  lighting_and_shadow: 'No real light: copier contrast blows the whites and crushes shadows into solid black.'
  texture_and_material: Toner speckle, grey copier streaks, visible paste-up edges, correction-fluid patches and slightly skewed copy.
  camera_and_composition: Keep the requested view; the drawn subject dominates, photo scraps and hatching fill the page edge to edge.
  atmosphere_and_mood: Raw and underground, made in one night for a small crowd.
  rendering_and_quality: Second-generation copy loss that keeps the subject legible; one flat highlighter color only.
  key_features: photocopy toner; marker and ballpoint; halftoned photo scraps; correction fluid; one highlighter color
  creative_brief: "Photocopied zine page: marker drawing, ballpoint hatching and halftoned photo scraps pasted up, then copied twice so everything shares the toner. Carry it through photocopy toner, marker and ballpoint, halftoned photo scraps, correction fluid, one highlighter color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
