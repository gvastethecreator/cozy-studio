visualDna:
  aesthetic: 'Prestige period anime frozen in the breath before a strike: long held frames, severe composition and a single thin line of tension.'
  subject_treatment: Keep the prompt's subject, action and setting; draw it at the instant before motion, weight settled, eyes fixed, hands resting near what they will use.
  color_and_tone: Slate greys, lacquer crimson and moonlit indigo with one sharp accent, mostly desaturated around a single warm point.
  lighting_and_shadow: Raking side light and long hard shadows, faces half in dark, a thin rim tracing the silhouette.
  texture_and_material: Clean cel with fine ink line, woven cloth folds and lacquer gloss kept sparse and controlled.
  camera_and_composition: Wide static frames with large empty space, or extreme close-ups on eyes and hands, nothing moving yet.
  atmosphere_and_mood: Silent, tense and ceremonial, like a held breath just before something fatal happens.
  rendering_and_quality: Theatrical prestige anime key frame with precise line weight and restrained effects.
  key_features: held breath; empty space; raking light; eye and hand close-ups
  creative_brief: "Prestige period anime frozen in the breath before a strike: long held frames, severe composition and a single thin line of tension. Carry it through held breath, empty space, raking light, eye and hand close-ups. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
