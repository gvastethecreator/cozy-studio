visualDna:
  aesthetic: >-
    Elongate existing contour accents and use fine celestial geometry, silver/navy/gold detail and
    poised spacing; do not alter anatomy or force a portrait crop.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use silver, deep navy and
    restrained gold accents around the prompt's own palette.
  lighting_and_shadow: >-
    Choose moonlike edge light only when compatible with the requested illumination; keep shadows
    delicate and legible.
  texture_and_material: >-
    Render ornament as fine line and small geometric marks, not extra jewelry, clothing or symbols.
  camera_and_composition: >-
    Use vertical spacing and slender accents inside the given composition; preserve aspect, crop and
    subject proportions.
  atmosphere_and_mood: >-
    Poised distance comes from spacing and delicate ornament; retain the prompt's mood rather than
    enforcing aloofness.
  rendering_and_quality: >-
    Transfer the vertical line language to any subject without changing its proportions or adding a
    moon, halo or costume. Keep important silhouettes and joins legible; no watermark, unrequested
    text or interface.
  key_features: >-
    Elongated contour accents; fine celestial geometry; silver/navy/gold; poised negative space;
    restrained ornament.
  creative_brief: >-
    Apply this visual treatment to the requested content: Elongated contour accents; fine celestial
    geometry; silver/navy/gold; poised negative space; restrained ornament. Preserve its identity,
    action, materials, composition and requested tone; introduce no persona, scene, franchise cue or
    extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - ornamental geometry obscuring source silhouette
  - heavy contour overwhelming fine geometry
  - ornament altering source proportions
