visualDna:
  aesthetic: 'Terraced water-stair garden: an Italian Renaissance villa garden cut into a hillside in axial terraces, linked by balustraded stairs, with a water staircase, grottoes and fountains driven by gravity.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Warm travertine and peperino stone, dark ilex and cypress, clipped box green, silver water and moss-darkened basins; warm, noble, mid-contrast.
  lighting_and_shadow: Warm afternoon side light on stone, deep shade in grottoes and under ilex groves, sparkle on falling water.
  texture_and_material: Balustraded ramps and double stairs, a stepped catena d'acqua channel, rusticated grotto niches with dripping moss, stone basins, clipped box, stone pines.
  camera_and_composition: Keep the requested view; look up or down the hillside axis so terraces stack, the water stair as the spine of the composition.
  atmosphere_and_mood: Theatrical, cool and humanist, a hillside choreographed with water.
  rendering_and_quality: Rich photograph with moss and stone detail, clean falling water, no flat parterre plain.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Terraced Water-Stair Garden as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
