visualDna:
  aesthetic: 'True buon fresco: mineral pigments painted into wet lime plaster so color becomes part of the wall, worked one day-patch at a time.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Earth and mineral palette of red ochre, yellow ochre, green earth, lime white and smalt blue; soft chalky mid-values with no deep blacks.
  lighting_and_shadow: Diffuse daylight modeling in broad light and shadow areas; simplified volumes suited to viewing across a room.
  texture_and_material: Rough lime plaster with trowel marks, faint seams between day-patches, hairline cracks, small flaked losses revealing pale plaster underneath.
  camera_and_composition: Keep the requested framing; forms are broad and readable from a distance, with architectural stability.
  atmosphere_and_mood: Grand, calm and weathered, a painting centuries into the wall.
  rendering_and_quality: Matte chalky color sunk into plaster, broad brushwork, controlled wear only at seams and edges; no gloss and no oil depth.
  key_features: pigment sunk into lime plaster; day-patch seams; mineral earth palette; hairline cracks and flaked losses; broad readable forms
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fresco (Wall) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
