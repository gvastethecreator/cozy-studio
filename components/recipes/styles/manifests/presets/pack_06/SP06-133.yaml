visualDna:
  aesthetic: 'Chine-collé etching: an etched plate printed onto a thin colored tissue that is glued to the heavier sheet in the same pass, so a tinted panel sits behind the lines.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Black or sepia etched line over one pale tinted tissue, such as gold, rose, celadon or grey, on white paper.
  lighting_and_shadow: The tissue shape acts as a light or accent zone, with lines providing modeling.
  texture_and_material: Delicate translucent tissue fibers, crisp or torn tissue edges, bitten etched lines, embossed plate mark over both papers.
  camera_and_composition: Keep the requested framing; the tissue panel covers part of the image, often behind the focal subject or the sky.
  atmosphere_and_mood: Refined, quiet and precious, a print with a hidden glow.
  rendering_and_quality: Clean etched lines crossing from white paper onto the tinted tissue, visible tissue edge, plate mark; no painted color.
  creative_brief: "Chine-collé etching: an etched plate printed onto a thin colored tissue that is glued to the heavier sheet in the same pass, so a tinted panel sits behind the lines. Carry it through tinted tissue laid under the etching, visible torn or cut tissue edge, black etched line, embossed plate mark, one accent color zone. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tinted tissue laid under the etching; visible torn or cut tissue edge; black etched line; embossed plate mark; one accent color zone
