visualDna:
  aesthetic: >-
    Organic surface painting models existing curvature with brush marks that follow each volume, using
    softer edges within a mass and firmer edges where forms overlap.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let brushwork follow the subject's
    existing forms without turning machines or other objects into flesh.
  color_and_tone: >-
    Allow local color variation within the requested palette while keeping value groups clear. Avoid
    excess shine or a color cast that changes the represented materials.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Express volume through mark direction and
    overlap without adding a new light source or glow.
  texture_and_material: >-
    Adapt texture and stroke direction to each requested material. Keep the mark-making tied to volume
    rather than making every surface look organic or skin-like.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Organic brushwork does not
    require a creature, close-up or rearrangement.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. The name describes a brush behavior, not a biological subject
    or a required scene.
  rendering_and_quality: >-
    Build soft transitions within larger masses and use crisp edges to clarify overlap. Keep strokes
    directional and selective so the underlying structure remains legible.
avoidRules:
  - flesh-like transformation of represented materials
  - unrelated surface-wide texture
