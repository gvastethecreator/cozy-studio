visualDna:
  aesthetic: >-
    Use this drawing language: Gross marker-doodle treatment with crooked contour, melted
    wobble, slime-like strokes, chlorine-tinted accents, cheap-paper grain, and plastic shine.
    Apply it as a surface and line treatment to user-provided content; let the user control
    subject and context.
  subject_treatment: >-
    Apply crooked marker outlines, liquid-like wobble, naive irregular curves, and optional flow
    strokes to the supplied subject while preserving its identity, silhouette, requested action,
    actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: >-
    Use acid green, wet turquoise, warm red, bright cool blue, sticky yellow, and marker black
    as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use bright flat fill with high-contrast slick-looking marks as a visual treatment, while
    respecting any lighting instructions in the request.
  texture_and_material: >-
    Render marker bleed, slick-looking highlights, wet-paper grain, plastic-like sheen marks,
    and damp speckles as drawn or printed surface marks over the existing material; do not
    change the subject's actual substance or function.
  camera_and_composition: >-
    Use gooey marker strokes and drooping contours to emphasize the supplied form; retain the
    requested composition and setting.
  atmosphere_and_mood: >-
    Goofy and gross with sticky visual energy; retain the source setting and subject.
  rendering_and_quality: >-
    Finish with marker bleed, rough paper, damp-looking highlights, and a flat, deliberately
    crude line.
  key_features: >-
    crooked marker contour; liquid-like wobble; naive irregular curves; flow accents; marker
    bleed; wet-look highlights
  creative_brief: >-
    Render the supplied content with crooked marker outlines, liquid-like wobble, naive
    irregular curves, and optional flow strokes. Use acid green, wet turquoise, warm red, bright
    cool blue, sticky yellow, and marker black as style colors while honoring any explicit color
    instructions. Apply marker bleed, slick-looking highlights, wet-paper grain, plastic-like
    sheen marks, and damp speckles as drawn or printed marks over the existing material, without
    changing what the subject is made of or how it functions. Preserve the requested subject,
    action, and setting; follow the supplied composition and add no unrequested cast, location,
    lettering, or gag.
