visualDna:
  aesthetic: Dense pen crosshatch seinen manga that builds shadow in three to five layered hatch directions and stops cleanly at large open paper areas, so forms feel carved and heavy.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Charcoal black and bone white with a narrow muted red-brown accent; mostly monochrome.
  lighting_and_shadow: A hard single source; broad shadow masses cover most of the frame against a few exposed edges.
  texture_and_material: Fine nib lines whose direction and spacing change with every plane; no photoreal grime.
  camera_and_composition: Keep the requested framing; empty paper areas act as counterweight to the dense hatching.
  atmosphere_and_mood: Oppressive weight and grim endurance, even in a quiet scene.
  rendering_and_quality: Meticulous nib crosshatching with clean white gaps and legible detail inside the darks.
  key_features: layered three-to-five direction crosshatch; clean open paper gaps; charcoal and bone; dominant shadow mass; hard single source
  creative_brief: "Dense pen crosshatch seinen manga that builds shadow in three to five layered hatch directions and stops cleanly at large open paper areas, so forms feel carved and heavy. Carry it through layered three-to-five direction crosshatch, clean open paper gaps, charcoal and bone, dominant shadow mass, hard single source. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
