  color_and_tone: Primary colors with pink, mint and black, used consistently across subject and background.
  lighting_and_shadow: Flat light and hard shadows, expressed through the style rather than photographic lighting.
  texture_and_material: Flat patterned surfaces and laminate, visible at card size as the signature of the style.
  camera_and_composition: Playful staged framing with objects on pedestals, arranged so the subject still reads at card size.
  atmosphere_and_mood: Playful, loud, witty and irreverent, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp graphic render, with clean, deliberate marks and no accidental noise.
