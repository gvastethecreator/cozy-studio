visualDna:
  aesthetic: 'Fountain pen drawing: a flexible steel nib swelling and thinning with pressure, iron-gall ink browning as it dries, loose washes pulled with a wet finger.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Blue-black ink oxidizing to warm brown on cream laid paper, with pale grey ink washes.
  lighting_and_shadow: Shadows massed with thick swelling strokes and quick washes; light left as open paper.
  texture_and_material: Tapered entry and exit strokes, nib-spread lines, small ink spatters and feathering on laid paper.
  camera_and_composition: Keep the requested view with airy placement and plenty of open paper.
  atmosphere_and_mood: Elegant and spontaneous, like a traveller’s sketchbook.
  rendering_and_quality: Line-led drawing with modulated width and a few washes; no pencil and no digital fill.
  key_features: flex-nib swelling line; iron-gall ink browning; finger washes; spatters; laid paper
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fountain Pen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
