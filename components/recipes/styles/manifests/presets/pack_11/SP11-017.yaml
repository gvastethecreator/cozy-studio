visualDna:
  aesthetic: >-
    Action Figure (90s) operates as a portable source-router layer: combine Retro action-toy
    collectible style with heroic molded proportions, shelf-display energy, and kinetic
    play-readiness with hand-built object logic with toy scale, assembly marks, tactile charm, and
    playful construction, so the preset supplies visual behavior rather than a fixed card scene or
    literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms simplify,
    assemble, soften, hinge, stitch, fold, carve, or snap together through Sculpted lead-form
    contour emphasis with clearly expressed articulation seams, bold toy silhouette clarity, and
    pose-forward geometry; identity stays readable through construction grammar, proportion, edge
    logic, and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through material-native color blocks, toy-safe saturation, handmade variance, and
    clean separation between parts; keep hue roles intentional, value separation clear, and palette
    behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Retail-style overhead speculars, blister-like glare streaks, and glossy card-surface
    reflections for packaging realism plus small-scale object lighting, crisp edge readability, soft
    contact shadows, and material-specific highlights as the light-response contract, with readable
    hierarchy, controlled contact detail, and no lighting choice that erases the user's requested
    content.
  texture_and_material: >-
    Render Injection-mold plastic sheen, painted detail pass variation, seam-line evidence, and
    rigid-shell synthetic finish plus plastic, clay, yarn, paper, wood, metal, felt, ice, tile,
    thread, sand, or carved surface behavior; surface scale, residue, gloss, grain, fiber, pores,
    edges, or signal artifacts must remain coherent across figures, objects, and environments.
  camera_and_composition: >-
    Compose with poseable toy joint logic with hinge/swivel articulation cues and exaggerated heroic
    torso-to-limb proportioning plus object-scale staging, modular silhouette rhythm, clear
    construction reads, and tactile detail hierarchy as reusable framing grammar, allowing cards,
    portraits, objects, scenes, and abstract prompts to inherit the style without one required
    layout.
  atmosphere_and_mood: >-
    Carry mood through play, collectability, handmade care, nostalgia, miniature engineering, and
    physical charm; the emotional tone should feel specific to Action Figure (90s) while still
    obeying the prompt's subject and context.
  rendering_and_quality: >-
    Finish with clean craft detail, readable construction, deliberate imperfections, and no
    accidental realism collapse; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Retro action-toy collectible style with heroic molded proportions, shelf-display energy, and
    kinetic play-readiness; Sculpted lead-form contour emphasis with clearly expressed articulation
    seams, bold toy silhouette clarity, and pose-forward geometry; Injection-mold plastic sheen,
    painted detail pass variation, seam-line evidence, and rigid-shell synthetic finish;
    Retail-style overhead speculars, blister-like glare streaks, and glossy card-surface reflections
    for packaging realism; poseable toy joint logic with hinge/swivel articulation cues and
    exaggerated heroic torso-to-limb proportioning
  creative_brief: >-
    Use Action Figure (90s) after prompt X as a transferable style layer: prompt X supplies subject,
    action, and setting, while the preset supplies Retro action-toy collectible style with heroic
    molded proportions, shelf-display energy, and kinetic play-readiness, Sculpted lead-form contour
    emphasis with clearly expressed articulation seams, bold toy silhouette clarity, and
    pose-forward geometry, Injection-mold plastic sheen, painted detail pass variation, seam-line
    evidence, and rigid-shell synthetic finish, Retail-style overhead speculars, blister-like glare
    streaks, and glossy card-surface reflections for packaging realism, poseable toy joint logic
    with hinge/swivel articulation cues and exaggerated heroic torso-to-limb proportioning plus
    clearly expressed joins, simplified proportions, craft tolerances, modular parts, and
    maker-process evidence, palette behavior, light response, material treatment, and finish
    discipline without requiring one specimen, prop bundle, product still, or card composition.
