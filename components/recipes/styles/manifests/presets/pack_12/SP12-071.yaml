visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Half-Life 2 gameplay screenshots: first-person
    resistance shooter capture with City 17 infrastructure, canals, Combine geometry, physics props,
    and grounded route combat. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Half-Life 2-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Half-Life 2-informed palette: concrete grey, hazard orange, resistance blue, industrial
    green, rust brown, and alien black metal. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through overcast daylight, hard industrial shadows, muzzle flashes, scanner
    glow, and sodium streetlamp pools. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from concrete canals, cracked plaster, metal fences, wooden crates, physics
    debris, alien machinery, and utilitarian weapons. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person shooter framing with weapon foreground, cover lanes, physics objects,
    enemy silhouettes, and navigable urban depth. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Half-Life 2-derived mood: oppressed, practical, rebellious, decayed, and grounded. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: classic health/suit/ammo HUD
    and crosshair can appear, but avoid modern UI clutter. Maintain heavy-denoise clarity, crisp
    focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Half-Life 2 gameplay screenshots; first-person resistance shooter capture with City 17
    infrastructure, canals, Combine geometry, physics props, and grounded route combat; concrete
    grey, hazard orange, resistance blue, industrial green, rust brown, and alien black metal;
    overcast daylight, hard industrial shadows, muzzle flashes, scanner glow, and sodium streetlamp
    pools; concrete canals, cracked plaster, metal fences, wooden crates, physics debris, alien
    machinery, and utilitarian weapons; first-person shooter framing with weapon foreground, cover
    lanes, physics objects, enemy silhouettes, and navigable urban depth; oppressed, practical,
    rebellious, decayed, and grounded; HUD guidance: classic health/suit/ammo HUD and crosshair can
    appear, but avoid modern UI clutter
  creative_brief: >-
    Use Half-Life 2 Verdant Rebellion as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Half-Life 2: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
