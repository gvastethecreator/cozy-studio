visualDna:
  aesthetic: 'Stepped paddy terraces: hillsides carved into narrow flooded fields that follow the contours, held by earthen or stone bunds and fed by channels from the forest above.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Mirror-silver flooded pools reflecting sky, fresh seedling green, ripening gold, dark mud and earth bunds; colour changing with the season.
  lighting_and_shadow: Low sun or mist catching water in each terrace as bright curving slivers, soft shadows along the bund edges.
  texture_and_material: Curving mud or drystone retaining bunds, shallow water with seedling rows, bamboo irrigation spouts and channels, forest above the top terraces.
  camera_and_composition: Keep the requested view; contour lines stacking into layered curves across the frame, from a high viewpoint or a low bund edge.
  atmosphere_and_mood: Patient, communal and vast, a mountain shaped by generations of hands.
  rendering_and_quality: Landscape photograph with precise contour curves and water reflections, no costumed tourist staging.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Stepped Paddy Terraces as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: contour-following flooded terraces; earthen and stone bunds; sky reflected in each pool; irrigation channels from the forest; seasonal green-to-gold colour
