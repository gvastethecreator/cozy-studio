visualDna:
  aesthetic: >-
    Playful but eerie medieval marginalia with odd beasts, monkish diagrams, small grotesques, and clean
    parchment space.
  subject_treatment: >-
    Transform any subject with scholastic marginalia oddness, playful medieval exaggeration, tiny support
    motif rhythm, clean ink contour, and textless side-note humor without requiring a fixed joke.
  color_and_tone: Parchment, dark brown ink, dull red, faded blue, olive green, and wide blank margins.
  lighting_and_shadow: Flat manuscript light with simple object shadows only when useful.
  texture_and_material: Pen outlines, small flat color fills, smooth parchment, and sparse decorative marks.
  camera_and_composition: >-
    Asymmetrical manuscript margin crop, one large funny-strange creature, and small support motifs without
    words.
  atmosphere_and_mood: Strange, witty, medieval, unsettling, and collectible.
  rendering_and_quality: Clean line illustration with low detail density and generous negative space.
  creative_brief: >-
    Reusable visual system for any subject needing scholastic marginalia play, medieval side-note weirdness,
    textless occult humor, and clean parchment spacing.
avoidRules:
  - readable manuscript text
  - cluttered page full of drawings
  - dense hatch texture
  - modern cartoon look
  - explicit gore
  - watermark
  - text
