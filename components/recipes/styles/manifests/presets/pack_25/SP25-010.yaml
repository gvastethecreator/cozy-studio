visualDna:
  aesthetic: 'Stacked Silhouette Emblems: two or three silhouettes stack and nest through complementary edges with generous breathing space.'
  subject_treatment: Stack the prompt's subject with one or two related silhouettes whose edges complete each other, one reading dominant; set requested text exactly.
  color_and_tone: Levels separated by value only when needed, with recognition checked in one ink.
  lighting_and_shadow: Flat planes where every contact between pieces is resolved in the drawing.
  texture_and_material: Solid graphic surfaces with shared complementary edges and no secondary ornament.
  camera_and_composition: Stacked by the hierarchy of the idea, with weight growing toward the base.
  atmosphere_and_mood: Support and cooperation, the pieces holding each other up.
  rendering_and_quality: Shared edges keep both readings intact even when the pieces are pulled apart.
  creative_brief: "Stacked Silhouette Emblems: two or three silhouettes stack and nest through complementary edges with generous breathing space. Carry it through nested silhouettes, complementary edges, weighted base, breathing gaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: nested silhouettes; complementary edges; weighted base; breathing gaps
