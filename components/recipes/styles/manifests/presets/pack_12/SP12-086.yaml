visualDna:
  aesthetic: >-
    Anchor the preset in Amnesia: The Dark Descent's 2010 HPL2 first-person survival-horror
    presentation: plain physically handled spaces, simple geometry, modest diffuse textures, and
    darkness that limits what the player can know.
  color_and_tone: >-
    Use subdued stone gray, old wood, and umber, with a small wick-amber pool against cool,
    uncertain darkness. Avoid a broad amber grade or rich high-contrast fantasy color.
  lighting_and_shadow: >-
    A small practical lantern or candle produces steep light falloff over nearby surfaces; faint
    cool ambient light may separate far silhouettes. Keep a requested immediate interaction legible
    while the far space loses detail. Avoid modern ray-traced gloss, full-screen amber grading and
    black-crushed foregrounds.
  texture_and_material: >-
    Use simple stone, timber, iron, and cloth with restrained 2010 diffuse texture resolution and
    localized stains. Avoid modern PBR sheen, dense microtexture, and generalized gore.
  camera_and_composition: >-
    Use a human eye-level first-person gameplay camera and keep the requested near-field action
    legible. Do not add a door, lantern or interaction object unless the prompt calls for it.
  rendering_and_quality: >-
    Keep an authentic HPL2-era real-time image: simple meshes, soft diffuse surfaces, practical
    light, and stable first-person scale. Avoid cinematic depth-of-field and contemporary
    high-detail corridor rendering.
  subject_treatment: >-
    Preserve requested subject and action in first person. Use near-field physics-object scale and a
    vulnerable exploration relationship to space. A held light or hands belong only where the
    requested action needs them; do not introduce a named protagonist, threat or weapon fight by
    default.
  atmosphere_and_mood: >-
    Maintain vulnerable first-person perception and limited visibility while preserving the
    requested event; combat and monster reveal are not required.
avoidRules:
  - third-person portrait, isometric view or cinematic cutaway
  - mandatory monster, chase, castle landmark or named character
  - bright modern PBR gloss, dense microtexture or exaggerated film grain
  - total-black near field or unreadable requested action
  - >-
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
    unrequested sanity meter, oil gauge, HUD, crosshair, interface, logo or captions; preserve
    explicitly requested UI and text
  - anime, manga or cel-shaded grammar
