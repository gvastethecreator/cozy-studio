visualDna:
  aesthetic: 'Kodachrome 64 color slide: a slow, sharp reversal stock with dense dye layers, famous for rich reds, deep blues and weighty blacks.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Cardinal and tomato reds that pop, deep saturated blues, warm golden highlights, and dense near-black shadows; skin warm and slightly ruddy.
  lighting_and_shadow: Bright, direct daylight suits it best; contrast is high, shadows heavy and inky, highlights clean.
  texture_and_material: Very fine grain and crisp detail; paint, fabric and feathers look dense and solid.
  camera_and_composition: Keep the requested framing; 35 mm slide sharpness with a slightly warm projected glow.
  atmosphere_and_mood: Confident and vivid, bold reds anchored by heavy inky shadows.
  rendering_and_quality: Slide-film density and color separation; modern subjects stay modern — no mid-century costume or props unless asked.
  key_features: dense slide dyes; cardinal red pop; deep blues; inky shadows; very fine grain
  creative_brief: "Kodachrome 64 color slide: a slow, sharp reversal stock with dense dye layers, famous for rich reds, deep blues and weighty blacks. Carry it through dense slide dyes, cardinal red pop, deep blues, inky shadows, very fine grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
