visualDna:
  aesthetic: Dry-brush illustration built from directional bristle marks and compact areas of untouched ground.
  subject_treatment:
    Build the requested forms with a few directional strokes aligned to their volume. Preserve
    identity and pose instead of adding gestural action.
  color_and_tone:
    Organize the requested palette into a light ground, broad mid-values and sparse deep accents.
    Keep value groups separate.
  lighting_and_shadow:
    Use broken stroke coverage to turn planes toward light. Keep the largest shadows connected
    instead of scattering dark speckles.
  texture_and_material:
    Let bristles split at stroke edges and skip across the support. Vary mark width with pressure
    and stop texture where the form needs a clear boundary.
  camera_and_composition:
    Preserve the user composition. Direct mark flow around its focal structure rather than
    adding diagonals or changing the camera.
  atmosphere_and_mood:
    The requested mood determines pressure and spacing. A calm subject can remain calm even when
    the brushwork is visibly physical.
  rendering_and_quality:
    Use decisive stroke groups, clean focal edges and restrained surface noise. Avoid a generic
    grunge layer applied equally everywhere.
avoidRules:
  - uniform grunge overlay
  - random directional scratches
  - muddy disconnected shadow noise
