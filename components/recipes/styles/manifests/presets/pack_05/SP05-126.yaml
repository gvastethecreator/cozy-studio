visualDna:
  aesthetic: >-
    Build the graphic anime treatment from elastic bright contours with doubled reaction marks and
    rounded wavering forms offset by sharp comic accents. Let loops, snaps, and recoil arcs
    attached to existing gestures set its rhythm; use teal, hot pink, and lime in small bursts
    against dark ink for color and clean cel fills with faintly mottled translucent color regions
    for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use elastic bright contours with doubled reaction
    marks for edge work, rounded wavering forms offset by sharp comic accents for form
    simplification, and loops, snaps, and recoil arcs attached to existing gestures only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with teal, hot pink, and lime in small bursts against dark ink. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: opposed bright accents and sharp shadow cuts without a literal
    glow source. Keep shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean cel fills with faintly mottled translucent color regions,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use contrasting color rhythms gathered around the focal
    area with room to breathe to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey buoyant surprise and warm, quick shifts, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with flexible contour, vivid color collision, and controlled graphic marks; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    elastic bright contours with doubled reaction marks; rounded wavering forms offset by sharp
    comic accents; teal, hot pink, and lime in small bursts against dark ink; loops, snaps, and
    recoil arcs attached to existing gestures; clean cel fills with faintly mottled translucent
    color regions; contrasting color rhythms gathered around the focal area with room to breathe.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with elastic bright
    contours with doubled reaction marks, rounded wavering forms offset by sharp comic accents,
    and teal, hot pink, and lime in small bursts against dark ink; use loops, snaps, and recoil
    arcs attached to existing gestures only where movement is already present, and apply clean cel
    fills with faintly mottled translucent color regions as the drawing finish.
