visualDna:
  aesthetic: 'Book-Object Sequence: the cover, spine and interior spreads of one book shown together with one consistent identity and geometry.'
  subject_treatment: Show the prompt's book as cover, spine and two interior spreads with one identity and matching proportions, the title exact everywhere.
  color_and_tone: A shared palette and type roles from outside to inside.
  lighting_and_shadow: Flat artwork views and a soberly lit closed book.
  texture_and_material: Coherent conceptual materials shown as a visual study.
  camera_and_composition: Cover, spine and pages with compatible proportions and protected text.
  atmosphere_and_mood: Unity of object and reading, a book you want to open.
  rendering_and_quality: Crisp set where title and structure match on every face.
  creative_brief: "Book-Object Sequence: the cover, spine and interior spreads of one book shown together with one consistent identity and geometry. Carry it through cover, spine, spreads, one identity, matching proportions. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cover, spine, spreads; one identity; matching proportions; exact title
