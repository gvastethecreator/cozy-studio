visualDna:
  aesthetic: >-
    A 2015 PS4-generation real-time action-horror frame whose Gothic environment is experienced from
    immediately behind the playable hunter. The environment rises around a human-scale figure
    instead of being reduced to an elevated ARPG playfield.
  subject_treatment: >-
    Preserve the requested actor, action, and objects. When a playable figure is included, keep it
    in the near foreground at close third-person scale; retain a clear silhouette and the relation
    between the figure, weapon if requested, and nearby architecture without adding an opponent.
  color_and_tone: >-
    Use deep blue-gray and blue-black shadow, soot-dark wood or stone, and restrained umber. Small
    amber candle or gaslight points and cool window light can separate planes; avoid a uniform
    crimson tint.
  lighting_and_shadow: >-
    Favor low-key real-time lighting with strong local contrast: the inspected interior has cool
    beams entering high windows and sparse warm lights against deep architecture shadow. Keep enough
    midtone on the character and route for gameplay reading.
  texture_and_material: >-
    Show game-scale stone, timber, iron, glass, and worn cloth with the restrained detail of an
    original PS4-era frame. Let light reveal the material transitions; wetness is scene-dependent
    rather than a global surface treatment.
  camera_and_composition: >-
    Use a close over-the-shoulder third-person camera at human height. Place the playable figure
    near the lower foreground and let rails, floor lines, tall windows, and columns lead forward
    into the playable space; do not switch to an isometric or first-person view.
  atmosphere_and_mood: >-
    Keep immediate architectural oppression and uncertain depth around the player while leaving the
    route and requested action legible. A hunt, enemy, or attack is not mandatory.
  rendering_and_quality: >-
    Read as interpreted 2015-era real-time PS4 gameplay with stable third-person perspective,
    low-light environment detail, and clean actor-to-architecture separation. Include HUD or
    captions only when explicitly requested; preserve requested text or interface rather than
    banning it.
avoidRules:
  - isometric or first-person view
  - static fashion portrait in place of gameplay-scale framing
  - unreadable subject/architecture overlap
  - unrequested canonical hunter, weapon, boss or landmark
  - unrequested HUD, logo, interface or captions; preserve explicitly requested UI and text
  - anime, manga or cel-shaded grammar
