  color_and_tone: Bright team colors against clear sky or pool blue with white highlights.
  lighting_and_shadow: Bright daylight or arena light with clean shadows under airborne bodies.
  texture_and_material: Uniforms, pom-poms, water spray and mats drawn in crisp cel.
  camera_and_composition: Symmetrical framings, overhead views of formation patterns and poses mirrored across the team.
  atmosphere_and_mood: Joyful and exact, trust between teammates made visible in the air.
  rendering_and_quality: Precise sports anime with repeated figures and clean symmetry.
  key_features: unison; mirrored poses; aerial pyramid; symmetry
  creative_brief: "Synchronized team anime of aerial precision: cheer pyramids, divers in unison and bodies moving as one pattern. Carry it through unison, mirrored poses, aerial pyramid, symmetry. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
