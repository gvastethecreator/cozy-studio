visualDna:
  aesthetic: >-
    Precise anime line uses crisp mechanical geometry where relevant and clean silhouette
    hierarchy.
  subject_treatment: >-
    Preserve forms, group size, and action; render machines only as supplied, add no bridge
    or interface.
  color_and_tone: >-
    Navy, warm white, orange, teal in distinct fields with neutral separation.
  lighting_and_shadow: >-
    Broad cool fill and small warm edge accents; no control-panel glow or new source.
  texture_and_material: >-
    Smooth cel surfaces; parallel hatch only on hard surfaces already depicted.
  camera_and_composition: >-
    Hold camera and count; rhythm comes from existing scale and spacing.
  atmosphere_and_mood: >-
    Playful cadence only if requested; preserve serious or quiet moods equally.
  rendering_and_quality: >-
    Exact contours, clean flats, legible hard surfaces, no UI or fake text.
  key_features: >-
    Crisp mechanical line when relevant, navy-orange balance, smooth flats, spacing-led
    group rhythm
  creative_brief: 'Apply a visual treatment centered on crisp mechanical line when relevant, navy-orange balance, smooth flats, spacing-led group rhythm. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
