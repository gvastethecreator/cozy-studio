visualDna:
  aesthetic: 'Cosmic horror anime where the sky itself is wrong: impossible geometries, too many stars and vast shapes behind the clouds.'
  subject_treatment: Keep the prompt's subject and setting; open the sky above it onto something vast and incomprehensible.
  color_and_tone: Violet, sickly teal and black sky over an ordinary warm-colored world below.
  lighting_and_shadow: Cold light from the sky with no clear source, casting pale, directionless shadows.
  texture_and_material: Swirling painted skies, geometric star patterns and clean cel landscapes.
  camera_and_composition: Worm-eye views up at the sky or wide frames with a thin strip of land.
  atmosphere_and_mood: Awe and dread together, a mind straining to understand something far too big.
  rendering_and_quality: Painterly prestige anime skies with precise small-scale ground detail.
  creative_brief: "Cosmic horror anime where the sky itself is wrong: impossible geometries, too many stars and vast shapes behind the clouds. Carry it through impossible sky, vast shapes, directionless light, thin horizon. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
