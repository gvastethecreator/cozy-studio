visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Mirror's Edge Catalyst gameplay screenshots:
    first-person parkour capture with white rooftop geometry, red route language, clean corporate
    city planes, and motion-forward traversal. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Mirror's Edge Catalyst-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Mirror's Edge Catalyst-informed palette: white concrete, sky cyan, route red, glass blue,
    matte black, and occasional yellow safety accents. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through bright daylight, hard rooftop shadows, reflective glass, and clean
    exposure with minimal grime. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from smooth concrete, painted pipes, vents, glass railings, red doors, gloves,
    and polished urban surfaces. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person sprint framing with hands, jump arcs, wall-run lines, ledge targets,
    and direct route readability. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Mirror's Edge Catalyst-derived mood: kinetic, sterile, rebellious, precise, and
    breathless. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal runner vision, tiny
    objective marker, or reticle is allowed; avoid heavy shooter UI. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Mirror's Edge Catalyst gameplay screenshots; first-person parkour capture with white rooftop
    geometry, red route language, clean corporate city planes, and motion-forward traversal; white
    concrete, sky cyan, route red, glass blue, matte black, and occasional yellow safety accents;
    bright daylight, hard rooftop shadows, reflective glass, and clean exposure with minimal grime;
    smooth concrete, painted pipes, vents, glass railings, red doors, gloves, and polished urban
    surfaces; first-person sprint framing with hands, jump arcs, wall-run lines, ledge targets, and
    direct route readability; kinetic, sterile, rebellious, precise, and breathless; HUD guidance:
    minimal runner vision, tiny objective marker, or reticle is allowed; avoid heavy shooter UI
  creative_brief: >-
    Use Mirrors Edge Rooftop Parkour as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Mirror's Edge Catalyst: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
