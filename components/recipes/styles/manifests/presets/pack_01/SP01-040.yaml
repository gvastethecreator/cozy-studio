visualDna:
  aesthetic: 'Volumetric god rays: hard beams of light made visible by haze, dust or fog, crossing the scene in defined shafts.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Bright warm or cool shafts against darker hazy surroundings; atmosphere lifts the shadows slightly.
  lighting_and_shadow: Strong source behind an occluder (trees, windows, clouds) producing parallel or radiating shafts; subjects partially cut by beams.
  texture_and_material: Dust motes, smoke, spray or mist in the beams.
  camera_and_composition: Keep requested framing; angle the beams across the frame toward or past the subject.
  atmosphere_and_mood: Sacred, awe-filled, and quiet.
  rendering_and_quality: Clean beam edges and smooth haze without banding.
  key_features: visible light shafts; haze; occluder pattern; dust motes; subject crossed by beams
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies God Rays (Volumetric) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
