visualDna:
  aesthetic: 'Coalpunk: underground mining cities of lamp-lit tunnels, coal carts, pit ponies, pumping engines and soot-blackened faces.'
  subject_treatment: Keep the prompt's subject and setting; take it underground or into a mining town, lit by lamps and dusted with coal.
  color_and_tone: Coal black and slate grey with small warm lamp pools and ember red.
  lighting_and_shadow: Helmet and hand lamps as the only light, tiny circles in overwhelming darkness.
  texture_and_material: Coal seams, timber props, rail carts, soot and sweat on skin.
  camera_and_composition: Tunnel perspectives lit only by lamps, and tight framing on faces in the dark.
  atmosphere_and_mood: Claustrophobic and communal, danger shared by people who trust each other with their lives.
  rendering_and_quality: Low-key period illustration with heavy darks and precise lamp glows.
  creative_brief: "Coalpunk: underground mining cities of lamp-lit tunnels, coal carts, pit ponies, pumping engines and soot-blackened faces. Carry it through lamp pools, coal seams, timber props, soot. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: lamp pools; coal seams; timber props; soot
