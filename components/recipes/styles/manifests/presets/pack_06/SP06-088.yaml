visualDna:
  aesthetic: 'Early 32-bit console 3D: low-poly models with unfiltered low-resolution textures that warp and jitter because of affine mapping and vertex snapping.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Muted 15-bit color with a fine ordered dither over the whole frame; distance fades into flat fog color.
  lighting_and_shadow: Gouraud vertex lighting with visible triangle shading steps; simple blob shadows under characters.
  texture_and_material: Blocky nearest-neighbor textures around 64 pixels wide, swimming texture seams on large polygons and cracks where polygons meet.
  camera_and_composition: Keep the requested view; short draw distance with dense fog hiding the world beyond a few meters.
  atmosphere_and_mood: Uneasy and dreamlike, a world that trembles slightly.
  rendering_and_quality: Low internal resolution near 320 by 240, jittering vertices, no texture filtering and no anti-aliasing.
  key_features: affine texture warping; vertex snapping jitter; nearest-neighbor textures; ordered dither; close fog
  creative_brief: "Early 32-bit console 3D: low-poly models with unfiltered low-resolution textures that warp and jitter because of affine mapping and vertex snapping. Carry it through affine texture warping, vertex snapping jitter, nearest-neighbor textures, ordered dither, close fog. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
