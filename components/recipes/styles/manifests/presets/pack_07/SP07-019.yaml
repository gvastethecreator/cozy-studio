visualDna:
  aesthetic: 'Art Nouveau interior: whiplash curves grow through structure and ornament alike, with carved wood, bent wrought iron, stained and opalescent glass, and mosaic.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Olive, sage, amber, peacock teal and violet, with gold-bronze metal; soft stained-glass colour washing across cream plaster.
  lighting_and_shadow: Daylight through stained or opalescent glass casting coloured patches, tulip and lily-shaped glass lamps, soft curving shadows.
  texture_and_material: Carved pear or walnut with flowing organic mouldings, wrought iron vine balustrades, iridescent art glass, glass-tile mosaic, patinated bronze.
  camera_and_composition: Keep the requested view; let a curve lead the eye — a stair rail, arch or window mullion — and avoid rigid rectilinear framing.
  atmosphere_and_mood: Sensuous, organic and elegant, a room that seems to grow.
  rendering_and_quality: Warm natural-light photograph with coloured glass light clean, curves continuous, ornament crisp but soft.
  key_features: whiplash curve ornament; wrought iron vine balustrade; iridescent stained glass; carved organic mouldings; glass mosaic
  creative_brief: "Art Nouveau interior: whiplash curves grow through structure and ornament alike, with carved wood, bent wrought iron, stained and opalescent glass, and mosaic. Carry it through whiplash curve ornament, wrought iron vine balustrade, iridescent stained glass, carved organic mouldings, glass mosaic. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
