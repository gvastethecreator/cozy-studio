visualDna:
  aesthetic: >-
    Describe existing forms with visible three-dimensional polygon planes, broad matte surfaces and
    clean faceted transitions instead of laying a triangular filter over a finished image.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Simplify geometry
    only as far as the defining silhouette and structural relationships remain clear.
  color_and_tone: >-
    Retain the requested palette and use restrained tonal shifts across planes; do not substitute a
    fixed low-poly color scheme.
  lighting_and_shadow: >-
    Follow the requested light direction and let broad plane values describe it without adding a new
    source, dramatic glow or unrequested cast shadow.
  texture_and_material: >-
    Use simple matte materials with low-frequency surface detail. Keep material identity legible and
    avoid drawn outlines or high-frequency textures unless requested.
  camera_and_composition: >-
    Preserve the requested viewpoint, perspective, crop, framing and placement. An isometric camera or
    game-like setting is not implied.
  atmosphere_and_mood: >-
    Retain the requested environment and tone; faceted geometry does not add a game world or change the
    scene.
  rendering_and_quality: >-
    Keep polygon planes coherent with the underlying volume and use enough facets to preserve identity;
    avoid decorative triangles detached from the form.
avoidRules:
  - mandatory isometric camera or game setting
  - triangular overlays detached from the depicted form
  - details that alter identity or function
