visualDna:
  aesthetic: 'Object-as-Letter Campaigns: one form of the subject takes the place of a compatible letter while the whole word still reads instantly.'
  subject_treatment: Integrate one form of the prompt's subject into one compatible letter of the exact word, keeping the word readable and the object recognizable.
  color_and_tone: Consistent contrast between word and object, color kept subordinate to reading.
  lighting_and_shadow: Simple light on the object and crisp type sharing one baseline.
  texture_and_material: The subject material kept and the other letters in a sober finish.
  camera_and_composition: At most one substitution per word, with a clear rhythm and baseline.
  atmosphere_and_mood: Legible typographic wit, clever and quick to get.
  rendering_and_quality: Crisp campaign type where the word reads without explanation.
  creative_brief: "Object-as-Letter Campaigns: one form of the subject takes the place of a compatible letter while the whole word still reads instantly. Carry it through one object letter, readable word, shared baseline, clever wit. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one object letter; readable word; shared baseline; clever wit
avoidRules:
  - letters replaced by ambiguous objects
  - deformed product
  - wrong word
  - invented product claims, statistics or awards
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
