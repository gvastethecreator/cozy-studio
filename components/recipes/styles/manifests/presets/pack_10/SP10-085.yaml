  aesthetic: 'Vorticism: hard angular machine-like forms spiraling into a vortex center.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is broken into hard angular shards converging into a vortex."
  color_and_tone: Strong blacks, reds and ochres, used consistently across subject and background.
  lighting_and_shadow: Harsh contrast, expressed through the style rather than photographic lighting.
  texture_and_material: Sharp angular shards, visible at card size as the signature of the style.
  camera_and_composition: Vortex converging to a point, arranged so the subject still reads at card size.
  atmosphere_and_mood: Aggressive, mechanical, energetic and harsh, driven by the construction, color and rhythm.
  rendering_and_quality: Bold graphic finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Vorticism: hard angular machine-like forms spiraling into a vortex center. Carry it through angular shards, vortex center, machine energy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
