visualDna:
  aesthetic: >-
    A kinetic 90s cel treatment uses sharp contour cuts, directional engine-like trails and strongly
    angled color streaks. Its outlaw energy is speed and visual thrust, not a vehicle or western
    subject.
  subject_treatment: >-
    Keep the requested identity and action. Attach a few trailing lines to existing movement and
    preserve static forms without streaks; add no rider, machine or weapon.
  color_and_tone: >-
    When open, contrast deep navy with selective red, electric blue and warm highlights. Keep
    requested colors and use the brightest streak only to clarify motion.
  lighting_and_shadow: >-
    Build crisp cel shadows and bright edge accents around existing moving forms. Preserve the
    requested illumination; do not invent headlights or explosions.
  texture_and_material: >-
    Combine clean ink contours, painted color blocks and narrow speed traces. Keep marks directional
    and do not smear surface detail.
  camera_and_composition: >-
    Use a strong diagonal or receding line of movement inside the supplied framing. Preserve camera
    and existing action; do not add a road or chase.
  atmosphere_and_mood: >-
    Communicate momentum through line angle and color separation. Keep the requested emotional tone
    instead of adding outlaw bravado or adventure.
  rendering_and_quality: >-
    Keep moving edges sharp with selective streaks and static edges crisp. Avoid broad blur, excessive
    debris and action effects unrelated to the prompt.
  key_features: >-
    directional engine-like trails; sharp contour cuts; navy cel masses with selective red and
    electric-blue streaks
  creative_brief: >-
    Apply the kinetic cel lines and selective trail accents to movement already present in the
    request. Preserve its identity, setting and composition; add no vehicle, rider, chase or weapon.
