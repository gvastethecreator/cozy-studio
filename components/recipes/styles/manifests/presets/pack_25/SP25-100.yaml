visualDna:
  aesthetic: 'Tactical Map Stack: a map, switchable route layers and linked info cards kept in sync by stable ids and coordinates.'
  subject_treatment: Show the prompt's map with switchable route layers and a card for the selected item, every node, id and coordinate kept exact.
  color_and_tone: One bright active layer, faint secondary context and selection backed by outline.
  lighting_and_shadow: Flat top-down rendering that keeps the topology undistorted.
  texture_and_material: Clean route lines, readable nodes and crisp text panels.
  camera_and_composition: Dominant map, compact layer controls and an inspector tied to selection.
  atmosphere_and_mood: Tactical reading and stable context, calm and in control.
  rendering_and_quality: Switching layers never moves nodes or changes the selected card.
  creative_brief: "Tactical Map Stack: a map, switchable route layers and linked info cards kept in sync by stable ids and coordinates. Carry it through map with layers, linked card, stable ids, flat topology. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: map with layers; linked card; stable ids; flat topology
