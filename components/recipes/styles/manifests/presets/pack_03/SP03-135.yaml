visualDna:
  aesthetic: 'Simulated open ocean render: a spectral wave surface with long swells, choppy secondary waves, whitecap foam masks and wind-blown spray.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies an open sea built from a simulated ocean surface with swell, whitecaps and spray; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Deep blue-black troughs, turquoise light through thin wave crests, bright white foam and cold grey sky reflections.
  lighting_and_shadow: Overcast or low sun reflected in broken glints; subsurface glow where light passes through crests.
  texture_and_material: Foam streaks lined up with the wind, spray mist off crests, trailing wake foam around any object in the water.
  camera_and_composition: Keep the requested camera; the horizon tilts with the swell and the nearest wave dominates the frame.
  atmosphere_and_mood: Cold, heaving and indifferent, the sea larger than anything on it.
  rendering_and_quality: Physically based water with correct fresnel reflection, crest translucency and particle spray; no glassy flat water.
  creative_brief: "Simulated open ocean render: a spectral wave surface with long swells, choppy secondary waves, whitecap foam masks and wind-blown spray. Carry it through long swells with choppy detail, wind-aligned foam streaks, translucent turquoise crests, spray mist, fresnel reflections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: long swells with choppy detail; wind-aligned foam streaks; translucent turquoise crests; spray mist; fresnel reflections
