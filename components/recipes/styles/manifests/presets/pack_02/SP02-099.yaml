visualDna:
  aesthetic: 'Punk zine cut-and-paste: photocopied collage of cut-out images and shapes, taped and glued, then copied again until the blacks crush and the greys break into grit.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Black and white toner with one or two fluorescent spot colors added by hand.
  lighting_and_shadow: No lighting; photocopy contrast with blown whites and crushed blacks.
  texture_and_material: Toner speckle, torn and scissored edges, tape strips, staple marks and copy-of-a-copy degradation.
  camera_and_composition: Chaotic page layout, collage elements overlapping at angles.
  atmosphere_and_mood: Angry and handmade, anti-design energy on a borrowed copier.
  rendering_and_quality: Real photocopied collage; cut-out letter shapes stay unreadable.
  key_features: photocopy toner grit; scissored collage; tape strips; fluorescent spot color; crushed blacks
  creative_brief: "Punk zine cut-and-paste: photocopied collage of cut-out images and shapes, taped and glued, then copied again until the blacks crush and the greys break into grit. Carry it through photocopy toner grit, scissored collage, tape strips, fluorescent spot color, crushed blacks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
