visualDna:
  aesthetic: 'Traditional ensemble anime of resonance: drums, strings and flutes played together, sound shown as ripples and trembling air.'
  subject_treatment: Keep the prompt's subject and action; place it within an ensemble where sound is visible as ripples, vibration and synchronized motion.
  color_and_tone: Lacquer red, natural wood and indigo costumes with warm stage gold.
  lighting_and_shadow: Warm stage light from above and side, drum skins glowing under the spotlight.
  texture_and_material: Taut drum skins, silk strings, bamboo flutes and cotton costumes in fine line.
  camera_and_composition: Wide ensemble shots and tight shots on striking hands and vibrating strings.
  atmosphere_and_mood: Powerful and communal, many players breathing and striking as one body.
  rendering_and_quality: Rich performance anime with visible sound ripples and precise playing technique.
  key_features: sound ripples; drum strikes; ensemble unison; warm stage light
  creative_brief: "Traditional ensemble anime of resonance: drums, strings and flutes played together, sound shown as ripples and trembling air. Carry it through sound ripples, drum strikes, ensemble unison, warm stage light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
