visualDna:
  aesthetic: 'Blind embossing: raised relief pressed into paper without ink.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is a raised uninked relief on white or cream paper."
  color_and_tone: White on white or cream, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Raised paper relief, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Subtle, elegant, tactile and quiet, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Blind embossing: raised relief pressed into paper without ink. Carry it through uninked raised relief, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: uninked raised relief; physical print process
