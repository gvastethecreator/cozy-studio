visualDna:
  aesthetic: 'Survival-horror safe room: a pre-rendered-looking interior lit by one warm lamp pool inside cold darkness, seen from a fixed high camera.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: Sickly green-grey and brown in the dark, one warm amber pool of light; crushed but not empty shadows.
  lighting_and_shadow: Single small warm source, steep falloff, deep shadows in corners, faint cold light from a doorway.
  texture_and_material: Peeling paint, stained tiles, worn wood and damp plaster, soft film grain over a slightly soft pre-rendered finish.
  camera_and_composition: Keep the requested view; when unspecified, a fixed high-corner angle with slightly awkward perspective and empty space.
  atmosphere_and_mood: Briefly safe yet uneasy, a held breath before going back out.
  rendering_and_quality: Soft pre-rendered look with fine grain; no monsters or gore unless the prompt asks.
  key_features: single warm lamp pool; fixed high-corner camera; green-grey darkness; damp worn surfaces; fine grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Survival Horror Save-Room Lighting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
