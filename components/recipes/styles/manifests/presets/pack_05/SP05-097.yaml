visualDna:
  aesthetic: Monumental anime cel painting with baroque bilateral symmetry, heavy value planes and a restrained ornamental silhouette language.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Emphasize major shapes with measured contour and balanced weighty detail; add no throne, army, skulls or architecture.
  color_and_tone: Bone ivory, charcoal and muted brass in a cold limited range with deep values.
  lighting_and_shadow: Cool controlled light divides large planes and reserves narrow highlights for the focal forms.
  texture_and_material: Matte shadow masses, smooth enamel-like accents and faint powdery grain in the darks.
  camera_and_composition: Keep the requested view; formal mirror balance and broad negative space around a central axis.
  atmosphere_and_mood: Severe and composed, a heavy pressure that never turns violent.
  rendering_and_quality: Detail held within clean edges and deep values, with subtle grain softening the darkest areas.
  key_features: baroque bilateral symmetry; ivory against charcoal; cold narrow highlights; monumental value planes; powdery grain
  creative_brief: "Monumental anime cel painting with baroque bilateral symmetry, heavy value planes and a restrained ornamental silhouette language. Carry it through baroque bilateral symmetry, ivory against charcoal, cold narrow highlights, monumental value planes, powdery grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
