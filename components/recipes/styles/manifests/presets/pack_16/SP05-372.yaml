  color_and_tone: Black stage, one white spotlight and a single symbolic color such as red or gold.
  lighting_and_shadow: Hard theatrical spotlights and huge cast shadows on the backdrop.
  texture_and_material: Stage boards, velvet curtains, masks and symbolic props in graphic cel.
  camera_and_composition: Frontal proscenium framing with strong symmetry and dramatic shadow play.
  atmosphere_and_mood: Charged and symbolic, a rivalry performed as if it were a myth.
  rendering_and_quality: Graphic theatrical anime with bold shadows and minimal staging.
  key_features: spotlight duel; giant shadows; symbolic prop; proscenium
  creative_brief: "Allegorical stage anime of spotlight confrontations: two performers facing off under theatrical light with symbolic props and shadows. Carry it through spotlight duel, giant shadows, symbolic prop, proscenium. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
