visualDna:
  aesthetic: 'Broad-Stroke Silhouettes: very heavy strokes resolved as designed masses, with inner corners opened to compensate for ink build-up.'
  subject_treatment: Draw the prompt's subject or requested actions as bold heavy masses, hollowing inner corners by hand so the weight never clogs.
  color_and_tone: One solid ink with wide interiors and maximum contrast between parts.
  lighting_and_shadow: Flat solid shapes with crisp outer edges and nothing around them.
  texture_and_material: Soft or straight edges chosen by function, each corner shaped individually.
  camera_and_composition: Interior spaces proportional to the mass, dense symbols kept apart.
  atmosphere_and_mood: Calm forcefulness, read instantly from across a room.
  rendering_and_quality: Build-up zones corrected one by one rather than thinning the whole stroke.
  creative_brief: "Broad-Stroke Silhouettes: very heavy strokes resolved as designed masses, with inner corners opened to compensate for ink build-up. Carry it through heavy masses, hollowed corners, wide interiors, instant read. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: heavy masses; hollowed corners; wide interiors; instant read
