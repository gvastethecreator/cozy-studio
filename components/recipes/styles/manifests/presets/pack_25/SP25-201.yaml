visualDna:
  aesthetic: 'Marginal Archive Layout: notes, indexes and references fill ranked margins around one stable main text block, like a well-annotated archive.'
  subject_treatment: Lay out the prompt's pages with a stable main text and ranked margin notes tied to clear anchors, every title and supplied word kept exact.
  color_and_tone: High-contrast main text, lighter yet legible notes and one accent for anchors.
  lighting_and_shadow: Flat page layout with any book presentation kept as a separate view.
  texture_and_material: Clean page surface and a discreet paper texture well away from dense reading.
  camera_and_composition: Stable body, a margin wide enough for notes and unmistakable anchors.
  atmosphere_and_mood: Archive intimacy and slow reading, scholarly and warm.
  rendering_and_quality: Crisp spread where every note matches an anchor and stays off the gutter.
  creative_brief: "Marginal Archive Layout: notes, indexes and references fill ranked margins around one stable main text block, like a well-annotated archive. Carry it through ranked margin notes, stable body, clear anchors, one accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ranked margin notes; stable body; clear anchors; one accent
