  aesthetic: 'Urushi lacquer: deep glossy lacquer in black and vermilion with maki-e gold sprinkles.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: deep glossy lacquer with gold sprinkle motifs covers the surfaces. The decorative surface pattern is the point: make its figure, veining or motif the first read."
  color_and_tone: Black and vermilion with gold, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Deep glossy reflections, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Layered lacquer and gold dust, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Refined, deep, precious and calm, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Urushi lacquer: deep glossy lacquer in black and vermilion with maki-e gold sprinkles. Carry it through deep lacquer, maki-e gold, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
