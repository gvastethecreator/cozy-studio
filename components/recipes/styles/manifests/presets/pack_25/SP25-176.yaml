visualDna:
  aesthetic: 'Quiet Product Tension: one small offset, gap or unexpected alignment creates interest with very few elements.'
  subject_treatment: Create interest around the prompt's subject with one small, understandable offset or alignment, very few elements and the copy exact.
  color_and_tone: Sober palette with one optional accent and the product colors kept.
  lighting_and_shadow: Broad light and coherent contact shadows, calm and even.
  texture_and_material: Clean materials with moderate detail and a quiet finish.
  camera_and_composition: One subject and one clear spatial tension, copy in a calm zone.
  atmosphere_and_mood: Contained expectation and precision, like holding a breath.
  rendering_and_quality: Polished minimal image where the tension lives in the geometry.
  creative_brief: "Quiet Product Tension: one small offset, gap or unexpected alignment creates interest with very few elements. Carry it through one small offset, few elements, calm copy zone, held breath. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one small offset; few elements; calm copy zone; held breath
