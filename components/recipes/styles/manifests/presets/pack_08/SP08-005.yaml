  color_and_tone: Tonal sets in sage, slate, lilac or black with one reflective accent.
  lighting_and_shadow: Bright clean daylight with crisp specular highlights on technical fabric.
  texture_and_material: Brushed jersey, ripstop, mesh ventilation panels, bonded seams and reflective trims.
  camera_and_composition: Dynamic three-quarter or full figure with a sense of movement.
  atmosphere_and_mood: Energetic, fresh, capable and modern, carried by the wearer's posture, styling and attitude.
