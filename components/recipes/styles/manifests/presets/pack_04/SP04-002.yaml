visualDna:
  aesthetic: '1960s cosmic comic: blocky muscular ink drawing with extreme foreshortening, crackling black energy-dot fields and machine-like cosmic architecture.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Bright flat primaries pushed toward magenta, cyan and acid yellow, with black space backgrounds studded with colored dots.
  lighting_and_shadow: Radiant backlight bursts behind the subject, hard black shadow shapes, glowing rim lines around hands and machinery.
  texture_and_material: Energy crackle drawn as clusters of black and colored dots, square blocky knuckles, circuit-like panels on every machine.
  camera_and_composition: Forced perspective with fists or hands lunging at the lens, scale jumps from tiny figures to colossal forms, radial burst layout.
  atmosphere_and_mood: Loud cosmic wonder, everything enormous, charged and about to explode.
  rendering_and_quality: Heavy square-cornered contours, flat print color and dot crackle; no painted gradients or realistic textures.
  key_features: energy-dot crackle; extreme foreshortening; blocky square anatomy; cosmic machine architecture; magenta-cyan-yellow flats
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Silver Age Comic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - photoreal space render
  - dark
  - gritty
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic superhero costume
  - random speech text
  - fake lettering
  - photo-real costume render
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
