visualDna:
  aesthetic: 'Soft editorial window portrait: a single large north-facing window shaping the subject in quiet, painterly daylight.'
  subject_treatment: Subject turned toward the window, contemplative, hands or props near the face, simple styling.
  color_and_tone: Subdued earth tones, cool daylight mixed with warm interior bounce, gentle contrast.
  lighting_and_shadow: Broad soft window light from one side falling off gradually across the face into soft shadow, no added fill.
  texture_and_material: Linen, wool, plaster walls and natural skin with soft detail.
  camera_and_composition: Three-quarter or profile framing, subject near the window edge, calm negative space of wall.
  atmosphere_and_mood: Quiet, introspective, and timeless, like a Dutch interior.
  rendering_and_quality: Natural, softly detailed daylight rendering with painterly falloff.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Soft Editorial Window as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: single window source; gradual falloff; earth tones; contemplative profile; painterly quiet
