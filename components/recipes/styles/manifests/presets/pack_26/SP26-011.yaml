visualDna:
  aesthetic: 'Moebius (Jean Giraud) character design look: clean ligne claire contours, fine hatching, flowing robes, strange helmets and serene wanderers in vast desert worlds.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters with clean contours, flowing robes, odd helmets and calm faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Soft pastel desert colors, pale blue and sand.
  lighting_and_shadow: Bright serene desert light, lit the way Moebius lights its scenes.
  texture_and_material: Clean line with fine hatching and flat pastel color.
  camera_and_composition: Character studies with small landscapes around them, framed the way Moebius composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with serene cosmic wandering.
  rendering_and_quality: Ligne claire character studies, in the recognizable hand of Moebius.
  creative_brief: "Moebius (Jean Giraud) character design look: clean ligne claire contours, fine hatching, flowing robes, strange helmets and serene wanderers in vast desert worlds. Carry it through Moebius clean line, flowing robes, odd helmets, desert serenity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Moebius clean line; flowing robes; odd helmets; desert serenity
