visualDna:
  aesthetic: 'Use this drawing language: Photo-cutout collage treatment with torn edges, mismatched image fragments, black-and-white photocopy contrast, pasted layers, rough toner grain, and flattened depth. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply scissor-cut edges, rough contours, mismatched collage seams, and offset paste-up alignment to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use photocopy black, harsh white, dirty gray, scanned beige, toner shadow, and faded marker accents as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat scanner-like contrast with shadows between collage layers as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render photocopy grain, paper-cut edges, pasted layers, halftone texture, and rough scan artifacts as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Layer cutout fragments and flattened depth around details of the supplied subject; do not invent extra people or replace its identity.
  atmosphere_and_mood: Snarky and handmade; use the collage roughness without imposing hostility on the subject.
  rendering_and_quality: Finish with photocopy grain, scissored edges, flattened pasted layers, and high-contrast monochrome.
  key_features: scissored edges; mismatched collage seams; photocopy contrast; pasted layers; flattened depth; toner grain
  creative_brief: Render the supplied content with scissor-cut edges, rough contours, mismatched collage seams, and offset paste-up alignment. Use photocopy black, harsh white, dirty gray, scanned beige, toner shadow, and faded marker accents as style colors while honoring any explicit color instructions. Apply photocopy grain, paper-cut edges, pasted layers, halftone texture, and rough scan artifacts as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
