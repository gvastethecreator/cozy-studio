  color_and_tone: Hot red, yellow and blue graphics over bright white; glossy saturated products.
  lighting_and_shadow: Overlit high-key from every direction; hard specular gloss on the product.
  texture_and_material: Chrome, plastic, bubbling liquids and spotless counters, with glossy sheen.
  camera_and_composition: Product front and center, textless starburst and arrow callout shapes pointing at it.
  atmosphere_and_mood: Frantic and overexcited, every second a miracle demonstration.
  rendering_and_quality: Glossy late-night video with callout shapes that stay textless.
  key_features: overlit demo set; textless starburst callouts; glossy product; hot primaries; frantic energy
