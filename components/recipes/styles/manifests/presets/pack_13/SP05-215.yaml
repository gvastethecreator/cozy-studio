visualDna:
  aesthetic: 'Repeated small contour and value motifs create a visual cycle across existing forms, paired with smooth color transitions.'
  subject_treatment: 'Preserve subject, proportions, action, and count; repeat a mark or tonal cue only, never an object, pose, or image sequence.'
  color_and_tone: 'Rotate a small set of related accents through the prompted palette; do not impose pastel hues or soften requested contrast.'
  lighting_and_shadow: 'Keep one consistent source and repeat its highlight shape only on surfaces that already receive it.'
  texture_and_material: 'Use matte fills with recurring fine grain or line rhythms; respect material differences and keep treatment specific to each surface.'
  camera_and_composition: 'Keep camera and layout exact; rhythm comes from marks inside the supplied composition, not repeated panels or scenes.'
  atmosphere_and_mood: "Retain the prompt's emotional tone; a recurring visual motif does not prescribe a mood."
  rendering_and_quality: 'Balance repeated accents with clear breaks so subjects stay distinct; maintain legible details and stable forms.'
  key_features: 'Recurring line motifs; repeated highlight shapes; limited color rotation; smooth matte fills; clear rhythm with visual breaks.'
  creative_brief: 'Echo line and color motifs across existing forms without repeating depicted content. Preserve subject, action, count, camera, and mood. Use it as a reusable look on any subject.'
