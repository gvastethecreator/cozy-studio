  aesthetic: 'Window-Layer Graphics: layered graphics on glass that link inside and outside while staying readable from the intended side.'
  subject_treatment: Layer the prompt's window graphics as transparent fields and opaque text on the glass, readable from the declared side, every word exact.
  color_and_tone: Contrast built per layer and value for a varying background.
  lighting_and_shadow: Existing reflections kept, tested with light and dark interiors.
  texture_and_material: Conceptual vinyl with explicit transparency, separate from the glass.
  camera_and_composition: Main text in a stable contrast zone with controlled overlaps.
  atmosphere_and_mood: Light depth between inside and outside with the message kept.
  rendering_and_quality: Clean graphic with exact letters and its reverse view documented.
  creative_brief: "Window-Layer Graphics: layered graphics on glass that link inside and outside while staying readable from the intended side. Carry it through layers on glass, opaque text, transparent fields, reading side declared. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
