visualDna:
  aesthetic: 'Cyanotype contact print: iron-salt coated paper exposed in sunlight under objects or a negative, then washed, so forms appear in white or pale blue on Prussian blue.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Deep Prussian blue grounds, white and pale cyan forms, soft mid-blues where objects were translucent.
  lighting_and_shadow: No modeled light; value depends on how much sunlight passed, so opaque parts are white and translucent parts glow pale blue.
  texture_and_material: Brush-coated edges of chemistry on watercolor paper, uneven blue streaks, soft photogram edges where objects lifted slightly.
  camera_and_composition: Keep the requested subject, laid flat or seen as a photogram or contact negative; brushed chemistry border around it.
  atmosphere_and_mood: Cool, quiet and ethereal, a sun-drawn blueprint.
  rendering_and_quality: Monochrome Prussian blue with soft photogram edges and brushstroke chemistry borders; no other colors, no ink lines.
  key_features: Prussian blue ground; white and pale cyan forms; brushed chemistry edges; soft photogram halos; watercolor paper texture
  creative_brief: "Cyanotype contact print: iron-salt coated paper exposed in sunlight under objects or a negative, then washed, so forms appear in white or pale blue on Prussian blue. Carry it through Prussian blue ground, white and pale cyan forms, brushed chemistry edges, soft photogram halos, watercolor paper texture. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
