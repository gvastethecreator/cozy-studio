visualDna:
  aesthetic: "Chain link: woven steel wire diamond mesh forming the target's surfaces."
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is formed from galvanized chain-link diamond mesh, keeping the woven pattern."
  color_and_tone: Galvanized silver-grey, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Backlight making the mesh graphic, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Woven galvanized wire in diamond mesh, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Urban, restrictive, industrial and hard, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: chain-link diamond mesh; galvanized wire; backlit pattern
  creative_brief: "Chain link: woven steel wire diamond mesh forming the target's surfaces. Carry it through chain-link diamond mesh, galvanized wire, backlit pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
