visualDna:
  aesthetic: 'Rim lighting: one or two hard backlights outlining the subject with a glowing edge against a dark background.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Dark background, bright white or warm edge, little front detail.
  lighting_and_shadow: Kicker lights behind and to the side of the subject, very low front fill, a halo on hair and shoulders.
  texture_and_material: Fur, hair, fabric edges and breath catching the rim.
  camera_and_composition: Keep the requested framing; subject against a darker area so the edge reads.
  atmosphere_and_mood: Dramatic and heroic, form defined by a line of light.
  rendering_and_quality: Clean edge highlights without blooming into the background.
  key_features: glowing edge outline; backlight kickers; dark background; low front fill; halo on hair
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rim Lighting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
