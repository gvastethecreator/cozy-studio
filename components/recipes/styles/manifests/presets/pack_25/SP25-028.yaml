visualDna:
  aesthetic: 'Folded-Plane Pictograms: two simplified planes describe volume with a shallow projection and no continuous shading.'
  subject_treatment: Show the prompt's subject or requested objects with two broad planes meeting at one fold, in the same shallow projection for the whole set.
  color_and_tone: Two functional values split by an edge, with a one-ink version that still reads.
  lighting_and_shadow: Light summarized as one fixed light plane and one dark plane.
  texture_and_material: Flat planes, smooth and matte, with crisp folds.
  camera_and_composition: Shallow consistent projection across the set, with comparable widths.
  atmosphere_and_mood: Sober tactility, enough volume to orient without showing off.
  rendering_and_quality: The action stays legible when the secondary value is removed.
  creative_brief: "Folded-Plane Pictograms: two simplified planes describe volume with a shallow projection and no continuous shading. Carry it through two planes, one fold, shallow projection, toolbar-ready volume. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two planes; one fold; shallow projection; toolbar-ready volume
