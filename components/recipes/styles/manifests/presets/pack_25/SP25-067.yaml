visualDna:
  aesthetic: 'Dense Precision Console: a short type scale, compact rows and sober states pack a lot of operational information while staying legible.'
  subject_treatment: Set the prompt's screen with a short type scale, compact rows and functional groups, keeping every label, value and unit exact and readable.
  color_and_tone: Controlled contrast, clear primary reading, discreet helpers and states backed by shape.
  lighting_and_shadow: Flat screen with signal lights only for authorized active states.
  texture_and_material: Neutral surfaces, precise separators and controls of coherent density.
  camera_and_composition: Aligned columns and rows with stable action areas and room for focus.
  atmosphere_and_mood: Professional concentration, dense with information yet calm and readable.
  rendering_and_quality: Full labels at real size, values, units and actions clearly distinct.
  creative_brief: "Dense Precision Console: a short type scale, compact rows and sober states pack a lot of operational information while staying legible. Carry it through compact rows, short type scale, state shapes, aligned columns. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: compact rows; short type scale; state shapes; aligned columns
