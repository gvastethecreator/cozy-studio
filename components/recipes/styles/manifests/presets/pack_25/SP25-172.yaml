visualDna:
  aesthetic: 'Folded Message Planes: graphic planes fold in space to carry the message face by face in a clear reading order.'
  subject_treatment: Distribute the prompt's exact copy across a few folded graphic planes with a clear sequence, every word kept on its own readable face.
  color_and_tone: Two or three values per plane and high-contrast text on each face.
  lighting_and_shadow: Short coherent fold shadows with a simple, even overall light.
  texture_and_material: Smooth planes, defined edges and minimal graphic thickness.
  camera_and_composition: One main plane holds the message, the others guide without hiding.
  atmosphere_and_mood: Editorial depth and a feeling of moving forward through the message.
  rendering_and_quality: Clean poster where every word reads from the main view.
  creative_brief: "Folded Message Planes: graphic planes fold in space to carry the message face by face in a clear reading order. Carry it through folded planes, face-by-face copy, clear sequence, short shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: folded planes; face-by-face copy; clear sequence; short shadows
