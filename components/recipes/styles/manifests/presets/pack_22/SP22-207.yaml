visualDna:
  aesthetic: >-
    Flat printed forms use even, controlled linework and clear color separations, with decorative curves
    kept subordinate to the subject.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Keep interior detail
    selective and do not duplicate, mirror or recast the subject.
  color_and_tone: >-
    Retain the requested palette in separated color fields with useful open reserves; do not impose fixed
    inks or period colors.
  lighting_and_shadow: >-
    Respect the requested illumination and express it through simple flat-value changes rather than
    photoreal shading or a new source.
  texture_and_material: >-
    Keep the graphic surface clean and flat. Preserve the materials represented in the requested image
    rather than implying a physical card stock finish.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, frame and placement. Mirroring, doubled figures, symmetry and
    card layout are separate choices and are not implied by this style.
  atmosphere_and_mood: >-
    Maintain the requested setting and tone; balanced linework does not create a court, deck or historical
    story by itself.
  rendering_and_quality: >-
    Use steady outer contours with modest controlled variation, cleanly separated inks and reduced
    interior marks so the full silhouette remains readable.
avoidRules:
  - automatic mirroring, duplication or symmetry
  - unrequested card frames, lettering or period motifs
