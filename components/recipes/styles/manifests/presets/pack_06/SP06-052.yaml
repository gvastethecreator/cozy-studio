visualDna:
  aesthetic: 'Voxel construction: every subject and surface built from equal-sized cubes on a 3D grid, like a hand-placed digital diorama.'
  subject_treatment: Rebuild the prompt's subject and setting in this digital construction; the preset owns the geometry, while subject identity, action and palette intent stay as requested.
  color_and_tone: Saturated cheerful palette with one flat color per cube, small color variations cube to cube for texture.
  lighting_and_shadow: Soft global light with ambient occlusion in the corners between cubes, crisp cube-edge shadows.
  texture_and_material: Clean matte cube faces, stepped edges on every curve, visible grid rhythm, no smoothing.
  camera_and_composition: Keep the requested framing; subjects often sit on a cut-out diorama base floating in space.
  atmosphere_and_mood: Playful, cozy and crafted, a tiny buildable world.
  rendering_and_quality: Consistent cube size everywhere, stepped silhouettes, soft occlusion; no smooth meshes and no branded block-game look.
  key_features: equal-sized cubes on a 3D grid; stepped silhouettes; one color per cube with variation; ambient occlusion between cubes; diorama base
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Voxel Cube Build as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
