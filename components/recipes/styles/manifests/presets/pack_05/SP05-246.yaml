visualDna:
  aesthetic: 'Ornamented anime cel led by jewel color and arabesque curves: contours flow in elegant S-arcs and fine decorative line rhythms sit inside shapes.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Arabesque linework decorates existing surfaces; do not add markets, caravans, deserts or labyrinths.
  color_and_tone: Jewel blue, turquoise, amber and saffron in a rich warm-cool balance.
  lighting_and_shadow: Warm light rolls over curved planes with sparse, sharp jewel-point specular stars.
  texture_and_material: Smooth painted color with fine gold-line ornament and an enamel-like tile shine.
  camera_and_composition: Keep the requested view; flowing S-curve spacing guides the eye through the frame.
  atmosphere_and_mood: Graceful, warm and lively, like music in motion.
  rendering_and_quality: Rich but controlled color with delicate line detail sitting over clean cel shapes.
  key_features: arabesque S-curve contours; jewel blue and turquoise; fine gold-line ornament; jewel-point specular stars; enamel tile shine
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Jewel Arabesque Curve Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
