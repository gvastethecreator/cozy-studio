visualDna:
  aesthetic: 'Observational linework uses fine, precise contours and sharply resolved microdetails against quieter color fields, without changing the point of attention.'
  subject_treatment: 'Keep every prompted form and action; clarify small features already present without adding narrative symbols or gestures.'
  color_and_tone: 'Use neutral midtones with one measured warm or cool accent; retain stated colors and keep small details from becoming oversaturated.'
  lighting_and_shadow: 'Follow the actual light source; use compact highlights and contact shadows to define existing details.'
  texture_and_material: 'Vary mark scale by material: smooth where clean, fine grain where rough, and no implied object from a texture cue.'
  camera_and_composition: 'Preserve crop, viewpoint, scale, and count; strengthen the existing focal hierarchy without moving it or requiring close-up framing.'
  atmosphere_and_mood: 'Keep the requested mood; line precision should not alter the emotional reading.'
  rendering_and_quality: 'Separate thin contour, local detail, and background values cleanly; keep extra graphic marks sparse and nonverbal.'
  key_features: 'Precise fine contours; selectively sharp microdetail; quiet supporting color fields; compact highlights; material-specific mark scale.'
  creative_brief: 'Give existing focal details crisp line priority against calmer surrounding marks. Preserve subject, camera, and mood; add no extra graphic motif. Use it as a reusable look on any subject.'
