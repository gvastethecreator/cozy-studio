visualDna:
  aesthetic: 'Translucent Edge Finish: a surface modifier that turns an existing icon into a solid translucent body with light gathering along its thickness and edges.'
  subject_treatment: Change only the transmission and edge glow of the prompt's existing icon, keeping its silhouette locked and its front readable.
  color_and_tone: Source palette kept, the transparency never fading the figure away.
  lighting_and_shadow: Broad controlled edge light with a readable front face and a tight halo.
  texture_and_material: Translucent material of moderate thickness, sober refraction and smooth surface.
  camera_and_composition: Framing and orientation of the input kept, background only for contrast.
  atmosphere_and_mood: Optical lightness with a recognizable body, luminous yet calm.
  rendering_and_quality: Tested on light and dark grounds with an opaque version for control.
  creative_brief: "Translucent Edge Finish: a surface modifier that turns an existing icon into a solid translucent body with light gathering along its thickness and edges. Carry it through translucent body, edge light, locked silhouette, readable front. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: translucent body; edge light; locked silhouette; readable front
