visualDna:
  aesthetic: 'Real estate HDR listing photography: an ultra-wide room shot with bracketed exposures blended until every corner and the view outside are equally bright.'
  subject_treatment: Keep the prompt subject and setting; present the space empty or tidied for sale, as large and bright as possible.
  color_and_tone: Saturated even color, very bright whites, blue sky pulled into the windows, slight HDR haloing at window edges.
  lighting_and_shadow: Virtually no shadows; windows and interiors balanced to the same brightness, ceiling lights all on.
  texture_and_material: Crisp over-sharpened surfaces, mirror-glossy floors and flattened local contrast everywhere.
  camera_and_composition: 14–18 mm ultra-wide from a corner at chest height, vertical lines corrected, room exaggerated in size.
  atmosphere_and_mood: Bright and hard-selling, cheerful emptiness that feels slightly unreal.
  rendering_and_quality: Listing-photo HDR look with its typical flat tonality; not architectural-magazine restraint.
  key_features: ultra-wide corner view; shadowless HDR blend; bright windows with blue sky; saturated even color; over-sharpened
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Real Estate (HDR) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
