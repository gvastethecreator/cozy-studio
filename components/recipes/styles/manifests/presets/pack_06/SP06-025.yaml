visualDna:
  aesthetic: >-
    Technical Pen acts as a transferable art-medium router: start from Technical drafting with
    measured line hierarchy and schematic restraint, Clean lines and drawing-media system built from
    mark pressure, line economy, paper tooth, erasure, hatching, dust, and tool-specific edge
    behavior, then apply the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Uniform line weight; preserve the prompt subject while
    rebuilding it through line weight, contour, hatch density, smudge, scratch, wax, stylus, or
    marker stroke logic, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Black on white; treat color as tool-limited material: graphite value, charcoal
    black, ink density, sanguine earth, wax pencil, marker bleed, chalk dust, or metallic trace,
    with deliberate value grouping, accent control, and medium-specific limits rather than generic
    color wash.
  lighting_and_shadow: >-
    Handle light through Lighting for Technical Pen: purposeful key, bounce, rim, shadow depth, and
    focal readability matched to 2. Drawing & Sketching; represent light through mark spacing,
    exposed paper, tonal rubbing, crosshatch density, erased highlights, or flat diagrammatic value
    control, so value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Vellum, smooth; make paper grain, tooth, dust, ink bite, wax buildup, scratch coating,
    vellum smoothness, or marker streaks visible at the right scale, keeping material scale coherent
    and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Geometric; structure forms through line rhythm, gesture, technical
    geometry, blank space, contour continuity, and readable silhouette logic, with scale, spacing,
    edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Precise, technical; derive mood from study, immediacy, precision, roughness,
    temporary mark-making, craft intimacy, or disciplined draftsmanship, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Blueprint like schematic clarity without requiring buildings or plans; finish with
    honest drawing marks, stable anatomy or object structure, clean negative space, and no painterly
    fill replacing the chosen tool, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Technical drafting with measured line hierarchy and schematic restraint; Clean lines; Black on
    white; Vellum, smooth; Geometric
  creative_brief: >-
    Apply Technical Pen as an art-style preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Technical
    drafting with measured line hierarchy and schematic restraint, Clean lines, Vellum, smooth
    without requiring the card image's original subject.
