visualDna:
  aesthetic: 'Laika studio stop-motion character look as in Coraline and Kubo: handcrafted puppets with sculpted faces, real fabric costumes, tiny stitched details and eerie handmade charm.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters as handcrafted stop-motion puppets with sculpted faces, fabric clothes and visible handmade details. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Rich muted handmade colors and tactile fabrics, true to the Laika palette.
  lighting_and_shadow: Miniature set lighting with soft shadows, lit the way Laika lights its scenes.
  texture_and_material: Sculpted resin faces, woven fabric and knitted details.
  camera_and_composition: Macro puppet photography on miniature sets, framed the way Laika composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with eerie handmade charm.
  rendering_and_quality: Photographed stop-motion puppet character, in the recognizable hand of Laika.
  creative_brief: "Laika studio stop-motion character look as in Coraline and Kubo: handcrafted puppets with sculpted faces, real fabric costumes, tiny stitched details and eerie handmade charm. Carry it through Laika puppets, handmade fabrics, sculpted faces, miniature sets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Laika puppets; handmade fabrics; sculpted faces; miniature sets
