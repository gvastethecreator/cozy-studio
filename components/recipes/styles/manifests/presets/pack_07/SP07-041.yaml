visualDna:
  aesthetic: 'Formal topiary axis: a French-style garden laid out on one central axis, with mirrored parterres of clipped box, yew cones and obelisks, raked gravel walks and stone edging.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Deep box and yew greens, pale raked gravel, limestone white, and restrained seasonal colour inside the parterre compartments; crisp value pattern.
  lighting_and_shadow: Low raking light that throws long shadows from every clipped cone and hedge, turning the plan into a pattern of light and dark stripes.
  texture_and_material: Tightly clipped box and yew with dense small-leaf surface, raked gravel, cut limestone kerbs and steps, still rectangular water basins.
  camera_and_composition: Keep the requested view; favour a centred axis or a high viewpoint that reads the mirrored plan, with the vanishing point on a focal building or basin.
  atmosphere_and_mood: Ceremonial, controlled and grand, nature forced into geometry.
  rendering_and_quality: Sharp photograph with exact symmetry and crisp hedge edges, no palace postcard staging.
  key_features: single central axis; mirrored clipped box parterres; yew cones and obelisks; raked gravel walks; long raking shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Formal Topiary Axis as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
