  color_and_tone: Active, idle and reservoir states separated by shape and value as well as color.
  lighting_and_shadow: Light contained inside the channels, each branch glowing on its own.
  texture_and_material: Smooth surfaces and ducts of consistent thickness, graphic rather than anatomical.
  camera_and_composition: Root, branches and destinations follow the given topology, labels clear of crossings.
  atmosphere_and_mood: Controlled organic flow and a sense of interdependence, calm and legible.
  rendering_and_quality: Every branch corresponds to one real link in the supplied data.
