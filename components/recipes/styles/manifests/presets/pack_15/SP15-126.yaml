  aesthetic: 'Foundrypunk: an iron-casting civilization of blast furnaces, molten pours, sand molds and giant cast-iron structures glowing in the dark.'
  subject_treatment: Keep the prompt's subject and setting; build it from heavy cast iron and show molten metal being poured or cooled nearby.
  color_and_tone: Soot black and iron grey with molten orange, yellow-white pours and red glow.
  lighting_and_shadow: Molten metal as the main light source, casting hot orange rims and deep black shadow.
  texture_and_material: Rough cast iron, sand molds, slag, scale and sweat-soaked leather aprons.
  camera_and_composition: Low angles beside pouring ladles and huge silhouetted furnace towers.
  atmosphere_and_mood: Hellish and proud, heavy labor producing things that are meant to last centuries.
  rendering_and_quality: Dramatic industrial illustration with intense glow and heavy material weight.
  creative_brief: "Foundrypunk: an iron-casting civilization of blast furnaces, molten pours, sand molds and giant cast-iron structures glowing in the dark. Carry it through molten pours, cast iron, furnace glow, sand molds. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
