visualDna:
  aesthetic: >-
    Use restrained naturalistic contours and small, precise details only where the prompt provides
    them; suspense is carried by a minute shift in shape, gaze or spacing, not by a stock character.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: choose a muted, controlled
    palette with small value changes; preserve explicit color and avoid turning restraint into
    monochrome by default.
  lighting_and_shadow: >-
    Soft practical light, modest shadow edges and precise local contrast reveal detail without
    melodramatic rim light.
  texture_and_material: >-
    Keep texture quiet and fine, with naturalistic line weight and no gritty overlay unless the
    prompt calls for it.
  camera_and_composition: >-
    Let measured spacing and quiet negative space hold attention; preserve the requested view and
    avoid forced close-ups.
  atmosphere_and_mood: >-
    Adult suspense means controlled ambiguity in the rendering; retain the user's mood and do not
    presume age, gender or sexuality.
  rendering_and_quality: >-
    Place fine detail only on supplied forms; add no person, expression, threat, prop or implied
    narrative. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Restrained contour; microgesture-scale detail; muted values; quiet spacing; naturalistic
    observation; low-key suspense.
  creative_brief: 'Apply this visual treatment to the requested content: Restrained contour; microgesture-scale detail; muted values; quiet spacing; naturalistic observation; low-key suspense. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - grain obscuring microgesture detail
  - overlapping contour detail merging forms
  - specular bloom flattening low-key values
assets:
