visualDna:
  aesthetic: 'Mangrovepunk: coastal villages grown into mangrove forests, with root bridges, stilt houses, tidal channels and walls made by living trees.'
  subject_treatment: Keep the prompt's subject and setting; weave it into tangled mangrove roots, tidal channels and houses on stilts.
  color_and_tone: Murky tea-brown water, dense leaf greens and weathered silver wood.
  lighting_and_shadow: Dappled light through a dense canopy and glinting tidal water.
  texture_and_material: Arching roots, mud, oyster shells, stilt timber and woven palm roofs.
  camera_and_composition: Low boat-level views gliding through long tunnels of arching roots over dark water.
  atmosphere_and_mood: Tangled and protective, a forest that holds the sea back with its hands.
  rendering_and_quality: Richly textured illustration with complex root structures and water.
  creative_brief: "Mangrovepunk: coastal villages grown into mangrove forests, with root bridges, stilt houses, tidal channels and walls made by living trees. Carry it through arching roots, stilt houses, tidal channels, living walls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
