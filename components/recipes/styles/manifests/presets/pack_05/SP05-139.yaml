visualDna:
  aesthetic: 'Horror-scale action translated to color anime: coarse dense crosshatching, grimacing faces, and enormous forms looming over tiny figures, with dust and steam drawn as layered hatch masses.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Muted olive, stone grey and dried brown with a pale sickly flesh accent.
  lighting_and_shadow: Hazy backlight through dust, hard silhouette shadows, faces half buried in hatching.
  texture_and_material: Dry pen crosshatch in every shadow, abrasion on stone, plumes built as hatched volumes.
  camera_and_composition: Keep the requested framing; exaggerate scale with tiny foreground figures and a vast form overhead in compressed depth bands.
  atmosphere_and_mood: Bleak urgency and helpless awe, tiny figures dwarfed by something far too large.
  rendering_and_quality: Crosshatched shadows and clear silhouettes, dread through scale rather than gore.
  key_features: coarse dense crosshatching; extreme scale contrast; hatched dust plumes; olive and stone palette; grimacing faces
  creative_brief: "Horror-scale action translated to color anime: coarse dense crosshatching, grimacing faces, and enormous forms looming over tiny figures, with dust and steam drawn as layered hatch masses. Carry it through coarse dense crosshatching, extreme scale contrast, hatched dust plumes, olive and stone palette, grimacing faces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
