visualDna:
  aesthetic: "Diegetic Cockpit Layout: readouts placed on the zones of a physical in-world panel according to priority and the pilot's field of view."
  subject_treatment: Place the prompt's readouts on zones of an in-world control panel by priority, main readings in the frontal field; keep every value exact.
  color_and_tone: Data contrast independent of the panel material, alerts backed by shape.
  lighting_and_shadow: 'Sober cockpit lighting that keeps every priority instrument clear of reflections.'
  texture_and_material: Consistent panel material and plausible fixings with purposeful detail.
  camera_and_composition: Main readings inside the frontal field, secondary ones in reachable periphery.
  atmosphere_and_mood: In-world presence and orientation, grounded in a believable seat.
  rendering_and_quality: The camera never hides required information or changes its hierarchy.
  creative_brief: "Diegetic Cockpit Layout: readouts placed on the zones of a physical in-world panel according to priority and the pilot's field of view. Carry it through in-world panel, priority zones, frontal field, seated camera. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: in-world panel; priority zones; frontal field; seated camera
