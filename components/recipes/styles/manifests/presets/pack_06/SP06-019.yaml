visualDna:
  aesthetic: 'Ballpoint scribble drawing: tone built from tangled looping circular scribbles of a cheap ballpoint, layered denser and harder where it needs to go dark.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Blue or black ballpoint only; pale where the loops are open, a glossy near-solid ink mass where dozens of layers pile up.
  lighting_and_shadow: Light shown by leaving loops open and sparse; shadows as dense overlapping scribble knots with glossy ink buildup.
  texture_and_material: Paper indented by pen pressure, small ink blobs at loop turns, slightly glossy ink in the darkest areas, no erasures.
  camera_and_composition: Keep the requested framing; the scribble density shapes the forms and the edges trail off in loose loops.
  atmosphere_and_mood: Restless and obsessive, nervous energy turned into form.
  rendering_and_quality: Continuous circular scribble marks everywhere, no straight hatching and no clean outlines; ink blobs and indents visible.
  key_features: tangled circular scribble tone; ballpoint ink blobs; glossy dense darks; pressure indentations; loose trailing edges
  creative_brief: "Ballpoint scribble drawing: tone built from tangled looping circular scribbles of a cheap ballpoint, layered denser and harder where it needs to go dark. Carry it through tangled circular scribble tone, ballpoint ink blobs, glossy dense darks, pressure indentations, loose trailing edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
