visualDna:
  aesthetic: >-
    Opaque angular color planes meet along clean mineral-like boundaries, with large and small facets in
    an unequal rhythm. Shapes remain continuous rather than shattered.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Keep requested colors and organize adjacent planes by subtle temperature shifts plus two clear value
    levels; avoid an automatic brown or metallic palette.
  lighting_and_shadow: >-
    Use the requested light direction to choose broad plane values. Restrict highlights to real facing
    surfaces without crystal glow.
  texture_and_material: >-
    Use compact chalky pigment variation inside selected planes. The mineral analogy describes paint
    boundaries, not conversion of every object into stone.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Let plane sizes follow existing form and
    depth, leaving uninterrupted areas around fine identifying features.
  atmosphere_and_mood: Weight, stillness and measured tension without obligatory gloom or ruins.
  rendering_and_quality: >-
    Keep edges deliberate and silhouette readable; no random triangulation, faceted anatomy errors or
    fine crystalline noise.
avoidRules:
  - random triangulation
  - all-stone material conversion
  - crystal glow
