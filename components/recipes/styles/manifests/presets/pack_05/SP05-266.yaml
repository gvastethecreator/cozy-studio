visualDna:
  aesthetic: Kinetic anime ink in which the subject's trailing edges disintegrate into small separated black flecks and broken contourlets, as if its own movement were blowing the drawing apart.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Charcoal and ash values with a few cool pale-blue flecks; the prompt colors stay on the solid core of the subject.
  lighting_and_shadow: Tiny edge glints only where the prompt light strikes; the flecks stay dark and never glow.
  texture_and_material: Sparse matte pigment granulation, flecks ranging from pinpoint to rice-grain size and thinning with distance from the silhouette.
  camera_and_composition: Keep the requested camera; flecks stream off the trailing side of the motion or wind, leaving the leading edge crisp.
  atmosphere_and_mood: Restless and transient, a figure half escaping the page.
  rendering_and_quality: Solid crisp core with a disintegrating trailing edge; fleck scatter stays controlled and never becomes an all-over noise layer.
  key_features: trailing edges dissolving into black flecks; crisp leading edge; charcoal and ash with pale-blue flecks; granulated matte pigment; fleck size gradient
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Black Particle Fugitive Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
