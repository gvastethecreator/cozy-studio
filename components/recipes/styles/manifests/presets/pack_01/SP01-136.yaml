visualDna:
  aesthetic: 'Chronophotography: a single plate exposed many times at fixed intervals, showing one movement as a row of overlapping phases.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Monochrome or muted sepia-grey, subject bright against a black backdrop.
  lighting_and_shadow: Strong light on the subject, dark background so each phase stays readable.
  texture_and_material: Semi-transparent overlapping figures, each phase crisp at its instant.
  camera_and_composition: Fixed side view, the movement progressing across the frame left to right in eight to twelve phases.
  atmosphere_and_mood: Analytical and graceful, motion taken apart like a mechanism.
  rendering_and_quality: Real multiple exposure with overlapping transparency; not a digital clone stamp.
  creative_brief: "Chronophotography: a single plate exposed many times at fixed intervals, showing one movement as a row of overlapping phases. Carry it through many overlapping phases, black backdrop, fixed side view, left-to-right progression, translucent overlaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: many overlapping phases; black backdrop; fixed side view; left-to-right progression; translucent overlaps
