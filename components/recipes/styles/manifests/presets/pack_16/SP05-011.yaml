visualDna:
  aesthetic: >-
    Angular 90s cel contours, concentrated ink shadows and a broken blue-violet aura rim define this
    treatment. Short radiating strokes make force legible around the requested focal form.
  subject_treatment: >-
    Keep the requested identity, pose and proportions. Sharpen the existing silhouette with separated
    ink spikes; let one broken aura edge follow that contour without adding a fighter or second
    figure.
  color_and_tone: >-
    When color is open, favor deep indigo shadows, blue-violet aura light and a small warm amber
    accent. Preserve requested colors and keep the brightest accent local.
  lighting_and_shadow: >-
    Use hard cel shadow blocks and a narrow rim glow. Keep bloom close to the existing form and
    respect the requested light direction.
  texture_and_material: >-
    Use smooth painted cel fills, decisive ink edges and faint controlled analog grain. Keep material
    marks specific to the depicted surface; do not turn grain into scene texture.
  camera_and_composition: >-
    Use opposing diagonals and a tight focal rhythm inside the requested framing. Keep the camera and
    layout; do not require a close-up, arena or city.
  atmosphere_and_mood: >-
    Create charged contrast through contour rhythm and value opposition only when the requested mood
    calls for it. Do not convert a calm subject into a confrontation.
  rendering_and_quality: >-
    Separate two or three clean shadow masses, crisp outlines and restrained aura spill. Keep the
    background painted and subordinate; avoid smeared glow or uniform filter noise.
  key_features: >-
    broken blue-violet aura rim; short radiating ink strokes; angular silhouette against deep cel
    shadow
  creative_brief: 'Apply the angular cel and localized aura treatment to the requested content. Preserve its subject, action, setting, palette, camera and mood; use no title-specific character, prop or location. Use it as a reusable look on any subject.'
