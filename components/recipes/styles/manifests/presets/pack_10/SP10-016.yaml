visualDna:
  aesthetic: >-
    Ferrofluid becomes a transferable fluid and organic behavior system: start from Magnetic liquid
    spikes and Magnetic field, then route prompt content through flow, branching, cellular
    membranes, diffusion, turbulence, and living surface logic without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Spikes to bend, pool, branch, bloom, spike,
    foam, or dissolve forms while preserving the prompt intent; preserve anatomy, object identity,
    or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Black, reflective; let hues follow fluid thickness, chemical bloom,
    interference, biological growth, or vapor density, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Studio highlight drive the light response: use reflection, translucency, subsurface
    scattering, glow, or backlit edges to reveal fluid structure, avoiding generic glamour lighting
    unless the prompt explicitly asks for it.
  texture_and_material: >-
    Render Liquid metal as the tactile or mark-making basis; surfaces need coherent viscosity,
    membranes, droplets, filaments, bubbles, grains, or particulate fields, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Magnetic field as reusable spatial grammar: favor flow direction, cellular
    repetition, eddies, radial forces, tendrils, and macro-to-wide scalability, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Dark, sci-fi as the emotional register; derive mood from instability, growth, toxicity,
    delicacy, pressure, and organic motion, without flattening strong, strange, darker, or adult
    prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Scientific, alien: finish with clean fluid physics, readable boundaries, and
    restrained micro-noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Magnetic liquid spikes; Spikes; Black, reflective; Studio highlight; Liquid metal; Magnetic
    field; Dark, sci-fi; Scientific, alien; Spikes
  creative_brief: >-
    Apply ferrofluid magnetism to the input: glossy black liquid metal, field-led spikes, radial
    clustering, and alien surface tension should make any subject feel pulled into magnetic order.
avoidRules:
  - soft
  - colorful
  - stiff solids
  - muddy fluid mixing
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
