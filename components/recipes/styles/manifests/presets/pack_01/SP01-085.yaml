visualDna:
  aesthetic: >-
    Tech Hardware Hero acts as a transferable photographic style router: begin from Premium tech
    launch image, Precision rim outline, and commercial photographic system built from sellable
    clarity, controlled studio craft, material desirability, and brand-neutral polish, then apply
    the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Minimal hero silhouette; preserve prompt identity while making
    silhouette, surface, freshness, scale, and product-like value immediately readable, keeping the
    original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Graphite, cool white, electric accent; use palette as campaign control: clean whites,
    luxury neutrals, appetite warmth, cool tech accents, automotive reflections, or interior
    harmony, with value separation and white balance choices that feel captured in-camera rather
    than painted over.
  lighting_and_shadow: >-
    Use Dark sweep with precise rim lights; shape light with softboxes, reflectors, rim lines, HDR
    fill, glossy kickers, window balance, or packshot sweep shadows, preserving believable exposure,
    shadow density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Matte anodized surface, glass edge, clean bevel; render metal, glass, fabric, food
    surface, condensation, cosmetic gel, architecture finish, and clean contact shadows with precise
    detail, avoiding both waxy smoothing and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Long-lens product compression; compose for catalog clarity, top-down order, hero
    compression, architectural verticals, lifestyle layout, or premium macro depth, with lens
    distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Intelligent, minimal, engineered; derive mood from appetite, trust, luxury,
    engineering, cleanliness, freshness, aspiration, or frictionless retail function, so the preset
    changes interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Apple-style keynote polish; finish with professional photo polish, accurate material
    response, clean retouching, and no fake logo, UI, or unreadable label clutter, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: >-
    Premium tech launch image; Precision rim outline; Graphite, cool white, electric accent; Dark
    sweep with precise rim lights; Long-lens product compression
  creative_brief: >-
    Apply Tech Hardware Hero as a photographic preset over prompt X: preserve the user's requested
    subject, then route Premium tech launch image, Graphite, cool white, electric accent, Dark sweep
    with precise rim lights, Matte anodized surface, glass edge, clean bevel, and Long-lens product
    compression through optics, exposure, palette, surface response, timing, and finish without
    requiring the card image's original subject.
