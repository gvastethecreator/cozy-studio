visualDna:
  aesthetic: Pale seinen horror line art of open white planes, thin silver-gray edge gaps and deliberately withheld contour segments, so forms dissolve into the paper at their edges.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Ash white, cool silver and very pale local colors; darks are rare and small.
  lighting_and_shadow: Quiet diffuse high-key light with very few fine highlights and almost no cast shadow.
  texture_and_material: Clean matte washes with a faint paper grain and no fog overlay unless the prompt asks for it.
  camera_and_composition: Keep the requested framing; generous negative space and contour gaps create a threshold feeling.
  atmosphere_and_mood: Subtle wrongness and a quiet, bright, high-key unease.
  rendering_and_quality: Sparse, pale, withheld lines that stay legible; no jump-scare darkness.
  key_features: high-key pale planes; withheld contour segments; silver-gray edge gaps; ash-white palette; rare small darks
  creative_brief: "Pale seinen horror line art of open white planes, thin silver-gray edge gaps and deliberately withheld contour segments, so forms dissolve into the paper at their edges. Carry it through high-key pale planes, withheld contour segments, silver-gray edge gaps, ash-white palette, rare small darks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
