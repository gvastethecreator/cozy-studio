visualDna:
  aesthetic: 'Hue-shifted color ramps: pixel art where every shading ramp shifts hue as it darkens and lightens, warm highlights into cool violet shadows, giving vivid painterly life.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; shade the subject with ramps that move warm in light and cool in shadow.
  color_and_tone: Yellow-warm highlights, saturated midtones, violet and teal shadows.
  lighting_and_shadow: Clear key light with hue-shifted shadow ramps, kept consistent across the whole image.
  texture_and_material: Hand-placed pixels in short ramps of four or five steps.
  camera_and_composition: Readable central subject with clear silhouette, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with vivid painterly glow.
  rendering_and_quality: Clean ramps without banding or noise, kept consistent across the whole image.
  creative_brief: "Hue-shifted color ramps: pixel art where every shading ramp shifts hue as it darkens and lightens, warm highlights into cool violet shadows, giving vivid painterly life. Carry it through hue-shifted ramps, warm light, violet shadows, hand-placed pixels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hue-shifted ramps; warm light; violet shadows; hand-placed pixels
