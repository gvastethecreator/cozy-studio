visualDna:
  aesthetic: 'Tape-worn living room: ordinary family interiors seen as if through a worn home videotape, with color bleed, soft smear and wrongness hiding in the noise.'
  subject_treatment: Show the prompt's subject in a domestic interior as a worn tape frame, keeping it readable through smear while something uncanny hides in the noise.
  color_and_tone: Faded browns and oranges, oversaturated reds, bleeding chroma and washed-out highlights.
  lighting_and_shadow: Harsh on-camera lamp light, blown highlights and murky crushed shadows in the corners.
  texture_and_material: Tape noise, horizontal tracking lines, soft smear, wood paneling, shag carpet and patterned sofas.
  camera_and_composition: Handheld home-video framing, slightly tilted, with doorways and dark hallways at the edges.
  atmosphere_and_mood: Nostalgic and wrong, a family memory that should not exist.
  rendering_and_quality: Degraded analog video look with believable smear and noise, never clean digital.
  creative_brief: "Tape-worn living room: ordinary family interiors seen as if through a worn home videotape, with color bleed, soft smear and wrongness hiding in the noise. Carry it through tape noise and tracking lines, chroma bleed, wood-paneled rooms, hidden wrongness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tape noise and tracking lines; chroma bleed; wood-paneled rooms; hidden wrongness
