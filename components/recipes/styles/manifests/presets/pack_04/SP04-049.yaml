visualDna:
  aesthetic: 'Environment design painting: a place designed for production in semi-finished digital paint, with clear paths, a landmark and a tiny figure for scale.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a wide establishing view in which the subject becomes a navigable place with a route, a landmark and a tiny scale figure, and that layout replaces the requested framing.
  color_and_tone: 'Palette organized by depth: warm saturated foreground, desaturated cool middle ground, pale background, with the landmark carrying the key accent.'
  lighting_and_shadow: 'Directional light used to guide travel: a lit path leading to the landmark, shadowed flanks framing it on both sides.'
  texture_and_material: Textured-brush shorthand for stone, timber, water and foliage, enough to read each material and no more.
  camera_and_composition: Wide eye-level or slightly raised view with a readable ground plane, a visible route through the space, and a human figure under a twentieth of frame height.
  atmosphere_and_mood: Inviting to explore, every path hinting where to go next.
  rendering_and_quality: Semi-finished production painting, architecture resolved at the landmark and loosening toward the frame edges.
  key_features: readable route through the space; lit landmark; tiny scale figure; warm-to-cool depth palette; semi-finished paint
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Environment Concept as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable annotations
  - readable text
  - brand logo
  - franchise likeness
  - lone cloaked figure on a cliff edge
  - character close-up
  - subject filling the frame
  - character focus
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic fantasy wallpaper
  - overpolished final render
  - unclear design callouts
  - random kitbash clutter
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
