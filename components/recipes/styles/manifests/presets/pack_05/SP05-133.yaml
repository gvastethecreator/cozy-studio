visualDna:
  aesthetic: 'Hajime Komoto Mashle look: ornate fairy-tale magic academy filigree drawn with fine line, while a blank-faced muscular protagonist solves everything with deadpan brute strength.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Komoto designs, blank dot-eyed deadpan faces, impossibly muscular bodies in elegant academy robes, and fussy ornate magicians around them. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Academy navy, cream, gold filigree and cream-puff pastel accents on clean white.
  lighting_and_shadow: Even storybook light with sparkly magic glows that the deadpan hero completely ignores.
  texture_and_material: Fine ornamental line work, filigree borders, clean screentone and brick textures.
  camera_and_composition: Symmetrical academy compositions, deadpan frontal stares and absurd strength reveals.
  atmosphere_and_mood: Keep the requested mood with deadpan absurd comedy.
  rendering_and_quality: Crisp comic manga-style frame contrasting ornate fantasy detail with blank deadpan faces.
  key_features: Hajime Komoto deadpan; filigree academy; muscle comedy; ornate magic ignored
  creative_brief: "Hajime Komoto Mashle look: ornate fairy-tale magic academy filigree drawn with fine line, while a blank-faced muscular protagonist solves everything with deadpan brute strength. Carry it through Hajime Komoto deadpan, filigree academy, muscle comedy, ornate magic ignored. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
