visualDna:
  aesthetic: Fine-art studio portrait in front of a hand-painted muslin backdrop, with directional window-like light that echoes old-master painting while staying fully photographic.
  subject_treatment: Subject posed with painterly stillness — three-quarter turn, hands placed deliberately, costume or wardrobe with rich texture.
  color_and_tone: Muted mottled backdrop in olive, umber, slate or smoky blue; warm skin; deep but open shadows.
  lighting_and_shadow: Large soft key high to one side, slight Rembrandt triangle, subtle fill, backdrop lit unevenly to create a glowing patch behind the head.
  texture_and_material: Visible brushy mottling in the backdrop, velvet, wool, fur and metal in wardrobe rendered with depth.
  camera_and_composition: Half or three-quarter figure, centered with painterly balance, slight low angle.
  atmosphere_and_mood: Timeless, noble, and quietly theatrical.
  rendering_and_quality: Large-format photographic depth and tonality, rich midtones, no digital effects.
  creative_brief: "Fine-art studio portrait in front of a hand-painted muslin backdrop, with directional window-like light that echoes old-master painting while staying fully photographic. Carry it through hand-painted mottled muslin, glowing backdrop patch, Rembrandt-leaning soft key, painterly pose, rich midtones. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hand-painted mottled muslin; glowing backdrop patch; Rembrandt-leaning soft key; painterly pose; rich midtones
