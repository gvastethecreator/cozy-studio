visualDna:
  aesthetic: 'In-game screenshot look informed by HighFleet gameplay: dieselpunk desert war capture with radar screens, ship silhouettes, tactical maps, analog targeting, and gritty command-interface pressure. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable HighFleet-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a HighFleet-informed palette: sand beige, radar green, oil black, warning red, brass yellow,
    and smoky grey. Keep value grouping legible at gameplay distance, with color accents behaving
    like route, danger, pickup, team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through CRT glow, explosion bloom, desert glare, spotlight cones, and
    instrument-panel illumination. Lighting must clarify the playable route, threat, focal subject,
    or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from chunky airship metal, rivets, paper maps, oscilloscope lines, radio panels,
    smoke, and worn military hardware. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with mix of side-view combat, command map, and instrument UI with radar arcs, targeting
    gauges, and convoy-route logic. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'HighFleet-derived mood: tense, analog, militarized, dusty, and systems-heavy; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: dense analog HUD is
    encouraged: radar, radio, gauges, targeting lines, fuel/ammo panels, and map overlays. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    HighFleet gameplay screenshots; dieselpunk desert war capture with radar screens, ship
    silhouettes, tactical maps, analog targeting, and gritty command-interface pressure; sand beige,
    radar green, oil black, warning red, brass yellow, and smoky grey; CRT glow, explosion bloom,
    desert glare, spotlight cones, and instrument-panel illumination; chunky airship metal, rivets,
    paper maps, oscilloscope lines, radio panels, smoke, and worn military hardware; mix of
    side-view combat, command map, and instrument UI with radar arcs, targeting gauges, and
    convoy-route logic; tense, analog, militarized, dusty, and systems-heavy; HUD guidance: dense
    analog HUD is encouraged: radar, radio, gauges, targeting lines, fuel/ammo panels, and map
    overlays
  creative_brief: "HighFleet Static Dune War: in-game screenshot language informed by HighFleet, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
