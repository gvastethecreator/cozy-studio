visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Dakar Desert Rally gameplay screenshots:
    off-road rally capture with desert tracks, vehicle suspension, dust walls, checkpoint
    navigation, and long-distance terrain reading. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Dakar Desert Rally-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Dakar Desert Rally-informed palette: sand tan, cobalt sky, white vehicle panels, black
    tires, red checkpoint marks, and sunlit dust gold. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through harsh sun, dust haze, headlight glints, reflective bodywork, and
    low-angle rally shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from gravel, sand ruts, tire smoke, vehicle decals without readable brands, rock
    outcrops, and windblown terrain. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person chase or cockpit camera with roadbook logic, waypoint depth, rivals,
    and terrain hazard readability. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Dakar Desert Rally-derived mood: endurance-focused, dusty, physical, competitive, and
    expansive. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: rally HUD can include speed,
    waypoint arrow, damage/status, position, and route markers. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Dakar Desert Rally gameplay screenshots; off-road rally capture with desert tracks, vehicle
    suspension, dust walls, checkpoint navigation, and long-distance terrain reading; sand tan,
    cobalt sky, white vehicle panels, black tires, red checkpoint marks, and sunlit dust gold; harsh
    sun, dust haze, headlight glints, reflective bodywork, and low-angle rally shadows; gravel, sand
    ruts, tire smoke, vehicle decals without readable brands, rock outcrops, and windblown terrain;
    third-person chase or cockpit camera with roadbook logic, waypoint depth, rivals, and terrain
    hazard readability; endurance-focused, dusty, physical, competitive, and expansive; HUD
    guidance: rally HUD can include speed, waypoint arrow, damage/status, position, and route
    markers
  creative_brief: >-
    Use Dakar Dust Cathedral Rally as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Dakar Desert Rally: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
