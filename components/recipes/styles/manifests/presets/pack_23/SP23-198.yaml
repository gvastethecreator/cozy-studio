visualDna:
  aesthetic: 'Old-school module cover: late-seventies and early-eighties adventure booklet covers, a single dramatic ink-and-paint scene framed by a flat colored border with blank title space.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; stage the subject as one dramatic dungeon or wilderness moment inside a flat colored border.
  color_and_tone: Limited palette with one flat border color such as monochrome blue, orange or green.
  lighting_and_shadow: Dramatic torchlit or moonlit ink shading, kept consistent across the whole image.
  texture_and_material: Ink line, cross-hatching, flat printed color and paper grain.
  camera_and_composition: Framed scene below a blank band left for a title.
  atmosphere_and_mood: Keep the requested mood with pulpy dungeon adventure.
  rendering_and_quality: Earnest period illustration with no lettering, kept consistent across the whole image.
  creative_brief: "Old-school module cover: late-seventies and early-eighties adventure booklet covers, a single dramatic ink-and-paint scene framed by a flat colored border with blank title space. Carry it through flat colored border, blank title band, ink scene, dramatic moment. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
