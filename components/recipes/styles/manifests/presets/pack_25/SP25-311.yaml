visualDna:
  aesthetic: 'Contour-to-Volume Transitions: styleframes where an outline becomes flat planes and then a solid volume, key points kept at every stage.'
  subject_treatment: Show the prompt's shape in keyframes going from outline to flat planes to volume, keeping its key points and any words exact.
  color_and_tone: Color by face or function with the original outline contrast kept.
  lighting_and_shadow: Light arriving coherently as volume appears, direction stable throughout.
  texture_and_material: Line becoming surface with controlled thickness and one material.
  camera_and_composition: A constant camera and axis during the conversion.
  atmosphere_and_mood: Progressive construction with a pause on the flat stage and a solid settle.
  rendering_and_quality: Crisp keyframes where the final state is clearly the same shape.
  creative_brief: "Contour-to-Volume Transitions: styleframes where an outline becomes flat planes and then a solid volume, key points kept at every stage. Carry it through outline to planes to volume, kept key points, fixed camera, three stages. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: outline to planes to volume; kept key points; fixed camera; three stages
