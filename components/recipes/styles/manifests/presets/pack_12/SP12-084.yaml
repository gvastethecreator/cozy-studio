visualDna:
  aesthetic: >-
    Mortal Shell (2020) real-time third-person combat: compact blackened armor, gaunt opponents,
    slick roots, peat-green air and selective mineral hardening with severe material contrast.
  color_and_tone: >-
    Use a muted mineral world with controlled green or warm accents when present in the environment;
    keep requested actors, terrain and any defensive state separable.
  lighting_and_shadow: >-
    Use game-scale directional light and dense contact shadow; small glints may distinguish water
    and armor, never a polished cinematic rim on every edge.
  texture_and_material: >-
    Use compact dark iron forms, tar-black recesses, worn leather and damp green-brown surfaces with
    restrained specular edges. When defensive hardening is requested, confine the mineral crust to
    the active figure for a clearly readable instant.
  camera_and_composition: >-
    Use a grounded third-person action camera behind or just above the playable figure when a figure
    is part of the requested image. Preserve the prompt's action and maintain clear relation to the
    ground; do not require melee combat or use top-down framing.
  rendering_and_quality: >-
    Read as a 2020 real-time action-RPG frame with solid material surfaces, grounded actor scale and
    moderate environmental depth; no cinematic processing that hides play information.
  subject_treatment: >-
    Preserve the requested action and subject. When the prompt depicts the game mechanic, show
    hardening as a brief defensive state; do not insert a shell-wearing figure, enemy or hardening
    effect by default.
  atmosphere_and_mood: Keep the measured, hostile-world mood without forcing a duel, attack or victory pose.
avoidRules:
  - isometric or first-person camera
  - static cover portrait or crowded action that hides the playable figure
  - unrequested canonical shell, weapon, character or arena
  - invented hardening effect when the prompt does not request it
  - unrequested HUD, logo, interface or captions; preserve explicitly requested UI and text
  - anime, manga or cel-shaded grammar
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
