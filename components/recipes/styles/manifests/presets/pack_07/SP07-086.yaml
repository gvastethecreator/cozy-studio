visualDna:
  aesthetic: 'Postmodern architecture of the 1980s: classical elements used as oversized flat graphics — broken pediments, giant keystones, cut-out arches, stubby columns — on stucco boxes.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Salmon, pale teal, butter yellow, lilac and terracotta stripes with white, sometimes polished granite and mirrored glass; high-key and witty.
  lighting_and_shadow: Bright flat daylight that keeps colour fields strong, crisp cast shadows only where cut-outs pierce the facade.
  texture_and_material: Smooth painted stucco, polychrome banded tile, polished granite veneer, mirrored or tinted glass, exaggerated mouldings in painted foam or precast.
  camera_and_composition: Keep the requested view; frontal elevation, symmetry exaggerated then broken by one playful element, top of the building like a furniture crown.
  atmosphere_and_mood: Ironic, colourful and theatrical, history quoted with a wink.
  rendering_and_quality: Bright crisp photograph with flat colour fields and sharp outlines, no weathering or readable signs.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Postmodern Pastiche Facade as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: oversized broken pediment; giant flat keystone; cut-out arches; pastel stripe banding; stubby exaggerated columns
