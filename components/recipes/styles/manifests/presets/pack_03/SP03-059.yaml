visualDna:
  aesthetic: 'Digital fashion: garments that exist only as cloth simulation, impossible fabrics draping, floating and folding with real weight on a body or on nothing at all.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; restyle its clothing into simulated digital garments, a wardrobe change, and dress an object or empty space only when the prompt asks (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: Iridescent, liquid-metal or gradient-dyed fabrics against a neutral grey or deep charcoal studio background.
  lighting_and_shadow: Soft studio key with bright specular sheen tracing every fold and a subtle colored bounce from the fabric.
  texture_and_material: Simulated drape with gravity, compression folds, fluttering hems and impossible surfaces like liquid chrome or holographic knit.
  camera_and_composition: Keep the requested view; enough fabric in motion that the simulation itself becomes the subject.
  atmosphere_and_mood: Futuristic and weightless, couture freed from the sewing room.
  rendering_and_quality: Physically plausible cloth with correct collision against the body, with no stiff shells or intersecting geometry.
  key_features: cloth simulation drape; impossible fabrics; fluttering hems; specular sheen on folds; correct body collision
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Digital Fashion as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - forced T-pose
  - object turned into an avatar
  - franchise likeness
  - readable text
  - logo
  - stiff cloth shell
  - cloth intersecting the body
  - stiff cloth
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
