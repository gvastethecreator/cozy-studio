visualDna:
  aesthetic: 'Shinkiro fighting game art look: painterly muscular fighters, dramatic airbrushed portraits, intense stares and nineties arcade select-screen bravado.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design fighters with muscular painterly anatomy, intense faces and bold costumes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Rich airbrushed color with dramatic contrast, true to the Shinkiro palette.
  lighting_and_shadow: Dramatic rim light and arcade glow, lit the way Shinkiro lights its scenes.
  texture_and_material: Painterly airbrush and gouache, with the surface finish of Shinkiro.
  camera_and_composition: Bust-up select portraits with dramatic angles, framed the way Shinkiro composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with intense arcade bravado.
  rendering_and_quality: Painterly nineties fighting game portrait, in the recognizable hand of Shinkiro.
  creative_brief: "Shinkiro fighting game art look: painterly muscular fighters, dramatic airbrushed portraits, intense stares and nineties arcade select-screen bravado. Carry it through Shinkiro airbrush, muscular fighters, select portraits. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Shinkiro airbrush; muscular fighters; select portraits
