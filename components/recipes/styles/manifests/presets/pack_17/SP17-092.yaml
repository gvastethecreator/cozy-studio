visualDna:
  aesthetic: 'Feudal supernatural drama translated into painted art: grounded Sengoku-period craft, theatrical armored silhouettes and sharply colored supernatural energy against dark architectural framing.'
  subject_treatment: >-
    Preserve explicit identity and action. Shape unspecified clothing and objects through tied
    layers, overlapping lacquer plates and purposeful asymmetry; spectral accents attach to a
    meaningful active form.
  color_and_tone: >-
    Vermilion lacquer, indigo cloth, warm plaster and almost-black timber, punctuated by
    concentrated blue-violet or green spirit light.
  lighting_and_shadow: >-
    Strong side lighting catches lacquer ridges and blade-like edges; pale supernatural light stays
    localized and interacts with nearby surfaces.
  texture_and_material: >-
    Laced armor, rubbed lacquer, fibrous rope, grainy timber and cracked plaster; material joins
    remain designed and visible beneath painterly finish.
  camera_and_composition: >-
    Strong diagonal gesture against rectilinear beams or a quiet architectural plane; foreground
    occlusion adds theatrical depth without prescribing a fixed game camera.
  atmosphere_and_mood: >-
    Grave martial resolve disturbed by uncanny luminous intrusion; feudal drama, not generic
    European gothic or weightless anime spectacle.
  rendering_and_quality: >-
    Detailed, naturalistically proportioned painted key art with purposeful brush transitions; avoid
    modern Souls-style desaturation or a photographed historical costume.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
