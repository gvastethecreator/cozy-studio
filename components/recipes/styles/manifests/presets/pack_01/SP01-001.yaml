visualDna:
  aesthetic: 'Premium studio headshot photography: one large softbox key, controlled fill, and a seamless backdrop that isolates the sitter with precise, trustworthy polish.'
  subject_treatment: Crop any subject to head and shoulders with eyes on the upper third; posture is upright and composed, expression relaxed but deliberate, wardrobe and hair kept neat enough to read as intentional.
  color_and_tone: Neutral mid-grey or charcoal seamless, accurate skin tones, restrained saturation, and a gentle vignette from backdrop falloff.
  lighting_and_shadow: Large soft key at 30–45 degrees above eye level, fill 1–1.5 stops under, a thin hair light separating the head from the backdrop, and twin clean catchlights.
  texture_and_material: Real skin pores and fine hair left intact, light blemish cleanup only, fabric weave crisp at the collar.
  camera_and_composition: 85–105 mm portrait lens at f/5.6–8, eye-level camera, tight vertical crop with a little headroom and no environmental clutter.
  atmosphere_and_mood: Confident, calm, credible, and quietly approachable.
  rendering_and_quality: Tack-sharp eyes, smooth tonal gradations on the backdrop, and retouching that stays invisible at full size.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Studio Headshot as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: large softbox key; hair-light separation; seamless grey backdrop; invisible retouching; eyes on the upper third
