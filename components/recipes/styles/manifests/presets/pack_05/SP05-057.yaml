visualDna:
  aesthetic: 'Soft-focus romantic digital anime: diffusion-filter bloom around every highlight, hexagonal lens-flare ghosts, and cel shading with gradient blush tones at shadow edges.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Muted rose, apricot, pale gold and dusty blue-gray; shadows tinted lilac rather than dark, with lifted, gentle contrast.
  lighting_and_shadow: Low golden backlight with wide diffusion halos, flare ghosts crossing the frame, and soft-edged cel shadows fading through a warm blush band.
  texture_and_material: Smooth digital paint with fine sparkle dust in the air and a light glow haze over the whole image.
  camera_and_composition: Keep the requested view; let flare ghosts and bloom drift diagonally across the frame toward the subject.
  atmosphere_and_mood: Wistful, tender and bittersweet, beauty glimpsed while things fall apart.
  rendering_and_quality: Clean silhouettes softened by diffusion bloom, blush-gradient shadow edges, sparkle dust and flare ghosts; never glossy or harsh.
  key_features: diffusion-filter bloom; hexagonal lens-flare ghosts; blush-gradient shadow edges; rose-apricot and blue-gray palette; floating sparkle dust
  creative_brief: "Soft-focus romantic digital anime: diffusion-filter bloom around every highlight, hexagonal lens-flare ghosts, and cel shading with gradient blush tones at shadow edges. Carry it through diffusion-filter bloom, hexagonal lens-flare ghosts, blush-gradient shadow edges, rose-apricot and blue-gray palette, floating sparkle dust. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
