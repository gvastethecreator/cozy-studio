visualDna:
  aesthetic: 'Digital layered paper cutout: scenes built from stacked flat paper shapes with soft drop shadows between layers, as if cut and arranged in a shallow box.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Solid flat paper colors in harmonious families, often light to dark from front to back or the reverse.
  lighting_and_shadow: Soft drop shadows cast by each layer onto the one behind, suggesting a few millimeters of depth.
  texture_and_material: Fine paper fiber grain on every shape, slightly irregular cut edges, no gradients inside shapes.
  camera_and_composition: Keep the requested framing; scene organized into five to eight overlapping depth layers.
  atmosphere_and_mood: Gentle, crafted and storybook-like, a tidy paper theater.
  rendering_and_quality: Flat shapes with subtle paper texture and soft layer shadows; no glossy 3D, no outlines.
  key_features: stacked flat paper layers; soft layer drop shadows; paper fiber grain; five to eight depth planes; clean cut edges
  creative_brief: "Digital layered paper cutout: scenes built from stacked flat paper shapes with soft drop shadows between layers, as if cut and arranged in a shallow box. Carry it through stacked flat paper layers, soft layer drop shadows, paper fiber grain, five to eight depth planes, clean cut edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
