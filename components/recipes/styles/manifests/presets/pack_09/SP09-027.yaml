visualDna:
  aesthetic: 'Vulcanized rubber: matte black rubber with molded tread-like ridges and slight wear.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of matte black rubber with molded ridges and scuffs, without becoming a tire."
  color_and_tone: Matte black and charcoal grey, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light showing matte texture, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Vulcanized rubber with molded ridges, scuffs and mold lines.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Industrial, tough, flexible and heavy, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: matte vulcanized rubber; molded ridges; scuffs
  creative_brief: "Vulcanized rubber: matte black rubber with molded tread-like ridges and slight wear. Carry it through matte vulcanized rubber, molded ridges, scuffs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
