visualDna:
  aesthetic: >-
    Hand-shaped illustration cues use solid rounded volumes, softened contours and slight irregularity
    in the modeling, while leaving the depicted subject recognizable.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Suggest hand-formed modeling through
    the rendering of existing forms without changing what the subject is.
  color_and_tone: >-
    Retain the requested palette and color relationships. Let value describe volume without replacing
    the subject's colors with a preset material color.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use broad, legible volume transitions without
    adding a studio light or new cast shadows.
  texture_and_material: >-
    Use subtle surface irregularities as a rendering cue and keep them subordinate to existing material
    details. Do not convert the subject or surroundings into a new material.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add a base, frame, lettering or
    display arrangement.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Rounded modeling is a surface treatment and does not add a
    setting or narrative.
  rendering_and_quality: >-
    Establish silhouette and broad forms first, then add only slight modeling variation. Keep defining
    features and small structural details intact.
avoidRules:
  - automatic material or identity conversion of the subject
  - added model details or display context
  - unrequested frame, lettering or layout
