visualDna:
  aesthetic: 'Open path tracer look: a node-shaded, physically based render with principled materials, a filmic view transform and clean denoised output.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Soft filmic contrast, gently desaturated highlights, warm practical light against cool fill.
  lighting_and_shadow: HDRI world light with practical point lights, soft bounce and denoised shadows.
  texture_and_material: Procedural wood, stone and moss from noise textures, principled glass and metal, slightly soft micro-detail.
  camera_and_composition: Cozy medium shots or small dioramas with shallow depth of field.
  atmosphere_and_mood: Warm and handcrafted, a hobbyist world rendered with love.
  rendering_and_quality: Denoised clean path trace with slight denoiser smoothness in dark areas.
  key_features: principled materials; procedural textures; filmic view transform; denoised soft shadows; cozy diorama framing
  creative_brief: "Open path tracer look: a node-shaded, physically based render with principled materials, a filmic view transform and clean denoised output. Carry it through principled materials, procedural textures, filmic view transform, denoised soft shadows, cozy diorama framing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
