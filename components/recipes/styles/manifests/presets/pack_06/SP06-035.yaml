visualDna:
  aesthetic: 'Screenprint: flat opaque ink squeegeed through stencilled silk mesh, one layer per color, stacked with slight misregistration.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Bold flat spot colors that overprint into new colors where they overlap, limited to four to six inks; no gradients.
  lighting_and_shadow: Light and shadow as separate flat color layers, with shadows often in a darker overprinted ink.
  texture_and_material: Thick opaque ink film, faint mesh texture at shape edges, slight registration gaps and overlaps, occasional ink starvation streaks.
  camera_and_composition: Keep the requested framing; bold posterized shapes with strong silhouettes.
  atmosphere_and_mood: Punchy, graphic and handmade, loud poster energy.
  rendering_and_quality: Flat layers with crisp stencil edges, visible misregistration and overprints; no halftone gradients, no brush texture.
  key_features: flat stacked spot-color layers; overprint color mixing; misregistration gaps; mesh texture at edges; four to six inks
  creative_brief: "Screenprint: flat opaque ink squeegeed through stencilled silk mesh, one layer per color, stacked with slight misregistration. Carry it through flat stacked spot-color layers, overprint color mixing, misregistration gaps, mesh texture at edges, four to six inks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
