visualDna:
  aesthetic: >-
    Thick, consistent marks reduce secondary detail into compact graphic shapes while preserving the
    recognizable silhouette and major value contrasts.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Summarize visual details as
    shapes only; never turn them into writing, codes or a new subject.
  color_and_tone: >-
    Preserve the requested palette, grouping it into a small number of clear values without imposing a
    fixed color scheme.
  lighting_and_shadow: >-
    Follow the requested lighting and simplify its existing shadow pattern; do not add a halo, glow or
    unsupported light source.
  texture_and_material: >-
    Keep the graphic finish uniform and clean; preserve material cues in the silhouette and requested
    palette without adding texture as a substitute for identity.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. Simplification does not convert the image
    into an icon sheet, emblem or layout.
  atmosphere_and_mood: >-
    Maintain the requested setting and tone. Compact graphic marks carry no required language, religion,
    symbolic meaning or cultural theme.
  rendering_and_quality: >-
    Use clear thick lines, simple shape masses and strong separation; keep defining features recognizable
    while avoiding accidental letter-like marks.
avoidRules:
  - invented alphabets, readable text or functional codes
  - unrequested emblems, religious or cultural symbols
  - extra details that alter identity or function
