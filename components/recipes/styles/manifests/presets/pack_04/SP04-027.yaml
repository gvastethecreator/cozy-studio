visualDna:
  aesthetic: 'Whimsical scratchy ink: fast dip-pen lines that skip and splutter, loosely washed with a few watercolor splashes.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Black ink skeleton with light splashes of watercolor that do not fill the shapes exactly.
  lighting_and_shadow: Paper-white light with a few wash hints; no cast shadows beyond a quick scribble.
  texture_and_material: Nib chatter, ink flicks and splatter, broken contours, wash puddles drying with edges.
  camera_and_composition: Figures in lively gestures, elastic and spiky, floating on white paper with little background.
  atmosphere_and_mood: Humorous, lively and mischievous, a joke caught mid-motion.
  rendering_and_quality: Deliberately unrefined speed and wobble; never tidy outlines or full painted backgrounds.
  key_features: scratchy dip-pen line; ink flicks and splatter; loose watercolor splashes; broken contours; white paper
  creative_brief: "Whimsical scratchy ink: fast dip-pen lines that skip and splutter, loosely washed with a few watercolor splashes. Carry it through scratchy dip-pen line, ink flicks and splatter, loose watercolor splashes, broken contours, white paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
