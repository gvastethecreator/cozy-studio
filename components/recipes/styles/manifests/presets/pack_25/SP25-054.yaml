  color_and_tone: A small palette of well-separated values and one accent with hard steps.
  lighting_and_shadow: Shading in bands of whole pixels, stepped and crisp.
  texture_and_material: Quantized edges and deliberate cluster surfaces placed by hand.
  camera_and_composition: Compact silhouette of any shape, every element on the same grid.
  atmosphere_and_mood: Illustrative solidity and digital rhythm, handmade pixel craft.
  rendering_and_quality: Shown at logical size and at a whole-number enlargement with the same palette.
  creative_brief: "Cut-Pixel Medallions: stepped pixel clusters and broad flat value planes build compact illustrative emblems on one fixed logical grid. Carry it through stepped clusters, fixed logical grid, small palette, whole-pixel shading. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
