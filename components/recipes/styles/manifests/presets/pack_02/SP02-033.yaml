visualDna:
  aesthetic: 'Family feature CG animation: stylized 3D characters with appealing rounded shapes, expressive faces and warm cinematic lighting.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Vibrant but harmonious color, warm bounce light, saturated accents, soft blue fill.
  lighting_and_shadow: Soft key with warm bounce and subsurface glow in skin, gentle rim light separating silhouettes.
  texture_and_material: Rounded bevels, slightly soft fabrics, subtle surface imperfections that make materials tactile.
  camera_and_composition: Cinematic framing at character eye level, clear silhouettes, shallow depth of field.
  atmosphere_and_mood: Warm and funny, emotional storytelling with lovable imperfection.
  rendering_and_quality: Polished feature-film CG; original characters only, no studio designs.
  key_features: rounded appealing CG shapes; warm bounce light; subsurface skin glow; expressive faces; shallow cinematic depth
  creative_brief: "Family feature CG animation: stylized 3D characters with appealing rounded shapes, expressive faces and warm cinematic lighting. Carry it through rounded appealing CG shapes, warm bounce light, subsurface skin glow, expressive faces, shallow cinematic depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
