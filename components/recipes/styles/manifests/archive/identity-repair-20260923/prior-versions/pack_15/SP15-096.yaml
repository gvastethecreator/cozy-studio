visualDna:
  aesthetic: >-
    Bodypunk treats the body's existing contours as a tactile interface, using nerve-like fiber paths,
    sensory bands and soft material transitions without requiring anatomical change.
  subject_treatment: >-
    Preserve identity, anatomy, proportions, pose and expression. Surface pattern or clothing may carry
    fiber arcs; prostheses, implants, grafts, mutation or exposed anatomy require an explicit request.
  color_and_tone: >-
    Respect requested skin, clothing and material colors. Use a few clear sensory accents against calm
    body and polymer values; avoid a fixed clinical palette.
  lighting_and_shadow: >-
    Follow the requested light and shadow. Use gentle edge separation along existing contours; do not add
    a clinic light, glow or dramatic body-horror contrast.
  texture_and_material: >-
    Keep skin, fabric, polymer and other supplied materials distinct. Use fine fiber marks and soft
    tactile gradients locally, preserving natural material variation without pore-level realism.
  camera_and_composition: >-
    Preserve the requested view and subject placement. Keep bodily contours readable without forcing a
    portrait, medical examination or close-up.
  atmosphere_and_mood: >-
    Suggest sensory awareness, vulnerability or care through tactile line and material contrast; retain
    the requested mood and avoid horror as a default.
  rendering_and_quality: >-
    Use clean contour-following fibers, restrained translucent layers and clear separation between
    surface marks and anatomy. Avoid gore, random wiring and detail that alters the body's structure.
avoidRules:
  - Do not add prostheses, implants, grafts, mutations or exposed anatomy unless explicitly requested.
  - Do not impose a clinic, medical procedure or body-horror scene.
  - Avoid random nerve wiring that obscures or changes anatomy.
