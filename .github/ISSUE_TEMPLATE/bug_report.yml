name: Bug report
description: Report a reproducible Studio failure.
labels: [needs-triage]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        OS and version:
        CPU architecture:
        Bun version (bun --version):
        Studio commit or version:
        Launch mode (dev, built app, portable):
        Provider, if relevant:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or UI actions and what you expected.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Actual result and exact error
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Run bun run studio:onboard --probe when setup or paths fail. Redact personal paths and account identifiers. Never attach credentials, .env.local, databases or full transcripts. Report security issues through the repository's private vulnerability channel.
