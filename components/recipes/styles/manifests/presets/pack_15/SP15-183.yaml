visualDna:
  aesthetic: 'Bioprintpunk: backstreet workshops that print living things, from leaves and flowers to new skin and strange pets, layer by layer from glowing gel.'
  subject_treatment: Keep the prompt's subject and setting; show living material being printed layer by layer by nozzles over translucent gel.
  color_and_tone: Clinical white and cool blue with translucent pink and green living gels.
  lighting_and_shadow: Soft lab light and glowing gel beds lit from underneath.
  texture_and_material: Translucent gel layers, printer nozzles, glass trays and delicate tissue lattices.
  camera_and_composition: Close views of printer heads mid-print and workshop views of many printers.
  atmosphere_and_mood: Curious and slightly uneasy, creation made cheap and handmade.
  rendering_and_quality: Clean luminous illustration with delicate layered printing detail.
  creative_brief: "Bioprintpunk: backstreet workshops that print living things, from leaves and flowers to new skin and strange pets, layer by layer from glowing gel. Carry it through layered printing, translucent gel, printer nozzles, living lattices. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: layered printing; translucent gel; printer nozzles; living lattices
