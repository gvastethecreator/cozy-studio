visualDna:
  aesthetic: >-
    Worldroot Oathforged Prophecy acts as a transferable mythic-noir router: worldroot translated
    into dark symbolic behavior, oathforged translated into dark symbolic behavior plus prophecy
    translated into dark symbolic behavior fused with pantheon-scale legend grammar with regalia
    pressure, mythic jurisdiction, dualities, lineage marks, and sovereign symbolism; it carries
    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    rooted mass, branching cause, and ancestral structural logic, oathforged shaping silhouette
    rhythm, contour pressure, and symbolic edge control plus prophecy shaping silhouette rhythm,
    contour pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem
    logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or prop
    set.
  color_and_tone: >-
    Map color through worldroot-weighted accent roles over disciplined dark values,
    oathforged-weighted accent roles over disciplined dark values plus prophecy-weighted accent
    roles over disciplined dark values together with mineral darks, royal metal, storm blue, cinder
    orange, tidal green, funeral rose, sun-gold, and cold ivory accents; values stay separated,
    accents feel intentional, and the dark palette supports the requested content rather than
    swallowing it.
  lighting_and_shadow: >-
    Use veiled prophetic glow and root-shadow contrast, worldroot-weighted rim behavior, occult
    glow, and charged shadow plus oathforged-weighted rim behavior, occult glow, and charged shadow
    with oracular backglow, storm breaks, solar slashes, underwater gloom, firelit judgment, and
    sculptural chiaroscuro; shadows must carry omen weight, rims should clarify form, and glow
    should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render dark root fiber, iron-bound cracks, and soil-dry texture plus hammered oath-metal, root
    fiber, and sealed cracks alongside bronze, stone, glass, thorn, bone, water, smoke, root, scale,
    feather, hammered iron, and polished relic surfaces; surface scale, patina, residue, gloss,
    grain, and carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with worldroot converted into repeatable spatial rhythm and symbolic hierarchy, oathforged
    converted into repeatable spatial rhythm and symbolic hierarchy plus prophecy converted into
    repeatable spatial rhythm and symbolic hierarchy plus frieze rhythm, ring authority, mirrored
    duality, oath-path diagonals, heraldic massing, and mythic scale contrast; the style should
    support portraits, objects, architecture, creatures, symbols, and full scenes through reusable
    spatial grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through forged obligation and ancestral prophecy plus future pressure and oath-bound
    inevitability and austere grandeur, cosmic obligation, sacred violence, stewardship, trial,
    inheritance, and severe ceremonial beauty; the image can become severe, sensual, sacred,
    violent, quiet, or strange when prompt X asks for it, while the preset supplies mythic
    consequence.
  rendering_and_quality: >-
    Finish with worldroot recognition with denoised dark editorial polish and controlled material
    truth plus oathforged recognition with denoised dark editorial polish and controlled material
    truth and painterly myth-noir polish with grounded material physics, denoised darks, and strong
    form hierarchy; prioritize clean denoise, readable dark values, strong silhouette hierarchy,
    tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    worldroot translated into dark symbolic behavior, oathforged translated into dark symbolic
    behavior plus prophecy translated into dark symbolic behavior; rooted mass, branching cause, and
    ancestral structural logic, oathforged shaping silhouette rhythm, contour pressure, and symbolic
    edge control plus prophecy shaping silhouette rhythm, contour pressure, and symbolic edge
    control; dark root fiber, iron-bound cracks, and soil-dry texture plus hammered oath-metal, root
    fiber, and sealed cracks; veiled prophetic glow and root-shadow contrast, worldroot-weighted rim
    behavior, occult glow, and charged shadow plus oathforged-weighted rim behavior, occult glow,
    and charged shadow; worldroot converted into repeatable spatial rhythm and symbolic hierarchy,
    oathforged converted into repeatable spatial rhythm and symbolic hierarchy plus prophecy
    converted into repeatable spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Worldroot Oathforged Prophecy after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies worldroot
    translated into dark symbolic behavior, oathforged translated into dark symbolic behavior plus
    prophecy translated into dark symbolic behavior, rooted mass, branching cause, and ancestral
    structural logic, oathforged shaping silhouette rhythm, contour pressure, and symbolic edge
    control plus prophecy shaping silhouette rhythm, contour pressure, and symbolic edge control,
    worldroot-weighted accent roles over disciplined dark values, oathforged-weighted accent roles
    over disciplined dark values plus prophecy-weighted accent roles over disciplined dark values,
    veiled prophetic glow and root-shadow contrast, worldroot-weighted rim behavior, occult glow,
    and charged shadow plus oathforged-weighted rim behavior, occult glow, and charged shadow, dark
    root fiber, iron-bound cracks, and soil-dry texture plus hammered oath-metal, root fiber, and
    sealed cracks plus worldroot converted into repeatable spatial rhythm and symbolic hierarchy,
    oathforged converted into repeatable spatial rhythm and symbolic hierarchy plus prophecy
    converted into repeatable spatial rhythm and symbolic hierarchy, finish discipline, and negative
    controls without requiring a fixed deity, ritual, prop bundle, location, or sample composition.
