visualDna:
  aesthetic: 'Frantic quill-and-ink drawing: fast whipping lines, sudden blots, spatters, dragged dry strokes, and scratchy energetic hatching that looks drawn in one feverish sitting.'
  subject_treatment: 'Any prompt subject is captured in motion and urgency: gesture over detail, splashy blacks for mass, lightning hatch for shadow, with the subject readable at a glance.'
  color_and_tone: Black and diluted gray ink on off-white rag paper, occasional sepia stain.
  lighting_and_shadow: Rough dramatic light built from blot masses and whipped white paper gaps.
  texture_and_material: Ink blots, spatter, split-nib double lines, dry-drag strokes, and rag paper tooth.
  camera_and_composition: Dynamic diagonal composition with the subject caught mid-action and splashes spilling outward.
  atmosphere_and_mood: Wild, urgent, energetic, and chaotic.
  rendering_and_quality: 'Controlled chaos: marks purposeful, silhouette clear, no random noise or digital spatter.'
  creative_brief: "Frantic quill-and-ink drawing: fast whipping lines, sudden blots, spatters, dragged dry strokes, and scratchy energetic hatching that looks drawn in one feverish sitting. Carry it through whipping quill line, ink blots and spatter, split-nib strokes, gesture over detail, feverish speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whipping quill line; ink blots and spatter; split-nib strokes; gesture over detail; feverish speed
