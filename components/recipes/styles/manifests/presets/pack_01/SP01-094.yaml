  aesthetic: 'Lightning flash: an instant of blinding blue-white light from a strike, revealing the scene in stark relief against a dark storm.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Violet-white flash, cold blue shadows, dark storm clouds, rain streaks lit white.
  lighting_and_shadow: Single overwhelming source from the sky, hard shadows thrown all at once, sharp rim light on wet edges.
  texture_and_material: Rain drops, wet stone, soaked cloth and metal flashing bright.
  camera_and_composition: Keep requested framing; show the bolt or its reflection when the sky is in frame.
  atmosphere_and_mood: Violent and ominous, a frozen instant of shock inside the storm.
  rendering_and_quality: Crisp frozen rain, clean highlights, deep storm darkness.
