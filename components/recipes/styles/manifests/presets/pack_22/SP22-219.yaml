visualDna:
  aesthetic: >-
    Render transmission, thickness and restrained refraction only on an explicitly requested transparent
    material target; leave other forms governed by their existing treatment.
  subject_treatment: >-
    Preserve identity, proportions, count, pose, action and function. Apply glass behavior only to the
    specified compatible surface; if no target is requested, do not convert the subject to glass.
  color_and_tone: >-
    Preserve the requested palette and use restrained absorption and reflections within the target.
    Do not substitute the colors of unrelated materials.
  lighting_and_shadow: >-
    Follow the requested light direction and express transmission within the target without adding a
    backlight source, broad glare or unrequested glow.
  texture_and_material: >-
    Keep glass thickness, transparency and refractive edges legible only on the named target. Preserve
    opaque and non-glass materials elsewhere.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement; the material treatment does not add
    a container, display stand or new composition.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. A glass material does not imply a glass environment or a
    special lighting setup.
  rendering_and_quality: >-
    Make the target's volume and refraction readable without obscuring its defining details; keep
    reflections controlled and secondary to the requested form.
avoidRules:
  - glass treatment outside the explicitly requested material target
  - converting opaque parts or the whole subject to glass
  - unrequested backlight, broad glare or bloom
assets:
  defaultImage: /assets/recipes/styles/defaults/SP22-219.webp
