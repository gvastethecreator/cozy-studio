    monolithic single-focus mass and forge-weighted profile, prophecy shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus forge shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
