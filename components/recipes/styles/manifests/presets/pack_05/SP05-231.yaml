visualDna:
  aesthetic: 'Bioluminescent fluorescent-paint anime: a dark abyssal base with luminous teal and coral lines painted like glowing ink, radiating stipple dots and concentric halos.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Abyssal navy and teal with glowing coral pink, pale aqua and pearl; glow colors appear only on lines and dots.
  lighting_and_shadow: 'No external light: forms are lit from within by their glowing lines, with soft bloom and concentric ring highlights.'
  texture_and_material: Fine radiating stipple, branching vein-like lines, and a soft translucent glow haze over dark cel shadow.
  camera_and_composition: Keep the requested view; repeat concentric rings and branching lines outward from the focal form.
  atmosphere_and_mood: Reverent, resonant and hushed, a slow pulse of light in deep dark.
  rendering_and_quality: Crisp glowing linework over dark cel masses, controlled bloom and radiating dot patterns; never daylight.
  key_features: self-luminous teal and coral lines; branching vein patterns; radiating stipple dots; concentric halo rings; abyssal navy base
  creative_brief: "Bioluminescent fluorescent-paint anime: a dark abyssal base with luminous teal and coral lines painted like glowing ink, radiating stipple dots and concentric halos. Carry it through self-luminous teal and coral lines, branching vein patterns, radiating stipple dots, concentric halo rings, abyssal navy base. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
