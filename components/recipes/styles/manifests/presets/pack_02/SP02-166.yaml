  lighting_and_shadow: Soft bathroom light behind the glass, with water droplets catching small highlights.
  texture_and_material: Rounded fingertip line width, drips running down from the lines, fog creeping back.
  camera_and_composition: Glass seen straight on, the drawing centered, vague shapes behind the fog.
  atmosphere_and_mood: Fleeting and intimate, a picture that will vanish in a minute.
  rendering_and_quality: Real condensation and drips; no readable words written in the fog.
