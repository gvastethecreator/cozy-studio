visualDna:
  aesthetic: >-
    Small controlled color offsets at selected edges create a directional chromatic shear while the main
    image remains aligned and readable.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Use only hues already requested, separating a small accent from a dominant color plane; avoid a
    mandatory RGB or rainbow split.
  lighting_and_shadow: >-
    Retain the requested lighting and tonal model. Edge offsets do not add a glow, new highlight or
    second light source.
  texture_and_material: >-
    Keep surface identity and detail stable. Apply offsets to a few drawn boundaries rather than
    producing glass, holographic foil or digital noise everywhere.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Preserve framing and placement; offsets
    remain short compared with each form and avoid faces, fine anatomy and requested text.
  atmosphere_and_mood: >-
    Subtle dissonance and visual vibration without requiring technology, psychedelia or supernatural
    content.
  rendering_and_quality: >-
    Keep the silhouette anchored and most edges clean. Use one clear shear direction and avoid duplicated
    objects or global chromatic aberration.
avoidRules:
  - global chromatic aberration
  - duplicated anatomy or objects
  - mandatory neon glow
assets:
  defaultImage: /assets/recipes/styles/defaults/SP14-141.webp
attributes:
