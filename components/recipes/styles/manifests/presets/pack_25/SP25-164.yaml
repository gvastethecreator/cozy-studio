visualDna:
  aesthetic: 'Material-to-Mark Campaigns: one visible property of the object is abstracted into repeatable graphic marks that run through a whole campaign.'
  subject_treatment: Translate one visible property of the prompt's subject into a graphic grammar that organizes copy across pieces, the requested words set exact.
  color_and_tone: Colors derived from the subject rather than borrowed from any campaign.
  lighting_and_shadow: Light kept coherent between object and graphics when they meet.
  texture_and_material: The material abstracted into clear marks rather than pasted as texture.
  camera_and_composition: Object or fragment in one zone, derived marks organizing text and flow.
  atmosphere_and_mood: Coherent conceptual transformation and instant recognition across the whole family.
  rendering_and_quality: Clean graphic campaign where every mark traces back to the subject.
  creative_brief: "Material-to-Mark Campaigns: one visible property of the object is abstracted into repeatable graphic marks that run through a whole campaign. Carry it through property to mark, repeatable grammar, subject-derived color, campaign family. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: property to mark; repeatable grammar; subject-derived color; campaign family
