visualDna:
  aesthetic: 'Nearest-neighbor texture close-up: 3D surfaces seen up close with unfiltered low-res textures, every texel a crisp square block of color on walls, faces and floors.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; bring the camera close so the subject's textures break into crisp square texels.
  color_and_tone: Muted texture colors as sharp square blocks, kept consistent across the whole image.
  lighting_and_shadow: Simple lighting over crisp texel blocks, kept consistent across the whole image.
  texture_and_material: Hard-edged square texels on flat polygons, kept consistent across the whole image.
  camera_and_composition: Extreme close-up where texels become large, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with crunchy tactile nostalgia.
  rendering_and_quality: Crisp unfiltered texels, no smoothing, kept consistent across the whole image.
  creative_brief: "Nearest-neighbor texture close-up: 3D surfaces seen up close with unfiltered low-res textures, every texel a crisp square block of color on walls, faces and floors. Carry it through square texels, unfiltered textures, close-up, flat polygons. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: square texels; unfiltered textures; close-up; flat polygons
