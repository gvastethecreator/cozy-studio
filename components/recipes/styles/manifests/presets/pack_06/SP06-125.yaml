visualDna:
  aesthetic: 'Tonalist oil painting: thin veils of close-valued color scumbled and rubbed over each other until the scene sinks into a single enveloping hour of haze or dusk.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: One dominant tone, grey-green, smoky blue or dusky brown, with every value compressed into a narrow middle range and a single faint warm light.
  lighting_and_shadow: Diffused twilight or fog light with no hard shadows; forms emerge only as slightly darker or lighter veils.
  texture_and_material: Thin rubbed and scumbled layers, dragged dry paint over a toned ground, soft weave texture showing through the veils.
  camera_and_composition: Keep the requested framing; simplify it into a few large soft masses with wide quiet space.
  atmosphere_and_mood: Hushed, melancholic and dreamlike, a scene remembered rather than seen.
  rendering_and_quality: Softened edges everywhere, close values, no crisp detail and no saturated color; depth built by layered haze.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tonalist Veil Oil as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: single enveloping tone; compressed middle values; scumbled thin veils; one faint warm light; soft lost edges
