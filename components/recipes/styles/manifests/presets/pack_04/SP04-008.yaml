visualDna:
  aesthetic: 'Binary noir ink: the image carved from solid black and bare white with no gray at all, figures often reduced to white-outlined silhouettes.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Strictly two values, black ink and paper white; no gray, no tone, no color.
  lighting_and_shadow: One harsh source cutting knife-edge shapes; the unlit half of every form merges into the black background.
  texture_and_material: Dry-brush drag at edges, ink splatter, rain and snow drawn as white slashes and dots scratched out of black.
  camera_and_composition: Silhouette-first staging, deep low or high angles, large black masses with small carved white shapes carrying the read.
  atmosphere_and_mood: Menacing and nocturnal, a world of hard choices and cold rain.
  rendering_and_quality: Negative-space carving with razor edges; midtones are forbidden and white shapes must read alone.
  key_features: black and white only; negative-space carving; white-outlined silhouettes; knife-edge shadows; scratched-out rain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Binary Ink Noir Comic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - gray midtones
  - screentone
  - grey
  - color
  - official card scene
  - fixed thumbnail subject
