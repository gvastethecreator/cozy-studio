visualDna:
  aesthetic: >-
    Precise illustrative construction meets broad opaque gouache marks, balancing clean values with
    selective evidence of a hand-painted surface.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Clarify only details already visible
    in the subject and keep its function unchanged.
  color_and_tone: >-
    Retain the requested palette and local color relationships. Use clear value groups and solid paint
    without shifting the image toward product branding.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep modeled shadows solid and controlled
    without adding a display light or extra highlights.
  texture_and_material: >-
    Use opaque pigment and broad manual marks selectively. Preserve the represented materials; do not
    impose extra surface treatments or decorative graphics.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Add no lettering, labels, frame or
    card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Painted precision is a rendering method and does not create
    a new presentation context.
  rendering_and_quality: >-
    Set broad value shapes first, then use a few narrow lines to describe visible construction.
    Keep manual paint variation selective and the silhouette intact.
avoidRules:
  - unrequested decorative graphics or display props
  - photographic finish that removes the painted marks
  - unrequested labels, frame or card layout
