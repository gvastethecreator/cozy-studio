visualDna:
  aesthetic: 'Penitential pixel-gothic language, not a generic pixel filter: carved, processional silhouettes; severe grotesque faces; relic-like ornamental shapes; and the tension between cramped horizontal travel and towering sacred architecture. Translate the visual grammar into the requested subject without copying any existing character or requiring a religious scene.'
  subject_treatment: >-
    Preserve the requested subject and action, then use elongated cloth or body shapes, mask-like
    facial planes, carved edges and small ritual-looking ornaments only where the subject can
    support them. Let an ordinary object read as a relic through deliberate silhouette and pixel
    grouping, not by replacing it with a church prop, saint or monster.
  color_and_tone: >-
    Favor large blue-black, charcoal and cold slate areas with pale bone or moonlit stone, then
    punctuate them with limited carmine, orange fire and occasional old-gold or violet details. The
    reviewed Team17 screenshots shift from a cold mountain/ruin view to a near-black crypt with hot
    action colors; preserve this cool-dark base and localized heat instead of defaulting to a warm
    bone-and-gold palette.
  lighting_and_shadow: >-
    Make readable pixel-cut light against broad dark architecture: cold distance or moonlight can
    frame silhouettes while a small warm effect or flame marks the action. Keep light clusters
    hard-edged and separate from the platform and character outline; avoid smooth bloom and
    generalized red grading.
  texture_and_material: >-
    Build stone, iron, cloth and organic matter from purposeful, scale-consistent pixel clusters.
    Use carved stair-step edges, small inlaid gold or metal highlights and dark shape blocks to
    distinguish materials. Let negative space remain clean; use dithering only where it describes a
    form, never as a full-image noise layer.
  camera_and_composition: >-
    Respect the prompt's requested camera and crop. Let narrow vertical architecture, a stark
    silhouette and uneven negative space carry the image; use devotional balance or a ceremonial
    center only when the subject merits it. Do not make every illustration a side-scroller, centered
    altar or shrine tableau.
  atmosphere_and_mood: >-
    Draw on Cvstodia's penitential, grotesque and mournful grandeur: quiet religious unease can sit
    beside abrupt violence and a few fiercely bright effects. Keep the requested emotion primary;
    religious iconography and gore are not mandatory content.
  rendering_and_quality: >-
    Use authored high-resolution 2D pixel illustration with deliberate stepped edges, layered
    environmental planes and sparse, highly legible clusters. Keep the pixel medium visible in the
    shape construction, not as scanlines laid over another rendering style or blurred retro noise.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
