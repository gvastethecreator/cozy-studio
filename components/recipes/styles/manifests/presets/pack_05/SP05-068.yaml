  lighting_and_shadow: Smoky dim industrial light from bare bulbs and furnace glow.
  texture_and_material: Dirty scratchy ink lines, smudges and grimy layered textures.
  camera_and_composition: Chaotic crowded alley compositions and odd deadpan humor.
  atmosphere_and_mood: Keep the requested mood with grimy chaotic humor.
  rendering_and_quality: Grimy scratchy dark comedy manga illustration with bizarre masks.
