visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around mineral-fissure contours
    that branch sparingly and divide forms into a few clean, unequal planes. For color and surface, retain the prompt's hues, but favor chalk, cool stone, and deep
    graphite values with a small mineral glint. Loneliness can come from sparse marks
    and cool intervals; keep it quiet rather than automatically tragic
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through mineral-fissure contours that branch
    sparingly and divide forms into a few clean, unequal planes; use detail selectively
    and keep the actual form easy to read. Add no unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain the prompt's hues, but
    favor chalk, cool stone, and deep graphite values with a small mineral glint. Keep
    values legible across the prompted light and dark range; do not crush midtones or
    dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; separate planes with pale edge
    light and quiet inner shadow; avoid turning a highlight into a crystal object. Keep
    shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use fine dry mineral grain and crisp
    fracture-like strokes only where the existing material can carry them. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; let open
    value space and isolated contour breaks create visual distance within the supplied
    framing. Use the mark rhythm inside the supplied composition rather than replacing
    it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Loneliness can come from sparse marks and
    cool intervals; keep it quiet rather than automatically tragic. Darkness and tension
    are optional tonal pressure, never a requirement to add danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and mineral-fissure contours that branch
    sparingly and divide forms into a few clean, unequal planes; keep focal edges crisp,
    texture controlled, and dark values legible. Avoid photoreal or 3D-render drift,
    watermark, logo, and fake readable text.
  key_features: >-
    mineral-fissure contours that branch sparingly and divide forms into a few clean,
    unequal planes; retain the prompt's hues, but favor chalk, cool stone, and deep
    graphite values with a small mineral glint; separate planes with pale edge light and
    quiet inner shadow; avoid turning a highlight into a crystal object; use fine dry
    mineral grain and crisp fracture-like strokes only where the existing material can
    carry them; and let open value space and isolated contour breaks create visual
    distance within the supplied framing. The five cues should read as one
    mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use mineral-fissure contours that branch
    sparingly and divide forms into a few clean, unequal planes, retain the prompt's
    hues, but favor chalk, cool stone, and deep graphite values with a small mineral
    glint, separate planes with pale edge light and quiet inner shadow; avoid turning a
    highlight into a crystal object, and use fine dry mineral grain and crisp
    fracture-like strokes only where the existing material can carry them; the prompt
    supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
