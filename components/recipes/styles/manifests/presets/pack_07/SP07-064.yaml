visualDna:
  aesthetic: 'Buoyant retrofuture architecture: pearl-ivory streamline superstructures held aloft on gas envelopes and ring platforms above a sea of clouds, champagne metal seams and perimeter beacons.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the airborne platform setting above the clouds and the streamline finish, and it never bends, loops or breaks the requested structure.
  color_and_tone: Pearl ivory, champagne gold, sunset peach and lavender clouds; soft pastel gradients with no black.
  lighting_and_shadow: Low sunset side light, clouds glowing from below, soft beacon points along every rim.
  texture_and_material: Enamel-smooth ivory panels, brushed champagne seams, taut fabric gas envelopes with rib lines.
  camera_and_composition: Keep the requested geometry; the cloud floor always lies below, with no ground or baseplate in view.
  atmosphere_and_mood: Serene, elegant and buoyant, mid-century optimism at altitude.
  rendering_and_quality: Airbrushed retro-futurist illustration polish with soft gradients and crisp streamline edges.
  key_features: pearl-ivory streamline forms; gas envelopes and ring platforms; champagne metal seams; cloud sea below; airbrushed sunset gradients
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Aerostatic Cloud Retrofuture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
