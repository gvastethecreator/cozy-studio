visualDna:
  aesthetic: >-
    A wiry, weathered line style using thin tangled contours, rust-like stains, descending
    diagonals, and cool signal glints against industrial darks.
  subject_treatment: >-
    Preserve the requested subject and pose. Thread fine broken lines along its existing edges
    and use sparse scratch marks; add no cables, harness, or person.
  color_and_tone: >-
    Pair oxidized orange and brown with slate, black, and cold cyan; keep the brightest accents
    small and isolated.
  lighting_and_shadow: >-
    Use firm dark shadows, thin cool edge highlights, and muted warm reflections; avoid adding a
    visible neon source.
  texture_and_material: >-
    Retain the depicted material with dry scratches, fine wire-like marks, and scattered
    rust-colored wear as surface treatment only.
  camera_and_composition: >-
    Keep the requested camera. Use slanting line rhythms and uneven detail density within the
    existing composition; do not imply falling.
  atmosphere_and_mood: >-
    Create a tense, worn quiet through brittle lines, downward visual cadence, and subdued color
    rather than a descent scene.
  rendering_and_quality: >-
    Balance delicate contour threads with substantial shadow blocks; keep surface grain
    selective and shapes readable.
  key_features: >-
    Wiry broken contours; rust and slate palette; descending line cadence; cold cyan glints.
  creative_brief: >-
    Retain the prompt’s subject, pose, and setting. Apply wiry contours, rust-toned surface
    marks, and cold glints; add no cable, harness, falling figure, or industrial scene.
