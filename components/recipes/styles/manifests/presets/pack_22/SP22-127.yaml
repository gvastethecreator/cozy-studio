visualDna:
  aesthetic: >-
    Rounded-volume illustration uses smooth modeling, broad plane changes and restrained contour lines
    to make forms feel soft without turning them glossy or plastic.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep facial and structural features
    recognizable; do not enlarge the head or eyes unless the request asks for that change.
  color_and_tone: >-
    Build gentle shadow shapes and small material highlights from the requested lighting and palette.
    Keep colors distinct without forcing a pastel or sugary scheme.
  lighting_and_shadow: >-
    Respect the requested light direction and contrast. Use soft transitions to describe round volume
    without adding glow or sharp specular shine.
  texture_and_material: >-
    Use a clean matte finish and preserve the character of each represented material. Avoid plastic gloss
    and do not smooth away important texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Rounded volume does not require
    a close-up, a simplified pose or changed proportions.
  atmosphere_and_mood: >-
    Keep the requested tone. Soft shapes do not require cuteness, childishness or a particular story.
  rendering_and_quality: >-
    Let large plane changes carry the contour, with drawn lines used sparingly. Maintain clean anatomy,
    readable structure and restrained highlights.
avoidRules:
  - unrequested head or eye enlargement
  - plastic gloss
