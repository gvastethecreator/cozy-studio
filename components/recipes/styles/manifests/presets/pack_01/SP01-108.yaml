visualDna:
  aesthetic: 'Documentary typology portrait: a medium-format frontal full-length portrait of a person as their trade, one of an imagined series, with no drama in light or pose.'
  subject_treatment: Keep the prompt subject and setting; stand the person upright and square to the camera, full length, looking into the lens, holding the tool or object that defines them.
  color_and_tone: Soft neutral color or quiet monochrome; the sitter's clothes carry the only accents.
  lighting_and_shadow: Even overcast daylight, no key light, gentle shadow under the feet.
  texture_and_material: Worn work clothes, tools and hands rendered with medium-format clarity.
  camera_and_composition: Camera at chest height, centered subject, full body with a little ground and plain local background, symmetrical frame.
  atmosphere_and_mood: Dignified and matter-of-fact, a person simply presented as who they are.
  rendering_and_quality: Medium-format precision and restraint; no dramatic grading, wide-angle distortion or candid blur.
  creative_brief: "Documentary typology portrait: a medium-format frontal full-length portrait of a person as their trade, one of an imagined series, with no drama in light or pose. Carry it through frontal full-length stance, direct gaze, defining tool in hand, even overcast light, centered symmetrical frame. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: frontal full-length stance; direct gaze; defining tool in hand; even overcast light; centered symmetrical frame
