visualDna:
  aesthetic: 'Crystalline facet-highlight anime: specular highlights cut as sharp polygon shards, fine seam lines, and long thin orbital arc strokes balancing the frame.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Deep blue and violet against glacial white, with a tiny warm gold signal; each facet is a separate clean tone.
  lighting_and_shadow: Hard cold key producing polygonal white specular shards on edges and hard violet cel shadows, with one gold glint as counterweight.
  texture_and_material: Polished mirror surfaces broken into crystal facets, with smooth gradients inside each facet.
  camera_and_composition: Keep the requested view; counterbalance the subject with opposing diagonal arcs so the frame feels mirrored without duplicating the subject.
  atmosphere_and_mood: Cold strategic tension, poised and elegant, like a move not yet played.
  rendering_and_quality: Sharp polygon specular shards, fine seams, clean facet color blocks and thin arcs, with restrained glow.
  key_features: polygon-shard specular highlights; blue-violet and glacial white palette; opposing orbital arcs; fine seam lines; single gold counterweight glint
  creative_brief: "Crystalline facet-highlight anime: specular highlights cut as sharp polygon shards, fine seam lines, and long thin orbital arc strokes balancing the frame. Carry it through polygon-shard specular highlights, blue-violet and glacial white palette, opposing orbital arcs, fine seam lines, single gold counterweight glint. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
