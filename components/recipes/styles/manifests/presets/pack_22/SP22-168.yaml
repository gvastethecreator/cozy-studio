visualDna:
  aesthetic: >-
    Compact, clearly simplified forms use broad curved contours, intense flat color areas and a small
    number of uncomplicated shadows.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and expression. Simplify shape language without
    changing who or what the subject is or making it childlike by default.
  color_and_tone: >-
    Keep the requested hues and arrange them in confident flat blocks with concise shadow values; do not
    replace a specified palette with generic bright colors.
  lighting_and_shadow: >-
    Follow the stated light direction and use simple, bounded shadow areas that explain the forms without
    adding new highlights or effects.
  texture_and_material: >-
    Use clean matte fills and broad smooth contours; preserve material differences through shape and
    requested color rather than adding texture or pixelation.
  camera_and_composition: >-
    Preserve the requested viewpoint, framing, crop and placement. Simplified masses must stay within the
    original silhouette and arrangement.
  atmosphere_and_mood: >-
    Maintain the requested tone and setting. Bold graphic simplicity does not imply childish expressions
    or an added character role.
  rendering_and_quality: >-
    Prioritize a readable silhouette, thick rounded contour and distinct large color blocks; keep edges
    clean and avoid low-resolution artifacts.
avoidRules:
  - unrequested changes to identity, proportions or expression
  - pixelation or low-resolution rendering
