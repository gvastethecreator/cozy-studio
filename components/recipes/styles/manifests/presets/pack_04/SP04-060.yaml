visualDna:
  aesthetic: 'Weapon design orthographic: one weapon drawn in strict side elevation at full length, painted in greyscale over clean line, with cross-section slices.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a strict side-elevation weapon sheet with cross-section slices and a hand silhouette for scale, and that layout replaces the requested framing.
  color_and_tone: Mostly neutral steel greys and dark grip materials with one material accent such as brass, bone or enamel, on a mid-grey ground.
  lighting_and_shadow: Flat studio light raking slightly from above to reveal bevels, fullers and the edge grind.
  texture_and_material: Forge marks, grind lines, leather or cord wrapped at the grip and pinned rivets, each material clearly separated.
  camera_and_composition: Exact side view spanning the frame horizontally, small section slices beneath it and a hand silhouette for scale.
  atmosphere_and_mood: Functional and heavy, a form dictated by how it strikes.
  rendering_and_quality: Precise production finish with clean edges, no motion effects and no background scene.
  key_features: strict side elevation; full length across the frame; cross-section slices; hand silhouette for scale; one accent material
  creative_brief: "Weapon design orthographic: one weapon drawn in strict side elevation at full length, painted in greyscale over clean line, with cross-section slices. Carry it through strict side elevation, full length across the frame, cross-section slices, hand silhouette for scale, one accent material. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
