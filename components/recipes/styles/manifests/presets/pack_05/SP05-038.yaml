visualDna:
  aesthetic: 'Minimal psychic anime: plain forms drawn with lightly layered searching pencil contours in wide blank space, with a few peripheral shapes subtly warped as if bent by pressure.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Airy pastels, mostly paper white, with one small acid yellow-green accent.
  lighting_and_shadow: Soft flat values and pale, lightly drawn edges; almost no cast shadow.
  texture_and_material: Pencil grain under irregular translucent washes that stop short of the lines.
  camera_and_composition: Keep the requested framing; leave wide empty space and keep the few warped shapes near the focal area.
  atmosphere_and_mood: Quiet unease and introspection, pressure felt in the empty space more than seen.
  rendering_and_quality: Airy hand-drawn marks, sparse distortion and a large share of untouched paper.
  key_features: searching pencil contours; wide blank space; subtly warped peripheral shapes; airy pastels; acid yellow-green accent
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Psychedelic Psychic Minimalism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
