visualDna:
  aesthetic: 'Giallo: 1970s Italian thriller cinema of baroque interiors flooded with saturated colored gels and tense, stylized close-ups.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Deep red, cobalt blue and acid green gels on dark baroque interiors; glossy blacks.
  lighting_and_shadow: Colored gels from opposite sides, hard shadows, sudden pools of saturated light.
  texture_and_material: Velvet, marble, lacquer, black leather gloves and glass reflections.
  camera_and_composition: Extreme close-ups of eyes and hands, slow zooms, long corridors in deep perspective.
  atmosphere_and_mood: Stylish and paranoid, beauty and menace sharing the same colored light.
  rendering_and_quality: Saturated 35 mm film look with grain; implied threat, never gore.
  key_features: red, blue and green gels; baroque interiors; eye and hand close-ups; deep corridors; implied threat
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Giallo Horror as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
