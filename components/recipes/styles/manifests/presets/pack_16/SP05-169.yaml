visualDna:
  aesthetic: >-
    A wired 90s cel look fragments selected contours into offset exposures and interrupted horizontal
    bands. Identity feels unstable through registration shifts, not through adding another character.
  subject_treatment: >-
    Preserve the requested identity and number of forms. Use a few offset contour fragments as a
    printing or signal echo; never duplicate the subject or alter its defining features.
  color_and_tone: >-
    When color is open, set electric blue or violet accents against ink black and muted neutrals.
    Preserve requested hues and keep color shifts narrow and purposeful.
  lighting_and_shadow: >-
    Use clean cel shadows with small displaced edge lights and occasional line interruptions. Retain
    the requested lighting; do not add a screen or neon source.
  texture_and_material: >-
    Add sparse scanline breaks and slight color-registration slips over otherwise solid painted fills.
    Keep the effect graphic and prevent noise from obscuring material.
  camera_and_composition: >-
    Use repeated edge fragments within the existing framing to suggest disorientation. Preserve camera
    and form placement; do not multiply the scene.
  atmosphere_and_mood: >-
    Create unease through alignment changes and empty intervals only when compatible with the prompt.
    Preserve its requested tone and avoid a digital-world narrative.
  rendering_and_quality: >-
    Keep one primary silhouette completely readable; limit offsets to short bands and edges. Avoid
    severe glitch breakup or soft double exposure.
  key_features: >-
    offset contour fragments; interrupted horizontal scan bands; electric blue-violet registration
    accents
  creative_brief: "Restyle the requested content with sparse registration shifts and fragmented cel contours. Preserve its identity, count, setting and composition; do not create duplicates, screens or a digital narrative. Use it as a reusable look on any subject."
