visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Red Dead Redemption 2 gameplay screenshots:
    third-person western action capture with train robbery staging, cinematic frontier lighting,
    cover positions, and grounded character motion. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Red Dead Redemption 2-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Red Dead Redemption 2-informed palette: dust tan, copper sunset, black iron train, denim
    blue, leather brown, and muzzle-flash orange. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through golden-hour sun, train lamp glow, smoke haze, gunfire flashes, and long
    canyon shadows. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wood planks, worn leather, iron rails, smoke, dust, horse tack, canvas, and
    period firearm metal. Materials should feel like in-engine game assets captured during play,
    with enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person over-shoulder action framing with train length, cover beats, rider
    positions, and cinematic horizon depth. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Red Dead Redemption 2-derived mood: lawless, weighty, dusty, tense, and cinematic. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal western HUD, reticle,
    weapon wheel hint, minimap, or wanted indicators can appear if coherent. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Red Dead Redemption 2 gameplay screenshots; third-person western action capture with train
    robbery staging, cinematic frontier lighting, cover positions, and grounded character motion;
    dust tan, copper sunset, black iron train, denim blue, leather brown, and muzzle-flash orange;
    golden-hour sun, train lamp glow, smoke haze, gunfire flashes, and long canyon shadows; wood
    planks, worn leather, iron rails, smoke, dust, horse tack, canvas, and period firearm metal;
    third-person over-shoulder action framing with train length, cover beats, rider positions, and
    cinematic horizon depth; lawless, weighty, dusty, tense, and cinematic; HUD guidance: minimal
    western HUD, reticle, weapon wheel hint, minimap, or wanted indicators can appear if coherent
  creative_brief: >-
    Use Red Dead Copper Train Heist as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Red Dead Redemption 2: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
