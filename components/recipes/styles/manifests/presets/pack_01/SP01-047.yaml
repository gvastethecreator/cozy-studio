visualDna:
  aesthetic: 'Zone System black-and-white landscape: a large-format view camera at f/64, exposure placed and development controlled so the print runs from pure white to deep black with every zone in between.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: 'Monochrome with a full ten-zone scale: textured whites in snow and cloud, luminous mid-greys, deep but detailed blacks; skies darkened as if through a red filter.'
  lighting_and_shadow: Dramatic natural light — storm breaks, raking sun, cloud shadow patterns — chosen to separate planes.
  texture_and_material: Tonal microdetail in rock, bark, water, fur and snow, sharp from front to back.
  camera_and_composition: Tripod view camera, near-far depth with everything in focus, strong foreground anchor and grand background.
  atmosphere_and_mood: Grand and timeless, stillness and scale held in silver tones.
  rendering_and_quality: Fine-art silver print with deep blacks and no clipped highlights; an animal or object stays the subject, rendered with the same tonal range.
  key_features: ten-zone black and white; f/64 front-to-back sharpness; red-filter dark skies; raking dramatic light; silver print
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Zone System Landscape as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
