visualDna:
  aesthetic: 'Folded horizon: the ground plane hinges upward along a sharp crease and folds over itself, streets and buildings continuing upside down overhead.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into a ground plane folded along a hinge so the setting continues overhead, and that advertised structural change is the purpose of the preset.
  color_and_tone: Ordinary daylight neutrals of the place, with the overhead half slightly hazier and bluer.
  lighting_and_shadow: One sun lighting both halves consistently, so shadows point the same way on the folded plane.
  texture_and_material: The real materials of the requested setting, unchanged, only relocated by the fold.
  camera_and_composition: Horizon replaced by a crisp fold line; the upper half of the frame is the same world hanging overhead.
  atmosphere_and_mood: Disorienting and grand, the world closing like a book.
  rendering_and_quality: Photographic realism along a clean hinge, not a smooth ring curve or a mirror reflection.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Folded-Horizon City as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ground hinging along a sharp crease; setting continuing upside down overhead; one consistent sun; fold line instead of horizon; hazier upper half
