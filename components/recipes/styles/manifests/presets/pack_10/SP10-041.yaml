visualDna:
  aesthetic: >-
    Metaphysical Art becomes a transferable surreal symbolic transformation system: start from
    Metaphysical stillness, Suspended time, and Mannequins, then route prompt content through
    impossible logic, dream scale, symbolic displacement, liminal staging, and psychic texture
    without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Long shadows to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Yellow, Green, Dark; use color as emotional unreliability, nostalgic
    drift, uncanny contrast, or symbolic temperature, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Afternoon sun drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Plaster, stone as the tactile or mark-making basis; surfaces should support the illusion
    with believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to
    figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Mannequins as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Silent, philosophical as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as De Chirico, silent: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Metaphysical stillness; Long shadows; Yellow, Green, Dark; Afternoon sun; Plaster, stone;
    Mannequins; Silent, philosophical; De Chirico, silent; Suspended time
  creative_brief: >-
    Apply metaphysical-art stillness over the input with long afternoon shadows, yellow-green-dark
    tonal tension, plaster or stone quietness, mannequin-like simplification when figures appear,
    and geometry that suspends time. If plaza, arch, or architecture exists, use it; otherwise
    impose classical silence and philosophical emptiness without requiring a city square.
avoidRules:
  - busy
  - detailed
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
