visualDna:
  aesthetic: >-
    Bloodborne Gothic horror as painted art: dense vertical Victorian architecture and severe
    tailored silhouettes disturbed by gaunt beast anatomy, ritual medicine and barely comprehensible
    organic forms.
  subject_treatment: >-
    Preserve explicit identity, action and count. Give unspecified forms tapered tailored contours,
    long articulated rhythms and a tension between refined craft and unsettling anatomy; compatible
    ironwork, layered leather and delicate surgical details remain purposeful.
  color_and_tone: >-
    Anchor open palettes in blue-gray, blue-black, soot, and muted umber, with pale window light and
    small amber practicals. A restrained crimson note may appear when appropriate, but Bloodborne is
    not a mandatory blood-red filter; preserve explicitly requested colors.
  lighting_and_shadow: >-
    Set small warm lamps or candle points against broad cool architectural shadow, with pale window
    shafts when the scene contains a light opening. Keep nearby forms legible in the dark; haze and
    wet reflections depend on the requested setting.
  texture_and_material: >-
    Paint aged stone, dark wood, iron, glass, leather, and tailored cloth with controlled edge wear
    and selective reflected light. Maintain a fine-grained, composed finish rather than covering
    every surface with blood, wetness, or corrosion.
  camera_and_composition: >-
    Preserve the prompt's viewpoint and crop. Where open, use vertical window, column, railing, or
    stair rhythms to create depth and grandeur; the low third-person game camera is a separate
    capture treatment, not a requirement for every illustration.
  atmosphere_and_mood: >-
    Make elegance feel unsafe through scale, asymmetry, dark negative space, and isolated lights.
    The style can suggest decayed grandeur without requiring a city, hunter, monster, bloodshed, or
    named location.
  rendering_and_quality: >-
    Finish as a controlled Gothic illustration with crisp selected architectural and object edges,
    layered cool shadow, and small warm focal highlights. It should remain an illustration rather
    than imitating a PS4 screenshot or a glossy cinematic poster.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
