visualDna:
  aesthetic: 'Handheld strategy map: bright 15-bit pixel art on a square battle grid, with chunky outlined unit sprites standing on clean terrain tiles.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns an overhead tactics grid with units standing on readable terrain tiles, and adds no score, health bar, logo or readable interface text.
  color_and_tone: Oversaturated bright colors made for an unlit screen; blue and red team colors; translucent blue squares for movement range.
  lighting_and_shadow: Flat top light; a small dark ellipse under each unit and a one-tile shadow on the north side of cliffs.
  texture_and_material: Clean terrain tiles for plains, forest, river and mountain, thick dark outlines on units, faint grid lines.
  camera_and_composition: Overhead, slightly tilted grid filling the frame; units about one tile tall, the key clash near the center.
  atmosphere_and_mood: Clear and tactical, a whole battle understood at a glance.
  rendering_and_quality: Crisp readable icons and terrain; no numbers, stat windows or text on the map.
  key_features: square battle grid; bright unlit-screen palette; outlined unit sprites; movement-range squares; terrain tiles
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Handheld Tactics Grid Pixel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
