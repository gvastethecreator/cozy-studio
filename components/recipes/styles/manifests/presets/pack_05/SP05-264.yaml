visualDna:
  aesthetic: Hairline anime linework on broad porcelain-pale planes, drawn with medical-plate precision, where one single contour deliberately breaks, doubles or wobbles.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Porcelain white, cool gray and pale blue-gray fields with one tiny coral or vermilion note placed at the point of rupture.
  lighting_and_shadow: Clear diffuse near-shadowless light like a white room, plus one small hard highlight exactly where the line breaks.
  texture_and_material: Smooth matte fields over extremely fine paper grain; technical-pen hairlines of constant width and no stains anywhere.
  camera_and_composition: Keep the requested camera; the subject sits with generous even margins so the precision feels clinical and calm.
  atmosphere_and_mood: Fragile calm with one small wrong note, innocence kept under glass.
  rendering_and_quality: Pristine hairline contours, flat pale fills and one controlled irregularity; no grime and no gradients beyond a soft gray shadow.
  key_features: technical hairline contours; broad porcelain-pale planes; one broken or doubled contour; tiny coral accent; near-shadowless diffuse light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Clinical Innocence Rupture Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
