visualDna:
  aesthetic: 'Pressure-Release Letterforms: styleframes where letters squeeze under pressure and spring back, stems and counters changing together.'
  subject_treatment: Show the requested word in keyframes of rest, controlled squeeze and release, counters protected and every character exact.
  color_and_tone: Stable type palette on a contrasting ground with one optional accent.
  lighting_and_shadow: Flat treatment where pressure reads through shape and space.
  texture_and_material: Continuous contours with the minimum stem thickness always preserved.
  camera_and_composition: A declared pressure zone with recovery margins around the word.
  atmosphere_and_mood: Building tension, a brief hold and a damped, readable release.
  rendering_and_quality: Crisp keyframes with recognizable letters and accents anchored.
  creative_brief: "Pressure-Release Letterforms: styleframes where letters squeeze under pressure and spring back, stems and counters changing together. Carry it through squeeze and release, protected counters, three states, exact word. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
