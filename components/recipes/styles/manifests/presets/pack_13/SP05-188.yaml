visualDna:
  aesthetic: >-
    Polished anime drawing contrasts precise straight edges with rounded contours and quiet
    cel shadow.
  subject_treatment: >-
    Retain subject, clothing, arrangement; show hierarchy through edge and value, not social
    role.
  color_and_tone: >-
    Deep indigo, graphite, warm ivory, muted brass, small burgundy note.
  lighting_and_shadow: >-
    Cool directional shadows and restrained pale edge; no rain or invented source.
  texture_and_material: >-
    Clean matte planes; fine trim only on existing ornament.
  camera_and_composition: >-
    Respect camera and count; vertical alignment only if composition supports it.
  atmosphere_and_mood: >-
    Formal restraint shapes line only; class tension and melodrama are optional.
  rendering_and_quality: >-
    Polished edges, modest contrast, reserved shine, no uniform cues.
  key_features: >-
    Precise edge hierarchy, indigo-brass palette, contextual vertical rhythm, restrained cel
    finish
