visualDna:
  aesthetic: 'Hideaki Anno storyboard and layout look: rough graphite storyboards, bureaucratic emergency staging, telephoto compositions and tense quick cutting.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people as rough graphite figures in tense emergency scenes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Graphite grey and warning orange, true to the Hideaki Anno palette.
  lighting_and_shadow: Harsh emergency light, lit the way Hideaki Anno lights its scenes.
  texture_and_material: Rough graphite storyboard lines, with the surface finish of Hideaki Anno.
  camera_and_composition: Telephoto staging and quick cuts, framed the way Hideaki Anno composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with tense emergency urgency.
  rendering_and_quality: Rough storyboard illustration, in the recognizable hand of Hideaki Anno.
  key_features: Anno storyboards; graphite; emergency staging
  creative_brief: "Hideaki Anno storyboard and layout look: rough graphite storyboards, bureaucratic emergency staging, telephoto compositions and tense quick cutting. Carry it through Anno storyboards, graphite, emergency staging. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
