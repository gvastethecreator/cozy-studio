visualDna:
  aesthetic: 'Yoshimichi Kameda sakuga as in his Fullmetal Alchemist and Mob Psycho impacts: brushy bold lines, inverted negative impact frames, ink-like shapes and powerful graphic hits.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with brushy bold outlines and a single inverted negative frame at the moment of contact. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Inverted black and white impact frames with one hot accent color.
  lighting_and_shadow: Negative-image flash at impact, turning shadows white and lights black.
  texture_and_material: Brushy ink-like lines and bold graphic impact shapes.
  camera_and_composition: Tight impact framing at the exact instant of contact.
  atmosphere_and_mood: Keep the requested mood with shocking graphic impact.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Yoshimichi Kameda sakuga as in his Fullmetal Alchemist and Mob Psycho impacts: brushy bold lines, inverted negative impact frames, ink-like shapes and powerful graphic hits. Carry it through Yoshimichi Kameda brush lines, negative impact frames, graphic hits. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Yoshimichi Kameda brush lines; negative impact frames; graphic hits
