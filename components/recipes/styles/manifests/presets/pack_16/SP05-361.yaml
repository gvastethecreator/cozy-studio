  color_and_tone: Early morning blues turning to gold, with warm indoor gym light in the evening.
  lighting_and_shadow: Sunrise and sunset light marking passing days, long shadows on tracks and floors.
  texture_and_material: Worn shoes, taped fingers, scuffed floors and dog-eared practice notebooks.
  camera_and_composition: Sequences of repeated framings from day to day, like panels of the same routine.
  atmosphere_and_mood: Patient and hopeful, improvement measured in tiny steps that finally add up.
  rendering_and_quality: Warm sports anime with rhythmic repeated compositions and careful detail.
  key_features: repetition; sunrise runs; worn gear; small progress
