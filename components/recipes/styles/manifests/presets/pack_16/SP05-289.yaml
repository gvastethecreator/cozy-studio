  camera_and_composition: Long static compositions, extreme silence, figures small in vast ruins.
  atmosphere_and_mood: Keep the requested mood with austere mystical silence.
  rendering_and_quality: Sparse painterly 1985 hand-drawn feature frame with meditative stillness.
  key_features: Oshii silence; Amano designs; drowned gothic city; monochrome dusk; still water
