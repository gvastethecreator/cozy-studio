  creative_brief: "ufotable Fate/stay night: Unlimited Blade Works look (2014): Takashi Takeuchi designs, lavish digital compositing, glowing magic circuits, fields of swords under burning skies and dark urban nights. Carry it through ufotable compositing, sword fields, magic circuits, urban night. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
