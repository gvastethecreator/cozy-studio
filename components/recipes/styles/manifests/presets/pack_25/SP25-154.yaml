visualDna:
  aesthetic: 'Weathered Public Display: a preserved graphic placed on an aged public support, with wear limited to the frame and surroundings.'
  subject_treatment: Place the prompt's poster or graphic on a weathered public panel or wall, wear kept on the support while the artwork and text stay exact.
  color_and_tone: Artwork colors legible, the environment in a subordinate palette.
  lighting_and_shadow: Coherent ambient light with no shadow over the main message.
  texture_and_material: Controlled wear on the frame and support, clean ink and brand.
  camera_and_composition: Dominant reading plane with enough context for scale.
  atmosphere_and_mood: Believable street presence and the marks of accumulated public use.
  rendering_and_quality: Aging never alters letters or suggests another campaign.
  creative_brief: "Weathered Public Display: a preserved graphic placed on an aged public support, with wear limited to the frame and surroundings. Carry it through weathered support, clean artwork, street context, readable scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: weathered support; clean artwork; street context; readable scale
