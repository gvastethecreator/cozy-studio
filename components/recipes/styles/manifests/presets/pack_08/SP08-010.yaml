    Preppy Ivy League operates as a portable fashion-costume router: combine Classic American prep,
    Ivy legacy polish, summer-ease refinement with contemporary fashion styling with fit control,
    editorial polish, wearable silhouette, and modern wardrobe hierarchy, so the preset supplies
    styling behavior rather than a fixed outfit card, required wearer, or literal garment sample.
  subject_treatment: >-
    Preserve the prompt's subject, motion, and context while forms tailor, drape, cinch, layer,
    streamline, accessorize, polish, or simplify through Clean layers, natural shoulder, half-canvas
    drape, straight-leg chino, blazer roll; identity stays readable as silhouette, fit, layering,
    body-volume logic, edge behavior, and styling hierarchy shift into this preset.
  color_and_tone: >-
    Map color through modern neutrals, controlled accent color, textile value separation,
    skin-adjacent warmth, and editorial contrast; keep textile values separated, accents
    intentional, material color believable, and palette behavior attached to the subject instead of
    pasted wardrobe decoration.
  lighting_and_shadow: >-
    Use Daylight, autumn-gold warmth, reading-interior-system softness, regatta-morning crispness
    plus fashion editorial light with fabric sheen, controlled shadow, polished skin or surface
    response, and clean silhouette reads as the styling light contract, revealing cut, drape,
    surface response, trim, transparency, or armor structure without erasing prompt readability.
  texture_and_material: >-
    Render Oxford cloth, Shetland wool knit, madras cotton, seersucker, needlepoint belt, shell
