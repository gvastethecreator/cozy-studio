visualDna:
  aesthetic: 'Digital speedpaint finished in under an hour: big flat value blocks laid with a hard round and a textured chalk brush, detail placed only at the focal point.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: Three or four value groups in one dominant hue family, with a single complementary accent reserved for the focal point and unmixed edges between hue areas.
  lighting_and_shadow: One light direction decided in the first minutes; shadow shapes merged into single dark masses and highlights struck in with a few opaque strokes.
  texture_and_material: Visible hard-edged brush strokes, dry chalk-brush drag, lasso-cut edges and unblended strokes left raw toward the periphery.
  camera_and_composition: Keep the requested framing; the focal area is sharpened while the canvas edges dissolve into loose strokes and untouched block-in.
  atmosphere_and_mood: Urgent and decisive, the energy of fast choices left visible on the canvas.
  rendering_and_quality: 'Deliberately unfinished: detail density drops sharply outside the focal point, with no smoothing pass and no rendered texture maps.'
  key_features: three or four value groups; hard round and chalk brush strokes; detail only at the focal point; canvas edges left as block-in; one complementary accent
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Value-Block Speedpaint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
