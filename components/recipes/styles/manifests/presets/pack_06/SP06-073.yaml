visualDna:
  aesthetic: >-
    Embroidery on Photo acts as a transferable art-medium router: start from Thread stitched over
    photo, Thread texture and mixed-media assembly system built from layering, adhesion, surface
    collision, found-material logic, tactile seams, and handmade construction, then apply the medium
    behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Thread lines; preserve the prompt subject while rebuilding
    it through collage cuts, photographic fragments, stitched thread, tape, smoke, coffee stain,
    gilding, marbling, or stencil bridges, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Photo + Thread accent; treat color as material combination: paper aging,
    varnish warmth, toner black, red graphic strikes, thread accents, metallic leaf, sepia stain, or
    marbled oil flow, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Photo lighting; make light reveal relief, varnish gloss, paper lift, tape
    shine, thread shadow, smoke softness, metallic reflection, or flat stencil contrast, so value
    structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Glossy photo, matte thread; surface detail should show torn fiber, glue, tape edge, cork
    tooth, thread thickness, soot, coffee bloom, varnish crackle, or assembled object depth, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Stitched details; compose through layer order, overlap, pin logic,
    cut rhythm, swatch relationships, tactile seams, and graphic collision without requiring a
    literal craft table, with scale, spacing, edge rhythm, and visual hierarchy doing the style
    work.
  atmosphere_and_mood: >-
    Keep the mood Personal, tactile; derive mood from DIY urgency, memory, repair, evidence, punk
    collision, tactile intimacy, decorative excess, or experimental material play, letting the
    medium alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Artistic, altered; finish with coherent material stacking, readable subject
    transformation, and no single flat texture pasted over the whole image, clean denoised surfaces
    where appropriate, and enough craft evidence to make the medium recognizable.
  key_features: >-
    Thread stitched over photo; Thread texture; Photo + Thread accent; Glossy photo, matte thread;
    Stitched details
  creative_brief: >-
    Apply Embroidery on Photo as an art-style preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Thread stitched over photo, Thread texture, Glossy photo, matte thread without requiring the
    card image's original subject.
