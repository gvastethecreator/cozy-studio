  color_and_tone: Flesh pinks, bile yellow, sick green and dark red.
  lighting_and_shadow: Wet lab light and bioluminescent glow, expressed through the style rather than photographic lighting.
  texture_and_material: Wet skin, membrane, cartilage and glass vats, visible at a glance as the signature of the style.
  camera_and_composition: Close, claustrophobic framing, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Unsettling, visceral, strange and feverish, driven by the construction, color and rhythm.
  rendering_and_quality: Detailed painterly render with wet surfaces, with clean, deliberate marks and no accidental noise.
