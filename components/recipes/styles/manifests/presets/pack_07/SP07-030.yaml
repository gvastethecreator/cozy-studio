visualDna:
  aesthetic: 'Constructivist architecture of the 1920s avant-garde: dynamic compositions of cylinders, prisms and slabs, cantilevers, glazed stair towers and exposed frames expressing function and movement.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Grey render and raw concrete, black steel, cream walls, with a restrained red accent on one element; stark mid-to-high contrast.
  lighting_and_shadow: Hard daylight carving each volume, glazed cylinders glowing at night, diagonal shadow cast by cantilevers.
  texture_and_material: Rendered brick and concrete frames, steel lattice masts, large industrial glazing in glazed stair cylinders, ribbon windows, open roof terraces.
  camera_and_composition: Keep the requested view; steep diagonal angles, volumes set against a big sky, one cantilever or mast cutting across the frame.
  atmosphere_and_mood: Urgent, utopian and machine-like, architecture as a social engine.
  rendering_and_quality: Stark photograph with clear geometric volumes, no flags, slogans, propaganda posters or readable text.
  key_features: colliding cylinders and prisms; glazed stair cylinder; dramatic cantilevers; steel lattice mast; single red accent
  creative_brief: "Constructivist architecture of the 1920s avant-garde: dynamic compositions of cylinders, prisms and slabs, cantilevers, glazed stair towers and exposed frames expressing function and movement. Carry it through colliding cylinders and prisms, glazed stair cylinder, dramatic cantilevers, steel lattice mast, single red accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
