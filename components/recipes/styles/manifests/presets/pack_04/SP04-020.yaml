visualDna:
  aesthetic: 'Flat educational vector illustration: subjects built from rounded geometric primitives with no outlines, arranged to explain how something works.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Vibrant flat colors on a deep navy or teal field, each group of things coded by one hue.
  lighting_and_shadow: Flat shapes with one lighter and one darker tone per object; soft long flat shadows at a fixed angle.
  texture_and_material: Pure vector cleanliness, rounded corners, tiny highlight dots, no grain and no brush texture.
  camera_and_composition: Diagram-like cutaway or cross-section views, clear hierarchy, big central subject with small orbiting details.
  atmosphere_and_mood: Optimistic and curious, a complicated idea made friendly.
  rendering_and_quality: Crisp screen vector with consistent corner radii; no icons, labels, UI panels or readable text.
  key_features: rounded geometric primitives; no outlines; color-coded flat hues on navy; cutaway diagram view; long flat shadows
  creative_brief: "Flat educational vector illustration: subjects built from rounded geometric primitives with no outlines, arranged to explain how something works. Carry it through rounded geometric primitives, no outlines, color-coded flat hues on navy, cutaway diagram view, long flat shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
