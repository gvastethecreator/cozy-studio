visualDna:
  aesthetic: 'Candlelit environmental-horror illustration: heavy European masonry, vulnerable human scale and a small island of failing warmth surrounded by unreadable cold depth.'
  subject_treatment: >-
    Keep requested identity and action. Convey vulnerability through hesitant weight, restricted
    space and partial occlusion; unspecified objects have practical old construction, not heroic
    ornament.
  color_and_tone: >-
    Warm tallow ochre and worn wood umber against desaturated blue-green darkness, with limited
    sickly reddish organic accents.
  lighting_and_shadow: >-
    A short-range lamp or candle default produces abrupt falloff, deep occlusion and a distant cold
    opening. Darkness leaves the focal action readable but conceals the next space.
  texture_and_material: >-
    Damp block stone, softened plaster, scratched wood and cloudy glass; occasional fleshy intrusion
    appears structurally rooted when the subject permits it.
  camera_and_composition: >-
    Doorways, furniture and close walls cut off peripheral vision; use an off-center focal action
    with a dark unconfirmed opening. Preserve explicit camera instructions.
  atmosphere_and_mood: >-
    Helpless anticipation and uncertain perception; safety occupies only a small part of the
    composition, without turning every scene into a monster reveal.
  rendering_and_quality: >-
    Moody painted environmental study with soft transitions and selective tactile edges; avoid
    glossy blockbuster horror, evenly lit dungeon art or an ornamental vignette.
avoidRules:
