visualDna:
  aesthetic: 'Club strobe stutter: a dark space lit only by rapid strobe flashes, so a long exposure catches the subject in several frozen positions at once.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Cold white flashes on black, occasional colored gel tint, crushed ambient.
  lighting_and_shadow: Repeated hard bursts from one side; everything between flashes stays black.
  texture_and_material: Stacked translucent copies of moving limbs and hair, crisp in each flash.
  camera_and_composition: Keep the requested framing; motion arcs across the frame.
  atmosphere_and_mood: Frenetic and disorienting, time chopped into flashes.
  rendering_and_quality: Multiple frozen positions in one frame; the single strobe freeze lives in pack_01.
  key_features: several frozen positions; strobe bursts on black; stacked limbs; motion arcs; cold flashes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Club Strobe Stutter as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
