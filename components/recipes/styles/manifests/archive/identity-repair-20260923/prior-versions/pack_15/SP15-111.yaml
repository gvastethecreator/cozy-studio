visualDna:
  aesthetic: >-
    Intersect crisp occult geometry with angular arcs of luminous current; balance precise marks against
    asymmetric dark masses.
  subject_treatment: >-
    Carry the requested subject and action through sharp contour accents and controlled geometric
    overlays, without replacing them with ritual props.
  color_and_tone: >-
    Set a concentrated electric hue and a small warm metallic accent against deep, legible shadows;
    retain requested colors where specified.
  lighting_and_shadow: Use compact luminous rims and hard shadow planes, keeping glow contained around the visual focus.
  texture_and_material: >-
    Contrast flat matte fields with sparse etched lines and selective gloss; keep marks clean and
    purposeful.
  camera_and_composition: >-
    Preserve the requested crop; use intersecting arcs and geometric panels to direct attention without
    imposing a card layout.
  atmosphere_and_mood: Build charged, ceremonial tension through angular rhythm, contrast, and contained light.
  rendering_and_quality: Keep the geometry crisp, glow restrained, and fine detail subordinate to large readable shapes.
avoidRules:
  - literal tarot-card framing
  - random sigils unrelated to the requested subject
  - glow that erases contour clarity
assets:
