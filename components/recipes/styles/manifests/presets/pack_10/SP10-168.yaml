visualDna:
  aesthetic: "Projection mapping: animated patterns projected precisely onto the subject's surfaces."
  subject_treatment: "Emissive modifier: keep the prompt's subject and setting, and add this light to the subject's contours or surfaces: projected light patterns map precisely onto the subject's surfaces."
  color_and_tone: Vivid projected patterns, glowing against a darker surrounding so the light reads.
  lighting_and_shadow: The emissive element is the key light source, casting colored light on nearby surfaces.
  texture_and_material: Projected light following surfaces, with a physically plausible light source.
  camera_and_composition: Keep the prompt framing; the glowing lines or surfaces follow the subject so its shape reads at card size.
  atmosphere_and_mood: Spectacular, magical, nocturnal and vivid, coming from the light.
  rendering_and_quality: Clean glow with controlled bloom, no blown-out haze over the whole frame.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Projection Mapping Glow as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
