visualDna:
  aesthetic: 'Tech-noir comic: angular ink with heavy black shadow architecture, lit only by cyan and magenta duotone neon and reflected on glossy black planes.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Black-dominant image, cyan and magenta as the only colors, indigo in the midtones, sparse white highlights.
  lighting_and_shadow: Chiaroscuro from colored practical light, hard silhouette separation and thin glowing edge accents.
  texture_and_material: Glossy reflective black surfaces, chrome edge glints, haze and fine particulate caught in light.
  camera_and_composition: Compressed long-lens perspective, tilted angles, large black shapes framing a small lit subject.
  atmosphere_and_mood: Ominous and electric, a future that has already gone wrong.
  rendering_and_quality: Knife-edged ink contours with flat duotone color and controlled glow; no daylight palette.
  key_features: heavy black shadow architecture; cyan-magenta duotone; glossy black reflections; knife-edged ink; tilted long-lens framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tech Noir Comic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - daylight palette
  - warm sunlight
  - daylight
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic superhero costume
  - random speech text
  - fake lettering
  - photo-real costume render
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
