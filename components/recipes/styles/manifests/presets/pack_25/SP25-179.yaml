visualDna:
  aesthetic: 'Image-Copy Lockup Study: three layouts of the same image and exact copy compared side by side, only the relationship between them changing.'
  subject_treatment: Compare three lockups of the prompt's image and exact copy, title above, beside and in the open space, with image and words unchanged.
  color_and_tone: The same color roles and comparable contrast in each lockup.
  lighting_and_shadow: Constant image light across the three, with flat, sharp typography.
  texture_and_material: Locked artwork and consistent type, only the composition varying.
  camera_and_composition: Three lockups with different anchors, clear margins and equal hierarchy.
  atmosphere_and_mood: A controlled editorial exploration that stays calm, careful and comparative.
  rendering_and_quality: Every version keeps all words, punctuation and brand elements.
  creative_brief: "Image-Copy Lockup Study: three layouts of the same image and exact copy compared side by side, only the relationship between them changing. Carry it through three lockups, same image and copy, different anchors, equal hierarchy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three lockups; same image and copy; different anchors; equal hierarchy
avoidRules:
  - shortened copy
  - changed image
  - difference based only on size
  - invented product claims, statistics or awards
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
