  camera_and_composition: >-
    Compose with Flowing, pour-path meander, chocolate-cascade, drip-icicle descent, fold-and-ripple
    plus plating geometry, negative space, ingredient rhythm, commercial clarity, and edible detail
    scale as reusable framing grammar, allowing cards, portraits, objects, scenes, and abstract
