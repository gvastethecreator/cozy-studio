    contour pressure, and symbolic edge control, oracle shaping silhouette rhythm, contour pressure,
    and symbolic edge control plus refraction shaping silhouette rhythm, contour pressure, and
    symbolic edge control; silvered glass, tarnish, and broken reflection, ash, smoke, polished bowl
    surfaces, and old paper plus mirror glass, lens scratches, and fractured shine; refraction
    glints and mirrored edge ghosts, oracular glow, smoke-veiled highlights, and hidden source
    illumination plus split highlights and prismatic ghost edges; classified archive grids and
