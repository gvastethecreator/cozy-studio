visualDna:
  aesthetic: 'Strobe freeze: an extremely short burst of light that freezes fast motion — splashes, debris, hair, fabric — in crisp suspended detail.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Cool white burst, crisp neutral color, dark background.
  lighting_and_shadow: One or two hard strobes from the side, sharp shadows, no motion blur.
  texture_and_material: Droplets, shards, dust and fibers frozen mid-air with individual detail.
  camera_and_composition: Keep requested framing; show an action at its peak with debris around it.
  atmosphere_and_mood: Kinetic and explosive, violent motion held perfectly still for one instant.
  rendering_and_quality: Ultra-sharp frozen droplets and debris against a clean dark background, with no motion blur.
  key_features: motion frozen mid-air; hard strobe; crisp droplets and debris; dark background; peak action
  creative_brief: "Strobe freeze: an extremely short burst of light that freezes fast motion — splashes, debris, hair, fabric — in crisp suspended detail. Carry it through motion frozen mid-air, hard strobe, crisp droplets and debris, dark background, peak action. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
