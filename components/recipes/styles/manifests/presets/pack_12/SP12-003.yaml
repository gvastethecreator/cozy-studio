visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Homeworld: Deserts of Kharak gameplay
    screenshots: desert RTS gameplay capture with colossal land carriers, small tracked units,
    sensor arcs, formation paths, and top-down tactical terrain. Apply this after prompt X; prompt X
    supplies the subject, action, setting, and intensity while this preset supplies capture
    language, camera grammar, material behavior, playable readability, and finish. Do not recreate
    an exact official level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Homeworld: Deserts of
    Kharak-adjacent game screenshot subject: keep clear role silhouette, player/enemy/object
    function, scale relationship, hitbox-like readability, and interaction affordances without
    copying source characters or named IP elements.
  color_and_tone: >-
    Use a Homeworld: Deserts of Kharak-informed palette: bleached sand, burnt orange shadows,
    military blue UI, dusty yellow metal, and green unit indicators. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through high desert glare, long carrier shadows, dust haze, engine bloom, and
    radar-like selection glow. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from sand dunes, weathered armor plating, tire tracks, wreckage, antennae, heat
    shimmer, and utilitarian command hardware. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with elevated strategy camera with readable unit groups, attack vectors, resource sites,
    minimap logic, and a clear battlefield objective axis. The frame should read as a plausible
    gameplay capture; include UI/HUD only when it matches the source game's visual logic and
    improves clarity.
  atmosphere_and_mood: >-
    Carry a Homeworld: Deserts of Kharak-derived mood: dry, strategic, convoy-heavy, lonely, and
    military-operational. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: RTS HUD is part of the style:
    selection boxes, health bars, resource counters, ability icons, and minimap can appear if
    aligned to the camera. Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay
    scale, and no fake logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Homeworld: Deserts of Kharak gameplay screenshots; desert RTS gameplay capture with colossal
    land carriers, small tracked units, sensor arcs, formation paths, and top-down tactical terrain;
    bleached sand, burnt orange shadows, military blue UI, dusty yellow metal, and green unit
    indicators; high desert glare, long carrier shadows, dust haze, engine bloom, and radar-like
    selection glow; sand dunes, weathered armor plating, tire tracks, wreckage, antennae, heat
    shimmer, and utilitarian command hardware; elevated strategy camera with readable unit groups,
    attack vectors, resource sites, minimap logic, and a clear battlefield objective axis; dry,
    strategic, convoy-heavy, lonely, and military-operational; HUD guidance: RTS HUD is part of the
    style: selection boxes, health bars, resource counters, ability icons, and minimap can appear if
    aligned to the camera
  creative_brief: >-
    Use Kharak Desert Carrier RTS as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Homeworld: Deserts of Kharak: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
