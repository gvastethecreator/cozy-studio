visualDna:
  aesthetic: 'Motion graphics 3D: clean procedural shapes arranged in rhythmic, keyframe-like compositions with bright gradients and satisfying motion implied.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Bright brand-like gradients, candy colors and clean whites throughout.
  lighting_and_shadow: Soft area lights with crisp glossy highlights, colored bounce.
  texture_and_material: Satin plastics, frosted glass, matte clay, perfectly clean.
  camera_and_composition: Keep the requested view; elements orbiting, stacking or flowing in rhythm.
  atmosphere_and_mood: Upbeat and hypnotic, motion frozen at a satisfying moment.
  rendering_and_quality: Clean motion-design render with no text or logos.
  key_features: procedural shapes in rhythm; bright gradients; satin and frosted materials; orbits and flows; clean composition
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Motion Graphics as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - brand logo
  - franchise likeness
  - readable text
  - readable letters
  - changing the requested camera view
  - static
  - boring
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
