visualDna:
  aesthetic: >-
    Layered colored-pencil illustration with visible directional strokes, broken pigment coverage,
    and selectively burnished passages. The drawn texture stays subordinate to clear form.
  subject_treatment: >-
    Preserve the requested identity, silhouette, expression, action, count, and details. Build
    volume with contour-following pencil layers without simplifying the subject into a stock fantasy icon.
  color_and_tone: >-
    Honor explicit colors. If none are specified, build a compact earth-and-jewel palette with
    visible paper gaps and a controlled value range; do not impose mandatory red or gold.
  lighting_and_shadow: >-
    Carry through the requested direction of light using layered colored strokes and selective
    burnishing. Avoid adding a glow or smoothing the drawing into airbrushed gradients.
  texture_and_material: >-
    Vary pencil pressure and stroke direction by form; keep paper tooth visible in quieter areas.
    Preserve the depicted material instead of making every surface look wax-coated or scratched.
  camera_and_composition: >-
    Respect the requested viewpoint, crop, scale, and placement. Use stroke density to clarify the
    existing hierarchy without adding a border, labels, or decorative corners.
  atmosphere_and_mood: >-
    Let color layering and mark density follow the requested mood. Do not attach medieval lore,
    heraldry, or a storybook scene to the pencil technique.
  rendering_and_quality: >-
    Keep pencil marks legible and directional, burnish only selected planes, and protect small
    identity-defining details. Avoid noisy scribble, uniform grain, and waxy highlights.
avoidRules:
  - unrequested heraldry, runes, or narrative props
  - fixed frame, labels, or decorative corners
  - uniform scribble or all-over grain
  - waxy coating across every material
  - gradients that erase pencil structure
