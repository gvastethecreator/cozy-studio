  color_and_tone: Faded vintage colors, mustard, teal and rust with brass and dusty velvet.
  lighting_and_shadow: Warm afternoon sun through market awnings and tangles of old lamps.
  texture_and_material: Chipped enamel, brass, velvet, old wood, cracked leather and tangled cords.
  camera_and_composition: Crowded stall compositions piled high with objects and haggling people.
