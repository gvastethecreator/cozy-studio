visualDna:
  aesthetic: Near-total black toner flood from an overdriven copier, with the subject surviving only as blown-out white shapes, razor edges, and a few crushed gray transitions.
  subject_treatment: 'Any subject is reduced to its strongest light-catching planes: faces, hands, edges, and silhouettes are carved as white islands in a sea of black, so prompt X stays readable while becoming extreme and ominous.'
  color_and_tone: Pure toner black, paper white, and a thin band of crushed gray; no color.
  lighting_and_shadow: Brutal top or side light implied by white knockouts, with nearly everything else swallowed by black.
  texture_and_material: Dense glossy toner, faint banding streaks, drum-scratch lines, and occasional white dropouts kept deliberate and sparse.
  camera_and_composition: Tight dramatic crop or looming low angle with a single white-read silhouette; black negative space dominates at least two thirds of the image.
  atmosphere_and_mood: Oppressive, loud, violent in contrast, and grimly exhilarating.
  rendering_and_quality: 'Clean high-contrast reproduction of an overexposed copy: the black is solid, not noisy, and white shapes stay sharp and readable at thumbnail size.'
  creative_brief: "Near-total black toner flood from an overdriven copier, with the subject surviving only as blown-out white shapes, razor edges, and a few crushed gray transitions. Carry it through black toner flood, white knockout survivors, crushed grays, copier banding, two-thirds black space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: black toner flood; white knockout survivors; crushed grays; copier banding; two-thirds black space; brutal contrast
