  aesthetic: 'Fujian tulou architecture: a massive circular or square rammed-earth outer wall several storeys high, windowless at the base, enclosing inward-facing timber galleries around an open courtyard.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Warm yellow-brown rammed earth, dark weathered fir galleries, grey fired roof tiles, red paper lanterns only where the prompt allows; earthy and warm.
  lighting_and_shadow: Daylight falling into the courtyard in a bright circle while galleries sit in shade; the outer wall catching low sun with rain-streak shadow.
  texture_and_material: Layered rammed-earth strata with formwork lines, small high slit windows, continuous timber galleries with plank railings on each storey, a wide overhanging grey tile roof ring.
  camera_and_composition: Keep the requested view; from inside show the full ring of galleries stacked in a curve, from outside show the fortress-like wall and its single gate.
  atmosphere_and_mood: Defended, communal and enclosing, a village inside one wall.
  rendering_and_quality: Documentary photograph with readable earth layering and timber structure, no invented ornament or theme-park styling.
