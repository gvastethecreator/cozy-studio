visualDna:
  aesthetic: 'Split lighting: a hard source at 90 degrees dividing the subject exactly in half — one side lit, one side in darkness.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: High contrast, restrained color, the dark half near black.
  lighting_and_shadow: Side key perpendicular to the camera axis, no fill, a clean vertical shadow line down the nose or object center.
  texture_and_material: Texture exaggerated on the lit half by grazing light.
  camera_and_composition: Keep requested framing; face or object frontal enough that the half-and-half division is obvious.
  atmosphere_and_mood: Dual, conflicted, dramatic, and mysterious.
  rendering_and_quality: Crisp division line with detailed highlights and clean blacks.
  key_features: 90-degree side key; half lit half dark; vertical shadow line; no fill; grazing texture
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Split Lighting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
