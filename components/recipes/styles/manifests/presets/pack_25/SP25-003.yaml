visualDna:
  aesthetic: 'Split-Contour Marks: two open outlines complete each other without touching, together forming one recognizable silhouette.'
  subject_treatment: Split the prompt's subject silhouette between two open paths, each insufficient alone and complete only with its partner; set requested text exactly.
  color_and_tone: One ink as the final test, with a second value allowed only while studying the two halves.
  lighting_and_shadow: Depthless graphic surface where the gap between strokes is a real separation.
  texture_and_material: Continuous contours with deliberate terminals and a single clean line per edge.
  camera_and_composition: Breaks placed in different zones so the two paths never face each other directly.
  atmosphere_and_mood: Dialogue and approach without contact, a central pause that keeps the tension alive.
  rendering_and_quality: The eye closes the shape through perceptual continuity, with no added bridges between the paths.
  creative_brief: "Split-Contour Marks: two open outlines complete each other without touching, together forming one recognizable silhouette. Carry it through two open outlines, perceptual closure, alternating breaks, untouched gap. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two open outlines; perceptual closure; alternating breaks; untouched gap
