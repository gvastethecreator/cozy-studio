visualDna:
  aesthetic: '1990s magical space cel: thick rounded ink lines, rainbow airbrushed gradients, holographic sparkle overlays, and bursting star-shaped twinkles.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Bubblegum pink, cyan, lemon yellow and violet against deep indigo space, with gradients running in rainbow bands.
  lighting_and_shadow: Soft glowing gradients with clean cel shadows, and four- and eight-point twinkles on every bright edge.
  texture_and_material: Holographic foil sparkle overlay, smooth airbrush, flat cel paint and faint 1990s cel grain.
  camera_and_composition: Keep the requested view; scatter twinkles and curving rainbow ribbons around the subject.
  atmosphere_and_mood: Buoyant, sincere and wildly optimistic, joy at escape velocity.
  rendering_and_quality: Thick rounded outlines, rainbow gradients, holographic sparkle and crisp twinkles around a bright but readable silhouette.
  key_features: thick rounded ink lines; rainbow airbrush gradients; holographic foil sparkle; eight-point twinkles; indigo space backdrop
  creative_brief: "1990s magical space cel: thick rounded ink lines, rainbow airbrushed gradients, holographic sparkle overlays, and bursting star-shaped twinkles. Carry it through thick rounded ink lines, rainbow airbrush gradients, holographic foil sparkle, eight-point twinkles, indigo space backdrop. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
