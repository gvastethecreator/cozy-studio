visualDna:
  aesthetic: 'Long-exposure seascape: a tripod and dense ND filter stretching the exposure to thirty seconds or more, turning moving sea into mist and silk around still rocks.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Soft pastel dusk or cool grey-blue, smooth gradients, dark wet rocks.
  lighting_and_shadow: Low light at dawn or dusk; soft sky light, no hard shadows.
  texture_and_material: Water smoothed to mist, clouds streaked, rocks and structures sharp and textured.
  camera_and_composition: Low tripod near the waterline, a strong foreground rock or structure, leading lines into the smooth sea.
  atmosphere_and_mood: Meditative and calm, time made visible as silence.
  rendering_and_quality: Clean long exposure without noise; no frozen splashing waves.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Long-Exposure Seascape as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: silky misted water; streaked clouds; sharp still rocks; low tripod foreground; pastel dusk
