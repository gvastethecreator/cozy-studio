visualDna:
  aesthetic: >-
    Fine cel contours over translucent pastel glazes, with carefully controlled hard-to-soft
    edge transitions.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Soften selected
    outer edges while leaving identity-bearing contours clean.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor blush, pearl gray,
    winter blue, and one modest warm note in transparent overlapping fields.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Diffuse the supplied illumination and
    allow slight edge separation; reflect only from already reflective surfaces.
  texture_and_material: >-
    Apply texture only to materials already present. Layer dilute pigment washes with restrained
    paper tooth; create no droplets, wet materials, or precipitation.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let existing plane
    boundaries read as soft value thresholds; add no doorway, border or frame.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Use softness as surface treatment, not as romance or
    tenderness; preserve the requested mood.
  rendering_and_quality: >-
    Keep primary features and thin contours legible under translucent color; avoid smearing or
    faux lens effects.
  key_features: >-
    Hairline cel contour; transparent pastel glaze; soft value thresholds; precise focal edges.
  creative_brief: 'Use hairline cel contour; transparent pastel glaze; soft value thresholds; precise focal edges. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
