visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine precise outlines with carefully measured internal
    strokes and soft broad forms crossed by exact geometric accents. Let short precise arcs held
    within broad quiet intervals set its rhythm; use pale cyan, soft neutrals, and restrained cool
    shadow for color and smooth matte color with fine line detail and little grain for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine precise outlines with carefully measured
    internal strokes for edge work, soft broad forms crossed by exact geometric accents for form
    simplification, and short precise arcs held within broad quiet intervals only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with pale cyan, soft neutrals, and restrained cool shadow. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: soft value transitions with a few clean bright edges. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth matte color with fine line detail and little grain,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use open spacing around precise focal geometry,
    respecting the existing crop to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey understated authority and reflective calm, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with quiet palette, exact contours, and restrained detail density; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    fine precise outlines with carefully measured internal strokes; soft broad forms crossed by
    exact geometric accents; pale cyan, soft neutrals, and restrained cool shadow; short precise
    arcs held within broad quiet intervals; smooth matte color with fine line detail and little
    grain; open spacing around precise focal geometry, respecting the existing crop.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine precise outlines
    with carefully measured internal strokes, soft broad forms crossed by exact geometric accents,
    and pale cyan, soft neutrals, and restrained cool shadow; use short precise arcs held within
    broad quiet intervals only where movement is already present, and apply smooth matte color
    with fine line detail and little grain as the drawing finish.
