visualDna:
  aesthetic: 'Carbon fiber composite: a woven twill of black fibers under a deep glossy clear coat, the weave shimmering as the angle changes.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Black and charcoal weave with silver-grey anisotropic sheen, deep lacquer reflections.
  lighting_and_shadow: Strip highlights revealing the checker weave, clear coat mirror reflections on top.
  texture_and_material: Two-by-two twill pattern following the curves, depth under the lacquer.
  camera_and_composition: Keep the requested framing; curved surfaces to show the weave bending.
  atmosphere_and_mood: Technical and fast, the feeling of engineered, weightless strength.
  rendering_and_quality: Anisotropic weave with a clear coat; not a flat printed pattern.
  key_features: twill weave pattern; anisotropic shimmer; deep glossy clear coat; strip highlights; weave following curves
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Carbon Fiber as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the surroundings
  - changing the camera
  - converting every object in the scene
