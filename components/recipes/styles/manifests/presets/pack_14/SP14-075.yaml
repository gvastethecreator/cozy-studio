    over disciplined dark values plus intelligence-weighted accent roles over disciplined dark
    values together with frost blue, ash gray, iron black, blood-rust, yew green, glacier white,
    raven dark, and low ember warmth; values stay separated, accents feel intentional, and the dark
    palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
