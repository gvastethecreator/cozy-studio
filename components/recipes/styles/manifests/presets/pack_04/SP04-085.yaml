visualDna:
  aesthetic: 'Color script: a sequence of eight to twelve small, loosely painted frames tracing how color and light change through a story.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a strip of small frames in story order through which the subject travels, and that layout replaces the requested framing.
  color_and_tone: Each frame dominated by one or two flat hues, the palette shifting beat by beat from calm cool to tense warm to climax red to pale aftermath.
  lighting_and_shadow: Light reduced to one key shape per frame, with color temperature doing the storytelling.
  texture_and_material: Flat opaque gouache-like digital shapes with visible brush edges and no surface detail.
  camera_and_composition: Frames of equal size in two or three rows with thin dark gutters, same aspect ratio, story reading left to right.
  atmosphere_and_mood: An emotional arc readable at a single glance.
  rendering_and_quality: Tiny simplified frames, figures reduced to specks and shapes, no linework.
  key_features: eight to twelve small frames; one or two hues per frame; beat-by-beat palette shift; dark gutters; gouache-like flat shapes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mood Color Script Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
