visualDna:
  aesthetic: >-
    Use simple, hand-built modules with visible joins and clear load paths, pairing chunky geometry with
    a few braided or tensioned lines.
  subject_treatment: >-
    Preserve the requested content; show its existing forms through compact modules and practical
    connections without turning it into an engine or energy-cell array.
  color_and_tone: >-
    Set clay, wood, or stone neutrals against one restrained cool blue or copper accent; honor explicitly
    requested colors.
  lighting_and_shadow: >-
    Use broad shade and small warm edge highlights to reveal material changes and the direction of a join
    or tension line.
  texture_and_material: >-
    Keep clay and wood matte, woven marks coarse, and metal accents sparse; use visible transitions
    instead of uniform dust.
  camera_and_composition: >-
    Preserve the requested crop; arrange modules and connecting lines with open intervals so each
    relationship reads clearly.
  atmosphere_and_mood: >-
    Suggest resourceful invention through simple construction, legible connections, and deliberate
    economy.
  rendering_and_quality: Keep the construction logic readable at thumbnail scale, with clean edges and limited surface detail.
avoidRules:
  - a required generator, cell, or cooling apparatus
  - tangled lines that hide how forms connect
  - busy dust texture over every surface
