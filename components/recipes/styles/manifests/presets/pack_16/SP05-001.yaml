  aesthetic: 'Osamu Tezuka and Mushi Production 1960s television animation: rubbery round cartoon figures with huge simple eyes, bulbous noses and limited animation, heroic space-age adventure on flat painted skies.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Tezuka roundness, big shiny eyes, rubber-hose limbs, simple hands and expressive cartoon faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: 'Early color television palette: primary red, sky blue, warm yellow and cream, slightly faded.'
  lighting_and_shadow: Flat even light with simple single-tone cel shadows and occasional speed-line glows.
  texture_and_material: Thick soft ink outlines, flat cel paint, grainy 16mm film softness and slight color bleed.
  camera_and_composition: Simple staged compositions, heroic poses against sky, pans over static painted backgrounds.
  atmosphere_and_mood: Keep the requested mood with optimistic pioneering adventure.
  rendering_and_quality: Charming early television cel frame with limited-animation economy and warmth.
  key_features: Osamu Tezuka roundness; big simple eyes; limited animation; flat painted skies; early TV color
  creative_brief: "Osamu Tezuka and Mushi Production 1960s television animation: rubbery round cartoon figures with huge simple eyes, bulbous noses and limited animation, heroic space-age adventure on flat painted skies. Carry it through Osamu Tezuka roundness, big simple eyes, limited animation, flat painted skies, early TV color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
