visualDna:
  aesthetic: >-
    High-energy anime staging built on upward thrust, exaggerated scale contrast and
    rhythmic shape hierarchy.
  subject_treatment: >-
    Preserve the supplied subject and action. Enlarge or stretch forms only where requested
    movement supports it; keep existing focal hierarchy.
  color_and_tone: >-
    Keep explicit colors. With an open palette, let the strongest accent track the focal
    form without prescribing hues.
  lighting_and_shadow: >-
    Use bold value grouping and selective edge light; keep effects attached to the prompted
    forms.
  texture_and_material: >-
    Use stable ink contours with controlled speed accents; keep material treatment tied to
    the subject.
  camera_and_composition: >-
    Honor the supplied camera, using an ascending axis and scale rhythm only within its
    existing frame.
  atmosphere_and_mood: >-
    Confidence and escalation are optional tonal choices; keep the prompt's actual stakes
    and mood.
  rendering_and_quality: >-
    Maintain strong silhouette readability while allowing controlled exaggeration and soft
    background integration.
  key_features: >-
    Upward thrust; enlarged scale rhythm; strong shape hierarchy; restrained motion accents.
  creative_brief: "Apply upward force and scale contrast where they fit the supplied action. Preserve the subject, framing and requested tone. Use it as a reusable look on any subject."
