visualDna:
  aesthetic: 'Stylized competitive-shooter art direction: chunky readable forms, bright saturated PBR-lite materials and color coding that separates everything at distance.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: Sunny saturated palette against an encroaching violet storm gradient; rarity tints in white, green, blue, purple and gold.
  lighting_and_shadow: Bright sun with soft ambient fill, strong rim light that separates silhouettes from terrain.
  texture_and_material: Simplified hand-painted textures on chunky shapes, soft plastic-like sheen, clean stylized foliage clumps.
  camera_and_composition: Keep the requested view; favor wide readability with the subject isolated against simple terrain.
  atmosphere_and_mood: Energetic and playful, with pressure building at the horizon.
  rendering_and_quality: Clean, bright, low-noise rendering; silhouettes readable at a distance.
  key_features: chunky stylized forms; rarity color tints; violet storm gradient; strong rim light; clean foliage clumps
  creative_brief: "Stylized competitive-shooter art direction: chunky readable forms, bright saturated PBR-lite materials and color coding that separates everything at distance. Carry it through chunky stylized forms, rarity color tints, violet storm gradient, strong rim light, clean foliage clumps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
