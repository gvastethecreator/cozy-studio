visualDna:
  aesthetic: 'Brushed aluminum: satin metal with fine parallel brush lines and soft anisotropic highlights.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of brushed aluminum with fine directional grain and machined edges."
  color_and_tone: Cool silver-grey with soft white highlights, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Strip light producing stretched anisotropic highlights, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Satin aluminum with fine parallel brush lines and chamfered edges.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Precise, modern, cool and engineered, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: brushed satin aluminum; parallel brush lines; anisotropic highlight; machined edges
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Brushed Aluminum as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
