visualDna:
  aesthetic: 'Scanning electron micrograph: a tiny specimen coated and scanned by an electron beam, rendered in greyscale with extreme depth and edge glow.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Pure greyscale, bright rims on edges and ridges, dark hollows, no color.
  lighting_and_shadow: 'Detector-direction shading: edges facing the detector glow, recesses fall dark, a characteristic halo along every ridge.'
  texture_and_material: Microscopic surface structure — pores, hairs, scales, crystals — sharp at enormous magnification.
  camera_and_composition: Specimen centered on a black or dark grey ground, deep depth of field, no lens bokeh.
  atmosphere_and_mood: Alien and precise, familiar things revealed as strange landscapes.
  rendering_and_quality: SEM image quality with fine noise; no color tint unless the prompt asks for false color.
  key_features: greyscale electron image; glowing edge rims; enormous magnification; deep focus; dark ground
