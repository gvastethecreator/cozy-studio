visualDna:
  aesthetic: Dry-brush anime illustration built from repeated parallel strokes of measured length laid like drill marks, interrupted by a single clean black anchor stroke at the focal edge.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Warm faded paper, bleached ochre and softened charcoal; the prompt colors fade as if long exposed to sun.
  lighting_and_shadow: Compressed highlight contrast and a high flat sun feel with short brown shadows and no cast drama.
  texture_and_material: Matte paper tooth and disciplined abrasion; each parallel stroke varies slightly so it never becomes a mechanical fill.
  camera_and_composition: Keep the requested framing and subject count; stroke direction reinforces existing verticals and horizontals without forming ranks.
  atmosphere_and_mood: Severe, rhythmic and sun-dried; discipline as a visual cadence.
  rendering_and_quality: Even-length dry-brush rhythm with one crisp dark anchor and clearly legible forms.
  key_features: measured parallel dry-brush strokes; single black anchor stroke; bleached ochre paper; compressed highlights; rhythmic cadence
  creative_brief: "Dry-brush anime illustration built from repeated parallel strokes of measured length laid like drill marks, interrupted by a single clean black anchor stroke at the focal edge. Carry it through measured parallel dry-brush strokes, single black anchor stroke, bleached ochre paper, compressed highlights, rhythmic cadence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
