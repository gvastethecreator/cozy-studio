visualDna:
  aesthetic: 'Hand-painted eruption anime: frame-by-frame paint-on-glass smears, loose oil strokes and saturated overpaint bursting outward over simple, sturdy cel figures.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Acid pink, yellow-green and cyan against deep indigo; figures in plain muted cel color.
  lighting_and_shadow: Flat intense color with rough unlit edges; the paint itself reads as the light.
  texture_and_material: Rough pencil, dry brush, wet oil smears and thumb-smudged paint.
  camera_and_composition: Keep the requested framing; clear focal zones with turbulent paint gathered around them.
  atmosphere_and_mood: Candid emotional overload breaking through calm, feeling spilling out as raw paint.
  rendering_and_quality: Raw paint crossings and acidic bursts while the figure silhouette stays sturdy and readable.
  key_features: paint-on-glass smears; thumb-smudged oil strokes; acid pink, lime and cyan; deep indigo ground; plain sturdy cel figures
  creative_brief: "Hand-painted eruption anime: frame-by-frame paint-on-glass smears, loose oil strokes and saturated overpaint bursting outward over simple, sturdy cel figures. Carry it through paint-on-glass smears, thumb-smudged oil strokes, acid pink, lime and cyan, deep indigo ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
