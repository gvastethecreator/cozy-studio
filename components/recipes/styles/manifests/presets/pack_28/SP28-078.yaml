  aesthetic: 'Memphis Group object language by Ettore Sottsass: playful postmodern products with clashing laminates, squiggle patterns, bold primary shapes and irreverent stacking.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; rebuild the subject as a playful postmodern object of stacked bold shapes and clashing laminate patterns. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Clashing pink, yellow, teal and black squiggle patterns.
  lighting_and_shadow: Bright flat studio light, lit the way Memphis Group Object lights its scenes.
  texture_and_material: Patterned laminates and lacquer, with the surface finish of Memphis Group Object.
  camera_and_composition: Frontal playful product view, framed the way Memphis Group Object composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with irreverent postmodern fun.
  rendering_and_quality: Clean industrial design studio render with honest materials and precise seams.
  creative_brief: 'Memphis Group object language by Ettore Sottsass: playful postmodern products with clashing laminates, squiggle patterns, bold primary shapes and irreverent stacking. Carry it through Memphis object, laminates, squiggles, stacked shapes. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
