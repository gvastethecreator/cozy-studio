  aesthetic: 'Contraption ink drawing: Edwardian humorous line drawings of absurdly complicated machines built from string, pulleys, planks and kettles, operated by very serious gentlemen.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; involve the subject in a ridiculously elaborate machine of ropes, pulleys and planks.
  color_and_tone: Black ink with soft grey wash or pale tint.
  lighting_and_shadow: Light hatching and soft wash shadows, kept consistent across the whole image.
  texture_and_material: Fine pen line, knotted string, planks and patched fabric.
  camera_and_composition: Wide view showing the entire contraption and its operators.
  atmosphere_and_mood: Keep the requested mood with deadpan absurd ingenuity.
  rendering_and_quality: Clear readable mechanism with careful comic detail, kept consistent across the whole image.
  creative_brief: "Contraption ink drawing: Edwardian humorous line drawings of absurdly complicated machines built from string, pulleys, planks and kettles, operated by very serious gentlemen. Carry it through absurd machine, pulleys and strings, serious operators, fine pen line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
