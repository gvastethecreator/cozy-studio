visualDna:
  aesthetic: >-
    Relief-print drawing builds recognizable forms from solid positive shapes and carved-looking
    reserves, with broad cuts that vary naturally in direction and width.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let cut marks follow existing
    contours and planes without changing the subject's function or adding detail.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use clear color blocks across the colors
    requested instead of limiting the image to one or two inks.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Organize light and shadow with positive shapes
    and open reserves without imposing a high-contrast monochrome scheme.
  texture_and_material: >-
    Use broad, irregular cut marks within the forms. Keep marks tied to the drawing; do not overlay
    wood grain or a uniform print texture on the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add margins, a page, border,
    lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Relief marks affect shape and surface only; they do not
    change the depicted world.
  rendering_and_quality: >-
    Establish large shapes and silhouette first, then place a few broad cuts that clarify form. Keep
    edges distinct and legible at reduced size.
avoidRules:
  - wood-grain texture stamped across the whole image
  - forced monochrome or restricted ink count
  - unrequested page, border, lettering, or period motifs
