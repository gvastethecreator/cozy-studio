visualDna:
  aesthetic: 'Porous Tile Ornament: compact perforated tile modules resting on wide supports, their holes forming a secondary rhythm between pieces.'
  subject_treatment: Build a tiled surface from perforated modules based on the prompt's subject, wide supports at alternate corners and holes that form a rhythm across tiles.
  color_and_tone: Two values for mass and perforation with an optional quiet accent.
  lighting_and_shadow: A flat main view, with optional low relief under one light.
  texture_and_material: Clean edges and legible holes, mineral look only once the fit works.
  camera_and_composition: A module grid with alternating supports and a four-tile meeting test.
  atmosphere_and_mood: Porous, contained order balancing solid surface and breath.
  rendering_and_quality: Clean tiling with open holes and recoverable module limits.
  creative_brief: "Porous Tile Ornament: compact perforated tile modules resting on wide supports, their holes forming a secondary rhythm between pieces. Carry it through perforated modules, alternating supports, hole rhythm, four-tile test. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: perforated modules; alternating supports; hole rhythm; four-tile test
