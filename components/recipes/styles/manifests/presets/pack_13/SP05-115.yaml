  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people as cel-shaded CG figures with crystalline refractive details. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Icy prismatic blues and white, true to the Studio Orange CG palette.
  lighting_and_shadow: Prismatic refractive light, lit the way Studio Orange CG lights its scenes.
  texture_and_material: Faceted translucent CG surfaces, with the surface finish of Studio Orange CG.
  camera_and_composition: Crisp faceted compositions, framed the way Studio Orange CG composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with crystalline icy clarity.
  rendering_and_quality: Crystalline cel-shaded CG frame, in the recognizable hand of Studio Orange CG.
  key_features: Studio Orange crystal; refraction; faceted light
  creative_brief: "Studio Orange cel-shaded CG crystal rendering as in its gemstone work: translucent refractive surfaces, prismatic splits and crisp faceted light. Carry it through Studio Orange crystal, refraction, faceted light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
