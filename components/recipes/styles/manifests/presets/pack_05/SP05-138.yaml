  aesthetic: 'Takeru Hokazono Kagurabachi manga look: severe stillness broken by sudden blade flashes, heavy black fills, sharp clean lines and cool contemporary Tokyo with neon glints.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Hokazono designs, grim quiet faces, dark haori over modern clothes and sharp ready stances. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Heavy sumi black, cold grey and thin neon teal and red edge glints.
  lighting_and_shadow: Mostly dark frames with razor-thin neon rim light and blade flashes.
  texture_and_material: Clean sharp lines, heavy black fills and dry-brush accents.
  camera_and_composition: Long silent panels, then sudden cuts to single strikes.
  atmosphere_and_mood: Keep the requested mood with cold vengeful stillness.
  rendering_and_quality: Severe modern action manga illustration with heavy black design.
  key_features: Hokazono stillness; heavy blacks; neon edges; sudden strikes
  creative_brief: "Takeru Hokazono Kagurabachi manga look: severe stillness broken by sudden blade flashes, heavy black fills, sharp clean lines and cool contemporary Tokyo with neon glints. Carry it through Hokazono stillness, heavy blacks, neon edges, sudden strikes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
