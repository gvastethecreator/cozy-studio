visualDna:
  aesthetic: 'Goseki Kojima gekiga as in Lone Wolf and Cub: bold wet brush ink, vast empty white space, weathered samurai faces and the frozen breath before a single deadly strike.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with gekiga realism, lean hard bodies, weathered faces, simple kimono and hakama, and total stillness before motion. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black sumi brush ink on white paper with grey wash and no other color.
  lighting_and_shadow: Light made by the untouched paper, shadows as heavy wet brush masses and dry-brush edges.
  texture_and_material: Wet and dry brush strokes, splattered ink, grey wash tones and rough paper grain.
  camera_and_composition: Wide empty compositions with tiny opposed figures, then abrupt extreme close-ups of eyes and hands.
  atmosphere_and_mood: Keep the requested mood with deadly suspended stillness.
  rendering_and_quality: Masterful gekiga brush illustration with cinematic silence and restraint.
  key_features: Goseki Kojima brush ink; empty white space; gekiga realism; pre-strike stillness
  creative_brief: "Goseki Kojima gekiga as in Lone Wolf and Cub: bold wet brush ink, vast empty white space, weathered samurai faces and the frozen breath before a single deadly strike. Carry it through Goseki Kojima brush ink, empty white space, gekiga realism, pre-strike stillness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
