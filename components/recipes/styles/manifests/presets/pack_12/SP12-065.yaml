visualDna:
  aesthetic: 'In-game screenshot look informed by Soulcalibur VI gameplay: weapon-fighting game capture with ornate arenas, two-character duel spacing, dramatic camera, and crystal fantasy stage spectacle. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Soulcalibur VI-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Soulcalibur VI-informed palette: royal blue, crystal white, polished gold, crimson cloth,
    black armor, and bright weapon trails. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through arena spotlights, magic hit sparks, rimmed armor, stage glow, and
    cinematic super-move flare. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from polished stone, crystal pillars, ornate weapons, flowing cloth, armor
    plates, and high-detail arena props. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with side-biased 3D fighting camera with two combatants, health bars, ring-out edges,
    and attack-impact clarity. The frame should read as a plausible gameplay capture; include UI/HUD
    only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Soulcalibur VI-derived mood: duelist, flamboyant, heroic, competitive, and theatrical; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: fighting-game HUD is expected:
    health bars, round timer, meter, player names as abstract blocks, and hit sparks. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Soulcalibur VI gameplay screenshots; weapon-fighting game capture with ornate arenas,
    two-character duel spacing, dramatic camera, and crystal fantasy stage spectacle; royal blue,
    crystal white, polished gold, crimson cloth, black armor, and bright weapon trails; arena
    spotlights, magic hit sparks, rimmed armor, stage glow, and cinematic super-move flare; polished
    stone, crystal pillars, ornate weapons, flowing cloth, armor plates, and high-detail arena
    props; side-biased 3D fighting camera with two combatants, health bars, ring-out edges, and
    attack-impact clarity; duelist, flamboyant, heroic, competitive, and theatrical; HUD guidance:
    fighting-game HUD is expected: health bars, round timer, meter, player names as abstract blocks,
    and hit sparks
  creative_brief: "Soulcalibur Crystal Duel Hall: in-game screenshot language informed by Soulcalibur VI, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
