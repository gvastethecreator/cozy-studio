visualDna:
  aesthetic: 'Minimalist flat vector in the corporate-flat manner: rounded shapes, no outlines, figures with oversized limbs and tiny heads in cheerful colors.'
  subject_treatment: Keep the prompt subject, action, setting and framing; apply only this print or drawing technique, without adding slogans, borders, frames or a poster layout.
  color_and_tone: Flat bright palette of coral, periwinkle, mint and mustard on an off-white ground, no gradients.
  lighting_and_shadow: Shadowless; depth only from overlapping flat shapes and one darker tint.
  texture_and_material: Clean digital vector surfaces, no grain, simple geometric props.
  camera_and_composition: Keeps the requested framing, with generous empty space around a simple readable arrangement.
  atmosphere_and_mood: Friendly, approachable and upbeat, calm and uncluttered.
  rendering_and_quality: Smooth vector shapes with consistent curves; no texture, no outlines and no poster border.
  key_features: flat vector shapes; no outlines; oversized limbs and tiny heads; coral periwinkle mint palette; generous empty space
  creative_brief: "Minimalist flat vector in the corporate-flat manner: rounded shapes, no outlines, figures with oversized limbs and tiny heads in cheerful colors. Carry it through flat vector shapes, no outlines, oversized limbs and tiny heads, coral periwinkle mint palette, generous empty space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
