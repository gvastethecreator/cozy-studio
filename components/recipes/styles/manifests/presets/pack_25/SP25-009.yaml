visualDna:
  aesthetic: 'Staggered Aperture Marks: offset openings cut through neighboring masses so the voids create rhythm and direction.'
  subject_treatment: Build the prompt's subject from a few masses with staggered cuts that form a perceptual path, never aligning every opening; set requested text exactly.
  color_and_tone: One-ink contrast, each opening belonging to the background as a true void.
  lighting_and_shadow: Flat graphic rendering, with direction emerging only from the sequence of voids.
  texture_and_material: Smooth solid masses and clean open cuts with crisp vector edges.
  camera_and_composition: Offsets graduated in two or three steps within one unified silhouette.
  atmosphere_and_mood: Pulse and forward movement expressed purely through rhythm, calm and precise.
  rendering_and_quality: Small cuts optically widened before reduction so the rhythm survives at small sizes.
  creative_brief: "Staggered Aperture Marks: offset openings cut through neighboring masses so the voids create rhythm and direction. Carry it through staggered cuts, void rhythm, unified silhouette, implied direction. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: staggered cuts; void rhythm; unified silhouette; implied direction
