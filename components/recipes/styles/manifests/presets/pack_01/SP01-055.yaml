visualDna:
  aesthetic: 'Underwater photography: a wide-angle lens in a dome housing in clear water, with sun rays, caustics and blue-green depth shaping everything.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Cyan and deep blue water, color falling off with distance, warm reds only close to the lens or strobe.
  lighting_and_shadow: Sunbeams from the surface, rippling caustics on subjects and sand, optional strobe fill in the foreground.
  texture_and_material: Suspended particles, bubbles, drifting hair and fabric, coral and weed moving slowly.
  camera_and_composition: Upward or level angles toward the surface, subject weightless, snell's window or sun burst when looking up.
  atmosphere_and_mood: Silent and weightless, slow drifting calm in blue space.
  rendering_and_quality: Real underwater optics with distance haze; no dry studio light.
  key_features: sun rays from the surface; caustic ripples; blue distance falloff; weightless subject; dome wide angle
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Underwater as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
