visualDna:
  aesthetic: 'Chamfered Grid Glyphs: icons built from orthogonal lines and measured chamfers that replace every curve while keeping optical proportion.'
  subject_treatment: Rebuild the prompt's subject or requested actions with straight lines and measured corner chamfers, tuning each diagonal to keep metaphor and weight.
  color_and_tone: One ink with wide voids, the chamfers reading clearly in a single color.
  lighting_and_shadow: Flat technical drawing with crisp geometric edges and even weight.
  texture_and_material: Geometric cut corners, uniform surfaces and clean joins throughout.
  camera_and_composition: One shared grid, with documented optical exceptions on short diagonals.
  atmosphere_and_mood: Technical clarity and firmness, still friendly at small sizes.
  rendering_and_quality: One chamfer angle system, used consistently wherever it carries meaning.
  creative_brief: "Chamfered Grid Glyphs: icons built from orthogonal lines and measured chamfers that replace every curve while keeping optical proportion. Carry it through measured chamfers, orthogonal grid, no curves, technical clarity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
