visualDna:
  aesthetic: >-
    Junji Ito Horror Manga (Obsessive Ink) acts as a transferable illustration router: start from
    Obsessive body-horror manga language (Junji Ito signature tension), Compulsive ink density,
    motif recursion, skin-to-pattern collapse and comic-illustration system built from ink
    hierarchy, panel-era color, contour exaggeration, print artifacts, and sequential-art
    readability, then apply the visual behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Fine high-density linework with relentless detail
    accretion; preserve the requested subject while translating form into panel-ready silhouettes,
    expressive contour weight, stylized anatomy, speed emphasis, or graphic restraint only when the
    preset calls for it, keeping the requested identity, silhouette, pose, object function, or
    setting legible.
  color_and_tone: >-
    Build color with Monochrome black-and-white with suffocating dark field control; treat color as
    comic production language: four-color plates, limited spot color, manga monochrome, digital
    flats, noir contrast, webtoon gradients, or painted page atmosphere, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Diffuse dread lighting driven by contrast pockets and void depth; make
    light read through ink spotting, cel-like value blocks, dramatic rim separation, flat print
    fill, or painted page modeling rather than generic studio illumination, so value structure
    supports the illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Spiral and micro-line textures that invade organic surfaces; surface detail should reveal
    paper tooth, newsprint dots, screen tones, digital brush layers, ink pools, gutter discipline,
    or pixel cells at a scale that supports the drawing, keeping material scale coherent and
    avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Recursive spiral, cavity, and anatomical warping motifs; compose
    with panel logic, silhouette clarity, speech-shape space, page rhythm, close-up drama, or scroll
    pacing without requiring a fixed comic-page scene, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Uncanny, claustrophobic, cosmic-anxious, mood carried by Junji Ito Horror Manga
    (Obsessive Ink) craft, material pressure, and visual restraint; derive mood from era, genre
    pressure, satire, melodrama, horror obsession, pulp energy, or graphic-novel seriousness,
    letting the style alter interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Precision horror draftsmanship with escalating visual discomfort; finish with clear
    ink decisions, readable stylization, controlled artifacting, and no generic superhero costume or
    random comic text replacing the prompt, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    Obsessive body-horror manga language (Junji Ito signature tension); Compulsive ink density,
    motif recursion, skin-to-pattern collapse; Monochrome black-and-white with suffocating dark
    field control; Spiral and micro-line textures that invade organic surfaces; Recursive spiral,
    cavity, and anatomical warping motifs
  creative_brief: >-
    Apply Junji Ito Horror Manga (Obsessive Ink) as an illustration preset over prompt X: preserve
    the user's requested subject, then route mark-making, palette, surface, composition, mood, and
    final craft through Obsessive body-horror manga language (Junji Ito signature tension),
    Compulsive ink density, motif recursion, skin-to-pattern collapse, Spiral and micro-line
    textures that invade organic surfaces without requiring the card image's original subject.
