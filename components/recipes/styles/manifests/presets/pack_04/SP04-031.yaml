visualDna:
  aesthetic: 'Art Deco poster: streamlined geometric forms, radiating sunbursts and speed lines, smooth airbrushed gradients and gold-on-black glamour.'
  subject_treatment: Keep the prompt subject and action; this preset owns the symmetrical Deco poster composition with sunburst and stepped geometry, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Black, deep teal, ivory and metallic-looking gold, gradients banded in smooth airbrush steps.
  lighting_and_shadow: Radial sunburst light behind the subject, stylized gradient bands, crisp rim highlights on curves.
  texture_and_material: Smooth lithographic ink, airbrushed transitions, polished chrome and lacquer suggested graphically.
  camera_and_composition: Strong symmetry, low monumental angle, elongated streamlined silhouettes and stepped ziggurat shapes.
  atmosphere_and_mood: Luxurious, confident and machine-age optimistic, a gilded evening in motion.
  rendering_and_quality: Precise geometric shapes and polished gradients; never loose, organic or distressed.
  key_features: radiating sunburst; streamlined elongation; black teal and gold; airbrushed gradient bands; stepped symmetry
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Art Deco Poster as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
