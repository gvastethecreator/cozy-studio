visualDna:
  aesthetic: 'High-jewelry macro render: precious metal and cut stones filling the frame, with fire, scintillation and polished metal reflections as the whole subject.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the macro jewelry framing on dark velvet or mirror stone; any other subject is rendered as a small piece of fine jewelry in precious metal and cut stones. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Rich yellow or rose gold and cold platinum, gem colors saturated in the table and nearly black at the pavilion edges.
  lighting_and_shadow: Many small point lights create sparkling scintillation and spectral fire, while black cards give the facets deep contrast.
  texture_and_material: Mirror-polished metal, crisp prong settings, pavé micro-stones and faceted brilliant and step cuts with sharp girdle edges.
  camera_and_composition: Macro lens with shallow depth, the hero stone razor sharp while the band dissolves into soft bokeh.
  atmosphere_and_mood: Opulent and intimate, a treasure seen from a jeweler's loupe distance.
  rendering_and_quality: Spectral dispersion in every stone, clean metal without smudges, and a contact reflection on the display surface.
  key_features: macro loupe distance; spectral fire and scintillation; black-card facet contrast; mirror-polished metal; pavé settings
  creative_brief: "High-jewelry macro render: precious metal and cut stones filling the frame, with fire, scintillation and polished metal reflections as the whole subject. Carry it through macro loupe distance, spectral fire and scintillation, black-card facet contrast, mirror-polished metal, pavé settings. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
