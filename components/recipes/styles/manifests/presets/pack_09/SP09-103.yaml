visualDna:
  aesthetic: 'Ice shard burst: sharp ice crystals exploding outward from a point on the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: ice shards burst from a point on the target, frozen mid-flight.'
  color_and_tone: Clear and blue ice with white frost, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Cold backlight on shards, so the effect lights the target and casts believable local light.
  texture_and_material: Sharp ice crystals and frost dust, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Violent, cold, crystalline and sharp, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ice Shard Burst as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ice shard burst; frost dust; contained around the target
