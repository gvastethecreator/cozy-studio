visualDna:
  aesthetic: 'Pose library sheet: the same figure repeated in eight to twelve poses, rendered in neutral grey tone like a clay study.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a library of eight to twelve poses of the same figure on a floor grid under identical light, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Neutral grey figures on a light grey ground, a single mid-grey floor grid, no costume colors.
  lighting_and_shadow: One identical top-left key and soft fill on every pose, with a small contact shadow each.
  texture_and_material: Smooth matte grey surfaces with clear planes; costume simplified to readable folds and silhouettes.
  camera_and_composition: Poses in two or three rows at one scale and one camera height, each on its own floor-grid square.
  atmosphere_and_mood: Practical and neutral, movement catalogued for animators.
  rendering_and_quality: Consistent proportions and scale across poses; no action effects and no background.
  creative_brief: "Pose library sheet: the same figure repeated in eight to twelve poses, rendered in neutral grey tone like a clay study. Carry it through eight to twelve poses, neutral grey clay tone, identical lighting, floor grid squares, one camera height. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: eight to twelve poses; neutral grey clay tone; identical lighting; floor grid squares; one camera height
