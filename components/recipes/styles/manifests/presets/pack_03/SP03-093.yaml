visualDna:
  aesthetic: 'Precious opal: the target made of milky or black opal with flashes of spectral color that shift as the light moves.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Milky white or dark body with patches of fiery red, green, blue and violet play-of-color.
  lighting_and_shadow: Soft glossy highlights; color flashes appearing and vanishing across the form.
  texture_and_material: Polished cabochon surface, harlequin patches, faint internal cloudiness.
  camera_and_composition: Keep the requested framing; moving light to show the flashes.
  atmosphere_and_mood: Dreamlike and precious, a galaxy trapped in stone.
  rendering_and_quality: Diffraction play-of-color inside the stone, never a painted rainbow texture.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Precious Opal Material as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: play-of-color flashes; milky or black opal body; polished cabochon surface; harlequin patches; glossy highlights
