  aesthetic: 'Minimal horror anime of darkness and depth: tiny figures above black water, wells and voids that seem to breathe.'
  subject_treatment: Keep the prompt's subject and setting; surround it with vast darkness or depth so it feels small and exposed.
  color_and_tone: Near-black blues and greens with a pale, weak light on the subject only.
  lighting_and_shadow: One weak light source fading quickly into total darkness, no fill at all.
  texture_and_material: Still black water, damp stone and faint particles drifting in the dark.
  camera_and_composition: Top-down views into depths or wide frames that are mostly black with a small lit subject.
  atmosphere_and_mood: Silent and vertiginous, as if something far below is listening very carefully.
  rendering_and_quality: Low-key prestige anime with subtle gradients and very restrained detail.
  key_features: vast darkness; tiny lit subject; still black water; depth
  creative_brief: "Minimal horror anime of darkness and depth: tiny figures above black water, wells and voids that seem to breathe. Carry it through vast darkness, tiny lit subject, still black water, depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
