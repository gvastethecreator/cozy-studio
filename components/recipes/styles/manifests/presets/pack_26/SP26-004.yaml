visualDna:
  aesthetic: 'Bruce Timm model sheet look: streamlined art deco hero anatomy, broad chests and tiny waists, square jaws, simple black shadow shapes and minimal clean lines.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters with streamlined geometric anatomy, square jaws, simple facial features and bold black shadow shapes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Limited flat palette with solid black shadows, true to the Bruce Timm palette.
  lighting_and_shadow: Noir-inspired flat lighting with black shadow masses, lit the way Bruce Timm lights its scenes.
  texture_and_material: Clean minimal line and flat fills, with the surface finish of Bruce Timm.
  camera_and_composition: Front, side and back turnaround model-sheet layout, framed the way Bruce Timm composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with streamlined heroic noir.
  rendering_and_quality: Clean animation model sheet illustration, in the recognizable hand of Bruce Timm.
  creative_brief: "Bruce Timm model sheet look: streamlined art deco hero anatomy, broad chests and tiny waists, square jaws, simple black shadow shapes and minimal clean lines. Carry it through Bruce Timm streamlined anatomy, black shadows, model sheet, deco. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Bruce Timm streamlined anatomy; black shadows; model sheet; deco
