visualDna:
  aesthetic: 'Vellum overlay layers: drawings on several translucent drafting sheets stacked on top of each other, earlier layers softening behind later ones.'
  subject_treatment: Split the prompt's subject across stacked translucent sheets, keeping it readable while back layers fade into milky haze.
  color_and_tone: Graphite and ink lines with a few color accents, back layers dimmed by milky translucency.
  lighting_and_shadow: Soft diffuse light through the sheets, each layer adding a veil of haze.
  texture_and_material: Frosted translucent sheets, visible sheet edges, tape corners and slight curling.
  camera_and_composition: Stacked sheets slightly offset so their edges and layers are visible.
  atmosphere_and_mood: Thoughtful, layered and dreamy, like design ideas piling up.
  rendering_and_quality: Believable translucent layering with clean lines on each sheet, never a single flat drawing.
  creative_brief: "Vellum overlay layers: drawings on several translucent drafting sheets stacked on top of each other, earlier layers softening behind later ones. Carry it through stacked translucent sheets, hazy back layers, tape corners, offset edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked translucent sheets; hazy back layers; tape corners; offset edges
