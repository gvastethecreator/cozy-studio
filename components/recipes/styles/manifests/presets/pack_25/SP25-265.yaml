visualDna:
  aesthetic: 'Stitch-Direction Lettering: apparent stitch direction follows every stem and curve of the exact word, changing flow at joins and keeping counters open.'
  subject_treatment: Render the requested word as apparent embroidery whose stitch direction follows each stem and curve, counters open and every character exact.
  color_and_tone: One or two thread tones on a background that keeps the counters readable.
  lighting_and_shadow: Soft raking light showing relief without closing thin stems.
  texture_and_material: Visual stitches aligned to each stem with contained edges.
  camera_and_composition: The full word with optical spacing and a safe area around it.
  atmosphere_and_mood: Disciplined tactility, the thread following the letter faithfully.
  rendering_and_quality: Clean lettering with open counters and smooth stitch transitions.
  creative_brief: "Stitch-Direction Lettering: apparent stitch direction follows every stem and curve of the exact word, changing flow at joins and keeping counters open. Carry it through stitch-flow lettering, open counters, raised thread, exact word. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stitch-flow lettering; open counters; raised thread; exact word
