visualDna:
  aesthetic: 'Low-key rim-lit wildlife: an animal emerging from deep shadow, exposed for a thin backlit rim so most of the frame stays black.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Black background, warm or silver rim highlights, a little color in the lit edge.
  lighting_and_shadow: Backlight or strong side light against a dark background; fur, whiskers and breath glowing.
  texture_and_material: Rim-lit hairs, whiskers, breath vapor or dust as bright lines.
  camera_and_composition: Telephoto, animal partly hidden in darkness, eye or profile catching light.
  atmosphere_and_mood: Dramatic and mysterious, a powerful creature half revealed.
  rendering_and_quality: Clean noiseless blacks with the thin rim highlights fully protected from clipping.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Low-Key Rim-Lit Wildlife as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: black background; thin rim light on fur; breath or dust glowing; partial reveal; telephoto
