visualDna:
  aesthetic: 'Lith print: a heavily overexposed darkroom print developed in dilute lith developer, pulled at the last second, giving peppery black shadows and soft, warm highlights.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: 'Warm monochrome: salmon, peach and cream highlights against cold charcoal-black shadows — a natural split tone from one print.'
  lighting_and_shadow: Hard, grainy shadows with sudden edges; highlights soft, low contrast and glowing.
  texture_and_material: Coarse "infectious" pepper grain in the darks, smooth creamy highlights, matte fiber-paper surface.
  camera_and_composition: Keep the requested framing; enlarger-print look with slightly soft, burned-in corners.
  atmosphere_and_mood: Moody and intimate, soft glowing lights against gritty handmade darkness.
  rendering_and_quality: Darkroom paper print look, not a sepia filter; each tone zone behaves differently (pepper shadows, soft highlights).
  creative_brief: "Lith print: a heavily overexposed darkroom print developed in dilute lith developer, pulled at the last second, giving peppery black shadows and soft, warm highlights. Carry it through peppery black shadows, salmon-cream highlights, natural split tone, matte fiber paper, darkroom unpredictability. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: peppery black shadows; salmon-cream highlights; natural split tone; matte fiber paper; darkroom unpredictability
