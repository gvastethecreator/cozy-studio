visualDna:
  aesthetic: 'Unreal Engine 5 real-time render: dynamic global illumination, film-quality micro-detail geometry and volumetric fog running at game frame rates.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Naturalistic filmic tonemapping, warm sun against cool sky fill, gentle bloom.
  lighting_and_shadow: Real-time bounce light filling caves and interiors, virtual shadow maps with crisp contact detail, god rays in fog.
  texture_and_material: Scanned rock and bark with dense micro-geometry, slight temporal anti-aliasing softness on fine detail.
  camera_and_composition: Cinematic game camera, wide vistas or third-person framing with depth.
  atmosphere_and_mood: Grand and immersive, a playable world at cinematic fidelity.
  rendering_and_quality: Real-time next-gen look with subtle TAA softness; no UI or HUD.
  key_features: real-time bounce GI; micro-detail scanned geometry; volumetric fog shafts; filmic tonemap; TAA softness
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Unreal Engine 5 Next-Gen Real-Time Engine as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - 2d illustration
  - hand-drawn
  - photograph without CGI cues
  - franchise likeness
  - studio character likeness
  - celebrity likeness
  - readable text
  - software logo
  - replacing the subject with a renderer demo scene
  - game HUD
  - pre-rendered
  - low poly
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - raw viewport
  - unlit preview
  - wrong render engine
  - cheap preview noise
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
