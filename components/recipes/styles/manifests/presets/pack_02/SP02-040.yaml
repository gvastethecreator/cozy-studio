visualDna:
  aesthetic: 'Construction-paper cutout cartoon: flat pieces of colored paper cut with scissors and moved frame by frame, casting small drop shadows.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Flat construction-paper colors — primary red, blue, green, brown — slightly faded.
  lighting_and_shadow: Flat overhead light with small soft drop shadows under each paper layer.
  texture_and_material: Visible paper fibers, uneven scissor-cut edges and slightly curled corners.
  camera_and_composition: Flat frontal staging, characters in profile or facing forward, simple layered backgrounds.
  atmosphere_and_mood: Crude and cheeky, homemade simplicity with comic timing.
  rendering_and_quality: Tactile paper-cutout finish; original figure designs, not any existing show's characters.
  key_features: flat construction-paper pieces; scissor edges; small drop shadows; frontal staging; paper fibers
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Construction Paper Cutout Cartoon as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
