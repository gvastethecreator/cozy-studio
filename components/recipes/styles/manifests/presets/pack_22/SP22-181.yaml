visualDna:
  aesthetic: >-
    Illustration separates the existing large forms with dark, hierarchical divisions and lets color
    read as luminous within each area, without turning the scene into a window or emblem.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Place divisions along major
    existing forms; do not invent symbols, compartments or architectural objects.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Color may feel luminous inside separated
    regions, but do not impose a new hue scheme or make every area glow.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Translate light across the segmented color areas
    without adding a backlight, halo or new source.
  texture_and_material: >-
    Use clean color fields with slight internal variation; segmentation may evoke transmitted color without
    converting represented surfaces into physical glass or reflective foil.
  camera_and_composition: >-
    Retain the requested viewpoint, framing, crop and element placement. Segment boundaries follow the
    existing forms rather than creating a border or alternate layout.
  atmosphere_and_mood: >-
    Keep the requested setting and emotional tone. A luminous color treatment does not add a religious,
    Gothic or symbolic narrative.
  rendering_and_quality: >-
    Establish the main silhouette and broad regions first, then use separators of varied weight to clarify
    the form; keep each color area legible at reduced size.
avoidRules:
  - unrequested windows, icons, halos or symbolic emblems
  - extra details that alter identity or function
