visualDna:
  aesthetic: 'Yusuke Nomura Blue Lock manga look: sharp dynamic ink, extreme foreshortening of legs and feet toward the reader, predatory glaring eyes and ego metaphors drawn as beasts and chains.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Nomura designs, lean athletic strikers, sharp glaring eyes with glowing irises and taut muscles in extreme perspective. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with ultramarine accents and electric glare in color pages.
  lighting_and_shadow: Hard backlight, glaring eye glints and dramatic spotlight on the decisive moment.
  texture_and_material: Sharp ink lines, speed lines, screentone and metaphor overlays.
  camera_and_composition: Extreme foreshortening with feet and hands thrust at the lens and tilted panels.
  atmosphere_and_mood: Keep the requested mood with predatory ego intensity.
  rendering_and_quality: Aggressive sports manga illustration with extreme perspective and predatory energy.
  key_features: Yusuke Nomura foreshortening; glaring eyes; ego metaphors; ultramarine accents
  creative_brief: "Yusuke Nomura Blue Lock manga look: sharp dynamic ink, extreme foreshortening of legs and feet toward the reader, predatory glaring eyes and ego metaphors drawn as beasts and chains. Carry it through Yusuke Nomura foreshortening, glaring eyes, ego metaphors, ultramarine accents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
