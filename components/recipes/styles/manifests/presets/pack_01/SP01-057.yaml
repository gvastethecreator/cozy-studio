visualDna:
  aesthetic: 'Interior design editorial: a room styled and photographed for a design magazine, balanced window and lamp light, every material chosen and placed.'
  subject_treatment: Keep the prompt subject and setting; present the space as a styled interior with considered furniture, materials and objects, uncluttered.
  color_and_tone: Harmonious palette of two or three materials and one accent color; natural white balance.
  lighting_and_shadow: Daylight from windows balanced with warm practical lamps; soft shadows, no flash look.
  texture_and_material: Wood grain, linen, velvet, stone and brass rendered tactile and clean.
  camera_and_composition: 24–35 mm at chest height, straight verticals, one-point or two-point view, a foreground object for depth.
  atmosphere_and_mood: Welcoming and composed, a room that feels expensive yet lived in.
  rendering_and_quality: Magazine-grade exposure blending; no fisheye stretch or HDR glow.
  key_features: styled editorial room; window plus lamp balance; tactile materials; straight verticals; foreground depth object
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Interior Design as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
