visualDna:
  aesthetic:
    A high-tech, street-adapted language of asymmetric modular design, embedded interfaces, hacked
    circuitry and selective emissive color, with polished synthetic surfaces against worn everyday materials.
  subject_treatment:
    Preserve identity, action and explicit locks. Redesign open clothing, tools and surfaces
    with segmented techwear cuts, modular panels, embedded paths and integrated emitters; augmentation is optional.
  color_and_tone:
    Use dark neutrals with sharp cyan, magenta, violet or acid-green signals and warm counterpoints.
    Respect locked colors; treat neon as placed information, not a wash.
  lighting_and_shadow:
    Honor explicit lighting and time. Where unspecified, allow motivated emissive seams
    and tight bloom on integrated sources with crisp colored reflections; do not force rain, night or signs.
  texture_and_material:
    Contrast coated metal, polymer, glass, rubber, fabric and worn analogue surfaces. Restyle
    open materials as synthetic or hand-modified without turning everything to wet chrome.
  camera_and_composition:
    Preserve view and placement. Separate subject from technology with layered planes
    and directional signals; a skyline, street, server room or screen is not required.
  atmosphere_and_mood:
    Suggest tension, intimacy, speed or mutual aid through advanced technology meeting everyday
    wear. Follow requested mood; dystopia and corporate oppression are optional.
  rendering_and_quality:
    Use crisp graphic contours, hard-edged regions, selective reflections and restrained
    digital bloom. Keep interface marks purposeful; avoid pseudo-text, invented posters, slogans
    or signs unless requested, smeared glow and circuitry wallpaper.
avoidRules:
  - Do not replace the subject with a device, screen or generic hacker.
  - Do not force a city, rain, corporate villain, dystopian plot or body modification.
  - Honor lighting locks; keep integrated emitters local rather than flooding the image with neon.
  - Do not add invented posters, slogans, signs or readable text unless requested.
