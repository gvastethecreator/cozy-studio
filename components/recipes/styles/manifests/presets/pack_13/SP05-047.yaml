visualDna:
  aesthetic: >-
    Airy anime linework uses light tapered strokes, open shapes, and softened focal
    transitions.
  subject_treatment: >-
    Preserve expression, age, proportions, and relationships; do not force blush or romance.
  color_and_tone: >-
    Pale blue, warm cream, graphite anchors, restrained coral; clean highlights.
  lighting_and_shadow: >-
    Broad soft illumination and small glints with enough shadow to read every form.
  texture_and_material: >-
    Smooth surfaces with slight wash-softening at selected edges; no glitter or bloom.
  camera_and_composition: >-
    Respect crop; leave air around forms only where composition allows.
  atmosphere_and_mood: >-
    Tenderness comes from pauses only when it matches the requested mood.
  rendering_and_quality: >-
    Sparse detail, clear contour hierarchy, quiet separation, no airbrushed structure.
  key_features: >-
    Feathered line, pale cool-warm balance, clean focal glints, controlled open spacing
  creative_brief: >-
    Apply a visual treatment centered on feathered line, pale cool-warm balance, clean focal
    glints, controlled open spacing. Preserve the exact subject, action, count, age,
    costume, setting, camera, and mood. Add nothing outside the prompt.
