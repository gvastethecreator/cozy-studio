visualDna:
  aesthetic: 'Cinematic split key: a hard light at exactly 90 degrees to the lens with full negative fill, cutting the subject into a lit half and a black half.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Hard contrast, restrained color, the dark half near black.
  lighting_and_shadow: Perpendicular hard key, black flags on the other side, a crisp line down the center.
  texture_and_material: Grazing light exaggerating texture on the lit half.
  camera_and_composition: Keep the requested framing; subject frontal enough for the division to read.
  atmosphere_and_mood: Divided and menacing, two natures inside one face.
  rendering_and_quality: Clean film blacks and detailed highlights along the split line.
  key_features: 90-degree hard key; full negative fill; center split line; grazing texture; near-black half
  creative_brief: "Cinematic split key: a hard light at exactly 90 degrees to the lens with full negative fill, cutting the subject into a lit half and a black half. Carry it through 90-degree hard key, full negative fill, center split line, grazing texture, near-black half. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
