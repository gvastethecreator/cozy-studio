visualDna:
  aesthetic: 'Paranormal comedy anime: elastic bright contours, doubled reaction lines, and sudden palette flips into acid teal, hot pink and lime, with fluid smear frames melting shapes during fast motion.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Dark ink ground with teal, hot pink and lime bursts; the palette flips only inside the effect zone.
  lighting_and_shadow: Opposed bright accents and sharp shadow cuts, no literal glow source.
  texture_and_material: Clean cel with mottled translucent color regions; smears as streaked, melted shapes.
  camera_and_composition: Keep the requested framing; gather contrasting color rhythms around the focal area and leave room to breathe.
  atmosphere_and_mood: Buoyant surprise and romance-tinged chaos, color flipping with every startled beat.
  rendering_and_quality: Flexible contour, vivid color collision and controlled smear marks.
  key_features: acid teal, hot pink and lime; melting smear frames; doubled reaction lines; elastic contour; palette flips
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Acid Occult Color-Burst Smear as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
