visualDna:
  aesthetic: 'Tundrapunk: nomadic cultures of the endless frozen tundra, with reindeer-drawn sled towns, fur-and-felt tents, bone tools and horizons of flat white.'
  subject_treatment: Keep the prompt's subject and setting; set it on a vast flat tundra with sled caravans, felt tents and heavy fur clothing.
  color_and_tone: Snow white, pale grey sky and low pink sun with deep red and indigo felt accents.
  lighting_and_shadow: Low polar sun casting long blue shadows across snow for most of the day.
  texture_and_material: Thick fur, felted wool, carved bone, sled runners, packed snow and frost.
  camera_and_composition: Wide flat horizons with small caravans crossing, long lines of shadow and breath.
  atmosphere_and_mood: Enduring, quiet and vast, people who move with the herds forever.
  rendering_and_quality: Crisp cold illustration with fine fur texture and long low-sun shadows.
  creative_brief: "Tundrapunk: nomadic cultures of the endless frozen tundra, with reindeer-drawn sled towns, fur-and-felt tents, bone tools and horizons of flat white. Carry it through reindeer sled towns, felt tents, long polar shadows, fur and bone. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: reindeer sled towns; felt tents; long polar shadows; fur and bone
