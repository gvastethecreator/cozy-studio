  aesthetic: 'Ilya Kuvshinov digital portrait look: glossy anime-realist faces, big reflective eyes, soft painted skin, flat graphic backgrounds and cool contemporary fashion.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters as glossy portraits with big reflective eyes, soft skin and contemporary fashion. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Soft pastel skin tones against flat bold backgrounds.
  lighting_and_shadow: Soft glossy highlights on eyes and lips, lit the way Ilya Kuvshinov lights its scenes.
  texture_and_material: Smooth digital paint with glossy highlights, with the surface finish of Ilya Kuvshinov.
  camera_and_composition: Close portrait framing with flat background, framed the way Ilya Kuvshinov composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cool glossy calm.
  rendering_and_quality: Glossy digital portrait illustration, in the recognizable hand of Ilya Kuvshinov.
  creative_brief: "Ilya Kuvshinov digital portrait look: glossy anime-realist faces, big reflective eyes, soft painted skin, flat graphic backgrounds and cool contemporary fashion. Carry it through Kuvshinov glossy eyes, soft skin, flat backgrounds. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
