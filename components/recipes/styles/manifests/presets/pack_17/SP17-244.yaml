  color_and_tone: Clean black ink with occasional flat tone, true to the Jim Holloway palette.
  lighting_and_shadow: Clear flat illustration light, lit the way Jim Holloway lights its scenes.
  texture_and_material: Black ink on cheap paper with photocopy grain and slight bleed.
  camera_and_composition: Clear storytelling vignette, framed the way Jim Holloway composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with lighthearted adventuring humor.
  rendering_and_quality: Lively humorous tabletop ink illustration, in the recognizable hand of Jim Holloway.
