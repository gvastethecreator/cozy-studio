visualDna:
  aesthetic: >-
    Use flow-driven mark making: long sweeping contours, filament-thin tapers, and connected
    color paths across existing shapes.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Let contour
    flow follow its existing edges without bending anatomy or adding airborne marks.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor fresh greens, cyan,
    and restrained coral against clear neutrals; explicit prompt colors remain authoritative.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep daylight and shadow tied to supplied
    sources; use clean highlights, not dust, gusts, or added glow.
  texture_and_material: >-
    Apply texture only to materials already present. Vary stroke length and wash density on
    materials already present; introduce no foliage, fabric, or surface detail.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let existing edges carry
    continuous curved rhythms and parallel value bands without making new forms.
  atmosphere_and_mood: >-
    Preserve the requested mood; flow is contour behavior, not a weather or ecological event.
  rendering_and_quality: >-
    Keep line direction coherent across forms and keep detail subordinate to the main
    silhouettes.
  key_features: >-
    Sweeping contour; filament taper; linked color paths; clear naturalistic values.
  creative_brief: "Use sweeping contour; filament taper; linked color paths; clear naturalistic values. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
