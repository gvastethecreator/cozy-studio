visualDna:
  aesthetic: 'Letterpress: ink pressed deeply into soft cotton paper, leaving crisp debossed impressions.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is letterpress-printed in one or two inks with a deep bite into cotton paper."
  color_and_tone: One or two inks on cream cotton paper, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Deep deboss, ink squeeze and paper fibers, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Crafted, tactile, warm and classic, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  key_features: deep letterpress bite; cotton paper; physical print process
  creative_brief: "Letterpress: ink pressed deeply into soft cotton paper, leaving crisp debossed impressions. Carry it through deep letterpress bite, cotton paper, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
