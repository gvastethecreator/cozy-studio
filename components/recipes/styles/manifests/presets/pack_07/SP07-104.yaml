visualDna:
  aesthetic: 'Chahar bagh: the Persian fourfold garden, walled and divided into four quarters by raised walkways and narrow stone water channels that meet at a central pool or pavilion.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Pale stone and brick, sky reflected in turquoise-tiled channels, deep cypress green, fruit-tree blossom and roses, dusty ochre walls; bright and clear.
  lighting_and_shadow: Strong dry sunlight with deep shade under plane trees and in the pavilion iwan, glittering light on moving water.
  texture_and_material: Cut-stone channels and carved chadar water chutes, fountain jets, tiled pool basins, raised brick walkways, sunken planting beds of fruit trees and roses, cypress rows.
  camera_and_composition: Keep the requested view; strict axial view along a channel to the pavilion, or overhead showing the four quarters.
  atmosphere_and_mood: Cool, ordered and paradisal, water as the gift of the desert.
  rendering_and_quality: Clear photograph with exact axial symmetry and sparkling water, no invented calligraphy or readable inscriptions.
