visualDna:
  aesthetic: 'Early-1980s real-robot TV cel: thick uniform ink line, flat military paint colors, one hard black shadow fill, and dirt dabbed onto the cel with a sponge.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Dark olive, iron gray, earth brown and oxidized orange at low saturation, with every shadow filled solid near-black.
  lighting_and_shadow: Single hard overhead key; shadows are solid black shapes with no midtone, plus one thin pale highlight line on top edges.
  texture_and_material: Sponge-dabbed mud and rust speckle over flat cel color, scratched paint chips, and grainy 16 mm film transfer.
  camera_and_composition: Keep the requested view; crop tight and compact so the subject fills the frame with squat, heavy mass.
  atmosphere_and_mood: Grim, practical and stubborn, machines as disposable tools of a long campaign.
  rendering_and_quality: Uniform-weight ink line, flat paint with black shadow fills, sponge grime and soft film grain; no gloss or bloom.
  key_features: uniform thick ink line; solid black shadow fills; sponge-dabbed mud and rust; olive and iron palette; 16 mm film grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Compact Attrition Hardware as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
