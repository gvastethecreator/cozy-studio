visualDna:
  aesthetic: 'Soft geometric color patches sit beneath loose colored-pencil contours and short scribbled accents, balancing structure with hand-drawn variation.'
  subject_treatment: 'Keep the requested silhouette, anatomy, pose, and count; let sketch marks sit on existing edges without changing the design.'
  color_and_tone: 'Use a light paper-like base and a few soft geometric color areas; the requested palette and contrast remain in control.'
  lighting_and_shadow: 'Favor flat, lightly tinted planes with clear contact shadows; follow the requested light without implying sunshine.'
  texture_and_material: 'Show pencil grain, short cross marks, and uneven color boundaries selectively; avoid making every material look like paper.'
  camera_and_composition: 'Hold framing, viewpoint, scale, and count; integrate color patches into existing forms without decorative shapes or sketch panels.'
  atmosphere_and_mood: 'Keep the supplied emotional tone; loose line texture does not require a particular activity or feeling.'
  rendering_and_quality: 'Retain clean silhouettes under rough accents; keep sketch detail intentional and geometry soft but stable.'
  key_features: 'Loose pencil contour; soft geometric underpainting; short scribble marks; paper-like tonal base; stable readable silhouettes.'
  creative_brief: 'Place loose pencil marks over gentle geometric color fields, tying both to forms already present. Preserve subject, action, count, camera, and mood. Use it as a reusable look on any subject.'
