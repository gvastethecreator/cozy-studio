visualDna:
  aesthetic: 'Stencil-colored early woodcut: simple fifteenth-century woodcut lines with color added through stencils in flat patches that slip out of register.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; give the subject simple woodcut lines with stenciled color blocks slightly off the lines.
  color_and_tone: Flat stenciled red, green, yellow and brown over black lines.
  lighting_and_shadow: No shading; flat color blocks carry the design.
  texture_and_material: Rough paper, stencil edges and ink squeeze, kept consistent across the whole image.
  camera_and_composition: Single central figure or scene with a simple frame line.
  atmosphere_and_mood: Keep the requested mood with folk devotion and vigor.
  rendering_and_quality: Crude charming lines with misaligned color patches, kept consistent across the whole image.
  creative_brief: "Stencil-colored early woodcut: simple fifteenth-century woodcut lines with color added through stencils in flat patches that slip out of register. Carry it through stenciled color, slipped register, black woodcut lines, rough paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stenciled color; slipped register; black woodcut lines; rough paper
