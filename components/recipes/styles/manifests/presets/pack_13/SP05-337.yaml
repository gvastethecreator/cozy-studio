visualDna:
  aesthetic: >-
    Combine precise drafting contours with radial arcs, loose construction marks and a sparse glow;
    derive all technical or arcane geometry from prompt forms.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use restrained dark/light
    contrast and a few luminous accents; keep prompt colors and avoid blanket neon.
  lighting_and_shadow: >-
    Place a narrow glow on existing edges or focal intersections; respect source, direction and
    exposure.
  texture_and_material: >-
    Mix crisp construction lines with lightly sketched guides; do not turn effects into literal
    glyphs or interface.
  camera_and_composition: >-
    Let arcs and guides follow the existing structure and perspective; keep framing and subject
    scale unchanged.
  atmosphere_and_mood: >-
    Wonder comes from the meeting of precise drawing and loose energy; do not invent magic,
    machinery or action.
  rendering_and_quality: >-
    Transfer the mark language to any subject without adding runes, diagrams, devices or a fantasy
    scenario. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Drafting contours; radial arcs; loose construction marks; sparse edge glow; clean perspective.
  creative_brief: 'Apply this visual treatment to the requested content: Drafting contours; radial arcs; loose construction marks; sparse edge glow; clean perspective. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - construction lines obscuring source contours
  - glow obscuring precise geometry
  - unrequested glyph-like marks
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-337.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
