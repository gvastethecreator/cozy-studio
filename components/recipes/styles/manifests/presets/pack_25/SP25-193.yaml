visualDna:
  aesthetic: 'Angular Loop Script: a connected handwritten gesture where soft curves are replaced by tense angular turns and clear joins.'
  subject_treatment: Write the requested words as a connected script whose curves turn into tense angles, keeping upper and lower case and every letter exact.
  color_and_tone: One ink with related stroke weight across the whole word.
  lighting_and_shadow: Flat lettering where gesture shows through direction and drawn pressure.
  texture_and_material: Clean contours with contained modulation and crisp terminals.
  camera_and_composition: Fluid word rhythm with pauses between joins and a clear baseline.
  atmosphere_and_mood: Agility and written tension, quick, sharp and confident on the page.
  rendering_and_quality: Crisp script where every angular loop stays open and readable.
  creative_brief: "Angular Loop Script: a connected handwritten gesture where soft curves are replaced by tense angular turns and clear joins. Carry it through angular loops, connected gesture, tense turns, clear baseline. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: angular loops; connected gesture; tense turns; clear baseline
