visualDna:
  aesthetic: 'Multi-gravity cluster: blocks of a place floating together, each face with its own down, so trees, water and furniture obey the gravity of their own surface.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into floating blocks whose faces each have their own gravity direction, and that advertised structural change is the purpose of the preset.
  color_and_tone: Natural palette of the setting with a soft sky surrounding the cluster on all sides.
  lighting_and_shadow: One sun lighting every face consistently, so shadows fall in many directions relative to each local ground.
  texture_and_material: 'Real ground surfaces on every face: turf, flagstones, water sheets pouring between faces.'
  camera_and_composition: Show at least three faces with different downs, so the paradox is readable at a glance.
  atmosphere_and_mood: Playful and unsettling, several worlds sharing one block.
  rendering_and_quality: Photographic realism, not lithograph linework or a staircase loop.
  creative_brief: "Multi-gravity cluster: blocks of a place floating together, each face with its own down, so trees, water and furniture obey the gravity of their own surface. Carry it through faces with their own gravity, trees and water obeying local down, floating block cluster, one consistent sun, three or more readable faces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: faces with their own gravity; trees and water obeying local down; floating block cluster; one consistent sun; three or more readable faces
