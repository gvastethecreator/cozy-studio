visualDna:
  aesthetic: 'River stones: smooth, rounded pebbles fitted together like a mosaic.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is assembled from smooth rounded river stones fitted tightly together.'
  color_and_tone: Grey, ochre, slate and white pebbles, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light, with some stones wet and glossy, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Water-polished stones with rounded edges, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Calm, patient, natural and grounded, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: fitted rounded pebbles; water-polished; wet gloss; mosaic packing
  creative_brief: "River stones: smooth, rounded pebbles fitted together like a mosaic. Carry it through fitted rounded pebbles, water-polished, wet gloss, mosaic packing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
