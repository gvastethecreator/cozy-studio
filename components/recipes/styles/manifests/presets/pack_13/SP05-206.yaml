visualDna:
  aesthetic: 'Fine contour detail concentrates where existing forms touch, while neighboring edges remain soft and economical.'
  subject_treatment: "Keep the user's subjects, relation, gesture, age, and count; render existing contact points without changing their intent."
  color_and_tone: "Use natural midtones and restrained warm highlights balanced by the prompt's other colors; avoid an exclusively pastel cast."
  lighting_and_shadow: 'Give overlapping forms clear contact shadows under the supplied light; keep the edge soft where forms separate.'
  texture_and_material: 'Add small tactile strokes only for materials already specified; do not suggest other materials.'
  camera_and_composition: 'Keep the exact crop, viewpoint, scale, spacing, and count; contact detail works at any distance and must not force a close-up.'
  atmosphere_and_mood: "Follow the requested emotional intensity; delicate detail must not change the scene's emotional reading."
  rendering_and_quality: 'Keep fine local edges crisp while broad forms stay smooth; maintain readable overlaps when they exist.'
  key_features: 'Fine contact-point contours; precise overlap shadows; smooth broad forms; restrained warm accents; material-specific tactile marks.'
  creative_brief: "Focus line detail at contact points already present in the image, keeping all relations user-defined. Preserve subject, action, count, camera, and mood. Use it as a reusable look on any subject."
