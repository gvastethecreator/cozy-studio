  aesthetic: 'Go Nagai super robot design language: towering heroic robots with bold primary colors, huge chests with emblems, horned heads, fists as weapons and larger-than-life seventies swagger.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; rebuild the subject as a towering heroic super robot with bold primary colors, a huge chest and horned head. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold primary red, blue, yellow and chrome, true to the Go Nagai palette.
  lighting_and_shadow: Dramatic sunset hero lighting, lit the way Go Nagai lights its scenes.
  texture_and_material: Glossy painted metal with chrome accents, with the surface finish of Go Nagai.
  camera_and_composition: Low heroic angle, framed the way Go Nagai composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with bold heroic bravado.
  rendering_and_quality: Bold super robot presentation with glossy painted metal.
  creative_brief: 'Go Nagai super robot design language: towering heroic robots with bold primary colors, huge chests with emblems, horned heads, fists as weapons and larger-than-life seventies swagger. Carry it through Super robot, primary colors, horned head, heroic. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
