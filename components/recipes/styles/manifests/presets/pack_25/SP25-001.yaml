visualDna:
  aesthetic: 'Chisel Counterforms: a few compact masses opened by one carved void that gives the mark an essential second reading.'
  subject_treatment: Design the prompt's subject as a mark of two solid masses and one continuous void that carries its own meaning; set any requested name exactly.
  color_and_tone: Binary one-ink contrast, with the background flowing into the figure as the second image.
  lighting_and_shadow: Completely flat graphic rendering, where the cut void alone creates depth and reading.
  texture_and_material: Crisp cut edges and uniform solid surfaces, like shapes chiselled from one block.
  camera_and_composition: Heavy mass balanced by an opposite opening, with neck, joins and optical center protected.
  atmosphere_and_mood: Tension between a stable block and an unexpected opening that is discovered a moment later.
  rendering_and_quality: Vector-clean mark that survives filled, inverted and reduced while both readings remain clear.
  creative_brief: "Chisel Counterforms: a few compact masses opened by one carved void that gives the mark an essential second reading. Carry it through carved meaningful void, two-mass figure, one-ink contrast, second reading. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: carved meaningful void; two-mass figure; one-ink contrast; second reading
