visualDna:
  aesthetic: >-
    Sparse taut lines cross broad matte shapes with alternating tight and open intervals. Their direction
    follows existing structure, suggesting tension through graphic rhythm.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Preserve requested hues; use close-value lines in quiet areas and a few high-contrast crossings near
    the focal form.
  lighting_and_shadow: >-
    Maintain requested lighting in the underlying masses; fine lines clarify structure without adding
    luminous strings or cast shadows.
  texture_and_material: >-
    Line crossings remain drawing marks. Do not wrap subjects in ropes, add stitching or replace
    materials with woven fabric.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Keep existing spatial relationships; vary
    line spacing within those shapes rather than imposing a grid over the entire frame.
  atmosphere_and_mood: Restrained pressure and poised balance, adaptable to the requested emotional tone.
  rendering_and_quality: >-
    Use crisp controlled strokes with clean crossings and broad quiet areas. Avoid moire, dense mesh and
    ornamental knots.
avoidRules:
  - global grid or dense mesh
  - added ropes or stitching
  - ornamental knot motifs
