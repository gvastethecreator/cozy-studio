visualDna:
  aesthetic: 'Punk-indie anime: manga panel cuts bursting into the frame, torn overdrawn contours, collage blocks and wonky pop shapes with screen-print halftone and registration slip.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Abrupt complementary color blocks with black and small white breaks.
  lighting_and_shadow: Flat graphic separations with little modelled volume and no soft gradients.
  texture_and_material: Screen-print halftone, paper-cut edges and controlled registration slip.
  camera_and_composition: Keep the requested content; tilted panels of varied size with a clear central reading path.
  atmosphere_and_mood: Irreverent playfulness and quick shifts in emphasis.
  rendering_and_quality: Rough printed edges, deliberate misalignment and legible broad shapes.
  key_features: tilted manga panel cuts; torn overdrawn contour; complementary color blocks; halftone collage; registration slip
  creative_brief: "Punk-indie anime: manga panel cuts bursting into the frame, torn overdrawn contours, collage blocks and wonky pop shapes with screen-print halftone and registration slip. Carry it through tilted manga panel cuts, torn overdrawn contour, complementary color blocks, halftone collage, registration slip. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
