visualDna:
  aesthetic: 'Origami paper couture: garments folded from crisp paper — pleats, facets and cranes — with sharp creases.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments folded from washi or crisp paper with sharp creases, pleated panels and folded motifs.'
  color_and_tone: Ivory washi, kraft brown, or single bold paper colors.
  lighting_and_shadow: Clean side light that shows every crease and facet.
  texture_and_material: Folded paper with sharp creases, faceted planes and fibers.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Delicate, precise, inventive and fragile, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: folded paper facets; sharp creases; pleated panels; washi fibers
  creative_brief: "Origami paper couture: garments folded from crisp paper — pleats, facets and cranes — with sharp creases. Carry it through folded paper facets, sharp creases, pleated panels, washi fibers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
