    density, gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Wrap any subject in translucent interface strata, segmented
    targeting brackets, and modular status geometry; preserve the prompt subject while routing it
    through tile readability, icon clarity, splash rendering, interface material, sprite bounce,
    shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Cyan magenta warning palette, black glass fields, acid green micro accents, and
    clipped neon contrast; use color as gameplay hierarchy: rarity glow, faction contrast, tactical
    coding, seasonal warmth, horror warmth, neon route color, or readable inventory material, with
    deliberate value grouping, accent control, and medium-specific limits rather than generic color
    wash.
  lighting_and_shadow: >-
    Handle light through Screen glow lighting, edge bloom, reflected UI color, and dark underlayers
    for readable overlays; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render CRT scanlines, transparent glassmorphism, pixel glitches, chromatic fringing, and
    scratched display haze; surface detail should support genre grammar through parchment, HUD
    glass, pixel atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade
    material, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Layered HUD composition with safe margins, asymmetric grids, and
    focal brackets instead of fixed screens; compose through gameplay-facing hierarchy, atlas
    consistency, menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen
    energy, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Paranoid, high tech, compressed signal energy without requiring urban fabrics,
    hackers, weapons, or readable text; derive mood from playable stakes, collection desire,
    tactical control, cozy routine, survival dread, arcade speed, or heroic confrontation, letting
    the medium alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Sharp vector like UI edges, no legible copy, controlled bloom, and clean hierarchy
    at small size; finish with game-production clarity, strong silhouettes, controlled UI-like
    detail, and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and
