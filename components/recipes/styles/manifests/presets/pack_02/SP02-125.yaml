visualDna:
  aesthetic: 'Doppler radar graphic: a radar sweep turning precipitation into green, yellow, orange and red cells over a dark map.'
  subject_treatment: Keep the prompt subject as the content of the graphic; this preset owns the on-screen layout, and every band, panel or symbol stays free of readable text.
  color_and_tone: Dark navy map with radar reflectivity colors from green through yellow to red and magenta.
  lighting_and_shadow: Glowing sweep line and cell colors; no physical light.
  texture_and_material: Blocky radar pixels, contour bands, a rotating sweep with a fading trail.
  camera_and_composition: Top-down radar view with the sweep origin at the center or edge.
  atmosphere_and_mood: Urgent and alarming, a storm read as color fields.
  rendering_and_quality: Abstract radar graphic, not a photograph of weather; no readable labels.
  key_features: radar sweep line; green-to-red reflectivity cells; dark map; blocky radar pixels; top-down view
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Weather Radar Doppler Graphic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
