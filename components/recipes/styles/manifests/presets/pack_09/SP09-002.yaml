visualDna:
  aesthetic: 'Polished mahogany: deep red-brown hardwood with a mirror-like French polish and flowing figure.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of polished mahogany with a deep lacquered finish and figure that follows its curves.'
  color_and_tone: Deep red-brown to near-black with amber highlights, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Warm lamp light producing glossy reflections, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: French-polished mahogany with ribbon figure, deep gloss and inlay lines.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Rich, formal, warm and antique, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: polished mahogany gloss; ribbon figure; amber highlights; deep red-brown
  creative_brief: "Polished mahogany: deep red-brown hardwood with a mirror-like French polish and flowing figure. Carry it through polished mahogany gloss, ribbon figure, amber highlights, deep red-brown. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
