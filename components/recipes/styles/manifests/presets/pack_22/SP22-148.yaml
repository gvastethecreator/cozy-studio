visualDna:
  aesthetic: >-
    Graphic anime drawing reduces forms to broad flat color blocks and a few small detail marks,
    using crisp line and open silhouette gaps instead of ornamental realism.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify internal detail while
    retaining the subject's defining shape and features.
  color_and_tone: >-
    Use the requested palette as distinct color areas. Separate forms through color relationships
    and keep shadow shapes minimal; do not impose new hues.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep its value changes broad and restrained
    without creating extra highlights or an unsupported source.
  texture_and_material: >-
    Keep surfaces flat and clean with minimal texture. Preserve requested material cues through shape
    and color rather than simulated photographic detail.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Open silhouette gaps only where they
    keep the existing form readable; add no card frame or lettering.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Graphic simplification changes the rendering, not the
    subject, scene or background.
  rendering_and_quality: >-
    Prioritize large color masses, crisp lines and a few attached detail marks. Preserve identity and
    readability while avoiding realistic ornamental density.
avoidRules:
  - imitation of a specific named character or franchise
  - detailed gradients or photographic surface finish
  - unrequested card frame or lettering
