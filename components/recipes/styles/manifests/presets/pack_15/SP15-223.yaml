visualDna:
  aesthetic: 'Stickerbombpunk: every surface buried under overlapping stickers, with layered cartoon creatures, bold symbols, scuffed edges and die-cut shapes.'
  subject_treatment: Keep the prompt's subject and setting; cover its surfaces in dense overlapping graphic stickers of creatures and symbols, without words.
  color_and_tone: Saturated sticker colors, bright primaries and neon accents with white die-cut borders.
  lighting_and_shadow: Flat even light with slight gloss on vinyl sticker surfaces.
  texture_and_material: Glossy vinyl, peeling corners, scuffed paper stickers and die-cut white edges.
  camera_and_composition: Dense all-over coverage with the underlying form still readable.
  atmosphere_and_mood: Chaotic, playful and loud, a surface that became a community collage.
  rendering_and_quality: Crisp graphic illustration with dense layered sticker detail.
  creative_brief: "Stickerbombpunk: every surface buried under overlapping stickers, with layered cartoon creatures, bold symbols, scuffed edges and die-cut shapes. Carry it through overlapping stickers, die-cut edges, cartoon creatures, peeling corners. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overlapping stickers; die-cut edges; cartoon creatures; peeling corners
