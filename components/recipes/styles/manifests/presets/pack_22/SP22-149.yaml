visualDna:
  aesthetic: >-
    Expressive ink illustration uses pressure shifts and tapered brush marks to describe the existing
    form with forceful, readable value shapes.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let changes in stroke pressure describe
    the given form; do not invent motion or features.
  color_and_tone: >-
    Use bold ink masses and open reserves to organize value. When color is requested, preserve its hues
    and keep it subordinate to the ink structure.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast, translating shadow into decisive brush shapes
    without adding a new light source or highlight.
  texture_and_material: >-
    Show controlled brush grain and tapered edges where the mark calls for them; keep secondary texture
    sparse and preserve the represented material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Stroke energy does not require a new
    angle, pose or arrangement.
  atmosphere_and_mood: >-
    Keep the requested setting and emotional tone. Expressiveness should come from the mark, not an
    added conflict or narrative beat.
  rendering_and_quality: >-
    Establish the silhouette and large black shapes first, then use varied brush weight and sharp tapers
    for selective emphasis; keep the image legible at reduced size.
avoidRules:
  - unrequested changes to pose or action
  - extra details that alter identity or function
