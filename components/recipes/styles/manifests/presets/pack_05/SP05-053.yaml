visualDna:
  aesthetic: 'Model-kit box-art painting: opaque gouache blocks, chipped-paint highlights, oil-stain washes and pin-washed panel lines on heavy load-bearing forms.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Iron gray, dirty olive, muted clay and rust, with pale chipped-metal highlights and dark oil-brown washes.
  lighting_and_shadow: Strong raking daylight from one side, deep shadows under overlaps, and dry-brushed highlights on every exposed edge.
  texture_and_material: Gouache brush marks, sponge chipping, streaked oil and grime washes, and dark pin-wash in seams.
  camera_and_composition: Keep the requested view; weight the mass toward the bottom of the frame with a strong three-quarter presence.
  atmosphere_and_mood: Weighty endurance and strain, the grandeur of heavy machinery doing hard work.
  rendering_and_quality: Painted illustration finish with opaque gouache, dry-brush edges, pin-wash and chipping; no cel line and no 3D gloss.
  key_features: opaque gouache box-art painting; sponge chipping; oil-stain streak washes; dark pin-washed seams; raking side light
  creative_brief: "Model-kit box-art painting: opaque gouache blocks, chipped-paint highlights, oil-stain washes and pin-washed panel lines on heavy load-bearing forms. Carry it through opaque gouache box-art painting, sponge chipping, oil-stain streak washes, dark pin-washed seams, raking side light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
