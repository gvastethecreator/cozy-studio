visualDna:
  aesthetic: >-
    Fine ink contours and short translucent gray washes build softly sculpted volumes, with
    occasional opaque white accents and no generalized black fill.
  subject_treatment: >-
    Clarify the requested forms through small value transitions and selective line. Preserve their
    original material and identity rather than turning every surface into stone.
  color_and_tone: >-
    Use a restrained neutral-gray tonal range with selective white accents. Retain any explicitly
    requested colors as limited accents rather than overriding them.
  lighting_and_shadow: >-
    Describe existing light with short, separated washes and soft value transitions. Keep whites
    local and shadows readable; do not introduce a new light source.
  texture_and_material: >-
    Keep support texture very subtle and distinct from the depicted material. Use wash edges and
    fine ink to model form rather than stamping stone grain onto surfaces.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and spatial relationships. Let tonal modeling
    explain volume within the existing arrangement.
  atmosphere_and_mood: >-
    Keep the requested emotional tone. Sculptural gray modeling does not imply statues, buildings,
    solemnity or a particular historical scene.
  rendering_and_quality: >-
    Retain short wash transitions, fine line and restrained white accents. Avoid broad, uniform
    black masses and preserve clear separation between adjacent forms.
avoidRules:
  - turning depicted materials into stone
  - generalized black fill that erases form
  - unrequested statues or architecture
