visualDna:
  aesthetic: 'Tactile Recessed Controls: recessed sliders, grip edges and small status lights make every action feel physical and clear.'
  subject_treatment: Express the prompt's controls as recessed sliders, grip-edged buttons and small status lights, grouped by action; keep requested labels exact.
  color_and_tone: Neutral dark or light surface with localized accent lights and legible labels.
  lighting_and_shadow: Broad ambient light with moderate cavity shade and small contained LEDs.
  texture_and_material: Sober semi-matte material with low relief and no mandatory chrome.
  camera_and_composition: Controls grouped by action and spaced so every recess reads clearly.
  atmosphere_and_mood: Sober tactility and precision, satisfying to imagine pressing.
  rendering_and_quality: Button, slider and reading stay distinct without photographic realism.
  creative_brief: "Tactile Recessed Controls: recessed sliders, grip edges and small status lights make every action feel physical and clear. Carry it through recessed sliders, grip edges, small status LEDs, grouped controls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
