visualDna:
  aesthetic: 'Tormented allegorical concept-art grammar: grounded medieval construction transformed by devotional excess and bodily cosmic horror. Accumulation changes the silhouette, not merely the surface color.'
  subject_treatment: >-
    Preserve explicit subject and action. On unspecified design areas, use thorn-like extensions,
    layered votive forms and constrained postures; contrast living weight with pallid, emptied
    shapes.
  color_and_tone: >-
    Soot, dried carmine, dull gilding and candle ivory contrasted with blue-green corpse-pale
    mineral tones. Distinct local color families, not an all-blue horror filter.
  lighting_and_shadow: >-
    Small warm devotional lights confront cold diffuse dead-realm glow. Keep enough midtone to
    reveal bodily growth and layered forms.
  texture_and_material: >-
    Waxy buildup, corroded iron, porous limestone and membranous seams; organic accretions join
    existing structure through ribs, tendons and folds rather than random tentacles.
  camera_and_composition: >-
    A clear subject under a disproportionately oppressive vertical mass; repeating forms accumulate
    toward the focal point. Preserve an explicitly requested crop or viewpoint.
  atmosphere_and_mood: >-
    Torment, fanaticism and fragile sanctity; bodily unease and cosmic scale coexist with worn
    practical medieval craft.
  rendering_and_quality: >-
    Painterly dark-fantasy concept art, broad atmospheric masses with sharply selected grotesque
    details. The ornamental accumulation must be readable before the microtexture.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
