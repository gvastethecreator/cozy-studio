  aesthetic: 'Toshiyuki Inoue realist key animation: meticulously observed natural movement, precise perspective, grounded detail and objects passing close to the camera with real depth.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures and animals with precise realistic proportions and natural motion, one passing extremely close to the lens. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Natural stone greys, feather blacks and warm interior light.
  lighting_and_shadow: Naturalistic light with slight motion blur on the near object.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Near-lens pass-by with one element sweeping huge across the foreground.
  atmosphere_and_mood: Keep the requested mood with intimate startling immediacy.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Toshiyuki Inoue realist key animation: meticulously observed natural movement, precise perspective, grounded detail and objects passing close to the camera with real depth. Carry it through Toshiyuki Inoue realism, near-lens pass-by, precise perspective. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
