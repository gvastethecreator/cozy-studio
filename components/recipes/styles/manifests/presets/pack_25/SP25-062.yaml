visualDna:
  aesthetic: 'Instrument Rail Interface: controls sit on continuous rails that link each one directly to the parameter or result it changes.'
  subject_treatment: Build the prompt's screen as parallel rails where every control lines up with its own reading, keeping requested labels and values exact.
  color_and_tone: Color by functional role and neutral values for secondary information.
  lighting_and_shadow: Very restrained depth, with active indicators glowing only where they carry function.
  texture_and_material: Sober rails, defined controls and smooth surfaces with no fake brushed metal.
  camera_and_composition: Input, control and result grouped on one axis, rails separated by space rather than frames.
  atmosphere_and_mood: Operational precision with an instrumental feel, without recreating a whole device.
  rendering_and_quality: Every reading is clearly attributed to its control, with no crossing lines.
  creative_brief: "Instrument Rail Interface: controls sit on continuous rails that link each one directly to the parameter or result it changes. Carry it through continuous rails, aligned control and reading, role colors, restrained depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: continuous rails; aligned control and reading; role colors; restrained depth
