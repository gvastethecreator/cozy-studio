visualDna:
  aesthetic: 'Mezzotint: a copper plate roughened all over with a rocker, then burnished smooth where light should be, giving velvety blacks and soft emerging highlights.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Deep velvety black, warm greys and ivory highlights on cream paper.
  lighting_and_shadow: 'Chiaroscuro from darkness: forms burnished out of black under a single low light source.'
  texture_and_material: Microscopic rocker grain in the darks, soft burnished gradients and no lines anywhere.
  camera_and_composition: Keep the requested view, the subject lit from one side against near-total black.
  atmosphere_and_mood: Hushed, rich and mysterious, a candle in a closed room.
  rendering_and_quality: Continuous velvety tone with no hatching, no stipple and no line work.
  key_features: velvet black rocker ground; burnished highlights; single low light; no lines; ivory on black
  creative_brief: "Mezzotint: a copper plate roughened all over with a rocker, then burnished smooth where light should be, giving velvety blacks and soft emerging highlights. Carry it through velvet black rocker ground, burnished highlights, single low light, no lines, ivory on black. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
