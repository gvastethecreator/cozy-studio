visualDna:
  aesthetic: 'Scratched metal: bright scratches and scuffs cutting through a metal finish.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: bright scratches, scuffs and nicks cut through the metal surface along worn areas. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Metal grey with bright silver scratch lines, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Hard light catching scratch lines, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Scratches, scuffs, nicks and dulled patches, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Used, battle-worn, tough and honest, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: bright scratch lines; scuffs and nicks; dulled wear; surface-level damage; structure intact
  creative_brief: "Scratched metal: bright scratches and scuffs cutting through a metal finish. Carry it through bright scratch lines, scuffs and nicks, dulled wear, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
