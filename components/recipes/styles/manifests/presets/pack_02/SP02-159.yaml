visualDna:
  aesthetic: 'Bubble chamber photograph: a mid-century particle-physics record of tiny bubble tracks in liquid, curving and spiraling in a magnetic field.'
  subject_treatment: Keep the prompt subject as the theme of the event; render the image as bubble-chamber tracks, never adding readable labels or fiducial numbers.
  color_and_tone: Black-and-white or cyan-tinted film, thin dark or bright tracks, grey liquid background.
  lighting_and_shadow: Flash-lit bubbles along each track; even background illumination.
  texture_and_material: Dotted bubble lines, tight spirals, V-shaped decays and fiducial crosses.
  camera_and_composition: Wide film frame with tracks entering from one side and exploding outward.
  atmosphere_and_mood: Elegant and explosive, a hidden collision drawn in lines.
  rendering_and_quality: Archival film look; no numbers or text on the frame.
  creative_brief: "Bubble chamber photograph: a mid-century particle-physics record of tiny bubble tracks in liquid, curving and spiraling in a magnetic field. Carry it through dotted bubble tracks, tight spirals, V-shaped decays, fiducial crosses, archival film frame. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: dotted bubble tracks; tight spirals; V-shaped decays; fiducial crosses; archival film frame
