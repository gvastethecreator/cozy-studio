visualDna:
  aesthetic: 'Raw oak wood: unfinished quarter-sawn oak with open grain, ray flecks and dry, matte fibers.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target becomes carved or built from raw oak, with grain following its form and tool marks at edges.'
  color_and_tone: Pale honey to mid brown with darker grain lines.
  lighting_and_shadow: Warm side light raking across the open grain, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Open-pore oak grain, medullary ray flecks, splits and adze marks.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Solid, honest, warm and old, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: raw open oak grain; ray flecks; tool marks; matte dry fibers
  creative_brief: "Raw oak wood: unfinished quarter-sawn oak with open grain, ray flecks and dry, matte fibers. Carry it through raw open oak grain, ray flecks, tool marks, matte dry fibers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
