visualDna:
  aesthetic: 'Digital speedpaint: a scene blocked in within minutes using big flat brushes and lasso-filled shapes, left rough with only the focal area slightly refined.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Bold, simplified color zones with strong value contrast; three to five main values, one saturated accent.
  lighting_and_shadow: Dramatic single light, shapes of light and shadow blocked as flat masses, glow added with one soft brush pass.
  texture_and_material: Large visible flat strokes, hard lasso edges, a few textured brush dabs, overlapping scrubbed shapes.
  camera_and_composition: Keep the requested framing; silhouettes and value shapes read at thumbnail size, borders left unfinished.
  atmosphere_and_mood: Raw, energetic and cinematic, a fast glimpse of an idea.
  rendering_and_quality: Rough shape-first finish with hard lasso cuts and broad strokes; no fine detail, no polish and no line art.
  key_features: big flat brush and lasso shapes; three to five values; unfinished borders; strong silhouette read; one saturated accent
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Block-In Speedpaint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
