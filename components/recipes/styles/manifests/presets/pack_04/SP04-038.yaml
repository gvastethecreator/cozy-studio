visualDna:
  aesthetic: >-
    National Park Poster (WPA) acts as a transferable illustration router: start from WPA-inspired
    national-park travel poster screenprint language, Serif titling, horizontal strata, landmark
    silhouette simplification and editorial graphic system built from poster hierarchy, symbolic
    compression, typography-as-shape, reproduction limits, and immediate visual argument, then apply
    the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Simplified landscape silhouettes with strong horizon
    stratification; preserve the requested subject while converting it into emblem, poster form,
    editorial metaphor, collage fragment, fashion gesture, or information hierarchy, keeping the
    requested identity, silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Earth-toned separated inks with limited scenic band gradients; use color as
    communication pressure: ink plates, propaganda contrast, deco metallic restraint, psychedelic
    vibration, Bauhaus primaries, vector flatness, or vintage print fade, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Stylized day-phase color banding rather than realistic light physics; make
    light serve graphic hierarchy through flat poster contrast, airbrush gradients, screenprint
    layers, symbolic rays, collage mismatch, or painted cover drama, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Screen mesh print feel with flat-ink layering; surface detail should reveal screenprint
    ink, risograph grain, paper stock, cut-paper edges, vector fields, album-cover wear, or
    editorial print finish, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Simplified mountain masses and compressed depth tiers; compose
    through graphic hierarchy, diagonal force, asymmetrical grid, ornamental framing, cover impact,
    information grouping, or fashion elongation without readable slogan dependency, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Majestic, nostalgic, civic-romantic, mood carried by National Park Poster (WPA)
    craft, material pressure, and visual restraint; derive mood from propaganda urgency, luxe
    modernity, counterculture heat, editorial wit, travel nostalgia, music-poster grit, or
    cover-story seduction, letting the style alter interpretation without demanding a specific
    story, location, or actor.
  rendering_and_quality: >-
    Finish with Bold vintage poster clarity with monumental scenic abstraction; finish as deliberate
    graphic communication with crisp shape logic, controlled print artifacts, and no random poster
    text or literal advertisement clutter, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    WPA-inspired national-park travel poster screenprint language; Serif titling, horizontal strata,
    landmark silhouette simplification; Earth-toned separated inks with limited scenic band
    gradients; Screen mesh print feel with flat-ink layering; Simplified mountain masses and
    compressed depth tiers
  creative_brief: >-
    Apply National Park Poster (WPA) as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through WPA-inspired national-park travel poster screenprint language, Serif titling, horizontal
    strata, landmark silhouette simplification, Screen mesh print feel with flat-ink layering
    without requiring the card image's original subject.
