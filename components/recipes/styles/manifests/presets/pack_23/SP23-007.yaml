visualDna:
  aesthetic: >-
    Relief-print construction with broad ink-like value masses, emphatic contours and open cut
    channels. Edge irregularity follows the carved mark rather than a depicted wood surface.
  subject_treatment: >-
    Simplify the requested forms into connected, readable masses while preserving identity,
    proportions, count, action and functional details.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Build clear tonal groups from existing
    colors; use black ink and white cuts only when those colors fit the request.
  lighting_and_shadow: >-
    Carry the requested light direction through a few deliberate shadow masses and directional cuts.
    Do not introduce another light source.
  texture_and_material: >-
    Use slight irregularity along cut edges and broad negative channels. Do not add physical wood
    grain, parchment texture or damage to the depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial arrangement. Keep cut marks within
    the existing composition without adding a frame or print margin.
  atmosphere_and_mood: >-
    Let bold value grouping create graphic clarity while preserving the requested mood and setting.
    The print process does not imply a historical scene.
  rendering_and_quality: >-
    Keep contours decisive and light channels wide enough to read at reduced size. Use only a few
    directional marks for midtones and keep them attached to the forms they describe.
avoidRules:
  - unrequested wood grain or parchment texture
  - unrequested print border or margin
