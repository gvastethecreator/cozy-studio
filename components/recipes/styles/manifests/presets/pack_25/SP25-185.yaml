visualDna:
  aesthetic: 'Offset Inline Stems: inner channels shifted to one side of each stem create contrast without doubling the whole outline.'
  subject_treatment: Letter the requested words with inner channels offset inside the stems by one rule per stroke direction, keeping every character unmistakable.
  color_and_tone: Main mass and background channel clearly separated in one reference ink.
  lighting_and_shadow: Flat geometry where the channel is drawn rather than lit.
  texture_and_material: Stable outer contours and clean inner channels of consistent width.
  camera_and_composition: Offsets following one rule by stem direction with local optical fixes.
  atmosphere_and_mood: Inner tension and precision, sharp and slightly mechanical.
  rendering_and_quality: Crisp lettering whose channels never close counters or vanish when small.
  creative_brief: "Offset Inline Stems: inner channels shifted to one side of each stem create contrast without doubling the whole outline. Carry it through offset inner channels, one rule, stable outlines, sharp contrast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: offset inner channels; one rule; stable outlines; sharp contrast
