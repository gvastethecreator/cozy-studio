visualDna:
  aesthetic: 'Boxing anime told with graphic impact: freeze frames, halftone backgrounds, radial lines and faces distorted by the punch.'
  subject_treatment: Keep the prompt's subject and action; freeze its moment of impact with graphic backgrounds and radiating lines.
  color_and_tone: Red and black with bold halftone yellow or white backgrounds at impact.
  lighting_and_shadow: Hard ring lights from above and impact flashes turning backgrounds to flat graphic color.
  texture_and_material: Sweat spray, glove leather and rope drawn with thick ink and halftone dots.
  camera_and_composition: Extreme close-ups at the moment of contact, diagonal frames and freeze-frames.
  atmosphere_and_mood: Brutal and graphic, the shock of a single punch stopping time.
  rendering_and_quality: Graphic sports anime with manga halftone and bold impact design.
  key_features: impact freeze; halftone background; radial lines; sweat spray
  creative_brief: "Boxing anime told with graphic impact: freeze frames, halftone backgrounds, radial lines and faces distorted by the punch. Carry it through impact freeze, halftone background, radial lines, sweat spray. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
