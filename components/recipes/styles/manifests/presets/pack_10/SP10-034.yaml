visualDna:
  aesthetic: 'Dreamcore mood: soft, pastel, nostalgic unreality with a faint childhood eeriness.'
  subject_treatment: "Keep the prompt's subject, setting and composition, and shift only the mood, palette and atmosphere: the scene becomes soft-focus, pastel and hazy with a nostalgic unreal feeling."
  color_and_tone: Pastel sky blue, pink and cream, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Soft bloom and haze, supporting the dream logic without adding stock props.
  texture_and_material: Soft focus and faint grain, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Nostalgic, comforting, eerie and unreal, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: pastel soft focus; nostalgic haze; faint eeriness
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dreamcore as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
