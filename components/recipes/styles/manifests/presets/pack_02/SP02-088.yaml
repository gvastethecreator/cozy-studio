visualDna:
  aesthetic: 'Use this drawing language: Crude crayon drawing with jagged symbols, uneven circles, wax-clogged strokes, construction-paper tooth, uneven fill, and deliberate gaps. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply heavy crayon pressure, wax-clogged strokes, repeated coloring passes, and loose edge marks to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use broken crayon colors, orange-purple-green clashes, heavy single-pass color, and mixed-brand contrast as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use expressive color blocking instead of realistic light as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render construction-paper tooth, crayon-wax smears, graphite underdrawing, and torn-edge accents as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Flatten depth and vary symbol scale; let crayon gaps and wobbling strokes organize the supplied shapes without adding a picture subject.
  atmosphere_and_mood: Unfiltered and playful; retain the charm of visible trial-and-error.
  rendering_and_quality: Finish with waxy, uneven strokes, paper tooth, and uncolored gaps rather than technical polish.
  key_features: jagged crayon symbols; uneven circles; wax-clogged strokes; paper tooth; deliberate color gaps
  creative_brief: Render the supplied content with heavy crayon pressure, wax-clogged strokes, repeated coloring passes, and loose edge marks. Use broken crayon colors, orange-purple-green clashes, heavy single-pass color, and mixed-brand contrast as style colors while honoring any explicit color instructions. Apply construction-paper tooth, crayon-wax smears, graphite underdrawing, and torn-edge accents as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
