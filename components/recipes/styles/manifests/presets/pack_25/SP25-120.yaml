visualDna:
  aesthetic: 'Repair-Access Concept: a three-step visual sequence showing the product closed, opened and with one part removed, the same parts and camera throughout.'
  subject_treatment: Show the prompt's product in three steps, closed, cover removed and one part taken out, keeping geometry and part order identical.
  color_and_tone: The serviced part marked by shape or accent, the rest kept stable.
  lighting_and_shadow: Clear even light that keeps every access point in view.
  texture_and_material: Sober materials with fixings shown only where they are defined.
  camera_and_composition: 'Three comparable views in a row: closed, opened and part removed.'
  atmosphere_and_mood: Maintenance clarity and reversibility, calm, patient and reassuring.
  rendering_and_quality: The sequence could run backwards without any part passing through another.
  creative_brief: "Repair-Access Concept: a three-step visual sequence showing the product closed, opened and with one part removed, the same parts and camera throughout. Carry it through three-step sequence, same camera, serviced part accent, reversible. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three-step sequence; same camera; serviced part accent; reversible
