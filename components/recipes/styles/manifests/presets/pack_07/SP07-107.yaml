visualDna:
  aesthetic: 'Chinese scholar garden: a walled garden of framed views, with pierced limestone rockeries, a pond with zigzag bridges, pavilions with upswept eaves and whitewashed walls opened by moon gates and lattice windows.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: White plaster walls, dark grey tile, rosewood-brown timber, grey eroded rock, jade water and bamboo green, with one accent of plum blossom or maple.
  lighting_and_shadow: Soft light casting bamboo and lattice shadows onto white walls like ink painting, reflections in still water.
  texture_and_material: Pitted and perforated lake rock stacked into rockeries, white lime walls with dark tile coping, carved timber lattice windows, stone zigzag bridges, bamboo and banana plants.
  camera_and_composition: Keep the requested view; frame a composed scene through a moon gate or lattice window, layering wall, water and rock in depth.
  atmosphere_and_mood: Contemplative, poetic and intimate, a painted landscape in miniature.
  rendering_and_quality: Soft photograph with legible lattice and eroded rock, no readable calligraphy or souvenir red lanterns.
  creative_brief: "Chinese scholar garden: a walled garden of framed views, with pierced limestone rockeries, a pond with zigzag bridges, pavilions with upswept eaves and whitewashed walls opened by moon gates and lattice windows. Carry it through moon gate framed views, perforated limestone rockery, zigzag stone bridge, upswept pavilion eaves, bamboo shadows on white walls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: moon gate framed views; perforated limestone rockery; zigzag stone bridge; upswept pavilion eaves; bamboo shadows on white walls
