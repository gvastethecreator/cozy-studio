visualDna:
  aesthetic: Velvety mezzotint where everything begins in deep rocked black and forms are burnished up into soft glowing grays and pale highlights, with almost no line.
  subject_treatment: 'Prompt X is pulled out of darkness: faces, hands, edges, and key forms are burnished toward light while the rest stays swallowed in velvet black, making any subject feel nocturnal and grave.'
  color_and_tone: Rich warm black, soft graphite grays, and creamy paper-white highlights.
  lighting_and_shadow: Single low light source; soft tonal gradations emerging from black with gentle edge glow.
  texture_and_material: Fine velvety rocker grain, smooth burnished transitions, and soft plate tone.
  camera_and_composition: Close, intimate crop or looming presence with most of the frame in deep black and a single luminous focus.
  atmosphere_and_mood: Grave, hushed, mysterious, and dark.
  rendering_and_quality: 'Smooth, noiseless mezzotint quality: blacks deep and rich, gradations soft, subject clearly readable.'
  creative_brief: "Velvety mezzotint where everything begins in deep rocked black and forms are burnished up into soft glowing grays and pale highlights, with almost no line. Carry it through rocked velvet black, burnished soft light, no line, single luminous focus, grave nocturnal hush. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rocked velvet black; burnished soft light; no line; single luminous focus; grave nocturnal hush
