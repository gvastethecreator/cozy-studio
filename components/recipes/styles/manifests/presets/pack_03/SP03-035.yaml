visualDna:
  aesthetic: >-
    HDRI Environment acts as a transferable CGI-style router: start from HDRI matched light
    integration, Matched lighting, reflection authenticity and lighting and atmosphere system built
    from transport passes, volumetric density, bounce logic, occlusion, rim separation, and
    miniature scale cues, then apply the 3D/render behavior to prompt X instead of recreating a
    fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Realistic reflections; preserve the prompt subject while
    letting light, fog, occlusion, HDRI, or atmosphere define silhouette and spatial depth, keeping
    the requested identity, silhouette, pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Natural, environment derived; treat color as light temperature, atmospheric
    scattering, indirect bounce, fog color, HDRI influence, and exposure-managed contrast, with
    deliberate value grouping, exposure control, and medium-specific limits rather than generic
    color wash.
  lighting_and_shadow: >-
    Handle light through Image based lighting, spherical harmony; make the named light behavior
    visible through beams, bounced fill, contact shadows, edge halos, volume density, or three-point
    separation, so value structure supports the renderer and does not overwrite the requested
    content.
  texture_and_material: >-
    Render Real world reflection, ambient integration; surface response should reveal air particles,
    shadow contact, glossy reflections, haze thickness, scale cues, and render-pass clarity, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lighting study camera for HDRI Environment: stable three quarter
    framing, visible depth layers, clear shadow planes, and an optional vertical composition
    discipline; compose around the light event through depth layers, contact points, miniature
    isolation, rim edges, or atmospheric shafts without forcing a fixed locale, with scale, spacing,
    edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Grounded, location accurate; derive mood from realism, wonder, product polish,
    sacred glow, softness, technical pass clarity, or spatial immersion, letting the renderer alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Photorealistic integration, composited realism; finish with controlled exposure,
    clean shadow gradients, believable atmosphere, and no random glow or crushed darkness, clean
    denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    HDRI matched light integration; Matched lighting, reflection authenticity; Natural, environment
    derived; Real world reflection, ambient integration; Lighting study camera for HDRI Environment:
    stable three quarter framing, visible depth layers, clear shadow planes, and an optional
    vertical composition discipline
  creative_brief: >-
    Apply HDRI Environment as a CGI/render preset over prompt X: preserve the user's requested
    subject, then route modeling, shader response, lighting, material scale, composition, mood, and
    final render craft through HDRI matched light integration, Matched lighting, reflection
    authenticity, Real world reflection, ambient integration without requiring the card image's
    original subject.
avoidRules:
