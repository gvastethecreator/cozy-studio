visualDna:
  aesthetic: 'Interlocked Counters: the inner spaces of letters or signs are coordinated like shared modules while outer shapes stay individual.'
  subject_treatment: Set the requested word or initials exactly and align their counters so the inner spaces talk to each other, keeping each letter's outer strokes its own.
  color_and_tone: One ink, with the background forming the coordinated pieces between characters.
  lighting_and_shadow: Flat rendering, with every counter a true open space in the drawing.
  texture_and_material: Continuous surfaces and clean inner edges, outer contours tuned for reading.
  camera_and_composition: Counters matched in size and alignment while letter widths stay natural.
  atmosphere_and_mood: Cohesive inner rhythm beneath a deliberately varied outer silhouette.
  rendering_and_quality: Clear borders between characters, with counters checked in an inverted version.
  creative_brief: "Interlocked Counters: the inner spaces of letters or signs are coordinated like shared modules while outer shapes stay individual. Carry it through coordinated counters, varied outer shapes, inner rhythm, exact letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: coordinated counters; varied outer shapes; inner rhythm; exact letters
