  aesthetic: 'Solarsailpunk: voyagers who cross space on vast solar sails, with gossamer mirror sheets, rigging lines, sail-crews in harnesses and ships pushed by sunlight.'
  subject_treatment: Keep the prompt's subject and setting; bring in vast shimmering solar sails, rigging lines and crews working the sails in space.
  color_and_tone: Shimmering gold and silver sails with deep space black and bright sun white.
  lighting_and_shadow: Blazing sunlight reflecting off vast mirror sails, rim-lit crews.
  texture_and_material: Gossamer mirror film, thin rigging, harnesses, carbon spars and starlight.
  camera_and_composition: Huge sails filling the frame with tiny crew figures along the rigging.
  atmosphere_and_mood: Graceful, romantic and adventurous, sailing the sea of light.
  rendering_and_quality: Luminous elegant illustration with reflective sails and fine rigging.
  creative_brief: "Solarsailpunk: voyagers who cross space on vast solar sails, with gossamer mirror sheets, rigging lines, sail-crews in harnesses and ships pushed by sunlight. Carry it through mirror sails, fine rigging, harnessed sail crews, sun-pushed ships. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
