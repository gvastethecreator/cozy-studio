  aesthetic: 'Production I.G Psycho-Pass look (2012): sleek surveillance Tokyo, holographic overlays, cold blue city grids, detective noir and cyberpunk judgment.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Akira Amano-derived designs, sharp faces, dark suits and trench coats in cold detective staging. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Cold cyan, surveillance blue, black and warning red.
  lighting_and_shadow: Cold holographic light and rain-slick neon reflections on dark city streets.
  texture_and_material: Clean digital cel with holographic interface-like overlays without text.
  camera_and_composition: Surveillance-grid framing from above and tense noir detective close-ups at street level.
  atmosphere_and_mood: Keep the requested mood with cold surveillance dread.
  rendering_and_quality: Sleek Production I.G television frame with cold cyberpunk surveillance atmosphere.
  key_features: Psycho-Pass surveillance; holographic grids; cold blue; detective noir
  creative_brief: "Production I.G Psycho-Pass look (2012): sleek surveillance Tokyo, holographic overlays, cold blue city grids, detective noir and cyberpunk judgment. Carry it through Psycho-Pass surveillance, holographic grids, cold blue, detective noir. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
