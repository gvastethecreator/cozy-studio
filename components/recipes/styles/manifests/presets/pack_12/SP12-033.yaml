  color_and_tone: Lawn green, sunny yellow and dusk purple, true to the Plants vs Zombies 2009 palette.
  lighting_and_shadow: Bright cartoon daylight or moonlight, lit the way Plants vs Zombies 2009 lights its levels.
  texture_and_material: Flat cartoon vectors with soft shading, with the in-engine surface finish of Plants vs Zombies 2009.
  camera_and_composition: Side-on lawn grid view, framed the way Plants vs Zombies 2009 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with goofy spooky fun.
  rendering_and_quality: Authentic casual cartoon defense screen, matching real Plants vs Zombies 2009 screenshots.
  key_features: PvZ lawn grid; goofy plants; cartoon defense
  creative_brief: 'PopCap Plants vs. Zombies (2009) look: bright cartoon lawn defense with grid rows, googly-eyed fighting plants, shambling goofy enemies and a suburban house at the left. Carry it through PvZ lawn grid, goofy plants, cartoon defense. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
