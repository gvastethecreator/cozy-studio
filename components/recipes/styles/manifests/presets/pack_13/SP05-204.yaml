visualDna:
  aesthetic: 'Transparent glaze layers and softly echoed values create a fluid finish while every depicted shape stays single and sharply identifiable.'
  subject_treatment: 'Keep the original identity, pose, and count; soften selected edge transitions but never mirror, duplicate, or rearrange forms.'
  color_and_tone: 'Blend nearby cool and warm values through translucent layers; honor explicit colors and avoid imposing a blue or restorative palette.'
  lighting_and_shadow: 'Follow the supplied source with soft tonal echoes; do not duplicate forms or add a light source.'
  texture_and_material: 'Use fine wash granulation and delicate brush edges over existing materials; keep each material distinct rather than applying one surface treatment everywhere.'
  camera_and_composition: 'Preserve crop, viewpoint, scale, and spacing; use soft value echoes inside the frame without shifting the focal point.'
  atmosphere_and_mood: "Maintain the requested emotion; fluid transitions affect surface and value only, not the scene's emotional reading."
  rendering_and_quality: 'Keep one decisive contour on focal forms and softer transitions elsewhere; no full-frame blur or duplicated reflection.'
  key_features: 'Translucent glazing; soft value echoes; fine wash grain; selective decisive contours; single readable silhouettes.'
  creative_brief: 'Layer soft tonal echoes around clear forms using transparency, without duplicating shapes. Keep the prompted subject, action, count, camera, and mood. Use it as a reusable look on any subject.'
