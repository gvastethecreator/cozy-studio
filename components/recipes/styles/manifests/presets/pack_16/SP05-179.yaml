visualDna:
  aesthetic: >-
    A warm 90s cel treatment uses rounded expressive contours, gentle gold edge light and clean
    two-stage shadows. Its portrait signal comes from expressive line accents, not a fixed crop or
    paired scene; rivalry is visual contrast only when that tone is requested.
  subject_treatment: >-
    Preserve requested identity and proportions. Use open contours and small expression accents where
    a face exists; keep single subjects single and do not invent a rival or companion.
  color_and_tone: >-
    When color is open, favor warm neutrals, amber and soft coral against calm blue shadow.
    Preserve requested hues and keep the warmth gentle rather than sepia.
  lighting_and_shadow: >-
    Use soft warm bounce and a thin rim to separate existing forms. Respect the requested light; do
    not impose sunset or interior lighting.
  texture_and_material: >-
    Keep linework clean, fills smooth and highlights material-aware. Avoid rough grain, wet gloss and
    broad atmospheric texture.
  camera_and_composition: >-
    Use friendly visual balance and an approachable focal scale within the supplied composition.
    Preserve crop and camera; do not force a portrait or paired arrangement.
  atmosphere_and_mood: >-
    Let warmth come from contour softness, light and spacing. Keep the requested emotional tone rather
    than adding rivalry, nostalgia or sentiment.
  rendering_and_quality: >-
    Use clear outlines, economical cel shadows and gentle edge transitions. Keep eyes, objects and
    background detail faithful to the source content.
  key_features: >-
    rounded expressive contours; soft gold edge light; warm cel neutrals against calm blue shadow
  creative_brief: 'Restyle the requested content with warm, clean cel drawing and gentle value transitions. Preserve its identity, action, number of subjects and composition; add no rival, companion or sunset. Use it as a reusable look on any subject.'
