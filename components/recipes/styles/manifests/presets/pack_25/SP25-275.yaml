visualDna:
  aesthetic: 'Contour-Wrap Lettering: exact lettering distributed along a real contour of the product, letters and spaces adjusted rather than stretched.'
  subject_treatment: Run the requested words along an authorized curve of the prompt's product, adjusting spacing instead of stretching letters, every character and accent exact.
  color_and_tone: Constant contrast between letters and base along the whole path.
  lighting_and_shadow: Flat lettering art kept separate from the lit mockup.
  texture_and_material: Crisp letter edges and an even finish, the source art unchanged.
  camera_and_composition: A declared start, direction and end, with no key letter hidden.
  atmosphere_and_mood: A wrapping reading with pauses at each change of plane.
  rendering_and_quality: Clean lettering with the whole word intact in flat and applied views.
  creative_brief: "Contour-Wrap Lettering: exact lettering distributed along a real contour of the product, letters and spaces adjusted rather than stretched. Carry it through curve-following word, adjusted spacing, flat art, exact characters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: curve-following word; adjusted spacing; flat art; exact characters
