visualDna:
  aesthetic: >-
    Classic cel-painted illustration with confident color blocks, luminous directional paint, and
    subtle aged-film grain.
  subject_treatment: >-
    Preserve the prompt's subject and action; clarify their silhouettes through decisive contour and
    broad shape design.
  color_and_tone: >-
    Use noble, balanced color blocks with warm highlights and cool shadows, yielding to named
    palette constraints.
  lighting_and_shadow: >-
    Painted directional light gives each plane weight; keep its direction consistent with the
    requested scene.
  texture_and_material: >-
    Combine smooth cel fills with fine analog grain and softly worn color edges.
  camera_and_composition: >-
    Keep the supplied framing; separate foreground and distance with layered color planes, not a
    tapestry layout.
  atmosphere_and_mood: >-
    Cinematic and earnest, yet responsive to the prompt's emotional register.
  rendering_and_quality: >-
    Use crisp contour, broad controlled shading, and restrained film grain for an aged but clean
    finish.
  key_features: >-
    Bold color grouping, painted epic light, layered depth, and a gentle aged-cel texture define the
    image.
  creative_brief: >-
    Apply classic painted-cel color, directional light, and layered depth to the requested content
    without imposing a quest or fantasy scene.
