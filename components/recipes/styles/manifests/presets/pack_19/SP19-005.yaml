visualDna:
  aesthetic: Monochrome ink illustration built from discrete dot clusters whose density carries form and value.
  subject_treatment:
    Preserve the requested subject and proportions. Let clustered dots describe planes and turn contours;
    do not depend on continuous outlines to hold the image together.
  color_and_tone:
    Work in a strong ink-to-ground range, varying dot size and spacing before adding any supplied accent.
    Honor explicit palette requests without introducing unrelated colors.
  lighting_and_shadow:
    Build shadows through tighter point spacing and keep highlights readable as open ground. Follow
    the requested light direction without adding a new light source.
  texture_and_material:
    Keep dots individually legible at the intended scale. Let clusters follow the existing form and
    taper at their edges instead of spreading as uniform grain.
  camera_and_composition:
    Preserve the requested framing and viewpoint. Concentrate the densest clusters around existing
    focal forms, leaving useful open gaps between adjacent shapes.
  atmosphere_and_mood:
    Carry the requested tone through point density and the amount of open ground; do not impose
    a tattoo subject or ritual setting.
  rendering_and_quality:
    Maintain controlled dot sizes and smooth density steps with crisp focal silhouettes. Avoid
    mechanical screens and scattered filler marks.
avoidRules:
  - uniform halftone screen
  - continuous outlines replacing the dot structure
  - random splatter fields
