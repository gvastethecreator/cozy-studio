visualDna:
  aesthetic: >-
    Fine ink lines weave through selected forms and break into readable reserves, with energetic strokes
    over organized dark masses and localized saturated accents.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Guide line networks along existing
    contours and surfaces without covering the silhouette in scribbles.
  color_and_tone: >-
    Keep dark and light areas clearly organized and place saturated accents locally. Preserve the
    requested palette instead of requiring neon hues.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Drawn accents do not add glow, particles
    or a new light source.
  texture_and_material: >-
    Use line detail as the surface mechanism and adapt its density to each material. Leave enough open
    space to distinguish the represented surfaces.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. The line network does not
    require a night scene, maze-like setting or altered pose.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. The word neon does not require a futuristic environment or
    luminous particles.
  rendering_and_quality: >-
    Concentrate fine lines in selected regions and interrupt them with clean reserves. Maintain a clear
    silhouette and a deliberate balance between linework and dark masses.
avoidRules:
  - screen-wide scribbles that obscure the silhouette
  - unrequested glow or light particles
