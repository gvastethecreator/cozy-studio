  aesthetic: 'Yoichi Takahashi Captain Tsubasa look: impossibly long football fields, dramatic extreme-perspective kicks and dives, flying sweat and eighties shonen sports melodrama.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Takahashi designs, lean athletic bodies, large determined eyes, flowing hair and classic football kits. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Grass green, sky blue, crisp kit white and bright sunset orange across the stadium.
  lighting_and_shadow: Strong stadium sunlight and dramatic backlight burning behind players at the climax moment.
  texture_and_material: Clean manga-derived line with speed lines, flying sweat droplets and torn grass.
  camera_and_composition: Extreme perspective with the ball filling the frame and endless curving fields behind.
  atmosphere_and_mood: Keep the requested mood with soaring match-point drama.
  rendering_and_quality: Dramatic sports manga-style frame with exaggerated perspective and eighties melodrama.
  key_features: Captain Tsubasa perspective; flying sweat; endless fields; climax kicks
  creative_brief: "Yoichi Takahashi Captain Tsubasa look: impossibly long football fields, dramatic extreme-perspective kicks and dives, flying sweat and eighties shonen sports melodrama. Carry it through Captain Tsubasa perspective, flying sweat, endless fields, climax kicks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
