visualDna:
  aesthetic: >-
    Fluid contour flow, fine clear line islands, and broad translucent value layers that
    transition without hard seams.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Follow existing
    shape changes with supple lines while keeping anatomy, structure, identity, and count
    intact; add no aquatic content.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use deep blue-teal, pearl,
    and cool cyan as a restrained value family; preserve explicit colors and avoid rainbow
    shifts.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use broad gradients and small cool accents
    only where source and surfaces justify them; add no caustics or new glow.
  texture_and_material: >-
    Apply texture only to materials already present. Layer translucent pigment films, fine
    stipple, and delicate line grain over present materials; add no water, foam, stars, or
    particles.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Create spaciousness through
    existing dark-to-light fields and depth, not a new sea or horizon.
  atmosphere_and_mood: >-
    Keep the requested tone; open value transitions imply no lyricism or spirituality.
  rendering_and_quality: >-
    Separate fine contour islands from soft fields; preserve small details and avoid bloom-heavy
    or watery distortion.
  key_features: >-
    Fluid line flow; translucent value layering; deep blue-teal and pearl; spacious
    dark-to-light separation.
  creative_brief: 'Use fluid line flow; translucent value layering; deep blue-teal and pearl; spacious dark-to-light separation. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
