visualDna:
  aesthetic: 'Elevated biophilic terrace: planted terraces and balconies on a building, with modular deep planters, horizontal timber decks and layered grasses and small trees in the air.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Warm timber decking, soft grasses and silvery perennials, dark planter edges, mineral gravel; green layers against sky or facade.
  lighting_and_shadow: Open sky light with wind-moved grass highlights; at night low integrated step and planter lighting.
  texture_and_material: Hardwood or thermo-treated decking, deep modular planters, ornamental grasses, multi-stem trees, gravel drainage strips, glass or steel balustrades.
  camera_and_composition: Keep the requested view; show height through the balustrade edge and what lies below, planting layered in front of the deck.
  atmosphere_and_mood: Airy, calm and green, a garden lifted off the ground.
  rendering_and_quality: Natural-light photograph with real planting variety, no recognisable real skyline or landmark.
  key_features: modular deep planters; horizontal timber decks; layered grasses and multi-stem trees; integrated low lighting; height at the balustrade
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Elevated Biophilic Terrace as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
