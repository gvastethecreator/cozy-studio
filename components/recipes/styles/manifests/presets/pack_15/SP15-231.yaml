visualDna:
  aesthetic: 'Microfichepunk: forgotten archives read through glowing microfiche machines, with tiny film cards, magnified grainy photographs and endless cabinets of drawers.'
  subject_treatment: Keep the prompt's subject and setting; show it as a grainy magnified photograph glowing on a microfiche reader in a dim archive.
  color_and_tone: Negative-like greys, ghostly whites and sickly green reader glow in dark archive rooms.
  lighting_and_shadow: The reader screen as the main light, lighting faces and dusty drawers.
  texture_and_material: Grainy magnified film, scratches, steel cabinets, dusty drawers and cards.
  camera_and_composition: Close views of glowing screens and long rows of archive cabinets.
  atmosphere_and_mood: Obsessive and eerie, secrets hidden in tiny squares of film.
  rendering_and_quality: Grainy low-key rendering with scratched magnified film texture.
  creative_brief: "Microfichepunk: forgotten archives read through glowing microfiche machines, with tiny film cards, magnified grainy photographs and endless cabinets of drawers. Carry it through glowing reader screens, magnified grain, archive drawers, film scratches. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: glowing reader screens; magnified grain; archive drawers; film scratches
