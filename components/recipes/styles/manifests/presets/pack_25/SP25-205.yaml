visualDna:
  aesthetic: 'Dense-Quiet Spread Contrast: packed pages alternate with wide calm pauses, building a sustained publication rhythm.'
  subject_treatment: Alternate dense and quiet pages across the prompt's publication in one explicit sequence, keeping all supplied content and titles exact.
  color_and_tone: Stable text contrast throughout, with density never lowering the legibility.
  lighting_and_shadow: Flat layout with source image light preserved throughout.
  texture_and_material: Sober support, minimal texture and consistent type hierarchy.
  camera_and_composition: Density spread across pages with transitions that prepare each change.
  atmosphere_and_mood: Editorial breathing and controlled tension, paced like music.
  rendering_and_quality: Crisp sequence where every pause has a job and dense pages keep hierarchy.
  creative_brief: "Dense-Quiet Spread Contrast: packed pages alternate with wide calm pauses, building a sustained publication rhythm. Carry it through dense pages, quiet pauses, explicit sequence, paced rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
