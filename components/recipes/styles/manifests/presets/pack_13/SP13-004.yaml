visualDna:
  aesthetic: 'Mecha hangar anime: giant robots drawn with precise mechanical line work, panel lines and industrial lighting.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: redrawn as anime with these drawing rules: hard-edged mechanical line work with panel lines, bolts and vents, humans tiny beside machines, sparks and steam as cel effects."
  color_and_tone: Gunmetal, hazard orange, off-white and teal accents, used consistently across subject and background.
  lighting_and_shadow: Industrial floodlights, sparks and visor glow, expressed through the style rather than photographic lighting.
  texture_and_material: Crisp cel metal with sharp highlight blocks, visible at card size as the signature of the style.
  camera_and_composition: Low angle up at the machine with tiny figures for scale.
  atmosphere_and_mood: Tense, powerful, mechanical and awe-struck, driven by the construction, color and rhythm.
  rendering_and_quality: Clean on-model anime frame or key visual with deliberate line and cel decisions.
  key_features: panel lines; floodlights; sparks; scale contrast
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mecha Hangar Ignition as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
