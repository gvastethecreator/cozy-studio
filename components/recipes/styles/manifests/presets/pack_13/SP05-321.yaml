visualDna:
  aesthetic: >-
    Stretch existing contours into pointed, elongated accents and add feathered ink wisps with
    sparse gilded detail against generous void.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use ink-dark values and
    restrained gold; preserve prompt colors that identify the subject.
  lighting_and_shadow: >-
    Let thin edge highlights emerge from the dark field; avoid adding a moon, candle or magical glow
    source.
  texture_and_material: >-
    Use fine ornamental hatching and tapering wisps; keep marks attached to existing shapes rather
    than adding motifs.
  camera_and_composition: >-
    Balance pointed detail with open negative space inside the original framing; do not add gothic
    architecture.
  atmosphere_and_mood: >-
    Gothic tension comes from line, void and taper; preserve the prompt's tone and meaning.
  rendering_and_quality: >-
    Apply ornamental pressure to any requested subject without adding religious symbols, costume,
    architecture or sigils. Keep important silhouettes and joins legible; no watermark, unrequested
    text or interface.
  key_features: >-
    Elongated contours; decorative ink wisps; feathered ornament; sparse gold; void-rich
    composition.
  creative_brief: >-
    Apply this visual treatment to the requested content: Elongated contours; decorative ink wisps;
    feathered ornament; sparse gold; void-rich composition. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - blunt contours obscuring pointed taper
  - ornamental hatching merging into silhouette
  - unrequested ornament competing with source forms
