  aesthetic: 'Sticky-note wall mosaic: a large image built from dozens of square colored sticky notes on a wall, each note one pixel.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Limited sticky-note colors — yellow, pink, orange, lime, cyan — on a pale wall.
  lighting_and_shadow: Office light with tiny curled edges casting small shadows.
  texture_and_material: Slightly curled paper corners, visible gaps between notes, one or two fallen notes.
  camera_and_composition: Wall seen straight on, the subject readable as a coarse square grid image.
  atmosphere_and_mood: Playful and collaborative, office supplies turned into art.
  rendering_and_quality: Real paper notes with curl and shadow; blank notes with no writing.
  creative_brief: "Sticky-note wall mosaic: a large image built from dozens of square colored sticky notes on a wall, each note one pixel. Carry it through square sticky-note pixels, limited note colors, curled corners, grid gaps, straight-on wall view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
