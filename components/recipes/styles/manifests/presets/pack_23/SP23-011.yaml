visualDna:
  aesthetic: >-
    Optional hand-coloring over an already defined relief-print image. The relief line and existing
    cut shapes remain the primary structure.
  subject_treatment: >-
    Preserve every existing silhouette, proportion, count, pose and action. Do not redraw or reshape
    content to make room for color.
  color_and_tone: >-
    Apply only colors explicitly requested or permitted as an accent, in small washes over existing
    regions. If the palette is locked or no accent is permitted, preserve its colors unchanged.
  lighting_and_shadow: >-
    Retain the base image lighting and shadows. Hand-coloring does not introduce a new light source
    or replace existing shadow shapes.
  texture_and_material: >-
    Let color coverage vary slightly at the edge of existing regions while keeping the relief marks
    clear. Do not add paper grain, stains, wear or material texture.
  camera_and_composition: >-
    Preserve the base image framing, crop, scale and placement exactly. This modifier does not
    alter composition.
  atmosphere_and_mood: >-
    Preserve the base image mood and setting. Color coverage does not add a historical or narrative
    context.
  rendering_and_quality: >-
    Keep the relief line dominant and color washes inside already established forms. Leave existing
    cut gaps and uncolored regions intact; add no new shapes or symbols.
avoidRules:
  - new hues without explicit accent permission
  - tint crossing established relief regions
  - added grain or artificial age
assets:
