visualDna:
  aesthetic: Atmospheric painted anime with soft lost edges, layered low contrast and rough earth-toned brushwork, as if seen through settling smoke.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Secondary contours blur into the brushwork while the face or focal gesture stays clear and exposed.
  color_and_tone: Muted clay, olive, charcoal and dusk blue with compressed values and no pure white or black.
  lighting_and_shadow: Diffuse side light with broad soft shadows, no rim light and no glow.
  texture_and_material: Smudged pigment, dragged brush streaks, uneven grain and thumb-blended edges across the whole surface.
  camera_and_composition: Keep the requested view; tight framing leaves little escape space around the subject.
  atmosphere_and_mood: Quiet, exposed and fragile, tired rather than tragic.
  rendering_and_quality: A legible focal subject against loosely painted surroundings; texture never turns to mud over the face.
  key_features: lost smoky edges; clay-olive-charcoal range; smudged dragged brushwork; compressed values; clear exposed focal face
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Smoke-Mud Vulnerability Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
