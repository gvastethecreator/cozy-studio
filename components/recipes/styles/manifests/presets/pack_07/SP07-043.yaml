visualDna:
  aesthetic: 'Karesansui dry garden: a walled rectangle of raked white gravel standing for water, with a few carefully placed stones and moss islands, made to be viewed from a veranda.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: White-grey gravel, dark weathered granite, velvet moss green, clay-plaster wall ochre and grey tile coping; very restrained.
  lighting_and_shadow: Low raking light across the gravel so every raked furrow casts a fine shadow line, stones throwing long shadows.
  texture_and_material: Crushed granite gravel raked in straight lines and concentric rings around stones, lichen on stone, moss islands, a tile-capped earthen wall.
  camera_and_composition: Keep the requested view; seated viewpoint from the veranda edge or an overhead plan; stones placed asymmetrically in odd-number groups.
  atmosphere_and_mood: Still, meditative and abstract, a sea made of stone.
  rendering_and_quality: Crisp photograph with continuous furrow lines, no spa decor, lanterns or bamboo fountains.
  key_features: raked white gravel furrows; concentric rings around stones; odd-number stone groups; moss islands; tile-capped earthen wall
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Karesansui Dry Abstraction as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
