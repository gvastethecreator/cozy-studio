  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters with lean elegant bodies, spiky layered hair, pale moody faces and outfits crossed with belts, zippers, chains and buckles. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black leather, silver hardware, one saturated accent color and pale skin.
  lighting_and_shadow: Clean promotional render light with soft rim highlights on leather and metal.
  texture_and_material: Crisp digital painting with leather sheen, metal buckles and fabric folds.
  camera_and_composition: Full-body heroic character art on a pale background, slight three-quarter pose.
  atmosphere_and_mood: Keep the requested mood with brooding stylish melancholy.
  rendering_and_quality: Polished JRPG promotional character illustration, in the recognizable hand of Tetsuya Nomura.
  creative_brief: "Tetsuya Nomura character design look: slender stylish heroes with spiky layered hair, belts, zippers, buckles and asymmetric straps, oversized boots and melancholy fashion-model faces. Carry it through Nomura belts and zippers, spiky hair, oversized boots, asymmetric straps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
