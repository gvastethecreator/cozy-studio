visualDna:
  aesthetic: 'Cellpunk: worlds shown at cellular scale, with membrane cities, organelle machinery and tiny travelers moving through living tissue landscapes.'
  subject_treatment: Keep the prompt's subject and setting; shrink it to cellular scale, among membranes, organelles and flowing plasma.
  color_and_tone: Translucent pinks, blues and greens like a stained microscope slide.
  lighting_and_shadow: Soft transmitted light as if seen through a microscope, glowing membranes.
  texture_and_material: Translucent membranes, floating organelles, vesicles and fluid currents.
  camera_and_composition: Round microscope-like fields and vast cell landscapes with tiny figures.
  atmosphere_and_mood: Wondrous and alien, an ocean of life hidden inside a single drop.
  rendering_and_quality: Luminous translucent illustration with fine, scientific-looking membrane and organelle detail.
  creative_brief: "Cellpunk: worlds shown at cellular scale, with membrane cities, organelle machinery and tiny travelers moving through living tissue landscapes. Carry it through membrane cities, organelle machines, microscope glow, tiny travelers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
