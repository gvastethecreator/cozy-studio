visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around brittle short hatches and
    tiny edge grains that gather at contour turns without resembling literal frost or
    snow. For color and surface, keep source hues while leaning toward slate,
    cold blue-gray, and pale silver, with one restrained warm pivot if already
    supported. Suspicion or guilt may register as a guarded value balance only when
    compatible with the requested mood
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through brittle short hatches and tiny edge
    grains that gather at contour turns without resembling literal frost or snow; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep source hues while
    leaning toward slate, cold blue-gray, and pale silver, with one restrained warm
    pivot if already supported. Keep values legible across the prompted light and dark
    range; do not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use cool, compact highlights
    against readable shadow planes; do not change the prompt's weather or time of day.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; apply dry crystalline micrograin as a drawing
    texture, not a new frozen material, and keep the original surfaces legible. Keep
    texture subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; hold the
    framing and pose fixed; distribute hatching unevenly to suggest hesitation rather
    than an imposed close-up. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Suspicion or guilt may register as a
    guarded value balance only when compatible with the requested mood. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and brittle short hatches and tiny edge grains
    that gather at contour turns without resembling literal frost or snow; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    brittle short hatches and tiny edge grains that gather at contour turns without
    resembling literal frost or snow; keep source hues while leaning toward slate, cold
    blue-gray, and pale silver, with one restrained warm pivot if already supported; use
    cool, compact highlights against readable shadow planes; do not change the prompt's
    weather or time of day; apply dry crystalline micrograin as a drawing texture, not a
    new frozen material, and keep the original surfaces legible; and hold the framing
    and pose fixed; distribute hatching unevenly to suggest hesitation rather than an
    imposed close-up. The five cues should read as one mark-and-value system, not as
    extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use brittle short hatches and tiny edge grains
    that gather at contour turns without resembling literal frost or snow, keep source
    hues while leaning toward slate, cold blue-gray, and pale silver, with one
    restrained warm pivot if already supported, use cool, compact highlights against
    readable shadow planes; do not change the prompt's weather or time of day, and apply
    dry crystalline micrograin as a drawing texture, not a new frozen material, and keep
    the original surfaces legible; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
