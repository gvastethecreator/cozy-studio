visualDna:
  aesthetic: 'Neutron radiography: an X-ray-like image with reversed logic, where metal turns see-through and organic or wet materials show dark.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: a greyscale transmission image in which metal casings fade to pale ghosts and wood, wax, water, leather and bone read dark and sharp."
  color_and_tone: Greyscale with inverted material contrast, exactly as the instrument maps its signal.
  lighting_and_shadow: No light; density to hydrogen-rich materials, because the image shows signal, not ordinary light.
  texture_and_material: Fine grain and soft edges on metal, as real instrument artifacts rather than decoration.
  camera_and_composition: Frontal transmission view of a sealed object, matching how this instrument actually frames data.
  atmosphere_and_mood: Revealing, mysterious, scientific and quiet, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Neutron radiography: an X-ray-like image with reversed logic, where metal turns see-through and organic or wet materials show dark. Carry it through metal transparent, organics dark, sealed contents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: metal transparent; organics dark; sealed contents
