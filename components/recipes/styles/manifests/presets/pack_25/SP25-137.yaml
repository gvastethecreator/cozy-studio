visualDna:
  aesthetic: 'Collector Insert Architecture: trays, layers and small cards arranged as a sequence of discovery from lid to last piece.'
  subject_treatment: Arrange the prompt's supplied pieces into trays, layers and cards as a discovery sequence from outside to inside, every piece counted and titled exactly.
  color_and_tone: One shared palette with an accent on the current piece.
  lighting_and_shadow: Soft even light between levels with every piece in plain view.
  texture_and_material: Sober materials, coherent thickness and gaps that explain each piece.
  camera_and_composition: Outside-to-inside sequence at a stable scale with visible finger grips.
  atmosphere_and_mood: A contained ritual of discovery, careful and exciting.
  rendering_and_quality: Every piece has a clear function and a place to return to.
  creative_brief: "Collector Insert Architecture: trays, layers and small cards arranged as a sequence of discovery from lid to last piece. Carry it through layered trays, discovery sequence, counted pieces, finger grips. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: layered trays; discovery sequence; counted pieces; finger grips
