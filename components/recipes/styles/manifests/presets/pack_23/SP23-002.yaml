visualDna:
  aesthetic: >-
    Opaque color fields, continuous dark contours and clearly separated value bands build a
    graphic image with minimal gradual modeling.
  subject_treatment: >-
    Preserve the requested identity, count, action and orientation. Simplify existing forms into
    immediately readable silhouettes without turning them toward the viewer.
  color_and_tone: >-
    Use broad opaque planes and distinct value bands while retaining requested hues. Keep strong
    separations controlled so the original subject remains easy to recognize.
  lighting_and_shadow: >-
    Describe form with a small number of solid tonal regions rather than smooth gradients. Follow
    the requested light and shadow pattern without adding a source.
  texture_and_material: >-
    Keep pigment surfaces matte and mostly even, with slight edge variation from the painted mark.
    Do not paste paper grain over the depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Make silhouettes clear
    inside that composition without imposing a page format.
  atmosphere_and_mood: >-
    Let the spacing and contrast of color planes set the visual rhythm while preserving the requested
    mood and avoiding invented narrative or iconography.
  rendering_and_quality: >-
    Maintain continuous dark contours and crisp, legible color boundaries. Keep value bands attached
    to the forms they describe and clear of important subject details.
avoidRules:
  - unrequested religious or narrative iconography
  - color bands that obscure the requested subject
