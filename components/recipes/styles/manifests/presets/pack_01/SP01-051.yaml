visualDna:
  aesthetic: 'Fashion editorial photography: styling-first images built as a magazine story, with graphic poses, bold silhouettes, and concept-driven sets.'
  subject_treatment: Pose the subject for silhouette and garment — elongated lines, angular limbs, sculptural stances — letting clothing shape drive the image.
  color_and_tone: 'Editorial grade chosen per story: tonal monochrome, a single bold color block, or muted desaturation with one accent.'
  lighting_and_shadow: Crisp studio strobe or hard sun creating graphic shadows, sometimes a colored gel as a design element.
  texture_and_material: Fabric drape, structured tailoring, leather, sheer layers, and statement accessories rendered with precision.
  camera_and_composition: Full-length or three-quarter framing, graphic negative space, set pieces or color planes used as composition.
  atmosphere_and_mood: Aloof, stylish, conceptual, and assertive.
  rendering_and_quality: High-end editorial finish, crisp garment detail, controlled skin retouch.
  key_features: silhouette-first posing; concept set; graphic hard light; color-block backdrop; garment precision
  creative_brief: "Fashion editorial photography: styling-first images built as a magazine story, with graphic poses, bold silhouettes, and concept-driven sets. Carry it through silhouette-first posing, concept set, graphic hard light, color-block backdrop, garment precision. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
