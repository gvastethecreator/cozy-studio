  color_and_tone: Chestnut, olive, cream, navy and oxblood, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Soft countryside morning light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Tweed, moleskin, quilted cotton, silk and polished leather, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Full figure in a stable, field or estate setting.
