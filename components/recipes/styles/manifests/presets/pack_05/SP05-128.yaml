visualDna:
  aesthetic: >-
    Build the graphic anime treatment from broad black brush contours cut by clean white gaps and
    large folded shapes arranged in formal, broad balance. Let long decisive sweeps followed by
    stately pauses set its rhythm; use black, ivory, and restrained deep-violet accents for color
    and solid ink fields with subtle paper grain and almost no soft texture for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use broad black brush contours cut by clean white
    gaps for edge work, large folded shapes arranged in formal, broad balance for form
    simplification, and long decisive sweeps followed by stately pauses only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with black, ivory, and restrained deep-violet accents. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: deep shadow masses with crisp white edge separations. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with solid ink fields with subtle paper grain and almost no soft
    texture, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use formal broad spacing with one strong diagonal and
    open negative space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey solemn grandeur and controlled drama, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with high-contrast ink masses, clean negative cuts, and restrained color; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    broad black brush contours cut by clean white gaps; large folded shapes arranged in formal,
    broad balance; black, ivory, and restrained deep-violet accents; long decisive sweeps followed
    by stately pauses; solid ink fields with subtle paper grain and almost no soft texture; formal
    broad spacing with one strong diagonal and open negative space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with broad black brush
    contours cut by clean white gaps, large folded shapes arranged in formal, broad balance, and
    black, ivory, and restrained deep-violet accents; use long decisive sweeps followed by stately
    pauses only where movement is already present, and apply solid ink fields with subtle paper
    grain and almost no soft texture as the drawing finish.
