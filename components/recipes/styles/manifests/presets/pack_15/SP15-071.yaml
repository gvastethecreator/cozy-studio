visualDna:
  aesthetic: >-
    Lunar Relay Cultivation operates as a portable punk-spectrum router: combine Lunar Relay
    Cultivation identity cues through relay dish arcs; dome-glow curves; pale hydroponic growth;
    earthlight; moon-white surfaces; leaf green with space/atomic/ray punk grammar with rocket-age
    curves, isotope glow, reactor leisure, orbit chrome, plasma transit, lunar cultivation, and
    optimistic danger, so the preset supplies retrofit style behavior rather than a required venue,
    mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through atomic
    signage, chrome arcs, rocket-fin wedges, pressure suit seams, lunar greenhouse edges, plasma
    rails, tether curves, and vacuum-clean silhouette; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through uranium green, coral red, chrome silver, cream, star blue, cherry red, moon
    white, brushed steel, and vacuum black; keep dominant, support, and accent values readable,
    avoid muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
    Use reactor glow, blue-hour neon, observation-window light, plasma bloom, lunar bounce, panel
    glow, and chrome-reflection cuts; lighting should reveal the punk system, preserve the user's
    subject, separate near and distant value planes, and avoid crushed blacks or noisy dark texture.
  texture_and_material: >-
    Render chrome blocks, enamel panels, vinyl bands, glass blocks, brushed steel, coolant glass,
    vacuum fabric, and clean atomic decals without readable text; keep material scale coherent,
    surface marks motivated, and tactile details strong enough to route style without becoming
    pasted grunge.
  camera_and_composition: >-
    Compose through orbit curves, ray-age wedges, sleek public transit rhythm, spherical depth cues,
    and confident subject spacing without diner or vehicle dependency as reusable framing grammar
    for characters, creatures, objects, vehicles, environments, symbols, or full scenes without one
    required card layout.
  atmosphere_and_mood: >-
    Carry mood through bright civic weirdness, touristic optimism, nocturnal fun, clinical danger,
    lunar fragility, and retrofuturist social energy; the tone may become adult, romantic, violent,
    comic, sensual, eerie, civic, or strange when prompt X asks, while the punk family remains
    legible.
  rendering_and_quality: >-
    Finish with flat-to-painterly raypunk illustration with clean chrome shapes, denoised glow,
    matte blacks, and no glossy car-ad realism; prioritize clean denoise, bold readable shapes,
    controlled grit, prompt preservation, no watermark, no readable text, and no generic concept-art
    polish.
  key_features: >-
    relay dish arcs; dome-glow curves; pale hydroponic growth; earthlight; moon-white surfaces; leaf
    green
  creative_brief: >-
    Use Lunar Relay Cultivation after prompt X as a transferable punk-spectrum layer: prompt X
    supplies subject, action, setting, tone, and intensity, while the preset supplies relay dish
    arcs, dome-glow curves, pale hydroponic growth, earthlight, moon-white surfaces, leaf green,
    color logic, light response, material behavior, composition rhythm, mood pressure, and finish
    discipline without requiring a fixed venue, fixed cast, fixed machine, repeated prop bundle, or
    sample-card composition.
