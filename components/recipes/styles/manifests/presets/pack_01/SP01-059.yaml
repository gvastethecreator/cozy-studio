visualDna:
  aesthetic: 'Abstract photography: intentional camera movement, extreme crops and reflections that dissolve a real subject into color, line and texture.'
  subject_treatment: Start from the prompt subject and setting, then abstract them on purpose through motion, crop or reflection until form becomes secondary to color and line.
  color_and_tone: Bold, saturated or strongly contrasting color taken from the subject.
  lighting_and_shadow: Light used as streaks, glints and reflections rather than modeling.
  texture_and_material: Motion streaks, rippled reflections, macro surface detail filling the frame.
  camera_and_composition: No clear horizon or scale, full-frame pattern, a single dominant direction of movement.
  atmosphere_and_mood: Experimental and vivid, feeling carried by color alone.
  rendering_and_quality: In-camera abstraction; not a digital filter or generated fractal.
  key_features: intentional camera movement; extreme crop; rippled reflections; color over form; no scale
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Abstract Photo as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
