visualDna:
  aesthetic: >-
    Swamppunk contrasts dense moss-like organic masses and damp shadow pools with sparse, interrupted
    signal lines.
  subject_treatment: >-
    Preserve the requested subject and structure; use localized mossy layering and broken linework
    without converting it into a swamp creature or radio apparatus.
  color_and_tone: >-
    Keep the requested palette in control; use deep olive, peat brown and subdued teal with a small warm
    accent only where useful.
  lighting_and_shadow: >-
    Respect stated lighting; use soft damp reflections only on compatible surfaces and add no lantern or
    glow source.
  texture_and_material: >-
    Keep organic, metal and other materials distinct; confine moss fibers, moisture and oxidation to
    compatible areas.
  camera_and_composition: >-
    Preserve viewpoint and placement; balance a few broad irregular masses against thin broken arcs
    without requiring stilts, reeds or a wetland scene.
  atmosphere_and_mood: >-
    Suggest humid stillness and signal interference through material contrast and interrupted rhythm
    while retaining the requested mood.
  rendering_and_quality: >-
    Separate broad mossy shapes from fine linework and leave open gaps; avoid all-over damp texture,
    tangled wires and tiny foliage.
avoidRules:
  - Do not add radio towers, stilt buildings, boats or wetland scenery unless requested.
  - Do not coat unrelated materials in moss, moisture or oxidation.
  - Keep signal traces sparse and subordinate to the large forms.
