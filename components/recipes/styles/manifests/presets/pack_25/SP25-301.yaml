visualDna:
  aesthetic: 'Elastic Assembly Motion: styleframes where pieces pull apart and snap back together with one shared elastic overshoot, always staying the same pieces.'
  subject_treatment: Show the prompt's subject as keyframes of pieces separating and snapping back with shared elastic tension, the same piece count and exact words throughout.
  color_and_tone: A stable palette per piece with no new colors faking transformation.
  lighting_and_shadow: Consistent light or shading across every keyframe of the sequence.
  texture_and_material: Material secondary to the stretch, with volume recovered on settling.
  camera_and_composition: A stable main center of mass with room for expansion and protected text.
  atmosphere_and_mood: A short impulse, coordinated expansion and a damped, satisfying settle.
  rendering_and_quality: Crisp start and end frames with countable pieces and clear correspondences.
  creative_brief: "Elastic Assembly Motion: styleframes where pieces pull apart and snap back together with one shared elastic overshoot, always staying the same pieces. Carry it through elastic overshoot, same pieces, damped settle, keyframe strip. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: elastic overshoot; same pieces; damped settle; keyframe strip
