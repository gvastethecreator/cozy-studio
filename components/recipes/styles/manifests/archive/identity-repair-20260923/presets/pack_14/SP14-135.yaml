visualDna:
  aesthetic: >-
    Broad ink masses contain uneven open pores and branching channels. Permeable areas meet a few solid
    edges, creating a clear contrast between density and openness.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Preserve requested colors and use the existing background tone as an open reserve; keep pores
    readable through value separation rather than added glow.
  lighting_and_shadow: >-
    Keep the requested lighting and let local pore density describe transitions within its shadows,
    without punching holes through the actual object.
  texture_and_material: >-
    Porosity is an illustrative surface treatment with varied scale, not rot, infection, damage or a
    replacement material.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Concentrate the open texture in secondary
    planes while retaining solid identifying contours and the original arrangement.
  atmosphere_and_mood: Organic tension and breathing space without forcing decay, horror or a biological subject.
  rendering_and_quality: >-
    Balance large solid masses with a few permeable passages. Avoid even sponge texture and microscopic
    noise.
avoidRules:
  - uniform sponge texture
  - unrequested decay or infection
  - anatomical holes
