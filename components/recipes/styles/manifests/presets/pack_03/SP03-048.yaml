visualDna:
  aesthetic: 'Launch-reveal product render: one object emerging from darkness, its silhouette traced by sweeping edge light, floating a hair above a black mirror floor.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the dark launch-stage presentation with edge-light sweep and mirror floor, while the object keeps its exact shape, finish and proportions. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Near-black stage where the product's own finish is the only color, echoed by a faint gradient glow matched to it.
  lighting_and_shadow: Long thin strip lights behind and above draw bright continuous lines along every edge while the front faces fall into shadow.
  texture_and_material: Bead-blasted aluminum, soft-touch polymer and glass with precise microtexture wherever the edge light grazes them.
  camera_and_composition: Low three-quarter or straight-on hero view with a long lens, the object small in a large dark frame above its reflection.
  atmosphere_and_mood: Hushed and expectant, the second before the curtain lifts on a new object.
  rendering_and_quality: Immaculate CGI with no dust, fingerprints or backdrop seam; highlights never clip into flat white.
  key_features: emerging from darkness; strip-light edge tracing; black mirror floor; long-lens hero view; single matched color glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Product Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - multi-view asset sheet
  - fake labels
  - brand logo
