visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through giant encounter scale; scale encounter reveal; tracking, ambush,
    and scale reveal; hostile biome traversal, survival pressure, creature scale, weathered camps,
    and readable hunt routes, using the preset as art direction rather than a required scene,
    mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express survival pressure, terrain
    hazards, creature scale, extraction timing, and frontier resource logic without forcing a
    landscape postcard.
  color_and_tone: >-
    Grade the image with earth ochre, moss green, frost blue, volcanic black, coral color, bronze
    mud, and storm-violet accents; keep tonal hierarchy strong enough for gameplay readability,
    thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with bioluminescence, campfire pools, blizzard glare, forge heat, underwater
    shafts, and storm flashes; use highlights and shadow pockets to reveal routes, hazards,
    factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from gnarled branches, fruit color, and defensive machinery; wet foliage, mineral
    crust, fur, coral, packed snow, mud, rope, leather, patched tents, and chipped field gear; make
    props, clothing, creatures, vehicles, architecture, and terrain share the same production-world
    logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from hostile biome traversal, survival pressure, creature
    scale, weathered camps, and readable hunt routes: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood pastoral zone turned tactical; feral, precarious, exploratory, weather-beaten,
    predatory, and resource-starved; the result can be adult, harsh, seductive, eerie, or violent
    when prompt X asks for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as survival-game art with clear traversal cues, tactile terrain, and no generic scenic
    wallpaper; preserve clean focal hierarchy, believable material response, heavy-denoise clarity,
    and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Titan, Orchard, Colossus, Hunt; giant encounter scale; earth ochre, moss green, frost blue,
    volcanic black, coral color, bronze mud, and storm-violet accents; bioluminescence, campfire
    pools, blizzard glare, forge heat, underwater shafts, and storm flashes; gnarled branches, fruit
    color, and defensive machinery; colossal target framed by small scale markers; pastoral zone
    turned tactical
  creative_brief: >-
    Apply Titan Orchard Colossus Hunt as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
