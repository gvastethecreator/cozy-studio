visualDna:
  aesthetic: 'Ichiro Itano circus style: swirling spiral trajectories, dozens of trails curving around each other, dizzying camera paths and dense choreographed motion.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures or animals as small elements following swirling spiral paths seen from above. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: White trails, stone cloister grey and bright sky reflections.
  lighting_and_shadow: Bright overhead light glinting along the curving trails.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Top-down view looking straight down at spiraling paths.
  atmosphere_and_mood: Keep the requested mood with dizzying choreographed flight.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Ichiro Itano circus style: swirling spiral trajectories, dozens of trails curving around each other, dizzying camera paths and dense choreographed motion. Carry it through Itano circus spirals, swirling trails, top-down, choreographed motion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Itano circus spirals; swirling trails; top-down; choreographed motion
