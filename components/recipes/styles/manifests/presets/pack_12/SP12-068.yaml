visualDna:
  aesthetic: 'In-game screenshot look informed by Panzer Dragoon: Remake gameplay: on-rails dragon shooter capture with ancient tech vistas, flying creature silhouette, lock-on targets, and surreal biomechanical skies. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Panzer Dragoon: Remake-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Panzer Dragoon: Remake-informed palette: dusty teal, rust orange, bone white, sky blue,
    violet shadow, and red lock-on marks. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through sunlit sky haze, weapon lock glow, engine-like ancient lights, and
    atmospheric rim on wings. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from scaled dragon skin, ancient machinery, floating platforms, organic metal,
    desert ruins, and rail-shooter projectile effects. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person behind-dragon rail camera with targets around the screen, sweeping
    horizon, and cinematic flight route. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Panzer Dragoon: Remake-derived mood: strange, majestic, lonely, arcade, and mythic sci-fi; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: lock-on reticles, health
    gauge, and target brackets are allowed as rail-shooter language. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Panzer Dragoon: Remake gameplay screenshots; on-rails dragon shooter capture with ancient tech
    vistas, flying creature silhouette, lock-on targets, and surreal biomechanical skies; dusty
    teal, rust orange, bone white, sky blue, violet shadow, and red lock-on marks; sunlit sky haze,
    weapon lock glow, engine-like ancient lights, and atmospheric rim on wings; scaled dragon skin,
    ancient machinery, floating platforms, organic metal, desert ruins, and rail-shooter projectile
    effects; third-person behind-dragon rail camera with targets around the screen, sweeping
    horizon, and cinematic flight route; strange, majestic, lonely, arcade, and mythic sci-fi; HUD
    guidance: lock-on reticles, health gauge, and target brackets are allowed as rail-shooter
    language
  creative_brief: "Panzer Dragoon Skyforge Dock: in-game screenshot language informed by Panzer Dragoon: Remake, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
