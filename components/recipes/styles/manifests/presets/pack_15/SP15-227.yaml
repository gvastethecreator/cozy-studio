visualDna:
  aesthetic: 'Teletextpunk: everything built from chunky blocky mosaic graphics of old broadcast pages, with eight flat colors, stepped edges and black backgrounds.'
  subject_treatment: Keep the prompt's subject and setting; reduce it to coarse block mosaic shapes of eight flat colors on black, without letters.
  color_and_tone: Pure black backgrounds with saturated red, green, yellow, blue, magenta, cyan and white blocks.
  lighting_and_shadow: Flat screen glow with no shading, only solid mosaic cells.
  texture_and_material: Coarse rectangular mosaic cells, stepped diagonals and slight screen glow.
  camera_and_composition: Flat centered page-like compositions made entirely of large blocks.
  atmosphere_and_mood: Charming, crude and futuristic, a past idea of the digital future.
  rendering_and_quality: Strict coarse mosaic rendering with solid cells and glowing edges.
  creative_brief: "Teletextpunk: everything built from chunky blocky mosaic graphics of old broadcast pages, with eight flat colors, stepped edges and black backgrounds. Carry it through coarse mosaic cells, eight flat colors, black background, stepped edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: coarse mosaic cells; eight flat colors; black background; stepped edges
