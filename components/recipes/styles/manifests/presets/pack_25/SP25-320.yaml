visualDna:
  aesthetic: 'Three-Keyframe Continuity Test: a sheet of start, peak and arrival keyframes of the same set, with piece ids and correspondences marked.'
  subject_treatment: Show the prompt's animation as start, peak and arrival keyframes with the same pieces, geometry and exact words, correspondences labeled outside the art.
  color_and_tone: Fixed palette and roles, any change noted as an explicit transition.
  lighting_and_shadow: Locked light and camera unless a move is declared.
  texture_and_material: Consistent material and detail with no new pieces.
  camera_and_composition: Three frames in a row sharing scale references and anchors.
  atmosphere_and_mood: A continuity test focused on what changes and what stays.
  rendering_and_quality: Clean comparison sheet with a complete correspondence table beside it.
  creative_brief: "Three-Keyframe Continuity Test: a sheet of start, peak and arrival keyframes of the same set, with piece ids and correspondences marked. Carry it through start, peak, arrival, piece ids, locked camera. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: start, peak, arrival; piece ids; locked camera; correspondence notes
