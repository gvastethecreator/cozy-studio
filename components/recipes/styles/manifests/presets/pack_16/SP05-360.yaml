visualDna:
  aesthetic: 'Traditional archery anime of poetic focus: stillness, draw, release and the moment when time seems to stop.'
  subject_treatment: Keep the prompt's subject and action; distill it to calm focus and a single precise release.
  color_and_tone: White and black archery dress, pale wood and soft green garden light.
  lighting_and_shadow: Gentle daylight across the range, soft shadows and a bright far target.
  texture_and_material: Wooden bows, feathers, fabric and raked sand drawn with fine line.
  camera_and_composition: Side profiles at full draw and long views down the range to the target.
  atmosphere_and_mood: Poetic and calm, the whole world narrowing to breath and a distant circle.
  rendering_and_quality: Serene prestige anime with minimal effects and precise form.
  key_features: full draw; stillness; long range; fine line
  creative_brief: "Traditional archery anime of poetic focus: stillness, draw, release and the moment when time seems to stop. Carry it through full draw, stillness, long range, fine line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
