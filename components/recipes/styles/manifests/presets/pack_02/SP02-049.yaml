visualDna:
  aesthetic: 'Projected 1950s Kodachrome slide: mid-century reversal color seen as a lit transparency, with projector glow, slight vignetting and dust on the slide.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Rich reds, deep blues and warm golden highlights; dense blacks; slightly warm projector cast.
  lighting_and_shadow: Bright sunny daylight in the image; projector hot spot in the center.
  texture_and_material: Very fine grain, a few dust specks and a hair on the slide, soft corner falloff.
  camera_and_composition: Keep the requested framing; the image glows as projected light.
  atmosphere_and_mood: Sunny and nostalgic, a family slide show on a summer evening.
  rendering_and_quality: Projected-transparency glow; the stock response itself belongs to Kodachrome 64 in pack_01.
  key_features: projected slide glow; red and blue dye richness; center hot spot; dust specks on the slide; warm projector cast
  creative_brief: "Projected 1950s Kodachrome slide: mid-century reversal color seen as a lit transparency, with projector glow, slight vignetting and dust on the slide. Carry it through projected slide glow, red and blue dye richness, center hot spot, dust specks on the slide, warm projector cast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
