  aesthetic: 'Reefpunk: whole towns grown from living coral in warm shallow seas, with branching coral towers, sponge furniture and fish swimming through every open window.'
  subject_treatment: Keep the prompt's subject and setting; grow its buildings, furniture and props out of living coral, sponge and shell in clear shallow water.
  color_and_tone: Vivid coral orange, magenta, lime and violet over sunlit turquoise and white sand.
  lighting_and_shadow: Bright caustic sunlight rippling across coral surfaces through shallow clear water.
  texture_and_material: Branching and brain coral, porous sponge, sea fans, shell and rippled sand.
  camera_and_composition: Busy underwater streets seen at eye level with schools of fish crossing the frame.
  atmosphere_and_mood: Lively, warm and colorful, a city that is also a living reef ecosystem.
  rendering_and_quality: Saturated underwater illustration with crisp caustic light and dense organic detail.
  creative_brief: "Reefpunk: whole towns grown from living coral in warm shallow seas, with branching coral towers, sponge furniture and fish swimming through every open window. Carry it through grown coral towers, caustic light, fish in windows, sponge furniture. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
