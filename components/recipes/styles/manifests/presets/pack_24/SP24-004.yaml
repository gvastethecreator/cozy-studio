visualDna:
  aesthetic: >-
    Silent Hill 4: The Room (2004) psychological-horror art direction: ordinary closed domestic
    space turns subtly bodily and hostile, with compressed perspective and sickly analog tonal
    instability.
  subject_treatment: >-
    Preserve explicit identity and action. Keep mundane subjects outwardly plausible; disturb their
    relationship to space through an intrusive stain, doubled shadow or impossible threshold where
    compatible.
  color_and_tone: >-
    Nicotine ivory, dirty beige, bruised brown and dim institutional green with narrow bloody rust
    accents; few clean bright colors.
  lighting_and_shadow: >-
    Flat weak daylight or one tired practical lamp becomes unreliable near a threshold; shadow and
    warm-cold shifts imply presence before a visible creature.
  texture_and_material: >-
    Thin wall paint, tired cloth, greasy glass and rusted fixtures with localized organic
    discoloration. Unease belongs to the inhabited material, not an all-over grunge overlay.
  camera_and_composition: >-
    Tight domestic framing, blocked exits and off-center gaps that feel observed; an ordinary anchor
    remains clear amid subtle spatial contradiction.
  atmosphere_and_mood: >-
    Entrapment, voyeurism and contaminated familiarity; private shelter becomes invasive rather than
    a broad foggy town.
  rendering_and_quality: >-
    Unsettling painted mixed-media illustration with smoky edges and sparse abrasion; analog
    restraint and human scale, not polished modern cinematic horror.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
