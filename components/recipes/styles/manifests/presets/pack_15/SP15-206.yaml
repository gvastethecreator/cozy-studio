visualDna:
  aesthetic: 'Swamppunk: stilt towns deep in bayous and mangrove swamps, with fan-boat taverns, lantern-hung cypress trees, gator-hide gear and mist on black water.'
  subject_treatment: Keep the prompt's subject and setting; set it among stilt houses, cypress roots and still black swamp water in mist.
  color_and_tone: Murky greens and browns, black water, moss grey and warm lantern orange.
  lighting_and_shadow: Hazy dim light through hanging moss and warm lanterns reflected on dark water.
  texture_and_material: Weathered stilts, hanging moss, cypress roots, duckweed, rusted tin roofs.
  camera_and_composition: Low water-level views through roots and moss with boats gliding between houses.
  atmosphere_and_mood: Humid, mysterious and musical, stories told on porches over dark water.
  rendering_and_quality: Moody illustration with soft mist layers and rich reflections.
  creative_brief: "Swamppunk: stilt towns deep in bayous and mangrove swamps, with fan-boat taverns, lantern-hung cypress trees, gator-hide gear and mist on black water. Carry it through stilt towns, hanging moss, lantern reflections, black water. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stilt towns; hanging moss; lantern reflections; black water
