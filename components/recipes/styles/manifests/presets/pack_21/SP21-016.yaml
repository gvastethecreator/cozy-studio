visualDna:
  aesthetic: 'Folded tessellation relief: a single sheet pleated and folded into a repeating geometric relief, with the subject emerging from light and shadow on the folds.'
  subject_treatment: Suggest the prompt's subject through the pattern and light of a folded tessellation, keeping its silhouette readable across the pleats.
  color_and_tone: White or single-color paper, with value created entirely by light and shadow on the folds.
  lighting_and_shadow: Strong raking light across the pleats, bright faces and deep shadowed valleys forming the image.
  texture_and_material: Crisp folds, repeating pleat modules, slightly softened crease lines and paper grain.
  camera_and_composition: Frontal or slightly angled view of the whole folded sheet under side light.
  atmosphere_and_mood: Precise, sculptural and meditative, geometry made from one sheet.
  rendering_and_quality: Accurate folded geometry with real shadows, never flat drawn patterns.
  creative_brief: "Folded tessellation relief: a single sheet pleated and folded into a repeating geometric relief, with the subject emerging from light and shadow on the folds. Carry it through repeating pleat modules, raking light on folds, single sheet, value from shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: repeating pleat modules; raking light on folds; single sheet; value from shadow
