visualDna:
  aesthetic: 'Rorschach ink blot: ink pressed between a folded sheet so the subject appears as a symmetrical blot with organic edges.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: suggested by a mirrored ink blot: pooled blacks, feathered edges and accidental forms that hint at the subject."
  color_and_tone: Black ink on white, sometimes with a red accent.
  lighting_and_shadow: No lighting; flat ink, expressed through the style rather than photographic lighting.
  texture_and_material: Absorbent paper, pooled and feathered ink, fold line, visible at card size as the signature of the style.
  camera_and_composition: Symmetric framing around a vertical fold, arranged so the subject still reads at card size.
  atmosphere_and_mood: Uncanny, psychological, ambiguous and eerie, driven by the construction, color and rhythm.
  rendering_and_quality: Authentic blot with clean symmetry, with clean, deliberate marks and no accidental noise.
  creative_brief: "Rorschach ink blot: ink pressed between a folded sheet so the subject appears as a symmetrical blot with organic edges. Carry it through mirror symmetry, pooled ink, feathered edges, fold line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mirror symmetry; pooled ink; feathered edges; fold line
