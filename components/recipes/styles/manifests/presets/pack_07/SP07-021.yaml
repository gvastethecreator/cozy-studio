visualDna:
  aesthetic: 'Deconstructivist architecture: fragmented volumes that collide at non-orthogonal angles, tilted walls, slashed openings and cantilevers that seem to lack support.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Brushed zinc, titanium and stainless silver, raw concrete grey and white render; cool palette where color comes from reflected sky.
  lighting_and_shadow: Hard sun producing sharp angular shadow cuts across tilted planes, reflections shifting from bright to dark on each facet.
  texture_and_material: Standing-seam metal and shingled titanium cladding, exposed steel, board-formed concrete fragments, glazing cut into irregular slashes.
  camera_and_composition: Keep the requested view; dynamic oblique angle, no horizon kept level with any wall, volumes cropped so the collision fills the frame.
  atmosphere_and_mood: Unsettled, kinetic and provocative, as if stability were undone.
  rendering_and_quality: Crisp architectural photograph, clean metal reflections and knife-edge shadows, no copy of a named landmark museum.
  key_features: colliding non-orthogonal volumes; tilted walls; slashed window cuts; brushed zinc and titanium cladding; unsupported-looking cantilevers
  creative_brief: "Deconstructivist architecture: fragmented volumes that collide at non-orthogonal angles, tilted walls, slashed openings and cantilevers that seem to lack support. Carry it through colliding non-orthogonal volumes, tilted walls, slashed window cuts, brushed zinc and titanium cladding, unsupported-looking cantilevers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
