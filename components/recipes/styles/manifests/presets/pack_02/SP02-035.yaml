visualDna:
  aesthetic: 'Golden-age slapstick cartoon: elastic cel characters with extreme squash-and-stretch and smear frames against stylized painted backgrounds.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Bright saturated character colors against softer painted desert, sky or interior backgrounds.
  lighting_and_shadow: Flat cel color with minimal shadow; backgrounds carry painted light.
  texture_and_material: Crisp ink outlines, smear and multiple-limb frames, dust clouds and impact stars.
  camera_and_composition: Strong horizontal chase staging, poses held at the peak of a take, graphic backgrounds with abstract shapes.
  atmosphere_and_mood: Frantic and comic, timing sharpened into a single perfect gag.
  rendering_and_quality: Classic theatrical cartoon finish; original characters only, no studio mascots.
  key_features: squash-and-stretch; smear frames; painted stylized backgrounds; held take poses; dust-cloud impacts
  creative_brief: "Golden-age slapstick cartoon: elastic cel characters with extreme squash-and-stretch and smear frames against stylized painted backgrounds. Carry it through squash-and-stretch, smear frames, painted stylized backgrounds, held take poses, dust-cloud impacts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
