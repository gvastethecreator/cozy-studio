visualDna:
  aesthetic: 'Southern Gothic: decaying rural mansions, swamps, Spanish moss, humid heat and quiet grotesque secrets.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: set among overgrown old houses, cypress swamps, moss-hung oaks, rusty porches and old churches."
  color_and_tone: Faded whites, moss green, rust and humid gold, used consistently across subject and background.
  lighting_and_shadow: Hazy humid light and dusk, expressed through the style rather than photographic lighting.
  texture_and_material: Peeling paint, moss, rust and damp wood, visible at card size as the signature of the style.
  camera_and_composition: Still, wide framing with a lonely figure, arranged so the subject still reads at card size.
  atmosphere_and_mood: Uneasy, humid, secretive and melancholy, driven by the construction, color and rhythm.
  rendering_and_quality: Painterly or film-photo finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Southern Gothic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: Spanish moss; swamp; peeling mansion; humid haze
