visualDna:
  aesthetic: >-
    A cool, forensic graphic style using precise scan bands, rectilinear divisions, and measured
    contour lines; abstract marks suggest analysis without becoming readable interface graphics.
  subject_treatment: >-
    Retain the subject’s identity and proportions. Clarify its structure with aligned planes and
    fine technical contours, without adding uniforms, devices, or anonymous figures.
  color_and_tone: >-
    Use slate, deep blue, and icy cyan with small, deliberate red signals. Keep saturation low
    and separate important forms by value.
  lighting_and_shadow: >-
    Pair broad, hard shadow shapes with thin cool scan-like highlights along existing edges;
    avoid implying a monitor or other light source.
  texture_and_material: >-
    Keep materials recognizable beneath restrained glassy overlays, fine hatch marks, and sparse
    etched lines; use no labels or literal data.
  camera_and_composition: >-
    Respect the requested framing. Repeat measured horizontal and vertical alignments within the
    subject, leaving clear space around its key outline.
  atmosphere_and_mood: >-
    Make the image feel controlled and questioning through still spacing, cool contrast, and
    exact marks rather than a surveillance scene.
  rendering_and_quality: >-
    Favor clean technical line weights, flat cel shadows, crisp color boundaries, and legible
    nonverbal marks; keep overlays sparse.
  key_features: >-
    Forensic blue planes; scan-band accents; aligned technical contours; quiet red signals.
  creative_brief: >-
    Keep the requested subject, action, and setting. Render its existing forms with cool scan
    bands, measured blue planes, and fine technical contours; add no agents, screens, or
    readable data.
