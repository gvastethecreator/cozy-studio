visualDna:
  aesthetic: 'Facing-Page Dialogue: left and right pages given complementary jobs that talk to each other through anchors, scale or reference.'
  subject_treatment: Give the prompt's left and right pages complementary jobs that answer each other through anchors or references, every word complete and exact.
  color_and_tone: One shared palette with weight differences marking the left and right roles.
  lighting_and_shadow: Flat layout with both pages in the same even light.
  texture_and_material: Coherent type and surfaces with source images unchanged.
  camera_and_composition: Left and right in dialogue by anchors or scale, symmetry optional.
  atmosphere_and_mood: Counterpoint and an editorial conversation, witty, balanced and clear.
  rendering_and_quality: Crisp spread where each page adds different information.
  creative_brief: "Facing-Page Dialogue: left and right pages given complementary jobs that talk to each other through anchors, scale or reference. Carry it through facing pages, complementary roles, anchored dialogue, shared palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
