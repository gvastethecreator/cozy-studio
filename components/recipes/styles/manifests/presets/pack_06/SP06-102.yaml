visualDna:
  aesthetic: 'Roguelike tile set: each subject reduced to one square pictographic tile with a stark silhouette in two or three colors on black.'
  subject_treatment: Keep the prompt subject recognizable; present it as one tile or a sheet of matching tiles on a black grid, and build a dungeon map only when the prompt asks for one.
  color_and_tone: Black ground with two or three flat colors per tile; bone white, rust red, moss green or cold blue as tile accents.
  lighting_and_shadow: No modeled light; value comes from silhouette cutouts and one inner highlight shape.
  texture_and_material: Hard-edged 32 pixel tiles, one-pixel inner detail lines, no gradients, a faint grid between tiles.
  camera_and_composition: Orthographic tiles in an even grid with equal padding; each silhouette centered and readable at tiny size.
  atmosphere_and_mood: Stark and tactical, danger read in a single glance.
  rendering_and_quality: Consistent tile size, line weight and palette across the whole set; no text glyphs.
  key_features: square pictograph tiles; black ground; two or three colors; even grid; stark silhouettes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Roguelike Tile Glyph System as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
