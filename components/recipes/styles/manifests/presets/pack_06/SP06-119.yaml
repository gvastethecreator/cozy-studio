visualDna:
  aesthetic: 'Cozy life-sim art direction: soft pixel or painted forms with rounded shapes, gentle outlines and warm seasonal palettes.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: 'One season per image: spring pastels, summer greens, autumn ambers or winter blues, always warm-leaning and low contrast.'
  lighting_and_shadow: Soft sunny light, short soft shadows, warm window glow in evening scenes.
  texture_and_material: Rounded wood, soft foliage clumps, knitted and woven textures, small scattered details like flowers and leaves.
  camera_and_composition: Keep the requested view; tidy spacing, cozy negative space and small useful objects arranged invitingly.
  atmosphere_and_mood: Gentle and comforting, daily routine as a small pleasure.
  rendering_and_quality: Clean soft outlines and a controlled seasonal palette; nothing harsh or gritty.
  key_features: seasonal palette; rounded forms; soft outlines; warm light; cozy negative space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cozy Sim Seasonal Palette as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
