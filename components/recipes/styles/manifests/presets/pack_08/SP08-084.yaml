visualDna:
  aesthetic: 'Y2K pop glam: turn-of-the-millennium fashion — low-rise, metallics, baby tees, butterfly clips, tinted sunglasses and shiny synthetic fabrics.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: low-rise trousers or mini skirt, a cropped baby tee or metallic halter, tinted small sunglasses, butterfly clips and chunky platform shoes."
  color_and_tone: Baby pink, powder blue, chrome silver and lilac, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Bright flash or glossy pop studio light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Metallic vinyl, satin, rhinestones, mesh and glossy plastic accessories.
  camera_and_composition: Playful, tilted framing with pop energy, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Flirty, fun, shiny and nostalgic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Glossy, slightly oversaturated finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Y2K pop glam: turn-of-the-millennium fashion — low-rise, metallics, baby tees, butterfly clips, tinted sunglasses and shiny synthetic fabrics. Carry it through low-rise and baby tees, chrome and baby pink, butterfly clips, tinted sunglasses, glossy flash. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: low-rise and baby tees; chrome and baby pink; butterfly clips; tinted sunglasses; glossy flash
