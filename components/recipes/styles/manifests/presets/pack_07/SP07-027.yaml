visualDna:
  aesthetic: 'Tudor Revival architecture: decorative half-timbering over stucco on upper storeys, steep cross gables, tall clustered brick chimneys and leaded diamond-pane casements.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Dark brown or black timbers against cream stucco, warm red handmade brick, grey-green slate or clay tile roofs, moss accents.
  lighting_and_shadow: Soft overcast or low warm light, shadows under jettied upper floors and deep eaves, windows glowing amber at dusk.
  texture_and_material: Stained timber boards in close studding and curved braces, textured stucco infill, clinker brick, carved bargeboards, leaded diamond glass.
  camera_and_composition: Keep the requested view; three-quarter view that shows several gables stepping, chimneys breaking the roofline.
  atmosphere_and_mood: Storybook, settled and homely, with an old-English romance.
  rendering_and_quality: Detailed photograph with timber pattern clear and regular, no cottage postcard staging.
  key_features: decorative half-timbering over stucco; steep cross gables; clustered brick chimneys; leaded diamond-pane casements; jettied upper storey
  creative_brief: "Tudor Revival architecture: decorative half-timbering over stucco on upper storeys, steep cross gables, tall clustered brick chimneys and leaded diamond-pane casements. Carry it through decorative half-timbering over stucco, steep cross gables, clustered brick chimneys, leaded diamond-pane casements, jettied upper storey. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
