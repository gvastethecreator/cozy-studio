  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of porous natural sea sponge with irregular holes.'
  color_and_tone: Tan, sand, ochre and pale yellow, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft side light showing pores, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Porous spongy fibers with irregular holes, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Soft, strange, organic and absorbent, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: porous sea sponge; irregular holes; soft tan fibers
  creative_brief: "Sea sponge: porous organic sponge with irregular holes and soft tan fibers. Carry it through porous sea sponge, irregular holes, soft tan fibers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
