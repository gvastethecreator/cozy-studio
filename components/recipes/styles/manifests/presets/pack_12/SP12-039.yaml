visualDna:
  aesthetic: >-
    Source-informed video-game style router for original rhythm-action brawler captures: cel-shaded
    third-person arena play with beat-synced impacts, graphic motion accents, stage-like combat
    spaces, music-reactive UI shapes, and readable dodge/combo timing. Borrow the kinetic camera
    discipline and bold cel graphic language associated with Hi-Fi Rush-like games, but land as a
    different fictional beat-combat game with different characters, props, arena shapes, icons, and
    color motifs.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable beat-combat screenshot subject:
    keep clear role silhouette, attack timing, enemy spacing, route or arena affordance, and
    hitbox-like readability without copying source characters or named IP elements.
  color_and_tone: >-
    Use a rhythm-action palette: punchy red, teal shadow, yellow hit sparks, violet stage light,
    white graphic accents, and black ink outlines. Keep value grouping legible at gameplay distance
    and avoid generic cyberpunk wash or tactical-strategy desaturation.
  lighting_and_shadow: >-
    Light the image through concert-like rim lights, beat pulses, stylized spotlights, impact
    flashes, and clean cel shading. Lighting must clarify the playable route, threat, focal subject,
    or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from cartoon metal, posters without readable text, stage props, robot parts,
    guitar-like weapons, and comic SFX shapes without text. Materials should feel like in-engine
    game assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person arena camera, enemy spacing, beat lanes, combo timing, and readable
    dodges. The frame should read as a plausible playable rhythm-action capture, not an isometric
    strategy map or key art poster.
  atmosphere_and_mood: >-
    Carry an original beatline theater mood: loud, musical, rebellious, playful, adult enough to
    avoid kid-gloss, and kinetic.
  rendering_and_quality: >-
    Finish as coherent in-engine stylized rhythm-action screenshot style, not concept art: combo
    shapes, beat bars, health, timing prompts, and ability icons can appear as abstract synchronized
    UI. Maintain heavy-denoise clarity, crisp focal hierarchy, cel-shaded material discipline,
    readable gameplay scale, no fake logos, no readable lyric/text UI, and no strategy-tactics
    camera.
  key_features: >-
    original rhythm-action brawler gameplay screenshots; cel-shaded third-person arena play;
    beat-synced impacts; graphic motion accents; stage-like combat spaces; music-reactive abstract
    UI shapes; punchy red, teal shadow, yellow sparks, violet stage light, white accents, black ink
    outlines; third-person arena camera with enemy spacing and readable dodge/combo timing; loud,
    musical, rebellious, playful, kinetic; HUD guidance: abstract combo and beat UI only, no
    readable text
  creative_brief: >-
    Use Beatline Phantom Theater as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through rhythm-action brawler references: cel-shaded combat camera,
    beat-synced effects, graphic timing UI, bold arena staging, and readable playable motion. Avoid
    menus, logos, exact characters, exact levels, direct Hi-Fi Rush cloning, and strategy-tactics
    framing.
