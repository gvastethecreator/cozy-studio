    resonance, feathered ascent, solar oath, and echoing water memory; it carries symbol, omen,
    ritual authority, and mature editorial restraint without locking prompt content to its sample
    image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through jade
    shaping silhouette rhythm, contour pressure, and symbolic edge control, cenote shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus echo shaping silhouette
    rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette pressure,
    emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or
