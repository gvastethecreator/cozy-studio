visualDna:
  aesthetic: 'Transparent watercolor washes, soft pigment blooms, and paper-tooth granulation sit beneath selective pencil or ink contours.'
  subject_treatment: 'Preserve identity, proportions, pose, and count; let wash edges soften surfaces without losing the requested silhouette or action.'
  color_and_tone: "Layer diluted color with visible overlap and natural edge variation; honor the user's palette and avoid a fixed seasonal cast."
  lighting_and_shadow: 'Follow stated light through transparent washes and soft-edged shadows; do not add sunlight or haze as a scene cue.'
  texture_and_material: 'Show pigment granulation and watercolor blooms as the image medium; keep depicted material texture separate and recognizable.'
  camera_and_composition: 'Preserve crop, viewpoint, scale, spacing, and count; vary wash density without defocusing or rearranging content.'
  atmosphere_and_mood: 'Retain the requested mood; watercolor softness does not assign an emotional tone.'
  rendering_and_quality: 'Keep focal contours crisp enough to read, with organic wash boundaries and no digital blur across the whole image.'
  key_features: 'Transparent washes; pigment blooms; paper-tooth granulation; selective ink edges; diluted layered color.'
  creative_brief: 'Use visible watercolor texture and transparent overlapping washes while retaining crisp focal contours. Preserve subject, action, count, camera, and mood; add no new content or light source.'
