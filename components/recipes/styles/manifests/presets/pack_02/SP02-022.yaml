visualDna:
  aesthetic: 'Security monitor wall: several CCTV feeds shown together in a quad split on a CRT monitor, so the scene is seen from four fixed cameras at once.'
  subject_treatment: Keep the prompt subject as the content of the graphic; this preset owns the on-screen layout, and every band, panel or symbol stays free of readable text.
  color_and_tone: Grainy black and white or washed green feeds, glowing phosphor, dark monitor bezel.
  lighting_and_shadow: Each feed lit by its own location; monitor glow spilling onto the dark desk.
  texture_and_material: Low resolution, compression blocks, scanlines and CRT curvature.
  camera_and_composition: Four panels in a two-by-two grid, each a high-corner view of a different part of the scene.
  atmosphere_and_mood: Watchful and uneasy, something appearing in one feed and not in the others.
  rendering_and_quality: Multi-feed monitor presentation; distinct from the single-camera CCTV profile in pack_01; no readable labels.
  key_features: two-by-two feed grid; CRT curvature and scanlines; high-corner views; grainy monochrome; one anomaly
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies CCTV/Security Cam as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
