visualDna:
  aesthetic: 'Blockbook picture print: pages cut entirely from a single woodblock, simple thick-lined figures and scenes in compartments with pale hand tints of green, red and yellow.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; draw the subject in simple thick outline shapes arranged in framed compartments.
  color_and_tone: Brown-black ink outlines with pale transparent hand tints.
  lighting_and_shadow: No shading, only outlines and flat tint, kept consistent across the whole image.
  texture_and_material: Rubbed brown ink, soft paper, uneven tint washes.
  camera_and_composition: Two or three framed picture compartments on a page.
  atmosphere_and_mood: Keep the requested mood with naive storytelling, kept consistent across the whole image.
  rendering_and_quality: Simple bold outline with clear readable action, kept consistent across the whole image.
  creative_brief: "Blockbook picture print: pages cut entirely from a single woodblock, simple thick-lined figures and scenes in compartments with pale hand tints of green, red and yellow. Carry it through thick outlines, framed compartments, pale tints, rubbed brown ink. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thick outlines; framed compartments; pale tints; rubbed brown ink
