visualDna:
  aesthetic: 'Material Memory Transitions: styleframes where a shape changes material while a faint imprint of its previous state lingers and fades.'
  subject_treatment: Show the prompt's shape changing material in keyframes, a faint imprint of its previous state lingering briefly and fading, words kept exact.
  color_and_tone: A related palette between imprint and current form, the imprint lower in contrast.
  lighting_and_shadow: Light matching the current state, the imprint left unlit.
  texture_and_material: Changing materials with a trace that follows the previous outline.
  camera_and_composition: Focus on the persistent shape with the trace aligned to its last position.
  atmosphere_and_mood: Transformation, brief memory and a clean fade, almost poetic.
  rendering_and_quality: Crisp keyframes with a matching trace and no leftover ghosts.
  creative_brief: "Material Memory Transitions: styleframes where a shape changes material while a faint imprint of its previous state lingers and fades. Carry it through material change, fading imprint, aligned trace, clean end. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: material change; fading imprint; aligned trace; clean end
