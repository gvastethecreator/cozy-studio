visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on World of Warships gameplay screenshots: naval
    combat capture with third-person warship camera, ocean scale, shell tracers, islands, torpedo
    lanes, and tactical HUD density. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable World of Warships-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a World of Warships-informed palette: steel grey, ocean blue, shell orange, smoke black, UI
    green/red, and pale sky haze. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through open-sea daylight, muzzle flashes, fire plumes, water reflections, and
    smoke-diffused contrast. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from warship armor, wet decks, waves, island cliffs, radar wakes, smoke, shell
    splashes, and utilitarian naval detail. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person tactical camera with ship heading, target range, minimap, torpedo
    indicators, and broad battle-space readability. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a World of Warships-derived mood: heavy, strategic, naval, explosive, and measured. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: naval HUD can be dense:
    minimap, reticle, ship status, cooldowns, and target markers are coherent here. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    World of Warships gameplay screenshots; naval combat capture with third-person warship camera,
    ocean scale, shell tracers, islands, torpedo lanes, and tactical HUD density; steel grey, ocean
    blue, shell orange, smoke black, UI green/red, and pale sky haze; open-sea daylight, muzzle
    flashes, fire plumes, water reflections, and smoke-diffused contrast; warship armor, wet decks,
    waves, island cliffs, radar wakes, smoke, shell splashes, and utilitarian naval detail;
    third-person tactical camera with ship heading, target range, minimap, torpedo indicators, and
    broad battle-space readability; heavy, strategic, naval, explosive, and measured; HUD guidance:
    naval HUD can be dense: minimap, reticle, ship status, cooldowns, and target markers are
    coherent here
  creative_brief: >-
    Use World of Warships Iron Reef as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from World of Warships: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
