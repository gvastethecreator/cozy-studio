visualDna:
  aesthetic: 'Confectionery wonderland: everything made of candy, sugar glass, gumdrops, frosting and striped sugar sticks.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: turned into food: a named dish is shot this way, and any other subject is built, plated or served as food — built entirely from candy: gumdrops, lollipops, sugar glass, frosting, marshmallows and striped sugar sticks."
  color_and_tone: Saturated candy colors with pastel and glossy highlights, used consistently across subject and background.
  lighting_and_shadow: Bright sugary light with glossy sparkle, expressed through the style rather than photographic lighting.
  texture_and_material: Sugar glass, sprinkles, frosting and gummy translucency, visible at card size as the signature of the style.
  camera_and_composition: Wide whimsical view full of candy detail, arranged so the subject still reads at card size.
  atmosphere_and_mood: Sweet, whimsical, playful and a little uncanny, driven by the construction, color and rhythm.
  rendering_and_quality: Glossy candy render or photo, with clean, deliberate marks and no accidental noise.
  key_features: candy construction; sugar glass; frosting; gumdrops
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Confectionery Wonderland as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
