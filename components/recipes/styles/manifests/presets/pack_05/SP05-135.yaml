visualDna:
  aesthetic: >-
    Build the graphic anime treatment from uneven broken contours with irregular angular fragments
    and asymmetrical masses disrupted by crisp shape breaks. Let sudden directional shifts,
    clipped marks, and abrupt releases set its rhythm; use black and warm coral with a bright
    yellow or cobalt accent for color and rough ink, broken halftone, and scattered dry texture
    for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use uneven broken contours with irregular angular
    fragments for edge work, asymmetrical masses disrupted by crisp shape breaks for form
    simplification, and sudden directional shifts, clipped marks, and abrupt releases only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with black and warm coral with a bright yellow or cobalt accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard edge separation with small bright cuts. Keep shadows grouped
    and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with rough ink, broken halftone, and scattered dry texture,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use fractured spacing organized around one clear focal
    area to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey mischievous disruption and unstable rhythm, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with broken contour, irregular print texture, and a controlled accent palette; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    uneven broken contours with irregular angular fragments; asymmetrical masses disrupted by
    crisp shape breaks; black and warm coral with a bright yellow or cobalt accent; sudden
    directional shifts, clipped marks, and abrupt releases; rough ink, broken halftone, and
    scattered dry texture; fractured spacing organized around one clear focal area.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with uneven broken
    contours with irregular angular fragments, asymmetrical masses disrupted by crisp shape
    breaks, and black and warm coral with a bright yellow or cobalt accent; use sudden directional
    shifts, clipped marks, and abrupt releases only where movement is already present, and apply
    rough ink, broken halftone, and scattered dry texture as the drawing finish.
