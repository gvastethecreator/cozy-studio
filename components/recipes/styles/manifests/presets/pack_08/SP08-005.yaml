  creative_brief: "Athleisure sport styling: performance fabrics worn as everyday fashion, with sculpted seams, compression panels and sleek technical layering. Carry it through tonal performance sets, bonded seams and mesh panels, reflective accent, mid-stride energy, clean daylight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
