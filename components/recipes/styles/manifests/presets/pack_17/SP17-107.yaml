visualDna:
  aesthetic: 'Image received by thermal fax and left in the sun: brown-gray dithered tones, horizontal scan streaks, compressed blacks, curling glossy paper, and fading toward one edge.'
  subject_treatment: 'Any prompt subject becomes a degraded transmitted image: silhouettes and key gestures survive through coarse dither and scan lines, while fine details dissolve in a way that feels like lost evidence.'
  color_and_tone: Brown-black, sepia-gray, and pale yellowed thermal paper; one edge faded almost to blank.
  lighting_and_shadow: Flattened scanned light with harsh dithered midtones and compressed shadows.
  texture_and_material: Ordered dither patterns, horizontal scan streaks, thermal paper sheen, and gentle fading gradient across the sheet.
  camera_and_composition: Documentary-style off-center crop as if a found photo or sketch was faxed, with slight skew and cut-off edges.
  atmosphere_and_mood: Cold, mysterious, lost, and unsettling.
  rendering_and_quality: 'Clean controlled reproduction of degradation: dither is regular and readable, subject still recognizable, no random noise.'
  creative_brief: "Image received by thermal fax and left in the sun: brown-gray dithered tones, horizontal scan streaks, compressed blacks, curling glossy paper, and fading toward one edge. Carry it through thermal fax dither, horizontal scan streaks, sun-faded sepia gray, skewed found-evidence crop, dissolving detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thermal fax dither; horizontal scan streaks; sun-faded sepia gray; skewed found-evidence crop; dissolving detail
