  lighting_and_shadow: Soft gothic cathedral light and elegant rim light.
  texture_and_material: Fine ornamental line, fashion rendering and lacquered armor.
  camera_and_composition: Elegant tall vertical compositions and ornate close-ups of lacquered armor plates.
  atmosphere_and_mood: Keep the requested mood with melancholy ornate dread.
  rendering_and_quality: Ornate fashion-illustration frame with gothic mecha and melancholy knights.
  key_features: Mamoru Nagano gothic mecha; fashion elegance; ornate armor; melancholy
  creative_brief: "Mamoru Nagano look as in The Five Star Stories and Gothicmade: ornate gothic mecha with elegant armor plates, fashion-illustration elegance, and melancholy knights. Carry it through Mamoru Nagano gothic mecha, fashion elegance, ornate armor, melancholy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
