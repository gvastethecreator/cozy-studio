visualDna:
  aesthetic: >-
    Reduce forms to compact, readable raster clusters with few internal value changes. Use color to
    separate meaningful parts that already exist in the subject; this is shape abstraction, not a
    requirement to turn the image into text, ASCII art or an icon sheet.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and functional parts.
    Simplify inner structure while keeping defining shapes recognizable; do not replace the subject with
    a letter, glyph, mutant creature or game symbol.
  color_and_tone: >-
    Preserve the requested palette and color meaning. Use a small number of clear color groupings to
    distinguish existing parts; do not prescribe a science-fiction palette, arbitrary semantic colors
    or a fixed number of hues.
  lighting_and_shadow: >-
    Follow requested lighting and shadows, expressed through sparse value steps and crisp clusters.
    Avoid continuous shading, diffuse effects or extra contrast that erases requested nuance.
  texture_and_material: >-
    Preserve the depicted materials while keeping fine texture sparse. Let silhouette and color blocks
    carry the structure instead of adding a pixel font, noise pattern or ornamental symbols.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and composition. Do not change it to a top-down
    map, inventory layout, grid or game screenshot.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Do not add a historical period, science-fiction or fantasy
    content through this abstraction.
  rendering_and_quality: >-
    Keep each form legible through a compact silhouette, restrained internal contrast and deliberate
    color separation. Avoid text characters, ASCII constructions, dense texture or continuous gradients.
avoidRules:
  - unrequested letters, text, ASCII characters or icon sheet
  - unrequested inventory, grid, map or game interface
  - unrequested mutant creatures or science-fiction content
  - fine texture, continuous shading or dense noise replacing compact forms
