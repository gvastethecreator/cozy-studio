visualDna:
  aesthetic: 'Camcorderpunk: the world through a 1990s home camcorder, with shaky handheld framing, soft video blur, blown highlights, tape tracking lines and family-event chaos.'
  subject_treatment: Keep the prompt's subject and setting; show it as handheld home video footage, shaky, softly blurred and badly exposed.
  color_and_tone: Oversaturated warm video colors, blown whites and muddy shadows with slight color bleed.
  lighting_and_shadow: Harsh on-camera light or blown window light, flat and unflattering.
  texture_and_material: Video noise, tracking lines, soft focus, chromatic bleed and interlace texture.
  camera_and_composition: Tilted handheld framing, awkward zooms and subjects half out of frame.
  atmosphere_and_mood: Chaotic, intimate and funny, memories nobody meant to make beautiful.
  rendering_and_quality: Authentic low-resolution video rendering with noise, bleed and tracking lines.
  creative_brief: "Camcorderpunk: the world through a 1990s home camcorder, with shaky handheld framing, soft video blur, blown highlights, tape tracking lines and family-event chaos. Carry it through shaky handheld framing, tracking lines, blown highlights, color bleed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shaky handheld framing; tracking lines; blown highlights; color bleed
