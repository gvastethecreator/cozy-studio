# Default Gvaste Pages template: reproduces the production token defaults from
# kit/tokens.css. Absent template.yaml resolves to exactly these values.
schema: gvaste-pages/template/v1
name: Default

tokens:
  color:
    paper: "#000000"
    surface: "#111111"
    ink: "#c9c9c9"
    muted: "#8a8a8a"
    accent: "#c9c9c9"
  typography:
    display: Arimo
    text: Arimo
    mono: Geist Mono
    scale: 1
  layout:
    maxWidth: 1080
    headerHeight: 48
  shape:
    radius: 12
    borderWidth: 2
  motion:
    enabled: true
    duration: 180

themes:
  light:
    tokens:
      color:
        paper: "#eee8dc"
        surface: "#e7e1d4"
        ink: "#2a2a2a"
        muted: "#6a6a6a"

chrome:
  header:
    variant: sticky
    density: compact
  shade:
    variant: mist
