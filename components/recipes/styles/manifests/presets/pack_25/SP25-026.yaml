visualDna:
  aesthetic: 'Nested Cutout Symbols: one main void inside each icon holds a second cutout large enough to clarify the function.'
  subject_treatment: Give the prompt's subject or requested states a main void with one secondary cutout inside it only where it clarifies function, limiting nesting to two levels.
  color_and_tone: Figure and ground clearly separated, each void a true opening.
  lighting_and_shadow: Flat graphic shapes, with cavities read purely through outline.
  texture_and_material: Continuous masses, clean inner edges and enough space between the two cutouts.
  camera_and_composition: The largest opening reserved for the primary meaning, detail placed off-center.
  atmosphere_and_mood: Functional discovery in two steps, clear and satisfying.
  rendering_and_quality: The secondary cutout stays open when reduced and never changes the silhouette.
  creative_brief: "Nested Cutout Symbols: one main void inside each icon holds a second cutout large enough to clarify the function. Carry it through main void, nested second cutout, two levels, clear function. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: main void; nested second cutout; two levels; clear function
avoidRules:
  - closed-up voids
  - decorative nesting
  - detail that overpowers the action
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - readable text
  - logo
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
