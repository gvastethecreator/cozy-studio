  lighting_and_shadow: Flat fluorescent convenience-store light with crisp shadows and neon night glow outside.
  texture_and_material: Clean crisp line, flat screentone, motion arcs and flying everyday objects.
  camera_and_composition: Choreographed sequence framing, objects frozen mid-flight and dynamic diagonal action.
  atmosphere_and_mood: Keep the requested mood with snappy inventive action.
  rendering_and_quality: Crisp inventive action manga frame with precise choreography of everyday objects.
