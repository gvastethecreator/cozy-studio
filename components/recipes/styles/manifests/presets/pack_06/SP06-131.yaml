visualDna:
  aesthetic: 'End-grain wood engraving: a polished block of boxwood cut with fine burins, so the image is built from delicate white lines engraved into black.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Rich black and white, greys made from white-line tints of varying width; crisp velvety blacks with no grain.
  lighting_and_shadow: Light engraved out as fine parallel white lines and stipple, dense tints for highlights, solid black for deep shadow.
  texture_and_material: Hair-fine white lines, no wood grain in the blacks, tiny stipple cuts, small block size with a crisp edge.
  camera_and_composition: Keep the requested framing in a small, dense vignette with jewel-like detail.
  atmosphere_and_mood: Intimate, precise and nocturnal, a tiny world carved in light.
  rendering_and_quality: Very fine controlled white-line tints and stipple, crisp black; no coarse gouge marks and no wood grain.
  creative_brief: "End-grain wood engraving: a polished block of boxwood cut with fine burins, so the image is built from delicate white lines engraved into black. Carry it through fine white lines cut into black, white-line tint greys, no wood grain, tiny stipple cuts, small jewel-like vignette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fine white lines cut into black; white-line tint greys; no wood grain; tiny stipple cuts; small jewel-like vignette
