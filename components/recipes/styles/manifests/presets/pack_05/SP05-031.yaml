visualDna:
  aesthetic: >-
    Build the graphic anime treatment from flowing calligraphic strokes with fine tapers and
    ornamental turns and broad cel silhouettes interlocked with patterned forms. Let measured
    sweeps, looping continuations, and graceful pauses set its rhythm; use saturated jewel
    accents, warm pale neutrals, and dark ink for color and clean cel flats with fine decorative
    linework and soft pigment bloom for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use flowing calligraphic strokes with fine tapers
    and ornamental turns for edge work, broad cel silhouettes interlocked with patterned forms for
    form simplification, and measured sweeps, looping continuations, and graceful pauses only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with saturated jewel accents, warm pale neutrals, and dark ink. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: soft luminous edges against firm, grouped cel shadows. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean cel flats with fine decorative linework and soft pigment
    bloom, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use choreographed curves balanced by open ornamental
    margins to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey graceful intensity and ceremonial poise, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with broad color blocks, controlled ornament, and smooth calligraphic edges; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    flowing calligraphic strokes with fine tapers and ornamental turns; broad cel silhouettes
    interlocked with patterned forms; saturated jewel accents, warm pale neutrals, and dark ink;
    measured sweeps, looping continuations, and graceful pauses; clean cel flats with fine
    decorative linework and soft pigment bloom; choreographed curves balanced by open ornamental
    margins.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with flowing calligraphic
    strokes with fine tapers and ornamental turns, broad cel silhouettes interlocked with
    patterned forms, and saturated jewel accents, warm pale neutrals, and dark ink; use measured
    sweeps, looping continuations, and graceful pauses only where movement is already present, and
    apply clean cel flats with fine decorative linework and soft pigment bloom as the drawing
    finish.
