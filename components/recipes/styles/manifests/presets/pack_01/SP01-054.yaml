visualDna:
  aesthetic: 'Deep-sky astrophotography: a tracked telescope and hours of stacked exposures revealing nebulae, galaxies, comets and planets against black space.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Hydrogen reds and magentas, oxygen teals, blue reflection nebula, pure black background with pinpoint stars of varied color.
  lighting_and_shadow: Only emitted and reflected starlight; faint structures stretched from the dark background.
  texture_and_material: Wispy gas filaments, dark dust lanes and pillars, round sharp stars with faint diffraction spikes.
  camera_and_composition: Telescope framing with the object centered or on a diagonal, no ground or horizon.
  atmosphere_and_mood: Cosmic and silent, vast distance rendered as quiet structure.
  rendering_and_quality: 'Clean stacked-image look: low noise, no star trails, no painted glow; a ground subject belongs to Milky Way Nightscape instead.'
  key_features: telescope deep-sky view; emission reds and oxygen teals; dust pillars; pinpoint stars; black background
  creative_brief: "Deep-sky astrophotography: a tracked telescope and hours of stacked exposures revealing nebulae, galaxies, comets and planets against black space. Carry it through telescope deep-sky view, emission reds and oxygen teals, dust pillars, pinpoint stars, black background. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
