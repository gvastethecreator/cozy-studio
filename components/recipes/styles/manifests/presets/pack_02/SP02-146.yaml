visualDna:
  aesthetic: 'Medical ultrasound: sound echoes drawn as a grainy greyscale fan-shaped image, with bright reflective boundaries and dark fluid spaces.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Black background, speckled greys, bright white echo boundaries, occasional warm sepia tint.
  lighting_and_shadow: No light; brightness is echo strength, with dark acoustic shadows behind dense objects.
  texture_and_material: Heavy speckle noise, soft blurred edges, reverberation bands.
  camera_and_composition: Fan- or sector-shaped image narrowing to the top, subject in cross-section.
  atmosphere_and_mood: Intimate and mysterious, a shape half glimpsed through sound.
  rendering_and_quality: Credible ultrasound speckle; no measurement text or medical labels.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Medical Ultrasound Scan as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: fan-shaped sector; speckle noise; bright echo boundaries; dark fluid spaces; acoustic shadows
