visualDna:
  aesthetic: 'Wildfirepunk: communities living with fire, with firebreak towns, ember shelters, smoke masks, controlled burns and forests reborn from ash.'
  subject_treatment: Keep the prompt's subject and setting; bring fire and smoke close, with shelters, firefighters and new growth among the ashes.
  color_and_tone: Smoky orange skies, ember red and ash grey with sudden green new growth.
  lighting_and_shadow: Orange-filtered daylight through smoke and flickering ember glow at night.
  texture_and_material: Ash, charred bark, fire-resistant canvas, smoke masks and scorched earth.
  camera_and_composition: Towering smoke columns over small figures, and close views of ash and sprouts.
  atmosphere_and_mood: Dangerous and defiant, people who learned to live beside the flames.
  rendering_and_quality: Dramatic smoky illustration with glowing embers and ash texture.
  creative_brief: "Wildfirepunk: communities living with fire, with firebreak towns, ember shelters, smoke masks, controlled burns and forests reborn from ash. Carry it through smoke skies, ember shelters, controlled burns, green sprouts in ash. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: smoke skies; ember shelters; controlled burns; green sprouts in ash
