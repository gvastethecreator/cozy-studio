visualDna:
  aesthetic: 'Smoke dress: garments whose lower parts dissolve into drifting smoke while the bodice stays defined.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments with a defined upper part whose hems and trains dissolve into curling smoke.'
  color_and_tone: Charcoal, ash grey, and white smoke against dark backgrounds.
  lighting_and_shadow: Backlight and side light to reveal smoke volumes, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Soft volumetric smoke with curling wisps blending from fabric.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Ghostly, mysterious, fleeting and poetic, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: hems dissolving into smoke; defined bodice; curling wisps; backlit volumes
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Smoke Dress as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
