visualDna:
  aesthetic: >-
    Elastic pop rendering with rounded graphic contours, joyful saturated color, sweeping
    flare-like shapes, and lively shifts in scale and rhythm.
  subject_treatment: >-
    Keep the requested subject recognizable. Soften selected contours and apply rounded color
    shapes to existing forms without turning them into toys or characters.
  color_and_tone: >-
    Use vivid bubblegum pink, cyan, lemon yellow, and violet against clear dark anchors; keep
    color joyful and strongly separated.
  lighting_and_shadow: >-
    Set soft luminous gradients against crisp cel shadows, with broad bright accents that follow
    existing forms rather than adding cosmic effects.
  texture_and_material: >-
    Preserve the subject’s material beneath smooth gradients, clean highlight bands, and a few
    playful grain or sparkle-like marks.
  camera_and_composition: >-
    Honor the requested view. Use energetic curves and varied color scale inside the existing
    composition without adding planets or burst shapes.
  atmosphere_and_mood: >-
    Keep the mood buoyant, expansive, and sincere through saturated color, elastic line rhythm,
    and open spacing.
  rendering_and_quality: >-
    Combine smooth gradients, firm outlines, clear shadow blocks, and controlled bloom; prevent
    color from obscuring the silhouette.
  key_features: >-
    Elastic rounded contours; joyful saturated color; smooth flare-like gradients; lively scale
    rhythm.
  creative_brief: >-
    Preserve the prompt’s subject and setting. Apply rounded contours, joyful pop colors, and
    smooth luminous gradients; add no toy, planet, or cosmic scene.
