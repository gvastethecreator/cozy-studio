visualDna:
  aesthetic: 'Melting wax shrine: cramped altars heaped with candles that have burned for years, wax pouring over photographs, flowers and trinkets in frozen waterfalls.'
  subject_treatment: Surround the prompt's subject with candle shrines and flowing wax, keeping it clear in the warm pooled light.
  color_and_tone: Ivory and amber wax, deep red glass holders and black soot against warm flickering gold.
  lighting_and_shadow: Dozens of small candle flames casting warm shifting light and deep trembling shadows.
  texture_and_material: Layered dripping wax, soot-stained walls, faded photographs and dried flowers.
  camera_and_composition: Close cluttered framing with the altar filling the frame and darkness beyond.
  atmosphere_and_mood: Devotional, obsessive and claustrophobic, grief turned into ritual.
  rendering_and_quality: Rich warm painterly rendering with glowing flames and glossy wax detail.
  creative_brief: "Melting wax shrine: cramped altars heaped with candles that have burned for years, wax pouring over photographs, flowers and trinkets in frozen waterfalls. Carry it through years of melted candles, wax waterfalls, soot stains, faded photographs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: years of melted candles; wax waterfalls; soot stains; faded photographs
