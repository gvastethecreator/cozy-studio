visualDna:
  aesthetic: >-
    Inked anime forms combine organic contour flow, abrupt cross-lines, and separated color
    shapes.
  subject_treatment: >-
    Preserve the depicted subject; fragment marks only forms that already contain that
    structure.
  color_and_tone: >-
    Pine green, blue green, burnt vermilion, parchment, charcoal; warm note compact.
  lighting_and_shadow: >-
    Contained saturated accents over neutral shadows; imply no city, alarm, or night.
  texture_and_material: >-
    Irregular hatch on existing organic surfaces, smooth fills elsewhere; keep treatments
    distinct.
  camera_and_composition: >-
    Respect layout; directional negative space within existing forms, no scenery.
  atmosphere_and_mood: >-
    Contour contrast suggests unease only when fitting; no threat narrative.
  rendering_and_quality: >-
    Local distortion, readable silhouettes, purposeful marks, no blanket fragmentation.
  key_features: >-
    Organic-angular contour, pine-vermilion palette, localized hatch, controlled negative
    space
  creative_brief: >-
    Apply a visual treatment centered on organic-angular contour, pine-vermilion palette,
    localized hatch, controlled negative space. Preserve the exact subject, action, count,
    age, costume, setting, camera, and mood. Add nothing outside the prompt.
