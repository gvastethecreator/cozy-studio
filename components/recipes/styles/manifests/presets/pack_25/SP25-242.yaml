visualDna:
  aesthetic: 'Density Counterpoint Patterns: dense clusters and open fields alternate in rhythm while the motifs keep one size and the repeat stays seamless.'
  subject_treatment: Build a repeating surface from the prompt's subject where clusters and open fields alternate by spacing alone, every motif keeping its size.
  color_and_tone: A short palette where density reads through count and closeness alone.
  lighting_and_shadow: Flat surface with no focal light faking extra density.
  texture_and_material: Crisp motifs with inspectable intervals and a uniform support.
  camera_and_composition: Three rhythm zones per tile, dense, transition and open, linked across edges.
  atmosphere_and_mood: A counterpoint of breathing and gathering, calm and musical.
  rendering_and_quality: Clean repeat with no collisions and smooth changes of spacing.
  creative_brief: "Density Counterpoint Patterns: dense clusters and open fields alternate in rhythm while the motifs keep one size and the repeat stays seamless. Carry it through clusters and open fields, spacing rhythm, constant motif size, seamless. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: clusters and open fields; spacing rhythm; constant motif size; seamless
