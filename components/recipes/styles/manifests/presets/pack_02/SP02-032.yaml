visualDna:
  aesthetic: 'Painterly nature anime feature: simple cel characters set inside richly hand-painted, breathing landscapes of grass, cloud and forest.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Fresh greens, high summer blues, warm dappled golds; cels in soft flat color over dense watercolor-gouache backgrounds.
  lighting_and_shadow: Dappled sunlight through leaves, towering bright cumulus, soft two-tone cel shadow.
  texture_and_material: Visible brush texture in grass, bark and cloud; delicate pencil lines on characters.
  camera_and_composition: Wide landscape with small figures, wind visible in grass and hair, quiet pauses in the frame.
  atmosphere_and_mood: Gentle and wondrous, everyday magic breathing in the wind.
  rendering_and_quality: Hand-painted feature finish; original characters, no studio designs.
  key_features: hand-painted landscapes; small cel figures; wind in grass; dappled light; towering cumulus
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Painterly Nature Anime Feature as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - harsh digital gloss
  - ugly
