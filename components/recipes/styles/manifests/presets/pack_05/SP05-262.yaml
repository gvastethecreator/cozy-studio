visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around slightly varied hand-ink
    contours, short observational hatches, and restrained edge misregistration around
    the focal form. For color and surface, preserve local color identity in
    subdued slate, tobacco, and paper neutrals, reserving stronger hue for prompt-led
    accents. Make doubt legible through controlled ambiguity and quiet value shifts, not
    through an imposed threat or revelation
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through slightly varied hand-ink contours,
    short observational hatches, and restrained edge misregistration around the focal
    form; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; preserve local color identity
    in subdued slate, tobacco, and paper neutrals, reserving stronger hue for prompt-led
    accents. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use plausible, soft-edged
    value transitions with a few precise highlight cuts rather than theatrical beams.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine dry pencil grain with thin opaque ink;
    let materials remain distinct instead of coating everything in grime. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; hold the
    supplied perspective and spacing; use small shifts in edge clarity to imply
    scrutiny, not a new camera angle. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Make doubt legible through controlled
    ambiguity and quiet value shifts, not through an imposed threat or revelation.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and slightly varied hand-ink contours, short
    observational hatches, and restrained edge misregistration around the focal form;
    keep focal edges crisp, texture controlled, and dark values legible. Avoid photoreal
    or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    slightly varied hand-ink contours, short observational hatches, and restrained edge
    misregistration around the focal form; preserve local color identity in subdued
    slate, tobacco, and paper neutrals, reserving stronger hue for prompt-led accents;
    use plausible, soft-edged value transitions with a few precise highlight cuts rather
    than theatrical beams; combine dry pencil grain with thin opaque ink; let materials
    remain distinct instead of coating everything in grime; and hold the supplied
    perspective and spacing; use small shifts in edge clarity to imply scrutiny, not a
    new camera angle. The five cues should read as one mark-and-value system, not as
    extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use slightly varied hand-ink contours, short
    observational hatches, and restrained edge misregistration around the focal form,
    preserve local color identity in subdued slate, tobacco, and paper neutrals,
    reserving stronger hue for prompt-led accents, use plausible, soft-edged value
    transitions with a few precise highlight cuts rather than theatrical beams, and
    combine dry pencil grain with thin opaque ink; let materials remain distinct instead
    of coating everything in grime; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
