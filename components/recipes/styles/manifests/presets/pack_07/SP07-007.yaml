visualDna:
  aesthetic: 'Art Deco architecture: stepped setback massing, strong vertical piers, and ornament concentrated in spandrels, crowns and entrances as chevrons, zigzags, sunbursts and stylised relief.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Cream limestone or glazed terracotta with black granite base, polished nickel, brass and gold, emerald or jade accents; high contrast at entrances.
  lighting_and_shadow: Floodlighting from below at night grazing vertical piers, or crisp daylight picking out relief; stepped crowns lit against a dark sky.
  texture_and_material: Glazed terracotta and faience cladding, polished black granite, cast aluminium or nickel spandrel panels, etched glass, geometric terrazzo at entries.
  camera_and_composition: Keep the requested view; upward view emphasising verticality and setbacks, symmetrical entrance centred, ornament bands crisp.
  atmosphere_and_mood: Glamorous, optimistic and streamlined power reaching upward.
  rendering_and_quality: Sharp architectural photograph with clean geometric ornament and precise metal reflections, no signage lettering.
  key_features: stepped setback massing; vertical piers with chevron spandrels; sunburst crown; glazed terracotta and black granite; polished nickel and brass
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Art Deco as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
