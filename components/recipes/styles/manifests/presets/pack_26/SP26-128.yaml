visualDna:
  aesthetic: 'Hipgnosis and Storm Thorgerson cover look of the 1970s: surreal staged photographic concepts done for real in landscapes, burning men, floating objects and deadpan conceptual wit.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; stage the subject as a surreal real-world photographic concept in an open landscape. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Natural landscape photo color with one surreal element.
  lighting_and_shadow: Real natural daylight on staged surreal props, lit the way Hipgnosis lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Deadpan wide photographic concept, framed the way Hipgnosis composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with deadpan surreal wit.
  rendering_and_quality: Faithful seventies conceptual photo cover, in the recognizable hand of Hipgnosis.
  creative_brief: "Hipgnosis and Storm Thorgerson cover look of the 1970s: surreal staged photographic concepts done for real in landscapes, burning men, floating objects and deadpan conceptual wit. Carry it through Hipgnosis surreal photo concept, staged for real. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Hipgnosis surreal photo concept; staged for real
