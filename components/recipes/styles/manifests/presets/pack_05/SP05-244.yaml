  color_and_tone: Deep teal, vermilion, gold and jade with muted ink tones.
  lighting_and_shadow: Soft formal court light and misty mountain glow.
  texture_and_material: Refined fine line with painterly textile patterns and rhythmic robe folds.
  camera_and_composition: Formal court compositions and tall vertical figure framing.
  atmosphere_and_mood: Keep the requested mood with dignified solemn destiny.
  rendering_and_quality: Refined painterly fantasy illustration look with courtly elegance.
  key_features: Akihiro Yamada textiles; tall figures; court formality; jade and vermilion
  creative_brief: "Akihiro Yamada Twelve Kingdoms illustration look: tall elegant East Asian fantasy figures, rhythmic flowing textiles, formal court compositions and refined painterly color. Carry it through Akihiro Yamada textiles, tall figures, court formality, jade and vermilion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
