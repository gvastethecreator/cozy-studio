visualDna:
  aesthetic: 'Soft chalk pastel: powdery pigment rubbed and smudged into toothy colored paper, forms dissolving into velvety glow.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Muted pastel spectrum over a mid-tone blue or gray paper, warm glows against cool shadows.
  lighting_and_shadow: Diffuse low-contrast light, glowing halos rubbed in with a finger, soft edges everywhere.
  texture_and_material: Strong paper tooth catching pigment, smudge trails, powdery dust, colored paper showing through.
  camera_and_composition: Simple calm compositions with soft edges and large areas of blended sky or ground.
  atmosphere_and_mood: Nostalgic, calm and sleepy, a bedtime softness.
  rendering_and_quality: Velvety smudged finish with visible tooth; no pen line and no sharp edges.
  key_features: powdery chalk pastel; finger-smudged glows; colored paper showing through; soft edges; muted warm-cool palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chalk Pastel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
