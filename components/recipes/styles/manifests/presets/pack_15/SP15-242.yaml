visualDna:
  aesthetic: 'Cathedralpunk: rebel builders raising impossible gothic cathedrals from scrap, with flying buttresses of girders, stained glass from bottles and gargantuan spires.'
  subject_treatment: Keep the prompt's subject and setting; set it inside or beside towering scrap-built gothic cathedrals with colored glass and ribbed vaults.
  color_and_tone: Deep stone greys and rust with jewel-colored stained glass light in red, blue and gold.
  lighting_and_shadow: Colored light pouring through stained glass into dusty soaring interiors.
  texture_and_material: Stone, riveted girders, bottle glass, scaffolding, ropes and dust.
  camera_and_composition: Soaring vertical views up spires and down enormous naves.
  atmosphere_and_mood: Awe-struck and defiant, beauty built from the ruins of the old world.
  rendering_and_quality: Luminous detailed illustration with colored light shafts and deep scale.
  creative_brief: "Cathedralpunk: rebel builders raising impossible gothic cathedrals from scrap, with flying buttresses of girders, stained glass from bottles and gargantuan spires. Carry it through scrap buttresses, bottle-glass windows, soaring spires, colored light shafts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: scrap buttresses; bottle-glass windows; soaring spires; colored light shafts
