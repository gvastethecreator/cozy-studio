visualDna:
  aesthetic: >-
    Topographic Map becomes a transferable diagram and information-graphic system: start from
    Elevation contour lines and Contours, then route prompt content through schematic paths, encoded
    blocks, contour logic, technical marks, and data-like organization without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Wavy parallel lines to map, route, blueprint,
    annotate, contour, grid, or encode prompt subjects as information structure; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Line art; use palette as functional coding: substrate, traces, line
    hierarchy, contrast fields, or chalk/paper logic, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: keep light diagrammatic, flat, backlit, chalky, or technical
    so structure remains readable, avoiding generic glamour lighting unless the prompt explicitly
    asks for it.
  texture_and_material: >-
    Render Paper as the tactile or mark-making basis; marks should feel like ink, chalk, copper,
    pixels, contour lines, drafting strokes, or printed substrate, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Contours as reusable spatial grammar: favor legible routes, modules, legends
    without readable text, edge registration, grids, and information density, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Exploration as the emotional register; derive mood from analysis, navigation, computation,
    instruction, secrecy, or handmade classroom energy, without flattening strong, strange, darker,
    or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Contour-line abstraction: finish with clean information hierarchy, exact line weight,
    and no random label soup, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Elevation contour lines; Wavy parallel lines; Line art; Flat; Paper; Contours; Exploration;
    Contour-line abstraction; Contours
  creative_brief: >-
    Apply topographic contour logic over the input with wavy parallel lines, nested elevation bands,
    paper-map flatness, and geographic rhythm that behaves like fingerprints. If terrain exists,
    describe it; otherwise contour the subject's planes and volumes without requiring mountains or a
    literal map.
avoidRules:
  - straight lines
  - random text labels
  - unreadable diagram clutter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
