visualDna:
  aesthetic: >-
    Shallow overlapping planes and small offset edges create a cut-paper visual rhythm, with compact
    contact shadows and broad color shapes.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use overlap cues only where existing
    forms already meet; do not separate the subject into arbitrary cutouts.
  color_and_tone: >-
    Retain the requested palette and color relationships. Keep color areas broad and flat without
    reducing the image to a few paper hues.
  lighting_and_shadow: >-
    Follow the requested external light direction and contrast. Use small contact shadows at existing
    overlaps without adding a backlight or equal shadow beneath every form.
  texture_and_material: >-
    Keep fiber subtle and edges clean, with slight irregularity only where the drawn form calls for it.
    Preserve depicted materials rather than turning every surface into paper.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Layered edges do not create a page,
    frame, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Overlap cues affect depth within the image without changing
    the scene or introducing a display context.
  rendering_and_quality: >-
    Resolve silhouette and color areas first, then use thin edge offsets and contact shadows selectively.
    Preserve fine identity details and avoid floating pieces.
avoidRules:
  - arbitrary layer separation or floating pieces
  - uniform long shadows below every form
  - unrequested frame, lettering or layout
