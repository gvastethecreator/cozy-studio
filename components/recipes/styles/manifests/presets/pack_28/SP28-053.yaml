  aesthetic: 'Fifties tin robot design language: boxy rounded robots with dials, antennas, piston arms, rivets, clear domes and pulp science fiction charm.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; rebuild the subject as a boxy retro robot with dials, antennas and piston arms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Candy red, silver and turquoise, true to the Retro Tin Robot palette.
  lighting_and_shadow: Warm retro product light, lit the way Retro Tin Robot lights its scenes.
  texture_and_material: Printed tin and rivets, with the surface finish of Retro Tin Robot.
  camera_and_composition: Frontal retro presentation, framed the way Retro Tin Robot composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with optimistic retro charm.
  rendering_and_quality: Retro tin robot presentation, in the recognizable hand of Retro Tin Robot.
  creative_brief: 'Fifties tin robot design language: boxy rounded robots with dials, antennas, piston arms, rivets, clear domes and pulp science fiction charm. Carry it through Tin robot language, dials, antennas, pistons. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
