visualDna:
  aesthetic: 'Old-Hollywood-meets-magazine glamour: sculpted beauty light, luxurious styling, and a posed, idealized presence built for a cover.'
  subject_treatment: Pose the subject with elongated neck, deliberate hands and a confident gaze; hair, makeup and wardrobe are styled and immaculate.
  color_and_tone: Rich jewel tones or deep monochrome backdrops, luminous skin, glossy highlights, deep saturated accents.
  lighting_and_shadow: Butterfly or loop key from a beauty dish, reflector fill under the chin, strong hair light and a glowing rim that separates the silhouette.
  texture_and_material: Velvet, satin, sequins, pearls and glossy lips rendered with sparkle; skin refined but still dimensional.
  camera_and_composition: 85–135 mm, slightly low or eye-level, waist-up or three-quarter crop with space for the pose.
  atmosphere_and_mood: Seductive confidence, opulence, and star power.
  rendering_and_quality: High-gloss magazine finish with specular sparkle and controlled retouching.
  creative_brief: "Old-Hollywood-meets-magazine glamour: sculpted beauty light, luxurious styling, and a posed, idealized presence built for a cover. Carry it through beauty-dish butterfly light, glowing rim, jewel-tone styling, sculpted pose, specular sparkle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: beauty-dish butterfly light; glowing rim; jewel-tone styling; sculpted pose; specular sparkle
