visualDna:
  aesthetic: 'Contour-Locked Miniatures: a simple calm outer mass with all functional detail gathered in one limited focal area.'
  subject_treatment: Keep the prompt's subject with a simple outer contour and concentrate its functional detail in one limited region, about a third of the icon.
  color_and_tone: High-contrast silhouette with the detail in a subordinate tonal range.
  lighting_and_shadow: One soft light for the outer volume and a focused light only on the detail.
  texture_and_material: Sober surfaces with minimal grain and fine detail only in the focus zone.
  camera_and_composition: Compact object with its detail gathered in one region.
  atmosphere_and_mood: Overall calm with local discovery where the eye lands.
  rendering_and_quality: The miniature reads at small size even when the focal detail disappears.
  creative_brief: "Contour-Locked Miniatures: a simple calm outer mass with all functional detail gathered in one limited focal area. Carry it through simple outer mass, one detail zone, calm silhouette, local discovery. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: simple outer mass; one detail zone; calm silhouette; local discovery
