visualDna:
  aesthetic: 'Asymmetric Module Families: one deliberately lopsided module assembles into several related signs with visible family resemblance.'
  subject_treatment: Build the prompt's subject or each requested sign from one irregular primitive, changing how it assembles rather than only rotating it; set requested names exactly.
  color_and_tone: One main color identifies the system, and each variant stands apart first by structure.
  lighting_and_shadow: Flat graphic planes, with plane relationships designed into the module itself.
  texture_and_material: Flat geometry with one signature corner, slope or concavity always recognizable.
  camera_and_composition: Each assembly balanced by its optical center, in an even comparison row.
  atmosphere_and_mood: Obvious kinship with distinct results, the asymmetry keeping repetition alive.
  rendering_and_quality: Clean assemblies with the module trait intact and every accidental gap removed.
  creative_brief: "Asymmetric Module Families: one deliberately lopsided module assembles into several related signs with visible family resemblance. Carry it through lopsided module, varied assembly, family resemblance, optical balance. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: lopsided module; varied assembly; family resemblance; optical balance
