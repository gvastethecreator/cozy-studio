  aesthetic: 'Madhouse Record of Lodoss War OVA look (1990) with Nobuteru Yuki designs: classic tabletop high fantasy, detailed armor, elves and dwarves, painterly castles and tapestry-like grandeur.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Nobuteru Yuki designs, elegant elves, sturdy dwarves, detailed plate armor and flowing cloaks. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Forest green, royal blue, gold, steel and warm tapestry reds.
  lighting_and_shadow: Soft painterly fantasy light over forests and dramatic dusk on castles.
  texture_and_material: Hand-painted cel with painterly castle and forest backgrounds.
  camera_and_composition: Classic heroic party compositions and grand painted fantasy vistas.
  atmosphere_and_mood: Keep the requested mood with classic heroic quest.
  rendering_and_quality: Rich 1990 Madhouse OVA frame with tapestry-like fantasy grandeur.
  key_features: Lodoss classic fantasy; Nobuteru Yuki elves; detailed armor; tapestry
  creative_brief: "Madhouse Record of Lodoss War OVA look (1990) with Nobuteru Yuki designs: classic tabletop high fantasy, detailed armor, elves and dwarves, painterly castles and tapestry-like grandeur. Carry it through Lodoss classic fantasy, Nobuteru Yuki elves, detailed armor, tapestry. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
