id: pack_27
name: Decade Screens
cardTitle: Decade Screens
cardDescription: Horror cinema of the 70s, 80s and 90s and video games of the 80s, 90s and 2000s, named after their films, games and makers.
description: >-
  Screen eras rebuilt from their real production looks: horror films by decade with their film
  stocks, lighting and effects, and video games by decade with their hardware, rendering and art
  direction. Requested subjects stay the subject; each style changes medium, era and finish.
