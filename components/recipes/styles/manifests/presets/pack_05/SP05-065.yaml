  aesthetic: 'Norihiro Yagi Claymore manga look: pale silver-eyed warrior women, huge slim claymores, medieval towns haunted by monsters, and cold clean line with horror undertones.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw only adults with Yagi designs, pale hair, silver eyes, slim armored bodies and cloaks. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pale silver, grey, cold blue and bone white.
  lighting_and_shadow: Cold pale overcast light and an eerie silver glow in the eyes.
  texture_and_material: Clean cold pen line with smooth grey tone and pale highlights.
  camera_and_composition: Stoic lone warrior compositions and sudden monster reveals in villages.
  atmosphere_and_mood: Keep the requested mood with pale threshold horror.
  rendering_and_quality: Cold clean dark fantasy manga illustration with pale horror.
  key_features: Norihiro Yagi pale warriors; silver eyes; cold line; monsters
  creative_brief: "Norihiro Yagi Claymore manga look: pale silver-eyed warrior women, huge slim claymores, medieval towns haunted by monsters, and cold clean line with horror undertones. Carry it through Norihiro Yagi pale warriors, silver eyes, cold line, monsters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
