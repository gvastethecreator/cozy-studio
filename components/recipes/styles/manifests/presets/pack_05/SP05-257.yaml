visualDna:
  aesthetic: 'Spare cool-toned anime cel: dry economical lineart, broad slate flats and exactly one violet accent that carries all the color in the frame.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Reduce internal detail to a few decisive lines; the violet accent lands on something already in the prompt, never on an added token or prop.
  color_and_tone: Slate, cold blue-grey and ink navy desaturated to near monochrome, broken by a single saturated violet shape.
  lighting_and_shadow: Low even moon-cool ambient light with one narrow white highlight on the focal edge; shadows are one flat darker slate.
  texture_and_material: Smooth restrained flats and dry, slightly broken line ends, with no grain and no glow anywhere.
  camera_and_composition: Keep the requested view; wide horizontal negative space with the focal subject off-center on a strong horizon line.
  atmosphere_and_mood: Wry, poised and quiet, a composed calm with a hint of irony.
  rendering_and_quality: Sparse detail, exact focal edges and one accent heavy enough to hold the whole frame.
  key_features: near-monochrome slate palette; single violet accent; dry economical line; wide horizontal negative space; one narrow highlight
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Slate Twilight Single-Violet Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
