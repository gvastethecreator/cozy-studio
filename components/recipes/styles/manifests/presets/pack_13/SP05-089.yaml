visualDna:
  aesthetic: 'Smooth ink contours drift by a fraction at selected edges, while main forms and shadow masses remain calm, complete, and legible.'
  subject_treatment: "Keep the user's exact forms, anatomy, pose, and count; allow a slight edge echo without warping proportions or duplicating a shape."
  color_and_tone: "Use quiet middle values with a narrow cool or warm tint at the edges; honor the prompt's colors and avoid automatic desaturation."
  lighting_and_shadow: 'Keep light direction stable and shadows soft-edged; edge echoes must not read as a second light source or reflected object.'
  texture_and_material: 'Use smooth matte fills with a few irregular boundary marks; do not apply the same distortion across every surface.'
  camera_and_composition: 'Maintain framing, viewpoint, scale, and spacing; make slight dislocation a contour event, not a camera or layout change.'
  atmosphere_and_mood: 'Preserve the requested emotion; quiet line drift may feel unusual without forcing deadpan humor or surreal content.'
  rendering_and_quality: 'Keep silhouettes and focal details crisp; use small controlled edge variation against otherwise stable drawing.'
  key_features: 'Calm continuous silhouettes; slight contour drift; soft shadow edges; localized boundary irregularity; stable interior forms.'
  creative_brief: 'Introduce restrained contour drift while leaving shapes intact and readable. Keep subject, action, count, camera, and mood from the prompt; add no surreal object or duplicate.'
