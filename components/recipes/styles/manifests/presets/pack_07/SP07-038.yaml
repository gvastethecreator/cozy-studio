visualDna:
  aesthetic: 'Ossuary subterranean architecture: chambers carved into chalk, tuff or limestone, with low compressed barrel vaults and walls of empty stacked niches, crusted with calcite.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Chalk white, bone-cream and ochre stone, grey mortar, dark soot above lamp niches, warm small light against cold stone.
  lighting_and_shadow: Lanterns or candles in niches as the only source, warm falloff into darkness within a few metres, soft round shadows in each niche.
  texture_and_material: Pick-marked carved stone, calcite drip crusts and flowstone, dusty lime mortar, damp mineral bloom, worn stair treads cut into rock.
  camera_and_composition: Keep the requested view; low vaults pressing the top of the frame, rhythm of niches along the wall, no endless tunnel.
  atmosphere_and_mood: Silent, buried and ancient, cool air far below ground.
  rendering_and_quality: Low-light photograph with carved tool marks and mineral crust detail, niches empty, no human remains or horror display.
  key_features: carved chalk and tuff chambers; low compressed barrel vaults; walls of empty stacked niches; calcite crust; lantern-only light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ossuary Subterranean as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
