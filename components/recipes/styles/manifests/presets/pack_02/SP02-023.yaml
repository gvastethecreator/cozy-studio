  camera_and_composition: Handheld, zoom wobble, family members crowding and waving at the lens.
  atmosphere_and_mood: Tender and chaotic, family memory in a warm fuzz.
  rendering_and_quality: Consumer VHS signal; a date stamp or REC mark only as unreadable shapes.
