visualDna:
  aesthetic: 'Real-time game asset presentation: a single prop built to a polygon budget, its fine detail baked into normal maps and textured with metal-roughness PBR maps.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the single-asset presentation on a neutral grey backdrop with a soft ground shadow, one object in one three-quarter view. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Albedo colors kept flat and mid-value with no baked lighting; metals dark in albedo and bright only in their reflections.
  lighting_and_shadow: Neutral studio HDRI with a soft key and a cool rim, the even viewer lighting that shows roughness variation honestly.
  texture_and_material: Baked normal-map bevels on straight low-poly edges, trim-sheet panel strips, roughness breakups and edge wear painted into texture only.
  camera_and_composition: Asset centered in a three-quarter view with generous margin; large curves show a faint polygon straightness in silhouette.
  atmosphere_and_mood: Functional and proud, a finished piece ready to drop into a level.
  rendering_and_quality: Real-time shading look with sharp texel-level detail, no path-traced caustics, no motion blur and no scene clutter.
  key_features: polygon-budget silhouette; baked normal-map bevels; metal-roughness PBR; trim-sheet strips; neutral viewer lighting
  creative_brief: "Real-time game asset presentation: a single prop built to a polygon budget, its fine detail baked into normal maps and textured with metal-roughness PBR maps. Carry it through polygon-budget silhouette, baked normal-map bevels, metal-roughness PBR, trim-sheet strips, neutral viewer lighting. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
