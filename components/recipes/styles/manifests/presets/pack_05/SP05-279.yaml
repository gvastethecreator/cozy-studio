visualDna:
  aesthetic: Graphite noir anime rendering with a narrow selective-focus band that sharpens a few contours to razor precision while the rest softens, punctuated by pinpoint red speculars.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Graphite and cool neutral grays; red appears only as two or three pinpoint speculars.
  lighting_and_shadow: Low-key directional light with precise red reflections where real surfaces in the scene would catch it.
  texture_and_material: Subdued matte planes, smooth graphite blending and occasional clean glints; no scanlines.
  camera_and_composition: Keep the requested framing; a horizontal band of sharp focus crosses the focal area like a tilted lens plane.
  atmosphere_and_mood: Watchful, cold attention in which everything feels observed.
  rendering_and_quality: A crisp band against soft falloff, with no scan effects, screens or interface graphics.
  key_features: selective-focus sharp band; pinpoint red speculars; graphite grays; low-key directional light; soft falloff outside the band
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Red-Optic Security Noir Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
