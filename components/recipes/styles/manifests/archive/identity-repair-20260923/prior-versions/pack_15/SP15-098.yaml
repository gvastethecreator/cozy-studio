visualDna:
  aesthetic: >-
    Icepunk uses compressed frost planes, wind-cut facets and a few decisive fracture seams, balanced by
    a small warm-cold value contrast.
  subject_treatment: >-
    Preserve the requested subject, shape and action; apply frost facets or fracture marks only where
    compatible, without turning it into a ship or expedition.
  color_and_tone: >-
    Respect requested colors; favor glacier whites and blue-gray depth planes, with a restrained warm
    accent only when it clarifies the composition.
  lighting_and_shadow: Follow the requested light; use crisp cool shadow cuts and no added lantern or internal glow.
  texture_and_material: >-
    Keep materials distinct; reserve frosted translucency, matte ice grain and fracture edges for ice or
    compatible surfaces.
  camera_and_composition: >-
    Preserve viewpoint and crop; arrange a few compressed facets and diagonal seams without requiring a
    polar landscape.
  atmosphere_and_mood: >-
    Suggest pressure, cold resilience and quiet shelter through value compression while keeping the
    requested tone.
  rendering_and_quality: >-
    Use large clear ice planes and a few controlled fractures; avoid fine crack webs, all-over frost and
    detail that dissolves at thumbnail size.
avoidRules:
  - Do not add ships, harbors, lanterns or polar-exploration equipment unless requested.
  - Do not frost materials that are not ice or explicitly compatible.
  - Avoid dense crack networks and automatic blue light.
