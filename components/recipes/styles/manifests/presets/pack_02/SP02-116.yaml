visualDna:
  aesthetic: >-
    Use this drawing language: Gentle notebook-cartoon language with soft marker color, simple
    ink contours, awkward posture cues, quiet flat space, and optional dreamlike overlays. Apply
    it to the supplied content without requiring a particular cast, place, or story.
  subject_treatment: >-
    Apply soft simple ink, diary-doodle contours, awkward posture marks, and gentle daydream
    curves to the supplied subject while preserving its identity, silhouette, requested action,
    actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: >-
    Use notebook teal, soft marker purple, muted peach, pale yellow, faded red, and paper cream
    as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use flat friendly fill with soft low-contrast glow accents as a visual treatment, while
    respecting any lighting instructions in the request.
  texture_and_material: >-
    Render notebook-paper tooth, soft marker fill, light scan grain, and softened cel color as
    drawn or printed surface marks over the existing material; do not change the subject's
    actual substance or function.
  camera_and_composition: >-
    Use notebook-like negative space and soft overlay shapes as optional organization; render
    text only when requested.
  atmosphere_and_mood: >-
    Soft, bashful, and wistful; preserve the mood without assigning an age or life situation.
  rendering_and_quality: >-
    Finish with soft marker fill, paper grain, simple ink contours, and gentle transitions.
  key_features: >-
    soft marker color; simple ink contour; awkward pose cues; quiet flat space; optional
    daydream overlays
  creative_brief: >-
    Render the supplied content with soft simple ink, diary-doodle contours, awkward posture
    marks, and gentle daydream curves. Use notebook teal, soft marker purple, muted peach, pale
    yellow, faded red, and paper cream as style colors while honoring any explicit color
    instructions. Apply notebook-paper tooth, soft marker fill, light scan grain, and softened
    cel color as drawn or printed marks over the existing material, without changing what the
    subject is made of or how it functions. Preserve the requested subject, action, and setting;
    follow the supplied composition and add no unrequested cast, location, lettering, or gag.
