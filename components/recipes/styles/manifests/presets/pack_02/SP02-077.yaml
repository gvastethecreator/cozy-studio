visualDna:
  aesthetic: 'Underwater light: sunlight refracted through a rippling surface, throwing moving caustic nets across everything below.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Cyan and aqua attenuation, warm tones dropping away with depth.
  lighting_and_shadow: Dappled caustic patterns moving over subjects and floor, sunbeams from above.
  texture_and_material: Floating particles, rising bubbles and slowly drifting hair and fabric.
  camera_and_composition: Keep the requested framing; caustics visible on the subject.
  atmosphere_and_mood: Weightless and serene, sound and time slowed down.
  rendering_and_quality: Real underwater light behavior; a lighting modifier, not a nature scene.
  key_features: moving caustic nets; sunbeams from the surface; cyan attenuation; floating particles; drifting fabric
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Underwater Light as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
