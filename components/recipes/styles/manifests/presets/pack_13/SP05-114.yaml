visualDna:
  aesthetic: 'Gonzo Gankutsuou look (2004) by Mahiro Maeda: characters filled with static textile patterns, ornate fabric textures and baroque sci-fi opulence.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Maeda designs whose clothes and hair are filled with flat static textile patterns. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Ornate jewel textile colors, true to the Gankutsuou Gonzo palette.
  lighting_and_shadow: Opulent theatrical light, lit the way Gankutsuou Gonzo lights its scenes.
  texture_and_material: Static textile patterns inside shapes, with the surface finish of Gankutsuou Gonzo.
  camera_and_composition: Baroque opulent compositions, framed the way Gankutsuou Gonzo composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with opulent patterned intrigue.
  rendering_and_quality: Patterned textile animation frame, in the recognizable hand of Gankutsuou Gonzo.
  key_features: Gankutsuou textiles; static patterns; baroque
  creative_brief: "Gonzo Gankutsuou look (2004) by Mahiro Maeda: characters filled with static textile patterns, ornate fabric textures and baroque sci-fi opulence. Carry it through Gankutsuou textiles, static patterns, baroque. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
