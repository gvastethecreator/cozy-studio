visualDna:
  aesthetic: 'Live-house punk anime of raw feedback: tiny stages, crowd surfing, sweat, cables and sound drawn as jagged noise.'
  subject_treatment: Keep the prompt's subject and action; put it in a cramped live-house show with noise, sweat and bodies pressed close.
  color_and_tone: Harsh red and green stage lights, black walls and sweat highlights.
  lighting_and_shadow: Cheap colored stage lights, strobe flashes and deep shadows in the crowd.
  texture_and_material: Sweat, torn shirts, amp grilles and tangled cables with jagged sound lines.
  camera_and_composition: Chaotic low angles from the crowd and close stage-edge shots.
  atmosphere_and_mood: Raw and loud, a sweaty room of young people shouting the same words.
  rendering_and_quality: Rough energetic anime with jagged noise effects and harsh lighting.
  key_features: jagged noise lines; crowd surfing; colored stage lights; cramped stage
  creative_brief: "Live-house punk anime of raw feedback: tiny stages, crowd surfing, sweat, cables and sound drawn as jagged noise. Carry it through jagged noise lines, crowd surfing, colored stage lights, cramped stage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
