visualDna:
  aesthetic: 'Rough-key action animation drawing: blue construction pencil left under black cleanup line, smear-frame distortions, and painted spark dots on impact.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Iron, dusty ochre, rust and charcoal cel fills with blue pencil showing through and bright amber spark dots.
  lighting_and_shadow: Firm cel shadows and short warm glints; impact flashes drawn as flat amber shapes with black outlines.
  texture_and_material: Visible pencil tooth, loose blue construction lines, scribbled hatching and dented-edge contour breaks.
  camera_and_composition: Keep the requested view; stretch the moving part of the subject into a smear frame along its arc of motion.
  atmosphere_and_mood: Scrappy, determined and kinetic, a thing held together by will.
  rendering_and_quality: Keyframe rough energy with blue under-pencil, confident black line, smear distortion and spark dots; not a polished final cel.
  key_features: blue construction pencil under black line; smear-frame distortion; amber spark dots; iron and rust cel fills; scribbled hatching
  creative_brief: "Rough-key action animation drawing: blue construction pencil left under black cleanup line, smear-frame distortions, and painted spark dots on impact. Carry it through blue construction pencil under black line, smear-frame distortion, amber spark dots, iron and rust cel fills, scribbled hatching. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
