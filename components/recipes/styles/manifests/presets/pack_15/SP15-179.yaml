  aesthetic: 'Mothpunk: a nocturnal culture drawn to light, with dusty moth-wing cloaks, lamp cults, night markets and delicate feathered antennae.'
  subject_treatment: Keep the prompt's subject and setting; make it nocturnal and moth-like, drawn to lamps, with powdery wings and soft fur.
  color_and_tone: Dusty greys, browns and pale lunar greens with warm lamp gold.
  lighting_and_shadow: Single lamps in darkness with moths swirling in halos around them.
  texture_and_material: Powdery wing scales, soft fur, feathered antennae and paper lanterns.
  camera_and_composition: Figures circling light sources in otherwise dark scenes.
  atmosphere_and_mood: Soft and obsessive, beauty that cannot stay away from the flame.
  rendering_and_quality: Delicate low-key illustration with powdery textures and glowing lamps.
  creative_brief: "Mothpunk: a nocturnal culture drawn to light, with dusty moth-wing cloaks, lamp cults, night markets and delicate feathered antennae. Carry it through moth-wing cloaks, lamp halos, feathered antennae, nocturnal glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
