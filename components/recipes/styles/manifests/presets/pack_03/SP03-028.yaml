visualDna:
  aesthetic: 'NURBS class-A surfacing: the subject modeled from perfectly smooth mathematical curves, with continuous reflections revealing flawless curvature.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Glossy neutral or single paint color, clean white reflections.
  lighting_and_shadow: Striped studio lights producing zebra-like reflection lines that flow without breaks.
  texture_and_material: Mirror-smooth surfaces, sharp controlled creases, no polygon facets.
  camera_and_composition: Keep the requested view; surfaces turned to show the reflection flow.
  atmosphere_and_mood: Precise and elegant, with the calm of perfect industrial design.
  rendering_and_quality: Continuous-curvature surfaces whose reflection lines never break or kink.
  key_features: mathematically smooth surfaces; zebra reflection stripes; continuous curvature; crisp creases; glossy finish
  creative_brief: "NURBS class-A surfacing: the subject modeled from perfectly smooth mathematical curves, with continuous reflections revealing flawless curvature. Carry it through mathematically smooth surfaces, zebra reflection stripes, continuous curvature, crisp creases, glossy finish. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
