visualDna:
  aesthetic: "Candlelight: small warm flames as the only source, falling off within an arm's length into velvety darkness."
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Deep orange and amber near the flame, rapid fall to brown-black; very low color temperature.
  lighting_and_shadow: Low point sources close to the subject, strong inverse-square falloff, flickering soft shadows, bright specks in eyes.
  texture_and_material: Wax, glass, skin and fabric glowing warmly; smoke threads visible.
  camera_and_composition: Keep requested framing; place at least one flame visible or clearly motivating the light.
  atmosphere_and_mood: Intimate and hushed, darkness pressing close around a small warm circle.
  rendering_and_quality: Clean low-light exposure with rich blacks, no gray noise.
  key_features: flame-only light; steep falloff; amber glow; velvety black; visible candle
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Candlelight as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
