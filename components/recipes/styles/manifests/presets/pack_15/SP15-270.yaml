  color_and_tone: Burnished bronze gold and copper with green verdigris patina and warm sunlit stone.
  lighting_and_shadow: Bright Mediterranean sun glinting on polished bronze, foundry fire at night.
  texture_and_material: Cast bronze, hammered sheet, verdigris, clay molds, linen and limestone.
  camera_and_composition: Heroic frontal compositions of gleaming machines and figures.
  atmosphere_and_mood: Proud, radiant and ancient, an empire of shining metal.
  rendering_and_quality: Gleaming detailed illustration with polished metal and patina.
