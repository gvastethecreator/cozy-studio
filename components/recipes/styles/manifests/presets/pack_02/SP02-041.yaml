visualDna:
  aesthetic: 'Rotoscoped animation: live-action footage traced frame by frame into posterized flat shapes with trembling outlines.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Posterized color blocks with slightly unnatural hues, few gradients.
  lighting_and_shadow: Real footage lighting reduced to two or three flat shadow bands.
  texture_and_material: Line boil, wobbling contours and shifting fills from frame to frame.
  camera_and_composition: Live-action camera framing and realistic movement, traced into drawing.
  atmosphere_and_mood: Uncanny and dreamy, as if reality itself were slightly unstable.
  rendering_and_quality: Traced-over realism with flat shapes; not smooth 3D or clean vector.
  key_features: traced live-action motion; posterized color blocks; line boil; flat shadow bands; uncanny realism
  creative_brief: "Rotoscoped animation: live-action footage traced frame by frame into posterized flat shapes with trembling outlines. Carry it through traced live-action motion, posterized color blocks, line boil, flat shadow bands, uncanny realism. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
