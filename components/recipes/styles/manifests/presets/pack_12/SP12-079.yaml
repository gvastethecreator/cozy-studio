visualDna:
  aesthetic: >-
    Source-informed video-game style router for original third-person co-op extraction shooter
    captures: orbital drop chaos, squad spacing, defensive objectives, projectile storms, alien or
    machine pressure, call-in effects, and readable retreat/hold routes. Borrow the co-op
    battlefield clarity of Helldivers-like games, but land as a different fictional drop-war game
    with different armor, factions, enemies, UI icons, and objective props.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable third-person co-op hold screenshot
    subject: keep clear squad/object/threat function, cover, objective zone, incoming pressure,
    call-in area, and extraction route without copying source factions or armor.
  color_and_tone: >-
    Use an orbital drop palette: dusty battlefield tan, warning red, tactical blue, smoke grey,
    muzzle orange, alien green, and hard white objective light. Keep value grouping legible amid
    chaos.
  lighting_and_shadow: >-
    Light the image through orbital strike glare, muzzle flashes, smoke, bug acid glow, objective
    beacon light, and dusty sun haze. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from tactical armor, alien carapace, mud, concrete outposts, spent shells, smoke,
    and sci-fi military equipment. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person squad camera, objective hold zone, ally/enemy spacing, incoming
    projectile arcs, cover, and one clear defend/extract decision. Avoid isometric strategy
    overview.
  atmosphere_and_mood: >-
    Carry an original orbital-drop mood: loud, desperate, satirical, militarized, cooperative, and
    explosive.
  rendering_and_quality: >-
    Finish as coherent third-person co-op shooter screenshot style, not concept art: small
    contextual HUD, ammo/ability pips, objective icons, and call-in markers can appear abstractly.
    Maintain heavy-denoise clarity and no exact stratagem UI.
  key_features: >-
    Helldivers 2 gameplay screenshots; third-person co-op shooter capture with squad spacing, alien
    swarms, stratagem chaos, defensive objectives, and friendly-fire battlefield readability; dusty
    battlefield tan, black armor, yellow hazard UI, bug green, red warning lasers, and explosion
    orange; orbital strike glare, muzzle flashes, smoke, bug acid glow, objective beacon light, and
    dusty sun haze; tactical armor, alien carapace, mud, concrete outposts, spent shells, smoke, and
    sci-fi military equipment; third-person squad camera with objective zone, incoming swarm lanes,
    teammate markers, stratagem impact areas, and extraction pressure; chaotic, militarized,
    satirical, desperate, and cooperative; HUD guidance: co-op HUD is welcome: ammo, stratagem
    inputs, objective timer, squad icons, compass, and extraction markers
  creative_brief: >-
    Use Orbital Drop Citadel Hold as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through third-person co-op extraction references: squad camera, objective
    pressure, orbital call-ins, projectile chaos, and readable hold/extract decisions. Avoid direct
    Helldivers cloning, strategy-tactics camera, exact armor/faction silhouettes, and exact
    stratagem UI.
