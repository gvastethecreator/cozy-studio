visualDna:
  aesthetic: 'Near-Far Legibility Trial: one sign shown from a near and a far viewpoint and at an angle, the same artwork and size in every view.'
  subject_treatment: Show the prompt's sign from a near view, a far view and an oblique view, with the same artwork, size and surroundings in each.
  color_and_tone: Original sign colors plus one extra greyscale test view.
  lighting_and_shadow: The available site light, other conditions noted as pending.
  texture_and_material: Constant support and finish with reflections left in place.
  camera_and_composition: Declared test cameras plus a frontal control view.
  atmosphere_and_mood: A progressive reading from far recognition to near detail.
  rendering_and_quality: Clean sheet with identical geometry in every view.
  creative_brief: "Near-Far Legibility Trial: one sign shown from a near and a far viewpoint and at an angle, the same artwork and size in every view. Carry it through near, far and oblique, same sign, greyscale test, control view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: near, far and oblique; same sign; greyscale test; control view
