visualDna:
  aesthetic: 'Reaction-diffusion: labyrinthine Turing patterns of spots and stripes forming the subject.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is filled and shaped by Turing-pattern spots and maze stripes."
  color_and_tone: Two-tone contrast, used consistently across subject and background.
  lighting_and_shadow: Flat, expressed through the style rather than photographic lighting.
  texture_and_material: Maze-like stripes and spots, visible at card size as the signature of the style.
  camera_and_composition: Pattern fill following contours, arranged so the subject still reads at card size.
  atmosphere_and_mood: Organic, mathematical, alien and precise, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp finish, with clean, deliberate marks and no accidental noise.
  key_features: Turing patterns; maze stripes; spots
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Reaction Diffusion as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
