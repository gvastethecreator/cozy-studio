visualDna:
  aesthetic: >-
    Layer cool, faded forms through analogue distance: soft atmospheric separation, muted
    retrofuture color and a restrained film-like grain, without requiring machines or a city.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: favor muted steel blue, cyan and
    violet with gentle value falloff; retain any prompt-specified focal color.
  lighting_and_shadow: >-
    Use diffused, low-contrast light and distant haze only where the scene supports depth; respect
    the prompted illumination.
  texture_and_material: >-
    Apply fine analogue grain and softened far contours, keeping near details and actual materials
    readable.
  camera_and_composition: >-
    Create depth through layered value and edge softness, not added architecture or a forced wide
    shot.
  atmosphere_and_mood: >-
    Melancholy comes from distance and faded color; preserve the prompt's emotional register.
  rendering_and_quality: >-
    Transfer the distance treatment to any subject without adding technology, skyline, vehicle or
    retro props. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Muted retrofuture palette; analogue grain; layered distance; softened far contours; quiet
    atmospheric separation.
  creative_brief: 'Apply this visual treatment to the requested content: Muted retrofuture palette; analogue grain; layered distance; softened far contours; quiet atmospheric separation. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - flattened depth obscuring layered distance
  - grain obscuring near-form contours
  - blur collapsing near/far separation
