visualDna:
  aesthetic: >-
    Silverpoint acts as a transferable art-medium router: start from Renaissance metal stylus
    drawing, Fine lines and drawing-media system built from mark pressure, line economy, paper
    tooth, erasure, hatching, dust, and tool-specific edge behavior, then apply the medium behavior
    to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Extremely fine grey lines; preserve the prompt subject
    while rebuilding it through line weight, contour, hatch density, smudge, scratch, wax, stylus,
    or marker stroke logic, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Pale grey, tarnished warm tone; treat color as tool-limited material: graphite
    value, charcoal black, ink density, sanguine earth, wax pencil, marker bleed, chalk dust, or
    metallic trace, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Delicate; represent light through mark spacing, exposed paper, tonal
    rubbing, crosshatch density, erased highlights, or flat diagrammatic value control, so value
    structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Prepared ground (bone ash); make paper grain, tooth, dust, ink bite, wax buildup, scratch
    coating, vellum smoothness, or marker streaks visible at the right scale, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Compose for Silverpoint using its key spatial cues: Fine lines;
    structure forms through line rhythm, gesture, technical geometry, blank space, contour
    continuity, and readable silhouette logic, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Antique, delicate; derive mood from study, immediacy, precision, roughness,
    temporary mark-making, craft intimacy, or disciplined draftsmanship, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Renaissance informed precision with ultra fine archival line discipline; finish with
    honest drawing marks, stable anatomy or object structure, clean negative space, and no painterly
    fill replacing the chosen tool, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Renaissance metal stylus drawing; Fine lines; Pale grey, tarnished warm tone; Prepared ground
    (bone ash)
  creative_brief: >-
    Apply Silverpoint as an art-style preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Renaissance
    metal stylus drawing, Fine lines, Prepared ground (bone ash) without requiring the card image's
    original subject.
