visualDna:
  aesthetic:
    Express ecological futurism through quiet habitat curves, planted edges, responsive relay shapes,
    and moon-pale surfaces that coexist with living growth; use lunar light as a design mood, not a mandatory
    landscape.
  subject_treatment:
    Preserve the requested subject and action; add sustainable joins, soft habitat geometry,
    or integrated plant forms only to compatible unspecified details without turning every scene into a greenhouse.
  color_and_tone:
    Use moon-white, cool gray, leaf green, earth gold, and muted blue with calm value steps;
    allow the requested palette to remain primary.
  lighting_and_shadow:
    Use soft earthlight-like bounce and clear pale highlights with gentle but legible shadow;
    avoid hazy glow that erases structure.
  texture_and_material:
    Combine matte ceramic or pale composite, woven growing surfaces, clear glass, and living
    foliage in deliberate balance; keep materials clean and repairable.
  camera_and_composition:
    Let a few arcs or habitat curves lead around the subject while plant forms stay subordinate;
    preserve requested crop and avoid forcing a dome or relay dish.
  atmosphere_and_mood:
    Feel restorative, communal, and quietly advanced, without assuming a lunar colony or
    utopian setting.
  rendering_and_quality:
    Use simplified luminous contours, clear plant silhouettes, and restrained gradients;
    maintain strong focus at thumbnail scale.
avoidRules:
  - a required moon base, dome, dish, or greenhouse
  - generic neon cyberpunk lighting
  - vegetation or glow obscuring the subject
