visualDna:
  aesthetic: 'Use this drawing language: Flat deadpan cartoon drawing with awkward simple silhouettes, minimal line, abrupt scale shifts, blank pauses, mundane prop logic, and anti-climactic framing. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply thin simple contour lines, plain shapes, abrupt scale shifts, and sparse scribble accents to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use flat sour pastels, nicotine yellow, dusty salmon, muted beige, washed-out green, and digital cyan as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat, low-drama fill with muted ambient contrast as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render simple digital fills, lightly dirty edges, restrained surface grain, and low-fuss linework as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Favor quiet spacing, flat depth, and small offbeat shifts over dynamic action; mundane props or pauses are included only when prompted.
  atmosphere_and_mood: Awkward, deadpan, and mildly absurd; let pauses and plainness carry the tone.
  rendering_and_quality: Finish with low-fuss outlines, simple digital or cel fill, and deliberate plainness.
  key_features: plain silhouette; minimal contour; abrupt scale shifts; deadpan spacing; anti-climactic framing
  creative_brief: Render the supplied content with thin simple contour lines, plain shapes, abrupt scale shifts, and sparse scribble accents. Use flat sour pastels, nicotine yellow, dusty salmon, muted beige, washed-out green, and digital cyan as style colors while honoring any explicit color instructions. Apply simple digital fills, lightly dirty edges, restrained surface grain, and low-fuss linework as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
