visualDna:
  aesthetic: >-
    Reproduction-inspired illustration uses strong grouped values and selectively broken edges,
    with any loss of detail kept local and controlled.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep the main silhouette and
    defining content intact as secondary marks simplify.
  color_and_tone: >-
    Preserve the requested palette and relationships. Simplify local values as needed without forcing
    black and white or adding an unrequested accent color.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Translate existing values into clear groups
    without inventing extra shadow shapes.
  texture_and_material: >-
    Apply controlled reproduction wear only to selected edges or tonal areas. Avoid unrequested
    surface marks or a uniform noisy overlay.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not turn the composition into a
    page, flyer or layout; add no lettering or border.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Reproduction marks affect selected edges and values only,
    not the subject or context.
  rendering_and_quality: >-
    Define the silhouette and large value groups first, then break only selected edges. Retain enough
    detail for the original subject to remain clear at reduced size.
avoidRules:
  - unrequested surface marks or typography
  - forced monochrome or unrequested accent ink
  - unrequested page, border, lettering, or period motifs
