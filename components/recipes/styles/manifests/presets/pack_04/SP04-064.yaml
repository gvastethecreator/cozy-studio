visualDna:
  aesthetic: 'Stipple dotwork: tone built only from thousands of technical-pen dots, dense clusters for shadow and sparse scatter for light.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Black ink dots on bright white paper, with no line, no wash and no grey fill.
  lighting_and_shadow: Directional light rendered through dot-density gradients, highlights left as open paper.
  texture_and_material: Uniform round dots from a fine technical pen, no contour lines, edges defined only by changes in density.
  camera_and_composition: Keep the requested view, often isolated on white like a scientific plate.
  atmosphere_and_mood: Patient, meditative and precise, tone grown one dot at a time.
  rendering_and_quality: Clean dot-only rendering with scientific-illustration clarity; no hatching or outline.
  key_features: dots only; density gradients for tone; no contour line; open-paper highlights; scientific plate clarity
  creative_brief: "Stipple dotwork: tone built only from thousands of technical-pen dots, dense clusters for shadow and sparse scatter for light. Carry it through dots only, density gradients for tone, no contour line, open-paper highlights, scientific plate clarity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
