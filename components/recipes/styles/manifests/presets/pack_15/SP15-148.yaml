visualDna:
  aesthetic: 'Surveillancepunk: a city of cameras on every corner, scanning lasers, facial-recognition halos and people inventing ways to hide in plain sight.'
  subject_treatment: Keep the prompt's subject and setting; place cameras, scan beams and tracking halos around it, and give people small tricks for hiding.
  color_and_tone: Cold grey concrete, camera-lens black and red tracking lights with pale green scan lines.
  lighting_and_shadow: Harsh security floodlights, red camera LEDs and thin laser scan lines across faces.
  texture_and_material: Dome cameras, lens glass, reflective anti-scan fabrics, face paint and concrete.
  camera_and_composition: Fish-eye security-camera angles and street views crowded with lenses.
  atmosphere_and_mood: Paranoid and defiant, a constant game of hide and seek with the whole city.
  rendering_and_quality: Crisp illustration with sharp lens reflections and clean scan-line effects.
  creative_brief: "Surveillancepunk: a city of cameras on every corner, scanning lasers, facial-recognition halos and people inventing ways to hide in plain sight. Carry it through dome cameras, scan lines, tracking halos, camouflage makeup. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: dome cameras; scan lines; tracking halos; camouflage makeup
