visualDna:
  aesthetic: >-
    Apply restrained digital displacement only within an explicitly requested local accent region,
    keeping the primary image structure and larger contours stable.
  subject_treatment: >-
    Preserve identity, proportions, count, pose, action and function. Displace only existing secondary
    detail in the authorized area; do not duplicate, remove or invent parts.
  color_and_tone: >-
    Preserve the requested palette and value hierarchy. Keep any channel separation or color offset
    localized and do not introduce unrequested hues.
  lighting_and_shadow: >-
    Retain the requested illumination and shadow structure. Digital displacement does not create a new
    light source or exposure shift.
  texture_and_material: >-
    Keep the effect mask-bound and visually controlled rather than adding all-over noise or changing the
    depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Local displacement must not move the
    overall silhouette or reorganize the image.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. A localized digital artifact does not add interface graphics,
    a screen environment or a new narrative.
  rendering_and_quality: >-
    Establish clean major forms first, then apply small bounded shifts to secondary marks while keeping
    essential details identifiable and any requested lettering intact.
avoidRules:
  - global glitch or displacement of the main silhouette
  - lost, duplicated or invented essential details
  - unrequested digital noise or interface graphics
assets:
