    scale shimmer, bell metal, and carved wood grain; surface scale, patina, residue, gloss, grain,
    and carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with drooping line rhythm and flexible arbitration arcs plus oath-line diagonals and
