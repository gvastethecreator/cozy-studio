  creative_brief: "Tattoo skin mapping: the figure's visible skin covered in graphic tattoo work that follows anatomy, ornamental and ceremonial. Carry it through anatomy-following tattoo work, black ink with color, ornamental mapping. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
