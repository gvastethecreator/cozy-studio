visualDna:
  aesthetic: >-
    Shape continuous painted volumes with clean edges, soft transitions and clearly placed highlights.
    Keep the finish visibly illustrated rather than turning it into a 3D render.
  subject_treatment: >-
    Preserve requested identity, anatomy, proportions, pose and action. Smooth shading follows the
    existing forms without adding costume, genre motifs or exaggerated anatomy.
  color_and_tone: >-
    Keep the requested palette and color relationships. Use smooth tonal transitions within those
    colors without defaulting to neon, metallic color or a fixed palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Paint readable highlights and volume shadows
    consistent with that light; do not add glows or extra light sources.
  texture_and_material: >-
    Use a polished painted surface with restrained texture. Preserve each requested material instead
    of applying uniform plastic gloss or photographic skin smoothing.
  camera_and_composition: >-
    Preserve the requested viewpoint, framing, pose and placement. Do not add dramatic perspective,
    framing devices or layout.
  atmosphere_and_mood: >-
    Keep the requested scene and emotional tone. Smooth airbrush transitions describe form without
    adding cosmic effects, a superhero setting or other genre content.
  rendering_and_quality: >-
    Maintain continuous gradients and crisp boundaries where forms meet. Keep the image readable and
    painterly, with no automatic 3D-model appearance.
avoidRules:
  - automatic 3D render, uniform plastic gloss or unrequested glow
  - added cosmic effects, superhero anatomy or genre setting
  - unrequested frame, lettering or layout
