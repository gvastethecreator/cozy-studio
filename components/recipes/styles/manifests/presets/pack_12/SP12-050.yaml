  lighting_and_shadow: 'Harsh red emergency light with deep black shadows.'
  texture_and_material: 'Coarse pixelated textures on simple angular shapes, fine dither dots in gradients, like an old console game.'
  camera_and_composition: Fixed overhead survival horror camera, framed the way Signalis 2022 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with cold cosmic dread.
  rendering_and_quality: 'A 2022 frame deliberately made at 640 by 480 on a CRT look: overhead view of a cramped corridor, soft grain and jagged edges.'
  key_features: 'Signalis coarse pixel textures; red emergency; overhead camera; retro horror'
  creative_brief: "rose-engine Signalis (2022) look: survival horror deliberately made to look like an old console game, coarse pixelated textures on simple shapes, a polar facility, red emergency light and an overhead camera. Carry it through Signalis coarse pixel textures, red emergency, overhead camera, retro horror. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
