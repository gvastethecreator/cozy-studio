visualDna:
  aesthetic: 'Collectible avatar render: a stylized bust centered on a flat color field, built from a few chunky trait pieces such as headwear, eyewear, clothing and one accessory in glossy toy materials.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the centered bust framing on a flat color field with glossy trait accessories for a person or creature, while a requested object stays that object, centered on the same field and never given a face. It never forces a T-pose on a posed subject and never turns a requested object into an avatar.
  color_and_tone: One flat saturated background color, rich gold and neon accents, and soft pastel or gem-colored trait pieces.
  lighting_and_shadow: Clean front-left studio softbox with a bright rim light and glossy highlights on every accessory.
  texture_and_material: Smooth vinyl skin, glossy lacquered accessories, brushed gold chains and soft fabric hoods.
  camera_and_composition: Chest-up bust, perfectly centered in a slight three-quarter turn, with identical margins as if one of a series.
  atmosphere_and_mood: Confident and collectible, a character assembled from swappable traits.
  rendering_and_quality: Clean toy-like render with no background detail, no rarity text, no numbers and no brand marks.
  key_features: centered chest-up bust; flat color field; swappable trait accessories; glossy vinyl and gold; bright rim light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies NFT Collectible Avatar Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - forced T-pose
  - object turned into an avatar
  - franchise likeness
  - readable text
  - logo
  - numbers
  - rarity labels
  - ape character
  - traditional art
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
