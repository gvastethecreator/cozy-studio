  color_and_tone: Ivory lace, dove grey, lavender, champagne and black, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Soft, hazy summer daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Lace, silk chiffon, ostrich plumes, tulle and kid leather.
  camera_and_composition: Elegant full figure with the S-bend silhouette visible, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Elegant, leisurely, romantic and refined, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Soft, luminous, vintage finish, with believable fabric weight, seams and fit detail.
