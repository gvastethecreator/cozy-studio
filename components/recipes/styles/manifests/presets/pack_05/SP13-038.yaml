visualDna:
  aesthetic: 'Anime frozen-instant staging: time stops at the height of the action and the camera has swung around to an unexpected side, showing airborne elements of the scene hanging perfectly still.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the frozen instant seen from a camera orbiting the subject, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette with a slight cool desaturation of the background to signal stopped time.
  lighting_and_shadow: Crisp rim light on every suspended element so each one reads separately, from the existing light direction.
  texture_and_material: Only elements already in the scene hang in the air, such as hair, water drops, cloth or flour, each sharply defined.
  camera_and_composition: A three-quarter rear or low side angle that the prompt did not imply, the subject centered with suspended elements in a loose ring.
  atmosphere_and_mood: Hushed suspended stillness inside a fast movement.
  rendering_and_quality: Everything sharp, no motion blur, clean separation between the subject and each suspended element.
  creative_brief: "Anime frozen-instant staging: time stops at the height of the action and the camera has swung around to an unexpected side, showing airborne elements of the scene hanging perfectly still. Carry it through time frozen at the action peak, camera swung to an unexpected side, suspended scene elements, no motion blur, cool desaturated background. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: time frozen at the action peak; camera swung to an unexpected side; suspended scene elements; no motion blur; cool desaturated background
