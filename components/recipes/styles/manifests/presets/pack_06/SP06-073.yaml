visualDna:
  aesthetic: 'Embroidery on photo: a printed photograph pierced and hand-stitched, thread adding color, pattern or light as a physical layer over the image.'
  subject_treatment: Keep the photographed subject, clothing, anatomy and camera exactly as photographed; thread is stitched through the print around and over it as an added layer, never replacing garments or skin.
  color_and_tone: Natural photo color, often muted, against one or two saturated thread colors such as gold, vermilion or cobalt.
  lighting_and_shadow: Photo lighting stays; real light glints on the thread and each stitch casts a tiny shadow on the paper.
  texture_and_material: Satin-stitch fills, running-stitch lines, French knots, needle holes, slight paper puckering and a loose thread tail.
  camera_and_composition: Keep the photo framing; stitching follows or extends shapes already in the photo such as rays, contours and patterns.
  atmosphere_and_mood: Personal and tactile, a memory touched by hand.
  rendering_and_quality: Sharp photographic base with dimensional thread; never flat printed lines pretending to be stitches.
  key_features: printed photo base; satin and running stitch; French knots; needle holes; thread casting shadow
  creative_brief: "Embroidery on photo: a printed photograph pierced and hand-stitched, thread adding color, pattern or light as a physical layer over the image. Carry it through printed photo base, satin and running stitch, French knots, needle holes, thread casting shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - uniform beige torn-paper wash over every image
  - red tape strips added by default
