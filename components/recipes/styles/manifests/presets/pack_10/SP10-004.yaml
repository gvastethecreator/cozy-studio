visualDna:
  aesthetic: 'Op Art: optical illusions of vibrating stripes, warped grids and moiré that make flat patterns seem to move.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is formed by bending black-and-white stripes or grids so it bulges or recedes optically."
  color_and_tone: Black and white, sometimes one vibrating color pair, used consistently across subject and background.
  lighting_and_shadow: No light; illusion comes from pattern density, expressed through the style rather than photographic lighting.
  texture_and_material: Precise stripes, checks and warped grids, visible at card size as the signature of the style.
  camera_and_composition: Pattern fills the frame with the subject as distortion.
  atmosphere_and_mood: Dizzying, hypnotic, precise and kinetic, driven by the construction, color and rhythm.
  rendering_and_quality: Hard-edged precise finish, with clean, deliberate marks and no accidental noise.
  key_features: warped stripes; bulging grid illusion; black and white; vibration
  creative_brief: "Op Art: optical illusions of vibrating stripes, warped grids and moiré that make flat patterns seem to move. Carry it through warped stripes, bulging grid illusion, black and white, vibration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
