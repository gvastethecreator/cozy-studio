  lighting_and_shadow: Pools of streetlight passing over the runner, long shadows sweeping ahead and behind.
  texture_and_material: Asphalt, running shoes, sweat and fabric drawn simply with soft glow.
  camera_and_composition: Tracking side shots and long empty roads with a single runner.
  atmosphere_and_mood: Lonely and determined, every step a small victory against the dark and the cold.
