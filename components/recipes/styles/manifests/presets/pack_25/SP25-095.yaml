visualDna:
  aesthetic: 'Negative-Space Meters: openings inside stable shapes encode availability or load, the void growing with the value.'
  subject_treatment: Encode the prompt's quantities as openings inside stable shapes, the void matching each value by a declared convention; keep every value and label exact.
  color_and_tone: High figure-ground contrast, the void meaning the same in every meter.
  lighting_and_shadow: Flat geometry where quantity is shown by shape alone.
  texture_and_material: Smooth masses with wide openings and crisp fill limits.
  camera_and_composition: One meter per variable with a visible reference and room for a label.
  atmosphere_and_mood: Graphic economy and a clear reading of what is still available.
  rendering_and_quality: The opening changes steadily and in one direction with the value.
  creative_brief: "Negative-Space Meters: openings inside stable shapes encode availability or load, the void growing with the value. Carry it through void as quantity, stable shapes, declared convention, one meter per value. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: void as quantity; stable shapes; declared convention; one meter per value
