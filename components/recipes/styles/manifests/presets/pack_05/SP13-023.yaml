visualDna:
  aesthetic: 'Yoshinori Kanada sakuga style: angular geometric light effects, sharp triangular flames and sparks, stylized Kanada poses with bent limbs and bold graphic explosions in flat color.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures in angular dynamic Kanada poses, sharp bent limbs and flat stylized silhouettes caught mid-action. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold flat neon yellow, magenta and cyan effects against dark flat backgrounds.
  lighting_and_shadow: Graphic flat light where glowing angular shapes of energy replace realistic light sources.
  texture_and_material: Flat color effect shapes, sharp triangular sparks and crisp geometric outlines.
  camera_and_composition: Stylized dramatic angles with angular effect shapes framing the action.
  atmosphere_and_mood: Keep the requested mood with sharp electric dynamism.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  key_features: Kanada angular effects; triangular sparks; stylized poses; flat neon
  creative_brief: "Yoshinori Kanada sakuga style: angular geometric light effects, sharp triangular flames and sparks, stylized Kanada poses with bent limbs and bold graphic explosions in flat color. Carry it through Kanada angular effects, triangular sparks, stylized poses, flat neon. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
