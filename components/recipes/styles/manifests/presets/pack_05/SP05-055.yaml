visualDna:
  aesthetic: >-
    Severe gothic-industrial drawing with nested pointed contours, finely etched seams, and dark
    shell-like value shapes; its unease comes from line rhythm, not invented architecture.
  subject_treatment: >-
    Retain the subject’s recognizable anatomy and outline. Use narrow, nested contours and
    restrained pointed accents only where its existing forms support them.
  color_and_tone: >-
    Favor black, charcoal, bone, and muted violet, with a small blood-red or cold-cyan accent.
    Keep luminous color scarce.
  lighting_and_shadow: >-
    Cut large, hard shadow masses against thin rim highlights; let small accents emerge from
    darkness without adding lamps or windows.
  texture_and_material: >-
    Preserve the subject’s materials while adding etched linework, fine stippling, and selective
    dry-brush texture to existing surfaces.
  camera_and_composition: >-
    Keep the requested camera. Use tall contour rhythms and compressed negative space within the
    existing frame, without building a hall or tower.
  atmosphere_and_mood: >-
    Carry dread through stillness, deep values, and intricate edge detail rather than religious
    symbols or a gothic setting.
  rendering_and_quality: >-
    Balance ornate fine lines with simple cel-shadow masses; keep the silhouette clear and
    highlights sparse.
  key_features: >-
    Pointed nested contours; etched industrial detail; deep black shadow; restrained violet and
    red accents.
  creative_brief: >-
    Preserve the requested subject and setting. Use etched contours, pointed line rhythms, and
    broad dark shadows on existing forms; add no cathedral, shell, or ritual objects.
