visualDna:
  aesthetic: 'Compressed Ligature Blocks: selected letter pairs of the exact word fuse through shared strokes into a dense block that still reads in order.'
  subject_treatment: Set the requested word exactly and compress only compatible pairs through shared strokes, leaving unjoined letters as reading pauses.
  color_and_tone: One-ink masses with counters open enough to separate every letter group.
  lighting_and_shadow: Neutral flat rendering, with separations drawn in the letterforms themselves.
  texture_and_material: Firm terminals, smooth joins and solid ink surfaces across the whole block.
  camera_and_composition: Pairs or trios grouped along one continuous reading axis, with free overall shape.
  atmosphere_and_mood: Deliberate density with small rhythmic releases, compact and confident.
  rendering_and_quality: Localized compression that clearly beats an unligated version for width and reading.
  creative_brief: "Compressed Ligature Blocks: selected letter pairs of the exact word fuse through shared strokes into a dense block that still reads in order. Carry it through shared-stroke pairs, dense block, reading pauses, one ink. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared-stroke pairs; dense block; reading pauses; one ink
