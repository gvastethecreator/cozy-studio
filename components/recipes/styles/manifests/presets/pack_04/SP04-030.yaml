visualDna:
  aesthetic: 'Vintage scientific botanical plate: a specimen drawn in fine ink contour and tinted with muted watercolor, with dissected parts arranged around it.'
  subject_treatment: 'Keep the prompt subject, action and identity; this preset explicitly owns the specimen plate layout: whole subject centered, dissected details and sections arranged around it without labels, and nothing else about the request changes.'
  color_and_tone: Muted naturalist watercolor tints over warm cream archival paper, true local colors.
  lighting_and_shadow: Flat specimen illumination from the upper left, minimal shading only to show form.
  texture_and_material: Aged paper grain, fine stipple and hatch in the ink, thin transparent washes.
  camera_and_composition: Orthographic specimen views, sections and insets in a balanced grid, fine leader lines without text.
  atmosphere_and_mood: Scholarly, measured and calm, curiosity made precise.
  rendering_and_quality: High-accuracy naturalist drawing; leader lines point to empty space, never to readable labels.
  key_features: fine ink contour; muted watercolor tints; dissected insets; cream archival paper; unlabeled leader lines
  creative_brief: "Vintage scientific botanical plate: a specimen drawn in fine ink contour and tinted with muted watercolor, with dissected parts arranged around it. Carry it through fine ink contour, muted watercolor tints, dissected insets, cream archival paper, unlabeled leader lines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
