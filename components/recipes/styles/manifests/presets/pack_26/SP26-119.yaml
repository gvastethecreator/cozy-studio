  color_and_tone: Muted greys, cold blues and pale white, true to the ECM Records palette.
  lighting_and_shadow: Soft fog and diffuse northern light, lit the way ECM Records lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Wide empty landscape with small refined type, framed the way ECM Records composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with quiet contemplative space.
  rendering_and_quality: Faithful ECM-style minimal cover design, in the recognizable hand of ECM Records.
