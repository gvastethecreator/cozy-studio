  color_and_tone: Pastel flat colors with white, true to the Sanrio Minimal Mascot Silhouette palette.
  lighting_and_shadow: Flat cute light, lit the way Sanrio Minimal Mascot Silhouette lights its scenes.
  texture_and_material: Clean thick outlines and flat fills, with the surface finish of Sanrio Minimal Mascot Silhouette.
  camera_and_composition: Centered mascot portrait on a pastel background, framed the way Sanrio Minimal Mascot Silhouette composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with instant sweet cuteness.
  rendering_and_quality: Clean kawaii mascot design, in the recognizable hand of Sanrio Minimal Mascot Silhouette.
  creative_brief: "Sanrio mascot design language: ultra-simple rounded silhouettes, dot eyes, no mouth or tiny mouth, a single accessory, pastel flat color and instant cuteness. Carry it through Sanrio simplicity, dot eyes, one accessory, pastel. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
