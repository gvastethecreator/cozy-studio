visualDna:
  aesthetic: 'Uninked comic pencil art: confident graphite line drawing laid over loose non-photo-blue construction sketching on bristol board, before any ink.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Graphite grays over light cyan blue lines on warm white board; no other color.
  lighting_and_shadow: Shadow indicated by quick graphite hatching and X marks for areas to be filled black later.
  texture_and_material: Bristol board tooth, smudged graphite, eraser ghosts, blue gesture curves, ellipses and perspective lines left visible.
  camera_and_composition: The requested view built on a visible blue perspective grid and mannequin forms, finished line on top.
  atmosphere_and_mood: Energetic and in-progress, the thinking of the artist left on the page.
  rendering_and_quality: Clean confident pencil over messy blue structure; the image stays unfinished and uninked on purpose.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Non-Photo Blue Pencils as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: non-photo-blue construction lines; graphite finished line; X marks for blacks; visible perspective grid; bristol tooth
