visualDna:
  aesthetic: 'Bauhaus design: primary shapes, clean grids, sans-serif-era modernism reduced to circle, square and triangle.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is simplified into circles, squares, triangles and bold bars arranged on a clean grid."
  color_and_tone: Red, yellow, blue, black and off-white, used consistently across subject and background.
  lighting_and_shadow: Flat, shadowless color, expressed through the style rather than photographic lighting.
  texture_and_material: Flat printed color with crisp geometric edges, visible at a glance as the signature of the style.
  camera_and_composition: Balanced asymmetric grid composition, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Rational, bold, modern and clear, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp poster-like finish, with clean, deliberate marks and no accidental noise.
  key_features: circle square triangle; primary colors; clean grid; flat shapes
  creative_brief: "Bauhaus design: primary shapes, clean grids, sans-serif-era modernism reduced to circle, square and triangle. Carry it through circle square triangle, primary colors, clean grid, flat shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
