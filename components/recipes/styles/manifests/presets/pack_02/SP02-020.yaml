visualDna:
  aesthetic: 'Reality TV confessional: a contestant alone in a chair speaking straight into the lens against a colored backdrop.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Saturated backdrop color (purple, teal, orange), neutral skin, crisp video.
  lighting_and_shadow: One soft key and a colored backlight on the backdrop; clean, flat, slightly harsh.
  texture_and_material: Sharp video texture, visible makeup, casual or costume clothing.
  camera_and_composition: Centered chest-up framing, eyes into the lens, slight wide-angle closeness.
  atmosphere_and_mood: Confessional and gossipy, private feelings performed for everyone.
  rendering_and_quality: Crisp reality-TV video with no readable name captions or show graphics.
  key_features: direct-to-lens confession; colored backdrop; centered chest-up shot; soft key; crisp video
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Reality TV Confessional as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
