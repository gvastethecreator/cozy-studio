visualDna:
  aesthetic: 'Fable-like anime drawn as a picture book: wobbly colored-pencil lineart, flat crayon-textured fills and simplified rounded shapes with small dot eyes.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Figures simplify to soft rounded silhouettes with tiny dot features while keeping their age and identity; do not add crowns or castles.
  color_and_tone: Warm ochre, soft coral, cream and gentle blue-green shadows at mid saturation, with paper white showing through the color.
  lighting_and_shadow: 'Flat soft light and minimal shading: one pale shadow shape under each form instead of modeled volume.'
  texture_and_material: Visible waxy crayon strokes following the form, colored-pencil hatching and cream paper tooth between strokes.
  camera_and_composition: Keep the requested view; flattened picture-book staging with clear scale contrast and plenty of plain space.
  atmosphere_and_mood: Tender and quietly brave, earnest as a bedtime story.
  rendering_and_quality: Simple silhouettes, uneven hand-drawn line weight and deliberate gaps in the coloring, never polished digital gloss.
  key_features: wobbly colored-pencil line; waxy crayon fills; dot eyes and rounded bodies; flat picture-book staging; paper tooth showing
  creative_brief: "Fable-like anime drawn as a picture book: wobbly colored-pencil lineart, flat crayon-textured fills and simplified rounded shapes with small dot eyes. Carry it through wobbly colored-pencil line, waxy crayon fills, dot eyes and rounded bodies, flat picture-book staging, paper tooth showing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
