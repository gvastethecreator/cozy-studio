visualDna:
  aesthetic: 'Satirical hero anime with split detail levels: the main figure drawn in minimal round lines with dot eyes, everything around it rendered in dense, polished detail.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Clean black-white values with saturated warm and cool accents; the simple figure in flat pale colors.
  lighting_and_shadow: Dramatic hard lighting and polished highlights on the detailed parts; the simple figure lit flat.
  texture_and_material: Smooth cel fills; detailed zones with fine hatching, muscle, scale and stone detail.
  camera_and_composition: Keep the requested framing; absurd scale contrast with the simple figure placed precisely in broad quiet space.
  atmosphere_and_mood: Deadpan grandeur and understated satire, the plain figure unimpressed by an epic world.
  rendering_and_quality: 'The detail gap is the joke: one plain figure against a lavishly finished world.'
  key_features: minimal dot-eyed main figure; hyper-detailed surroundings; polished hard lighting; flat pale figure fill; absurd scale contrast
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dual-Detail Deadpan Satire as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
