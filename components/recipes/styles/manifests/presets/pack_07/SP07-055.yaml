visualDna:
  aesthetic: 'Full-scale confectionery architecture: sugar-glass windows, marshmallow domes, candy-striped load-bearing columns and piped-icing cornices built at real building size.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Pastel pink, mint, butter yellow and peppermint red against translucent amber sugar; soft high-key values.
  lighting_and_shadow: Bright soft daylight with subsurface glow through sugar glass and gummy panes; shadows tinted pink rather than grey.
  texture_and_material: Crystallized sugar sparkle, matte powdered marshmallow, glossy hard candy and ridged royal icing at architectural scale.
  camera_and_composition: Keep the requested view at human scale with full-size doors and steps; never a tabletop gingerbread model.
  atmosphere_and_mood: Dreamlike and slightly uncanny, sweetness scaled up until it becomes monumental.
  rendering_and_quality: Soft-edged surreal realism; candy materials behave like building materials and carry believable loads.
  key_features: sugar-glass windows; marshmallow domes; candy-striped columns; piped-icing cornices; building-scale candy materials
  creative_brief: "Full-scale confectionery architecture: sugar-glass windows, marshmallow domes, candy-striped load-bearing columns and piped-icing cornices built at real building size. Carry it through sugar-glass windows, marshmallow domes, candy-striped columns, piped-icing cornices, building-scale candy materials. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
