visualDna:
  aesthetic: >-
    Build recognizable forms from a few large opaque gouache shapes and clear reserves. Use crisp
    edges and deliberate loss of small interior detail to make the broad masses carry the image.
  subject_treatment: >-
    Preserve the requested subject, proportions and action. Simplify detail into connected shapes
    without changing identity, clothing or the amount of visible content.
  color_and_tone: >-
    Respect the requested colors. Group them into a small number of clear value masses without
    reducing the image to black and white unless the prompt asks for that palette.
  lighting_and_shadow: >-
    Follow the requested lighting. Organize its existing highlights and shadows into broad opaque
    shapes instead of adding a new source or dramatic contrast.
  texture_and_material: >-
    Keep pigment matte and mostly smooth, with only a slight hand-painted edge. Let the requested
    materials remain recognizable beneath the simplified color masses.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Keep open reserves
    around the existing silhouettes without rearranging them.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone and story. Bold value grouping affects rendering only and
    does not alter the subject or narrative.
  rendering_and_quality: >-
    Establish the largest forms first and use few tonal groups. Keep the subject readable at a glance
    without filling quiet areas with microdetail.
avoidRules:
  - unrequested blood, torn clothing, or threatening subject matter
  - forced monochrome when color is requested
  - detail that breaks broad value masses
  - unrequested horror or violence
