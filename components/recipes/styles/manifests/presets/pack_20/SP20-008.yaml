visualDna:
  aesthetic: >-
    Photochemical contact-print illustration on iron-salt-sensitized support: exposed ground develops
    Prussian blue while masked areas retain a pale reserve. Apply that exposure structure to the
    requested image rather than adding incidental photograms.
  subject_treatment: >-
    Preserve the requested subject, pose, count and defining contours. Translate its tonal structure
    into image-bearing exposure and protected paper values, rather than tinting each existing surface
    blue or replacing the subject with other photogram silhouettes.
  color_and_tone: >-
    Use the characteristic cyanotype range of Prussian blue, intermediate blue and the pale support.
    Treat this monochrome palette as part of the selected process and retain the requested value hierarchy.
  lighting_and_shadow: >-
    Keep the requested illumination legible in the exposure values. Do not add sunbeams, reverse
    contours or imply a new light source to explain the print process.
  texture_and_material: >-
    Keep the exposed pigment field even with slight local exposure variation. The support remains a
    print ground; do not turn the depicted materials into blue paper or fabric.
  camera_and_composition: >-
    Preserve the supplied viewpoint, framing and spatial relationships. Contact-print contrast may
    simplify small values but must not crop, mirror or rearrange the subject.
  atmosphere_and_mood: >-
    Keep the requested mood. The cool monochrome exposure is a rendering choice and does not imply
    archival age, botanicals or a laboratory setting.
  rendering_and_quality: >-
    Maintain distinct exposed and protected values with controlled edges and legible internal forms.
    Avoid invented borders, captions or unrelated contact silhouettes.
avoidRules:
  - unrequested photogram objects or silhouettes
  - non-cyanotype color palettes
  - invented print borders or captions
