visualDna:
  aesthetic: >-
    Arrange directional mark groups that follow existing form, then use compact raster clusters to
    define selected edges and color changes. Keep the image integrated, not fragmented.
  subject_treatment: >-
    Preserve requested identity, count, pose, action, proportions and scene. Mark direction follows
    existing shapes without introducing patterns or changing the represented material.
  color_and_tone: >-
    Retain the requested palette and tonal relationships. Use raster clusters to clarify transitions
    between existing colors without forcing a woven palette or adding hues.
  lighting_and_shadow: >-
    Follow the requested lighting. Let directional marks support the existing value structure and
    avoid replacing it with an arbitrary repeated pattern.
  texture_and_material: >-
    Keep marks directional and restrained; preserve the materials already depicted. Do not turn the
    full image into a textile surface or apply uniform grain.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop and arrangement. Quantized edges follow existing forms
    without adding elements or changing the requested composition.
  atmosphere_and_mood: >-
    Preserve the requested mood and setting. The combination of directional marks and raster clusters
    changes the rendering only, not the subject or story.
  rendering_and_quality: >-
    Keep the primary mark direction clear and raster groupings consistent. Avoid noisy dithering,
    chaotic overlaps or pattern density that competes with form.
avoidRules:
  - unrequested patterns or changes to depicted material
  - random dithering, noisy clusters or chaotic overlap
  - unrequested lettering or added graphic elements
