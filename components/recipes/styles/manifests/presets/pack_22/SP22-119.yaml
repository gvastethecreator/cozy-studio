visualDna:
  aesthetic: >-
    Treat the requested image with matte mineral pigments, compact color planes and broad
    brush-defined contours. Use direct, flat paint handling as an illustration method while keeping
    the represented subject and setting unchanged.
  subject_treatment: >-
    Preserve the requested identity, proportions and action. Reduce volume into a few clear planes
    while keeping the subject's recognizable structure.
  color_and_tone: >-
    Respect the requested palette. Group it into a compact range of mineral-like values with only a
    few accents; do not impose an earth-only or aged palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Describe existing light with the chosen color
    planes instead of adding a historical setting or theatrical light.
  texture_and_material: >-
    Keep the painted surface matte with structural brush edges. If the prompt requests wear, confine
    it to selected areas; do not add cracks or aging to the depicted material by default.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and spatial arrangement. Use the broad painted
    planes to clarify that composition without changing its layout.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. The mural-painting method does not add ruins, age or
    a darker genre.
  rendering_and_quality: >-
    Keep silhouette and value groups clear beneath broad brush outlines. Use localized surface
    variation only where it supports the painted forms.
avoidRules:
  - automatic cracks or widespread surface aging
  - unrequested walls, ruins, or historical setting
  - unrequested horror or violence
