visualDna:
  aesthetic: 'WIT Studio Attack on Titan anime look (2013): thick heavy outlines around faces, gritty desaturated palettes, 3D maneuver gear swinging and giants looming over medieval walled towns.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with thick-outlined AoT anime designs, intense brows, heavy line shading on faces and practical leather strap harnesses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Desaturated earth brown, stone grey, pale sky and harsh blood-red accents.
  lighting_and_shadow: Harsh daylight with thick black shadow lines and dusty god rays.
  texture_and_material: Very thick outer contours, hatched shading lines on faces and gritty painted stone.
  camera_and_composition: Vertigo swings between rooftops, giant faces peering over walls and dizzying drops.
  atmosphere_and_mood: Keep the requested mood with desperate survival terror.
  rendering_and_quality: Intense 2013 WIT Studio television frame with heavy thick outlines.
  key_features: WIT thick outlines; walled towns; swinging harness gear; looming giants
  creative_brief: "WIT Studio Attack on Titan anime look (2013): thick heavy outlines around faces, gritty desaturated palettes, 3D maneuver gear swinging and giants looming over medieval walled towns. Carry it through WIT thick outlines, walled towns, swinging harness gear, looming giants. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
