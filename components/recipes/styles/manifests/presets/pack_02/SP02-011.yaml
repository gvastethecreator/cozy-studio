visualDna:
  aesthetic: '90s cyberpunk anime film: dense cel animation over hand-painted backgrounds, with a sickly green CRT cast and techno-organic clutter.'
  subject_treatment: Keep the prompt subject, action and setting; render them as 90s cel-animated film frames with painted backgrounds, without adding franchise characters or designs.
  color_and_tone: Green and teal cast, deep shadow cyan, muted skin, occasional warm monitor glow.
  lighting_and_shadow: Hard cel shadows in two tones, glowing screens and window light as sources.
  texture_and_material: Cel grain, painted background texture, dense cables and pipes, reflective visors.
  camera_and_composition: Cinematic layouts with deep background paintings, low angles and long lens compression.
  atmosphere_and_mood: Melancholic and philosophical, technology pressing in from every side.
  rendering_and_quality: Film-print cel animation with slight gate weave; no modern digital sheen.
  key_features: cel animation with painted backgrounds; green CRT cast; two-tone cel shadows; dense cables; film grain
  creative_brief: "90s cyberpunk anime film: dense cel animation over hand-painted backgrounds, with a sickly green CRT cast and techno-organic clutter. Carry it through cel animation with painted backgrounds, green CRT cast, two-tone cel shadows, dense cables, film grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
