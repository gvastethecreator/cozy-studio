visualDna:
  aesthetic: >-
    Fine tapered lines and layered translucent ribbons sweep around the subject; prismatic facets
    and polished shoujo glamour create the signature transformation sheen without requiring a
    transformation scene.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use luminous jewel and pastel
    hues with small prismatic shifts at overlaps; retain explicit colors and avoid blanket sparkle.
  lighting_and_shadow: >-
    Soft backlight and crisp glints belong at ribbon crossings and facets; respect the prompted
    light direction.
  texture_and_material: >-
    Keep ribbon-like forms as graphic line paths and translucent glazes, not new physical
    accessories; use fine clean contours and a polished surface.
  camera_and_composition: >-
    Use flowing arcs to guide attention around the requested form; keep the original crop, pose and
    silhouette legible.
  atmosphere_and_mood: >-
    Tender celestial polish is conveyed by layered light and graceful rhythm; do not add a romantic
    relationship or magical event.
  rendering_and_quality: >-
    Apply the glow and flowing contour to any requested subject without adding jewelry, costume,
    stars, wings or transformation props. Keep important silhouettes and joins legible; no
    watermark, unrequested text or interface.
  key_features: >-
    Prismatic sparkle; tapered contour; ribbon-like motion; gem-light accents; layered translucent
    facets; polished shoujo finish.
  creative_brief: >-
    Apply this visual treatment to the requested content: Prismatic sparkle; tapered contour;
    ribbon-like motion; gem-light accents; layered translucent facets; polished shoujo finish.
    Preserve its identity, action, materials, composition and requested tone; introduce no persona,
    scene, franchise cue or extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - coarse ink obscuring tapered contour
  - opaque overlays hiding prismatic facets
  - specular glare erasing edge detail
