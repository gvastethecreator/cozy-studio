  aesthetic: >-
    Refined cel painting with glass-green translucence, delicate branching linework, and formal,
    clean color grouping.
  subject_treatment: >-
    Preserve the requested forms; use fine veinlike strokes only to echo existing contours, never to
    add plants.
  color_and_tone: >-
    Glass green, pale cream, and muted gold form a clear palette, subject to explicit color
    direction.
  lighting_and_shadow: >-
    Soft high-key illumination and clean reflected highlights reveal form without requiring a glow
    source.
  texture_and_material: >-
    Layer translucent color, fine detail, and tidy painted surfaces while keeping every depicted
    material intact.
  camera_and_composition: >-
    Keep the given framing; use orderly detail and calm spacing without adding a formal setting.
  atmosphere_and_mood: >-
    Serene and composed, with no imposed healing or ritual.
  rendering_and_quality: >-
    Keep thin contours crisp against transparent washes; avoid excess bloom and decorative clutter.
  key_features: >-
    Glass-green softness, fine branching detail, clean preparation of color, and formal calm define
    this finish.
  creative_brief: >-
    Restyle the requested subject with translucent color and precise fine linework, without adding
    herbs, healing, or a court.
