visualDna:
  aesthetic: '90s grunge: slouchy thrift-store layers — oversized flannel, ripped jeans, faded band-less tees, knit beanies and scuffed boots — worn uncared-for.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: an oversized flannel shirt over a faded tee or thermal, ripped loose jeans or a slip dress, knit beanie and scuffed combat boots or worn sneakers.'
  color_and_tone: Faded plaid reds and greens, washed black, olive and denim blue.
  lighting_and_shadow: Dim, grainy available light or overcast day, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Brushed flannel, thermal waffle knit, worn denim and scuffed leather.
  camera_and_composition: Slouching, candid full or three-quarter figure, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Apathetic, melancholic, raw and lo-fi, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Grainy, washed-out film finish, with believable fabric weight, seams and fit detail.
  key_features: oversized flannel; ripped jeans; knit beanie; scuffed boots; faded plaid palette
  creative_brief: "90s grunge: slouchy thrift-store layers — oversized flannel, ripped jeans, faded band-less tees, knit beanies and scuffed boots — worn uncared-for. Carry it through oversized flannel, ripped jeans, knit beanie, scuffed boots, faded plaid palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
