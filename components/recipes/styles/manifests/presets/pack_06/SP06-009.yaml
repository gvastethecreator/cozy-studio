visualDna:
  aesthetic: >-
    Impressionist Oil acts as a transferable art-medium router: start from Monet style
    impressionism, Dabbed paint texture and paint-media system built from pigment body, binder
    behavior, substrate tooth, brush pressure, edge softness, and deliberate surface finish, then
    apply the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Short, broken brushstrokes; preserve the prompt subject
    while translating form into brushstroke mass, pigment opacity, glaze, wash, impasto, stain, or
    sprayed edge behavior, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Vibrant, unblended optical mixing; let hue, value, saturation, and mixing come
    from physical pigment, binder opacity, drying character, and historical medium constraints, with
    deliberate value grouping, accent control, and medium-specific limits rather than generic color
    wash.
  lighting_and_shadow: >-
    Handle light through Perceptual light built from broken color, luminous edges, and warm cool
    vibration; make light feel interpreted by paint through tonal blocking, glaze depth, broken
    color, matte falloff, or luminous pigment lift, so value structure supports the medium and does
    not overwrite the requested content.
  texture_and_material: >-
    Render Thick paint dabs; surface detail should show canvas, paper, plaster, wax, velvet, gesso,
    knife ridges, wash blooms, or aerosol overspray when the medium requires it, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Loss of detail; organize the image through painterly massing, brush
    direction, support format, negative space, edge hierarchy, and intentional simplification, with
    scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Light, airy, fleeting; derive mood from medium history, touch, pigment weight,
    speed, restraint, kitsch, ritual craft, or studio discipline, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Optical impressionist finish with loose local detail and high color vibration;
    finish with medium-faithful paint handling, readable form, controlled texture, and no pasted
    photo or generic digital filter, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Monet style impressionism; Dabbed paint texture; Vibrant, unblended optical mixing; Thick paint
    dabs; Loss of detail
  creative_brief: >-
    Apply Impressionist Oil as an art-style preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Monet style impressionism, Dabbed paint texture, Thick paint dabs without requiring the card
    image's original subject.
