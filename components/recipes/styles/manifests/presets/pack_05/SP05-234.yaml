visualDna:
  aesthetic: >-
    Command-like graphic precision using modular divisions, sparse signal bars, rigid alignment,
    and stark cel-shadow blocks; keep all data-like marks abstract.
  subject_treatment: >-
    Keep the subject’s identity and outline. Divide its existing forms with clean modular
    contours and small signal accents, not interface panels or weapons.
  color_and_tone: >-
    Set black, cool gray, and deep blue against cyan or red signal accents; keep bright marks
    few and highly legible.
  lighting_and_shadow: >-
    Use hard shadow blocks and thin localized highlights to create a severe, controlled read
    without visible displays.
  texture_and_material: >-
    Preserve existing material qualities; add fine digital-looking breaks and edge marks
    sparingly, with no labels or text.
  camera_and_composition: >-
    Respect the requested framing. Use measured grid alignment within existing forms and keep
    the main silhouette dominant.
  atmosphere_and_mood: >-
    Create command tension through strict spacing, deliberate interruption, and quiet contrast
    rather than an extinction event.
  rendering_and_quality: >-
    Favor precise line weights, flat value blocks, clean signal-color boundaries, and minimal
    texture.
  key_features: >-
    Modular contour divisions; abstract signal marks; stark cel shadows; black, blue, and
    cyan-red accents.
  creative_brief: >-
    Keep the specified subject, action, and setting intact. Apply modular line divisions,
    abstract signal accents, and stark shadows; add no display, weapon, text, or catastrophe.
