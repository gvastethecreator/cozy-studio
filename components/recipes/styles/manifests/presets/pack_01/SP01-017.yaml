visualDna:
  aesthetic: 'Lomo LC-A snapshot: a compact zone-focus camera with a wide 32 mm lens, shot fast from the hip on saturated color negative, known for its tunnel vignette.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Punchy saturated center — deep blues, hot reds, vivid greens — with corners darkened almost to black.
  lighting_and_shadow: Auto exposure that favors the center; corners underexposed; night shots with long, slightly shaky exposure.
  texture_and_material: Medium grain, soft edges, sharpish center, occasional zone-focus miss.
  camera_and_composition: Keep the requested subject and setting; wide close perspective, slightly tilted horizon, subject centered in the bright tunnel.
  atmosphere_and_mood: Spontaneous and reckless, bright center energy squeezed by dark corners.
  rendering_and_quality: Heavy optical vignette and saturated negative color; no light leaks, sprocket holes or cross-processing (other presets own those).
  key_features: tunnel vignette; saturated center; wide 32 mm closeness; tilted hip-shot horizon; soft corners
  creative_brief: "Lomo LC-A snapshot: a compact zone-focus camera with a wide 32 mm lens, shot fast from the hip on saturated color negative, known for its tunnel vignette. Carry it through tunnel vignette, saturated center, wide 32 mm closeness, tilted hip-shot horizon, soft corners. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
