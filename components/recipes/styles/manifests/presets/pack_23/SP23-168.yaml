  aesthetic: 'Billboard sprite 3D space: flat two-dimensional sprites of trees, monsters and items that always face the camera, standing in a simple textured 3D world.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject as a flat sprite that faces the camera inside a 3D space.
  color_and_tone: Pixelated sprites over darker textured walls and floors.
  lighting_and_shadow: Sector lighting; sprites not lit by the scene.
  texture_and_material: Flat pixel sprites, tiled wall textures and floor grids.
  camera_and_composition: First-person or low view with sprites facing the camera.
  atmosphere_and_mood: Keep the requested mood with uncanny flat presence.
  rendering_and_quality: Authentic sprite-in-3D look, kept consistent across the whole image.
  creative_brief: "Billboard sprite 3D space: flat two-dimensional sprites of trees, monsters and items that always face the camera, standing in a simple textured 3D world. Carry it through camera-facing sprites, textured 3D rooms, pixel monsters, flat trees. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
