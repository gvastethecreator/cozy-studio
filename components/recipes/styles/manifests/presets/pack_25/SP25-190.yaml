visualDna:
  aesthetic: 'Interwoven Stroke Display: letter strokes cross over and under each other at a few clear points, the word still reading in order.'
  subject_treatment: Letter a short requested title with strokes that cross over and under at a few well-spaced points, keeping every letter recognizable and in order.
  color_and_tone: One ink or two values per path, readable in monochrome.
  lighting_and_shadow: Flat bands where over and under are shown by the lower stroke stopping.
  texture_and_material: Bands of related weight, clean gaps and only a few crossings.
  camera_and_composition: Spaced crossings and separate words, no central knot blocking the reading.
  atmosphere_and_mood: Continuity and cooperation between strokes, woven and lively.
  rendering_and_quality: Crisp display lettering where each path can be traced by finger.
  creative_brief: "Interwoven Stroke Display: letter strokes cross over and under each other at a few clear points, the word still reading in order. Carry it through over-under strokes, few crossings, traceable paths, short title. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: over-under strokes; few crossings; traceable paths; short title
