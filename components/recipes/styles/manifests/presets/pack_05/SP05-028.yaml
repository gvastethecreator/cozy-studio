visualDna:
  aesthetic: >-
    Build the graphic anime treatment from dry brush lines with imperfect tapered ends and fluid
    shadow shapes and flattened, slightly oversized forms. Let beat-like alternation between short
    marks and long follow-through set its rhythm; use dusty ochre and sepia against pale cyan and
    deep brown for color and scratched brush edges over subtle analog grain and clean rests for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use dry brush lines with imperfect tapered ends
    for edge work, fluid shadow shapes and flattened, slightly oversized forms for form
    simplification, and beat-like alternation between short marks and long follow-through only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with dusty ochre and sepia against pale cyan and deep brown. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: warm and cool value bands with minimal internal shading. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with scratched brush edges over subtle analog grain and clean rests,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use off-axis focal weight, broad quiet margins, and
    sparse directional marks to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey laid-back confidence and held rhythm, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with subdued colors, visible brush grain, and uncluttered silhouettes; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    dry brush lines with imperfect tapered ends; fluid shadow shapes and flattened, slightly
    oversized forms; dusty ochre and sepia against pale cyan and deep brown; beat-like alternation
    between short marks and long follow-through; scratched brush edges over subtle analog grain
    and clean rests; off-axis focal weight, broad quiet margins, and sparse directional marks.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with dry brush lines with
    imperfect tapered ends, fluid shadow shapes and flattened, slightly oversized forms, and dusty
    ochre and sepia against pale cyan and deep brown; use beat-like alternation between short
    marks and long follow-through only where movement is already present, and apply scratched
    brush edges over subtle analog grain and clean rests as the drawing finish.
