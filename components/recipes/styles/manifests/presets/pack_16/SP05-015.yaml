visualDna:
  aesthetic: >-
    A precise 90s cyber-cel look uses recursive line geometry, skewed depth cues and clipped
    cyan-magenta accents. Vertigo comes from repeated alignments and displaced edges, not a required
    city or screen.
  subject_treatment: >-
    Preserve the requested form and proportions. Echo its existing contours with a few measured
    offsets and geometric cuts; do not replace it with a cybernetic body.
  color_and_tone: >-
    When color is open, use cool cyan, restrained magenta and a small screen-green accent against deep
    blue-black. Honor requested colors and avoid flooding the image with neon.
  lighting_and_shadow: >-
    Keep the requested light direction, then sharpen existing edges with synthetic-looking highlights
    and flat cel shadows. Do not invent monitors, signs or light sources.
  texture_and_material: >-
    Use fine scanline interruptions and glass-like reflection accents only where they suit the
    depicted surface. Retain clear cel fills and avoid global wetness or static noise.
  camera_and_composition: >-
    Build vertigo through nested alignments and slight perspective tension inside the existing frame.
    Preserve camera, horizon and object placement; do not add architecture.
  atmosphere_and_mood: >-
    Use measured visual dislocation and cool spacing to support an already requested introspective
    tone. Do not impose existential drama or a surveillance narrative.
  rendering_and_quality: >-
    Keep geometry crisp, offsets deliberate and details readable at normal scale. Restrict scan
    artifacts to a few bands rather than covering the image.
  key_features: >-
    recursive alignment and measured contour offsets; precise cel geometry; limited cyan, magenta and
    green accents
  creative_brief: >-
    Restyle the requested content with recursive geometry, controlled edge offsets and restrained
    digital accents. Keep its identity, materials, setting and composition; introduce no screens,
    cables or cybernetic parts.
