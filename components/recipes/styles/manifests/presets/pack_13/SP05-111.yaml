visualDna:
  aesthetic: >-
    Use carved contour, flat decorative color planes, bokashi bands and parallel line rhythm as a
    printmaking language; do not require waves, rain or Japanese scenery.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep flat color separations and
    restrained bokashi gradients; preserve the prompt palette and cultural details.
  lighting_and_shadow: >-
    Use printed value bands and clean silhouette contrast rather than photographic light; obey
    requested lighting cues.
  texture_and_material: >-
    Simulate cut-line edges, slight ink variation and paper grain; keep hatching parallel and
    deliberate.
  camera_and_composition: >-
    Arrange line and color rhythm around the existing forms; do not impose landscape, horizon or
    decorative border.
  atmosphere_and_mood: >-
    Print-like clarity is the style; retain the prompt's mood and subject without adding cultural
    motifs.
  rendering_and_quality: >-
    Apply the printmaking mechanics to any requested subject without adding waves, rain, costume or
    symbols. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Woodblock contour; bokashi gradient fields; flat color planes; parallel carved marks; paper
    texture.
  creative_brief: >-
    Apply this visual treatment to the requested content: Woodblock contour; bokashi gradient
    fields; flat color planes; parallel carved marks; paper texture. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uncontrolled gradients erasing printed color boundaries
  - blurred contour erasing carved edges
  - hatching unrelated to the underlying form
