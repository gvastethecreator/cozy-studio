visualDna:
  aesthetic: 'Graphite pencil drawing: tone built with a range of hard and soft pencils in layered directional strokes, from crisp H-grade lines to dense 8B darks.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Pure greyscale from bare white paper to a dark silvery grey that never reaches true black; the darkest passages carry a metallic sheen.
  lighting_and_shadow: 'A clear single light: cast shadows laid with firm pressure, half-tones in lighter parallel strokes, highlights left as untouched paper.'
  texture_and_material: Smooth drawing paper with fine tooth catching graphite in the mid-tones, faint smudge where the hand rested, erased highlights with soft edges.
  camera_and_composition: Keep the requested framing; the drawing may fade out unfinished toward the paper edges.
  atmosphere_and_mood: Patient and observational, quiet attention to form.
  rendering_and_quality: Visible stroke direction following the form, crisp contours on the light side, graphite shine in the darks; no charcoal velvet black and no ink line.
  key_features: layered directional pencil strokes; silvery graphite sheen in darks; paper-white highlights; fine tooth in mid-tones; unfinished vignetted edges
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Graphite Pencil as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
