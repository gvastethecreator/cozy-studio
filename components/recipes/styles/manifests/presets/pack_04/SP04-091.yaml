visualDna:
  aesthetic: 'Architectural massing model: the subject rebuilt as a handmade study model of white foam board, chipboard and basswood blocks on a flat base.'
  subject_treatment: Keep the prompt subject, its layout and the requested view, and rebuild every volume as a simplified study model block without facades, furniture or interiors.
  color_and_tone: Foam white, chipboard grey-brown and basswood tan, with one colored acrylic block marking the focal volume.
  lighting_and_shadow: Soft window daylight or a single desk lamp raking across the model, crisp small shadows revealing the volumes.
  texture_and_material: Visible cut foam edges, glue seams, pin heads, blade-scored window lines and tiny unpainted scale figures.
  camera_and_composition: Keep the requested view, framed as a photograph of the model on its base with shallow depth of field.
  atmosphere_and_mood: Thoughtful and tactile, ideas tested in cardboard.
  rendering_and_quality: Real physical model look with no finished facades, no rendered materials and no dollhouse interior.
  key_features: white foam and chipboard volumes; basswood blocks; glue seams and pin heads; one colored focal block; photographed on a base
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Architecture Massing Model as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
