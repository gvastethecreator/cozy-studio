  aesthetic: '1970s faded color print: a family snapshot on chromogenic paper whose cyan dye has faded, leaving a warm magenta-orange cast.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Magenta and orange dominance, weak cyan, washed-out skies, yellowed whites.
  lighting_and_shadow: Sunny daylight or flash; shadows lifted and slightly brownish.
  texture_and_material: Satin print surface, soft grain, slight fading at the edges.
  camera_and_composition: Keep the requested framing with a casual, slightly off-center family snapshot composition.
  atmosphere_and_mood: Warm and bittersweet, a summer kept in an old album.
  rendering_and_quality: Dye-fading in the print; not an overall sepia filter.
