visualDna:
  aesthetic: 'Everyday-object action anime: calm thin contours and flat retail color, broken by a single snapped motion where one limb or object becomes a short straight smear with crisp speed ticks.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Pale fluorescent white, mint and cool grey dominate; one warm tangerine accent marks the snapped element.
  lighting_and_shadow: Flat overhead cool-white wash with almost no modelling; only the snapped element casts a crisp short shadow.
  texture_and_material: Smooth flat fills and fine even lines; the smear is three to five parallel straight strokes, never a soft blur.
  camera_and_composition: Keep the requested framing; stack the scene in clear horizontal lanes and let the snap cut diagonally across one lane.
  atmosphere_and_mood: Mundane calm with one instant of startling precision.
  rendering_and_quality: Minimal detail and clean shapes, with the snap the only streaked element in the frame.
  key_features: calm thin contours; one snapped straight smear; pale fluorescent palette; single tangerine accent; horizontal lane staging
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fluorescent Everyday Snap Action as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
