visualDna:
  aesthetic: >-
    Build the graphic anime treatment from clean contour lines paired with faint schematic strokes
    and simple forms overlaid by abstract construction shapes. Let measured branching vectors with
    deliberate pauses set its rhythm; use mineral green, chalk white, warm mineral gold, and dark
    ink for color and chalky line marks over smooth cel fields and lightly granular color for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use clean contour lines paired with faint
    schematic strokes for edge work, simple forms overlaid by abstract construction shapes for
    form simplification, and measured branching vectors with deliberate pauses only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with mineral green, chalk white, warm mineral gold, and dark ink. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: clear pale highlights and stable dark value anchors. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with chalky line marks over smooth cel fields and lightly granular
    color, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use layered diagram-like spacing with open margins and
    no readable labels to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey practical optimism and curiosity, while preserving
    the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with legible construction lines, mineral color, and restrained chalk texture; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    clean contour lines paired with faint schematic strokes; simple forms overlaid by abstract
    construction shapes; mineral green, chalk white, warm mineral gold, and dark ink; measured
    branching vectors with deliberate pauses; chalky line marks over smooth cel fields and lightly
    granular color; layered diagram-like spacing with open margins and no readable labels.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with clean contour lines
    paired with faint schematic strokes, simple forms overlaid by abstract construction shapes,
    and mineral green, chalk white, warm mineral gold, and dark ink; use measured branching
    vectors with deliberate pauses only where movement is already present, and apply chalky line
    marks over smooth cel fields and lightly granular color as the drawing finish.
