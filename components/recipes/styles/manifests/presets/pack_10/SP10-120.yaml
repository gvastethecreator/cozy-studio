visualDna:
  aesthetic: 'Argyle: overlapping diamonds with thin diagonal crossing lines.'
  subject_treatment: "Apply this motif knitted into the surface of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: diamonds with thin crossing diagonals."
  color_and_tone: Navy, burgundy, green and cream, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Knit wool, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Preppy, classic, cozy and playful, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Argyle as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: argyle diamonds; crossing lines
