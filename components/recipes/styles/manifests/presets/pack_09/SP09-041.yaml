visualDna:
  aesthetic: >-
    Sandpaper turns material failure into the main visual language: start from Abrasive grit, Rough,
    sharp, and Uniform grit, then turn damage history, contamination, corrosion, staining, abrasion,
    and material breakdown into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Treat subjects through Sandpaper's signature cues: Uniform
    grit: preserve identity and pose while letting forms age, stain, corrode, abrade, swell, chip,
    or collapse through edge profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Red Oxide, Brown as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Sparkle on grit define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Sandpaper without hiding the prompt
    subject.
  texture_and_material: >-
    Render Rough, sharp through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Uniform grit as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Rough, functional by using neglect, time, moisture, heat, friction, and
    environmental pressure; the material should color the scene's feeling while preserving the
    user's requested subject and setting.
  rendering_and_quality: >-
    Finish with Industrial, dry material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: >-
    Abrasive grit; Treat subjects through Sandpaper's signature cues: Uniform grit; Rough, sharp;
    Sparkle on grit; Uniform grit
  creative_brief: >-
    Route any subject through Sandpaper as a transferable weathering-and-decay visual system while
    preserving the prompt's subject, action, and setting. Capture the uniform grit of sandpaper
    where sharp mineral particles bristle in ordered ranks across a red-brown field of abrasive
    purpose, each speck a microscopic tooth awaiting contact. The surface should feel hostile to the
    touch, a constellation of cutting edges that catches light as tiny sparks of silver on rust.
    Render the beauty of aggressive function, texture designed to erase other textures. Use
    Sandpaper as portable surface/render behavior over any input: map its texture, light response,
    edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a literal
    material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
