visualDna:
  aesthetic: 'Interrupted Radial Seals: units arranged around a center with one dominant interruption and smaller pauses, breaking ornamental symmetry.'
  subject_treatment: Arrange the prompt's subject as radial units around a center with one main open sector and a few secondary pauses, with any outline shape allowed; set requested text exactly.
  color_and_tone: Contrast between units and void, with one optional accent on the main interruption.
  lighting_and_shadow: Flat graphic rendering, with hierarchy built from the missing sector itself.
  texture_and_material: Units of related size with defined edges and solid ink surfaces.
  camera_and_composition: Optical center slightly shifted when useful, one open sector ruling the others.
  atmosphere_and_mood: Order with a deliberate deviation, confident rather than solemn.
  rendering_and_quality: The mark reads with few units, and the missing sector stays obvious when small.
  creative_brief: "Interrupted Radial Seals: units arranged around a center with one dominant interruption and smaller pauses, breaking ornamental symmetry. Carry it through radial units, dominant open sector, asymmetric pauses, shifted center. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: radial units; dominant open sector; asymmetric pauses; shifted center
