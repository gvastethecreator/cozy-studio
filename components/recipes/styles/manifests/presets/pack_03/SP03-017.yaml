visualDna:
  aesthetic: 'Slime and goo: the target made of thick glossy viscous fluid that sags, drips and stretches into sticky strings.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Saturated translucent color — acid green, hot pink, cobalt — with bright glossy highlights.
  lighting_and_shadow: Backlight glowing through thick goo, sharp wet specular streaks.
  texture_and_material: Sagging mass, stretched strings, trapped bubbles, drips pooling at the base.
  camera_and_composition: Keep the requested framing; show drips and strings leaving the form.
  atmosphere_and_mood: Gross and playful, satisfying and a little disgusting.
  rendering_and_quality: Viscous fluid look with translucency; not hard glossy plastic.
  key_features: sagging viscous form; stretched sticky strings; trapped bubbles; glossy wet highlights; pooling drips
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Slime & Goo as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
