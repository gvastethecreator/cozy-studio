visualDna:
  aesthetic: 'Institutional school portrait: flat studio flash, mottled laser backdrop, and the awkward charm of picture day.'
  subject_treatment: Subject faces forward, shoulders square, posed smile or stiff expression, hair and clothes slightly imperfect.
  color_and_tone: Saturated backdrop — mottled blue, gray or rainbow laser — with slightly warm flash skin.
  lighting_and_shadow: On-axis umbrella flash, faint shadow behind the head, flat even face.
  texture_and_material: Everyday clothes, visible hair flyaways, slight print-lab softness.
  camera_and_composition: Centered head-and-shoulders, identical framing to a yearbook grid, eye-level.
  atmosphere_and_mood: Nostalgic, awkward, endearing, and a little absurd.
  rendering_and_quality: Lab-printed yearbook look with mild softness and vivid backdrop.
  key_features: mottled laser backdrop; flat on-axis flash; forced smile; centered yearbook crop; picture-day awkwardness
  creative_brief: "Institutional school portrait: flat studio flash, mottled laser backdrop, and the awkward charm of picture day. Carry it through mottled laser backdrop, flat on-axis flash, forced smile, centered yearbook crop, picture-day awkwardness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
