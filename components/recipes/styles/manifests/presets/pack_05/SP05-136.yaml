  color_and_tone: Deep forest green, black, ivory and restrained gold; lightning gold with black edges.
  lighting_and_shadow: Clear cel shadows with bright edge accents only where lightning passes.
  texture_and_material: Polished cel with thin etched engraving lines on hard materials, cloth kept plain.
  camera_and_composition: Keep the requested framing; orderly clusters linked by broad diagonals, lightning branches framing rather than covering the subject.
  atmosphere_and_mood: Rowdy determination held inside a formal structure.
  rendering_and_quality: Precise linework, spiky hair and cloth ends, ornament kept selective.
  key_features: black-edged gold lightning branches; etched engraving detail; forest green, black and gold; spiky contour ends; polished cel
