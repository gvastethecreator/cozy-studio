visualDna:
  aesthetic: 'Carouselpunk: family memories projected from rotating slide carousels, with dust-filled beams, warm color slides, clicking changes and living rooms turned into cinemas.'
  subject_treatment: Keep the prompt's subject and setting; show it as a warm color slide projected onto a wall or sheet in a dark living room.
  color_and_tone: Warm saturated slide colors, faded magenta shifts and brown-dark living rooms.
  lighting_and_shadow: A single projector beam through dust and the glow of the projected image.
  texture_and_material: Slide film grain, dust in the beam, hanging bedsheets, wallpaper and carpet.
  camera_and_composition: Dark rooms with a glowing projected image and silhouettes of viewers.
  atmosphere_and_mood: Warm, nostalgic and bittersweet, memories glowing on a wall.
  rendering_and_quality: Warm grainy illustration with a luminous projected image and dust.
  creative_brief: "Carouselpunk: family memories projected from rotating slide carousels, with dust-filled beams, warm color slides, clicking changes and living rooms turned into cinemas. Carry it through projected slides, dust beams, dark living rooms, viewer silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: projected slides; dust beams; dark living rooms; viewer silhouettes
