visualDna:
  aesthetic: >-
    Crisp technical painting uses geometric reflections inside existing forms, with clean boundaries
    that describe surface orientation rather than adding graphic overlays.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Apply reflected color only where
    the represented material already supports it; do not convert the subject's materials.
  color_and_tone: >-
    Keep the requested palette. Localize any chromatic reflection within its existing hues and the
    existing surface instead of spreading a rainbow effect across the image.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Tie each defined reflection to that light and
    the existing surface orientation without adding another source.
  texture_and_material: >-
    Use sharp, contained reflection shapes and keep material changes visible. Treat the effect as
    painted color, not a physical foil or print surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Reflections stay inside forms and do
    not become labels, a frame or a card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Local reflected color does not add a scene or ambient effect.
  rendering_and_quality: >-
    Establish the major planes first, then place limited geometric reflections where material and
    light warrant them. Keep contours and defining details crisp.
avoidRules:
  - rainbow or spectral effects across every surface
  - reflections that change the requested material or palette
  - unrequested labels, frame or card layout
