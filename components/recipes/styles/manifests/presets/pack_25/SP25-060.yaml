visualDna:
  aesthetic: 'Icon Family Reduction: a family of related app icons built from one shared rule, shown large and at small sizes on one sheet.'
  subject_treatment: Present the prompt's subject as a family of related icons from shared rules, each shown large and reduced with only local simplifications.
  color_and_tone: Shared color roles across the family, each icon also checked in greyscale.
  lighting_and_shadow: One light direction and softness for every member of the family.
  texture_and_material: Materials at one consistent scale, fine detail reduced before sharpening.
  camera_and_composition: Rows of large and small versions with equal optical weight.
  atmosphere_and_mood: Clear kinship across the set without making every object the same shape.
  rendering_and_quality: Each small version keeps its own metaphor and the shared system traits.
  creative_brief: "Icon Family Reduction: a family of related app icons built from one shared rule, shown large and at small sizes on one sheet. Carry it through shared rules, large and small rows, equal weight, kept metaphors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared rules; large and small rows; equal weight; kept metaphors
