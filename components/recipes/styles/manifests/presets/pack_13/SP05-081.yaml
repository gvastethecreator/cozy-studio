visualDna:
  aesthetic: 'Kyoto Animation television style of its slice-of-life band and club series: soft rounded character designs, large luminous layered eyes, glossy hair highlights, immaculate cleanup lines and tiny precise hand, foot and hair acting.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw adults with soft rounded faces, big glossy eyes with several highlight layers and small expressive gestures of hands, shoulders and feet. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pastel warm palette, cream, peach, sky blue and soft teal, with gentle color-graded light.
  lighting_and_shadow: Diffuse window light, soft two-tone cel shadows, subtle lens flare and warm bloom on highlights.
  texture_and_material: Clean digital cel paint, thin colored lines, detailed photo-traced backgrounds with shallow-focus bokeh.
  camera_and_composition: Intimate close shots of hands and faces, shallow depth of field, leg and object inserts, gentle eye-level framing.
  atmosphere_and_mood: Keep the requested mood with tender shared everyday warmth.
  rendering_and_quality: Polished high-budget television animation frame with film-like focus and grading.
  key_features: Kyoto Animation cel look; layered glossy eyes; small hand acting; bokeh backgrounds; pastel diffuse light
  creative_brief: "Kyoto Animation television style of its slice-of-life band and club series: soft rounded character designs, large luminous layered eyes, glossy hair highlights, immaculate cleanup lines and tiny precise hand, foot and hair acting. Carry it through Kyoto Animation cel look, layered glossy eyes, small hand acting, bokeh backgrounds, pastel diffuse light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
