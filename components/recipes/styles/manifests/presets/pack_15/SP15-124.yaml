  aesthetic: 'Gaslamp fantasy punk: a fog-bound 19th-century city where gas lamps, street magic, clockmakers and fae markets mix in narrow cobbled lanes.'
  subject_treatment: Keep the prompt's subject and setting; place it in gaslit fog with one quiet touch of magic hidden in ordinary Victorian life.
  color_and_tone: Fog grey and soot brown with warm gaslight yellow and small emerald or violet magical accents.
  lighting_and_shadow: Pools of gaslight in thick fog, silhouettes appearing between lamps and soft haloes.
  texture_and_material: Wet cobbles, soot-stained brick, wrought iron lamps, wool coats and top hats.
  camera_and_composition: Narrow street perspectives receding into fog with figures caught between lamps.
  atmosphere_and_mood: Mysterious and cozy, a city where every alley might hide a small enchantment.
  rendering_and_quality: Painterly period illustration with soft fog gradients and crisp gaslight glows.
  creative_brief: "Gaslamp fantasy punk: a fog-bound 19th-century city where gas lamps, street magic, clockmakers and fae markets mix in narrow cobbled lanes. Carry it through gaslight pools, thick fog, cobbled lanes, hidden magic. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
