visualDna:
  aesthetic: '70s limited TV animation: budget television cartoons with held cels, only mouths and eyes moving, thick outlines and painted backgrounds that repeat in pans.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Flat saturated cel colors, muted painted backgrounds in greens, browns and dusk blues.
  lighting_and_shadow: No cel shading; night shown by blue-tinted backgrounds.
  texture_and_material: Thick uniform outlines, visible cel dust, slightly different color on moving parts.
  camera_and_composition: Characters in a row facing camera or in profile, a repeating painted background behind a chase.
  atmosphere_and_mood: Goofy and cozy, Saturday-morning adventure on a tight budget.
  rendering_and_quality: Broadcast cel look with slight dust; original characters, no existing show designs.
  creative_brief: "70s limited TV animation: budget television cartoons with held cels, only mouths and eyes moving, thick outlines and painted backgrounds that repeat in pans. Carry it through held cels with moving mouths, thick outlines, repeating painted background, flat saturated color, cel dust. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: held cels with moving mouths; thick outlines; repeating painted background; flat saturated color; cel dust
