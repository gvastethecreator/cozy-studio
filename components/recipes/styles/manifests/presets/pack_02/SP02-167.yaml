  color_and_tone: Tan and grey wet sand, darker wet grooves, silver reflections of the sky.
  lighting_and_shadow: Low sun raking across the grooves so every line has a shadowed edge.
  texture_and_material: Ridged sand displaced along each line, shell fragments, foam edge nearby.
  camera_and_composition: Seen from above or a high angle, the drawing large on the beach, a wave edge in one corner.
  atmosphere_and_mood: Carefree and temporary, a drawing the sea will take back.
  rendering_and_quality: Real grooves in wet sand; not sand sculpture and not colored sand art.
