visualDna:
  aesthetic: 'Urban farmpunk: dense cities turned into farms, with rooftop fields, balcony rice terraces, subway mushroom caves and livestock in parking garages.'
  subject_treatment: Keep the prompt's subject and setting; farm every surface around it, from roofs and balconies to tunnels and staircases.
  color_and_tone: Crop greens and grain golds against concrete grey, with red tomatoes and flower accents.
  lighting_and_shadow: Sunlight on rooftop fields and grow-light pink in underground farms.
  texture_and_material: Soil beds, irrigation pipes, crates, concrete and climbing vines.
  camera_and_composition: Vertical cityscapes where every level is a different kind of farm.
  atmosphere_and_mood: Busy and nourishing, a city that learned to feed itself from its own walls.
  rendering_and_quality: Dense lively illustration with readable crops and city structures together.
  creative_brief: "Urban farmpunk: dense cities turned into farms, with rooftop fields, balcony rice terraces, subway mushroom caves and livestock in parking garages. Carry it through rooftop fields, balcony terraces, grow-light caves, livestock in garages. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rooftop fields; balcony terraces; grow-light caves; livestock in garages
