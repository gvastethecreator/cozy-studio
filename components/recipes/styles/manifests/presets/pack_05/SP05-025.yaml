  aesthetic: 'Takeshi Obata manga art as in Death Note: elegant realistic line, gothic shadows, refined fashionable characters, and tense intellectual thriller staging.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Obata elegance, slender refined figures, sharp intelligent eyes, detailed hair and fashionable clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: 'Black ink with elegant tone, and in color: deep red, black and gothic purple.'
  lighting_and_shadow: Dramatic chiaroscuro with long gothic shadows falling across calm faces.
  texture_and_material: Refined precise pen line, careful hair strands and detailed rendering of clothes.
  camera_and_composition: Tense intellectual framing, dramatic close-ups and symbolic compositions.
  atmosphere_and_mood: Keep the requested mood with cold intellectual tension.
  rendering_and_quality: Elegant precise manga illustration with gothic thriller mood.
  key_features: Obata elegance; gothic shadows; intellectual tension; refined line
  creative_brief: "Takeshi Obata manga art as in Death Note: elegant realistic line, gothic shadows, refined fashionable characters, and tense intellectual thriller staging. Carry it through Obata elegance, gothic shadows, intellectual tension, refined line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
