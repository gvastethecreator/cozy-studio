visualDna:
  aesthetic: 'Continuous Handle Objects: handle and body grow from one continuous path of material, with readable transitions of thickness.'
  subject_treatment: Grow the prompt's product handle and body from one continuous material path with a readable change of thickness and a generous grip gap.
  color_and_tone: One main color with an optional contrasting interaction zone.
  lighting_and_shadow: Broad light running along the continuity and revealing the handle gap.
  texture_and_material: Sober material, seamless where continuity is proposed and jointed where it ends.
  camera_and_composition: A wide grip gap, a balanced body and an obvious direction of use.
  atmosphere_and_mood: Resilient fluidity and economy of parts, one confident gesture.
  rendering_and_quality: Clean concept render where continuity holds from side and back views.
  creative_brief: "Continuous Handle Objects: handle and body grow from one continuous path of material, with readable transitions of thickness. Carry it through continuous handle path, readable transition, wide grip gap, one material. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: continuous handle path; readable transition; wide grip gap; one material
