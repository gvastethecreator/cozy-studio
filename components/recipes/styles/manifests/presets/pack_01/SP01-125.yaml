visualDna:
  aesthetic: 'Backlit botanical photography: petals, leaves and seeds shot against the sun or a bright source so their veins and translucency glow.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Glowing translucent greens, reds and golds against a dark or softly bright background.
  lighting_and_shadow: Strong backlight through the plant, a rim of light on hairs and edges, dark negative space.
  texture_and_material: Veins, cell patterns, fine hairs and seeds rendered luminous and precise.
  camera_and_composition: Macro or close-up, the plant against a darker background, shallow depth with glowing bokeh.
  atmosphere_and_mood: Delicate and radiant, fragile living structures lit from within.
  rendering_and_quality: Clean highlights without clipping in the glowing tissue.
  creative_brief: "Backlit botanical photography: petals, leaves and seeds shot against the sun or a bright source so their veins and translucency glow. Carry it through light through leaves and petals, glowing veins, rim-lit hairs, dark background, shallow bokeh. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: light through leaves and petals; glowing veins; rim-lit hairs; dark background; shallow bokeh
