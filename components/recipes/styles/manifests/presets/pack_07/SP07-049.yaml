visualDna:
  aesthetic: 'Tournament turf: precision-maintained sports turf read as landscape design, with striped mowing bands, rolling contoured greens, sharp-edged bunkers and still water edges.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Alternating light and dark greens from mowing direction, pale sand, dark water, wind-bleached rough; clean and graphic.
  lighting_and_shadow: Low morning or evening light that exaggerates stripe contrast and ground contour, dew sparkle on short grass.
  texture_and_material: Close-mown fine grass in stripes, soft rolling contours, crisp revetted or sand bunker lips, longer fescue rough, stone or timber water edges.
  camera_and_composition: Keep the requested view; high or low angle that makes stripes converge and contours read, open space as the subject.
  atmosphere_and_mood: Calm, exact and expectant, space prepared for a contest.
  rendering_and_quality: Sharp landscape photograph with even stripe pattern and dew detail, no stadium branding or readable signs.
  key_features: striped mowing bands; rolling contoured greens; sharp bunker lips; dew on short grass; still water edge
  creative_brief: "Tournament turf: precision-maintained sports turf read as landscape design, with striped mowing bands, rolling contoured greens, sharp-edged bunkers and still water edges. Carry it through striped mowing bands, rolling contoured greens, sharp bunker lips, dew on short grass, still water edge. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
