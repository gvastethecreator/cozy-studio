visualDna:
  aesthetic: 'Stencilpunk: everything built from layered spray stencils, with crisp cut edges, overspray halos, two- or three-color layers and bridges left in the cut shapes.'
  subject_treatment: Keep the prompt's subject and setting; render it as layered spray-stencil shapes with cut bridges and overspray on walls.
  color_and_tone: Limited palettes of black, one bright color and a mid tone on concrete or brick.
  lighting_and_shadow: Light and shadow expressed only as flat stencil layers, no smooth gradients.
  texture_and_material: Spray paint overspray, drips, concrete, brick and cut card stencil edges.
  camera_and_composition: Bold graphic silhouettes placed on real walls with strong negative space.
  atmosphere_and_mood: Quick, clever and rebellious, an image made in minutes before anyone notices.
  rendering_and_quality: Crisp flat layered stencil illustration with visible overspray and drips.
  creative_brief: "Stencilpunk: everything built from layered spray stencils, with crisp cut edges, overspray halos, two- or three-color layers and bridges left in the cut shapes. Carry it through cut stencil layers, overspray halos, stencil bridges, limited palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cut stencil layers; overspray halos; stencil bridges; limited palette
