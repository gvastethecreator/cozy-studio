visualDna:
  aesthetic: 'Alberto Breccia page look of the 1960s to 1980s: experimental horror texture from monotype, collage, razor-scraped ink and sponged black, faces dissolving into smears and fog.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render the subject in scraped, sponged and monotyped black ink dissolving into texture. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black and white with grey monotype smears, true to the Alberto Breccia palette.
  lighting_and_shadow: Murky fog light scraped out of solid black.
  texture_and_material: Monotype, collage, sponge and razor-scraped ink on board.
  camera_and_composition: Claustrophobic horror panels with dissolving faces, framed the way Alberto Breccia composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with dread-soaked cosmic horror.
  rendering_and_quality: Faithful Breccia experimental horror page, in the recognizable hand of Alberto Breccia.
  creative_brief: "Alberto Breccia page look of the 1960s to 1980s: experimental horror texture from monotype, collage, razor-scraped ink and sponged black, faces dissolving into smears and fog. Carry it through Breccia monotype horror, scraped ink. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Breccia monotype horror; scraped ink
