visualDna:
  aesthetic: 'Sleep-paralysis bedside: a dim bedroom seen from the pillow at night, the familiar room stretched and heavy while a shadowed presence waits at the edge of vision.'
  subject_treatment: Show the prompt's subject in a dark bedroom from a low bed-level view, keeping it clear while a vague presence hovers at the edge.
  color_and_tone: Deep navy, charcoal and faint moonlight grey with a weak warm glow from a streetlight.
  lighting_and_shadow: Moonlight and streetlight slats, shadows too dense in the corners and doorways.
  texture_and_material: Crumpled sheets, heavy blankets, grainy darkness and softly warped furniture.
  camera_and_composition: Low pillow-level view with the ceiling and doorway looming, slightly distorted perspective.
  atmosphere_and_mood: Heavy, helpless and suffocating, awake but unable to move.
  rendering_and_quality: Soft grainy painterly darkness with subtle distortion and blur at the edges.
  creative_brief: "Sleep-paralysis bedside: a dim bedroom seen from the pillow at night, the familiar room stretched and heavy while a shadowed presence waits at the edge of vision. Carry it through pillow-level view, heavy dark corners, shadowed presence, warped room. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pillow-level view; heavy dark corners; shadowed presence; warped room
