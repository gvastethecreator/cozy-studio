visualDna:
  aesthetic: 'Sandpaper abrasion: surfaces covered in grit or scuffed by sanding into a matte scratched finish.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the surface is gritty or sanded matte with swirl marks and exposed layers. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Muted, dusty tones with pale sanding marks, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light showing matte grit, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Abrasive grit, sanding swirls and dust, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Rough, workshop-worn and matte, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: abrasive grit; sanding swirls; matte scuffed finish; surface-level damage; structure intact
  creative_brief: "Sandpaper abrasion: surfaces covered in grit or scuffed by sanding into a matte scratched finish. Carry it through abrasive grit, sanding swirls, matte scuffed finish, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
