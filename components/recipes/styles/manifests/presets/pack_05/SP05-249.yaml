visualDna:
  aesthetic: 'Anime cel painting crossed with relief printing: inky indigo blocks, fine hatchwork, cream paper grain and slightly off-register edges.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Simplify forms into clear masses with selective etched line detail; never turn the subject into printed pages or add a press.
  color_and_tone: Cream, deep indigo and restrained amber, limited to two or three flat inks.
  lighting_and_shadow: Flat broad light with graphic shadow shapes carved as solid indigo ink.
  texture_and_material: Fine hatch marks, cream paper grain, ink squash at block edges and a small misregistration between colors.
  camera_and_composition: Keep the requested view; bold flat masses are balanced against small detailed areas.
  atmosphere_and_mood: Quietly studious and devoted, patient work by lamplight.
  rendering_and_quality: Clean block boundaries, controlled hatching and visible print texture throughout.
  key_features: inky indigo blocks; cream paper grain; fine hatchwork; slight off-register edges; amber accent ink
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Indigo Block-Print Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
