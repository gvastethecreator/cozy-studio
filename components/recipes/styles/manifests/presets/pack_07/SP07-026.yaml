visualDna:
  aesthetic: 'Googie architecture: car-age roadside modernism with upswept cantilevered roofs, boomerang and parabolic forms, starbursts, angled glass walls and neon.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Turquoise, coral red, lemon and white with chrome and stone veneer; bright desert sky by day, neon pinks and blues at night.
  lighting_and_shadow: Hard desert sun with strong shadows under thin cantilevered roofs, or night neon tubes outlining the forms.
  texture_and_material: Thin folded-plate concrete or steel roofs, angled plate glass, flagstone and stone veneer walls, terrazzo, chrome and enamel panels, neon tubing.
  camera_and_composition: Keep the requested view; low angle under the upswept roof edge, the boomerang line crossing the frame diagonally.
  atmosphere_and_mood: Buoyant, jet-age and playful, speed promised to passers-by.
  rendering_and_quality: Saturated period-colour photograph, crisp roof edges and neon glow, no readable signs.
  key_features: upswept cantilevered roof; boomerang and parabolic forms; starburst ornaments; angled plate glass; neon outlines
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Googie Architecture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
