visualDna:
  aesthetic: >-
    For Honor (2017) third-person melee capture with heavy practical armor, massive fortified
    terrain and clear guarded combat spacing under natural battlefield light.
  subject_treatment: >-
    Preserve requested actors and action. For humanoid warriors, use For Honor's heavy,
    broad-shouldered game silhouettes, layered armor mass and weight-bearing stance. When a duel is
    requested, make the attack lane and responding guard legible; do not invent an opponent or
    attack in an unrelated scene.
  color_and_tone: >-
    Use base-game earth, weathered iron and slate with restrained ochre or burgundy cloth accents,
    cool overcast stone and warm local fire. Preserve explicit requested colors; otherwise avoid
    uniformly beige armor and terrain or jewel-lit high fantasy. Separate the controlled silhouette
    from its opponent by value and local color.
  lighting_and_shadow: >-
    Use plausible game-scene lighting that keeps weapons, guard direction and bodies legible. Avoid
    dramatic key-art spotlights that erase the battlefield.
  texture_and_material: >-
    Build equipment from substantial overlapping plate, mail at articulated joints, strapped leather
    and coarse padded cloth. Show hammered steel, localized chipped paint, edge wear and compressed
    cloth as distinct surfaces. Base-game knight, Viking and samurai construction vocabularies may
    guide original gear; avoid thin decorative fantasy armor, polished cosplay and uniform
    micro-scratches.
  camera_and_composition: >-
    Third-person gameplay view anchored behind or just above the controlled subject. For a duel,
    keep both full combat silhouettes and crossing weapon lanes readable; for objective movement,
    retain surrounding traversable terrain. Preserve the requested mode instead of forcing every
    frame into a duel.
  atmosphere_and_mood: >-
    Show an active playable exchange, guard read or objective movement. Preserve the prompt's
    stakes; do not force a kill, siege or capture-point event.
  rendering_and_quality: >-
    Maintain real-time 2017 game-capture clarity and combat scale. Add objective markers, player
    labels or combat UI only if specifically requested and supported by the selected mode.
avoidRules:
  - >-
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
    unrequested named heroes, copied emblems or live-service event scenes; retain characteristic
    base-game equipment construction
  - switching the third-person view to a side-on fighting-game plane
  - unrequested blood, objective markers, combat text or fabricated HUD
  - cinematic blur that hides guard direction or combat spacing
