    into dark symbolic behavior fused with Norse saga noir with rune law, ash-world memory, frost
    authority, longnight endurance, and iron oath momentum; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    raven shaping silhouette rhythm, contour pressure, and symbolic edge control, signal shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus intelligence shaping
    silhouette rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette
    pressure, emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory
    actor or prop set.
