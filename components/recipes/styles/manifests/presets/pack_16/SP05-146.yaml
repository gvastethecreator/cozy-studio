visualDna:
  aesthetic: >-
    Gothic anime defined by ornate shadow shapes, polished edge light and soft, velvety dark
    values.
  subject_treatment: >-
    Preserve the supplied identity and pose. Use restrained contours and selective edge
    highlights.
  color_and_tone: >-
    Where palette is open, use black, crimson, bone white, violet and polished-gold accents;
    retain requested hues.
  lighting_and_shadow: >-
    Use a firm rim against deep, soft shadow, with a small warm glow only when compatible
    with the prompt.
  texture_and_material: >-
    Contrast matte dark areas with polished highlights on surfaces already present.
  camera_and_composition: >-
    Honor the requested camera and staging; keep ornament subordinate to the main
    silhouette.
  atmosphere_and_mood: >-
    Solemnity or tension can follow the prompt's requested mood.
  rendering_and_quality: >-
    Keep decorative edges precise, shadows soft and backgrounds integrated without losing
    contour detail.
  key_features: >-
    Ornate shadow; polished rim over velvety dark values; controlled warm glow;
    matte-to-gloss contrast.
  creative_brief: "Use dark value shapes, precise edge light and subject-dependent surface contrast. Preserve the requested scene, colors and composition. Use it as a reusable look on any subject."
