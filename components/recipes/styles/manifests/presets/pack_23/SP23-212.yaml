  color_and_tone: Rich cinematic palette across a wide horizon, kept consistent across the whole image.
  lighting_and_shadow: Consistent dramatic light across all panels, kept consistent across the whole image.
  texture_and_material: Printed card panels, creases and slight edge wear.
  camera_and_composition: Very wide panorama split by three vertical creases.
  atmosphere_and_mood: Keep the requested mood with grand campaign scale.
  rendering_and_quality: Continuous painting with no tables or text, kept consistent across the whole image.
  creative_brief: "Game-master screen panorama: a long continuous painting stretched across three or four folding panels, a sweeping fantasy vista with visible panel creases. Carry it through panoramic painting, folding creases, wide vista, campaign scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
