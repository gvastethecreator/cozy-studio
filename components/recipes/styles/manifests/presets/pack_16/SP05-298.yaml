visualDna:
  aesthetic: >-
    Build a nocturne from broad blue-violet shadow masses, narrow warm-cyan points, and softened
    secondary contours against crisp foreground edges.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Silhouette
    grouping is allowed only where supplied shapes already overlap.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use midnight blue, black
    violet, sodium amber, and cold cyan; keep exact user colors where specified.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Show only practical light supplied by the
    prompt; keep glints source-bound and omit invented lamps or wet reflections.
  texture_and_material: >-
    Apply texture only to materials already present. Use low grain in broad shadows and fine
    marks on existing lit materials; avoid noise and false sheen.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Stagger emphasis among
    existing forms while leaving their arrangement unchanged.
  atmosphere_and_mood: >-
    Keep requested emotion; nocturnal contrast does not require secrecy, tension, or social
    grouping.
  rendering_and_quality: >-
    Retain one-to-one subject readability against dark masses and keep small light accents
    sparse.
  key_features: >-
    Blue-violet shadow; sparse amber-cyan points; crisp foreground; softened secondary edge.
  creative_brief: 'Use blue-violet shadow; sparse amber-cyan points; crisp foreground; softened secondary edge. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
