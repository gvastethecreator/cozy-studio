visualDna:
  aesthetic: 'Polished mobile-game splash-art cel in candy pastels: crisp soft colored lineart, glossy two-tone shading and a luminous bloom pass over highlights.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Figures get large bright eyes, glossy hair highlights and clean costume shapes; do not add a banquet, crowd or idol lineup.
  color_and_tone: Mint, blush pink, lilac and buttery cream with white-hot highlights, bright and high-key, shadows tinted lavender instead of grey.
  lighting_and_shadow: Broad frontal light with a soft bloom halo around highlights and small sparkles on glossy edges.
  texture_and_material: Smooth cel fills, satin gloss bands on hair and fabric and floating petal-like light specks.
  camera_and_composition: Keep the requested view; a centered subject with airy spacing and a soft pastel gradient behind it.
  atmosphere_and_mood: Joyful, sweet and abundant, festive without needing a party.
  rendering_and_quality: Colored lineart instead of black, clean color separation and a controlled bloom that never washes out form.
  key_features: candy pastel palette; colored lineart; lavender-tinted shadows; satin gloss bands; soft bloom halo
  creative_brief: "Polished mobile-game splash-art cel in candy pastels: crisp soft colored lineart, glossy two-tone shading and a luminous bloom pass over highlights. Carry it through candy pastel palette, colored lineart, lavender-tinted shadows, satin gloss bands, soft bloom halo. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
