visualDna:
  aesthetic: 'Pictorial Stroke Economy: figurative marks built from very few strokes that share segments between parts of the figure.'
  subject_treatment: Draw the prompt's subject with the fewest strokes possible, sharing segments between compatible parts while keeping its essential traits; set requested text exactly.
  color_and_tone: One high-contrast ink with solid strokes carrying every trait of the figure.
  lighting_and_shadow: Even graphic rendering, with every limb and part drawn by a stroke.
  texture_and_material: Firm contours with little weight variation and clean open interiors.
  camera_and_composition: One main figure with dominant free space and its distinctive orientation kept.
  atmosphere_and_mood: Clarity with a surprisingly economical gesture that keeps full identity.
  rendering_and_quality: The subject reads without a caption and shared strokes never create impossible anatomy.
  creative_brief: "Pictorial Stroke Economy: figurative marks built from very few strokes that share segments between parts of the figure. Carry it through few shared strokes, figurative clarity, open space, economical gesture. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: few shared strokes; figurative clarity; open space; economical gesture
