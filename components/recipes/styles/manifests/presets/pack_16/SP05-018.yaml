visualDna:
  aesthetic: >-
    A dusty 90s cel style pairs relaxed, elongated contour strokes with abrupt angular accents and
    sun-worn color. Its absurdity lives in elastic timing and uneven scale, not a western or space
    setting.
  subject_treatment: >-
    Keep the requested subject and proportions. Give existing gestures an easy, slightly elastic
    contour rhythm; do not add a cowboy, vehicle, weapon or comic gag.
  color_and_tone: >-
    When color is open, contrast dusty ochre and faded coral with cool blue-violet shadow. Preserve
    requested hues and keep saturation uneven rather than uniformly bright.
  lighting_and_shadow: >-
    Use broad warm-cool value separation and crisp cel shadow shapes. Follow the requested light
    without adding a desert sun or artificial rim.
  texture_and_material: >-
    Use painted fills with dry, dusty grain and a few rough ink accents. Keep material response
    faithful and avoid coating everything in dust.
  camera_and_composition: >-
    Allow an off-kilter balance and a long directional sweep within the requested framing. Preserve
    camera and layout; do not add a horizon, vehicle or western staging.
  atmosphere_and_mood: >-
    Create a wry, loose rhythm only through contour and spacing. Keep the requested emotional register
    instead of inserting a joke or outlaw plot.
  rendering_and_quality: >-
    Combine clean cel separation with selective edge roughness and restrained background detail. Avoid
    uniform VHS damage or smeared motion.
  key_features: >-
    elongated relaxed contours with abrupt angular accents; dusty warm-cool contrast; playful visual
    timing without literal gags
  creative_brief: "Restyle the requested content with dusty cel color, elastic line rhythm and an off-center sweep. Preserve its identity, action, environment and camera; add no western, spacecraft or outlaw props. Use it as a reusable look on any subject."
