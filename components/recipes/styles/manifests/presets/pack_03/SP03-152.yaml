visualDna:
  aesthetic: 'Depth-sliced hologram shader: the subject rebuilt as dozens of parallel glowing contour slices stacked in depth, like a volumetric display, with dark gaps between layers.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Warm amber or soft green glowing lines on deep black, brighter where slices bunch at steep surfaces.
  lighting_and_shadow: Self-lit contour lines only; no shading, no projector beam and no scanline overlay.
  texture_and_material: Evenly spaced horizontal slice outlines, thin filled bands on each slice, the form read by how slice shapes change.
  camera_and_composition: Keep the requested camera; a three-quarter angle shows the stacked slice spacing best.
  atmosphere_and_mood: Quiet and archival, a memory kept as layers of light.
  rendering_and_quality: Additive line render with crisp slice edges; distinct from translucent scanlined hologram material.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Depth-Sliced Hologram Shader as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: stacked parallel contour slices; dark gaps between layers; amber or green self-lit lines; no scanlines; no projector beam
