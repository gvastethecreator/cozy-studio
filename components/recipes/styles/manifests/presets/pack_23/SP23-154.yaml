visualDna:
  aesthetic: 'Two-tone duotone pixel: pixel art using only two colors, a light and a dark, with pattern and silhouette doing all the work.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject using just two colors with patterned mid-values.
  color_and_tone: Exactly two colors, such as cream and deep plum.
  lighting_and_shadow: Light and shadow made from patterns of the two colors.
  texture_and_material: Crisp pixels, checker and line patterns, kept consistent across the whole image.
  camera_and_composition: Strong silhouette-driven composition, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with stark graphic mystery.
  rendering_and_quality: Clear readable image with only two colors, kept consistent across the whole image.
  creative_brief: "Two-tone duotone pixel: pixel art using only two colors, a light and a dark, with pattern and silhouette doing all the work. Carry it through two colors only, patterned mid-values, strong silhouette, crisp pixels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two colors only; patterned mid-values; strong silhouette; crisp pixels
