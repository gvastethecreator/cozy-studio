  color_and_tone: Dark wet stone greys and ochres with blue-green glowworm light and warm torch amber.
  lighting_and_shadow: Torchlight and glowing cave organisms in deep darkness, dramatic shadows on rock.
  texture_and_material: Wet limestone, dripping stalactites, carved stone, still water and crystals.
