  color_and_tone: 'Every bright candy color at once: pink, yellow, sky blue, mint and purple.'
  lighting_and_shadow: Bright, flat, playful daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Plastic clips, tulle, fleece, vinyl stickers and plush toys.
  camera_and_composition: Full figure packed with accessories, playful pose, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Joyful, excessive, childlike and fearless, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Crisp, saturated, detailed finish, with believable fabric weight, seams and fit detail.
