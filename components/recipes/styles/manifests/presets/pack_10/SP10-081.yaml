  color_and_tone: Saturated contrasting color rings, used consistently across subject and background.
  lighting_and_shadow: Light is color contrast itself, expressed through the style rather than photographic lighting.
  texture_and_material: Painted concentric rings and arcs, visible at card size as the signature of the style.
  camera_and_composition: Circular rhythms around the subject, arranged so the subject still reads at card size.
  atmosphere_and_mood: Joyful, rhythmic, luminous and musical, driven by the construction, color and rhythm.
  rendering_and_quality: Painterly flat finish, with clean, deliberate marks and no accidental noise.
