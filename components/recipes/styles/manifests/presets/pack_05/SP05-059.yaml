visualDna:
  aesthetic: >-
    Precise layered illustration with translucent planes, modular line divisions, and
    optical-glass clarity; data-like geometry remains abstract and never becomes readable
    interface content.
  subject_treatment: >-
    Preserve the subject and its proportions. Clarify its existing structure with fine layered
    contours and selected transparent-looking accents, not agent silhouettes or devices.
  color_and_tone: >-
    Use cool teal, glass green, slate, and silver-white, with modest contrast and carefully
    separated transparent-looking color layers.
  lighting_and_shadow: >-
    Pair clear cel-shadow shapes with thin refracted highlights along existing edges; keep the
    light even and technical.
  texture_and_material: >-
    Retain the depicted materials, adding delicate double lines, polished edge glints, and
    sparse etched geometry without covering the surface.
  camera_and_composition: >-
    Respect the specified view. Repeat modular alignments within the composition and keep
    overlays subordinate to the subject.
  atmosphere_and_mood: >-
    Create calm analytical tension with ordered spacing, fine detail, and restrained tonal
    shifts; introduce no investigation scene.
  rendering_and_quality: >-
    Use crisp line weights, clean translucent color fields, stable shadow bands, and sparse
    nonverbal marks; omit legible text.
  key_features: >-
    Translucent color layers; modular contours; optical edge glints; calm teal and glass-green
    palette.
  creative_brief: >-
    Keep the subject, action, and setting specified by the prompt. Apply translucent color
    layers, modular contours, and optical edge glints; add no agent, device, or readable
    interface.
