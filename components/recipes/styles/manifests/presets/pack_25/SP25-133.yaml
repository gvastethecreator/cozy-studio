visualDna:
  aesthetic: 'Cut-Paper Shelf Graphics: big flat cut-out silhouettes and color fields build a product family that reads from across the aisle.'
  subject_treatment: Build the prompt's product family from large flat cut-out silhouettes and fields, one per variant, with the name kept exact and in the same place.
  color_and_tone: Two or three well-separated colors, the main figure clear in greyscale.
  lighting_and_shadow: Flat graphic cut shapes on a neutral board, printed rather than collaged.
  texture_and_material: Deliberately simple edges, clean and flat like freshly printed paper.
  camera_and_composition: One big motif and a stable name, the cut shapes continuing onto the sides.
  atmosphere_and_mood: Graphic energy and strong shelf presence, bold and friendly.
  rendering_and_quality: The main silhouette reads even as a tiny shelf thumbnail.
  creative_brief: "Cut-Paper Shelf Graphics: big flat cut-out silhouettes and color fields build a product family that reads from across the aisle. Carry it through big cut silhouettes, flat fields, shelf readability, stable name. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: big cut silhouettes; flat fields; shelf readability; stable name
