visualDna:
  aesthetic: >-
    Letterpress becomes a transferable print finish and luminous line system: start from Deep
    impression ink and Impression depth, then route prompt content through embossing, debossing,
    foil reflectance, neon tubing, ink pressure, and premium substrate logic without forcing one
    card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Debossed to outline, stamp, emboss, deboss,
    gild, illuminate, or impress prompt subjects without replacing them with signage; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Solid ink; treat color as ink, paper, metallic foil, dark-field glow,
    warm tube light, or substrate contrast, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Shadow in impression drive the light response: make highlights come from reflective foil,
    depressed paper shadows, glow falloff, or luminous glass tubes, avoiding generic glamour
    lighting unless the prompt explicitly asks for it.
  texture_and_material: >-
    Render Cotton paper as the tactile or mark-making basis; surface detail should show paper tooth,
    pressed edges, metallic shear, tube thickness, or ink bite, scaled to figures, props, spaces, or
    close material studies.
  camera_and_composition: >-
    Compose around Impression depth as reusable spatial grammar: favor iconic line hierarchy,
    negative space, premium print registration, and tactile depth cues, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Craft, quality as the emotional register; derive mood from craft, nightlife, luxury,
    signage, invitation design, and tactile production, without flattening strong, strange, darker,
    or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Tactile, classic: finish with precise physical process, controlled glow or impression
    depth, and no fake text layout, preserving prompt X as the base content and the preset as the
    style router.
  key_features: >-
    Deep impression ink; Debossed; Solid ink; Shadow in impression; Cotton paper; Impression depth;
    Craft, quality; Tactile, classic; Impression depth
  creative_brief: >-
    Apply letterpress impression to the input: inked relief edges, cotton-paper tooth, debossed
    shadows, pressure marks, and tactile print depth should make any subject feel physically pressed
    without requiring readable type.
avoidRules:
  - flat print
  - fake readable text
  - flat sticker look
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
