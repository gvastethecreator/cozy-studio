visualDna:
  aesthetic: 'Mappa mundi marvels: a round medieval world map with walled cities, rivers like ribbons, sea monsters and marvelous peoples painted at the edges of the known world.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; place the subject as a marvel on a circular hand-painted world map.
  color_and_tone: Faded vellum, green seas, red seas, blue rivers and gold cities.
  lighting_and_shadow: Flat map painting without light direction, kept consistent across the whole image.
  texture_and_material: Aged vellum, tiny painted cities, wavy water lines and stains.
  camera_and_composition: Circular world map filling the card, marvels at the rim.
  atmosphere_and_mood: Keep the requested mood with the wonder of unknown lands.
  rendering_and_quality: Tiny detailed vignettes arranged across one map, kept consistent across the whole image.
  creative_brief: "Mappa mundi marvels: a round medieval world map with walled cities, rivers like ribbons, sea monsters and marvelous peoples painted at the edges of the known world. Carry it through circular map, sea monsters, tiny cities, marvels at edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
