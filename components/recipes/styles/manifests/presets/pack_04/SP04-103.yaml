visualDna:
  aesthetic: 'Classic newspaper adventure strip: realist figures inked with a sable brush, shadows built from tapering feathered strokes and slabs of spotted black.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Black ink on white, or the same line under a limited flat Sunday palette of muted reds, blues and ochre.
  lighting_and_shadow: Strong side light with shadow edges broken into feathered brush tapers, spotted blacks anchoring the design.
  texture_and_material: Swelling and tapering brush lines, drybrush for rock and bark, folds of cloth drawn as rhythmic feathering.
  camera_and_composition: Horizontal landscape framing, grounded realist staging with figures and wide scenery given equal weight.
  atmosphere_and_mood: Stoic adventure and romance, sturdy and handsome, told with craft.
  rendering_and_quality: Elegant brush economy and accurate anatomy; no screentone, no digital gradients.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Feathered-Brush Adventure Strip as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: sable-brush feathering; spotted blacks; realist anatomy; muted flat Sunday color; horizontal framing
