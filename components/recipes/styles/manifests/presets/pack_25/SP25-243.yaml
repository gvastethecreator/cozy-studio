visualDna:
  aesthetic: 'Interleaved Scale Ornament: a large motif holds open spaces where a second smaller family nests, the two sharing meeting points.'
  subject_treatment: Build a repeating surface where a large motif from the prompt's subject leaves spaces filled by a second smaller family, the two meeting at shared points.
  color_and_tone: Contrast between the two scales by value, with no third ornamental family.
  lighting_and_shadow: Flat surface where crossings are resolved by clean reserves.
  texture_and_material: Clean edges and detail reduced by scale, the small family still legible.
  camera_and_composition: Off-center large motifs with small ones in specific gaps and repeatable meetings.
  atmosphere_and_mood: A dialogue between far and near reading, rich and orderly.
  rendering_and_quality: Clean repeat shown at two reading distances with no collisions.
  creative_brief: "Interleaved Scale Ornament: a large motif holds open spaces where a second smaller family nests, the two sharing meeting points. Carry it through large and small families, nested gaps, shared meeting points, two reading distances. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: large and small families; nested gaps; shared meeting points; two reading distances
