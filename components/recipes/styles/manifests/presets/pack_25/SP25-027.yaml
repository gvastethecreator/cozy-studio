visualDna:
  aesthetic: 'Offset Backbone Icons: an off-center spine inside each icon organizes asymmetric parts, balanced by internal counterweights.'
  subject_treatment: Organize the prompt's subject or requested actions around a lateral offset spine, building internal counterweights instead of shifting the whole icon.
  color_and_tone: One ink with hierarchy by mass and accents that respect the spine.
  lighting_and_shadow: Flat shapes balanced through geometry and spacing alone.
  texture_and_material: Clean strokes and masses with defined joins along the spine.
  camera_and_composition: The optical center of each box kept, even with an asymmetric internal build.
  atmosphere_and_mood: Disciplined asymmetry with visible support and organized details.
  rendering_and_quality: Aligned neatly beside symmetric families without moving their boxes.
  creative_brief: "Offset Backbone Icons: an off-center spine inside each icon organizes asymmetric parts, balanced by internal counterweights. Carry it through offset spine, internal counterweights, asymmetric parts, stable box. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: offset spine; internal counterweights; asymmetric parts; stable box
