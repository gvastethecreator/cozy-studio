visualDna:
  aesthetic: 'In-game screenshot look informed by The Witness gameplay: first-person island-puzzle capture with saturated gardens, clean geometry, panel puzzles, environmental line sight, and serene route logic. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable The Witness-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a The Witness-informed palette: orchid pink, grass green, clean white panels, ocean blue,
    yellow sunlight, and soft grey shadow. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through clear island daylight, garden bloom, panel glow, reflected water, and
    simple readable shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from smooth puzzle panels, manicured hedges, stone paths, colored glass, flowers,
    and minimal architectural surfaces. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person puzzle framing with panel in foreground, environmental clue alignment,
    open path, and landmark composition. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'The Witness-derived mood: serene, cerebral, bright, quiet, and spatially precise; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: almost no HUD; puzzle panels
    and environmental affordances should carry the interface. Maintain heavy-denoise clarity, crisp
    focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    The Witness gameplay screenshots; first-person island-puzzle capture with saturated gardens,
    clean geometry, panel puzzles, environmental line sight, and serene route logic; orchid pink,
    grass green, clean white panels, ocean blue, yellow sunlight, and soft grey shadow; clear island
    daylight, garden bloom, panel glow, reflected water, and simple readable shadows; smooth puzzle
    panels, manicured hedges, stone paths, colored glass, flowers, and minimal architectural
    surfaces; first-person puzzle framing with panel in foreground, environmental clue alignment,
    open path, and landmark composition; serene, cerebral, bright, quiet, and spatially precise; HUD
    guidance: almost no HUD; puzzle panels and environmental affordances should carry the interface
  creative_brief: "Witness Orchid Puzzle Garden: in-game screenshot language informed by The Witness, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
