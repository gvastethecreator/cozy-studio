visualDna:
  aesthetic: 'Attic toy menace: dusty attics of forgotten dolls, wind-up animals and rocking horses, arranged as if they have been waiting for someone to come back.'
  subject_treatment: Surround the prompt's subject with forgotten toys in a dusty attic, keeping it clear while the toys seem attentive.
  color_and_tone: Faded pastels, yellowed porcelain and dusty browns under grey attic light.
  lighting_and_shadow: Single dusty beam from a small window, deep shadows under eaves and glinting button eyes.
  texture_and_material: Cracked porcelain, moth-eaten fabric, chipped paint, cobwebs and dusty floorboards.
  camera_and_composition: Low angle across the attic floor with toys in rows facing the subject.
  atmosphere_and_mood: Nostalgic, patient and menacing, forgotten things that remember.
  rendering_and_quality: Detailed painterly realism with dust particles and subtle eerie arrangement.
  creative_brief: "Attic toy menace: dusty attics of forgotten dolls, wind-up animals and rocking horses, arranged as if they have been waiting for someone to come back. Carry it through forgotten toys, rows facing the viewer, dusty beam, cracked porcelain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: forgotten toys; rows facing the viewer; dusty beam; cracked porcelain
