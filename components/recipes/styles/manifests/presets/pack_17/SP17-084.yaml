visualDna:
  aesthetic: >-
    Diablo II: Resurrected dark-fantasy art language: compact carved silhouettes, archaic martial
    and occult design, sharply separated dark masses and concentrated elemental color, translated
    into painted illustration.
  subject_treatment: >-
    Preserve explicit identity, action and count. Give unspecified forms a compact carved weight,
    severe faceted contours and archaic ornament; use rough metal, bone-like structural rhythm and
    worn bindings when compatible with the subject.
  color_and_tone: >-
    Anchor open palettes in charcoal, blue-slate, mineral gray, and weathered umber, with bone or
    ash midtones. Place vivid color in a small number of readable accents such as ice-blue or white
    magic, poison green, or ember-orange; retain colors explicitly requested by the prompt.
  lighting_and_shadow: >-
    Hard small pools of blue-white or amber light cut sharply into broad darkness, with decisive
    shadow shapes and legible focal edges. Preserve explicit lighting choices.
  texture_and_material: >-
    Translate the remaster's clearer surface separation into selective painted edges: worn metal
    catches a narrow highlight, cloth and hide stay comparatively matte, stone breaks into broad
    planes, and magic reads as a luminous shape. Keep fine marks subordinate to the object and do
    not turn non-stone subjects into stone.
  camera_and_composition: >-
    Preserve the camera, crop, and spatial relationships requested by the prompt. Where composition
    is open, favor compact lateral overlap and a concentrated focal cluster; the game's elevated
    ARPG view belongs to its separate capture profile.
  atmosphere_and_mood: >-
    Use contained darkness, heavy forms, and isolated points of supernatural force to create a
    foreboding, dangerous mood. The style does not require a hellscape, a named quest, or any
    specific character or creature.
  rendering_and_quality: >-
    Finish as a deliberate dark-fantasy illustration: broad value blocks first, a clean silhouette,
    crisp selected contours, and sparse bright detail. The original game reference is a remaster;
    the style preset interprets its value grouping and effect accents with painted decisions rather
    than adding real-time 3D or uniform surface gloss.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
