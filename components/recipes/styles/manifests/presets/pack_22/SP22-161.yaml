visualDna:
  aesthetic: >-
    Illustrative ink organizes visible structure through a clear line hierarchy: a defining contour,
    lighter interior marks and restrained shadow.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Describe only visible forms and
    relationships; do not invent hidden construction.
  color_and_tone: >-
    Preserve the requested palette. Use measured darker line accents while keeping local colors
    distinct instead of forcing monochrome.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep shading sparse and tied to visible form
    without adding technical markings.
  texture_and_material: >-
    Keep the surface clean with little or no paper texture. Retain material cues from the request
    rather than converting everything into a diagram.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add dimensions, labels, text,
    frame or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Line hierarchy describes the image; it does not add a scene,
    backdrop or explanatory narrative.
  rendering_and_quality: >-
    Establish the outer contour, then use fewer interior lines for visible joins and details. Keep
    line weight legible and omit annotations or unsupported precision.
avoidRules:
  - invented hidden parts or engineering precision
  - unrequested dimensions, labels, or technical text
  - unrequested frame or card layout
