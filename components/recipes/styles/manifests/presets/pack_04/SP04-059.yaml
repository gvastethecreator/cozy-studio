visualDna:
  aesthetic: 'Heads-up display design: thin luminous vector reticles, arcs and gauges floating over a first-person view of the subject.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a first-person screen view with a heads-up display overlaid on the subject, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: One or two HUD colors such as cyan and amber at partial opacity over a darkened, slightly desaturated scene.
  lighting_and_shadow: HUD elements emit a soft glow and cast no shadow; the scene behind keeps its own light, dimmed for contrast.
  texture_and_material: Hairline vector strokes, segmented arcs, faint scanline and bloom on the brightest marks.
  camera_and_composition: First-person frame with a central reticle, a horizon ladder, corner gauges and a radar arc framing the subject.
  atmosphere_and_mood: Tense and focused, information wrapped around what you see.
  rendering_and_quality: Crisp vector interface layered over the view, using symbols and bars instead of readable numbers or words.
  key_features: central reticle; horizon ladder; segmented gauges; radar arc; cyan and amber glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies UI/HUD Design as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - placeholder gibberish text
  - invented numbers presented as data
  - readable labels
  - brand logo
  - franchise likeness
  - free painterly composition instead of a sheet
  - character portrait with decorative HUD shapes
  - readable numbers
  - messy
