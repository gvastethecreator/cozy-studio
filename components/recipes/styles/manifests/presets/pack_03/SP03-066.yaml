visualDna:
  aesthetic: 'Procedural abstract environment: sweeping glossy ribbons, extruded curves and soft volumes arranged in deep space, with no recognizable objects of their own.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies a non-figurative procedural space of glossy curved forms and gradient depth; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Two or three hues in smooth gradients, one dark anchor tone and one bright accent; reflections carry the color changes.
  lighting_and_shadow: Large soft area lights producing long gradient highlights along the curves and gentle contact shadows where forms overlap.
  texture_and_material: Lacquer, frosted glass or satin metal surfaces, perfectly smooth, with thin edge bevels catching light.
  camera_and_composition: Keep the requested framing; forms sweep diagonally through three depth layers and leave calm space where a subject may sit.
  atmosphere_and_mood: Calm, luxurious and weightless, rhythm without a story.
  rendering_and_quality: Noise-free path-traced finish with soft depth of field on the farthest layer.
  key_features: sweeping glossy ribbons; two-hue gradients; long area-light highlights; diagonal depth layers; calm subject space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Abstract Background as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - franchise likeness
  - recognizable game or film world
  - readable text
  - readable signage
  - logo
  - HUD or UI overlay
  - random floating spheres
  - fantasy city in the background
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - empty wallpaper
  - generic vista-only render
  - scale-less space
  - unoptimized clutter
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
