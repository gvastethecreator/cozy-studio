visualDna:
  aesthetic: >-
    Flat illustration organizes depth through overlapping silhouettes and relative scale rather than
    gradients or dense surface texture.
  subject_treatment: >-
    Preserve the requested subject, identity, proportions, pose and action. Simplify interior details
    while keeping the main silhouette recognizable; do not substitute a landscape for the subject.
  color_and_tone: >-
    Use clean color fields and area-based contrast. Retain the requested palette and separate important
    shapes without relying on gradients.
  lighting_and_shadow: >-
    Follow the requested light direction and value pattern. Translate it into clear areas of color and
    overlap without inventing a glow or new light source.
  texture_and_material: >-
    Keep color mostly matte and uniform with minimal variation. Preserve requested material differences
    without adding dense texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Use overlap and scale to show
    depth without replacing or rearranging the requested content.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Flat scenic depth does not turn an existing subject into an
    unrequested landscape.
  rendering_and_quality: >-
    Use continuous clear edges, few contour details and a readable hierarchy of overlapping planes.
    Avoid gradients and texture that compete with the silhouettes.
avoidRules:
  - unrequested landscape substitution
  - dense texture or gradient shading
