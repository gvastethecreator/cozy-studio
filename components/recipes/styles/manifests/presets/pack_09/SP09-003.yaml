visualDna:
  aesthetic: 'Birch bark: papery white bark with dark horizontal lenticels, curling peels and chalky texture.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is wrapped or built from birch bark sheets with peeling curls and dark lenticel dashes.'
  color_and_tone: Chalk white, cream and charcoal marks with peach inner bark.
  lighting_and_shadow: Soft cool daylight, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Papery peeling bark layers with black lenticels and curls.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Northern, quiet, delicate and wild, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: papery white bark; dark lenticels; curling peels; peach inner layer
  creative_brief: "Birch bark: papery white bark with dark horizontal lenticels, curling peels and chalky texture. Carry it through papery white bark, dark lenticels, curling peels, peach inner layer. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
