visualDna:
  aesthetic: >-
    A clear outer silhouette and carefully placed interior voids carry recognition through a small number
    of flat shapes and clean, consistent edges.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Use positive and negative
    shapes to clarify the existing subject without turning it into a shield or logo.
  color_and_tone: >-
    Preserve the requested palette and use only a few distinct fields; keep value separation clear without
    adding a predetermined emblem color scheme.
  lighting_and_shadow: >-
    Follow the requested light direction; simplify its effect into bounded value shapes without realistic
    shading or a new light source.
  texture_and_material: >-
    Keep the surface flat and clean. Preserve material identity through the existing silhouette and avoid
    adding relief, grain or a physical cutout effect.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. Do not enclose the image in a badge,
    shield or other container shape.
  atmosphere_and_mood: >-
    Maintain the requested setting and tone. Strong silhouette design does not add a logo, organization
    or symbolic meaning.
  rendering_and_quality: >-
    Use continuous, visually consistent edges and deliberate interior openings; keep essential features
    recognizable and uncluttered at reduced size.
avoidRules:
  - unrequested shields, logos or closed badge shapes
  - details that reduce recognition or change function
