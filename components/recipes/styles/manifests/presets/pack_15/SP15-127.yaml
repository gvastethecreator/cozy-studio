visualDna:
  aesthetic: 'Railpunk: a civilization built on railways, with rolling cities, locomotive fortresses, station cathedrals and tracks crossing every landscape.'
  subject_treatment: Keep the prompt's subject and setting; put it on, beside or inside rail infrastructure so tracks and locomotives define the world.
  color_and_tone: Soot black, oxblood red, brass and cream with steam-white skies.
  lighting_and_shadow: Headlamps cutting through steam, station skylights and firebox glow on engineers.
  texture_and_material: Riveted locomotive plates, iron rails, wooden sleepers, cinders and glass station roofs.
  camera_and_composition: Converging track perspectives to the horizon and huge locomotives framed head-on.
  atmosphere_and_mood: Relentless and grand, a world that never stops moving along its iron lines.
  rendering_and_quality: Detailed period illustration with strong perspective and billowing steam.
  creative_brief: "Railpunk: a civilization built on railways, with rolling cities, locomotive fortresses, station cathedrals and tracks crossing every landscape. Carry it through converging tracks, locomotive fortresses, steam, station cathedrals. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: converging tracks; locomotive fortresses; steam; station cathedrals
