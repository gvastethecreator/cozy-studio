visualDna:
  aesthetic: 'Flat vector illustration: clean Bezier shapes filled with solid colors, built from simple geometric primitives with perfectly smooth curves.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Limited flat palette of five to eight colors, harmonious and saturated, with shadow shapes as darker flat tints.
  lighting_and_shadow: 'Flat shading only: one hard-edged shadow shape and one highlight shape per form, no gradients.'
  texture_and_material: No texture at all; pure flat fills, crisp mathematically smooth edges, consistent corner radii.
  camera_and_composition: Keep the requested framing; forms simplified into bold geometric silhouettes with generous negative space.
  atmosphere_and_mood: Clean, friendly and orderly, a modern editorial clarity.
  rendering_and_quality: Razor-sharp vector edges, flat fills, no brush marks and no noise; no logos or brand marks.
  key_features: smooth Bezier shapes; flat solid fills; limited five-to-eight color palette; one flat shadow per form; geometric simplification
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vector Art (Flat) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
