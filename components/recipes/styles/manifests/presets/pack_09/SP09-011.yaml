visualDna:
  aesthetic: 'Wolf fur: dense grey-brown guard hairs over a soft underfur, with directional flow.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in dense wolf-like fur with directional flow following its form.'
  color_and_tone: Grey, silver, tan and black tipped fur, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Backlight halo on the fur edges, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Guard hairs and soft underfur with natural direction, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Wild, warm, primal and alert, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: dense grey fur; guard hairs; directional flow; backlit halo
  creative_brief: "Wolf fur: dense grey-brown guard hairs over a soft underfur, with directional flow. Carry it through dense grey fur, guard hairs, directional flow, backlit halo. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
