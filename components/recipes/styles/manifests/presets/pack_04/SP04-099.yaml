visualDna:
  aesthetic: 'UI wireframe: low-fidelity grey boxes, crossed image placeholders and bar-shaped text stand-ins mapping a game or app screen.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a set of low-fidelity grey-box interface wireframes for a screen built around the subject, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: White and light grey panels, mid-grey placeholders, one blue annotation color for arrows and highlights.
  lighting_and_shadow: Flat, with no light or shading beyond a thin drop line under active panels.
  texture_and_material: Thin uniform strokes, dashed boundaries, crossed rectangles and rounded grey bars instead of words.
  camera_and_composition: Two or three screen alternatives side by side, radial versus linear layout options, blue arrows marking flow.
  atmosphere_and_mood: Functional and provisional, structure decided long before any style.
  rendering_and_quality: Clean wireframe without final art, color theme or readable words.
  key_features: grey-box panels; crossed image placeholders; grey bars instead of text; blue flow arrows; layout alternatives
  creative_brief: "UI wireframe: low-fidelity grey boxes, crossed image placeholders and bar-shaped text stand-ins mapping a game or app screen. Carry it through grey-box panels, crossed image placeholders, grey bars instead of text, blue flow arrows, layout alternatives. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
