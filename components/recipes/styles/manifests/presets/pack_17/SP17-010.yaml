    candlelit ceremony; the tone should follow prompt X while preserving the preset's medieval-zine
    identity.
  rendering_and_quality: >-
    Gothic still-life illustration with precise objects, clean linework, visible details, and
    painterly shadow control.
  creative_brief: >-
    Translates any subject into a surgical gothic relic system of tools, glass, ritual, and
    restraint. Apply after prompt X: prompt X supplies subject, action, setting, tone, and
    intensity, while this preset supplies a style grammar of Surgical Reliquary Horror; Gothic
    reliquary horror mixing surgical precision; saintly display cases; medieval ritual equipment;
    Transform any subject with surgical gothic reliquary logic; glass and brass accents, mood,
    material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed
