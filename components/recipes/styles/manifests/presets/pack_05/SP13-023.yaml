visualDna:
  aesthetic: Precise anime action frame in which the exact path of the requested movement is traced as clean vector arcs, like motion-capture curves, thin and geometric behind the moving parts.
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the vector path-tracing device that draws the action as clean geometric arcs, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the path arcs take a restrained violet-blue that sits on existing colors without recoloring them.
  lighting_and_shadow: Precise directional light with narrow edge highlights on the moving parts; the arcs themselves do not glow.
  texture_and_material: Clean flat cel finish; arcs are one to two pixels thick, evenly spaced, and fade out after one full movement cycle.
  camera_and_composition: A controlled three-quarter side view that shows the whole path, with arcs never crossing the face or focal hands.
  atmosphere_and_mood: Technical, analytical momentum; the movement feels measured and exact rather than violent.
  rendering_and_quality: Sharp technical contours and crisp vector arcs kept secondary to the subject; no sci-fi interface graphics.
  key_features: movement path traced as vector arcs; thin evenly spaced curves; violet-blue path color; three-quarter side view; clean flat cel finish
  creative_brief: "Precise anime action frame in which the exact path of the requested movement is traced as clean vector arcs, like motion-capture curves, thin and geometric behind the moving parts. Carry it through movement path traced as vector arcs, thin evenly spaced curves, violet-blue path color, three-quarter side view, clean flat cel finish. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
