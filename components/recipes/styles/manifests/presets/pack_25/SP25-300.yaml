visualDna:
  aesthetic: 'Anamorphic Viewpoint Graphic: fragments painted across several surfaces that snap into one image from a single declared viewpoint.'
  subject_treatment: Paint the prompt's word or shape across existing surfaces so it aligns from one declared viewpoint, with a second view showing the fragments.
  color_and_tone: High-contrast colors so both fragments and the aligned figure read.
  lighting_and_shadow: Original light kept, the shadows revealing each plane.
  texture_and_material: Flat graphics applied to the given surfaces with masks per plane.
  camera_and_composition: The declared viewpoint plus an alternative view showing the fragments.
  atmosphere_and_mood: A localized spatial surprise that is honest about its viewpoint.
  rendering_and_quality: Clean alignment from the target camera with the building unchanged.
  creative_brief: "Anamorphic Viewpoint Graphic: fragments painted across several surfaces that snap into one image from a single declared viewpoint. Carry it through single viewpoint, fragmented planes, aligned figure, alternate view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: single viewpoint; fragmented planes; aligned figure; alternate view
