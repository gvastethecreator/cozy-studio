visualDna:
  aesthetic: 'Victorian Painted Lady: timber row-house facades in Italianate, Stick and Queen Anne manners, with bay windows and every bracket, spindle and shingle picked out in three or more paint colours.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Body in a pastel or deep heritage colour — sage, rose, butter, lavender, teal — with contrasting trim and a third accent on details; saturated but harmonious.
  lighting_and_shadow: Bright side light that throws the shadows of brackets and spindlework onto the siding, or soft fog light that flattens the colour blocks.
  texture_and_material: Painted clapboard, fish-scale and diamond shingles, turned spindles, scroll-sawn brackets and gingerbread, stained-glass transoms, steep front steps.
  camera_and_composition: Keep the requested view; frontal elevation or a row stepping up a hill, the bay window column centred, trim readable.
  atmosphere_and_mood: Cheerful, proud and ornamental, colour as neighbourly display.
  rendering_and_quality: Sharp daylight photograph with clean paint edges on each trim piece, no peeling unless requested.
  key_features: three-plus colour trim scheme; angled bay windows; fish-scale shingles; turned spindlework and brackets; painted clapboard siding
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Victorian Painted Lady as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
