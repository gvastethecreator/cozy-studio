  aesthetic: 'Takeshi Koike illustration look as in his Lupin films: razor-thin sharp lines, huge black shadow shapes, long angular figures and cool poster compositions.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Koike stylization, long angular bodies and hard black shadows. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Saturated flat color with massive blacks, true to the Takeshi Koike palette.
  lighting_and_shadow: Hard graphic light with black shadow shapes, lit the way Takeshi Koike lights its scenes.
  texture_and_material: Razor-thin line and flat color, with the surface finish of Takeshi Koike.
  camera_and_composition: Cool poster-like compositions, framed the way Takeshi Koike composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cool razor velocity.
  rendering_and_quality: Stylish graphic poster illustration, in the recognizable hand of Takeshi Koike.
  key_features: Takeshi Koike razor line; black shadows; poster cool
  creative_brief: "Takeshi Koike illustration look as in his Lupin films: razor-thin sharp lines, huge black shadow shapes, long angular figures and cool poster compositions. Carry it through Takeshi Koike razor line, black shadows, poster cool. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
