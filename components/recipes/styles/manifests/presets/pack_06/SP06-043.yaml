visualDna:
  aesthetic: >-
    Security Engraving acts as a transferable art-medium router: start from Security engraving style
    with guilloche precision and anti counterfeit line density, Guilloche patterns and print-process
    system built from matrix marks, ink transfer, pressure, registration, plate or block artifacts,
    and paper absorption, then apply the medium behavior to prompt X instead of recreating a fixed
    demo image.
  subject_treatment: >-
    Transform any prompt subject through Precise parallel lines; preserve the prompt subject while
    converting it into carved, etched, stamped, screened, dotted, grained, or impressed mark
    systems, keeping the requested identity, silhouette, pose, object function, or environment
    legible.
  color_and_tone: >-
    Build color with Green, Grey, Monochrome; use palette as ink behavior: limited plates,
    overprint, misregistration, monochrome value, cyan chemistry, newspaper dots, or security
    green-grey restraint, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Linear shading; translate light into line density, dot frequency, relief
    shadow, plate tone, paper reserve, or ink coverage rather than photographic illumination, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Cotton paper; surface detail should reveal paper fibers, plate marks, burr, gouge, rosin
    grain, rubber stamp incompleteness, halftone dots, or collagraph relief, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Compose for Security Engraving using its key spatial cues: Guilloche
    patterns; compose through print registration, cut rhythm, border pressure, edition-like balance,
    negative space, and repeatable mark hierarchy, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Serious, valuable; derive mood from hand pressure, mechanical reproduction,
    archival value, propaganda energy, occult darkness, newspaper grit, or tactile experiment,
    letting the medium alter interpretation without demanding a specific story, location, or
    character.
  rendering_and_quality: >-
    Finish with Official high detail engraving without requiring currency, certificates, seals, or
    portraits; finish as a credible print artifact with exact mark logic, restrained texture, and no
    fake poster text or random distress overlay, clean denoised surfaces where appropriate, and
    enough craft evidence to make the medium recognizable.
  key_features: >-
    Security engraving style with guilloche precision and anti counterfeit line density; Guilloche
    patterns; Green, Grey, Monochrome; Cotton paper
  creative_brief: >-
    Apply Security Engraving as an art-style preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Security engraving style with guilloche precision and anti counterfeit line density, Guilloche
    patterns, Cotton paper without requiring the card image's original subject.
