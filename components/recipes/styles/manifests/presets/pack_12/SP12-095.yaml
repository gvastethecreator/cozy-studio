visualDna:
  aesthetic: >-
    2024 remake gameplay capture: close third-person exploration inside expanded fogbound streets
    and interiors, with modern material clarity held under oppressive low visibility.
  subject_treatment: >-
    Keep the player near enough to read posture and exposure; maintain an open route, threat
    distance, and interaction space ahead.
  color_and_tone: >-
    Muted grey-green outdoor streets and dark interiors with localized warm lamps and occasional
    intense red encounter light.
  lighting_and_shadow: >-
    Soft gray daylight loses depth into fog; interiors use isolated warm or cold practical pools
    surrounded by dense but readable black.
  texture_and_material: >-
    Contemporary wet asphalt, weathered storefronts, concrete, fabric, and interior fixtures; small
    reflected highlights and high-detail surfaces survive without showroom polish.
  camera_and_composition: >-
    Documented over-the-shoulder follow camera: the player occupies the lower foreground, offset
    enough to reveal the immediate route and environmental threats; distinct from the original's
    looking-down camera.
  atmosphere_and_mood: >-
    Slow, close, and exposed; preserve exploration tension and quiet stretches instead of forcing
    constant combat.
  rendering_and_quality: >-
    Modern detailed real-time survival-horror capture with layered fog, coherent damp materials and
    readable dark values; retain the close shoulder camera and visible route.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
