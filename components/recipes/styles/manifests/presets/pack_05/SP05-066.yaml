  aesthetic: 'Hitoshi Iwaaki Parasyte manga look: simple clean realistic line, deadpan faces, and shocking transformations of the head into bizarre bladed shapes.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Iwaaki simplicity, plain realistic faces, calm deadpan expressions and ordinary clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with light tone and pale neutral colors.
  lighting_and_shadow: Flat ordinary household light that feels calm yet deeply unsettling.
  texture_and_material: Simple clean line, sparse tone and bizarre organic shapes.
  camera_and_composition: Calm everyday framing that suddenly breaks into bizarre bodily transformations.
  atmosphere_and_mood: Keep the requested mood with deadpan invasive dread.
  rendering_and_quality: Clean unsettling manga illustration with bizarre organic forms.
  key_features: Iwaaki clean line; deadpan faces; bizarre transformations; everyday
  creative_brief: "Hitoshi Iwaaki Parasyte manga look: simple clean realistic line, deadpan faces, and shocking transformations of the head into bizarre bladed shapes. Carry it through Iwaaki clean line, deadpan faces, bizarre transformations, everyday. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
