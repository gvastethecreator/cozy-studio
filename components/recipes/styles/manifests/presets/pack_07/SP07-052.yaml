visualDna:
  aesthetic: 'Megalithic mountain-hall architecture: walls cut from single granite blocks with hairline joints, stepped angular relief bands, hammered gold edging and molten heat running in floor and wall grooves.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Charcoal and slate granite, hammered gold, deep orange glow inside the channels as the only warm note; everything else stays cool grey.
  lighting_and_shadow: Low warm under-light rising from the glowing channels, black darkness overhead, a hard 1:8 ratio that carves the relief bands.
  texture_and_material: Tool-dressed granite with drill scars and razor arrises, gold sheet riveted into grooves, soot darkening the upper courses.
  camera_and_composition: Keep the requested view; squat trabeated proportions with massive horizontal lintels and a low eye line that stresses weight.
  atmosphere_and_mood: Heavy, patient and proud, as if built to outlast the mountain around it.
  rendering_and_quality: Crisp architectural render with sharp stone edges and bloom limited to the heat channels; no fog wash over the masonry.
  key_features: single-block granite megaliths; stepped angular relief without readable runes; hammered gold edging; glowing heat channels in grooves; squat trabeated proportions
  creative_brief: "Megalithic mountain-hall architecture: walls cut from single granite blocks with hairline joints, stepped angular relief bands, hammered gold edging and molten heat running in floor and wall grooves. Carry it through single-block granite megaliths, stepped angular relief without readable runes, hammered gold edging, glowing heat channels in grooves, squat trabeated proportions. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
