visualDna:
  aesthetic: 'Tractography: bundles of fiber pathways color-coded by direction, glowing like silk threads.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: traced as bundles of streamlines color-coded by direction: red left-right, green front-back, blue up-down."
  color_and_tone: Red, green and blue streamlines on black, exactly as the instrument maps its signal.
  lighting_and_shadow: Glow of streamlines, because the image shows signal, not ordinary light.
  texture_and_material: Fine silk-like strands, as real instrument artifacts rather than decoration.
  camera_and_composition: Isolated 3D subject on black, matching how this instrument actually frames data.
  atmosphere_and_mood: Intricate, beautiful, clinical and luminous, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies MR Tractography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: direction-coded streamlines; fiber bundles
