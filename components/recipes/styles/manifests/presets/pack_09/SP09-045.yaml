visualDna:
  aesthetic: >-
    Felt Fabric makes hand-feel and pressure visible across the image: start from Compressed wool,
    Fuzzy, dense, and No weave, then turn touch, softness, pile, fiber density, nap direction,
    compression, and hand-feel into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Fuzzy edge: preserve identity and pose while letting forms
    compress, fuzz, soften, catch fibers, and show tactile pressure through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Matte colors as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Soft absorption define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Felt Fabric without hiding the prompt
    subject.
  texture_and_material: >-
    Render Fuzzy, dense through fiber structure, tactile depth, soft occlusion, fuzz, pile
    direction, and pressure marks; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around No weave as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Warm, craft by using physical touch, comfort, irritation, warmth, dryness, and
    surface softness; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Craft, soft material clarity: physically coherent reflectance, clean contact detail,
    controlled micro-texture, readable silhouette behavior, and no noisy stock-texture overlay.
  key_features: Compressed wool; Fuzzy edge; Fuzzy, dense; Soft absorption; No weave
  creative_brief: >-
    Route any subject through Felt Fabric as a transferable tactile-surface visual system while
    preserving the prompt's subject, action, and setting. Summon the soft density of felted wool
    where fibers have surrendered individual identity to become a unified surface without weave or
    grain, matte colors absorbing light like powdered pigment painted onto compressed cloud. The
    fuzzy edge should dissolve into atmosphere without a defined boundary. Capture the warmth of
    compression, softness achieved through the pressure of becoming one. Use Felt Fabric as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
  - woven
  - shiny
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
