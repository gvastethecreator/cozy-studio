visualDna:
  aesthetic: 'Charred wood (shou sugi ban): wood surfaces deliberately charred into black alligator-skin char.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the wooden surfaces are charred into black crackled alligator texture, brushed to reveal grain on edges. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Deep charcoal black with silvery sheen and brown grain.
  lighting_and_shadow: Low side light on the crackled char, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Crackled char, silvery sheen and exposed grain, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Dark, elegant, protective and primal, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: alligator char crackle; silvery sheen; brushed grain; surface-level damage; structure intact
  creative_brief: "Charred wood (shou sugi ban): wood surfaces deliberately charred into black alligator-skin char. Carry it through alligator char crackle, silvery sheen, brushed grain, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
