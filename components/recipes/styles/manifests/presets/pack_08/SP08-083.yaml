visualDna:
  aesthetic: 'Gorpcore: outdoor and mountaineering gear worn as fashion — fleece, shell jackets, trail shoes and utility accessories in bold color-blocking.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a color-blocked shell jacket or fleece, cargo or trail trousers, chunky trail shoes and a small technical accessory such as a carabiner, sling bag or bucket hat."
  color_and_tone: Earth tones mixed with bold accents — burnt orange, teal, lilac, lime.
  lighting_and_shadow: Crisp mountain daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Ripstop nylon, polar fleece, Gore-style shells, webbing and rubber soles.
  camera_and_composition: Full figure in or against rugged landscape, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Adventurous, playful and practical, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Sharp outdoor-editorial finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Gorpcore: outdoor and mountaineering gear worn as fashion — fleece, shell jackets, trail shoes and utility accessories in bold color-blocking. Carry it through color-blocked shell and fleece, trail shoes, utility accessories, bold accents on earth tones, mountain daylight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: color-blocked shell and fleece; trail shoes; utility accessories; bold accents on earth tones; mountain daylight
