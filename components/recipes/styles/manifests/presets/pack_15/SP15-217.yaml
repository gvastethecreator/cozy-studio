  aesthetic: 'Grrrlpunk: fierce feminist DIY punk, with cut-and-paste collage, marker-scrawled skin, babydoll dresses with combat boots and all-women bands on tiny stages.'
  subject_treatment: Keep the prompt's subject and setting; give its figures fierce DIY punk styling with collage textures, boots and bold hand-drawn marks.
  color_and_tone: Hot pink, black and xerox grey with red marker and cheap glitter accents.
  lighting_and_shadow: Harsh flash or bare stage lights with high contrast and hard shadows.
  texture_and_material: Photocopy grain, torn paper collage, marker on skin, glitter, lace and leather.
  camera_and_composition: Confrontational close framing, figures facing the viewer, collage edges cutting the frame.
  atmosphere_and_mood: Loud, defiant and sisterly, taking up space without apology.
  rendering_and_quality: Raw collage-like illustration with photocopy grain and bold marks.
  creative_brief: "Grrrlpunk: fierce feminist DIY punk, with cut-and-paste collage, marker-scrawled skin, babydoll dresses with combat boots and all-women bands on tiny stages. Carry it through cut-and-paste collage, marker marks, boots and lace, fierce direct gaze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
