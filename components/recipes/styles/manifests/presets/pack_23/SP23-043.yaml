visualDna:
  aesthetic: >-
    Use compressed values, selectively muted color and a light, localized impression of reproduction
    wear while preserving broad forms and focal detail. Keep the finish structured rather than uniformly
    faded or distressed.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and function. Keep its
    main shapes legible before adding any surface irregularity; do not supply an implied setting or
    narrative.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. If muted color is compatible with the
    request, reduce selected areas selectively; do not wash out all colors or impose a fixed palette.
  lighting_and_shadow: >-
    Preserve the requested lighting and shadows. Use compact value grouping to support existing forms
    without making the image darker, older or more dramatic than requested.
  texture_and_material: >-
    Apply slight reproduction wear to selected ink edges or printed value areas where it reinforces
    form. This is wear in the depicted image, not physical damage to the subject. Preserve its actual
    material qualities and avoid global grime, blur, paper aging or unsupported claims about process.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, composition and negative space. Do not impose
    additional framing or layout.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Localized fading and wear are surface treatments only; they
    do not imply a time, place or narrative.
  rendering_and_quality: >-
    Keep focal marks and broad value structure readable beneath limited surface wear. Texture should
    remain a secondary treatment, not a veil over the whole image.
avoidRules:
  - unrequested framing, text or layout
  - uniform faded wash, blur or heavy surface distress
  - forced dark mood or fixed muted palette
  - unsupported claims about a particular process
