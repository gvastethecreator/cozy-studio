visualDna:
  aesthetic: 'Khara Rebuild of Evangelion look: crisp digital cel with neon orange warning geometry, hexagonal barrier patterns, colossal hazard-striped operations and cold command-room urgency.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Sadamoto-derived designs, tense faces, plugsuit-like or uniform clothing, dwarfed by vast geometric machinery and emergency displays. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Warning orange, hazard black, command-room teal and blood-red emergency light across everything.
  lighting_and_shadow: Emergency strobe light, hexagonal barrier glows and harsh sunset silhouettes against machinery.
  texture_and_material: Crisp digital cel, CG geometric structures, hazard stripes and clean graphic overlays.
  camera_and_composition: Monumental low angles, symmetrical operations centers and tiny figures before colossal geometry.
  atmosphere_and_mood: Keep the requested mood with urgent apocalyptic tension.
  rendering_and_quality: Precise Khara theatrical frame with neon geometry and colossal emergency scale.
  key_features: Rebuild geometry; warning orange; hexagonal barriers; colossal operations
  creative_brief: "Khara Rebuild of Evangelion look: crisp digital cel with neon orange warning geometry, hexagonal barrier patterns, colossal hazard-striped operations and cold command-room urgency. Carry it through Rebuild geometry, warning orange, hexagonal barriers, colossal operations. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
