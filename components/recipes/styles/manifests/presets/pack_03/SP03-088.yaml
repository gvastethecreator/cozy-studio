visualDna:
  aesthetic: 'Lookdev reference plate: a CG asset presented beside a chrome ball, a grey ball and a color chart, lit by a studio HDRI for material approval.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Neutral grey backdrop, accurate asset color, chart patches in calibrated colors.
  lighting_and_shadow: Neutral studio HDRI visible in the chrome ball, soft shadow on the grey ball.
  texture_and_material: The asset's materials shown in full detail next to the reference spheres.
  camera_and_composition: Asset centered, chrome and grey balls and a small color chart placed to one side.
  atmosphere_and_mood: Technical and precise, an asset under careful review.
  rendering_and_quality: VFX lookdev presentation; the color chart has no readable labels.
  creative_brief: "Lookdev reference plate: a CG asset presented beside a chrome ball, a grey ball and a color chart, lit by a studio HDRI for material approval. Carry it through chrome ball and grey ball, color chart, neutral studio HDRI, centered asset, material approval framing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: chrome ball and grey ball; color chart; neutral studio HDRI; centered asset; material approval framing
