visualDna:
  aesthetic: 'Monolithic Material Finish: a modifier that wraps an existing product in one continuous finish while every joint, control and opening stays in place.'
  subject_treatment: Apply one continuous finish to the prompt's existing product geometry, keeping its seams, controls and openings exactly where they are.
  color_and_tone: One main color with enough value variation to separate planes and parts.
  lighting_and_shadow: Broad light and contained reflections that keep every seam visible.
  texture_and_material: Semi-matte monolithic surface with fine grain and even coverage.
  camera_and_composition: Camera, silhouette and part placement of the source kept unchanged.
  atmosphere_and_mood: Material calm and reduced distraction, with every sign of use kept.
  rendering_and_quality: Seams and controls stay recognizable after the finish is unified.
  creative_brief: "Monolithic Material Finish: a modifier that wraps an existing product in one continuous finish while every joint, control and opening stays in place. Carry it through one continuous finish, kept seams, unchanged geometry, fine grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one continuous finish; kept seams; unchanged geometry; fine grain
