visualDna:
  aesthetic: 'Soft Collision Graphics: styleframes of shapes bumping into each other with soft local squash and a coordinated recovery.'
  subject_treatment: Show the prompt's shapes in keyframes of approach, soft contact and settle, deformation only near the contact and every word left untouched.
  color_and_tone: A stable palette per object with no new categories at contact.
  lighting_and_shadow: Coherent light and discreet contact shadows without sparks.
  texture_and_material: Softly squashing surfaces that keep their apparent volume.
  camera_and_composition: Readable paths with text kept outside the collision zone.
  atmosphere_and_mood: Approach, bump and cushioned recovery, with mass differences shown.
  rendering_and_quality: Crisp keyframes with no overlaps and a clean final rest.
  creative_brief: "Soft Collision Graphics: styleframes of shapes bumping into each other with soft local squash and a coordinated recovery. Carry it through soft bump, local squash, mass difference, clean rest. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft bump; local squash; mass difference; clean rest
