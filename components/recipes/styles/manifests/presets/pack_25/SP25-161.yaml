visualDna:
  aesthetic: 'Causal Visual Metaphors: one clear cause-and-effect transformation communicates the idea of the campaign at a single glance.'
  subject_treatment: Express the prompt's message through one visible cause-and-effect transformation of its subject, with the requested copy set exact and no invented benefit.
  color_and_tone: Palette serving the main relationship, with the strongest contrast at the moment of transformation.
  lighting_and_shadow: Coherent light across cause and result so the relationship stays readable.
  texture_and_material: Consistent materials and a legible transition between the two states.
  camera_and_composition: One dominant subject, one clear action and a calm zone for the copy.
  atmosphere_and_mood: Direct wit and a surprise you can check with your own eyes.
  rendering_and_quality: Polished campaign image where the metaphor reads without extra explanation.
  creative_brief: "Causal Visual Metaphors: one clear cause-and-effect transformation communicates the idea of the campaign at a single glance. Carry it through one transformation, visible cause and effect, calm copy zone, single idea. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one transformation; visible cause and effect; calm copy zone; single idea
