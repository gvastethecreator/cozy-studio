visualDna:
  aesthetic: 'Nuclear scintigraphy: a gamma camera image of where a tracer gathers, shown as soft blurry dots and hot spots on black or white.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Inverted greyscale or a black-to-red-yellow heat scale for tracer intensity.
  lighting_and_shadow: No conventional light at all; brightness shows only how much tracer gathered.
  texture_and_material: Coarse counting noise, blurry low-resolution outlines, glowing hot spots.
  camera_and_composition: Frontal and back whole-body or organ views side by side.
  atmosphere_and_mood: Quiet and diagnostic, the body mapped as faint light.
  rendering_and_quality: Gamma-camera noise and blur; no labels, arrows or diagnoses.
  creative_brief: "Nuclear scintigraphy: a gamma camera image of where a tracer gathers, shown as soft blurry dots and hot spots on black or white. Carry it through tracer hot spots, coarse counting noise, blurry outline, paired front and back views, heat-scale color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tracer hot spots; coarse counting noise; blurry outline; paired front and back views; heat-scale color
