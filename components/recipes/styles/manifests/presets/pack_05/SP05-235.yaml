visualDna:
  aesthetic: >-
    Glossy pop-cyber illustration combining clean vector contours, bright synthetic color,
    smooth highlight bands, and tiny controlled pixel-like interruptions.
  subject_treatment: >-
    Preserve the requested subject and proportions. Use smooth, clean contour lines and glossy
    color accents on its existing forms, without adding avatars or devices.
  color_and_tone: >-
    Use vivid pink, cyan, violet, and a small lime accent against clean dark or pale neutrals;
    keep colors distinct and buoyant.
  lighting_and_shadow: >-
    Pair smooth highlight bands with sharply separated cel shadows; keep shine graphic rather
    than photoreal.
  texture_and_material: >-
    Maintain the depicted material beneath polished edge glints, clean gradients, and occasional
    tiny digital breaks.
  camera_and_composition: >-
    Keep the requested view. Use lively color offsets and crisp graphic edges within the
    existing framing, without adding a simulated screen.
  atmosphere_and_mood: >-
    Make the image feel playful and synthetic through buoyant color, clean spacing, and a few
    controlled glitches.
  rendering_and_quality: >-
    Use vector-clean outlines, smooth color transitions, precise shadow bands, and sparse pixel
    accents; avoid noisy effects.
  key_features: >-
    Glossy vector contours; vivid pop colors; smooth highlights; tiny pixel-like breaks.
  creative_brief: >-
    Retain the prompt’s subject and setting. Apply glossy vector edges, vivid pop color, and a
    few pixel-like breaks; add no avatar, device, or screen.
