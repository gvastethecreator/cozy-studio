visualDna:
  aesthetic: '16-bit pixel art: a scene drawn pixel by pixel on a low-resolution grid with a limited palette, hand-placed anti-aliasing and dithered transitions.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Restricted palette of about 32 to 64 colors, hue-shifted ramps from cool shadows to warm highlights, no gradients beyond ramps and dither.
  lighting_and_shadow: Clear top-left light with two or three shading steps per material; checkerboard dither for soft transitions.
  texture_and_material: Crisp square pixels on a visible grid, clean one-pixel outlines, no blurred scaling, no sub-pixel smoothing.
  camera_and_composition: Keep the requested framing as a single scene or side-view game screen, but with no interface, health bars, menus or icons.
  atmosphere_and_mood: Nostalgic, crafted and adventurous, a console-era world.
  rendering_and_quality: Every edge snapped to the pixel grid, deliberate clusters without orphan pixels, hue-shifted ramps; no UI and no readable text.
  key_features: hand-placed pixels on a grid; 32 to 64 color palette; hue-shifted shading ramps; checkerboard dither; no interface elements
  creative_brief: "16-bit pixel art: a scene drawn pixel by pixel on a low-resolution grid with a limited palette, hand-placed anti-aliasing and dithered transitions. Carry it through hand-placed pixels on a grid, 32 to 64 color palette, hue-shifted shading ramps, checkerboard dither, no interface elements. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
