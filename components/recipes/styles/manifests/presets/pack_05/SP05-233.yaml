  color_and_tone: Cold greys, white suits, dark space and organic flesh pinks.
  lighting_and_shadow: Cold industrial hangar light and harsh vacuum glare on white suits.
  texture_and_material: Cel-shaded CG surfaces with clean outlines and simple flat shadows.
  camera_and_composition: Hangar wides, cockpit views and vast alien shapes.
  atmosphere_and_mood: Keep the requested mood with disciplined survival dread.
  rendering_and_quality: Cel-shaded Polygon Pictures frame with vacuum survival scale.
  key_features: Sidonia cel-shaded CG; colony fortress; alien horrors; discipline
