visualDna:
  aesthetic: >-
    Veiled Grimoire Secrecy acts as a transferable mythic-noir router: veiled translated into dark
    symbolic behavior, grimoire translated into dark symbolic behavior plus secrecy translated into
    dark symbolic behavior fused with ritual noir with legalistic omen logic, candle compression,
    confessional shadow, taboo elegance, and ceremonial menace; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    veiled shaping silhouette rhythm, contour pressure, and symbolic edge control, grimoire shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus secrecy shaping silhouette
    rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette pressure,
    emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or
    prop set.
  color_and_tone: >-
    Map color through veiled-weighted accent roles over disciplined dark values, grimoire-weighted
    accent roles over disciplined dark values plus secrecy-weighted accent roles over disciplined
    dark values together with velvet black, sealing-wax red, old ivory, tarnished brass, moonsteel
    blue, rain gloss, and restrained poisonous glow; values stay separated, accents feel
    intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use occluded glow and guarded shadow, veiled-weighted rim behavior, occult glow, and charged
    shadow plus grimoire-weighted rim behavior, occult glow, and charged shadow with low-key noir
    pools, narrow rim cuts, wet reflections, candle bloom, and occult glow that never flattens the
    subject; shadows must carry omen weight, rims should clarify form, and glow should behave as
    ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render dark veiling, rubbed leather, and hidden ink plus black paper, worn leather, veiled ink,
    and sealed dust alongside wax seals, ledger paper, velvet pile, rain-wet stone, tarnish, soot,
    blade sheen, veils, and powdery ash; surface scale, patina, residue, gloss, grain, and carved or
    sealed edges must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with secret-page layering and forbidden index order, veiled converted into repeatable
    spatial rhythm and symbolic hierarchy plus secrecy converted into repeatable spatial rhythm and
    symbolic hierarchy plus interrogation axes, compressed processional bands, sealed-grid order,
    reflected doubles, and off-axis ritual tension; the style should support portraits, objects,
    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through secrecy under formal restraint plus withheld knowledge and veiled intent and
    adult secrecy, suspicion, judgment, mourning, seduction, dread, and the feeling of a private
    rite becoming public; the image can become severe, sensual, sacred, violent, quiet, or strange
