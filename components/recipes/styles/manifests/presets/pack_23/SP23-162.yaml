  aesthetic: 'High-density pixel painting: modern large-canvas pixel art with painterly detail, many colors and atmospheric depth while every pixel is still hand-placed and crisp.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject with rich painterly detail using crisp hand-placed pixels.
  color_and_tone: Rich atmospheric palette with many hues, kept consistent across the whole image.
  lighting_and_shadow: Painterly light, volumetric beams and depth haze, kept consistent across the whole image.
  texture_and_material: Detailed pixel textures, stone, cloth and foliage, kept consistent across the whole image.
  camera_and_composition: Cinematic wide composition with deep layers, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with cinematic painterly depth.
  rendering_and_quality: Crisp pixels at high detail, never blurred, kept consistent across the whole image.
  creative_brief: "High-density pixel painting: modern large-canvas pixel art with painterly detail, many colors and atmospheric depth while every pixel is still hand-placed and crisp. Carry it through large canvas, painterly pixels, atmospheric depth, crisp detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
