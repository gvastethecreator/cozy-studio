  color_and_tone: One paper color, black or red, on a contrasting background.
  lighting_and_shadow: Light passing through the cut holes with small shadows.
  texture_and_material: Paper with crisp cut edges and fold line, visible at card size as the signature of the style.
  camera_and_composition: Symmetrical framing around a central fold, arranged so the subject still reads at card size.
  atmosphere_and_mood: Delicate, folkloric, careful and intricate, driven by the construction, color and rhythm.
  rendering_and_quality: Precise paper cutting with all pieces connected, with clean, deliberate marks and no accidental noise.
  creative_brief: "Folded papercut: a single sheet folded and cut into symmetrical lace, with the subject as a silhouette inside ornamental cutwork. Carry it through mirror symmetry, lace cutwork, one sheet, connected pieces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
