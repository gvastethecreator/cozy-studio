  color_and_tone: Imperial purple, gold, deep red, emerald and pearl, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Warm mosaic-gold glow with soft shadows, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Heavy silk samite, gold thread, pearls, cabochon gems and enamel.
  camera_and_composition: Frontal, iconic full figure, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Sacred, imperial, rigid and resplendent, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Rich, glowing, detailed finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Byzantine court dress: stiff, jewel-encrusted silk dalmatics and loros sashes, pearl pendilia crowns and gold-embroidered cloaks. Carry it through jeweled loros sash, silk dalmatic, pearl pendilia crown, gold tablion, frontal icon pose. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
