visualDna:
  aesthetic: Formal anime cel shaped by tall vertical rhythms and textile-like repeating line patterns, ornament balanced as carefully as woven cloth.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Fine repeating line marks run inside existing clothing and surfaces; do not add ceremonial dress, a court or a throne.
  color_and_tone: Muted indigo, parchment and restrained cinnabar with small gold notes, composed in a quiet mid key.
  lighting_and_shadow: Even deliberate light with small precise highlights on ornament and shallow flat shadows.
  texture_and_material: Fine repeated brocade-like strokes and restrained fabric texture used as surface treatment, not as a material change.
  camera_and_composition: Keep the requested view; tall vertical spacing and near-symmetry, with tall narrow framing when the prompt leaves it open.
  atmosphere_and_mood: Solemn and poised, destiny felt as stillness.
  rendering_and_quality: Sparse, even-scale ornament, clean edges and a consistent detail scale across the image.
  key_features: tall vertical rhythm; brocade-like repeating line pattern; indigo-parchment-cinnabar palette; near symmetry; precise ornament highlights
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tall Textile-Rhythm Formal Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
