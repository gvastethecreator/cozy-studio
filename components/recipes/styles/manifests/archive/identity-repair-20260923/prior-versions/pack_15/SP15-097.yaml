visualDna:
  aesthetic: >-
    Seapunk combines pressure-line diagonals, tide-level bands and shell-like curves with layered marine
    values and sparse reef-color accents.
  subject_treatment: >-
    Preserve the requested subject and material; apply flow bands or shell-like geometry only where
    compatible, without converting it into marine architecture or fauna.
  color_and_tone: >-
    Follow the requested palette; use cool depth shifts and pearly highlights as local accents rather
    than a fixed blue glow.
  lighting_and_shadow: >-
    Respect the stated light direction; separate shallow and deep planes with broad value changes, adding
    wet reflections only to surfaces that support them.
  texture_and_material: >-
    Preserve actual materials; distinguish tideglass, shell, ceramic and salt-metal locally without
    making every surface wet or iridescent.
  camera_and_composition: >-
    Keep the requested view and placement; use horizontal tide bands and a few pressure arcs without
    requiring an underwater scene.
  atmosphere_and_mood: >-
    Suggest fluid pressure and depth through layered values and open flow paths while retaining the
    requested mood.
  rendering_and_quality: >-
    Keep bands and arcs clean and readable, with selective translucent planes and restrained highlights;
    avoid tiny reef-like clutter.
avoidRules:
  - Do not add settlements, vessels, marine animals or reef structures unless requested.
  - Do not impose a blue glow or wet gloss on unrelated materials.
  - Keep small light accents subordinate to the main silhouette.
