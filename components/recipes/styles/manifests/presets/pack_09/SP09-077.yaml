visualDna:
  aesthetic: >-
    Barbed Wire treats fabrication as visible style language: start from Fencing wire, Sharp, and
    Coiled, then turn manufacturing process, tooling marks, seams, tolerances, and industrial
    material behavior into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Twisted wire + barbs: preserve identity and pose while
    letting forms carry manufactured seams, tolerances, pressure marks, and finish logic through
    edge profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Rusty metal as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Sharp highlights define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Barbed Wire without hiding the prompt
    subject.
  texture_and_material: >-
    Render Sharp through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Coiled as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Dangerous, forbidden by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Prison, war material clarity: physically coherent reflectance, clean contact detail,
    controlled micro-texture, readable silhouette behavior, and no noisy stock-texture overlay.
  key_features: Fencing wire; Twisted wire + barbs; Sharp; Sharp highlights; Coiled
  creative_brief: >-
    Route any subject through Barbed Wire as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Render the hostile geometry of barbed wire
    where twisted strands spiral around a core line, sharpened barbs bristling at regular intervals
    like a metal vine bred for pain, rust painting the surface in oranges of exposure. Each barb
    should catch a sharp highlight, a glint of warning written in steel along the coil. Capture the
    aesthetics of the forbidden, a line drawn in wire and consequence. Use Barbed Wire as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
  - smooth wire
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
