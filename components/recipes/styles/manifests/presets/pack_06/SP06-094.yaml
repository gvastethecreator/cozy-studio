visualDna:
  aesthetic: 'Extreme early-console limitation: chunky blocks four pixels wide, one color per object per scanline, and mirrored playfield blocks.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Flat saturated NTSC hues; objects gain multiple colors only as horizontal stripes changing line by line.
  lighting_and_shadow: No light or shadow; color bands stand in for form.
  texture_and_material: Wide rectangular blocks, horizontal color stripes, symmetrical mirrored walls and tiny 8-pixel-wide sprites.
  camera_and_composition: Keep the requested view; the subject reduced to a few blocky silhouettes on a flat single-color ground.
  atmosphere_and_mood: Abstract and naive, imagination filling in almost everything.
  rendering_and_quality: Extremely low horizontal resolution with crisp blocks; no detail beyond what the limit allows.
  key_features: four-pixel-wide blocks; one color per scanline; horizontal stripe coloring; mirrored playfield; tiny sprites
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Scanline Stripe Block Minimalism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
