visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Northgard gameplay screenshots: isometric
    Viking strategy capture with snowy settlements, clan units, resource buildings, aurora skies,
    and territorial control readability. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Northgard-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Northgard-informed palette: snow blue, timber brown, aurora green, hearth orange, iron
    grey, and muted clan-color banners. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through cold winter daylight, hearth pools, northern lights, torch edges, and
    soft snow bounce. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wood huts, palisades, snowy rocks, fur cloaks, axes, fields, animal tracks,
    and compact strategy props. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with isometric management/combat view with territories, unit clusters, resource
    buildings, and defensive choke points. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Northgard-derived mood: settler-strategy, hardy, Nordic, cold, and quietly tense. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: resource bar, clan panels,
    minimap, unit selection, and alert icons can appear as coherent RTS UI. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Northgard gameplay screenshots; isometric Viking strategy capture with snowy settlements, clan
    units, resource buildings, aurora skies, and territorial control readability; snow blue, timber
    brown, aurora green, hearth orange, iron grey, and muted clan-color banners; cold winter
    daylight, hearth pools, northern lights, torch edges, and soft snow bounce; wood huts,
    palisades, snowy rocks, fur cloaks, axes, fields, animal tracks, and compact strategy props;
    isometric management/combat view with territories, unit clusters, resource buildings, and
    defensive choke points; settler-strategy, hardy, Nordic, cold, and quietly tense; HUD guidance:
    resource bar, clan panels, minimap, unit selection, and alert icons can appear as coherent RTS
    UI
  creative_brief: >-
    Use Northgard Aurora Bastion Siege as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Northgard: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
