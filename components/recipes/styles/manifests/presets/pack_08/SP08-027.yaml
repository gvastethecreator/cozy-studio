visualDna:
  aesthetic: 'Skater style: loose, durable clothes built around the board — baggy jeans or cords, oversized tees, hoodies, flannel, beanies and scuffed vulcanized shoes.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: baggy jeans or corduroys, oversized tee or hoodie, open flannel, beanie or cap, and scuffed flat vulcanized skate shoes."
  color_and_tone: Faded black, grey, mustard, forest green and washed denim.
  lighting_and_shadow: Bright afternoon sun or golden-hour glare, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Heavy cotton, corduroy, canvas, suede and grip-worn rubber, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Low fisheye or wide full figure mid-trick or sitting on a board.
  atmosphere_and_mood: Laid-back, playful, rebellious and free, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Candid, zine-like finish, with believable fabric weight, seams and fit detail.
  key_features: baggy jeans and oversized tee; vulcanized skate shoes; beanie; low wide angle; candid energy
  creative_brief: "Skater style: loose, durable clothes built around the board — baggy jeans or cords, oversized tees, hoodies, flannel, beanies and scuffed vulcanized shoes. Carry it through baggy jeans and oversized tee, vulcanized skate shoes, beanie, low wide angle, candid energy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
