visualDna:
  aesthetic: 'Layered Directory Panels: stacked plates separate building, zone and destination with minimal depth and one reading order.'
  subject_treatment: Stack the prompt's directory as building, zone and destination plates with shallow depth and explicit links, every name and arrow exact.
  color_and_tone: A different value per level and one accent for the selection.
  lighting_and_shadow: Moderate ambient light with no shadow cutting across text.
  texture_and_material: Matte plates with discreet edges and consistent materials.
  camera_and_composition: General level behind, zone in the middle and destination in front.
  atmosphere_and_mood: A gradual reading that lowers effort for the visitor.
  rendering_and_quality: Clean directory with shared alignments and no hidden information.
  creative_brief: "Layered Directory Panels: stacked plates separate building, zone and destination with minimal depth and one reading order. Carry it through stacked plates, three levels, shallow depth, one reading order. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked plates; three levels; shallow depth; one reading order
