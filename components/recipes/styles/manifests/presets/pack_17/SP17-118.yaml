  aesthetic: Soft-ground etching with pencil-like grainy lines that capture the texture of the paper they were drawn through, soft gray tonal areas, and delicate plate tone.
  subject_treatment: 'Render the requested subject with the quiet softness of a crayon drawing transferred to metal: grainy contours, gently massed shading and restrained detail.'
  color_and_tone: Soft gray-black ink on warm white paper, faint plate tone, occasional very pale sepia wipe.
  lighting_and_shadow: Diffuse gentle light with soft transitions and bright open areas.
  texture_and_material: Grainy crayon-like lines, captured paper weave, soft tonal texture, and faint plate edge.
  camera_and_composition: Intimate quiet composition, uncluttered, with a single softly defined subject.
  atmosphere_and_mood: Tender, reflective, soft, and quietly mysterious.
  rendering_and_quality: Refined print quality with soft yet readable forms and no muddiness.
  creative_brief: "Soft-ground etching with pencil-like grainy lines that capture the texture of the paper they were drawn through, soft gray tonal areas, and delicate plate tone. Carry it through grainy crayon etched line, captured paper weave, soft gray masses, quiet tenderness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: grainy crayon etched line; captured paper weave; soft gray masses; quiet tenderness
