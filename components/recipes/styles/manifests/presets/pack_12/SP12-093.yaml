visualDna:
  aesthetic: >-
    Third-person exploration/action in a lived-in 1960s Japanese town that is visibly being
    overtaken by red organic bloom.
  subject_treatment: >-
    Keep the playable figure at readable game scale and preserve the requested action; red growth
    may block a flank or route but must not hide the player.
  color_and_tone: >-
    Faded timber, gray-blue daylight, pale fog, and dark uniform cloth punctuated by unmistakable
    crimson flower masses.
  lighting_and_shadow: >-
    Clouded exterior light and subdued school/interior practicals contrast with red-lit transformed
    encounters; transitions stay spatially legible.
  texture_and_material: >-
    Showa wood lattice, papered rooms, roadside concrete, damp earth, and dense red petals/stems
    each retain separate material response.
  camera_and_composition: >-
    Third-person camera behind or slightly above the playable subject, small-to-medium in frame;
    preserve forward traversal space and glimpses of town architecture.
  atmosphere_and_mood: >-
    Familiar rural/school space crossed by folklore and sudden invasion; quiet exploration can turn
    confrontational without losing route readability.
  rendering_and_quality: >-
    Modern detailed game capture with believable rural materials, soft distance fog, and localized
    floral transformation, consistent with observed official gallery imagery.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
