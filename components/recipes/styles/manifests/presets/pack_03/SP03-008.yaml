visualDna:
  aesthetic: 'Feature-animation path tracing: stylized characters and sets rendered with rich subsurface skin, luminous bounce light and storybook saturation.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Saturated warm-cool color script, glowing skin, luminous colored shadows.
  lighting_and_shadow: Cinematic key with warm bounce, colored rim lights, soft shadows that stay full of color.
  texture_and_material: Rounded stylized forms, soft fabrics with fuzz, translucent ears and fingers, painterly textures.
  camera_and_composition: Cinematic character framing with shallow depth of field.
  atmosphere_and_mood: Heartfelt and whimsical, emotion carried by warm light.
  rendering_and_quality: Feature-film animation finish; original designs only, no studio characters.
  key_features: stylized rounded forms; rich subsurface skin; colorful luminous shadows; warm bounce; cinematic depth of field
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Feature Animation Path Tracer as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
