visualDna:
  aesthetic: >-
    Amnesia: The Dark Descent (2010) first-person survival-horror frame: tactile HPL2-era masonry,
    small failing lamplight and strong occlusion hiding the next space.
  color_and_tone: >-
    Keep most of the frame in subdued stone, wood and umber values. A small warm lantern or candle
    pool can reveal a nearby interaction while leaving farther areas uncertain; avoid a full-screen
    amber filter.
  lighting_and_shadow: >-
    Use one practical light source and strong distance falloff. Keep the immediate interaction
    legible and allow the background to lose information gradually, not to pure black.
  texture_and_material: >-
    Show simple 2010-generation real-time stone, timber, metal and cloth, with localized physical
    details and modest texture resolution. Do not add modern microdetail or generalized gore.
  camera_and_composition: >-
    Use a human eye-level first-person gameplay camera and keep the requested near-field action
    legible. Do not add a door, lantern or interaction object unless the prompt calls for it.
  rendering_and_quality: >-
    Read as an authentic 2010 PC-era real-time screenshot translated to a crisp card: plain
    geometry, restrained texture resolution, practical light falloff and stable first-person
    perspective.
  subject_treatment: >-
    Preserve the prompt's subject and action. Visible hands or a held light may enter the frame only
    when the requested action uses them; do not add Daniel or a threat.
  atmosphere_and_mood: >-
    Maintain vulnerable first-person perception and limited visibility while preserving the
    requested event; combat and monster reveal are not required.
avoidRules:
  - third-person portrait, isometric view or cinematic cutaway
  - mandatory monster, chase, castle landmark or named character
  - bright modern PBR gloss, dense microtexture or exaggerated film grain
  - total-black near field or unreadable requested action
  - >-
    unrequested sanity meter, oil gauge, HUD, crosshair, interface, logo or captions; preserve
    explicitly requested UI and text
  - anime, manga or cel-shaded grammar
