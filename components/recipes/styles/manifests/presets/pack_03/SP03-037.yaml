visualDna:
  aesthetic: 'Ambient occlusion pass: a render where only contact darkness shows — corners, creases and touching surfaces darken while everything else stays near white.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: White and light grey with soft charcoal gradients in crevices; no color.
  lighting_and_shadow: Uniform sky with no direction; darkening where surfaces are close to each other.
  texture_and_material: All materials reduced to matte white; geometric detail read only through occlusion.
  camera_and_composition: Keep the requested framing; complex geometry shows the effect best.
  atmosphere_and_mood: Quiet and sculptural, form revealed by where things touch.
  rendering_and_quality: Clean AO pass without directional shadows or color.
  key_features: contact darkness only; white matte surfaces; soft crevice gradients; no light direction; geometry-driven shading
  creative_brief: "Ambient occlusion pass: a render where only contact darkness shows — corners, creases and touching surfaces darken while everything else stays near white. Carry it through contact darkness only, white matte surfaces, soft crevice gradients, no light direction, geometry-driven shading. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
