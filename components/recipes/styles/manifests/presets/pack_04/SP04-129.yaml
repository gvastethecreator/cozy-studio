visualDna:
  aesthetic: 'Archaeological find drawing: the subject recorded as an excavated artifact, pottery-style half profiles with black section fill, stippled surfaces and dashed reconstructions.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns an archaeological record sheet with profile sections, stippled surfaces and reconstructed outlines of the subject as a find, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Black ink on white drafting film, solid black section profiles, grey only where a rubbing is shown.
  lighting_and_shadow: Conventional top-left light in stipple density; section faces solid black with no light.
  texture_and_material: Stippled corrosion and wear, ruled center lines, dashed missing parts, a graphite rubbing of a decorated surface.
  camera_and_composition: Front view split down a center line into exterior and section, detail views and a bar scale without numbers.
  atmosphere_and_mood: Patient and evidential, a past recovered piece by piece.
  rendering_and_quality: Recording-grade accuracy, no find numbers, site codes or captions.
  creative_brief: "Archaeological find drawing: the subject recorded as an excavated artifact, pottery-style half profiles with black section fill, stippled surfaces and dashed reconstructions. Carry it through half profile and section, solid black section fill, stippled surface, dashed reconstruction, unnumbered bar scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: half profile and section; solid black section fill; stippled surface; dashed reconstruction; unnumbered bar scale
