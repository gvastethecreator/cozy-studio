visualDna:
  aesthetic: 'Wildlife field photography: a 500–600 mm lens from a hide or low position, patient observation of a wild animal behaving naturally in its habitat.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Natural muted habitat color, warm low-sun highlights, creamy background.
  lighting_and_shadow: Early or late low sun, backlight or side light for rim on fur and feathers, breath visible in cold air.
  texture_and_material: Individual hairs, feathers, wet fur, snow and water spray crisp on the animal.
  camera_and_composition: Eye-level with the animal, telephoto compression, blurred foreground grass or snow, animal looking or moving into space.
  atmosphere_and_mood: Patient and respectful, an unguarded wild moment witnessed from a distance.
  rendering_and_quality: Field-magazine sharpness with natural color; no zoo bars, collars or tame poses.
  key_features: 600 mm telephoto; eye-level with the animal; low-sun rim light; blurred foreground; natural behavior
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Wildlife Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
