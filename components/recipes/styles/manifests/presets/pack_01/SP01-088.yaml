visualDna:
  aesthetic: 'Ring-flash portrait photography: a circular light around the lens that flattens the face, rings the eyes with donut catchlights, and wraps the subject in a thin even shadow halo.'
  subject_treatment: Subject faces the lens close up or waist-up, expression bold and direct; hair, makeup and wardrobe read as graphic shapes.
  color_and_tone: Punchy saturated color with glossy skin highlights; backgrounds bright or strongly colored.
  lighting_and_shadow: 'On-axis ring flash: nearly shadowless face, a thin dark outline shadow hugging the silhouette on the backdrop, specular sheen on cheekbones.'
  texture_and_material: Glossy lips, vinyl, sequins, wet hair and shiny fabrics catching the ring reflection.
  camera_and_composition: Close frontal framing with the subject near the backdrop so the halo shadow is visible.
  atmosphere_and_mood: Loud, pop, confrontational, and fun.
  rendering_and_quality: Crisp commercial finish, circular catchlights clearly visible in both eyes.
  creative_brief: "Ring-flash portrait photography: a circular light around the lens that flattens the face, rings the eyes with donut catchlights, and wraps the subject in a thin even shadow halo. Carry it through ring flash donut catchlights, thin halo shadow, flat on-axis face light, saturated pop color, glossy speculars. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ring flash donut catchlights; thin halo shadow; flat on-axis face light; saturated pop color; glossy speculars
