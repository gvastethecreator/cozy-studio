visualDna:
  aesthetic: 'Soft Enamel Finish: a surface modifier that fills an existing icon with smooth colored enamel between slightly raised metal borders.'
  subject_treatment: Apply enamel only to the regions of the prompt's existing icon or mark, keeping its contour, openings and colors exactly as they are.
  color_and_tone: Source colors kept, with even enamel coverage and borders of a separate value.
  lighting_and_shadow: Broad soft highlights that never cover text or close any gap.
  texture_and_material: Smooth slightly domed enamel with a discreet raised metal border.
  camera_and_composition: Camera and composition of the input artwork kept unchanged.
  atmosphere_and_mood: Warm compact tactility, like a small collectible pin.
  rendering_and_quality: Before and after contours match; only the surface response changes.
  creative_brief: "Soft Enamel Finish: a surface modifier that fills an existing icon with smooth colored enamel between slightly raised metal borders. Carry it through domed enamel, raised metal border, kept contour, source colors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: domed enamel; raised metal border; kept contour; source colors
