  aesthetic: 'Crayon rubbing frottage: thin paper laid over leaves, coins, wood and grates and rubbed with the side of a crayon, the textures composed into a picture.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Waxy crayon colors on thin paper, strong where raised surfaces caught the crayon.
  lighting_and_shadow: No lighting; tone comes from how hard the crayon was rubbed.
  texture_and_material: Leaf veins, wood grain, coin ridges and grate patterns picked up in waxy strokes with directional sheen.
  camera_and_composition: Flat paper, the subject assembled from different rubbed textures.
  atmosphere_and_mood: Curious and tactile, the world collected by touch.
  rendering_and_quality: Real wax rubbing with directional strokes; not a digital texture fill.
  creative_brief: "Crayon rubbing frottage: thin paper laid over leaves, coins, wood and grates and rubbed with the side of a crayon, the textures composed into a picture. Carry it through rubbed textures composing the subject, waxy directional strokes, leaf and wood grain patterns, thin paper, crayon color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
