visualDna:
  aesthetic: 'In-game screenshot look informed by Metro 2033 Redux gameplay: first-person post-apocalyptic subway capture with flashlight tunnels, gas masks, mutant silhouettes, and Soviet underground survival detail. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Metro 2033 Redux-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Metro 2033 Redux-informed palette: dirty concrete grey, rust brown, flashlight white,
    toxic green, muzzle orange, and black tunnel void. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through flashlight cones, headlamp beams, station fires, muzzle flash, and
    sparse emergency bulbs. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wet rails, cracked tile, patched weapons, gas-mask glass, old posters
    without readable text, and grime-heavy pipes. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person tunnel framing with weapon, mask vignette, route choke points, enemy
    approach lanes, and scavenged-object readability. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: 'Metro 2033 Redux-derived mood: claustrophobic, desperate, feral, cold, and underground; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal survival HUD,
    watch/gas-mask indicators, ammo checks, and diegetic device cues are allowed. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Metro 2033 Redux gameplay screenshots; first-person post-apocalyptic subway capture with
    flashlight tunnels, gas masks, mutant silhouettes, and Soviet underground survival detail; dirty
    concrete grey, rust brown, flashlight white, toxic green, muzzle orange, and black tunnel void;
    flashlight cones, headlamp beams, station fires, muzzle flash, and sparse emergency bulbs; wet
    rails, cracked tile, patched weapons, gas-mask glass, old posters without readable text, and
    grime-heavy pipes; first-person tunnel framing with weapon, mask vignette, route choke points,
    enemy approach lanes, and scavenged-object readability; claustrophobic, desperate, feral, cold,
    and underground; HUD guidance: minimal survival HUD, watch/gas-mask indicators, ammo checks, and
    diegetic device cues are allowed
  creative_brief: "Metro Mutant Subway Horror: in-game screenshot language informed by Metro 2033 Redux, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
