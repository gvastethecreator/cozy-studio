visualDna:
  aesthetic: 'Decision-Point Sign Layout: signs placed at the entrance, before each turn and on arrival, following one supplied route on a plan.'
  subject_treatment: Place the prompt's signs at entrance, decision and arrival points of the supplied route, each tied to a plan position with exact text and arrows.
  color_and_tone: A consistent, redundant route code across the sequence.
  lighting_and_shadow: Comparable light on site and signs, obstacles left visible.
  texture_and_material: Consistent sign supports kept clearly separate from their content.
  camera_and_composition: A plan with numbered points beside a sequence of sign views.
  atmosphere_and_mood: Progressive guidance that gives just enough at every single point.
  rendering_and_quality: Clean sequence with every sign linked to one plan point.
  creative_brief: "Decision-Point Sign Layout: signs placed at the entrance, before each turn and on arrival, following one supplied route on a plan. Carry it through entrance, decision, arrival, plan points, sign sequence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: entrance, decision, arrival; plan points; sign sequence; exact arrows
