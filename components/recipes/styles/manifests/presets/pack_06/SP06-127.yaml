visualDna:
  aesthetic: 'Reed pen drawing: a cut reed dipped in brown ink making blunt, slightly splitting strokes, with the landscape built from rhythmic dashes, dots and short curls.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Warm walnut-brown or faded iron-gall ink on cream laid paper; tone made by the size and crowding of marks.
  lighting_and_shadow: 'Bright open light: sunlit areas left almost bare, shade described by denser rows of short thick marks.'
  texture_and_material: Chunky dry-edged strokes where the reed ran out, split-nib double lines, ink pooling at stroke ends, laid-paper chain lines.
  camera_and_composition: Keep the requested framing; each surface gets its own pattern of marks, such as dashes for fields and curls for foliage.
  atmosphere_and_mood: Sun-baked and vigorous, a lively scene made from rhythm.
  rendering_and_quality: Blunt varied marks with dry edges, no fine hatching, no wash, no hairline nib strokes.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Reed Pen Drawing as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: blunt split reed strokes; rhythmic dashes, dots and curls; brown ink on cream laid paper; dry-edged marks; pattern per surface
