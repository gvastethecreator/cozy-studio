visualDna:
  aesthetic: >-
    Layered print separates existing shapes into deliberate ink areas, with small overlaps that can
    blend locally while retaining clear drawn edges and open reserves.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Align color separations to existing
    forms without simplifying or restaging the subject.
  color_and_tone: >-
    Retain the requested palette and number of colors. Where two specified inks overlap, let them
    create a local third tone; do not force a two-color limit.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use existing color separations to describe value
    without adding shadow shapes or a new source.
  texture_and_material: >-
    Use moderate grain only within selected middle-value areas. Keep the surface treatment controlled
    and avoid heavy registration shifts or an all-over paper texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Ink separation does not create a page,
    border, lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Ink overlaps change local color only and do not add content
    or context.
  rendering_and_quality: >-
    Define the main shapes first, then align color areas and small overlaps to those contours. Keep
    the silhouette stable and overlap marks subtle.
avoidRules:
  - forced two-color or monochrome palette
  - extreme registration shifts or age effects
  - unrequested page, border, lettering, or period motifs
