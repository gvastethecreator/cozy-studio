visualDna:
  aesthetic: 'Competitive ballroom anime of formal partner motion: frames held, gowns sweeping, posture and connection turned into line.'
  subject_treatment: Keep the prompt's subject and action; express it through partnered motion, held frames and sweeping arcs of fabric.
  color_and_tone: Gown jewel colors and black tailcoats against warm ballroom gold.
  lighting_and_shadow: Chandelier and spotlight glow with sparkling highlights on sequins and hair.
  texture_and_material: Flowing chiffon, sequins, polished shoes and a glossy parquet floor.
  camera_and_composition: Circling framings around couples and sweeping diagonals across the floor.
  atmosphere_and_mood: Elegant and intense, two people moving as one line under pressure.
  rendering_and_quality: Graceful sports anime with long fabric motion arcs and polished detail.
  key_features: held frame; sweeping gowns; parquet reflections; partnership
  creative_brief: "Competitive ballroom anime of formal partner motion: frames held, gowns sweeping, posture and connection turned into line. Carry it through held frame, sweeping gowns, parquet reflections, partnership. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
