visualDna:
  aesthetic: 'Isometric strategy tiles: each subject built on a 2:1 diamond tile with beveled edges, as a clean atlas-ready game asset.'
  subject_treatment: Keep the prompt subject and its design; present it as a standalone game asset on a plain field, and build a gameplay scene or interface only when the prompt asks for one.
  color_and_tone: Clear readable greens, sand and slate with slightly saturated team-color accents; side faces one step darker.
  lighting_and_shadow: Fixed top-left sun on every tile; short consistent shadows falling inside the tile footprint.
  texture_and_material: Simple painted textures, beveled tile edges, a visible soil or rock cross-section on the tile sides.
  camera_and_composition: True 2:1 isometric projection, no vanishing point, tiles centered on a plain light background with equal spacing.
  atmosphere_and_mood: Orderly and inviting, a board game ready to be played.
  rendering_and_quality: Crisp edges and consistent tile size and light across the set; no perspective drift.
  key_features: 2:1 diamond tiles; beveled edges; cross-section tile sides; fixed top-left sun; plain background
  creative_brief: "Isometric strategy tiles: each subject built on a 2:1 diamond tile with beveled edges, as a clean atlas-ready game asset. Carry it through 2:1 diamond tiles, beveled edges, cross-section tile sides, fixed top-left sun, plain background. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - perspective camera
  - army requirement
  - full map scene
  - motion blur
  - inconsistent proportions
  - changing costume
  - background scene
  - literal terrain requirement
  - watermark
  - text
  - wrong medium
  - generic AI gloss
  - muddy noise
  - uncontrolled texture chatter
  - readable text
  - signature
  - low resolution
  - readable UI text
  - logo clutter
  - generic screenshot
  - unplayable visual clutter
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
