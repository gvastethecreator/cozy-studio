visualDna:
  aesthetic: 'Late-1980s to early-1990s OVA hand-painted cel: confident color blocks, airbrushed highlights on hair and armor, glossy eye highlights and painted background boards.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Figures take period anatomy, long limbs, sharp jaws and detailed hair clumps, without copying any canon character or ensemble.
  color_and_tone: Rich saturated color blocks, warm sunset highlights against cool blue-violet shadows, slightly faded like filmed cels.
  lighting_and_shadow: Strong painted directional light, a two-tone cel shadow plus an airbrushed highlight band on hair and metal.
  texture_and_material: Fine analog film grain, faint cel dust and soft color bleed at edges over gouache-painted backgrounds.
  camera_and_composition: Keep the requested view; foreground and distance are separated by layered color planes like a multiplane camera.
  atmosphere_and_mood: Cinematic, earnest and epic in the old analog way.
  rendering_and_quality: Crisp ink contour, broad controlled shading, restrained grain and the slight softness of cels shot on film.
  key_features: airbrushed highlight bands; hand-painted cel blocks; gouache background boards; film grain and cel dust; long-limbed period anatomy
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Classic OVA Quest Tapestry Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
