visualDna:
  aesthetic: 'Delicate contour lines and tiny, controlled highlight points give existing forms a finely finished, compact surface detail.'
  subject_treatment: 'Keep exact proportions, age, silhouette, and count; render small details finely without shrinking the subject or changing its character.'
  color_and_tone: 'Use gentle tonal steps and a restrained light palette only when the prompt allows; preserve explicit colors and strong contrast.'
  lighting_and_shadow: 'Use smooth highlights and soft shadow transitions with precise contact edges; follow the actual light direction.'
  texture_and_material: 'Use fine grain and small highlights only to describe materials named in the prompt.'
  camera_and_composition: 'Preserve view, crop, scale, spacing, and count; apply compact detail within the image, not a miniature camera or symmetric layout.'
  atmosphere_and_mood: 'Retain the requested feeling; delicate rendering does not assign an emotional tone.'
  rendering_and_quality: 'Use crisp microdetail, clean contours, and small highlight accents without overdecorating the frame.'
  key_features: 'Delicate contour; tiny highlights; fine material detail; gentle tonal steps; compact precision without scale change.'
  creative_brief: 'Make fine surface marks and small highlights carry the detail without miniaturizing forms. Preserve subject, action, count, camera, and mood.'
