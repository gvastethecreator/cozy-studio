visualDna:
  aesthetic: 'CCTV security capture: a fixed camera high in a corner recording low-resolution, compressed surveillance frames, often in infrared monochrome at night.'
  subject_treatment: Keep the prompt subject and action; this preset owns the high fixed corner viewpoint and the surveillance signal, and the setting stays the prompt's.
  color_and_tone: Washed grey-green or infrared monochrome at night, desaturated cool color by day, crushed blacks, blown lamps.
  lighting_and_shadow: Existing ceiling lights or the camera's own infrared illuminator; hot center, dark corners, glowing eyes under IR.
  texture_and_material: Blocky compression artifacts, soft low resolution, interlaced motion smear on moving figures, slight lens dirt.
  camera_and_composition: Ceiling-corner angle looking down, wide lens with barrel distortion, subject small and off-center, no framing intent.
  atmosphere_and_mood: Cold and voyeuristic, an indifferent machine watching without caring.
  rendering_and_quality: Evidence-grade surveillance frame; any on-screen overlay stays abstract and unreadable, never text.
  key_features: high corner viewpoint; IR monochrome; compression blocks; wide barrel distortion; smeared motion
  creative_brief: "CCTV security capture: a fixed camera high in a corner recording low-resolution, compressed surveillance frames, often in infrared monochrome at night. Carry it through high corner viewpoint, IR monochrome, compression blocks, wide barrel distortion, smeared motion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
