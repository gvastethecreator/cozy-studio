  creative_brief: "Bubble wrap fashion: garments made of clear bubble wrap, with rows of air cells catching light. Carry it through bubble wrap cells, glinting highlights, taped seams, puffy volume. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
