visualDna:
  aesthetic: 'Wax crayon drawing made the way a child draws: pressure-variable waxy strokes, directional scribble fill and happy disregard for staying inside lines.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: A box of bright primary and secondary crayons, colors overlapped by scribbling one over another.
  lighting_and_shadow: No light logic; darker areas are just pressed harder, and a corner sun with rays is the only light.
  texture_and_material: Wax buildup and flakes, paper tooth showing through light strokes, uneven directional scribble fill.
  camera_and_composition: Flat side view on a baseline of grass, a strip of blue sky on top, everything spread out to be seen.
  atmosphere_and_mood: Joyful, innocent and spontaneous, drawn in one happy go.
  rendering_and_quality: Deliberately unpolished wax marks with wobbly shapes; never smooth blending or perspective accuracy.
  key_features: waxy pressure strokes; directional scribble fill; paper tooth; sky strip and grass baseline; corner sun
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Crayon Drawing as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
