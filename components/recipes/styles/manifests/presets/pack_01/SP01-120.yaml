visualDna:
  aesthetic: 'Camera-trap photography: a remote wide-angle camera low to the ground, fired by an animal crossing its beam at night with a flash close by.'
  subject_treatment: Keep the prompt subject and setting; this preset owns the camera placement and lens described below, nothing else.
  color_and_tone: Flash-bright subject, surroundings falling to black, slightly cool flash color.
  lighting_and_shadow: Off-camera flash from one side a meter away, hard shadow behind the animal, quick falloff into night.
  texture_and_material: Fur and eyes vivid, eye-shine from the flash, dew and leaf litter crisp in the foreground.
  camera_and_composition: Camera at ground level with a wide lens, animal close and unaware, sometimes slightly cut off at the edge.
  atmosphere_and_mood: Secret and wild, a glimpse of a nocturnal life no one was there to see.
  rendering_and_quality: Real remote-camera look with some noise; no studio polish or posed animal.
  creative_brief: "Camera-trap photography: a remote wide-angle camera low to the ground, fired by an animal crossing its beam at night with a flash close by. Carry it through ground-level wide angle, close off-camera night flash, eye-shine, black background, unaware animal. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ground-level wide angle; close off-camera night flash; eye-shine; black background; unaware animal
