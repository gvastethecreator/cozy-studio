visualDna:
  aesthetic: 'Borescope inspection: a tiny camera on a flexible probe pushed into a cavity, with its own ring of LEDs lighting a round, tunnel-like view.'
  subject_treatment: Keep the prompt subject and action; this preset owns the probe-camera view from inside a narrow cavity, and the setting stays the prompt's.
  color_and_tone: Cool LED white near the lens, rapid falloff to black, slight green or blue sensor cast.
  lighting_and_shadow: 'Ring LEDs around the lens: bright glare on near wet surfaces, darkness beyond.'
  texture_and_material: Dust, corrosion, cobwebs and condensation magnified; low resolution softness.
  camera_and_composition: Circular vignette, extreme wide angle, tunnel perspective into the cavity.
  atmosphere_and_mood: Claustrophobic and curious, peering into places never meant to be seen.
  rendering_and_quality: Honest inspection-camera realism with no readable overlay, grid or measurements.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Borescope Inspection as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
