visualDna:
  aesthetic: >-
    Chibi Platformer Sprite Bounce acts as a transferable art-medium router: start from Chibi
    platformer sprite style with squashy silhouette rhythm, toy like proportions, and instant read
    at small scale, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity and game-art direction system built from playable
    readability, UI or asset grammar, role clarity, production polish, and genre-specific visual
    feedback, then apply the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Adapt any subject into cute compact forms with oversized
    key shapes, soft corner logic, and bouncy pose arcs; preserve the prompt subject while routing
    it through tile readability, icon clarity, splash rendering, interface material, sprite bounce,
    shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Bright candy palette, simple shadow elevated edge structure, cheerful accent
    colors, and clean separation from transparent ground; use color as gameplay hierarchy: rarity
    glow, faction contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or
    readable inventory material, with deliberate value grouping, accent control, and medium-specific
    limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Small consistent highlight caps, soft under shadows, and minimal volume
    modeling for animation stability; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Smooth pixel clusters, rounded outline pixels, tiny specular dots, and almost no noisy
    surface texture; surface detail should support genre grammar through parchment, HUD glass, pixel
    atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through central orthographic sprite sheet framing with stable scale,
    predictable pivot, and side/three quarter clarity; compose through gameplay-facing hierarchy,
    atlas consistency, menu rhythm, parallax layers, tactical grid, encounter scale, or
    selection-screen energy, with scale, spacing, edge rhythm, and visual hierarchy doing the style
    work.
  atmosphere_and_mood: >-
    Keep the mood Playful, agile, readable mood without requiring characters, platforms, costumes,
    or support field scenes; derive mood from playable stakes, collection desire, tactical control,
    cozy routine, survival dread, arcade speed, or heroic confrontation, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Animation sheet friendly, crisp edges, transparent support field safe, no motion
    blur, no text; finish with game-production clarity, strong silhouettes, controlled UI-like
    detail, and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and
    enough craft evidence to make the medium recognizable.
  key_features: >-
    Chibi platformer sprite style with squashy silhouette rhythm, toy like proportions, and instant
    read at small scale; gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity; Bright candy palette, simple shadow elevated edge
    structure, cheerful accent colors, and clean separation from transparent ground; Smooth pixel
    clusters, rounded outline pixels, tiny specular dots, and almost no noisy surface texture;
    central orthographic sprite sheet framing with stable scale, predictable pivot, and side/three
    quarter clarity
  creative_brief: >-
    Apply Chibi Platformer Sprite Bounce as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Chibi platformer sprite style with squashy silhouette rhythm, toy like proportions, and
    instant read at small scale, gameplay-readable hierarchy, genre-specific surface language,
    UI-aware composition, and production-art clarity, Smooth pixel clusters, rounded outline pixels,
    tiny specular dots, and almost no noisy surface texture without requiring the card image's
    original subject.
