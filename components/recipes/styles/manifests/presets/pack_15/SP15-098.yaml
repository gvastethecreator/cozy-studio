visualDna:
  aesthetic:
    A cold-adapted engineering language of pressure-bearing crystal facets, layered thermal shells,
    insulated joints, fracture boundaries and compact shelter forms, not frost on surfaces alone.
  subject_treatment:
    Preserve subject and locks. Restyle open structures with faceted load paths, thermal layers,
    sealed joins and ice-glass or cold-rated components; do not turn every subject into a ship. Make one
    insulated joint or cold-rated material transition visible on an existing element while keeping the requested
    room and familiar furniture forms.
  color_and_tone:
    Use glacier white, blue-gray, deep ink and clear ice values, with a restrained warm signal
    accent. Respect palette and distinguish planes.
  lighting_and_shadow:
    Honor stated lighting. Use crisp cool shadows and controlled translucent edges; no automatic
    lantern, glow or polar night.
  texture_and_material:
    Distinguish matte ice grain, pressure-polished facets, frost insulation, metal and
    fabric locally. Preserve locked materials unless redesign is open.
  camera_and_composition:
    Preserve viewpoint, crop and the requested room context. Arrange compressed planes and diagonal stress paths
    on existing structures rather than presenting furniture as an isolated product lineup; do not add a polar
    landscape or expedition view unless requested.
  atmosphere_and_mood:
    Suggest cold resilience, pressure, clarity or shelter while retaining requested tone;
    survival and isolation are optional stories.
  rendering_and_quality:
    Use large readable planes, crisp fractures and precise insulation details. Avoid fine
    crack webs, all-over frost and detail that vanishes at thumbnail scale.
avoidRules:
  - Do not require ship, harbor, lantern, polar landscape or exploration equipment.
  - Do not frost materials that are not ice or explicitly compatible.
  - Avoid dense crack networks and automatic blue light.
