visualDna:
  aesthetic: >-
    Pointillism (Seurat) becomes a transferable discrete mark, mosaic, and glass segmentation
    system: start from Made of tiny dots and Dots only, then route prompt content through dots,
    tiles, grout, lead came, optical mixing, and segmented luminous surfaces without forcing one
    card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Dots only to rebuild forms from dots, glass
    cells, tile units, grout lines, or lead outlines while preserving silhouette; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Optical mixing; use color as optical mixing, glass translucency, tile
    pigment, grout contrast, and luminous segmentation, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Soft drive the light response: shape light through dot vibration, tile highlights,
    stained-glass glow, or shallow relief shadow, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Dots as the tactile or mark-making basis; surfaces require individual marks, tile gaps,
    lead seams, pigment density, and unit-to-unit variation, scaled to figures, props, spaces, or
    close material studies.
  camera_and_composition: >-
    Compose around Dots only as reusable spatial grammar: favor readable silhouettes, local unit
    scale changes, tessellated flow, and segmented rhythm, adapting cleanly to portraits, objects,
    environments, and action scenes.
  atmosphere_and_mood: >-
    Use Calm, vibrant as the emotional register; derive mood from craft, sacred light, optical
    vibration, public art, and patient mark-making, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Impressionist, scientific: finish with coherent units, controlled outlines, and no
    blurred pseudo-mosaic mush, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Made of tiny dots; Dots only; Optical mixing; Soft; Dots; Dots only; Calm, vibrant;
    Impressionist, scientific; Dots only
  creative_brief: >-
    Route any subject through Pointillism (Seurat) as a transferable point, mosaic, or
    glass-construction visual system: preserve prompt intent while converting form, fragments, gaps,
    optical mixing, and cumulative mark logic through this preset. Apply pointillist color
    construction to the input: tiny separated pigment dots, optical color mixing, bright local
    marks, and distance-based cohesion should let the subject assemble from painterly particles.
avoidRules:
  - brush strokes
  - lines
  - blurred mush
  - continuous brush rendering
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
