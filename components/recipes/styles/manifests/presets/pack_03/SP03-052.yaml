visualDna:
  aesthetic: 'Automotive CGI studio render: a vehicle under a vast overhead light canopy, its paint showing one clean horizon reflection flowing unbroken from nose to tail.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the low front three-quarter studio view under an overhead light canopy, while the vehicle keeps its exact design; a non-vehicle subject gets the same paint-and-reflection studio. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Deep metallic paint with visible color flop, a black studio floor, cool white highlights and small warm glints.
  lighting_and_shadow: Giant overhead softbox plus two side strips, laying a crisp horizon line across the flanks and a hot highlight on the shoulder.
  texture_and_material: Flake metallic clear coat, tinted glass, rubber sidewalls, machined wheel faces and trim with exact reflection breaks.
  camera_and_composition: Low front three-quarter view at wheel-hub height with a 50 to 85 mm lens, front wheels turned slightly toward camera.
  atmosphere_and_mood: Powerful and poised, motion implied while the machine stands completely still.
  rendering_and_quality: Reflection lines continuous across panel gaps, floor reflection softly faded, and no dirt, dents or motion blur.
  key_features: overhead light canopy; unbroken horizon reflection; low front three-quarter; color-flop metallic paint; turned front wheels
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Automotive Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
