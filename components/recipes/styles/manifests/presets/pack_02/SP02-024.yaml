visualDna:
  aesthetic: 'Public access TV studio: a sincere amateur show taped in a tiny community studio with cheap sets and uneven lighting.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Muddy colors, a bright blue curtain or glitter backdrop, blown faces, UHF color noise.
  lighting_and_shadow: One or two badly placed lights, hot spots, harsh shadows on the curtain.
  texture_and_material: Cheap props, tinsel, plywood desks, noisy UHF reception and bad keying.
  camera_and_composition: Static wide shot, framing slightly off, microphone cable visible.
  atmosphere_and_mood: Awkward and sincere, homemade passion on a zero budget.
  rendering_and_quality: Low-grade analog signal; any graphics blocky and textless.
  key_features: tiny community studio; blue curtain backdrop; badly placed lights; UHF noise; awkward static framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Public Access TV as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
