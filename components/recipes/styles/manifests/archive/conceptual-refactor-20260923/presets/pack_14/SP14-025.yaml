    kappa shaping silhouette rhythm, contour pressure, and symbolic edge control, water shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus jurisprudence shaping
    silhouette rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette
    pressure, emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory
    actor or prop set.
