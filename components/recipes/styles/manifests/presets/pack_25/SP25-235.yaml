visualDna:
  aesthetic: 'Dot-Unit Comparison: one identical mark stands for one unit, grouped in rows so every count can be checked by eye.'
  subject_treatment: Show the prompt's quantities with one identical mark per unit in rows of a declared size, totals printed beside each group and every number exact.
  color_and_tone: Category colors backed by spacing or shape, every mark worth the same.
  lighting_and_shadow: Flat marks with no depth, all read as equal discrete units.
  texture_and_material: Simple circles or marks of constant area with crisp edges.
  camera_and_composition: Rows of declared capacity with visible gaps and exact totals beside each.
  atmosphere_and_mood: Orderly repetition with differences you can count in a moment.
  rendering_and_quality: Crisp chart with complete units and counts matching the totals.
  creative_brief: "Dot-Unit Comparison: one identical mark stands for one unit, grouped in rows so every count can be checked by eye. Carry it through one mark per unit, rows of fixed size, printed totals, countable. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one mark per unit; rows of fixed size; printed totals; countable
