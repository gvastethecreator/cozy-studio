visualDna:
  aesthetic: 'Skateboarding anime of flow and neon: trick lines, ramps at night, bare concrete walls and boards drawn in bright motion arcs.'
  subject_treatment: Keep the prompt's subject and action; turn movement into flowing trick lines through an urban or skatepark space.
  color_and_tone: Neon magenta and cyan against night concrete grey, with bright board graphics.
  lighting_and_shadow: Neon signs and park floodlights, colored rims and long shadows on concrete.
  texture_and_material: Concrete, grip tape, urethane wheels and loose clothing in clean cel with motion blur.
  camera_and_composition: Fisheye low angles at the lip of ramps and long lines following a run.
  atmosphere_and_mood: Loose and exhilarating, the pure fun of carving through a city at night.
  rendering_and_quality: Stylish sports anime with bright neon glow and smooth motion arcs.
  key_features: trick lines; neon rims; fisheye ramps; motion arcs
  creative_brief: "Skateboarding anime of flow and neon: trick lines, ramps at night, bare concrete walls and boards drawn in bright motion arcs. Carry it through trick lines, neon rims, fisheye ramps, motion arcs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
