visualDna:
  aesthetic: 'High-gloss polymer couture: garments of mirror-glossy latex or PVC with liquid highlights and tight reflections.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: glossy latex or PVC with sharp specular streaks along every curve.'
  color_and_tone: Deep black, cherry red or chrome silver with white specular streaks.
  lighting_and_shadow: Hard strip lights that draw long highlights along each curve.
  texture_and_material: Stretched latex, vinyl and patent polymer with mirror reflections.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Sleek, bold, provocative and futuristic, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: mirror-gloss latex or PVC; long specular streaks; tight reflections; liquid highlights
  creative_brief: "High-gloss polymer couture: garments of mirror-glossy latex or PVC with liquid highlights and tight reflections. Carry it through mirror-gloss latex or PVC, long specular streaks, tight reflections, liquid highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
