    era-aware line economy and genre tone; fuse it with prestige anime horror with negative space,
    body unease, ritual geometry, liminal dread, and controlled visual silence; it routes era,
    genre, line economy, cel or digital finish, and performance tone without locking prompt content
    to the source title or sample image.
  subject_treatment: >-
    Preserve the prompt subject, action, and context while restyling forms through distorted
    contour, puppet tension, and controlled anatomical wrongness, alongside jointed unease and
    puppet-like contour tension; identity should remain readable through anime contour, expression
    economy, pose energy, shape simplification, and effect hierarchy instead of a required canon
    character or title scene.
  color_and_tone: >-
