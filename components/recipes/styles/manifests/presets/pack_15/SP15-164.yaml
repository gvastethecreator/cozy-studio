visualDna:
  aesthetic: 'Monsoonpunk: cities designed for torrential rain, with waterfall streets, umbrella roofs, rain-harvesting towers and life that goes on in the downpour.'
  subject_treatment: Keep the prompt's subject and setting; drench it in heavy monsoon rain with rain-harvesting structures and people carrying on.
  color_and_tone: Rain greys and deep greens with saturated umbrella colors and lamp amber.
  lighting_and_shadow: Diffuse rain light, glowing windows and reflections in flooded streets.
  texture_and_material: Sheets of rain, waterproof tarps, gutters, rain chains and soaked fabrics.
  camera_and_composition: Streets seen through curtains of rain with waterfalls pouring off roofs.
  atmosphere_and_mood: Drenched and lively, a city that treats the storm as part of the family.
  rendering_and_quality: Atmospheric illustration with convincing rain sheets and wet reflections.
  creative_brief: "Monsoonpunk: cities designed for torrential rain, with waterfall streets, umbrella roofs, rain-harvesting towers and life that goes on in the downpour. Carry it through rain curtains, waterfall roofs, umbrella canopies, rain chains. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rain curtains; waterfall roofs; umbrella canopies; rain chains
