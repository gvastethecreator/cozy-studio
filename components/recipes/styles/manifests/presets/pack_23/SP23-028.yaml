visualDna:
  aesthetic: >-
    Painterly color is translated into short raster ramps, softly drawn but quantized contours and
    a few defined highlights. Use this color and edge language independently of any game scene.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action and proportions. Model its existing
    shapes with painterly color transitions constrained to crisp raster groupings; do not introduce
    a corridor, monster, player hands or another game-specific subject.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. Maintain varied color within compact
    ramps instead of assigning fixed dungeon colors, a prescribed darkness or an unrelated game
    palette.
  lighting_and_shadow: >-
    Follow the requested source, direction and contrast of light. Keep highlights shaped and limited
    to existing forms, and build their transitions with quantized steps rather than photographic
    blur or smooth gradient wash.
  texture_and_material: >-
    Preserve the actual material cues already requested. Let painted variation enrich existing
    surfaces while keeping raster edges controlled; do not add distressed stone, grime or material
    effects simply to signal a fantasy setting.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and spatial arrangement. Do not impose a
    first-person corridor, gameplay framing, interface or sequel-specific camera convention.
  atmosphere_and_mood: >-
    Keep the user's setting and mood. The rendering treatment does not add a dungeon, monster,
    player viewpoint or historical-medieval setting.
  rendering_and_quality: >-
    Keep contour softness subordinate to clear raster structure. Retain color variety, concise ramps
    and intentional highlights without photographic smoothing or noisy pixels.
avoidRules:
  - unrequested corridor, monster, player hands or dungeon scene
  - unrequested sequel-specific visual treatment
  - photographic blur or smooth gradients that erase quantized raster contours
  - fixed game palette, first-person camera or interface
