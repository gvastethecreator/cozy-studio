visualDna:
  aesthetic: 'Feathered wet bloom: ink touched into soaked paper so it spreads in soft feathered halos, with forms emerging from the blooms rather than drawn outlines.'
  subject_treatment: Suggest the prompt's subject through ink blooms spreading into wet paper, adding a few drier accents later so its shape and identity stay readable.
  color_and_tone: Indigo, sepia or black ink blooming into pale tints, soft gradients from each drop point outward.
  lighting_and_shadow: Light lives in the pale feathered edges of each bloom; shadow gathers where drops overlapped and darkened.
  texture_and_material: Feathered halo edges, branching capillary tendrils and cauliflower backruns on heavy soaked paper.
  camera_and_composition: Soft-edged masses floating in the frame, the subject centered in the densest bloom.
  atmosphere_and_mood: Dreamy, damp and quiet, like a memory seeping into paper.
  rendering_and_quality: Organic spreading blooms with a few crisp dry accents, never hard outlines everywhere.
  creative_brief: "Feathered wet bloom: ink touched into soaked paper so it spreads in soft feathered halos, with forms emerging from the blooms rather than drawn outlines. Carry it through feathered halos, capillary tendrils, backruns, few dry accents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: feathered halos; capillary tendrils; backruns; few dry accents
