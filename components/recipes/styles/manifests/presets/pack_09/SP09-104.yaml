visualDna:
  aesthetic: 'Pollen and spores: clouds of fine glowing pollen or spores puffing from the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: puffs of fine pollen or spores drift from the target.'
  color_and_tone: Golden pollen or pale green spores, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Backlight making particles glow, so the effect lights the target and casts believable local light.
  texture_and_material: Fine drifting particle clouds, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Organic, dreamy, alive and strange, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Pollen and spores: clouds of fine glowing pollen or spores puffing from the target. Carry it through glowing pollen clouds, drifting spores, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: glowing pollen clouds; drifting spores; contained around the target
