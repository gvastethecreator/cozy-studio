visualDna:
  aesthetic: >-
    Use a light, continuous line with flat color or gentle modulation and generous pauses in detail.
    Keep formal oddness within shapes the user has already authorized; do not transform the content.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and function. Use open
    line and clean color areas to describe existing forms without adding content.
  color_and_tone: >-
    Preserve the user's palette and tonal relationships. Use flat areas or subtle shifts within the
    specified colors; do not impose a particular color range or scheme.
  lighting_and_shadow: >-
    Follow the requested lighting and shadows. Keep modulation soft and limited where it fits the
    request, without adding glow or a new light direction.
  texture_and_material: >-
    Preserve depicted materials while leaving broad areas visually quiet. Use surface detail sparingly
    and do not add grain, synthetic textures or implied wear unless requested.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, arrangement and negative space. Do not impose
    an unrequested layout or change the scene hierarchy.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. A clear line and open color fields do not require a particular
    genre, narrative or imagined environment.
  rendering_and_quality: >-
    Keep line weight consistent, color edges clean and detail sparse enough to preserve open space.
    Maintain the requested level of finish without gloss, blur or decorative layout.
avoidRules:
  - unrequested setting, content or formal distortion
  - forced color scheme or atmosphere
  - unrequested framing or layout
  - added texture, glow or detail that closes open color fields
assets:
