visualDna:
  aesthetic: 'Sparse Topology Icons: a minimal set of nodes and links shows real relations with consistent linking patterns.'
  subject_treatment: Show the prompt's subject or requested relations only with the nodes and links that truly exist, each node type holding one clear role.
  color_and_tone: One ink, with node roles told apart by shape or size.
  lighting_and_shadow: Flat crisp connections joined to compact solid nodes of equal weight.
  texture_and_material: Clean lines, compact nodes and joins with deliberate spacing.
  camera_and_composition: Topology and traceable routes placed before decorative symmetry.
  atmosphere_and_mood: Connection clarity with small, deliberate tensions of distance between nodes.
  rendering_and_quality: The exact number of nodes and links kept, with no ambiguous crossings.
  creative_brief: "Sparse Topology Icons: a minimal set of nodes and links shows real relations with consistent linking patterns. Carry it through minimal nodes, true links, role shapes, traceable routes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: minimal nodes; true links; role shapes; traceable routes
