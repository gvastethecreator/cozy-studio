visualDna:
  aesthetic: 'Layered Evidence Maps: three layers keep observed evidence, supplied context and proposed interpretation visibly apart.'
  subject_treatment: Separate the prompt's observed points, context and proposed interpretation into three layers with different line styles and one legend, every label exact.
  color_and_tone: Palette by kind of knowledge, observation solid, context faint and interpretation marked.
  lighting_and_shadow: Flat planes and checkable opacities with no dramatic light.
  texture_and_material: Solid marks for facts, dashed lines for hypotheses and open areas for context.
  camera_and_composition: Persistent legend, separable layers and anchored labels over the original marks.
  atmosphere_and_mood: Reflective reading that shows gaps and uncertainty honestly.
  rendering_and_quality: Crisp map where the layer styles stay distinct at small size and in grey.
  creative_brief: "Layered Evidence Maps: three layers keep observed evidence, supplied context and proposed interpretation visibly apart. Carry it through three knowledge layers, dashed hypotheses, persistent legend, visible gaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three knowledge layers; dashed hypotheses; persistent legend; visible gaps
avoidRules:
  - hypotheses drawn as measurements
  - heatmaps with no data
  - filled areas hiding missing evidence
  - invented values, links or measurements
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
