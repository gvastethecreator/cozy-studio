visualDna:
  aesthetic: 'Isometric Process Blocks: process stages as blocks of equal depth in one isometric projection, linked through visible ports.'
  subject_treatment: Build the prompt's stages as equal-depth isometric blocks joined through visible ports, block size never implying quantity; keep labels exact.
  color_and_tone: Color separating function or phase, with side faces darkened by one common step.
  lighting_and_shadow: One conventional light that describes orientation across all blocks.
  texture_and_material: Clean planes, shared edges and connectors resting on clear ports.
  camera_and_composition: One projection, a clear path and horizontal labels over no needed link.
  atmosphere_and_mood: Modular and explanatory, with working space between stages.
  rendering_and_quality: Crisp diagram with identical axis angles and readable undistorted text.
  creative_brief: "Isometric Process Blocks: process stages as blocks of equal depth in one isometric projection, linked through visible ports. Carry it through equal isometric blocks, visible ports, one projection, stages not quantities. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal isometric blocks; visible ports; one projection; stages not quantities
