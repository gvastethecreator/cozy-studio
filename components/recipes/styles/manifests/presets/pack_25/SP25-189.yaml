visualDna:
  aesthetic: 'Compressed Aperture Sans: narrow compact letters paired with wide open apertures and expressive cuts, drawn rather than squashed.'
  subject_treatment: Letter the requested words in narrow compact forms with wide apertures and expressive cuts, redrawn letter by letter with every sign exact.
  color_and_tone: One ink of firm contrast on a clean ground.
  lighting_and_shadow: Flat lettering where the apertures open through drawing alone.
  texture_and_material: Defined terminals, consistent walls and optically widened apertures.
  camera_and_composition: Tight rhythm with enough spacing, widths adapted to each letter.
  atmosphere_and_mood: Concentration and energy, tall and confident without feeling crushed.
  rendering_and_quality: Crisp lettering where C, G and S apertures stay open when small.
  creative_brief: "Compressed Aperture Sans: narrow compact letters paired with wide open apertures and expressive cuts, drawn rather than squashed. Carry it through narrow widths, wide apertures, expressive cuts, drawn letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: narrow widths; wide apertures; expressive cuts; drawn letters
