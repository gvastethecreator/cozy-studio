visualDna:
  aesthetic: Forms emerge from broad fields of atomized ink that merge into soft tonal veils with selectively feathered edges.
  subject_treatment:
    Preserve the requested subject and proportions. Use localized aerosol passes to describe its
    surfaces and silhouette instead of veiling the whole image in fog.
  color_and_tone:
    Layer a restrained range from the requested palette, building value through deposit density.
    Keep colors separated enough that adjacent forms remain easy to read.
  lighting_and_shadow:
    Use denser deposits for shadow planes and lighter passes for transitions. Follow the requested
    lighting direction without inventing neon or a new setting.
  texture_and_material:
    Let fine atomized pigment soften selected boundaries while retaining a few crisp edges at focal
    forms. The deposit should read as merged tone, not individually drawn dots.
  camera_and_composition:
    Retain the requested framing and viewpoint. Place soft transitions within existing forms and
    keep their outer silhouettes legible.
  atmosphere_and_mood:
    Follow the requested mood through the spread and contrast of the ink. Aerosol handling does not
    require graffiti, signage or an urban scene.
  rendering_and_quality:
    Keep spray density controlled and localized with clear form separation. Avoid blanket mist,
    hard stencil cutouts and arbitrary splatter.
avoidRules:
  - blanket aerosol haze
  - hard stencil cutouts
  - unrequested graffiti lettering
  - arbitrary splatter
