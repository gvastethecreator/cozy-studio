visualDna:
  aesthetic: 'Tidepunk: coastal cities powered by the rhythm of tides, with tidal turbines, sea gates, floating docks and streets that appear and vanish twice a day.'
  subject_treatment: Keep the prompt's subject and setting; place it on a tidal shore with sea gates, turbines and streets half covered by water.
  color_and_tone: Slate sea greys, sand beige and kelp green with rusted orange turbine hubs.
  lighting_and_shadow: Low coastal sun glinting on wet flats and water pouring through sea gates.
  texture_and_material: Barnacled concrete, turbine blades, wet sand ripples, chains and seaweed.
  camera_and_composition: Wide tidal flats with structures standing in shallow water at low or high tide.
  atmosphere_and_mood: Rhythmic and patient, life timed to the breathing of the sea.
  rendering_and_quality: Crisp coastal illustration with wet reflections and moving water.
  creative_brief: "Tidepunk: coastal cities powered by the rhythm of tides, with tidal turbines, sea gates, floating docks and streets that appear and vanish twice a day. Carry it through tidal turbines, sea gates, vanishing streets, wet flats. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tidal turbines; sea gates; vanishing streets; wet flats
