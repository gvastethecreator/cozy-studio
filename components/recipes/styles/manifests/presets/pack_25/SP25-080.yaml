visualDna:
  aesthetic: 'Five-State UI Specimen: one interface language shown across library, editor, search, settings and error screens with the same data.'
  subject_treatment: Show the prompt's app in five screens, library, editor, empty search, settings and error, with the same names, selection and values in each.
  color_and_tone: Identical color roles across all five screens, with one shared accent.
  lighting_and_shadow: One depth model shared by every view, flat and consistent.
  texture_and_material: The same borders, type and densities by role in every screen.
  camera_and_composition: Five screens in a row with global controls and back paths in the same places.
  atmosphere_and_mood: Product unity and a clear flow, one app rather than five pictures.
  rendering_and_quality: Every view uses the same names, selection and test values.
  creative_brief: "Five-State UI Specimen: one interface language shown across library, editor, search, settings and error screens with the same data. Carry it through five screens, same data, identical roles, fixed global controls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: five screens; same data; identical roles; fixed global controls
avoidRules:
  - changed data between screens
  - missing states
  - a style that only works on one screen
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
