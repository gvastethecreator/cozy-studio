visualDna:
  aesthetic: >-
    Build the graphic anime treatment from severe dark brush contours with clean, abrupt tapers
    and sharp graphic forms separated by broad negative space. Let short straight strokes and
    broken vertical highlight lines set its rhythm; use deep indigo and black with restrained neon
    cyan and magenta for color and smooth dark fields with thin reflective marks and sparse grain
    for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use severe dark brush contours with clean, abrupt
    tapers for edge work, sharp graphic forms separated by broad negative space for form
    simplification, and short straight strokes and broken vertical highlight lines only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with deep indigo and black with restrained neon cyan and magenta. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard neon edge accents against broad matte shadow masses. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth dark fields with thin reflective marks and sparse grain,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use off-axis balance with a strong diagonal and
    deliberate empty space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey quiet resolve under visual tension, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with precise dark contour, neon edge color, and controlled reflective marks; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    severe dark brush contours with clean, abrupt tapers; sharp graphic forms separated by broad
    negative space; deep indigo and black with restrained neon cyan and magenta; short straight
    strokes and broken vertical highlight lines; smooth dark fields with thin reflective marks and
    sparse grain; off-axis balance with a strong diagonal and deliberate empty space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with severe dark brush
    contours with clean, abrupt tapers, sharp graphic forms separated by broad negative space, and
    deep indigo and black with restrained neon cyan and magenta; use short straight strokes and
    broken vertical highlight lines only where movement is already present, and apply smooth dark
    fields with thin reflective marks and sparse grain as the drawing finish.
