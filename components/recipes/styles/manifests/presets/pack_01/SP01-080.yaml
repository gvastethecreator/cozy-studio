visualDna:
  aesthetic: 'Official ID photograph: strict frontal symmetry, white background, shadowless light, zero expression — the administrative portrait.'
  subject_treatment: Subject square to the lens, neutral mouth, both ears and full face visible, head centered and level.
  color_and_tone: Pure white or pale gray background, neutral accurate skin, no creative grade.
  lighting_and_shadow: Even frontal light from two sides, no shadow on the background, minimal facial shadow.
  texture_and_material: Plain clothing, visible real skin, no accessories hiding the face.
  camera_and_composition: Tightly centered head with fixed proportions, eyes at the same height every time.
  atmosphere_and_mood: Neutral, clinical, and faintly absurd when the subject is unusual.
  rendering_and_quality: Sharp, flat, compliant image without artistic effects.
  key_features: strict frontal symmetry; white background; shadowless light; neutral expression; fixed centered crop
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Passport Photo as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
