visualDna:
  aesthetic: 'Stepped Crystal Forms: volume built from broad stepped planes and a few counted facets under one dominant silhouette.'
  subject_treatment: Build the prompt's subject from broad steps and a few counted facets, placing the dominant silhouette before any material.
  color_and_tone: Three value bands across the planes, one main color and a limited accent.
  lighting_and_shadow: Soft directional light revealing the steps, transparency optional.
  texture_and_material: Smooth facets with consistent edge width and clean planes.
  camera_and_composition: Compact volume with the focal plane facing the viewer.
  atmosphere_and_mood: Sculptural precision and a measured ascent, calm and exact.
  rendering_and_quality: The structure stays recognizable when rendered opaque and monochrome.
  creative_brief: "Stepped Crystal Forms: volume built from broad stepped planes and a few counted facets under one dominant silhouette. Carry it through stepped planes, counted facets, dominant silhouette, three value bands. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
