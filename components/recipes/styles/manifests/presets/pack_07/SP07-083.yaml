visualDna:
  aesthetic: 'Arts and Crafts interior: quarter-sawn oak panelling and exposed joinery with pegged tenons, a built-in inglenook hearth, hammered copper and stylised plant-pattern textiles.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Fumed oak brown, sage green, madder red, ochre and hammered copper orange; warm, earthy and medium-dark.
  lighting_and_shadow: Leaded casement windows with small panes, firelight in the inglenook, mica or art-glass lamps, warm pools with soft falloff.
  texture_and_material: Ray-flecked quarter-sawn oak, through-tenons and wooden pegs, hand-hammered copper, block-printed wallpaper of vines and birds, handmade tiles around the hearth.
  camera_and_composition: Keep the requested view; low beamed ceilings, built-in settles and nooks framing the subject, joinery visible at eye level.
  atmosphere_and_mood: Honest, sheltering and handmade, a craftsman's pride in every joint.
  rendering_and_quality: Warm low-light photograph with oak ray flecks and hammer marks legible, no mass-produced gloss or Victorian clutter.
  creative_brief: "Arts and Crafts interior: quarter-sawn oak panelling and exposed joinery with pegged tenons, a built-in inglenook hearth, hammered copper and stylised plant-pattern textiles. Carry it through quarter-sawn oak with ray fleck, exposed pegged through-tenons, built-in inglenook settle, hand-hammered copper, stylised vine-pattern textiles. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: quarter-sawn oak with ray fleck; exposed pegged through-tenons; built-in inglenook settle; hand-hammered copper; stylised vine-pattern textiles
