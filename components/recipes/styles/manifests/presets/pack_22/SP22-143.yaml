visualDna:
  aesthetic: >-
    Delicate anime linework uses long curves, slight pressure variation, open paper and restrained
    washes to create an airy, precise drawing.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep contours light but clear,
    adding fine interior lines only where they describe existing form.
  color_and_tone: >-
    Keep the requested colors and their relationships. Use contained washes and clear reserves without
    forcing pastel hues or a monochrome palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Describe existing value changes with light
    washes while keeping the original shadow pattern readable.
  texture_and_material: >-
    Leave clean, quiet paper visible in open areas and keep marks precise. Preserve the depicted
    material; do not stamp a paper texture over every surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Fine contours do not require a new
    pose or a rearranged composition; add no card frame or lettering.
  atmosphere_and_mood: >-
    Keep the requested setting, genre and tone. Delicate line is a drawing treatment and does not
    introduce a new narrative or change the subject.
  rendering_and_quality: >-
    Use long, low-pressure contours with sparse fine detail and visible breathing room. Avoid heavy
    outlines, and keep small marks subordinate to the subject's identifying features.
avoidRules:
  - unrequested narrative motifs or changes to identity and attire
  - heavy uniform outlines that close the open linework
  - unrequested card frame or lettering
