visualDna:
  aesthetic: 'Fresnel x-ray shader: every surface drawn as additive glowing shells whose brightness follows the facing ratio, bright at grazing silhouettes and nearly clear where faces look at the camera.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: One cold hue, usually ice-blue or cyan, on pure black; overlapping shells add up toward white, with no density or bone logic.
  lighting_and_shadow: No lights and no shadows; brightness comes only from the view angle, so every modeled inner part shows through at its own edges.
  texture_and_material: Smooth untextured shells, crisp rim lines on every modeled layer, interior geometry visible as nested glowing contours.
  camera_and_composition: Keep the requested camera and perspective; the full 3D depth stays readable through the layered rims.
  atmosphere_and_mood: Cool, weightless and analytical, an object seen as nested outlines.
  rendering_and_quality: Clean additive shader render with perfectly sharp rims and no film grain, scatter haze or radiograph plate look.
  key_features: facing-ratio fresnel rims; additive stacking toward white; modeled interior shown as nested contours; perspective 3D depth; no lights
  creative_brief: "Fresnel x-ray shader: every surface drawn as additive glowing shells whose brightness follows the facing ratio, bright at grazing silhouettes and nearly clear where faces look at the camera. Carry it through facing-ratio fresnel rims, additive stacking toward white, modeled interior shown as nested contours, perspective 3D depth, no lights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
