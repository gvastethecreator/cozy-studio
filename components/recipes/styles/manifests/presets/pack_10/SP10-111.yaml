  aesthetic: 'Scale inversion: familiar objects or creatures at impossible scales relative to their surroundings.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: one element of the prompt becomes enormous or tiny relative to everything else."
  color_and_tone: Natural palette, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Natural light, supporting the dream logic without adding stock props.
  texture_and_material: Realistic textures, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at a glance.
  atmosphere_and_mood: Awe-filled, absurd, quiet and strange, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  creative_brief: "Scale inversion: familiar objects or creatures at impossible scales relative to their surroundings. Carry it through impossible scale, giant or tiny element. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: impossible scale; giant or tiny element
