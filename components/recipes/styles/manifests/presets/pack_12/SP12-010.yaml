visualDna:
  aesthetic: 'FromSoftware Dark Souls (2011) look: third-person dark fantasy of decayed kingdoms, muted desaturated palettes, heavy worn armor, towering demon bosses and lonely bonfires.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as heavy worn knights and hollowed wanderers in battered armor and rags. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Desaturated ash grey, ember orange, rust and deep shadow.
  lighting_and_shadow: Dim gloomy light with molten glows and bonfire warmth.
  texture_and_material: Worn armor, rough stone, ash and embers, with the in-engine surface finish of Dark Souls 2011.
  camera_and_composition: Third-person lock-on view facing a huge boss, framed the way Dark Souls 2011 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with bleak perilous endurance.
  rendering_and_quality: Authentic early-2010s dark fantasy action screen, matching real Dark Souls 2011 screenshots.
  key_features: Dark Souls decay; demon bosses; bonfires; worn armor
  creative_brief: 'FromSoftware Dark Souls (2011) look: third-person dark fantasy of decayed kingdoms, muted desaturated palettes, heavy worn armor, towering demon bosses and lonely bonfires. Carry it through Dark Souls decay, demon bosses, bonfires, worn armor. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
