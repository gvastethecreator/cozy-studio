visualDna:
  aesthetic: >-
    Darksiders (2010) stylized real-time action adventure: immense comic-book heroic anatomy, small
    heads, enormous wedge-shaped upper bodies, narrow waists and oversized hands and weapons. Broad
    angular armor planes amplify the living anatomy rather than enclosing it in a rounded suit.
    Graphic sculpted shape design leads over surface realism.
  subject_treatment: >-
    Preserve requested identity and action. Where humanoids fit, emphasize gigantic shoulders,
    forearms and fists, narrow waist and conspicuously small head, with visibly articulated living
    anatomy between a few oversized angular plates. Use sharp silhouette breaks, thick bevels and
    forceful weight shifts; avoid spherical pauldrons, inflated tubular limbs and sealed
    space-marine armor. Respect explicit proportion constraints.
  color_and_tone: >-
    Use weathered blue-steel, deep red cloth, broken gray stone, and restrained green growth, with a
    localized warm effect when the action calls for it. Avoid a uniform orange cast or monochrome
    gray-brown wash.
  lighting_and_shadow: >-
    Use period-appropriate real-time 3D ambient light, firm contact shadows and readable highlights
    on armor and stone. Keep the game-world exposure coherent; avoid drawn contour shadows, modern
    ray-traced gloss or oversized promotional glow.
  texture_and_material: >-
    Use broad hand-painted stone and metal planes, simplified bevels, substantial cloth folds, and
    localized wear. Keep surfaces designed and chunky; avoid smooth photoreal PBR microdetail.
  camera_and_composition: >-
    Lock to a trailing third-person camera a little above and behind the playable character, looking
    into the traversable space. Keep the hero large in the near field, typically left or
    center-left, with ground plane and route ahead visible; use a long sword or nearby architecture
    as leading diagonals. Do not switch to isometric, side-view or a detached cinematic establishing
    shot.
  atmosphere_and_mood: >-
    Suggest exploration through a devastated but navigable urban or dungeon environment, with
    monumental remnants and small signs of life such as weeds or distant lights. Keep a playable
    moment and requested tone, not a posed key-art confrontation.
  rendering_and_quality: >-
    Read as stylized 2010 console-generation 3D: clear comic proportions, bold plane changes, and
    hard figure-to-ruin separation. Avoid modern Soulslike realism and generic science-fiction
    armor.
avoidRules:
  - unrequested use of War, Ruin, named enemies, exact level layouts or promotional key art
  - changing the requested camera into isometric or side-scrolling gameplay
  - unrequested combat effects, copied health bars or fabricated interface labels
  - modern rendering upgrades presented as the 2010 original
