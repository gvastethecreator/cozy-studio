  color_and_tone: A few flat colors mixed through regular dither patterns.
  lighting_and_shadow: Soft light represented by dither density, kept consistent across the whole image.
  texture_and_material: Regular matrix patterns, crisp pixels and flat areas.
  camera_and_composition: Large gradient areas where the dither can show.
  atmosphere_and_mood: Keep the requested mood with cool mechanical beauty.
  rendering_and_quality: Precise regular dithering without random noise, kept consistent across the whole image.
  creative_brief: "Ordered Bayer dither field: gradients built from a regular crosshatch matrix of pixels, mechanical and even, turning skies, fog and glow into precise patterned fields. Carry it through ordered dither matrix, gradient fields, few colors, crisp pixels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
