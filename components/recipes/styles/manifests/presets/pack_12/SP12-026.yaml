visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Tactics Ogre: Reborn gameplay screenshots:
    isometric tactical-RPG capture with tile height, verdant ruins, small unit sprites, turn order,
    and readable strategy terrain. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Tactics Ogre: Reborn-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Tactics Ogre: Reborn-informed palette: moss green, old stone grey, parchment UI beige,
    cobalt water, burgundy cloth, and brass item accents. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through soft tactical daylight, simple sprite shadows, spell glows, and clean
    value separation over tiles. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from pixel/HD-sprite units, stone blocks, overgrown grass, banners, armor glints,
    and compact tactical UI panels. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with isometric grid with height advantage, movement tiles, unit facing, spell range, and
    clear objective structure. The frame should read as a plausible gameplay capture; include UI/HUD
    only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Tactics Ogre: Reborn-derived mood: political, tactical, classic, serious, and readable.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: turn order, unit panels, tile
    highlights, damage forecast, and command menus are allowed when clean and era-aware. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Tactics Ogre: Reborn gameplay screenshots; isometric tactical-RPG capture with tile height,
    verdant ruins, small unit sprites, turn order, and readable strategy terrain; moss green, old
    stone grey, parchment UI beige, cobalt water, burgundy cloth, and brass item accents; soft
    tactical daylight, simple sprite shadows, spell glows, and clean value separation over tiles;
    pixel/HD-sprite units, stone blocks, overgrown grass, banners, armor glints, and compact
    tactical UI panels; isometric grid with height advantage, movement tiles, unit facing, spell
    range, and clear objective structure; political, tactical, classic, serious, and readable; HUD
    guidance: turn order, unit panels, tile highlights, damage forecast, and command menus are
    allowed when clean and era-aware
  creative_brief: >-
    Use Tactics Ogre Verdant Ruins as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Tactics Ogre: Reborn: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
