visualDna:
  aesthetic: >-
    Compact, forceful anime cel drawing with swept diagonals, crisp silhouettes, and clipped
    high-key contrast.
  subject_treatment: >-
    Preserve the requested pose and action; use compressed shapes and directional contours only
    where motion is present.
  color_and_tone: >-
    Muted khaki, deep blue-gray, and clean pale highlights form a disciplined range; respect
    supplied colors.
  lighting_and_shadow: >-
    Hard reflected light and short shadow breaks keep compact forms sharp and readable.
  texture_and_material: >-
    Crisp filled shapes, restrained metallic glints, and a trace of painted grain keep the finish
    controlled.
  camera_and_composition: >-
    Hold the requested composition; use directional overlap and clear silhouette grouping without
    adding aircraft or gear.
  atmosphere_and_mood: >-
    Tense and precise, with the emotional register set by the prompt.
  rendering_and_quality: >-
    Keep details economical, contours stable, and contrast strong without overloading the image.
  key_features: >-
    Swept direction, compact form, crisp separation, and pale high-key accents give this cel work
    its taut energy.
  creative_brief: >-
    Restyle the requested content with compact silhouettes, fast diagonal drawing, and clipped
    contrast; add no military, flight, or spell scene.
