visualDna:
  aesthetic: 'Sailpunk: an alternate age of sail where wind power drives everything, from rigged cities and sail-carts to kite-drawn airships.'
  subject_treatment: Keep the prompt's subject and setting; rig it with sails, masts, pulleys and rope so wind is the visible power source.
  color_and_tone: Canvas cream, tarred wood brown and sea blue with faded red and ochre pennants.
  lighting_and_shadow: Bright sea light, sails glowing translucent where the sun passes through them.
  texture_and_material: Canvas, hemp rope, blocks and tackle, tarred planks and salt-stained brass.
  camera_and_composition: Upward views through rigging and wide horizons with sails catching wind.
  atmosphere_and_mood: Free and weathered, a world that moves only as fast as the wind allows.
  rendering_and_quality: Crisp nautical illustration with accurate rigging and luminous canvas.
  creative_brief: "Sailpunk: an alternate age of sail where wind power drives everything, from rigged cities and sail-carts to kite-drawn airships. Carry it through sails everywhere, rope rigging, wind power, glowing canvas. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sails everywhere; rope rigging; wind power; glowing canvas
