visualDna:
  aesthetic: Elastic neon anime drawing where contours stretch like rubber into short magenta-cyan color smears and snap back, built from loose flat shapes held by thick black anchor lines.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Acid pink, cyan and black pressing against each other in selective bands, with local colors retained underneath.
  lighting_and_shadow: Blacklight-like color response drawn only as an edge treatment, without smoke, fixtures or a night setting.
  texture_and_material: Translucent color drag anchored by opaque ink, so materials stay recognizable under the smears.
  camera_and_composition: Keep the requested camera, count and silhouette; color elasticity, not new choreography, carries the style.
  atmosphere_and_mood: Feverish emotional overload with tenderness underneath the noise.
  rendering_and_quality: Loose flat shapes, clean-edged smears and thick anchors; no anatomy horror.
  key_features: elastic stretched contours; magenta-cyan smears; thick black anchor lines; blacklight edge color; loose flat shapes
  creative_brief: "Elastic neon anime drawing where contours stretch like rubber into short magenta-cyan color smears and snap back, built from loose flat shapes held by thick black anchor lines. Carry it through elastic stretched contours, magenta-cyan smears, thick black anchor lines, blacklight edge color, loose flat shapes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
