visualDna:
  aesthetic: 'Stone lithograph: drawn with greasy crayon and tusche on grained limestone, printed so every mark keeps the fine tooth of the stone.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Warm black or sepia, optionally with one or two tint stones, on soft cream paper.
  lighting_and_shadow: Soft tonal modeling from crayon pressure, velvety blacks from tusche washes and gentle transitions.
  texture_and_material: Granular crayon marks broken by the stone grain, reticulated tusche puddles and scraped-back highlights.
  camera_and_composition: Keep the requested view, edges vignetting where the drawing fades into the paper.
  atmosphere_and_mood: Soft, atmospheric and intimate, like a drawing breathing on stone.
  rendering_and_quality: Grainy crayon tone with drawing looseness; no engraved lines and no halftone dots.
  key_features: greasy crayon on stone grain; reticulated tusche washes; scraped highlights; vignetted edges; one or two tint stones
  creative_brief: "Stone lithograph: drawn with greasy crayon and tusche on grained limestone, printed so every mark keeps the fine tooth of the stone. Carry it through greasy crayon on stone grain, reticulated tusche washes, scraped highlights, vignetted edges, one or two tint stones. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
