visualDna:
  aesthetic: >-
    Elegant crystalline rendering defined by precise facet seams, long orbital arcs, and
    balanced counter-direction; tension comes from geometry, not a required pair of subjects.
  subject_treatment: >-
    Keep the requested subject’s identity and proportions. Trace its existing planes with crisp
    facet lines and fine curved accents without multiplying or redesigning it.
  color_and_tone: >-
    Set deep blue and violet against glacial white, with a small warm gold signal; preserve
    clean value separation between facets.
  lighting_and_shadow: >-
    Use hard-edged cel shadows with cool rim glints and a few bright facet reflections; avoid
    requiring a spacecraft or light source.
  texture_and_material: >-
    Keep each material recognizable while adding crystalline line breaks, polished highlights,
    and smooth, controlled gradients.
  camera_and_composition: >-
    Honor the requested view. Balance visual weight with opposing diagonals and spare arcs,
    without forcing symmetry or multiple subjects.
  atmosphere_and_mood: >-
    Suggest strategic tension through poised counter-rhythms, cool light, and careful spacing
    rather than combat or rivalry staging.
  rendering_and_quality: >-
    Use fine accurate seams, clean facet color blocks, restrained glow, and crisp silhouette
    edges.
  key_features: >-
    Crystalline seam lines; orbital arcs; blue-violet and glacial-white contrast; balanced
    counter-motion.
  creative_brief: >-
    Preserve the specified subject and framing. Apply crystalline seams, spare orbital arcs, and
    cool facet shading; do not add a second subject, craft, or battle.
