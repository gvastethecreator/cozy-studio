visualDna:
  aesthetic: >-
    Cut angular contour blocks through hard-edged cel planes; use short tapered directional
    marks only where existing edges support them.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Sharpen leading
    or trailing edges without deforming forms or implying unrequested motion.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use compact cool blue and
    graphite fields, clean cream highlights, and at most one saturated warm or cyan accent.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow the given source light with crisp
    edge highlights and compressed dark shapes; add no flash, glow source, or impact effect.
  texture_and_material: >-
    Apply texture only to materials already present. Keep color fills smooth; restrict dry-brush
    and grain to a few material transitions already in the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Use strong diagonals only
    when supported by existing forms or requested action.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Treat edge compression as visual quality, not a
    collapse event; preserve the stated mood.
  rendering_and_quality: >-
    Keep primary silhouettes crisp and unbroken; avoid debris, blur, extra trails, and noisy
    edges.
  key_features: >-
    Angular ink blocks; hard cel planes; short edge-bound tapers; cool-dark and cream contrast.
  creative_brief: 'Use angular ink blocks; hard cel planes; short edge-bound tapers; cool-dark and cream contrast. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
