visualDna:
  aesthetic: 'Food advertising CGI: the dish exploded into a frozen moment, ingredients levitating in an arc, sauces splashing and droplets suspended around the hero item.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the frozen food-ad moment of levitating components, splash and steam around the requested food, and a non-food subject keeps its identity and only receives the glistening staging. It never forces a T-pose on a posed subject and never turns a requested object into an avatar.
  color_and_tone: Saturated fresh color of glossy reds, bright greens and golden crusts against a warm gradient or deep contrasting backdrop.
  lighting_and_shadow: Strong backlight making steam and droplets glow, a soft front fill and specular pings on every wet surface.
  texture_and_material: Micro droplets, condensation beads, crisp crumbs, glossy sauce ribbons and salt flakes caught in mid-air.
  camera_and_composition: Hero item centered low, components arcing around it on a diagonal, shallow depth with the nearest droplets sharp.
  atmosphere_and_mood: Crave-inducing and energetic, appetite frozen at its peak.
  rendering_and_quality: Hyperreal simulation of splashes and particles, glossy but never plastic, with no packaging text or brand marks.
  key_features: levitating ingredient arc; frozen splashes and droplets; backlit steam; specular pings; diagonal hero composition
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Food CGI as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - forced T-pose
  - object turned into an avatar
  - franchise likeness
  - readable text
  - logo
  - packaging
  - plastic-looking food
  - rotten
  - dry
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
assets:
  defaultImage: /assets/recipes/styles/defaults/SP03-054.webp
attributes:
