visualDna:
  aesthetic: >-
    Brush Pen Ink acts as a transferable illustration router: start from Expressive monochrome
    brush-ink gestural rendering, One-breath gesture arcs, dry-brush fractures, water-ink diffusion
    gradients and ink and printmaking system built from mark economy, matrix process, ink transfer,
    pressure artifacts, paper absorption, and reproducible graphic structure, then apply the visual
    behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Pressure-reactive strokes from razor taper to saturated
    belly; preserve the requested subject while rebuilding it through carved lines, etched density,
    stipple fields, calligraphic pressure, stamp incompleteness, graffiti stroke logic, or
    tattoo-flash simplification, keeping the requested identity, silhouette, pose, object function,
    or setting legible.
  color_and_tone: >-
    Build color with Carbon black, diluted gray washes, paper-white negative space; use color as ink
    behavior: monochrome value, limited plates, cyan chemistry, overprint, enamel-like flash colors,
    spray contrast, newspaper black, or sumi restraint, with deliberate value grouping, accent
    control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Value implied through wash layering and dry-brush breakup; translate light
    into hatch density, dot spacing, gouge direction, plate tone, paper reserve, ink pooling, or
    flat spray contrast rather than photographic shading, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Absorbent rice-paper bloom with feathered bleed fringes; surface detail should show paper
    fiber, plate burr, block grain, stipple dots, stamp gaps, marker bite, fountain-pen pooling,
    tattoo flash linework, or aerosol edge behavior, keeping material scale coherent and avoiding
    noisy filler texture.
  camera_and_composition: >-
    Structure the image through Intentional looseness with calligraphic balance preservation;
    compose through print registration, border discipline, mark-direction rhythm, negative-space
    carving, tag flow, ornamental line weight, or edition-like balance, with scale, spacing, edge
    rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Quiet, contemplative, fluid, meditative immediacy; derive mood from craft
    pressure, underground immediacy, archival print authority, occult darkness, decorative ceremony,
    street-poster urgency, or disciplined ink control, letting the style alter interpretation
    without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Minimal yet controlled, emphasizing breath-like stroke economy; finish as a credible
    ink or print artifact with exact mark logic, restrained artifacting, and no fake text, random
    distress overlay, or smooth vector replacement, clean denoised surfaces where appropriate, and
    enough process evidence to make the style recognizable.
  key_features: >-
    Expressive monochrome brush-ink gestural rendering; One-breath gesture arcs, dry-brush
    fractures, water-ink diffusion gradients; Carbon black, diluted gray washes, paper-white
    negative space; Absorbent rice-paper bloom with feathered bleed fringes; Intentional looseness
    with calligraphic balance preservation
  creative_brief: >-
    Apply Brush Pen Ink as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Expressive monochrome brush-ink gestural rendering, One-breath gesture arcs, dry-brush
    fractures, water-ink diffusion gradients, Absorbent rice-paper bloom with feathered bleed
    fringes without requiring the card image's original subject.
