visualDna:
  aesthetic: >-
    Rhythmic luminous illustration with branching contour patterns, concentric halo-like curves,
    and bioluminescent color accents over deep blue values.
  subject_treatment: >-
    Retain the subject’s identity and proportions. Echo its existing divisions with branching
    lines and repeated arcs, without changing it into coral or machinery.
  color_and_tone: >-
    Anchor the palette in abyssal blue and teal, with coral pink, pale aqua, and soft pearl
    highlights.
  lighting_and_shadow: >-
    Use layered cel shadows with smooth luminous edges and circular highlight rhythms; keep the
    glow attached to existing forms.
  texture_and_material: >-
    Preserve the original surface while adding fine branching lines, soft stipple, and
    controlled translucent accents.
  camera_and_composition: >-
    Honor the requested framing. Repeat arcs and branching marks to create rhythm without
    imposing a halo or centered layout.
  atmosphere_and_mood: >-
    Suggest resonance and reverence through repeated curves, deep color, and measured glow, not
    religious symbols or an underwater scene.
  rendering_and_quality: >-
    Combine precise fine lines with clean shadow bands and soft controlled bloom; maintain clear
    separation between marks.
  key_features: >-
    Branching contours; concentric rhythms; abyssal blues; coral and aqua glow.
  creative_brief: >-
    Preserve the prompt’s subject and setting. Apply branching line rhythms, deep blue values,
    and restrained coral-aqua glows; add no coral growth, ocean, or sacred symbols.
