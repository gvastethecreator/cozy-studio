visualDna:
  aesthetic: 'Dreamline European science-fiction comic: fine even contour with stipple dot shading and flat matte pastel color over vast airy alien landscapes.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Dusty pastel fields, peach, sand, lilac and pale turquoise, cool alien blues in the distance, low contrast.
  lighting_and_shadow: Even ambient desert light with small soft shadows; depth carried by paler color toward the horizon.
  texture_and_material: Stipple dots for all shading, clean matte color fields, organic-futurist architecture with smooth curves.
  camera_and_composition: Wide calm views with tiny figures against huge negative space, flowing non-Euclidean silhouettes.
  atmosphere_and_mood: Vast, meditative and enigmatic, a silent dream of another world.
  rendering_and_quality: Intricate but breathable detail, fine line and stipple only; no heavy black shadows.
  key_features: fine even contour; stipple dot shading; dusty pastel matte color; organic-futurist forms; tiny figures in vast space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dreamline Stipple Sci-Fi Comic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
