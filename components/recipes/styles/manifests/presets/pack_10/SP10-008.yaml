visualDna:
  aesthetic: 'Suprematism: floating pure geometric shapes on a white void, weightless and non-objective.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is reduced to a few floating rectangles, circles and crosses drifting on white."
  color_and_tone: Black, red, yellow, blue on white, used consistently across subject and background.
  lighting_and_shadow: Flat, no light, expressed through the style rather than photographic lighting.
  texture_and_material: Flat painted shapes, visible at card size as the signature of the style.
  camera_and_composition: Shapes floating diagonally in empty space, arranged so the subject still reads at card size.
  atmosphere_and_mood: Spiritual, weightless, pure and radical, driven by the construction, color and rhythm.
  rendering_and_quality: Clean painted finish, with clean, deliberate marks and no accidental noise.
  key_features: floating geometric shapes; white void; diagonal drift
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Suprematism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - complex
  - real
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
