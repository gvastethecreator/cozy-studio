visualDna:
  aesthetic: 'Layered Evidence Panels: image, supplied data and anchored notes arranged in readable layers that separate what is seen from what is claimed.'
  subject_treatment: Separate the prompt's image, the supplied data and anchored notes into readable layers, every number and word exact and nothing invented.
  color_and_tone: Colors by evidence role, redundant cues and clear text contrast.
  lighting_and_shadow: Image light preserved and flat graphic layers on top.
  texture_and_material: Clean edges, minimal tints and visible references only where they exist.
  camera_and_composition: Main image, data in its own block and notes anchored without crossings.
  atmosphere_and_mood: Argumentative clarity and sobriety, calm, honest and trustworthy.
  rendering_and_quality: Clean explainer where every figure links to supplied data.
  creative_brief: "Layered Evidence Panels: image, supplied data and anchored notes arranged in readable layers that separate what is seen from what is claimed. Carry it through layered evidence, anchored notes, data block, nothing invented. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: layered evidence; anchored notes; data block; nothing invented
