visualDna:
  aesthetic: 'Sankey: flowing bands of varying width splitting and merging.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: flowing bands split and merge to form the subject."
  color_and_tone: Soft gradient band colors, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Smooth vector bands, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Elegant, informative, flowing and calm, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Sankey: flowing bands of varying width splitting and merging. Carry it through flowing bands, splits and merges, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flowing bands; splits and merges; illustrative only
