    with edible surface behavior, plating structure, gloss, freshness, and commercial appetite cues,
    so the preset supplies visual behavior rather than a fixed card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms plate,
    glaze, slice, stack, melt, drizzle, arrange, chill, steam, or stylize through edible material
    logic through Thick waves, viscous-ribbon contours, pour-cascade, drip-tongue edges,
    swirl-vortex; identity stays readable through construction grammar, proportion, edge logic, and
    detail scale as this preset is applied.
  color_and_tone: >-
    Map color through appetite-driven hues, ingredient contrast, caramelization, freshness accents,
    creamy highlights, and controlled richness; keep hue roles intentional, value separation clear,
    and palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Satin gloss, ribbon-highlight catch, soft-box reflection, warm-overhead, tempered-surface
