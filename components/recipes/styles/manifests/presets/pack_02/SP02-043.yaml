visualDna:
  aesthetic: '2000s Flash web animation: vector characters built from reusable symbols, tweened motion, radial gradients and crisp anti-aliased edges.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Bright web colors, glossy radial gradients, flat backgrounds.
  lighting_and_shadow: Gradient-filled highlights and simple flat shadow shapes under each symbol.
  texture_and_material: Clean vector edges, visible symbol reuse, tween motion trails.
  camera_and_composition: Simple side-on staging, bold silhouettes, exaggerated tweened poses.
  atmosphere_and_mood: Scrappy and irreverent, full of early internet energy and jokes.
  rendering_and_quality: Vector web-animation look; no textures, no painterly softness.
  key_features: vector symbols; tweened motion trails; radial gradients; crisp anti-aliased edges; side-on staging
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Flash Animation (2000s) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - textured
  - soft painterly
  - soft
  - official card scene
