visualDna:
  aesthetic: 'Rusty iron: iron or steel surfaces oxidized into orange-brown rust with flaking scale and streaks.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: rust blooms from edges, bolts and seams, with flaking scale and run-off streaks. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Orange, umber and dark brown rust over grey steel.
  lighting_and_shadow: Low warm light that shows flaking relief, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Oxide scale, pitting, flakes and streaks, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Neglected, industrial, harsh and timeworn, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: orange rust blooms; flaking scale; run-off streaks; pitting; surface-level damage; structure intact
  creative_brief: "Rusty iron: iron or steel surfaces oxidized into orange-brown rust with flaking scale and streaks. Carry it through orange rust blooms, flaking scale, run-off streaks, pitting, surface-level damage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
