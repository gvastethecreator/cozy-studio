visualDna:
  aesthetic: >-
    Use opaque tempera with a visible hand-painted contour, variable brush pressure and short matte
    marks. Let small stroke asymmetries make the surface feel made by hand.
  subject_treatment: >-
    Preserve the requested identity, proportions, anatomy and action. Limit irregularity to the
    strokes; do not deform the subject or change its role.
  color_and_tone: >-
    Respect the requested palette. Use contained modeling and expressive value contrast without
    forcing new colors or exaggerating the subject's proportions.
  lighting_and_shadow: >-
    Preserve the requested lighting. Use opaque paint to state its existing shadow and highlight
    shapes; do not add a source or alter the time of day.
  texture_and_material: >-
    Show short, pressure-varied marks on a matte painted surface. Keep those marks controlled and
    separate from the material properties of the depicted subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and spatial arrangement. Let hand variation affect
    edge quality without shifting the composition.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Uneven brushwork adds human variation to the paint,
    not grotesquerie or an imposed emotional tone.
  rendering_and_quality: >-
    Keep a clear silhouette and stable underlying structure beneath the irregular strokes. Vary
    edges locally without introducing anatomy or geometry errors.
avoidRules:
  - unrequested body distortion or grotesque exaggeration
  - brush irregularity that damages the silhouette
  - uniform surface scuffing
  - unrequested horror or violence
