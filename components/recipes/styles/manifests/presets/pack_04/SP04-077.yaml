visualDna:
  aesthetic: 'Wildstyle graffiti piece: a full-color spray mural where the subject is built from interlocking arrows, bevels, 3D block drop shadows and nested outlines.'
  subject_treatment: Keep the prompt subject recognizable and construct it from wildstyle piece elements on a long wall; the shapes echo letterforms but never spell readable words.
  color_and_tone: High-saturation spray fills with complementary fades, a white highlight line and a dark outer outline.
  lighting_and_shadow: 'Painted light only: gradient fades inside fills, white shine strokes and a hard 3D drop block.'
  texture_and_material: Crisp cut-back edges, soft fades, spray speckle, and concrete texture visible at the margins.
  camera_and_composition: Keep the requested view, the piece filling a wide wall with background fill-ins of bubbles and stars.
  atmosphere_and_mood: Loud, celebratory and virtuosic, a wall claimed in color.
  rendering_and_quality: Finished mural piece with clean cut-back edges and no readable letters.
  key_features: interlocking arrows and bevels; 3D drop block; nested outlines; complementary fades; white shine strokes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Graffiti (Piece) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
