visualDna:
  aesthetic: 'Carved marble: the target as polished white or grey marble with flowing veins, soft translucency and crisp chisel-sharp edges.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Carrara white with grey or gold veins, faint warm translucency in thin parts.
  lighting_and_shadow: Soft directional light with gentle subsurface glow in thin areas.
  texture_and_material: Polished surfaces, rasp-textured areas, veins following the stone not the form.
  camera_and_composition: Keep the requested framing; the target alone becomes stone.
  atmosphere_and_mood: Serene and timeless, softness carved out of stone.
  rendering_and_quality: Veined marble with subtle scattering; not grey concrete.
  key_features: white marble with flowing veins; polished and rasped areas; soft translucency; crisp carved edges
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Marble Statue as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
