visualDna:
  aesthetic: >-
    Polka Dot becomes a transferable textile and ornamental pattern system: start from Grid of
    circles and Dots, then route prompt content through motifs, repeats, weave logic, decorative
    grids, stitched marks, and surface ornament without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Circles to wrap, embroider, tile, dye, weave,
    print, or camouflage forms while preserving the prompt subject underneath; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Two tone; treat palette as dye, thread, ceramic pigment, woven banding,
    motif hierarchy, or cultural ornament logic, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: use soft fabric light, glazed highlights, stitch shadows,
    woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Print as the tactile or mark-making basis; surface detail must follow yarn, fiber, glaze,
    dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props, spaces, or
    close material studies.
  camera_and_composition: >-
    Compose around Dots as reusable spatial grammar: favor repeat rhythm, motif scale, borders,
    allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Fun, retro as the emotional register; derive mood from craft, ritual, fashion, domestic
    texture, camouflage, ornament, or folk memory, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Pop, simple: finish with readable pattern scale, tactile detail, and no wallpaper
    pasted over the subject, preserving prompt X as the base content and the preset as the style
    router.
  key_features: Grid of circles; Circles; Two tone; Flat; Print; Dots; Fun, retro; Pop, simple; Dots
  creative_brief: >-
    Apply polka-dot rhythm to the input: repeated circular marks, playful scale variation, crisp
    figure-ground spacing, and bright graphic cadence should wrap or segment forms without requiring
    fabric or fashion staging.
avoidRules:
  - square
  - line
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
