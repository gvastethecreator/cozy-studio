visualDna:
  aesthetic: 'In-game screenshot look informed by Okami HD gameplay: ink-wash adventure capture with sumi-e outlines, painted nature, shrine traversal, brush-magic effects, and mythic animal motion without copying mascots. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Okami HD-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Okami HD-informed palette: rice-paper cream, ink black, vermilion red, jade green, sky
    blue, and golden sun accents. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through painted sunlight, blossom glow, brushstroke flashes, lava warmth, and
    flat illustrative shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from ink contours, watercolor fills, paper grain, shrine wood, stone lanterns,
    cloud curls, and calligraphic effects without readable text. Materials should feel like
    in-engine game assets captured during play, with enough texture identity to separate props,
    terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person adventure framing with path curves, shrine gates, enemy arena space,
    and brush-action readability. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Okami HD-derived mood: mythic, graceful, playful, painterly, and restorative; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: small brush/health icons can
    appear, but keep the screen feeling like painted gameplay rather than UI collage. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Okami HD gameplay screenshots; ink-wash adventure capture with sumi-e outlines, painted nature,
    shrine traversal, brush-magic effects, and mythic animal motion without copying mascots;
    rice-paper cream, ink black, vermilion red, jade green, sky blue, and golden sun accents;
    painted sunlight, blossom glow, brushstroke flashes, lava warmth, and flat illustrative shadows;
    ink contours, watercolor fills, paper grain, shrine wood, stone lanterns, cloud curls, and
    calligraphic effects without readable text; third-person adventure framing with path curves,
    shrine gates, enemy arena space, and brush-action readability; mythic, graceful, playful,
    painterly, and restorative; HUD guidance: small brush/health icons can appear, but keep the
    screen feeling like painted gameplay rather than UI collage
  creative_brief: "Okami Jade Volcano Shrine: in-game screenshot language informed by Okami HD, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
