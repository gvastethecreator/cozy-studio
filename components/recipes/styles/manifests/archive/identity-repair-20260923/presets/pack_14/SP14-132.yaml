visualDna:
  aesthetic: >-
    Sharp pale incisions describe forms inside broad matte masses. Lines vary in width and stop before
    becoming dense hatch; a few open cuts carry the main structure.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Preserve requested hues. Separate deep, middle and pale values, using the palest requested tone for
    sparse incised marks rather than adding metallic gold.
  lighting_and_shadow: >-
    Translate the requested lighting into compact shadow masses; contour cuts clarify form without
    behaving as independent light sources.
  texture_and_material: >-
    Make incision a drawn mark, not physical damage to the subject. Keep material identity through broad
    local value and selective surface cues.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Vary line intervals across existing
    forms; do not create a frieze, diagram or fixed central icon.
  atmosphere_and_mood: Precise and tense, with restraint and clear pauses. Preserve any explicitly requested mood.
  rendering_and_quality: >-
    Resolve the silhouette before placing crisp, economical cuts. Keep large areas quiet and avoid
    uniformly engraving every surface.
avoidRules:
  - uniform microhatching
  - physical damage added to the subject
  - unrequested icons or cultural motifs
