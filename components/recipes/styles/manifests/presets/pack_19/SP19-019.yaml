visualDna:
  aesthetic: 'Stepped dilution wash: ink applied in four or five separate dilutions with clean dried edges, so values sit in distinct steps like a tonal ladder.'
  subject_treatment: Divide the prompt's subject into a few flat value zones, each painted with one ink dilution and let dry, keeping its structure and identity clear.
  color_and_tone: Black ink in stepped dilutions from pale grey to dense black on white paper, no smooth gradients.
  lighting_and_shadow: Light and shadow read as clean stacked value shapes, each step darker than the one before.
  texture_and_material: Flat translucent wash layers with crisp dried edges and faint granulation inside each layer.
  camera_and_composition: Layered depth with pale distant planes and darker near planes stepping toward the viewer.
  atmosphere_and_mood: Calm, orderly and atmospheric, like mist separating hills into layers.
  rendering_and_quality: Precise stepped value shapes, clean dried edges and no blended gradients.
  creative_brief: "Stepped dilution wash: ink applied in four or five separate dilutions with clean dried edges, so values sit in distinct steps like a tonal ladder. Carry it through four or five value steps, crisp dried edges, layered depth, no blending. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: four or five value steps; crisp dried edges; layered depth; no blending
