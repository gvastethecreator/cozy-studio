  aesthetic: 'Zero-G Punk: a culture born in weightlessness, with floating hair, drifting objects, strap tethers, spherical rooms and people living upside down and sideways.'
  subject_treatment: Keep the prompt's subject and setting; make it weightless, with figures, liquids and objects floating freely in every direction.
  color_and_tone: Soft whites and pale greys with bright floating objects and blue Earth light.
  lighting_and_shadow: Soft even interior light with floating objects casting small scattered shadows.
  texture_and_material: Floating water spheres, loose hair, fabric, tethers and padded walls.
  camera_and_composition: Rotated compositions with no clear up or down and objects everywhere.
  atmosphere_and_mood: Playful, dreamy and strange, a life without a floor.
  rendering_and_quality: Clean airy illustration with floating objects and water spheres.
  creative_brief: "Zero-G Punk: a culture born in weightlessness, with floating hair, drifting objects, strap tethers, spherical rooms and people living upside down and sideways. Carry it through floating objects, drifting hair, water spheres, no up or down. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
