visualDna:
  aesthetic: '90s arcade fighter select screen: a grid of bold hand-painted pixel portraits of original fighters with diagonal energy slashes and a versus split.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a fighter-select layout of portrait tiles, a highlighted selection and diagonal versus panels, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Saturated gradient backgrounds per fighter, hot red, electric blue, acid green, gold selection glow.
  lighting_and_shadow: Dramatic portrait light from below or the side with hard pixel highlights on muscles and armor.
  texture_and_material: Painterly pixel portraits with dense clusters, crisp tile borders, speed-line slashes and glow edges.
  camera_and_composition: Tiled grid of tight portraits or a diagonal split with two large figures facing off; strong symmetry.
  atmosphere_and_mood: Competitive and loud, the charge before the first round.
  rendering_and_quality: Consistent portrait crop and pixel density; blank name plates, no numbers or timers.
  key_features: portrait tile grid; diagonal versus split; painterly pixel portraits; gradient backgrounds; selection glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Retro Fighting Game Select Screen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
