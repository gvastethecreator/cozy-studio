visualDna:
  aesthetic: >-
    Precision cel illustration with modular alignment, repeated intervals, and a clear hierarchy of
    graphic accents.
  subject_treatment: >-
    Keep the requested subject and action; use measured internal spacing and grouped contour marks
    rather than adding symbols.
  color_and_tone: >-
    Indigo, muted gold, and small cyan notes create crisp contrast, subject to the requested
    palette.
  lighting_and_shadow: >-
    Bright accents sit cleanly against broader cool shadows, with no implied interface or light
    source.
  texture_and_material: >-
    Smooth fills and exact line breaks create a precise finish; retain each depicted material.
  camera_and_composition: >-
    Preserve the requested composition; use alignment and spacing as drawing rhythm, never as a
    literal map.
  atmosphere_and_mood: >-
    Orderly and collaborative in feeling, while the requested subject sets the actual story.
  rendering_and_quality: >-
    Keep graphic marks sparse and balanced, with stable forms and clear focal priority.
  key_features: >-
    Modular spacing, crisp groupings, measured line breaks, and restrained luminous accents give the
    drawing systemic order.
  creative_brief: >-
    Use precise intervals and grouped visual emphasis to restyle the requested content; add no
    board, map, route, or interface.
