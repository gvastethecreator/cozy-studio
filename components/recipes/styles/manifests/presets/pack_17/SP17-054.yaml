visualDna:
  aesthetic: Minimal black-field omen cards where fragile white line, radiating rule marks, suspended relics, and blank space carry the dread.
  subject_treatment: 'Route the prompt subject into sparse white-thread iconography: one relic, hand, beast fragment, mask, crown, woundless organ, or architectural sliver held in black void without forcing a human figure.'
  color_and_tone: Pure black, thin white ink, faint charcoal construction lines, and occasional single ivory highlight; almost no fill color.
  lighting_and_shadow: 'Symbolic light only: pin-line halos, small rays, white rim cuts, and silent voids.'
  texture_and_material: Dry nib line, tiny engraved ticks, clean fiber breaks, and smooth black negative space; texture stays sparse and intentional.
  camera_and_composition: Poster-safe vertical card with asymmetric void, one small-to-medium focal icon, and compact support marks that never become readable typography.
  atmosphere_and_mood: Quiet, fatalistic, spare, austere, and threatening without spectacle.
  rendering_and_quality: Crisp minimalist occult engraving with very low detail budget and strong thumbnail readability.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies White Thread Omen Cards as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
  key_features: negative black space; thin white thread line; sparse halos; small omen relics; asymmetrical card balance; clean minimal print finish
