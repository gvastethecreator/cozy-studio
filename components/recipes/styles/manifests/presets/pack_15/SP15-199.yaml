visualDna:
  aesthetic: 'Archipelagopunk: a scattered nation of tiny islands linked by outrigger ferries, rope bridges, floating markets and shared canoe roads across turquoise water.'
  subject_treatment: Keep the prompt's subject and setting; spread it across small islands linked by boats, bridges and floating platforms.
  color_and_tone: Turquoise shallows, deep blue channels, white sand and palm greens with woven tan and red.
  lighting_and_shadow: Bright tropical sun with strong reflections and cloud shadows moving across the water.
  texture_and_material: Woven pandanus sails, lashed timber, rope bridges, coconut fibre and wet sand.
  camera_and_composition: High views over chains of islets and busy water traffic between them.
  atmosphere_and_mood: Open, sociable and seafaring, a country made of water and small land.
  rendering_and_quality: Bright crisp illustration with clear water reflections and woven detail.
  creative_brief: "Archipelagopunk: a scattered nation of tiny islands linked by outrigger ferries, rope bridges, floating markets and shared canoe roads across turquoise water. Carry it through island chains, outrigger ferries, rope bridges, floating markets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: island chains; outrigger ferries; rope bridges; floating markets
