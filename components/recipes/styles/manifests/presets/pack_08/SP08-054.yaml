    craft, interlocked-defense beauty, Tiny rings, butted-ring grid, riveted-flat drape, mail-sheet
    column, coif-like circumference, Metal rings, riveted steel links, butted-iron rings,
    oiled-mail, brass-trim rings, leather-backing strap, Ring-reflection glint, forge-fire warmth,
