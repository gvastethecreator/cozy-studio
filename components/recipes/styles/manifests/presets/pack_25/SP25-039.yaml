visualDna:
  aesthetic: 'State-Pair Icon Grammar: one icon shown in its normal, active and disabled states, with controlled structural changes between them.'
  subject_treatment: Show the prompt's subject icon in normal, active and disabled states, changing only the documented structure while the rest stays identical.
  color_and_tone: State colors always repeated by shape, fill or an explicit indicator.
  lighting_and_shadow: Flat presentation where selection comes from structure alone.
  texture_and_material: Identical edges across states apart from the one documented change.
  camera_and_composition: States in comparable rows with stable anchors and equal fill.
  atmosphere_and_mood: Continuity and predictability, each change recognized at once.
  rendering_and_quality: All states keep the same meaning, and disabled stays legible.
  creative_brief: "State-Pair Icon Grammar: one icon shown in its normal, active and disabled states, with controlled structural changes between them. Carry it through three states, structural change, stable anchors, comparable rows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three states; structural change; stable anchors; comparable rows
avoidRules:
  - three different icons for three states
  - illegible disabled state
  - active shown only by color
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - readable text
  - logo
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
