visualDna:
  aesthetic: 'Steve Ditko page look of the 1960s: stiff expressive hands, gaunt figures, floating geometric dimensions of doorways, bubbles and spirals, and tight nine-panel grids erupting into cosmic splash.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; send the subject into floating geometric dimensions of doorways, bubbles and swirling voids. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Sixties flat four-color printing in purple, green and orange.
  lighting_and_shadow: Flat printed color with glowing mystic outlines, lit the way Steve Ditko lights its scenes.
  texture_and_material: Printed comic page on off-white paper with slight ink spread and paper tooth.
  camera_and_composition: Tight panel grid that bursts into a dimensional splash.
  atmosphere_and_mood: Keep the requested mood with eerie cosmic strangeness.
  rendering_and_quality: Faithful sixties Ditko comic art, in the recognizable hand of Steve Ditko.
  creative_brief: "Steve Ditko page look of the 1960s: stiff expressive hands, gaunt figures, floating geometric dimensions of doorways, bubbles and spirals, and tight nine-panel grids erupting into cosmic splash. Carry it through Ditko mystic dimensions, stiff expressive hands. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Ditko mystic dimensions; stiff expressive hands
