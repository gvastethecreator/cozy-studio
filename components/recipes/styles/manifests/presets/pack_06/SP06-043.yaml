visualDna:
  aesthetic: 'Security engraving: burin-cut steel line work of extreme density, swelling lines and dot-and-lozenge patterns, surrounded by machine-turned guilloche rosettes.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: One intaglio ink, such as deep green, sepia, slate grey or maroon, on off-white cotton paper; tone purely from line density.
  lighting_and_shadow: Sculptural modeling through parallel lines that swell and thin to follow form, with fine dots between them in the half-tones.
  texture_and_material: Raised intaglio ink you could feel, hair-fine guilloche spirograph patterns, cotton-rag paper, micro-line backgrounds.
  camera_and_composition: Keep the requested subject, set as a vignette inside an oval or rosette of guilloche patterns.
  atmosphere_and_mood: Official, precise and dignified, value engraved in steel.
  rendering_and_quality: Extremely fine swelling lines and interlaced guilloche, no free sketching; no numbers, denominations or readable text.
  key_features: burin-cut swelling line modeling; guilloche rosettes; dot-and-lozenge half-tones; single intaglio ink color; cotton-rag paper
  creative_brief: "Security engraving: burin-cut steel line work of extreme density, swelling lines and dot-and-lozenge patterns, surrounded by machine-turned guilloche rosettes. Carry it through burin-cut swelling line modeling, guilloche rosettes, dot-and-lozenge half-tones, single intaglio ink color, cotton-rag paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
