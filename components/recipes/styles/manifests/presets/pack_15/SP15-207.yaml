visualDna:
  aesthetic: 'Junglepunk: canopy cities in dense rainforests, with vine elevators, treetop markets, waterfall power and bright parrots and frogs everywhere.'
  subject_treatment: Keep the prompt's subject and setting; weave it into a dense green canopy with vines, giant leaves, waterfalls and treetop platforms.
  color_and_tone: Deep saturated greens with parrot red, frog blue and orchid pink accents and golden light.
  lighting_and_shadow: Dappled light shafts breaking through the canopy into humid green shadow.
  texture_and_material: Giant leaves, hanging vines, moss, bark, waterfall spray and woven platforms.
  camera_and_composition: Layered depth of foliage with platforms at many heights and animals peeking in.
  atmosphere_and_mood: Lush, loud and teeming, a city where nature is always winning.
  rendering_and_quality: Richly layered illustration with dense foliage and humid light.
  creative_brief: "Junglepunk: canopy cities in dense rainforests, with vine elevators, treetop markets, waterfall power and bright parrots and frogs everywhere. Carry it through canopy cities, vine elevators, light shafts, bright jungle animals. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: canopy cities; vine elevators; light shafts; bright jungle animals
