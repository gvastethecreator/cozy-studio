visualDna:
  aesthetic: 'Fantasy MMO parchment interface: aged parchment and leather panels with carved wood or metal borders, wax seals and icon slots.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a parchment interface panel in which the subject appears as an inked illustration, icon or map, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Warm parchment beige, burnt umber ink, oxblood wax and tarnished brass trim, with small jewel-tone icon accents.
  lighting_and_shadow: Soft even light with slight vignette; embossed borders and seals cast short shadows.
  texture_and_material: Stained fibrous parchment, tooled leather, carved border ornaments, cracked wax seals, inked lines.
  camera_and_composition: Frontal panel layout with ornate frame, one illustrated zone and rows of empty slots or nodes.
  atmosphere_and_mood: Adventurous and scholarly, a guildhall record of the journey.
  rendering_and_quality: Clean interface hierarchy; any writing is illegible squiggle, never words or numbers.
  key_features: parchment panel; carved ornate border; wax seal; icon slots; inked illustration
  creative_brief: "Fantasy MMO parchment interface: aged parchment and leather panels with carved wood or metal borders, wax seals and icon slots. Carry it through parchment panel, carved ornate border, wax seal, icon slots, inked illustration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
