  lighting_and_shadow: Quiet flat light, lit the way Seiichi Hayashi lights its scenes.
  texture_and_material: Sparse minimal brush line, with the surface finish of Seiichi Hayashi.
  camera_and_composition: Minimal compositions with much empty space, framed the way Seiichi Hayashi composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with quiet poetic minimalism.
