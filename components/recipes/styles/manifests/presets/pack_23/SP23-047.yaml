visualDna:
  aesthetic: >-
    Construct forms from flat painted planes with subtle edge thickness and short local occlusion, so
    overlaps create depth without rounding the whole image into volumetric sculpture.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Separate existing
    parts into readable planes without adding objects, changing their relationships or omitting detail.
  color_and_tone: >-
    Retain the requested palette and value relationships. Use distinct flat areas to clarify existing
    forms without imposing a narrow or fixed color scheme.
  lighting_and_shadow: >-
    Follow the requested lighting and use brief occlusion at actual overlaps; do not invent a light
    source, cast shadow or paper-fold effect.
  texture_and_material: >-
    Keep surfaces mostly flat and clean, with only fine edge thickness where a cut-plane helps explain
    depth. Preserve the materials represented in the requested content.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing, scale and placement. Layered rendering does not
    require a front-facing pose, vignette or display base.
  atmosphere_and_mood: >-
    Retain the requested setting and mood; shallow layer overlaps change the rendering, not the scene
    or narrative.
  rendering_and_quality: >-
    Keep plane boundaries crisp and overlap shadows short. Maintain the original proportions and depth
    cues without rounded 3D modeling or excessive layer separation.
avoidRules:
  - rounded modeling that erases the flat-plane construction
  - unrequested display framing or layout
  - details that alter identity or function
