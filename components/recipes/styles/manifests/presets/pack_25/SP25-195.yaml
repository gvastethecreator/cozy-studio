visualDna:
  aesthetic: 'Layer-Edge Typography: letters built from shallow stacked layers with visible edges, a low tactile depth that keeps the word clear.'
  subject_treatment: Build the requested words from two or three shallow stacked layers with clear edges, keeping silhouette, counters and every character exact.
  color_and_tone: Two or three values separating the layers, readable in one ink too.
  lighting_and_shadow: Soft light from one direction with short shadows clear of the counters.
  texture_and_material: Smooth matte layers of related thickness, clean and precise.
  camera_and_composition: Frontal or near-frontal view, depth always subordinate to reading.
  atmosphere_and_mood: Editorial tactility and a layered construction, crafted and calm.
  rendering_and_quality: Crisp lettering where every layer belongs to the same letter.
  creative_brief: "Layer-Edge Typography: letters built from shallow stacked layers with visible edges, a low tactile depth that keeps the word clear. Carry it through stacked layers, visible edges, shallow depth, frontal view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked layers; visible edges; shallow depth; frontal view
