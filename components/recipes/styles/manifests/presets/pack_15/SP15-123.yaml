  aesthetic: 'Teslapunk: the dawn of electricity as wonder and danger, with coil towers, crackling arcs, glass insulators and lightning harnessed in laboratories.'
  subject_treatment: Keep the prompt's subject and setting; power it with visible early electricity (coils, arcs, glass insulators, copper wiring) instead of steam.
  color_and_tone: Deep night blue and copper with violet-white electric arcs and warm filament amber.
  lighting_and_shadow: Arc light flashing hard shadows in all directions, bulbs glowing amber and blue sparks at contacts.
  texture_and_material: Copper coils, porcelain insulators, glass bulbs, varnished wood panels and braided cloth wire.
  camera_and_composition: Towering coil structures framed from below, arcs cutting diagonally across the frame.
  atmosphere_and_mood: Electric and awe-struck, genius and danger crackling in the same laboratory air.
  rendering_and_quality: Detailed period illustration with luminous arc effects and precise electrical hardware.
  creative_brief: "Teslapunk: the dawn of electricity as wonder and danger, with coil towers, crackling arcs, glass insulators and lightning harnessed in laboratories. Carry it through tesla coils, violet arcs, glass insulators, copper wiring. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
