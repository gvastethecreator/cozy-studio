visualDna:
  aesthetic: >-
    Segment existing forms with dark lead-like seams and luminous color panes; suggest transmitted
    light without converting every object into literal glass.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use jewel-toned panes and clean
    boundaries while retaining prompt-critical color and local material cues.
  lighting_and_shadow: >-
    Let light pass through pane-like color regions and catch seam edges; preserve the actual
    lighting setup.
  texture_and_material: >-
    Draw strong seam contours, small glass-like imperfections and rosette rhythms only when the
    source geometry supports them.
  camera_and_composition: >-
    Use segmentation to clarify existing shape planes; keep crop, silhouette and spatial layout
    intact.
  atmosphere_and_mood: >-
    Illuminated color feels crafted and quiet; honor requested darkness or subtlety by lowering
    glow, not deleting seams.
  rendering_and_quality: >-
    Render the pane logic as a visual treatment while preserving material identity; add no window,
    rosette or stained-glass object. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Leaded segmentation; jewel translucency; transmitted color; seam highlights; controlled glass
    imperfection.
  creative_brief: "Apply this visual treatment to the requested content: Leaded segmentation; jewel translucency; transmitted color; seam highlights; controlled glass imperfection. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - pane fill hiding lead-like seam boundaries
  - bloom washing out segmentation
  - unprompted rosette geometry
