  - image_edit
  - style_preset_card
tags:
  - anime-character-and-lifestyle
  - anime-style-spectrum
visualDna:
  aesthetic: >-
    Retain visible graphite underdrawing, colored-pencil fill, paper tooth and occasional
    registration marks at the margins.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use layered pencil color with
    slight unevenness; preserve the prompt palette.
  lighting_and_shadow: >-
    Use hand-built value with visible pencil direction; follow specified light and keep form
    readable.
  texture_and_material: >-
    Keep sketch, ink and pencil layers distinguishable; registration marks stay peripheral and
    sparse.
  camera_and_composition: >-
    Preserve the source composition and perspective; show process texture without shifting objects
    or adding sheet borders.
  atmosphere_and_mood: >-
    Human irregularity comes from drawn marks; retain the requested polish and mood.
  rendering_and_quality: >-
    Apply the hand-drawn surface to any subject without adding extra figures, animation cels, peg
    bars or page labels. Keep important silhouettes and joins legible; no watermark, unrequested
    text or interface.
  key_features: >-
    Graphite underdrawing; smudge marks; colored-pencil fill; paper tooth; sparse margin
    registration.
  creative_brief: "Apply this visual treatment to the requested content: Graphite underdrawing; smudge marks; colored-pencil fill; paper tooth; sparse margin registration. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - smoothed contours erasing graphite and pencil marks
  - smudges obscuring subject-defining details
  - registration marks intruding into the subject
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-105.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
    unrequested default-image characters, costume details, props or setting, unrequested
    default-image framing, garbled pseudo-text, unrequested interface overlay, watermark,
    unrequested logo or signature artifact, smoothed contours erasing graphite and pencil marks,
    smudges obscuring subject-defining details, registration marks intruding into the subject
