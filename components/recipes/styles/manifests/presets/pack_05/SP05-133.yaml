visualDna:
  aesthetic: >-
    Build the graphic anime treatment from clean dark outlines with rounded internal strokes and
    ornate curls interrupted by blunt block-like shapes. Let decorative curves that stop against a
    short geometric beat set its rhythm; use clean primary colors with black and white contrast
    for color and smooth cel fills and a few sharp ink accents for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use clean dark outlines with rounded internal
    strokes for edge work, ornate curls interrupted by blunt block-like shapes for form
    simplification, and decorative curves that stop against a short geometric beat only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with clean primary colors with black and white contrast. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: clean shadow bands with bright, uncomplicated accents. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth cel fills and a few sharp ink accents, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use balanced formal spacing with an abrupt graphic break
    near the focal area to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey straight-faced wit and abrupt contrast, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with crisp shapes, neat cel color, and comedy carried by contrast; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    clean dark outlines with rounded internal strokes; ornate curls interrupted by blunt
    block-like shapes; clean primary colors with black and white contrast; decorative curves that
    stop against a short geometric beat; smooth cel fills and a few sharp ink accents; balanced
    formal spacing with an abrupt graphic break near the focal area.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with clean dark outlines
    with rounded internal strokes, ornate curls interrupted by blunt block-like shapes, and clean
    primary colors with black and white contrast; use decorative curves that stop against a short
    geometric beat only where movement is already present, and apply smooth cel fills and a few
    sharp ink accents as the drawing finish.
