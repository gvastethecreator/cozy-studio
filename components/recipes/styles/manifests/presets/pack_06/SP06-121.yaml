visualDna:
  aesthetic: 'Alla prima plein-air oil sketch: painted outdoors in a single wet-into-wet session on a small toned panel, each passage laid once and left.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Fresh mixed color with a warm orange or red-earth toned ground showing between strokes; clean values, strong light-to-shadow temperature shift.
  lighting_and_shadow: Real outdoor light at one time of day, painted in two big families of light and shadow before the sun moves.
  texture_and_material: Juicy loaded strokes dragged into wet paint, soft mixing at the stroke edges, toned ground left bare in places, small panel format.
  camera_and_composition: Keep the requested framing; big shapes blocked first, details suggested by a few final accents, edges unfinished at the borders.
  atmosphere_and_mood: Fresh, spontaneous and alive, painted fast against the light.
  rendering_and_quality: Confident single-pass strokes, wet edges softly merged, bare toned ground visible; not polished or reworked.
  creative_brief: "Alla prima plein-air oil sketch: painted outdoors in a single wet-into-wet session on a small toned panel, each passage laid once and left. Carry it through single-session wet-into-wet strokes, warm toned ground peeking through, two families of light and shadow, loose unfinished borders, small panel sketch. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: single-session wet-into-wet strokes; warm toned ground peeking through; two families of light and shadow; loose unfinished borders; small panel sketch
