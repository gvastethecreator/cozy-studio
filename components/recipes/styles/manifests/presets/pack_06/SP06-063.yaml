visualDna:
  aesthetic: 'Decoupage: cut printed motifs glued onto a painted wooden surface and sealed under many coats of varnish until paper and paint read as one skin.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Painted ground in one deep color such as bottle green, oxblood or black, motifs in faded engraving tones, the whole warmed by amber varnish.
  lighting_and_shadow: Soft light with a broad glossy varnish highlight sliding across the surface; no cast shadows because every paper edge is sanded flush.
  texture_and_material: Fine crackle glaze, faint paper wrinkles and air bubbles under varnish, sanded motif edges and brush marks in the painted ground.
  camera_and_composition: Keep the requested view; motifs are arranged to build the subject and wrap slightly over the curve of the painted object surface.
  atmosphere_and_mood: Antique and domestic, an heirloom surface patiently sealed by hand.
  rendering_and_quality: Unified varnished finish with legible motif cuts; nothing floats above the surface.
  key_features: cut printed motifs; painted wooden ground; amber varnish sheen; crackle glaze; sanded flush edges
  creative_brief: "Decoupage: cut printed motifs glued onto a painted wooden surface and sealed under many coats of varnish until paper and paint read as one skin. Carry it through cut printed motifs, painted wooden ground, amber varnish sheen, crackle glaze, sanded flush edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
