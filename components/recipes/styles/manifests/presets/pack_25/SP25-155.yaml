visualDna:
  aesthetic: 'Gallery Plinth Presentation: a minimal plinth and quiet space present the object like an exhibit, with a consistent believable scale.'
  subject_treatment: Present the prompt's product on a minimal plinth in a quiet gallery space, keeping its identity, size and exact brand text.
  color_and_tone: Neutral surroundings and source colors on the object.
  lighting_and_shadow: Soft exhibition light and a plausible contact shadow.
  texture_and_material: A plain matte plinth and the object's material left intact.
  camera_and_composition: Dominant object, proportional plinth and measured negative space.
  atmosphere_and_mood: Contemplative presentation and formal clarity, quiet and slightly reverent.
  rendering_and_quality: The plinth never hides functional zones or distorts the size.
  creative_brief: "Gallery Plinth Presentation: a minimal plinth and quiet space present the object like an exhibit, with a consistent believable scale. Carry it through minimal plinth, gallery space, exhibit light, kept scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: minimal plinth; gallery space; exhibit light; kept scale
