visualDna:
  aesthetic: 'Serial Label Street Graphics: typographic blocks, indexes and rules arranged like a series label, with a clear reading hierarchy.'
  subject_treatment: Arrange the prompt's exact words, series numbers and rules into a label-like typographic print, with no invented legal, barcode or authenticity text.
  color_and_tone: A restricted print palette with one accent marking the series.
  lighting_and_shadow: Flat typography with a sober mockup keeping the text exact.
  texture_and_material: Flat ink, clear printed rules and numerals that are easy to tell apart.
  camera_and_composition: Dominant title, a vertical index and legible secondary lines.
  atmosphere_and_mood: A contemporary documentary character with calm pauses between the blocks.
  rendering_and_quality: Clean typographic print with aligned blocks and checked copy.
  creative_brief: "Serial Label Street Graphics: typographic blocks, indexes and rules arranged like a series label, with a clear reading hierarchy. Carry it through label layout, series index, ruled blocks, exact copy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: label layout; series index; ruled blocks; exact copy
