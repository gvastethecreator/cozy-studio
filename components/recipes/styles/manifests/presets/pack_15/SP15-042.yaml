    DIY Generator Motion operates as a portable punk-spectrum router: combine DIY Generator Motion
    identity cues through generator rig blocks; ramp curves; cable trails; battery LEDs; blank
    sticker clusters; Skatepunk DIY-power poster language built from chunky generator rigs with DIY
    public-punk grammar with pasted graphics, generator motion, barricade voltage, scrapbike cargo,
    rave care, patch pressure, and mutual-aid pragmatism, so the preset supplies retrofit style
    behavior rather than a required venue, mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through
    paste-layer edges, cable-tied equipment, plywood planes, sticker stacks, patch geometry,
    generator vibration, cargo straps, and care-station clarity; motifs can become contour, surface,
    costume, equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through photocopy black, paper cream, magenta voltage, plywood brown, laser green,
    concrete gray, sticker reds, and electric blue accents; keep dominant, support, and accent
    values readable, avoid muddy black, and let palette code materials, signals, climate, ritual,
    salvage, or repair pressure.
  lighting_and_shadow: >-
    Use portable floodlight, screen glow, welding spark, sodium haze, laser slices, generator glare,
    and sticker-gloss highlights; lighting should reveal the punk system, preserve the user's
    subject, separate near and distant value planes, and avoid crushed blacks or noisy dark texture.
  texture_and_material: >-
    Render torn paper, tape, plywood, cable ties, vinyl stickers, patched fabric, bike metal,
    plastic crates, and concrete scuffs; keep material scale coherent, surface marks motivated, and
    tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through layered poster rhythm, improvised equipment paths, tight public pressure, cargo
    diagonals, and bold subject hierarchy without crowd dependency as reusable framing grammar for
    characters, creatures, objects, vehicles, environments, symbols, or full scenes without one
    required card layout.
  atmosphere_and_mood: >-
    Carry mood through scrappy defiance, communal protection, loud improvisation, nocturnal urgency,
    practical care, and hand-built resistance; the tone may become adult, romantic, violent, comic,
    sensual, eerie, civic, or strange when prompt X asks, while the punk family remains legible.
  rendering_and_quality: >-
    Finish with graphic DIY-punk illustration with readable paste layers, controlled grit, large
    value blocks, and no generic riot-photo realism; prioritize clean denoise, bold readable shapes,
    controlled grit, prompt preservation, no watermark, no readable text, and no generic concept-art
    polish.
  key_features: >-
    generator rig blocks; ramp curves; cable trails; battery LEDs; blank sticker clusters; Skatepunk
    DIY-power poster language built from chunky generator rigs
  creative_brief: >-
    Use DIY Generator Motion after prompt X as a transferable punk-spectrum layer: prompt X supplies
