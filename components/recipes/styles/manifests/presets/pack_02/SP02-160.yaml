visualDna:
  aesthetic: 'Retinal fundus photograph: the inside back of an eye seen through the pupil, a glowing orange-red disc with branching vessels and a bright optic disc.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Orange, red and amber field, pale yellow optic disc, dark red vessels, black circular surround.
  lighting_and_shadow: Flash through the pupil lighting the retina evenly with a bright center.
  texture_and_material: Branching vessel trees, fine choroidal texture, subtle reflex sheen.
  camera_and_composition: Circular image on black, optic disc off to one side, vessels arching across.
  atmosphere_and_mood: Intimate and cosmic, a planet hidden inside an eye.
  rendering_and_quality: Clinical fundus photograph look without any markings, arrows or diagnosis.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Retinal Fundus Image as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: orange-red retinal disc; branching vessels; pale optic disc; black circular surround; flash center
