visualDna:
  aesthetic: 'Muted cinematic digital anime: thin brown line art, simulated shallow depth of field with round bokeh, and a cold blue-gray grade with lifted blacks.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Desaturated steel blue, fog gray and muted navy with lifted milky blacks and one cold-white highlight on the focal edge.
  lighting_and_shadow: Soft overcast or distant window light, broad low-contrast shadows, and bokeh discs where small lights fall out of focus.
  texture_and_material: Fine digital film grain, soft focus falloff, and thin sepia-brown line that dissolves where forms go out of focus.
  camera_and_composition: Keep the requested view; set a shallow focal plane on the subject and let foreground and background melt into bokeh.
  atmosphere_and_mood: Quiet grief and detachment, a distance that the lens itself enforces.
  rendering_and_quality: Thin line, soft cel shading, lens blur and bokeh, lifted-black grade and faint grain; nothing saturated.
  key_features: shallow depth of field with round bokeh; thin brown line art; lifted-black blue-gray grade; fine film grain; single cold-white highlight
  creative_brief: "Muted cinematic digital anime: thin brown line art, simulated shallow depth of field with round bokeh, and a cold blue-gray grade with lifted blacks. Carry it through shallow depth of field with round bokeh, thin brown line art, lifted-black blue-gray grade, fine film grain, single cold-white highlight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
