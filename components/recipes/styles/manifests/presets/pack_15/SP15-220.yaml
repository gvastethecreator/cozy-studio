visualDna:
  aesthetic: 'Wheatpastepunk: walls built up from layers of wheatpasted paper posters, with peeling corners, torn edges, rain wrinkles and huge pasted portraits.'
  subject_treatment: Keep the prompt's subject and setting; render it as huge wheatpasted paper art over layered peeling posters on city walls.
  color_and_tone: Paper cream and newsprint grey with faded poster colors and wet paste shine.
  lighting_and_shadow: Flat overcast light or harsh streetlight catching wrinkles and peeling edges.
  texture_and_material: Wrinkled paper, dried paste, torn poster layers, brick and plywood hoardings.
  camera_and_composition: Walls filled edge to edge with giant pasted images and layered fragments.
  atmosphere_and_mood: Temporary and bold, art pasted up at night and gone by next week.
  rendering_and_quality: Tactile illustration with visible paper wrinkles and layered tears.
  creative_brief: "Wheatpastepunk: walls built up from layers of wheatpasted paper posters, with peeling corners, torn edges, rain wrinkles and huge pasted portraits. Carry it through layered posters, peeling corners, paste wrinkles, giant pasted portraits. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
