visualDna:
  aesthetic: >-
    Expressive digital anime driven by elastic reaction shapes, economical ink lines and
    rhythm between a held beat and a quick change.
  subject_treatment: >-
    Preserve the prompt's identity and action. Flex expression and outer contour briefly for
    readable reactions while keeping features recognizable.
  color_and_tone: >-
    Follow named colors; when unspecified, use clear color grouping and restrained accents
    rather than assigning a fixed scheme.
  lighting_and_shadow: >-
    Use simple shadow masses and compact highlights so facial reactions stay legible; keep
    glow and effects subordinate.
  texture_and_material: >-
    Use clean ink contours with sparse texture. Integrate any painted background softly, and
    render only the surfaces named by the prompt.
  camera_and_composition: >-
    Build setup, pause and payoff through spacing or a quick visual beat while preserving
    the requested camera, layout and number of subjects.
  atmosphere_and_mood: >-
    Held reactions can build humor when requested; keep the emotional direction grounded in
    the prompt.
  rendering_and_quality: >-
    Prioritize immediate pose readability, stable contours and a clear figure-background
    split.
  key_features: >-
    Elastic expression shifts; readable reaction silhouettes; setup-pause-payoff spacing;
    quick visual timing with clean ink.
  creative_brief: "Use elastic expression and quick reaction timing only where they suit the requested action. Keep the prompt's cast, scene, camera and tone intact. Use it as a reusable look on any subject."
