visualDna:
  aesthetic: 'Neo-western fashion: cowboy codes reworked for today — embroidered yokes, fringe, denim, bolo ties and pointed boots, worn with modern cuts.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a western shirt with embroidered yoke or fringed suede jacket, dark denim or tailored trousers, pointed leather boots and a wide-brim hat or bolo tie."
  color_and_tone: Rust, sand, turquoise, black and faded indigo, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Low golden desert light with long shadows, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Suede fringe, chain-stitch embroidery, denim, tooled leather and silver hardware.
  camera_and_composition: Wide, cinematic full figure in open landscape, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Rugged, romantic and independent, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Warm, film-like finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Neo-western fashion: cowboy codes reworked for today — embroidered yokes, fringe, denim, bolo ties and pointed boots, worn with modern cuts. Carry it through embroidered yoke and fringe, pointed boots, bolo tie, rust and turquoise, low golden light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: embroidered yoke and fringe; pointed boots; bolo tie; rust and turquoise; low golden light
