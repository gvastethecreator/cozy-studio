visualDna:
  aesthetic: 'Riveted sheet-metal construction: the subject built from bent and folded metal sheet, joined by rows of rivets with visible bend radii and overlapping seams.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Bare galvanized grey, oxidized aluminum or sheet painted in faded utility colors, with crystalline zinc spangle patterns.
  lighting_and_shadow: Hard sun or a single work lamp raking across the seams so each rivet head casts a tiny shadow.
  texture_and_material: Bend radii on folds, overlapping lap seams, domed rivet rows, shallow oil-can dents and zinc spangle crystals.
  camera_and_composition: Keep the requested view; the panel layout follows the forms like a tailor's seams.
  atmosphere_and_mood: Hand-built and sturdy, a thing hammered into shape in a hangar.
  rendering_and_quality: Thin-sheet construction with real fold thickness, never solid cast or machined parts.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Riveted Sheet-Metal Build as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: folded sheet with bend radii; rows of domed rivets; lap seams; oil-can dents; galvanized spangle
