visualDna:
  aesthetic: 'Film soup: color film soaked in household chemicals before shooting, so the damaged emulsion erupts in blooms, bubbles and saturated color stains over a readable photo.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Magenta, cyan, acid yellow and electric green blotches blooming out of otherwise normal color; shifts strongest in skies and flat areas.
  lighting_and_shadow: Normal photographic light underneath; stains glow as if lit from within.
  texture_and_material: Round bubble craters, dissolved emulsion patches, speckles and dendritic blooms, concentrated toward edges and sky, leaving the main subject readable.
  camera_and_composition: Keep the requested framing; the damage frames the subject rather than covering it.
  atmosphere_and_mood: Psychedelic and eerie, a calm picture slowly being eaten by color.
  rendering_and_quality: Organic chemical damage in the emulsion, not a digital glitch, overlay texture or double exposure.
  creative_brief: "Film soup: color film soaked in household chemicals before shooting, so the damaged emulsion erupts in blooms, bubbles and saturated color stains over a readable photo. Carry it through chemical color blooms, bubble craters, dissolved emulsion patches, readable subject, stained sky. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: chemical color blooms; bubble craters; dissolved emulsion patches; readable subject; stained sky
