visualDna:
  aesthetic: 'Use this drawing language: Spiky punk-cartoon drawing with triangular contours, acute angles, thick black outlines, scratched hatching, and sharp high-contrast color. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply razor-sharp angles, triangular shapes, jagged motion marks, and aggressive hatching to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use black-heavy tones, blood red, acid green, toxic yellow, bruised purple, and high-contrast accents as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use hard graphic shadows and sharp rim accents, consistent with the supplied scene as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render scratchy ink strokes, marker bleed, distressed photocopy grain, and DIY-zine texture as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Use angular diagonals and a sharp silhouette; let scratchy hatching carry the shadows.
  atmosphere_and_mood: Defiant and sharp; use visual aggression without prescribing a rebellious character or act.
  rendering_and_quality: Finish with hard black contour, angular hatching, limited saturated accents, and rough print texture.
  key_features: triangular silhouettes; acute angles; thick black outlines; scratchy hatching; high-contrast accents
  creative_brief: Render the supplied content with razor-sharp angles, triangular shapes, jagged motion marks, and aggressive hatching. Use black-heavy tones, blood red, acid green, toxic yellow, bruised purple, and high-contrast accents as style colors while honoring any explicit color instructions. Apply scratchy ink strokes, marker bleed, distressed photocopy grain, and DIY-zine texture as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
