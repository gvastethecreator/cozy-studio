visualDna:
  aesthetic: 'Found-object assemblage: the subject built in low relief from real salvaged objects glued and wired onto a wooden board or inside a shallow box.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: 'The objects supply the palette: rust orange, weathered wood grey, tarnished brass and chipped enamel, unified by age rather than paint.'
  lighting_and_shadow: Raking side light from one lamp so every object throws a real cast shadow and the relief reads clearly.
  texture_and_material: Rusted keys, clock gears, spoons, drawer pulls, driftwood, bottle caps and wire, each keeping its true material and scale.
  camera_and_composition: Keep the requested view; the subject silhouette is read from the arrangement, then each part is recognized as a found object.
  atmosphere_and_mood: Mysterious and collected, memories given a second life as a creature or place.
  rendering_and_quality: Physical depth, crisp object edges and believable glue joins; no painted or digital surface.
  key_features: salvaged objects in relief; raking side light; real cast shadows; rust and brass; board or shallow box
  creative_brief: "Found-object assemblage: the subject built in low relief from real salvaged objects glued and wired onto a wooden board or inside a shallow box. Carry it through salvaged objects in relief, raking side light, real cast shadows, rust and brass, board or shallow box. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
