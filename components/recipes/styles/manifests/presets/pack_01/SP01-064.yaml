visualDna:
  aesthetic: 'Live concert photography: stage lighting cutting through haze, shot from the pit at high ISO during a peak moment of performance.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Saturated gel colors — red, blue, magenta, amber — against black, skin taking the color of the beam.
  lighting_and_shadow: Backlight fans and spots through haze, visible beams, silhouetted rims, lens flare from fixtures.
  texture_and_material: Haze, sweat, grain from high ISO, motion blur on hair and hands, crowd hands in the foreground.
  camera_and_composition: Low pit angle or from behind the crowd, performer mid-gesture, beams radiating, foreground hands or instruments cropped.
  atmosphere_and_mood: Loud and euphoric, heat and noise felt through the color and the haze.
  rendering_and_quality: High-ISO live realism with clean blacks; no studio lighting and no invented band logos.
  key_features: gel beams through haze; backlit performer; pit angle; crowd hands foreground; high-ISO grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Concert Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
