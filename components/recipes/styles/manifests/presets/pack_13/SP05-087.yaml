  aesthetic: 'Fine unbroken outlines, broad pale color washes, and low surface-detail density give the image an airy hand-painted finish without changing layout.'
  subject_treatment: 'Retain the exact prompted design and gesture; keep internal marks selective and never simplify away a meaningful feature or material.'
  color_and_tone: 'Use open, lightly saturated color relationships with clear focal values; greens, creams, or blues appear only when the requested palette allows.'
  lighting_and_shadow: "Render broad diffuse light with soft shadow edges and clear contact points; follow the prompt's stated conditions."
  texture_and_material: 'Concentrate subtle grain and fine strokes on existing focal surfaces; keep secondary areas quiet without removing their forms.'
  camera_and_composition: "Preserve framing, viewpoint, scale, spacing, and count; maintain the input's negative space instead of enlarging it or moving the subject."
  atmosphere_and_mood: 'Keep the requested mood; stillness comes from sparse marks and gentle contrast, not an imposed setting or emotion.'
  rendering_and_quality: 'Use clean edge control, softened distance only where present, and enough local detail to keep all prompted elements distinct.'
  key_features: 'Fine contour; broad light washes; low detail density; diffuse shadow edges; selective focal texture.'
  creative_brief: "Let pale washes and spare surface marks provide breathing room within the user's composition. Preserve the requested subject, action, count, camera, and mood. Use it as a reusable look on any subject."
