visualDna:
  aesthetic: 'Cyanotype sun print from a hand-inked acetate negative: white drawn lines and soft photogram shadows on deep Prussian blue.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Prussian blue to pale sky blue with paper-white lines, and no other hue anywhere.
  lighting_and_shadow: 'Values are reversed: whatever blocked the sun prints white, with soft halos where objects lifted off the paper.'
  texture_and_material: Brushed-on chemistry edges, uneven coating streaks, watercolor-paper tooth and soft photogram outlines.
  camera_and_composition: Keep the requested view as a flat contact-print arrangement with brushed borders.
  atmosphere_and_mood: Quiet, botanical and archival, a drawing developed by sunlight.
  rendering_and_quality: White line drawing and photogram silhouettes on blue; not a photograph toned blue.
  key_features: white lines on Prussian blue; photogram silhouettes; brushed chemistry edges; reversed values; paper tooth
  creative_brief: "Cyanotype sun print from a hand-inked acetate negative: white drawn lines and soft photogram shadows on deep Prussian blue. Carry it through white lines on Prussian blue, photogram silhouettes, brushed chemistry edges, reversed values, paper tooth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
