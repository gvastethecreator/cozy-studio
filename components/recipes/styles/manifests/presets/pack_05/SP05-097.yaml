visualDna:
  aesthetic: >-
    Monumental cel painting with baroque symmetry, heavy value planes, and a restrained, ornamental
    silhouette language.
  subject_treatment: >-
    Preserve the requested subject; emphasize its major shapes with measured contour and balanced,
    weighty detail.
  color_and_tone: >-
    Bone ivory, charcoal, and muted brass establish a cold, limited range; follow explicit color
    direction when present.
  lighting_and_shadow: >-
    Cool, controlled light divides large planes and reserves narrow highlights for the focal forms.
  texture_and_material: >-
    Combine matte shadow masses, smooth enamel-like accents, and faint powdery grain without
    changing depicted materials.
  camera_and_composition: >-
    Keep the requested layout; use formal balance and broad negative space rather than adding
    architecture.
  atmosphere_and_mood: >-
    Severe and composed, with a sense of pressure that does not change the subject's story.
  rendering_and_quality: >-
    Hold detail within clean edges and deep values; let subtle grain soften the darkest areas.
  key_features: >-
    Baroque balance, ivory against charcoal, cold highlights, and monumental value grouping create a
    composed weight.
  creative_brief: >-
    Restyle the requested subject through symmetry, deep values, and restrained ornament, without
    adding a throne, monument, or fantasy setting.
