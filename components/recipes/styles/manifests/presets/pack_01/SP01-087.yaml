visualDna:
  aesthetic: 'E-commerce white sweep: a marketplace listing photo with the object on pure white, evenly lit, readable from edge to edge.'
  subject_treatment: Keep the prompt's object exactly — shape, proportions, color and supplied design; this preset owns the pure white background and straight listing view.
  color_and_tone: Pure white background, neutral grey contact shadow, accurate object color.
  lighting_and_shadow: Even high-key light box from all sides; only a small soft shadow under the object.
  texture_and_material: Accurate material, no styling props, no reflections of the studio.
  camera_and_composition: Straight-on or catalog three-quarter view, object filling about 80 percent of the frame, centered.
  atmosphere_and_mood: Functional and trustworthy, exactly what arrives in the box.
  rendering_and_quality: Clean online-retail image; no lifestyle scene, dramatic light or colored backdrop.
  key_features: pure white background; even light box; small soft contact shadow; object fills frame; straight listing view
  creative_brief: "E-commerce white sweep: a marketplace listing photo with the object on pure white, evenly lit, readable from edge to edge. Carry it through pure white background, even light box, small soft contact shadow, object fills frame, straight listing view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
