visualDna:
  aesthetic: 'Vintage lithographic travel poster: a destination simplified into sunlit flat color blocks with a clean horizon and idealized weather.'
  subject_treatment: Keep the prompt subject and action; this preset owns the idealized destination composition, filled to the edges without a title lockup or blank band, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Warm sunlit flats, turquoise sea, terracotta, lemon and sky blue, restrained and bright.
  lighting_and_shadow: Even midday light, simple flat shadow shapes, luminous sky gradient.
  texture_and_material: Lithographic grain, slight ink spread and lightly faded paper.
  camera_and_composition: High viewpoint over the destination, simplified depth planes, a framing tree or balcony in the foreground.
  atmosphere_and_mood: Inviting, relaxed and escapist, the holiday before it happens.
  rendering_and_quality: Clean simplified shapes filled edge to edge; no empty title band and no letters.
  key_features: sunlit flat color blocks; high viewpoint; foreground framing element; lithographic grain; no title band
  creative_brief: "Vintage lithographic travel poster: a destination simplified into sunlit flat color blocks with a clean horizon and idealized weather. Carry it through sunlit flat color blocks, high viewpoint, foreground framing element, lithographic grain, no title band. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
