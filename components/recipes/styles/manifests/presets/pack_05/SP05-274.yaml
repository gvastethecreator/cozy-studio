visualDna:
  aesthetic: Cold seinen pen drawing of brittle short hatches and tiny edge grains that cluster where contours turn, like frost forming only at the corners of things, as a drawing texture rather than snow.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Slate, cold blue-gray and pale silver, with one restrained warm pivot color when the prompt provides one.
  lighting_and_shadow: Cool compact highlights against readable shadow planes under a flat overcast feel.
  texture_and_material: Dry crystalline micrograin as drawing texture, hatches two to four millimeters long and irregularly spaced.
  camera_and_composition: Keep the requested framing; hatching gathers denser behind the subject, as if something were watching from there.
  atmosphere_and_mood: Guarded, guilty quiet, a breath held in the cold.
  rendering_and_quality: Brittle but controlled pen hatching, with clean white paper in the highlights.
  key_features: brittle short hatches at contour turns; slate and cold blue-gray; one warm pivot color; crystalline micrograin; uneven hatch density
  creative_brief: "Cold seinen pen drawing of brittle short hatches and tiny edge grains that cluster where contours turn, like frost forming only at the corners of things, as a drawing texture rather than snow. Carry it through brittle short hatches at contour turns, slate and cold blue-gray, one warm pivot color, crystalline micrograin, uneven hatch density. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
