visualDna:
  aesthetic: 'Sequins: overlapping sequins or paillettes covering the target and scattering light.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered edge to edge in overlapping sequins."
  color_and_tone: Gold, silver, ruby or iridescent sequins, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Point lights producing sparkle, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Overlapping sequins with individual reflections, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Glamorous, festive, dazzling and loud, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: overlapping sequins; scattered sparkle; point-light glitter
  creative_brief: "Sequins: overlapping sequins or paillettes covering the target and scattering light. Carry it through overlapping sequins, scattered sparkle, point-light glitter. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - replacing the target with the source product
  - matte fabric
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
