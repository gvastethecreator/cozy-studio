    Circuit Board operates as a portable source-router layer: combine CPU die shot,
    silicon-urban-system, wafer-art, integrated-circuit landscape, chip-fab photography with
    magnified source-study logic with scale shift, optical detail, structural pattern, and
    specimen-independent texture grammar, so the preset supplies visual behavior rather than a fixed
    card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms magnify,
    reveal, refract, fracture, sprout, crystallize, oxidize, bead, fray, or expose hidden structure
    through Traces, paths, Manhattan-routing, 45-degree diagonal, via-grid, interconnect-highway;
    identity stays readable through construction grammar, proportion, edge logic, and detail scale
    as this preset is applied.
  color_and_tone: >-
    Map color through source-derived color variation, iridescence, false-scale contrast, translucent
    edges, and small-surface hue shifts; keep hue roles intentional, value separation clear, and
    palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Flat metallic, die-shot macro, ring-light, wafer-inspection, solder-mask reflection plus
    macro flash, raking light, dark-field glow, backlit transmission, ring reflections, and shallow
    optical falloff as the light-response contract, with readable hierarchy, controlled contact
    detail, and no lighting choice that erases the user's requested content.
  texture_and_material: >-
    Render Silicon, solder, polysilicon gate, metal-interconnect stack, passivation-layer glaze,
    probe-mark indent, bond-pad gold plus pores, fibers, facets, droplets, spores, grain, grooves,
    cells, filaments, corrosion, or crystalline edges; surface scale, residue, gloss, grain, fiber,
    pores, edges, or signal artifacts must remain coherent across figures, objects, and
    environments.
  camera_and_composition: >-
    Compose with urban-system-like, macro-block placement, logic-cell grid, routing-congestion
    channel, floor-plan region plus scale abstraction, repeated micro-patterns, sectional rhythm,
    optical compression, and detail-first framing as reusable framing grammar, allowing cards,
    portraits, objects, scenes, and abstract prompts to inherit the style without one required
    layout.
  atmosphere_and_mood: >-
    Carry mood through scientific curiosity, alien familiarity, tactile intimacy, natural
    engineering, entropy, and fragile wonder; the emotional tone should feel specific to Circuit
    Board while still obeying the prompt's subject and context.
  rendering_and_quality: >-
    Finish with clean magnification, controlled focus, coherent micro-texture, and no noisy
    stock-surface overlay; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
