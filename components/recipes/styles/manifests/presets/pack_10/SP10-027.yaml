  - digital-glitch-and-noise
visualDna:
  aesthetic: >-
    Chromatic Aberration becomes a transferable digital signal artifact system: start from Lens
    error, Edge fringe, and Color shift, then route prompt content through compression errors, scan
    hardware, pixel logic, channel shifts, and broken media encoding without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Red/Cyan separation to corrupt, quantize, sort,
    smear, scan, posterize, or channel-split forms without losing silhouette intent; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Fringing; bind color to device behavior: phosphor masks, CMYK dots, RGB
    offsets, tape bleed, or indexed palettes, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Normal drive the light response: make light feel emitted, scanned, clipped, banded, or
    sampled rather than normally photographed, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Blurry edges as the tactile or mark-making basis; texture should come from pixels,
    scanlines, blocks, dither matrices, data drag, or print dots, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Color shift as reusable spatial grammar: use raster alignment, artifact seams,
    frame tears, grid pressure, and controlled signal breakdown, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Dizzy, intense as the emotional register; derive mood from damaged playback, obsolete
    interfaces, surveillance, latency, and media failure, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Disoriented, 3D glasses: finish with intentional artifacts, sharp enough structure,
    and no random muddy AI noise, preserving prompt X as the base content and the preset as the
    style router.
  key_features: >-
    Lens error; Red/Cyan separation; Fringing; Normal; Blurry edges; Color shift; Dizzy, intense;
    Disoriented, 3D glasses; Edge fringe
  creative_brief: >-
    Route any subject through Chromatic Aberration as a transferable signal-distortion visual
    system: preserve prompt intent while converting form, motion, edge fidelity, pixel structure,
    compression behavior, and digital failure rhythm through this preset. Apply chromatic-aberration
    optics to the input: red/cyan edge separation, lens-fringe vibration, slight focus mismatch, and
    prism-like contour drift should energize forms without turning the image into random blur.
avoidRules:
  - clean edges
  - clean photo realism
  - random AI smear
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
