visualDna:
  aesthetic: >-
    Elastic anime contour swings between broad rounded strokes and quick tapered marks over
    compact cel shadows.
  subject_treatment: >-
    Keep form and action; exaggerate only existing expression or movement, never add spells
    or flames.
  color_and_tone: >-
    Vermilion, cobalt, sunlit yellow, charcoal; distinct blocks and neutral mids.
  lighting_and_shadow: >-
    Separate warm and cool planes with simple light; no flame-shaped lighting unless
    present.
  texture_and_material: >-
    Smooth flat fills, selective dry brush, radial marks only for requested effects.
  camera_and_composition: >-
    Preserve crop; off-center energy follows only motion already in the prompt.
  atmosphere_and_mood: >-
    Comic chaos only when requested; preserve any other emotional tone.
  rendering_and_quality: >-
    Separated forms, local effects, no particle noise or smeared shadows.
  key_features: >-
    Elastic contour, warm-cool blocks, quick tapered marks, effects tied to requested action
  creative_brief: 'Apply a visual treatment centered on elastic contour, warm-cool blocks, quick tapered marks, effects tied to requested action. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
