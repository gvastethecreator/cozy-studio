visualDna:
  aesthetic: >-
    Repairpunk makes functional repair visible through joined patches, layered replacement material,
    exposed seams and clear before-and-after surface contrast.
  subject_treatment: >-
    Preserve the requested subject, structure, proportions and action. Add repair only where the form
    supports a real join or replacement surface; do not break an intact subject to create repair detail.
  color_and_tone: >-
    Keep the base palette and use a small contrasting patch color to clarify repaired areas. Separate
    original material, replacement and shadow without forcing a fixed warm palette.
  lighting_and_shadow: >-
    Respect the requested lighting. Use value contrast along existing seams and repaired joins; do not
    invent a work light or dramatic workshop glow.
  texture_and_material: >-
    Keep original and replacement materials distinct. Show stitched, riveted, bonded or fitted repairs
    with scale appropriate to the object; preserve the requested material rather than adding universal
    rust or grime.
  camera_and_composition: >-
    Preserve the requested viewpoint and framing. Make the repaired relationship readable through
    placement and overlap without inserting a workbench, tool set or repair scene.
  atmosphere_and_mood: >-
    Convey resourceful continuation through evidence that a repair works. Keep the requested tone; do not
    require a union, commons, mutual-aid gathering or civic setting.
  rendering_and_quality: >-
    Use clear seam edges, controlled wear and a small number of strong patch shapes. Avoid random cracks,
    ornamental damage and tiny hardware noise.
avoidRules:
  - Do not add a repair bench, tools, workshop, union banner or group of helpers unless requested.
  - Do not damage intact forms merely to create a repair motif.
  - Avoid uniform rust, random cracks and decorative patches without a functional join.
