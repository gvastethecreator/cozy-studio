  aesthetic: 'Sunrise Mobile Suit Gundam Wing look (1995): elegant bishonen pilots, sleek winged mobile suits, orbital colonies and symmetrical rival duels with nineties cel shine.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with nineties bishonen designs, sharp eyes, flowing hair and pilot suits or military uniforms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Deep space blue, royal violet, crimson and brilliant white with gold trim.
  lighting_and_shadow: Orbital sunlight, beam saber glows and nineties cel highlights.
  texture_and_material: Late analog cel with glossy airbrushed mech shading and soft film grain.
  camera_and_composition: Symmetrical rival compositions in orbit and cockpit close-ups.
  atmosphere_and_mood: Keep the requested mood with elegant orbital rivalry.
  rendering_and_quality: Polished mid-nineties Sunrise television frame with bishonen elegance and orbital scale.
  key_features: Gundam Wing bishonen; winged mechs; orbital rivals; symmetry
  creative_brief: "Sunrise Mobile Suit Gundam Wing look (1995): elegant bishonen pilots, sleek winged mobile suits, orbital colonies and symmetrical rival duels with nineties cel shine. Carry it through Gundam Wing bishonen, winged mechs, orbital rivals, symmetry. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
