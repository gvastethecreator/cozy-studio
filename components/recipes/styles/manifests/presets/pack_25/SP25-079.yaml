visualDna:
  aesthetic: 'Single-Task Progressive UI: a flow that reveals controls step by step while keeping earlier choices, progress and the way back visible.'
  subject_treatment: Show the prompt's flow as three steps, one primary task per step with a persistent summary and visible back path; keep requested labels exact.
  color_and_tone: One accent for the current action, completed steps lighter and labeled.
  lighting_and_shadow: Flat separation by hierarchy with every earlier step still in view.
  texture_and_material: Sober surfaces and consistent controls, the same selection and error style.
  camera_and_composition: One primary task per state, a persistent summary and a visible return path.
  atmosphere_and_mood: Calm, reversible progress that never adds false urgency or pressure.
  rendering_and_quality: Going back keeps decisions, and the summary matches the visible data.
  creative_brief: "Single-Task Progressive UI: a flow that reveals controls step by step while keeping earlier choices, progress and the way back visible. Carry it through three steps, persistent summary, back path, one task per step. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three steps; persistent summary; back path; one task per step
