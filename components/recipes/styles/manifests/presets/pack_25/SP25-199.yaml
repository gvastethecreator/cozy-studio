visualDna:
  aesthetic: 'Optical Size Specimen: a display version and a small-size version of the same lettering compared, with the adjustments made visible.'
  subject_treatment: Compare a display version and a small-size version of the requested words, adjusting apertures, contrast and detail and keeping every character exact.
  color_and_tone: One ink on opposing test grounds with nothing hiding problems.
  lighting_and_shadow: Flat specimen that measures only letters and reading.
  texture_and_material: Clean edges, detail reduced only where it helps the small size.
  camera_and_composition: The same text at native sizes and in separate enlargements.
  atmosphere_and_mood: Perceptual consistency across scales rather than identical outlines.
  rendering_and_quality: The small version stays legible after authorized simplifications.
  creative_brief: "Optical Size Specimen: a display version and a small-size version of the same lettering compared, with the adjustments made visible. Carry it through display and small versions, visible adjustments, native sizes, enlargements. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: display and small versions; visible adjustments; native sizes; enlargements
