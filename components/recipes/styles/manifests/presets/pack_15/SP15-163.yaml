visualDna:
  aesthetic: 'Rewildpunk: cities surrendered back to wild nature, with forests bursting through highways, animals in towers and people living lightly among them.'
  subject_treatment: Keep the prompt's subject and setting; let wild nature reclaim the built world around it, with animals sharing the space.
  color_and_tone: Deep greens and mossy browns over weathered concrete grey with flower colors.
  lighting_and_shadow: Dappled forest light falling through broken roofs and overpasses.
  texture_and_material: Moss, vines, cracked concrete, rusted steel and animal tracks.
  camera_and_composition: Wild landscapes framed by ruins of highways, malls and towers.
  atmosphere_and_mood: Lush and humbling, nature quietly taking back what was always hers.
  rendering_and_quality: Richly detailed illustration with dense vegetation and wildlife living among the ruins.
  creative_brief: "Rewildpunk: cities surrendered back to wild nature, with forests bursting through highways, animals in towers and people living lightly among them. Carry it through forests through highways, animals in towers, moss on concrete, dappled light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: forests through highways; animals in towers; moss on concrete; dappled light
