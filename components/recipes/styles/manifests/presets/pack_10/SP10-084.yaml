visualDna:
  aesthetic: 'Precisionism: clean, sharp-edged geometric rendering of structures with smooth planes and crisp shadows.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is rendered as clean geometric volumes with smooth planes and precise shadows."
  color_and_tone: Cool greys, soft blues and cream with sharp shadow shapes.
  lighting_and_shadow: Crisp directional sun with geometric shadows, expressed through the style rather than photographic lighting.
  texture_and_material: Smooth painted planes without texture, visible at a glance as the signature of the style.
  camera_and_composition: Frontal or low-angle structural view, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Calm, orderly, monumental and quiet, driven by the construction, color and rhythm.
  rendering_and_quality: Precise smooth finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Precisionism: clean, sharp-edged geometric rendering of structures with smooth planes and crisp shadows. Carry it through smooth geometric planes, crisp shadows, industrial order. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
