visualDna:
  aesthetic: 'Ruled line scaffold: ink drawing built from ruler-straight pen lines and construction guides, with only a few freehand strokes where life breaks through.'
  subject_treatment: Construct the prompt's subject from ruled straight segments and perspective guides, allowing freehand ink only on organic details so it stays recognizable.
  color_and_tone: Black ink with faint blue construction lines on bright white drafting paper.
  lighting_and_shadow: Shadow planes are filled with evenly ruled parallel lines rather than tone or wash.
  texture_and_material: Crisp ruling-pen lines with slightly bulbed ends, faint pencil guides and a few blots at line starts.
  camera_and_composition: Strong perspective with visible vanishing guides, the subject placed on the scaffold grid.
  atmosphere_and_mood: Rational, precise and slightly tense, order holding back chaos.
  rendering_and_quality: Exact ruled geometry with deliberate freehand contrast, no sketchy messiness in the ruled parts.
  creative_brief: "Ruled line scaffold: ink drawing built from ruler-straight pen lines and construction guides, with only a few freehand strokes where life breaks through. Carry it through ruled straight lines, visible construction guides, ruled shadow fills, few freehand accents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ruled straight lines; visible construction guides; ruled shadow fills; few freehand accents
