visualDna:
  aesthetic: >-
    Cymatics (Sound) becomes a transferable fluid and organic behavior system: start from Sand on
    vibrating plate, Mandala, and Symmetrical, then route prompt content through flow, branching,
    cellular membranes, diffusion, turbulence, and living surface logic without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Geometric nodes to bend, pool, branch, bloom,
    spike, foam, or dissolve forms while preserving the prompt intent; preserve anatomy, object
    identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from White sand, Black plate; let hues follow fluid thickness, chemical bloom,
    interference, biological growth, or vapor density, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Top down drive the light response: use reflection, translucency, subsurface scattering,
    glow, or backlit edges to reveal fluid structure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Grainy as the tactile or mark-making basis; surfaces need coherent viscosity, membranes,
    droplets, filaments, bubbles, grains, or particulate fields, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Symmetrical as reusable spatial grammar: favor flow direction, cellular
    repetition, eddies, radial forces, tendrils, and macro-to-wide scalability, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Scientific, orderly as the emotional register; derive mood from instability, growth,
    toxicity, delicacy, pressure, and organic motion, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Physics, pattern: finish with clean fluid physics, readable boundaries, and
    restrained micro-noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Sand on vibrating plate; Geometric nodes; White sand, Black plate; Top down; Grainy;
    Symmetrical; Scientific, orderly; Physics, pattern; Mandala
  creative_brief: >-
    Apply cymatic vibration to the input: radial frequency nodes, sand-like particle ridges,
    resonance rings, and frozen sound-wave geometry should make any subject feel organized by
    invisible audio pressure.
avoidRules:
  - random
  - stiff solids
  - muddy fluid mixing
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
