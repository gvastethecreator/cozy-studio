visualDna:
  aesthetic: >-
    Crisp pixel silhouettes separate from deep support values, with economical fill and small color
    accents clarifying selected parts. Keep the edges hard and contrast direct; do not add diffuse glow,
    a tile grid or a retro game screen.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and functional details.
    Use contrast and selective pixel fill to keep its existing silhouette recognizable; do not replace
    it with a rune, game symbol, character or map element.
  color_and_tone: >-
    Preserve requested colors and tonal relationships. If values and palette are unspecified, use a
    small number of bright clusters against darker supporting values, without requiring neon hues,
    black backgrounds or a cyberpunk palette.
  lighting_and_shadow: >-
    Follow the requested light and shadow. Separate existing planes with crisp value boundaries and
    selective bright pixels rather than bloom or a simulated light halo.
  texture_and_material: >-
    Favor open areas and sparse, purposeful fill. Keep marks relevant to the depicted material and use
    chromatic contrast to clarify existing details, not to impose a tile or grid pattern.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, aspect ratio and arrangement. Do not impose a
    top-down world map, grid, inventory, gameplay layout or interface.
  atmosphere_and_mood: >-
    Preserve the user's requested setting and mood. Strong value contrast is a rendering choice; it
    does not require darkness, fantasy, cyberpunk or any game-world subject.
  rendering_and_quality: >-
    Keep silhouettes crisp, internal detail sparse and bright accents well separated from supporting
    values. Avoid soft glow, blur and excessive fill that erase the distinction between solid and open
    areas.
avoidRules:
  - unrequested grid, runes, world map or game interface
  - unrequested cyberpunk, fantasy symbols or game setting
  - fixed neon hues or black background
  - diffuse glow, bloom or soft-focus edge treatment
