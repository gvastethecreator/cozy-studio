    assembly marks, tactile charm, and playful construction, so the preset supplies visual behavior
    rather than a fixed card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms simplify,
    assemble, soften, hinge, stitch, fold, carve, or snap together through Wood grain, flowing-grain
    contours, chisel-facet marks, rounded block-forms; identity stays readable through construction
    grammar, proportion, edge logic, and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through material-native color blocks, toy-safe saturation, handmade variance, and
    clean separation between parts; keep hue roles intentional, value separation clear, and palette
    behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Warm, window-sill daylight, oiled-grain sheen, gentle-shadow depth plus small-scale object
