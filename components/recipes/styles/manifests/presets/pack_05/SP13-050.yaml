  aesthetic: 'Takafumi Hori sakuga as in his effects-heavy action: explosive contact points, detailed close-up effects, crisp bright highlights and satisfying moments of impact.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw hands and objects in extreme close-up at the exact point of contact. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Deep background tones with sharp bright highlights at the contact point.
  lighting_and_shadow: Crisp highlights and sparkles at the moment of contact.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Extreme close-up insert shot framed tightly on the exact contact point.
  atmosphere_and_mood: Keep the requested mood with crisp satisfying contact.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Takafumi Hori sakuga as in his effects-heavy action: explosive contact points, detailed close-up effects, crisp bright highlights and satisfying moments of impact. Carry it through Takafumi Hori effects, contact close-ups, crisp highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
