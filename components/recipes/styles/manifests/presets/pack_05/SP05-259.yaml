  creative_brief: "Wit Studio Ranking of Kings look (2021): picture-book simple designs with thick soft crayon-like lines, pastel storybook castles and emotionally powerful fairy-tale drama. Carry it through Picture-book designs, crayon lines, pastel castles, tender courage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
