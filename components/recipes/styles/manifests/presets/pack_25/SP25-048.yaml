  aesthetic: 'Paper-Hinge Characters: characters or symbols articulated from flat pieces joined by visible simple hinges.'
  subject_treatment: Articulate the prompt's subject from flat pieces joined by simple visible hinges, keeping its identity, proportions and correct number of parts.
  color_and_tone: One color per piece with well-separated values and neutral joints.
  lighting_and_shadow: Soft frontal light with a minimal shadow where pieces overlap.
  texture_and_material: Matte sheets of uniform thickness with clean edges and sober pivots.
  camera_and_composition: Compact readable pose, with overlapping limbs separated clearly.
  atmosphere_and_mood: Expressive with very few gestures, charming rather than childish.
  rendering_and_quality: Every piece looks jointed and belongs clearly to the right figure.
  creative_brief: "Paper-Hinge Characters: characters or symbols articulated from flat pieces joined by visible simple hinges. Carry it through flat jointed pieces, visible hinges, compact pose, per-piece color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
