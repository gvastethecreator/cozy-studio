visualDna:
  aesthetic: 'Fractal 3D: the subject grown from self-similar mathematical recursion, every part repeating smaller versions of itself into infinity.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Iridescent or psychedelic gradients by recursion depth, glowing crevices.
  lighting_and_shadow: Ambient occlusion deep inside the recursion, glowing rims on outer edges.
  texture_and_material: Endless nested detail, bulbous or angular fractal surfaces.
  camera_and_composition: Keep the requested view; recursion visible at several scales.
  atmosphere_and_mood: Hypnotic and infinite, detail that never ends.
  rendering_and_quality: Clean ray-marched fractal with fine detail and no noise.
  key_features: self-similar recursion; nested detail at every scale; deep occlusion; iridescent gradients; ray-marched surfaces
  creative_brief: "Fractal 3D: the subject grown from self-similar mathematical recursion, every part repeating smaller versions of itself into infinity. Carry it through self-similar recursion, nested detail at every scale, deep occlusion, iridescent gradients, ray-marched surfaces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
