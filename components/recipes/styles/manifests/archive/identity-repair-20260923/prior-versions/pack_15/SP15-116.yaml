visualDna:
  aesthetic: >-
    Juxtapose coarse branching, fibrous marks with thin, taut signal lines and long intervals of open
    space.
  subject_treatment: >-
    Preserve the requested subject and setting; translate existing contours into rough organic marks and
    measured linear interruptions without adding straw props.
  color_and_tone: >-
    Contrast dusk-muted earth tones with restrained amber or orange accents; keep warm marks sparse and
    legible.
  lighting_and_shadow: Use a low warm edge against broad cool shadow shapes, preserving detail inside dark areas.
  texture_and_material: >-
    Set ragged fiber-like strokes against clean metal-like lines; keep texture localized and
    directionally consistent.
  camera_and_composition: >-
    Retain the requested crop; let a few long lines cross or frame the existing focal shape without
    imposing a landscape.
  atmosphere_and_mood: Create rural unease through sparse repetition, unresolved intervals, and organic-linear contrast.
  rendering_and_quality: Keep the rough strokes and fine signal lines distinct at small scale; avoid generalized grime.
avoidRules:
  - a mandatory field, forest, scarecrow, or warning bundle
  - random fibers spread evenly over every surface
  - signal lines that flatten the focal form
