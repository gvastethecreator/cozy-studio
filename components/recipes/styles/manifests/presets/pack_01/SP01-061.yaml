visualDna:
  aesthetic: 'Paparazzi night shot: a long lens and a blasting on-camera flash catching a startled subject leaving somewhere, pressed by other photographers.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Flash-washed skin, blown whites, dark warm background, rival flashes as white bursts.
  lighting_and_shadow: Hard direct flash from the lens axis, a black shadow outline behind, practical light in the background falling into darkness.
  texture_and_material: High-ISO noise, motion blur on the background and hands, flash glare on glossy fabric and jewelry.
  camera_and_composition: Off-balance framing through shoulders and raised hands, subject turning or shielding their face, slightly tilted horizon.
  atmosphere_and_mood: Urgent and intrusive, a private moment ripped open by a sudden white burst.
  rendering_and_quality: Tabloid snapshot rawness; only invented, fictional subjects, never a recognizable real person.
  key_features: blasting on-axis flash; startled shielding subject; rival flash bursts; tilted crowded framing; high-ISO noise
  creative_brief: "Paparazzi night shot: a long lens and a blasting on-camera flash catching a startled subject leaving somewhere, pressed by other photographers. Carry it through blasting on-axis flash, startled shielding subject, rival flash bursts, tilted crowded framing, high-ISO noise. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
