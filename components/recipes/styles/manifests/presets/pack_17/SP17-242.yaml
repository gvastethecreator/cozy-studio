  color_and_tone: Saturated purple, acid green and orange, true to the Erol Otus palette.
  lighting_and_shadow: Flat psychedelic color light, lit the way Erol Otus lights its scenes.
  texture_and_material: Wobbly ink with saturated flat color, with the surface finish of Erol Otus.
  camera_and_composition: Bizarre crowded composition, framed the way Erol Otus composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cosmic weird strangeness.
  rendering_and_quality: Psychedelic weird fantasy illustration, in the recognizable hand of Erol Otus.
