visualDna:
  aesthetic: >-
    Create carousel-like visual rhythm without spectacle: local arcs and facets, saturated color
    fields, and alternating hard-soft boundaries.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Curvature
    changes line rhythm only and cannot create masks, costumes, or new shapes.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, balance violet, rose,
    amber, and electric cyan in controlled contrasts; preserve prompt-selected colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow existing sources and soften only
    supplied highlights; add no glow source, bloom, or lighting event.
  texture_and_material: >-
    Apply texture only to materials already present. Use smooth cel layers with subtle boundary
    stipple; avoid confetti, decorative motifs, and noisy gradients.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Arc or diagonal emphasis may
    follow existing masses but must not create a fairground arrangement.
  atmosphere_and_mood: >-
    Preserve emotional intent; saturated color and curved rhythm impose no delirium or
    theatricality.
  rendering_and_quality: >-
    Keep shape boundaries legible under color shifts and use contrast rather than added detail
    to separate planes.
  key_features: >-
    Local arc rhythm; violet-rose fields; alternating edge softness; stable recognizable forms.
  creative_brief: "Use local arc rhythm; violet-rose fields; alternating edge softness; stable recognizable forms. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
