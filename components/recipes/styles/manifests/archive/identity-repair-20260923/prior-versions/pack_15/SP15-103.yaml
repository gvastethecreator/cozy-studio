visualDna:
  aesthetic: >-
    Organize hard-edged planes into a compact rectangular rhythm, with paired voltage-color bands and a
    few deliberate looping lines.
  subject_treatment: >-
    Preserve the requested subject and pose; apply modular divisions and color bands to its existing
    shapes instead of adding music equipment.
  color_and_tone: >-
    Set magenta against cobalt or cyan with charcoal and a small cream reserve; maintain clear value
    steps.
  lighting_and_shadow: Use short edge highlights and bounded color fields, keeping illumination localized.
  texture_and_material: Contrast matte planes with smooth saturated bands; avoid mechanical surface detail.
  camera_and_composition: Preserve framing; use stacked rectangles and controlled loops without requiring a stage layout.
  atmosphere_and_mood: Feel amplified and experimental through repeated blocks, sharp contrast, and visual pulse.
  rendering_and_quality: Keep divisions crisp, loops untangled, and bright bands secondary to the subject.
avoidRules:
  - all-over neon glow
  - lines that tangle or obscure the main silhouette
  - equipment silhouettes used as a substitute for the requested subject
