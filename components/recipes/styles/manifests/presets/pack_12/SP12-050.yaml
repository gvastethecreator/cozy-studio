visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Signalis gameplay screenshots: retro
    survival-horror capture with fixed/overhead rooms, low-poly industrial interiors, icy
    facilities, and analog interface dread. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Signalis-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Signalis-informed palette: black, off-white, hospital green, warning red, cold blue, and
    rust-brown industrial stains. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through hard flashlight pools, red alarm panels, CRT glow, surgical fluorescent
    strips, and deep fixed-camera darkness. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from PS1-like low-poly props, metal doors, tiled floors, paper notes without
    readable text, snow grime, and analog machinery. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with fixed-camera or top-down survival room framing with inventory pressure, locked
    doors, enemy placement, and puzzle-object clarity. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Signalis-derived mood: lonely, clinical, uncanny, cold, and oppressive. The preset can
    become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but it
    should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: retro inventory/status panels,
    health warning, and small interaction prompts can appear if they feel survival-horror coherent.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Signalis gameplay screenshots; retro survival-horror capture with fixed/overhead rooms, low-poly
    industrial interiors, icy facilities, and analog interface dread; black, off-white, hospital
    green, warning red, cold blue, and rust-brown industrial stains; hard flashlight pools, red
    alarm panels, CRT glow, surgical fluorescent strips, and deep fixed-camera darkness; PS1-like
    low-poly props, metal doors, tiled floors, paper notes without readable text, snow grime, and
    analog machinery; fixed-camera or top-down survival room framing with inventory pressure, locked
    doors, enemy placement, and puzzle-object clarity; lonely, clinical, uncanny, cold, and
    oppressive; HUD guidance: retro inventory/status panels, health warning, and small interaction
    prompts can appear if they feel survival-horror coherent
  creative_brief: >-
    Use Signalis Polar Signal Outbreak as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Signalis: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
