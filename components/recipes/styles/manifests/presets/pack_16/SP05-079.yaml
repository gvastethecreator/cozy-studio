  aesthetic: 'Takeshi Koike feature animation as in Redline: hand-drawn racing with extreme perspective, heavy black shadow shapes, thick outlines and explosive colors across wild alien worlds.'
  subject_treatment: Preserve the requested identity, count, pose and action; draw people with Koike stylization, long angular limbs, hard jawlines, pompadours and huge black shadow masses cutting across bodies.
  color_and_tone: Saturated primaries, acid yellow, hot red and cyan against massive black shadows.
  lighting_and_shadow: Hard graphic light where shadows are solid black shapes, flare bursts and speed glows.
  texture_and_material: Thick varying ink outlines, flat hand-painted color, speed lines and hand-drawn smoke.
  camera_and_composition: Fisheye foreshortening, cars stretching toward the lens, dramatic tilted wide shots.
  atmosphere_and_mood: Keep the requested mood with roaring hyperkinetic swagger.
  rendering_and_quality: Obsessive hand-drawn feature frame with thousands of drawings worth of detail.
  key_features: Takeshi Koike blacks; extreme perspective; thick outlines; speed stretch; saturated color
  creative_brief: "Takeshi Koike feature animation as in Redline: hand-drawn racing with extreme perspective, heavy black shadow shapes, thick outlines and explosive colors across wild alien worlds. Carry it through Takeshi Koike blacks, extreme perspective, thick outlines, speed stretch, saturated color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
