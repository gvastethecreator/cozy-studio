  aesthetic: 'Satellite night lights: the dark side of the Earth seen from orbit, with settlements as gold and white light clusters threaded by roads.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Black land and sea, amber and white city lights, faint blue airglow at the limb.
  lighting_and_shadow: Only artificial lights on the ground and a few faint moonlit clouds above them.
  texture_and_material: Glowing dots and webs of roads, dark gaps of mountains and forests.
  camera_and_composition: Orbital view, the subject expressed as a pattern of light.
  atmosphere_and_mood: Quiet and vast, human life drawn in scattered light.
  rendering_and_quality: Orbital night imagery with no borders, labels or map lines.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Satellite Night Lights as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
