visualDna:
  aesthetic: 'Hopepunk: defiant tenderness in hard times, with shared kitchens, mended flags, candle vigils and communities holding each other up in ruins.'
  subject_treatment: Keep the prompt's subject and setting; show people caring for each other and something small and warm surviving in a hard place.
  color_and_tone: Soft warm golds and roses against grey ruins and stormy blues.
  lighting_and_shadow: Small pools of candle, lantern and firelight held against cold, dark surroundings.
  texture_and_material: Mended fabrics, chipped mugs, patched tents and hand-painted banners without words.
  camera_and_composition: Groups huddled around small light sources in wide dark spaces.
  atmosphere_and_mood: Tender and stubborn, kindness as an act of rebellion when everything is falling apart.
  rendering_and_quality: Warm painterly illustration with soft light and careful human gestures.
  creative_brief: "Hopepunk: defiant tenderness in hard times, with shared kitchens, mended flags, candle vigils and communities holding each other up in ruins. Carry it through shared light, mended things, huddled communities, warm against cold. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared light; mended things; huddled communities; warm against cold
