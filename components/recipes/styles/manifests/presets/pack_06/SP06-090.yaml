visualDna:
  aesthetic: 'Voxel sprite model: the subject built as a small toy-like model of flat-colored cubes, like a pixel sprite pushed into three dimensions.'
  subject_treatment: Keep the prompt subject and pose; rebuild it as a standalone low-resolution voxel model on a plain ground plane unless a scene is requested.
  color_and_tone: Limited sprite palette, one flat color per cube, two or three steps per material ramp.
  lighting_and_shadow: Soft sky light with ambient occlusion in cube corners and one crisp stepped shadow on the ground.
  texture_and_material: Clearly visible cube edges at a coarse scale of roughly 30 to 60 cubes tall; no smoothing and no textures.
  camera_and_composition: Three-quarter orthographic view of the model centered on a plain ground tile with generous padding.
  atmosphere_and_mood: Toy-like and charming, a collectible figure made of blocks.
  rendering_and_quality: Crisp cube faces, clean occlusion and readable silhouette at thumbnail size.
  key_features: coarse voxel model; flat color per cube; corner occlusion; orthographic three-quarter view; plain ground tile
  creative_brief: "Voxel sprite model: the subject built as a small toy-like model of flat-colored cubes, like a pixel sprite pushed into three dimensions. Carry it through coarse voxel model, flat color per cube, corner occlusion, orthographic three-quarter view, plain ground tile. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
