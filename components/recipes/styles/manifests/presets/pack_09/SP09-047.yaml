visualDna:
  aesthetic: 'Synthetic fur: long glossy faux-fur pile, uniformly colored and shaggy.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in long glossy synthetic fur that sways with volume.'
  color_and_tone: Bright or dyed faux-fur colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light with glossy fiber sheen, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Long synthetic fibers with glossy sheen and clumps, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Playful, plush, bold and cuddly, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: long glossy faux fur; shaggy volume; dyed color
  creative_brief: "Synthetic fur: long glossy faux-fur pile, uniformly colored and shaggy. Carry it through long glossy faux fur, shaggy volume, dyed color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
