visualDna:
  aesthetic: 'Counterform Breathing: the inner spaces of the letters widen and narrow in a coordinated rhythm while weight and reading stay steady.'
  subject_treatment: Letter the requested words with counters that open and close in a coordinated rhythm, the skeleton, weight and every character left intact.
  color_and_tone: One ink to judge the counters, with any second color kept for notes.
  lighting_and_shadow: Flat lettering where every counter is a true open space.
  texture_and_material: Continuous contours and clean-edged counters on a plain ground.
  camera_and_composition: Inner width varying across the word while outer spacing stays even.
  atmosphere_and_mood: A sense of breathing and tension, alive but never wobbly.
  rendering_and_quality: Crisp lettering where counters change without closing any letter.
  creative_brief: "Counterform Breathing: the inner spaces of the letters widen and narrow in a coordinated rhythm while weight and reading stay steady. Carry it through breathing counters, steady weight, even outer spacing, open letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: breathing counters; steady weight; even outer spacing; open letters
