visualDna:
  aesthetic: >-
    Create a limited spatial contradiction among existing planes, alignments or light cues; keep the
    dream effect legible and do not add disconnected objects.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: retain a coherent base palette
    with selective shifts at the contradictory plane; preserve prompt colors.
  lighting_and_shadow: >-
    Keep the original light cues and introduce only a subtle mismatch where the prompt's own forms
    meet.
  texture_and_material: >-
    Use clean edges with localized soft transitions to make one relationship feel impossible; retain
    material and silhouette.
  camera_and_composition: >-
    Keep the source camera and content stable while gently disturbing perspective or adjacency; no
    infinite loops by default.
  atmosphere_and_mood: >-
    Dream logic comes from one precise mismatch, not a new dreamscape; preserve requested mood.
  rendering_and_quality: >-
    Apply the spatial treatment to any subject without adding architecture, floating objects,
    duplicate forms or a new setting. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Offset planes; contradictory alignment or light; restrained spatial loop; stable recognizable
    forms.
  creative_brief: >-
    Apply this visual treatment to the requested content: Offset planes; contradictory alignment or
    light; restrained spatial loop; stable recognizable forms. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - spatial contradiction making the subject unreadable
  - unrequested floating or duplicate forms
  - perspective discontinuity unrelated to existing geometry
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-110.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
    unrequested default-image characters, costume details, props or setting, unrequested
