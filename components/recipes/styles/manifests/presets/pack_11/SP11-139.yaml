visualDna:
  aesthetic: 'Survey plat: a legal land map of lots, boundaries, bearings and monuments drawn with ruler-straight lines.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: mapped as surveyed parcels: straight boundary lines, lot blocks, corner monuments, easements and a north arrow, with the subject shaping the land."
  color_and_tone: Black ink with faint colored lot washes, following the conventions of this drawing type.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Ink on linen with a slightly yellowed surface, with the drafting tools visible in the line quality.
  camera_and_composition: Plan view with a north arrow and blank title block.
  atmosphere_and_mood: Dry, official, precise and quietly eerie, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Survey plat: a legal land map of lots, boundaries, bearings and monuments drawn with ruler-straight lines. Carry it through lot lines, corner monuments, north arrow, easements. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: lot lines; corner monuments; north arrow; easements
