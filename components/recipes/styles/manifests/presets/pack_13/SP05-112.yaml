  aesthetic: 'Hiroyuki Imaishi Dead Leaves look (2004): punk graffiti energy, spray drips, crude wild shapes and hyperactive color.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with crude punk designs and wild poses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Hyperactive spray colors, true to the Dead Leaves Imaishi palette.
  lighting_and_shadow: Flat punk light, lit the way Dead Leaves Imaishi lights its scenes.
  texture_and_material: Spray drips and crude lines, with the surface finish of Dead Leaves Imaishi.
  camera_and_composition: Chaotic graffiti compositions, framed the way Dead Leaves Imaishi composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with wild punk chaos.
  rendering_and_quality: Crude punk graffiti animation frame, in the recognizable hand of Dead Leaves Imaishi.
  key_features: Dead Leaves punk; spray drips; wildstyle
  creative_brief: "Hiroyuki Imaishi Dead Leaves look (2004): punk graffiti energy, spray drips, crude wild shapes and hyperactive color. Carry it through Dead Leaves punk, spray drips, wildstyle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
