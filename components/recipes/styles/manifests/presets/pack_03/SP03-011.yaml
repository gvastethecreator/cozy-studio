visualDna:
  aesthetic: 'Glass and crystal material: flawless transparent solids that bend the background through refraction and split bright light into thin rainbow edges.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Clear or faintly tinted body, bright white edge highlights, small spectral fringes.
  lighting_and_shadow: Refraction flips and bends what lies behind; caustic light pools and colored fringes in the cast shadow.
  texture_and_material: Polished facets or smooth curves, internal reflections, tiny bubbles or inclusions.
  camera_and_composition: Keep the requested framing; a textured background behind the target to show refraction.
  atmosphere_and_mood: Pure and fragile, light caught and bent inside a clear form.
  rendering_and_quality: Physically based refraction with dispersion; not a flat transparent overlay.
  key_features: refraction bending the background; rainbow edge dispersion; caustic shadow pools; internal reflections; flawless clarity
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Glass & Crystal as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the surroundings
  - changing the camera
  - converting every object in the scene
  - readable text
  - logo
  - opaque
  - dull
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - wrong material
  - pasted stock texture
  - flat color fill
  - shaderless surface
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
