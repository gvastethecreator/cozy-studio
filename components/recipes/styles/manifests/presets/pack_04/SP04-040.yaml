visualDna:
  aesthetic: 'Editorial infographic illustration: the subject explained as an illustrated diagram of layers, cycles or flows, drawn in clean flat vector.'
  subject_treatment: Keep the prompt subject and action; this preset owns the diagram layout of layers, loops or flows around the subject, with no numbers or labels, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Consistent categorical palette of five muted hues on warm white, one accent for the key element.
  lighting_and_shadow: Flat informational rendering with no decorative shadows or glows.
  texture_and_material: Clean vector lines, thin connector arrows and small illustrated vignettes.
  camera_and_composition: Cross-sections, circular life-cycle loops or vertical strata, clear reading order.
  atmosphere_and_mood: Analytical, trustworthy and clear, a curious question calmly answered.
  rendering_and_quality: Precise vector illustration; no charts with numbers, no dashboards and no readable labels.
  key_features: illustrated cross-section or cycle; connector arrows; categorical muted palette; clean vector; no labels
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Infographic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
