visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Oddworld: New 'n' Tasty gameplay screenshots:
    cinematic side-view puzzle-platform capture with industrial quarries, alien worker silhouettes,
    foreground machinery, and escape-route timing. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Oddworld: New 'n' Tasty-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Oddworld: New 'n' Tasty-informed palette: rust orange, toxic green, black machinery, dusty
    tan, blue industrial light, and sickly yellow signage shapes. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through factory lamps, furnace glow, searchlights, toxic pools, and deep machine
    shadows. Lighting must clarify the playable route, threat, focal subject, or objective and avoid
    generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from metal catwalks, rock quarry walls, pipes, conveyor belts, smoke, alien skin
    shapes without exact character copy, and grimy machinery. Materials should feel like in-engine
    game assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with side-on cinematic platform framing with stealth timing, levers, patrols, vertical
    shafts, and escape path readability. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Oddworld: New 'n' Tasty-derived mood: oppressed, strange, industrial, comic-dark, and
    tense. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when
    prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: almost no HUD; small
    interaction or possession cues can appear but the scene should feel cinematic-playable. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Oddworld: New 'n' Tasty gameplay screenshots; cinematic side-view puzzle-platform capture with
    industrial quarries, alien worker silhouettes, foreground machinery, and escape-route timing;
    rust orange, toxic green, black machinery, dusty tan, blue industrial light, and sickly yellow
    signage shapes; factory lamps, furnace glow, searchlights, toxic pools, and deep machine
    shadows; metal catwalks, rock quarry walls, pipes, conveyor belts, smoke, alien skin shapes
    without exact character copy, and grimy machinery; side-on cinematic platform framing with
    stealth timing, levers, patrols, vertical shafts, and escape path readability; oppressed,
    strange, industrial, comic-dark, and tense; HUD guidance: almost no HUD; small interaction or
    possession cues can appear but the scene should feel cinematic-playable
  creative_brief: >-
    Use Oddworld Quarry Escape as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Oddworld: New 'n' Tasty: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
