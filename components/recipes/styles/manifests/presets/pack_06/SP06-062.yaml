visualDna:
  aesthetic: 'Seamless photomontage: several photographs composited into one believable image with an impossible scale or logic, the joins hidden by matched light and grain.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: 'One unified grade across all sources: shared white balance, matched black level and a single color cast so nothing betrays its origin.'
  lighting_and_shadow: Light direction and hardness matched across every element; contact shadows and reflections are rebuilt so impossible objects sit firmly on their ground.
  texture_and_material: Consistent photographic grain and sharpness across sources; real surfaces such as porcelain, stone, skin and water kept fully photographic.
  camera_and_composition: Keep the requested view; scale is the surprise, with one element enlarged or shrunk and anchored to a believable horizon line.
  atmosphere_and_mood: Calm surreal wonder, the impossible presented as a plain everyday fact.
  rendering_and_quality: Invisible seams, no cut halos, perspective and depth of field agreeing across every source.
  key_features: impossible scale; matched light direction; unified color grade; rebuilt contact shadows; invisible seams
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Photomontage as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - uniform beige torn-paper wash over every image
  - red tape strips added by default
  - material replacing clothing or skin
  - readable printed words
