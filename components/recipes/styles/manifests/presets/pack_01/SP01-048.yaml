visualDna:
  aesthetic: 'Field macro photography: a 100 mm macro lens at 1:1 in nature, with a paper-thin plane of focus and a soft diffused flash revealing a tiny world.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Vivid true color on the subject, background dissolved into soft color washes.
  lighting_and_shadow: Diffused flash or ring light close to the subject, balanced with ambient light for the background.
  texture_and_material: Compound eyes, hairs, scales, dew drops and pollen resolved at life size or larger.
  camera_and_composition: Very shallow depth of field on the eyes or one key detail, subject filling the frame, eye-level with the creature.
  atmosphere_and_mood: Intimate and strange, a small alien world seen at its own scale.
  rendering_and_quality: Crisp focal plane with creamy falloff; no wide-angle view and no blurry subject.
  key_features: 1:1 magnification; paper-thin focus on the eyes; diffused macro flash; dew and scale detail; creamy background
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Macro Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
