visualDna:
  aesthetic: 'Volleyball anime of vertical explosions: jumps held at their peak, arms cocked, the ball a white streak against gym ceilings.'
  subject_treatment: Keep the prompt's subject and action; push it upward into a peak moment of a jump, reach or leap, held for one breathless frame.
  color_and_tone: Gym-floor orange, jersey colors and bright ceiling white with deep sweat-lit shadows.
  lighting_and_shadow: Overhead gym lights from above, strong rim on shoulders and hair at the top of the jump.
  texture_and_material: Polished wood floor, mesh net and damp jersey fabric drawn with clean cel.
  camera_and_composition: Extreme low angles looking up at airborne figures, the net slicing the frame.
  atmosphere_and_mood: Explosive and collective, a whole team lifting one player higher than possible.
  rendering_and_quality: Dynamic sports anime with speed lines, sweat drops and sharp anatomy at the peak.
  key_features: jump peak; low angle; net line; gym light rim
  creative_brief: "Volleyball anime of vertical explosions: jumps held at their peak, arms cocked, the ball a white streak against gym ceilings. Carry it through jump peak, low angle, net line, gym light rim. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
