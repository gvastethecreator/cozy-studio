    jurisdiction, dualities, lineage marks, and sovereign symbolism; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    thorn-like contour accents and defensive elegance plus warding silhouette pressure and
    protective botanical structure; forms should inherit silhouette pressure, emblem logic, ritual
    posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through cold glass green, reflected black, and pale edge highlights, thorn-weighted
    accent roles over disciplined dark values plus warden-weighted accent roles over disciplined
    dark values together with mineral darks, royal metal, storm blue, cinder orange, tidal green,
    funeral rose, sun-gold, and cold ivory accents; values stay separated, accents feel intentional,
    and the dark palette supports the requested content rather than swallowing it.
