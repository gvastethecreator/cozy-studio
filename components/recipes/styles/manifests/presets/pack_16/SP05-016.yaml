visualDna:
  aesthetic: >-
    A pressure-heavy 90s cel style combines forceful contour wedges, concentrated violet edge light
    and sharply separated shadow groups. Its tournament energy is a visual rhythm, not a contest
    scene.
  subject_treatment: >-
    Keep the requested subject, pose and scale. Tighten existing contours toward the focal area and
    emphasize only motion or tension already present; add no opponent or uniform.
  color_and_tone: >-
    When color is open, use deep blue-violet shadows, cool lavender edge light and a restrained warm
    accent. Preserve the requested palette and keep value separation strong.
  lighting_and_shadow: >-
    Use hard-edged cel shadows with one concentrated rim or glow accent around the existing focal
    form. Respect the requested light and do not add an arena spotlight.
  texture_and_material: >-
    Keep painted cel surfaces clean, with sharp ink and subtle dry grain at selected edges. Match
    surface marks to the source material instead of applying a universal effect.
  camera_and_composition: >-
    Create pressure with directional lines and compact spacing inside the supplied layout. Preserve
    the camera and avoid a ring, crowd or face-off arrangement.
  atmosphere_and_mood: >-
    Suggest held intensity through a pause between dense and open shapes. Keep the requested action
    and emotional tone; do not invent a duel or power-up.
  rendering_and_quality: >-
    Separate a small number of decisive shadow planes and crisp effect edges. Avoid muddy glow,
    excessive streaks and generic action-filter blur.
  key_features: >-
    compressed directional rhythm; violet rim pressure; forceful cel wedges separated into clean
    shadow groups
  creative_brief: 'Use the pressure-driven contour and violet cel-light treatment on the requested content. Preserve its subject, action, wardrobe and composition; add no rival, tournament or combat event. Use it as a reusable look on any subject.'
