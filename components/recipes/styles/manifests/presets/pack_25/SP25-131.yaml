visualDna:
  aesthetic: 'Transparent Layer Registers: printed transparent layers line up over an inner box so the parts complete one image together.'
  subject_treatment: Align printed elements on a transparent sleeve and an inner box so the prompt's package reads as one combined image, the name kept exact on one opaque layer.
  color_and_tone: Values and colors that separate layers and overlaps, with text kept fully legible.
  lighting_and_shadow: Soft light with contained reflections on the transparent surfaces.
  texture_and_material: Thin clear layers with declared transparency and a checkable register.
  camera_and_composition: Layers shown together and apart, the main reading stable on one layer.
  atmosphere_and_mood: Discovery through overlap and precision, clever and satisfying.
  rendering_and_quality: Each layer holds defined content and the overlap never invents letters.
  creative_brief: "Transparent Layer Registers: printed transparent layers line up over an inner box so the parts complete one image together. Carry it through transparent sleeve, inner box, combined image, exact name layer. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: transparent sleeve; inner box; combined image; exact name layer
