visualDna:
  aesthetic: 'Peeling paint: layered paint coats curling, cracking and flaking off to reveal older colors beneath.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: paint layers curl and flake from the target, revealing older coats and bare material. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Layered pastel and faded colors over bare wood or metal.
  lighting_and_shadow: Soft raking light on curling flakes, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Curling paint flakes, cracked layers and exposed substrate, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Nostalgic, faded, neglected and layered, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: curling paint flakes; layered old colors; exposed substrate; surface-level damage; structure intact
  creative_brief: "Peeling paint: layered paint coats curling, cracking and flaking off to reveal older colors beneath. Carry it through curling paint flakes, layered old colors, exposed substrate, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
