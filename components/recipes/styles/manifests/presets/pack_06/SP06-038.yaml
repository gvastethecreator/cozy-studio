visualDna:
  aesthetic: 'Mezzotint: a copper plate roughened all over with a rocker so it prints solid velvet black, then scraped and burnished smooth to bring up the lights.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Deep velvety black dominating the image, forms rising through smooth soft greys to a few burnished whites.
  lighting_and_shadow: 'Dark-to-light working: a single candle or window light, forms emerging from total darkness with very soft transitions.'
  texture_and_material: Rich velvet black with a faint crosshatch rocker texture visible in the mid-greys, smooth burnished highlights, plate mark.
  camera_and_composition: Keep the requested framing; the subject emerges from a large surrounding dark.
  atmosphere_and_mood: Hushed, nocturnal and mysterious, light found in the dark.
  rendering_and_quality: Smooth soft tonal transitions, no lines at all, deep velvet blacks and burnished lights.
  key_features: velvet rocker-ground black; scraped and burnished lights; very soft tonal transitions; faint rocker texture in mid-greys; forms emerging from darkness
  creative_brief: "Mezzotint: a copper plate roughened all over with a rocker so it prints solid velvet black, then scraped and burnished smooth to bring up the lights. Carry it through velvet rocker-ground black, scraped and burnished lights, very soft tonal transitions, faint rocker texture in mid-greys, forms emerging from darkness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
