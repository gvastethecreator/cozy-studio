visualDna:
  aesthetic: >-
    Oil Stains turns material failure into the main visual language: start from Garage floor, Wet
    spots, and Stained, then turn damage history, contamination, corrosion, staining, abrasion, and
    material breakdown into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Puddles: preserve identity and pose while letting forms
    age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Black, Rainbow sheen as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Glossy spots define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Oil Stains without hiding the prompt
    subject.
  texture_and_material: >-
    Render Wet spots through layer loss, residue buildup, chipped edges, stains, cracks, and uneven
    surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface tension
    coherent across the whole image.
  camera_and_composition: >-
    Compose around Stained as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Industrial, dirty by using neglect, time, moisture, heat, friction, and
    environmental pressure; the material should color the scene's feeling while preserving the
    user's requested subject and setting.
  rendering_and_quality: >-
    Finish with Dirty, mechanical material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Garage floor; Puddles; Wet spots; Glossy spots; Stained
  creative_brief: >-
    Route any subject through Oil Stains as a transferable weathering-and-decay visual system while
    preserving the prompt's subject, action, and setting. Render the accidental rainbows of oil
    spreading across concrete in dark puddles where thin-film interference paints iridescent maps in
    magenta, cyan, and gold across the garage floor. The surface should feel wet and heavy in the
    dark pools while the rainbow sheen floats like a ghost of color atop the grime. Capture the
    strange loveliness of the unwanted, the mechanics of spectrum blooming in neglect. Use Oil
    Stains as portable surface/render behavior over any input: map its texture, light response, edge
    wear, color chemistry, and tactile rhythm onto the subject instead of requiring a literal
    material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
