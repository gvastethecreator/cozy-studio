visualDna:
  aesthetic: 'Saltflatpunk: nomad speed-racers of endless white salt flats, with land-yachts, mirror-flooded horizons, salt-block towns and blinding sun.'
  subject_treatment: Keep the prompt's subject and setting; place it on an infinite white salt flat, with mirror reflections and speed machines.
  color_and_tone: Blinding white salt, pale blue sky and mirror reflections with hot orange and chrome accents.
  lighting_and_shadow: Harsh overhead sun and hard short shadows, with glare off the white ground.
  texture_and_material: Cracked hexagonal salt crust, chrome, sailcloth, salt blocks and thin flood water.
  camera_and_composition: Minimal flat horizons with mirror reflections and tiny fast machines.
  atmosphere_and_mood: Blinding, empty and fast, freedom and heat with nowhere to hide.
  rendering_and_quality: Clean bright illustration with crisp reflections and heat shimmer.
  creative_brief: "Saltflatpunk: nomad speed-racers of endless white salt flats, with land-yachts, mirror-flooded horizons, salt-block towns and blinding sun. Carry it through mirror horizons, land-yachts, hexagon salt crust, blinding sun. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mirror horizons; land-yachts; hexagon salt crust; blinding sun
