  color_and_tone: Flat saturated colors with smooth gradient shading, kept consistent across the whole image.
  lighting_and_shadow: Single light with smooth interpolated gradients, kept consistent across the whole image.
  texture_and_material: Untextured surfaces and slightly jagged silhouettes, kept consistent across the whole image.
  camera_and_composition: Simple arrangement on a flat ground plane, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with naive geometric charm.
  rendering_and_quality: Clean early 3D with visible faceted silhouette edges.
  creative_brief: "Gouraud-shaded primitives: early 3D built from simple spheres, cones and cylinders with smooth vertex-interpolated shading and telltale soft polygon edges. Carry it through primitive shapes, smooth vertex shading, untextured, faceted edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
