visualDna:
  aesthetic: 'Regenpunk: a culture built on regeneration, where limbs regrow like salamanders, ruins heal like tissue and scars bloom into flowers.'
  subject_treatment: Keep the prompt's subject and setting; show something broken healing and regrowing in real time, without gore.
  color_and_tone: Soft pink, living green and pearl white over weathered and broken greys.
  lighting_and_shadow: Gentle glow from healing areas and soft morning light.
  texture_and_material: Budding growth, soft new tissue drawn like petals, cracked stone and moss.
  camera_and_composition: Close views of healing surfaces and wide views of ruins regrowing.
  atmosphere_and_mood: Hopeful and uncanny, damage that simply refuses to stay damage.
  rendering_and_quality: Soft organic illustration with delicate glowing growth detail.
  creative_brief: "Regenpunk: a culture built on regeneration, where limbs regrow like salamanders, ruins heal like tissue and scars bloom into flowers. Carry it through regrowth, healing ruins, blooming scars, salamander logic. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: regrowth; healing ruins; blooming scars; salamander logic
