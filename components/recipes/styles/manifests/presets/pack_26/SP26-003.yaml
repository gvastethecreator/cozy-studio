visualDna:
  aesthetic: 'Genndy Tartakovsky character design look: bold angular silhouettes, huge shapes contrasted with tiny details, flat color, minimal line and powerful action poses.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters as strong geometric silhouettes with exaggerated shape contrast, tiny heads on huge bodies or the reverse. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Flat bold color blocks with deep shadow shapes.
  lighting_and_shadow: Graphic flat lighting with hard shadow shapes, lit the way Genndy Tartakovsky lights its scenes.
  texture_and_material: Minimal clean lines and flat color, with the surface finish of Genndy Tartakovsky.
  camera_and_composition: Wide cinematic silhouettes with strong negative space, framed the way Genndy Tartakovsky composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with bold stoic action.
  rendering_and_quality: Graphic animation character design with bold silhouettes, in the recognizable hand of Genndy Tartakovsky.
  creative_brief: "Genndy Tartakovsky character design look: bold angular silhouettes, huge shapes contrasted with tiny details, flat color, minimal line and powerful action poses. Carry it through Tartakovsky silhouettes, shape contrast, flat color, minimal line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Tartakovsky silhouettes; shape contrast; flat color; minimal line
