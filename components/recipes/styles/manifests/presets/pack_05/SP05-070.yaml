visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around elastic contour
    displacement with short magenta-cyan color smears that stretch from existing edges
    and snap back cleanly. For color and surface, retain the prompt's local
    colors while allowing acid pink, cyan, and black to press against one another in
    selective bands. Emotional overload is optional; keep the prompt's requested tone
    and never force tragedy, horror, or transformation
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through elastic contour displacement with
    short magenta-cyan color smears that stretch from existing edges and snap back
    cleanly; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain the prompt's local
    colors while allowing acid pink, cyan, and black to press against one another in
    selective bands. Keep values legible across the prompted light and dark range; do
    not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use blacklight-like color
    response as a drawn edge treatment, without adding smoke, fixtures, or a new
    nighttime setting. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine translucent color drag with opaque ink
    anchors so forms remain readable and materials stay recognizable. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    camera, count, action, and silhouette; let color elasticity, not invented
    choreography, carry the style. Use the mark rhythm inside the supplied composition
    rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Emotional overload is optional; keep the
    prompt's requested tone and never force tragedy, horror, or transformation. Darkness
    and tension are optional tonal pressure, never a requirement to add danger or
    rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and elastic contour displacement with short
    magenta-cyan color smears that stretch from existing edges and snap back cleanly;
    keep focal edges crisp, texture controlled, and dark values legible. Avoid photoreal
    or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    elastic contour displacement with short magenta-cyan color smears that stretch from
    existing edges and snap back cleanly; retain the prompt's local colors while
    allowing acid pink, cyan, and black to press against one another in selective bands;
    use blacklight-like color response as a drawn edge treatment, without adding smoke,
    fixtures, or a new nighttime setting; combine translucent color drag with opaque ink
    anchors so forms remain readable and materials stay recognizable; and preserve
    camera, count, action, and silhouette; let color elasticity, not invented
    choreography, carry the style. The five cues should read as one mark-and-value
    system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use elastic contour displacement with short
    magenta-cyan color smears that stretch from existing edges and snap back cleanly,
    retain the prompt's local colors while allowing acid pink, cyan, and black to press
    against one another in selective bands, use blacklight-like color response as a
    drawn edge treatment, without adding smoke, fixtures, or a new nighttime setting,
    and combine translucent color drag with opaque ink anchors so forms remain readable
    and materials stay recognizable; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
