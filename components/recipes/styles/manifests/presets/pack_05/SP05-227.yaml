  aesthetic: 'Madhouse Texhnolyze look (2003) with Yoshitoshi ABe concepts: bleak underground city, rusted prosthetics, muted sepia palettes, long silences and fatalistic violence.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with gaunt realistic designs, rusted mechanical limbs and worn clothing. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted sepia, rust brown, grey and faint green.
  lighting_and_shadow: Dim underground light, flickering lamps and faint shafts from far above.
  texture_and_material: Gritty cel with rust, grime and peeling paint textures.
  camera_and_composition: Long silent shots and descending vertical compositions through shafts.
  atmosphere_and_mood: Keep the requested mood with bleak fatalistic descent.
  rendering_and_quality: Bleak Madhouse television frame with rust, silence and fatalism.
  key_features: Texhnolyze rust; underground city; prosthetics; silence
  creative_brief: "Madhouse Texhnolyze look (2003) with Yoshitoshi ABe concepts: bleak underground city, rusted prosthetics, muted sepia palettes, long silences and fatalistic violence. Carry it through Texhnolyze rust, underground city, prosthetics, silence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
