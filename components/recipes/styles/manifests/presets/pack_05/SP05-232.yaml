visualDna:
  aesthetic: 'Hazy frontier anime: stacked translucent sand-colored haze cels, soft cel figures dissolving with distance, crisp line only on the focal detail, and 16 mm film grain.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Sand, smoke gray, faded olive and dusty blue with one small amber signal light; contrast falls off in each haze layer.
  lighting_and_shadow: Low diffuse sun filtered through dust, broad soft shadows, pale edge light, and haze glowing faintly where the sun sits.
  texture_and_material: Floating particulate specks, soft film grain, rubbed edges and faded cel paint.
  camera_and_composition: Keep the requested view; stack three or four haze layers between foreground and horizon to build distance.
  atmosphere_and_mood: Lamenting, weary and quiet, a long war seen through settling dust.
  rendering_and_quality: Layered atmospheric haze, soft focus beyond the focal plane, crisp focal line and fine grain; never crisp photoreal.
  key_features: stacked translucent haze cels; dissolving distance; crisp line only at focus; sand and dusty blue palette; small amber signal; 16 mm grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dustfront Drone Lament as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
