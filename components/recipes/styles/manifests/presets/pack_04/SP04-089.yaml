visualDna:
  aesthetic: >-
    organism designs Design Iteration acts as a transferable illustration router: start from
    Speculative organism designs-design sheet with layered anatomical logic and believable
    biological imagination, Anatomy callouts, adaptation variants, transparent layer studies,
    locomotion-read checks and production concept-art system built from iteration discipline,
    silhouette testing, material exploration, design readability, and pitch-ready visual decisions,
    then apply the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Construction underdrawings, skeletal overlays, muscular
    contour notes; preserve the requested subject while routing it through design exploration, asset
    logic, value blocking, scale cues, iteration rows, paintover marks, or production-readability
    constraints, keeping the requested identity, silhouette, pose, object function, or setting
    legible.
  color_and_tone: >-
    Build color with Neutral sketch tones with limited functional overlay coding; use color as
    concept decision-making: mood scripts, material swatches, faction accents, environment
    atmosphere, asset tier contrast, or readable pass separation, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Form-reading study light with selective translucency cues; shape light for
    ideation clarity through value block-in, keyframe contrast, material test highlights, callout
    illumination, or pitch-frame atmosphere, so value structure supports the illustration process
    and does not overwrite the requested content.
  texture_and_material: >-
    Render Mixed biological surfaces (scale, fur, membrane, carapace) as comparative tests; surface
    detail should reveal brush passes, photobash integration, low-poly facets, callout texture,
    massing blocks, costume fabrics, foliage clusters, or weapon material tiers when named, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Multi-pose and layered ghost-view layout for structural analysis;
    compose through production hierarchy, variants, orthographic logic, isometric staging,
    silhouette grids, iteration boards, or cinematic keyframe balance without locking one finished
    illustration, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Scientific, exploratory, speculative naturalism, mood carried by organism designs
    Design Iteration craft, material pressure, and visual restraint; derive mood from exploration,
    worldbuilding pressure, tactical design, creature unease, kitbash utility, cinematic intent, or
    production-room clarity, letting the style alter interpretation without demanding a specific
    story, location, or actor.
  rendering_and_quality: >-
    Finish with Iterative concept-study fidelity prioritizing function over polish; finish with
    concept-art usefulness, readable decisions, controlled roughness, and no generic fantasy
    wallpaper or overpolished final render when iteration is intended, clean denoised surfaces where
    appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    Speculative organism designs-design sheet with layered anatomical logic and believable
    biological imagination; Anatomy callouts, adaptation variants, transparent layer studies,
    locomotion-read checks; Neutral sketch tones with limited functional overlay coding; Mixed
    biological surfaces (scale, fur, membrane, carapace) as comparative tests; Multi-pose and
    layered ghost-view layout for structural analysis
  creative_brief: >-
    Apply organism designs Design Iteration as an illustration preset over prompt X: preserve the
    user's requested subject, then route mark-making, palette, surface, composition, mood, and final
    craft through Speculative organism designs-design sheet with layered anatomical logic and
    believable biological imagination, Anatomy callouts, adaptation variants, transparent layer
    studies, locomotion-read checks, Mixed biological surfaces (scale, fur, membrane, carapace) as
    comparative tests without requiring the card image's original subject.
