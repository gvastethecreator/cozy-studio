visualDna:
  aesthetic: >-
    Soft painting describes form through small plane changes, luminous midtones, discreet edges and
    selectively rendered identity or surface detail.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Concentrate detail where it clarifies
    the subject or its material without adding people, contact or a new focal subject.
  color_and_tone: >-
    Keep midtones luminous and local contrast restrained while preserving the requested palette and the
    distinctions that make the subject readable.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use small tonal shifts to model form without
    adding a warm glow or changing the scene's illumination.
  texture_and_material: >-
    Use fine brushwork while preserving material differences. Avoid plastic-looking skin or surfaces
    and do not apply a photographic filter.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Soft rendering does not require
    a portrait crop, close framing or a domestic setting.
  atmosphere_and_mood: >-
    Keep the requested tone and setting. Softness does not imply coziness, affection, companionship or
    an everyday scene.
  rendering_and_quality: >-
    Use discreet edge changes with a few clear points of definition. Keep forms recognizable and avoid
    global blur or polished photographic skin.
avoidRules:
  - plastic-looking skin or surfaces
  - unrequested interior or companion figures
