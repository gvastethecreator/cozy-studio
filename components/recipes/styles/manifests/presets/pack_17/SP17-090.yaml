visualDna:
  aesthetic: >-
    Darksiders (2010) as Western action-comic fantasy: monumental, sculpted heroic bodies and
    oversized equipment are cut into forceful silhouettes, dark ink contours and clear cel-like
    planes. Keep the modeled volume, but let graphic shape design and hard value breaks define it
    before surface texture.
  subject_treatment: >-
    Preserve the requested identity, action and framing. Unless the user explicitly locks the
    proportions, where a humanoid subject fits, push heroic anatomy far beyond natural proportions:
    huge chest, trapezius, deltoids, upper arms and forearms; a conspicuously small head and pinched
    waist; hands, gauntlets and boots enlarged enough to dominate the silhouette. Layer a few
    angular armor plates over visibly living anatomy so flesh, armor and joints remain distinct.
    Keep the treatment adaptable; do not default to War, a Horseman, a demon, a weapon or a battle.
  color_and_tone: >-
    Soot and weathered stone against blue-steel armor and dirty urban green; selective saturated
    crimson and amber focal accents. Large graphic color masses stay clear without a uniform
    orange-teal filter.
  lighting_and_shadow: >-
    Use broad, hard-edged comic shadow shapes to carve the chest, shoulder masses and limbs; keep
    highlights selective and decisive on flesh, steel and stone. Make the major value divisions read
    at card size, with supernatural light concentrated around the point of impact.
  texture_and_material: >-
    Model living muscle as huge interlocking rounded and wedge-shaped masses: deltoids overlap broad
    pectorals, forearms taper sharply into enormous hands, and tendon breaks are clean rather than
    densely striated. Distinguish flesh from a few broad forged armor facets, thick leather and
    substantial cloth folds. Use restrained localized wear; neither rock facets nor realistic skin
    microdetail should replace the graphic anatomy.
  camera_and_composition: >-
    Keep the camera, crop and scale requested by the prompt. For an illustration, favor a readable
    foreground silhouette, a strong weapon or body diagonal and architecture that makes the subject
    feel large; let these devices support the chosen subject rather than impose a game chase view or
    poster pose.
  atmosphere_and_mood: >-
    Carry the series' biblical-apocalyptic scale, blunt heroic force and collision of ruined
    civilization with supernatural power through shape and contrast. Keep the mood requested by the
    prompt; a non-apocalyptic subject does not need ash, demons or a battle narrative.
  rendering_and_quality: >-
    Favor thick, tapering dark contours and a small number of large cel-painted color and shadow
    planes over soft blended modeling. Keep forms three-dimensional, anatomy unmistakable and armor
    edges angular; confine chips and etched details to a few focal areas.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
