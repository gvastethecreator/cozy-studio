visualDna:
  aesthetic: 'Carborundum print: silicon carbide grit mixed with glue and brushed onto a plate like paint, so the grit holds ink and prints deep, velvety, brushy darks.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Extremely deep velvet blacks or saturated single colors, brushy mid-tones where grit is thin, bright paper left where no grit was painted.
  lighting_and_shadow: Bold painterly light and dark masses; light is simply the unpainted plate.
  texture_and_material: Gritty granular ink surface with brush marks preserved, raised and embossed ink you could touch, soft furry edges.
  camera_and_composition: Keep the requested framing; forms made from broad brushed gestures.
  atmosphere_and_mood: Heavy, dramatic and physical, darkness you can feel.
  rendering_and_quality: Brushy granular tone with deep embossed velvet darks; no fine line, no smooth wash.
  creative_brief: "Carborundum print: silicon carbide grit mixed with glue and brushed onto a plate like paint, so the grit holds ink and prints deep, velvety, brushy darks. Carry it through brushed grit plate, deep velvet embossed darks, brush marks in granular tone, soft furry edges, bold painterly masses. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: brushed grit plate; deep velvet embossed darks; brush marks in granular tone; soft furry edges; bold painterly masses
