visualDna:
  aesthetic: 'Contour-Band Explanations: discrete bands built from declared intervals show variation with a visible scale and labeled limits.'
  subject_treatment: Build the prompt's values into discrete bands from declared intervals, each level continuous and ordered, with the scale and limits labeled exactly.
  color_and_tone: A monotonic value ramp with perceptible steps, diverging only around a real center.
  lighting_and_shadow: Flat bands with no lit relief that would invent terrain.
  texture_and_material: Flat surfaces bounded by clean contours, any interpolation stated.
  camera_and_composition: Visible numeric scale, labeled limits and a legend set apart from the bands.
  atmosphere_and_mood: Gradual variation with clear thresholds, honest and calm.
  rendering_and_quality: Crisp graphic whose borders come from the data and equal intervals share equal steps.
  creative_brief: "Contour-Band Explanations: discrete bands built from declared intervals show variation with a visible scale and labeled limits. Carry it through declared intervals, discrete bands, visible scale, labeled limits. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
