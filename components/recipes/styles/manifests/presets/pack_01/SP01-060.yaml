visualDna:
  aesthetic: 'War reportage: a 35 mm witness close to exhausted people in harsh conditions, shot fast, without heroics or staging.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Desaturated ochre, khaki and ash grey, skin dulled by dust, occasional muted red accent.
  lighting_and_shadow: Harsh sun or flat smoky overcast; smoke and dust diffuse the light; no glamour lighting.
  texture_and_material: Dust in the air, grit on faces and cloth, frayed and patched gear, film grain.
  camera_and_composition: Close and slightly tilted, subjects caught between actions, foreground obstruction, horizon not perfectly level.
  atmosphere_and_mood: Unflinching and weary, quiet exhaustion instead of spectacle or triumph.
  rendering_and_quality: Credible press photograph; no explosions, gore or heroic posing unless the prompt asks for them.
  key_features: desaturated dust palette; 35 mm closeness; tilted urgent framing; exhaustion over spectacle; grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Documentary (War) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
