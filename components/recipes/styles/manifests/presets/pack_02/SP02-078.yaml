    behavior while preserving prompt identity; preserve the requested subject while letting the
    named light, atmosphere, or optical effect transform silhouette, depth, value, and surface
    response, keeping the requested identity, silhouette, action, object function, or setting
    legible.
  color_and_tone: >-
    Build color with Neon lines, electric blue trails, magenta ribbon, RGB glow; use color as light
    temperature, spectral split, water attenuation, neon bounce, candle warmth, night conversion,
    prism dispersion, or atmospheric scattering, with deliberate value grouping, accent control, and
    process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Dark depth field, total black, light-only visibility; make the named light
