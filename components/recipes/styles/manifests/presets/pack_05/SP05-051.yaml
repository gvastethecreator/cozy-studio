  lighting_and_shadow: Neon signage, holographic glare and chrome implant reflections in a night megacity.
  texture_and_material: Flat bold color, thick outlines and chrome gleam.
  camera_and_composition: Kinetic sprints, fisheye cityscapes and dramatic silhouettes against neon skylines.
