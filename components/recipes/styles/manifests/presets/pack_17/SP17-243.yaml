visualDna:
  aesthetic: 'Russ Nicholson fighting fantasy ink: scratchy dense line work, grotesque detailed monsters, cross-hatched murk, warty skin and eccentric British gamebook character.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject as grotesque detailed ink creatures and characters in scratchy cross-hatched murk. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with grey hatched tone, true to the Russ Nicholson palette.
  lighting_and_shadow: Murky hatched shadow, lit the way Russ Nicholson lights its scenes.
  texture_and_material: Scratchy dense ink hatching, with the surface finish of Russ Nicholson.
  camera_and_composition: Gamebook illustration framing, framed the way Russ Nicholson composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with grotesque eccentric humor.
  rendering_and_quality: Scratchy gamebook ink illustration, in the recognizable hand of Russ Nicholson.
  creative_brief: 'Russ Nicholson fighting fantasy ink: scratchy dense line work, grotesque detailed monsters, cross-hatched murk, warty skin and eccentric British gamebook character. Carry it through Nicholson scratchy ink, grotesque monsters, hatching. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
  key_features: Nicholson scratchy ink; grotesque monsters; hatching
