visualDna:
  aesthetic: >-
    Mangrovepunk combines interlaced branching contours with staggered, buoyant planes and brackish
    reflection bands, balancing organic structure with layered support.
  subject_treatment: >-
    Preserve the requested subject, proportions, action and connections. Use branching contour rhythms or
    tiered overlaps within existing forms where they fit; do not turn the subject into a mangrove, boat
    or platform.
  color_and_tone: >-
    Keep the requested palette, with deep brackish teal, mineral green, clay and a restrained reflective
    accent only when compatible. Separate organic and structural values clearly.
  lighting_and_shadow: >-
    Respect requested lighting. Use broken horizontal reflections and soft edge separation only where the
    supplied surfaces support them; do not invent a waterline or sunset.
  texture_and_material: >-
    Preserve material identity. Where organic surfaces are present, use layered edge variation; where
    built materials exist, retain their distinct seams and finish. Avoid universal wetness or foliage
    texture.
  camera_and_composition: >-
    Preserve viewpoint and crop. Interweave branching and horizontal rhythms inside existing geometry
    without imposing a shoreline, settlement or landscape.
  atmosphere_and_mood: >-
    Suggest adaptable coexistence through interlaced forms and balanced value planes; keep the requested
    tone and do not add an amphibious community story.
  rendering_and_quality: >-
    Use clear branching lines, stepped color planes and restrained reflected accents. Maintain a simple
    silhouette and avoid root-like detail becoming a dense screen.
avoidRules:
  - Do not add mangrove trees, boats, lift platforms, shorelines or stilt settlements unless requested.
  - Avoid universal foliage, mud and wet-surface texture.
  - Keep branching accents subordinate to the requested subject.
