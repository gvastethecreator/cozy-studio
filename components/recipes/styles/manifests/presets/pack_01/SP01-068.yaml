visualDna:
  aesthetic: 'Newborn photography: gentle, protected studio portraits of a sleeping infant with soft wraps, warm neutrals, and handmade props.'
  subject_treatment: Infant asleep and safely supported — swaddled, cradled, or curled — with tiny hands, feet and features as the focus; adult hands may appear for scale.
  color_and_tone: Cream, oatmeal, soft sage and blush, low contrast, warm skin.
  lighting_and_shadow: Large window or softbox from one side, feathered, with soft gentle shadow modeling.
  texture_and_material: Knitted wraps, fur, wool, woven baskets and muslin rendered tactile and soft.
  camera_and_composition: Overhead or low close framing, shallow focus, calm negative space.
  atmosphere_and_mood: Peaceful, tender, and hushed.
  rendering_and_quality: Delicate skin rendering and soft focus falloff; no harsh retouching.
  key_features: safely supported sleeping infant; knitted textures; feathered window light; warm neutrals; hushed calm
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Newborn Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
