  rendering_and_quality: >-
    Finish with SNES Mode 7 capture, 16 bit pseudo 3D nostalgia, hardware trick aesthetic, retro
    technical beauty; finish with faithful era constraints, crisp readability at small scale, and no
    modern high-resolution smoothing unless the preset asks for baked pre-rendering, clean denoised
    surfaces where appropriate, and enough craft evidence to make the medium recognizable.
  key_features: >-
    Classic 16 bit Mode 7 effect, pseudo 3D affine transform, rotating flat plane depth illusion,
    sprite scaled motifs approaching from distance, SNES hardware magic, Final Fantasy VI, Super
