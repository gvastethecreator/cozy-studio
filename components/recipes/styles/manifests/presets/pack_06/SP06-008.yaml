visualDna:
  aesthetic: 'East Asian ink wash: a single loaded brush of carbon ink on absorbent paper, one stroke per form, with pressure and water content doing all the modeling.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Black ink diluted into five tones from dense black to palest grey, large areas of untouched paper, at most one small touch of red or ochre.
  lighting_and_shadow: No cast light; volume and distance come from ink density, with dark near forms and pale dissolving far forms.
  texture_and_material: Absorbent rice paper with feathered bleeding at stroke edges, dry-brush flying white where the brush ran out, splashed ink in the darks.
  camera_and_composition: Keep the requested framing but leave large empty paper as mist, water or sky; the subject sits off-center.
  atmosphere_and_mood: Quiet and spare, energy concentrated in a few decisive strokes.
  rendering_and_quality: Each stroke laid once without correction, varying from wet bleed to dry flying white; no outlines filled in afterward.
  key_features: one-stroke brush forms; five ink tones; feathered bleed on rice paper; dry-brush flying white; large empty paper as mist
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ink Wash (Sumi-e) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
