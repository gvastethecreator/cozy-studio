visualDna:
  aesthetic: >-
    equipment silhouettes Design acts as a transferable illustration router: start from equipment
    silhouettes concept-sheet style with functional lethality readability, industrial precision, and
    controlled silhouette authority, Side view, mechanical detail, magazine/guard and production
    concept-art system built from iteration discipline, silhouette testing, material exploration,
    design readability, and pitch-ready visual decisions, then apply the visual behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Mechanical contour logic with component segmentation,
    ergonomic line flow, and side-profile specification clarity; preserve the requested subject
    while routing it through design exploration, asset logic, value blocking, scale cues, iteration
    rows, paintover marks, or production-readability constraints, keeping the requested identity,
    silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Gunmetal, tactical finish, equipment silhouettes-grade metals; use color as
    concept decision-making: mood scripts, material swatches, faction accents, environment
    atmosphere, asset tier contrast, or readable pass separation, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Rim light, barrel gleam, tactical edge highlight; shape light for ideation
    clarity through value block-in, keyframe contrast, material test highlights, callout
    illumination, or pitch-frame atmosphere, so value structure supports the illustration process
    and does not overwrite the requested content.
  texture_and_material: >-
    Render Scratched metal, production design clarity, iteration logic, silhouette readability,
    material exploration, and concept-art decision pressure; surface detail should reveal brush
    passes, photobash integration, low-poly facets, callout texture, massing blocks, costume
    fabrics, foliage clusters, or weapon material tiers when named, keeping material scale coherent
    and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Compose for equipment silhouettes Design using its key spatial cues:
    Side view, mechanical detail, magazine/guard; compose through production hierarchy, variants,
    orthographic logic, isometric staging, silhouette grids, iteration boards, or cinematic keyframe
    balance without locking one finished illustration, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Dangerous, heavy, trigger discipline, combat-readiness; derive mood from
    exploration, worldbuilding pressure, tactical design, creature unease, kitbash utility,
    cinematic intent, or production-room clarity, letting the style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with FPS game, lethal, armory-model rigor, equipment silhouettes-fan detail; finish with
    concept-art usefulness, readable decisions, controlled roughness, and no generic fantasy
    wallpaper or overpolished final render when iteration is intended, clean denoised surfaces where
    appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    equipment silhouettes concept-sheet style with functional lethality readability, industrial
    precision, and controlled silhouette authority; Side view, mechanical detail, magazine/guard;
    Gunmetal, tactical finish, equipment silhouettes-grade metals; Scratched metal, production
    design clarity, iteration logic, silhouette readability, material exploration, and concept-art
    decision pressure
  creative_brief: >-
    Apply equipment silhouettes Design as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through equipment silhouettes concept-sheet style with functional lethality readability,
    industrial precision, and controlled silhouette authority, Side view, mechanical detail,
    magazine/guard, Scratched metal, production design clarity, iteration logic, silhouette
    readability, material exploration, and concept-art decision pressure without requiring the card
    image's original subject.
