  color_and_tone: Black ink with crimson watercolor bleeds and grey washes.
  lighting_and_shadow: Dim urban night light and glowing crimson eyes in shadowed faces.
  texture_and_material: Sketchy experimental ink lines and bleeding crimson watercolor washes.
  camera_and_composition: Moody close-ups on masked faces and lonely urban rooftop compositions.
  atmosphere_and_mood: Keep the requested mood with tragic hungry metamorphosis.
  rendering_and_quality: Experimental ink-and-watercolor manga illustration with a tragic hungry mood.
  key_features: Sui Ishida sketchy ink; crimson watercolor; masks; metamorphosis
  creative_brief: "Sui Ishida Tokyo Ghoul manga look: sketchy experimental ink, watercolor bleeds in crimson and black, masked figures and tragic urban metamorphosis. Carry it through Sui Ishida sketchy ink, crimson watercolor, masks, metamorphosis. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
