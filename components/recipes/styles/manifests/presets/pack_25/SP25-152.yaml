visualDna:
  aesthetic: 'Screen-in-Device Preservation: an existing screen design placed inside a generic device frame with every control and word exactly preserved.'
  subject_treatment: Place the prompt's screen design inside a generic unbranded device as a locked layer, keeping its aspect ratio, controls and every word exact.
  color_and_tone: Screen colors untouched with enough brightness and limited reflections.
  lighting_and_shadow: Ambient light kept off the controls, reflections only outside key reading.
  texture_and_material: Sober generic device and a sharp screen with every pixel crisp.
  camera_and_composition: Moderate perspective, kept aspect ratio and a frame that never crops content.
  atmosphere_and_mood: A believable context of use, clean and modern.
  rendering_and_quality: Text, icons, order and states match the source screen.
  creative_brief: "Screen-in-Device Preservation: an existing screen design placed inside a generic device frame with every control and word exactly preserved. Carry it through locked screen layer, generic device, kept aspect ratio, exact UI text. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: locked screen layer; generic device; kept aspect ratio; exact UI text
avoidRules:
  - rewritten UI
  - altered aspect ratio
  - invented controls
  - device maker logos
  - redrawn or altered brand artwork
  - real brand or trademark
