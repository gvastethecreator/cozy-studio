visualDna:
  aesthetic: Refined two-drum risograph print where teal and tangerine overlap into a deliberate third brown-olive, with confident brush-pen contour, tidy halftone ramps, and generous unprinted paper.
  subject_treatment: 'Route any prompt subject into a calm two-layer riso separation: one drum carries contour and shadow, the other carries warm fill, and their overlap models form. Figures, creatures, objects, places, and abstract motifs all read through planned overprint rather than painted rendering.'
  color_and_tone: Teal, tangerine, their dark overprint olive, and warm off-white paper; no black drum and no extra hues.
  lighting_and_shadow: Light is described by paper left bare, tangerine halftone for midtones, and teal-plus-tangerine overprint for the deepest shadow.
  texture_and_material: Fine even riso grain, clean halftone steps, slight soy-ink sheen, and one to two millimeters of intentional registration drift.
  camera_and_composition: Balanced single-image crop with a clear focal silhouette, open paper margins, and flat shape planning suited to a hand-bound zine page, with no readable typography.
  atmosphere_and_mood: Curious, crafted, warm, and quietly strange rather than grim.
  rendering_and_quality: 'Clean studio-grade risograph reproduction: crisp separations, controlled grain, legible shapes at thumbnail size, and no digital gradients.'
  creative_brief: "Refined two-drum risograph print where teal and tangerine overlap into a deliberate third brown-olive, with confident brush-pen contour, tidy halftone ramps, and generous unprinted paper. Carry it through two-drum teal and tangerine, planned overprint third color, tidy halftone ramps, brush-pen contour, bare paper highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two-drum teal and tangerine; planned overprint third color; tidy halftone ramps; brush-pen contour; bare paper highlights
