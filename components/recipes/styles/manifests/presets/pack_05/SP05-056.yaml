visualDna:
  aesthetic: 'Hyper-angular limited-animation cel: thick tapered brush-pen outlines, flat fills with no gradients, and triangular highlight and shadow shapes cut at sharp angles.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Hot coral, apricot and lemon yellow as flat fills against clean cyan and lavender shadow triangles; no blending, every hue separated by an ink line.
  lighting_and_shadow: One hard warm key rendered as jagged triangular shadow wedges and star-shaped glints on edges; shadows are flat lavender shapes, never soft gradients.
  texture_and_material: Smooth untextured cel paint with a few dry-brush speed flecks along outlines; surfaces read through shadow shape rather than surface detail.
  camera_and_composition: 'Keep the requested view but push its perspective: foreshortened near forms, converging diagonals, and solid color speed wedges behind the main silhouette.'
  atmosphere_and_mood: Brash, urgent and optimistic, like a shout drawn in straight lines and sharp corners.
  rendering_and_quality: Flat two-tone cel with brush-pen line weight swelling at corners, crisp triangle glints, and no airbrush or 3D shading.
  key_features: thick tapered brush-pen outlines; triangular shadow and highlight wedges; flat coral, yellow and cyan fills; star-shaped glints; forced foreshortening with speed wedges
  creative_brief: "Hyper-angular limited-animation cel: thick tapered brush-pen outlines, flat fills with no gradients, and triangular highlight and shadow shapes cut at sharp angles. Carry it through thick tapered brush-pen outlines, triangular shadow and highlight wedges, flat coral, yellow and cyan fills, star-shaped glints. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
