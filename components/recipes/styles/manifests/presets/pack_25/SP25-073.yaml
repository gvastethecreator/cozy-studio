visualDna:
  aesthetic: 'Graphic Stamp Interface: solid geometric markers placed on flat surfaces show real states, each with its own distinct shape.'
  subject_treatment: Mark the states in the prompt's screen with solid geometric markers of distinct shapes next to the content they describe; keep state names exact.
  color_and_tone: One main ink and a functional accent, states told apart by shape too.
  lighting_and_shadow: Flat clean graphic stamps with no physical relief.
  texture_and_material: Firm edges and minimal texture, crisp as fresh print.
  camera_and_composition: Markers close to their content and smaller than the main reading.
  atmosphere_and_mood: Direct editorial character and decisiveness, friendly and firm.
  rendering_and_quality: Every stamp marks a real state and reads without color.
  creative_brief: "Graphic Stamp Interface: solid geometric markers placed on flat surfaces show real states, each with its own distinct shape. Carry it through geometric state stamps, distinct shapes, flat surfaces, near content. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: geometric state stamps; distinct shapes; flat surfaces; near content
avoidRules:
  - decorative stamps
  - invented states
  - content covered by markers
