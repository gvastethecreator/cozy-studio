visualDna:
  aesthetic: >-
    A flat illustration uses asymmetrical cutout-like silhouettes, simple interior shapes and intentional
    open areas while remaining a single, fully rendered image.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Simplify the existing subject
    into cutout-like shapes without adding a mythic role or a new object.
  color_and_tone: >-
    Keep the requested palette and use broad flat colors with deliberate negative spaces; do not impose a
    limited palette if the request specifies otherwise.
  lighting_and_shadow: >-
    Respect the requested light direction but keep form mostly flat; do not add physical layer shadows or
    a new source to imply actual paper construction.
  texture_and_material: >-
    Render simulated hand-cut edges in flat ink without turning the image into a photograph of layered
    paper or changing the subject's material.
  camera_and_composition: >-
    Retain the requested viewpoint, framing, crop and element placement. Cutout shapes remain within the
    original composition and do not form a collage layout or frame.
  atmosphere_and_mood: >-
    Maintain the requested setting and mood. The cutout appearance does not introduce a myth, legend or
    symbolic story.
  rendering_and_quality: >-
    Use clean, slightly irregular silhouettes and simple inner shapes with clear open spaces; prioritize
    the subject's identity over paper-like microdetail.
avoidRules:
  - physical layered collage or cast paper shadows
  - unrequested mythic roles, symbols or frames
  - extra details that alter identity or function
