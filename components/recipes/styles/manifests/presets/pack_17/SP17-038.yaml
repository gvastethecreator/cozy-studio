visualDna:
  aesthetic: >-
    Illuminated manuscript bestiary style with clean parchment, jewel-like flat accents, gold margins, and
    strange medieval beasts.
  subject_treatment: >-
    Translate any subject into illuminated manuscript logic with flat pigment separation, clean ink contour,
    restrained gold ornament, vellum spacing, and scholarly medieval oddness without requiring a fixed figure.
  color_and_tone: Parchment, black ink, muted lapis, red lake, dull gold, and soft green accents separated into flat planes.
  lighting_and_shadow: Flat manuscript lighting, little cast shadow, and strong color separation.
  texture_and_material: >-
    Smooth vellum, flat pigment, clean ink outlines, restrained gold ornament, and no smeared aged-paper
    noise.
  camera_and_composition: Manuscript plate crop, creature centered in a simple frame, broad margins, and no readable annotations.
  atmosphere_and_mood: Scholarly, magical, antique, and curious rather than grim.
  rendering_and_quality: Clean illuminated illustration with crisp edges, low texture load, and visible shape design.
  creative_brief: >-
    Reusable visual system for any subject needing illuminated codex discipline, parchment clarity,
    jewel-like flat accents, and scholarly medieval curiosity.
avoidRules:
  - readable marginal text
  - over-aged parchment grime
  - excessive filigree
  - photoreal vellum
  - explicit gore
  - watermark
  - text
