visualDna:
  aesthetic: 'Maximalist print clash: many bold patterns and colors layered on purpose — florals with stripes, animal print with brocade — in a controlled riot.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: at least three clashing printed garments and accessories — patterned coat, printed shirt, contrasting trousers, headscarf and bold jewelry — layered with intent."
  color_and_tone: 'Saturated, clashing color: tomato, cobalt, chartreuse, fuchsia and gold.'
  lighting_and_shadow: Bright, even light that shows every pattern, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Brocade, printed silk, jacquard, velvet and beaded accessories, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Full figure against a patterned or colorful background, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Joyful, loud, eccentric and fearless, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Crisp pattern detail with rich saturation, with believable fabric weight, seams and fit detail.
  creative_brief: "Maximalist print clash: many bold patterns and colors layered on purpose — florals with stripes, animal print with brocade — in a controlled riot. Carry it through three or more clashing prints, saturated color riot, brocade and printed silk, bold jewelry, controlled maximalism. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three or more clashing prints; saturated color riot; brocade and printed silk; bold jewelry; controlled maximalism
