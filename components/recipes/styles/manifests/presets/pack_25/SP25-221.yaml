visualDna:
  aesthetic: 'Specimen Annotation Graphics: one whole figure receives numbered callouts and linked enlargements with unmistakable anchors.'
  subject_treatment: Show the prompt's subject whole, then add numbered callouts and a few enlargements tied exactly to real parts, every label kept exact.
  color_and_tone: Light ground, figure in a mid value and one accent reserved for the annotated part.
  lighting_and_shadow: No scene light, with descriptive shading kept apart from lines and numbers.
  texture_and_material: Continuous technical line and sober fills, hatching only on declared sections.
  camera_and_composition: Callouts outside the silhouette, no crossings and even spacing to each detail.
  atmosphere_and_mood: Patient attention, from the whole figure to one part and back to the whole.
  rendering_and_quality: Crisp plate with precise leader ends, each landing on a real component.
  creative_brief: "Specimen Annotation Graphics: one whole figure receives numbered callouts and linked enlargements with unmistakable anchors. Carry it through whole figure, numbered callouts, linked enlargements, exact labels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whole figure; numbered callouts; linked enlargements; exact labels
