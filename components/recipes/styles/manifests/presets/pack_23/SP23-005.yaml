visualDna:
  aesthetic: >-
    Light pen-and-wash illustration with fine, slightly irregular strokes, economical marks and
    small color washes that leave the requested composition breathing room.
  subject_treatment: >-
    Prioritize the existing gesture, articulation and silhouette. Keep proportions and action
    faithful without caricature or added marginal characters.
  color_and_tone: >-
    Use a few small washes from the requested palette and preserve broad open areas. Avoid making
    the composition sepia or restricting it to a fixed historical palette.
  lighting_and_shadow: >-
    Use sparse pen marks and small washes to describe existing light and shadow. Follow the requested
    light direction without inventing a source or dramatic scene.
  texture_and_material: >-
    Vary pen pressure and stroke direction to describe form; keep wash edges selective. Do not add
    a uniform paper grain or confuse pigment marks with the subject material.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and arrangement. Retain existing negative space
    without creating a book margin or moving elements to make one.
  atmosphere_and_mood: >-
    Let line rhythm and unfilled space support the requested mood. Gesture alone does not imply
    comedy, action or a historical setting.
  rendering_and_quality: >-
    Keep marks selective and attached to the requested forms. Maintain clear silhouettes and avoid
    dense hatching that overwhelms the subject.
avoidRules:
  - unrequested marginal characters or comic action
  - dense hatching that overwhelms the silhouette
