visualDna:
  aesthetic: >-
    Mezzotint acts as a transferable art-medium router: start from Dark to light engraving, Rich
    blacks and print-process system built from matrix marks, ink transfer, pressure, registration,
    plate or block artifacts, and paper absorption, then apply the medium behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Subject reduced to rich black masses; preserve the prompt
    subject while converting it into carved, etched, stamped, screened, dotted, grained, or
    impressed mark systems, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Deep black, velvet grey; use palette as ink behavior: limited plates,
    overprint, misregistration, monochrome value, cyan chemistry, newspaper dots, or security
    green-grey restraint, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Dramatic, emerging from dark; translate light into line density, dot
    frequency, relief shadow, plate tone, paper reserve, or ink coverage rather than photographic
    illumination, so value structure supports the medium and does not overwrite the requested
    content.
  texture_and_material: >-
    Render Rocker tool marks; surface detail should reveal paper fibers, plate marks, burr, gouge,
    rosin grain, rubber stamp incompleteness, halftone dots, or collagraph relief, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Compose for Mezzotint using its key spatial cues: Rich blacks;
    compose through print registration, cut rhythm, border pressure, edition-like balance, negative
    space, and repeatable mark hierarchy, with scale, spacing, edge rhythm, and visual hierarchy
    doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Night, dramatic; derive mood from hand pressure, mechanical reproduction, archival
    value, propaganda energy, occult darkness, newspaper grit, or tactile experiment, letting the
    medium alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Velvety, detailed; finish as a credible print artifact with exact mark logic,
    restrained texture, and no fake poster text or random distress overlay, clean denoised surfaces
    where appropriate, and enough craft evidence to make the medium recognizable.
  key_features: Dark to light engraving; Rich blacks; Deep black, velvet grey; Rocker tool marks
  creative_brief: >-
    Apply Mezzotint as an art-style preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Dark to
    light engraving, Rich blacks, Rocker tool marks without requiring the card image's original
    subject.
