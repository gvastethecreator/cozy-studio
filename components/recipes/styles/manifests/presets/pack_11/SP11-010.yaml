visualDna:
  aesthetic: 'Indexed pixel art: the subject drawn under strict old-console limits, hard square pixels and a tiny fixed palette.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: redrawn on a low-resolution grid with hard pixel edges, a limited indexed palette, hand-placed dithering and clear silhouettes."
  color_and_tone: A fixed palette of about 16 colors, no gradients beyond dithering.
  lighting_and_shadow: Light shown by palette steps and dither, with one clear light direction.
  texture_and_material: Crisp square pixels with no anti-aliasing and no blur.
  camera_and_composition: Game-scene framing at native low resolution scaled up with nearest-neighbor.
  atmosphere_and_mood: Nostalgic, precise, crafted and playful, driven by the construction, color and rhythm.
  rendering_and_quality: Hand-placed pixel art with clean clusters and no stray pixels.
  key_features: hard pixels; indexed palette; dithering; strong silhouettes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Indexed Pixel Constraint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
