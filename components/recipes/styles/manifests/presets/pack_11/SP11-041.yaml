visualDna:
  aesthetic: 'Grimdark war fantasy: endless war, cathedral-sized fortresses, filthy armored soldiers and religious fanaticism.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: set in a world of permanent war: massive ornate armor worn down by mud and blood, relic-covered banners, skull-carved fortresses."
  color_and_tone: Mud brown, rust, bone, grim gold and ash grey.
  lighting_and_shadow: Smoky battlefield light, fire and cold overcast, expressed through the style rather than photographic lighting.
  texture_and_material: Battered plate, torn cloth, bone, soot and stone, visible at card size as the signature of the style.
  camera_and_composition: Monumental framing with tiny figures against huge structures, arranged so the subject still reads at card size.
  atmosphere_and_mood: Bleak, grim, oppressive and fanatical, driven by the construction, color and rhythm.
  rendering_and_quality: Gritty painterly concept art, with clean, deliberate marks and no accidental noise.
  key_features: battered ornate armor; skull fortress; relic banners; endless war
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Grimdark as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
