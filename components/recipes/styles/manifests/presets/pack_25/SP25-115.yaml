visualDna:
  aesthetic: 'Inflated Surface Hardpoints: apparently soft volumes fixed to clearly rigid points, a constructive contrast between plush and precise.'
  subject_treatment: Fix the prompt's soft volumes to a few clear rigid anchors, keeping tension and the function of each contact point.
  color_and_tone: A sober soft body color with anchors in limited contrast.
  lighting_and_shadow: Broad light revealing curvature and compression around each anchor.
  texture_and_material: Smooth elastic surface and rigid anchors with defined edges.
  camera_and_composition: Few visible anchors, a compact silhouette and a clear zone of use.
  atmosphere_and_mood: Contrast between softness and precision, cushioned yet exact.
  rendering_and_quality: Clean concept render where every major deformation comes from an anchor.
  creative_brief: "Inflated Surface Hardpoints: apparently soft volumes fixed to clearly rigid points, a constructive contrast between plush and precise. Carry it through soft volume, rigid anchors, visible compression, plush and precise. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft volume; rigid anchors; visible compression; plush and precise
