visualDna:
  aesthetic: 'Periodic Grid Systems: any set of things organized into a periodic-table-like grid of tiles, each with a symbol, a number and a category color.'
  subject_treatment: Organize the prompt's items into a periodic-table-style grid of tiles, each with a short symbol, number and name, grouped by category color; keep all text exact.
  color_and_tone: Category colors in a limited palette on a light ground with dark type.
  lighting_and_shadow: Flat tiles with no shading, crisp like a classroom poster.
  texture_and_material: Clean rounded tiles, bold symbols and small secondary text.
  camera_and_composition: A structured grid with groups in blocks and a legend of categories.
  atmosphere_and_mood: Playful and systematic, a whole world ordered into neat elements.
  rendering_and_quality: Crisp grid with every tile legible and consistent in layout.
  creative_brief: "Periodic Grid Systems: any set of things organized into a periodic-table-like grid of tiles, each with a symbol, a number and a category color. Carry it through element tiles, symbol and number, category colors, structured grid. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
