visualDna:
  aesthetic: 'Optical Register Drift: styleframes where ink layers slip slightly out of register and drift back into perfect alignment.'
  subject_treatment: Show the prompt's artwork as keyframes where its color layers slip slightly apart and realign, the words always readable on one layer.
  color_and_tone: Two or three inks related to the artwork.
  lighting_and_shadow: Flat optical rendering with no flashes or flicker.
  texture_and_material: Controlled print edges and small offsets relative to letter size.
  camera_and_composition: A stable reading focus with smaller offsets on secondary areas.
  atmosphere_and_mood: A slow drift, a short tension and a crisp realignment.
  rendering_and_quality: Crisp keyframes ending perfectly registered with the copy intact.
  creative_brief: "Optical Register Drift: styleframes where ink layers slip slightly out of register and drift back into perfect alignment. Carry it through slipping ink layers, slow drift, crisp realign, readable copy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: slipping ink layers; slow drift; crisp realign; readable copy
