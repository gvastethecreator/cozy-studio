visualDna:
  aesthetic: 'In-game screenshot look informed by Forza Horizon 5 gameplay: third-person racing capture with desert roads, festival color, dust plumes, car paint reflections, and high-speed chase-camera readability. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Forza Horizon 5-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Forza Horizon 5-informed palette: sunlit sand, glossy car red, turquoise sky, black tire
    marks, festival pink, and golden dust. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through bright desert sun, windshield flare, dust haze, brake-light red, and
    reflective body highlights. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from photoreal car paint, gravel, asphalt, dust clouds, cactus silhouettes,
    banners without readable branding, and road debris. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with chase camera with car centered low, racing line, opponents ahead, road curvature,
    and motion blur tuned for playability. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Forza Horizon 5-derived mood: competitive, sunny, stylish, festival-like, and fast; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: racing HUD can include
    speedometer, minimap, position, checkpoint markers, and clean drift-score cues. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Forza Horizon 5 gameplay screenshots; third-person racing capture with desert roads, festival
    color, dust plumes, car paint reflections, and high-speed chase-camera readability; sunlit sand,
    glossy car red, turquoise sky, black tire marks, festival pink, and golden dust; bright desert
    sun, windshield flare, dust haze, brake-light red, and reflective body highlights; photoreal car
    paint, gravel, asphalt, dust clouds, cactus silhouettes, banners without readable branding, and
    road debris; chase camera with car centered low, racing line, opponents ahead, road curvature,
    and motion blur tuned for playability; competitive, sunny, stylish, festival-like, and fast; HUD
    guidance: racing HUD can include speedometer, minimap, position, checkpoint markers, and clean
    drift-score cues
  creative_brief: "Forza Sandstorm Drift Cup: in-game screenshot language informed by Forza Horizon 5, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
