visualDna:
  aesthetic: 'Interrupted Stripe Weaves: stripes cut in alternating zones and reconnected by bridges that explain their continuity.'
  subject_treatment: Build a repeating stripe surface where stripes break in alternating zones and reconnect through bridges, with the break points offset between neighbors.
  color_and_tone: Two stripe colors and a stable ground showing through the gaps.
  lighting_and_shadow: Flat artwork where over and under are shown by cuts and continuity.
  texture_and_material: Constant-width stripes with crisp interruptions and a few wide crossings.
  camera_and_composition: Offset cut sequence between neighboring stripes, phase kept at the edges.
  atmosphere_and_mood: A graphic syncopation of repetition, interruption and return.
  rendering_and_quality: Clean repeat with aligned ends and no tiny leftover segments.
  creative_brief: "Interrupted Stripe Weaves: stripes cut in alternating zones and reconnected by bridges that explain their continuity. Carry it through interrupted stripes, bridging crossings, offset cuts, syncopated rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: interrupted stripes; bridging crossings; offset cuts; syncopated rhythm
