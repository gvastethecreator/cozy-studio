visualDna:
  aesthetic: >-
    Layer transparent watercolor washes with controlled lost edges, clear reserves and barely
    visible drawing. Group values delicately so pigment stays clear and forms remain legible.
  subject_treatment: >-
    Preserve the requested subject, identity, function, count, pose, action and proportions. Let the
    washes follow existing forms without changing their silhouette or adding content.
  color_and_tone: >-
    Retain the requested palette and relationships. Use transparent overlapping washes to build
    depth without imposing a period palette or bleaching the specified colors.
  lighting_and_shadow: >-
    Follow the requested illumination and contrast. Group wash values to describe the existing light;
    keep clear reserves purposeful and avoid bloom or invented highlights.
  texture_and_material: >-
    Keep pigment transparent and softly layered, with subtle texture only where appropriate. Do not
    impose surface aging, stains or a new material on the subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale, pose and spatial relationships. The painting
    treatment does not add borders or change the layout.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Watercolor handling changes the rendering, not the
    scene, period or narrative.
  rendering_and_quality: >-
    Balance controlled lost edges with clear reserves and barely visible linework. Keep focal forms
    readable; avoid indiscriminate softness, bloom or excess surface detail.
avoidRules:
  - unrequested changes to subject identity, function, count, pose or spatial relations
  - unrequested surface aging, stains, bloom or imposed palette
  - unrequested lettering, symbols, borders, interface or layout
