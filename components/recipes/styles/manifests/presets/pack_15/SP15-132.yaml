visualDna:
  aesthetic: 'Telegraphpunk: a world wired by telegraph lines, where messages hum along poles, operators tap keys and cities are laced with overhead wires.'
  subject_treatment: Keep the prompt's subject and setting; string telegraph wires, poles and relay stations through it, with signals as sparks along the lines.
  color_and_tone: Weathered wood brown, copper wire orange and grey sky with small blue signal sparks.
  lighting_and_shadow: Flat overcast light with little blue sparks traveling along wires.
  texture_and_material: Wooden poles, glass insulators, copper wire, brass telegraph keys and paper tape.
  camera_and_composition: Dense webs of wires criss-crossing the sky above streets and plains.
  atmosphere_and_mood: Connected and restless, news racing across a continent faster than any rider.
  rendering_and_quality: Precise period illustration with fine line wires and small spark accents.
  creative_brief: "Telegraphpunk: a world wired by telegraph lines, where messages hum along poles, operators tap keys and cities are laced with overhead wires. Carry it through overhead wire webs, poles and insulators, telegraph keys, signal sparks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overhead wire webs; poles and insulators; telegraph keys; signal sparks
