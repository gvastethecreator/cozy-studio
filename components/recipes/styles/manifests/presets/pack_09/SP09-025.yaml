visualDna:
  aesthetic: >-
    Porcelain (Cracked) turns material failure into the main visual language: start from Old doll or
    vase, Smooth glaze, and Fine cracks, then turn damage history, contamination, corrosion,
    staining, abrasion, and material breakdown into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Craquelure: preserve identity and pose while letting forms
    age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Pale white/cream as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Glossy define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Porcelain (Cracked) without hiding the prompt
    subject.
  texture_and_material: >-
    Render Smooth glaze through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Fine cracks as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Creepy, old by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Antique, fragile material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Old doll or vase; Craquelure; Smooth glaze; Glossy; Fine cracks
  creative_brief: >-
    Route any subject through Porcelain (Cracked) as a transferable weathering-and-decay visual
    system while preserving the prompt's subject, action, and setting. Compose the delicate horror
    of crazed porcelain where a fine network of cracks maps the surface like a frozen lightning
    storm in cream and white, the glaze still gleaming smooth above fractures held in perpetual
    arrest. The crack network should spread organically like roots seeking water, each line a record
    of stress survived. Render the beauty of the almost-broken, fragility that has chosen to endure.
    Use Porcelain as portable surface/render behavior over any input: map its texture, light
    response, edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a
    literal material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
