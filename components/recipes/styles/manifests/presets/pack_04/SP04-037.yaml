visualDna:
  aesthetic: 'Bauhaus poster: the subject rebuilt from circles, squares, triangles and thick bars on an asymmetric grid.'
  subject_treatment: Keep the prompt subject and action; this preset owns the asymmetric geometric grid composition, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Primary red, yellow and blue with black and off-white; each shape one flat color.
  lighting_and_shadow: No shading at all; values are the flat colors of the shapes.
  texture_and_material: Matte lithographic ink on slightly warm paper, crisp compass and ruler edges.
  camera_and_composition: Asymmetric balance on a modular grid, strong diagonals and one dominant circle.
  atmosphere_and_mood: Rational, constructive and playful, function made beautiful.
  rendering_and_quality: Exact geometric primitives only; no decoration, no ornament and no typography.
  key_features: circles squares triangles and bars; primary triad with black; asymmetric grid; dominant circle; flat matte ink
  creative_brief: "Bauhaus poster: the subject rebuilt from circles, squares, triangles and thick bars on an asymmetric grid. Carry it through circles squares triangles and bars, primary triad with black, asymmetric grid, dominant circle, flat matte ink. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
