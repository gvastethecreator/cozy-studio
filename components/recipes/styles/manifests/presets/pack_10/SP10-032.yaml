visualDna:
  aesthetic: >-
    Liminal Space becomes a transferable surreal symbolic transformation system: start from Liminal
    absence field and Transitional emptiness, then route prompt content through impossible logic,
    dream scale, symbolic displacement, liminal staging, and psychic texture without forcing one
    card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Perspective to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Beige, fluorescent; use color as emotional unreliability, nostalgic
    drift, uncanny contrast, or symbolic temperature, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat artificial drive the light response: shape light through impossible shadows, memory
    haze, stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting
    unless the prompt explicitly asks for it.
  texture_and_material: >-
    Render Carpet, tile, synthetic surfaces as the tactile or mark-making basis; surfaces should
    support the illusion with believable texture, collage edges, flesh-metal seams, or unreal
    smoothness, scaled to figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Transitional emptiness as reusable spatial grammar: favor symbolic focal points,
    scale mismatch, empty thresholds, doubled images, and psychologically charged negative space,
    adapting cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Eerie, lonely as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Unsettling, familiar: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Liminal absence field; Perspective; Beige, fluorescent; Flat artificial; Carpet, tile, synthetic
    surfaces; Transitional emptiness; Eerie, lonely; Unsettling, familiar; Transitional emptiness
  creative_brief: >-
    Apply liminal-space unease as atmosphere over the input with flat fluorescent light, beige
    synthetic surfaces, over-clean emptiness, transitional perspective, and a sense of purpose
    removed. If hallway, pool, mall, office, or room exists, empty it; otherwise make subject and
    background feel stranded in functional space without requiring architecture.
avoidRules:
  - people
  - life
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
