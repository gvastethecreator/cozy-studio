visualDna:
  aesthetic: >-
    Mortal Kombat 1 (2023) polished real-time fighting-game frame with naturalistic fighters, ornate
    martial costume, jewel-toned scenery and precisely readable side-on action.
  subject_treatment: >-
    Keep the requested playable subject and opponent distinct, with limbs, pose and distance
    readable at match scale. Preserve identity; do not replace either fighter with a named
    character.
  color_and_tone: >-
    Let stage and character colors follow the prompt. Preserve contrast between two subjects and
    their background without imposing franchise team colors or a particular arena.
  lighting_and_shadow: >-
    Use stage lighting that shapes bodies and action while keeping silhouettes and contact points
    readable. Do not add fatality lighting or effects unless requested.
  texture_and_material: >-
    Use 2023 real-time 3D detail in skin, fabric, metal and stage surfaces, with action-ready
    animation rather than a flat 2D sprite or painted tableau.
  camera_and_composition: >-
    Use a side-on fighting plane with enough horizontal room to show the active pair, their spacing
    and the ground line. Keep the playfield level and action readable; do not turn the frame into a
    third-person camera or cinematic close-up.
  atmosphere_and_mood: >-
    Show a plausible exchange, wind-up or recovery beat. Match the requested intensity and do not
    force gore, a finishing move or a tournament narrative.
  rendering_and_quality: >-
    Keep the frame in the 2023 real-time 3D generation with clear bodies, contact points and arena
    depth. Health bars, round indicators and other interface appear only when the user asks for a
    gameplay screenshot with UI.
avoidRules:
  - unrequested use of franchise characters, costumes, exact arena or signature fatality
  - switching the match plane to third-person roaming or a 2D pixel treatment
  - unrequested gore, move names, round text or fabricated health bars
  - key-art posing that hides playable spacing
