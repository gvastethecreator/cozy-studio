visualDna:
  aesthetic: 'Surreal album cover: one impossible central image in a square frame, photographic calm and dream logic combined.'
  subject_treatment: Keep the prompt subject and action; this preset owns the square cover format with one central surreal metaphor, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Muted dusk palette with one prismatic or uncanny accent color.
  lighting_and_shadow: Clean natural light with an impossible source or a shadow that falls the wrong way.
  texture_and_material: Fine analog photo grain, matte print, subtle vinyl-sleeve wear at the edges.
  camera_and_composition: Square format, centered subject, wide empty space and a flat horizon.
  atmosphere_and_mood: Mysterious, contemplative and hypnotic, a dream held perfectly still.
  rendering_and_quality: Seamless believable surrealism with one strong metaphor; no band names or track lists.
  key_features: square format; one central impossible image; muted dusk palette; analog grain; wide empty space
  creative_brief: "Surreal album cover: one impossible central image in a square frame, photographic calm and dream logic combined. Carry it through square format, one central impossible image, muted dusk palette, analog grain, wide empty space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - invented slogans
  - fake lettering
  - empty title plate
  - real musician likeness
  - boring
  - official card scene
