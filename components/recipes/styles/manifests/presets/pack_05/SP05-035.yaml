visualDna:
  aesthetic: 'Vertical-survival anime: thick sharp contours with harsh stress lines on faces and knuckles, figures dwarfed by colossal walls and cliffs, and taut cable-line motion trails.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Cold slate, muted olive, sand and bone neutrals, with one small ember-orange accent on the focal figure.
  lighting_and_shadow: Overcast top light, grouped cool shadows, and a narrow warm edge only on the focal figure.
  texture_and_material: Broad untextured value planes; stone drawn as stacked vertical strata lines, fabric as stiff folds.
  camera_and_composition: Keep the requested framing; favor steep worm-eye or plunging overhead views where the request allows, with long verticals.
  atmosphere_and_mood: Vertigo, grit and stubborn survival against sheer height.
  rendering_and_quality: Hard stress-line hatching under eyes and along tendons, crisp silhouettes against flat pale sky.
  key_features: facial stress lines; towering vertical strata; taut cable motion trails; cold slate and olive palette; plunging verticals
  creative_brief: "Vertical-survival anime: thick sharp contours with harsh stress lines on faces and knuckles, figures dwarfed by colossal walls and cliffs, and taut cable-line motion trails. Carry it through facial stress lines, towering vertical strata, taut cable motion trails, cold slate and olive palette, plunging verticals. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
