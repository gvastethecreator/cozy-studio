visualDna:
  aesthetic: '1980s space-opera cel photography: backlit-cel light effects where pure light shines through cut lines in black, over airbrushed cobalt gradients and inked mechanical forms.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Deep cobalt, ink black and ivory with warm gold, plus one saturated backlit accent that burns almost white at its core.
  lighting_and_shadow: Backlit glow lines with halation bleeding into the surrounding cel, hard ink shadows, and airbrushed rim highlights sweeping on the diagonal.
  texture_and_material: Airbrushed starfield speckle, smooth cel paint, and faint dust and grain from optical camera photography.
  camera_and_composition: Keep the requested view; arrange glow lines and highlights along strong diagonals that sweep through the subject.
  atmosphere_and_mood: Operatic grandeur and melancholy, light blazing inside a vast dark.
  rendering_and_quality: Halation around backlit lines, airbrushed gradients, crisp inked mechanics and light film grain; no modern digital bloom.
  key_features: backlit-cel glow lines with halation; airbrushed cobalt gradients; ivory and gold accents; diagonal light sweeps; optical film grain
  creative_brief: "1980s space-opera cel photography: backlit-cel light effects where pure light shines through cut lines in black, over airbrushed cobalt gradients and inked mechanical forms. Carry it through backlit-cel glow lines with halation, airbrushed cobalt gradients, ivory and gold accents, diagonal light sweeps, optical film grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
