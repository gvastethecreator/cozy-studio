visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Avatar: Frontiers of Pandora gameplay
    screenshots: first-person open-world jungle capture with towering alien plants, dense vertical
    traversal, bows, gathering routes, and luminous predator paths. Apply this after prompt X;
    prompt X supplies the subject, action, setting, and intensity while this preset supplies capture
    language, camera grammar, material behavior, playable readability, and finish. Do not recreate
    an exact official level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Avatar: Frontiers of
    Pandora-adjacent game screenshot subject: keep clear role silhouette, player/enemy/object
    function, scale relationship, hitbox-like readability, and interaction affordances without
    copying source characters or named IP elements.
  color_and_tone: >-
    Use a Avatar: Frontiers of Pandora-informed palette: lush green, cyan bioluminescence, violet
    flowers, blue skin-adjacent accents without copying characters, and warm sun flecks. Keep value
    grouping legible at gameplay distance, with color accents behaving like route, danger, pickup,
    team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through canopy shafts, night-glow plants, wet leaf speculars, distant fire, and
    moonlit mist over traversal routes. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from fibrous bark, translucent leaves, glowing spores, woven gear, mud, water
    beads, and organic alien scale patterns. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with immersive first-person framing with hands, bow, scanning depth, climbable branches,
    and readable foreground-to-canopy route hierarchy. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Avatar: Frontiers of Pandora-derived mood: feral, awe-struck, stealthy, humid, and
    environmentally alive. The preset can become adult, violent, eerie, seductive, cozy, tactical,
    or absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: diegetic first-person HUD is
    allowed: small reticle, stealth markers, compass ticks, and resource pips should stay coherent
    and unobtrusive. Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale,
    and no fake logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Avatar: Frontiers of Pandora gameplay screenshots; first-person open-world jungle capture with
    towering alien plants, dense vertical traversal, bows, gathering routes, and luminous predator
    paths; lush green, cyan bioluminescence, violet flowers, blue skin-adjacent accents without
    copying characters, and warm sun flecks; canopy shafts, night-glow plants, wet leaf speculars,
    distant fire, and moonlit mist over traversal routes; fibrous bark, translucent leaves, glowing
    spores, woven gear, mud, water beads, and organic alien scale patterns; immersive first-person
    framing with hands, bow, scanning depth, climbable branches, and readable foreground-to-canopy
    route hierarchy; feral, awe-struck, stealthy, humid, and environmentally alive; HUD guidance:
    diegetic first-person HUD is allowed: small reticle, stealth markers, compass ticks, and
    resource pips should stay coherent and unobtrusive
  creative_brief: >-
    Use Pandora Jungle First-Person Hunt as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Avatar: Frontiers of Pandora: camera,
    HUD grammar, material language, color coding, encounter readability, and in-engine finish.
    Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters,
    exact levels, and promotional key art.
