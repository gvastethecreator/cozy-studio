visualDna:
  aesthetic: >-
    Digital action graphics with precise grid-like contour breaks, exaggerated but clean value
    separation, and clear depth cues that never dictate the subject’s scale.
  subject_treatment: >-
    Preserve the requested subject and proportions. Clarify its existing geometry with precise
    digital line divisions and bold edge accents; add no giant armor or figure.
  color_and_tone: >-
    Use steel, navy, white, and signal red or cyan in sharply separated blocks; keep the primary
    silhouette distinct from its surroundings.
  lighting_and_shadow: >-
    Use firm cel shadows, crisp rim accents, and controlled luminous bands; make every highlight
    serve form rather than spectacle.
  texture_and_material: >-
    Retain the depicted material with clean digital edge marks, restrained panel-like divisions,
    and minimal surface noise.
  camera_and_composition: >-
    Respect the prompt’s view and scale. Use clear near-to-far value steps and grid-like
    alignment within the established layout.
  atmosphere_and_mood: >-
    Suggest screen-era action energy through clean rhythm, scale cues, and bright accents,
    without adding a city or battle.
  rendering_and_quality: >-
    Use stable ink contours, graphic shadow planes, precise color blocks, and restrained glow;
    keep detail legible at reduced size.
  key_features: >-
    Digital grid contours; clear depth steps; crisp cel shadows; steel, navy, and signal-color
    blocks.
  creative_brief: >-
    Keep the specified subject, setting, and scale. Apply precise digital contours, clear value
    steps, and controlled signal accents; add no giant figure, city, or battle.
