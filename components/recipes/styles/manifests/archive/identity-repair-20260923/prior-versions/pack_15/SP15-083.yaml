visualDna:
  aesthetic: >-
    A precision-mechanical language organized by visible escapement relationships, repeated tooth
    intervals, concentric arcs and measured articulated joints.
  subject_treatment: >-
    Preserve requested identity, proportions, pose, action and part connections. Where the form supports
    it, use regular articulated divisions and repeating intervals without deforming the subject into a
    clock mechanism.
  color_and_tone: >-
    Use warm brass or bronze against dark steel and aged ivory, with restrained enamel accents. Let
    explicit requested colors lead and keep each repeated unit distinct in value.
  lighting_and_shadow: >-
    Honor the requested light direction. Trace existing mechanical edges with narrow highlights and
    define overlap with crisp shadow shapes; add no clock-like glow or new source.
  texture_and_material: >-
    Keep metal, enamel, porcelain or other requested materials distinct. Use fine engraved marks only on
    existing surfaces, with selective wear and no parchment overlay or random gear noise.
  camera_and_composition: >-
    Preserve the requested view and placement. Repeat circles, teeth or stepped intervals only within
    compatible existing geometry; avoid imposing a dial, central axis or radial layout.
  atmosphere_and_mood: >-
    Create measured tension through spacing, repetition and balance. Keep the requested tone and do not
    add a clocktower, guild, strike, ceremony or public assembly.
  rendering_and_quality: >-
    Use precise drawn contours, cleanly separated planes and a controlled alternation of broad forms with
    small mechanical detail. Keep the rhythm readable and avoid microgear clutter.
avoidRules:
  - Do not add a clock face, tower, guild costume, strike poster or assembly unless requested.
  - Avoid dense numerals, microgears and decorative dial overlays.
