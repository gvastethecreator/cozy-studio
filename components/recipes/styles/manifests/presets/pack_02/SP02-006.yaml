visualDna:
  aesthetic: 'Grindhouse exploitation cinema: a battered 1970s release print of a lurid B-movie, full of scratches, cue marks and splice damage.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Faded magenta-red shift, yellowed highlights, crushed blacks, lurid saturated costume accents.
  lighting_and_shadow: Cheap colored gels and harsh single lamps; shadows muddy from print decay.
  texture_and_material: Vertical scratches, dust flecks, a round cue mark in a corner, gate weave and a heavy grain storm.
  camera_and_composition: Crash zooms and low-budget framing; props and sets slightly too visible as props.
  atmosphere_and_mood: Sleazy and gleeful, cheap thrills projected too many times.
  rendering_and_quality: Worn release-print damage in the image itself; no title cards or readable text.
  key_features: print scratches and cue marks; magenta color shift; heavy grain; cheap gel lighting; lurid props
  creative_brief: "Grindhouse exploitation cinema: a battered 1970s release print of a lurid B-movie, full of scratches, cue marks and splice damage. Carry it through print scratches and cue marks, magenta color shift, heavy grain, cheap gel lighting, lurid props. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
