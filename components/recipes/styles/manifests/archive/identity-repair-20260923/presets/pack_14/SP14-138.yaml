visualDna:
  aesthetic: >-
    Strong value breaks divide continuous forms into a few unequal angular masses. Sharp directional
    changes create tension while preserving the subject as a whole.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: Preserve requested hues; emphasize contrast between adjacent broad values without forcing monochrome.
  lighting_and_shadow: >-
    Translate the requested light into hard-edged planes and compressed shadow groups. Do not invent ice,
    lightning or rim sources.
  texture_and_material: >-
    Use drawn value fractures rather than actual cracks, scars or shattered materials. Keep metal, skin,
    fabric and stone distinct when present.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Align angular divisions with existing
    form changes; preserve anatomy and avoid moving parts into a collage.
  atmosphere_and_mood: Taut and decisive without requiring battle, cold weather or a tragic story.
  rendering_and_quality: >-
    Keep a limited number of strong breaks and quiet interior surfaces; avoid a low-poly mesh over the
    whole image.
avoidRules:
  - physical cracks or scars
  - all-over triangulation
  - fragmented anatomy
