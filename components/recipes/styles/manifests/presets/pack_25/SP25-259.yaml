visualDna:
  aesthetic: 'Seamless Tile Proof: one pattern tile shown alone, as a 4 by 4 mosaic and as enlarged seam strips, so the repeat can be judged.'
  subject_treatment: Show the prompt's pattern tile alone, as a 4 by 4 mosaic and as enlarged horizontal and vertical seam strips, the tile itself unchanged.
  color_and_tone: Pattern colors untouched, any review marks kept on a separate layer.
  lighting_and_shadow: Flat presentation with nothing added over the joints.
  texture_and_material: Original resolution and tile edges kept intact for close inspection.
  camera_and_composition: Single tile, 4 by 4 mosaic and seam strips in one tidy sheet.
  atmosphere_and_mood: A critical reading of close continuity and distant rhythm.
  rendering_and_quality: Clean sheet where seams and repeating hot spots are easy to see.
  creative_brief: "Seamless Tile Proof: one pattern tile shown alone, as a 4 by 4 mosaic and as enlarged seam strips, so the repeat can be judged. Carry it through single tile, 4 by 4 mosaic, seam strips, unchanged tile. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: single tile; 4 by 4 mosaic; seam strips; unchanged tile
