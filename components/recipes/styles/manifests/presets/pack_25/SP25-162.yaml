visualDna:
  aesthetic: 'Typographic Pressure Fields: type and space squeeze tightly around one focal point and then release into open air, reading intact.'
  subject_treatment: Compress and release space around the prompt's focal subject through typographic relationships, every requested word and character exact and legible.
  color_and_tone: Strong text contrast on a sober ground with one accent at the pressure point.
  lighting_and_shadow: Light only on existing imagery, the type kept flat, crisp and sharp.
  texture_and_material: Clean letter edges with no texture hiding the compression.
  camera_and_composition: One dense area against one open region, lines deformed unevenly.
  atmosphere_and_mood: Spatial tension and release, energetic but never chaotic.
  rendering_and_quality: Crisp typographic poster where the exact copy stays readable.
  creative_brief: "Typographic Pressure Fields: type and space squeeze tightly around one focal point and then release into open air, reading intact. Carry it through squeezed type, open release zone, one pressure point, exact copy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: squeezed type; open release zone; one pressure point; exact copy
