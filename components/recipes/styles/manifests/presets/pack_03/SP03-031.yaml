visualDna:
  aesthetic: 'Global illumination lighting: light bouncing between surfaces so shadows fill softly and colors bleed from one surface to the next.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Natural gradients, warm or cool bounce tinting nearby surfaces, gentle contrast.
  lighting_and_shadow: One main source plus multiple indirect bounces; open soft shadows, darkening only in tight corners.
  texture_and_material: Materials read clearly in both lit and bounced areas; no crushed blacks.
  camera_and_composition: Keep the requested framing; interiors and enclosed spaces show the bounce best.
  atmosphere_and_mood: Calm and natural, a space breathing with soft reflected light.
  rendering_and_quality: Fully converged multi-bounce render, never a flat constant ambient fill.
  key_features: multi-bounce indirect light; color bleeding; soft open shadows; darker tight corners; natural gradients
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Global Illumination as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the geometry
  - adding a new environment
  - adding fog the preset does not own
  - readable text
  - logo
  - direct flash
  - harsh shadows
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - flat lighting
  - random glow overlay
  - crushed black
  - no shadow logic
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
