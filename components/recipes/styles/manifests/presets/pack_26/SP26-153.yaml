  aesthetic: 'Hugo Pratt page look of the 1960s to 1980s: loose sensual brush ink, big empty skies and seas, sparse watercolor washes, sailors, islands and romantic twentieth-century adventure.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in loose sensual brush ink with open sea and sky washes around it. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Sparse watercolor washes of ocean blue, sand and faded red.
  lighting_and_shadow: Bright open sea light left as white paper.
  texture_and_material: Watercolor paper with loose brush ink and soft wash blooms.
  camera_and_composition: Wide open horizon panels with small figures, framed the way Hugo Pratt composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with romantic wandering fatalism.
  rendering_and_quality: Faithful Pratt watercolor adventure page, in the recognizable hand of Hugo Pratt.
  creative_brief: 'Hugo Pratt page look of the 1960s to 1980s: loose sensual brush ink, big empty skies and seas, sparse watercolor washes, sailors, islands and romantic twentieth-century adventure. Carry it through Pratt loose brush ink, open sea washes. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
