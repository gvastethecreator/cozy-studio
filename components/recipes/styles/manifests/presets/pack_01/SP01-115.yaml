visualDna:
  aesthetic: 'Hard-light glass still life: a small hard spotlight shining through glass or liquid so the object throws bright caustic patterns and colored shadows onto a pale surface.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Pale paper or stone ground; caustics in amber, green or ruby from the glass color.
  lighting_and_shadow: One hard low spot from behind or the side, long shadow and a bright focused caustic pool inside it.
  texture_and_material: Cut glass facets, liquid meniscus, bubbles and refraction lines crisp.
  camera_and_composition: Low angle so the object and its cast caustic shadow share the frame, generous empty surface.
  atmosphere_and_mood: Quiet and luminous, light itself becoming the ornament.
  rendering_and_quality: Real photographic caustics; not a CGI material render.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Hard-Light Glass Still Life as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: hard spot through glass; caustic light pool; colored cast shadow; pale ground; low angle
