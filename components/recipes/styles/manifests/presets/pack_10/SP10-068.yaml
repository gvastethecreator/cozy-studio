visualDna:
  aesthetic: 'Topographic map: the subject described by contour lines and elevation tints.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is drawn as nested contour lines with hypsometric tints."
  color_and_tone: Contour browns with elevation greens and tans, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Paper map with contour lines, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Exploratory, calm, precise and geographic, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  key_features: nested contours; elevation tints; illustrative only
  creative_brief: "Topographic map: the subject described by contour lines and elevation tints. Carry it through nested contours, elevation tints, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - readable text
