visualDna:
  aesthetic: 'Motion light trails: a slow shutter while lit things move, so torches, lanterns and lamps leave glowing streaks behind them.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Warm or colored streaks against dark blue night, sharp static surroundings.
  lighting_and_shadow: Moving practical lights leave continuous trails; static scene lit by ambient.
  texture_and_material: Smooth ribbons of light, faint ghosted figures carrying them.
  camera_and_composition: Keep the requested framing; the trails trace the path of movement.
  atmosphere_and_mood: Flowing and ceremonial, movement written in light.
  rendering_and_quality: Clean long-exposure trails; handheld light drawing belongs to pack_01 Light Painting.
  key_features: trails from moving practical lights; ghosted carriers; sharp static surroundings; dark blue night; flowing paths
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Motion Light Trails as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
