visualDna:
  aesthetic: 'In-game screenshot look informed by Cloudpunk gameplay: voxel cyberpunk delivery capture with hovercars, stacked city canyons, rain, apartment lights, and readable route beacons. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Cloudpunk-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Cloudpunk-informed palette: deep blue night, orange windows, cyan signage, magenta haze,
    black rain, and voxel-lit road strips. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through neon bloom, headlight cones, window grids, rainy reflections, and
    distant smog glow. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from voxel buildings, hovercar panels, wet platforms, delivery crates, glass
    towers, and pixel-like city clutter. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person hover vehicle or pedestrian view with vertical city layers, route
    marker, landing pads, and delivery-path clarity. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: 'Cloudpunk-derived mood: melancholy, urban, rainy, work-shift cyberpunk, and vertical; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: delivery objective, minimap,
    vehicle status, and route markers can appear when consistent with courier gameplay. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Cloudpunk gameplay screenshots; voxel cyberpunk delivery capture with hovercars, stacked city
    canyons, rain, apartment lights, and readable route beacons; deep blue night, orange windows,
    cyan signage, magenta haze, black rain, and voxel-lit road strips; neon bloom, headlight cones,
    window grids, rainy reflections, and distant smog glow; voxel buildings, hovercar panels, wet
    platforms, delivery crates, glass towers, and pixel-like city clutter; third-person hover
    vehicle or pedestrian view with vertical city layers, route marker, landing pads, and
    delivery-path clarity; melancholy, urban, rainy, work-shift cyberpunk, and vertical; HUD
    guidance: delivery objective, minimap, vehicle status, and route markers can appear when
    consistent with courier gameplay
  creative_brief: "Cloudpunk Crystal Metro Hoverline: in-game screenshot language informed by Cloudpunk, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
