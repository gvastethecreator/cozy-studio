visualDna:
  aesthetic: >-
    Painterly forms use confident medium-scale brushwork, weighty volume and a deliberate mix of soft
    edges with precise accents.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify secondary detail while keeping
    the subject's defining shapes and features recognizable.
  color_and_tone: >-
    Preserve the requested hues and relationships, organizing them into a cohesive palette with clear
    contrast rather than imposing a fixed adventure-color scheme.
  lighting_and_shadow: >-
    Follow the requested illumination and model volume with broad painted transitions; do not add danger,
    dramatic effects or an unsupported light source.
  texture_and_material: >-
    Show medium-scale brush texture selectively and retain the depicted materials; combine painted edges
    with a few precise accents instead of a uniform ink outline.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Edge softness changes rendering, not
    the arrangement or visual hierarchy of the scene.
  atmosphere_and_mood: >-
    Keep the requested setting and emotional tone. A painterly finish does not imply a story genre or
    additional narrative detail.
  rendering_and_quality: >-
    Build large forms and value structure before smaller accents; keep the brushwork visible but controlled
    so the image remains legible at reduced size.
avoidRules:
  - unrequested weapons, danger or narrative cues
  - extra details that alter identity or function
