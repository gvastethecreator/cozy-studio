visualDna:
  aesthetic: >-
    Use curved fine contours, pastel gouache glaze and lace-like edge rhythm to soften existing
    forms; do not add flowers, ribbons or sparkle props.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use softly layered pastel colors
    with enough value contrast to keep forms clear; honor requested dark or saturated palettes.
  lighting_and_shadow: >-
    Favor diffused light and gentle edge bloom only when consistent with the prompt's lighting.
  texture_and_material: >-
    Combine fine ink contours, translucent gouache and light paper tooth; keep the depicted material
    identifiable.
  camera_and_composition: >-
    Let soft curves guide the eye through the given layout; preserve crop, pose and structural
    detail.
  atmosphere_and_mood: >-
    Storybook softness is a surface quality, not a requirement for innocence or a happy ending.
  rendering_and_quality: >-
    Apply the soft rendering to any subject and mood without adding a fairy, flower, ribbon, costume
    or storybook scene. Keep important silhouettes and joins legible; no watermark, unrequested text
    or interface.
  key_features: >-
    Curved contour; pastel gouache glaze; lace-like edge rhythm; soft light; fine paper tooth.
  creative_brief: >-
    Apply this visual treatment to the requested content: Curved contour; pastel gouache glaze;
    lace-like edge rhythm; soft light; fine paper tooth. Preserve its identity, action, materials,
    composition and requested tone; introduce no persona, scene, franchise cue or extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - hard unmodulated edges cutting through gouache glaze
  - plastic sheen obscuring paper and pigment texture
  - contour loss obscuring subject identity
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-108.webp
attributes:
