  aesthetic: 'Intaglio: engraved plate print with raised ink lines and plate mark.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is an engraved intaglio print with raised ink lines and plate mark."
  color_and_tone: Black or sepia ink on cream, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Raised ink lines and plate impression, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at a glance.
  atmosphere_and_mood: Classical, precise, precious and formal, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Intaglio: engraved plate print with raised ink lines and plate mark. Carry it through raised engraved lines, plate mark, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
