  lighting_and_shadow: Bright Technicolor cartoon light, lit the way Tex Avery lights its scenes.
  texture_and_material: Hand-inked cel over painted background, slight film grain.
  camera_and_composition: Wild take close-ups and fourth-wall gags, framed the way Tex Avery composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with manic slapstick frenzy.
  rendering_and_quality: Faithful forties theatrical cartoon frame, in the recognizable hand of Tex Avery.
