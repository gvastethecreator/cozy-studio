visualDna:
  aesthetic: >-
    Source-informed video-game style router for original class-based team shooter captures: stylized
    first-person combat, readable team colors, chunky industrial bridge geometry, control-point
    pressure, projectile arcs, and comedy-violent arena clarity. Borrow the bold readability of Team
    Fortress-like games, but land as a different fictional class shooter with different silhouettes,
    props, UI icons, and map architecture.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable class-shooter screenshot subject:
    keep clear class/object role, team spacing, objective pressure, projectile/hit readability,
    cover affordance, and first-person scale without copying source classes or maps.
  color_and_tone: >-
    Use a stylized team-shooter palette: warm red, workwear blue, dusty tan, black metal, cream
    signage shapes without text, muzzle orange, and clean shadow groups. Keep value grouping legible
    and avoid military realism.
  lighting_and_shadow: >-
    Light the image through baked midday light, muzzle flashes, rocket trails, objective glow, and
    soft cartoon shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from painterly industrial props, wood planks, metal bridges, team-color panels,
    simple weapons, and exaggerated character shapes without copying cast. Materials should feel
    like in-engine game assets captured during play, with enough texture identity to separate props,
    terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person weapon/tool camera, bridge or control-point route, allies/enemies
    spaced around cover, projectile arcs, and one clear push/defend decision. Avoid isometric
    strategy or tactical overview.
  atmosphere_and_mood: >-
    Carry an original class-clash mood: competitive, comic, industrial, tactical, noisy, and highly
    readable.
  rendering_and_quality: >-
    Finish as coherent first-person stylized team-shooter screenshot style, not concept art:
    health/ammo/objective icons can appear abstract and non-readable. Maintain heavy-denoise
    clarity, crisp silhouettes, no exact class silhouettes, and no readable objective text.
  key_features: >-
    Team Fortress 2 gameplay screenshots; stylized team-shooter capture with bold silhouettes,
    capture-point geometry, class-based spacing, and readable red-vs-blue battlefield color;
    industrial red, worksite blue, dusty tan, black shadows, white UI blocks, and orange explosion
    pops; baked midday light, muzzle flashes, rocket trails, objective glow, and soft cartoon
    shadows; painterly industrial props, wood planks, metal bridges, team-color panels, simple
    weapons, and exaggerated character shapes without copying cast; first-person or spectator
    capture with objective point, team lanes, projectile arcs, and compact team HUD; competitive,
    comic, industrial, tactical, and readable; HUD guidance: class shooter HUD is allowed: health,
    ammo, capture meter, kill feed shape, and team indicators should be era-coherent
  creative_brief: >-
    Use Class Clash Bridge Control as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through class-based team shooter references: first-person camera,
    team-color readability, chunky bridge geometry, projectile clarity, and control-point pressure.
    Avoid direct Team Fortress cloning, strategy-tactics framing, exact class silhouettes, and
    readable UI text.
