visualDna:
  aesthetic: 'Bubble wrap: clear plastic sheet with rows of air cells wrapped over the target.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is wrapped in or made of clear bubble wrap with visible air cells."
  color_and_tone: Clear with bright highlights on each bubble, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Bright light making bubbles glint, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Bubble wrap with air cells, creases and tape, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Playful, protective, absurd and light, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: bubble wrap cells; glinting highlights; wrapped folds
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bubble Wrap as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - replacing the target with the source product
  - flat plastic
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
