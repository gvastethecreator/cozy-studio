visualDna:
  aesthetic: 'Kawaii pastel: super-cute mascot style with round shapes, blushing cheeks and soft pastel colors.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: redrawn as a round mascot with big shiny eyes, tiny mouth, blush marks and soft thick outlines."
  color_and_tone: Pastel pink, mint, baby blue and lavender, used consistently across subject and background.
  lighting_and_shadow: Soft flat light with small sparkles, expressed through the style rather than photographic lighting.
  texture_and_material: Smooth flat color with soft outlines, visible at card size as the signature of the style.
  camera_and_composition: Centered mascot with sparkles and small props, arranged so the subject still reads at card size.
  atmosphere_and_mood: Adorable, sweet, cheerful and soft, driven by the construction, color and rhythm.
  rendering_and_quality: Clean vector-like illustration, with clean, deliberate marks and no accidental noise.
  key_features: round mascot; blush marks; big eyes; pastel palette; sparkles
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Kawaii Pastel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
