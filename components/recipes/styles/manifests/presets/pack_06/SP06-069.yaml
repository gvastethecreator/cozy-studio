visualDna:
  aesthetic: 'Moodboard color story: cropped images of the subject beside fabric swatches, paint chips and material samples, all tuned to one small palette.'
  subject_treatment: Keep the prompt subject as the hero of the arrangement with its identity, clothing and anatomy unchanged; this preset owns a gridded or overlapping moodboard of crops, swatches and material samples that share one palette.
  color_and_tone: Four or five colors repeated across every tile; unlabeled paint chips state the palette explicitly.
  lighting_and_shadow: Even soft daylight with small, consistent shadows under physical swatches.
  texture_and_material: Linen, wool, brass, clay, stone or leather samples next to matte photo crops and blank paint chips.
  camera_and_composition: Top-down board of six to nine tiles; one large crop of the subject anchors the grid, details and swatches orbit it.
  atmosphere_and_mood: Considered and calm, a mood distilled into color and touch.
  rendering_and_quality: Crisp tile edges, accurate material textures and a palette obvious at thumbnail size; no captions.
  key_features: six to nine tiles; paint chips; fabric swatches; material samples; one shared palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Moodboard Color Story as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
