visualDna:
  aesthetic: 'Sports action photography: a 300–400 mm telephoto at f/2.8 and 1/2000 s freezing the peak instant of an effort.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Clean vivid color on the athlete, background dissolved into soft color blocks.
  lighting_and_shadow: Hard daylight or stadium floods from above; sweat and flying material catch bright specular highlights.
  texture_and_material: Frozen dust, sand, water, splinters and sweat drops hanging around the body; fabric rippled by force.
  camera_and_composition: Tight telephoto crop on the peak of action, compressed background, crowd or landscape reduced to blur, eye contact or strain visible.
  atmosphere_and_mood: Explosive and strained, the body at maximum effort held still for one frame.
  rendering_and_quality: Razor-sharp subject against creamy telephoto blur, no motion smear on the athlete.
  key_features: telephoto freeze at peak action; compressed blurred background; flying debris frozen; strained faces; hard top light
  creative_brief: "Sports action photography: a 300–400 mm telephoto at f/2.8 and 1/2000 s freezing the peak instant of an effort. Carry it through telephoto freeze at peak action, compressed blurred background, flying debris frozen, strained faces, hard top light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
