visualDna:
  aesthetic: >-
    Islamic Geometric becomes a transferable geometric abstraction system: start from Tessellated
    star pattern and Radial symmetry, then route prompt content through planes, grids, vectors,
    optical order, and deliberate formal reduction without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Interlaced lines to break, flatten,
    triangulate, align, tessellate, or rotate forms while keeping the prompt subject legible;
    preserve anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Gold, Blue, Turquoise; treat color as structural contrast, field
    separation, and rhythm rather than decorative wash, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: keep light graphic and structural, with shadows simplified
    into value blocks or optical pressure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Tile, mosaic as the tactile or mark-making basis; surfaces should read as designed
    planes, ink, paint, paper, tile, or digital geometry, not pasted texture, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Radial symmetry as reusable spatial grammar: favor axial tension, repeated
    modules, negative space, cropped planes, and deliberate balance or imbalance, adapting cleanly
    to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Divine, orderly as the emotional register; derive mood from rigor, optical tension,
    intellectual order, and abstraction pressure, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Sacred geometry, precise: finish with crisp geometry, controlled edges, clean
    separations, and no accidental realism, preserving prompt X as the base content and the preset
    as the style router.
  key_features: >-
    Tessellated star pattern; Interlaced lines; Gold, Blue, Turquoise; Flat; Tile, mosaic; Radial
    symmetry; Divine, orderly; Sacred geometry, precise; Radial symmetry
  creative_brief: >-
    Apply Islamic geometric order to the input: star lattices, interlocking tessellations, radial
    symmetry, and disciplined repetition should turn any subject into devotional pattern logic
    without requiring architecture.
avoidRules:
  - figurative
  - random
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
