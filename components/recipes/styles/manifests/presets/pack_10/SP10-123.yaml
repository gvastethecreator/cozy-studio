  atmosphere_and_mood: Earthy, fiery, random and beautiful, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Raku glaze: crackled white glaze with smoky black craze lines and metallic flashes. Carry it through raku crackle, smoky lines, copper flash, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
