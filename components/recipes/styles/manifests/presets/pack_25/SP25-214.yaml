visualDna:
  aesthetic: 'Chromatic Section Coding: each section of the publication marked by one color and a redundant marker in a stable position.'
  subject_treatment: Mark each section of the prompt's publication with one color plus a redundant shape marker and title in a stable place, every section name exact.
  color_and_tone: One color per section within a limited palette, titles carrying meaning without color.
  lighting_and_shadow: Flat layout with constant source image light in every section.
  texture_and_material: Clean ink and a sober support, the same finish for every section.
  camera_and_composition: Markers in stable positions and section changes clearly flagged.
  atmosphere_and_mood: Orientation and continuity, varied sections that still share one identity.
  rendering_and_quality: Crisp publication whose sections still read in greyscale.
  creative_brief: "Chromatic Section Coding: each section of the publication marked by one color and a redundant marker in a stable position. Carry it through section colors, redundant markers, stable positions, greyscale check. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: section colors; redundant markers; stable positions; greyscale check
