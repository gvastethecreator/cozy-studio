visualDna:
  aesthetic: 'Layer-Window Icons: one controlled opening in the front layer reveals a second layer that completes the metaphor.'
  subject_treatment: Cut one opening into the prompt's subject so it reveals a second essential shape behind it, using a single window only.
  color_and_tone: Stable outer layer value with enough contrast for the revealed content.
  lighting_and_shadow: Soft light marking the edge thickness and separating the two layers.
  texture_and_material: Two smooth layers at a moderate distance with coherent contact.
  camera_and_composition: One off-center window cut inside a compact, simple outer shape.
  atmosphere_and_mood: Immediate curiosity followed by a small, contained second reading.
  rendering_and_quality: The metaphor reads with window and content together, no fine detail needed.
  creative_brief: "Layer-Window Icons: one controlled opening in the front layer reveals a second layer that completes the metaphor. Carry it through single window, revealed second layer, off-center opening, two layers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: single window; revealed second layer; off-center opening; two layers
