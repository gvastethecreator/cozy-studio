visualDna:
  aesthetic: >-
    Cozy Sim Seasonal Palette acts as a transferable art-medium router: start from Cozy sim seasonal
    art style with soft pixel warmth, gentle routine energy, and approachable hand crafted charm,
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Make any subject feel small, friendly, useful, and
    collectible through rounded forms and soft edge priorities; preserve the prompt subject while
    routing it through tile readability, icon clarity, splash rendering, interface material, sprite
    bounce, shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose,
    object function, or environment legible.
  color_and_tone: >-
    Build color with Four season palette logic, warm pastels, honeyed highlights, cool morning
    shadows, and low stress contrast; use color as gameplay hierarchy: rarity glow, faction
    contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or readable
    inventory material, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Soft ambient daylight, tiny contact shadows, seasonal color washes, and
    almost no harsh drama; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Gentle pixel grain, quilt like pattern accents, soft organic noise, and tactile handmade
    detail; surface detail should support genre grammar through parchment, HUD glass, pixel atlas
    texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Isometric or icon atlas framing with tidy spacing, cozy negative
    space, and clear modular grouping; compose through gameplay-facing hierarchy, atlas consistency,
    menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen energy, with
    scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Calm, domestic, nurturing mood without requiring farms, crops, animals, houses, or
    seasonal scenery; derive mood from playable stakes, collection desire, tactical control, cozy
    routine, survival dread, arcade speed, or heroic confrontation, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Clean cozy game polish, crisp but soft edged pixels, no visual clutter, no readable
    labels; finish with game-production clarity, strong silhouettes, controlled UI-like detail, and
    no unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Cozy sim seasonal art style with soft pixel warmth, gentle routine energy, and approachable hand
    crafted charm; gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity; Four season palette logic, warm pastels, honeyed
    highlights, cool morning shadows, and low stress contrast; Gentle pixel grain, quilt like
    pattern accents, soft organic noise, and tactile handmade detail; Isometric or icon atlas
    framing with tidy spacing, cozy negative space, and clear modular grouping
  creative_brief: >-
    Apply Cozy Sim Seasonal Palette as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
