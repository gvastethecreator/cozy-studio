name: Applied Design
cardTitle: Applied Design
cardDescription: Logos, icons, interfaces, products, packaging, type, editorial, data, textiles, merch, wayfinding and motion.
description: >-
  Design systems for real deliverables: marks, icon families, app and game interfaces, product
  forms, packaging, campaigns, lettering, publications, information graphics, surface repeats,
  apparel graphics, signage and broadcast styleframes. Requested words, marks and interface
  content stay exact; each style changes construction, not the brief.
