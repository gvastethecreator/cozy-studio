visualDna:
  aesthetic: >-
    Give the drawing upward visual lift through clean silhouettes, ascending diagonals, open
    planes, and gently graded depth.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Small tapers
    may follow existing directional endpoints but cannot imply flight or new movement.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, combine clear cyan or blue,
    fresh green, cream, and warm ochre in breathable fields; preserve the requested palette.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use broad high-key illumination and
    cool-edged shadows only when supported by the stated source; add no halo.
  texture_and_material: >-
    Apply texture only to materials already present. Keep foreground fills clean and let fine
    washes carry only existing distant detail; add no sky or scenery.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Show depth through existing
    scale and value steps, using diagonals already in the arrangement.
  atmosphere_and_mood: >-
    Retain the requested emotional tone; openness is not a demand for wonder or adventure.
  rendering_and_quality: >-
    Keep silhouette edges stable against open fields; avoid glows, extra airborne objects, and
    false depth blur.
  key_features: >-
    Ascending diagonal rhythm; clean silhouettes; open value planes; graded depth.
  creative_brief: 'Use ascending diagonal rhythm; clean silhouettes; open value planes; graded depth. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
