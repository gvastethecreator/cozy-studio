visualDna:
  aesthetic: 'Screen print: flat opaque ink layers pushed through stencils, with slight misregistration, hard shape edges and occasional coarse halftone.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Three to six flat spot colors in bold complementary pairs, overprints creating a third color where layers meet.
  lighting_and_shadow: Light expressed as flat stepped color shapes, with coarse halftone as the only gradient.
  texture_and_material: Thick flat ink with faint squeegee streaks, pinholes and misregistered edges showing slivers of paper.
  camera_and_composition: Keep the requested view with poster-like graphic simplification of every form.
  atmosphere_and_mood: Punchy, bright and loud, confident flat color.
  rendering_and_quality: Clean stencil edges with deliberate misregistration, no brush texture and no photographic detail.
  key_features: flat spot-color layers; misregistration gaps; overprint mixing; coarse halftone; squeegee streaks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Screenprint (Serigraph) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
