visualDna:
  aesthetic: 'Multi-Support Identity Set: one locked identity applied across several different objects at believable scales, symbol and wordmark identical everywhere.'
  subject_treatment: Apply the prompt's locked identity to several different objects, symbol, wordmark and colors identical on each, with believable relative scales.
  color_and_tone: Identity colors constant, backgrounds compatible and never recolored.
  lighting_and_shadow: One common light across the set that favors no single object.
  texture_and_material: Sober materials per object, the print kept apart from the design.
  camera_and_composition: A family composition with believable scales and the mark visible on each.
  atmosphere_and_mood: Identity cohesion and variety of use, a brand coming to life.
  rendering_and_quality: Symbol, wordmark and proportions correspond on every object.
  creative_brief: "Multi-Support Identity Set: one locked identity applied across several different objects at believable scales, symbol and wordmark identical everywhere. Carry it through one identity, many objects, believable scales, identical marks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one identity; many objects; believable scales; identical marks
