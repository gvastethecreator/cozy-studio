visualDna:
  aesthetic: >-
    Build the graphic anime treatment from bold rounded outlines with elastic internal strokes and
    broad, flexible forms with exaggerated curves and clear openings. Let looping arcs that
    stretch and spring back set its rhythm; use clear bright blue, warm red and gold, clean white,
    and dark outlines for color and clean flat color with lightly softened pigment edges for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use bold rounded outlines with elastic internal
    strokes for edge work, broad, flexible forms with exaggerated curves and clear openings for
    form simplification, and looping arcs that stretch and spring back only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with clear bright blue, warm red and gold, clean white, and dark outlines.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: broad pale highlights against clear cel-shadow groups. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean flat color with lightly softened pigment edges, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use roomy visual balance with flexible diagonals and
    generous negative space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey playful openness and generous momentum, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with vivid flat colors, legible outlines, and little small-scale detail; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    bold rounded outlines with elastic internal strokes; broad, flexible forms with exaggerated
    curves and clear openings; clear bright blue, warm red and gold, clean white, and dark
    outlines; looping arcs that stretch and spring back; clean flat color with lightly softened
    pigment edges; roomy visual balance with flexible diagonals and generous negative space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with bold rounded outlines
    with elastic internal strokes, broad, flexible forms with exaggerated curves and clear
    openings, and clear bright blue, warm red and gold, clean white, and dark outlines; use
    looping arcs that stretch and spring back only where movement is already present, and apply
    clean flat color with lightly softened pigment edges as the drawing finish.
