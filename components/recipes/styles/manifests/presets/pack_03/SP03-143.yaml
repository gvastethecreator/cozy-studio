visualDna:
  aesthetic: 'Lidar point cloud render: the scene shown only as millions of tiny points sampled on surfaces, with no meshes, so gaps and scan shadows reveal how it was measured.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Points colored by height or return intensity (blue low to red high, or grey intensity) on a pure black void.
  lighting_and_shadow: No shading at all; density of points carries form, and occluded areas behind objects stay empty as scan shadows.
  texture_and_material: Concentric scan rings on the ground around scanner positions, denser points near the scanner, sparse speckle on far or dark surfaces.
  camera_and_composition: Keep the requested camera; far points thin out and the cloud ends in a ragged edge.
  atmosphere_and_mood: Ghostly and precise, a place reduced to measured dust.
  rendering_and_quality: Screen-space point sprites of uniform size, no surface reconstruction and no soft splat blending.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Lidar Point Cloud Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: millions of tiny points; height or intensity coloring; scan shadows behind objects; concentric ground rings; black void
