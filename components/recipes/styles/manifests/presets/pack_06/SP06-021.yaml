visualDna:
  aesthetic: 'Soft pastel drawing: pure pigment sticks dragged and layered on sanded or velour pastel paper, blended with fingers in places and left as broken strokes in others.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Luminous matte saturated color, strong complementary contrasts, a toned paper color showing between strokes.
  lighting_and_shadow: Glowing light made of layered warm strokes over cool underlayers; shadows kept colorful rather than grey.
  texture_and_material: Powdery pigment clinging to the grit of the paper, broken side-of-stick strokes, finger-blended soft passages, loose dust.
  camera_and_composition: Keep the requested framing; broad blended areas in the background, crisp broken strokes at the focal point.
  atmosphere_and_mood: Soft, velvety and luminous, like light held in powder.
  rendering_and_quality: Dry powdery matte finish with visible stroke breaks on the paper grit; no wet washes and no glossy wax.
  key_features: powdery pigment on gritty toned paper; broken side-of-stick strokes; finger-blended passages; saturated complementary color; matte luminous glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pastel (Soft) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
