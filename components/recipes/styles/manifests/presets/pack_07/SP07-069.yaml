visualDna:
  aesthetic: 'Heat-welded inflatable construction: every form made of rounded PVC pressure tubes and pillowy panels held up by air, with blower hose and valves visible.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Saturated safety red, yellow, blue and green with white panels; glossy and very clean.
  lighting_and_shadow: Bright outdoor sun with long specular streaks along each tube and soft shadows under the bulges.
  texture_and_material: Welded seams, pinched corners, creases where panels meet, taut shine; no twisted-balloon knots.
  camera_and_composition: Keep the requested view; show the subject tethered to the ground so its air-filled weightlessness reads.
  atmosphere_and_mood: Buoyant, loud and slightly absurd, anything can be blown up.
  rendering_and_quality: Photographic PVC material with crisp highlights; distinct from twisted balloon art and from bounce castles.
  key_features: rounded PVC pressure tubes; heat-welded seams; visible blower hose and valves; safety-primary colors; long specular streaks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pressurized Vinyl Playform as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
