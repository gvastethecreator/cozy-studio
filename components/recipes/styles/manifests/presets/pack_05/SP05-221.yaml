visualDna:
  aesthetic: '1980s idol-era mecha cel: airbrushed cyan-pink gradient skies, star-shaped sparkle glints, and looping white vapor-trail ribbons curving around clean inked forms.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Cyan and bubble pink with warm gold edge highlights over clear neutral cel colors; skies are smooth airbrushed gradients.
  lighting_and_shadow: Clean two-tone cel shadows, a gentle gold rim, and four-point star glints on the brightest edges.
  texture_and_material: Airbrushed gradient backgrounds, flat cel paint, faint film grain and the slight color bleed of an old cel.
  camera_and_composition: Keep the requested view; loop white trail ribbons in wide arcs around the subject to lead the eye inward.
  atmosphere_and_mood: Buoyant, affectionate and hopeful, a love song played at full volume.
  rendering_and_quality: Crisp ink line, airbrushed gradients, star glints and ribbon loops with soft film grain; no modern bloom.
  key_features: airbrushed cyan-pink gradient sky; looping white vapor-trail ribbons; four-point star glints; gold rim light; 1980s cel film grain
  creative_brief: "1980s idol-era mecha cel: airbrushed cyan-pink gradient skies, star-shaped sparkle glints, and looping white vapor-trail ribbons curving around clean inked forms. Carry it through airbrushed cyan-pink gradient sky, looping white vapor-trail ribbons, four-point star glints, gold rim light, 1980s cel film grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
