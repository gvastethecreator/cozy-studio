visualDna:
  aesthetic: 'Fractal geometry: self-similar recursive forms repeating at every scale.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is built from recursive self-similar branches, spirals or tiles repeating inward."
  color_and_tone: Deep gradients of blue, violet, gold or fire tones.
  lighting_and_shadow: Glowing edges on recursive forms, expressed through the style rather than photographic lighting.
  texture_and_material: Infinitely detailed recursive branching, visible at a glance as the signature of the style.
  camera_and_composition: Central spiral or branching recursion, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Infinite, mesmerizing, mathematical and cosmic, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp high-detail digital finish, with clean, deliberate marks and no accidental noise.
  key_features: self-similar recursion; infinite branching; glowing gradients
  creative_brief: "Fractal geometry: self-similar recursive forms repeating at every scale. Carry it through self-similar recursion, infinite branching, glowing gradients. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
