  aesthetic: 'Eiichiro Oda One Piece look: rubbery exaggerated anatomy, huge toothy grins, wildly varied character silhouettes, bright ocean adventure and dense joyful detail.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Oda exaggeration, huge grins, long rubbery limbs, wild proportions and bold unique outfits. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Ocean blue, sunny yellow, bright red and tropical green.
  lighting_and_shadow: Bright tropical sun with bold simple shadows and sparkling ocean reflections.
  texture_and_material: Bold confident lines, dense background detail and flat bright color.
  camera_and_composition: Wide adventure compositions, big-grin close-ups and crowded ensemble panels.
  atmosphere_and_mood: Keep the requested mood with joyful boundless adventure.
  rendering_and_quality: Exuberant adventure manga illustration with rubbery exaggeration and dense joyful detail.
  key_features: Eiichiro Oda exaggeration; big grins; rubbery limbs; ocean adventure
  creative_brief: "Eiichiro Oda One Piece look: rubbery exaggerated anatomy, huge toothy grins, wildly varied character silhouettes, bright ocean adventure and dense joyful detail. Carry it through Eiichiro Oda exaggeration, big grins, rubbery limbs, ocean adventure. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
