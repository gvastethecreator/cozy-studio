visualDna:
  aesthetic: '90s scanline render: early computer graphics with Phong and Gouraud shading, hard plastic highlights, no global illumination and few or no shadows.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Saturated flat colors, plastic white highlights, black or gradient sky backgrounds.
  lighting_and_shadow: One or two point lights, hard specular blobs, shadow maps or no shadows at all.
  texture_and_material: Low-resolution textures, faceted polygon edges, checkerboard floors, plastic sheen.
  camera_and_composition: Centered objects, simple sets, wide field of view.
  atmosphere_and_mood: Nostalgic and naive, the first steps of digital worlds.
  rendering_and_quality: Early CG look with visible polygon facets; no modern path tracing.
  creative_brief: "90s scanline render: early computer graphics with Phong and Gouraud shading, hard plastic highlights, no global illumination and few or no shadows. Carry it through Phong plastic highlights, no global illumination, faceted polygons, checkerboard floor, low-res textures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Phong plastic highlights; no global illumination; faceted polygons; checkerboard floor; low-res textures
