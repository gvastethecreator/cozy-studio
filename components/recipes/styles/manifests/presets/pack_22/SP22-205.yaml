visualDna:
  aesthetic: >-
    Printed illustration reduces existing forms to compact color areas and strong silhouettes, with a
    firm dark contour and economical interior drawing.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Simplify into readable
    silhouettes without adding seasonal motifs, flowers, symbols or new subjects.
  color_and_tone: >-
    Keep the requested palette and organize it into a few distinct areas with strong value contrast;
    do not impose a fixed seasonal or cultural color scheme.
  lighting_and_shadow: >-
    Respect the requested light and translate it into concise printed value groups without adding a time
    of day, setting or source.
  texture_and_material: >-
    Use mostly flat printed color with minimal surface texture; do not age the image or change the
    represented material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. The printed treatment does not require
    a deck layout, frame, border or recropping.
  atmosphere_and_mood: >-
    Retain the requested environment and emotional tone; graphic economy does not imply a season, cultural
    story or symbolic theme.
  rendering_and_quality: >-
    Prioritize silhouette and large color regions, then add only interior lines needed to preserve
    identity and function at reduced size.
avoidRules:
  - unrequested seasonal motifs, flowers or symbols
  - unrequested card frames, lettering or badges
  - extra details that alter identity or function
