visualDna:
  aesthetic: "Deconstructed Uniform Lines: organizing lines borrowed from uniforms, shifted, opened and recombined around the garment's existing features."
  subject_treatment: Print open organizing lines that shift around the prompt's garment features like pockets, shoulders and hem, never becoming new seams or real insignia.
  color_and_tone: Neutral base and one localized accent, with no rank or safety color codes.
  lighting_and_shadow: Flat or evenly lit, shadows never faking pockets or flaps.
  texture_and_material: Line graphics and small blocks clearly distinct from the garment build.
  camera_and_composition: Aligned with existing shoulders, pocket and hem, with deliberate breaks.
  atmosphere_and_mood: A deliberately incomplete order that feels sober, calm and functional.
  rendering_and_quality: Clean print with legible lines and the cut left intact.
  creative_brief: "Deconstructed Uniform Lines: organizing lines borrowed from uniforms, shifted, opened and recombined around the garment's existing features. Carry it through shifted uniform lines, deliberate breaks, existing features, sober accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shifted uniform lines; deliberate breaks; existing features; sober accent
