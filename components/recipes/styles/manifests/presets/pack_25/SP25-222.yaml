visualDna:
  aesthetic: 'Woven Data Notation: relationships drawn as paths that pass over and under each other, with open gaps wherever there is no connection.'
  subject_treatment: Draw the prompt's supplied relationships as woven paths that cross over and under with clear gaps at non-connections, every node label exact.
  color_and_tone: Colors per entity or class, each path still traceable without color.
  lighting_and_shadow: Flat notation where crossings are resolved by gaps or small bridges.
  texture_and_material: Constant-width strokes, width changing only for an explicit numeric variable.
  camera_and_composition: Inputs, crossing zone and destinations kept apart with parallel paths spaced.
  atmosphere_and_mood: A rhythm of going and returning, calm long runs and focused crossings.
  rendering_and_quality: Crisp diagram with clean crossings, tangent curves and a complete legend.
  creative_brief: "Woven Data Notation: relationships drawn as paths that pass over and under each other, with open gaps wherever there is no connection. Carry it through woven paths, open non-connections, complete legend, traceable links. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: woven paths; open non-connections; complete legend; traceable links
avoidRules:
  - links implied at crossings
  - arbitrary widths
  - categories with no legend
  - invented values, links or measurements
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
