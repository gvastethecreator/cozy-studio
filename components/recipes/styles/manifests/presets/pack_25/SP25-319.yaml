visualDna:
  aesthetic: 'Multi-Screen Rhythm Layout: one composition spread across several screens of declared sizes, each with a complete message.'
  subject_treatment: Spread the prompt's composition across screens of declared sizes and gaps, the essential text complete on at least one screen and exact.
  color_and_tone: A shared palette with contrast adapted to each screen.
  lighting_and_shadow: Each screen with its own flat render and no fake calibration.
  texture_and_material: Sharp digital content with bezels and gaps shown as dead space.
  camera_and_composition: Global and local coordinates declared and dead zones excluded.
  atmosphere_and_mood: A coordinated rhythm across surfaces with shared pauses.
  rendering_and_quality: Clean overall view plus separate crops per screen.
  creative_brief: "Multi-Screen Rhythm Layout: one composition spread across several screens of declared sizes, each with a complete message. Carry it through several screens, declared gaps, complete message, global view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: several screens; declared gaps; complete message; global view
