visualDna:
  aesthetic: 'Water-gilded panel: loose gold leaf laid over red bole on gesso, burnished and tooled, with the subject painted in flat matte egg tempera or ink.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Burnished gold fields against matte black, deep red bole showing through cracks, limited earth and lapis accents.
  lighting_and_shadow: Gold flares bright or dark with viewing angle; painted areas are flat and shadowless.
  texture_and_material: Leaf seams and tiny gaps, punched and incised tooling patterns in halos and borders, crackle showing red bole, matte tempera strokes.
  camera_and_composition: Keep the requested view; gold fills the background or haloes the subject, painted forms flat against it.
  atmosphere_and_mood: Rich and reverent, ornament as a sign of value.
  rendering_and_quality: Genuine metallic leaf behavior with tooling and seams; no yellow paint pretending to be gold.
  key_features: gold leaf on red bole; punched tooling; burnished glints; matte tempera figures; crackle
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gold Leaf Art as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
