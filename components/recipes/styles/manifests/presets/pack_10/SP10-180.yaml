visualDna:
  aesthetic: 'Pearlescent ink: printed artwork with shimmering mother-of-pearl ink.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is printed in pearlescent ink that shifts color with angle."
  color_and_tone: Pearl white, pale pink and blue shimmer, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Pearlescent ink sheen, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Delicate, dreamy, luxurious and soft, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Pearlescent ink: printed artwork with shimmering mother-of-pearl ink. Carry it through pearlescent shimmer ink, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
