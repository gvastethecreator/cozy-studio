visualDna:
  aesthetic: 'Ordered clusters of thin marks alternate with open flat color areas, giving the drawing a dense but controlled working rhythm.'
  subject_treatment: 'Retain the exact prompted forms and action; concentrate detail on surfaces already present and add no clutter or participants.'
  color_and_tone: 'Use a disciplined base with a small number of brighter accents; keep explicit colors and maintain clear separation.'
  lighting_and_shadow: 'Keep one coherent light direction and simple contact shadows; avoid urgency lighting or a time-of-day cue.'
  texture_and_material: 'Vary density through short repeated strokes and clean patches; marks follow described surfaces and never introduce new content.'
  camera_and_composition: 'Preserve view, crop, scale, spacing, and count; create dense-to-open rhythm within the layout without panels or camera movement.'
  atmosphere_and_mood: "Keep the prompt's mood; organized detail density does not prescribe an emotional state."
  rendering_and_quality: 'Separate detailed and quiet areas decisively; keep contours legible and avoid scribbles that resemble text.'
  key_features: 'Alternating dense and open mark fields; ordered thin strokes; restrained bright accents; coherent shadows; crisp boundaries.'
  creative_brief: "Vary detail density across existing forms to create a deliberate working rhythm. Preserve content and camera; add no new content or frame marks. Use it as a reusable look on any subject."
