visualDna:
  aesthetic: 'Neon megacity environment render: towering stacked blocks lit by hundreds of emissive sign panels, sky bridges and haze layers receding into a lit night fog.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies a vertical neon megacity at night: stacked residential blocks, sky bridges and glowing sign panels; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Magenta, cyan and violet emissives against blue-black shadow; warm sodium accents at street level; highlights bloom, darks stay deep.
  lighting_and_shadow: Emissive sign panels are the only key lights, each spilling a colored pool; no sun or moon, and shadows fill with the neighbouring color.
  texture_and_material: Rain-slick metal and glass catching stretched neon reflections, grimy concrete, cable bundles and steam vents; sign panels show abstract glyph shapes, never letters.
  camera_and_composition: Keep the requested camera; depth is built from three or more haze layers so the far blocks fade into glowing fog.
  atmosphere_and_mood: Crowded, humid and lonely at once, a city too tall to see the sky.
  rendering_and_quality: Real-time volumetric fog with bloom and screen-space reflections; emissive panels read as light sources, not flat stickers.
  key_features: emissive sign panels as key lights; stacked haze layers; stretched neon reflections; no sun; glyph shapes without letters
  creative_brief: "Neon megacity environment render: towering stacked blocks lit by hundreds of emissive sign panels, sky bridges and haze layers receding into a lit night fog. Carry it through emissive sign panels as key lights, stacked haze layers, stretched neon reflections, no sun, glyph shapes without letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
