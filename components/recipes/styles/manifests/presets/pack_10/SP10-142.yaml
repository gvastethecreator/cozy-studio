visualDna:
  aesthetic: 'Treasure map: hand-drawn parchment map with dotted paths, X marks and sea monsters.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is drawn as a landmark on a hand-drawn treasure map."
  color_and_tone: Sepia ink on aged parchment, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Stained parchment, ink, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Adventurous, playful, antique and mysterious, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Treasure Map as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: dotted path; X mark; aged parchment; illustrative only
