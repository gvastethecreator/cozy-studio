visualDna:
  aesthetic: 'Arcade racing art direction: glossy vehicles and streaking neon light trails pulled toward a vanishing point at exaggerated speed.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: Saturated magenta, cyan and orange light trails against deep blue dusk or night; glossy reflections everywhere.
  lighting_and_shadow: Neon and headlight streaks, bloom on every light source, bright specular sweeps across curved bodies.
  texture_and_material: Mirror-glossy paint, wet-look reflective road, motion-streaked scenery and sparks.
  camera_and_composition: Keep the requested view; favor a low wide angle with strong vanishing-point pull and diagonal lanes.
  atmosphere_and_mood: Euphoric and fast, speed felt as color.
  rendering_and_quality: Sharp subject against radial motion streaks; no brand badges or signage text.
  key_features: neon light trails; low wide angle; vanishing-point pull; glossy reflections; radial motion streaks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Arcade Racing Velocity Neon as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
