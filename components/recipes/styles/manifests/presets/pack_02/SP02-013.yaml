    exploitation underexposure, or analog animation glow, so exposure and shadow structure support
    the media process without overwriting the requested content.
  texture_and_material: >-
    Render Digital clean, noise-free, slick compositing; surface detail should reveal film grain,
    gate weave, scratches, halation, acetate texture, projection damage, optical compositing, or
    photographed production surfaces, keeping artifact scale coherent and avoiding noisy filler
