visualDna:
  aesthetic: >-
    Hyper-observational surface drawing: hairline contours and highly localized tactile detail
    fall quickly into soft painted surroundings.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Reserve fine
    detail for already prominent areas and do not create a close-up.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor cool blue-gray and
    green with narrow amber notes; retain supplied colors and reflectivity.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow existing sources; limit small
    reflections to materials already reflective and keep other surfaces matte.
  texture_and_material: >-
    Apply texture only to materials already present. Concentrate granular strokes on the current
    focal material; add no droplets, wet sheen, or absent texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Let detail fall off around
    the existing focal point without changing camera distance.
  atmosphere_and_mood: >-
    Preserve requested mood; intimacy means a fine-to-soft detail range, not a relationship.
  rendering_and_quality: >-
    Keep focal edges crisp, surrounding marks subdued, and avoid artificial depth blur over
    requested elements.
  key_features: >-
    Hairline contour; localized micro-detail; cool blue-gray field; fast detail falloff.
  creative_brief: 'Use hairline contour; localized micro-detail; cool blue-gray field; fast detail falloff. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
