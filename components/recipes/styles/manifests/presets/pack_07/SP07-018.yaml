visualDna:
  aesthetic: 'Farmhouse chic interior: painted shiplap and board-and-batten walls, reclaimed barn beams, sliding barn doors on black strap rails, and practical country furniture freshened with white.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Warm white and cream walls, weathered grey-brown barn wood, black iron, galvanized steel, sage and soft blue accents; bright and airy.
  lighting_and_shadow: Bright soft daylight from multi-pane windows, black iron pendants, clean shadows along horizontal shiplap lines.
  texture_and_material: Tongue-and-groove shiplap, reclaimed beams with nail holes, galvanized buckets and tubs, black strap hinges, washed linen, butcher-block tops.
  camera_and_composition: Keep the requested view; horizontal shiplap lines leading the eye, one exposed beam across the top of the frame.
  atmosphere_and_mood: Fresh, practical and welcoming, country work made pretty.
  rendering_and_quality: Bright lifestyle photograph with honest wood grain and iron texture, no TV-show farmhouse sign clichés.
  key_features: painted shiplap walls; reclaimed barn beams; sliding barn door on black rail; galvanized steel; washed linen
  creative_brief: "Farmhouse chic interior: painted shiplap and board-and-batten walls, reclaimed barn beams, sliding barn doors on black strap rails, and practical country furniture freshened with white. Carry it through painted shiplap walls, reclaimed barn beams, sliding barn door on black rail, galvanized steel, washed linen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
