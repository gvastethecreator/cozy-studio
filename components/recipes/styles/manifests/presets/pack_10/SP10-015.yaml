visualDna:
  aesthetic: >-
    Mycelium Network becomes a transferable fluid and organic behavior system: start from Fungal
    roots, Web pattern, and Branching, then route prompt content through flow, branching, cellular
    membranes, diffusion, turbulence, and living surface logic without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Webbing to bend, pool, branch, bloom, spike,
    foam, or dissolve forms while preserving the prompt intent; preserve anatomy, object identity,
    or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from White, earthy; let hues follow fluid thickness, chemical bloom,
    interference, biological growth, or vapor density, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Subsurface scattering drive the light response: use reflection, translucency, subsurface
    scattering, glow, or backlit edges to reveal fluid structure, avoiding generic glamour lighting
    unless the prompt explicitly asks for it.
  texture_and_material: >-
    Render Fuzzy, organic as the tactile or mark-making basis; surfaces need coherent viscosity,
    membranes, droplets, filaments, bubbles, grains, or particulate fields, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Branching as reusable spatial grammar: favor flow direction, cellular repetition,
    eddies, radial forces, tendrils, and macro-to-wide scalability, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Connected, growth as the emotional register; derive mood from instability, growth, toxicity,
    delicacy, pressure, and organic motion, without flattening strong, strange, darker, or adult
    prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Nature, macro: finish with clean fluid physics, readable boundaries, and restrained
    micro-noise, preserving prompt X as the base content and the preset as the style router.
  key_features: >-
    Fungal roots; Webbing; White, earthy; Subsurface scattering; Fuzzy, organic; Branching;
    Connected, growth; Nature, macro; Web pattern
  creative_brief: >-
    Apply mycelium-network logic to the input: branching white filaments, nutrient-web connectivity,
    porous organic nodes, and subterranean softness should link forms into living fungal
    communication without requiring soil or forest.
avoidRules:
