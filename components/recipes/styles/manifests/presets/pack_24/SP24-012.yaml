visualDna:
  aesthetic: 'Breathing wallpaper damp: old rooms whose floral wallpaper is swollen with damp, stains spreading into shapes and the pattern seeming to shift when unobserved.'
  subject_treatment: Place the prompt's subject in a damp room of stained floral wallpaper, keeping it clear while the walls feel subtly alive.
  color_and_tone: Faded yellow and green florals, brown water stains and grey mildew under weak daylight.
  lighting_and_shadow: Dim overcast window light, soft shadows and darker damp patches along the walls.
  texture_and_material: Bubbling wallpaper, peeling seams, mildew blooms and warped floorboards.
  camera_and_composition: Quiet interior framing with large expanses of wall around the subject.
  atmosphere_and_mood: Stale, suffocating and quietly alive, a house that breathes.
  rendering_and_quality: Detailed painterly realism with subtle pattern distortion in the stains.
  creative_brief: "Breathing wallpaper damp: old rooms whose floral wallpaper is swollen with damp, stains spreading into shapes and the pattern seeming to shift when unobserved. Carry it through damp floral wallpaper, spreading stains, bubbling seams, subtly moving pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
