visualDna:
  aesthetic: 'Water splash: a frozen crown or burst of water striking the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: a sharp water splash bursts from or against the target, frozen mid-air.'
  color_and_tone: Clear water with bright highlights, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Hard strobe light freezing droplets, so the effect lights the target and casts believable local light.
  texture_and_material: Splash crowns, droplets and sheets, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Fresh, kinetic, sudden and bright, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: frozen water splash; droplets; strobe crispness; contained around the target
  creative_brief: "Water splash: a frozen crown or burst of water striking the target. Carry it through frozen water splash, droplets, strobe crispness, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
