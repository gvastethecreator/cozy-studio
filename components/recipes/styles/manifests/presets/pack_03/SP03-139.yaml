visualDna:
  aesthetic: 'Particle blizzard simulation: millions of wind-driven snow particles streaming across the scene in layered sheets, with gust eddies and drifts building against obstacles.'
  subject_treatment: "Portable environment render: keep the prompt's subject, location and camera; only a simulated blizzard of wind-driven snow particles is added over them."
  color_and_tone: Blue-white snow, cold grey-blue shadows, near-white visibility falloff in the distance; any warm light becomes a haloed point.
  lighting_and_shadow: Flat diffuse storm light with backlit snow sheets; point lights bloom into soft glowing halos in the particle volume.
  texture_and_material: Motion-blurred streaks near camera, fine particles in the midground, snow crusting on windward faces and drifting in lee corners.
  camera_and_composition: Keep the requested camera; visibility drops sharply with distance so the subject reads as a silhouette in white.
  atmosphere_and_mood: Harsh and isolating, the wind louder than anything.
  rendering_and_quality: Layered particle volume with depth-based density and motion blur; no painted snow overlay.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Particle Blizzard Simulation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: wind-driven particle sheets; motion-blurred near streaks; drifts on windward faces; haloed point lights; steep visibility falloff
