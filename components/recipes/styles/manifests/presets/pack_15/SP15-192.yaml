visualDna:
  aesthetic: 'Abyssalpunk: cultures living in the deepest ocean trenches, with pressure-hulled towns, anglerfish-lure lamps and total crushing darkness around every scene.'
  subject_treatment: Keep the prompt's subject and setting; sink it into the black abyss, lit only by small lures and pressure-hull portholes.
  color_and_tone: Near-total black with deep navy, pale bone white and small cold cyan or amber lure lights.
  lighting_and_shadow: Tiny isolated light sources swallowed by darkness within a few meters, sharp falloff.
  texture_and_material: Thick riveted pressure hulls, porthole glass, marine snow, pale translucent deep-sea creatures.
  camera_and_composition: Small lit islands of detail inside vast darkness, huge creatures half seen at the edges.
  atmosphere_and_mood: Crushing, silent and awe-struck, the terror and wonder of the deepest place on Earth.
  rendering_and_quality: Low-key illustration with precise small light pools and drifting marine snow particles.
  creative_brief: "Abyssalpunk: cultures living in the deepest ocean trenches, with pressure-hulled towns, anglerfish-lure lamps and total crushing darkness around every scene. Carry it through pressure-hull towns, lure lamps, marine snow, darkness swallowing light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pressure-hull towns; lure lamps; marine snow; darkness swallowing light
