visualDna:
  aesthetic: 'Mother of pearl: iridescent nacre with shimmering color shifts and layered sheen.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is inlaid or carved from mother-of-pearl nacre with color-shifting sheen.'
  color_and_tone: Pearl white with pink, blue and green iridescence, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light producing shifting iridescence, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Layered nacre with shimmer and inlay seams, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Precious, delicate, oceanic and luminous, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: iridescent nacre; color-shifting sheen; inlay seams
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mother of Pearl as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - plastic
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
