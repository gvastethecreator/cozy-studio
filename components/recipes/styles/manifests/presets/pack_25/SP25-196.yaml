visualDna:
  aesthetic: 'Tension-Bridge Wordforms: a few thin taut bridges join compatible letters while the rest of the word keeps clear separations.'
  subject_treatment: Letter the requested words and join two or three compatible letters with thin taut bridges, leaving every other space open and every character exact.
  color_and_tone: One ink with bridges lighter in weight than the main stems.
  lighting_and_shadow: Flat lettering where tension comes from contour and counterform.
  texture_and_material: Clean contours, precise meetings and smooth bridges of even thickness.
  camera_and_composition: Bridges placed on compatible pairs, wide pauses elsewhere.
  atmosphere_and_mood: Connection and tension, taut like a held string.
  rendering_and_quality: Crisp wordform that keeps complete letters when bridges are removed.
  creative_brief: "Tension-Bridge Wordforms: a few thin taut bridges join compatible letters while the rest of the word keeps clear separations. Carry it through taut bridges, few joins, open spaces, exact word. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: taut bridges; few joins; open spaces; exact word
