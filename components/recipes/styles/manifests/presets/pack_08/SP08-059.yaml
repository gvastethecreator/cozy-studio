visualDna:
  aesthetic: 'Transparent plastic fashion: clothes of clear or tinted PVC and vinyl that show layers and catch reflections.'
  subject_treatment: "Make the prompt's garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments of clear or tinted transparent plastic — raincoats, skirts, bags — with visible seams and reflections over normal clothes beneath."
  color_and_tone: Clear, frosted, or tinted pink, yellow and blue plastic.
  lighting_and_shadow: Bright light producing edge highlights and caustics, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Clear PVC with welded seams, droplets and reflections, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Playful, modern, fresh and experimental, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: clear PVC garments; welded seams; edge highlights; visible layers beneath
  creative_brief: "Transparent plastic fashion: clothes of clear or tinted PVC and vinyl that show layers and catch reflections. Carry it through clear PVC garments, welded seams, edge highlights, visible layers beneath. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
