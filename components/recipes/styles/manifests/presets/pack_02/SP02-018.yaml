visualDna:
  aesthetic: 'Network news studio look: the subject lit and framed as a headline segment in front of a cool blue LED video wall.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Cool blue and white studio palette, glossy surfaces, a single red accent, crisp HD color.
  lighting_and_shadow: Soft frontal key with bright hair light and blue backlight from the LED wall; no dramatic shadow.
  texture_and_material: Glossy desk surfaces, glass, brushed metal, clean fabrics.
  camera_and_composition: Medium shot at desk height, subject centered or on a third, video wall softly out of focus behind.
  atmosphere_and_mood: Urgent and authoritative, every subject presented as breaking news.
  rendering_and_quality: Crisp HD broadcast signal; no ticker, no readable graphics and no added anchor.
  key_features: blue LED video wall; glossy desk; soft key with hair light; desk-height medium shot; crisp HD
  creative_brief: "Network news studio look: the subject lit and framed as a headline segment in front of a cool blue LED video wall. Carry it through blue LED video wall, glossy desk, soft key with hair light, desk-height medium shot, crisp HD. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
