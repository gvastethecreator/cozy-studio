visualDna:
  aesthetic: 'Layered gradient silhouette illustration: a scene reduced to overlapping flat silhouette bands, each filled with a smooth vertical gradient that lightens with distance.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Analogous palettes such as peach to violet or teal to navy, near layers darkest, far layers palest, a glowing sky gradient.
  lighting_and_shadow: Backlight from the sky; atmospheric haze between layers creates depth, no modeled forms.
  texture_and_material: Smooth digital gradients, crisp silhouette edges, optional faint grain, no interior detail.
  camera_and_composition: Keep the requested subject as a silhouette on one of five to seven receding layers.
  atmosphere_and_mood: Serene, spacious and quiet, a calm moment of distance.
  rendering_and_quality: Clean flat silhouettes with smooth gradient fills and haze between; no textures, no outlines.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Layered Gradient Silhouette as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: receding silhouette layers; smooth vertical gradients; darker near and paler far; analogous palette; no interior detail
