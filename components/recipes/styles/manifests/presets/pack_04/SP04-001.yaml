visualDna:
  aesthetic: '1940s four-color newsprint comic: thick confident brush ink over flat process color, printed cheaply with Ben-Day dots and slightly drifting plates.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: 'Four flat process inks only: primary red, yellow and blue plus Ben-Day tints for flesh and sky, no gradients at all.'
  lighting_and_shadow: Flat high-key fill everywhere; form is shown by a few solid black ink shadows under jaws, arms and brims rather than modeled light.
  texture_and_material: Yellowed pulp newsprint, coarse Ben-Day dot tints, ink slightly spread into the paper, color plates a hair out of register.
  camera_and_composition: Straight-on or gently low heroic view, the subject planted in the center with a strong diagonal action line and simple backgrounds.
  atmosphere_and_mood: Earnest pulp optimism, bold and naive, everything resolved by strength and courage.
  rendering_and_quality: Chunky uniform brush contours, blocky simplified anatomy and visible cheap-print flaws; never glossy digital shading.
  key_features: thick brush ink contours; four flat process colors; Ben-Day dot tints; yellowed newsprint; slight plate misregistration
  creative_brief: "1940s four-color newsprint comic: thick confident brush ink over flat process color, printed cheaply with Ben-Day dots and slightly drifting plates. Carry it through thick brush ink contours, four flat process colors, Ben-Day dot tints, yellowed newsprint, slight plate misregistration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - digital gradients
  - glossy airbrush shading
