visualDna:
  aesthetic: 'Megastructurepunk: life on and inside colossal space megastructures, with ring worlds, star-sized shells, endless trusses and cities built into the seams.'
  subject_treatment: Keep the prompt's subject and setting; place it on or inside a colossal space megastructure that dwarfs everything.
  color_and_tone: Steel grey and bronze structure against star light with deep blue space and warm city glows.
  lighting_and_shadow: Starlight raking across enormous trusses, cities glowing in the shadows.
  texture_and_material: Endless trusses, hull plating, cables, landscapes laid on metal and haze.
  camera_and_composition: Impossible scale with horizons curving up into the sky and tiny figures.
  atmosphere_and_mood: Overwhelming and humbling, people as dust on the work of giants.
  rendering_and_quality: Epic detailed illustration with atmospheric scale and fine structure.
  creative_brief: "Megastructurepunk: life on and inside colossal space megastructures, with ring worlds, star-sized shells, endless trusses and cities built into the seams. Carry it through ring worlds, endless trusses, upward-curving horizons, cities in seams. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ring worlds; endless trusses; upward-curving horizons; cities in seams
