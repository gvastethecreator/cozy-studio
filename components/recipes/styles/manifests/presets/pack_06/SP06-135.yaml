visualDna:
  aesthetic: 'Pochoir: a fine line image colored by hand through a series of cut stencils, gouache or watercolor dabbed with brushes so each color sits in a crisp stencil shape.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Brilliant saturated gouache colors, jade, coral, lemon, black and metallic gold, each in its own crisp stencil area on white paper.
  lighting_and_shadow: Stylized flat lighting with small stippled or dabbed gradients inside the stencil shapes.
  texture_and_material: Dabbed brush stipple within crisp stencil edges, slightly thicker pigment pooling along edges, metallic gold accents, fine printed key line.
  camera_and_composition: Keep the requested framing; elegant stylized shapes with generous white paper.
  atmosphere_and_mood: Chic, luminous and elegant, a hand-colored fashion plate.
  rendering_and_quality: Crisp stencil boundaries filled with dabbed hand color; no screenprint ink film and no digital flat fills.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pochoir Hand Stencil as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
