  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments made of flowing, transparent water with splash edges, droplets and refracted caustics.'
  color_and_tone: Clear aqua and silver with light caustics, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Bright light producing refraction and caustic patterns, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Liquid water with splashes, droplets and refraction, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Fluid, elemental, fresh and surreal, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: flowing water garment; splash edges; droplets; refraction caustics
  creative_brief: "Water dress: garments formed of flowing clear water with splashes, droplets and caustic light. Carry it through flowing water garment, splash edges, droplets, refraction caustics. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
