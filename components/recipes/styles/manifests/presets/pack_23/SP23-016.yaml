visualDna:
  aesthetic: >-
    Opaque vitreous-color compartments, separated by contained metal divisions, create a shallow
    champlevé surface with crisp boundaries and sparse, tight highlights on the explicitly authorized
    material target.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, action and layout. Apply the enamel structure
    only to the surface the user explicitly names as the material target; keep every other object and
    material unchanged.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Keep color fields opaque and resting on
    their support; do not assume gold, add a fixed historic palette or make colors glow through it.
  lighting_and_shadow: >-
    Respect requested illumination and shadows. Use only restrained highlights on the authorized
    target, without backlighting, bloom or a new light source.
  texture_and_material: >-
    Require an explicit material target before applying champlevé enamel on metal. Keep the colored
    fields shallow, the metal divisions contained and the material response opaque; preserve all
    non-target surfaces as requested.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and arrangement. Do not turn an object into a
    roundel, medallion or framed display.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Enamel treatment alone does not imply a relic, sacred
    image or medieval narrative.
  rendering_and_quality: >-
    Keep the opaque fields and fine metal boundaries distinct at the requested scale. Avoid glass-like
    transmission, broad specular CGI reflections and decorative additions beyond the authorized target.
avoidRules:
  - unrequested reliquary, medallion, jewelry or religious icon
  - translucent backlighting or stained-glass bloom
  - automatic gold or palette substitution
assets:
  defaultImage: /assets/recipes/styles/defaults/SP23-016.webp
