visualDna:
  aesthetic: >-
    Playful cel drawing with elastic contours, punchy shape breaks, and an anticlimactic
    burst-and-pause rhythm.
  subject_treatment: >-
    Keep the requested action intact; use springy line accents and compressed-to-open shapes only
    around motion already present.
  color_and_tone: >-
    Cheerful yellow, coral, and aqua accents pop against clear midtones, while yielding to any
    specified palette.
  lighting_and_shadow: >-
    Use bright local highlights and quick value changes for lively emphasis, not a new burst or
    event.
  texture_and_material: >-
    Favor smooth cel fills, brisk brush flicks, and crisp broken edges without turning surfaces into
    props.
  camera_and_composition: >-
    Preserve framing; place visual emphasis in uneven intervals and offbeat diagonals around the
    existing focal point.
  atmosphere_and_mood: >-
    Light, dry, and comic in timing, but let the prompt set the actual emotional register.
  rendering_and_quality: >-
    Keep forms simple and readable, with sharp accents, clean flats, and no excess effects.
  key_features: >-
    Springy contour, cheerful accents, clipped emphasis, and a quick pause after visual impact.
  creative_brief: >-
    Restyle the requested scene with lively cel contours and playful color timing; do not invent a
    gag, action, character, or prop.
