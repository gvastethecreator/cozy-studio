visualDna:
  aesthetic: Stencil-print illustration using two flat ink layers and deliberate overlap shapes.
  subject_treatment:
    Reduce internal detail into connected printable shapes while preserving the subject outline
    and distinctive features.
  color_and_tone:
    Use two inks from the requested palette and their overlap. Separate adjacent forms through value,
    negative space and controlled overprinting.
  lighting_and_shadow: Express light through a small number of flat value regions. Avoid smooth airbrushed shading.
  texture_and_material:
    Keep ink coverage mostly even, with a restrained texture at broad fill boundaries. Let overlap
    structure carry depth.
  camera_and_composition:
    Keep user framing and placement. Balance solid areas against open support without adding
    a page border or fixed layout.
  atmosphere_and_mood:
    Follow the requested mood through mass, contrast and overlap density. The print medium does
    not dictate the subject or theme.
  rendering_and_quality:
    Keep stencil bridges and small negative gaps readable. Do not add halftone to every mid-value
    by default.
avoidRules:
  - airbrushed gradients
  - unrequested page borders
  - indiscriminate halftone overlay
