visualDna:
  aesthetic: >-
    Source-informed video-game style router for original grim folklore RPG captures: third-person
    swamp contract gameplay with wet village edges, occult props, monster telegraphs, grounded
    quest-combat readability, and adult muddy fantasy restraint. Borrow the folkloric material
    discipline of Witcher-like games, but land as a different fictional monster-contract RPG with
    different characters, creatures, villages, UI icons, and quest props.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable bog-coven RPG screenshot subject:
    keep clear role silhouette, monster/player/object function, dodge or sign distance, route
    affordance, and scale relationship without copying source characters or named IP elements.
  color_and_tone: >-
    Use a grim folklore RPG palette: mud brown, swamp green, corpse grey, candle yellow, dried blood
    red, peat black, and stormy blue. Keep value grouping legible at gameplay distance and avoid
    racing-sport brightness, glossy fantasy polish, or clean heroic color scripts.
  lighting_and_shadow: >-
    Light the image through overcast swamp light, torch pools, spell signs, moon haze, and
    monster-eye glints. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wet reeds, rotting wood, leather armor, bone charms, mud, witch huts, and
    realistic creature skin. Materials should feel like in-engine game assets captured during play,
    with enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person action-RPG framing: weapon/sign distance, dodge space, monster
    telegraph, bog route, and quest-location depth. The frame should read as a plausible gameplay
    capture, not a racing shot, poster, or cinematic monster portrait.
  atmosphere_and_mood: >-
    Carry an original bog-coven contract mood: folkloric, grimy, adult, dangerous, humid, and
    morally murky.
  rendering_and_quality: >-
    Finish as coherent in-engine third-person RPG screenshot style, not concept art: contextual RPG
    HUD can include health/stamina, small minimap shape, potion icons, and non-readable quest
    marker. Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, no fake
    logos, no racing camera, no exact monster contract UI, and no stock-photo polish.
  key_features: >-
    original grim folklore RPG gameplay screenshots; third-person swamp contract capture; wet
    village edges, occult props, monster telegraphs, grounded quest-combat readability; mud brown,
    swamp green, corpse grey, candle yellow, dried blood red, peat black, stormy blue; overcast
    swamp light, torch pools, small spell signs, moon haze, monster-eye glints; wet reeds, rotting
    wood, leather, bone charms, mud, witch huts, creature skin; third-person action-RPG framing with
    dodge space and quest-location depth; adult, muddy, dangerous, morally murky; HUD guidance:
    contextual RPG HUD only, no readable quest text
  creative_brief: >-
    Use Bog Coven Contract as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through grim folklore RPG references: third-person camera, muddy material
    language, monster-contract readability, swamp route affordances, and restrained in-engine
    finish. Avoid menus, logos, exact characters, exact levels, direct Witcher cloning, racing-sport
    framing, and promotional key art.
