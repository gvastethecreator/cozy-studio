visualDna:
  aesthetic: >-
    Build color with layered pencil strokes, varied pressure and directional crosshatching that
    follows form. Keep the drawn surface tactile without making every area equally busy.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and scene. Let pencil marks describe
    the existing shapes without changing their construction or adding details.
  color_and_tone: >-
    Retain the requested palette and value relationships. Build them through layered pencil color
    and small reserves of the underlying tone rather than imposing a colored-pencil palette.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Use stroke density and pressure to model the
    existing volume without inventing highlights or a new light direction.
  texture_and_material: >-
    Show fine wax-pencil grain within colored areas, not photographic noise. Keep the represented
    materials recognizable beneath the drawing texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. The drawn treatment does not alter
    composition or add borders, labels or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Pencil texture changes the mark-making, not the subject,
    period, location or story.
  rendering_and_quality: >-
    Vary stroke direction and pressure with form; reserve crosshatching for areas where it describes
    volume. Avoid uniform hatch bands and preserve a clear silhouette.
avoidRules:
  - uniform hatch bands unrelated to form
  - photographic grain or pencil texture obscuring requested materials
  - unrequested frame, lettering or layout
