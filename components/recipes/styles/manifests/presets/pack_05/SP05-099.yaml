visualDna:
  aesthetic: >-
    Resilient cel illustration organized by concentric contour rhythms, worn surfaces, and a
    forward-weighted silhouette.
  subject_treatment: >-
    Keep the requested pose and action; use nested edge accents and firm contours without
    introducing a shield or barrier.
  color_and_tone: >-
    Aged bronze, stone gray, and a small amber accent build worn contrast; accommodate the requested
    palette.
  lighting_and_shadow: >-
    Directional highlights catch raised edges while deep shadow holds the larger forms together.
  texture_and_material: >-
    Scuffed pigment and subdued metallic glints suggest wear as a rendering cue, without changing
    the depicted material.
  camera_and_composition: >-
    Preserve the requested camera; let nested curves and weighty diagonals guide attention within
    its composition.
  atmosphere_and_mood: >-
    Steadfast and hard-earned, with the mood following the subject rather than adding conflict.
  rendering_and_quality: >-
    Balance firm edges, textured midtones, and one controlled highlight so each form remains
    legible.
  key_features: >-
    Concentric line rhythm, weathered value contrast, bronze warmth, and restrained edge light carry
    a sense of resolve.
  creative_brief: >-
    Apply the worn, resilient contour and value language to the requested content without adding
    armor, defense, or combat.
