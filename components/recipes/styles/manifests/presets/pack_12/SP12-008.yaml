visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on WipEout Omega Collection gameplay screenshots:
    anti-gravity racing gameplay capture with clean hovercraft silhouettes, neon track guardrails,
    futuristic billboards, and velocity blur. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable WipEout Omega Collection-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a WipEout Omega Collection-informed palette: electric blue, hot magenta, black asphalt,
    white sponsor panels without readable logos, and amber boost trails. Keep value grouping legible
    at gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through trackside neon strips, engine bloom, reflective wet surfaces, tunnel
    strobes, and boost flare. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from sleek vehicle hulls, glossy track panels, translucent shields, holographic
    signage shapes, and high-speed particle streaks. Materials should feel like in-engine game
    assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person racing camera with vanishing-point track curves, rivals ahead,
    lap-line clarity, and speed-focused low horizon. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a WipEout Omega Collection-derived mood: clinical, fast, competitive, glossy, and
    late-night futuristic. The preset can become adult, violent, eerie, seductive, cozy, tactical,
    or absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: racing HUD is welcome: lap,
    speed, shield, weapon slot, and position markers can appear if clean and game-coherent. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    WipEout Omega Collection gameplay screenshots; anti-gravity racing gameplay capture with clean
    hovercraft silhouettes, neon track guardrails, futuristic billboards, and velocity blur;
    electric blue, hot magenta, black asphalt, white sponsor panels without readable logos, and
    amber boost trails; trackside neon strips, engine bloom, reflective wet surfaces, tunnel
    strobes, and boost flare; sleek vehicle hulls, glossy track panels, translucent shields,
    holographic signage shapes, and high-speed particle streaks; third-person racing camera with
    vanishing-point track curves, rivals ahead, lap-line clarity, and speed-focused low horizon;
    clinical, fast, competitive, glossy, and late-night futuristic; HUD guidance: racing HUD is
    welcome: lap, speed, shield, weapon slot, and position markers can appear if clean and
    game-coherent
  creative_brief: >-
    Use WipEout Night Speed Circuit as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from WipEout Omega Collection: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
