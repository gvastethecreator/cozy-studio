visualDna:
  aesthetic: 'Team Andromeda Panzer Dragoon (1995) look: Sega Saturn on-rails flight in low-poly 3D with dithered textures, Moebius-inspired alien architecture, biomechanical creature design and hazy golden palettes.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people and creatures as angular low-poly Saturn-era figures with Moebius costume lines and biomechanical shapes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Canyon gold, ruin teal and hazy sky, true to the Panzer Dragoon 1995 palette.
  lighting_and_shadow: Hazy Saturn-era light and glowing lock-ons, lit the way Panzer Dragoon 1995 lights its levels.
  texture_and_material: Visibly faceted low-poly models, warped dithered textures and fog-limited draw distance at low resolution.
  camera_and_composition: On-rails flight view from behind and above the subject, with lock-on reticles.
  atmosphere_and_mood: Keep the requested mood with ancient mythic flight.
  rendering_and_quality: Authentic 1995 Sega Saturn rail shooter screen, not a painted illustration.
  key_features: Panzer Dragoon rails; low-poly Saturn; Moebius ruins
  creative_brief: 'Team Andromeda Panzer Dragoon (1995) look: Sega Saturn on-rails flight in low-poly 3D with dithered textures, Moebius-inspired alien architecture, biomechanical creature design and hazy golden palettes. Carry it through Panzer Dragoon rails, low-poly Saturn, Moebius ruins. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
