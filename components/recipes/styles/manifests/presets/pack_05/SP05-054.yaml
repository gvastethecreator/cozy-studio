visualDna:
  aesthetic: >-
    Operatic light-and-line illustration with sleek contours, radiant diagonals, and carefully
    tiered color fields; scale comes from contrast and sweeping direction, not added spacecraft.
  subject_treatment: >-
    Keep the requested subject recognizable. Sharpen its existing outline and use a few luminous
    directional strokes to guide attention without changing its shape.
  color_and_tone: >-
    Contrast deep cobalt and ink with ivory, warm gold, and a chosen saturated accent. Separate
    colors into clear, dramatic bands.
  lighting_and_shadow: >-
    Set broad cel shadows against clean, radiant highlight paths. Let light sweep across
    existing forms without inventing beams, engines, or spotlights.
  texture_and_material: >-
    Render the subject’s actual materials with smooth painted gradients, fine metallic glints,
    and minimal grain; keep every surface distinct.
  camera_and_composition: >-
    Honor the requested framing. Arrange highlights and contour rhythm along strong diagonals
    while preserving the subject’s scale and placement.
  atmosphere_and_mood: >-
    Create grandeur through luminous contrast, elegant spacing, and deliberate visual cadence,
    whether the prompt calls for calm or action.
  rendering_and_quality: >-
    Use precise outlines, clean color separation, controlled bloom, and a small number of bold
    shadow shapes; avoid muddy glow.
  key_features: >-
    Radiant diagonal highlights; sleek contour lines; cobalt and ivory contrast; dramatic color
    hierarchy.
  creative_brief: >-
    Keep the specified subject, action, and setting. Apply sleek contours, radiant diagonal
    accents, and operatic color separation; add no spacecraft, engines, or staged light beams.
