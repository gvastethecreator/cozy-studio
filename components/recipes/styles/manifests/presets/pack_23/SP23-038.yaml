visualDna:
  aesthetic: >-
    Build opaque color shapes and rounded painted volumes with simplified edges. Alternate visible
    brush marks and quieter passages without plastic shading.
  subject_treatment: >-
    Preserve the requested subject, identity, function, count, pose, action and proportions. Shape
    simplification follows existing forms instead of redesigning them as caricature.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use opaque, layered color without requiring
    a fixed palette or changing the meaning of the colors.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Use rounded value transitions to model existing
    volumes without inventing a light source or plastic highlights.
  texture_and_material: >-
    Keep brushwork selectively visible and respect the materials already depicted. Do not apply a
    uniform painted texture or force ornamental marks onto every surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and arrangement. Simplified edges do not change
    perspective, pose or spatial relationships.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Opaque paint is a rendering choice, not a new theme,
    era or scene.
  rendering_and_quality: >-
    Balance broad opaque shapes, rounded modeling and simplified contours. Keep decorative marks
    subordinate to existing structure and avoid smooth plastic shading.
avoidRules:
  - unrequested caricature, decoration or changes to the subject
  - plastic shading or uniform brush texture across all materials
  - unrequested lettering, symbols, borders, interface or layout
