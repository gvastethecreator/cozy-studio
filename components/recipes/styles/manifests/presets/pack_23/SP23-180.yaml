  lighting_and_shadow: Reflections independent of the scene lighting, kept consistent across the whole image.
  texture_and_material: Swirling environment texture on low-poly metal, kept consistent across the whole image.
  camera_and_composition: Close view of the shiny model on a simple ground.
  atmosphere_and_mood: Keep the requested mood with slick dreamy strangeness.
