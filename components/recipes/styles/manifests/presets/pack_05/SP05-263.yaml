visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around broken contour dashes in
    uneven signal-like intervals, separated by large clean pockets of near-black
    negative value. For color and surface, retain prompted colors over a
    black-and-ash range, with one narrow cold cyan or acid-green accent only if useful.
    Nihilistic pressure is optional and should read as visual silence, not as a required
    disaster or attack
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through broken contour dashes in uneven
    signal-like intervals, separated by large clean pockets of near-black negative
    value; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain prompted colors over a
    black-and-ash range, with one narrow cold cyan or acid-green accent only if useful.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use isolated sharp pulses of
    reflected color against broad quiet shadow; do not invent a display or light source.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; keep edges graphic and slightly dry, with sparse
    dot noise that thins before it muddies the form. Keep texture subordinate to form
    and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; let
    existing gaps and interrupted edges establish rhythm without changing the prompt's
    crop or spatial arrangement. Use the mark rhythm inside the supplied composition
    rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Nihilistic pressure is optional and should
    read as visual silence, not as a required disaster or attack. Darkness and tension
    are optional tonal pressure, never a requirement to add danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and broken contour dashes in uneven signal-like
    intervals, separated by large clean pockets of near-black negative value; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    broken contour dashes in uneven signal-like intervals, separated by large clean
    pockets of near-black negative value; retain prompted colors over a black-and-ash
    range, with one narrow cold cyan or acid-green accent only if useful; use isolated
    sharp pulses of reflected color against broad quiet shadow; do not invent a display
    or light source; keep edges graphic and slightly dry, with sparse dot noise that
    thins before it muddies the form; and let existing gaps and interrupted edges
    establish rhythm without changing the prompt's crop or spatial arrangement. The five
    cues should read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use broken contour dashes in uneven signal-like
    intervals, separated by large clean pockets of near-black negative value, retain
    prompted colors over a black-and-ash range, with one narrow cold cyan or acid-green
    accent only if useful, use isolated sharp pulses of reflected color against broad
    quiet shadow; do not invent a display or light source, and keep edges graphic and
    slightly dry, with sparse dot noise that thins before it muddies the form; the
    prompt supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
