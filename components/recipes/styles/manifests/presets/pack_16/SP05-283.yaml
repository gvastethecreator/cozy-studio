visualDna:
  aesthetic: >-
    Build low-key negative space with deep blue-black fields, sparse fine lines, and isolated
    pale contour light where forms meet dark.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Allow edges to
    merge only where dark values already touch, never erase identity.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use indigo, blue-green,
    smoked gray, and pearl highlights while maintaining explicit local color.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Respect source light; use broad dark
    falloff and restrained existing edge highlights, without rays or particles.
  texture_and_material: >-
    Apply texture only to materials already present. Layer soft transparent washes with faint
    grain; add no water, dust, or glow texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Use existing empty areas and
    depth rather than moving the subject or widening space.
  atmosphere_and_mood: >-
    Preserve user mood; low-key space does not imply mourning or metaphysical content.
  rendering_and_quality: >-
    Protect identity-bearing edges from merging and keep sparse highlights precise rather than
    foggy.
  key_features: >-
    Deep blue-black field; sparse contour; selective edge merge; pale accents.
  creative_brief: >-
    Use deep blue-black field; sparse contour; selective edge merge; pale accents. Keep the
    requested subjects, action, setting, palette, framing and mood; add no scene content.
