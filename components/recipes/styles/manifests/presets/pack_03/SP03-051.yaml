  - blood
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - readable text
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
