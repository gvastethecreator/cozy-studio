visualDna:
  aesthetic: >-
    Broken Neon Saint Icon acts as a transferable mythic-noir router: fractured sanctity and
    interrupted symmetry, damaged electric sanctity under noir ritual pressure plus fallen sanctity,
    martyr-icon pressure, and corrupted devotion fused with ritual noir with legalistic omen logic,
    candle compression, confessional shadow, taboo elegance, and ceremonial menace; it carries
    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    broken contour logic and repaired silhouette tension, tube-like edge accents and contaminated
    glow around the prompt form plus halo-adjacent silhouette grammar without forcing a holy
    portrait; forms should inherit silhouette pressure, emblem logic, ritual posture, edge weight,
    and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through broken neon magenta, cyan contamination, and old black, old gold, bruised
    crimson, smoke black, and pale relic ivory plus aged gold, varnish brown, black shadow, and
    chipped ivory together with velvet black, sealing-wax red, old ivory, tarnished brass, moonsteel
    blue, rain gloss, and restrained poisonous glow; values stay separated, accents feel
    intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use damaged neon flicker under sacred shadow, thin devotional glow interrupted by noir shadow
    plus flat gold-leaf glints with narrow sacred rim light with low-key noir pools, narrow rim
    cuts, wet reflections, candle bloom, and occult glow that never flattens the subject; shadows
    must carry omen weight, rims should clarify form, and glow should behave as ritual evidence
    rather than decorative haze.
  texture_and_material: >-
    Render cracked enamel, chipped glass, snapped gold leaf, and exposed underlayers, cracked tubes,
    wet reflections, and chipped enamel plus varnish cracks, tarnished gold, soot, and handled
    enamel alongside wax seals, ledger paper, velvet pile, rain-wet stone, tarnish, soot, blade
    sheen, veils, and powdery ash; surface scale, patina, residue, gloss, grain, and carved or
    sealed edges must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with flicker rhythm, broken sign geometry, and off-axis glow emphasis, frontal reverence
    interrupted by broken off-axis tension plus icon-axis balance and sacred flatness with shadow
    depth plus interrogation axes, compressed processional bands, sealed-grid order, reflected
    doubles, and off-axis ritual tension; the style should support portraits, objects, architecture,
    creatures, symbols, and full scenes through reusable spatial grammar instead of one fixed
    layout.
  atmosphere_and_mood: >-
    Carry mood through damaged reverence, profane luminosity and urban sacrament decay plus
    reverence, guilt, and sacrilegious elegance and adult secrecy, suspicion, judgment, mourning,
    seduction, dread, and the feeling of a private rite becoming public; the image can become
    severe, sensual, sacred, violent, quiet, or strange when prompt X asks for it, while the preset
    supplies mythic consequence.
  rendering_and_quality: >-
    Finish with controlled neon bloom without overexposure or cyberpunk drift plus sacred-image
    clarity with damaged-surface detail and restrained glow and clean noir illustration with heavy
    denoise, readable silhouettes, disciplined glow, and no accidental UI or readable text;
    prioritize clean denoise, readable dark values, strong silhouette hierarchy, tactile material
    truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    fractured sanctity and interrupted symmetry, damaged electric sanctity under noir ritual
    pressure plus fallen sanctity, martyr-icon pressure, and corrupted devotion; broken contour
    logic and repaired silhouette tension, tube-like edge accents and contaminated glow around the
    prompt form plus halo-adjacent silhouette grammar without forcing a holy portrait; cracked
    enamel, chipped glass, snapped gold leaf, and exposed underlayers, cracked tubes, wet
    reflections, and chipped enamel plus varnish cracks, tarnished gold, soot, and handled enamel;
    damaged neon flicker under sacred shadow, thin devotional glow interrupted by noir shadow plus
    flat gold-leaf glints with narrow sacred rim light; flicker rhythm, broken sign geometry, and
    off-axis glow emphasis, frontal reverence interrupted by broken off-axis tension plus icon-axis
    balance and sacred flatness with shadow depth
  creative_brief: >-
    Apply Broken Neon Saint Icon after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies fractured sanctity
    and interrupted symmetry, damaged electric sanctity under noir ritual pressure plus fallen
    sanctity, martyr-icon pressure, and corrupted devotion, broken contour logic and repaired
    silhouette tension, tube-like edge accents and contaminated glow around the prompt form plus
    halo-adjacent silhouette grammar without forcing a holy portrait, broken neon magenta, cyan
    contamination, and old black, old gold, bruised crimson, smoke black, and pale relic ivory plus
    aged gold, varnish brown, black shadow, and chipped ivory, damaged neon flicker under sacred
    shadow, thin devotional glow interrupted by noir shadow plus flat gold-leaf glints with narrow
    sacred rim light, cracked enamel, chipped glass, snapped gold leaf, and exposed underlayers,
    cracked tubes, wet reflections, and chipped enamel plus varnish cracks, tarnished gold, soot,
    and handled enamel plus flicker rhythm, broken sign geometry, and off-axis glow emphasis,
    frontal reverence interrupted by broken off-axis tension plus icon-axis balance and sacred
