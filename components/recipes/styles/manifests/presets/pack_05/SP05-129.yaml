visualDna:
  aesthetic: >-
    Build the graphic anime treatment from polished high-contrast contours with very little
    interior line and blunt simplified forms set against flat reaction spaces. Let a quiet hold
    followed by clear graphic emphasis set its rhythm; use saturated warm and cool accents on
    clean black-white values for color and smooth cel fills with minimal surface texture for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use polished high-contrast contours with very
    little interior line for edge work, blunt simplified forms set against flat reaction spaces
    for form simplification, and a quiet hold followed by clear graphic emphasis only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with saturated warm and cool accents on clean black-white values. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: simple hard shadows and polished highlight edges. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth cel fills with minimal surface texture, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use absurd scale contrast, broad quiet space, and
    precise focal placement to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey deadpan grandeur and understated satire, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with clean cel polish, flat reaction space, and scale carried by contrast; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    polished high-contrast contours with very little interior line; blunt simplified forms set
    against flat reaction spaces; saturated warm and cool accents on clean black-white values; a
    quiet hold followed by clear graphic emphasis; smooth cel fills with minimal surface texture;
    absurd scale contrast, broad quiet space, and precise focal placement.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with polished
    high-contrast contours with very little interior line, blunt simplified forms set against flat
    reaction spaces, and saturated warm and cool accents on clean black-white values; use a quiet
    hold followed by clear graphic emphasis only where movement is already present, and apply
    smooth cel fills with minimal surface texture as the drawing finish.
