visualDna:
  aesthetic: 'Large clear silhouettes contrast with tiny internal marks and fine edge details; scale variation belongs to line weight and detail density, not object size.'
  subject_treatment: 'Keep proportions, silhouettes, ages, and counts as requested; use small detail against simple forms without adding new forms or changing scale.'
  color_and_tone: 'Set a restrained base against a limited bright accent on an existing focal form; the prompt controls hue and saturation.'
  lighting_and_shadow: 'Separate flat ambient values from a crisp rim or highlight only when supported by the supplied light.'
  texture_and_material: 'Contrast smooth broad fills with precise fine strokes on existing surfaces; avoid glow unless the prompt requests light effects.'
  camera_and_composition: 'Keep crop, viewpoint, perspective, spacing, and count; create scale contrast through mark size and detail, not framing or proportion changes.'
  atmosphere_and_mood: 'Follow the requested feeling; contrast affects visual emphasis only and does not assign a new tone.'
  rendering_and_quality: 'Preserve clear silhouette edges while keeping microdetail sparse; do not blur or ornament the whole image.'
  key_features: 'Bold simplified silhouette; tiny internal line detail; restrained bright accent; clean layers; scale contrast through mark density.'
  creative_brief: "Juxtapose broad clean shapes with fine marks to create visual scale tension. Do not enlarge or add anything; preserve subject, action, count, camera, and mood. Use it as a reusable look on any subject."
