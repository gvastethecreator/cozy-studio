visualDna:
  aesthetic: 'Mixed-media canvas: heavy-body acrylic over gesso with modeling paste, sand, embedded tissue and graphite marks building a thick, scraped surface.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Bold layered color with earlier layers showing through scrapes; one warm dominant against cool neutrals, occasional drips of pure pigment.
  lighting_and_shadow: Painted light kept simple; real raking light catches the ridges of paste and palette-knife edges.
  texture_and_material: Palette-knife scraping, gritty sand paste, wrinkled tissue paper glazed in, drips, spray mist and loose graphite lines.
  camera_and_composition: Keep the requested view; the subject emerges from an expressive field, crisp at its focal point and dissolving into texture at the edges.
  atmosphere_and_mood: Expressive and raw, energy built up layer on layer.
  rendering_and_quality: Physical relief visible across the canvas; the subject readable despite heavy texture.
  key_features: modeling paste relief; palette-knife scrapes; embedded tissue; sand grit; drips and graphite
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mixed Media Canvas as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
