  color_and_tone: Dark gradient background with a bright spot on the model.
  lighting_and_shadow: Strong key light and rim light on the model.
  texture_and_material: Low-poly model, painted textures and a glowing pedestal.
  camera_and_composition: Full-body centered, slightly low angle, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with anticipation and pride.
  rendering_and_quality: Clean low-poly model with dramatic lighting, kept consistent across the whole image.
  creative_brief: "Character-select model pose: a low-poly hero model standing on a small pedestal in an idle pose, lit dramatically against a dark gradient as if waiting to be chosen. Carry it through pedestal, idle pose, dark gradient, dramatic spotlight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
