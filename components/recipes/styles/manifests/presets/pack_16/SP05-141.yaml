visualDna:
  aesthetic: >-
    Gothic-punk anime with ornamental dark contours, rough ink texture and pulsing highlight
    accents.
  subject_treatment: >-
    Keep the supplied identity and gesture. Repeated light or contour pulses may underline
    existing motion.
  color_and_tone: >-
    When palette is open, use black, crimson, bone, violet and a small acidic accent;
    explicit color choices take priority.
  lighting_and_shadow: >-
    Pair warm local glow and a firm rim with deep soft shadow; use vibration-like highlight
    pulses only when they fit the image.
  texture_and_material: >-
    Apply rough ink and distressed grain only to surfaces present in the prompt.
  camera_and_composition: >-
    Respect requested framing and viewpoint; keep decorative shapes subordinate to the
    existing silhouette.
  atmosphere_and_mood: >-
    Use emotional resonance or abrasive tension only when compatible with the requested
    tone.
  rendering_and_quality: >-
    Retain crisp silhouette edges, controlled pulses and soft painted-background
    integration.
  key_features: >-
    Ornamental shadow; dark and vivid accent contrast; pulsing highlight rhythm; rough ink
    on existing materials.
  creative_brief: "Use ornamental contours and optional pulsing highlights to style the supplied content. Preserve its subject, action, palette and camera. Use it as a reusable look on any subject."
