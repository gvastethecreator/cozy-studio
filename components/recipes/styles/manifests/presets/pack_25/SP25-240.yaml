visualDna:
  aesthetic: 'Overview-and-Detail Map: one overview keeps every coordinate while an inset enlarges one exact region, linked by clear corners.'
  subject_treatment: Show the prompt's overview with its coordinates intact and an inset enlarging one exact region, linked by corner lines; keep every label exact.
  color_and_tone: The same codes in overview and detail, with a unique color for the selection frame.
  lighting_and_shadow: Flat schematic rendering that keeps the source projection.
  texture_and_material: Crisp outlines, controlled symbols and a declared scale for each view.
  camera_and_composition: Dominant overview, a linked inset and labels naming region and scale.
  atmosphere_and_mood: An oriented change of scale that never loses the reference point.
  rendering_and_quality: Crisp map where inset elements match the overview exactly.
  creative_brief: "Overview-and-Detail Map: one overview keeps every coordinate while an inset enlarges one exact region, linked by clear corners. Carry it through overview map, exact inset, corner links, declared scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overview map; exact inset; corner links; declared scale
