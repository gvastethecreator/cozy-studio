  aesthetic: 'Jez Gordon OSR design and illustration: clean graphic line, isometric dungeon maps with charming detail, limited color and crisp modern zine layout.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject as a clean graphic isometric map vignette with limited color. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Limited two-color palette with black line, true to the Jez Gordon palette.
  lighting_and_shadow: Flat graphic light, lit the way Jez Gordon lights its scenes.
  texture_and_material: Crisp clean line and flat color, with the surface finish of Jez Gordon.
  camera_and_composition: Isometric map view, framed the way Jez Gordon composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with crisp inviting exploration.
  rendering_and_quality: Clean graphic isometric dungeon illustration, in the recognizable hand of Jez Gordon.
