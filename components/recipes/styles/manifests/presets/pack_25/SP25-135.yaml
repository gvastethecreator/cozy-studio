visualDna:
  aesthetic: 'Embossed Void Identity: broad blind embossing and wide empty areas alternate with tiny areas of ink to rank the brand.'
  subject_treatment: Build the prompt's package identity from broad blind embossing, open voids and small areas of ink, the exact name printed clear of the relief.
  color_and_tone: An even substrate value with high-contrast ink on the essential information.
  lighting_and_shadow: Soft raking light on the finish view and a clean frontal control view.
  texture_and_material: Broad-edged conceptual relief with plain, smooth board around it.
  camera_and_composition: Dominant relief motif kept apart from critical text, with resting space.
  atmosphere_and_mood: Tactile discretion and presence, quiet, rich and quietly confident.
  rendering_and_quality: Essential information stays readable even when the relief is not visible.
  creative_brief: "Embossed Void Identity: broad blind embossing and wide empty areas alternate with tiny areas of ink to rank the brand. Carry it through blind emboss, wide voids, tiny ink areas, raking light view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: blind emboss; wide voids; tiny ink areas; raking light view
