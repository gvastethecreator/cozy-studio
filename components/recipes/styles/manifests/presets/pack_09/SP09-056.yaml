visualDna:
  aesthetic: >-
    Plasma/Energy behaves like a controlled elemental effect layer: start from Sci-fi shield, Energy
    ripple, and Warping, then turn motion, temperature, particles, translucency, refraction, glow,
    and transient energy behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Forcefield: preserve identity and pose while letting forms
    emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Neon Cyan/Magenta as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Glowing define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Plasma/Energy without hiding the prompt subject.
  texture_and_material: >-
    Render Energy ripple through flow direction, particle density, turbulence, glow falloff,
    splashes, trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores,
    or surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Warping as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Futuristic, protected by using movement, danger, spectacle, instability,
    temperature, and sensory intensity; the material should color the scene's feeling while
    preserving the user's requested subject and setting.
  rendering_and_quality: >-
    Finish with Sci-fi, shield material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Sci-fi shield; Forcefield; Energy ripple; Glowing; Warping
  creative_brief: >-
    Route any subject through Plasma/Energy as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Render the impossible physics of an energy
    shield where ripples of neon cyan and magenta race across an invisible surface like pebbles
    dropped in pure light, the forcefield pattern buzzing with contained power. The barrier should
    feel simultaneously present and immaterial, a force made visible through its own distortion of
    space. Capture the membrane between safety and annihilation, protection rendered as light. Use
    Plasma/Energy as portable surface/render behavior over any input: map its texture, light
    response, edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a
    literal material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
