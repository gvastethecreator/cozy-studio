visualDna:
  aesthetic: 'Paper marbling: floated pigments on a size bath combed and dragged with a stylus into the subject shapes, then lifted onto paper in one print.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Three to five floated colors with crisp boundaries and no blending; veins of the first color run through everything.
  lighting_and_shadow: No modeled light; form comes only from the flow and density of marbled bands.
  texture_and_material: Combed feather patterns, stone-like veins, dropped color rings, stylus-drawn motifs and faint fringes where the paper lifted.
  camera_and_composition: Keep the requested view; the subject is drawn by dragging the stylus, its outline flowing into the surrounding marbled field.
  atmosphere_and_mood: Fluid and hypnotic, a form caught mid-swirl.
  rendering_and_quality: Crisp pigment boundaries and flowing continuity; no brush marks or digital swirl filters.
  key_features: floated pigment on size; combed feather patterns; stylus-drawn motif; dropped color rings; crisp flowing boundaries
  creative_brief: "Paper marbling: floated pigments on a size bath combed and dragged with a stylus into the subject shapes, then lifted onto paper in one print. Carry it through floated pigment on size, combed feather patterns, stylus-drawn motif, dropped color rings, crisp flowing boundaries. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
