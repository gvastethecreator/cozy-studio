visualDna:
  aesthetic: >-
    Matte mineral-pigment layers, affirmed contours, simplified volumes and dry transitions create
    a mural-painting language without requiring a mural, wall or historic setting.
  subject_treatment: >-
    Preserve requested identity, proportions, count, action and relationships. Simplify volumes only
    enough to clarify pigment planes; do not add religious figures or reshape the subject.
  color_and_tone: >-
    Preserve the requested colors and value relationships. Organize them in matte pigment layers
    without imposing a sacred palette, gold accents or an aged cast.
  lighting_and_shadow: >-
    Follow the requested illumination and shadows. Translate existing form into dry tonal transitions
    without adding an interior, daylight source or dramatic chiaroscuro.
  texture_and_material: >-
    Suggest fine, restrained support porosity within the paint treatment only. Preserve the actual
    materials of depicted subjects and supports; do not convert them to plaster or add wear by default.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and placement. Do not introduce an apse, architectural
    frame or mural boundary.
  atmosphere_and_mood: >-
    Retain the requested atmosphere. Mineral pigment does not imply a church, altar, halo or solemn
    religious scene.
  rendering_and_quality: >-
    Keep contours clear, pigment planes matte and transitions deliberately dry. The image may remain
    intact and clean; avoid cracks, exposed wall, missing fragments or blanket distress.
avoidRules:
  - unrequested church, apse, altar or halo
  - default cracks, exposed plaster or missing fragments
  - imposed gold accents or aged discoloration
