visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through besieged objective logic; hostile biome traversal, survival
    pressure, creature scale, weathered camps, and readable hunt routes, using the preset as art
    direction rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express survival pressure, terrain
    hazards, creature scale, extraction timing, and frontier resource logic without forcing a
    landscape postcard.
  color_and_tone: >-
    Grade the image with muddy bronze, oxidized green, and campfire amber; earth ochre, moss green,
    frost blue, volcanic black, coral color, bronze mud, and storm-violet accents; keep tonal
    hierarchy strong enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with bioluminescence, campfire pools, blizzard glare, forge heat, underwater
    shafts, and storm flashes; use highlights and shadow pockets to reveal routes, hazards,
    factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from bronze fittings and marsh-wet canvas; reeds, peat water, green copper, and
    wet roots; wet foliage, mineral crust, fur, coral, packed snow, mud, rope, leather, patched
    tents, and chipped field gear; make props, clothing, creatures, vehicles, architecture, and
    terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from hostile biome traversal, survival pressure, creature
    scale, weathered camps, and readable hunt routes: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood humid occult pressure; feral, precarious, exploratory, weather-beaten, predatory,
    and resource-starved; the result can be adult, harsh, seductive, eerie, or violent when prompt X
    asks for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as survival-game art with clear traversal cues, tactile terrain, and no generic scenic
    wallpaper; preserve clean focal hierarchy, believable material response, heavy-denoise clarity,
    and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Bronze, Marsh, Siege, Camp; besieged objective logic; muddy bronze, oxidized green, and campfire
    amber; bioluminescence, campfire pools, blizzard glare, forge heat, underwater shafts, and storm
    flashes; bronze fittings and marsh-wet canvas; walls, breach lanes, and fallback rings; humid
    occult pressure
  creative_brief: >-
    Apply Bronze Marsh Siege Camp as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
