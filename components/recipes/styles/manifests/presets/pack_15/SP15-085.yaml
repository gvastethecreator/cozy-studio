visualDna:
  aesthetic:
    'A decentralized network language: linked nodes, branching routes, redundant paths, packet-like
    blocks and pulse intervals organize forms as connected systems rather than isolated devices.'
  subject_treatment:
    Preserve subject, action and locks. Translate open structure, clothing or surfaces into
    a readable node-and-route hierarchy. Anchor routes to the requested subject and directly pertinent objects;
    leave unrelated decor, plants, walls and floors free of network lines. Retain Signalpunk pulses and insulated
    gaps as network expressions.
  color_and_tone:
    Use ink, graphite or deep indigo with high-contrast cyan, mint, signal red or cream at key
    nodes. Respect palette locks and reserve accents for connection hierarchy.
  lighting_and_shadow:
    Follow specified sources and direction. Where open, use small node glints or restrained
    pulse accents as part of the network, not independent glow.
  texture_and_material:
    Combine matte structures with clean printed traces, insulated breaks and small luminous
    or reflective nodes. Preserve locked materials while making open surfaces network-readable.
  camera_and_composition:
    Preserve view and crop. Use connected paths to guide the eye through the existing
    composition; do not force a screen, diagram, server room or hub.
  atmosphere_and_mood:
    Suggest exchange, resilience, secrecy or collective intelligence through connectivity
    and redundancy, aligned to the requested tone.
  rendering_and_quality:
    Use precise routing, distinct node sizes and clean packet-like blocks. Keep the network
    legible, sparse and restricted to the requested subject and directly pertinent objects; leave unrelated
    background surfaces clear; avoid tangled meshes and decorative circuit wallpaper.
    Add no invented slogans, labels or pseudo-text unless requested.
avoidRules:
  - Do not substitute a network diagram or device for the requested subject.
  - Do not force hacker, server-room or surveillance narratives.
  - Keep routes connected and purposeful on the requested subject and directly pertinent objects; leave unrelated background surfaces free of network lines.
  - Add no invented slogans, labels, signs or pseudo-text unless requested.
