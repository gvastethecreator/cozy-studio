  aesthetic: 'Devotional medieval anime built around vows and heraldry: kneeling figures, banners, stained light and solemn symmetry.'
  subject_treatment: Keep the prompt's subject and setting; stage it as a solemn act of promise, framed by emblems, banners or architecture already present.
  color_and_tone: Heraldic reds, blues and golds against cold stone grey, colored light falling from high windows.
  lighting_and_shadow: Colored shafts of window light and candle glow, soft shadows pooling at the base of pillars.
  texture_and_material: Embroidered banners, polished plate, worn stone and wax, drawn with fine line and flat cel.
  camera_and_composition: Symmetrical frontal framing down a nave or hall, the subject small and centered.
  atmosphere_and_mood: Solemn and sacred, loyalty felt quietly rather than shouted, with deep restrained emotion.
  rendering_and_quality: Refined prestige anime with careful ornament and luminous colored light.
  key_features: symmetry; heraldic banners; colored window light; kneeling vow
