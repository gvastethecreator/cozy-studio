visualDna:
  aesthetic: 'Spectral GPU path tracing: an unbiased GPU render with spectral light, so glass and gems split light into rainbow caustics, finished with glare and bloom.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Vivid saturated color, deep glossy blacks, rainbow dispersion edges, hot bloomed highlights.
  lighting_and_shadow: HDRI plus area lights; sharp caustic patterns under glass, soft contact shadows, glare streaks on speculars.
  texture_and_material: Hyper-glossy clearcoats, faceted glass, thin-film iridescence, micro-scratches in highlights.
  camera_and_composition: Three-quarter hero view, shallow depth of field with smooth round bokeh.
  atmosphere_and_mood: Dazzling and showy, every surface competing to sparkle.
  rendering_and_quality: Fully converged path trace with dispersion and post glare; no noise and no flat plastic shading.
  key_features: spectral dispersion rainbows; caustics under glass; glare and bloom; glossy clearcoat; round bokeh
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Octane Spectral GPU Path Tracer as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
