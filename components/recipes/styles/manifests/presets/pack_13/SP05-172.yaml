visualDna:
  aesthetic: >-
    Anime linework pairs fine engraved contours with crisp beveled planes and measured
    geometry.
  subject_treatment: >-
    Retain subject and materials; mechanical detail only on shown mechanisms, no divination
    symbols by default.
  color_and_tone: >-
    Slate, steel blue, muted gold, plum, warm neutral; metallic accents localized.
  lighting_and_shadow: >-
    Precise edge highlights and firm cool shadows; gleam only on actual metal.
  texture_and_material: >-
    Restrained crosshatch and grain within selected planes; no synthetic metal texture.
  camera_and_composition: >-
    Keep viewpoint; balance existing forms with geometric space, no skyline or symbols.
  atmosphere_and_mood: >-
    Suspended tension only where prompt supports it; preserve the requested tone.
  rendering_and_quality: >-
    Crisp edges, controlled facets, sparse line detail, no fake inscriptions.
  key_features: >-
    Engraved contour, beveled value planes, localized metal accents, restrained geometry
  creative_brief: 'Apply a visual treatment centered on engraved contour, beveled value planes, localized metal accents, restrained geometry. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
