visualDna:
  aesthetic: Bio-arcane medieval future where catacombs, bone machinery, roots, and rune conduits grow into one system.
  subject_treatment: >-
    Transform any subject with bio-arcane medieval biotech, riblike structure, crystal growth accents,
    cable-vine rhythm, and damp bone-rune material logic without forcing a fixed organism.
  color_and_tone: Bone cream, black soil, muted moss, sickly turquoise, oxidized copper, and dark violet shadow.
  lighting_and_shadow: Bioluminescent accents create simple pocket light inside clean catacomb shadow shapes.
  texture_and_material: Bone, root fiber, damp stone, etched copper, translucent membranes, crystals, and mineral growth.
  camera_and_composition: Tunnel depth, rib-like arches, centered relic organism, and organic symmetry.
  atmosphere_and_mood: Ancient, uncanny, subterranean, and sacred-biological.
  rendering_and_quality: >-
    Detailed dark-fantasy digital illustration with organic-mechanical clarity, defined contours, and
    restrained horror.
  creative_brief: >-
    Reusable visual system for any subject needing medieval biotech unease, bone-growth structure, rune logic,
    and damp organic material pressure.
