visualDna:
  aesthetic: 'Analog sitcom multicam: a frame of a studio comedy recorded on broadcast videotape and dubbed a few generations, so the signal itself carries the look.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Slightly bleeding reds and oranges, lifted blacks, warm tape cast, soft highlight blooming.
  lighting_and_shadow: Even studio wash softened further by the tape; no deep shadows.
  texture_and_material: Interlace combing on movement, dot crawl on edges, chroma bleed, faint tracking ripple at the bottom.
  camera_and_composition: Multicam medium shots cutting between actors, framed a little loose.
  atmosphere_and_mood: Nostalgic and warm, a rerun remembered through worn tape.
  rendering_and_quality: Standard-definition tape signal with generation loss; no film grain or HD sharpness.
  key_features: interlace combing; chroma bleed; dot crawl; tape generation softness; loose multicam medium shots
  creative_brief: "Analog sitcom multicam: a frame of a studio comedy recorded on broadcast videotape and dubbed a few generations, so the signal itself carries the look. Carry it through interlace combing, chroma bleed, dot crawl, tape generation softness, loose multicam medium shots. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
