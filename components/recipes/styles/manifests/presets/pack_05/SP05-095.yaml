visualDna:
  aesthetic: 'Tsukasa Abe Frieren manga art: delicate thin pen lines, gentle understated faces, quiet pastoral fantasy landscapes and a wistful sense of time passing long after the adventure ended.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Abe designs, calm understated faces, long pale hair, simple traveling cloaks and small restrained gestures. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pale watercolor washes in faded mint, ivory, soft sky blue and dusty gold on white paper.
  lighting_and_shadow: Soft pale daylight rendered with minimal tone, leaving lots of white paper to breathe.
  texture_and_material: Thin delicate pen lines, light screentone and faded watercolor wash color pages.
  camera_and_composition: Quiet wide landscapes with small travelers, and gentle close-ups on remembering faces.
  atmosphere_and_mood: Keep the requested mood with wistful quiet remembrance.
  rendering_and_quality: Delicate understated fantasy manga illustration with faded pale washes and calm pacing.
  key_features: Tsukasa Abe thin line; pale washes; wistful travel; understated faces
  creative_brief: "Tsukasa Abe Frieren manga art: delicate thin pen lines, gentle understated faces, quiet pastoral fantasy landscapes and a wistful sense of time passing long after the adventure ended. Carry it through Tsukasa Abe thin line, pale washes, wistful travel, understated faces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
