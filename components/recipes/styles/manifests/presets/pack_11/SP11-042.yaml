visualDna:
  aesthetic: 'Frutiger Aero: mid-2000s glossy optimism with water, bubbles, green fields, blue skies and glassy UI shine.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: placed in a glossy clean world of blue sky, green grass, water droplets, bubbles and aqua glass reflections."
  color_and_tone: Aqua blue, grass green, white and glossy silver, used consistently across subject and background.
  lighting_and_shadow: Bright clean daylight with lens flares and glass shine.
  texture_and_material: Glass, water droplets, bubbles and glossy plastic, visible at card size as the signature of the style.
  camera_and_composition: Clean airy framing with lots of sky, arranged so the subject still reads at card size.
  atmosphere_and_mood: Optimistic, fresh, clean and nostalgic, driven by the construction, color and rhythm.
  rendering_and_quality: Glossy 2000s digital render, with clean, deliberate marks and no accidental noise.
  key_features: aqua glass; bubbles; blue sky; green hills; glossy shine
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Frutiger Aero as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
