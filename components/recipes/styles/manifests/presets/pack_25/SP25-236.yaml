visualDna:
  aesthetic: 'Sketchnote Visual Notes: hand-drawn visual notes mixing quick doodles, hand lettering, arrows and containers into one lively explanation.'
  subject_treatment: Explain the prompt's topic as hand-drawn visual notes, quick doodles, boxed hand-lettered headings and arrows, every requested word spelled exactly.
  color_and_tone: Black fineliner with one or two marker accent colors and grey shadows.
  lighting_and_shadow: Flat paper with simple grey marker shadows under boxes and doodles.
  texture_and_material: Fineliner ink, marker strokes and a clean notebook page.
  camera_and_composition: A central title with ideas radiating or flowing in a clear reading path.
  atmosphere_and_mood: Friendly, energetic and approachable, like a great teacher at a whiteboard.
  rendering_and_quality: Crisp hand-drawn notes with confident lines and legible lettering.
  creative_brief: "Sketchnote Visual Notes: hand-drawn visual notes mixing quick doodles, hand lettering, arrows and containers into one lively explanation. Carry it through doodles and hand lettering, marker accents, clear reading path, boxed headings. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: doodles and hand lettering; marker accents; clear reading path; boxed headings
