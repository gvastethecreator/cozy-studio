  creative_brief: "Liquid satin drape: silk-satin garments that pour like liquid, with bias-cut flow and mirror-soft highlights. Carry it through liquid bias-cut satin, sliding highlights, pouring folds, luminous sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
