visualDna:
  aesthetic: 'Swiss modernist photo poster: a tightly cropped black-and-white photograph placed on a strict grid with one or two flat color geometric shapes.'
  subject_treatment: Keep the prompt subject and action; this preset owns the grid composition of a bold photo crop and flat geometric shapes, with no typography, and it never adds slogans, lettering or empty title plates.
  color_and_tone: High-contrast black-and-white photography with one flat signal red or blue shape, lots of white.
  lighting_and_shadow: Hard studio or sunlight in the photograph, deep blacks, crisp shadow shapes that echo the grid.
  texture_and_material: Fine gravure grain in the photo, flat offset ink in the shapes, smooth white stock.
  camera_and_composition: Extreme crop, off-center subject aligned to grid columns, strong diagonals and bleed off the edge.
  atmosphere_and_mood: Objective, precise and dynamic, calm energy held in tension.
  rendering_and_quality: Rigorous alignment and clean hierarchy; no text blocks, no ornament and no gradients.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Swiss Grid Photo Poster as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: extreme black-and-white photo crop; strict grid; one flat red or blue shape; white space; bleed off the edge
avoidRules:
  - invented slogans
  - fake lettering
  - empty title plate
  - real musician likeness
  - typography columns
  - decorative ornament
  - watermark
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
