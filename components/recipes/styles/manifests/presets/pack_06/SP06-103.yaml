visualDna:
  aesthetic: 'Side-scrolling exploration art: a dark near-black gameplay plane in front of four to six parallax layers that fade into colored fog.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a flat side-on view built from layered parallax planes, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Foreground near black, midground rich teal or violet, background washed into pale fog; one warm accent for the focal light.
  lighting_and_shadow: Backlit silhouettes with thin rim light, god-rays through gaps, glowing flora and embers as small light sources.
  texture_and_material: Painted or pixel textures that lose contrast with each layer, crisp foreground edges, drifting particles.
  camera_and_composition: Strict side view; the walkable silhouette runs across the lower third, depth stacked in horizontal bands.
  atmosphere_and_mood: Lonely and curious, a vast place explored one room at a time.
  rendering_and_quality: Clear value separation between planes so the foreground path always reads.
  key_features: strict side view; stacked parallax layers; near-black foreground; fog-washed background; rim-lit silhouettes
  creative_brief: "Side-scrolling exploration art: a dark near-black gameplay plane in front of four to six parallax layers that fade into colored fog. Carry it through strict side view, stacked parallax layers, near-black foreground, fog-washed background, rim-lit silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
