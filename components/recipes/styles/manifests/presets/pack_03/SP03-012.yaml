visualDna:
  aesthetic: 'Liquid simulation material: the target formed from moving fluid — splashing, sheeting and breaking into droplets while keeping its silhouette.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Clear water, colored juice or ink as the prompt suggests; bright specular droplets.
  lighting_and_shadow: Backlight through the liquid for glow, sharp specular points on every drop.
  texture_and_material: Surface tension skins, crown splashes, thin sheets tearing into droplets, foam.
  camera_and_composition: Keep the requested framing; the frozen instant shows the flow direction.
  atmosphere_and_mood: Kinetic and refreshing, a form held together for one instant.
  rendering_and_quality: High-resolution fluid sim frozen in time; no stiff plastic water.
  key_features: fluid-formed silhouette; crown splashes; droplets tearing off; surface tension; backlit glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Liquid Simulation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the surroundings
  - changing the camera
  - converting every object in the scene
  - readable text
  - logo
  - solid
  - dry
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - wrong material
  - pasted stock texture
  - flat color fill
  - shaderless surface
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
