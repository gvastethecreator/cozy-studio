visualDna:
  aesthetic: 'Cutout Image Windows: geometric windows crop the images in ways tied to the page structure, revealing just enough.'
  subject_treatment: Crop the prompt's images through geometric windows tied to the page grid, keeping their essential content and every title exact.
  color_and_tone: Contrasting ground and window edge, with the images left uncolored.
  lighting_and_shadow: Image light preserved, the crop flat and clean.
  texture_and_material: Clean edges and a sober support with plain paper.
  camera_and_composition: One large main window with text aligned to its useful limits.
  atmosphere_and_mood: Discovery through framing and rhythm, deliberate and graphic.
  rendering_and_quality: Crisp spread where no crop removes essential meaning.
  creative_brief: "Cutout Image Windows: geometric windows crop the images in ways tied to the page structure, revealing just enough. Carry it through geometric windows, grid-tied crops, one main window, essential content. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: geometric windows; grid-tied crops; one main window; essential content
