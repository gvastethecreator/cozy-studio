visualDna:
  aesthetic: 'Multispectral palimpsest: false-color processed manuscript where scraped-off earlier writing and drawings show in red over the later text.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: shown as a recovered layer on parchment: the hidden older image in red or magenta, later marks in grey."
  color_and_tone: Pale grey parchment with recovered red, exactly as the instrument maps its signal.
  lighting_and_shadow: Even flat lighting, because the image shows signal, not ordinary light.
  texture_and_material: Parchment fibers, erased ink and holes, as real instrument artifacts rather than decoration.
  camera_and_composition: Flat page view, matching how this instrument actually frames data.
  atmosphere_and_mood: Scholarly, secret, ancient and haunting, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Multispectral palimpsest: false-color processed manuscript where scraped-off earlier writing and drawings show in red over the later text. Carry it through recovered red layer, grey later text, parchment. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: recovered red layer; grey later text; parchment
