schemaVersion: 1
id: SP10-035
packId: pack_10
name: Magical Realism
category: 4. Surrealism & Dream
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - surrealism-and-dream
visualDna:
  aesthetic: >-
    Magical Realism becomes a transferable surreal symbolic transformation system: start from
    Grounded impossible realism, One quiet impossibility, and One impossible element, then route
    prompt content through impossible logic, dream scale, symbolic displacement, liminal staging,
    and psychic texture without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Realistic to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Natural; use color as emotional unreliability, nostalgic drift, uncanny
    contrast, or symbolic temperature, with enough value control that the subject remains readable
    after the style layer is applied.
  lighting_and_shadow: >-
    Let Subtle glow drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Real as the tactile or mark-making basis; surfaces should support the illusion with
    believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around One impossible element as reusable spatial grammar: favor symbolic focal points,
    scale mismatch, empty thresholds, doubled images, and psychologically charged negative space,
    adapting cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Wonder, grounded as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Literary, subtle: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Grounded impossible realism; Realistic; Natural; Subtle glow; Real; One impossible element;
    Wonder, grounded; Literary, subtle; One quiet impossibility
  creative_brief: >-
    Route any subject through Magical Realism as a transferable surreal or dream-logic visual
    system: preserve prompt intent while converting scale, causality, symbolism, edge behavior,
    mood, and spatial contradiction through this preset. Apply magical realism as restrained
    contradiction over the input with mostly natural rendering, one impossible detail treated as
    ordinary, subtle glow, grounded texture, and calm acceptance. If mundane props or interiors
    exist, let one element disobey physics; otherwise add a quiet impossibility to the subject
    without turning it into overt fantasy or cartoon.
avoidRules:
  - fantasy
  - cartoon
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
assets:
  defaultImage: /assets/recipes/styles/defaults/SP10-035.webp
attributes:
  negativePrompt: >-
    fantasy, cartoon, literal fantasy scene lock, generic dream blur, literal card scene, style-card
    boilerplate, muddy noise, watermark
