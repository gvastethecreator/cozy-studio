visualDna:
  aesthetic: >-
    Tie Dye becomes a transferable textile and ornamental pattern system: start from Spiral dye
    pattern and Spiral center, then route prompt content through motifs, repeats, weave logic,
    decorative grids, stitched marks, and surface ornament without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Bleeding edges to wrap, embroider, tile, dye,
    weave, print, or camouflage forms while preserving the prompt subject underneath; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Rainbow, vibrant; treat palette as dye, thread, ceramic pigment, woven
    banding, motif hierarchy, or cultural ornament logic, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: use soft fabric light, glazed highlights, stitch shadows,
    woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Cotton as the tactile or mark-making basis; surface detail must follow yarn, fiber,
    glaze, dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props,
    spaces, or close material studies.
  camera_and_composition: >-
    Compose around Spiral as reusable spatial grammar: favor repeat rhythm, motif scale, borders,
    allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Groovy, fun as the emotional register; derive mood from craft, ritual, fashion, domestic
    texture, camouflage, ornament, or folk memory, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Hippie, handmade: finish with readable pattern scale, tactile detail, and no
    wallpaper pasted over the subject, preserving prompt X as the base content and the preset as the
    style router.
  key_features: >-
    Spiral dye pattern; Bleeding edges; Rainbow, vibrant; Flat; Cotton; Spiral; Groovy, fun; Hippie,
    handmade; Spiral center
  creative_brief: >-
    Apply tie-dye behavior to the input: radial folds, pigment blooms, spiral bleed, unpredictable
    color rings, and fabric-like saturation should make surfaces feel hand-dyed without requiring
    shirts or festival context.
avoidRules:
  - sharp lines
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
