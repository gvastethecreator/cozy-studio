  color_and_tone: Bright cheap fantasy greens, sky blue and sunny yellow.
  lighting_and_shadow: Simple bright village daylight and big cartoon explosion flashes with smoke.
  texture_and_material: Contemporary digital television cel with clean outlines, soft gradient highlights and painted fantasy backgrounds.
  camera_and_composition: Comedic timing shots, reaction close-ups and explosion wides.
  atmosphere_and_mood: Keep the requested mood with chaotic useless comedy.
  rendering_and_quality: Loose springy comedy television frame with off-model energy.
  key_features: Springy slapstick; off-model faces; useless heroes; explosions
  creative_brief: "Studio Deen Konosuba look (2016): deliberately wobbly off-model comedy, springy slapstick timing, useless heroes and bright cheap fantasy villages. Carry it through Springy slapstick, off-model faces, useless heroes, explosions. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
