visualDna:
  aesthetic: 'QR-style pattern: square module grid inspired by QR codes, decorative and non-scannable.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is built from black square modules with finder-like corner squares, deliberately non-functional."
  color_and_tone: Black modules on white, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Square pixel modules, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Digital, graphic, cryptic and modern, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  key_features: square module grid; decorative finder squares; illustrative only
  creative_brief: "QR-style pattern: square module grid inspired by QR codes, decorative and non-scannable. Carry it through square module grid, decorative finder squares, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - readable labels or numbers
  - scannable or functional code
  - claims of accurate measurement
  - round
  - analog
  - random text labels
