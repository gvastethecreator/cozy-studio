visualDna:
  aesthetic: >-
    Bold anime ink meets flat mineral color and small seal-like marks on restrained paper.
  subject_treatment: >-
    Preserve subject and design; add symbolic motifs only when prompt includes them.
  color_and_tone: >-
    Vermilion, pine, charcoal, warm ivory, muted brass with separated values.
  lighting_and_shadow: >-
    One clear highlight direction and firm shadows; imply no moonlight or sacred setting.
  texture_and_material: >-
    Dry-brush edges and slight paper grain; graphic marks sparse and non-symbolic by
    default.
  camera_and_composition: >-
    Respect crop; vertical emphasis only if the supplied composition supports it.
  atmosphere_and_mood: >-
    Mythic or playful mood follows prompt; no creature, contract, or ritual is implied.
  rendering_and_quality: >-
    Thick-to-thin line, crisp cel blocks, no invented iconography.
  key_features: >-
    Bold mineral ink, vermilion-pine palette, restrained paper grain, symbols only when
    prompted
  creative_brief: >-
    Apply a visual treatment centered on bold mineral ink, vermilion-pine palette,
    restrained paper grain, symbols only when prompted. Preserve the exact subject, action,
    count, age, costume, setting, camera, and mood. Add nothing outside the prompt.
