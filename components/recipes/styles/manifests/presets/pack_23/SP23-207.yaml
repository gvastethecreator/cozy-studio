  aesthetic: 'Character-sheet margin sketch: a quick pencil or ballpoint portrait a player drew of their character in the corner of a sheet, eager, imperfect and full of personality.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; draw the subject as an eager imperfect player sketch in pencil or ballpoint.
  color_and_tone: Graphite or blue ballpoint on off-white paper, kept consistent across the whole image.
  lighting_and_shadow: Scribbled shading and uneven hatching, kept consistent across the whole image.
  texture_and_material: Pencil smudges, eraser marks and lined paper edges.
  camera_and_composition: Bust or full figure squeezed into a box on the page.
  atmosphere_and_mood: Keep the requested mood with heartfelt amateur devotion.
  rendering_and_quality: Charming imperfect sketch with no written stats, kept consistent across the whole image.
  creative_brief: "Character-sheet margin sketch: a quick pencil or ballpoint portrait a player drew of their character in the corner of a sheet, eager, imperfect and full of personality. Carry it through player doodle, ballpoint or pencil, eraser marks, boxed portrait. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: player doodle; ballpoint or pencil; eraser marks; boxed portrait
