visualDna:
  aesthetic: 'ONE original manga look as in Mob Psycho 100: crude wobbly amateur linework, minimal blank faces, empty white spaces and sudden psychic energy scribbles.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with ONE crude simplicity, bowl haircuts, blank dot eyes, simple bodies and ordinary clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink and white paper with rough scribbled tone.
  lighting_and_shadow: No modeled light, only scribbled energy lines and blank white glare.
  texture_and_material: Wobbly amateurish pen lines, rough scribbles and blank space.
  camera_and_composition: Flat simple panels that erupt into chaotic energy scribbles.
  atmosphere_and_mood: Keep the requested mood with deadpan psychic weirdness.
  rendering_and_quality: Crude charming manga illustration with explosive scribble energy.
  key_features: ONE crude line; blank faces; empty space; psychic scribbles
  creative_brief: "ONE original manga look as in Mob Psycho 100: crude wobbly amateur linework, minimal blank faces, empty white spaces and sudden psychic energy scribbles. Carry it through ONE crude line, blank faces, empty space, psychic scribbles. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
