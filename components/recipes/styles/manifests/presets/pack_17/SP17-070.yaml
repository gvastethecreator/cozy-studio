  aesthetic: Biomechanical medieval reliquary style with tendon cables, black iron, bone housings, cathedral machinery, and organic-machine dread kept non-graphic.
  subject_treatment: Any subject can become a biomechanical relic, figure, beast, armor, machine-chapel fragment, or symbolic object, but the preset does not force exposed organs or a fixed creature.
  color_and_tone: Black iron, bone, bruised flesh muted to clay, oxidized copper, surgical gray, oil green, and dull crimson accents.
  lighting_and_shadow: Cold surgical rim, furnace pin glow, reflective black metal edges, and open shadows.
  texture_and_material: Tendon-like cable bundles, ribbed housings, bone plates, waxy ceramic, oily metal, and medium-sized engineered-organic marks only.
  camera_and_composition: Vertical reliquary/sourcebook crop with one central constructed silhouette and architectural or altar support shapes.
  atmosphere_and_mood: Sacred, invasive, industrial, clinical, and medieval-gothic.
  rendering_and_quality: Stylized biomechanical fantasy illustration, rich but denoised, non-photoreal, no explicit gore.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Biomechanical Reliquary as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
