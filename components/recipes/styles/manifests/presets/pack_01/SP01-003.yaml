visualDna:
  aesthetic: 'Environmental portrait: the sitter placed inside the space that explains them, posed with intent, the room or landscape carrying half the story.'
  subject_treatment: Subject faces or acknowledges the camera from within their working or living space, surrounded by tools, objects, or terrain that reveal who they are.
  color_and_tone: Naturalistic palette taken from the location, gentle contrast, warm practical sources balanced with window or sky light.
  lighting_and_shadow: Ambient location light shaped with one subtle added source on the face; the environment stays readable in the shadows.
  texture_and_material: Rich tactile detail in the surroundings — worn wood, stone, metal, fabric, dust — rendered as real materials.
  camera_and_composition: 24–35 mm, subject at one third, deep depth of field so the environment stays legible, strong leading lines toward the sitter.
  atmosphere_and_mood: Grounded, dignified, and narrative.
  rendering_and_quality: Editorial magazine finish with believable exposure across subject and space.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Environmental Portrait as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: sitter inside their world; deep depth of field; environment as narrative; subtle added face light; leading lines
