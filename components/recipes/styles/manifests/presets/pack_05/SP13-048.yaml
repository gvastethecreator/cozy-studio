visualDna:
  aesthetic: 'Anime anticipation staging: the instant before the requested action, the subject compressed into a tight coiled pose at one edge of the frame, facing a large empty lead space it is about to cross.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the pre-motion coiled pose and the large empty lead space, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the empty lead space is a calm flat value while the subject holds the strongest contrast.
  lighting_and_shadow: Low side light that carves the tension in the coiled pose with hard short shadows.
  texture_and_material: Still surfaces, no motion marks at all; small tension details like gripping toes or taut fabric.
  camera_and_composition: The subject in the outer fifth of the frame, the rest left as open lead space in the direction of the coming move.
  atmosphere_and_mood: Held breath and loaded stillness, energy about to release.
  rendering_and_quality: Precise pose drawing with visible weight shift, calm backgrounds and zero motion effects.
  creative_brief: "Anime anticipation staging: the instant before the requested action, the subject compressed into a tight coiled pose at one edge of the frame, facing a large empty lead space it is about to cross. Carry it through coiled pre-motion pose, subject in outer fifth of frame, large empty lead space, no motion marks, low side light on the tension. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: coiled pre-motion pose; subject in outer fifth of frame; large empty lead space; no motion marks; low side light on the tension
