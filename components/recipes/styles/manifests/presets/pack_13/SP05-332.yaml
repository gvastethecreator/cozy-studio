visualDna:
  aesthetic: >-
    Organize the prompt's existing forms into a clear emblematic silhouette and repeat only shapes
    already present; use flat ink and gold to create allegorical hierarchy without inventing
    symbols.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep a compact ink, paper and
    gold palette, adapting it to explicit prompt colors.
  lighting_and_shadow: >-
    Use flat light/dark separation and restrained gold-like highlights; avoid cinematic lighting
    that obscures the emblematic read.
  texture_and_material: >-
    Favor flat areas, clean silhouette edges and repeated prompt-derived geometry; keep material
    cues legible.
  camera_and_composition: >-
    Give existing forms ordered visual hierarchy and balanced spacing without adding altar, frame or
    icon.
  atmosphere_and_mood: >-
    Ritual tone is a compositional cadence, not a new belief system or story; preserve the user's
    meaning.
  rendering_and_quality: >-
    Use only geometry found in the supplied subject; add no religious sign, sigil, prop, label or
    ritual scene. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Emblematic silhouette; repeated prompt-derived shape; flat ink/gold contrast; ordered spacing;
    icon-like hierarchy.
  creative_brief: 'Apply this visual treatment to the requested content: Emblematic silhouette; repeated prompt-derived shape; flat ink/gold contrast; ordered spacing; icon-like hierarchy. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - prompt-unrelated repeated symbols
  - mark clutter obscuring emblematic hierarchy
  - unrequested invented iconography
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-332.webp
