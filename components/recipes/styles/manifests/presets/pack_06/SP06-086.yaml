visualDna:
  aesthetic: 'Hobbyist top-down RPG map: 16 or 32 pixel square tiles in three-quarter overhead view with two-heads-tall chibi characters.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a three-quarter top-down tile map in which people become two-heads-tall chibi sprites, and adds no score, health bar, logo or readable interface text.
  color_and_tone: Bright flat palette with one-pixel darker outlines; grass, water and roofs each built from a small ramp.
  lighting_and_shadow: Flat daylight; a fixed dark shadow tile under trees, walls and characters.
  texture_and_material: Visible tile repetition, auto-tiled edges between grass, water and stone, and blocky roof and wall tiles.
  camera_and_composition: Overhead three-quarter view on a strict grid; buildings show front walls and roofs, characters face the camera.
  atmosphere_and_mood: Homemade and nostalgic, a small adventure built tile by tile.
  rendering_and_quality: Grid-aligned tiles, consistent chibi scale and no perspective drift.
  key_features: square tile grid; chibi sprites; auto-tiled edges; shadow tiles; three-quarter overhead view
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chibi Top-Down Tileworld as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
