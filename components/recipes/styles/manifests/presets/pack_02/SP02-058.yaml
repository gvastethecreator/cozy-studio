visualDna:
  aesthetic: >-
    X-Ray Photography acts as a transferable cinematic-media router: start from Internal structure,
    radiographic x-ray imaging with translucent density mapping, phosphor-sheet glow,
    skeletal/interior structure logic, and clinical negative contrast, Inverted density map,
    translucent layers, phosphor glow, radiographic negative and sensor-imaging system built from
    non-visible spectrum capture, diagnostic mapping, device artifacts, false color, and technical
    exposure constraints, then apply the media behavior to prompt X instead of recreating a fixed
    demo image.
  subject_treatment: >-
    Transform any prompt subject through Bones/Structure, internal-structure translation,
    translucent silhouette density, and diagnostic layer hierarchy without requiring bones or a
    medical subject; preserve the requested subject while translating visible surfaces into internal
    structure, heat zones, night-vision gain, phosphor glow, or diagnostic density maps, keeping the
    requested identity, silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with Black/White/Blue, indigo ghost, bone-white, translucent cyan; use color as
    sensor output: radiographic blues, thermal gradients, phosphor green, blackbody heat, scan
    density, or device-limited monochrome, with deliberate value grouping, accent control, and
    process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Translucent, backlit negative, see-through glow; make illumination feel
    device-derived through backlit density, infrared gain, emissive heat, phosphor bloom, noise
    amplification, or translucent structure, so exposure and shadow structure support the media
    process without overwriting the requested content.
  texture_and_material: >-
    Render Film, radiographic sheet, phosphor plate; surface detail should reveal film sheet grain,
    sensor noise, edge halos, interior silhouettes, heat speckle, phosphor streak, or diagnostic
    plate texture, keeping artifact scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Transparency, density mapping, interior-only view; compose through
    scan-plane clarity, central diagnostic readability, density hierarchy, technical crop, and
    device perspective without requiring medical subject matter, with frame rhythm, spacing, edge
    hierarchy, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Clinical, spooky, diagnostic, hidden structure; derive mood from clinical
    exposure, hidden structure, surveillance unease, spectral unreality, or technical discovery,
    letting the media style alter interpretation without demanding a specific story, location, or
    actor.
  rendering_and_quality: >-
    Finish with Medical, scientific, diagnostic clarity, ghostly penetration; finish as credible
    sensor output with readable mapped structures, controlled noise, and no normal-color photo
    fallback or fake UI labels, clean denoised surfaces where appropriate, and enough process
    evidence to make the style recognizable.
  key_features: >-
    Internal structure, radiographic x-ray imaging with translucent density mapping, phosphor-sheet
    glow, skeletal/interior structure logic, and clinical negative contrast; Inverted density map,
    translucent layers, phosphor glow, radiographic negative; Black/White/Blue, indigo ghost,
    bone-white, translucent cyan; Film, radiographic sheet, phosphor plate; Transparency, density
    mapping, interior-only view
  creative_brief: >-
    Apply X-Ray Photography as a cinematic-media preset over prompt X: preserve the user's requested
    subject, then route lens behavior, palette, light, signal or film texture, composition, mood,
    and final media craft through Internal structure, radiographic x-ray imaging with translucent
    density mapping, phosphor-sheet glow, skeletal/interior structure logic, and clinical negative
    contrast, Inverted density map, translucent layers, phosphor glow, radiographic negative, Film,
    radiographic sheet, phosphor plate without requiring the card image's original subject.
