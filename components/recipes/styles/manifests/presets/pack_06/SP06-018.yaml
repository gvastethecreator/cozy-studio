visualDna:
  aesthetic: 'Dip pen and ink: a flexible steel nib swelling from hairline to heavy line under pressure, with all tone built from hatching, cross-hatching and stippling.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Pure black ink on white; greys exist only as the density of lines and dots, from open parallel hatching to near-solid cross-hatch.
  lighting_and_shadow: A clear light direction expressed through hatch density; highlights are bare paper, deep shadow is four-direction cross-hatching.
  texture_and_material: Smooth hot-press paper, swelling and tapering nib lines, tiny ink catches at stroke starts, occasional fine spatter.
  camera_and_composition: Keep the requested framing; hatching follows the surface of each form so the lines describe volume.
  atmosphere_and_mood: Crisp, precise and old-fashioned, a book-plate clarity.
  rendering_and_quality: Every value made from line or dot, no grey wash, no smudge; line weight varies with pressure along each stroke.
  key_features: swelling flexible-nib line; hatching and cross-hatching for tone; stippled half-tones; bare-paper highlights; pure black on white
  creative_brief: "Dip pen and ink: a flexible steel nib swelling from hairline to heavy line under pressure, with all tone built from hatching, cross-hatching and stippling. Carry it through swelling flexible-nib line, hatching and cross-hatching for tone, stippled half-tones, bare-paper highlights, pure black on white. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
