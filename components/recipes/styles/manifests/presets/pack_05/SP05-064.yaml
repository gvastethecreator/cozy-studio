visualDna:
  aesthetic: Weathered travel-epic anime ink in long dry directional brushstrokes that skim the silhouettes and taper into sparse mineral abrasion, like wind-scored rock.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Muted earth, faded blue-gray and chalk highlights; no saturated color survives the weathering.
  lighting_and_shadow: Broad open midtones under overcast plains light, with a few thin edge highlights.
  texture_and_material: Dry-brush drag, soft pigment loss and abraded stroke tails; smooth or delicate materials stay intact.
  camera_and_composition: Keep the requested camera; stroke direction follows the forms already there rather than adding wind.
  atmosphere_and_mood: Worn endurance with a faint hope, redemption as a quiet reading.
  rendering_and_quality: A steady rhythm of long strokes and a readable silhouette; no ink splatter.
  key_features: long dry directional strokes; tapering abrasion tails; earth and faded blue-gray; chalk highlights; broad open midtones
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Wind-Scoured Redemption Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
