visualDna:
  aesthetic: >-
    Bright vector illustration using flat angular shapes, crisp contour cuts, and
    forward-leaning color wedges; its heat and optimism are graphic cues, not literal flames.
  subject_treatment: >-
    Keep the requested form and identity intact. Simplify its existing edges into clean angular
    planes and lively directional strokes; add no rescue gear or vehicle parts.
  color_and_tone: >-
    Mix warm coral, apricot, and yellow with clean cyan or lavender accents. Keep hues bright
    but clearly separated.
  lighting_and_shadow: >-
    Use flat, hard-edged cel shadows and simple warm highlights; avoid realistic firelight or an
    implied flame source.
  texture_and_material: >-
    Keep the original material legible beneath smooth color blocks, precise edge lines, and a
    few dry-brush accents.
  camera_and_composition: >-
    Respect the requested view. Carry momentum with angled marks and offset color planes inside
    the existing silhouette and crop.
  atmosphere_and_mood: >-
    Make the image feel urgent yet buoyant through quick directional strokes, open color, and
    uncluttered spacing.
  rendering_and_quality: >-
    Favor vector-clean edges, decisive shadow cuts, limited gradients, and readable shapes at a
    glance.
  key_features: >-
    Flat angular vectors; warm pastel-neon accents; forward motion wedges; crisp cel shadows.
  creative_brief: >-
    Keep the specified subject, action, and setting. Apply angular color planes, warm bright
    accents, and quick directional linework; add no flames, rescue machines, or gear.
