visualDna:
  aesthetic: >-
    Build the graphic anime treatment from weighty varied contours with rough, pressure-heavy
    strokes and compact forms built from dark blocks and worn midtone planes. Let short forceful
    marks interrupted by held stillness set its rhythm; use deep slate gray, faded teal, rust, and
    muted amber for color and scuffed ink, soft grain, and roughened edges in selected areas for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use weighty varied contours with rough,
    pressure-heavy strokes for edge work, compact forms built from dark blocks and worn midtone
    planes for form simplification, and short forceful marks interrupted by held stillness only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with deep slate gray, faded teal, rust, and muted amber. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard low-key separation with restrained warm edge accents. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with scuffed ink, soft grain, and roughened edges in selected areas,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use compact asymmetrical framing with strong diagonals
    and deep negative space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey weathered tension and dry resolve, while preserving
    the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with gritty edge texture, grounded values, and an uncluttered focal path; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    weighty varied contours with rough, pressure-heavy strokes; compact forms built from dark
    blocks and worn midtone planes; deep slate gray, faded teal, rust, and muted amber; short
    forceful marks interrupted by held stillness; scuffed ink, soft grain, and roughened edges in
    selected areas; compact asymmetrical framing with strong diagonals and deep negative space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with weighty varied
    contours with rough, pressure-heavy strokes, compact forms built from dark blocks and worn
    midtone planes, and deep slate gray, faded teal, rust, and muted amber; use short forceful
    marks interrupted by held stillness only where movement is already present, and apply scuffed
    ink, soft grain, and roughened edges in selected areas as the drawing finish.
