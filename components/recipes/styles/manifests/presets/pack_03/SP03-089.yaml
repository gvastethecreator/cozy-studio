visualDna:
  aesthetic: 'Live-action plate integration: a CG element composited into real photographed footage, matched in light direction, grain, lens blur and color.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: The plate's real color grade applied to the CG element; matched black levels.
  lighting_and_shadow: CG lit from the plate's HDRI, casting contact shadows and bounce onto real ground.
  texture_and_material: Matched film grain, lens distortion and slight motion blur on the CG element.
  camera_and_composition: Handheld or tripod live-action framing, CG element interacting with real surfaces.
  atmosphere_and_mood: Believable and startling, the impossible standing in a real place.
  rendering_and_quality: Seamless VFX composite; no floating, unshadowed cutout look.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Live-Action Plate Integration as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: CG in a real photographed plate; matched grain and lens; contact shadows on real ground; plate HDRI lighting; interaction
avoidRules:
