visualDna:
  aesthetic: 'Glossy 3D emoji: the subject as a chunky, rounded, candy-glossy icon with a simple expressive face.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: simplified into soft inflated volumes with rounded edges, oversized eyes and one clear expression, like a platform emoji rendered in 3D."
  color_and_tone: Bright saturated candy colors with soft gradients, used consistently across subject and background.
  lighting_and_shadow: Soft top light with big glossy highlights and a gentle contact shadow.
  texture_and_material: Smooth glossy plastic or gummy material with no fine texture.
  camera_and_composition: Centered single icon on a plain soft gradient background.
  atmosphere_and_mood: Cheerful, readable, cute and instant, driven by the construction, color and rhythm.
  rendering_and_quality: Clean 3D icon render with smooth subdivided surfaces, with clean, deliberate marks and no accidental noise.
  key_features: inflated rounded forms; glossy highlights; simple face; icon framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Emoji 3D as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
