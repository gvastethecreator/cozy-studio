visualDna:
  aesthetic: 'Painterly metaphor poster: one surreal visual pun painted with loose gouache and brush, the idea carried entirely by the image.'
  subject_treatment: Keep the prompt subject and action; this preset owns the single central visual-metaphor composition on a flat painted ground, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Two or three dominant muted colors on a flat painted ground, one saturated accent for the twist.
  lighting_and_shadow: Simple soft side light and flat shadow; drama comes from the idea, not the light.
  texture_and_material: Visible brush strokes, dry scumbles, paper or canvas texture, imperfect hand-cut edges.
  camera_and_composition: One central object isolated on a flat ground, large and frontal, with generous margins.
  atmosphere_and_mood: Witty, melancholy and thoughtful, a quiet shock.
  rendering_and_quality: Loose expressive painting with a clear single metaphor; no collage and no lettering.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Painterly Metaphor Poster as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: single visual pun; loose gouache brushwork; flat painted ground; one saturated accent; central frontal object
