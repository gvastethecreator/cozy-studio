visualDna:
  aesthetic: >-
    Model volume with directional hatching, then quantize each stroke into a consistent raster
    rhythm. Preserve clean open areas and keep the direction of every cluster tied to form.
  subject_treatment: >-
    Preserve requested identity, function, count, pose, action and proportions. Let hatch direction
    follow existing forms without reshaping them or adding detail.
  color_and_tone: >-
    Retain the requested palette and value relationships. Keep light areas clear and use existing
    colors or values for rasterized strokes without imposing a monochrome palette.
  lighting_and_shadow: >-
    Follow the requested lighting. Vary hatch direction and density to describe existing volume and
    shadows without creating a new light source or contrast pattern.
  texture_and_material: >-
    Keep raster edges coherent while preserving the material distinctions already shown. Avoid
    artificial print wear, coarse resolution or undirected pixel noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Rasterizing strokes
    does not change perspective or the requested arrangement.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Directional hatching and quantization affect mark-making
    only; they do not add a period or narrative.
  rendering_and_quality: >-
    Keep stroke direction visible at the final viewing size, with clean gaps and deliberate clusters.
    Avoid random dithering, uniform hatch bands and detail loss from coarse pixels.
avoidRules:
  - undirected raster noise or random dithering
  - unrequested print aging, coarse resolution or palette restriction
  - unrequested lettering or added graphic elements
