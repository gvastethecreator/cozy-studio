visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around wide crescent-like value
    sweeps interrupted by a thin scar of exposed midtone along existing contours. For color and surface, keep the source colors while grouping them into
    ink-dark masses, bone-gray planes, and a restrained muted-violet accent. Weight and
    uncertainty may deepen through withheld values, while the prompt's emotional
    register remains in control
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through wide crescent-like value sweeps
    interrupted by a thin scar of exposed midtone along existing contours; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep the source colors while
    grouping them into ink-dark masses, bone-gray planes, and a restrained muted-violet
    accent. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; place a narrow rim against
    broad soft occlusion, keeping the source light direction and all important shadow
    detail. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use smooth ink washes with a few dry-edged breaks
    where a value boundary changes direction. Keep texture subordinate to form and avoid
    a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; use
    curved value arcs and small gaps to steer attention inside the existing composition
    without adding a celestial motif. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Weight and uncertainty may deepen through
    withheld values, while the prompt's emotional register remains in control. Darkness
    and tension are optional tonal pressure, never a requirement to add danger or
    rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and wide crescent-like value sweeps interrupted
    by a thin scar of exposed midtone along existing contours; keep focal edges crisp,
    texture controlled, and dark values legible. Avoid photoreal or 3D-render drift,
    watermark, logo, and fake readable text.
  key_features: >-
    wide crescent-like value sweeps interrupted by a thin scar of exposed midtone along
    existing contours; keep the source colors while grouping them into ink-dark masses,
    bone-gray planes, and a restrained muted-violet accent; place a narrow rim against
    broad soft occlusion, keeping the source light direction and all important shadow
    detail; use smooth ink washes with a few dry-edged breaks where a value boundary
    changes direction; and use curved value arcs and small gaps to steer attention
    inside the existing composition without adding a celestial motif. The five cues
    should read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use wide crescent-like value sweeps interrupted
    by a thin scar of exposed midtone along existing contours, keep the source colors
    while grouping them into ink-dark masses, bone-gray planes, and a restrained
    muted-violet accent, place a narrow rim against broad soft occlusion, keeping the
    source light direction and all important shadow detail, and use smooth ink washes
    with a few dry-edged breaks where a value boundary changes direction; the prompt
    supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
