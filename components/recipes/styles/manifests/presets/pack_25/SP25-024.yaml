visualDna:
  aesthetic: 'Soft-Square Primitives: icon bodies assembled from softened squares with tense, consistent transitions between straight edges and curves.'
  subject_treatment: Assemble the prompt's subject or requested actions from softened square primitives with tense straight-to-curve transitions, avoiding reflex circles.
  color_and_tone: One ink or two functional values, flat and clean.
  lighting_and_shadow: Flat forms whose friendliness comes entirely from the geometry.
  texture_and_material: Smooth contours and related radii with openings large enough to read.
  camera_and_composition: Each box tuned by optical fill, all icons sharing one visual floor.
  atmosphere_and_mood: Contained warmth that still keeps serious actions looking serious.
  rendering_and_quality: Inner and outer radii stay related without thickening the joins.
  creative_brief: "Soft-Square Primitives: icon bodies assembled from softened squares with tense, consistent transitions between straight edges and curves. Carry it through softened squares, tense transitions, related radii, shared floor. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
