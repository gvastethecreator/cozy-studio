visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through mass movement at horizon scale; adventure setpiece logic, puzzle
    readability, environmental affordances, hub rhythm, and landmark staging, using the preset as
    art direction rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express puzzle affordances, hub
    readability, traversal choices, central devices, reward rhythm, and escape logic without
    requiring a literal dungeon room.
  color_and_tone: >-
    Grade the image with brass, oil black, and sky silver; warm tavern amber, sapphire blue,
    clockwork brass, prism light, dust white, mushroom red, and moon silver; keep tonal hierarchy
    strong enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with high-altitude rim light; portal glow, puzzle beams, lantern pools,
    stained shafts, crystal refraction, and guided objective light; use highlights and shadow
    pockets to reveal routes, hazards, factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from gears, clock plates, and polished mechanisms; worn stone, brass gears,
    painted signs without readable text, carved rails, puzzle blocks, tavern wood, and polished
    relics; make props, clothing, creatures, vehicles, architecture, and terrain share the same
    production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from adventure setpiece logic, puzzle readability,
    environmental affordances, hub rhythm, and landmark staging: lane rhythm, scale contrast,
    objective hierarchy, readable negative space, encounter depth, and motion vectors should adapt
    to portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood curious, adventurous, readable, mysterious, playful when relevant, and
    mechanically inviting; the result can be adult, harsh, seductive, eerie, or violent when prompt
    X asks for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as environment-adventure art with clear affordances, satisfying depth, and no generic
    quest-poster layout; preserve clean focal hierarchy, believable material response, heavy-denoise
    clarity, and no readable UI, text, logos, or stock key-art gloss.
  creative_brief: >-
    Apply Clockwork Sky Armada as a reusable video-game art-direction router over prompt X: preserve
    the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
  key_features: >-
    Clockwork, Sky, Armada; mass movement at horizon scale; brass, oil black, and sky silver;
    high-altitude rim light; gears, clock plates, and polished mechanisms; vertical cloud depth and
    suspended pathways; curious, adventurous, readable, mysterious, playful when relevant, and
    mechanically inviting
