visualDna:
  aesthetic: >-
    Manga-informed painting defines most edges through overlapping color planes rather than a continuous
    outer contour, while preserving the structure of the original drawing.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep distinctive features recognizable
    through selective line accents without redesigning the subject.
  color_and_tone: >-
    Retain the requested local colors, using broad shadow planes and a few focused color accents instead
    of an imposed palette or uniform outline contrast.
  lighting_and_shadow: >-
    Respect the requested light direction and use overlapping color shapes to carry its broad shadows;
    do not introduce a new source or highlight scheme.
  texture_and_material: >-
    Use short, controlled brush marks and layered edges; retain the represented materials without adding
    a global ink outline or generic surface effect.
  camera_and_composition: >-
    Keep the requested viewpoint, framing, crop and placement. Contour reduction affects rendering only,
    not the scene or relative positions.
  atmosphere_and_mood: >-
    Preserve the requested atmosphere and setting. The softer edge treatment does not imply a genre,
    character type or story change.
  rendering_and_quality: >-
    Define volume with broad, overlapping color planes and reserve line for important identity cues; keep
    edges intentional and the overall form readable without a continuous contour.
avoidRules:
  - unrequested subject redesign or genre shift
  - extra details that alter identity or function
