visualDna:
  aesthetic: 'Size comparison chart: variants of the subject lined up smallest to largest as flat silhouettes on a height grid, a human figure for scale.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a size-comparison lineup of silhouettes on a height grid with a human benchmark, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Warm off-white ground, charcoal silhouettes with slight value steps, one accent color for the featured form.
  lighting_and_shadow: No modeling; silhouettes read flat, with small ground-contact shadows only.
  texture_and_material: Clean filled silhouettes, thin grid lines, faint paper texture and tick marks on the height axis.
  camera_and_composition: Strict side view on one ground line, subjects ordered by height, human silhouette at the small end, tick marks without numbers.
  atmosphere_and_mood: Awe through scale, the largest shape dwarfing the rest.
  rendering_and_quality: Clear comparative chart with consistent scale and no unit numbers or names.
  key_features: smallest-to-largest lineup; human scale silhouette; height grid; shared ground line; unnumbered tick marks
  creative_brief: "Size comparison chart: variants of the subject lined up smallest to largest as flat silhouettes on a height grid, a human figure for scale. Carry it through smallest-to-largest lineup, human scale silhouette, height grid, shared ground line, unnumbered tick marks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
