visualDna:
  aesthetic: 'Exploded-view render: the subject taken apart along its assembly axis, every component floating in order with even gaps that show how it fits together.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the exploded assembly layout along one axis in a single view, keeping every part of the requested subject and adding nothing extra. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Each part in its true material and color against a pale neutral ground, with faint thin guide lines where parts align.
  lighting_and_shadow: Soft even studio light from above and in front, each part lit the same so none dominates, with faint occlusion on inner faces.
  texture_and_material: Clean machined, molded and woven parts, their internal faces, threads, springs and seals visible between the gaps.
  camera_and_composition: Three-quarter view with the explosion running on a diagonal, parts spaced in assembly order along shared axes.
  atmosphere_and_mood: Clear and satisfying, the hidden logic of an object laid open.
  rendering_and_quality: Precise CGI with parts neither overlapping nor randomly scattered, and no callouts, numbers or labels.
  key_features: parts floating along one assembly axis; even gaps; assembly order; thin alignment guides; no labels
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Exploded View as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - multi-view asset sheet
  - fake labels
  - brand logo
  - readable text
  - franchise likeness
  - callout numbers
  - randomly scattered parts
  - assembled
  - solid
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - random greeble clutter
  - muddy grime
  - organic blob shape
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
