visualDna:
  aesthetic: 'Colossal scale displacement: an ordinary object enlarged to the size of a hill or canyon and treated as terrain, with roads, trees and weather at its true scale.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into the requested object enlarged to landscape scale and inhabited as terrain, and that advertised structural change is the purpose of the preset.
  color_and_tone: The object in its real colors, softened by aerial haze on its far parts like a mountain.
  lighting_and_shadow: Landscape light with cloud shadows sweeping across the object and long shadows at its base.
  texture_and_material: 'Object material at colossal scale: scratches as ravines, weathering, moss and small trees growing on it.'
  camera_and_composition: A wide landscape view with tiny scale cues such as trees, roads or boats against the object.
  atmosphere_and_mood: Absurd and awe-struck, familiar things turned into geography.
  rendering_and_quality: Photographic landscape realism with correct haze and scale cues; never a tabletop miniature.
  creative_brief: "Colossal scale displacement: an ordinary object enlarged to the size of a hill or canyon and treated as terrain, with roads, trees and weather at its true scale. Carry it through ordinary object at landscape scale, aerial haze on the object, tiny scale cues, cloud shadows, weathering and growth on its surface. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ordinary object at landscape scale; aerial haze on the object; tiny scale cues; cloud shadows; weathering and growth on its surface
