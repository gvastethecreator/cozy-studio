visualDna:
  aesthetic:
    Japanese kami-and-yokai myth-noir uses ink-dark contours, folded-paper planes and restrained lacquer accents.
    Give one existing edge or join a single layered paper fold secured by a short cord tie, adapted to that form
    rather than added as an emblem. Use one vermilion or foxfire-blue accent within that localized cue, not as a
    new object.
  subject_treatment:
    Preserve the requested subject, action, ethnicity, anatomy, and any explicit costume lock.
    For unspecified details, translate the fold and short tie onto one existing seam, edge, or joint; keep the
    subject's materials and construction recognizable. Never add a mask, kami, yokai, or other subject to signal
    the style.
  color_and_tone:
    Use ink black, rain indigo, paper cream, wet vermilion, and a small moon-silver or foxfire-blue
    accent. Keep values open enough to read the subject. Preserve named material colors; where
    color is open, use ink or indigo in shadows and contours rather than recoloring the whole object.
  lighting_and_shadow:
    Preserve the requested light direction and time of day. Use the existing light to separate the folded plane
    from its surroundings; keep any lacquer glint small and on that cue. Do not add a lantern or emitter, or change
    day to night.
  texture_and_material:
    Distinguish the drawn paper fold, short cord tie, lacquer, carved wood, and patterned cloth only where those
    elements are designed into the image. Keep the existing material and its color visible; use clean pigment
    planes rather than mottled ink bloom, and do not coat every surface with gloss or paper grain.
  camera_and_composition:
    Honor the requested camera and staging. Anchor the single folded-paper and cord cue at one existing seam or
    crossing, with clear surrounding space. Do not repeat it over matching surfaces or impose a shrine, scroll,
    or ritual layout.
  atmosphere_and_mood:
    Carry uncanny courtesy, hidden intent, and ambiguous mercy through partial reveals and
    weather-soft edges. Let the prompt choose whether the result is quiet, frightening, playful, or luminous.
  rendering_and_quality:
    Render as drawn ink-and-color illustration with assertive contours, broad opaque pigment planes, and limited
    soft edges. Keep faces and action recognizable; use any lacquer glint only on the localized cue. Avoid
    polished product-render lighting, mottled distress, calligraphy, and pseudo-text.
avoidRules:
  - Preserve explicit identity, ethnicity, costume, and action locks; do not assign Japanese identity to an unrelated
    person.
  - Do not force a specific kami, yokai, shrine, lantern scene, ritual, or separate mask; use one integrated folded-paper
    or cord detail only on an existing form.
  - Avoid chibi shorthand, indiscriminate neon, pseudo-calligraphy, a literal handscroll layout, mottled ink bloom,
    camouflage-like distress, and repeating the selected fold or cord across matching surfaces.
