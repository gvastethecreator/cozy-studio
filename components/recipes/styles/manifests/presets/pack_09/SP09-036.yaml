visualDna:
  aesthetic: >-
    Water Damage turns material failure into the main visual language: start from Ceiling stain,
    Swollen drywall, and Bubbling paint, then turn damage history, contamination, corrosion,
    staining, abrasion, and material breakdown into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Ring edges: preserve identity and pose while letting forms
    age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Yellow, Brown stain as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Water Damage without hiding the prompt subject.
  texture_and_material: >-
    Render Swollen drywall through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Bubbling paint as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Gross, old by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Ruined, leak material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Ceiling stain; Ring edges; Swollen drywall; Matte; Bubbling paint
  creative_brief: >-
    Route any subject through Water Damage as a transferable weathering-and-decay visual system
    while preserving the prompt's subject, action, and setting. Render the cartography of neglect
    where brown and yellow tide lines ring across ceilings like the growth rings of a sick tree,
    each band a record of water's patient invasion. The surface should feel swollen and soft, gypsum
    turned to paste beneath bubbling paint that maps the path of the leak above. Capture the strange
    watercolor of decay, a ceiling painting itself in stains. Use Water Damage as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
