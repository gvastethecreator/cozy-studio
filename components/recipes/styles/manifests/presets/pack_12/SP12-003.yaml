visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through machine-scale choreography; escort-route readability; frontier
    science fiction, hard-surface machinery, exposed infrastructure, hazard alarms, and operational
    scale, using the preset as art direction rather than a required scene, mission, character, or
    card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express operational scale, machine
    relationships, frontier labor, breach pressure, and engineered movement without requiring a mech
    battle.
  color_and_tone: >-
    Grade the image with sun-baked ochre, bone white, and hot shadow blue; dust ochre, oxide orange,
    utility white, alarm red, teal monitors, gunmetal, and industrial blue; keep tonal hierarchy
    strong enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with heat haze and hard desert sun; bay floodlights, warning strobes, reactor
    glow, dust haze, underwater beams, and cold lab panels; use highlights and shadow pockets to
    reveal routes, hazards, factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from hydraulic limbs, armor plates, pistons, and dust-chipped paint; scratched
    armor, hydraulic joints, carbon shells, bolted plates, polymer glass, cables, and mineral dust;
    make props, clothing, creatures, vehicles, architecture, and terrain share the same
    production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from frontier science fiction, hard-surface machinery,
    exposed infrastructure, hazard alarms, and operational scale: lane rhythm, scale contrast,
    objective hierarchy, readable negative space, encounter depth, and motion vectors should adapt
    to portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood tense, industrial, exploratory, militarized, frontier-worn, and technically
    precise; the result can be adult, harsh, seductive, eerie, or violent when prompt X asks for it,
    but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as clean hard-surface readability with believable engineering, atmospheric depth, and no
    asset-render isolation; preserve clean focal hierarchy, believable material response,
    heavy-denoise clarity, and no readable UI, text, logos, or stock key-art gloss.
  creative_brief: >-
    Apply Desert Mech Convoy as a reusable video-game art-direction router over prompt X: preserve
    the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
  key_features: >-
    Desert, Mech, Convoy; machine-scale choreography; sun-baked ochre, bone white, and hot shadow
    blue; heat haze and hard desert sun; hydraulic limbs, armor plates, pistons, and dust-chipped
    paint; staggered vehicle spacing and dust trails; tense, industrial, exploratory, militarized,
    frontier-worn, and technically precise
