visualDna:
  aesthetic: 'Salt print from a calotype: an 1840s paper negative printed on salted paper, soft and fibrous, with warm matte tones sunk into the paper.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Warm reddish-brown to lavender-purple tones, low contrast, creamy paper highlights.
  lighting_and_shadow: Bright daylight softened by the paper negative; broad masses of light and shade.
  texture_and_material: Paper fibers printed through the image, matte surface, soft edges.
  camera_and_composition: Keep the requested framing; broad simple masses rather than fine detail.
  atmosphere_and_mood: Soft and painterly, an early photograph still halfway to a drawing.
  rendering_and_quality: Matte salted-paper print; not glossy albumen and not a metal plate.
  creative_brief: "Salt print from a calotype: an 1840s paper negative printed on salted paper, soft and fibrous, with warm matte tones sunk into the paper. Carry it through paper-negative fiber texture, warm brown-lavender tones, matte salted paper, soft broad masses, low contrast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: paper-negative fiber texture; warm brown-lavender tones; matte salted paper; soft broad masses; low contrast
