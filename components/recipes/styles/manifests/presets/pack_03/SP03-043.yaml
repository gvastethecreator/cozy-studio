visualDna:
  aesthetic: >-
    X-Ray Shader acts as a transferable CGI-style router: start from X ray transparency render,
    Internal view, see through silhouette and technical shader system built from sensor mapping,
    diagnostic palette, transparency rules, internal structure, and device-like signal clarity, then
    apply the 3D/render behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Internal structure; preserve the prompt subject while
    remapping it through x-ray visibility, thermal signal, internal layering, or technical
    diagnostic abstraction, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Blue/White inverted, clinical spectrum; use color as sensor output: monochrome
    x-ray values, heat gradients, cold-to-hot ramps, density contrast, and instrument-coded
    intensity, with deliberate value grouping, exposure control, and medium-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Internal glow, self illuminated core; make illumination behave like
    measurement: emissive heat, transparency, density falloff, internal glow, or diagnostic exposure
    instead of beauty lighting, so value structure supports the renderer and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Density based internal layers; surface detail should show internal structure, transparent
    layers, signal noise, heat zones, bone-like density, or scanner-like edge clarity, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for X Ray Shader: close three quarter or macro
    material framing, strong highlight planes, readable surface curvature, and controlled depth;
    compose through diagnostic readability, silhouette transparency, cross-section clarity, and
    instrument-like framing without fake UI dependence, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Analytical, cold, forensic insight; derive mood from scientific distance,
    surveillance unease, medical precision, or hidden-structure revelation, letting the renderer
    alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Medical, sci fi, diagnostic scan; finish with exact sensor logic, controlled
    artifacts, readable signal, and no cinematic beauty render overwrite, clean denoised surfaces
    where appropriate, and enough shader evidence to make the CGI mode recognizable.
  key_features: >-
    X ray transparency render; Internal view, see through silhouette; Blue/White inverted, clinical
    spectrum; Density based internal layers; Lookdev camera for X Ray Shader: close three quarter or
    macro material framing, strong highlight planes, readable surface curvature, and controlled
    depth
  creative_brief: >-
    Apply X-Ray Shader as a CGI/render preset over prompt X: preserve the user's requested subject,
    then route modeling, shader response, lighting, material scale, composition, mood, and final
    render craft through X ray transparency render, Internal view, see through silhouette, Density
    based internal layers without requiring the card image's original subject.
avoidRules:
