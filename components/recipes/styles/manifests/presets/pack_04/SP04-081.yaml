visualDna:
  aesthetic: 'Pose silhouette thumbnails: the subject drawn as a scatter of small solid brush-pen silhouettes in different poses and actions, testing gesture readability.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a sketchbook spread of ten to fifteen pose silhouettes of the same subject, each in a different action, and that layout replaces the requested framing.
  color_and_tone: Black brush-pen fills on warm toned sketchbook paper, with one grey marker for ground shadows and overlaps.
  lighting_and_shadow: No modeled light; readability comes only from outline and the negative space between limbs.
  texture_and_material: Brush-pen edges with dry-brush breaks, varied thumbnail sizes, faint pencil construction under some of the ink.
  camera_and_composition: Ten to fifteen thumbnails scattered across a sketchbook spread, each standing on a small shadow ellipse, varied in scale and energy.
  atmosphere_and_mood: Quick and searching, hunting for the one pose that reads.
  rendering_and_quality: Rough ink thumbnails only, no internal detail, no rendering, no finished figure.
  key_features: scattered pose silhouettes; black brush-pen fills; toned sketchbook paper; grey ground-shadow ellipses; gesture readability test
  creative_brief: "Pose silhouette thumbnails: the subject drawn as a scatter of small solid brush-pen silhouettes in different poses and actions, testing gesture readability. Carry it through scattered pose silhouettes, black brush-pen fills, toned sketchbook paper, grey ground-shadow ellipses, gesture readability test. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
