visualDna:
  aesthetic: >-
    Organize smooth orbital loops and counter-curves around broad, balanced planes with polished,
    enamel-like color blocks.
  subject_treatment: >-
    Preserve the requested content; echo existing contours with rounded loops and clean, stable geometry
    without adding a reactor or civic display.
  color_and_tone: >-
    Use a crisp light-dark foundation with one luminous cool or isotope-like accent and a small warm
    counterpoint; honor explicitly requested colors.
  lighting_and_shadow: >-
    Keep highlights controlled and broad enough to read as polished surfaces; separate planes with clean,
    uncluttered shadows.
  texture_and_material: >-
    Favor smooth enamel-like color, selective chrome sheen, and sparse terrazzo-like flecks rather than
    busy panel detail.
  camera_and_composition: >-
    Preserve the requested crop; arrange curved geometry in a calm, balanced rhythm around the existing
    focal area.
  atmosphere_and_mood: Suggest optimistic retro-futurism through clarity, measured symmetry, and bright-dark contrast.
  rendering_and_quality: >-
    Keep surfaces clean, curves continuous, and luminous accents contained so the large forms stay
    legible.
avoidRules:
  - radiation symbols or safety markings unless requested
  - glow that washes out the surface planes
  - excessive chrome reflections that obscure shape
