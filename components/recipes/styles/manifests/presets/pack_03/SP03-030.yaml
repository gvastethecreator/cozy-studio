visualDna:
  aesthetic: 'Glitch 3D: the subject as a corrupted mesh — stretched vertices, sliced and offset chunks and wrong RGB shader channels.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Base colors split into red, green and blue offsets, magenta error patches.
  lighting_and_shadow: Normal lighting interrupted by flipped normals and black missing faces.
  texture_and_material: Spiked vertices, displaced slices, texture stretching, z-fighting stripes.
  camera_and_composition: Keep the requested view; corruption concentrated on part of the subject.
  atmosphere_and_mood: Unstable and eerie, reality breaking at the seams.
  rendering_and_quality: Deliberate 3D data corruption, not a 2D glitch filter.
  key_features: spiked stretched vertices; sliced offset chunks; RGB channel split; flipped normals; z-fighting
  creative_brief: "Glitch 3D: the subject as a corrupted mesh — stretched vertices, sliced and offset chunks and wrong RGB shader channels. Carry it through spiked stretched vertices, sliced offset chunks, RGB channel split, flipped normals, z-fighting. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
