visualDna:
  aesthetic: >-
    Illustrated color cells divide surfaces into distinct drawn areas that follow the form, with dark
    separators varying in weight and only a few smooth transitions.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let cell boundaries follow existing
    structure without fragmenting or changing the subject.
  color_and_tone: >-
    Use the requested colors in contained areas and preserve their local relationships. Keep transitions
    limited without imposing a fixed jewel palette.
  lighting_and_shadow: >-
    Follow the requested lighting and shadow direction. Use a small number of color transitions to show
    form without adding glow or changing materials.
  texture_and_material: >-
    Keep the illustrated surface flat and clean. Color segmentation does not make the subject metal,
    glass or a physical translucent panel.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not divide the image into
    a window, grid or decorative panel layout.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Cell coloring does not add a stained-glass environment or a
    luminous atmosphere.
  rendering_and_quality: >-
    Vary dark separator weight to support structure and keep color areas distinct. Avoid panel framing
    and use smooth transitions only where they help describe the requested form.
avoidRules:
  - stained-glass panel framing
  - glass or metal material substitution
