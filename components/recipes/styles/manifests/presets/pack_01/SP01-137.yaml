visualDna:
  aesthetic: 'Tiny planet projection: a full 360-degree panorama bent into a stereographic circle, so the ground becomes a small globe and the sky wraps around it.'
  subject_treatment: Keep the prompt subject and action; this preset owns the stereographic tiny-planet projection, and the setting stays the prompt's.
  color_and_tone: Natural color with sky filling the outer ring, ground concentrated at the center.
  lighting_and_shadow: Daylight or dusk light; shadows radiate outward from the globe.
  texture_and_material: Buildings, trees and people bending outward from the round horizon.
  camera_and_composition: Circular planet at center, vertical objects pointing outward like spikes, subject standing on the curve.
  atmosphere_and_mood: Playful and dizzy, a whole place held like a toy globe.
  rendering_and_quality: Seamless stitched panorama with no visible seams, ghosting or broken lines.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tiny Planet Stereographic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: round tiny-planet ground; sky wrapping the edges; objects radiating outward; 360-degree stitch; centered globe
