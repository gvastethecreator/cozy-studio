visualDna:
  aesthetic: 'Industrial design clay buck: the subject milled full size in tan styling clay, with one half wrapped in silver foil film to judge the highlights.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Warm tan-ochre clay, one side foil-wrapped in dull silver, thin black tape lines marking the key design curves.
  lighting_and_shadow: Large overhead design-studio light panels throwing long highlight lines across the forms to judge surface quality.
  texture_and_material: Fine rake marks from clay slicks, crisp milled edges, wrinkles in the foil film, tape lines and a foam core base.
  camera_and_composition: Keep the requested view; the split between the clay half and the foil half runs down the center line.
  atmosphere_and_mood: Workshop-serious and exploratory, a design still being decided.
  rendering_and_quality: Physical styling clay with tool marks, never smooth grey CGI clay, and no hands or tools cluttering the frame.
  creative_brief: "Industrial design clay buck: the subject milled full size in tan styling clay, with one half wrapped in silver foil film to judge the highlights. Carry it through tan styling clay, silver foil half, black tape design lines, rake and slick marks, overhead light panels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tan styling clay; silver foil half; black tape design lines; rake and slick marks; overhead light panels
