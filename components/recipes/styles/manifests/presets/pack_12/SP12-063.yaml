visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on F-Zero GX gameplay screenshots: GameCube-era
    anti-gravity racing capture with desert sci-fi tracks, high saturation, speed tunnels, and
    arcade HUD pressure. Apply this after prompt X; prompt X supplies the subject, action, setting,
    and intensity while this preset supplies capture language, camera grammar, material behavior,
    playable readability, and finish. Do not recreate an exact official level, character, logo, or
    marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable F-Zero GX-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a F-Zero GX-informed palette: sand gold, cobalt sky, chrome blue, hot magenta boost, black
    track, and bright orange hazard pads. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through harsh desert sun, boost glow, tunnel strobe, reflective vehicle
    highlights, and saturated arcade bloom. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from early-2000s glossy track, low-poly desert monuments, hovering vehicles,
    energy pads, and bold texture panels. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person racing chase camera with steep track curves, rivals, speed lines, and
    checkpoint/position readability. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a F-Zero GX-derived mood: extreme, arcade-fast, futuristic, competitive, and slightly
    retro. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when
    prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: speed, lap, position, boost
    meter, and track minimap can appear as arcade racing UI. Maintain heavy-denoise clarity, crisp
    focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    F-Zero GX gameplay screenshots; GameCube-era anti-gravity racing capture with desert sci-fi
    tracks, high saturation, speed tunnels, and arcade HUD pressure; sand gold, cobalt sky, chrome
    blue, hot magenta boost, black track, and bright orange hazard pads; harsh desert sun, boost
    glow, tunnel strobe, reflective vehicle highlights, and saturated arcade bloom; early-2000s
    glossy track, low-poly desert monuments, hovering vehicles, energy pads, and bold texture
    panels; third-person racing chase camera with steep track curves, rivals, speed lines, and
    checkpoint/position readability; extreme, arcade-fast, futuristic, competitive, and slightly
    retro; HUD guidance: speed, lap, position, boost meter, and track minimap can appear as arcade
    racing UI
  creative_brief: >-
    Use F-Zero Obelisk Desert Race as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from F-Zero GX: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
