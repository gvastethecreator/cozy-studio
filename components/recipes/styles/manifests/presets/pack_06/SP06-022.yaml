visualDna:
  aesthetic: 'Oil pastel drawing: chunky greasy sticks pressed on thick and unblended, layered color over color and scratched back through with a blade to reveal what lies under.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Bold saturated primaries and secondaries, strong color layering where one hue shows through another, no subtle gradients.
  lighting_and_shadow: Simple bold light and shadow shapes in contrasting colors; lights often laid thick over darker layers.
  texture_and_material: Sticky waxy buildup, smeared thumb marks, sgraffito scratches revealing underlayers, crumbs of pastel on the surface.
  camera_and_composition: Keep the requested framing; forms simplified into chunky shapes with thick outlines of color.
  atmosphere_and_mood: Loud, joyful and tactile, a crude bold energy.
  rendering_and_quality: Thick unblended strokes, sgraffito line detail, waxy semi-gloss surface; no fine lines and no smooth gradients.
  key_features: thick greasy unblended strokes; sgraffito scratches through layers; waxy crumbs and smears; bold saturated color; chunky simplified shapes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Oil Pastel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
