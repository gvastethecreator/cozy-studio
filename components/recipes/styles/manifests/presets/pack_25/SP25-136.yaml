visualDna:
  aesthetic: 'Tear-Line Narratives: one planned tear line splits the package into a before and an after, each with its own complete message.'
  subject_treatment: Plan one tear line through the prompt's package so the outside message stays whole and an inside message appears on opening; keep both texts exact.
  color_and_tone: Colors that separate outside from inside while one shared identity holds.
  lighting_and_shadow: Neutral light and matching views to review the opening sequence.
  texture_and_material: A clear conceptual tear line, coherent board and plausible torn edges.
  camera_and_composition: Closed and opened views, the reveal placed away from torn zones.
  atmosphere_and_mood: Deliberate sequential discovery, a small moment of theatre.
  rendering_and_quality: Opening never destroys text that still matters afterwards.
  creative_brief: "Tear-Line Narratives: one planned tear line splits the package into a before and an after, each with its own complete message. Carry it through planned tear line, before and after, intact outer message, inside reveal. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: planned tear line; before and after; intact outer message; inside reveal
