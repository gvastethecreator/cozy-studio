visualDna:
  aesthetic: >-
    Use pale, quiet planes, shallow circular arcs, and slow wave contours with generous intervals of
    negative space.
  subject_treatment: >-
    Preserve the requested content; let existing edges pick up soft arcs and subtle resonant curves
    without adding crops, dishes, or ritual robes.
  color_and_tone: >-
    Set moonlit cream and cool gray against restrained leaf green or soft gold; keep contrast gentle
    while preserving silhouette clarity.
  lighting_and_shadow: >-
    Use broad cool bounce and thin earth-warm highlights, with soft shadow transitions rather than
    high-gloss glare.
  texture_and_material: Favor matte pale surfaces and fine fabric-like grain, with sparse translucent or metallic accents.
  camera_and_composition: >-
    Preserve the requested framing; use open spacing and a few broad arcs to create a quiet, spacious
    rhythm.
  atmosphere_and_mood: Convey calm, ecological optimism through soft repetition, low contrast, and measured breathing room.
  rendering_and_quality: Keep contours soft but distinct, highlights restrained, and delicate lines visible at small scale.
avoidRules:
  - a required greenhouse, dish, or lunar landscape
  - dense star fields that compete with the negative space
  - glossy reflections that harden the quiet palette
