    sparkle, and texture reveal as the light-response contract, with readable hierarchy, controlled
    contact detail, and no lighting choice that erases the user's requested content.
  texture_and_material: >-
    Render Smooth liquid chocolate, tempered-crystal snap, ganache-velvet, cocoa-butter silk,
    molten-viscosity plus sauce viscosity, crumb structure, gelatin shine, raw sheen, baked crust,
    ice, foam, steam, and surface freshness; surface scale, residue, gloss, grain, fiber, pores,
