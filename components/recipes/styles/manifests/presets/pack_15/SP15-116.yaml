visualDna:
  aesthetic:
    'Root the style in handmade rural folk-horror craft through effigy-like contours, knotted
    bindings, weathered ornament, and localized punk repairs on existing forms; evoke inherited tension
    without constructing a new ritual object or setting.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; apply rural craft marks, bindings, or
    effigy-like contour details to compatible existing forms. Do not add an effigy, scarecrow, warning text,
    cottage, or landscape unless requested.
  color_and_tone:
    Use weathered earth, straw, rust, or faded cloth only as localized material accents; preserve the
    prompt's palette, base materials, and requested horror intensity rather than forcing muted dusk.
  lighting_and_shadow:
    Use directional light that reveals binding, carving, and weathered edges; sustain the
    requested mood, from daylight unease to explicit horror, without flattening details into darkness.
  texture_and_material:
    Differentiate tied fiber, carved wood, aged cloth, clay, or weathered metal only where compatible
    with existing objects; localize craft wear instead of converting the room or applying blanket grit.
  camera_and_composition:
    Preserve the requested camera, subject placement, and environment; use asymmetry and local spacing in
    the existing composition without prescribing a field, forest, cottage, or ritual arrangement.
  atmosphere_and_mood:
    Carry rural folklore, communal tension, and punk defiance through binding and weathered craft details;
    support explicit horror or gore only when requested, without changing the scene into a rural ritual.
  rendering_and_quality:
    Keep bindings, ornament, and folk-derived contours legible; balance uncanny material
    detail with clear subject reading at thumbnail scale.
avoidRules:
  - a compulsory forest, field, scarecrow, or ritual
  - unrequested gore or horror intensity
  - folk ornament or fiber texture overwhelming the subject
  - a new shrine, cottage, or ritual room replacing the requested environment
  - unrequested warning text, logos, or readable symbols
