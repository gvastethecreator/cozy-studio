visualDna:
  aesthetic: >-
    Set a broad silhouette against long, soft color transitions; primary edges stay firm while
    secondary fields dissolve gently.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Simplify only
    secondary contours into large readable shapes.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, blend warm apricot, coral,
    and cream into cool lavender and blue; keep the division broad, not neon.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use wide softened illumination from the
    supplied source and gradual falloff; add no halo or glow source.
  texture_and_material: >-
    Apply texture only to materials already present. Lay transparent washes behind firmer
    primary contours; keep grain subtle and even rather than visibly painterly.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Treat existing masses as
    elongated value zones with open intervals; add no horizon, framing device or distant object.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Let expansive gradients affect tonal scale only;
    impose no emotional reading.
  rendering_and_quality: >-
    Separate the focal silhouette from open color fields without erasing surface detail; avoid
    bloom and edge fog.
  key_features: >-
    Broad silhouette; apricot-to-violet transition; diffuse source light; open horizontal value
    zones.
  creative_brief: 'Use broad silhouette; apricot-to-violet transition; diffuse source light; open horizontal value zones. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
