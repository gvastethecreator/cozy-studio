visualDna:
  aesthetic: Cozy TV-anime cel with soft rounded lineart, a blended amber glow and airbrushed twilight gradients, every corner of every shape softened.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Faces and bodies get soft rounded proportions and gentle expressions; do not add food, companions or a campfire the prompt did not name.
  color_and_tone: Amber, honey and cream in lit areas against twilight blue and dusty violet shadow, a warm-cool split of roughly sixty to forty.
  lighting_and_shadow: A low warm key wraps around forms from one side and falls off in a soft airbrushed gradient into cool ambient shadow.
  texture_and_material: Smooth airbrushed gradients, faint paper grain and a gentle diffusion glow laid over the highlights.
  camera_and_composition: Keep the requested view; relaxed eye-level spacing with a soft vignette pulling attention toward the warm center.
  atmosphere_and_mood: Comforting, generous and sleepy, the calm at the end of a long day.
  rendering_and_quality: Rounded clean contours, gentle two-tone shading and a light diffusion filter, with focal edges still readable inside the glow.
  key_features: rounded soft lineart; amber-to-twilight color split; airbrushed glow falloff; light diffusion filter; cream highlights
  creative_brief: "Cozy TV-anime cel with soft rounded lineart, a blended amber glow and airbrushed twilight gradients, every corner of every shape softened. Carry it through rounded soft lineart, amber-to-twilight color split, airbrushed glow falloff, light diffusion filter, cream highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
