visualDna:
  aesthetic: 'Anime tracking pan: the camera moves alongside the subject at its speed, so the subject is drawn sharp while the background smears into long horizontal color streaks.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the side-tracking pan with a streaked background and a sharp subject, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; background colors stretch into bands that keep their hue but lose all detail.
  lighting_and_shadow: Steady side light on the subject; the streaked background keeps only its broad value pattern.
  texture_and_material: Smooth horizontal streak bands behind a crisp cel subject, with a few longer streaks at ground level.
  camera_and_composition: Strict side-on profile view at subject height, the subject a little behind center with lead room in the direction of travel.
  atmosphere_and_mood: Sustained speed and a steady, flowing momentum.
  rendering_and_quality: Crisp subject, uniformly directional background streaks, no radial speed lines.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Panning Background Streak Frame as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: sharp subject on streaked background; horizontal color bands; side-on profile view; lead room ahead; no radial speed lines
