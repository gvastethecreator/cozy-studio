visualDna:
  aesthetic: 'Mold and mildew: fuzzy spotted mold colonies spreading over damp surfaces.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: patchy mold colonies and mildew spots spread over the target's damp surfaces. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Black, grey-green and white mold spots, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Dim damp light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Fuzzy mold colonies, spots and damp stains, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Unsettling, damp, neglected and organic, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: fuzzy mold colonies; mildew spots; damp stains; surface-level damage; structure intact
  creative_brief: "Mold and mildew: fuzzy spotted mold colonies spreading over damp surfaces. Carry it through fuzzy mold colonies, mildew spots, damp stains, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
