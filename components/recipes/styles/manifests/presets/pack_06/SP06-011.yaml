visualDna:
  aesthetic: 'Palette-knife painting: paint spread and scraped onto the canvas with a steel knife in flat, sharp-edged slabs instead of brushed.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Pure tube colors pulled together on the canvas with streaks of two colors in one slab; strong value jumps between neighbouring planes.
  lighting_and_shadow: Raking light catches the ridges of each slab, so the paint relief itself adds highlight and shadow.
  texture_and_material: Thick sculptural slabs with sharp ridges where the knife lifted, smooth flat faces where it pressed, bare canvas in the gaps.
  camera_and_composition: Keep the requested framing; forms built from a few big planes, small details reduced to single knife marks.
  atmosphere_and_mood: Bold and physical, a scene built with force.
  rendering_and_quality: Clean flat knife faces with hard edges and streaked color, no bristle marks and no soft blending.
  key_features: flat steel-knife slabs; sharp lifted ridges; streaked two-color swipes; raking-light relief; bare canvas gaps
  creative_brief: "Palette-knife painting: paint spread and scraped onto the canvas with a steel knife in flat, sharp-edged slabs instead of brushed. Carry it through flat steel-knife slabs, sharp lifted ridges, streaked two-color swipes, raking-light relief, bare canvas gaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
