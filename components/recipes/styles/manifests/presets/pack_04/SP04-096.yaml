visualDna:
  aesthetic: >-
    equipment silhouettes Tier Progression acts as a transferable illustration router: start from
    Tiered equipment progression sheet emphasizing upgrade readability, Multi-tier continuity,
    rarity-coded visual jumps, consistent proportion baseline and production concept-art system
    built from iteration discipline, silhouette testing, material exploration, design readability,
    and pitch-ready visual decisions, then apply the visual behavior to prompt X instead of
    recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Stable base silhouette with controlled complexity increase
    per tier; preserve the requested subject while routing it through design exploration, asset
    logic, value blocking, scale cues, iteration rows, paintover marks, or production-readability
    constraints, keeping the requested identity, silhouette, pose, object function, or setting
    legible.
  color_and_tone: >-
    Build color with Structured rarity progression from muted utilitarian to luminous high-tier
    accents; use color as concept decision-making: mood scripts, material swatches, faction accents,
    environment atmosphere, asset tier contrast, or readable pass separation, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Controlled comparison light with incremental specular/emissive escalation;
    shape light for ideation clarity through value block-in, keyframe contrast, material test
    highlights, callout illumination, or pitch-frame atmosphere, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Progressive material sophistication (wear, polish, inlay, arcane finish); surface detail
    should reveal brush passes, photobash integration, low-poly facets, callout texture, massing
    blocks, costume fabrics, foliage clusters, or weapon material tiers when named, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Fixed-view horizontal evolution layout with optional detail insets;
    compose through production hierarchy, variants, orthographic logic, isometric staging,
    silhouette grids, iteration boards, or cinematic keyframe balance without locking one finished
    illustration, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Aspirational, reward-centric, game-economy legibility, mood carried by equipment
    silhouettes Tier Progression craft, material pressure, and visual restraint; derive mood from
    exploration, worldbuilding pressure, tactical design, creature unease, kitbash utility,
    cinematic intent, or production-room clarity, letting the style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Comparative design board optimized for progression clarity; finish with concept-art
    usefulness, readable decisions, controlled roughness, and no generic fantasy wallpaper or
    overpolished final render when iteration is intended, clean denoised surfaces where appropriate,
    and enough process evidence to make the style recognizable.
  key_features: >-
    Tiered equipment progression sheet emphasizing upgrade readability; Multi-tier continuity,
    rarity-coded visual jumps, consistent proportion baseline; Structured rarity progression from
    muted utilitarian to luminous high-tier accents; Progressive material sophistication (wear,
    polish, inlay, arcane finish); Fixed-view horizontal evolution layout with optional detail
    insets
  creative_brief: >-
    Apply equipment silhouettes Tier Progression as an illustration preset over prompt X: preserve
    the user's requested subject, then route mark-making, palette, surface, composition, mood, and
    final craft through Tiered equipment progression sheet emphasizing upgrade readability,
    Multi-tier continuity, rarity-coded visual jumps, consistent proportion baseline, Progressive
    material sophistication (wear, polish, inlay, arcane finish) without requiring the card image's
    original subject.
