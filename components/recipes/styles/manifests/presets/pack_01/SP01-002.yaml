visualDna:
  aesthetic: 'Candid street portraiture: a stranger caught in a genuine moment in public space, available light only, the city present as texture rather than backdrop.'
  subject_treatment: Keep the subject unposed and mid-action — turning, laughing, pausing, reacting — with gaze either off-lens or a brief startled glance into it.
  color_and_tone: Natural urban color with slightly lifted shadows, mixed daylight and practical tints, true skin under real conditions.
  lighting_and_shadow: 'Whatever the street gives: hard sun, open shade, shop spill, or overcast; direction is honest and shadows fall where they fall.'
  texture_and_material: Real clothing wear, weathered surfaces, light film-like grain, slight motion in background passersby.
  camera_and_composition: 28–50 mm at chest height, off-center subject, foreground elements partially intruding, layered depth with other people or street furniture.
  atmosphere_and_mood: Immediate, human, unguarded, and a little stolen.
  rendering_and_quality: Documentary sharpness on the face with natural lens falloff; no studio polish or retouching.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Candid Street Portrait as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: unposed mid-action moment; available light; foreground intrusion; layered street depth; honest skin
