  color_and_tone: Blinding white-orange exhaust against blue sky, steel grey gantries and sandy tones.
  lighting_and_shadow: Intense exhaust glow lighting faces and landscapes from below and behind.
  texture_and_material: Steel gantries, billowing smoke, frost-covered tanks, sand and concrete.
  camera_and_composition: Low wide views of rockets rising above crowds and plumes.
  atmosphere_and_mood: Thundering, hopeful and emotional, everyone looking up at once.
  rendering_and_quality: Dramatic illustration with glowing plumes and powerful scale.
