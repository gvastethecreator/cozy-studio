visualDna:
  aesthetic: >-
    Noir surface rendering with razor-clean contours, mirror-bright edge glints, deep black
    value masses, and composed chrome-like reflections.
  subject_treatment: >-
    Keep the requested subject recognizable and unchanged in form. Give its existing silhouette
    a few sharp reflective edges and broad, elegant shadow shapes.
  color_and_tone: >-
    Build a restrained range of black, pewter, silver, and smoke, punctuated by tiny magenta or
    cyan reflections.
  lighting_and_shadow: >-
    Use hard cel shadows and precise specular accents; concentrate highlights along existing
    edges instead of adding neon sources.
  texture_and_material: >-
    Respect the depicted material while suggesting a polished finish through narrow highlight
    bands, clean reflections, and minimal scuffing.
  camera_and_composition: >-
    Keep the given framing. Balance dark masses with narrow reflective lines and leave negative
    space around the main silhouette.
  atmosphere_and_mood: >-
    Create poised noir elegance through controlled contrast, stillness, and sparse color glints
    rather than a city-at-night setting.
  rendering_and_quality: >-
    Use smooth value transitions, crisp boundaries, a few hard shadow planes, and clean
    highlights; keep reflections graphic and legible.
  key_features: >-
    Mirror-like edge glints; deep noir shadows; pewter and smoke values; sparse neon
    reflections.
  creative_brief: >-
    Retain the prompt’s subject, action, and setting. Use crisp reflective accents, pewter
    values, and deep noir shadows; add no armor, city, or neon signage.
