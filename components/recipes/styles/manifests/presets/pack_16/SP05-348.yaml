  lighting_and_shadow: High summer sun with short black shadows, heat shimmer and bright cap brims.
  texture_and_material: Dust clouds, stitched leather ball, sweat-darkened uniforms in crisp cel.
  camera_and_composition: Framing down the pitcher-to-batter line, close-ups on grips and eyes.
