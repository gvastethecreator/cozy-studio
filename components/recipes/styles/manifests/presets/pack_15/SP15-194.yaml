visualDna:
  aesthetic: 'Submarinepunk: cramped riveted submarine life, with brass periscopes, bunk-lined corridors, red battle lamps and crews that never see the sun.'
  subject_treatment: Keep the prompt's subject and setting; move it inside tight riveted submarine compartments full of pipes, valves and gauges.
  color_and_tone: Olive drab, brass and oiled steel with red battle lighting and cold green sonar glow.
  lighting_and_shadow: Red emergency lamps and green sonar screens cutting through cramped shadowy spaces.
  texture_and_material: Riveted steel, sweating pipes, brass valves, worn canvas bunks and condensation.
  camera_and_composition: Claustrophobic interiors with pipes crowding the edges and crew packed close together.
  atmosphere_and_mood: Tense, sweaty and brotherly, silent running deep beneath an enemy fleet.
  rendering_and_quality: Gritty detailed illustration with dense mechanical clutter and strong colored light.
  creative_brief: "Submarinepunk: cramped riveted submarine life, with brass periscopes, bunk-lined corridors, red battle lamps and crews that never see the sun. Carry it through riveted compartments, red battle lamps, sonar glow, brass valves. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: riveted compartments; red battle lamps; sonar glow; brass valves
