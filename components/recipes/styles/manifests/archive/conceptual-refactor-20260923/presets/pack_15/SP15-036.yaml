    Shell Metro Systems operates as a portable punk-spectrum router: combine Shell Metro Systems
    identity cues through shell panels; service machines; tidal gates; ferry-rope curves; salt metal
    planes; Shell-built civic seapunk poster language built from shell ceramic panels with oceanic,
    glacial, and terrain punk grammar with pressure systems, tidal infrastructure, cold data
    shelters, moss signal craft, and weather-built engineering, so the preset supplies retrofit
    style behavior rather than a required venue, mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through coral
    circuitry, pressure-line contour, shell canopy rhythm, kelp signage, ice-glass facets, salt-kite
    rigging, moss radio texture, and brackish edges; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through coral pink, tideglass blue, shell white, kelp green, glacier cobalt, salt
    white, rust, slate, and deep water shadow; keep dominant, support, and accent values readable,
    avoid muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
    Use underwater caustics, lantern warmth, shell-filtered daylight, glacier bounce, tide
    reflection, salt glare, and cold data glow; lighting should reveal the punk system, preserve the
    user's subject, separate near and distant value planes, and avoid crushed blacks or noisy dark
    texture.
  texture_and_material: >-
    Render coral ceramic, wet rope, shell laminate, kelp plastic, ice crust, salt film, moss felt,
    brass pipe, and worn marine metal; keep material scale coherent, surface marks motivated, and
    tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through pressure-line diagonals, tide-level bands, canopy arcs, shelter-depth layering,
    wind-rig rhythm, and stable subject clarity as reusable framing grammar for characters,
    creatures, objects, vehicles, environments, symbols, or full scenes without one required card
    layout.
  atmosphere_and_mood: >-
    Carry mood through brackish civic motion, remote discipline, storm resilience, wind-driven
    invention, cold refuge, and tidal resourcefulness; the tone may become adult, romantic, violent,
    comic, sensual, eerie, civic, or strange when prompt X asks, while the punk family remains
    legible.
  rendering_and_quality: >-
    Finish with clean terrain-punk illustration with readable weather materials, controlled wet
    highlights, and no noisy dark texture mesh; prioritize clean denoise, bold readable shapes,
    controlled grit, prompt preservation, no watermark, no readable text, and no generic concept-art
    polish.
  key_features: >-
    shell panels; service machines; tidal gates; ferry-rope curves; salt metal planes; Shell-built
    civic seapunk poster language built from shell ceramic panels
  creative_brief: >-
    Use Shell Metro Systems after prompt X as a transferable punk-spectrum layer: prompt X supplies
