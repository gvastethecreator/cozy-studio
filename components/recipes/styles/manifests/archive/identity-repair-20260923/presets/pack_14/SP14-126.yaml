visualDna:
  aesthetic: >-
    Unequal scales of drawn marks, broad masses and fine accents establish a clear visual hierarchy.
    Contrast comes from large quiet regions meeting compact detailed regions, without enlarging the
    actual subject or adding miniature props.
  subject_treatment: >-
    Preserve the prompt's subject and action. Use scale contrast and selective contour repetition to
    guide attention; do not reshape the subject into regalia or replace it with a sign.
  color_and_tone: >-
    Retain the requested palette and separate large masses from small accents by value. When color is
    open, choose a compact relationship suited to the subject rather than defaulting to mineral gray or
    gold.
  lighting_and_shadow: >-
    Respect the described source. Broad shadow masses establish scale, while small highlights or marks
    clarify selected edges and repeated units.
  texture_and_material: >-
    Keep surface treatment tied to prompted materials. Vary edge and mark density locally; avoid a
    uniform coating of ash, grain, or carved grooves.
  camera_and_composition: >-
    Keep the requested camera, crop and actual scale relationships. Use large-versus-small mark density
    within the existing forms; when composition is open, balance one dominant mass with a few small
    accents and generous space.
  atmosphere_and_mood: >-
    Use repetition and pause to set a measured or tense cadence. Keep emotional tone flexible; visual
    order need not imply ritual, mourning, or authority.
  rendering_and_quality: >-
    Keep repeated marks distinct at card scale and reserve quiet areas around the focal form. Vary
    spacing and size enough to avoid mechanical pattern fill or pseudo-script.
avoidRules:
  - Do not turn repeated marks into pseudo-writing or unreadable ornament.
  - Do not repeat a single accent shape uniformly across every subject.
