  color_and_tone: Teal city tones, olive tactical gear and warm cockpit amber.
  lighting_and_shadow: Diffuse city light, cockpit screens and rainy reflections.
  texture_and_material: Clean realistic cel with CG machines and painted cities.
  camera_and_composition: Tactical command-room framing with quiet emotional close-ups on tired operators.
  atmosphere_and_mood: Keep the requested mood with quiet machine grief.
  rendering_and_quality: Grounded Production I.G television frame with realistic cyber detail.
  key_features: SAC realism; spider-legged machines; command rooms; machine grief
  creative_brief: "Production I.G Ghost in the Shell: Stand Alone Complex look (2002): grounded cybernetic police drama, spider-legged think tanks, Hong Kong-like future cities and quiet grief over machine minds. Carry it through SAC realism, spider-legged machines, command rooms, machine grief. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
