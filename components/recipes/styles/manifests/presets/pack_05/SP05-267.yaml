visualDna:
  aesthetic: Black sumi-ink seinen illustration cut through by one or two decisive carmine brushstrokes that split, taper and feather along an existing edge, like a seal-red slash across the page rather than blood.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Monochrome black ink on warm rice paper, with carmine or oxblood reserved for one or two strokes only.
  lighting_and_shadow: Flat paper light; a slim raking highlight separates the red stroke from the black ground beneath it.
  texture_and_material: Dense black ink with capillary feathering into rice paper and a dry-brush tail at the end of every red stroke.
  camera_and_composition: Keep the requested framing; the red stroke crosses the focal path diagonally and splits the composition into two unequal parts.
  atmosphere_and_mood: Abrupt and decisive, a clean break in continuity without any implied violence.
  rendering_and_quality: Confident calligraphic brushwork with readable forms; the red stroke is a graphic accent, never a wound or splatter.
  key_features: one or two carmine brush slashes; black sumi ink on rice paper; capillary feathering; diagonal split of the composition; non-gory red
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Blood-Ink Severance Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
