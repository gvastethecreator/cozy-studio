visualDna:
  aesthetic: >-
    Compact digital-paint forms, selective edges and controlled material texture create clear local
    contrast without uniform grime. These techniques apply to the requested subject without
    importing any setting, lore or game imagery.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and function. Clarify
    existing forms with compact painted volumes and selective edge definition; do not add planar
    beings, corpses, symbols, faction marks or other lore-specific content.
  color_and_tone: >-
    Preserve explicit palette choices and tonal relationships. If the palette is unspecified, a
    restrained earthy tendency may support the study, but no copper accent, fixed hue range or dark
    fantasy palette is required.
  lighting_and_shadow: >-
    Follow the requested light and shadow structure. Use controlled value shifts to separate the
    existing forms without adding dramatic planar illumination, colored magic or an assumed setting.
  texture_and_material: >-
    Keep texture deliberate, local and specific to the materials actually depicted. Preserve surface
    identity and avoid uniform patina, corrosion or grime as a shortcut to atmosphere.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, scale and arrangement. Do not impose an
    isometric angle, planar-city composition, interface, map or game-screen layout.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Compact painted volumes do not prescribe an era,
    genre, planar setting or fantasy narrative.
  rendering_and_quality: >-
    Keep volumes compact, edges selective and surfaces legible through controlled contrast. Distribute
    detail by material and form; do not cover the image in dirt, scratches or ornamental symbols.
avoidRules:
  - unrequested planar city, corpse, symbol, faction emblem or game interface
  - fixed isometric camera or game-world layout
  - mandatory copper, fixed earthy palette or uniform grime
  - false attribution as historical medieval art or exact game reproduction
