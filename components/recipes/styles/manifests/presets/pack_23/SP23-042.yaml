visualDna:
  aesthetic: >-
    Balance broad dark value masses, light or reversed contours and a few assertive color planes.
    Allow localized grain and slight edge offsets only where they strengthen visual hierarchy, without
    simulating a particular printing process.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and function. Use contour
    contrast to clarify existing forms; do not add narrative content, decorative symbols or lettering.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. When they allow it, organize values into
    bold dark and light groups with a small number of confident accents; no specific hue is required.
  lighting_and_shadow: >-
    Follow the requested lighting and shadows. Separate existing value groups with graphic contrast
    rather than inventing a new light source or darkening the image to force a mood.
  texture_and_material: >-
    Keep grain and small reproduction irregularities local and subordinate to actual material cues.
    Preserve the depicted surfaces and avoid blanket distress or uniform noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, arrangement and negative space. Do not impose
    additional framing or a layout that changes the requested composition.
  atmosphere_and_mood: >-
    Preserve the user's setting and tone. High contrast and reversed contours are graphic choices, not
    a requirement for a particular genre or narrative.
  rendering_and_quality: >-
    Keep broad masses, fine contours and accent planes distinct and readable. Apply grain or edge
    variation selectively so the subject remains recognizable without text or iconography.
avoidRules:
  - unrequested lettering, symbols, borders or framing
  - fixed accent hue or forced dark overall palette
  - uniform grain, distress or edge wear across the image
  - unrequested thematic or narrative additions
