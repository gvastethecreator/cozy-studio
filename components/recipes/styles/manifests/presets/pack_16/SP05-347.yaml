  aesthetic: 'Cycling anime of uphill suffering: steep roads, gritted teeth, legs burning and the summit always one curve away.'
  subject_treatment: Keep the prompt's subject and action; show sustained effort up a slope, fatigue and determination in every line.
  color_and_tone: Mountain greens and asphalt grey with jersey color accents and hot sweaty skin tones.
  lighting_and_shadow: Harsh sun through trees in dappled patches, sweat catching highlights.
  texture_and_material: Rough asphalt, carbon bike frames and soaked jerseys in crisp cel.
  camera_and_composition: Low side angles up the slope, riders tilted against the gradient.
  atmosphere_and_mood: Grueling and stubborn, pain turned into rhythm on a climb that never ends.
  rendering_and_quality: Detailed sports anime with mechanical accuracy and expressive strain.
  key_features: uphill gradient; gritted teeth; dappled sun; breakaway
  creative_brief: "Cycling anime of uphill suffering: steep roads, gritted teeth, legs burning and the summit always one curve away. Carry it through uphill gradient, gritted teeth, dappled sun, breakaway. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
