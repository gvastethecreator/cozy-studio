visualDna:
  aesthetic: 'Cold condensation commercial: refreshment advertising where frost, beads of water and backlit cold haze make a vessel look ice-cold.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Cold cyan and clean white, with one saturated accent color in the drink or object.
  lighting_and_shadow: Strong backlight through the vessel for glow, hard rim sparkle on droplets, cool fill.
  texture_and_material: Condensation beads and running drops, frost bloom, crushed ice, cold vapor.
  camera_and_composition: Slight heroic low angle, 85–100 mm, vessel centered and tall in frame.
  atmosphere_and_mood: Fresh and energetic, cold you can almost feel on your hand.
  rendering_and_quality: Beverage-ad clarity with sharp droplets; no warm or dry surfaces.
  key_features: condensation beads; frost bloom; backlit cold glow; rim-lit droplets; heroic low angle
