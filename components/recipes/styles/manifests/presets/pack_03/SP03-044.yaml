visualDna:
  aesthetic: 'Thermal heatmap shader: a simulated temperature attribute diffused through clean 3D geometry and shown through a smooth false-color ramp, crisp as a CG render, with no infrared camera behind it.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Jet-style ramp from deep blue through cyan, green and yellow to red on the model; the background a flat neutral dark grey.
  lighting_and_shadow: Faint diffuse shading kept under the ramp so forms still read; hot zones never bloom or bleed past the mesh edge.
  texture_and_material: Smooth interpolated gradients across polygons, sharp model silhouettes, hot spots centered on the named heat sources.
  camera_and_composition: Keep the requested camera; the ramp follows the geometry, so the same model could be swapped back to its beauty render.
  atmosphere_and_mood: Diagnostic and vivid, energy mapped as color over a model.
  rendering_and_quality: 'Simulation-output finish: no sensor noise, no soft focus and no ironbow or white-hot camera palette.'
  key_features: simulated temperature attribute; jet blue-to-red ramp; crisp mesh edges; faint diffuse shading; no sensor bloom
  creative_brief: "Thermal heatmap shader: a simulated temperature attribute diffused through clean 3D geometry and shown through a smooth false-color ramp, crisp as a CG render, with no infrared camera behind it. Carry it through simulated temperature attribute, jet blue-to-red ramp, crisp mesh edges, faint diffuse shading, no sensor bloom. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
