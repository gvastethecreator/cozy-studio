visualDna:
  aesthetic: 'Soft-body simulation: the subject behaving like a volume-preserving jelly, squashed against surfaces, bulging between obstacles and wobbling mid-bounce.'
  subject_treatment: Keep the prompt subject, its material, setting and camera; simulate it as a soft body that squashes, bulges and jiggles on contact while preserving its volume.
  color_and_tone: The subject's own colors, a little brighter where it is stretched thin and deeper where it compresses.
  lighting_and_shadow: Clean studio key with glossy highlights stretching and pinching along the deformed curves.
  texture_and_material: Smooth surfaces with compression bulges, stretch lines, flattened contact patches and ripples frozen mid-wobble.
  camera_and_composition: Keep the requested view; a contact point or obstacle stays in frame to show the squash.
  atmosphere_and_mood: Playful and tactile, satisfying enough to want to poke.
  rendering_and_quality: Volume-preserving deformation with believable contact; not melting, not liquid and not broken.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Soft-Body Squash Simulation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: volume-preserving squash; bulges between obstacles; flattened contact patches; frozen wobble ripples; stretched highlights
