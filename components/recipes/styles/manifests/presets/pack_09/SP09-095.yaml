visualDna:
  aesthetic: 'Neoprene: thick spongy wetsuit rubber with jersey facing and glued seams.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of neoprene with jersey faces and flat-glued seams."
  color_and_tone: Black, navy or bright wetsuit colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light showing texture, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Spongy neoprene with jersey faces and seams, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Sporty, protective, modern and snug, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Neoprene: thick spongy wetsuit rubber with jersey facing and glued seams. Carry it through neoprene, jersey face, glued seams. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: neoprene; jersey face; glued seams
