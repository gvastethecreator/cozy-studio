visualDna:
  aesthetic: >-
    Isometric Strategy Tile Language acts as a transferable art-medium router: start from Isometric
    strategy game tile style with clean tactical geometry, beveled readability, and board game
    clarity, gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Convert any subject into modular isometric masses, readable
    footprint shapes, and turn based visual hierarchy; preserve the prompt subject while routing it
    through tile readability, icon clarity, splash rendering, interface material, sprite bounce,
    shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Controlled terrain like elevated edge structure, faction ready accent bands,
    and clear value channels for walkable vs blocked areas; use color as gameplay hierarchy: rarity
    glow, faction contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or
    readable inventory material, with deliberate value grouping, accent control, and medium-specific
    limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Consistent upper left light, short cast shadows, contact darkening, and
    bevel highlights on every tile edge; shape light through game readability: rim separation, UI
    glow, static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity
    streaks, so value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Low noise pixel texture, small material swatches, edge seams, and repeatable detail
    density; surface detail should support genre grammar through parchment, HUD glass, pixel atlas
    texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through 2:1 isometric grid, stable scale, locked diagonals, and composable
    tile boundaries; compose through gameplay-facing hierarchy, atlas consistency, menu rhythm,
    parallax layers, tactical grid, encounter scale, or selection-screen energy, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Strategic, ordered, readable mood without requiring terrain, armies, bases, or
    maps; derive mood from playable stakes, collection desire, tactical control, cozy routine,
    survival dread, arcade speed, or heroic confrontation, letting the medium alter interpretation
    without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Tile atlas friendly finish, crisp edges, no perspective camera drift, no blurry
    scaling; finish with game-production clarity, strong silhouettes, controlled UI-like detail, and
    no unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Isometric strategy game tile style with clean tactical geometry, beveled readability, and board
    game clarity; gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity; Controlled terrain like elevated edge structure,
    faction ready accent bands, and clear value channels for walkable vs blocked areas; Low noise
    pixel texture, small material swatches, edge seams, and repeatable detail density; 2:1 isometric
    grid, stable scale, locked diagonals, and composable tile boundaries
  creative_brief: >-
    Apply Isometric Strategy Tile Language as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Isometric strategy game tile style with clean tactical geometry, beveled readability,
    and board game clarity, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity, Low noise pixel texture, small material swatches, edge
    seams, and repeatable detail density without requiring the card image's original subject.
