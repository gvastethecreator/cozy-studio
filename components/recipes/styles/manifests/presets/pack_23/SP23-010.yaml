visualDna:
  aesthetic: >-
    Build depth from broad dark value regions opened by fine light cuts. Local contrast and carefully
    spaced lines create relief while preserving quiet areas.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and count. Use line cuts to describe
    the existing forms without adding characters or changing their silhouettes.
  color_and_tone: >-
    Preserve the requested palette. Establish dark and light passages from its existing values;
    use white cuts only when white belongs to the requested colors.
  lighting_and_shadow: >-
    Place light cuts where the requested lighting already reveals form. Retain its direction and
    shadow pattern without inventing a new source.
  texture_and_material: >-
    Keep cuts fine and local, with slight carving irregularity. Do not add visible wood grain,
    blanket scratches or a physical printing surface.
  camera_and_composition: >-
    Keep the requested viewpoint, crop, framing and element placement. Retain open areas already
    present in the composition without imposing a landscape or page layout.
  atmosphere_and_mood: >-
    Let tonal contrast serve the requested mood. Do not infer a monumental setting, ruins, dramatic
    clouds or literary characters from the historical revival technique.
  rendering_and_quality: >-
    Make fine light cuts legible against existing dark values and vary their density to explain
    volume. Keep areas of rest and avoid flattening the image into uniform black.
avoidRules:
  - unrequested ruins or dramatic sky
  - forced monochrome when colors are requested
