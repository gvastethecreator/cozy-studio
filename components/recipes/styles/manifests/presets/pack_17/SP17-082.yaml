visualDna:
  aesthetic: >-
    Conté crayon drawing with compressed, velvety marks, firm contour strokes, and rubbed planes
    that shift between crisp line and broad pigment.
  subject_treatment: >-
    Retain the requested subject, pose, identity, count, and identifying detail. Use contour and
    directional crayon strokes to clarify existing structure without changing anatomy or costume.
  color_and_tone: >-
    Preserve requested color relationships. When unspecified, keep to a restrained earth-red,
    umber, charcoal, and chalk range, using the lightest tone only for selected accents.
  lighting_and_shadow: >-
    Respect the requested light direction. Use overlapping crayon strokes and rubbed dark planes
    to model existing forms without adding dramatic spotlights or glowing edges.
  texture_and_material: >-
    Show compressed pigment grain and occasional blunt stroke ends on the drawing surface. Keep the
    crayon texture from converting skin, cloth, stone, or metal into wax.
  camera_and_composition: >-
    Preserve viewpoint, crop, scale, and spatial order. Let stroke direction support the given pose
    and structure without imposing a figure-study sheet or border.
  atmosphere_and_mood: >-
    Use weight, contour pressure, and tonal restraint to express the requested mood. Crayon does not
    require a historical costume, devotional subject, or aged paper.
  rendering_and_quality: >-
    Keep strokes purposeful and varied in width, with open mids and stable silhouettes. Avoid
    uniform scribble, charcoal haze, and waxy digital shine.
avoidRules:
  - forced costume, devotional motif, or aged-paper setting
  - crayon wax appearance on the depicted materials
  - uniform scribbling or indiscriminate smudge
  - forced figure-study layout or frame
  - waxy digital shine
