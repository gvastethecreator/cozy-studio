visualDna:
  aesthetic: 'Rendered rim light rig: CGI back lights placed behind the subject so a thin bright edge traces its silhouette against a dark background.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Dark subject and background, bright white, gold or cyan edge line.
  lighting_and_shadow: Two strong back lights with barely any front fill; fresnel-bright edges.
  texture_and_material: Edges of fur, cloth, metal and hair catching the rim; front surfaces dim.
  camera_and_composition: Keep the requested framing; the silhouette against the darkest area.
  atmosphere_and_mood: Dramatic and sleek, form drawn with a single line of light.
  rendering_and_quality: Clean CG rim with controlled bloom; the cinematic rim light lives in pack_02.
  key_features: thin bright silhouette edge; dark subject; twin back lights; fresnel edges; controlled bloom
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rendered Rim Light Rig as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
