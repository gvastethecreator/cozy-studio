  color_and_tone: Warm campfire amber, dungeon stone grey, herb green and cooked-food browns.
  lighting_and_shadow: Cozy campfire glow in dark dungeon halls and soft lantern light on stew pots.
  texture_and_material: Clean detailed pen line, field-guide cross sections and warm muted color.
  camera_and_composition: Cooking scenes around pots, anatomical diagram inserts and dungeon-camp wides.
  atmosphere_and_mood: Keep the requested mood with curious cozy adventure.
  rendering_and_quality: Warm meticulous fantasy manga illustration with naturalist monster detail.
  key_features: Ryoko Kui naturalism; monster anatomy; dungeon cooking; cozy camps
