visualDna:
  aesthetic: >-
    Pictorial cartoon combines flowing curve rhythms with broad painted volume, alternating rounded
    transitions and angular edges to keep forms energetic but controlled.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Emphasize curves within existing forms
    without inventing parts, changing the gesture or distorting anatomy.
  color_and_tone: >-
    Use broad painted shadows and direct contrast while retaining the requested palette and local color
    relationships.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Keep painted shadow groups legible without
    adding a dramatic source or changing the scene's lighting.
  texture_and_material: >-
    Let brushwork show across larger surfaces and follow their form. Preserve the represented materials
    instead of making all surfaces equally painterly or rough.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Curve rhythm does not require
    a new gesture, action or camera angle.
  atmosphere_and_mood: >-
    Keep the requested tone. Elastic drawing does not add drama, comedy or a character expression that
    was not requested.
  rendering_and_quality: >-
    Alternate rounded and angular edges deliberately, using visible brush marks to reinforce broad forms.
    Keep anatomy and construction coherent rather than using accidental deformation as style.
avoidRules:
  - unrequested anatomical deformation
  - changed gesture or added parts
