visualDna:
  aesthetic: 'Stepped Pixel Lettering: letters built from whole pixel clusters on a fixed logical height, with a stepped rhythm of their own.'
  subject_treatment: Build the requested words from whole pixel clusters at one fixed logical letter height, drawing every accent and sign deliberately.
  color_and_tone: A closed palette of two or three exact values with hard edges.
  lighting_and_shadow: Optional shading in discrete stepped bands, crisp and flat.
  texture_and_material: Whole pixels in clean deliberate groups, every one placed on purpose.
  camera_and_composition: Quantized baseline and spacing with fixes made by whole clusters.
  atmosphere_and_mood: Digital energy and handmade precision, crafted rather than filtered.
  rendering_and_quality: Readable at logical size and kept identical at whole-number enlargements.
  creative_brief: "Stepped Pixel Lettering: letters built from whole pixel clusters on a fixed logical height, with a stepped rhythm of their own. Carry it through whole pixel clusters, fixed letter height, exact palette, stepped rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
