visualDna:
  aesthetic: >-
    Survival Horror Save-Room Lighting acts as a transferable art-medium router: start from Survival
    horror save interior volume style with static camera dread, low resource warmth, and PS2 era
    atmospheric grime, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity and game-art direction system built from playable
    readability, UI or asset grammar, role clarity, production polish, and genre-specific visual
    feedback, then apply the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Make any subject feel temporarily protected yet unsafe
    through restrained staging and fragile focal calm; preserve the prompt subject while routing it
    through tile readability, icon clarity, splash rendering, interface material, sprite bounce,
    shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Greenish blacks, tobacco browns, dirty cream highlights, small warm safety
    accents, and crushed low values; use color as gameplay hierarchy: rarity glow, faction contrast,
    tactical coding, seasonal warmth, horror warmth, neon route color, or readable inventory
    material, with deliberate value grouping, accent control, and medium-specific limits rather than
    generic color wash.
  lighting_and_shadow: >-
    Handle light through Weak lamp pools, vignetted corners, deep occlusion, and suspenseful off
    frame darkness; shape light through game readability: rim separation, UI glow, static-camera
    dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so value
    structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Low poly grime, old wallpaper grain, dust, compression softness, scratched surfaces, and
    analog noise; surface detail should support genre grammar through parchment, HUD glass, pixel
    atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Fixed camera composition, slightly awkward perspective, negative
    space tension, and deliberate stillness; compose through gameplay-facing hierarchy, atlas
    consistency, menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen
    energy, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Claustrophobic, quiet, uneasy mood without requiring interior volume, typewriters,
    doors, monsters, or gore; derive mood from playable stakes, collection desire, tactical control,
    cozy routine, survival dread, arcade speed, or heroic confrontation, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Retro survival horror finish, controlled darkness, readable focal area, no UI or
    readable text; finish with game-production clarity, strong silhouettes, controlled UI-like
    detail, and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and
    enough craft evidence to make the medium recognizable.
  key_features: >-
    Survival horror save interior volume style with static camera dread, low resource warmth, and
    PS2 era atmospheric grime; gameplay-readable hierarchy, genre-specific surface language,
    UI-aware composition, and production-art clarity; Greenish blacks, tobacco browns, dirty cream
    highlights, small warm safety accents, and crushed low values; Low poly grime, old wallpaper
    grain, dust, compression softness, scratched surfaces, and analog noise; Fixed camera
    composition, slightly awkward perspective, negative space tension, and deliberate stillness
  creative_brief: >-
    Apply Survival Horror Save-Room Lighting as an art-style preset over prompt X: preserve the
    user's requested subject, then route mark-making, palette, surface, composition, mood, and final
    craft through Survival horror save interior volume style with static camera dread, low resource
    warmth, and PS2 era atmospheric grime, gameplay-readable hierarchy, genre-specific surface
    language, UI-aware composition, and production-art clarity, Low poly grime, old wallpaper grain,
    dust, compression softness, scratched surfaces, and analog noise without requiring the card
    image's original subject.
