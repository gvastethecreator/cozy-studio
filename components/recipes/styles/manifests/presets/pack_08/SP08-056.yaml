  color_and_tone: Champagne, emerald, midnight blue or oxblood satin, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Soft single source that makes highlights slide along the folds.
  texture_and_material: Heavy silk satin with fluid folds and smooth sheen.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Sensual, elegant, calm and luxurious, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
