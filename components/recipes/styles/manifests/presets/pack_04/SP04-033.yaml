visualDna:
  aesthetic: 'Constructivist propaganda poster: heroic figures reduced to hard silhouettes, thrust along steep diagonals against radiating red rays.'
  subject_treatment: Keep the prompt subject and action; this preset owns the diagonal constructivist poster composition with radiating rays, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Red, black and cream only, flat and uncompromising, one hue per shape.
  lighting_and_shadow: Stark low-angle light, faces split into flat light and black planes, beams as geometric wedges.
  texture_and_material: Flat screenprint and letterpress ink, slightly rough edges, aged cream paper.
  camera_and_composition: Extreme worm-eye view, steep diagonals, repeated marching figures and huge scale contrast.
  atmosphere_and_mood: Commanding, urgent and collective, mass energy in motion.
  rendering_and_quality: Bold emblematic reduction with hard edges; no slogans, no real leaders, no national emblems.
  key_features: red black and cream; steep diagonal thrust; worm-eye view; radiating ray wedges; hard silhouette reduction
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Propaganda Poster as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
