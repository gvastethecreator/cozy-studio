visualDna:
  aesthetic: >-
    Graphic Novel (Painted) acts as a transferable illustration router: start from Painted realist
    comic illustration (Alex Ross influence with Norman Rockwell portrait sensibility), Outline-free
    form definition, portrait-grade facial modeling, painterly fabric rendering and
    comic-illustration system built from ink hierarchy, panel-era color, contour exaggeration, print
    artifacts, and sequential-art readability, then apply the visual behavior to prompt X instead of
    recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Line-minimal painterly construction through value and edge
    control; preserve the requested subject while translating form into panel-ready silhouettes,
    expressive contour weight, stylized anatomy, speed emphasis, or graphic restraint only when the
    preset calls for it, keeping the requested identity, silhouette, pose, object function, or
    setting legible.
  color_and_tone: >-
    Build color with Naturalistic gouache-like chroma with warm skin and muted secondary balance;
    treat color as comic production language: four-color plates, limited spot color, manga
    monochrome, digital flats, noir contrast, webtoon gradients, or painted page atmosphere, with
    deliberate value grouping, accent control, and process-specific limits rather than a generic
    palette wash.
  lighting_and_shadow: >-
    Handle light through Classical soft-key + focused emblematic spotlight modeling; make light read
    through ink spotting, cel-like value blocks, dramatic rim separation, flat print fill, or
    painted page modeling rather than generic studio illumination, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Visible brushwork and layered pigment transitions; surface detail should reveal paper
    tooth, newsprint dots, screen tones, digital brush layers, ink pools, gutter discipline, or
    pixel cells at a scale that supports the drawing, keeping material scale coherent and avoiding
    noisy filler texture.
  camera_and_composition: >-
    Structure the image through Realist proportion and volume, minimal stylization; compose with
    panel logic, silhouette clarity, speech-shape space, page rhythm, close-up drama, or scroll
    pacing without requiring a fixed comic-page scene, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Mythic, solemn, reverential, mood carried by Graphic Novel (Painted) craft,
    material pressure, and visual restraint; derive mood from era, genre pressure, satire,
    melodrama, horror obsession, pulp energy, or graphic-novel seriousness, letting the style alter
    interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Fine-art comic finish with high anatomical and textile fidelity; finish with clear
    ink decisions, readable stylization, controlled artifacting, and no generic superhero costume or
    random comic text replacing the prompt, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    Painted realist comic illustration (Alex Ross influence with Norman Rockwell portrait
    sensibility); Outline-free form definition, portrait-grade facial modeling, painterly fabric
    rendering; Naturalistic gouache-like chroma with warm skin and muted secondary balance; Visible
    brushwork and layered pigment transitions; Realist proportion and volume, minimal stylization
  creative_brief: >-
    Apply Graphic Novel (Painted) as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Painted realist comic illustration (Alex Ross influence with Norman Rockwell portrait
    sensibility), Outline-free form definition, portrait-grade facial modeling, painterly fabric
    rendering, Visible brushwork and layered pigment transitions without requiring the card image's
    original subject.
