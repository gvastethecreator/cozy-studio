    Preserve the requested subject and action; make functional shapes legible through deliberate
    contour and selective detail.
  color_and_tone: >-
    Earthy green, ochre, and warm neutral accents create an organic range, adjusted to the requested
    palette.
  lighting_and_shadow: >-
    Warm reflected light sits close to forms while cooler shadows retain clear separation.
  texture_and_material: >-
    Use layered, tactile pigment and carefully varied surface marks without changing what the
    objects are made of.
  camera_and_composition: >-
    Keep the requested camera; organize detail around the focal task without adding a kitchen or
