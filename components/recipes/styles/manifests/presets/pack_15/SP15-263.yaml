  aesthetic: 'Space Truckerpunk: blue-collar haulers of the space lanes, with battered cargo rigs, cab kitchens, truck-stop stations, coffee in zero-g and long lonely routes.'
  subject_treatment: Keep the prompt's subject and setting; turn it into interplanetary hauling life with battered cargo rigs, cabs and truck-stop stations.
  color_and_tone: Scuffed industrial yellow and grey with warm cab lights and cold starlight.
  lighting_and_shadow: Warm dashboard glow inside cabs, harsh work lights outside.
  texture_and_material: Scratched hull paint, cargo containers, worn seats, coffee stains and cables.
  camera_and_composition: Cab interiors with windows full of space and long rigs pulling cargo.
  atmosphere_and_mood: Lonely, funny and hardworking, truckers of the stars.
  rendering_and_quality: Gritty warm illustration with lived-in cab detail and starlight.
