visualDna:
  aesthetic: >-
    Expressive anime comedy through elastic reaction shapes, quick timing and refined, clean
    linework.
  subject_treatment: >-
    Preserve each subject and action. Exaggerate expression and outer contour only enough to
    make a reaction legible; do not change identity.
  color_and_tone: >-
    Retain the prompt's palette. If colors are open, use restrained accents and clear value
    grouping.
  lighting_and_shadow: >-
    Keep facial highlights and shadow shapes simple so a small expression change reads
    immediately.
  texture_and_material: >-
    Use clean ink and controlled digital fills; texture only surfaces present in the prompt.
  camera_and_composition: >-
    Use setup-pause-payoff spacing and quick visual beats within the requested frame and
    cast.
  atmosphere_and_mood: >-
    Deadpan escalation and humane absurdity can support humor when asked; preserve other
    requested tones.
  rendering_and_quality: >-
    Keep expression contours crisp and compositions readable; avoid clutter that competes
    with the reaction.
  key_features: >-
    Elastic expression; readable reaction contours; quick-pause timing; refined lines with
    clear value grouping.
  creative_brief: "Use the elastic line and quick reaction rhythm where it supports the prompt. Preserve its subjects, framing and chosen tone. Use it as a reusable look on any subject."
