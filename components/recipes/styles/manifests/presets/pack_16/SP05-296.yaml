visualDna:
  aesthetic: >-
    Measured Art Deco geometry on smooth cel planes: stepped internal edges, precise parallel
    lines, and calibrated symmetry.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Simplify only
    interior planes while retaining each requested silhouette, proportion, expression, and
    identity.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use midnight teal, navy,
    muted gold, peach, or rose in discrete fields; keep user-specified local colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Create crisp bands of light and shadow
    from the supplied source; add no futuristic glow or chrome sheen.
  texture_and_material: >-
    Apply texture only to materials already present. Keep planes smooth with tiny even grain
    only in broad fields; add no ornamental material patterns.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Align parallel rhythms with
    existing geometry and balance values without moving objects.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Carry the requested tone; geometric precision imposes
    no retrofuture or optimistic mood.
  rendering_and_quality: >-
    Keep edge intersections clean, planes separated, and highlights controlled; avoid bloom and
    metallic rendering.
  key_features: >-
    Stepped geometry; parallel line rhythm; calibrated symmetry; smooth cel fields.
  creative_brief: >-
    Use stepped geometry; parallel line rhythm; calibrated symmetry; smooth cel fields. Keep the
    requested subjects, action, setting, palette, framing and mood; add no scene content.
