visualDna:
  aesthetic: 'Peripheral Combat Overlay: gameplay information pushed to the screen edges so the center of action stays free, with clear priorities.'
  subject_treatment: Place the prompt's gameplay information at the screen periphery by priority, keeping the central action zone clear; keep every value and slot count exact.
  color_and_tone: Critical data in high contrast, secondary data sober, states backed by shape.
  lighting_and_shadow: A graphic overlay that keeps the scene fully readable beneath it.
  texture_and_material: Sharp edges and lightly opaque panels where the background needs context.
  camera_and_composition: Clear center, resources in one stable zone and short events in another.
  atmosphere_and_mood: Peripheral awareness and control, focused on the action.
  rendering_and_quality: The target silhouette and the main action stay completely free.
  creative_brief: "Peripheral Combat Overlay: gameplay information pushed to the screen edges so the center of action stays free, with clear priorities. Carry it through clear center, peripheral resources, event zone, exact slot count. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
