visualDna:
  aesthetic: 'Costume design board: one figure in a hero costume drawing with alternate colorways and fabric swatches pinned around it.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a costume plate with a full-length hero figure, a row of colorway mini-figures and pinned swatches, and that layout replaces the requested framing.
  color_and_tone: Three or four colorway alternatives shown as small repeat figures, and true fabric colors in the swatches.
  lighting_and_shadow: Even studio light on the figure; swatches lie flat with slight pin shadows.
  texture_and_material: 'Pencil and watercolor figure with real fabric scraps pinned beside it: wool, brocade, leather, chainmail and trim.'
  camera_and_composition: Hero figure full length at center, colorway mini-figures in a row, swatches clustered along one side.
  atmosphere_and_mood: Tactile and theatrical, a costume about to be cut and sewn.
  rendering_and_quality: Watercolor costume illustration with photo-real swatches; distinct from an orthographic turnaround.
  key_features: full-length costume plate; colorway mini-figures; pinned fabric swatches; pencil and watercolor; theatrical silhouette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Costume Design Exploration Board as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
