visualDna:
  aesthetic: 'Manga screentone illustration where contours print twice, slightly offset, and halftone density shifts across a single form, so the image looks like a rumor retold: the same thing, not quite matching.'
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Charcoal, pale gray and white screentone with one small red accent.
  lighting_and_shadow: Soft overlaps in the offset zones and a few crisp edges under the prompt's existing light.
  texture_and_material: Fine screentone dots alternating with clean unprinted gaps; no text, signs or captions.
  camera_and_composition: Keep the requested framing and count; density shifts move emphasis between elements without adding people.
  atmosphere_and_mood: Uneasy uncertainty, a whisper living inside the halftone.
  rendering_and_quality: Print-like offset keylines, clean dot gradients and a single red accent.
  key_features: doubled offset contours; shifting halftone density; charcoal and pale gray screentone; one red accent; unprinted gaps
  creative_brief: "Manga screentone illustration where contours print twice, slightly offset, and halftone density shifts across a single form, so the image looks like a rumor retold: the same thing, not quite matching. Carry it through doubled offset contours, shifting halftone density, charcoal and pale gray screentone, one red accent, unprinted gaps. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
