visualDna:
  aesthetic: >-
    Clean cel illustration uses fine anime line, a controlled outer contour, clear color planes,
    and two compact shadow levels.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Separate the existing silhouette
    and major parts clearly without changing defining features or function.
  color_and_tone: >-
    Keep the requested local colors and their relationships. Use two concise shadow levels within
    those colors; do not force an added palette or ornamental detail.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Translate existing form changes into compact
    cel shadows without adding a light source or extra shadow bands.
  texture_and_material: >-
    Use clean, even fills and only occasional gradients where the requested material needs them.
    Preserve the materials already depicted rather than adding a texture overlay.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add a card frame, lettering
    or layout.
  atmosphere_and_mood: >-
    Keep the requested setting, genre and mood. Cel clarity is a rendering treatment and does not
    add lore or change the depicted world.
  rendering_and_quality: >-
    Establish silhouette and main parts first, then place the two shadow levels. Keep edges and
    features distinct at reduced size without making ornamental density a requirement.
avoidRules:
  - unrequested scene motifs or subject details
  - extra shadow bands that clutter the compact cel planes
  - unrequested card frame or lettering
