  lighting_and_shadow: Hard raking light on texture, lit the way Brutalist Object lights its scenes.
  texture_and_material: Board-formed concrete and exposed aggregate, with the surface finish of Brutalist Object.
  camera_and_composition: Low heavy monumental angle, framed the way Brutalist Object composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with heavy monumental calm.
  rendering_and_quality: Clean industrial design studio render with honest materials and precise seams.
