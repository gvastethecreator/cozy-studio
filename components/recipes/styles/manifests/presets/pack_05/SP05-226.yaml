visualDna:
  aesthetic: >-
    Cyber-gothic rendering with pointed contour rhythms, fine ornamental etching, monumental
    value shapes, and a stark red accent against cold darks.
  subject_treatment: >-
    Keep the subject’s identity and outline. Trace existing forms with pointed, nested lines and
    restrained etched detail without adding statues, robes, or architecture.
  color_and_tone: >-
    Use black, blue-gray, bone, and muted violet, with a narrow crimson signal; keep the palette
    dark but distinct.
  lighting_and_shadow: >-
    Set deep cel-shadow masses against slim cold highlights and occasional red edge light; do
    not imply candles or a mausoleum.
  texture_and_material: >-
    Preserve the subject’s material. Add delicate engraved marks and worn speckling sparingly,
    keeping ornament subordinate to the form.
  camera_and_composition: >-
    Honor the requested view. Use tall, pointed line rhythms and large shadow shapes within the
    existing crop, without building a hall.
  atmosphere_and_mood: >-
    Convey solemn dread through negative space, severe contrast, and fine ornamental lines
    rather than funerary props.
  rendering_and_quality: >-
    Pair precise etching with broad, clean cel shadows; keep highlights sparse, silhouettes
    legible, and dark detail controlled.
  key_features: >-
    Pointed gothic contours; fine etched detail; black and blue-gray masses; narrow crimson
    accents.
  creative_brief: >-
    Keep the requested subject, action, and setting. Apply pointed contour rhythms, restrained
    etching, and severe shadow; add no mausoleum, statues, robes, or candles.
