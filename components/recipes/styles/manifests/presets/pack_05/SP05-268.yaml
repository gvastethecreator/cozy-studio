visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around selective chromatic edge
    doubling, with magenta and cyan slipping a few pixels beyond an otherwise stable ink
    contour. For color and surface, retain prompt-led color while using
    saturated pink, blue-cyan, and deep neutral as small, clearly separated bands.
    Despair is a possible pressure, not a required emotion; chromatic tension should
    follow the user's requested tone
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through selective chromatic edge doubling,
    with magenta and cyan slipping a few pixels beyond an otherwise stable ink contour;
    use detail selectively and keep the actual form easy to read. Add no unrequested
    subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain prompt-led color while
    using saturated pink, blue-cyan, and deep neutral as small, clearly separated bands.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; suggest a neon-like edge
    through colored reflected light on existing forms, without adding signs, lamps, or a
    night setting. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; keep broad fills clean and use slight pigment
    bloom only at the colored edge; avoid all-over glow or noisy gradients. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; hold the
    supplied silhouette and crop steady so the offset color, not a changed camera,
    carries the energy. Use the mark rhythm inside the supplied composition rather than
    replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Despair is a possible pressure, not a
    required emotion; chromatic tension should follow the user's requested tone.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and selective chromatic edge doubling, with
    magenta and cyan slipping a few pixels beyond an otherwise stable ink contour; keep
    focal edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    selective chromatic edge doubling, with magenta and cyan slipping a few pixels
    beyond an otherwise stable ink contour; retain prompt-led color while using
    saturated pink, blue-cyan, and deep neutral as small, clearly separated bands;
    suggest a neon-like edge through colored reflected light on existing forms, without
    adding signs, lamps, or a night setting; keep broad fills clean and use slight
    pigment bloom only at the colored edge; avoid all-over glow or noisy gradients; and
    hold the supplied silhouette and crop steady so the offset color, not a changed
    camera, carries the energy. The five cues should read as one mark-and-value system,
    not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use selective chromatic edge doubling, with
    magenta and cyan slipping a few pixels beyond an otherwise stable ink contour,
    retain prompt-led color while using saturated pink, blue-cyan, and deep neutral as
    small, clearly separated bands, suggest a neon-like edge through colored reflected
    light on existing forms, without adding signs, lamps, or a night setting, and keep
    broad fills clean and use slight pigment bloom only at the colored edge; avoid
    all-over glow or noisy gradients; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
