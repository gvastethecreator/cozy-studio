visualDna:
  aesthetic: >-
    Leaf Veins operates as a portable source-router layer: combine Backlit leaf, chloroplast-window,
    vein-map, photosynthesis-architecture, leaf-botany with magnified source-study logic with scale
    shift, optical detail, structural pattern, and specimen-independent texture grammar, so the
    preset supplies visual behavior rather than a fixed card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms magnify,
    reveal, refract, fracture, sprout, crystallize, oxidize, bead, fray, or expose hidden structure
    through Vein network, midrib-spine, secondary-vein branching, areole-polygon mesh,
    margin-serration; identity stays readable through construction grammar, proportion, edge logic,
    and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through source-derived color variation, iridescence, false-scale contrast, translucent
    edges, and small-surface hue shifts; keep hue roles intentional, value separation clear, and
    palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Translucent, backlit-through-leaf, sun-layered around-canopy, chlorophyll-glow,
    diffused-morning plus macro flash, raking light, dark-field glow, backlit transmission, ring
    reflections, and shallow optical falloff as the light-response contract, with readable
    hierarchy, controlled contact detail, and no lighting choice that erases the user's requested
    content.
  texture_and_material: >-
    Render Plant cells, epidermal-layer, stomata-pores, cuticle-wax, mesophyll-spongy,
    vein-scaffold, trichome-hairs plus pores, fibers, facets, droplets, spores, grain, grooves,
    cells, filaments, corrosion, or crystalline edges; surface scale, residue, gloss, grain, fiber,
    pores, edges, or signal artifacts must remain coherent across figures, objects, and
    environments.
  camera_and_composition: >-
    Compose with Leaf-plane, blade-expansion, lobe-geometry, venation-pattern plus scale
    abstraction, repeated micro-patterns, sectional rhythm, optical compression, and detail-first
    framing as reusable framing grammar, allowing cards, portraits, objects, scenes, and abstract
    prompts to inherit the style without one required layout.
  atmosphere_and_mood: >-
    Carry mood through scientific curiosity, alien familiarity, tactile intimacy, natural
    engineering, entropy, and fragile wonder; the emotional tone should feel specific to Leaf Veins
    while still obeying the prompt's subject and context.
  rendering_and_quality: >-
    Finish with clean magnification, controlled focus, coherent micro-texture, and no noisy
    stock-surface overlay; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Backlit leaf, chloroplast-window, vein-map, photosynthesis-architecture, leaf-botany; Vein
    network, midrib-spine, secondary-vein branching, areole-polygon mesh, margin-serration; Plant
    cells, epidermal-layer, stomata-pores, cuticle-wax, mesophyll-spongy, vein-scaffold,
    trichome-hairs; Translucent, backlit-through-leaf, sun-layered around-canopy, chlorophyll-glow,
    diffused-morning; Leaf-plane, blade-expansion, lobe-geometry, venation-pattern
  creative_brief: >-
    Use Leaf Veins after prompt X as a transferable style layer: prompt X supplies subject, action,
    and setting, while the preset supplies Backlit leaf, chloroplast-window, vein-map,
    photosynthesis-architecture, leaf-botany, Vein network, midrib-spine, secondary-vein branching,
    areole-polygon mesh, margin-serration, Plant cells, epidermal-layer, stomata-pores, cuticle-wax,
    mesophyll-spongy, vein-scaffold, trichome-hairs, Translucent, backlit-through-leaf, sun-layered
    around-canopy, chlorophyll-glow, diffused-morning, Leaf-plane, blade-expansion, lobe-geometry,
    venation-pattern plus microstructure, magnification artifacts, focus stacking, surface topology,
    optical refraction, and scale-legible detail, palette behavior, light response, material
    treatment, and finish discipline without requiring one specimen, prop bundle, product still, or
    card composition.
