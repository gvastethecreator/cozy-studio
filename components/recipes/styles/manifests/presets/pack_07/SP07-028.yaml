visualDna:
  aesthetic: 'Sustainable green architecture: bioclimatic design where the building shades, ventilates and waters itself, with planted roofs and terraces, deep overhangs and exposed engineered timber.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Warm cross-laminated timber, rammed-earth ochres and greys, many greens from planting, dark photovoltaic glass; natural and mid-contrast.
  lighting_and_shadow: Daylight filtered through timber brise-soleil and foliage, dappled shade on terraces, deep overhangs keeping facades cool.
  texture_and_material: Cross-laminated timber and glulam frames, rammed-earth walls with visible strata, sedum and meadow roofs, integrated photovoltaic panels, rainwater cisterns and chains.
  camera_and_composition: Keep the requested view; show how planting and shading layers wrap the building, from ground to roof edge.
  atmosphere_and_mood: Calm, hopeful and grounded, a building that belongs to its climate.
  rendering_and_quality: Natural-light architectural photograph, real plant variety rather than a generic green wall, no greenwashed corporate gloss.
  key_features: planted sedum and meadow roofs; timber brise-soleil; cross-laminated timber frame; rammed-earth strata walls; rain chains to cisterns
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Sustainable Green as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
