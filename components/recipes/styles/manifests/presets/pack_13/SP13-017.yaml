visualDna:
  aesthetic: 'Ink noir detective anime: black-ink shadows, stark white highlights and a single accent color in hard-boiled mystery frames.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: redrawn as anime with these drawing rules: heavy solid black shadows, sharp white highlights, lean angular faces, smoke and rain drawn in ink."
  color_and_tone: Black and white with one accent color, usually red.
  lighting_and_shadow: Hard single-source light through blinds or a streetlamp, expressed through the style rather than photographic lighting.
  texture_and_material: Ink fills with light screentone, visible at card size as the signature of the style.
  camera_and_composition: Canted angles and deep shadow frames, arranged so the subject still reads at card size.
  atmosphere_and_mood: Moody, suspicious, weary and cool, driven by the construction, color and rhythm.
  rendering_and_quality: Clean on-model anime frame or key visual with deliberate line and cel decisions.
  key_features: solid black shadows; single accent color; hard light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ink Noir Detective as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
