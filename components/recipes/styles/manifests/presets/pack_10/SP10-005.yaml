  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is abstracted into an asymmetric grid of rectangles, with color blocks placed at its key parts."
  color_and_tone: White fields, black lines, red, yellow and blue blocks.
  lighting_and_shadow: Flat, no shadows, expressed through the style rather than photographic lighting.
  texture_and_material: Flat paint with crisp lines, visible at card size as the signature of the style.
  camera_and_composition: Asymmetric orthogonal balance, arranged so the subject still reads at card size.
  atmosphere_and_mood: Calm, pure, ordered and spiritual, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp flat finish, with clean, deliberate marks and no accidental noise.
  key_features: black orthogonal grid; primary blocks; white fields
  creative_brief: "De Stijl grid: black orthogonal lines dividing white fields with a few primary color blocks. Carry it through black orthogonal grid, primary blocks, white fields. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
