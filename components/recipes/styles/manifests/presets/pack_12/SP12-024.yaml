visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Tomb Raider gameplay screenshots: third-person
    cinematic adventure capture with ancient traps, climbing routes, torch-lit ruins, and
    survival-action traversal. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Tomb Raider-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Tomb Raider-informed palette: wet stone grey, torch orange, jungle green, old gold, dark
    cave brown, and blood-warm accents. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through torch pools, cave shafts, fire sparks, silhouette danger, and cinematic
    contrast around traversal hazards. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from mud, rope, broken stone, wood spikes, cloth wraps, relic metal, wet walls,
    and debris-heavy ruins. Materials should feel like in-engine game assets captured during play,
    with enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with over-shoulder third-person framing with ledges, trap lines, puzzle props, escape
    vectors, and cinematic action depth. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Tomb Raider-derived mood: urgent, archaeological, dangerous, physical, and survivalist.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal adventure HUD or
    button prompts are allowed; avoid menu overlays and large text tutorials. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Tomb Raider gameplay screenshots; third-person cinematic adventure capture with ancient traps,
    climbing routes, torch-lit ruins, and survival-action traversal; wet stone grey, torch orange,
    jungle green, old gold, dark cave brown, and blood-warm accents; torch pools, cave shafts, fire
    sparks, silhouette danger, and cinematic contrast around traversal hazards; mud, rope, broken
    stone, wood spikes, cloth wraps, relic metal, wet walls, and debris-heavy ruins; over-shoulder
    third-person framing with ledges, trap lines, puzzle props, escape vectors, and cinematic action
    depth; urgent, archaeological, dangerous, physical, and survivalist; HUD guidance: minimal
    adventure HUD or button prompts are allowed; avoid menu overlays and large text tutorials
  creative_brief: >-
    Use Tomb Raider Trap Gauntlet as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Tomb Raider: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
