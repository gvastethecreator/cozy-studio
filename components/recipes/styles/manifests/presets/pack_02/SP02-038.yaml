visualDna:
  aesthetic: 'Comic offset 3D animation: 3D characters and cities finished like a printed comic page, with halftone dots, ink lines and off-register color.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Saturated CMYK color, magenta and cyan misregistration fringes, bold black shadows.
  lighting_and_shadow: Shadows built from hatching and halftone dots instead of smooth gradients.
  texture_and_material: Ben-Day dots, printed ink lines drawn over 3D forms, paper grain and slight print shift.
  camera_and_composition: Dynamic low angles and extreme perspective, stepped low-frame-rate motion, action-panel framing.
  atmosphere_and_mood: Kinetic and graphic, a comic page coming alive.
  rendering_and_quality: Hybrid 3D and print finish; original characters, no superhero franchise designs.
  key_features: halftone dot shading; off-register color fringes; ink lines over 3D; stepped frame rate; extreme perspective
  creative_brief: "Comic offset 3D animation: 3D characters and cities finished like a printed comic page, with halftone dots, ink lines and off-register color. Carry it through halftone dot shading, off-register color fringes, ink lines over 3D, stepped frame rate, extreme perspective. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - smooth 3d gradients
  - smooth 3d
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - watermark
  - logo clutter
  - generic stock footage
  - uncontrolled noise
  - random cartoon face
  - unreadable motion smear
  - fake subtitles
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
