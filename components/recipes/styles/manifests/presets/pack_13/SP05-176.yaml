visualDna:
  aesthetic: >-
    Bold anime contour surrounds polygonal cel facets, with jewel-like accents confined to
    existing forms.
  subject_treatment: >-
    Keep subject, anatomy, costume, and count; facet armor or surfaces only when requested.
  color_and_tone: >-
    Cerulean, turquoise, amber, muted coral, deep blue; facets clarify values.
  lighting_and_shadow: >-
    Bright broad illumination and hard bevel highlights; add no magical light source.
  texture_and_material: >-
    Smooth cel planes with small facets; no runes, jewels, or effects unless requested.
  camera_and_composition: >-
    Respect framing; diagonals may follow motion but never force a quest pose or team.
  atmosphere_and_mood: >-
    Forward momentum only when the specified action is dynamic; otherwise retain mood.
  rendering_and_quality: >-
    Bold outlines, few shadow bands, legible facets, localized highlights.
  key_features: >-
    Polygonal cel facets, bold outline, cerulean-amber contrast, accents on existing
    surfaces
  creative_brief: "Apply a visual treatment centered on polygonal cel facets, bold outline, cerulean-amber contrast, accents on existing surfaces. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject."
