  aesthetic: 'Armor-etcher iron plate: early etching bitten into iron plates, thick rough lines, corroded dark tone and uneven biting from armorers who made the first etched prints.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; bite the subject into iron with thick etched lines and rough corrosion.
  color_and_tone: Dark iron-black ink with grey corroded plate tone.
  lighting_and_shadow: Strong hatching with rough foul-biting in shadows, kept consistent across the whole image.
  texture_and_material: Thick etched lines, pitted corrosion and irregular ink.
  camera_and_composition: Bold central figures with rough surrounding landscape, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with rugged martial intensity.
  rendering_and_quality: Coarse powerful lines with visible plate flaws, kept consistent across the whole image.
  creative_brief: "Armor-etcher iron plate: early etching bitten into iron plates, thick rough lines, corroded dark tone and uneven biting from armorers who made the first etched prints. Carry it through thick iron-etched lines, pitted corrosion, foul biting, martial detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thick iron-etched lines; pitted corrosion; foul biting; martial detail
