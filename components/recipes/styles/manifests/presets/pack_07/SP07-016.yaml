visualDna:
  aesthetic: 'Bauhaus interior: functional workshop modernism with chrome tubular steel, flat white walls, glass, and furniture reduced to structure, circles and rectangles.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: White, grey and black planes with small primary accents in red, yellow or blue, applied to one wall, cushion or door only.
  lighting_and_shadow: Even daylight through large steel windows, industrial glass or opal globe lamps, crisp shadows of tubular frames on white floors.
  texture_and_material: Chrome-plated tubular steel, stretched canvas or woven cane seats, linoleum floors, painted steel window frames, plate glass, hand-woven wall hangings.
  camera_and_composition: Keep the requested view; orthogonal framing, planes read as flat colored rectangles, clear negative space between objects.
  atmosphere_and_mood: Rational, bright and purposeful, a room designed like a tool.
  rendering_and_quality: 'Crisp period-inspired photograph: clean edges, strong geometry, no ornament and no replica of a named designer chair.'
  key_features: chrome tubular steel; white planes with one primary accent; linoleum floor; steel window grid; orthogonal composition
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bauhaus Interior as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
