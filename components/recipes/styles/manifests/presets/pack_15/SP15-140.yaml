visualDna:
  aesthetic: 'Holopunk: a street culture of cheap holograms, where ads, pets, disguises and ghosts are projected light flickering over grimy reality.'
  subject_treatment: Keep the prompt's subject and setting; overlay or replace parts of it with translucent projected light that glitches at the edges.
  color_and_tone: Grimy concrete greys under translucent cyan, violet and pink projected light.
  lighting_and_shadow: Projected light that casts no shadows, flickering scanlines and projector beams through haze.
  texture_and_material: Semi-transparent holograms with scanlines and dropouts over wet concrete and rust.
  camera_and_composition: Street-level frames where the hologram and the real object overlap awkwardly.
  atmosphere_and_mood: Dazzling and fake, a city where you can never be sure what is really there.
  rendering_and_quality: Crisp illustration with convincing translucent glow and projector artifacts.
  creative_brief: "Holopunk: a street culture of cheap holograms, where ads, pets, disguises and ghosts are projected light flickering over grimy reality. Carry it through translucent holograms, scanline flicker, projector beams, grimy reality. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: translucent holograms; scanline flicker; projector beams; grimy reality
