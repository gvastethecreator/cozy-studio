visualDna:
  aesthetic: 'Pet photography: companion animals photographed at their own eye level, with a fast lens and patient timing that capture personality.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Warm, bright, friendly color; soft background tones that flatter the coat.
  lighting_and_shadow: Soft window or open shade light, catch-lights in the eyes, gentle backlight on fur.
  texture_and_material: Fur, whiskers, wet noses and feathers crisp; home textures soft.
  camera_and_composition: Camera down at the animal's eye level, 35–85 mm, focus on the nearest eye, expressive head tilt or motion.
  atmosphere_and_mood: Playful and affectionate, full of character and warmth.
  rendering_and_quality: Warm portrait finish with sharp eyes; never menacing unless the prompt asks.
  key_features: animal eye level; sharp nearest eye; soft window light; personality moment; warm friendly color
  creative_brief: "Pet photography: companion animals photographed at their own eye level, with a fast lens and patient timing that capture personality. Carry it through animal eye level, sharp nearest eye, soft window light, personality moment, warm friendly color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
