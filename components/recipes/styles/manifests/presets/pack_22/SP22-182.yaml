visualDna:
  aesthetic: >-
    Precise curves and stepped geometric planes simplify existing volume into broad, ornamental color
    fields with crisp changes of direction.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Apply planar simplification
    to existing forms rather than adding architecture, symbols or costume.
  color_and_tone: >-
    Keep the requested palette and use broad color fields with deliberate contrast; metallic hues are not
    required and specified colors must remain intact.
  lighting_and_shadow: >-
    Follow the requested light direction and express its shadows as clear planes without creating a new
    source, glow or dramatic highlight.
  texture_and_material: >-
    Keep surfaces smooth and let the geometry carry the ornament. Represent metal only where the requested
    content already includes it.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Geometric rhythm follows the existing
    composition without forming a frame or page layout.
  atmosphere_and_mood: >-
    Retain the requested setting and mood. Geometric elegance does not imply a historical period, skyline
    or thematic setting.
  rendering_and_quality: >-
    Build large stepped planes and precise arcs first, keeping edges clean and contrasts ornamental but
    subordinate to the subject's silhouette.
avoidRules:
  - unrequested skyscrapers, gold or period lettering
  - unrequested frames or emblems
