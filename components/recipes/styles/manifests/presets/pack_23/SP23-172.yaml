  aesthetic: 'Filtered blurry texture 3D: late-nineties console 3D with small textures stretched and smoothed into soft smeared blurs, round cartoon forms and bright colors.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject with soft smeared low-res textures on rounded low-poly forms.
  color_and_tone: Bright saturated colors softened by blur, kept consistent across the whole image.
  lighting_and_shadow: Simple lighting and round blob shadows, kept consistent across the whole image.
  texture_and_material: Smeared blurry textures, rounded polygons and soft edges.
  camera_and_composition: Third-person camera behind or beside the character, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with bright nostalgic playfulness.
  rendering_and_quality: Authentic soft filtered look, kept consistent across the whole image.
  creative_brief: "Filtered blurry texture 3D: late-nineties console 3D with small textures stretched and smoothed into soft smeared blurs, round cartoon forms and bright colors. Carry it through smeared textures, bright colors, blob shadows, rounded low poly. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
