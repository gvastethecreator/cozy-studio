visualDna:
  aesthetic: 'Rounded Instrument Panels: compact groups of controls in soft-edged panels, each with its own scale and a direct reading.'
  subject_treatment: Group the prompt's controls into soft panels sized by task, each with a directly linked scale or reading; keep requested labels and values exact.
  color_and_tone: Neutral base and an accent concentrated on the selection, with clear reading values.
  lighting_and_shadow: Very soft edge light where it helps separate one panel from another.
  texture_and_material: Semi-matte surfaces, soft contours and precise graphic scales.
  camera_and_composition: Panels sized by task with aligned controls and readings within easy reach.
  atmosphere_and_mood: Friendly instruments with operational clarity, approachable and exact.
  rendering_and_quality: Every scale shows a range or unit when the brief supplies one.
  creative_brief: "Rounded Instrument Panels: compact groups of controls in soft-edged panels, each with its own scale and a direct reading. Carry it through soft grouped panels, linked scales, task-sized groups, one accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft grouped panels; linked scales; task-sized groups; one accent
