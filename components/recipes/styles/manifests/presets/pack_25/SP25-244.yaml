visualDna:
  aesthetic: 'Warp-Weft Image Systems: images and values emerge from which thread direction dominates at each crossing of an apparent weave.'
  subject_treatment: Build the prompt's subject into an apparent woven surface where the image appears only through which thread direction dominates at each crossing.
  color_and_tone: Values from warp or weft dominance, in a short palette per thread system.
  lighting_and_shadow: Minimal shade at crossings to explain order, the woven image staying flat.
  texture_and_material: Threads of consistent visual weight and steady spacing.
  camera_and_composition: A continuous base grid with dominance changing in blocks.
  atmosphere_and_mood: A regular pulse of warp and weft with a larger figure appearing.
  rendering_and_quality: Clean weave with consistent crossings and a figure readable from afar.
  creative_brief: "Warp-Weft Image Systems: images and values emerge from which thread direction dominates at each crossing of an apparent weave. Carry it through warp and weft dominance, image from crossings, steady grid, two thread systems. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: warp and weft dominance; image from crossings; steady grid; two thread systems
