  aesthetic: 'Oraclepunk: oracles who read the future through smoke, trance and strange machines, with vapor-filled temples, bronze tripods and seekers waiting in long lines.'
  subject_treatment: Keep the prompt's subject and setting; bring in a veiled oracle, rising vapors, bronze tripods and anxious seekers.
  color_and_tone: Pale marble and bronze with drifting violet-grey smoke and warm brazier orange.
  lighting_and_shadow: Brazier fire glowing through thick smoke, faces half hidden in haze.
  texture_and_material: Weathered marble, bronze tripods, laurel leaves, veils and curling vapor.
  camera_and_composition: Temple interiors with the oracle framed high in smoke above small seekers.
  atmosphere_and_mood: Mysterious and tense, every answer arriving as a riddle.
  rendering_and_quality: Hazy atmospheric illustration with layered smoke and warm fire glow.
  creative_brief: "Oraclepunk: oracles who read the future through smoke, trance and strange machines, with vapor-filled temples, bronze tripods and seekers waiting in long lines. Carry it through veiled oracle, rising vapors, bronze tripods, waiting seekers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
