visualDna:
  aesthetic: 'Burnished colored pencil: many light layers of wax-based pencil laid in small circular strokes, then pressed hard with a colorless blender until the paper tooth disappears.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Jewel-rich saturated color built from layered hues, such as crimson over violet or yellow under green, with deep complementary darks instead of black.
  lighting_and_shadow: Strong directional light with smooth, fully saturated shadow transitions and bright polished highlights.
  texture_and_material: Glossy waxy sheen where burnished, tiny white paper specks only in the unburnished lights, slight wax bloom in heavy darks.
  camera_and_composition: Keep the requested framing; subjects often sit against a clean white paper field.
  atmosphere_and_mood: Rich, careful and jewel-like, colors almost glowing.
  rendering_and_quality: Smooth burnished surfaces with crisp edges; no pencil hatching visible in the finished areas, no watery washes.
  key_features: layered wax pencil in circular strokes; burnished glossy surface; complementary layered darks; paper tooth filled; clean white field
  creative_brief: "Burnished colored pencil: many light layers of wax-based pencil laid in small circular strokes, then pressed hard with a colorless blender until the paper tooth disappears. Carry it through layered wax pencil in circular strokes, burnished glossy surface, complementary layered darks, paper tooth filled, clean white field. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
