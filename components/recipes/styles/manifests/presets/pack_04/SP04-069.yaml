visualDna:
  aesthetic: 'Hand-carved rubber stamp impressions: the subject cut into soft eraser blocks and stamped by hand from ink pads, built from repeated units.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: One to three ink-pad colors such as vermilion, black and teal on kraft or cream paper, overlaps mixing darker.
  lighting_and_shadow: Flat with no modeling; value comes only from stamp coverage, pressure and overlaps.
  texture_and_material: Speckled uneven ink transfer, bold simplified carved shapes, faint block edges and slight rotation between repeats.
  camera_and_composition: Keep the requested view, assembled from a few repeated stamped units in rhythm.
  atmosphere_and_mood: Crafty, playful and tactile, patterns pressed by hand.
  rendering_and_quality: Handmade impression quality with pale spots where the pressure failed; no bureaucratic office stamps.
  key_features: repeated stamped units; speckled ink-pad transfer; faint block edges; kraft paper; one to three pad colors
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Carved Eraser Stamp as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
