visualDna:
  aesthetic: 'Rendered volumetric shafts: a strong light behind an occluder rendered through a participating medium, producing crisp beams with dust particles.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera; add only a light source behind an existing occluder and a thin medium so its beams become visible.
  color_and_tone: Warm or cool beams against darker surroundings, lifted haze in the shafts.
  lighting_and_shadow: Parallel or radiating shafts with sharp edges, subject cut by light and shadow bands.
  texture_and_material: Dust particles, sparkling motes, slight noise in the medium.
  camera_and_composition: Keep the requested framing; beams crossing diagonally toward the subject.
  atmosphere_and_mood: Sacred and dramatic, light made solid in the air.
  rendering_and_quality: Clean rendered volumes; the photographic and cinematic shafts live in pack_01 and pack_02.
  key_features: crisp rendered beams; occluder pattern; dust particles; diagonal shafts; lifted haze
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rendered Volumetric Shafts as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
