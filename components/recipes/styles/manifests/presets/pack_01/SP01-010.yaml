visualDna:
  aesthetic: 'Low-key portraiture: a figure carved out of darkness by one narrow source, most of the frame surrendered to deep shadow.'
  subject_treatment: Reveal only the planes that matter — one side of the face, a hand, an edge of clothing — letting the rest fall into black.
  color_and_tone: Deep blacks and rich dark tones, muted desaturated color, highlights restrained to a small area.
  lighting_and_shadow: Single hard or gridded source from the side or above, no fill, sharp falloff into black background.
  texture_and_material: Skin texture, stubble, wrinkles and fabric grain emphasized by raking light.
  camera_and_composition: Tight crop, subject off-center, large black negative space, eye-level or slightly below.
  atmosphere_and_mood: Brooding, secretive, grave, and intense.
  rendering_and_quality: Clean noise-free blacks with detailed highlights; no muddy gray shadows.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Low Key Portrait as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: single gridded source; no fill; black negative space; raking texture; restrained highlights
