visualDna:
  aesthetic: >-
    Cobweb translates natural material behavior into form: start from Dusty old webs, Sticky, dusty,
    and Drape, then turn natural formation, growth, erosion, and geological or biological
    irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Fine strands: preserve identity and pose while letting
    forms grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Grey, White as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Backlit define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Cobweb without hiding the prompt subject.
  texture_and_material: >-
    Render Sticky, dusty through organic variation, non-repeating edge wear, local pores, growth
    marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Drape as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Spooky, abandoned by using age, weather, habitat pressure, and sensory
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Aged, abandoned material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Dusty old webs; Fine strands; Sticky, dusty; Backlit; Drape
  creative_brief: >-
    Route any subject through Cobweb as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Render cobweb material as dusty filament
    architecture over the input: chaotic grey silk strands, messy draped veils, sticky
    intersections, backlit silver thread, and dust gathered where lines meet. If corner, object,
    ruin, or creature context exists, let webs cling to it; otherwise use cobwebs as aged overlay
    without forcing haunted-house staging. Use Cobweb as portable surface/render behavior over any
    input: map its texture, light response, edge wear, color chemistry, and tactile rhythm onto the
    subject instead of requiring a literal material sample, macro tile, wall, landscape, source
    object, or scene where the material naturally appears.
avoidRules:
  - spider web (neat)
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
