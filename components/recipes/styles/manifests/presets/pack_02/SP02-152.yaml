visualDna:
  aesthetic: 'Synthetic aperture radar: a satellite radar image in grainy greyscale where rough and metal surfaces return bright and smooth water stays black.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Salt-and-pepper greyscale, black calm water, bright white metal and cliffs.
  lighting_and_shadow: 'Side-looking radar illumination: slopes facing the satellite bright, back slopes in radar shadow.'
  texture_and_material: Heavy speckle, geometric layover distortion on mountains, bright corner reflectors.
  camera_and_composition: Orbital view, subject as landscape-scale texture and bright points.
  atmosphere_and_mood: Cold and technical, the world seen through storm and night alike.
  rendering_and_quality: Credible SAR speckle look; no labels or scale bars.
  creative_brief: "Synthetic aperture radar: a satellite radar image in grainy greyscale where rough and metal surfaces return bright and smooth water stays black. Carry it through speckled greyscale, black smooth water, bright metal returns, radar shadow on slopes, layover distortion. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: speckled greyscale; black smooth water; bright metal returns; radar shadow on slopes; layover distortion
