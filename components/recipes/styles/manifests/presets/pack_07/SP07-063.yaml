visualDna:
  aesthetic: 'Sepulchral civic monumentalism: public buildings designed as necropolis architecture, black basalt colonnades, bone-marble inlay grids and oxidized bronze doors at inhuman height.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Black basalt, bone white marble, verdigris bronze and a faint spectral pale-green glow; near-monochrome and severe.
  lighting_and_shadow: Low cold overcast light raking across the colonnades, deep narrow shadows between pilasters, pale glow from within.
  texture_and_material: Honed basalt with a dull sheen, precise marble inlay in lapidary grids, bronze with green oxidation runs.
  camera_and_composition: Keep the requested view; endless repeated pilasters and a low eye line make the building tower over the viewer.
  atmosphere_and_mood: Solemn, bureaucratic and funereal, the state as a tomb.
  rendering_and_quality: Severe architectural render with crisp stone edges and restrained glow; no skulls, gore or cemetery props.
  key_features: black basalt colonnades; bone-marble inlay grids; oxidized bronze doors; endless repeated pilasters; cold raking overcast light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Sepulchral Civic Monumentalism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
