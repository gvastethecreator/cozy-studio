    Anime cel and watercolor hybrid softens selected contours into translucent overlap while
    focal lines stay clear.
  subject_treatment: >-
    Preserve subject, action, number; repeat imagery only if memory or echo is explicitly
    requested.
  color_and_tone: >-
    Warm ochre, dusty blue, faded lilac, muted coral, charcoal; gradients stay local.
  lighting_and_shadow: >-
    Warm-cool value drift within forms; no sunset or time-of-day light.
  texture_and_material: >-
    Diluted wash, subtle paper tooth, controlled pigment edges; keep major forms legible.
  camera_and_composition: >-
    Keep camera; open space, no extra letters, clocks, or duplicate figures.
  atmosphere_and_mood: >-
    Wistfulness only when requested, through softened edges rather than story cues.
  rendering_and_quality: >-
    Clear focal contour, quiet layers, no global bloom or sepia.
  key_features: >-
    Translucent overlap, warm-cool wash, soft edge intervals, clear focal contour
