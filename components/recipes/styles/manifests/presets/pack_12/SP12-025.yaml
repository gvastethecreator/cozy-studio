visualDna:
  aesthetic: 'Lizardcube and Guard Crush Streets of Rage 4 (2020) look: hand-drawn 2D animation with thick brush outlines, flat cel color and soft painted neon streets in a side-scrolling beat em up.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as hand-drawn animated fighters with thick brush outlines, chunky proportions and big readable poses. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Neon pink, cyan and orange signs over deep blue night streets.
  lighting_and_shadow: Painted neon glow with flat cel shadows and soft rim light on fighters.
  texture_and_material: Hand-drawn 2D animation lines and flat painted fills over painted backgrounds.
  camera_and_composition: Side-scrolling beat em up view with a deep street lane for fighters.
  atmosphere_and_mood: Keep the requested mood with punchy street-brawl swagger.
  rendering_and_quality: Authentic modern hand-drawn 2D beat em up screen.
  key_features: Streets of Rage 4 hand-drawn; thick brush lines; neon street lane
  creative_brief: 'Lizardcube and Guard Crush Streets of Rage 4 (2020) look: hand-drawn 2D animation with thick brush outlines, flat cel color and soft painted neon streets in a side-scrolling beat em up. Carry it through Streets of Rage 4 hand-drawn, thick brush lines, neon street lane. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
