visualDna:
  aesthetic: 'Optical Ambigram Study: requested words drawn so they read again after a declared rotation or reflection, shown in both orientations.'
  subject_treatment: Letter the requested word so it reads after a 180-degree turn or mirror, choosing the transformation that keeps both readings exact, and show both orientations.
  color_and_tone: One ink on a neutral ground so every reading problem stays visible.
  lighting_and_shadow: Flat rendering with no perspective or shading that favors one orientation.
  texture_and_material: Deliberately drawn contours with every stroke shared by both readings.
  camera_and_composition: Original and transformed views placed side by side at comparable positions.
  atmosphere_and_mood: Optical surprise that stays subordinate to legibility, clever and contained.
  rendering_and_quality: Both readings checked separately, with the requested text kept exact.
  creative_brief: "Optical Ambigram Study: requested words drawn so they read again after a declared rotation or reflection, shown in both orientations. Carry it through double reading, declared rotation, side-by-side orientations, exact word. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: double reading; declared rotation; side-by-side orientations; exact word
avoidRules:
  - only one valid reading
