visualDna:
  aesthetic: 'Counterform Reveal Motion: styleframes where the inner spaces of a symbol or word open up to reveal the message behind them.'
  subject_treatment: Show the prompt's symbol or word opening its own counters in keyframes to reveal related content, with no foreign mask and every word exact.
  color_and_tone: High figure-ground contrast with an optional accent on the revealed layer.
  lighting_and_shadow: Flat or contained volume, the counter change doing the work.
  texture_and_material: Continuous edges and wide openings that stay open throughout.
  camera_and_composition: The opening holds focus and the final frame reads completely.
  atmosphere_and_mood: A brief expectation followed by reveal and a readable pause.
  rendering_and_quality: Crisp keyframes with clean counters and complete letters at the end.
  creative_brief: "Counterform Reveal Motion: styleframes where the inner spaces of a symbol or word open up to reveal the message behind them. Carry it through counters opening, reveal from within, no foreign mask, readable end. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: counters opening; reveal from within; no foreign mask; readable end
