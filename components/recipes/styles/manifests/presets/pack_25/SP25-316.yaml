visualDna:
  aesthetic: 'Type-Driven Camera Motion: styleframes where the apparent camera travels along baselines, columns and counters of the text without losing orientation.'
  subject_treatment: Show a camera move along the prompt's text in keyframes, following baselines or counters with anchors kept and every word exact.
  color_and_tone: A constant content and background palette across framings.
  lighting_and_shadow: Flat editorial space or simple type space with stable light.
  texture_and_material: Sharp text at every scale with no invented detail up close.
  camera_and_composition: Typographic anchor points and moderate paths ending in full context.
  atmosphere_and_mood: A journey guided by reading, with a brief acceleration and a pause.
  rendering_and_quality: Crisp keyframes with exact copy and persistent anchors.
  creative_brief: "Type-Driven Camera Motion: styleframes where the apparent camera travels along baselines, columns and counters of the text without losing orientation. Carry it through camera along type, baseline paths, kept anchors, readable arrival. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: camera along type; baseline paths; kept anchors; readable arrival
