visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Plants vs. Zombies gameplay screenshots:
    cartoon lane-defense capture with garden rows, readable enemy waves, plant units, projectiles,
    and cheerful tower-defense clarity. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Plants vs. Zombies-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Plants vs. Zombies-informed palette: lawn green, sunflower yellow, zombie grey, roof red,
    pea green, and bright blue UI accents. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through flat daylight, simple night-stage tint, projectile glow, explosion
    puffs, and friendly cartoon contrast. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from bold 2D sprites, lawn tiles, soil rows, silly enemy shapes, plant textures,
    coins, and chunky projectiles. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with fixed orthographic lane view with left-to-right wave pressure, plant placement
    grid, resource sun, and readable path lanes. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Plants vs. Zombies-derived mood: absurd, defensive, charming, escalating, and tactically
    legible. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when
    prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: seed packets, sun counter,
    progress meter, and lane indicators are expected as coherent gameplay UI. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Plants vs. Zombies gameplay screenshots; cartoon lane-defense capture with garden rows, readable
    enemy waves, plant units, projectiles, and cheerful tower-defense clarity; lawn green, sunflower
    yellow, zombie grey, roof red, pea green, and bright blue UI accents; flat daylight, simple
    night-stage tint, projectile glow, explosion puffs, and friendly cartoon contrast; bold 2D
    sprites, lawn tiles, soil rows, silly enemy shapes, plant textures, coins, and chunky
    projectiles; fixed orthographic lane view with left-to-right wave pressure, plant placement
    grid, resource sun, and readable path lanes; absurd, defensive, charming, escalating, and
    tactically legible; HUD guidance: seed packets, sun counter, progress meter, and lane indicators
    are expected as coherent gameplay UI
  creative_brief: >-
    Use Plants vs Zombies Orchard Defense as a transferable game-originals preset. Preserve prompt
    X, then route interpretation through capture references from Plants vs. Zombies: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
