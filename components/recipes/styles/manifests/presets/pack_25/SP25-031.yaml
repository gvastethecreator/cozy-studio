visualDna:
  aesthetic: 'Directional Notch Icons: consistent notches cut into a stable silhouette encode relation, input or output instead of large arrows.'
  subject_treatment: Give the prompt's subject or requested actions one stable body per object and one functional notch per relation, placed by a declared convention.
  color_and_tone: One ink for body and notch, with any state color repeating the shape.
  lighting_and_shadow: Flat shapes where every notch is a real geometric cut.
  texture_and_material: Defined edges and notches wide enough to read as intentional design.
  camera_and_composition: Input and output positioned by one convention applied to every member.
  atmosphere_and_mood: Contained direction and relational precision, quietly logical and calm.
  rendering_and_quality: A notch never switches sides just to balance the symbol visually.
  creative_brief: "Directional Notch Icons: consistent notches cut into a stable silhouette encode relation, input or output instead of large arrows. Carry it through functional notches, stable bodies, declared convention, no big arrows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: functional notches; stable bodies; declared convention; no big arrows
