visualDna:
  aesthetic: >-
    On an explicitly requested textile target, coherent thread direction builds flat masses with
    medium-scale weave detail and subtly stepped edges.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Apply the weave only to the
    specified fabric surface; do not turn unrelated subjects into tapestries or woven symbols.
  color_and_tone: >-
    Preserve the requested palette as distinct thread colors and shape-led fields; do not introduce a
    heraldic color scheme or extra motif.
  lighting_and_shadow: >-
    Follow the requested lighting and represent any shadows through the existing woven value groups
    without adding a new source or relief effect.
  texture_and_material: >-
    Use visible medium-scale threads with a consistent direction only on the requested textile target;
    do not simulate a weave as general fine noise.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. The material rendering does not add a
    tapestry border or change the composition.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Textile rendering does not add animals, flowers, heraldry or a
    cultural story unless those are already requested content.
  rendering_and_quality: >-
    Resolve the major silhouette and color fields before showing clear, medium-scale thread marks; avoid
    fine noise and preserve readability at reduced size.
avoidRules:
  - weave outside the requested textile target
  - unrequested animals, flowers, heraldry or tapestry borders
  - details that alter identity or function
assets:
