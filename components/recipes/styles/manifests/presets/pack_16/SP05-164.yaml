visualDna:
  aesthetic: >-
    A wet techno-noir 90s cel treatment combines precise dark contours, clipped cyan reflections and
    broken neon color bands. The slick surface effect follows depicted materials instead of making the
    whole scene rainy.
  subject_treatment: >-
    Keep the requested identity and construction. Add sharp reflected edges only to surfaces that can
    reflect them; do not add cybernetic parts, screens or wet clothing.
  color_and_tone: >-
    When open, use deep blue-black, electric cyan and a small magenta or red signal. Preserve
    requested colors and place accents in distinct, clipped areas.
  lighting_and_shadow: >-
    Use hard cel shadows and thin synthetic-looking edge glints on existing reflective surfaces.
    Retain supplied lighting; do not invent neon signs or a night street.
  texture_and_material: >-
    Combine fine scanline breaks with narrow reflective streaks and crisp painted fills. Apply gloss
    to plausible materials and keep fabric, skin and matte surfaces distinct.
  camera_and_composition: >-
    Use parallel bands and reflected diagonals within the existing frame to suggest a techno-noir
    cadence. Preserve perspective and object placement; add no city geometry.
  atmosphere_and_mood: >-
    Create an alert, cool visual tone through precise contrast and reflected color. Preserve the
    requested mood without a crime or cyberpunk story.
  rendering_and_quality: >-
    Keep edges sharp, reflections bounded and scanline texture sparse. Avoid full-frame static, excess
    bloom and generic neon wash.
  key_features: >-
    clipped cyan reflections; precise dark contours; sparse scanline bands over material-aware gloss
  creative_brief: 'Apply the restrained techno-noir cel treatment to the requested content. Preserve its identity, materials, lighting and composition; add no screens, neon signs, rain or cybernetic details. Use it as a reusable look on any subject.'
