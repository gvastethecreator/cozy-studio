visualDna:
  aesthetic: 'Droste recursion: the space contains a smaller exact copy of itself through a window, doorway or frame, which contains another, receding without end.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into a self-containing recursion that repeats inside itself, and that advertised structural change is the purpose of the preset.
  color_and_tone: The scene palette repeated at every level, each recursion a step cooler and dimmer toward the center.
  lighting_and_shadow: One lighting setup repeated exactly at every level, so the copies read as the same place.
  texture_and_material: Materials stay identical at every scale until they blur into a point at the vanishing center.
  camera_and_composition: Frontal or spiral composition, the recursion centered or twisting inward on a Droste spiral.
  atmosphere_and_mood: Hypnotic and vertiginous, a room with no final wall.
  rendering_and_quality: Seamless recursion with no visible seam or collage frame; the copies are continuous space.
  creative_brief: "Droste recursion: the space contains a smaller exact copy of itself through a window, doorway or frame, which contains another, receding without end. Carry it through space containing its own copy, endless inward repetition, centered or spiral recursion, cooler dimmer levels, seamless continuity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: space containing its own copy; endless inward repetition; centered or spiral recursion; cooler dimmer levels; seamless continuity
