visualDna:
  aesthetic: 'Nautical chart: coastlines, depth soundings as dots, compass roses and rhumb lines.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject becomes a coastline with rhumb lines and compass roses."
  color_and_tone: Pale blue sea, buff land, sepia lines, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Engraved chart paper, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Adventurous, navigational, antique and calm, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Nautical Chart as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: compass roses; rhumb lines; illustrative only
