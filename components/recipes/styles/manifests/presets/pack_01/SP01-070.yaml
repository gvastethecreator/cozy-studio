visualDna:
  aesthetic: 'Editorial travel photography: a place discovered through a traveler, with the journey layered into the frame as route, scale and local light.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Natural destination color, warm late-day light, local accent hues against dusty neutrals.
  lighting_and_shadow: 'Available daylight: dawn departures, raking afternoon sun, window spill inside dwellings.'
  texture_and_material: Road dust, weathered stone, textiles, water sheen and patina of age, all rendered tactile.
  camera_and_composition: 24–50 mm, a human figure for scale inside the landscape or architecture, leading path or road, foreground detail from the local place.
  atmosphere_and_mood: Curious and restless, the pleasure of arriving somewhere far from home.
  rendering_and_quality: Magazine travel realism with restrained grading; no brochure gloss, selfie framing or tourist-trap staging.
  key_features: traveler for scale; route and path in frame; local accent color; warm raking daylight; tactile place detail
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Travel Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
