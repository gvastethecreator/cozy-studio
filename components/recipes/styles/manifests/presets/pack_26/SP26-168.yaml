  lighting_and_shadow: Flat ornamental color with no cast shadows, lit the way Richard Williams lights its scenes.
  texture_and_material: Hand-drawn animation paper with painted flat color, with the surface finish of Richard Williams.
  camera_and_composition: Flat symmetrical tableaux folding into impossible perspective, framed the way Richard Williams composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with dazzling ornamental mischief.
  rendering_and_quality: Faithful Richard Williams hand-drawn frame, in the recognizable hand of Richard Williams.
