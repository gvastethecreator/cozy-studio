visualDna:
  aesthetic: 'Dark modern exorcism anime: confident brush-pen contours, large spotted black shadow masses, and supernatural energy drawn as ink-smoke ribbons rimmed in cyan and violet.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Near-black ink and cool concrete greys with only two accents, electric cyan and bruise violet, both reserved for energy edges.
  lighting_and_shadow: Hard side light carves half of each face into solid black, with a thin cyan-violet rim along the lit edge.
  texture_and_material: Dry brush-pen grain at contour tails, spotted blacks, and ink-smoke bands with feathered edges.
  camera_and_composition: Keep the requested framing; tilt the horizon a few degrees and compress space around the focal form with deep black gaps.
  atmosphere_and_mood: Coiled menace and cool confidence, danger held in shadow.
  rendering_and_quality: Big black shapes read first; smoke ribbons and rims carry the only color, with no particle confetti.
  key_features: brush-pen contour; spotted black masses; ink-smoke energy ribbons; cyan-violet rim light; tilted horizon
  creative_brief: "Dark modern exorcism anime: confident brush-pen contours, large spotted black shadow masses, and supernatural energy drawn as ink-smoke ribbons rimmed in cyan and violet. Carry it through brush-pen contour, spotted black masses, ink-smoke energy ribbons, cyan-violet rim light, tilted horizon. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
