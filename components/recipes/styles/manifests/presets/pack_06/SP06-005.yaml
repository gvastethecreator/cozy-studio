visualDna:
  aesthetic: 'Egg tempera on a gessoed panel: pure pigment bound in yolk, built from thousands of tiny parallel and cross-hatched brush strokes, often set against burnished gold leaf.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Clear bright pigments such as ultramarine, vermilion, malachite green and lead-tin yellow over a green-earth underlayer in flesh; tooled gold ground.
  lighting_and_shadow: Soft even light from within; modeling built by hatching light over dark, with no cast shadows and no strong directional source.
  texture_and_material: Smooth ivory gesso panel, fine hatched strokes that never blend, burnished gold leaf with punched dot patterns around halos and borders of the forms.
  camera_and_composition: Keep the requested framing but flatten depth into stacked, frontal planes; figures and buildings sit on the picture plane.
  atmosphere_and_mood: Still, luminous and devotional, precise craft over drama.
  rendering_and_quality: Every form modeled in visible fine hatching, crisp contours, matte eggshell sheen; no loose brushwork, no oil glazing.
  key_features: fine cross-hatched modeling; burnished and punched gold leaf; green-earth underpainting in flesh; frontal stacked space; matte eggshell sheen
  creative_brief: "Egg tempera on a gessoed panel: pure pigment bound in yolk, built from thousands of tiny parallel and cross-hatched brush strokes, often set against burnished gold leaf. Carry it through fine cross-hatched modeling, burnished and punched gold leaf, green-earth underpainting in flesh, frontal stacked space, matte eggshell sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
