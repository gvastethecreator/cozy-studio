visualDna:
  aesthetic: 'Water-horizon hospitality landscape: warm stone terraces and pools whose edges vanish into a view, with tropical planting framing still turquoise water.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Turquoise and deep teal water, warm sand-coloured stone, teak brown, glossy tropical greens; bright, warm, relaxed.
  lighting_and_shadow: Strong sun with crisp palm-leaf shadows on stone, water reflecting sky; at night, pools lit from below.
  texture_and_material: Honed limestone or sandstone coping, vanishing-edge overflows, teak decking, frangipani, palms and elephant-ear leaves, wet stone darkened at the waterline.
  camera_and_composition: Keep the requested view; low along the water surface so the pool edge merges with the horizon or view beyond.
  atmosphere_and_mood: Languid, sunlit and luxurious, time slowed at the water edge.
  rendering_and_quality: Clean photograph with glassy water, crisp leaf shadows, no brand resort staging or pool party.
  key_features: vanishing-edge pool meeting the horizon; warm honed stone coping; teak decking; tropical leaf shadows; turquoise water
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Water-Horizon Hospitality as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
