visualDna:
  aesthetic: >-
    Astrophotography acts as a transferable photographic style router: begin from Long-exposure
    night-sky imaging, Cosmic exposure texture, and field and nature photographic system built from
    natural light, patient timing, environmental scale, and credible ecology, then apply the
    photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Star trails (optional); preserve prompt identity while giving
    it field realism, habitat pressure, natural scale, or macro/wildlife observation cues, keeping
    the original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Deep Blue, Purple, White stars; grade through natural atmosphere, silver-black
    fine-art values, underwater blue shift, sky exposure, foliage color, or animal camouflage, with
    value separation and white balance choices that feel captured in-camera rather than painted
    over.
  lighting_and_shadow: >-
    Use Starlight; use weather, sun angle, water absorption, night-sky exposure, diffused field
    light, or telephoto background separation, preserving believable exposure, shadow density,
    highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Noise (stars); render fur, feathers, plant texture, rock, water, star noise, mist, mud,
    and environmental micro-detail without plastic artificiality, avoiding both waxy smoothing and
    noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Astrophotography field-camera realism, environmental scale, natural light, and
    patient observational detail; compose through long-lens compression, macro proximity, horizon
    scale, field patience, eye-level empathy, or monumental stillness, with lens distance, depth,
    timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Cosmic, silent; derive mood from patience, wilderness pressure, wonder, cosmic
    quiet, companion warmth, or fine-art environmental grandeur, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Long exposure, epic; finish as believable field photography with clean detail,
    natural restraint, and no oversaturated postcard or zoo snapshot look, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: >-
    Long-exposure night-sky imaging; Cosmic exposure texture; Deep Blue, Purple, White stars;
    Starlight; Astrophotography field-camera realism, environmental scale, natural light, and
    patient observational detail
  creative_brief: >-
    Apply Astrophotography as a photographic preset over prompt X: preserve the user's requested
    subject, then route Long-exposure night-sky imaging, Deep Blue, Purple, White stars, Starlight,
    Noise (stars), and Astrophotography field-camera realism, environmental scale, natural light,
    and patient observational detail through optics, exposure, palette, surface response, timing,
    and finish without requiring the card image's original subject.
