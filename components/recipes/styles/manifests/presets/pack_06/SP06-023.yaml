visualDna:
  aesthetic: 'Silverpoint drawing: a silver stylus drawn over a white bone-ash prepared ground, leaving extremely fine uniform grey lines that cannot be erased.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Pale cool silver-grey lines on warm cream ground, very narrow value range, older marks tarnishing to a soft brown.
  lighting_and_shadow: Gentle modeling with fine parallel hatching only; the deepest shadow is still only a mid-grey.
  texture_and_material: Smooth chalky prepared ground, hair-fine lines of identical width, no smudge, faint tarnish warmth in dense hatching.
  camera_and_composition: Keep the requested framing; often a study sheet with the subject isolated on the bare ground.
  atmosphere_and_mood: Delicate, precise and hushed, a drawing that whispers.
  rendering_and_quality: Thin unvarying line width, parallel diagonal hatching, no corrections or erasures, no dark accents.
  key_features: hair-fine uniform metal lines; cream bone-ash ground; parallel diagonal hatching; pale narrow value range; warm tarnish in dense areas
  creative_brief: "Silverpoint drawing: a silver stylus drawn over a white bone-ash prepared ground, leaving extremely fine uniform grey lines that cannot be erased. Carry it through hair-fine uniform metal lines, cream bone-ash ground, parallel diagonal hatching, pale narrow value range, warm tarnish in dense areas. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
