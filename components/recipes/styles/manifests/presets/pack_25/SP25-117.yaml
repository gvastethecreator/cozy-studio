visualDna:
  aesthetic: 'Stacked Ring Forms: products built from a column of stacked rings and discs, each ring a separate part with its own material and role.'
  subject_treatment: Build the prompt's product as a stack of rings and discs, each ring one part with its own role, so function reads from bottom to top.
  color_and_tone: Alternating ring materials in a tight palette with one accent ring.
  lighting_and_shadow: Soft side light catching every ring edge and the small gaps between them.
  texture_and_material: Machined, turned and cast rings in matte and satin finishes.
  camera_and_composition: Upright stack seen at eye level, the rhythm of rings reading clearly.
  atmosphere_and_mood: Sculptural and totemic, precise and satisfying like a finished lathe part.
  rendering_and_quality: Clean concept render with crisp ring edges and consistent diameters.
  creative_brief: "Stacked Ring Forms: products built from a column of stacked rings and discs, each ring a separate part with its own material and role. Carry it through stacked rings, one role per ring, accent ring, turned edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked rings; one role per ring; accent ring; turned edges
