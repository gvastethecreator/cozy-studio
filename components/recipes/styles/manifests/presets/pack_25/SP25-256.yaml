visualDna:
  aesthetic: 'Layered Tracery Fields: a fine linear network passes over bold ornamental masses, small reserves at every meeting keeping the two scales apart.'
  subject_treatment: Lay a fine linear network over bold masses based on the prompt's subject, with small reserves at each meeting so both scales stay distinct.
  color_and_tone: Moderate contrast for the network and stronger presence for the masses.
  lighting_and_shadow: Flat art where separation comes from the reserves.
  texture_and_material: Fine yet reproducible lines and simple mass edges.
  camera_and_composition: Network nodes kept off mass centers, with corridors of space between groups.
  atmosphere_and_mood: Structural delicacy with wide pauses and localized complexity.
  rendering_and_quality: Clean tracery that stays legible at use size with no moire.
  creative_brief: "Layered Tracery Fields: a fine linear network passes over bold ornamental masses, small reserves at every meeting keeping the two scales apart. Carry it through fine tracery, bold masses, reserves at meetings, two scales. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fine tracery; bold masses; reserves at meetings; two scales
