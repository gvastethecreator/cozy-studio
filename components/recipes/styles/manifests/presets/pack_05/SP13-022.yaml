visualDna:
  aesthetic: >-
    Build vertigo from firm contours, extreme diagonals, and two directional paths that cross in
    depth. Use aerial spacing and luminous edge accents to clarify the crossing without requiring a
    collision, opponent, or literal energy effect.
  subject_treatment: >-
    Preserve the requested subject identities and count, action, pose, props, wardrobe, setting,
    and tone. Restyle only contours, gesture emphasis, and edge rhythm. Do not add, remove, replace,
    or duplicate people, opponents, props, or scene elements.
  color_and_tone: >-
    Preserve the requested palette and emotional temperature. Separate the crossing paths with
    value contrast and restrained luminous accents drawn from colors already present in the scene.
  lighting_and_shadow: >-
    Use crisp crossing highlights only where they help separate existing forms. Follow the
    requested lighting context and do not invent flashes, electricity, sparks, machinery, or magic.
  texture_and_material: >-
    Keep surface detail subordinate to the crossing motion. Use fine directional marks attached to
    existing movement; preserve requested materials and do not add dust, smoke, debris, or other
    physical elements unless requested.
  camera_and_composition: >-
    When the requested camera leaves room for interpretation, use a steep oblique viewpoint,
    intersecting depth diagonals, and generous separation around the crossing paths. Preserve the
    requested action and do not turn proximity into a collision.
  atmosphere_and_mood: >-
    Let the requested tone lead. Create vertigo through viewpoint, scale, and direction rather than
    imposing danger, heroism, or a collision.
  rendering_and_quality: >-
    Use firm 2D contours, stable anatomy or object structure, and distinct value groups. Keep both
    directional paths legible without obscuring the requested subject or action.
  key_features: >-
    Firm contours, extreme diagonals, aerial spacing, intersecting depth paths, restrained luminous
    accents, and immediate subject and action readability.
  creative_brief: >-
    Frame the requested action with intersecting diagonals, aerial depth, and firm contour rhythm.
    Preserve the requested subject, count, props, setting, action, and tone.
