visualDna:
  aesthetic: >-
    Brushed Aluminum treats fabrication as visible style language: start from Metal surface, Fine
    lines, and Directional scratch, then turn manufacturing process, tooling marks, seams,
    tolerances, and industrial material behavior into portable surface behavior rather than a
    literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Micro scratches: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Silver Grey as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Anisotropic define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Brushed Aluminum without hiding the prompt
    subject.
  texture_and_material: >-
    Render Fine lines through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Directional scratch as reusable material rhythm: macro-friendly for texture
    tasks, but able to wrap objects, figures, environments, and props without forcing one sample
    view.
  atmosphere_and_mood: >-
    Keep the mood Modern, clean by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Industrial, tech material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Metal surface; Micro scratches; Fine lines; Anisotropic; Directional scratch
  creative_brief: >-
    Route any subject through Brushed Aluminum as a transferable man-made material visual system
    while preserving the prompt's subject, action, and setting. Render the industrial poetry of
    brushed aluminum where microscopic scratches align into a directional grain that catches light
    anisotropically across a field of silver-grey. The surface should feel cool and precise, a
    choral arrangement of parallel lines marching in disciplined formation. This is the skin of
    precision engineering, the quiet face of contained complexity. Use Brushed Aluminum as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
