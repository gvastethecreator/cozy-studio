visualDna:
  aesthetic: >-
    Mirror Oracle Refraction Archive acts as a transferable mythic-noir router: mirror translated
    into dark symbolic behavior, oracle translated into dark symbolic behavior plus refraction
    translated into dark symbolic behavior fused with symbolist myth-noir iconography with emblem
    logic, relic pressure, occult negative space, and adult editorial restraint; it carries symbol,
    omen, ritual authority, and mature editorial restraint without locking prompt content to its
    sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    mirror shaping silhouette rhythm, contour pressure, and symbolic edge control, oracle shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus refraction shaping
    silhouette rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette
    pressure, emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory
    actor or prop set.
  color_and_tone: >-
    Map color through mirror-weighted accent roles over disciplined dark values, oracle-weighted
    accent roles over disciplined dark values plus refraction-weighted accent roles over disciplined
    dark values together with blackened neutrals, relic gold, ash white, bruised crimson, oxidized
    green, and one disciplined omen accent; values stay separated, accents feel intentional, and the
    dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use refraction glints and mirrored edge ghosts, oracular glow, smoke-veiled highlights, and
    hidden source illumination plus split highlights and prismatic ghost edges with eclipse-like
    falloff, thin halo edges, candle-density glow, and shadow that behaves like symbolic weight;
    shadows must carry omen weight, rims should clarify form, and glow should behave as ritual
    evidence rather than decorative haze.
  texture_and_material: >-
    Render silvered glass, tarnish, and broken reflection, ash, smoke, polished bowl surfaces, and
    old paper plus mirror glass, lens scratches, and fractured shine alongside obsidian polish, ash
    residue, salt-bone grain, tarnished metal, wax, velvet, paper, and carved-stone tactility;
    surface scale, patina, residue, gloss, grain, and carved or sealed edges must remain coherent
    across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with classified archive grids and preserved-fragment spacing, mirror converted into
    repeatable spatial rhythm and symbolic hierarchy plus oracle converted into repeatable spatial
    rhythm and symbolic hierarchy plus icon axes, seal geometry, threshold spacing, processional
    rhythm, and diagram-like symbolic hierarchy; the style should support portraits, objects,
    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through prophecy, secrecy, and official ambiguity plus forbidden knowledge under
    preservation pressure and hushed authority, occult elegance, grief, accusation, secrecy, and a
    sense of ancient systems still operating; the image can become severe, sensual, sacred, violent,
    quiet, or strange when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with mirror recognition with denoised dark editorial polish and controlled material truth
    plus oracle recognition with denoised dark editorial polish and controlled material truth and
    denoised illustrated finish with crisp symbol reads, controlled blacks, no muddy texture paste,
    and no fake lettering; prioritize clean denoise, readable dark values, strong silhouette
    hierarchy, tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy
    black crush.
  key_features: >-
    mirror translated into dark symbolic behavior, oracle translated into dark symbolic behavior
