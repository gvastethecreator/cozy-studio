visualDna:
  aesthetic: Gothic fantasy noir under a crimson moon, mixing medieval alleys, wrought iron, and supernatural fog.
  subject_treatment: >-
    Transform any subject with aristocratic gothic-noir tension, crimson rim halos, wrought-iron contour
    accents, nocturnal elegance, and predatory poise without requiring a fixed persona or scene layout.
  color_and_tone: >-
    Moonlit lavender gray, bruised burgundy, dusty rose highlights, black iron contours, old brick red, and
    one warm lantern core.
  lighting_and_shadow: >-
    Crimson moon backlight forms a clean halo, lantern glow opens the torso, and shadows stay broad instead of
    murky.
  texture_and_material: Wet brick, velvet cloak, moth-wing powder, iron keys, carved balcony stone, and smooth graphic fog.
  camera_and_composition: >-
    Upward balcony framing, large wing silhouette, crescent moon negative space, tiny street masks below, and
    no corridor depth.
  atmosphere_and_mood: Aristocratic, nocturnal, predatory, and gothic-illustrative.
  rendering_and_quality: >-
    Stylized gothic illustration with strong silhouettes, clean dark gradients, defined lines, and controlled
    red accents.
  creative_brief: >-
    Reusable visual system for any subject needing crimson moon symbolism, gothic-noir tension, elegant
    menace, and medieval nocturne atmosphere.
