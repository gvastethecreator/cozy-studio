visualDna:
  aesthetic: >-
    Studio Headshot acts as a transferable photographic style router: begin from High-end
    professional studio headshot lighting grammar, clean corporate polish, controlled realism,
    studio subject hierarchy, controlled portrait optics, believable retouching, and intentional
    backdrop behavior, and portrait and studio photography system built from lens discipline,
    subject hierarchy, controlled retouching, and believable surface detail, then apply the
    photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Tack-sharp focal plane on primary details, precise edge
    definition, natural proportions; preserve prompt identity while using focal priority, flattering
    or deliberately institutional distance, surface realism, and edge control without requiring a
    human face, keeping the original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with True-to-life neutral material tones, balanced color grading, subtle gradients, solid
    seamless grey depth field; grade neutrals, skinlike or material tones, backdrop color, cosmetic
    warmth, and controlled contrast as photographic capture decisions, with value separation and
    white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Studio strobe lighting, softbox illumination, classic butterfly-light pattern, controlled
    specular highlights; make key, fill, rim, catchlight, background falloff, and shadow shape
    visibly drive the style, preserving believable exposure, shadow density, highlight rolloff, and
    source motivation.
  texture_and_material: >-
    Render Hyper-realistic surface texture, fine micro-detail, crisp fabric or material definition;
    retain pores, fabric, hair, props, paper, backdrop sweep, and small surface imperfections at a
    believable photographic scale, avoiding both waxy smoothing and noisy texture overlays that hide
    the prompt content.
  camera_and_composition: >-
    Compose through Shot on 85mm or 105mm portrait lens, flat field of view, undistorted
    perspective, central composition; use portrait lens compression, central authority, intimate
    framing distance, frontal ID geometry, or editorial negative space without forcing one sitter,
    with lens distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Professional, confident, approachable, clean, formal; derive mood from proximity,
    pose pressure, institutional polish, intimacy, ceremony, awkwardness, or studio control, so the
    preset changes interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with 8k resolution, commercial photography polish, flawless retouching, photorealistic;
    finish as real photography with clean optics, plausible retouching, readable focal hierarchy,
    and no painterly or CGI substitution, high-resolution photographic detail, and disciplined
    denoise without losing natural grain where the preset needs it.
  creative_brief: >-
    Apply Studio Headshot as a photographic preset over prompt X: preserve the user's requested
    subject, then route High-end professional studio headshot lighting grammar, clean corporate
    polish, controlled realism, True-to-life neutral material tones, balanced color grading, subtle
    gradients, solid seamless grey depth field, Studio strobe lighting, softbox illumination,
    classic butterfly-light pattern, controlled specular highlights, Hyper-realistic surface
    texture, fine micro-detail, crisp fabric or material definition, and Shot on 85mm or 105mm
    portrait lens, flat field of view, undistorted perspective, central composition through optics,
    exposure, palette, surface response, timing, and finish without requiring the card image's
    original subject.
  key_features: >-
    High-end professional studio headshot lighting grammar, clean corporate polish, controlled
    realism; studio subject hierarchy, controlled portrait optics, believable retouching, and
    intentional backdrop behavior; True-to-life neutral material tones, balanced color grading,
    subtle gradients, solid seamless grey depth field; Studio strobe lighting, softbox illumination,
    classic butterfly-light pattern, controlled specular highlights; Shot on 85mm or 105mm portrait
    lens, flat field of view, undistorted perspective, central composition
