visualDna:
  aesthetic: >-
    Graphite-led tonal drawing builds volume through pencil pressure and stroke direction, with
    limited color accents subordinate to the drawing.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Use clean exploratory contours without
    ghosted duplicate silhouettes or changes to the subject.
  color_and_tone: >-
    Maintain a broad graphite value range and keep color accents subordinate within the requested
    palette. Do not prescribe an accent hue or remove colors the user requested.
  lighting_and_shadow: >-
    Follow the requested lighting and shadows through pencil pressure and tonal grouping. Do not add
    a new light source or alter the existing value direction.
  texture_and_material: >-
    Let the drawing support show through in light areas and around pencil marks without forcing an
    off-white backdrop or changing represented materials.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not convert the image
    into a sketch sheet or add an annotation layout unless requested.
  atmosphere_and_mood: >-
    Keep the requested mood. Graphite marks do not add notes, labels, a classroom or a concept-art
    presentation.
  rendering_and_quality: >-
    Group graphite values clearly, retain a clean primary contour and place color accents selectively.
    Avoid construction ghosts and annotations not present in the request.
avoidRules:
  - ghosted duplicate contours
  - unrequested sketch annotations
