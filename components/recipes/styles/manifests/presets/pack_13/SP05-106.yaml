visualDna:
  aesthetic: >-
    Use fan-like geometry, ruler-straight lines and faceted color cells to articulate existing
    forms; preserve their natural asymmetry rather than staging symmetry.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: separate a compact set of jewel
    colors into clean cells while keeping prompt-specific colors.
  lighting_and_shadow: >-
    Use crisp value bands and small facet highlights; follow the actual light direction.
  texture_and_material: >-
    Keep edges clean and geometric with selective stained-glass-like separation; do not convert
    materials to glass.
  camera_and_composition: >-
    Fit geometric accents to the supplied composition without adding a frame or changing viewpoint.
  atmosphere_and_mood: >-
    Deco poise comes from measured line and facet balance; keep the user's mood and subject.
  rendering_and_quality: >-
    Use geometric organization on any subject without adding architecture, ornament, costume or a
    symmetrical poster layout. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Geometric fan shapes; ruler-straight contour; faceted focal areas; jewel-color cells; asymmetry
    preserved.
  creative_brief: "Apply this visual treatment to the requested content: Geometric fan shapes; ruler-straight contour; faceted focal areas; jewel-color cells; asymmetry preserved. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - ruler lines misaligned with source perspective
  - facets obscuring the original silhouette
  - forced symmetry changing the requested composition
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-106.webp
attributes:
