visualDna:
  aesthetic: 'An intentionally unfinished concept drawing combines visible construction lines, loose contour passes, and sparse action-tracing marks over restrained flat color.'
  subject_treatment: 'Preserve subject, pose, action, and count; rough guide strokes and brief contour replays may track the same silhouette but do not create a second pose or figure.'
  color_and_tone: 'Use mostly open linework and quiet fill with a limited marker-like accent; retain user colors and avoid decorative bursts.'
  lighting_and_shadow: 'Keep lighting simple and diagrammatic, following the prompt; define form with line and a few shadow planes rather than polished glow.'
  texture_and_material: 'Show pencil or ink stroke grain, unfinished edge variation, and sparse hatching; keep depicted materials readable.'
  camera_and_composition: 'Maintain the requested main crop, viewpoint, scale, and count; keep study marks within the same frame and tied to the same forms and prompted action.'
  atmosphere_and_mood: "Preserve the supplied mood; an ideation surface does not change the action's energy or emotional tone."
  rendering_and_quality: 'Leave guide marks visible where they trace the same forms; keep the underlying silhouette clear and avoid lettering, interface marks, or watermarks.'
  key_features: 'Visible construction lines; contour replays on the same forms; sparse gesture ticks tied to requested motion; restrained flat color; unfinished edges.'
  creative_brief: 'Keep concept-stage linework visible around the same clear drawing; guide strokes trace prompted forms and motion only. Preserve subject, action, count, main camera, and mood; add no scene or words.'
avoidRules:
  - realistic
  - 3d render
  - photo
  - live action
  - western comic
  - ugly
  - bad anatomy
  - low quality
  - jpeg artifacts
  - watermark
  - signature
  - generic moe wallpaper
  - infantilized styling
  - school only lock
  - canon character copy
  - title scene copy
  - literal sample card setup
  - fixed anime cast
  - generic anime filter
  - prompt literal card reuse
  - fake UI
