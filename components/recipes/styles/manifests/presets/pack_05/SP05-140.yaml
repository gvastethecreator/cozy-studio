visualDna:
  aesthetic: 'Quiet fantasy anime: fine exact outlines, pale matte color, and magic drawn as thin concentric rings and polygons of light, precise and unhurried.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Pale cyan, parchment, lavender-grey and soft sage, with restrained cool shadow.
  lighting_and_shadow: Soft diffuse daylight, gentle value transitions, a few clean bright edges on the rings.
  texture_and_material: Smooth matte color, fine line detail and very little grain.
  camera_and_composition: Keep the requested framing; open spacing with generous sky or floor around precise focal geometry.
  atmosphere_and_mood: Understated authority and reflective calm, power shown without strain or noise.
  rendering_and_quality: Exact contours and a quiet palette, geometry lines thin and legible with no glyphs.
  key_features: concentric geometric light rings; pale cyan and parchment; fine exact outline; open quiet spacing; soft diffuse light
  creative_brief: "Quiet fantasy anime: fine exact outlines, pale matte color, and magic drawn as thin concentric rings and polygons of light, precise and unhurried. Carry it through concentric geometric light rings, pale cyan and parchment, fine exact outline, open quiet spacing, soft diffuse light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
