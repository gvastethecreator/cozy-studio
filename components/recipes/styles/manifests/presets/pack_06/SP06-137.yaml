visualDna:
  aesthetic: 'Pen-plotter drawing: vector paths drawn on paper by a machine holding a real pen, with tone from perfectly regular computed hatch and contour-line fills.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: One or two fineliner colors on white or colored paper, tone from hatch spacing and angle.
  lighting_and_shadow: Shading as layered straight or contour-following hatches, spacing tightening into shadow.
  texture_and_material: Real ink line on paper with tiny pen-start blobs, perfectly parallel machine lines, slight paper bleed.
  camera_and_composition: Keep the requested framing; the subject drawn in outline with computed hatch regions.
  atmosphere_and_mood: Precise, meditative and technical, a machine with a steady hand.
  rendering_and_quality: Mechanically regular line spacing with real ink behavior; no hand wobble, no filled solids, no gradients.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pen-Plotter Hatch Drawing as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: machine-regular hatching; contour-line fills; real fineliner ink on paper; pen-start dots; one or two pen colors
