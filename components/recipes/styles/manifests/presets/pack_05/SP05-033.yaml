visualDna:
  aesthetic: >-
    Build the graphic anime treatment from scratchy high-weight contours with broken, jagged ends
    and lopsided organic forms and sharp poster-like cutouts. Let uneven bursts, abrupt stops, and
    elastic recoil marks set its rhythm; use saturated red against black and warm paper, with one
    cool accent for color and graphic ink spatters, halftone breaks, and coarse screen texture for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use scratchy high-weight contours with broken,
    jagged ends for edge work, lopsided organic forms and sharp poster-like cutouts for form
    simplification, and uneven bursts, abrupt stops, and elastic recoil marks only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with saturated red against black and warm paper, with one cool accent.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: flat high-contrast blocks with only a few white cuts. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with graphic ink spatters, halftone breaks, and coarse screen
    texture, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use dense poster balance around an off-center focal
    mass, with clean outer margins to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey unruly comedy and sudden visual surprise, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with rough printed marks, bold flat shapes, and a clear poster rhythm; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    scratchy high-weight contours with broken, jagged ends; lopsided organic forms and sharp
    poster-like cutouts; saturated red against black and warm paper, with one cool accent; uneven
    bursts, abrupt stops, and elastic recoil marks; graphic ink spatters, halftone breaks, and
    coarse screen texture; dense poster balance around an off-center focal mass, with clean outer
    margins.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with scratchy high-weight
    contours with broken, jagged ends, lopsided organic forms and sharp poster-like cutouts, and
    saturated red against black and warm paper, with one cool accent; use uneven bursts, abrupt
    stops, and elastic recoil marks only where movement is already present, and apply graphic ink
    spatters, halftone breaks, and coarse screen texture as the drawing finish.
