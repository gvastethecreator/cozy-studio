visualDna:
  aesthetic: >-
    Map value into white-hot through red/amber to blue false-color bands with restrained bloom and
    sparse edge calibration ticks; this is a visual mapping, not factual temperature.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use the thermal false-color ramp
    while preserving shape boundaries and prompt-critical identifiers.
  lighting_and_shadow: >-
    Let bloom cluster around the brightest mapped areas; calibration marks stay thin and peripheral.
  texture_and_material: >-
    Keep the color bands clean, with slight sensor grain only; do not add emissive light to the
    depicted materials.
  camera_and_composition: >-
    Preserve the original framing and form boundaries; do not imply a scanner or interface.
  atmosphere_and_mood: >-
    The false-color image reads as a stylized signal; do not assert heat, health or material
    properties.
  rendering_and_quality: >-
    Apply the mapping to any subject without adding a HUD, scanner, labels or temperature claim.
    Keep important silhouettes and joins legible; no watermark, unrequested text or interface.
  key_features: >-
    White-hot to blue bands; ironbow false color; restrained heat bloom; sparse calibration ticks;
    clear segmentation.
  creative_brief: 'Apply this visual treatment to the requested content: White-hot to blue bands; ironbow false color; restrained heat bloom; sparse calibration ticks; clear segmentation. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - thermal bands collapsing into indistinguishable values
  - bloom obscuring signal segmentation
  - unrequested HUD, labels or temperature claims
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-120.webp
