visualDna:
  aesthetic: 'Lighting scenario pass: the same fixed view painted four times under different light, like a lighting artist testing times of day and weather.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a two-by-two grid of the identical composition in which only light and weather change, and that layout replaces the requested framing.
  color_and_tone: 'Each panel a different temperature story: cool dawn mist, harsh neutral noon, red dusk, torchlit or moonlit night.'
  lighting_and_shadow: Shadow direction, length and hardness change consistently per panel while the geometry stays identical.
  texture_and_material: Loose painterly surfaces kept the same in every panel so only the light response differs.
  camera_and_composition: Two-by-two grid of identical framing, same horizon and camera, with thin gutters between panels.
  atmosphere_and_mood: Comparative and atmospheric, one place with four moods.
  rendering_and_quality: Medium-finish paintings of equal detail; the contrast between panels is the whole point.
  key_features: two-by-two grid; identical composition; four times of day or weather; consistent shadow logic; equal finish
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Lighting Scenario Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
