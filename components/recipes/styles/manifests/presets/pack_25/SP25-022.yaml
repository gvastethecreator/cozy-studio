visualDna:
  aesthetic: 'Inset Stencil Solids: solid icon masses cut with wide inner voids and deliberate bridges that keep every symbol in one piece.'
  subject_treatment: Build the prompt's subject or requested actions as solid masses with wide bridges and inner cutouts that explain body and action.
  color_and_tone: Binary contrast, the cutouts belonging to the real background of each icon.
  lighting_and_shadow: Flat solid shapes, with every bridge present in the geometry itself.
  texture_and_material: Smooth surfaces and frank clean cuts, crisp and freshly machined.
  camera_and_composition: Main mass centered, voids protected near narrow edges, equal boxes.
  atmosphere_and_mood: Solid and decisive, with a few big cutouts instead of decorative detail.
  rendering_and_quality: Every inner island is intentionally bridged or intentionally separate.
  creative_brief: "Inset Stencil Solids: solid icon masses cut with wide inner voids and deliberate bridges that keep every symbol in one piece. Carry it through solid masses, wide bridges, inner cutouts, binary contrast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: solid masses; wide bridges; inner cutouts; binary contrast
