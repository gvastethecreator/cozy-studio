visualDna:
  aesthetic: 'Anatomy reference plate: the subject shown as layered écorché studies, surface, muscle and skeleton, like a hand-colored medical engraving.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a classical anatomy plate with skin, muscle and skeleton layers side by side, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Sepia line on aged cream paper, muscles in muted madder red, tendons ivory, bone warm white.
  lighting_and_shadow: Soft consistent top-left light modeling each layer with fine hatching.
  texture_and_material: Engraved fiber-direction lines in muscle, stippled bone, crisp tendon edges and paper foxing.
  camera_and_composition: Two or three matching views side by side at one scale, with small sectional insets and blank leader lines.
  atmosphere_and_mood: Scholarly and exact, the body opened for study.
  rendering_and_quality: Accurate layered anatomy with consistent proportion across layers; no gore beyond the dissection.
  key_features: surface, muscle and skeleton layers; madder red muscle; sepia engraving line; sectional insets; blank leader lines
  creative_brief: "Anatomy reference plate: the subject shown as layered écorché studies, surface, muscle and skeleton, like a hand-colored medical engraving. Carry it through surface, muscle and skeleton layers, madder red muscle, sepia engraving line, sectional insets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
