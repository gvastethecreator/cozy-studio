visualDna:
  aesthetic: 'Engineering blueprint sheet: white drafted lines on Prussian blue diazo paper, the subject shown in plan, side elevation and section.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a drafting sheet of plan, elevation and section views with dimension lines and an empty title block, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Deep Prussian blue ground, crisp white line work, a faint lighter blue grid, no other colors.
  lighting_and_shadow: No light or shading at all; sections use white diagonal hatching to mark cut material.
  texture_and_material: Hard uniform technical-pen lines in several weights, slight paper fold marks and a faint grid.
  camera_and_composition: Orthographic views aligned on projection lines, dimension lines with blank value gaps, an empty title block in the corner.
  atmosphere_and_mood: Exact and engineered, a thing ready to be built.
  rendering_and_quality: Flat drafted line drawing with no perspective, no 3D shading and no fake measurement text.
  key_features: white lines on Prussian blue; plan, elevation and section; hatched cut material; blank dimension gaps; empty title block
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Blueprint Schematic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
