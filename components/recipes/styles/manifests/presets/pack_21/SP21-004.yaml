visualDna:
  aesthetic: Shallow relief-print illustration using restrained raised or impressed marks on a continuous support.
  subject_treatment:
    Translate important contours and value boundaries into a readable relief drawing of the requested
    subject. Do not replace the depicted subject with a carved object.
  color_and_tone:
    Keep support and impression within the requested palette. Use small tonal differences and optional
    supplied accent color instead of inventing text or ornament.
  lighting_and_shadow:
    Use a consistent grazing light on the image support to reveal shallow depth while preserving
    the represented scene and its requested content.
  texture_and_material:
    Show slight compression around selected impressed edges and a smooth matte support. Keep
    depth small and consistent.
  camera_and_composition:
    Preserve the requested composition and viewpoint within the illustration. Do not tilt
    the entire image into a product mockup unless requested.
  atmosphere_and_mood:
    Respect the user mood; subtle relief is a material image-making technique, not a mandatory
    luxury invitation theme.
  rendering_and_quality:
    Keep relief marks legible and physical depth restrained. Avoid deep extrusions, conflicting
    support shadows or fake embossed typography.
avoidRules:
  - deep extrusions
  - unrequested typography
  - conflicting relief shadows
