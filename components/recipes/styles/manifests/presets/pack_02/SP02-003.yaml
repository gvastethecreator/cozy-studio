visualDna:
  aesthetic: '80s practical sci-fi cinema: smoke-filled sets, backlit haze and glowing practical lights, shot on 35 mm anamorphic with streaking lens flares.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Deep blue-black with electric magenta, cyan and sodium-orange practicals; skin in mixed colored light.
  lighting_and_shadow: Strong backlight through smoke, spinning fans and searchlights casting moving shafts, faces lit by small practicals.
  texture_and_material: Dense haze, steam, grimy industrial surfaces, cables and practical model detail.
  camera_and_composition: Anamorphic widescreen feel with horizontal blue flares, slow push-ins, figures silhouetted against haze.
  atmosphere_and_mood: Brooding and dystopian, a heavy night that never seems to end.
  rendering_and_quality: Practical-effects cinema with film grain; no clean CGI and no franchise designs.
  key_features: backlit smoke; anamorphic blue flares; neon and sodium practicals; spinning fan shafts; grimy industrial sets
  creative_brief: "80s practical sci-fi cinema: smoke-filled sets, backlit haze and glowing practical lights, shot on 35 mm anamorphic with streaking lens flares. Carry it through backlit smoke, anamorphic blue flares, neon and sodium practicals, spinning fan shafts, grimy industrial sets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
