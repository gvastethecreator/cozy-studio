visualDna:
  aesthetic: 'In-game screenshot look informed by Rocket League gameplay: car-soccer gameplay capture with arena ball, boost trails, goal geometry, team colors, and high-energy chase camera. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Rocket League-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Rocket League-informed palette: cobalt blue, orange team glow, green field, black tire
    rubber, white ball panels, and neon arena trim. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through stadium lights, boost flames, goal explosions, wet arena reflections,
    and glossy car highlights. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from car paint, turf, glass boards, boost pads, ball panels, arena rails, and
    particle trails. Materials should feel like in-engine game assets captured during play, with
    enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with third-person car camera with ball focus, goal depth, boost route,
    teammates/opponents, and field geometry readability. The frame should read as a plausible
    gameplay capture; include UI/HUD only when it matches the source game's visual logic and
    improves clarity.
  atmosphere_and_mood: 'Rocket League-derived mood: competitive, sporty, explosive, glossy, and playful; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: scoreboard, timer, boost
    meter, ball cam indicator, and team markers are coherent and useful. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Rocket League gameplay screenshots; car-soccer gameplay capture with arena ball, boost trails,
    goal geometry, team colors, and high-energy chase camera; cobalt blue, orange team glow, green
    field, black tire rubber, white ball panels, and neon arena trim; stadium lights, boost flames,
    goal explosions, wet arena reflections, and glossy car highlights; car paint, turf, glass
    boards, boost pads, ball panels, arena rails, and particle trails; third-person car camera with
    ball focus, goal depth, boost route, teammates/opponents, and field geometry readability;
    competitive, sporty, explosive, glossy, and playful; HUD guidance: scoreboard, timer, boost
    meter, ball cam indicator, and team markers are coherent and useful
  creative_brief: "Rocket League Cobalt Docks: in-game screenshot language informed by Rocket League, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
