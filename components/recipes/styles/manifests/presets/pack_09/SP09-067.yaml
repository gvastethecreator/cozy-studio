visualDna:
  aesthetic: 'Powder snow: fine snow dusting the target and drifting around it.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: fine powder snow dusts the target and drifts in the air around it.'
  color_and_tone: White snow with cool blue shadows, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Soft cold light, so the effect lights the target and casts believable local light.
  texture_and_material: Fine powder snow and flakes, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Quiet, cold, soft and serene, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: powder snow dusting; drifting flakes; contained around the target
  creative_brief: "Powder snow: fine snow dusting the target and drifting around it. Carry it through powder snow dusting, drifting flakes, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
