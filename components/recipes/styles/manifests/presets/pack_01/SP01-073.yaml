visualDna:
  aesthetic: 'Long-exposure water modifier: a slow shutter of one to thirty seconds that turns any moving water in the scene into silk, mist or glass.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Cool blues and greys, soft pastel highlights, natural color elsewhere.
  lighting_and_shadow: Overcast or low light allowing long exposure; no hard sun glare.
  texture_and_material: Moving water smoothed to veils and mist; still stone, wood and metal kept sharp and textured.
  camera_and_composition: Keep the requested framing; the camera is tripod-still, so only moving water changes.
  atmosphere_and_mood: Calm and timeless, motion softened into quiet flow.
  rendering_and_quality: Clean long-exposure look; applies to fountains, mills and rivers, not only seascapes.
  key_features: silky moving water; sharp still surroundings; tripod stillness; cool overcast tones; misted flow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Long Exposure (Water) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
