  aesthetic: 'Alex Steinweiss Columbia album cover look of the 1940s: the first illustrated record covers, flat graphic shapes of instruments, curly hand-lettered titles and bright poster color.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; turn the subject into a flat graphic poster motif built from simple instrument-like shapes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright poster red, mustard, teal and cream, true to the Alex Steinweiss palette.
  lighting_and_shadow: Flat printed poster light, lit the way Alex Steinweiss lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Flat frontal square sleeve with a bold central motif.
  atmosphere_and_mood: Keep the requested mood with jaunty early optimism.
  rendering_and_quality: Faithful forties illustrated album cover design, in the recognizable hand of Alex Steinweiss.
  creative_brief: "Alex Steinweiss Columbia album cover look of the 1940s: the first illustrated record covers, flat graphic shapes of instruments, curly hand-lettered titles and bright poster color. Carry it through Steinweiss flat shapes, curly hand lettering, poster color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
