  aesthetic: 'Kim Jung Gi drawing look: virtuoso freehand brush-pen ink with no pencils, dense crowds of characters, impossible perspective, vehicles and animals flowing together.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; design characters as confident freehand ink figures crowded together at many scales and angles. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black brush-pen ink on white paper, true to the Kim Jung Gi palette.
  lighting_and_shadow: Light implied by ink density and white paper.
  texture_and_material: Confident brush-pen strokes and loose hatching, with the surface finish of Kim Jung Gi.
  camera_and_composition: Wide-angle dense compositions of many figures, framed the way Kim Jung Gi composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with virtuoso bustling energy.
  rendering_and_quality: Virtuoso freehand ink drawing, in the recognizable hand of Kim Jung Gi.
  creative_brief: "Kim Jung Gi drawing look: virtuoso freehand brush-pen ink with no pencils, dense crowds of characters, impossible perspective, vehicles and animals flowing together. Carry it through Kim Jung Gi freehand, dense crowds, wide-angle, brush pen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Kim Jung Gi freehand; dense crowds; wide-angle; brush pen
