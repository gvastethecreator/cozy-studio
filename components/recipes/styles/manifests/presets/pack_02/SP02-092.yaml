visualDna:
  aesthetic: 'Crumpled-paper scribble: a pencil and ink drawing on paper that was crushed into a ball and flattened again, the creases cutting through the art.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Off-white and yellowed paper, graphite grey, blue ballpoint, a coffee-brown stain.
  lighting_and_shadow: Low side light raking across the creases so every fold casts a tiny shadow.
  texture_and_material: Sharp crease network, broken lines where ink skipped over folds, abraded fibers.
  camera_and_composition: Paper seen flat, filling the frame, the drawing warped slightly by the folds.
  atmosphere_and_mood: Wistful and rescued, a thrown-away idea given a second chance.
  rendering_and_quality: Real crumpled-paper surface with light across the folds; not a texture overlay.
  key_features: crease network through the drawing; raking side light; skipped ink over folds; yellowed paper; coffee stain
  creative_brief: "Crumpled-paper scribble: a pencil and ink drawing on paper that was crushed into a ball and flattened again, the creases cutting through the art. Carry it through crease network through the drawing, raking side light, skipped ink over folds, yellowed paper, coffee stain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
