  aesthetic: 'A-1 Pictures and TROYCA Aldnoah.Zero look (2014): orbital knights in ornate gold-and-ivory mechs, dramatic Hiroyuki Sawano-style operatic scale, and grounded soldiers beneath.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with sleek modern designs, aristocratic knights in capes and grounded soldiers in plain uniforms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Ivory, gold, royal crimson and cold orbital blue.
  lighting_and_shadow: Bright beam flashes, harsh orbital sunlight and glowing crests on armor.
  texture_and_material: Clean cel characters with CG mechs and painted skies.
  camera_and_composition: Heroic wides of towering mechs and ground-level soldiers.
  atmosphere_and_mood: Keep the requested mood with operatic orbital grandeur.
  rendering_and_quality: Polished operatic mecha frame with ornate gold detail.
  key_features: Aldnoah orbital knights; gold ivory mechs; beam opera; soldiers below
  creative_brief: "A-1 Pictures and TROYCA Aldnoah.Zero look (2014): orbital knights in ornate gold-and-ivory mechs, dramatic Hiroyuki Sawano-style operatic scale, and grounded soldiers beneath. Carry it through Aldnoah orbital knights, gold ivory mechs, beam opera, soldiers below. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
