visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Dead Space gameplay screenshots: third-person
    survival-horror capture with industrial ship corridors, tram stations, diegetic suit HUD, and
    dismemberment-combat tension. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Dead Space-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Dead Space-informed palette: black metal, sickly green, medical blue, blood red, rust
    orange, and cold white work lights. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through flickering ship lights, stasis blue, muzzle cutter beams, alarm red, and
    deep vent shadows. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from grated floors, ribbed walls, suit armor, necrotic flesh, cables, tram rails,
    and dirty sci-fi machinery. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with over-shoulder tight corridor framing with weapon aiming beam, enemy limbs, door
    paths, and diegetic objective lines. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Dead Space-derived mood: claustrophobic, industrial, grotesque, and panic-controlled.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: diegetic spine health, ammo
    projection, stasis meter, and holographic inventory cues are core to the style. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Dead Space gameplay screenshots; third-person survival-horror capture with industrial ship
    corridors, tram stations, diegetic suit HUD, and dismemberment-combat tension; black metal,
    sickly green, medical blue, blood red, rust orange, and cold white work lights; flickering ship
    lights, stasis blue, muzzle cutter beams, alarm red, and deep vent shadows; grated floors,
    ribbed walls, suit armor, necrotic flesh, cables, tram rails, and dirty sci-fi machinery;
    over-shoulder tight corridor framing with weapon aiming beam, enemy limbs, door paths, and
    diegetic objective lines; claustrophobic, industrial, grotesque, and panic-controlled; HUD
    guidance: diegetic spine health, ammo projection, stasis meter, and holographic inventory cues
    are core to the style
  creative_brief: >-
    Use Dead Space Abyss Rail Transit as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Dead Space: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
