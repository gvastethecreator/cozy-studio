visualDna:
  aesthetic: 'Bioluminescent forest environment render: a night forest lit only by its own glowing fungi, moss veins and drifting spores, with emissive networks tracing roots and branches.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies a nocturnal forest of self-lit flora: glowing fungi, luminous moss and drifting spores; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Deep indigo night, cyan and teal glow with small violet and lime accents; glow sits in organic dots and veins, never a uniform wash.
  lighting_and_shadow: Emissive plants light their surroundings in soft falloff pools; unlit trunks read as dark silhouettes, and spores catch light as tiny halos.
  texture_and_material: Translucent fungal caps with subsurface glow, damp bark, beaded moss and spore particles suspended in thin ground mist.
  camera_and_composition: Keep the requested camera; foreground glowing plants frame darker middle ground so the subject reads against lit pockets.
  atmosphere_and_mood: Hushed and reverent, a living forest breathing light in the dark.
  rendering_and_quality: Emissive shaders driving real bounce light, soft volumetric mist and small bloom; original flora, no film-world creatures.
  key_features: plants as the only light; cyan glow veins; spore halos; translucent fungal caps; ground mist pockets
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bioluminescent Forest as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
