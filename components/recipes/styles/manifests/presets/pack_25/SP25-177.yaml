visualDna:
  aesthetic: 'Responsive Campaign Grid: one campaign adapted to wide, square and tall formats, keeping hierarchy and anchors by reorganizing rather than cropping.'
  subject_treatment: Adapt the prompt's campaign to wide, square and tall formats side by side, reorganizing title, image and action with every word exact.
  color_and_tone: The same color roles and exact text in every format.
  lighting_and_shadow: Consistent image and lighting conditions across all three of the formats.
  texture_and_material: Source artwork and materials kept, with no new images to fill gaps.
  camera_and_composition: Title, image and action zones that reflow within declared margins.
  atmosphere_and_mood: Campaign continuity and instant reading across every format.
  rendering_and_quality: No format loses copy, brand or the required action.
  creative_brief: "Responsive Campaign Grid: one campaign adapted to wide, square and tall formats, keeping hierarchy and anchors by reorganizing rather than cropping. Carry it through three formats, reflowed zones, same hierarchy, exact copy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three formats; reflowed zones; same hierarchy; exact copy
