visualDna:
  aesthetic: 'Newspaper halftone: a photograph screened into a coarse grid of black dots and printed at speed on cheap newsprint.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Black ink on greyish-yellow newsprint, compressed tonal range, muddy blacks and grey whites.
  lighting_and_shadow: 'Photographic light flattened by the screen: dots merge into solids in the shadows and vanish in the highlights.'
  texture_and_material: Visible round dots at a coarse 65 to 85 line screen, ink spread and slur, show-through from the reverse side, yellowed fibrous paper.
  camera_and_composition: Keep the requested framing as a news photograph; no headline, column layout or readable caption.
  atmosphere_and_mood: Urgent, documentary and yesterday, a report from the morning edition.
  rendering_and_quality: Clearly visible dot grid, dot gain in the darks, slight blur from fast printing; no color and no clean digital sharpness.
  key_features: coarse visible halftone dots; dot gain in darks; yellowed newsprint; show-through from reverse; compressed tonal range
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Halftone (Newspaper) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
