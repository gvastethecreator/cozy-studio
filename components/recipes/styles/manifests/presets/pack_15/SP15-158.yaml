visualDna:
  aesthetic: 'Floodpunk: drowned cities rebuilt above the waterline on stilts, rafts and rooftop bridges, with boats as streets and old towers as islands.'
  subject_treatment: Keep the prompt's subject and setting; raise water around it and rebuild life on stilts, rafts and rope bridges above the flood.
  color_and_tone: Murky green-blue water, weathered wood and rust with bright laundry and boat colors.
  lighting_and_shadow: Hazy humid daylight and rippling water reflections on everything.
  texture_and_material: Stilts, lashed timber, patched tarps, sagging rope bridges and algae-stained concrete below.
  camera_and_composition: Waterline views with drowned streets below and life stacked above.
  atmosphere_and_mood: Resilient and melancholic, a city that refused to leave when the sea came in.
  rendering_and_quality: Detailed illustration with convincing water reflections and layered structures.
  creative_brief: "Floodpunk: drowned cities rebuilt above the waterline on stilts, rafts and rooftop bridges, with boats as streets and old towers as islands. Carry it through stilts, drowned streets, rooftop bridges, boats as streets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stilts; drowned streets; rooftop bridges; boats as streets
