visualDna:
  aesthetic: >-
    Surrealism (Dali) becomes a transferable surreal symbolic transformation system: start from
    Melting clocks style, Impossible liquefaction, and Melting, elongated, then route prompt content
    through impossible logic, dream scale, symbolic displacement, liminal staging, and psychic
    texture without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Realistic rendering to bend, displace, fuse,
    haunt, miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene;
    preserve anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Warm uncanny neutrals; use color as emotional unreliability, nostalgic
    drift, uncanny contrast, or symbolic temperature, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Long shadows drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Smooth oil as the tactile or mark-making basis; surfaces should support the illusion with
    believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Melting, elongated as reusable spatial grammar: favor symbolic focal points,
    scale mismatch, empty thresholds, doubled images, and psychologically charged negative space,
    adapting cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Dreamlike, weird as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Fine art, bizarre: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Melting clocks style; Realistic rendering; Warm uncanny neutrals; Long shadows; Smooth oil;
    Melting, elongated; Dreamlike, weird; Fine art, bizarre; Impossible liquefaction
  creative_brief: >-
    Route any subject through Surrealism (Dali) as a transferable surreal or dream-logic visual
    system: preserve prompt intent while converting scale, causality, symbolism, edge behavior,
    mood, and spatial contradiction through this preset. Apply Dali-like surreal logic to the input
    with precise oil-rendered forms, long-shadow stillness, warm uncanny neutrals, liquefied edges,
    elongated proportions, and rational detail serving irrational transformation. If clocks,
    branches, horizons, or architecture already exist, bend them; otherwise melt and stretch the
    subject without forcing a desert setting.
avoidRules:
