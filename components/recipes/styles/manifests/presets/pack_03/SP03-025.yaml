visualDna:
  aesthetic: 'Kitbash construction: the subject assembled from recognizable borrowed machine parts — engine blocks, pipe runs, hydraulic rams, vent grilles and hatch plates — packed along its silhouette.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Mostly neutral greys and gunmetal, broken by one or two painted part colors such as hazard orange or faded military green.
  lighting_and_shadow: Hard key raking across the surface so every greeble casts a small shadow, with ambient occlusion darkening the gaps between parts.
  texture_and_material: Detail graded from large structural blocks to mid-size pipes to tiny bolts and vents, with smooth rest panels between the clusters.
  camera_and_composition: Keep the requested view; a low angle or long lens exaggerates the mass, and one quiet area gives the eye somewhere to rest.
  atmosphere_and_mood: Heavy, industrial and endlessly explorable, a machine built from a scrapyard of other machines.
  rendering_and_quality: Crisp edges and clean occlusion; parts follow the form lines of the subject instead of scattering randomly across it.
  key_features: borrowed machine parts; large-medium-small detail hierarchy; raking hard key; occlusion in part gaps; quiet rest panels
  creative_brief: "Kitbash construction: the subject assembled from recognizable borrowed machine parts — engine blocks, pipe runs, hydraulic rams, vent grilles and hatch plates — packed along its silhouette. Carry it through borrowed machine parts, large-medium-small detail hierarchy, raking hard key, occlusion in part gaps, quiet rest panels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
