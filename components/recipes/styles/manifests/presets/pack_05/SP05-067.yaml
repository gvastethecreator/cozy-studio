visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around deep teal value layers
    with small translucent edge glazes and low-contrast pore marks on existing forms. For color and surface, keep source colors while deepening compatible
    shadows toward blue-green and reserving pale cyan for restrained accents. Depth and
    cost may feel solemn or calm according to the prompt, with no required monster or
    peril
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through deep teal value layers with small
    translucent edge glazes and low-contrast pore marks on existing forms; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep source colors while
    deepening compatible shadows toward blue-green and reserving pale cyan for
    restrained accents. Keep values legible across the prompted light and dark range; do
    not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use dim internal-looking color
    only as a treatment of existing surfaces; do not add a cave, glow source, or
    creature. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine soft damp-looking patina with fine
    mineral grain only where the material can plausibly accept it. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; hold the
    prompt's crop and number of forms; use layered value falloff to separate depth
    without making an abyssal setting. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Depth and cost may feel solemn or calm
    according to the prompt, with no required monster or peril. Darkness and tension are
    optional tonal pressure, never a requirement to add danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and deep teal value layers with small
    translucent edge glazes and low-contrast pore marks on existing forms; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    deep teal value layers with small translucent edge glazes and low-contrast pore
    marks on existing forms; keep source colors while deepening compatible shadows
    toward blue-green and reserving pale cyan for restrained accents; use dim
    internal-looking color only as a treatment of existing surfaces; do not add a cave,
    glow source, or creature; combine soft damp-looking patina with fine mineral grain
    only where the material can plausibly accept it; and hold the prompt's crop and
    number of forms; use layered value falloff to separate depth without making an
    abyssal setting. The five cues should read as one mark-and-value system, not as
    extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use deep teal value layers with small
    translucent edge glazes and low-contrast pore marks on existing forms, keep source
    colors while deepening compatible shadows toward blue-green and reserving pale cyan
    for restrained accents, use dim internal-looking color only as a treatment of
    existing surfaces; do not add a cave, glow source, or creature, and combine soft
    damp-looking patina with fine mineral grain only where the material can plausibly
    accept it; the prompt supplies all scene content. Do not add unrequested characters,
    objects, source-specific lore, readable symbols, or a default action.
