visualDna:
  aesthetic: 'Raised burnished gilding: gold leaf laid over raised gesso and polished to a mirror, catching real light in halos, crowns and sunbursts that stand up from the page.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; pick out the key glowing parts of the subject in raised polished gold.
  color_and_tone: Brilliant mirror gold against deep blue, rose and green pigment.
  lighting_and_shadow: Gold catches real highlights and dark reflections as the surface turns.
  texture_and_material: Raised gesso cushions, polished leaf, tooled dots and fine cracks.
  camera_and_composition: Slightly raking view that reveals the relief of the gold.
  atmosphere_and_mood: Keep the requested mood with dazzling precious light.
  rendering_and_quality: Convincing reflective gold with visible raised edges, kept consistent across the whole image.
  creative_brief: "Raised burnished gilding: gold leaf laid over raised gesso and polished to a mirror, catching real light in halos, crowns and sunbursts that stand up from the page. Carry it through raised gesso, mirror gold, tooled dots, raking light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: raised gesso; mirror gold; tooled dots; raking light
