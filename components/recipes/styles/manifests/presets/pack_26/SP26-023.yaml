  aesthetic: 'Saul Bass film poster look: bold cut-paper shapes, fragmented silhouettes, two or three flat colors, jagged hand-cut edges and one powerful symbolic image.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; reduce the subject to a bold cut-paper silhouette or symbol with jagged hand-cut edges. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Two or three flat colors, often orange, black and white.
  lighting_and_shadow: No modeled light, only flat cut shapes, lit the way Saul Bass lights its scenes.
  texture_and_material: Cut paper with slightly rough hand-cut edges, with the surface finish of Saul Bass.
  camera_and_composition: One central symbolic image with strong negative space and a title band.
  atmosphere_and_mood: Keep the requested mood with tense graphic intrigue.
  rendering_and_quality: Bold minimal cut-paper poster design, in the recognizable hand of Saul Bass.
