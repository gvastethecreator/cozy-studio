    charged shadow plus intelligence-weighted rim behavior, occult glow, and charged shadow with
    longnight rim light, cold sky breaks, forge glow, ice reflection, funeral ember, and hard
    northern silhouette cuts; shadows must carry omen weight, rims should clarify form, and glow
    should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
