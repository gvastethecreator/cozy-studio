visualDna:
  aesthetic: 'Mammoth plate landscape: 1870s survey photographs on enormous glass negatives, extraordinarily detailed, with skies burned to blank white by blue-sensitive emulsion.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Warm brown albumen tones, detailed land, featureless white sky.
  lighting_and_shadow: Hard clear daylight; long exposures smoothing moving water.
  texture_and_material: Extreme detail in rock, trees and structures; water turned to soft mist.
  camera_and_composition: Keep the requested framing; grand wide views from a high vantage, perfectly level horizon.
  atmosphere_and_mood: Monumental and silent, a new land measured on glass.
  rendering_and_quality: Large-plate albumen print with blank skies; not a modern HDR landscape.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mammoth Plate Landscape as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
