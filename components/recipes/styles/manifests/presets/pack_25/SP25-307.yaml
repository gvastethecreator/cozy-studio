  aesthetic: 'Tensioned Surface Morphs: styleframes of a surface pulled between persistent anchor points, changing shape while keeping its edges.'
  subject_treatment: Show the prompt's surface as keyframes pulled between persistent anchors, reshaping by tension while the words stay on a stable area.
  color_and_tone: A constant surface color with accents only at the anchors.
  lighting_and_shadow: Coherent light describing curvature with soft visible edges.
  texture_and_material: A conceptual membrane of steady thickness with justified wrinkles.
  camera_and_composition: Anchors in frame with room for the maximum stretch.
  atmosphere_and_mood: Building tension, controlled movement and a clear resting state.
  rendering_and_quality: Crisp keyframes with persistent edges and countable anchors.
  creative_brief: "Tensioned Surface Morphs: styleframes of a surface pulled between persistent anchor points, changing shape while keeping its edges. Carry it through membrane between anchors, persistent edges, tension stages, stable text. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
