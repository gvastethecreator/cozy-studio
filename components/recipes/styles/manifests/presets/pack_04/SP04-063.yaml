visualDna:
  aesthetic: >-
    Hokusai Woodcut (Floating World) acts as a transferable illustration router: start from
    Classical ukiyo-e woodblock seascape language with rhythmic wave massing, carved contour
    elegance, and floating-world calm, Outline, gradient band, seal signature and ink and
    printmaking system built from mark economy, matrix process, ink transfer, pressure artifacts,
    paper absorption, and reproducible graphic structure, then apply the visual behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Variable width, adapt the requested subject through ink
    transfer, mark density, paper response, process artifacts, and printmaking composition
    discipline while preserving identity; preserve the requested subject while rebuilding it through
    carved lines, etched density, stipple fields, calligraphic pressure, stamp incompleteness,
    graffiti stroke logic, or tattoo-flash simplification, keeping the requested identity,
    silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Flat gradients (Bokashi), Edo-period restraint, indigo-prussian depth; use
    color as ink behavior: monochrome value, limited plates, cyan chemistry, overprint, enamel-like
    flash colors, spray contrast, newspaper black, or sumi restraint, with deliberate value
    grouping, accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Flat, no shadow, graphic elegance, woodblock tradition; translate light
    into hatch density, dot spacing, gouge direction, plate tone, paper reserve, ink pooling, or
    flat spray contrast rather than photographic shading, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Wood grain, ink transfer, mark density, paper response, process artifacts, and
    printmaking composition discipline; surface detail should show paper fiber, plate burr, block
    grain, stipple dots, stamp gaps, marker bite, fountain-pen pooling, tattoo flash linework, or
    aerosol edge behavior, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Flattened perspective, scale rhythm, edge hierarchy, spacing, and
    composition rules specific to Hokusai Woodcut (Floating World); compose through print
    registration, border discipline, mark-direction rhythm, negative-space carving, tag flow,
    ornamental line weight, or edition-like balance, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Nature, calm, ukiyo-e transience, seasonal reverence; derive mood from craft
    pressure, underground immediacy, archival print authority, occult darkness, decorative ceremony,
    street-poster urgency, or disciplined ink control, letting the style alter interpretation
    without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Traditional woodblock print fidelity emphasizing carved-line discipline, restrained
    elegance, and repeatable impression clarity; finish as a credible ink or print artifact with
    exact mark logic, restrained artifacting, and no fake text, random distress overlay, or smooth
    vector replacement, clean denoised surfaces where appropriate, and enough process evidence to
    make the style recognizable.
  key_features: >-
    Classical ukiyo-e woodblock seascape language with rhythmic wave massing, carved contour
    elegance, and floating-world calm; Outline, gradient band, seal signature; Flat gradients
    (Bokashi), Edo-period restraint, indigo-prussian depth; Wood grain, ink transfer, mark density,
    paper response, process artifacts, and printmaking composition discipline; Flattened
    perspective, scale rhythm, edge hierarchy, spacing, and composition rules specific to Hokusai
    Woodcut (Floating World)
  creative_brief: >-
    Apply Hokusai Woodcut (Floating World) as an illustration preset over prompt X: preserve the
    user's requested subject, then route mark-making, palette, surface, composition, mood, and final
    craft through Classical ukiyo-e woodblock seascape language with rhythmic wave massing, carved
    contour elegance, and floating-world calm, Outline, gradient band, seal signature, Wood grain,
    ink transfer, mark density, paper response, process artifacts, and printmaking composition
    discipline without requiring the card image's original subject.
