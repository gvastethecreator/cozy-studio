visualDna:
  aesthetic: >-
    Loose etched linework with a relatively steady stroke width, small interruptions and shifting
    density. Gestural networks build tone more freely than disciplined burin cross-hatching.
  subject_treatment: >-
    Keep the requested identity, proportions, count and action intact. Describe existing contours
    and volume with broken but purposeful marks rather than reshaping the subject.
  color_and_tone: >-
    Preserve requested colors and tonal relationships. Use line density within the existing palette
    to distinguish light and shadow; do not force sepia or grayscale.
  lighting_and_shadow: >-
    Follow the requested illumination and form shadows with varied line density and direction.
    Do not add a dramatic source or shadow pattern.
  texture_and_material: >-
    Keep interruptions and line variation local to the etched mark. Do not imitate uniform aging,
    random stains or blanket scratches over the depicted surface.
  camera_and_composition: >-
    Preserve the requested framing, viewpoint, scale and arrangement. Keep etched marks within the
    existing forms and background areas.
  atmosphere_and_mood: >-
    Use the lively line rhythm without changing the requested mood or setting. Etched marks alone
    do not imply age, drama or a particular story.
  rendering_and_quality: >-
    Maintain visible stroke continuity with selective interruptions and controlled density changes.
    Keep marks legible and distinct from random noise or dense burin-style cross-hatching.
avoidRules:
  - random stains or uniform distress overlay
  - dense cross-hatching that hides the etched line character
