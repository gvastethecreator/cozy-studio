  aesthetic: 'UV fluorescence photography: the scene lit only by ultraviolet lamps so certain materials glow in their own vivid colors while everything else stays dark.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Black-violet darkness with glowing neon greens, reds, oranges and cyan from fluorescing materials.
  lighting_and_shadow: Invisible UV source; light seems to come from within the fluorescent materials.
  texture_and_material: Minerals, varnish, inks, shells and insects revealing hidden glowing patterns.
  camera_and_composition: Keep the requested framing; the glowing materials become the focal points.
  atmosphere_and_mood: Secret and eerie, hidden layers glowing out of the dark.
  rendering_and_quality: Real fluorescence with violet cast in shadows; not neon signs or painted glow.
  creative_brief: "UV fluorescence photography: the scene lit only by ultraviolet lamps so certain materials glow in their own vivid colors while everything else stays dark. Carry it through UV-only lighting, materials glowing in their own colors, black-violet shadows, hidden patterns revealed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
