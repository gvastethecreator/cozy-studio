visualDna:
  aesthetic: 'Iris macro: a human eye so close that the iris becomes a radial landscape of fibers and color.'
  subject_treatment: "Show the prompt's subject at this magnification, or let its shape and action emerge from this specimen texture while staying recognizable: reflected in or shaped from an iris: radial fibers, crypts, pupil and wet corneal highlights."
  color_and_tone: Rich iris colors with dark pupil, as the instrument or lens would record it.
  lighting_and_shadow: Ring-light reflection on the cornea, matching the real imaging setup at this scale.
  texture_and_material: Radial fibers, crypts and wet surface, resolved in fine detail at extreme magnification.
  camera_and_composition: Extreme close-up or microscope field with shallow or instrument-specific depth, the specimen filling the frame and scale implied by structure.
  atmosphere_and_mood: Intimate, mysterious, alive and hypnotic, from discovering a hidden world at tiny scale.
  rendering_and_quality: Scientific-grade macro or micrograph realism with crisp structure and believable optics.
  key_features: radial iris fibers; pupil; corneal reflection
  creative_brief: "Iris macro: a human eye so close that the iris becomes a radial landscape of fibers and color. Carry it through radial iris fibers, pupil, corneal reflection. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
