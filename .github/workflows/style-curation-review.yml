name: Style curation review

on:
  push:
    branches: [styles/curation-v2]
  pull_request:
    paths:
      - 'components/recipes/**'
      - 'packages/shared/src/styles/**'
      - 'lib/recipeContextBuilders/styles.ts'
      - 'lib/recipeContext.test.ts'
      - 'scripts/audit-style-curation*'
      - 'scripts/style-curation/**'
      - 'scripts/generate-style-*'
      - 'docs/styles/curation-v2/**'
      - '.github/workflows/style-curation-review.yml'

permissions:
  contents: read

concurrency:
  group: style-curation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Review category coverage and generated documentation
        run: |
          mkdir -p /tmp/curation-evidence
          git rev-parse HEAD > /tmp/curation-evidence/source-commit.txt
          bun scripts/audit-style-curation.ts --verify --output=/tmp/curation-evidence/category-audit.json
          bun scripts/generate-style-curation-review-doc.ts --check
      - name: Verify style graph and generated projections
        run: bun run styles:verify
      - name: Focused regressions
        run: bun run test -- lib/recipeContext.test.ts components/recipes/stylePresetManifests.test.ts components/recipes/styleLayerComposer.test.ts components/recipes/styleCurationBoundary.test.ts components/recipes/userStyleDraftBuilders.test.ts components/recipes/intentionalStyleCompile.test.ts components/recipes/styles/collections/styleCollectionProjection.test.ts packages/shared/src/styles/legacyStylePrompt.test.ts scripts/audit-style-curation.test.ts
      - name: Publish review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-curation-evidence-${{ github.sha }}
          path: /tmp/curation-evidence/
          retention-days: 7
