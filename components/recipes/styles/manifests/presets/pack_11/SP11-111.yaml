visualDna:
  aesthetic: 'Audio spectrogram: time runs left to right and frequency bottom to top, with sound energy as glowing color.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: drawn as sound energy in a spectrogram: harmonics as stacked lines, noise as clouds, silence dark."
  color_and_tone: Magma or viridis color ramps on black, exactly as the instrument maps its signal.
  lighting_and_shadow: No light; brightness is sound energy, because the image shows signal, not ordinary light.
  texture_and_material: Harmonic stripes, noise clouds and pixel blocks, as real instrument artifacts rather than decoration.
  camera_and_composition: Wide horizontal time-frequency plot with no axis labels, matching how this instrument actually frames data.
  atmosphere_and_mood: Hidden, eerie, musical and precise, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Audio spectrogram: time runs left to right and frequency bottom to top, with sound energy as glowing color. Carry it through harmonic stripes, time-frequency, energy colors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: harmonic stripes; time-frequency; energy colors
