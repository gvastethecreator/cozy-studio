visualDna:
  aesthetic: 'Ink in water: dark ink blooming into billowing clouds from the target underwater.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: ink blooms from the target into billowing clouds in clear water.'
  color_and_tone: Black, indigo or crimson ink clouds, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Backlit clear water, so the effect lights the target and casts believable local light.
  texture_and_material: Billowing ink plumes and filaments, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Mysterious, slow, elegant and dark, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ink Cloud in Water as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: billowing ink plumes; clear water; contained around the target
