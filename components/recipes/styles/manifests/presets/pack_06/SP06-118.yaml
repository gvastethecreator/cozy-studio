visualDna:
  aesthetic: 'RPG pixel inventory icons: small 32 by 32 pixel item icons with a one-pixel dark outline, top-left light and a matched slot frame.'
  subject_treatment: Keep the prompt subject and its design; present it as a standalone game asset on a plain field, and build a gameplay scene or interface only when the prompt asks for one.
  color_and_tone: Three-to-four-step hue-shifted ramps per material, warm highlights and cool shadows, one saturated accent per item.
  lighting_and_shadow: Consistent top-left light across every icon, one bright specular pixel on metal and glass.
  texture_and_material: Clean pixel clusters for leather, iron, glass, wood and cloth; no noise, no dithering chatter.
  camera_and_composition: Each item centered in an identical square slot with equal padding, arranged as a neat grid.
  atmosphere_and_mood: Satisfying and collectible, loot sorted with care.
  rendering_and_quality: Pixel-perfect edges and uniform scale and outline weight across the set; no numbers.
  key_features: 32x32 pixel icons; one-pixel outline; hue-shifted ramps; top-left light; matched square slots
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies RPG Pixel Inventory Icon System as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - item counts
  - painterly icons
  - mixed icon scales
  - motion blur
  - inconsistent proportions
  - changing costume
  - background scene
  - weapon requirement
  - potion requirement
  - watermark
  - text
  - wrong medium
  - generic AI gloss
  - muddy noise
  - uncontrolled texture chatter
  - readable text
