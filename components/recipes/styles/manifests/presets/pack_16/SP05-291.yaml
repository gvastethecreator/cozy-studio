visualDna:
  aesthetic: >-
    Blend fine contour with dilute wash: delicate line, pale transparent planes, and gradual
    warm-cool transitions at adjacent edges.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Harmonize
    neighboring edge values without implying contact or reconciliation.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use pale aqua, sage,
    blue-gray, cream, and a measured warm yellow or rose accent; respect user-selected hues.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use diffused light and soft midtone
    transitions from the existing source, never added rain, mist, or halo.
  texture_and_material: >-
    Apply texture only to materials already present. Lay thin glaze and sparse paper grain over
    existing materials; keep edges dry and avoid dripping texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Soften transitions only
    where forms already meet or sit nearby.
  atmosphere_and_mood: >-
    Keep the stated mood; reconciliation describes edge integration, not narrative or
    expression.
  rendering_and_quality: >-
    Retain clear subject boundaries through the wash and avoid smoothing away requested detail.
  key_features: >-
    Fine contour; dilute glaze; pale aqua-sage; gentle adjacent-edge blending.
  creative_brief: 'Use fine contour; dilute glaze; pale aqua-sage; gentle adjacent-edge blending. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
