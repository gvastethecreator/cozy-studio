visualDna:
  aesthetic: 'Modular Merch Families: one vocabulary of shared pieces adapted to tees, totes and small objects with common weights and hierarchy.'
  subject_treatment: Build the prompt's merch range from one small set of shared pieces, rearranged per product with the same proportions, and every word exact.
  color_and_tone: A common palette with stable roles across every product.
  lighting_and_shadow: Comparable, even presentation light on every product in the range.
  texture_and_material: Base art independent of material with finishes noted as application.
  camera_and_composition: Main and secondary pieces rearranged per product without stretching.
  atmosphere_and_mood: A recognizable yet flexible family, varied by arrangement.
  rendering_and_quality: Clean set with constant proportions and traceable pieces.
  creative_brief: "Modular Merch Families: one vocabulary of shared pieces adapted to tees, totes and small objects with common weights and hierarchy. Carry it through shared pieces, rearranged per product, common palette, exact words. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared pieces; rearranged per product; common palette; exact words
