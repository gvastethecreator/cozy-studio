visualDna:
  aesthetic: 'Rounded contours and modular color shapes overlap with slight edge variation like layered print, creating graphic rhythm across existing forms.'
  subject_treatment: 'Retain each prompted silhouette, pose, and count; soften contour joins without making figures childlike or adding a group.'
  color_and_tone: 'Arrange warm and cool local colors in alternating blocks; use a pale paper tint only when it fits the supplied palette.'
  lighting_and_shadow: 'Keep illumination diffuse and forms readable; use simple overlapping shadow planes while following the stated light.'
  texture_and_material: 'Add restrained paper grain and lightly uneven pigment edges to existing surfaces; retain the named material underneath.'
  camera_and_composition: 'Hold crop, viewpoint, spacing, and count; let repeated color shapes support the supplied arrangement without changing it.'
  atmosphere_and_mood: 'Follow the requested mood; rounded shape rhythm contributes graphic structure without prescribing emotion.'
  rendering_and_quality: 'Use clean color separations with soft layered overlaps; preserve crisp edges where the prompt requires precision.'
  key_features: 'Rounded ink joins; modular color blocks; layered print edges; alternating warm and cool accents; light surface grain.'
  creative_brief: 'Use overlapping color shapes and rounded contour joins to create a gentle graphic rhythm. Keep the requested subject, action, count, camera, and mood. Use it as a reusable look on any subject.'
