visualDna:
  aesthetic: 'Generational sports drama anime: old coaches and young athletes, faded photos, inherited dreams and quiet determination across years.'
  subject_treatment: Keep the prompt's subject and action; add the weight of time, with an older mentor, old equipment or a remembered past nearby.
  color_and_tone: Warm faded sepia for memories and clear bright color for the present.
  lighting_and_shadow: Late afternoon gold light and soft window light in old clubhouses.
  texture_and_material: Worn gloves, taped handles, old wooden lockers and faded photographs.
  camera_and_composition: Paired framings of old and young, often side by side or reflected.
  atmosphere_and_mood: Warm and resolute, a promise passed from one generation to the next.
  rendering_and_quality: Emotional prestige sports anime with gentle color grading between eras.
  key_features: old mentor; inherited equipment; sepia memories; golden light
  creative_brief: "Generational sports drama anime: old coaches and young athletes, faded photos, inherited dreams and quiet determination across years. Carry it through old mentor, inherited equipment, sepia memories, golden light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
