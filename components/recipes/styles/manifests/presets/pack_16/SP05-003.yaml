visualDna:
  aesthetic: 'Monkey Punch and Yasuo Otsuka era Lupin III television animation (1971-1980): lanky long-legged caricature figures, loose sketchy lines, jazzy caper staging and vintage cars in European cities.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people as lanky caricatures with long thin legs, narrow waists, angular faces, sly grins and slim suits. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted seventies palette, mustard, teal, burgundy and warm night browns.
  lighting_and_shadow: Simple cel light with moody night streetlamps and spotlight searchlights.
  texture_and_material: Hand-painted analog cel on painted poster-color backgrounds, visible cel edges, dust and gentle film grain.
  camera_and_composition: Playful caper staging, rooftop chases, cars skidding through narrow streets.
  atmosphere_and_mood: Keep the requested mood with cool jazzy mischief.
  rendering_and_quality: Loose stylish 1970s television frame with caricature swagger.
  key_features: Monkey Punch lanky caricature; jazz caper; vintage cars; sketchy seventies cel
  creative_brief: "Monkey Punch and Yasuo Otsuka era Lupin III television animation (1971-1980): lanky long-legged caricature figures, loose sketchy lines, jazzy caper staging and vintage cars in European cities. Carry it through Monkey Punch lanky caricature, jazz caper, vintage cars, sketchy seventies cel. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
