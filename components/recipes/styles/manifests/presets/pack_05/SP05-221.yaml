visualDna:
  aesthetic: >-
    An optimistic signal style combining human-scale contour rhythm, flowing cyan-pink strokes,
    and orderly panel-like divisions with a warm gold edge.
  subject_treatment: >-
    Retain the requested subject’s shape and identity. Use rhythmic contour breaks and smooth,
    sweeping accents on its existing forms, without adding people or machinery.
  color_and_tone: >-
    Center cyan and pink with a warm gold highlight, balancing vivid accents against clear
    neutral values.
  lighting_and_shadow: >-
    Use clean cel-shadow shapes and a gentle gold rim on selected edges; keep glow narrow and
    controlled.
  texture_and_material: >-
    Preserve the original materials. Add smooth painted highlight bands, fine engineered line
    rhythms, and minimal surface grain.
  camera_and_composition: >-
    Respect the prompt’s crop and perspective. Let flowing strokes echo the existing gesture and
    use panel-like spacing to organize detail.
  atmosphere_and_mood: >-
    Keep the image buoyant and affectionate through open spacing, warm edge light, and fluid
    marks, without staging romance or performance.
  rendering_and_quality: >-
    Use crisp contours, polished color separation, soft restrained glow, and readable details at
    multiple scales.
  key_features: >-
    Cyan-pink signal strokes; warm gold edge light; rhythmic panel divisions; optimistic contour
    flow.
  creative_brief: >-
    Keep the requested subject and action intact. Apply flowing cyan-pink accents, orderly
    contour breaks, and a soft gold rim; add no performer, robot, or stage.
