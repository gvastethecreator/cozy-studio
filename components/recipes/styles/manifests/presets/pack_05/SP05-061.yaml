visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around layered crosshatch that
    thickens selectively in shadow and stops cleanly before large open value gaps. For color and surface, preserve source colors while building weight from
    charcoal, bone, and a narrow muted red or brown accent if needed. Doom can come from
    dense marks beside quiet gaps, but seriousness and peril follow the requested mood
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through layered crosshatch that thickens
    selectively in shadow and stops cleanly before large open value gaps; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; preserve source colors while
    building weight from charcoal, bone, and a narrow muted red or brown accent if
    needed. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; let broad shadow masses
    contrast with a few exposed edges; keep facial, object, or material detail legible
    where present. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; vary hatch direction and spacing rather than
    applying uniform grain or photoreal grime. Keep texture subordinate to form and
    avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; keep the
    original framing, using existing empty areas as counterweight without enlarging
    architecture or subjects. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Doom can come from dense marks beside
    quiet gaps, but seriousness and peril follow the requested mood. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and layered crosshatch that thickens selectively
    in shadow and stops cleanly before large open value gaps; keep focal edges crisp,
    texture controlled, and dark values legible. Avoid photoreal or 3D-render drift,
    watermark, logo, and fake readable text.
  key_features: >-
    layered crosshatch that thickens selectively in shadow and stops cleanly before
    large open value gaps; preserve source colors while building weight from charcoal,
    bone, and a narrow muted red or brown accent if needed; let broad shadow masses
    contrast with a few exposed edges; keep facial, object, or material detail legible
    where present; vary hatch direction and spacing rather than applying uniform grain
    or photoreal grime; and keep the original framing, using existing empty areas as
    counterweight without enlarging architecture or subjects. The five cues should read
    as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use layered crosshatch that thickens
    selectively in shadow and stops cleanly before large open value gaps, preserve
    source colors while building weight from charcoal, bone, and a narrow muted red or
    brown accent if needed, let broad shadow masses contrast with a few exposed edges;
    keep facial, object, or material detail legible where present, and vary hatch
    direction and spacing rather than applying uniform grain or photoreal grime; the
    prompt supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
