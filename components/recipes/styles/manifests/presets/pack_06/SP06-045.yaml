name: Collagraph
category: 3. Printmaking
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - essential-art-styles
  - printmaking
visualDna:
  aesthetic: >-
    Collagraph acts as a transferable art-medium router: start from Textured collage print, Heavy
    texture and print-process system built from matrix marks, ink transfer, pressure, registration,
    plate or block artifacts, and paper absorption, then apply the medium behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Embossed textures; preserve the prompt subject while
    converting it into carved, etched, stamped, screened, dotted, grained, or impressed mark
    systems, keeping the requested identity, silhouette, pose, object function, or environment
    legible.
  color_and_tone: >-
    Build color with Earthy, multi colored; use palette as ink behavior: limited plates, overprint,
    misregistration, monochrome value, cyan chemistry, newspaper dots, or security green-grey
    restraint, with deliberate value grouping, accent control, and medium-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Relief; translate light into line density, dot frequency, relief shadow,
    plate tone, paper reserve, or ink coverage rather than photographic illumination, so value
    structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Sand, glue, fabric; surface detail should reveal paper fibers, plate marks, burr, gouge,
    rosin grain, rubber stamp incompleteness, halftone dots, or collagraph relief, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Abstracted; compose through print registration, cut rhythm, border
    pressure, edition-like balance, negative space, and repeatable mark hierarchy, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Rough, organic; derive mood from hand pressure, mechanical reproduction, archival
    value, propaganda energy, occult darkness, newspaper grit, or tactile experiment, letting the
    medium alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Experimental, tactile; finish as a credible print artifact with exact mark logic,
    restrained texture, and no fake poster text or random distress overlay, clean denoised surfaces
    where appropriate, and enough craft evidence to make the medium recognizable.
  key_features: Textured collage print; Heavy texture; Earthy, multi colored; Sand, glue, fabric; Abstracted
  creative_brief: >-
    Apply Collagraph as an art-style preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Textured
    collage print, Heavy texture, Sand, glue, fabric without requiring the card image's original
    subject.
