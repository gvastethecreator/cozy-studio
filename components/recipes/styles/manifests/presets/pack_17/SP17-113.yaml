visualDna:
  aesthetic: 'Nervous drypoint scratched directly into the plate: jittery needle lines with fuzzy velvet burr, sudden dark knots, torn scratches, and uneven wiped plate tone.'
  subject_treatment: 'Any prompt subject is drawn with trembling urgency: contours shake, shadows are burred tangles, and anatomy or form stretches slightly toward unease while staying recognizable.'
  color_and_tone: Warm black with brown undertone, uneven gray plate tone, and cream paper.
  lighting_and_shadow: Unstable light; dark burr pools around the focal subject with scratched white breaks.
  texture_and_material: Fuzzy burr lines, scratch marks, fingerprints of plate tone, and soft-edged ink bleed.
  camera_and_composition: Uneasy off-center crop with tilted verticals and an isolated subject in an empty, stained field.
  atmosphere_and_mood: Anxious, feverish, intimate, and disturbing.
  rendering_and_quality: 'High-quality drypoint reproduction: burr controlled and meaningful, subject readable, no digital noise.'
  creative_brief: "Nervous drypoint scratched directly into the plate: jittery needle lines with fuzzy velvet burr, sudden dark knots, torn scratches, and uneven wiped plate tone. Carry it through jittery needle line, velvet burr knots, uneven wiped plate tone, trembling contours, feverish unease. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: jittery needle line; velvet burr knots; uneven wiped plate tone; trembling contours; feverish unease
