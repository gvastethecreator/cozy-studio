visualDna:
  aesthetic:
    "Draw on goth subculture's deliberate silhouette and material drama: pointed lines, layered black
    fabrics, lace or mesh, silver hardware, sharp makeup-like graphic shapes, and selective oxblood accents."
  subject_treatment:
    Preserve the requested subject and action; style unspecified clothing, trims, and silhouettes
    with goth tailoring and hardware without assigning a goth identity or costume to every subject.
  color_and_tone:
    Use black, charcoal, cool gray, and oxblood as controlled accents on compatible clothing or surfaces,
    with pale highlights or silver used selectively; retain the requested environment palette and visibility.
  lighting_and_shadow:
    Preserve the requested light source, level, and time of day; use local cool edge light and open shadows
    to reveal fabric layering without darkening the whole scene.
  texture_and_material:
    Contrast velvet-like matte cloth, lace, leather, polished silver, and small translucent
    accents; keep details structural rather than decorative noise.
  camera_and_composition:
    Favor elongated verticals and asymmetrical negative space while preserving the prompt's
    framing; use one silhouette break or accessory as a focal accent.
  atmosphere_and_mood:
    Carry theatrical self-possession and dark romanticism that may be tender, bold, or playful,
    not automatically mournful.
  rendering_and_quality:
    Keep silhouette, lace pattern, and hardware readable at small scale; use clear material
    separation and restrained highlights.
avoidRules:
  - a required cathedral, cemetery, or funeral scene
  - all-black fill that hides form
  - overloaded lace and accessories obscuring the subject
  - global darkening that replaces requested daylight or exposure
