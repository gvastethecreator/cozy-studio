visualDna:
  aesthetic: 'Windpunk: a world powered by wind, with forests of turbines, kite generators, whistling towers and cities that move with the weather.'
  subject_treatment: Keep the prompt's subject and setting; add turbines, kites, sails and wind chimes, with everything leaning into the wind.
  color_and_tone: Sky blues and cloud whites with bright turbine whites and kite colors.
  lighting_and_shadow: Fast-moving cloud shadows racing across the land in bright, gusty daylight.
  texture_and_material: Turbine blades, kite fabric, tensioned cables, wind chimes and grass bent flat.
  camera_and_composition: Wide windy landscapes with turbines on ridges and figures braced against gusts.
  atmosphere_and_mood: Restless and joyful, a civilization that dances with every storm.
  rendering_and_quality: Airy dynamic illustration with strong sense of wind motion.
  creative_brief: "Windpunk: a world powered by wind, with forests of turbines, kite generators, whistling towers and cities that move with the weather. Carry it through turbine forests, kite generators, leaning figures, cloud shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: turbine forests; kite generators; leaning figures; cloud shadows
