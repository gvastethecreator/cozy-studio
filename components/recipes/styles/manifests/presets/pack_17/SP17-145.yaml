visualDna:
  aesthetic: 'Found-map monster collage: creatures and figures cut from old maps and nautical charts, coastlines and contour lines becoming scales, fur and wings.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; cut the subject out of old map paper so geography becomes its texture.
  color_and_tone: Faded map blues, beiges and red route lines.
  lighting_and_shadow: Flat collage with small paper shadows, kept consistent across the whole image.
  texture_and_material: Map paper, contour lines, folds and glue edges.
  camera_and_composition: Cut figure on a plain or map background.
  atmosphere_and_mood: Keep the requested mood with wanderlust strangeness, kept consistent across the whole image.
  rendering_and_quality: Clean cutting with readable map texture, kept consistent across the whole image.
  creative_brief: "Found-map monster collage: creatures and figures cut from old maps and nautical charts, coastlines and contour lines becoming scales, fur and wings. Carry it through cut map paper, contour-line texture, fold creases, collage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cut map paper; contour-line texture; fold creases; collage
