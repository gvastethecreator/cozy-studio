visualDna:
  aesthetic: 'Ribbon-Corner Symbols: one flat ribbon path per icon changes direction through large deliberate corners and stable voids.'
  subject_treatment: Fold the prompt's subject or requested relations into one wide ribbon path per icon with readable corners, few crossings and visible ends.
  color_and_tone: One ink or two orientation values, flat and matte.
  lighting_and_shadow: Graphic folds explained by clean occlusion alone, with flat faces.
  texture_and_material: Flat ribbon of consistent thickness with clear terminals.
  camera_and_composition: Compact paths that never fill the whole box or force a loop.
  atmosphere_and_mood: Agile continuity carried by one precise angular gesture per icon.
  rendering_and_quality: Every corner keeps its apparent width when reduced.
  creative_brief: "Ribbon-Corner Symbols: one flat ribbon path per icon changes direction through large deliberate corners and stable voids. Carry it through folded ribbon paths, big corners, visible ends, compact routes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: folded ribbon paths; big corners; visible ends; compact routes
