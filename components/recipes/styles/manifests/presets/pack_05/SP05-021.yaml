visualDna:
  aesthetic: >-
    Build the graphic anime treatment from tapered black-ink contours that thicken at turns and
    break into short speed ticks and compact rounded masses with clean cel edges and ribbonlike
    cutouts. Let long upward curves, brief flicks, and crisp pauses set its rhythm; use clear teal
    and warm orange against ink-dark and paper-light neutrals for color and smooth cel flats
    touched by sparse dry-ink grain for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use tapered black-ink contours that thicken at
    turns and break into short speed ticks for edge work, compact rounded masses with clean cel
    edges and ribbonlike cutouts for form simplification, and long upward curves, brief flicks,
    and crisp pauses only where movement is already requested.
  color_and_tone: >-
    Build value groups with clear teal and warm orange against ink-dark and paper-light neutrals.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard two-step shadows with small white edge cuts. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth cel flats touched by sparse dry-ink grain, preserving
    depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use open diagonal flow with rising arcs and unblocked
    negative space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey buoyant resolve and forward curiosity, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with crisp silhouettes, flat fills, and sparse grain; bind every accent to an existing
    form; keep detail selective and accents attached to existing forms.
  key_features: >-
    tapered black-ink contours that thicken at turns and break into short speed ticks; compact
    rounded masses with clean cel edges and ribbonlike cutouts; clear teal and warm orange against
    ink-dark and paper-light neutrals; long upward curves, brief flicks, and crisp pauses; smooth
    cel flats touched by sparse dry-ink grain; open diagonal flow with rising arcs and unblocked
    negative space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with tapered black-ink
    contours that thicken at turns and break into short speed ticks, compact rounded masses with
    clean cel edges and ribbonlike cutouts, and clear teal and warm orange against ink-dark and
    paper-light neutrals; use long upward curves, brief flicks, and crisp pauses only where
    movement is already present, and apply smooth cel flats touched by sparse dry-ink grain as the
    drawing finish.
