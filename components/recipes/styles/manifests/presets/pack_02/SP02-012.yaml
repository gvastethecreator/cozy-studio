visualDna:
  aesthetic: 'Symmetrical storybook cinema: meticulously centered compositions, pastel dollhouse sets and deadpan performers, as if every frame were a page of a picture book.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Curated pastel palette — pink, mustard, mint, powder blue — with one strong accent.
  lighting_and_shadow: Soft frontal light, very few shadows, clean and flat like a lit diorama.
  texture_and_material: Handmade miniatures, uniforms, patterned wallpaper and precise props.
  camera_and_composition: Dead-center one-point perspective, subject frontal and centered, perfectly balanced left and right.
  atmosphere_and_mood: Whimsical and melancholic, deadpan charm inside strict order.
  rendering_and_quality: Crisp storybook film look; no handheld mess and no asymmetry.
  key_features: dead-center symmetry; pastel dollhouse palette; frontal deadpan subject; flat soft light; one-point perspective
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Symmetrical Storybook Cinema as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
