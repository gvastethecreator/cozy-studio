visualDna:
  aesthetic: 'Wood grain texture: bold flowing grain lines and knots across the surface.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: strong grain lines flow around knots over the surfaces. The decorative surface pattern is the point: make its figure, veining or motif the first read."
  color_and_tone: Warm wood tones with dark grain, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Warm side light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Flowing grain and knots, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Warm, organic, handcrafted and natural, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: flowing grain lines; knots; decorative surface pattern
  creative_brief: "Wood grain texture: bold flowing grain lines and knots across the surface. Carry it through flowing grain lines, knots, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
