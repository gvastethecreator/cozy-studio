  color_and_tone: 'Faded petal colors: dusty rose, violet, brown and olive.'
  lighting_and_shadow: Soft flat light, expressed through the style rather than photographic lighting.
  texture_and_material: Translucent dried petals and leaf veins on paper, visible at a glance as the signature of the style.
  camera_and_composition: Frame or album page with the subject centered, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Nostalgic, delicate, quiet and melancholy, driven by the construction, color and rhythm.
  rendering_and_quality: Careful botanical collage, with clean, deliberate marks and no accidental noise.
  creative_brief: "Pressed flower collage: the subject composed from flattened dried petals, leaves and ferns glued on paper. Carry it through pressed petals, leaf veins, dried stems, paper page. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
