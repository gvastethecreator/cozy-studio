  color_and_tone: Sky blue, sunny gold, cloud white and warm ship wood.
  lighting_and_shadow: Bright open-sky sunshine with soft Dreamcast gradients, lit the way Skies of Arcadia 2000 lights its levels.
  texture_and_material: Early-2000s low-poly models with clean bright textures, with the in-engine surface finish of Skies of Arcadia 2000.
  camera_and_composition: Third-person deck view over the cloud sea, framed the way Skies of Arcadia 2000 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with sunny swashbuckling adventure.
  rendering_and_quality: Authentic Dreamcast JRPG screen, matching real Skies of Arcadia 2000 screenshots.
  key_features: Skies of Arcadia airships; cloud sea; sky pirates
