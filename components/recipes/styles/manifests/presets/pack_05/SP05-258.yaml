visualDna:
  aesthetic: Practical anime cel drawing with hairline mechanical lineart, grounded realistic proportions and small warm brass specular glints on every metal part.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Screws, joints and seams of the existing object are drawn with care; do not add toolboxes, extra hands or a workshop.
  color_and_tone: Warm brass, walnut brown and muted olive against clean neutral greys, saturation kept moderate and even.
  lighting_and_shadow: Soft top light with small localized reflected glints on metal and a calm single-tone cel shadow beneath forms.
  texture_and_material: Hairline detail on mechanisms, subtle wood grain and tiny brass sparkle points, with flat fills everywhere else.
  camera_and_composition: Keep the requested view; a slightly elevated three-quarter angle makes the construction of objects easy to read.
  atmosphere_and_mood: Humble, capable and attentive, the satisfaction of a job done properly.
  rendering_and_quality: Crisp focal structure and useful rather than decorative detail, with no heavy effects or bloom.
  key_features: hairline mechanical lineart; brass specular glints; grounded proportions; construction-readable three-quarter angle; calm single-tone shadow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fine-Line Brass Glint Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
