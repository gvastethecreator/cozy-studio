visualDna:
  aesthetic: >-
    Isometric 3D acts as a transferable CGI-style router: start from Orthographic projection, 30
    degree angle, parallel projection and 3D style system built from modeling language, mesh
    abstraction, projection rules, topology display, toy material, paper logic, or stylized shader
    constraints, then apply the 3D/render behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Parallel lines; preserve the prompt subject while
    rebuilding it through the preset-specific 3D language; use facets, voxels, topology lines, clay,
    paper folds, toon bands, or procedural motion forms only when the preset calls for them, keeping
    the requested identity, silhouette, pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Pastel, clean, gradient friendly; use color through material simplification,
    cel ramps, toy plastic, paper fiber, retro CGI gradients, voxel palettes, or procedural motion
    accents, with deliberate value grouping, exposure control, and medium-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Soft studio, shadow casting consistency; shape light through the style
    constraint: simplified GI, toon bands, clay softness, wire visibility, toy shadows, paper fold
    light, or retro speculars, so value structure supports the renderer and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Smooth, isometric unity feel; surface detail should show the named construction system;
    cube faces, mesh edges, fold creases, clay fingerprints, topology overlays, procedural blobs, or
    low-poly facets should appear only when they belong to the preset, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for Isometric 3D: three quarter or orthographic
    framing, clean silhouette read, material highlights, controlled depth, and vertical card
    composition; compose through projection, topology readability, object grouping, axis discipline,
    exploded or arranged parts, or stylized scale rhythm, with scale, spacing, edge rhythm, and
    visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Organized, tiny, isometric clarity; derive mood from toy-like clarity, technical
    breakdown, handmade stop-motion, abstract motion, retro CGI novelty, or procedural mathematical
    wonder, letting the renderer alter interpretation without demanding a specific story, location,
    or character.
  rendering_and_quality: >-
    Finish with Mobile game, icon, asset store ready; finish with intentional stylization, clean
    geometry, stable silhouettes, and no accidental photoreal overwrite unless the preset asks for
    it, clean denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Orthographic projection; 30 degree angle, parallel projection; Pastel, clean, gradient friendly;
    Smooth, isometric unity feel; Lookdev camera for Isometric 3D: three quarter or orthographic
    framing, clean silhouette read, material highlights, controlled depth, and vertical card
    composition
  creative_brief: >-
    Apply Isometric 3D as a CGI/render preset over prompt X: preserve the user's requested subject,
    then route modeling, shader response, lighting, material scale, composition, mood, and final
    render craft through Orthographic projection, 30 degree angle, parallel projection, Smooth,
    isometric unity feel without requiring the card image's original subject.
avoidRules:
  - perspective
  - distortion
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - readable text
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
