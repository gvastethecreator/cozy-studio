visualDna:
  aesthetic: 'Dialogue portrait bust: a framed head-and-shoulders character portrait of the kind that appears beside dialogue in classic RPGs, expressive face, painterly pixel detail and a plain backdrop.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; show the subject as a head-and-shoulders portrait with one clear expression.
  color_and_tone: Rich skin and costume colors on a plain dark backdrop.
  lighting_and_shadow: Soft key light with pixel-level shading, kept consistent across the whole image.
  texture_and_material: Careful pixel painting, hair clusters and cloth folds.
  camera_and_composition: Square framed bust facing slightly sideways, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with strong personal character.
  rendering_and_quality: Expressive detailed portrait with no dialogue box, kept consistent across the whole image.
  creative_brief: "Dialogue portrait bust: a framed head-and-shoulders character portrait of the kind that appears beside dialogue in classic RPGs, expressive face, painterly pixel detail and a plain backdrop. Carry it through framed bust, single expression, painterly pixels, plain backdrop. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: framed bust; single expression; painterly pixels; plain backdrop
