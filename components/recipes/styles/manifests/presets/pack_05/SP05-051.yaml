visualDna:
  aesthetic: 'High-speed digital anime compositing: horizontal background pan blur, RGB-split chromatic edges, and tapered afterimage smears trailing the moving forms.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Cyan and fuchsia split fringes over graphite and pearl, with one warning-red accent on the leading edge.
  lighting_and_shadow: Crisp two-tone cel shadows on the subject, background lights stretched into horizontal streaks by the pan, and hot glints on leading edges.
  texture_and_material: Polished alloy suggested by painted highlight bands, with the background dissolved into long streaked lines.
  camera_and_composition: Keep the requested view; the subject stays sharp while everything behind it smears sideways in a tracking pan.
  atmosphere_and_mood: Breathless velocity, cool metal and nerve at the edge of control.
  rendering_and_quality: Sharp subject contours, chromatic RGB offset on edges, motion-smear afterimages and a streaked background; never a static still life.
  key_features: horizontal tracking pan blur; RGB-split chromatic edges; tapered afterimage smears; cyan-fuchsia fringes; warning-red leading edge
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Neon Kinetic Alloy Sprint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
