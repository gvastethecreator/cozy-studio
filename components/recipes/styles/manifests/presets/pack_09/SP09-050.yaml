visualDna:
  aesthetic: 'Dry chalk: powdery matte chalk surfaces that smudge and leave dust.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of or coated in dry chalk, powdery, smudged and dusty at edges.'
  color_and_tone: Chalky pastels or white with dust, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft light for matte powder, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Powdery chalk with smudges, dust and fingerprints, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Fragile, dusty, soft and ephemeral, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: powdery matte chalk; smudges; dust fall
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chalk (Dry) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
