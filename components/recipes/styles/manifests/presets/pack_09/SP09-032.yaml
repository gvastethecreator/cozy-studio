visualDna:
  aesthetic: 'Cardboard: corrugated brown cardboard with exposed flutes, tape and crushed edges.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is built from corrugated cardboard with exposed flutes, tape joints and creases."
  color_and_tone: Kraft brown, beige and grey tape, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft daylight, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Corrugated cardboard with flutes, creases and packing tape, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Handmade, playful, humble and improvised, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: corrugated cardboard; exposed flutes; tape joints; creases
  creative_brief: "Cardboard: corrugated brown cardboard with exposed flutes, tape and crushed edges. Carry it through corrugated cardboard, exposed flutes, tape joints, creases. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
