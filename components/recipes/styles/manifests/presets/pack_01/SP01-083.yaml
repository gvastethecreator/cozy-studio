visualDna:
  aesthetic: 'Luxury macro gleam: extreme close-up jewelry-campaign photography where razor strip lights draw bright lines along polished edges against black.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Deep black ground, champagne and silver highlights, saturated jewel accents.
  lighting_and_shadow: Narrow strip softboxes and small spot kickers placed to create controlled sparkle and specular edge lines.
  texture_and_material: Polished metal, cut stones with internal fire, engraving and enamel resolved at macro scale.
  camera_and_composition: 100 mm macro, very shallow focus on one facet or edge, sculptural crop that lets the object fill the frame.
  atmosphere_and_mood: Precious and hushed, rarity shown in silence against the dark.
  rendering_and_quality: High-end jewelry retouch; clean blacks, no dust, no plastic sparkle overlay.
  key_features: black ground; razor strip-light edge lines; macro facet focus; jewel fire; controlled sparkle
  creative_brief: "Luxury macro gleam: extreme close-up jewelry-campaign photography where razor strip lights draw bright lines along polished edges against black. Carry it through black ground, razor strip-light edge lines, macro facet focus, jewel fire, controlled sparkle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
