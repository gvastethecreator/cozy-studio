visualDna:
  aesthetic: 'Office whiteboard doodle: dry-erase markers on a glossy whiteboard, drawn fast during a meeting, with the ghosts of earlier half-erased drawings underneath.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Glossy white board, marker blue, red, green and black, faint grey ghosting.
  lighting_and_shadow: Office fluorescent glare streaks across the board surface.
  texture_and_material: Streaky marker strokes that skip on the gloss, smudged edges where a hand brushed, eraser swipes.
  camera_and_composition: The whole board seen flat, arrows and circles connecting the drawn subject.
  atmosphere_and_mood: Bored and playful, inspiration sneaking into a long meeting.
  rendering_and_quality: Real marker on glossy board with glare; no readable words, only arrows and shapes.
  key_features: dry-erase marker streaks; half-erased ghost drawings; fluorescent glare; arrows and circles; four-color markers
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Office Whiteboard Doodle as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
