visualDna:
  aesthetic: 'Haute couture: one sculptural, hand-built garment treated as wearable architecture, where volume, cut and handwork are the spectacle.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a single exaggerated couture silhouette — cocoon, pannier, flared shoulder or spiral drape — built from stiffened silk, organza and hand-applied embellishment, never a casual layer."
  color_and_tone: Restrained palette of one or two deep couture colors (oxblood, ink, ivory, gold) against neutral surroundings.
  lighting_and_shadow: Hard editorial key with sculpted shadow that describes every fold and cavity of the garment.
  texture_and_material: Silk duchesse, gazar, organza, hand-beading, feathers and visible couture stitching at hems and seams.
  camera_and_composition: Full-figure or three-quarter framing so the whole silhouette reads, with space around the volume.
  atmosphere_and_mood: Rare, ceremonial, theatrical and imperious, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Crisp garment edges, believable weight and stiffness of fabric, runway-level finish.
  key_features: sculptural couture volume; stiffened silk and organza; hand embellishment; single dramatic silhouette; sculpted editorial shadow
  creative_brief: "Haute couture: one sculptural, hand-built garment treated as wearable architecture, where volume, cut and handwork are the spectacle. Carry it through sculptural couture volume, stiffened silk and organza, hand embellishment, single dramatic silhouette, sculpted editorial shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
