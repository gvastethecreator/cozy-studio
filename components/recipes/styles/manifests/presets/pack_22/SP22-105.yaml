visualDna:
  aesthetic: >-
    Opaque dry-brush paint builds form through directional pigment drag, interstitial gaps and
    selectively scraped lights.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Align dry strokes to the existing
    surface and planes; break an edge only where the depleted brush deposit naturally thins.
  color_and_tone: >-
    Organize the requested colors into clear value groups, using scraped light marks only on planes
    already lit by the requested scene.
  lighting_and_shadow: >-
    Honor the specified lighting and shadow pattern. Broken coverage may describe those planes but
    must not add a new highlight source or change the time of day.
  texture_and_material: >-
    Keep opaque dry deposits and small gaps local to the form. Let bristle drag follow its direction;
    do not turn the whole image into dirt or random screen-wide scratches.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not add an unrequested
    card frame or shift the subject to imitate a printed object.
  atmosphere_and_mood: >-
    Keep the requested mood. Dry pigment marks do not imply a relic, decay, age or a historical
    setting.
  rendering_and_quality: >-
    Maintain grouped values and a readable silhouette, with broken contours limited to the marks
    that lose pigment. Avoid a generic erosion or grunge layer.
avoidRules:
  - unmotivated brush marks unrelated to form
  - global dirt overlay
  - random screen-wide scratches
