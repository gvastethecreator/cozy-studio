visualDna:
  aesthetic: >-
    Light fine-line detail adds a controlled decorative rhythm around clearly dominant shapes, with a
    simple outer contour and clean areas of separation.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep small marks subordinate to the
    main forms and do not attach new motifs or faces to unrelated objects.
  color_and_tone: >-
    Preserve the specified palette and use bright color areas with intentional open spaces; do not require
    sweets, candy hues or a fixed pastel scheme.
  lighting_and_shadow: >-
    Follow the requested light and retain clear value separation. Decorative marks should not obscure
    shadows or introduce additional light effects.
  texture_and_material: >-
    Keep fills clean and use thin, precise strokes for localized details; preserve represented materials
    instead of applying a uniform ornamental texture.
  camera_and_composition: >-
    Maintain the requested crop, viewpoint, framing and element placement. Fine detail should support the
    main silhouette without filling empty regions or changing the layout.
  atmosphere_and_mood: >-
    Retain the requested tone and setting. A lively detail rhythm does not add hearts, sweets or another
    narrative motif by default.
  rendering_and_quality: >-
    Establish large forms and a simple exterior contour first, then add only enough fine-line detail to
    enrich the subject while preserving small-scale clarity.
avoidRules:
  - unrequested hearts, sweets or anthropomorphic faces
  - ornament that obscures the main silhouette
