visualDna:
  aesthetic: 'Madhouse Vampire Hunter D: Bloodlust film look (2000) after Yoshitaka Amano designs: baroque gothic castles, rose-black decadence, elegant pale hunters and painterly desolate wastelands.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Amano-derived elegance, tall pale figures, wide-brimmed hats, flowing capes and aristocratic vampires. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Rose black, crimson, bone white and moonlit blue.
  lighting_and_shadow: Moonlit castle light, candlelit baroque halls and dramatic gothic silhouettes.
  texture_and_material: Lavish hand-drawn cel with painterly baroque backgrounds and fine ornamental detail.
  camera_and_composition: Grand gothic castle compositions and elegant slow-motion confrontations under the moon.
  atmosphere_and_mood: Keep the requested mood with decadent gothic elegance.
  rendering_and_quality: Lavish 2000 Madhouse feature frame with baroque decadence.
  key_features: Amano gothic elegance; baroque castles; rose-black palette; moonlit hunters
  creative_brief: "Madhouse Vampire Hunter D: Bloodlust film look (2000) after Yoshitaka Amano designs: baroque gothic castles, rose-black decadence, elegant pale hunters and painterly desolate wastelands. Carry it through Amano gothic elegance, baroque castles, rose-black palette, moonlit hunters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
