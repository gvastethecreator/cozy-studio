visualDna:
  aesthetic: >-
    Selected reflective or transparent planes create small, bounded shifts in the visible image. Keep the
    main contours aligned and readable while a few secondary planes produce precise optical
    discontinuities.
  subject_treatment: >-
    Keep the requested subject singular and recognizable. Confine reflected echoes to selected contours
    or surfaces; preserve silhouette, pose, and all defining parts.
  color_and_tone: >-
    Preserve prompt colors. Reflected regions may shift subtly toward a neighboring hue or muted
    iridescence, but keep the principal color relationships clear and avoid a fixed neon or monochrome
    scheme.
  lighting_and_shadow: >-
    Keep highlights consistent with the stated source, splitting or offsetting them only at reflective
    edges. Anchor shadow to the actual forms so the optical effect does not change the scene lighting.
  texture_and_material: >-
    Separate reflective, tarnished, and matte areas with restrained surface cues such as fine scratches
    or ripple distortion. Apply gloss only where the represented material warrants it.
  camera_and_composition: >-
    Hold the requested view and layout. Reflected fragments may bend or slip slightly out of register,
    but preserve enough alignment to understand the original volume and spatial relation.
  atmosphere_and_mood: >-
    Let uncertainty come from a delayed or partial reflected read. Preserve the requested mood; optical
    strangeness does not require darkness, sorrow, or an oracle narrative.
  rendering_and_quality: >-
    Keep the true contour clearest and limit ghost edges to a few deliberate zones. Maintain clean
    small-scale separation between the form, its reflection, and the background.
avoidRules:
  - Do not duplicate the full subject as a second figure.
  - Do not spread specular noise or iridescence across surfaces that are meant to read as matte.
