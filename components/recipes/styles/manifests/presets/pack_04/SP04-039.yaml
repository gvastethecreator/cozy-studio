visualDna:
  aesthetic: 'Painted movie one-sheet: an airbrushed and oil-painted montage with a giant central head or symbol towering over smaller action vignettes.'
  subject_treatment: Keep the prompt subject and action; this preset owns the painted montage one-sheet composition with scaled vignettes, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Theatrical amber against cyan, deep painted shadows and glowing highlights.
  lighting_and_shadow: Strong rim and backlight on every figure, glow accents and dramatic split key light.
  texture_and_material: Soft airbrush mist, visible oil brushwork in the focal faces, matte poster print.
  camera_and_composition: 'Pyramid montage: huge background element, hero figures in the middle, small action scene at the base.'
  atmosphere_and_mood: Grand, cinematic and anticipatory, a whole story in one sheet.
  rendering_and_quality: Hand-painted polish with airbrush blending; no photo collage, no credits block and no title.
  key_features: painted montage pyramid; giant background head or symbol; amber and cyan; airbrush mist; rim-lit heroes
  creative_brief: "Painted movie one-sheet: an airbrushed and oil-painted montage with a giant central head or symbol towering over smaller action vignettes. Carry it through painted montage pyramid, giant background head or symbol, amber and cyan, airbrush mist, rim-lit heroes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
