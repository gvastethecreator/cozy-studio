  color_and_tone: Black ink with extremely dense crosshatching and baroque shadow.
  lighting_and_shadow: Theatrical chiaroscuro carved entirely by dense layered crosshatching.
  texture_and_material: Extraordinarily dense crosshatch lines and elaborate baroque ornament.
  camera_and_composition: Theatrical baroque compositions with crowds, stages and monumental scale.
  atmosphere_and_mood: Keep the requested mood with crushing baroque doom.
  rendering_and_quality: Monumental crosshatched manga illustration with crushing baroque doom.
  key_features: Shinichi Sakamoto crosshatching; baroque theater; doom; monumental
  creative_brief: "Shinichi Sakamoto manga look as in Innocent and The Climber: extraordinarily dense crosshatching, baroque theatrical compositions, gothic grandeur and the crushing weight of fate. Carry it through Shinichi Sakamoto crosshatching, baroque theater, doom, monumental. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
