visualDna:
  aesthetic: 'Wet plate ambrotype: a collodion negative on clear glass backed with black varnish so it reads as a positive, with ivory highlights floating on a deep black ground.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Monochrome ivory, warm grey and velvet black; orthochromatic response — blue skies and eyes go pale, reds and lips go dark.
  lighting_and_shadow: Large soft daylight source and exposures of several seconds; highlights creamy and luminous, shadows dissolving into the black backing.
  texture_and_material: Glassy depth, subtle collodion pour ripples and small comet marks near the margins; no film grain, surface faintly silvery.
  camera_and_composition: Keep the requested framing; Petzval-style lens with a sharp center, swirling soft edges and very shallow focus.
  atmosphere_and_mood: Still and solemn, luminous faces floating out of a velvet void.
  rendering_and_quality: Positive-on-glass look, not a tintype plate or a paper print; modern subjects stay modern (an appliance stays an appliance).
  key_features: ivory on black glass; orthochromatic tones; Petzval swirl; collodion pour ripples; long-exposure stillness
  creative_brief: "Wet plate ambrotype: a collodion negative on clear glass backed with black varnish so it reads as a positive, with ivory highlights floating on a deep black ground. Carry it through ivory on black glass, orthochromatic tones, Petzval swirl, collodion pour ripples, long-exposure stillness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
