  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: turned into streaks: a single line of space stretched over time."
  color_and_tone: Glowing green or false color on black, exactly as the instrument maps its signal.
  lighting_and_shadow: Streak glow, because the image shows signal, not ordinary light.
  texture_and_material: Smeared streaks, as real instrument artifacts rather than decoration.
  camera_and_composition: Horizontal streak, matching how this instrument actually frames data.
  atmosphere_and_mood: Fast, abstract, scientific and eerie, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
