visualDna:
  aesthetic: 'Woven Junction Symbols: simple paths alternate over and under at each crossing, turning plain lines into a continuous woven sign.'
  subject_treatment: Construct the prompt's subject from a few traceable bands under one strict over-under crossing rule, each overpass resolved with a clean cut; set requested text exactly.
  color_and_tone: Value shifts may clarify crossings, while the cut gaps alone carry the continuity.
  lighting_and_shadow: Flat bands, with overlap explained by the lower band stopping cleanly at each cross.
  texture_and_material: Uniform smooth bands kept graphic, never turning into literal rope or fibre.
  camera_and_composition: Few well-spaced crossings with one dominant path, spread across the mark.
  atmosphere_and_mood: Ordered interdependence, with a woven cadence that stays modern and unornamented.
  rendering_and_quality: Identical crossing gaps and consistent band width everywhere in the interlace.
  creative_brief: "Woven Junction Symbols: simple paths alternate over and under at each crossing, turning plain lines into a continuous woven sign. Carry it through over-under crossings, traceable bands, clean cut gaps, woven cadence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: over-under crossings; traceable bands; clean cut gaps; woven cadence
