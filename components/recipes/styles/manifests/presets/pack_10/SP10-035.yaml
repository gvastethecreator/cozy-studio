visualDna:
  aesthetic: 'Magical realism: an ordinary scene rendered realistically where one impossible thing happens calmly.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: the scene stays realistic and everyday, but one impossible element is accepted as normal."
  color_and_tone: Warm natural palette, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Natural daylight, supporting the dream logic without adding stock props.
  texture_and_material: Realistic textures, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Calm, poetic, quietly astonishing and tender, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: realistic everyday scene; one calm impossibility
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Magical Realism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
