visualDna:
  aesthetic: >-
    Street Photography acts as a transferable photographic style router: begin from Documentary
    candid moment, Decisive moment tension, and observational photographic system built from
    available-light capture, imperfect timing, public-space pressure, and real-world incident, then
    apply the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Messy composition; preserve prompt identity while favoring
    candid posture, active context, environmental evidence, and unsanitized physical detail, keeping
    the original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with High contrast B&W or gritty color; grade as street, travel, concert, war, sport,
    paparazzi, or field documentary capture rather than commercial color polish, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Natural; use available light, flash intrusion, stage beams, harsh noon, rain reflection,
    smoke, or practical spill as factual scene evidence, preserving believable exposure, shadow
    density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Grain; keep street surfaces, sweat, dust, fabric wear, weather, grain, high ISO, and
    motion smear honest rather than decorative, avoiding both waxy smoothing and noisy texture
    overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Motion blur; compose with decisive moment tension, wide action proximity,
    telephoto intrusion, crowd-layer rhythm, horizon pressure, or unstable framing, with lens
    distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Real, fleeting; derive mood from urgency, witness, travel discovery, danger, crowd
    energy, decay, speed, or unrepeatable timing, so the preset changes interpretation without
    demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Cartier-Bresson, decisive moment; finish as credible documentary photography with
    restrained processing, readable action, and no stock-advertising gloss, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: >-
    Documentary candid moment; Decisive moment tension; High contrast B&W or gritty color; Natural;
    Motion blur
  creative_brief: >-
    Apply Street Photography as a photographic preset over prompt X: preserve the user's requested
    subject, then route Documentary candid moment, High contrast B&W or gritty color, Natural,
    Grain, and Motion blur through optics, exposure, palette, surface response, timing, and finish
    without requiring the card image's original subject.
