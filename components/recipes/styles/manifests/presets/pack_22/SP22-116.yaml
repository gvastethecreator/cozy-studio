visualDna:
  aesthetic: >-
    Matte digital gouache uses compact, slightly simplified volumes and opaque color with low-frequency
    transitions. Adjacent color planes describe form in place of a prominent drawn outline.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Clarify the silhouette with simplified
    planes without exaggerating anatomy or changing the subject.
  color_and_tone: >-
    Use clear color regions and readable chromatic shadows with restrained, non-specular highlights.
    Respect the palette and contrast requested by the user.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Translate highlights into matte color
    changes without adding a new source or glossy glare.
  texture_and_material: >-
    Keep pigment variation soft and low-frequency. Do not impose a paper or canvas pattern, and preserve
    the actual material of each represented surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Simplified rendering does not
    require an adventure pose or rearranged scene.
  atmosphere_and_mood: >-
    Keep the requested tone and setting. Matte gouache does not add fantasy props, heroic framing or a
    particular emotional mood.
  rendering_and_quality: >-
    Build a complete image from compact shapes, clear value separation and selective internal detail.
    Keep the finish matte without flattening essential structure.
avoidRules:
  - unrequested anatomical exaggeration
  - specular gloss across matte surfaces
