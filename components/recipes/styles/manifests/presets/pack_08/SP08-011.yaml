visualDna:
  aesthetic: '1950s domestic-pop fashion: fitted bodices, full circle skirts over petticoats, cardigans, pearls, gloves and neat set hair, or boxy suits with fedoras.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: the 1950s garment system below, with period-accurate cut, closures, layering and accessories; the surrounding setting stays as the prompt describes — fitted-waist dress with full skirt and petticoat, twinset cardigan and pearls, gloves and kitten heels, or a boxy suit with skinny tie and fedora.'
  color_and_tone: Technicolor pastels — mint, cherry, butter yellow, powder blue — with crisp white.
  lighting_and_shadow: Bright, even, cheerful light like a vintage advertisement, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Cotton poplin, taffeta petticoats, wool twinsets, pearls and patent leather.
  camera_and_composition: Posed full figure with the skirt silhouette visible, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Optimistic, polished, wholesome and slightly uncanny, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Saturated, glossy vintage print finish, with believable fabric weight, seams and fit detail.
  key_features: full circle skirt and petticoat; twinset and pearls; gloves; technicolor pastels; advertising polish
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vintage 1950s as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
