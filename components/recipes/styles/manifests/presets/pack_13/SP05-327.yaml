visualDna:
  aesthetic: >-
    Treat the named lineage as technique reference: hold the existing beat as a poster-like freeze
    with bold silhouette, grouped values, selective rim and light film grain.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use a compact, emotionally clear
    palette with deliberate value groups; retain prompt-specific colors.
  lighting_and_shadow: >-
    Add a selective rim only where the prompt's light supports it; keep shadow blocks broad and
    readable.
  texture_and_material: >-
    Use painterly poster edges and subtle grain, not a literal postcard surface or frame.
  camera_and_composition: >-
    Emphasize the existing pose and pause; preserve requested camera, crop and surrounding content.
  atmosphere_and_mood: >-
    A suspended beat carries memory; do not imply a past event or romantic scene absent from the
    prompt.
  rendering_and_quality: >-
    Apply the pause treatment to any subject without adding a postcard border, text, character or
    scene. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Held-beat freeze; bold silhouette; poster-value grouping; selective rim; subtle film grain.
  creative_brief: >-
    Apply this visual treatment to the requested content: Held-beat freeze; bold silhouette;
    poster-value grouping; selective rim; subtle film grain. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - muddy value blocks hiding the held silhouette
  - distant-plane detail competing with focal form
  - rim highlights clipping the contour
