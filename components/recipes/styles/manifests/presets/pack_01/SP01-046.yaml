visualDna:
  aesthetic: 'Classic black-and-white street photography: a 28–35 mm rangefinder at zone focus, catching the decisive instant when gesture and geometry line up.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: High-contrast monochrome, deep blacks and bright paper whites, few muted greys.
  lighting_and_shadow: Hard available sun or overcast; shadows used as black shapes in the composition.
  texture_and_material: Honest grain, real wear on clothes and walls, slight motion blur in feet or hands.
  camera_and_composition: Eye level or lower, subject off-center within layered depth, a leap, glance or crossing aligned with a line, stair or doorway.
  atmosphere_and_mood: Alert and fleeting, a small coincidence frozen before it dissolves back into the street.
  rendering_and_quality: Darkroom-print contrast and grain, not a posed portrait and not a gritty digital filter.
  key_features: decisive moment; high-contrast black and white; gesture aligned with geometry; 28–35 mm closeness; honest grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Street Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
