visualDna:
  aesthetic: >-
    Layered illustration suggests depth through separated planes and selective transmitted light,
    keeping the existing subject and scene intact.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use small value offsets to clarify
    existing forms without cutting the subject into arbitrary layers.
  color_and_tone: >-
    Keep the requested palette and color relationships. Let light pass affect only selected areas and
    do not add a glow or alter the overall color range.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Translate it into restrained local transmission
    and contact shadows without adding a backlight or light source.
  texture_and_material: >-
    Keep surfaces clean and use translucency only where the requested material supports it. Do not
    convert the image into an all-paper scene or add a global glow.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Layer cues do not create a tunnel,
    border, lettering or a new layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Selective light transmission is a rendering choice and does
    not change the depicted world.
  rendering_and_quality: >-
    Establish silhouette and major planes first, then add subtle offsets and light transmission where
    useful. Keep the subject clear without imposing a fixed depth arrangement.
avoidRules:
  - global screen glow or a tunnel effect
  - arbitrary cutout layers across every object and surface
  - unrequested frame, lettering or layout
