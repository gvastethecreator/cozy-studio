visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around small separated flecks and
    broken contourlets clustered beside existing motion or active edges, never forming a
    new subject. For color and surface, retain source hues with charcoal, ash,
    and a few cool pale particles as accents rather than a fixed black palette. A
    fugitive quality can be suggested by quick gaps and sparse marks; do not turn a calm
    or static request into a chase
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through small separated flecks and broken
    contourlets clustered beside existing motion or active edges, never forming a new
    subject; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain source hues with
    charcoal, ash, and a few cool pale particles as accents rather than a fixed black
    palette. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; let tiny edge glints appear
    only where the supplied lighting supports them, with no added luminous effect
    source. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use sparse matte pigment granulation, varying dot
    size and spacing while keeping the main silhouette continuous. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    pose, crop, and direction; place any particulate rhythm along the motion already
    present in the prompt. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. A fugitive quality can be suggested by
    quick gaps and sparse marks; do not turn a calm or static request into a chase.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and small separated flecks and broken
    contourlets clustered beside existing motion or active edges, never forming a new
    subject; keep focal edges crisp, texture controlled, and dark values legible. Avoid
    photoreal or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    small separated flecks and broken contourlets clustered beside existing motion or
    active edges, never forming a new subject; retain source hues with charcoal, ash,
    and a few cool pale particles as accents rather than a fixed black palette; let tiny
    edge glints appear only where the supplied lighting supports them, with no added
    luminous effect source; use sparse matte pigment granulation, varying dot size and
    spacing while keeping the main silhouette continuous; and preserve pose, crop, and
    direction; place any particulate rhythm along the motion already present in the
    prompt. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use small separated flecks and broken
    contourlets clustered beside existing motion or active edges, never forming a new
    subject, retain source hues with charcoal, ash, and a few cool pale particles as
    accents rather than a fixed black palette, let tiny edge glints appear only where
    the supplied lighting supports them, with no added luminous effect source, and use
    sparse matte pigment granulation, varying dot size and spacing while keeping the
    main silhouette continuous; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
