  aesthetic: 'Petropunk: the early oil boom as an alternate world of derricks, gushers, pipelines, refineries and oil-soaked frontier towns.'
  subject_treatment: Keep the prompt's subject and setting; surround it with derricks, pipelines and crude oil, glossy black on everything.
  color_and_tone: Glossy black crude, dusty ochre plains, rust and flare orange against pale sky.
  lighting_and_shadow: Harsh prairie sun and gas flare glow at night, glossy highlights on oil.
  texture_and_material: Wooden derricks, riveted tanks, pipelines, oil-soaked cloth and mud.
  camera_and_composition: Forests of derricks on the horizon and low angles under gushing wells.
  atmosphere_and_mood: Greedy and exhilarating, fortunes rising and falling with every new gusher.
  rendering_and_quality: Gritty period illustration with glossy oil and dusty atmosphere.
  creative_brief: "Petropunk: the early oil boom as an alternate world of derricks, gushers, pipelines, refineries and oil-soaked frontier towns. Carry it through wooden derricks, gushers, pipelines, flare glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
