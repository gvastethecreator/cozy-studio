visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around scuffed matte planes,
    chipped contour edges, and narrow abstract slices of light that clarify existing
    shapes. For color and surface, keep requested hues grounded in worn stone
    gray, dirty metal neutrals, and subdued earth accents. Procedural grit is a tactile
    finish, not a forced quest, danger, or low-light scene
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through scuffed matte planes, chipped
    contour edges, and narrow abstract slices of light that clarify existing shapes; use
    detail selectively and keep the actual form easy to read. Do not introduce an
    adventurer, gear, or adversary. Add no unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep requested hues grounded
    in worn stone gray, dirty metal neutrals, and subdued earth accents. Keep values
    legible across the prompted light and dark range; do not crush midtones or dim a
    bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use restrained
    practical-looking contrast only when compatible with the prompt; keep the prompt's
    light sources unchanged. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; apply sparse abrasion and rubbed pigment to
    compatible materials, preserving the material identity of everything else. Keep
    texture subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; hold the
    prompt's camera, subject count, and arrangement; this treatment never adds an
    adventurer. Use the mark rhythm inside the supplied composition rather than
    replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Procedural grit is a tactile finish, not a
    forced quest, danger, or low-light scene. Darkness and tension are optional tonal
    pressure, never a requirement to add danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and scuffed matte planes, chipped contour edges,
    and narrow abstract slices of light that clarify existing shapes; keep focal edges
    crisp, texture controlled, and dark values legible. Avoid photoreal or 3D-render
    drift, watermark, logo, and fake readable text.
  key_features: >-
    scuffed matte planes, chipped contour edges, and narrow abstract slices of light
    that clarify existing shapes; keep requested hues grounded in worn stone gray, dirty
    metal neutrals, and subdued earth accents; use restrained practical-looking contrast
    only when compatible with the prompt; keep the prompt's light sources unchanged;
    apply sparse abrasion and rubbed pigment to compatible materials, preserving the
    material identity of everything else; and hold the prompt's camera, subject count,
    and arrangement; this treatment never adds an adventurer. The five cues should read
    as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use scuffed matte planes, chipped contour
    edges, and narrow abstract slices of light that clarify existing shapes, keep
    requested hues grounded in worn stone gray, dirty metal neutrals, and subdued earth
    accents, use restrained practical-looking contrast only when compatible with the
    prompt; keep the prompt's light sources unchanged, and apply sparse abrasion and
    rubbed pigment to compatible materials, preserving the material identity of
    everything else; the prompt supplies all scene content. Do not add unrequested
    characters, objects, source-specific lore, readable symbols, or a default action.
