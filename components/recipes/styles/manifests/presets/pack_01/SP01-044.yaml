visualDna:
  aesthetic: 'Projector light: an image or pattern projected onto the subject and surroundings, wrapping across faces, bodies and walls.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Colors and shapes taken from the projected image, dark ambient otherwise.
  lighting_and_shadow: Single projector beam; pattern distorts over contours; the subject casts a shadow into the projection behind.
  texture_and_material: Pattern bends across skin, fabric and objects, revealing their shape.
  camera_and_composition: Keep requested framing; the projection must visibly wrap the subject.
  atmosphere_and_mood: Dreamlike and theatrical, the projected image and the body merging into one surface.
  rendering_and_quality: Sharp projection detail where in focus, dark clean surroundings.
  key_features: projected pattern wrapping contours; subject shadow in projection; single beam; dark ambient
  creative_brief: "Projector light: an image or pattern projected onto the subject and surroundings, wrapping across faces, bodies and walls. Carry it through projected pattern wrapping contours, subject shadow in projection, single beam, dark ambient. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
