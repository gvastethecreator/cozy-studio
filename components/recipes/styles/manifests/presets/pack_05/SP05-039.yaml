visualDna:
  aesthetic: 'Madhouse Hunter x Hunter anime look (2011): clean bright designs with sharp shonen eyes, vast adventure landscapes, strategic battles and sudden dark tension.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Togashi-derived Madhouse designs, spiky hair, clean sharp eyes, adventurer clothes and calm tactical expressions. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright adventure greens, sky blue and warm tan, turning into dark tension purples.
  lighting_and_shadow: Clear adventure daylight, then eerie aura glows in tense standoffs.
  texture_and_material: Clean digital cel with crisp outlines and painted wilderness backgrounds.
  camera_and_composition: Strategic standoff framing, vast landscapes and sudden close-ups on eyes.
  atmosphere_and_mood: Keep the requested mood with playful tactical tension.
  rendering_and_quality: Crisp 2011 Madhouse shonen frame with strategic intensity.
  key_features: Hunter x Hunter adventure; tactical standoffs; clean designs; aura tension
  creative_brief: "Madhouse Hunter x Hunter anime look (2011): clean bright designs with sharp shonen eyes, vast adventure landscapes, strategic battles and sudden dark tension. Carry it through Hunter x Hunter adventure, tactical standoffs, clean designs, aura tension. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
