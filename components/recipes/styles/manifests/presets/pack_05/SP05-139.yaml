visualDna:
  aesthetic: >-
    Build the graphic anime treatment from coarse angular contours supported by dense
    crosshatching and large forms reduced to stacked vertical masses and small scale cues. Let
    broken upward sweeps and abrupt directional turns set its rhythm; use muted olive, stone gray,
    and dark brown with a pale accent for color and dry hatch texture, light abrasion, and broad
    matte value planes for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use coarse angular contours supported by dense
    crosshatching for edge work, large forms reduced to stacked vertical masses and small scale
    cues for form simplification, and broken upward sweeps and abrupt directional turns only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with muted olive, stone gray, and dark brown with a pale accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hazy value gradations cut by hard silhouette shadows. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with dry hatch texture, light abrasion, and broad matte value planes,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use vertical scale contrast and compressed depth bands
    within the supplied framing to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey bleak urgency and strained endurance, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with crosshatched shadow, compressed scale, and clear silhouettes without microtexture;
    keep detail selective and accents attached to existing forms.
  key_features: >-
    coarse angular contours supported by dense crosshatching; large forms reduced to stacked
    vertical masses and small scale cues; muted olive, stone gray, and dark brown with a pale
    accent; broken upward sweeps and abrupt directional turns; dry hatch texture, light abrasion,
    and broad matte value planes; vertical scale contrast and compressed depth bands within the
    supplied framing.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with coarse angular
    contours supported by dense crosshatching, large forms reduced to stacked vertical masses and
    small scale cues, and muted olive, stone gray, and dark brown with a pale accent; use broken
    upward sweeps and abrupt directional turns only where movement is already present, and apply
    dry hatch texture, light abrasion, and broad matte value planes as the drawing finish.
