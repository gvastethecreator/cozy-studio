visualDna:
  aesthetic: 'AFM topography: a nanoscale surface shown as a 3D height map with a gold-brown color ramp.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: rendered as a height map: hills and pits from nanoscale scanning, with scan lines."
  color_and_tone: Gold-brown height ramp, exactly as the instrument maps its signal.
  lighting_and_shadow: Virtual side light on height map, because the image shows signal, not ordinary light.
  texture_and_material: Scan lines and artifacts, as real instrument artifacts rather than decoration.
  camera_and_composition: Oblique 3D height view, matching how this instrument actually frames data.
  atmosphere_and_mood: Precise, alien, tiny and strange, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "AFM topography: a nanoscale surface shown as a 3D height map with a gold-brown color ramp. Carry it through height map, scan lines, gold ramp. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
