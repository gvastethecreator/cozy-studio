visualDna:
  aesthetic: 'Candlelit low-light cinema: scenes lit only by real candles, shot with extremely fast lenses so the frame glows warm and focus is razor thin.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Deep amber and gold, velvety brown-black, flesh glowing like old paintings.
  lighting_and_shadow: Many candles as the only sources, soft falloff within a meter, flickering warm modeling.
  texture_and_material: Wax, powdered wigs, silk, glassware and wood glowing warmly.
  camera_and_composition: Keep the requested framing; very shallow focus, candles visible in frame.
  atmosphere_and_mood: Intimate and painterly, a period room breathing in candlelight.
  rendering_and_quality: Ultra-fast-lens film look with soft focus falloff; no electric light.
  key_features: candles as only light; ultra-fast-lens shallow focus; amber glow; painterly faces; velvety dark
  creative_brief: "Candlelit low-light cinema: scenes lit only by real candles, shot with extremely fast lenses so the frame glows warm and focus is razor thin. Carry it through candles as only light, ultra-fast-lens shallow focus, amber glow, painterly faces, velvety dark. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
