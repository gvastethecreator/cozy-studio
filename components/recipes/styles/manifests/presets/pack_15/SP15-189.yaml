visualDna:
  aesthetic: 'Glowpunk: a world lit by living light, with bioluminescent streetlights, glowing tattoos of algae, jellyfish lanterns and mushroom-lit homes.'
  subject_treatment: Keep the prompt's subject and setting; light it only with living bioluminescence from creatures, plants and fungi.
  color_and_tone: Deep night blues and blacks with cyan, green and magenta living glows.
  lighting_and_shadow: Soft bioluminescent glows as the only light, pools of color in darkness.
  texture_and_material: Glowing jellyfish, fungi, algae, fireflies and glass jars of living light.
  camera_and_composition: Dark scenes where glowing organisms outline the shapes of everything.
  atmosphere_and_mood: Magical and quiet, a night that is never truly dark.
  rendering_and_quality: Luminous low-key illustration with soft living light glows.
  creative_brief: "Glowpunk: a world lit by living light, with bioluminescent streetlights, glowing tattoos of algae, jellyfish lanterns and mushroom-lit homes. Carry it through living light, jellyfish lanterns, glowing fungi, dark night. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: living light; jellyfish lanterns; glowing fungi; dark night
