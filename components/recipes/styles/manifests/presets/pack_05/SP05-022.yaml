visualDna:
  aesthetic: 'Fashion-plate supernatural anime: elongated slender figures in fine variable contours with deliberate gaps, set against stark black-white divisions and large blank ivory space.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Monochrome black and ivory with a single restrained violet accent.
  lighting_and_shadow: Severe cel shadows and a narrow violet-white rim; backgrounds often dropped to flat light.
  texture_and_material: Matte dark fields offset by translucent ink-like bands.
  camera_and_composition: Keep the requested framing; vertical balance, wide negative space and one curving visual path.
  atmosphere_and_mood: Cool composure with latent tension, elegance held like a breath before moving.
  rendering_and_quality: Precise contours, sharp value blocks and very few luminous accents.
  key_features: elongated fashion-plate proportions; blank ivory negative space; stark black-white division; single violet accent; fine gapped contour
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Urban Spirit Blade as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
