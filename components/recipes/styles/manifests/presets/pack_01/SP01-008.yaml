visualDna:
  aesthetic: 'In-camera double exposure portrait: a clean profile silhouette filled with a second image — landscape, texture, or scene — blended through the bright areas of the first.'
  subject_treatment: Use a strong profile or three-quarter head as the container; the secondary image fills the shape while the outline and a few facial features stay readable.
  color_and_tone: Soft, airy base with the secondary image in muted or monochrome tones; white or pale backgrounds let the blend breathe.
  lighting_and_shadow: Portrait lit high-key against white so dark areas accept the second image; secondary scene keeps its own natural light.
  texture_and_material: Organic overlaps — branches, mountains, water, crowds — dissolving into skin and hair with smooth transitions.
  camera_and_composition: Profile placed to one side, the second image aligned so its focal point sits inside the head, clean negative space around.
  atmosphere_and_mood: Dreamlike, reflective, and symbolic.
  rendering_and_quality: Seamless photographic blend without cut-out edges or collage seams.
  creative_brief: "In-camera double exposure portrait: a clean profile silhouette filled with a second image — landscape, texture, or scene — blended through the bright areas of the first. Carry it through profile as container, second image inside the silhouette, white negative space, seamless blend, symbolic pairing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: profile as container; second image inside the silhouette; white negative space; seamless blend; symbolic pairing
