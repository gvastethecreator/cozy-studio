visualDna:
  aesthetic: 'Pinpricked paper light: a picture made by piercing thousands of tiny holes through paper, seen glowing when held against light or as raised dots in side light.'
  subject_treatment: Render the prompt's subject as patterns of tiny pierced holes, denser in bright areas, keeping its outline and form readable.
  color_and_tone: Cream or dark paper with glowing warm points of light where it is pierced.
  lighting_and_shadow: Backlight shining through the holes, or raking light catching raised burrs around them.
  texture_and_material: Tiny round holes of varied size, raised paper burrs and slightly yellowed old paper.
  camera_and_composition: The sheet held against a window or lamp, the subject glowing as dotted light.
  atmosphere_and_mood: Delicate, magical and old-fashioned, like a candlelit keepsake.
  rendering_and_quality: Precise pierced dot patterns glowing through paper, never painted dots.
  creative_brief: "Pinpricked paper light: a picture made by piercing thousands of tiny holes through paper, seen glowing when held against light or as raised dots in side light. Carry it through thousands of pierced holes, glowing backlight, raised burrs, old paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thousands of pierced holes; glowing backlight; raised burrs; old paper
