visualDna:
  aesthetic: 'Narrative keyframe: a polished cinematic painting of one turning-point moment, composed and lit like a single film frame.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a widescreen letterboxed film frame that stages the subject at its decisive story moment, and that layout replaces the requested framing.
  color_and_tone: Graded palette with one clear color story, such as teal shadows against a single warm story accent, contrast peaking at the emotional focus.
  lighting_and_shadow: Motivated dramatic light such as fire, lightning or a shaft through a breach, pointing at the story beat while deep shadows stay simple.
  texture_and_material: Painterly but resolved surfaces, with embers, dust or rain particles adding depth between planes.
  camera_and_composition: Widescreen cinematic framing with letterbox proportions, foreground occluders and the focal figure placed on a third.
  atmosphere_and_mood: Charged and decisive, the instant before everything changes.
  rendering_and_quality: Near-final painting quality at the focal point, softened background, film-like depth and grade.
  key_features: widescreen letterbox frame; one turning-point moment; motivated dramatic light; foreground occluders; graded color story
  creative_brief: "Narrative keyframe: a polished cinematic painting of one turning-point moment, composed and lit like a single film frame. Carry it through widescreen letterbox frame, one turning-point moment, motivated dramatic light, foreground occluders, graded color story. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
