visualDna:
  aesthetic: 'Eccentric Repeat Canopies: branching motifs at three scales hide the repeat through asymmetric links and irregular open spaces.'
  subject_treatment: Build a repeating surface from the prompt's subject as branching motifs at three scales, linked asymmetrically across the tile edges so the repeat disappears.
  color_and_tone: Two value families for structure and secondary motifs, with sparse, scattered accents.
  lighting_and_shadow: Flat printed artwork with every motif sitting on one plane.
  texture_and_material: Controlled organic contours and clean reserves with a quiet, even edge.
  camera_and_composition: Off-center focal points, branch entries matching exits on the opposite edge.
  atmosphere_and_mood: Continuous expansion with irregular pauses, lush but never crowded.
  rendering_and_quality: Clean repeat shown as tile and wide mosaic with complete motifs.
  creative_brief: "Eccentric Repeat Canopies: branching motifs at three scales hide the repeat through asymmetric links and irregular open spaces. Carry it through three-scale branches, hidden repeat, asymmetric links, irregular pauses. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three-scale branches; hidden repeat; asymmetric links; irregular pauses
