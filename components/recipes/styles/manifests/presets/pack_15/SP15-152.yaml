visualDna:
  aesthetic: 'Capsulepunk: people living in stacked capsule pods, micro-apartments and sleeping walls, making whole lives inside tiny glowing boxes.'
  subject_treatment: Keep the prompt's subject and setting; compress it into stacked pods and tiny rooms, with personal clutter filling every inch.
  color_and_tone: Plastic white and pale grey pods with warm personal lights and colorful clutter.
  lighting_and_shadow: Rows of small pod lights, each a different color, in a dark corridor wall.
  texture_and_material: Molded plastic pods, curtains, ladders, sticky notes and tiny appliances.
  camera_and_composition: Grid walls of pods seen head-on and cramped interiors from inside.
  atmosphere_and_mood: Cramped and tender, big lives squeezed into small glowing boxes.
  rendering_and_quality: Detailed illustration with a grid of individual lit pods.
  creative_brief: "Capsulepunk: people living in stacked capsule pods, micro-apartments and sleeping walls, making whole lives inside tiny glowing boxes. Carry it through stacked pods, tiny lit interiors, ladders, personal clutter. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked pods; tiny lit interiors; ladders; personal clutter
