visualDna:
  aesthetic: '70s space opera: practical-effects science fiction with kitbashed model starships, optical composites and a worn, lived-in future.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Worn ochre, grey panel, dusty olive and beige, with glowing engine blues and blaster reds.
  lighting_and_shadow: Hard single-source light on models, backlit smoke in hangars, twin-sun desert light.
  texture_and_material: Greebled model surfaces, scratched paint, oil stains, weathered flight suits.
  camera_and_composition: Model ships passing close to the lens, wide desert or hangar vistas, optical glow around engines.
  atmosphere_and_mood: Adventurous and scrappy, a used universe full of possibility.
  rendering_and_quality: Film grain and slight optical-composite matte lines; no franchise ships or costumes.
  key_features: kitbashed model ships; used-future weathering; optical composite glow; backlit hangar smoke; film grain
  creative_brief: "70s space opera: practical-effects science fiction with kitbashed model starships, optical composites and a worn, lived-in future. Carry it through kitbashed model ships, used-future weathering, optical composite glow, backlit hangar smoke, film grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
