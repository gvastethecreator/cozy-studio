visualDna:
  aesthetic: 'Split slate: dark layered stone that cleaves into thin sheets with sharp, stepped edges.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is built from split slate sheets or carved slate showing layered cleavage."
  color_and_tone: Blue-grey, charcoal and green-grey with rust stains, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Overcast light showing the stepped layers, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Cleaved slate sheets with sharp edges and rough riven faces.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Austere, cold, rugged and old, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: split slate sheets; stepped cleavage; riven faces; blue-grey
  creative_brief: "Split slate: dark layered stone that cleaves into thin sheets with sharp, stepped edges. Carry it through split slate sheets, stepped cleavage, riven faces, blue-grey. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
