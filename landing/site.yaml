preview:
  variant: walkthrough
  navLabel: How it works
  kicker: How it works
  title: From idea to picture in three steps.
  image: { src: assets/create.webp, light: assets/create-light.webp, alt: Cozy Studio with a paper collage style, a prompt and the finished picture }
  steps:
    - title: Describe it
      body: Plain words, and a reference picture if you like.
      x: 12.5
      y: 31
      radius: 11
      image: { src: assets/screens/step-describe.webp, light: assets/screens/step-describe-light.webp, alt: "Create: the prompt is written and nothing is generated yet" }
    - title: Pick a style (or skip this step)
      body: Film, paint, anime, print, pixel art.
      x: 9.5
      y: 44
      radius: 12
      image: { src: assets/screens/step-style.webp, light: assets/screens/step-style-light.webp, alt: "Style explorer: a paper collage style picked" }
    - title: Generate and keep it
      body: Every picture lands in your library and in the folder you choose.
      x: 62
      y: 46
      radius: 26
      image: { src: assets/create.webp, light: assets/create-light.webp, alt: "Create: the finished picture, a patchwork whale in paper collage" }

skill:
  variant: handoff
  navLabel: Agents
  kicker: Agent-ready
  title: Already using a coding agent?
  accent: coding agent?
  lede: Paste this. It installs Cozy Studio and makes your first picture.
  prompt: Set up Cozy Studio from github.com/gvastethecreator/cozy-studio, then make me a giant black cat over a city as a stained glass window.
  agents: [Codex, Claude Code, Cursor]
  steps:
    - { kind: read, text: Reads AGENTS.md and the setup skill, note: The repo tells the agent how to set it up, output: "setup plan: 4 commands" }
    - { kind: run, text: bun install, note: Installs what the app needs, output: "✓ dependencies installed" }
    - { kind: run, text: "bun run studio:onboard --setup", note: Checks your setup and asks before changing anything, output: "✓ ready to set up" }
    - { kind: run, text: bun run studio:init, note: Creates your library and settings, output: "✓ library created" }
    - { kind: run, text: bun run dev, note: Starts Cozy Studio, output: "➜ running at localhost:17222" }
    - { kind: you, text: Sign in to ChatGPT in Settings, note: The one step that stays with you, output: "✓ signed in" }
    - { kind: make, text: Makes the picture with ChatGPT, note: Uses the style and the prompt you gave it, output: "✓ 1 picture · stained glass" }
  result:
    src: assets/deck/cat-harry-clarke.webp
    alt: A giant black cat and a city as a jewel-toned stained glass window
    caption: Pictures/Cozy Studio/2026-09-29_harry-clarke_giant-black-cat-taller-than-skyscrapers.png


setup:
  variant: script
  navLabel: Install
  kicker: Install
  title: Install Cozy Studio.
  lede: Free and open source. Needs Git and Bun.
  items:
    - { command: "git clone https://github.com/gvastethecreator/cozy-studio", note: Downloads the code, output: "Cloning into 'cozy-studio'… done." }
    - { command: cd cozy-studio, note: Opens the folder }
    - { command: bun install, note: Installs dependencies, output: "✓ dependencies installed" }
    - { command: "bun run studio:onboard --setup", note: Checks what is missing, output: "✓ ready to set up" }
    - { command: "bun run studio:init", note: Creates your library, output: "✓ library created" }
    - { command: bun run dev, note: Starts the app, output: "➜ Cozy Studio is running at localhost:17222" }
  verification: open localhost:17222 and sign in from Settings

faq:
  navLabel: FAQ
  kicker: Before you start
  title: Good to know.
  items:
    - question: What is free?
      answer: Cozy Studio is free and open source under the MIT license. Making images goes through your provider account, so its plan, limits and terms still apply.
    - question: What stays on my computer?
      answer: The app, your library, your settings and every picture you keep. When you generate, the prompt and any reference pictures go to the provider you picked.
    - question: Which account do I need?
      answer: A ChatGPT account is the easiest start. Codex, Grok and Antigravity sign-ins work too, and Google works with an API key.
    - question: Does it run on my computer?
      answer: Windows and macOS, with Git, Bun and a browser. Linux is best effort.
    - question: Where do I get help?
      answer: The troubleshooting guide in the repository covers the usual problems. For anything else, open an issue on GitHub.

