  aesthetic: 'Ink-and-Color Notation: sober ink lines and small coded patches of color separate observation, action and grouping like a working notebook.'
  subject_treatment: Draw the prompt's explanation in sober ink with small color patches coding function, the same function keeping one color and symbol; keep labels exact.
  color_and_tone: Dark ink on a warm ground with two accents of declared meaning.
  lighting_and_shadow: Flat page where white reserves separate information clearly.
  texture_and_material: A slightly human stroke with exact anchors and no stray marks on data.
  camera_and_composition: Figure, steps and notes in aligned groups, accents only at action points.
  atmosphere_and_mood: The clarity of a working notebook, intentional and close.
  rendering_and_quality: Crisp notation with legible lines and uniform numerals.
  creative_brief: "Ink-and-Color Notation: sober ink lines and small coded patches of color separate observation, action and grouping like a working notebook. Carry it through ink lines, coded color patches, working notebook, exact anchors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
