visualDna:
  aesthetic: 'Boudoir photography: an intimate, respectful adult portrait in a private interior, sensual through light, fabric and mood rather than exposure.'
  subject_treatment: Adult subject relaxed and in control, draped fabric, lingerie, robes or oversized shirts; pose emphasizes confidence and personal comfort.
  color_and_tone: Warm dark interiors, deep reds, wine and amber, soft skin glow.
  lighting_and_shadow: Soft window or single warm lamp from the side, deep gentle shadows, highlight along shoulders and hair.
  texture_and_material: Silk, lace, velvet, rumpled linen and warm skin rendered tactile.
  camera_and_composition: Close to medium framing, shallow depth, layered foreground fabric or curtains.
  atmosphere_and_mood: Intimate, confident, private, and warm.
  rendering_and_quality: Tasteful fine-art finish, no explicit nudity.
  key_features: warm side window light; draped fabric; deep wine tones; confident adult pose; tasteful intimacy
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Boudoir Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
