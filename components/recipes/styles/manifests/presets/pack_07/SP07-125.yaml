  color_and_tone: Painted resin colors softened by water, white flakes, dark lacquered wood or black base; a cold blue cast inside.
  lighting_and_shadow: Soft window light with a bright curved highlight across the dome and a glow where light pools in the water.
  texture_and_material: Spherical glass refraction magnifying the center, suspended glitter-flakes, tiny air bubble at the top, glossy painted resin.
  camera_and_composition: The whole dome and base visible and centered on a surface; the subject is contained within the sphere.
  atmosphere_and_mood: Hushed, wintry and nostalgic, a small world shaken and settling.
