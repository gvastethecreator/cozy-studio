visualDna:
  aesthetic: 'Carved Wedge Capitals: wide wedges and cuts shape stems and serifs into weighty capitals with clear masses and counters.'
  subject_treatment: Letter the requested words in capitals built from broad wedges and cuts that keep masses and counters clear, every character and accent exact.
  color_and_tone: One solid ink with strong, clean contrast between figure and ground.
  lighting_and_shadow: Flat graphic capitals, their depth implied only by the cut shapes.
  texture_and_material: Clean carved-looking edges and serifs of controlled scale.
  camera_and_composition: Capitals of related widths with spacing rhythm and balanced diagonals.
  atmosphere_and_mood: Gravity and cutting precision, solemn in weight yet clearly modern.
  rendering_and_quality: Crisp lettering where every wedge adds direction and structure.
  creative_brief: "Carved Wedge Capitals: wide wedges and cuts shape stems and serifs into weighty capitals with clear masses and counters. Carry it through wedge serifs, broad cuts, weighty capitals, clear counters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: wedge serifs; broad cuts; weighty capitals; clear counters
