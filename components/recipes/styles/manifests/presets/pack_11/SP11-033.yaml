visualDna:
  aesthetic: 'Faded workshop blueprint: a real, used blueprint sheet photographed on a workbench, sun-faded, creased and marked up.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: drawn as white lines on a faded, creased blueprint that has been used for years: pencil marks, pin holes, stains and torn corners."
  color_and_tone: Sun-faded cyan and grey-blue with white lines and brown stains.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Diazo paper, creases, coffee rings, pencil smudges and tape.
  camera_and_composition: Sheet pinned or weighted on a workbench with tools at the edges.
  atmosphere_and_mood: Worn, practical, nostalgic and hands-on, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  key_features: faded diazo sheet; creases; stains; pencil markups; workbench
  creative_brief: "Faded workshop blueprint: a real, used blueprint sheet photographed on a workbench, sun-faded, creased and marked up. Carry it through faded diazo sheet, creases, stains, pencil markups, workbench. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
