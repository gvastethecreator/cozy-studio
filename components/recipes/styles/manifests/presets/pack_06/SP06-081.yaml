visualDna:
  aesthetic: Unlit reflective handheld LCD at about 160 by 144 pixels, drawn with exactly four shades of olive green on 8 by 8 tiles.
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: 'Four fixed values only: near-black moss, dark olive, pea green and pale lime; midtones faked with checkerboard dither.'
  lighting_and_shadow: Light is expressed only as value steps; the screen itself is unlit, flat and slightly murky.
  texture_and_material: Faint pixel-gap grid, soft ghosting trail behind moving shapes, one-pixel dark outlines and a dusty plastic sheen.
  camera_and_composition: Keep the requested view; subject silhouettes simplified to read on a tiny screen with large flat background tiles.
  atmosphere_and_mood: Quiet and portable, a small glowing-green world held in the hands.
  rendering_and_quality: Hard square pixels with no anti-aliasing and no fifth color; tile repetition allowed in backgrounds.
  key_features: four olive-green shades; 8x8 tiles; checkerboard dither; pixel-gap grid; LCD ghosting
  creative_brief: "Unlit reflective handheld LCD at about 160 by 144 pixels, drawn with exactly four shades of olive green on 8 by 8 tiles. Carry it through four olive-green shades, 8x8 tiles, checkerboard dither, pixel-gap grid, LCD ghosting. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
