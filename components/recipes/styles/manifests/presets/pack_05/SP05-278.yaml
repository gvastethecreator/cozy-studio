visualDna:
  aesthetic: 'Studio Orange Land of the Lustrous look (2017): cel-shaded 3D gem people with translucent crystal hair and bodies, refracted rainbow light, cracks and chips, and lonely seaside meadows.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures as translucent gem-bodied people with crystal hair, faceted refractive skin and hairline cracks that glint with light. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Mineral mint, peridot green, sapphire blue, pale gold and refracted rainbow edges on white grass.
  lighting_and_shadow: Bright seaside daylight refracting through crystal bodies into scattered rainbow caustics on the grass.
  texture_and_material: Cel-shaded 3D surfaces with gemstone facets, translucent refraction, cracks and powdery chips.
  camera_and_composition: Sweeping cel-shaded CG camera moves across meadows and slow tragic close-ups of cracking crystal.
  atmosphere_and_mood: Keep the requested mood with luminous mineral loneliness.
  rendering_and_quality: Polished cel-shaded 3D television frame with gemstone translucency and refraction.
  key_features: Translucent gem bodies; refracted rainbow light; cracks and chips; lonely meadows
  creative_brief: "Studio Orange Land of the Lustrous look (2017): cel-shaded 3D gem people with translucent crystal hair and bodies, refracted rainbow light, cracks and chips, and lonely seaside meadows. Carry it through Translucent gem bodies, refracted rainbow light, cracks and chips, lonely meadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
