visualDna:
  aesthetic: Compact, forceful military-fantasy anime cel with swept diagonals, crisp silhouettes and clipped high-key contrast, drawn like a newsreel still.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Compress shapes where motion is present; add no aircraft, gear, flags or insignia.
  color_and_tone: Muted khaki, field grey and deep blue-grey with clean pale highlights, a disciplined limited range.
  lighting_and_shadow: Hard overcast-sky light with short shadow breaks and a bright sky behind dark compact silhouettes.
  texture_and_material: Crisp filled shapes, restrained metallic glints and a trace of painted grain.
  camera_and_composition: Keep the requested view; steep diagonal horizons and directional overlap group the silhouettes.
  atmosphere_and_mood: Tense, disciplined and precise, a held breath before orders.
  rendering_and_quality: Economical detail, stable contours and strong contrast without overloading the image.
  key_features: swept diagonals; khaki and field grey; clipped high-key sky; compact silhouettes; newsreel-still stillness
  creative_brief: "Compact, forceful military-fantasy anime cel with swept diagonals, crisp silhouettes and clipped high-key contrast, drawn like a newsreel still. Carry it through swept diagonals, khaki and field grey, clipped high-key sky, compact silhouettes, newsreel-still stillness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
