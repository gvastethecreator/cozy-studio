visualDna:
  aesthetic: 'Papercraft animation: folded and cut paper models animated in stop motion, with creases, thickness and soft paper shadows.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Soft matte paper colors, pastel and earthy tones, white paper highlights.
  lighting_and_shadow: Soft directional light revealing folds, crease shadows and paper translucency.
  texture_and_material: Folds, creases, visible paper thickness and slight fiber texture.
  camera_and_composition: Miniature diorama framing with shallow depth of field.
  atmosphere_and_mood: Delicate and whimsical, a world folded by hand.
  rendering_and_quality: Tactile papercraft finish; not flat drawing and not smooth CG.
  key_features: folded paper models; crease shadows; visible paper thickness; soft directional light; diorama depth
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Papercraft Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - drawn line art
  - smooth 3d
  - drawn
  - 3d
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - watermark
  - logo clutter
  - generic stock footage
  - uncontrolled noise
  - random cartoon face
  - unreadable motion smear
  - fake subtitles
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
