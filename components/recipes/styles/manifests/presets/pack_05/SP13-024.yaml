visualDna:
  aesthetic: 'Tatsuyuki Tanaka sakuga and illustration as in his Akira-era key animation: meticulous mechanical weight, precise detailed impact, heavy believable mass and dense controlled effects.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with precise weighty anatomy and heavy believable tools, every impact showing real mass. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Warm forge oranges, iron greys and precise bright highlights on metal.
  lighting_and_shadow: Hot glowing impact light and hard realistic shadows around heavy objects.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Heavy low angles on the moment of impact with detailed sparks and debris.
  atmosphere_and_mood: Keep the requested mood with monumental weighty impact.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  key_features: Tatsuyuki Tanaka weight; precise impact; heavy mass; detailed sparks
  creative_brief: "Tatsuyuki Tanaka sakuga and illustration as in his Akira-era key animation: meticulous mechanical weight, precise detailed impact, heavy believable mass and dense controlled effects. Carry it through Tatsuyuki Tanaka weight, precise impact, heavy mass, detailed sparks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
