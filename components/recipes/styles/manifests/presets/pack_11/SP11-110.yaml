visualDna:
  aesthetic: 'Event camera: only changing pixels appear, as scattered colored dots along moving edges on a black or grey field.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: reduced to scattered brightness-change events along moving edges: red for darker, blue or green for brighter, still areas empty."
  color_and_tone: Red and blue events on black or mid grey.
  lighting_and_shadow: No light; only change is recorded, because the image shows signal, not ordinary light.
  texture_and_material: Sparse dots, motion trails and noise speckles, as real instrument artifacts rather than decoration.
  camera_and_composition: Fixed sensor view of a moving scene, matching how this instrument actually frames data.
  atmosphere_and_mood: Ghostly, kinetic, abstract and technical, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Event camera: only changing pixels appear, as scattered colored dots along moving edges on a black or grey field. Carry it through sparse events, moving edges only, red and blue dots. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sparse events; moving edges only; red and blue dots
