visualDna:
  aesthetic: 'Akihito Tsukushi Made in Abyss manga look: cute round simple characters in astonishingly detailed lush vertical abyss landscapes, strange creatures and a heavy toll of wonder.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw only adults with round simple designs, big eyes and explorer gear, dwarfed by detailed landscapes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Lush greens, abyssal blues, warm earth and glowing mineral light.
  lighting_and_shadow: Soft glowing abyss light and filtered sunlight from above.
  texture_and_material: Astonishingly detailed pen landscapes paired with simple round character line.
  camera_and_composition: Vertical abyss panoramas with tiny explorers on ropes and ledges.
  atmosphere_and_mood: Keep the requested mood with lush perilous wonder.
  rendering_and_quality: Detailed lush adventure manga illustration with perilous wonder.
  key_features: Akihito Tsukushi abyss; round simple characters; detailed landscapes; wonder
  creative_brief: "Akihito Tsukushi Made in Abyss manga look: cute round simple characters in astonishingly detailed lush vertical abyss landscapes, strange creatures and a heavy toll of wonder. Carry it through Akihito Tsukushi abyss, round simple characters, detailed landscapes, wonder. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
