visualDna:
  aesthetic: 'Raycast corridor render: early first-person maze graphics where walls are vertical textured slices, floors and ceilings are flat colors and every room is a right-angle grid.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; place the subject in a right-angle maze of vertical textured wall slices.
  color_and_tone: Flat grey floor and ceiling, textured walls in muted colors.
  lighting_and_shadow: Alternating wall brightness for faces of the grid.
  texture_and_material: Stretched pixel wall textures and flat untextured floors.
  camera_and_composition: Eye-level first-person corridor on a grid, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with tense maze claustrophobia.
  rendering_and_quality: Authentic early raycast look without modern effects, kept consistent across the whole image.
  creative_brief: "Raycast corridor render: early first-person maze graphics where walls are vertical textured slices, floors and ceilings are flat colors and every room is a right-angle grid. Carry it through vertical wall slices, flat floors, right-angle maze, eye level. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: vertical wall slices; flat floors; right-angle maze; eye level
