visualDna:
  aesthetic: 'Gum bichromate layers: a photographic print built from several brushed layers of pigmented gum, each exposed and washed, giving soft painterly color separations.'
  subject_treatment: Show the prompt's subject as a layered pigment photograph, keeping its forms while each color layer sits slightly apart with brushy edges.
  color_and_tone: Muted pigment layers such as terracotta, slate blue and olive, overlapping into soft secondary colors.
  lighting_and_shadow: Photographic light softened into broad tonal masses, highlights washed clean and shadows built from stacked pigment.
  texture_and_material: Brushed gum streaks, pigment granulation, soft washed-out edges and slightly misaligned color layers on watercolor paper.
  camera_and_composition: Pictorial framing with soft focus falloff and a painterly border where the brushed coating stops.
  atmosphere_and_mood: Dreamy, handmade and nostalgic, part photograph and part painting.
  rendering_and_quality: Authentic layered pigment print with brush marks and soft registration, never crisp digital color.
  creative_brief: "Gum bichromate layers: a photographic print built from several brushed layers of pigmented gum, each exposed and washed, giving soft painterly color separations. Carry it through stacked pigment layers, brushed coating edges, soft misregistration, watercolor paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked pigment layers; brushed coating edges; soft misregistration; watercolor paper
