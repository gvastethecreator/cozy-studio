visualDna:
  aesthetic: 'Poché section drawing: the subject sliced vertically, cut walls and floors filled solid black, everything beyond drawn in thin elevation line.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a vertical architectural section through the subject with cut walls filled solid black, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Solid black poché, fine black line, hatched earth and one pale wash for sky or water.
  lighting_and_shadow: No light modeling; the contrast between black cut mass and thin lines creates all depth.
  texture_and_material: Ruled hairlines, earth hatching below grade, tiny scale figures and furniture in outline.
  camera_and_composition: Orthographic vertical section across the full width of the sheet, a clear ground line and small human figures for scale.
  atmosphere_and_mood: Revealing and architectural, the inside of a building laid bare.
  rendering_and_quality: Crisp drafted line with confident black fill, no perspective and no room labels.
  creative_brief: "Poché section drawing: the subject sliced vertically, cut walls and floors filled solid black, everything beyond drawn in thin elevation line. Carry it through solid black cut walls, thin beyond-elevation line, hatched earth, tiny scale figures, orthographic section. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: solid black cut walls; thin beyond-elevation line; hatched earth; tiny scale figures; orthographic section
