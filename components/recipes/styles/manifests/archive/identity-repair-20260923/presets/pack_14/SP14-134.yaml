visualDna:
  aesthetic: >-
    Broken strokes and compact irregular dots alternate with uninterrupted color shapes. Their spacing
    and scale create a syncopated visual rhythm rather than an all-over pattern.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Retain requested hues; place the strongest contrast in a few clusters and allow quieter midtone
    intervals between them.
  lighting_and_shadow: >-
    Build requested light and shade by varying mark density while keeping the overall value groups
    stable.
  texture_and_material: >-
    Use dry opaque marks only where they describe existing form. Preserve requested material differences;
    do not add beadwork, markings or ornament to the subject.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Follow the direction of existing contours
    with varied mark groups, without adding a circular ceremony or decorative frame.
  atmosphere_and_mood: >-
    Alert and rhythmically energetic, with alternating pressure and rest; no prescribed ceremony or
    emotional narrative.
  rendering_and_quality: >-
    Keep strokes large enough to read and group them intentionally. Avoid uniform stipple and confetti
    spread.
avoidRules:
  - uniform dot fields
  - invented body markings
  - symbolic or ceremonial props
