visualDna:
  aesthetic: >-
    Rubber-Hose Insanity acts as a transferable cinematic-media router: start from 1930s rubber-hose
    cartoon pushed to mania, spaghetti-like curves, accordion compression, pure kinetic anarchy,
    Fleischer on amphetamines, Cuphead nightmare mode, Rubber-hose curves, no-joint elasticity,
    pie-cut graphic accents, accordion compression, impact smears and caricature and cartoon system
    built from exaggeration rules, line instability, body-shape grammar, adult-comedy timing,
    texture economy, and expressive deformation, then apply the media behavior to prompt X instead
    of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Noodle-thin bouncing outlines, squash-and-stretch taken
    beyond breaking point, elastic deformation extremes; preserve the requested subject while
    exaggerating proportion, contour, posture, line boil, paper crudeness, photo-cutout menace, or
    gross-up detail according to the preset, keeping the requested identity, silhouette, action,
    object function, or setting legible.
  color_and_tone: >-
    Build color with Vintage cel paint, off-registration cyan bleed, nicotine-stain sepia, fading
    technicolor, ink-smear black; use color through loud primaries, beige suburban anxiety, marker
    flats, mucus greens, toxic classroom tints, comic newspaper color, or deliberately ugly palette
    pressure, with deliberate value grouping, accent control, and process-specific limits rather
    than generic color wash.
  lighting_and_shadow: >-
    Handle light through Nonexistent lighting logic, flat cel shading, occasional shadow blob where
    foot touches ground; shape light minimally through flat cartoon value, poster contrast, marker
    fill, gross-up close value, or uncanny cutout shadow when the style requires it, so exposure and
    shadow structure support the media process without overwriting the requested content.
  texture_and_material: >-
    Render 16mm film grain, cel paint brush strokes visible, dust-scratched negative, old-reel
    flicker; surface detail should reveal crayon, marker edge, newspaper ink, xerox cutout, squiggle
    line, doodle grain, crude fill, or close-up texture without becoming noisy realism, keeping
    artifact scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Forms knotting like elastic tubes, torso-like mass compression,
    infinite stretch, detached motion accents; compose through readable gag timing, grotesque
    close-up, slouch geometry, shared-body elongation, suburban emptiness, or crash-zoom pressure
    without copying a named scene, with frame rhythm, spacing, edge hierarchy, and visual hierarchy
    doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Frenzied, hysterical, pure kinetic madness, cartoon physics unleashed; derive mood
    from adult absurdity, nervous comedy, ugly-cute tension, gross humor, office boredom, toxic
    suburbia, or anti-polish personality, letting the media style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Vintage rubber-hose chaos, golden-age bounciness amplified tenfold, classic cartoon
    on fast-forward; finish with clear cartoon grammar, bold silhouettes, controlled roughness, and
    no exact character likeness, school-scene lock, readable gag text, or generic cute mascot, clean
    denoised surfaces where appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    1930s rubber-hose cartoon pushed to mania, spaghetti-like curves, accordion compression, pure
    kinetic anarchy, Fleischer on amphetamines, Cuphead nightmare mode; Rubber-hose curves, no-joint
    elasticity, pie-cut graphic accents, accordion compression, impact smears; Vintage cel paint,
    off-registration cyan bleed, nicotine-stain sepia, fading technicolor, ink-smear black; 16mm
    film grain, cel paint brush strokes visible, dust-scratched negative, old-reel flicker; Forms
    knotting like elastic tubes, torso-like mass compression, infinite stretch, detached motion
    accents
  creative_brief: >-
    Apply Rubber-Hose Insanity as a cinematic-media preset over prompt X: preserve the user's
    requested subject, then route lens behavior, palette, light, signal or film texture,
    composition, mood, and final media craft through 1930s rubber-hose cartoon pushed to mania,
