visualDna:
  aesthetic: 'Prop variant sheet: one prop type redesigned five to seven times side by side, each version changing function, culture or material on a shared base proportion.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a lineup of five to seven variants of the subject on one baseline at identical scale, and that layout replaces the requested framing.
  color_and_tone: Neutral ground with a restrained material-coded palette per variant and one accent hue that marks faction or function.
  lighting_and_shadow: Uniform soft top-left light on every variant, each with the same small contact shadow so they compare fairly.
  texture_and_material: Painted material shorthand, crisp silhouettes, and modular parts visibly swapped between versions.
  camera_and_composition: Straight front or side orthographic view, variants lined up on a baseline at identical scale with a small hand silhouette.
  atmosphere_and_mood: Systematic and inventive, choices laid out for a decision.
  rendering_and_quality: Medium finish with every variant at equal detail, numbered only by simple dots instead of labels.
  key_features: five to seven variants in a row; shared base proportion; identical scale and light; faction accent hue; swapped modular parts
  creative_brief: "Prop variant sheet: one prop type redesigned five to seven times side by side, each version changing function, culture or material on a shared base proportion. Carry it through five to seven variants in a row, shared base proportion, identical scale and light, faction accent hue, swapped modular parts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
