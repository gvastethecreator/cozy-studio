name: Cubism
category: 1. Geometric Abstraction
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - geometric-abstraction
visualDna:
  aesthetic: >-
    Cubism becomes a transferable geometric abstraction system: start from Fragmented objects,
    Geometric breakdown, and Multiple viewpoints, then route prompt content through planes, grids,
    vectors, optical order, and deliberate formal reduction without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Sharp angles to break, flatten, triangulate,
    align, tessellate, or rotate forms while keeping the prompt subject legible; preserve anatomy,
    object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Brown, Grey, Blue; treat color as structural contrast, field separation,
    and rhythm rather than decorative wash, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: keep light graphic and structural, with shadows simplified
    into value blocks or optical pressure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Paint strokes as the tactile or mark-making basis; surfaces should read as designed
    planes, ink, paint, paper, tile, or digital geometry, not pasted texture, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Multiple viewpoints as reusable spatial grammar: favor axial tension, repeated
    modules, negative space, cropped planes, and deliberate balance or imbalance, adapting cleanly
    to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Intellectual, fragmented as the emotional register; derive mood from rigor, optical tension,
    intellectual order, and abstraction pressure, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Picasso, Braque: finish with crisp geometry, controlled edges, clean separations, and
    no accidental realism, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Fragmented objects; Sharp angles; Brown, Grey, Blue; Flat; Paint strokes; Multiple viewpoints;
    Intellectual, fragmented; Picasso, Braque; Geometric breakdown
  creative_brief: >-
    Apply cubist fracture to the input: simultaneous viewpoints, angular planes, muted
    ochre-blue-grey paint facets, and deliberate spatial disassembly should let any subject remain
    readable while broken into intellectual geometry.
avoidRules:
  - realistic perspective
  - smooth
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
