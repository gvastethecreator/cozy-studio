visualDna:
  aesthetic: 'Vector-display anime: subjects drawn as glowing single-weight wireframe lines with hidden lines removed, on a black field with modular grid divisions.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Black ground with cyan vector lines, a deep blue grid and small red target accents; no filled color anywhere.
  lighting_and_shadow: Lines are self-luminous with a thin phosphor glow; there is no shading, and depth is shown by line density and brightness falloff.
  texture_and_material: Phosphor bloom along lines, faint persistence trails, and a soft curved-screen vignette at the corners.
  camera_and_composition: Keep the requested view; lay a fine modular grid behind the subject and bracket its key points with small red target ticks.
  atmosphere_and_mood: Cold command tension, the calm of watching disaster as geometry.
  rendering_and_quality: Clean single-weight vector wireframe, phosphor glow and sparse red ticks; no letters, numerals or filled surfaces.
  key_features: glowing single-weight wireframe; hidden-line removal; phosphor glow on black; modular blue grid; red target ticks without text
  creative_brief: "Vector-display anime: subjects drawn as glowing single-weight wireframe lines with hidden lines removed, on a black field with modular grid divisions. Carry it through glowing single-weight wireframe, hidden-line removal, phosphor glow on black, modular blue grid, red target ticks without text. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
