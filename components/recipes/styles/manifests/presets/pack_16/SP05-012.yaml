visualDna:
  aesthetic: >-
    Luminous 90s cel drawing with fine curved contours, smooth value transitions and precise
    star-point highlights. Its chorus comes from repeated ornamental rhythm, not a required group of
    characters.
  subject_treatment: >-
    Preserve the requested forms and count. Use graceful continuous contours and small glints along
    existing edges; do not recast the subject as a magical character or add companions.
  color_and_tone: >-
    When color is open, combine pearl white, moon blue, rose and pale gold in clear cel-value groups.
    Keep requested hues and reserve bright accents for a few focal points.
  lighting_and_shadow: >-
    Pair soft luminous transitions with crisp, tiny highlight flares. Keep shadows in deliberate cel
    shapes and do not invent a transformation light source.
  texture_and_material: >-
    Use clean painted fills, fine decorative ink and sparse sparkle points. Keep surface response
    faithful to each material; never cover forms with a glitter texture.
  camera_and_composition: >-
    Repeat small accents at measured intervals to create musical balance within the supplied
    composition. Keep the requested framing and number of subjects.
  atmosphere_and_mood: >-
    Let lightness and uplift come from spacing, color and highlight cadence. Preserve the prompt's
    tone instead of forcing a celebratory or magical event.
  rendering_and_quality: >-
    Use a delicate-to-bold line hierarchy, polished cel gradients and a few crisp starbursts. Keep
    detail legible and the background integrated without glitter haze.
  key_features: >-
    fine curved contours; pearl, moon-blue and rose accents; sparse star-point glints arranged in a
    repeated rhythm
  creative_brief: "Restyle the requested content with graceful cel linework, measured luminous accents and repeated ornamental cadence. Preserve its identity, action, environment and composition; add no magical cast, costume or event. Use it as a reusable look on any subject."
