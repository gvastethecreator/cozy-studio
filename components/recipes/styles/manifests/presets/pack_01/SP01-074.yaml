visualDna:
  aesthetic: 'Brenizer bokeh panorama: dozens of frames at f/1.4 stitched together, giving a wide field of view with the shallow depth of a telephoto portrait.'
  subject_treatment: Keep the prompt subject and action; this preset owns the stitched wide field of view and shallow depth, and the setting stays the prompt's.
  color_and_tone: Natural vibrant color, warm subject, creamy color washes in the background.
  lighting_and_shadow: Soft natural light, often golden hour or open shade.
  texture_and_material: Sharp subject, very large smooth bokeh behind, gentle swirl toward the edges.
  camera_and_composition: Environmental wide frame with the subject small to medium in the middle, background melted despite the wide view.
  atmosphere_and_mood: Dreamy and intimate, a quiet figure inside a softly dissolving world.
  rendering_and_quality: Stitched medium-format feel with no wide-angle distortion on the subject.
  key_features: wide view with f/1.4 depth; melted background; swirl at the edges; subject centered; no wide distortion
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bokeh Panorama (Brenizer) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
