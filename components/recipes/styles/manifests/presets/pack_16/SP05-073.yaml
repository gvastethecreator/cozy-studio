  aesthetic: "Hayao Miyazaki and Studio Ghibli feature animation as in Howl's Moving Castle: hand-painted poster-color backgrounds of Alsace-like towns and alpine meadows, ramshackle steampunk machines of patched metal, and simple warm character designs."
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with simple round Ghibli faces, small dot-highlight eyes, soft noses, natural proportions and loose everyday clothes that move with the wind. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Meadow greens, sky cobalt, cream cumulus clouds, rust brown metal and warm hearth orange.
  lighting_and_shadow: Bright open daylight with soft cel shadows, glowing fire and window light inside cluttered rooms.
  texture_and_material: Hand-painted gouache backgrounds, clean thin ink cel lines, riveted scrap-metal detail and chimney smoke.
  camera_and_composition: Wide painterly establishing shots with small figures, then warm medium shots inside cluttered homes.
  atmosphere_and_mood: Keep the requested mood with gentle wonder and cozy magic.
  rendering_and_quality: Classic hand-drawn Ghibli feature frame, painterly and warm, no digital gloss.
  key_features: Ghibli gouache backgrounds; patched steampunk machines; simple warm faces; wind-blown cloth
  creative_brief: "Hayao Miyazaki and Studio Ghibli feature animation as in Howl's Moving Castle: hand-painted poster-color backgrounds of Alsace-like towns and alpine meadows, ramshackle steampunk machines of patched metal, and simple warm character designs. Carry it through Ghibli gouache backgrounds, patched steampunk machines, simple warm faces, wind-blown cloth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
