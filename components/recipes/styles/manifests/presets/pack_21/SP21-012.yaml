visualDna:
  aesthetic: 'Translucent tissue layers: torn and cut tissue paper glued in overlapping sheets, colors multiplying where they cross and wrinkles catching the light.'
  subject_treatment: Build the prompt's subject from overlapping translucent tissue shapes, keeping its silhouette readable through the layered color.
  color_and_tone: Bright translucent tissue colors such as magenta, lemon and cyan mixing into new tones where they overlap.
  lighting_and_shadow: Light seems to pass through the layers, with darker zones where many sheets stack.
  texture_and_material: Glue wrinkles, soft torn edges, visible overlaps, faint glue sheen and slight bleeding of dye.
  camera_and_composition: Simple layered composition with large overlapping shapes and clear subject silhouette.
  atmosphere_and_mood: Cheerful, luminous and handmade, like a sunlit window collage.
  rendering_and_quality: Authentic tissue collage with wrinkles and overlap colors, never flat digital transparency.
  creative_brief: "Translucent tissue layers: torn and cut tissue paper glued in overlapping sheets, colors multiplying where they cross and wrinkles catching the light. Carry it through overlapping translucent sheets, mixed overlap colors, glue wrinkles, torn edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overlapping translucent sheets; mixed overlap colors; glue wrinkles; torn edges
