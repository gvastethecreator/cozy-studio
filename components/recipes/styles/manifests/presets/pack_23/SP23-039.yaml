visualDna:
  aesthetic: >-
    Separate painted planes with clean edges, controlled warm-to-cool modeling and small opaque
    highlights. Keep depicted materials legible and the finish painterly.
  subject_treatment: >-
    Preserve the requested subject, identity, function, count, pose, action and proportions. Keep
    existing forms intact; concentrate detail only where the composition already directs attention.
  color_and_tone: >-
    Retain the requested palette and color relationships. Warm-to-cool transitions describe value
    and plane changes without imposing particular hues.
  lighting_and_shadow: >-
    Follow the requested lighting and contrast. Use small opaque highlights only where consistent
    with the existing light; do not add specular shine or extra light sources.
  texture_and_material: >-
    Preserve the represented materials beneath the layered paint. Keep opaque accents small and
    selective instead of applying a uniform gloss or texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale, pose and spatial arrangement. Plane separation
    does not redesign geometry or add a decorative layout.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Layering and controlled color temperature change the
    rendering only, not the scene or narrative.
  rendering_and_quality: >-
    Keep plane boundaries clean, highlights restrained and detail hierarchy clear. Avoid unrequested
    ornament or redesign that obscures the original form.
avoidRules:
  - unrequested geometry changes, ornament or material replacement
  - oversized opaque highlights or uniform specular gloss
  - unrequested lettering, symbols, borders, interface or layout
