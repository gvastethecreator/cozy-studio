visualDna:
  aesthetic: '3D typography: sculptural letter-like glyphs built from real materials and objects, lit as physical objects.'
  subject_treatment: Keep the prompt subject and setting; express it through a sculpted glyph shape, using invented ornamental glyphs rather than readable letters unless the prompt supplies the exact text.
  color_and_tone: Bold material colors against a clean or atmospheric backdrop.
  lighting_and_shadow: Studio lighting that reveals depth and bevels, soft shadow on the ground.
  texture_and_material: Glyphs made of vines, candles, stone, metal or stacked objects.
  camera_and_composition: Glyph centered as a freestanding sculpture in a three-quarter view.
  atmosphere_and_mood: Expressive and crafted, a symbol as an object.
  rendering_and_quality: Physical-looking glyph sculpture; no readable words invented by the preset.
  key_features: sculpted glyph object; material-built letterform; studio depth lighting; centered sculpture; invented ornamental shape
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies 3D Typography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - brand logo
  - franchise likeness
  - readable text
  - readable letters
  - flat text
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
