  aesthetic: 'Zoids-inspired beast machine language: mechanical animals with exposed gears, clear canopy cockpits in the head, armor plates over mechanical skeletons and weapon hardpoints.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; rebuild the subject as a mechanical beast with exposed gears and a canopy cockpit in its head. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright plastic model colors and grey mechanics, true to the Zoids palette.
  lighting_and_shadow: Outdoor daylight on a battlefield, lit the way Zoids lights its scenes.
  texture_and_material: Plastic-model armor over gears, with the surface finish of Zoids.
  camera_and_composition: Side three-quarter beast view, framed the way Zoids composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with roaring mechanical wildness.
  rendering_and_quality: Clean design-presentation render with readable panel lines and material separation.
  creative_brief: "Zoids-inspired beast machine language: mechanical animals with exposed gears, clear canopy cockpits in the head, armor plates over mechanical skeletons and weapon hardpoints. Carry it through Beast machine, exposed gears, head cockpit. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
