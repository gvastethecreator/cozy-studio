visualDna:
  aesthetic: 'Microfiche Telemetry: readouts shown through optical reading windows and stacked film registers, with slight offsets that give the data a physical body.'
  subject_treatment: Arrange the prompt's readouts in optical reading windows and stacked registers, keeping every active value, unit and label perfectly sharp and exact.
  color_and_tone: Sober dark or light ground with one single tone for the active reading.
  lighting_and_shadow: Soft backlit glow of the film support, with letters and marks kept crisp.
  texture_and_material: Light optical grain and small offsets on secondary registers only, active text clean.
  camera_and_composition: One dominant reading window, secondary indexes and subordinate archive zones.
  atmosphere_and_mood: Tangible archive instrumentation with an old optical feel, calm and focused.
  rendering_and_quality: Film defects never touch values, units or data relationships.
  creative_brief: "Microfiche Telemetry: readouts shown through optical reading windows and stacked film registers, with slight offsets that give the data a physical body. Carry it through optical reading windows, stacked registers, film grain on support, sharp values. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: optical reading windows; stacked registers; film grain on support; sharp values
