visualDna:
  aesthetic: >-
    Clean cel rendering defines volume with angular shadow facets, straight cuts and taut curves,
    keeping the overall drawing crisp and readable.
  subject_treatment: >-
    Preserve the requested identity, anatomy, proportions, pose and action. Fit facets to the existing
    form without redesigning the subject or changing its silhouette.
  color_and_tone: >-
    Keep the requested palette and color relationships. Separate values with a few deliberate flat
    shadow shapes instead of adding contrast by changing the hues.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Align angular shadow planes to the existing
    light and form; do not add extra highlights or a second source.
  texture_and_material: >-
    Use clean flat fills and short linear details. Preserve the depicted materials without adding
    surface grain, metallic edges or bevel effects.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Faceted shading does not change the
    composition; add no card frame or lettering.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Angular design changes the shading language, not the scene
    or narrative.
  rendering_and_quality: >-
    Use distinct flat shadow facets with controlled straight and curved edges. Keep anatomical and
    object details intact, with clean fills and no generalized contrast boost.
avoidRules:
  - subject redesign or altered anatomy and pose
  - global contrast increase in place of shaped shadow facets
  - unrequested card frame or lettering
