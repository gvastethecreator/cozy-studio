visualDna:
  aesthetic: 'Chibi super-deformed drawing: every character redrawn about two heads tall with a huge round head, tiny limbs and stubby mitten hands.'
  subject_treatment: Keep the prompt subject, action and identity; this preset explicitly owns the proportion change to a two-heads-tall super-deformed body with oversized head and tiny limbs, and nothing else about the request changes.
  color_and_tone: Bright candy palette, pink blush ovals on cheeks, saturated flats with one lighter highlight tone.
  lighting_and_shadow: Flat cel shading with one soft shadow step and round glossy highlights in large eyes.
  texture_and_material: Smooth digital fills with thick clean outlines; props drawn oversized and toy-like.
  camera_and_composition: Centered full-body figures on simple backgrounds, tiny bodies read as a round silhouette.
  atmosphere_and_mood: Playful, comic and huggable, every emotion shown as a big face.
  rendering_and_quality: Thick even outlines, simplified interiors and expression marks such as sweat drops and sparkles.
  key_features: two-heads-tall proportions; oversized round head; thick clean outline; blush ovals; oversized props
  creative_brief: "Chibi super-deformed drawing: every character redrawn about two heads tall with a huge round head, tiny limbs and stubby mitten hands. Carry it through two-heads-tall proportions, oversized round head, thick clean outline, blush ovals, oversized props. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
