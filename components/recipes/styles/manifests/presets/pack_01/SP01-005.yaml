visualDna:
  aesthetic: 'Cinematic close-up still: a single frame lifted from a feature film, face filling the screen with motivated light, story implied off-frame.'
  subject_treatment: Push in close on the face or a telling detail; expression mid-emotion as if reacting to something outside the frame.
  color_and_tone: Deliberate film grade — teal shadows against warm skin, or a single dominant hue — with rich blacks and soft highlight rolloff.
  lighting_and_shadow: Motivated practical sources (lamp, window, fire, screen), hard edge light and deep negative fill on the far side of the face.
  texture_and_material: Fine film grain, subtle halation around highlights, visible skin texture and sweat or tears when present.
  camera_and_composition: 'Anamorphic-feeling 2.39 energy inside a vertical frame: extreme close-up, shallow focus, eyes off-center, background bokeh ovals.'
  atmosphere_and_mood: Tense, intimate, and narrative — a moment before something happens.
  rendering_and_quality: Cinema-camera look with filmic rolloff and no digital oversharpening.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cinematic Close-up as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: extreme close-up; motivated practical light; film grade; oval bokeh; off-frame story
