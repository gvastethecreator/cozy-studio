visualDna:
  aesthetic: 'Action manga page art: black G-pen ink with aggressive line-weight swings, radial speed lines and mechanical screentone gray.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Pure black ink, white paper and dot screentone grays only; the darkest blacks reserved for the impact point.
  lighting_and_shadow: Hard shadow cuts laid in flat screentone, white rim flashes separating the subject from dark speed-line fields.
  texture_and_material: Visible dot screentone patches, scratched-out tone for sparks, ink splatter and debris shards.
  camera_and_composition: Extreme perspective at the moment of impact, radial or parallel speed lines converging on the action, bodies warped by motion.
  atmosphere_and_mood: Escalating competitive energy, the loudest moment of a fight frozen mid-strike.
  rendering_and_quality: Sharp tapered G-pen strokes, clean tone edges and readable silhouettes; never colored or painted.
  key_features: G-pen line-weight swings; radial speed lines; dot screentone; impact burst; extreme foreshortening
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Manga (Shonen) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - full color
  - painted shading
  - color
  - american comic
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
