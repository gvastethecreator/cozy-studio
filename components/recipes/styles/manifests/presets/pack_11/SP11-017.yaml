visualDna:
  aesthetic: '90s action figure: hard plastic figure with visible joints, sculpted muscles and painted details.'
  subject_treatment: "Rebuild the prompt's subject as a physical crafted object made this way, keeping its identity, pose and action readable: molded plastic with swivel joints at shoulders, hips and knees, sculpted detail and simple paint."
  color_and_tone: Bold toy colors, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Studio light with plastic sheen, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Molded plastic, joints and paint apps, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at card size.
  atmosphere_and_mood: Heroic, nostalgic, toyetic and bold, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: swivel joints; sculpted plastic; paint apps
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Action Figure (90s) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
