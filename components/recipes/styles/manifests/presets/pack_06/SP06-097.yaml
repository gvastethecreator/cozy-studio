visualDna:
  aesthetic: 'Late-80s paint-program pixel art: thousands of colors through hold-and-modify mode, with sky gradients made from per-scanline palette changes.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Rich painterly color with horizontal color bleed at hard edges; skies built from smooth-looking horizontal gradient bars.
  lighting_and_shadow: Painted light with soft digitized shading, dramatic sunsets and glossy highlights.
  texture_and_material: Horizontal color-fringe smears where shapes meet, fine paint-program brush dither, and banded copper sky bars.
  camera_and_composition: Keep the requested view; wide landscape-style compositions with layered horizon bands.
  atmosphere_and_mood: Grand and romantic, a painting squeezed out of a home computer.
  rendering_and_quality: Painterly many-color pixels with visible fringing and horizontal banding; no modern smooth gradients.
  key_features: hold-and-modify color fringing; per-scanline gradient bars; painterly pixels; digitized shading; wide horizons
  creative_brief: "Late-80s paint-program pixel art: thousands of colors through hold-and-modify mode, with sky gradients made from per-scanline palette changes. Carry it through hold-and-modify color fringing, per-scanline gradient bars, painterly pixels, digitized shading, wide horizons. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
