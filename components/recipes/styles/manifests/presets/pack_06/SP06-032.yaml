visualDna:
  aesthetic: 'Woodcut relief print: a plank of side-grain wood cut away with knives and gouges, the uncut surface inked and pressed, so the image is black shapes with white cut marks.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Dense black ink on off-white paper, with an optional single flat color block; no greys except patterns of cut lines.
  lighting_and_shadow: 'Stark contrast: shadows are uncut black, light is carved away in bold directional gouge strokes.'
  texture_and_material: Visible wood grain printing through the solid blacks, splintery cut edges, uneven ink squash at shape borders, slight paper show-through.
  camera_and_composition: Keep the requested framing; forms simplified into bold angular shapes that a knife can cut.
  atmosphere_and_mood: Blunt, archaic and powerful, a folk broadside force.
  rendering_and_quality: Chunky angular cuts, wood grain in the blacks, irregular ink coverage; no fine hatching and no smooth curves.
  key_features: black shapes with white gouge marks; wood grain in solid blacks; splintery angular cuts; uneven ink squash; stark two-value contrast
  creative_brief: "Woodcut relief print: a plank of side-grain wood cut away with knives and gouges, the uncut surface inked and pressed, so the image is black shapes with white cut marks. Carry it through black shapes with white gouge marks, wood grain in solid blacks, splintery angular cuts, uneven ink squash, stark two-value contrast. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
