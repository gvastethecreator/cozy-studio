schema: gvaste-pages/v1
preset: app

project:
  name: Cozy Studio
  tagline: your ideas, freshly brewed
  description: A free image studio that runs on your computer and makes images with the subscription you already have.
  url: https://cozy.gvaste.dev/
  repo: https://github.com/gvastethecreator/cozy-studio
  license: MIT
  sponsor: https://github.com/sponsors/gvastethecreator
  stack: Bun · React · local API
  ogImage: assets/social.jpg

brand:
  initials: CS
  mascot: assets/mascot.svg
  accent: "#8b6cff"
  # The Cozy Studio app's accent palettes, starting from the page's violet.
  accentCycle: ["#8b6cff", "#fcb247", "#737373", "#f43f5e", "#f97316", "#f59e0b", "#22c55e", "#06b6d4", "#3b82f6"]
  theme: dark

sections: [hero, about, showcase, preview, screens, setup, skill, closing]

hero:
  title: Your ideas, freshly brewed.
  accent: freshly brewed.
  lede: Make images with the subscription you already pay for. ChatGPT, Grok or Antigravity. No API keys.
  actions:
    - { label: Get Cozy Studio, href: "#setup", primary: true }
    - { label: GitHub, href: "https://github.com/gvastethecreator/cozy-studio" }
  stage: deck
  gallery:
    - src: assets/deck/cat-reynold-brown.webp
      alt: "A giant black cat attacks a city in a painted fifties sci-fi movie poster"
      caption: b-movie poster
      file: Pictures/Cozy Studio/2026-09-29_reynold-brown_giant-black-cat-taller-than-skyscrapers.png
    - src: assets/deck/cat-tadanori-yokoo.webp
      alt: "A giant black cat over a city in a psychedelic Japanese pop poster"
      caption: pop theater poster
      file: Pictures/Cozy Studio/2026-09-29_tadanori-yokoo_giant-black-cat-taller-than-skyscrapers.png
    - src: assets/deck/cat-ironbow-thermal-imaging.webp
      alt: "A giant black cat seen through a thermal camera, glowing over the city"
      caption: thermal camera
      file: Pictures/Cozy Studio/2026-09-29_ironbow-thermal-imaging_giant-black-cat-taller-than-skyscrapers.png
    - src: assets/deck/cat-harry-clarke.webp
      alt: "A giant black cat and a city as a jewel-toned stained glass window"
      caption: stained glass
      file: Pictures/Cozy Studio/2026-09-29_harry-clarke_giant-black-cat-taller-than-skyscrapers.png
    - src: assets/deck/cat-stenberg-brothers.webp
      alt: "A giant black cat in a Soviet constructivist film poster"
      caption: constructivist poster
      file: Pictures/Cozy Studio/2026-09-29_stenberg-brothers_giant-black-cat-taller-than-skyscrapers.png
    - src: assets/deck/cat-visionary-apocalypse-woodcut.webp
      alt: "A giant black cat over a city as an old apocalypse woodcut"
      caption: woodcut
      file: Pictures/Cozy Studio/2026-09-29_visionary-apocalypse-woodcut_giant-black-cat-taller-than-skyscrapers.png

about:
  variant: logo-cards
  navLabel: Providers
  kicker: Providers
  title: Your subscription does the work.
  lede: Sign in once and Cozy Studio uses the plan you already pay for. Google works too, with an API key.
  capabilities:
    - { title: ChatGPT, body: "Sign in from Settings. Uses your plan’s allowance.", logo: assets/providers/chatgpt.svg, mono: true, fact: recommended, tint: "#ff9466", fx: rosette }
    - { title: Codex, body: "Through the Codex app. Uses your Codex allowance.", logo: assets/providers/codex.svg, mono: true, tint: "#6975fd", fx: prompt }
    - { title: Grok, body: Sign in with xAI or your Grok Build login., logo: assets/providers/grok.svg, mono: true, tint: "#c3cad6", fx: horizon }
    - { title: Antigravity, body: "Nano Banana, through your Antigravity login.", logo: assets/providers/antigravity.svg, tint: "#4c8dff", fx: lift }

