visualDna:
  aesthetic: 'Silhouette portraiture: the subject reduced to a pure dark shape against an intensely bright field, identity carried entirely by profile and outline.'
  subject_treatment: Turn the subject toward profile or a clear three-quarter outline so nose, hair, hands, props, or clothing edges read instantly as shape.
  color_and_tone: Near-black figure against a luminous background — sunset gradient, bright sky, glowing fog, or white window — with no detail inside the shape.
  lighting_and_shadow: All light comes from behind; exposure is set for the background so the subject falls to black, with a thin halo where light wraps edges.
  texture_and_material: Texture exists only in the background (clouds, haze, glow); the silhouette itself is smooth and graphic.
  camera_and_composition: Clean separation between shape and background, generous negative space, low or eye-level camera to lift the outline against the light.
  atmosphere_and_mood: Mysterious, poetic, and iconic.
  rendering_and_quality: Crisp outline edges, no muddy gray inside the figure, smooth luminous gradient behind.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Silhouette Portrait as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: pure black shape; backlit exposure; readable profile outline; luminous background gradient; edge halo
