visualDna:
  aesthetic: 'Lacquer anime illustration in which a nonhuman subject or object seems to shed its surface: split translucent lacquer plates, membrane-thin overlaps and fine crimson seams in clean ink.'
  subject_treatment: Redraw the prompt's nonhuman subject or object and its setting in this treatment; the image stays free of people, and a gentle prompt stays gentle in content.
  color_and_tone: Black, bone and the subject's own colors, with deep red limited to the seams.
  lighting_and_shadow: Thin transmitted light glows through the membranes, with localized red bounce beside each seam.
  texture_and_material: Polished lacquer plates set against soft translucent film, never turned into a mask or specimen.
  camera_and_composition: Keep the requested framing, subject count and pose; the image stays entirely free of people.
  atmosphere_and_mood: Quiet metamorphic tension, a change happening in silence.
  rendering_and_quality: Clean lacquer highlights and crisp seam lines with readable underlying form.
  key_features: split translucent lacquer plates; membrane-thin overlaps; crimson seams; transmitted edge light; no person required
  creative_brief: "Lacquer anime illustration in which a nonhuman subject or object seems to shed its surface: split translucent lacquer plates, membrane-thin overlaps and fine crimson seams in clean ink. Carry it through split translucent lacquer plates, membrane-thin overlaps, crimson seams, transmitted edge light, no person required. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
