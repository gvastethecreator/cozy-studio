visualDna:
  aesthetic: >-
    Glass (Shattered) treats fabrication as visible style language: start from Broken window, Sharp
    shards, and Fragmented, then turn manufacturing process, tooling marks, seams, tolerances, and
    industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Sharp cracks: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Clear, Green edge as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Refractive sparkles define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Glass (Shattered) without hiding the
    prompt subject.
  texture_and_material: >-
    Render Sharp shards through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Fragmented as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Dangerous, sudden by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Destruction, accident material clarity: physically coherent reflectance, clean
    contact detail, controlled micro-texture, readable silhouette behavior, and no noisy
    stock-texture overlay.
  key_features: Broken window; Sharp cracks; Sharp shards; Refractive sparkles; Fragmented
  creative_brief: >-
    Route any subject through Glass (Shattered) as a transferable man-made material visual system
    while preserving the prompt's subject, action, and setting. Compose the frozen violence of
    shattered glass where radial cracks bloom from an impact center in a spiderweb of sharp light,
    green edges catching refractive glints like dangerous confetti. Each shard must retain its own
    angle of reflection, fragmenting the world behind it into a cubist mosaic. Capture the moment
    between integrity and collapse, transparent catastrophe arrested mid-breath. Use Glass as
    portable surface/render behavior over any input: map its texture, light response, edge wear,
    color chemistry, and tactile rhythm onto the subject instead of requiring a literal material
    sample, macro tile, wall, landscape, source object, or scene where the material naturally
    appears.
