visualDna:
  aesthetic: >-
    Modern Minimalist acts as a transferable architecture/interior router: flush planes, hidden
    joints, warm mineral white, soft daylight, microcement, pale oak accent; fuse it with
    interior-system design grammar with furniture-independent proportion, material hierarchy,
    junction detail, tactile finish, and lived spatial rhythm; route spatial grammar, material
    behavior, scale, ornament, and light over prompt X without requiring the default sample anchor,
    fixed spatial set, landscape setup, or object sample.
  subject_treatment: >-
    Preserve prompt subject, action, and context while translating any requested subject through
    clean massing, threshold logic, joinery rhythm, furniture-scale proportion, surface hierarchy,
    and object-ready interior detailing; treat flush planes, hidden joints, warm mineral white, soft
    daylight, microcement as massing, edge, surface, joinery, threshold, or ornament behavior rather
    than a mandatory building scene.
  color_and_tone: >-
    Map color through controlled interior color hierarchy, wall or shell base tones, tactile
    secondary materials, small accent signals, and readable value spacing; let source cues such as
    flush planes, hidden joints, warm mineral white, soft daylight, microcement decide accent
    hierarchy, material temperature, and value separation while staying attached to the requested
    content.
  lighting_and_shadow: >-
    Use soft daylight, practical bounce, concealed glow, edge-defining shadow, and material-aware
    reflection control; make light reveal joints, relief, material depth, scale, and atmosphere from
    flush planes, hidden joints, warm mineral white, soft daylight, microcement without replacing
    prompt X with a stock architectural render.
  texture_and_material: >-
    Render wood, plaster, metal, textile, glass, tile, concrete, patina, polish, grain, seams, and
    tactile construction details; prioritize the tactile signals in flush planes, hidden joints,
    warm mineral white, soft daylight, microcement, with believable surface response, denoised
    grain, coherent wear, and no generic wallpaper texture.
  camera_and_composition: >-
    Frame through cropped architectural-detail framing, modular spacing, planar overlap, threshold
    cuts, section-like reads, and deliberate negative space; convert flush planes, hidden joints,
    warm mineral white, soft daylight, microcement into reusable perspective, crop, depth, section,
    modular rhythm, and negative-space rules instead of one fixed style sample layout.
  atmosphere_and_mood: >-
    Carry mood through inhabitable atmosphere, design intent, tactile comfort or tension, and
    spatial personality without staged showroom dependency; the preset can support adult, strange,
    sensual, severe, playful, ominous, quiet, or monumental prompts when prompt X asks for them
    while keeping the architectural identity readable.
  rendering_and_quality: >-
    Finish with polished architectural visualization clarity with denoised surfaces, believable
    material response, no fake text, and no decor-catalog drift; keep clean denoise, legible
    construction, stable object or anatomy structure when applicable, no watermark, no fake readable
    text, no logo, no camera prop, and no prompt-literal card copy.
  key_features: >-
    flush planes, hidden joints, warm mineral white, soft daylight, microcement; clean massing,
    threshold logic, joinery rhythm, furniture-scale proportion, surface hierarchy, and object-ready
    interior detailing; wood, plaster, metal, textile, glass, tile, concrete, patina, polish, grain,
    seams, and tactile construction details; cropped architectural-detail framing, modular spacing,
    planar overlap, threshold cuts, section-like reads, and deliberate negative space
  creative_brief: >-
    Apply Modern Minimalist after prompt X as a transferable architecture/interior style layer:
    prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies
    flush planes, hidden joints, warm mineral white, soft daylight, microcement, pale oak accent,
    interior-system design grammar with furniture-independent proportion, material hierarchy,
    junction detail, tactile finish, and lived spatial rhythm, material discipline, spatial grammar,
    and negative controls without requiring a single spatial sample, product-photo setup, aisle-like
    default, or empty abstraction.
