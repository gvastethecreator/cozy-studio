visualDna:
  aesthetic: 'Risograph cyberpunk manga print: coarse photocopied screentone and black toner, overprinted with two saturated neon spot colors slightly off register.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Toxic fluorescent green and hot red spot inks over black toner and paper white; overlaps turn brown only in thin misregistered slivers.
  lighting_and_shadow: Values made by screentone dot size and toner black; neon spot color marks the lit edges, with no gradients.
  texture_and_material: Coarse halftone dots, toner speckle, scratched photocopy streaks and the uneven ink coverage of a stencil drum.
  camera_and_composition: Keep the requested view; crop hard and let angled detail clusters and black masses bleed off the edges.
  atmosphere_and_mood: Abrasive, sleazy and tense, a city that punishes while it glows.
  rendering_and_quality: Two-spot-color risograph finish with misregistration, coarse dots and toner grit around a clean silhouette.
  key_features: two neon spot inks off register; coarse screentone dots; black toner grit; photocopy streaks; hard crop with bleed
  creative_brief: "Risograph cyberpunk manga print: coarse photocopied screentone and black toner, overprinted with two saturated neon spot colors slightly off register. Carry it through two neon spot inks off register, coarse screentone dots, black toner grit, photocopy streaks, hard crop with bleed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
