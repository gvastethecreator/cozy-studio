visualDna:
  aesthetic: >-
    Soft anime illustration favors round contour turns, low-contrast cel planes, and matte
    edges.
  subject_treatment: >-
    Retain subject and count; soften selected contours while keeping structure and
    expression clear.
  color_and_tone: >-
    Sage, cream, cloudy blue, muted ochre; low saturation and one warm focal note.
  lighting_and_shadow: >-
    Broad diffuse illumination and shallow shadows; imply no room or time of day.
  texture_and_material: >-
    Smooth matte fills with barely visible paper grain; no sparkle or wet shine.
  camera_and_composition: >-
    Keep framing; open space and gentle overlap organize only subjects already present.
  atmosphere_and_mood: >-
    Reassurance comes from breathing room when compatible with the requested emotion.
  rendering_and_quality: >-
    Few readable value tiers, soft stable edges, sparse detail, no obscuring haze.
  key_features: >-
    Rounded contours, low-contrast cel values, sage-ochre palette, generous breathing room
  creative_brief: 'Apply a visual treatment centered on rounded contours, low-contrast cel values, sage-ochre palette, generous breathing room. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
