visualDna:
  aesthetic: 'Comedy action anime built on the impact frame: calm simple cel shots where one moment snaps to high-contrast black, white and red with thick radial wedges and a jagged silhouette.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Muted soft cel color for the calm part; the impact zone in black, white and signal red with a yellow spark.
  lighting_and_shadow: Flat even light, then hard inverted light with pure black shadows inside the impact zone.
  texture_and_material: Clean cel fills, impact lines as thick tapered wedges, untouched negative space.
  camera_and_composition: Keep the requested framing; a broad empty stage with oversized radial punctuation centered on one small detail.
  atmosphere_and_mood: Deadpan timing and an absurdly oversized reaction.
  rendering_and_quality: Deliberate disproportion between a trivial action and a huge impact graphic.
  key_features: single impact frame zone; black, white and signal red; thick radial wedges; muted calm cel; broad empty stage
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Impact Frame Comedy Hero as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
