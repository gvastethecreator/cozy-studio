visualDna:
  aesthetic: 'Garagepunk: suburban garages turned into band rehearsal rooms and workshops, with egg-carton walls, secondhand amps, car parts and oil-stained floors.'
  subject_treatment: Keep the prompt's subject and setting; move it into a cluttered garage full of amps, tools, cables and half-fixed machines.
  color_and_tone: Oily concrete grey, faded wood and dusty tones with warm bulb light and red amp glow.
  lighting_and_shadow: Bare bulbs and sunlight through a half-open garage door, strong shadows.
  texture_and_material: Egg-carton foam, worn amps, cables, workbench tools, car parts and oil stains.
  camera_and_composition: Cramped interiors with a band and clutter crowding every corner.
  atmosphere_and_mood: Loud, amateur and joyful, noise made with whatever is lying around.
  rendering_and_quality: Warm gritty illustration with cluttered detail and bulb glow.
  creative_brief: "Garagepunk: suburban garages turned into band rehearsal rooms and workshops, with egg-carton walls, secondhand amps, car parts and oil-stained floors. Carry it through egg-carton walls, secondhand amps, half-open door, workshop clutter. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: egg-carton walls; secondhand amps; half-open door; workshop clutter
