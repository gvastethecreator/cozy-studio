visualDna:
  aesthetic: Folkloric 1990s anime cel with tapered brush-ink contours, warm vermilion accents and faded indigo dusk values, as if the cels were slightly sun-faded.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Flowing tapered marks describe existing movement rather than a pursuit; add no shrine, well, sword or talisman.
  color_and_tone: Vermilion, cream, muted indigo and charcoal in nostalgic, slightly faded contrast.
  lighting_and_shadow: Soft dusk-like shadow and restrained warm edge light, without requiring night or a new source.
  texture_and_material: Faded cel color, tapering brush lines that swell and thin, and subtle grain.
  camera_and_composition: Keep the requested view; gentle horizontal rhythm with long flowing contours.
  atmosphere_and_mood: Nostalgic and mythic, a story told at dusk.
  rendering_and_quality: A focal silhouette sharp enough to read through the soft color fade and low-contrast detail.
  key_features: tapered brush-ink contours; vermilion accents; faded indigo dusk; sun-faded cel color; horizontal flow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vermilion Indigo Tapered-Ink Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
