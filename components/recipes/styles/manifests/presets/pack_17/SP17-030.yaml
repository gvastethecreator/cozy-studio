visualDna:
  aesthetic: >-
    Folk-horror medieval covenant with witch-knights, thorn chapels, bone charms, black woods, and candlelit
    oath armor.
  subject_treatment: >-
    Apply folk-horror covenant styling to any subject through oath-mark geometry, thornlike silhouette
    rhythm, bone-charm accents, wax-lit edges, and ritual armor logic without requiring a fixed figure or
    prop bundle.
  color_and_tone: Pine black, bone white, candle amber, dried berry red, moss green, and cold moon gray.
  lighting_and_shadow: Moonlight and candles make clean cutout silhouettes against dark woods without noisy black texture.
  texture_and_material: Bark, bone, wool, tarnished armor, wax, moss, thorn, and smooth denoised shadow planes.
  camera_and_composition: Tall icon-like framing with vertical pressure, thorn-arc rhythm, pale fog separation, and crisp silhouette against clean shadow.
  atmosphere_and_mood: Ominous, folkloric, ritualistic, secretive, and elegant.
  rendering_and_quality: Clean dark folk-fantasy illustration with controlled texture, no mud, and readable card contrast.
  creative_brief: >-
    Reusable visual system for any subject needing secretive folk-horror oath marks, dark ritual elegance, and
    medieval covenant mood beyond one literal scene.
