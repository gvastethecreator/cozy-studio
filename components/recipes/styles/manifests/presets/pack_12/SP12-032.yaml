visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Shadow Gambit: The Cursed Crew gameplay
    screenshots: isometric stealth-tactics capture with pirate harbors, patrol cones, crew ability
    timing, and layered infiltration routes. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Shadow Gambit: The Cursed
    Crew-adjacent game screenshot subject: keep clear role silhouette, player/enemy/object function,
    scale relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Shadow Gambit: The Cursed Crew-informed palette: moonlit teal, lantern gold, undead green,
    red patrol accents, worn wood brown, and tropical night blue. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through lantern pools, moon shafts, ghost ability glow, stealth shadow pockets,
    and wet dock reflections. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wooden docks, ropes, barrels, pirate coats, colonial stone, mist, foliage,
    and stylized tactical geometry. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with elevated isometric stealth view with patrol paths, cover pockets, synchronized
    action space, and objective markers. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Shadow Gambit: The Cursed Crew-derived mood: sly, supernatural, nautical, tactical, and
    mischievous. The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd
    when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: patrol cones, ability icons,
    waypoint ghosts, and tactical pause cues are allowed if coherent. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Shadow Gambit: The Cursed Crew gameplay screenshots; isometric stealth-tactics capture with
    pirate harbors, patrol cones, crew ability timing, and layered infiltration routes; moonlit
    teal, lantern gold, undead green, red patrol accents, worn wood brown, and tropical night blue;
    lantern pools, moon shafts, ghost ability glow, stealth shadow pockets, and wet dock
    reflections; wooden docks, ropes, barrels, pirate coats, colonial stone, mist, foliage, and
    stylized tactical geometry; elevated isometric stealth view with patrol paths, cover pockets,
    synchronized action space, and objective markers; sly, supernatural, nautical, tactical, and
    mischievous; HUD guidance: patrol cones, ability icons, waypoint ghosts, and tactical pause cues
    are allowed if coherent
  creative_brief: >-
    Use Shadow Gambit Harbor Heist as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Shadow Gambit: The Cursed Crew: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
