visualDna:
  aesthetic: Gothic seinen poster ink with hard black and crimson color blocks edged by fine tapered hairlines that decorate only existing contours; flat and heraldic.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Crimson, ink black and pale ivory in a strict three-value hierarchy.
  lighting_and_shadow: Crisp controlled highlights and clean hard shadow edges, without glowing symbols or shafts of light.
  texture_and_material: Flat opaque gouache-like pigment with sparse etched detail on the edges only.
  camera_and_composition: Keep the requested framing; large color-block proportions carry authority rather than forced symmetry.
  atmosphere_and_mood: Composed, theatrical command held with cold, upright dignity.
  rendering_and_quality: Hard-edged blocks, hairline edge ornament and no gradients at all.
  key_features: flat crimson and black blocks; tapered hairline edge ornament; ivory highlights; three-value hierarchy; hard shadow edges
  creative_brief: "Gothic seinen poster ink with hard black and crimson color blocks edged by fine tapered hairlines that decorate only existing contours; flat and heraldic. Carry it through flat crimson and black blocks, tapered hairline edge ornament, ivory highlights, three-value hierarchy, hard shadow edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
