visualDna:
  aesthetic: >-
    Precision Action Cel Style acts as a transferable anime-prestige router: precision action timing
    and clear impact grammar, alongside a precision anime direction shaped by era-aware line economy
    and genre tone; fuse it with 90s golden-era anime direction with sharp cel shadows, dramatic
    closeups, aura effects, urban melancholy, and high-contrast compositing; it routes era, genre,
    line economy, cel or digital finish, and performance tone without locking prompt content to the
    source title or sample image.
  subject_treatment: >-
    Preserve the prompt subject, action, and context while restyling forms through precise anatomy,
    controlled deformation, and crisp effect edges, alongside motion-ready contour and readable
    force transfer; identity should remain readable through anime contour, expression economy, pose
    energy, shape simplification, and effect hierarchy instead of a required canon character or
    title scene.
  color_and_tone: >-
    Map color through a precision accent system held inside disciplined cel values, alongside a
    action accent system held inside disciplined cel values; anchor it in deep night blues,
    saturated aura color, jewel accents, warm skin cel tones, smoke grays, and VHS-era contrast;
    keep value separation clean, cel flats intentional, accents purposeful, and palette behavior
    attached to the requested content.
  lighting_and_shadow: >-
    Use impact flashes and clean rim separation, alongside a precision light logic using cel rim,
    glow behavior, and blocked shadow; combine it with hard-edged rim light, aura bloom, neon spill,
    twilight gradients, speed-flash cuts, and moody cel shadow blocks; shadows should read as anime
    light design, rims should clarify form, and glow or effects should support the prompt rather
    than replacing it.
  texture_and_material: >-
    Render cel paint and ink grain tuned to precision material contrast, alongside cel paint and ink
    grain tuned to action material contrast; anchor surfaces in painted cels, compositing grain,
    inked speed marks, smoke layers, leather or metal highlights, and analog scan softness; cel
    edges, painted surfaces, grain, cloth, metal, water, sweat, smoke, or atmosphere must stay
    coherent across people, objects, environments, action, and abstractions.
  camera_and_composition: >-
    Frame around clean timing windows and exact visual hierarchy, alongside attack vectors, recoil
    spacing, and sharp action lanes, then extend it with cinematic closeups, speed-line vectors,
    dramatic low angles, layered profile cuts, and compressed emotional space; the style should
    support portraits, props, machines, performances, landscapes, symbols, and full scenes through
    reusable anime staging grammar instead of one fixed card layout.
  atmosphere_and_mood: >-
    Carry mood through momentum, danger, and controlled spectacle, alongside precision emotional
    pressure and genre-specific tone; braid it with heightened rivalry, melancholy cool, occult
    romance, existential drift, heroic escalation, and serious adult tone; the preset can become
    funny, sensual, violent, quiet, tragic, romantic, or strange when prompt X asks for it while
    preserving the chosen anime lineage.
  rendering_and_quality: >-
    Finish with sharp cel clarity with no smeared effects, alongside clean anime finishing that
    keeps action identity readable without noisy denoise; enforce premium 90s cel finish with crisp
    anatomy, readable effects, denoised grain, and no cheap anime-filter smear; prioritize clean
    denoise, stable anatomy or object structure, readable effects, controlled grain, no watermark,
    no fake text, no signature, and no photoreal or 3D-render drift.
  key_features: >-
    precision action timing and clear impact grammar, alongside a precision anime direction shaped
    by era-aware line economy and genre tone; precise anatomy, controlled deformation, and crisp
    effect edges, alongside motion-ready contour and readable force transfer; cel paint and ink
    grain tuned to precision material contrast, alongside cel paint and ink grain tuned to action
    material contrast; impact flashes and clean rim separation, alongside a precision light logic
    using cel rim, glow behavior, and blocked shadow; clean timing windows and exact visual
    hierarchy, alongside attack vectors, recoil spacing, and sharp action lanes
  creative_brief: >-
    Apply Precision Action Cel Style after prompt X as a transferable anime-prestige layer: prompt X
    supplies subject, action, setting, tone, and intensity, while this preset supplies precision
    action timing and clear impact grammar, alongside a precision anime direction shaped by
    era-aware line economy and genre tone, alongside precise anatomy, controlled deformation, and
    crisp effect edges, alongside motion-ready contour and readable force transfer; a precision
    accent system held inside disciplined cel values, alongside a action accent system held inside
    disciplined cel values; impact flashes and clean rim separation, alongside a precision light
    logic using cel rim, glow behavior, and blocked shadow; cel paint and ink grain tuned to
    precision material contrast, alongside cel paint and ink grain tuned to action material contrast
    and clean timing windows and exact visual hierarchy, alongside attack vectors, recoil spacing,
    and sharp action lanes, finish discipline, and negative controls without requiring a fixed canon
    cast, title scene, prop bundle, location, sport, instrument, weapon, or card composition.
