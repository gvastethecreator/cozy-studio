visualDna:
  aesthetic: 'Polished granite: speckled crystalline stone polished to a hard reflective surface.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is carved from granite and polished, with mineral speckles visible across its surfaces."
  color_and_tone: Grey, black and pink speckle or black granite with mica sparkle.
  lighting_and_shadow: Crisp light producing sharp reflections, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Polished granite with feldspar, quartz and mica grains, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Hard, permanent, cold and monumental, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: polished speckled granite; mica sparkle; hard reflections; crystalline grain
  creative_brief: "Polished granite: speckled crystalline stone polished to a hard reflective surface. Carry it through polished speckled granite, mica sparkle, hard reflections, crystalline grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
