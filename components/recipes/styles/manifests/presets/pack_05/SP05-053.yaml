visualDna:
  aesthetic: >-
    Weighty industrial rendering defined by broad overlapping planes, load-bearing contours,
    chipped edges, and dense shadow blocks; imply strain through surface wear rather than new
    parts.
  subject_treatment: >-
    Preserve the subject’s identity and silhouette. Give existing forms a heavier read with
    thick contour accents and layered value planes; do not attach armor or pistons.
  color_and_tone: >-
    Build from iron gray, dirty olive, muted clay, and rust, with small pale highlights. Keep
    the palette grounded and low in saturation.
  lighting_and_shadow: >-
    Use hard, deep shadows under overlaps and broad worn highlights across exposed surfaces; let
    weight read through value grouping.
  texture_and_material: >-
    Retain the depicted material while adding sparse chips, rubbed edges, grime streaks, and
    coarse painted wear in controlled patches.
  camera_and_composition: >-
    Keep the requested angle and scale. Group marks into compact masses and let weight settle
    toward the lower part of the existing frame.
  atmosphere_and_mood: >-
    Convey endurance and strain through dense shadows, worn edges, and restrained color, without
    staging a battlefield or repair scene.
  rendering_and_quality: >-
    Use decisive cel-shadow blocks, thick-to-thin contours, and purposeful abrasion; preserve
    enough clean area to keep forms readable.
  key_features: >-
    Load-bearing silhouette; broad shadow masses; chipped surface accents; iron, olive, and rust
    palette.
  creative_brief: >-
    Preserve the specified subject and framing. Apply heavy contour accents, layered shadows,
    and restrained worn marks to its existing forms; add no armor, pistons, or battlefield
    props.
