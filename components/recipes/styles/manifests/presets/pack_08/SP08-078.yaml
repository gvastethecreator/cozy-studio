visualDna:
  aesthetic: >-
    Hologram operates as a portable fashion-costume router: combine Monochrome sci-fi hologram,
    distant-transmission shimmer, long-range signal urgency with speculative costume logic with
    armor, suit engineering, magical garment behavior, alien proportion, and character-readability
    design, so the preset supplies styling behavior rather than a fixed outfit card, required
    wearer, or literal garment sample.
  subject_treatment: >-
    Preserve the prompt's subject, motion, and context while forms arm, shield, augment, cloak,
    illuminate, conceal, mutate, modularize, ritualize, or engineer through Scanlines,
    horizontal-interlaced banding, ghost-flicker edge, translucent signal contour, projection-field
    taper; identity stays readable as silhouette, fit, layering, body-volume logic, edge behavior,
    and styling hierarchy shift into this preset.
  color_and_tone: >-
    Map color through speculative material color, neon accents, abyssal values, royal metals,
    survival grime, arcane glow, and suit-coded contrast; keep textile values separated, accents
    intentional, material color believable, and palette behavior attached to the subject instead of
    pasted wardrobe decoration.
  lighting_and_shadow: >-
    Use Self-lit emissive-blue glow, projection-cone light, low-distant-plane contrast and
    flicker-instability pulse plus rim light, emissive channels, occult glow, reflective armor,
    survival dust, void shadow, or sci-fi display light as the styling light contract, revealing
    cut, drape, surface response, trim, transparency, or armor structure without erasing prompt
    readability.
  texture_and_material: >-
    Render Light interference, scanline-grid pattern, signal-degradation static, transparency-fade,
    projection-grain, chromatic-fringe plus armor plates, spandex, robes, leather, rubber, chrome,
    biotic surface, hologram, smoke, shadow, gel, and luminous seams; keep fabric scale, seams,
    fibers, shine, opacity, folds, hardware, elemental edges, or body-surface treatment coherent
    across the whole prompt.
  camera_and_composition: >-
    Compose with character-design readability, suit silhouette, power-shape hierarchy, modular gear
    rhythm, and transformation focus as reusable fashion framing grammar, allowing portraits,
    objects, creatures, environments, action, and abstract prompts to inherit styling without one
    required pose.
  atmosphere_and_mood: >-
    Carry mood through power, menace, wonder, survival, occult ceremony, alien elegance, stealth,
    spectacle, or mythic futurism; the tone should feel specific to Hologram while still obeying the
    prompt's adult, cute, severe, sensual, strange, or practical intent when supplied.
  rendering_and_quality: >-
    Finish with believable costume engineering, clean edge logic, strong silhouette, readable
    material physics, and no generic cosplay blur; prioritize clean style recognition, believable
    material physics, prompt preservation, controlled detail, and no watermark, fake text, or
    accidental UI.
  key_features: >-
    Monochrome sci-fi hologram, distant-transmission shimmer, long-range signal urgency; Scanlines,
    horizontal-interlaced banding, ghost-flicker edge, translucent signal contour, projection-field
    taper; Light interference, scanline-grid pattern, signal-degradation static, transparency-fade,
    projection-grain, chromatic-fringe; Self-lit emissive-blue glow, projection-cone light,
    low-distant-plane contrast and flicker-instability pulse; character-design readability, suit
    silhouette, power-shape hierarchy, modular gear rhythm, and transformation focus
  creative_brief: >-
    Use Hologram after prompt X as a transferable fashion/costume layer: prompt X supplies subject,
    motion, setting, tone, and intensity, while the preset supplies Monochrome sci-fi hologram,
    distant-transmission shimmer, long-range signal urgency, Scanlines, horizontal-interlaced
    banding, ghost-flicker edge, translucent signal contour, projection-field taper, Light
    interference, scanline-grid pattern, signal-degradation static, transparency-fade,
    projection-grain, chromatic-fringe, Self-lit emissive-blue glow, projection-cone light,
    low-distant-plane contrast and flicker-instability pulse, character-design readability, suit
    silhouette, power-shape hierarchy, modular gear rhythm, and transformation focus plus paneling,
    harnesses, armor modules, robe systems, implant seams, luminous channels, survival layers, and
    invented fastenings, palette behavior, light response, material treatment, silhouette grammar,
    and finish discipline without requiring one body type, fixed outfit, venue, prop bundle, or card
    composition.
