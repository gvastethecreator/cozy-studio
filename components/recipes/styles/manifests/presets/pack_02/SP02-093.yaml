visualDna:
  aesthetic: 'Prehistoric cave painting: ochre, charcoal and red iron pigment blown and smeared onto a bumpy limestone wall by firelight.'
  subject_treatment: Keep the prompt subject intact and paint it as a cave-wall image in pigment on rock, simplified into flowing outlines and filled silhouettes, without adding a cave scene around it.
  color_and_tone: Red and yellow ochre, charcoal black, bone-white calcite on warm tan stone.
  lighting_and_shadow: Flickering torchlight from below, the rock relief catching warm light.
  texture_and_material: Spray-blown hand stencils, finger-smeared pigment, cracks and calcite drips, rock bulges used as body volume.
  camera_and_composition: Figures arranged along the natural contours of the wall, overlapping freely.
  atmosphere_and_mood: Ancient and ritual, the first images made by firelight.
  rendering_and_quality: Real pigment on stone; not a flat tribal graphic and not modern clip art.
  key_features: ochre and charcoal pigment; spray-blown hand stencils; rock relief as volume; torchlight; overlapping figures
  creative_brief: "Prehistoric cave painting: ochre, charcoal and red iron pigment blown and smeared onto a bumpy limestone wall by firelight. Carry it through ochre and charcoal pigment, spray-blown hand stencils, rock relief as volume, torchlight, overlapping figures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
