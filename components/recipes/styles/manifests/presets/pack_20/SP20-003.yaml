visualDna:
  aesthetic:
    Photocopied graphic illustration with compact dark blocks, clipped intermediate values and selective
    toner breakup.
  subject_treatment:
    Retain the supplied silhouette and identifying details while reducing secondary tonal transitions
    into larger graphic regions.
  color_and_tone:
    Prioritize strong light-dark separation within the requested palette. Keep important mid-values
    distinct instead of crushing every dark feature.
  lighting_and_shadow:
    Translate lighting into a short stepped value range. Preserve enough separation to read overlapping
    forms.
  texture_and_material:
    Concentrate slight dropout inside large dark fills and a little edge spread at dense boundaries.
    Keep the surrounding support clean unless aging is requested.
  camera_and_composition:
    Preserve camera and composition. Toner breakup is a reproduction property, not permission
    to crop the subject or invent a zine page.
  atmosphere_and_mood: Follow the user tone; high-contrast reproduction need not imply aggression, horror or deterioration.
  rendering_and_quality:
    Use coherent blocks and sparse reproduction flaws. Avoid full-frame dirt, arbitrary torn
    edges and unreadable focal details.
avoidRules:
  - full-frame dirt overlay
  - unrequested torn page edges
  - indiscriminate crushed detail
