    surgical care cues, and living-surface transformation; motifs can become contour, surface,
    costume, equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through mycelium cream, chlorophyll green, nerve pink, surgical teal, graphite, damp
    umber, spore gold, and soft white contrasts; keep dominant, support, and accent values readable,
    avoid muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
