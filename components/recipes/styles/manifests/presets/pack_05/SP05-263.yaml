visualDna:
  aesthetic: Graphic anime ink whose contours break into dashes at uneven intervals, like a lost transmission, separated by large clean pockets of near-black negative space.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: A black-and-ash value range with one narrow cold cyan or acid-green accent on a single edge; prompt colors survive as small muted patches.
  lighting_and_shadow: Isolated sharp pulses of reflected color on a few edges against broad flat shadow; no visible screen or light fixture is added.
  texture_and_material: Dry graphic edges, sparse dot noise that thins as it nears the subject, and flat matte black fields without grain.
  camera_and_composition: Keep the requested framing; near-black negative pockets fill about half the frame so the dashed subject floats inside them.
  atmosphere_and_mood: Visual silence and numb detachment; nothing in the picture is loud.
  rendering_and_quality: Crisp dashed contours of even weight, clean black fills and one accent color; illustrated, never a photographed object on black.
  key_features: broken dash contours; large near-black negative pockets; one cyan or acid-green edge accent; thinning dot noise; flat matte blacks
  creative_brief: "Graphic anime ink whose contours break into dashes at uneven intervals, like a lost transmission, separated by large clean pockets of near-black negative space. Carry it through broken dash contours, large near-black negative pockets, one cyan or acid-green edge accent, thinning dot noise, flat matte blacks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
