  color_and_tone: Muted realistic tones with uncanny accents, true to the Satoshi Kon palette.
  lighting_and_shadow: Ordinary light with uncanny reflections, lit the way Satoshi Kon lights its scenes.
  texture_and_material: Precise realist line, with the surface finish of Satoshi Kon.
  camera_and_composition: Mirror compositions and match-cut continuity, framed the way Satoshi Kon composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with uncanny reality slip.
  rendering_and_quality: Precise uncanny realist illustration, in the recognizable hand of Satoshi Kon.
