visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around tapered looping ink
    strokes that echo existing curves, with ornament kept subordinate to the main
    silhouette. For color and surface, keep the requested hues and build a
    rich black-plum range with selective dusty rose or burgundy accents. Decadence may
    feel elegant or uneasy through excess line detail, but need not imply danger,
    romance, or a period setting
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through tapered looping ink strokes that
    echo existing curves, with ornament kept subordinate to the main silhouette; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep the requested hues and
    build a rich black-plum range with selective dusty rose or burgundy accents. Keep
    values legible across the prompted light and dark range; do not crush midtones or
    dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use small warm specular cuts
    against velvety shadow, preserving the actual light source and form readability.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; layer fine etched lines over smooth lacquer-like
    color only where the source material supports a polished finish. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; let the
    curved strokes follow already-present contours and empty spaces without creating
    decorative props or symmetry. Use the mark rhythm inside the supplied composition
    rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Decadence may feel elegant or uneasy
    through excess line detail, but need not imply danger, romance, or a period setting.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and tapered looping ink strokes that echo
    existing curves, with ornament kept subordinate to the main silhouette; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    tapered looping ink strokes that echo existing curves, with ornament kept
    subordinate to the main silhouette; keep the requested hues and build a rich
    black-plum range with selective dusty rose or burgundy accents; use small warm
    specular cuts against velvety shadow, preserving the actual light source and form
    readability; layer fine etched lines over smooth lacquer-like color only where the
    source material supports a polished finish; and let the curved strokes follow
    already-present contours and empty spaces without creating decorative props or
    symmetry. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use tapered looping ink strokes that echo
    existing curves, with ornament kept subordinate to the main silhouette, keep the
    requested hues and build a rich black-plum range with selective dusty rose or
    burgundy accents, use small warm specular cuts against velvety shadow, preserving
    the actual light source and form readability, and layer fine etched lines over
    smooth lacquer-like color only where the source material supports a polished finish;
    the prompt supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
