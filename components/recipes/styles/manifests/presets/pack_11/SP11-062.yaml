visualDna:
  aesthetic: 'Fiber macro: fabric seen so close that threads become cables and weave becomes architecture.'
  subject_treatment: "Show the prompt's subject at this magnification, or let its shape and action emerge from this specimen texture while staying recognizable: woven into or shown among individual threads: twisted fibers, weave crossings and loose fuzz."
  color_and_tone: Thread colors with soft shadowed depth, as the instrument or lens would record it.
  lighting_and_shadow: Side light revealing twist and weave depth, matching the real imaging setup at this scale.
  texture_and_material: Individual fibers, twist, fuzz and weave, resolved in fine detail at extreme magnification.
  camera_and_composition: Extreme close-up or microscope field with shallow or instrument-specific depth, the specimen filling the frame and scale implied by structure.
  atmosphere_and_mood: Tactile, intricate, cozy and surprising, from discovering a hidden world at tiny scale.
  rendering_and_quality: Scientific-grade macro or micrograph realism with crisp structure and believable optics.
  key_features: thread twist; weave crossings; fuzz
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fiber/Fabric Macro as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
