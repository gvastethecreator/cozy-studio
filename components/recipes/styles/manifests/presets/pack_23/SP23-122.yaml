visualDna:
  aesthetic: 'Victorian fairy painting: obsessively detailed paintings of tiny winged folk in grass and flowers, crowded scenes of fairy courts, feasts and quarrels at mouse scale.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; shrink the subject to fairy scale among giant grass blades, mushrooms and petals.
  color_and_tone: Twilight greens, moonlit silver, glowing fairy gold, kept consistent across the whole image.
  lighting_and_shadow: Soft moonlight and small magical glows, kept consistent across the whole image.
  texture_and_material: Fine oil detail, dewdrops, gauzy wings and petals.
  camera_and_composition: Low ground-level view crowded with tiny figures, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with uncanny miniature enchantment.
  rendering_and_quality: Crowded meticulous detail with readable focal figures, kept consistent across the whole image.
  creative_brief: "Victorian fairy painting: obsessively detailed paintings of tiny winged folk in grass and flowers, crowded scenes of fairy courts, feasts and quarrels at mouse scale. Carry it through tiny winged folk, giant grass, crowded court, moonlit glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tiny winged folk; giant grass; crowded court; moonlit glow
