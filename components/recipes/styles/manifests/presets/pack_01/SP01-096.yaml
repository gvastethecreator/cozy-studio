visualDna:
  aesthetic: 'Super 8 home movie: a single frame pulled from a tiny-gauge reversal film shot at 18 frames per second on a handheld family camera.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Warm saturated reversal color, strong reds and yellows, slightly magenta skin, milky highlights and a faint exposure flicker across the frame.
  lighting_and_shadow: Available daylight or a harsh movie light; auto-exposure swings leave one side slightly brighter.
  texture_and_material: Coarse, dancing grain relative to the tiny frame, soft focus, motion smear on anything moving, faint dust specks.
  camera_and_composition: Keep the requested subject and setting; handheld 4:3-feeling framing, slight tilt, subject caught mid-movement.
  atmosphere_and_mood: Tender and far away, flickering joy caught between two blurred frames.
  rendering_and_quality: Projected home-movie look without sprocket holes, gate edges, frame counters or scratches drawn as overlay.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Super 8 Home-Movie Film as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: coarse home-movie grain; 18 fps motion smear; warm reversal color; exposure flicker; handheld softness
