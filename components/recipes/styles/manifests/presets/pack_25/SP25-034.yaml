visualDna:
  aesthetic: 'Carved Pixel Glyphs: icons built from whole pixel clusters and quantized voids on a fixed logical grid, with stepped rhythm and clean silhouettes.'
  subject_treatment: Build the prompt's subject or requested actions from whole pixel clusters on a fixed logical grid such as 16, 20 or 24 pixels, with quantized gaps.
  color_and_tone: Two or three exact palette values with hard edges between them.
  lighting_and_shadow: Hard pixels only, with optional volume shown as discrete bands.
  texture_and_material: Whole pixels in deliberate clusters, every one of them placed on purpose.
  camera_and_composition: Aligned to the logical grid, silhouettes balanced by clusters.
  atmosphere_and_mood: Digital economy with a stepped rhythm, crisp and modern.
  rendering_and_quality: Shown at native size and at a whole-number enlargement with sharp edges.
  creative_brief: "Carved Pixel Glyphs: icons built from whole pixel clusters and quantized voids on a fixed logical grid, with stepped rhythm and clean silhouettes. Carry it through whole pixel clusters, fixed logical grid, exact palette, stepped rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whole pixel clusters; fixed logical grid; exact palette; stepped rhythm
