visualDna:
  aesthetic: >-
    Build the graphic anime treatment from clean broadcast contours with selective line-weight
    changes and friendly bold geometry divided into simple color zones. Let open arcs that buoy
    the existing gesture set its rhythm; use clear primary colors, white, and a strong dark
    outline for color and smooth broadcast-cel fills with almost no surface noise for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use clean broadcast contours with selective
    line-weight changes for edge work, friendly bold geometry divided into simple color zones for
    form simplification, and open arcs that buoy the existing gesture only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with clear primary colors, white, and a strong dark outline. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: bright even value separation with uncomplicated cel shadows. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth broadcast-cel fills with almost no surface noise,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use clear focal hierarchy, simplified depth planes, and
    uncluttered margins to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey optimism and forward-looking clarity, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with polished flat fills, stable outlines, and readable distant forms; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    clean broadcast contours with selective line-weight changes; friendly bold geometry divided
    into simple color zones; clear primary colors, white, and a strong dark outline; open arcs
    that buoy the existing gesture; smooth broadcast-cel fills with almost no surface noise; clear
    focal hierarchy, simplified depth planes, and uncluttered margins.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with clean broadcast
    contours with selective line-weight changes, friendly bold geometry divided into simple color
    zones, and clear primary colors, white, and a strong dark outline; use open arcs that buoy the
    existing gesture only where movement is already present, and apply smooth broadcast-cel fills
    with almost no surface noise as the drawing finish.
