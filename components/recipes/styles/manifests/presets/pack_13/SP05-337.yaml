visualDna:
  aesthetic: 'Yoh Yoshinari animation look as in Little Witch Academia: bouncy elastic magic, firework effects, blueprint-like technical magic and bright joyful draftsmanship.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Yoshinari designs, bouncy shapes and expressive faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright magic colors and blueprint cyan, true to the Yoh Yoshinari palette.
  lighting_and_shadow: Firework magic light, lit the way Yoh Yoshinari lights its scenes.
  texture_and_material: Clean energetic line and effects, with the surface finish of Yoh Yoshinari.
  camera_and_composition: Dynamic magic bursts, framed the way Yoh Yoshinari composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with joyful technomagic energy.
  rendering_and_quality: Energetic Trigger-style animation frame, in the recognizable hand of Yoh Yoshinari.
  key_features: Yoh Yoshinari magic; fireworks; blueprint arcs
  creative_brief: "Yoh Yoshinari animation look as in Little Witch Academia: bouncy elastic magic, firework effects, blueprint-like technical magic and bright joyful draftsmanship. Carry it through Yoh Yoshinari magic, fireworks, blueprint arcs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
