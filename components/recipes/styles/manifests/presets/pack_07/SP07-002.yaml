visualDna:
  aesthetic: 'Industrial loft conversion: a former warehouse shell with riveted steel trusses, cast-iron columns, raw brick and steel-framed factory glazing left exposed, furnished sparingly inside it.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Brick red-brown, graphite steel, concrete grey and oiled-wood amber; one oxidised copper or rust accent; contrast medium-high between dark steel and window light.
  lighting_and_shadow: Hard daylight through tall multi-pane steel windows casting gridded shadow across the floor, bare-bulb or enamel pendants as secondary practicals.
  texture_and_material: Rough lime-mortared brick with soot, riveted and bolted steel, scarred wide-plank floors or power-floated concrete, exposed ducts and conduit runs.
  camera_and_composition: Keep the requested view; show ceiling height with the truss rhythm receding, window grid repeating along one wall, human-scale furniture small in a big volume.
  atmosphere_and_mood: Raw, spacious and working, a factory shell re-inhabited.
  rendering_and_quality: 'Documentary interior photograph: honest wear, readable rivets and mortar joints, no shabby-chic distressing painted on new surfaces.'
  key_features: riveted steel trusses; raw soot-marked brick; steel-framed factory glazing; gridded window shadow; exposed ducts and conduit
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Industrial Loft as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
