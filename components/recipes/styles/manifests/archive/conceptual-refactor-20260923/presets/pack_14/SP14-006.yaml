visualDna:
  aesthetic: >-
    Ash-Crown Oracle Decree acts as a transferable mythic-noir router: ash translated into dark
    symbolic behavior, crown translated into dark symbolic behavior plus oracle translated into dark
    symbolic behavior fused with ritual noir with legalistic omen logic, candle compression,
    confessional shadow, taboo elegance, and ceremonial menace; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    regalia-like silhouette emphasis and authority-bearing contour, ash shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus oracle shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through ash gray, char black, and dim ember warmth, crown-weighted accent roles over
    disciplined dark values plus oracle-weighted accent roles over disciplined dark values together
    with velvet black, sealing-wax red, old ivory, tarnished brass, moonsteel blue, rain gloss, and
    restrained poisonous glow; values stay separated, accents feel intentional, and the dark palette
    supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use low ember haze and powder-soft falloff plus oracular glow, smoke-veiled highlights, and
    hidden source illumination with low-key noir pools, narrow rim cuts, wet reflections, candle
    bloom, and occult glow that never flattens the subject; shadows must carry omen weight, rims
    should clarify form, and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render powdered ash, soot residue, matte char, and dry mineral dust, charred metal, tarnish, and
    sharp ceremonial edges plus ash, smoke, polished bowl surfaces, and old paper alongside wax
    seals, ledger paper, velvet pile, rain-wet stone, tarnish, soot, blade sheen, veils, and powdery
    ash; surface scale, patina, residue, gloss, grain, and carved or sealed edges must remain
    coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with edict-like hierarchy and formal spacing, ash converted into repeatable spatial rhythm
    and symbolic hierarchy plus crown converted into repeatable spatial rhythm and symbolic
    hierarchy plus interrogation axes, compressed processional bands, sealed-grid order, reflected
    doubles, and off-axis ritual tension; the style should support portraits, objects, architecture,
    creatures, symbols, and full scenes through reusable spatial grammar instead of one fixed
    layout.
  atmosphere_and_mood: >-
    Carry mood through mourning, aftermath, and burned authority, prophecy, secrecy, and official
    ambiguity plus official omen authority and spoken law and adult secrecy, suspicion, judgment,
    mourning, seduction, dread, and the feeling of a private rite becoming public; the image can
    become severe, sensual, sacred, violent, quiet, or strange when prompt X asks for it, while the
    preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with ash recognition with denoised dark editorial polish and controlled material truth
    plus crown recognition with denoised dark editorial polish and controlled material truth and
    clean noir illustration with heavy denoise, readable silhouettes, disciplined glow, and no
    accidental UI or readable text; prioritize clean denoise, readable dark values, strong
    silhouette hierarchy, tactile material truth, and no watermark, fake text, logos, accidental UI,
    or muddy black crush.
  key_features: >-
    ash translated into dark symbolic behavior, crown translated into dark symbolic behavior plus
    oracle translated into dark symbolic behavior; regalia-like silhouette emphasis and
    authority-bearing contour, ash shaping silhouette rhythm, contour pressure, and symbolic edge
    control plus oracle shaping silhouette rhythm, contour pressure, and symbolic edge control;
    powdered ash, soot residue, matte char, and dry mineral dust, charred metal, tarnish, and sharp
    ceremonial edges plus ash, smoke, polished bowl surfaces, and old paper; low ember haze and
    powder-soft falloff plus oracular glow, smoke-veiled highlights, and hidden source illumination;
    edict-like hierarchy and formal spacing, ash converted into repeatable spatial rhythm and
    symbolic hierarchy plus crown converted into repeatable spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Ash-Crown Oracle Decree after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies ash translated into
    dark symbolic behavior, crown translated into dark symbolic behavior plus oracle translated into
