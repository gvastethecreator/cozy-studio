visualDna:
  aesthetic: 'Aurora ribbons: shimmering green and violet light ribbons wrapping the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: ribbons of aurora light wrap loosely around the target.'
  color_and_tone: Green, teal and violet glow, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Soft self-illuminating glow, so the effect lights the target and casts believable local light.
  texture_and_material: Translucent curtain-like light ribbons, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Magical, serene, cold and wondrous, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  creative_brief: "Aurora ribbons: shimmering green and violet light ribbons wrapping the target. Carry it through aurora light ribbons, translucent glow, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: aurora light ribbons; translucent glow; contained around the target
