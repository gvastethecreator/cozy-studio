visualDna:
  aesthetic: >-
    Opaque acrylic illustration formed by broad overlapping brush deposits, building volume through
    paint coverage rather than transparent glazing.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let covering strokes follow the
    existing forms without changing their silhouette or simplifying away defining features.
  color_and_tone: >-
    Separate light, middle and dark value groups clearly within the requested colors. Do not impose
    a fixed palette or add accent colors.
  lighting_and_shadow: >-
    Follow the requested illumination and shadow placement. Use opaque coverage and deliberate edge
    changes to describe them without inventing gloss or a new light source.
  texture_and_material: >-
    Use short matte brush marks with discreet corrections where strokes overlap. Keep marks connected
    to form rather than adding detached decorative strokes.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not reframe to make
    room for an unrequested card layout.
  atmosphere_and_mood: >-
    Retain the requested mood. Opaque paint coverage does not require a heroic, theatrical or staged
    presentation.
  rendering_and_quality: >-
    Keep coverage opaque and value groups legible. Reserve visible brush texture for selected marks
    instead of applying a uniform effect.
avoidRules:
  - decorative brush marks detached from form
  - loose photographic shading
