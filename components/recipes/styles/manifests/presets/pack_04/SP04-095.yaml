visualDna:
  aesthetic: >-
    Foliage Design Kit acts as a transferable illustration router: start from Vegetation design kit
    with broad botanical shape-library coverage, natural poetry, and production readability,
    Silhouette readability sets, species variation matrices, season-state alternatives and
    production concept-art system built from iteration discipline, silhouette testing, material
    exploration, design readability, and pitch-ready visual decisions, then apply the visual
    behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Organic contour families spanning canopy, shrub, vine, and
    groundcover archetypes; preserve the requested subject while routing it through design
    exploration, asset logic, value blocking, scale cues, iteration rows, paintover marks, or
    production-readability constraints, keeping the requested identity, silhouette, pose, object
    function, or setting legible.
  color_and_tone: >-
    Build color with Seasonal green-driven spectrum with bark/flower accent channels; use color as
    concept decision-making: mood scripts, material swatches, faction accents, environment
    atmosphere, asset tier contrast, or readable pass separation, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Dappled canopy light with subsurface hints and cool understory shadow;
    shape light for ideation clarity through value block-in, keyframe contrast, material test
    highlights, callout illumination, or pitch-frame atmosphere, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Differentiated plant surface behaviors (waxy, fibrous, rough bark, soft moss); surface
    detail should reveal brush passes, photobash integration, low-poly facets, callout texture,
    massing blocks, costume fabrics, foliage clusters, or weapon material tiers when named, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Layered ecosystem depth from near field clusters to atmospheric
    canopy fade; compose through production hierarchy, variants, orthographic logic, isometric
    staging, silhouette grids, iteration boards, or cinematic keyframe balance without locking one
    finished illustration, with scale, spacing, edge rhythm, and visual hierarchy doing the style
    work.
  atmosphere_and_mood: >-
    Keep the mood Lush, breathable, ecosystem-rich, mood carried by Foliage Design Kit craft,
    material pressure, and visual restraint; derive mood from exploration, worldbuilding pressure,
    tactical design, creature unease, kitbash utility, cinematic intent, or production-room clarity,
    letting the style alter interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Reference-oriented foliage exploration balancing stylization and realism; finish
    with concept-art usefulness, readable decisions, controlled roughness, and no generic fantasy
    wallpaper or overpolished final render when iteration is intended, clean denoised surfaces where
    appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    Vegetation design kit with broad botanical shape-library coverage, natural poetry, and
    production readability; Silhouette readability sets, species variation matrices, season-state
    alternatives; Seasonal green-driven spectrum with bark/flower accent channels; Differentiated
    plant surface behaviors (waxy, fibrous, rough bark, soft moss); Layered ecosystem depth from
    near field clusters to atmospheric canopy fade
  creative_brief: >-
    Apply Foliage Design Kit as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Vegetation design kit with broad botanical shape-library coverage, natural poetry, and
    production readability, Silhouette readability sets, species variation matrices, season-state
    alternatives, Differentiated plant surface behaviors (waxy, fibrous, rough bark, soft moss)
    without requiring the card image's original subject.
