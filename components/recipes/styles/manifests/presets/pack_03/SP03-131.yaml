visualDna:
  aesthetic: 'Animated-film food: dishes simplified into plump rounded shapes with exaggerated glossy sauces, jewel-bright colors and soft painterly subsurface, as cooked in a feature cartoon.'
  subject_treatment: Keep the prompt subject, action, setting and camera; food is simplified into plump stylized shapes, and any other subject keeps its identity while taking the same warm, glossy finish.
  color_and_tone: Jewel-bright reds, butter yellows and herb greens with warm golden highlights and colored shadows, never grey.
  lighting_and_shadow: Warm key with a glowing rim, big soft specular blobs on sauces and a steam wisp lit from behind.
  texture_and_material: Simplified crumb and grill marks, thick glossy sauce ribbons, plump rounded volumes and painterly subsurface in fruit and cheese.
  camera_and_composition: Keep the requested view; a slightly low angle makes the dish look heroic and huge.
  atmosphere_and_mood: Cozy and mouthwatering, comfort food in a storybook kitchen.
  rendering_and_quality: Stylized feature-animation finish, distinct from hyperreal food advertising and from clay or toy food.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Animated-Film Food Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: plump simplified food shapes; exaggerated glossy sauce; jewel-bright colors; colored shadows; backlit steam wisp
