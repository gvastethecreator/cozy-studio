visualDna:
  aesthetic: >-
    Build three-dimensional forms from a restrained number of clear polygonal planes, low-resolution
    surface detail and controlled local light. Keep silhouettes and occlusion legible, with tonal
    transitions shaped by the forms rather than atmospheric effects.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and functional details.
    Use visible facets to clarify existing volumes without simplifying away distinctive structure or
    adding characters, equipment or narrative action.
  color_and_tone: >-
    Preserve the requested palette and tonal relationships. Keep facets and texture colors coordinated
    with the requested light; do not force an all-dark range or fixed color grade.
  lighting_and_shadow: >-
    Follow the requested light sources, direction and intensity. Keep light falloff local and shadows
    readable on existing surfaces; do not add fog, darkness or dramatic illumination.
  texture_and_material: >-
    Use low-resolution texture detail selectively to support the real materials in the image. Keep
    texture scale consistent and restrained rather than covering every surface with repeating pixels
    or noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, perspective and arrangement. Do not impose a first-person
    camera, perspective distortion, interface or weapon-in-view framing.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Faceted geometry and constrained light are rendering choices,
    not a request for a dungeon, fog, horror or any specific narrative setting.
  rendering_and_quality: >-
    Keep polygonal planes coherent, occlusion clear and small textures subordinate to form. Maintain
    the requested output scale without adding scanlines, lens distortion or a simulated display filter.
avoidRules:
  - unrequested first-person camera, perspective distortion or weapon-in-view framing
  - unrequested dungeon, fog, character or combat scene
  - forced darkness or dramatic light effects
  - repeating pixel texture or noise over every surface
