visualDna:
  aesthetic: >-
    Sticker Art operates as a portable source-router layer: combine Die-cut sticker, laptop-decal
    culture, public-space-art collectible, vinyl peel-and-stick with hand-built object logic with
    toy scale, assembly marks, tactile charm, and playful construction, so the preset supplies
    visual behavior rather than a fixed card scene or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms simplify,
    assemble, soften, hinge, stitch, fold, carve, or snap together through Thick white border,
    contour-cut outline, clean-vector edge, kiss-cut precision; identity stays readable through
    construction grammar, proportion, edge logic, and detail scale as this preset is applied.
  color_and_tone: >-
    Map color through material-native color blocks, toy-safe saturation, handmade variance, and
    clean separation between parts; keep hue roles intentional, value separation clear, and palette
    behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Flat, no cast-shadow, even-diffuse daylight, matte-surface clarity plus small-scale object
    lighting, crisp edge readability, soft contact shadows, and material-specific highlights as the
    light-response contract, with readable hierarchy, controlled contact detail, and no lighting
    choice that erases the user's requested content.
  texture_and_material: >-
    Render Glossy paper, vinyl laminate, weatherproof film, water-resistant coating, tacky adhesive
    back plus plastic, clay, yarn, paper, wood, metal, felt, ice, tile, thread, sand, or carved
    surface behavior; surface scale, residue, gloss, grain, fiber, pores, edges, or signal artifacts
    must remain coherent across figures, objects, and environments.
  camera_and_composition: >-
    Compose with 2D cutout, die-line silhouette, punch-out negative space, floating-object illusion
    plus object-scale staging, modular silhouette rhythm, clear construction reads, and tactile
    detail hierarchy as reusable framing grammar, allowing cards, portraits, objects, scenes, and
    abstract prompts to inherit the style without one required layout.
  atmosphere_and_mood: >-
    Carry mood through play, collectability, handmade care, nostalgia, miniature engineering, and
    physical charm; the emotional tone should feel specific to Sticker Art while still obeying the
    prompt's subject and context.
  rendering_and_quality: >-
    Finish with clean craft detail, readable construction, deliberate imperfections, and no
    accidental realism collapse; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Die-cut sticker, laptop-decal culture, public-space-art collectible, vinyl peel-and-stick; Thick
    white border, contour-cut outline, clean-vector edge, kiss-cut precision; Glossy paper, vinyl
    laminate, weatherproof film, water-resistant coating, tacky adhesive back; Flat, no cast-shadow,
    even-diffuse daylight, matte-surface clarity; 2D cutout, die-line silhouette, punch-out negative
    space, floating-object illusion
  creative_brief: >-
    Use Sticker Art after prompt X as a transferable style layer: prompt X supplies subject, action,
    and setting, while the preset supplies Die-cut sticker, laptop-decal culture, public-space-art
    collectible, vinyl peel-and-stick, Thick white border, contour-cut outline, clean-vector edge,
    kiss-cut precision, Glossy paper, vinyl laminate, weatherproof film, water-resistant coating,
    tacky adhesive back, Flat, no cast-shadow, even-diffuse daylight, matte-surface clarity, 2D
    cutout, die-line silhouette, punch-out negative space, floating-object illusion plus clearly
    expressed joins, simplified proportions, craft tolerances, modular parts, and maker-process
    evidence, palette behavior, light response, material treatment, and finish discipline without
    requiring one specimen, prop bundle, product still, or card composition.
