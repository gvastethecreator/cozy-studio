visualDna:
  aesthetic: 'Anime action frame staged as a forward rush: the subject lunges toward the lens along converging diagonals, its nearest limb foreshortened to about twice its size, depth squeezed like a narrow passage.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the forward-rush staging, foreshortening and converging depth lines, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; cooler dark-blue values in the background push the warmer, lighter subject forward.
  lighting_and_shadow: Hard cel edge highlights on the leading side of the subject, aligned with its travel; no flashes or sparks.
  texture_and_material: Crisp cel contours with three to six tapered motion streaks attached only to trailing edges.
  camera_and_composition: A 24 mm-equivalent low front three-quarter view, the leading hand or foot almost touching the lens, the vanishing point tucked behind the subject's shoulder.
  atmosphere_and_mood: Forward pressure and urgency that live in the framing, not in added danger.
  rendering_and_quality: Sharp 2D cel rendering with stable anatomy through the foreshortening and clean foreground-to-background separation.
  key_features: lunge toward the lens; leading limb foreshortened to double size; converging diagonals; compressed depth; tapered trailing streaks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Action Burst Alley Rush as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
