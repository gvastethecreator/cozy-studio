visualDna:
  aesthetic: 'Bill Plympton animation look of the 1980s to 2010s: every frame drawn in colored pencil, grotesque surreal body morphs, faces stretching and folding, deadpan violent gags and jittery hand-drawn boil.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in colored pencil and let its body morph grotesquely and surreally. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Colored pencil hatching in warm flesh, blue and mustard.
  lighting_and_shadow: Pencil-shaded light with visible hatching, lit the way Bill Plympton lights its scenes.
  texture_and_material: Colored pencil on paper with jittery line boil.
  camera_and_composition: Close-ups that morph from one form to another.
  atmosphere_and_mood: Keep the requested mood with grotesque deadpan absurdity.
  rendering_and_quality: Faithful colored-pencil animation frame, in the recognizable hand of Bill Plympton.
  creative_brief: "Bill Plympton animation look of the 1980s to 2010s: every frame drawn in colored pencil, grotesque surreal body morphs, faces stretching and folding, deadpan violent gags and jittery hand-drawn boil. Carry it through Plympton colored pencil, surreal body morphs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Plympton colored pencil; surreal body morphs
