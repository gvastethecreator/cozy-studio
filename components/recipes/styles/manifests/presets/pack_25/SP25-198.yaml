visualDna:
  aesthetic: 'Width-Axis Exploration: one word shown in compact, regular and wide versions at the same height and weight, redrawn for each width.'
  subject_treatment: Show the requested word in three related widths at the same height and apparent weight, redrawing counters and spacing for each.
  color_and_tone: One common ink for comparing form, with notes outside the art.
  lighting_and_shadow: Flat specimen with no light favoring any width.
  texture_and_material: Clean contours and a constant apparent weight across versions.
  camera_and_composition: Same word and reference height with declared widths aligned.
  atmosphere_and_mood: One coherent family with different rhythms, clearly related.
  rendering_and_quality: Letters keep anatomy and weight as the width changes.
  creative_brief: "Width-Axis Exploration: one word shown in compact, regular and wide versions at the same height and weight, redrawn for each width. Carry it through three widths, same height, redrawn counters, aligned specimen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three widths; same height; redrawn counters; aligned specimen
