visualDna:
  aesthetic: 'Datamosh: compressed video motion vectors dragging pixels of one frame into the next.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: blocks of the image smear along motion paths while keyframe details bleed through."
  color_and_tone: Original colors smeared into streaked blocks, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Macroblock smears and motion trails, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Fluid, broken, hypnotic and digital, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: motion-vector smear; macroblock drag; bleeding keyframe
  creative_brief: "Datamosh: compressed video motion vectors dragging pixels of one frame into the next. Carry it through motion-vector smear, macroblock drag, bleeding keyframe. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
