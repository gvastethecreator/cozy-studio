visualDna:
  aesthetic: >-
    Source-informed video-game style router for original retrofuturist first-person mech survival
    captures: rural forest roads, abandoned utility structures, hostile machine silhouettes,
    scavenged weapons, weathered 1980s tech, and readable stealth/combat routes. Land as a fictional
    machine-survival setting, not an isometric tactics map.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable first-person survival screenshot
    subject: keep clear threat/object role, foreground weapon/tool scale, cover, patrol spacing,
    loot/interactable affordance, and escape route without copying source locations or robots.
  color_and_tone: >-
    Use a rural mech-survival palette: pine green, cold sky grey, rust orange, old enamel red, wet
    asphalt blue, dull steel, and warning amber. Keep value grouping legible through forest clutter.
  lighting_and_shadow: >-
    Light the image through low Nordic sun, flashlight beams, robot sensor glow, muzzle flashes, and
    misty forest shadow. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from wet grass, concrete bunkers, robot hydraulics, backpacks, old cars, chipped
    paint, and rural decay. Materials should feel like in-engine game assets captured during play,
    with enough texture identity to separate props, terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person weapon/tool camera, foreground cover, mid-distance machine or
    objective, route depth, and survival decision. Avoid strategy overview and generic robot promo
    framing.
  atmosphere_and_mood: >-
    Carry an original alloy-forest survival mood: lonely, tactical, rural, mechanical, uneasy, and
    scavenged.
  rendering_and_quality: >-
    Finish as coherent first-person immersive survival shooter screenshot style, not concept art:
    sparse HUD, detection pips, ammo/tool cues, and objective markers can appear abstractly.
    Maintain heavy-denoise clarity, readable silhouettes, and no readable signage/logos.
  key_features: >-
    Generation Zero gameplay screenshots; open-world robot-hunt capture with Scandinavian forests,
    abandoned roads, large machines, guerrilla gear, and distant threat silhouettes; pine green, fog
    grey, rust orange, warning red, military olive, and cold blue sky; low Nordic sun, flashlight
    beams, robot sensor glow, muzzle flashes, and misty forest shadow; wet grass, concrete bunkers,
    robot hydraulics, backpacks, old cars, chipped paint, and rural decay; first-person or
    third-person survival shooter framing with machine scale, cover routes, weak points, and ambush
    distance; lonely, tactical, rural, mechanical, and uneasy; HUD guidance: weapon/ammo HUD,
    compass, stealth markers, and machine tags can appear if modest and readable
  creative_brief: >-
    Use Alloy Forest Ambush as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through retrofuturist mech-survival references: first-person camera, rural
    machine threats, scavenged materials, cover routes, and readable survival pressure. Avoid
    strategy-tactics framing, exact village copies, and generic robot forest renders.
