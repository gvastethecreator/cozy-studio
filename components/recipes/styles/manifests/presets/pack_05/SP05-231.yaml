visualDna:
  aesthetic: 'BONES RahXephon look (2002) with Akihiro Yamada designs: art nouveau-flavored elegant figures, singing ceramic-like mechs, Tokyo under a dome and musical mysticism.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Akihiro Yamada designs, refined faces, flowing hair and elegant uniforms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Coral pink, ceramic white, sea blue and gold.
  lighting_and_shadow: Soft resonant glow from ceramic mechs and luminous coral-tinted skies.
  texture_and_material: Clean cel with painterly art nouveau ornament and ceramic surfaces.
  camera_and_composition: Elegant balanced compositions and slow resonant reveals of singing mechs.
  atmosphere_and_mood: Keep the requested mood with mystical musical resonance.
  rendering_and_quality: Refined BONES television frame with art nouveau elegance and musical mysticism.
  key_features: RahXephon art nouveau; singing mechs; coral colors; resonance
  creative_brief: "BONES RahXephon look (2002) with Akihiro Yamada designs: art nouveau-flavored elegant figures, singing ceramic-like mechs, Tokyo under a dome and musical mysticism. Carry it through RahXephon art nouveau, singing mechs, coral colors, resonance. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
