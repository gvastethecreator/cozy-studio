visualDna:
  aesthetic: >-
    Expressive anime ink alternates dense black shapes with fine fashion-illustration
    strokes and edge accents.
  subject_treatment: >-
    Keep identity, pose, clothing; detail actual fabric and faces without adding a performer
    or companion.
  color_and_tone: >-
    Black, smoke violet, ivory, oxblood, cold blue; separate deep values from material mids.
  lighting_and_shadow: >-
    Narrow warm highlights against cool shadows only where prompt lighting supports them.
  texture_and_material: >-
    Velvet or lace only on present materials; otherwise matte ink and sparse dry brush.
  camera_and_composition: >-
    Respect camera and count; balance one focal area with open space, no interior setting.
  atmosphere_and_mood: >-
    Intimate tension only when requested; no automatic heartbreak, night, or confrontation.
  rendering_and_quality: >-
    Control blacks with thin highlights and clear mids; no gritty smears or costume
    injection.
  key_features: >-
    Dense expressive blacks, smoke-violet mids, selective fabric detail, precise highlights
  creative_brief: 'Apply a visual treatment centered on dense expressive blacks, smoke-violet mids, selective fabric detail, precise highlights. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
