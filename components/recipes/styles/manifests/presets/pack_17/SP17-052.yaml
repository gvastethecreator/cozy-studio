visualDna:
  aesthetic: >-
    Black parchment medieval omen style where siege pressure becomes abstract cartography, burnt
    edges, bone markers, and tactical dread.
  subject_treatment: >-
    Transform any prompt subject through siege-map hierarchy, burnt parchment contrast, omen-marker
    spacing, tactical diagonals, and anxious negative space without requiring readable maps, armies,
    or battlefield scenes.
  color_and_tone: Black parchment, bone white, ember red, soot gray, tarnished brass, and dull ochre.
  lighting_and_shadow: Flat ominous light with ember accents, hard silhouette cuts, and charred edge contrast.
  texture_and_material: Burnt paper, bone markers, soot, scratched ink, brass pins as abstract dots, and dry ash.
  camera_and_composition: >-
    Topographic tension, diagonal siege pressure, symbolic spacing, and map-like composition that
    remains textless and adapts to any subject.
  atmosphere_and_mood: >-
    Carry the prompt through Strategic, ominous, fatalistic, dry, and war haunted; adult editorial
    tension, devotional sensuality, medicinal unease, feudal decadence, and symbolic medieval
    weirdness; the tone should follow prompt X while preserving the preset's medieval-zine identity.
  rendering_and_quality: >-
    Clean dark parchment illustration with readable shapes, controlled ash texture, and no legible
    annotation.
  creative_brief: >-
    Apply this as a reusable style router over any prompt: preserve the user's subject while adding
    black parchment siege omen hierarchy, burnt map abstraction, tactical dread, and textless
    medieval strategy. Apply after prompt X: prompt X supplies subject, action, setting, tone, and
    intensity, while this preset supplies a style grammar of Black Parchment Siege Omen; Black
    parchment medieval omen style where siege pressure becomes abstract cartography; burnt edges;
    bone markers; tactical dread; siege map hierarchy, mood, material behavior, framing logic, and
    denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster,
    readable text, or sample-card composition.
  key_features: >-
    Black Parchment Siege Omen; Black parchment medieval omen style where siege pressure becomes
    abstract cartography; burnt edges; bone markers; tactical dread; siege map hierarchy
