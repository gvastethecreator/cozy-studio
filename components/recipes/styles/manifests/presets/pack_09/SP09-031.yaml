visualDna:
  aesthetic: 'Shiny latex: stretched glossy rubber film with sharp specular streaks.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is skinned in glossy stretched latex with tight specular streaks."
  color_and_tone: Black, red or colored latex with white highlights, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Strip lights drawing highlights along curves, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Glossy latex skin with stretch and tight reflections, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Sleek, provocative, strange and polished, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: glossy latex skin; specular streaks; stretched surface
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Latex (Shiny) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - replacing the target with the source product
  - explicit fetish content
  - matte
  - cloth
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
