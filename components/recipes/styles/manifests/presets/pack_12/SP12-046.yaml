visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Sable gameplay screenshots: open-world desert
    exploration capture with ligne-claire outlines, hoverbike travel, nomad camps, giant ruins, and
    flat-color calm. Apply this after prompt X; prompt X supplies the subject, action, setting, and
    intensity while this preset supplies capture language, camera grammar, material behavior,
    playable readability, and finish. Do not recreate an exact official level, character, logo, or
    marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Sable-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Sable-informed palette: sand peach, muted red, sky cyan, black ink outlines, pale yellow,
    and dusty lavender shadows. Keep value grouping legible at gameplay distance, with color accents
    behaving like route, danger, pickup, team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through soft desert sun, flat cel shade, gentle sunset gradients, and minimal
    bloom. Lighting must clarify the playable route, threat, focal subject, or objective and avoid
    generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from outlined tents, hoverbike panels, cloth wraps, ancient metal, smooth dunes,
    and hand-drawn environment edges. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person travel camera with small rider scale, broad horizon, route landmarks,
    and sparse UI comfort. The frame should read as a plausible gameplay capture; include UI/HUD
    only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Sable-derived mood: quiet, nomadic, contemplative, warm, and exploratory. The preset can
    become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but it
    should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal compass/objective and
    stamina-like traversal indicators are acceptable; keep it airy. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Sable gameplay screenshots; open-world desert exploration capture with ligne-claire outlines,
    hoverbike travel, nomad camps, giant ruins, and flat-color calm; sand peach, muted red, sky
    cyan, black ink outlines, pale yellow, and dusty lavender shadows; soft desert sun, flat cel
    shade, gentle sunset gradients, and minimal bloom; outlined tents, hoverbike panels, cloth
    wraps, ancient metal, smooth dunes, and hand-drawn environment edges; third-person travel camera
    with small rider scale, broad horizon, route landmarks, and sparse UI comfort; quiet, nomadic,
    contemplative, warm, and exploratory; HUD guidance: minimal compass/objective and stamina-like
    traversal indicators are acceptable; keep it airy
  creative_brief: >-
    Use Sable Solar Rail Nomads as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Sable: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
