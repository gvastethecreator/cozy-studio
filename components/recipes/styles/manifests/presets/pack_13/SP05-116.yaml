visualDna:
  aesthetic: >-
    Build form through pressure-variable ink strokes, wet pools, dry-bristle breaks and deliberate
    rice-paper negative space.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep ink monochrome by default,
    allowing only colors explicitly requested by the prompt.
  lighting_and_shadow: >-
    Use the ink's density and paper reserve as light and shadow; do not add a separate cinematic
    light source.
  texture_and_material: >-
    Show absorbent paper edges, pooled ink and bristle drag; keep strokes few and purposeful.
  camera_and_composition: >-
    Let negative space carry equal weight to the marked form; preserve the source composition.
  atmosphere_and_mood: >-
    Impact comes from the contrast of a decisive stroke and open paper; retain the prompt's meaning.
  rendering_and_quality: >-
    Translate any subject into ink value and stroke pressure without adding calligraphy, writing or
    a new gesture. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Pressure-variable sumi strokes; dry-bristle splinters; wet ink pools; rice-paper texture;
    negative-space impact.
  creative_brief: 'Apply this visual treatment to the requested content: Pressure-variable sumi strokes; dry-bristle splinters; wet ink pools; rice-paper texture; negative-space impact. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uniform fills erasing wet-pool and dry-bristle contrast
  - cel shading replacing pressure-variable strokes
  - weak value separation collapsing ink structure
