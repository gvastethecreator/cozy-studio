visualDna:
  aesthetic: 'Velvet garments: plush pile fabric that turns dark in shadow and glows where light grazes it.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments in plush velvet whose pile shifts from deep shadow to bright sheen along folds.'
  color_and_tone: Deep jewel velvet — burgundy, sapphire, emerald or black.
  lighting_and_shadow: Low raking light to show the directional pile, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Silk or cotton velvet with directional pile and soft crush.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Rich, sensual, regal and intimate, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: plush directional pile; dark-to-sheen folds; jewel tones; raking light
  creative_brief: "Velvet garments: plush pile fabric that turns dark in shadow and glows where light grazes it. Carry it through plush directional pile, dark-to-sheen folds, jewel tones, raking light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
