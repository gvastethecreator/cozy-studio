  color_and_tone: Violet and red stamp ink on pale green or cream ledger paper.
  lighting_and_shadow: Flat print with no shading, kept consistent across the whole image.
  texture_and_material: Uneven stamp pressure, ruled lines and ink smudges.
  camera_and_composition: Top-down ledger page composition, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with dry bureaucratic dread.
  rendering_and_quality: Convincing stamp texture with no readable words, kept consistent across the whole image.
  creative_brief: "Ink-pad ledger stampwork: images built from official-looking rubber stamps, date stamps, seals and signatures without words, pressed in violet and red on ledger paper. Carry it through official stamps, ruled ledger paper, violet ink, no words. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
