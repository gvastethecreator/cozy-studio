visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Streets of Rage 4 gameplay screenshots:
    hand-drawn side-scrolling beat-em-up capture with neon streets, crowd-control spacing, big hit
    sparks, and arcade brawler lanes. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Streets of Rage 4-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Streets of Rage 4-informed palette: purple night, cyan signage, hot pink neon, yellow
    streetlight, denim blue, and saturated skin-tone highlights. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through flat cel lighting, neon rim, arcade hit flashes, wet pavement bounce,
    and bold shadow shapes. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from clean comic outlines, painted urban props, brick walls, trash cans, leather
    jackets, and exaggerated impact effects. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with side-view brawler perspective with horizontal movement lanes, enemy clusters,
    pickup spacing, and readable co-op staging. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Streets of Rage 4-derived mood: streetwise, loud, physical, adult-arcade, and punchy.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: health bars, combo counters,
    score, lives, and player indicators are appropriate if styled like a modern beat-em-up. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Streets of Rage 4 gameplay screenshots; hand-drawn side-scrolling beat-em-up capture with neon
    streets, crowd-control spacing, big hit sparks, and arcade brawler lanes; purple night, cyan
    signage, hot pink neon, yellow streetlight, denim blue, and saturated skin-tone highlights; flat
    cel lighting, neon rim, arcade hit flashes, wet pavement bounce, and bold shadow shapes; clean
    comic outlines, painted urban props, brick walls, trash cans, leather jackets, and exaggerated
    impact effects; side-view brawler perspective with horizontal movement lanes, enemy clusters,
    pickup spacing, and readable co-op staging; streetwise, loud, physical, adult-arcade, and
    punchy; HUD guidance: health bars, combo counters, score, lives, and player indicators are
    appropriate if styled like a modern beat-em-up
  creative_brief: >-
    Use Streets of Rage Neon Brawler as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Streets of Rage 4: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
