  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in loose sketchy line with bright weird ultraviolet color across sprawling alien steppes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright ultraviolet, magenta and acid yellow, true to the Luka Rejec palette.
  lighting_and_shadow: Glowing psychedelic sky light, lit the way Luka Rejec lights its scenes.
  texture_and_material: Loose sketchy line with digital color, with the surface finish of Luka Rejec.
  camera_and_composition: Sprawling vista composition, framed the way Luka Rejec composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with psychedelic wandering wonder.
  rendering_and_quality: Bright psychedelic OSR illustration, in the recognizable hand of Luka Rejec.
  creative_brief: "Luka Rejec psychedelic OSR art: bright weird color, sprawling alien steppes, strange caravans, loose sketchy linework and ultraviolet sci-fantasy vistas. Carry it through Rejec ultraviolet steppes, weird caravans, sketchy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
