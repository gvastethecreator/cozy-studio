visualDna:
  aesthetic: 'Fashion illustration: a quick runway sketch in graphite and brush ink with loose watercolor splashes on the garment.'
  subject_treatment: Keep the prompt subject and outfit; this preset explicitly elongates figures to about nine heads tall and adds no poster frame, slogan or layout.
  color_and_tone: Mostly bare white paper, black ink and one or two bold watercolor accents in the garment.
  lighting_and_shadow: No simulated light; a few fast strokes and the white of the paper suggest volume.
  texture_and_material: Graphite underdrawing, brush-ink contours, wet watercolor blooms, dry-brush fabric sweeps.
  camera_and_composition: Full-length figure mid-stride, lots of editorial white space, garments given the most detail.
  atmosphere_and_mood: Chic, fast and confident, the energy of an atelier before a show.
  rendering_and_quality: Loose gestural sketch with precise fabric rhythm; never realistic proportions or full backgrounds.
  key_features: nine-heads-tall elongation; brush ink over graphite; watercolor garment splash; white space; mid-stride pose
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fashion Illustration as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
