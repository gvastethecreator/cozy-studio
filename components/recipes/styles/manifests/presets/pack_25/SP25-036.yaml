visualDna:
  aesthetic: 'Contour-and-Anchor Icons: a light outline carries each object while one small solid mass marks the decisive functional part.'
  subject_treatment: Describe the prompt's subject or requested actions with a light contour and reserve one solid anchor mass for the part being acted on.
  color_and_tone: One shared ink, contrast between line and mass coming from coverage.
  lighting_and_shadow: Flat graphic rendering, the anchor distinguished only by solid fill.
  texture_and_material: Continuous even line with a crisp-edged solid anchor.
  camera_and_composition: The anchor sits at the functional point, the contour balancing the box.
  atmosphere_and_mood: Directed attention with lightness around the point of decision.
  rendering_and_quality: The anchor stays small but visible and keeps the same role in every icon.
  creative_brief: "Contour-and-Anchor Icons: a light outline carries each object while one small solid mass marks the decisive functional part. Carry it through light contour, solid anchor, functional point, directed attention. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: light contour; solid anchor; functional point; directed attention
avoidRules:
  - ornamental anchor
  - mass that hides the object
  - solid dots in arbitrary places
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - readable text
  - logo
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
