visualDna:
  aesthetic: 'Sixteenth-century Renaissance court regalia: stiffened bodices, slashed and puffed sleeves, brocade, ruffs or square necklines and jeweled girdles.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: the 16th-century European court garment system below, with period-accurate cut, closures, layering and accessories; the surrounding setting stays as the prompt describes — stiff brocade bodice or doublet, slashed puffed sleeves showing contrasting lining, ruff or square neckline, jeweled girdle and hose or full skirts."
  color_and_tone: Crimson, gold, deep green, ivory and black velvet, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Soft window light like a court portrait, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Silk brocade, velvet, lace ruffs, pearls and gold embroidery.
  camera_and_composition: Formal portrait framing, three-quarter or full figure, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Regal, rich, formal and self-assured, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Painterly-rich photographic finish, with believable fabric weight, seams and fit detail.
  key_features: slashed puffed sleeves; stiff brocade bodice or doublet; ruff; jeweled girdle; court portrait light
  creative_brief: "Sixteenth-century Renaissance court regalia: stiffened bodices, slashed and puffed sleeves, brocade, ruffs or square necklines and jeweled girdles. Carry it through slashed puffed sleeves, stiff brocade bodice or doublet, ruff, jeweled girdle, court portrait light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
