  aesthetic: 'Hiroyuki Imaishi and Studio Trigger feature animation as in Promare: flat triangular geometry, neon pink and cyan fire made of polygons, bold color blocking and explosive posing.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Shigeto Koyama designs, sharp angular faces, huge poses, flat color shapes and no gradients. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Neon magenta, cyan, lime and white against flat pastel skies.
  lighting_and_shadow: Flat graphic color-field light where fire is geometric shapes.
  texture_and_material: Flat color blocks, polygonal CG effects, thick clean outlines.
  camera_and_composition: Wide kinetic poses, exaggerated perspective and spinning action shots.
  atmosphere_and_mood: Keep the requested mood with explosive hot-blooded spectacle.
  rendering_and_quality: Crisp stylized Trigger frame, hypergraphic and bold, with no soft gradients.
  key_features: Imaishi triangles; neon polygonal fire; flat color blocks; explosive poses
  creative_brief: "Hiroyuki Imaishi and Studio Trigger feature animation as in Promare: flat triangular geometry, neon pink and cyan fire made of polygons, bold color blocking and explosive posing. Carry it through Imaishi triangles, neon polygonal fire, flat color blocks, explosive poses. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
