visualDna:
  aesthetic: 'Bit-crush posterize: color depth reduced to a few flat bands with hard contour steps.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: colors collapse into a handful of flat bands with stepped contours."
  color_and_tone: Few flat saturated bands, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Stepped color bands, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Crude, bold, retro and graphic, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  creative_brief: "Bit-crush posterize: color depth reduced to a few flat bands with hard contour steps. Carry it through reduced bit depth, flat color bands. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: reduced bit depth; flat color bands
