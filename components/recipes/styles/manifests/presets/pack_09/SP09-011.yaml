visualDna:
  aesthetic: >-
    Wolf Fur translates natural material behavior into form: start from Thick animal coat, Fluffy,
    layered, and Flowing hair, then turn natural formation, growth, erosion, and geological or
    biological irregularity into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Hair strands: preserve identity and pose while letting
    forms grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Grey, White, Black tips as the material palette, with controlled value separation, local
    color variation, and hue shifts that follow the subject's form rather than flattening it into a
    pasted texture.
  lighting_and_shadow: >-
    Let Soft sheen define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Wolf Fur without hiding the prompt subject.
  texture_and_material: >-
    Render Fluffy, layered through organic variation, non-repeating edge wear, local pores, growth
    marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Flowing hair as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Wild, soft by using age, weather, habitat pressure, and sensory association; the
    material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Warm, directional material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Thick animal coat; Hair strands; Fluffy, layered; Soft sheen; Flowing hair
  creative_brief: >-
    Route any subject through Wolf Fur as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Apply wolf-fur architecture as directional
    material: grey and white guard hairs floating over dense warm undercoat, strand flow following
    form, soft sheen tracing contours, and wild softness with hidden strength. If the input includes
    a creature or character, let the coat transform it; otherwise use fur as a tactile surface
    treatment without requiring an animal reveal.
