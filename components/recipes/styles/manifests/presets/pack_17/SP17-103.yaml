visualDna:
  aesthetic: Split-fountain risograph where one drum carries a smooth ink blend from magenta to orange to yellow, printed under a deep indigo line and shadow layer.
  subject_treatment: 'Lay the requested subject across the ink fountain so its vertical position picks up the gradient: skies, heads and tall forms catch the hot top colors, grounds and feet sink into warmer bands, and indigo holds all drawing.'
  color_and_tone: Split fountain magenta, orange, and yellow bands, deep indigo, and warm white paper.
  lighting_and_shadow: Sunset-like light is supplied by the ink fountain itself; indigo halftone and solid shapes model shadow.
  texture_and_material: Soft gradient banding inside the fountain, visible riso grain, crisp indigo halftone, and faint drum roller marks.
  camera_and_composition: Tall vertical composition that uses the full gradient height, with a strong silhouette crossing several color bands.
  atmosphere_and_mood: Dreamy, melancholic, warm, and cinematic.
  rendering_and_quality: Clean riso reproduction with a true printed blend rather than a digital gradient, sharp indigo drawing, and no muddy overlaps.
  creative_brief: "Split-fountain risograph where one drum carries a smooth ink blend from magenta to orange to yellow, printed under a deep indigo line and shadow layer. Carry it through split fountain magenta-orange-yellow blend, indigo drawing layer, vertical color bands, printed not digital gradient. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: split fountain magenta-orange-yellow blend; indigo drawing layer; vertical color bands; printed not digital gradient
