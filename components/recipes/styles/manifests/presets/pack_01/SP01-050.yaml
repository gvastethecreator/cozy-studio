visualDna:
  aesthetic: 'Studio product photography: one object isolated on a light grey sweep, lit with large softboxes to show its form, material and edges precisely.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Accurate neutral color, clean light grey background, true material colors.
  lighting_and_shadow: Large overhead softbox plus two strip lights for edge definition; soft contact shadow under the object.
  texture_and_material: Surface finish shown truthfully — brushed, polished, grained or stitched — without dust or scratches.
  camera_and_composition: 90–120 mm, slight three-quarter angle, object centered with generous space, full depth of field.
  atmosphere_and_mood: Precise and desirable, an object presented with calm, clinical respect.
  rendering_and_quality: Commercial retouching with crisp edges and clean gradients; no CGI plastic look.
  key_features: grey sweep isolation; overhead softbox and strip-light edges; soft contact shadow; three-quarter angle; truthful finish
  creative_brief: "Studio product photography: one object isolated on a light grey sweep, lit with large softboxes to show its form, material and edges precisely. Carry it through grey sweep isolation, overhead softbox and strip-light edges, soft contact shadow, three-quarter angle, truthful finish. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
