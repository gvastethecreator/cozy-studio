visualDna:
  aesthetic: 'Isotype: rows of repeated flat pictograms showing quantities.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is shown as repeated flat pictogram units in rows."
  color_and_tone: Few flat colors, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Flat printed pictograms, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Clear, didactic, modernist and friendly, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Isotype: rows of repeated flat pictograms showing quantities. Carry it through repeated pictograms, rows, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: repeated pictograms; rows; illustrative only
