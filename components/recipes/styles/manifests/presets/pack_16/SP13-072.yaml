visualDna:
  aesthetic: 'Period anime colored like woodblock prints: flat indigo, vermilion and ochre fields with printed gradient skies.'
  subject_treatment: Keep the prompt's subject and setting; flatten color into printed areas while keeping anime line and expression.
  color_and_tone: Indigo, vermilion, ochre, sea green and paper cream with bokashi gradient bands in the sky.
  lighting_and_shadow: Almost no cast shadow; depth comes from overlapping flat shapes and gradient bands.
  texture_and_material: Subtle paper grain and wood-grain texture inside flat color fields.
  camera_and_composition: Decorative framing with strong silhouettes, cropped foreground elements and high horizons.
  atmosphere_and_mood: Elegant and nostalgic, a graphic calm like an old print hanging in a quiet inn.
  rendering_and_quality: Clean anime line over flat printed color with deliberate grain.
  creative_brief: "Period anime colored like woodblock prints: flat indigo, vermilion and ochre fields with printed gradient skies. Carry it through flat printed color, bokashi sky, paper grain, cropped foreground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flat printed color; bokashi sky; paper grain; cropped foreground
