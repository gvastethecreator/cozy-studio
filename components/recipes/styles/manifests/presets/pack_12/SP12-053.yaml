  color_and_tone: Bog green, muddy brown, grey fog and pale folklore light.
  lighting_and_shadow: Diffuse misty light with lantern glow and eerie hues.
  texture_and_material: Realistic mud, wet wood, leather and moss, with the in-engine surface finish of The Witcher 3 2015.
  camera_and_composition: Third-person over-the-shoulder view in wet landscapes, framed the way The Witcher 3 2015 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with eerie folkloric dread.
  rendering_and_quality: Authentic mid-2010s open-world RPG screen, matching real The Witcher 3 2015 screenshots.
  key_features: Witcher 3 Slavic bog; monster contracts; misty folklore
  creative_brief: 'CD Projekt Red The Witcher 3: Wild Hunt (2015) look: realistic dark Slavic fantasy, misty bogs and wet villages, monster contracts, muddy browns and eerie folklore. Carry it through Witcher 3 Slavic bog, monster contracts, misty folklore. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
