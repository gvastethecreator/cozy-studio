  - surrealism-and-dream
visualDna:
  aesthetic: >-
    Weirdcore becomes a transferable surreal symbolic transformation system: start from Amateur
    photo edit, Text overlay, and Blacked out eyes, then route prompt content through impossible
    logic, dream scale, symbolic displacement, liminal staging, and psychic texture without forcing
    one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using MS Paint text to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Flash photo; use color as emotional unreliability, nostalgic drift,
    uncanny contrast, or symbolic temperature, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Harsh flash drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Compression as the tactile or mark-making basis; surfaces should support the illusion
    with believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to
    figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Blacked out eyes as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Confusing, unsafe as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Uncanny, internet: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Amateur photo edit; MS Paint text; Flash photo; Harsh flash; Compression; Blacked out eyes;
    Confusing, unsafe; Uncanny, internet; Text overlay
  creative_brief: >-
    Apply weirdcore wrongness to the input: uncanny low-skill edits, mismatched scaling, harsh
    cutouts, off-color overlays, and broken composition should make the subject feel emotionally
    unsafe without requiring text or rooms.
avoidRules:
  - high quality
  - professional
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
