  aesthetic: 'Derek Riggs eighties heavy metal cover look: airbrushed painted mascot monsters in epic scenes, lightning, lurid color and a jagged metal logo.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; paint the subject as an epic airbrushed heavy metal mascot scene with lightning. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Lurid purple, fire orange and electric blue, true to the Derek Riggs palette.
  lighting_and_shadow: Lightning and fiery glow, lit the way Derek Riggs lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Heroic central mascot composition, framed the way Derek Riggs composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with epic theatrical menace.
  rendering_and_quality: Faithful eighties metal painting cover, in the recognizable hand of Derek Riggs.
  creative_brief: "Derek Riggs eighties heavy metal cover look: airbrushed painted mascot monsters in epic scenes, lightning, lurid color and a jagged metal logo. Carry it through Riggs airbrushed mascot, lightning, jagged logo. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
