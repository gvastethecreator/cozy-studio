visualDna:
  aesthetic: 'Multi-layer studio stencil: three or four hand-cut stencils sprayed in tonal steps onto board, rebuilding the subject from flat value shapes.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Three to four flat tones from light to dark in one hue family, plus one accent color; no gradients except overspray.
  lighting_and_shadow: 'Light reduced to posterized value shapes: highlight, midtone, shadow and a darkest key layer.'
  texture_and_material: Crisp cut edges with soft overspray halos, bridges holding islands in the cut, slight registration offset between layers, matte aerosol on board.
  camera_and_composition: Keep the requested view; strong simplified silhouette, value shapes locked together like a puzzle.
  atmosphere_and_mood: Bold and deliberate, crafted rather than rushed.
  rendering_and_quality: Clean posterized layers with visible bridges and overspray; no brick wall, protest message or slogan.
  key_features: three to four stencil layers; cut bridges; overspray halos; registration offset; posterized values
  creative_brief: "Multi-layer studio stencil: three or four hand-cut stencils sprayed in tonal steps onto board, rebuilding the subject from flat value shapes. Carry it through three to four stencil layers, cut bridges, overspray halos, registration offset, posterized values. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
