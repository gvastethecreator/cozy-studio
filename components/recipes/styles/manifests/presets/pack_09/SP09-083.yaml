visualDna:
  aesthetic: 'Soot staining: black smoke deposits blackening the target from below, as after a fire, without burning it away.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: black soot stains rise from lower edges and gather in crevices, surfaces intact. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Black soot gradients over original colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Dim light with smoky warmth, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Soft soot deposits, smudges and fingerprints, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Ominous, grim, aftermath and heavy, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Soot staining: black smoke deposits blackening the target from below, as after a fire, without burning it away. Carry it through soot gradients from below, smudges, intact surfaces, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soot gradients from below; smudges; intact surfaces; surface-level damage; structure intact
