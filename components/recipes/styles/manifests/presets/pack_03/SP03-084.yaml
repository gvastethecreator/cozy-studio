visualDna:
  aesthetic: 'Grey clay lighting test: a whole scene rendered with every material set to matte grey so only form, light and shadow remain.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Uniform mid-grey materials, neutral or slightly warm light, sky tint in shadows.
  lighting_and_shadow: Full global illumination with HDRI or sun; soft shadows and ambient occlusion in crevices.
  texture_and_material: No textures at all; geometry detail and silhouette carry everything.
  camera_and_composition: Final shot framing, exactly as the finished scene would be seen.
  atmosphere_and_mood: Calm and sculptural, the scene stripped back to pure form.
  rendering_and_quality: Clean GI clay render; distinct from a sculpting-app matcap viewport.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Grey Clay Lighting Test as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: all-grey matte materials; full global illumination; ambient occlusion in crevices; no textures; final shot framing
