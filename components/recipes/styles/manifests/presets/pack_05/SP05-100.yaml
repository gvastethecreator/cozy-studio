visualDna:
  aesthetic: 'Luminous anime cel built from tall mineral-like planes: vertical facets of value, warm amber point lights and cool teal depth.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Forms are articulated by tall facet-like value shifts; do not add a dungeon corridor, lantern or monster.
  color_and_tone: Amber and pale gold points of light against cool teal and deep blue-green shadow.
  lighting_and_shadow: Small warm point highlights with a soft contained glow against cool ambient light, like light caught inside quartz.
  texture_and_material: Crisp faceted accents, subtle grain and smooth transitions between the vertical planes.
  camera_and_composition: Keep the requested view; vertically stacked planes and shifts of scale emphasize height.
  atmosphere_and_mood: Hopeful and humble, a small warmth inside something vast.
  rendering_and_quality: Clean cel edges, layered depth and readable contrast without heavy bloom.
  key_features: vertical mineral facets; amber point lights; cool teal depth; contained quartz-like glow; stacked vertical planes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vertical Mineral Amber Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
