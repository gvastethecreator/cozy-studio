visualDna:
  aesthetic: 'High-key snow wildlife: an animal in snow or fog exposed two stops bright so the world goes almost pure white and only eyes, nose or dark feathers remain.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Near-white field with barely visible texture, small dark accents, very low contrast elsewhere.
  lighting_and_shadow: Flat overcast snow light from the whole sky, leaving almost no shadow anywhere.
  texture_and_material: Faint fur and snow texture, falling flakes as soft grey dots.
  camera_and_composition: Telephoto, animal small or partly hidden in a vast white field, lots of negative space.
  atmosphere_and_mood: Minimal and serene, quiet life almost erased by winter.
  rendering_and_quality: Bright exposure without grey mud or blue cast in the whites.
  creative_brief: "High-key snow wildlife: an animal in snow or fog exposed two stops bright so the world goes almost pure white and only eyes, nose or dark feathers remain. Carry it through overexposed white field, dark eyes and nose as accents, huge negative space, flat snow light, minimal. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: overexposed white field; dark eyes and nose as accents; huge negative space; flat snow light; minimal
