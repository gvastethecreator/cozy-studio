visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around pinpoint red speculars and
    narrow selective focus bands that sharpen only a few existing contours. For color and surface, keep the source palette in graphite and cool neutral values,
    using red as a tiny accent rather than interface graphics. Security-noir restraint
    can create watchfulness through selective detail, but no camera, screen, or threat
    is implied
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through pinpoint red speculars and narrow
    selective focus bands that sharpen only a few existing contours; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep the source palette in
    graphite and cool neutral values, using red as a tiny accent rather than interface
    graphics. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use precise red reflection
    only where a real surface in the prompt would catch light; retain source direction
    and brightness hierarchy. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; contrast subdued matte planes with occasional
    clean glints, avoiding universal gloss or visible scan effects. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    the crop and subject placement; shift clarity locally instead of imposing
    surveillance framing or a viewpoint. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Security-noir restraint can create
    watchfulness through selective detail, but no camera, screen, or threat is implied.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and pinpoint red speculars and narrow selective
    focus bands that sharpen only a few existing contours; keep focal edges crisp,
    texture controlled, and dark values legible. Avoid photoreal or 3D-render drift,
    watermark, logo, and fake readable text.
  key_features: >-
    pinpoint red speculars and narrow selective focus bands that sharpen only a few
    existing contours; keep the source palette in graphite and cool neutral values,
    using red as a tiny accent rather than interface graphics; use precise red
    reflection only where a real surface in the prompt would catch light; retain source
    direction and brightness hierarchy; contrast subdued matte planes with occasional
    clean glints, avoiding universal gloss or visible scan effects; and preserve the
    crop and subject placement; shift clarity locally instead of imposing surveillance
    framing or a viewpoint. The five cues should read as one mark-and-value system, not
    as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use pinpoint red speculars and narrow selective
    focus bands that sharpen only a few existing contours, keep the source palette in
    graphite and cool neutral values, using red as a tiny accent rather than interface
    graphics, use precise red reflection only where a real surface in the prompt would
    catch light; retain source direction and brightness hierarchy, and contrast subdued
    matte planes with occasional clean glints, avoiding universal gloss or visible scan
    effects; the prompt supplies all scene content. Do not add unrequested characters,
    objects, source-specific lore, readable symbols, or a default action.
