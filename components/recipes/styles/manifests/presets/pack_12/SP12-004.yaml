visualDna:
  aesthetic: 'Overworks Skies of Arcadia (2000) look: bright Dreamcast JRPG of sky pirates, wooden airships over an endless cloud sea, floating islands, cheerful anime characters and huge sky beasts.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; show people as cheerful anime sky pirates with simple smooth faces, goggles, sashes and big boots, a little stiff in pose. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Sky blue, sunny gold, cloud white and warm ship wood.
  lighting_and_shadow: Bright open-sky sunshine with smooth simple shading and clean blue gradients.
  texture_and_material: Smooth simple shapes with clean bright textures that blur slightly up close, clouds as soft flat layers.
  camera_and_composition: Third-person deck view over the cloud sea, framed the way Skies of Arcadia 2000 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with sunny swashbuckling adventure.
  rendering_and_quality: 'A 2000 Dreamcast frame at 640 by 480: bright airship deck over a cloud sea, slightly soft image, jagged distant rigging.'
  key_features: Skies of Arcadia airships; cloud sea; smooth simple sky pirates
  creative_brief: "Overworks Skies of Arcadia (2000) look: bright Dreamcast JRPG of sky pirates, wooden airships over an endless cloud sea, floating islands, cheerful anime characters and huge sky beasts. Carry it through Skies of Arcadia airships, cloud sea, smooth simple sky pirates. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
