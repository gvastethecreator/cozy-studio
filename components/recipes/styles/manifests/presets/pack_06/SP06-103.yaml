visualDna:
  aesthetic: >-
    Metroidvania Parallax Gloom acts as a transferable art-medium router: start from Layered
    Metroidvania side scroll style with readable silhouettes against moody parallax depth,
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Shape any subject into bold side view forms, negative space
    cutouts, and traversal readable contours; preserve the prompt subject while routing it through
    tile readability, icon clarity, splash rendering, interface material, sprite bounce, shadow
    zones, or encounter pressure, keeping the requested identity, silhouette, pose, object function,
    or environment legible.
  color_and_tone: >-
    Build color with Deep cool shadows, muted midtones, rare toxic accents, and strong near
    field/support field value splits; use color as gameplay hierarchy: rarity glow, faction
    contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or readable
    inventory material, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Rim biased side lighting with luminous pockets, heavy occlusion, and
    atmosphere separated planes; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Pixel clusters, mossy noise, mineral like speckle, and subtle animated glow implications
    without fixed scenery; surface detail should support genre grammar through parchment, HUD glass,
    pixel atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Wide side on composition, layered planes, strong platform read
    silhouette rhythm, and stable sprite scale; compose through gameplay-facing hierarchy, atlas
    consistency, menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen
    energy, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Lonely, exploratory, mysterious tone without requiring caverns, platforms, doors,
    or creatures; derive mood from playable stakes, collection desire, tactical control, cozy
    routine, survival dread, arcade speed, or heroic confrontation, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Pixel perfect edges, parallax ready depth separation, no painterly blur, no
    overdetail; finish with game-production clarity, strong silhouettes, controlled UI-like detail,
    and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough
    craft evidence to make the medium recognizable.
  key_features: >-
    Layered Metroidvania side scroll style with readable silhouettes against moody parallax depth;
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity; Deep cool shadows, muted midtones, rare toxic accents, and strong near
    field/support field value splits; Pixel clusters, mossy noise, mineral like speckle, and subtle
    animated glow implications without fixed scenery; Wide side on composition, layered planes,
    strong platform read silhouette rhythm, and stable sprite scale
  creative_brief: >-
    Apply Metroidvania Parallax Gloom as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Layered Metroidvania side scroll style with readable silhouettes against moody parallax
    depth, gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity, Pixel clusters, mossy noise, mineral like speckle, and subtle animated
    glow implications without fixed scenery without requiring the card image's original subject.
