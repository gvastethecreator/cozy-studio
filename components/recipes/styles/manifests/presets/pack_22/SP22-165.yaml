visualDna:
  aesthetic: >-
    Clear variable-weight ink contours carry the form, while solid shadow masses and selective interior
    marks add firm volume without depending on color.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use interior lines only to clarify
    existing structure; do not invent anatomy, costume or emblem details.
  color_and_tone: >-
    Keep the requested palette intact. Let black ink and open reserves establish contrast, with color
    rendered in flat or briefly modeled areas beneath the linework.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast, translating shadow into solid ink groups without
    adding a new source, glow or highlight.
  texture_and_material: >-
    Keep ink areas solid and surfaces clean; preserve distinct material cues through shape and line rather
    than an added paper texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Line weight supports the given forms
    without changing the pose or arrangement.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. Graphic confidence comes from the ink structure, not an added
    character role or narrative cue.
  rendering_and_quality: >-
    Establish the silhouette and broad values first, then use selective interior marks and clear contour
    closures; keep the subject readable at reduced size.
avoidRules:
  - unrequested anatomy, costume or emblem changes
  - extra details that alter identity or function
