visualDna:
  aesthetic: >-
    Treat the named lineage as technique reference: fine fragile contours, pale mineral planes,
    translucent edge values and large areas of deliberate void.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use cool pale mineral hues and
    clear light/dark separation; respect requested color and do not muddy the palette.
  lighting_and_shadow: >-
    Let light pass along edges and through thin-looking planes; avoid opaque plastic shine and
    preserve the prompt's lighting.
  texture_and_material: >-
    Use fine line, softly faceted mineral shading and sparse surface detail; keep the depicted
    material recognizable.
  camera_and_composition: >-
    Balance delicate forms against open negative space without changing the source crop or
    simplifying away requested elements.
  atmosphere_and_mood: >-
    Serenity comes from pale planes and empty space; keep the prompt's emotional meaning and avoid
    adding spiritual symbolism.
  rendering_and_quality: >-
    Keep the method subject-neutral and material-aware; do not turn a subject into crystal or copy a
    character or panel. Keep important silhouettes and joins legible; no watermark, unrequested text
    or interface.
  key_features: >-
    Fine fragile contour; pale mineral planes; translucent edges; broad void; quiet faceting.
  creative_brief: 'Apply this visual treatment to the requested content: Fine fragile contour; pale mineral planes; translucent edges; broad void; quiet faceting. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - opaque highlights hiding mineral edge transmission
  - muddy values collapsing pale planes
  - ornament crowding negative space
