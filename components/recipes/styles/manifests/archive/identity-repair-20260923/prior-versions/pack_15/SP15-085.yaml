visualDna:
  aesthetic: >-
    A distributed DIY network language is shown through irregular node clusters, broken branching paths,
    patched joins and small signal pulses; connection topology, rather than a city or device, carries the
    identity.
  subject_treatment: >-
    Preserve requested identity, shape, action and connections. Let existing contours or surfaces take on
    linked segments, uneven node spacing or repaired-looking joins without turning the subject into a
    radio, antenna or hacker figure.
  color_and_tone: >-
    Keep the requested palette, using a few saturated cyan, amber or acid signal points against quieter
    neutral masses when useful. Maintain enough value separation to read every connected path.
  lighting_and_shadow: >-
    Respect the requested light. Confine luminous color to individual nodes or short path segments; do
    not impose beams, monitor spill or full-scene glow.
  texture_and_material: >-
    Retain actual material differences. Use sparse matte patch marks and varied line weight to suggest
    improvised assembly only where forms support it; avoid coating the image in cables, tape or wet
    texture.
  camera_and_composition: >-
    Preserve viewpoint and arrangement. Distribute connected nodes across the requested composition with
    open gaps and readable path direction; do not force an overhead network map or urban infrastructure.
  atmosphere_and_mood: >-
    Suggest resilient, decentralized coordination through interrupted yet connected rhythm. Keep the
    prompt's tone and do not add pirate-radio lore, a crew or a broadcast event.
  rendering_and_quality: >-
    Use crisp hand-drawn or screenprinted paths, uneven but intentional spacing and a clear node
    hierarchy. Keep the network legible without turning the image into a literal schematic or dense web.
avoidRules:
  - Do not add a pirate-radio transmitter, rooftop, crew, city grid or server room unless requested.
  - Avoid a full-image cable web, pseudo-readable UI and uniform neon glow.
  - Keep branching marks attached to existing forms rather than adding unrelated hardware.
