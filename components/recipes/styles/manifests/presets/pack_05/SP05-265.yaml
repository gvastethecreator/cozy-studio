visualDna:
  aesthetic: Ornate seinen ink with tapered looping strokes that echo the subject's own curves like engraved baroque flourishes, laid over lacquer-smooth dark color.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: A rich black-plum base with dusty rose and burgundy accents and a few tarnished-gold specks; prompt hues drift toward wine tones.
  lighting_and_shadow: Small warm specular cuts on lacquered surfaces against velvety black shadow, contrast around 1:10.
  texture_and_material: Fine etched hairlines over smooth lacquer color, velvet-soft shadow gradients, and ornament only along contours that already exist.
  camera_and_composition: Keep the requested framing; curling strokes follow the contours while quiet dark space surrounds the silhouette.
  atmosphere_and_mood: Elegant, overripe and faintly uneasy, like a ballroom after midnight.
  rendering_and_quality: Controlled etched detail on the focal silhouette, softer lacquer fields elsewhere; ornament always subordinate to the silhouette.
  key_features: tapered looping flourish strokes; black-plum with dusty rose; lacquer-smooth fills; warm specular cuts; etched hairline detail
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rose-Black Baroque Decadence Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
