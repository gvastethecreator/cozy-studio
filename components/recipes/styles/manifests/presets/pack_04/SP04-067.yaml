visualDna:
  aesthetic: 'Trace monotype: lines drawn with a stylus on paper laid over an inked glass plate, printing soft fuzzy dark lines with ghost smudges from the resting hand.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Black or dark umber ink on thin Japanese paper, with grey plate-tone smudges around the drawing.
  lighting_and_shadow: 'Value comes from where the hand pressed: smudged grey halos around dark areas, little modeled light.'
  texture_and_material: Soft furry-edged lines, accidental pressure blotches, a faint plate edge and a one-off impression.
  camera_and_composition: Keep the requested view with a sparse, slightly off-balance arrangement on the sheet.
  atmosphere_and_mood: Haunted, intimate and fragile, a drawing surfacing through fog.
  rendering_and_quality: Single impression with its accidents intact, no crisp lines and no edition-perfect cleanliness.
  key_features: fuzzy stylus-traced lines; hand-pressure ghost smudges; thin Japanese paper; faint plate edge; one-off impression
  creative_brief: "Trace monotype: lines drawn with a stylus on paper laid over an inked glass plate, printing soft fuzzy dark lines with ghost smudges from the resting hand. Carry it through fuzzy stylus-traced lines, hand-pressure ghost smudges, thin Japanese paper, faint plate edge, one-off impression. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
