visualDna:
  aesthetic: 'Painted tissue collage: sheets of paper first painted with brushy textures, then cut and torn into shapes and layered into bold animals and landscapes.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Rich primaries and secondaries mottled inside every shape, set against a plain white ground.
  lighting_and_shadow: No modeled light; value comes from the painted texture inside each paper piece and slight edge shadows between layers.
  texture_and_material: Brush streaks, sponge dabs and finger marks inside cut shapes, visible scissor and torn edges, overlapping tissue.
  camera_and_composition: Large simple silhouettes filling the page, overlapping layers building body parts like a mosaic.
  atmosphere_and_mood: Bright, bold and exploratory, a big shape a toddler can point at.
  rendering_and_quality: Handmade collage with real paper textures; no outlines and no digital gradients.
  key_features: hand-painted tissue papers; scissor-cut shapes; mottled brush texture inside shapes; white ground; overlapping layers
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Paper Cutout (Collage) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
