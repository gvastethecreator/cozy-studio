  creative_brief: "Apply this as a reusable style router over any prompt: preserve the user's subject while adding opal bone masquerade elegance, velvet concealment, predatory court etiquette, and polished gothic restraint. Apply after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies a style grammar of Opal Bone Masquerade; Opalescent bone court fantasy with masked elegance; nacre shimmer; black velvet depth; predatory etiquette; mask like contour discipline, mood, material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster, readable text, or sample-card composition."
