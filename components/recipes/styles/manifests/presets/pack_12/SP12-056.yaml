visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Ghostrunner gameplay screenshots: first-person
    cyber-ninja parkour capture with wall-runs, one-hit combat, vertical megacity routes, and
    blade-forward speed. Apply this after prompt X; prompt X supplies the subject, action, setting,
    and intensity while this preset supplies capture language, camera grammar, material behavior,
    playable readability, and finish. Do not recreate an exact official level, character, logo, or
    marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Ghostrunner-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Ghostrunner-informed palette: black carbon, cyan neon, red enemy marks, toxic green
    signage, steel grey, and white blade flashes. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through neon strips, hologram glow, blade trails, muzzle flashes, and deep
    industrial shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from slick carbon panels, rain metal, cables, concrete towers, katana steel,
    cybernetic enemies, and hard-edged decals without readable text. Materials should feel like
    in-engine game assets captured during play, with enough texture identity to separate props,
    terrain, characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person sprint/slash framing with hands/blade, route markers, enemy
    silhouettes, gap jumps, and high-rise depth. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Ghostrunner-derived mood: brutal, precise, vertical, cybernetic, and breathless. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal reticle, ability
    cooldowns, target markers, and route highlights can appear as coherent action HUD. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Ghostrunner gameplay screenshots; first-person cyber-ninja parkour capture with wall-runs,
    one-hit combat, vertical megacity routes, and blade-forward speed; black carbon, cyan neon, red
    enemy marks, toxic green signage, steel grey, and white blade flashes; neon strips, hologram
    glow, blade trails, muzzle flashes, and deep industrial shadows; slick carbon panels, rain
    metal, cables, concrete towers, katana steel, cybernetic enemies, and hard-edged decals without
    readable text; first-person sprint/slash framing with hands/blade, route markers, enemy
    silhouettes, gap jumps, and high-rise depth; brutal, precise, vertical, cybernetic, and
    breathless; HUD guidance: minimal reticle, ability cooldowns, target markers, and route
    highlights can appear as coherent action HUD
  creative_brief: >-
    Use Ghostrunner Carbon Megacity as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Ghostrunner: camera, HUD grammar, material
    language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed
    when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
