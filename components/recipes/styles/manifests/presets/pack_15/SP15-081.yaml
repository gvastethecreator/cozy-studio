visualDna:
  aesthetic:
    'An authored sepia-lithograph and matte-gouache adventure illustration using Victorian mechanical design
    vocabulary: working gear trains, articulated housings and warm bronze/brass against soot-dark iron. Use
    pressure routes and steam valves only where the requested subject already supports them; no period setting
    is required.'
  subject_treatment:
    Preserve the requested subject, action and explicit locks. Restyle open forms with purposeful
    gear-driven joins and bronze hardware. Add pressure fittings or gauges only to a subject that already uses
    pressure. If it has a steam outlet or pressure-release port, show one small visible wisp from that outlet;
    otherwise do not invent a steam source, gauge or piping.
  color_and_tone:
    Use brass, bronze and patinated copper against iron, soot and aged ivory, with a restrained
    enamel accent. Preserve explicit palettes and clear focal, support and shadow values.
  lighting_and_shadow:
    Honor specified light direction and sources. When unspecified, use warm metal highlights
    against cool soot shadows; invent no glowing source and let no steam obscure the subject.
  texture_and_material:
    Distinguish brass, bronze, copper, cast iron, enamel, leather and paper through tactile
    planes and controlled wear. Translate open material choices into a mechanical finish.
  camera_and_composition:
    Keep requested crop and viewpoint. Arrange functioning gears at existing joints and pressure routes only
    along an existing pressure mechanism; do not add equipment to an ordinary object or require a workshop,
    airship or foundry.
  atmosphere_and_mood:
    Convey ingenious, hand-built pressure and craft while following the requested emotion.
    Period ornament informs design, not a mandatory historical story.
  rendering_and_quality:
    Render as an ink-and-gouache illustration with matte planes, engraved contours and firm shadows, not a
    polished photograph or product render. Make a few working signatures read at thumbnail scale; avoid gear
    wallpaper, unreadable gauges and obscuring steam.
avoidRules:
  - Do not replace the requested subject with a machine or make an unrelated boiler the focal point.
  - Do not require a Victorian room, factory, airship, guild or labor narrative.
  - Keep gears functional and steam subordinate to the requested action.
