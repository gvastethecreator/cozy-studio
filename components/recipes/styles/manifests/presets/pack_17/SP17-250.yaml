  aesthetic: 'Stefan Poag weird fantasy art: retro bold ink with thick outlines, strange monsters, pulpy cosmic weirdness and seventies-inspired OSR cover energy.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in retro bold thick-outlined ink with pulpy cosmic weirdness. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold black ink with flat retro color, true to the Stefan Poag palette.
  lighting_and_shadow: Flat retro print light, lit the way Stefan Poag lights its scenes.
  texture_and_material: Black ink on cheap paper with photocopy grain and slight bleed.
  camera_and_composition: Bold iconic composition, framed the way Stefan Poag composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with pulpy cosmic weirdness.
  rendering_and_quality: Retro bold weird fantasy ink, in the recognizable hand of Stefan Poag.
  creative_brief: 'Stefan Poag weird fantasy art: retro bold ink with thick outlines, strange monsters, pulpy cosmic weirdness and seventies-inspired OSR cover energy. Carry it through Poag retro bold ink, thick outlines, cosmic weird. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
