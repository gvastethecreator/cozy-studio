visualDna:
  aesthetic: 'Pulp magazine cover painting: lurid oil-painted adventure at its most sensational moment, thick painterly gesture and hard spotlighting.'
  subject_treatment: Keep the prompt subject and action; this preset owns the vertical pulp cover composition with the peak action moment in the foreground, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Acid yellow, blood orange and saturated red against near-black shadow.
  lighting_and_shadow: Hard spotlight, half-lit faces, dramatic shadow wedges and a hot backlight.
  texture_and_material: Loose oil brushwork, cheap coated paper, faint halftone and print wear.
  camera_and_composition: Action thrust toward the viewer, near-field exaggeration, peril looming above the hero.
  atmosphere_and_mood: Sensational, tense and lurid, danger at full volume.
  rendering_and_quality: Vigorous painted finish; no masthead, no blurbs and no damsel-in-distress cliché.
  key_features: lurid oil painting; acid yellow and red; hard spotlight; peak-action foreground; looming peril
  creative_brief: "Pulp magazine cover painting: lurid oil-painted adventure at its most sensational moment, thick painterly gesture and hard spotlighting. Carry it through lurid oil painting, acid yellow and red, hard spotlight, peak-action foreground, looming peril. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
