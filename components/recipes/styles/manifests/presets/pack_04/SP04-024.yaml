visualDna:
  aesthetic: 'Preschool stop-motion clay: chunky plasticine characters on a small tabletop set of felt, cardboard and wooden blocks, filmed under bright lamps.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Clean bright primaries in matte clay, felt greens and cardboard browns, cheerful and simple.
  lighting_and_shadow: Bright even key with soft fill, small crisp contact shadows under characters on the set.
  texture_and_material: Fingerprints and tool dents in clay, fuzzy felt ground, corrugated cardboard edges and simple sculpted bead eyes.
  camera_and_composition: Eye-level tabletop view with shallow depth of field that shows the miniature scale.
  atmosphere_and_mood: Gentle, handmade and funny, made for the very young.
  rendering_and_quality: Physical plasticine and craft materials with visible handling marks; never glossy plastic CG.
  key_features: chunky plasticine characters; felt and cardboard set; fingerprints and tool dents; bright even lamps; shallow tabletop depth
  creative_brief: "Preschool stop-motion clay: chunky plasticine characters on a small tabletop set of felt, cardboard and wooden blocks, filmed under bright lamps. Carry it through chunky plasticine characters, felt and cardboard set, fingerprints and tool dents, bright even lamps, shallow tabletop depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
