visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Super Mario 3D World gameplay screenshots:
    bright diorama platformer capture with toy-like geometry, rounded hazards, readable jumps,
    coins, and family-friendly but polished obstacle design. Apply this after prompt X; prompt X
    supplies the subject, action, setting, and intensity while this preset supplies capture
    language, camera grammar, material behavior, playable readability, and finish. Do not recreate
    an exact official level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Super Mario 3D World-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Super Mario 3D World-informed palette: sky blue, grass green, mushroom red, coin gold,
    cloud white, and toy-plastic primaries. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through soft studio daylight, crisp platform shadows, sparkle pickups, and
    gentle rim on round forms. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from rounded blocks, glossy pipes, soft grass, simple brick, plush-like enemies
    without exact character copying, and toy prop materials. Materials should feel like in-engine
    game assets captured during play, with enough texture identity to separate props, terrain,
    characters, hazards, and interactables.
  camera_and_composition: >-
    Compose with fixed/following 3D platform camera with obstacle lanes, collectibles, depth-safe
    jumps, and clean foreground-to-goal readability. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Super Mario 3D World-derived mood: playful, precise, buoyant, colorful, and polished.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: score, timer, lives, coins,
    and power-up icons can appear if they feel like classic platformer UI. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Super Mario 3D World gameplay screenshots; bright diorama platformer capture with toy-like
    geometry, rounded hazards, readable jumps, coins, and family-friendly but polished obstacle
    design; sky blue, grass green, mushroom red, coin gold, cloud white, and toy-plastic primaries;
    soft studio daylight, crisp platform shadows, sparkle pickups, and gentle rim on round forms;
    rounded blocks, glossy pipes, soft grass, simple brick, plush-like enemies without exact
    character copying, and toy prop materials; fixed/following 3D platform camera with obstacle
    lanes, collectibles, depth-safe jumps, and clean foreground-to-goal readability; playful,
    precise, buoyant, colorful, and polished; HUD guidance: score, timer, lives, coins, and power-up
    icons can appear if they feel like classic platformer UI
  creative_brief: >-
    Use Mario 3D World Toy Platformer as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Super Mario 3D World: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
