visualDna:
  aesthetic: >-
    Arrange highlights and shadow boundaries in a measured sequence of bars, intervals, or balanced
    groups. Light gives structure to existing forms without demanding a court, procession, seal, or
    mechanical subject.
  subject_treatment: >-
    Preserve requested identity and action. Use a few repeated light intervals to direct attention across
    the subject while keeping its actual parts and relationships intact.
  color_and_tone: >-
    Keep the stated palette. Separate major forms with clear value steps, then reserve any accent hue for
    a small number of points in the sequence.
  lighting_and_shadow: >-
    Respect the specified source, direction, and hardness. Shape shadows with deliberate spacing and
    repeat only where the existing geometry supports it; do not add beams or a second source.
  texture_and_material: >-
    Keep material character intact beneath the lighting pattern. Use fine surface detail at selected
    boundaries rather than filling every interval with texture.
  camera_and_composition: >-
    Preserve the user's view, crop, and arrangement. If layout is open, use unequal spacing and a clear
    light-to-shadow path; avoid imposing a grid or frontal panel layout.
  atmosphere_and_mood: >-
    Let ordered illumination suggest pressure, balance, or quiet anticipation. Preserve the requested
    tone without implying judgment, law, ceremony, or threat by default.
  rendering_and_quality: >-
    Keep repeated bands and focal accents cleanly separated and legible at card scale. Vary interval and
    edge softness enough to avoid a mechanical wallpaper pattern.
avoidRules:
  - Do not force a courtroom grid, procession, or seal into the composition.
  - Do not turn light intervals into lettering or a repeated panel layout.
