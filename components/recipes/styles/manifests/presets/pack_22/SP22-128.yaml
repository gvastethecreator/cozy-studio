visualDna:
  aesthetic: >-
    Ornamental painting creates a flowing rhythm by repeating curved marks at varied scales within the
    forms already present, not by adding new objects.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let curved rhythms follow existing
    contours and internal shapes without changing the subject or adding motifs.
  color_and_tone: >-
    Establish broad color masses first, then add localized rhythmic accents. Retain the requested palette
    and keep each existing form distinct.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Use color masses and short strokes to express
    form without adding a glow or changing the light source.
  texture_and_material: >-
    Use short gouache-like strokes with restrained grain. Keep the surface variation local rather than
    adding a uniform texture layer.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Decorative rhythm does not
    change the composition or silhouette.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. Organic mark-making does not add botanical or other thematic
    motifs to the scene.
  rendering_and_quality: >-
    Vary line weight by hand and keep ornament inside the existing forms. Maintain a clear hierarchy
    between major shapes and the smaller repeated accents.
avoidRules:
  - unrequested added motifs
  - uniform surface grain
