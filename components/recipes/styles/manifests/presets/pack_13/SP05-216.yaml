  aesthetic: 'Soft substantial outer contours surround finely drawn interior folds and edges, creating two scales of line texture with warm and cool balance.'
  subject_treatment: 'Keep identity, proportions, pose, materials, and count; vary line weight without changing the depicted forms.'
  color_and_tone: 'Set cool neutral planes against small warm accents only where suitable; preserve the exact palette if specified.'
  lighting_and_shadow: 'Use a soft broad source with a narrow highlight boundary; do not add warmth or cold as a lighting scenario.'
  texture_and_material: 'Use short interwoven strokes only on prompted woven surfaces; keep other materials smooth and distinct.'
  camera_and_composition: 'Preserve crop, viewpoint, perspective, spacing, and count; use line weight to separate existing depth layers.'
  atmosphere_and_mood: 'Follow the requested mood; line softness and color temperature do not assign an emotion.'
  rendering_and_quality: 'Keep heavy outer contours clean and interior marks sparse; prevent the two line scales from muddying small details.'
  key_features: 'Soft substantial outline; fine interior marks; cool and warm separation; localized textile strokes; clear depth boundaries.'
  creative_brief: 'Contrast a rounded outer line with finer internal strokes and measured color temperature. Keep subject, action, count, camera, and mood user-defined. Use it as a reusable look on any subject.'
