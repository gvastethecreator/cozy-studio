visualDna:
  aesthetic: 'Cottagecore: soft pastoral life, wildflower gardens, handmade bread, linen and warm cottage light.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: set in a slow rural life of cottage gardens, baking, sewing, foraging and animals."
  color_and_tone: Soft creams, sage, dusty rose and butter yellow, used consistently across subject and background.
  lighting_and_shadow: Golden afternoon light through windows, expressed through the style rather than photographic lighting.
  texture_and_material: Linen, wicker, wood, flowers and bread crust, visible at card size as the signature of the style.
  camera_and_composition: Cozy interior or garden framing with foreground flowers, arranged so the subject still reads at card size.
  atmosphere_and_mood: Gentle, warm, nostalgic and peaceful, driven by the construction, color and rhythm.
  rendering_and_quality: Soft painterly or photographic finish, with clean, deliberate marks and no accidental noise.
  key_features: cottage garden; linen; baking; wildflowers; golden light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cottagecore as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
