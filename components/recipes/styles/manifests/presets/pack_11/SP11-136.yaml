visualDna:
  aesthetic: 'Knot tying diagram: a clear step-by-step sequence of rope drawings with arrows showing each pass, tuck and pull.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: shown as a numbered-feeling sequence of panels (without readable numbers) where rope wraps, crosses and tightens around or through the subject, with direction arrows."
  color_and_tone: Two contrasting rope colors on white or pale cream.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Clean vector rope with simple twist texture and soft flat shading.
  camera_and_composition: Four to six step panels in a grid, each with arrows.
  atmosphere_and_mood: Practical, calm, clear and handy, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Knot tying diagram: a clear step-by-step sequence of rope drawings with arrows showing each pass, tuck and pull. Carry it through step panels, rope twist, direction arrows, tightening sequence. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: step panels; rope twist; direction arrows; tightening sequence
