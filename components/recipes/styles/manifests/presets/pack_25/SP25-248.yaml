visualDna:
  aesthetic: 'Staggered Medallion Fields: compact units offset between rows and joined by short connectors, their orientation changing by one rule.'
  subject_treatment: Build a field of compact units from the prompt's subject, offset between rows with short connectors and a declared cycle of orientations.
  color_and_tone: Main value for units and a secondary one for links.
  lighting_and_shadow: Flat silhouettes of equal weight across the field.
  texture_and_material: Defined edges and minimal interior detail in an original vocabulary.
  camera_and_composition: Alternating offset and orientation with a declared period and no accidental columns.
  atmosphere_and_mood: A field of small related presences with pauses and meetings.
  rendering_and_quality: Clean repeat with intact contours and connectors at equivalent points.
  creative_brief: "Staggered Medallion Fields: compact units offset between rows and joined by short connectors, their orientation changing by one rule. Carry it through offset rows, short connectors, orientation cycle, original units. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
