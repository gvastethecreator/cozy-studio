visualDna:
  aesthetic: 'Dashcam capture: a small wide-angle camera behind a vehicle windshield recording the road ahead, bright and utilitarian.'
  subject_treatment: Keep the prompt subject and action; this preset owns the behind-the-windshield driver viewpoint, and the setting stays the prompt's.
  color_and_tone: Flat digital color, slightly oversharpened, headlight pools at night, clipped sky by day.
  lighting_and_shadow: Headlights and road light at night, harsh daylight otherwise; reflections of the dashboard on the glass.
  texture_and_material: Windshield dust, faint reflections, wiper streaks, compression softness in fast motion.
  camera_and_composition: Centered road perspective, hood edge or dashboard at the bottom, wide lens bowing the horizon.
  atmosphere_and_mood: Sudden and matter-of-fact, the unexpected appearing ahead without warning.
  rendering_and_quality: Consumer dashcam realism; no readable speed or time overlay.
  key_features: behind-windshield view; hood or dash at bottom; headlight pools; glass reflections; wide bowed horizon
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dashcam as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
