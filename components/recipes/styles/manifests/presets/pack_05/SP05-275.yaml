  color_and_tone: Muted Tokyo greys, warm apartment tones and sudden surreal color intrusions.
  lighting_and_shadow: Ordinary Tokyo city light interrupted by surreal glowing intrusions.
  texture_and_material: Realistic Madhouse cel with detailed painted urban backgrounds.
  camera_and_composition: Ensemble city compositions of many citizens and surreal scene transitions.
  atmosphere_and_mood: Keep the requested mood with spreading civic paranoia.
  rendering_and_quality: Grounded yet surreal Madhouse television frame with Kon realism.
  key_features: Paranoia Agent realism; rumors; surreal intrusions; Tokyo citizens
  creative_brief: "Satoshi Kon Paranoia Agent look (2004): grounded realistic Tokyo citizens, collective paranoia spreading through rumors, surreal intrusions and Madhouse realism. Carry it through Paranoia Agent realism, rumors, surreal intrusions, Tokyo citizens. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
