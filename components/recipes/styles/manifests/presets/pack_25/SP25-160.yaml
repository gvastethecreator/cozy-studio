  aesthetic: 'Shop-Window Display Set: the product presented as the hero of a designed shop-window display, seen from the street through the glass.'
  subject_treatment: Stage the prompt's product as the hero of a designed shop window seen from the street, with props that support it and the brand text kept exact.
  color_and_tone: A window palette built around the product, with warm interior light against the street.
  lighting_and_shadow: Warm window spotlights inside and soft street light outside the glass.
  texture_and_material: Clean glass with faint reflections, painted props and the real product.
  camera_and_composition: Street-level frontal view through the window, the product centered.
  atmosphere_and_mood: Inviting and theatrical, a small stage you want to walk into.
  rendering_and_quality: Crisp photographic window display with light reflections that never cover the label.
  creative_brief: "Shop-Window Display Set: the product presented as the hero of a designed shop-window display, seen from the street through the glass. Carry it through shop window stage, street view, warm spotlights, hero product. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
