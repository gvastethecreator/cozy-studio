  color_and_tone: Bright red vegetation, dark blue-black water, cyan and grey built areas, tan bare soil.
  lighting_and_shadow: High sun from orbit, minimal shadows, cloud shadows as dark patches.
  texture_and_material: Field patterns, river meanders and terrain at orbital scale.
  camera_and_composition: Straight down from orbit, the subject seen as landscape-scale pattern.
  atmosphere_and_mood: Detached and revealing, the planet seen in invisible light.
  rendering_and_quality: Remote-sensing false-color composite; no map labels or borders.
  creative_brief: "Multispectral satellite false color: near-infrared mapped to red so healthy vegetation blazes red, water turns black-blue and cities cyan-grey. Carry it through red vegetation, black-blue water, cyan cities, orbital top-down, near-infrared false color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
