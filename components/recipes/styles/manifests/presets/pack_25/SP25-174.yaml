visualDna:
  aesthetic: 'Monochrome Accent Signals: a concentrated tonal base leaves one structural color accent to point at the action or focus.'
  subject_treatment: Keep the prompt's image in one tonal base and reserve a single structural color accent for its focus or action, the copy exact.
  color_and_tone: Functional monochrome with one limited accent area, brand colors kept.
  lighting_and_shadow: Coherent light and controlled contrast across the tonal image.
  texture_and_material: Sober finish, subordinate material detail and clean-edged text.
  camera_and_composition: The color focus tied to the message, strong hierarchy and calm regions.
  atmosphere_and_mood: Contained intensity and attention directed precisely to one single point.
  rendering_and_quality: Clean campaign image where the accent points at something real.
  creative_brief: "Monochrome Accent Signals: a concentrated tonal base leaves one structural color accent to point at the action or focus. Carry it through tonal base, one accent, directed attention, exact copy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
