visualDna:
  aesthetic: >-
    Clean colored drawing uses strong contours and a few sharply separated shadow planes to make existing
    forms feel sculptural and immediately readable.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Clarify the given structure with
    decisive light and shadow divisions instead of adding dramatic gestures or effects.
  color_and_tone: >-
    Retain the requested local palette and emphasize its existing dominant colors with clear value
    separation; avoid imposing unrelated accent colors.
  lighting_and_shadow: >-
    Follow the specified light direction and let it determine each hard-edged shadow plane; do not add a
    new source, rim flash or glow.
  texture_and_material: >-
    Keep filled color areas smooth and clearly separated. Preserve material differences through the
    requested colors and shapes rather than a blanket surface texture.
  camera_and_composition: >-
    Hold the requested viewpoint, crop, framing and placement. Strong value grouping must not alter the
    arrangement or turn the subject into a different pose.
  atmosphere_and_mood: >-
    Maintain the requested tone and setting; contrast comes from the drawing and does not require an
    explosion, beam or heightened event.
  rendering_and_quality: >-
    Use a firm contour, broad local color and a small number of crisp shadow shapes. Keep edges clean and
    avoid gradients that soften the cel divisions.
avoidRules:
  - unrequested energy rays or explosions
  - extra details that alter identity or function
