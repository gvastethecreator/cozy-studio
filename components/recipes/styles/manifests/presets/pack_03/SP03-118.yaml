visualDna:
  aesthetic: 'Topology-optimized generative design: the subject reduced to bone-like load paths and organic lattice struts, as if grown by an algorithm and printed in metal.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; hollow its solid mass into optimized struts and lattices that follow its load paths (a declared construction change), delivered as one hero image, never a multi-view sheet.
  color_and_tone: Matte sintered titanium grey or powder-white nylon, with machined contact faces in brighter bare metal.
  lighting_and_shadow: Soft studio key with deep occlusion inside the lattice and a rim light separating the branching struts.
  texture_and_material: Fine layer lines and sintered grain on the struts, gyroid infill in thick regions, smooth machined mounting faces.
  camera_and_composition: Keep the requested view; the angle looks through the lattice to show its depth.
  atmosphere_and_mood: Alien and efficient, engineering that looks as if it grew.
  rendering_and_quality: Printed-metal behavior with smooth branching joints; not a random fractal, a wireframe or a plant.
  creative_brief: "Topology-optimized generative design: the subject reduced to bone-like load paths and organic lattice struts, as if grown by an algorithm and printed in metal. Carry it through bone-like load-path struts, gyroid infill, sintered titanium finish, layer lines, machined contact faces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bone-like load-path struts; gyroid infill; sintered titanium finish; layer lines; machined contact faces
