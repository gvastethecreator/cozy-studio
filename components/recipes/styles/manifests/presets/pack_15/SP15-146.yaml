visualDna:
  aesthetic: 'Wirepunk: dense cities where every surface is buried under tangled cables, junction boxes and illegal taps, wires as the true architecture.'
  subject_treatment: Keep the prompt's subject and setting; bury the surroundings in tangled cables, taped splices and hanging wire bundles.
  color_and_tone: Black and grey cable masses with colored insulation accents and sodium orange light.
  lighting_and_shadow: Streetlamps filtering through wire canopies, sparks from bad splices.
  texture_and_material: Rubber insulation, electrical tape, junction boxes, rusted poles and dripping water.
  camera_and_composition: Upward views into cable canopies and narrow alleys roofed by wires.
  atmosphere_and_mood: Chaotic and alive, a city held together by improvised connections.
  rendering_and_quality: Dense line illustration with readable cable structure and spark accents.
  creative_brief: "Wirepunk: dense cities where every surface is buried under tangled cables, junction boxes and illegal taps, wires as the true architecture. Carry it through cable canopies, tape splices, junction boxes, sparks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: cable canopies; tape splices; junction boxes; sparks
