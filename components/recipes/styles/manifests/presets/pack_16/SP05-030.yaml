visualDna:
  aesthetic: >-
    Ornamental shadow shapes meet crisp graphic accents and clear motion
    contours.
  subject_treatment: >-
    Preserve the prompted subject and action. Use motion-ready contours and visible force
    transfer within the existing gesture.
  color_and_tone: >-
    If palette is open, use black, crimson, bone, violet and occasional polished-gold
    accents. Retain all explicit colors.
  lighting_and_shadow: >-
    Use localized warm glow, hard rim and deep velvet-like shadow, keeping the source
    consistent with the prompt.
  texture_and_material: >-
    Render ornamental ink and polished-to-matte contrast only on surfaces already present.
  camera_and_composition: >-
    Keep the requested camera. When action is present, clarify attack direction, recoil
    spacing and motion lanes without inventing action.
  atmosphere_and_mood: >-
    Let the requested tone set the balance of elegance, danger or spectacle.
  rendering_and_quality: >-
    Keep impact contours crisp, shadows grouped and background painting integrated without
    obscuring motion.
  key_features: >-
    Ornamental shadow shapes; hard rim over deep soft shadow; bright graphic accents;
    readable force-transfer lines.
  creative_brief: >-
    Combine ornamental shadow, optional dark accents and clear action contours only as the
    prompt allows. Keep its scene, palette and framing.
