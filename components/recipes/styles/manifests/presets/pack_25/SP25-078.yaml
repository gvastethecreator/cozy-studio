visualDna:
  aesthetic: 'Map-and-Inspector Workspace: a spatial plan and a coordinated inspector keep context visible while one selected item is edited.'
  subject_treatment: Link the prompt's spatial plan and a side inspector by a stable identity, keeping every requested coordinate, route and label exact.
  color_and_tone: Map lower in contrast than the selection and its properties, states backed by shape.
  lighting_and_shadow: Flat plan rendering that keeps the topology and every element visible.
  texture_and_material: Clean map surfaces and lines with a crisp text inspector.
  camera_and_composition: Wide central plan and a side inspector, the selection visible in both.
  atmosphere_and_mood: Spatial orientation and local editing without losing the context.
  rendering_and_quality: Selecting an item never moves it or creates a duplicate.
  creative_brief: "Map-and-Inspector Workspace: a spatial plan and a coordinated inspector keep context visible while one selected item is edited. Carry it through central plan, linked inspector, visible selection, exact coordinates. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: central plan; linked inspector; visible selection; exact coordinates
