visualDna:
  aesthetic: 'Analytic-synthetic Cubism: forms broken into faceted planes seen from several viewpoints at once.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is fractured into overlapping angular planes showing front and profile simultaneously, reassembled into a shallow space."
  color_and_tone: Muted ochre, grey, olive and brown with occasional collage-like color blocks.
  lighting_and_shadow: Light is flattened into tonal facets rather than a single source.
  texture_and_material: Faceted planes, overlapping outlines and paint-like brushwork, visible at card size as the signature of the style.
  camera_and_composition: Shallow, compressed picture plane with interlocking facets, arranged so the subject still reads at card size.
  atmosphere_and_mood: Intellectual, restless, fragmented and dense, driven by the construction, color and rhythm.
  rendering_and_quality: Painterly Cubist finish with clear facet edges, with clean, deliberate marks and no accidental noise.
  key_features: multiple viewpoints; faceted planes; shallow space; muted ochre-grey
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cubism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - realistic perspective
  - smooth
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
