visualDna:
  aesthetic: 'Gold leaf: thin beaten gold applied over the target with visible leaf seams, crackle and burnish.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is gilded with gold leaf showing leaf seams, crackle and burnished highlights."
  color_and_tone: Warm yellow gold with red bole showing through cracks.
  lighting_and_shadow: Warm raking light for burnish and leaf edges, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Gold leaf squares with seams, crackle and burnish, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Sacred, precious, opulent and still, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: gold leaf seams; crackle over red bole; burnished highlights
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gold Leaf as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - replacing the target with the source product
  - solid gold bar
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
