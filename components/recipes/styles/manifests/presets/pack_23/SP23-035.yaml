visualDna:
  aesthetic: >-
    Combine angular, low-detail geometry with painterly raster textures and clear color separation
    between planes. Use simple shadows and a handcrafted surface finish instead of glossy physically
    based rendering.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and function. Let planar
    changes in color and texture clarify existing form; do not introduce floating landforms, oversized
    fungi, extraterrestrial scenery or other unrequested content.
  color_and_tone: >-
    Preserve the requested palette and its relationships. Separate adjacent forms through the user's
    colors and restrained value contrast; do not require psychedelic hues, red skies or a fixed grade.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow shape. Keep shadows simple and local to existing
    forms without changing the time of day, adding unusual skies or creating an alien atmosphere.
  texture_and_material: >-
    Use painterly raster texture in controlled, material-aware areas. Keep the low-resolution brushwork
    visible without applying it uniformly or replacing the depicted material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, perspective, scale and arrangement. Do not impose a game
    landscape, floating-island composition, horizon or interface.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Angular geometry and painted textures do not require an
    extraterrestrial world, fantasy content or a specific color atmosphere.
  rendering_and_quality: >-
    Balance distinct polygonal planes with expressive raster texture and simple shadow shapes. Keep
    highlights restrained and surfaces matte; avoid polished PBR gloss or uniform texture coverage.
avoidRules:
  - unrequested floating islands, oversized fungi or extraterrestrial scenery
  - fixed psychedelic palette, red sky or alien atmosphere
  - unrequested landscape composition, horizon or interface
  - glossy PBR finish or uniform painterly texture
