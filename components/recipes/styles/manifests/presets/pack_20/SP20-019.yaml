visualDna:
  aesthetic: 'Carbon paper trace: a drawing transferred by pressing through carbon paper, leaving smudgy blue-black lines, pressure blots and stray hand smears.'
  subject_treatment: Trace the prompt's subject as carbon-transferred lines, keeping its outline and main details while pressure changes darken or break the line.
  color_and_tone: Blue-black or purple carbon lines on thin white or yellow copy paper.
  lighting_and_shadow: No modeled light; shading appears only as rubbed carbon patches where the hand pressed.
  texture_and_material: Grainy carbon lines, fingerprint smudges, pressure blots at stops and faint accidental marks.
  camera_and_composition: Simple illustrative layout on a single sheet, sometimes with a faint double from shifting paper.
  atmosphere_and_mood: Bureaucratic, intimate and slightly messy, a copy made by hand.
  rendering_and_quality: Authentic carbon transfer texture with smudges and blots, never clean pen lines.
  creative_brief: "Carbon paper trace: a drawing transferred by pressing through carbon paper, leaving smudgy blue-black lines, pressure blots and stray hand smears. Carry it through blue-black carbon lines, pressure blots, fingerprint smudges, thin copy paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: blue-black carbon lines; pressure blots; fingerprint smudges; thin copy paper
