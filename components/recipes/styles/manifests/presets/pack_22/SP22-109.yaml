visualDna:
  aesthetic: >-
    Digital painting builds form through broad, carved-looking marks whose direction follows compact
    planes; any sense of paint relief remains a pictorial effect.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Describe large forms with directional
    strokes and readable facets while keeping defining contours clear.
  color_and_tone: >-
    Favor a few broad value groups with a rich range of intermediate color. Retain the requested palette
    and local color relationships.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use broad brush planes to express its transitions
    without adding a new light source or unsupported highlights.
  texture_and_material: >-
    Suggest painted buildup through stroke direction and selective edge breaks. Do not impose plastic
    gloss, a canvas pattern or a change to the represented material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not restage the image to
    emphasize brushwork.
  atmosphere_and_mood: >-
    Keep the requested tone. Broad strokes and faceted forms do not add an epic setting, event or pose.
  rendering_and_quality: >-
    Prioritize silhouette, major value masses and stroke direction. Keep facets distinct, and reserve
    smaller marks for details that support form or identity.
avoidRules:
  - plastic-like gloss
  - uniform high-frequency detail
