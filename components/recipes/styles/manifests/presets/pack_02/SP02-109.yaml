visualDna:
  aesthetic: 'Use this drawing language: Elastic dual-form cartoon with one continuous exaggerated contour, accordion compression, and contrasting color, scale, expression, or texture at opposite ends when supplied by the prompt. Apply it as a rendering treatment to user-provided content; let the user control subject and context.'
  subject_treatment: Apply clean elastic outlines, continuous contour, simple construction, and soft squash curves to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use flat TV colors, mustard tan, muted blue, warm orange, faded green, and heavy black accents as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat cel values with simple graphic shadows as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render smooth cel fill, analog-TV softness, light scan grain, and simple painted-looking marks as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Preserve one continuous silhouette; apply contrast at its ends only when the supplied subject already contains a duality.
  atmosphere_and_mood: Playful and elastic; use visual contrast only when the source content already contains it.
  rendering_and_quality: Finish with simple cel shapes and a continuous outline whose end-to-end contrast reads as one form.
  key_features: continuous outline; elastic compression; simple cartoon shapes; contrast only where present
  creative_brief: Render the supplied content with clean elastic outlines, continuous contour, simple construction, and soft squash curves. Use flat TV colors, mustard tan, muted blue, warm orange, faded green, and heavy black accents as style colors while honoring any explicit color instructions. Apply smooth cel fill, analog-TV softness, light scan grain, and simple painted-looking marks as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
