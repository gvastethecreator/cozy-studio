visualDna:
  aesthetic: 'Askiisoft Katana Zero (2019) look: side-view pixel art at low resolution, neo-noir motel and club interiors, teal and magenta neon, VHS scanline glitches, slow-motion afterimages and one-hit sword kills.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as small crisp pixel-art sprites with readable silhouettes, trailing afterimages and sharp slash arcs. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Teal window light, hot magenta neon, deep purple shadow and blood red accents.
  lighting_and_shadow: Flat neon pools on pixel floors with bright slash flashes and dark rooms between lights.
  texture_and_material: Low-resolution pixel art with VHS scanlines, chromatic glitch and tape noise.
  camera_and_composition: Flat side-view room cutaway with the whole fight readable in one screen.
  atmosphere_and_mood: Keep the requested mood with cool neo-noir slaughter.
  rendering_and_quality: Authentic indie pixel-art action screen with VHS replay glitch.
  key_features: Katana Zero pixel noir; VHS glitch; slow-motion afterimages; neon rooms
  creative_brief: "Askiisoft Katana Zero (2019) look: side-view pixel art at low resolution, neo-noir motel and club interiors, teal and magenta neon, VHS scanline glitches, slow-motion afterimages and one-hit sword kills. Carry it through Katana Zero pixel noir, VHS glitch, slow-motion afterimages, neon rooms. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
