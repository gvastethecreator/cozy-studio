visualDna:
  aesthetic: >-
    Source-informed video-game style router for original tactical marksman shooter captures:
    first-person or scoped overwatch, canyon depth, wind/haze, target patrol spacing, stealth route
    planning, and ballistics-readable sightlines. Land as a fictional marksman contract, not a
    strategy map or military poster.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable marksman screenshot subject: keep
    clear distance relationship, target/object function, cover, route affordance, scope/optic
    framing, and stealth pressure without copying source missions or UI.
  color_and_tone: >-
    Use a tactical canyon palette: dust beige, sun-bleached rock, cold optic blue, dry scrub green,
    muted metal grey, and warning red accents. Keep value grouping legible through atmospheric
    depth.
  lighting_and_shadow: >-
    Light the image through harsh noon sun, scope glare, dust haze, muzzle flash, and long terrain
    shadows. Lighting must clarify the playable route, threat, focal subject, or objective and avoid
    generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from rock strata, tactical fabric, matte rifle metal, scrub brush, distant
    vehicles, heat shimmer, and sandy dust. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person scope, binocular, or over-weapon camera; visible foreground cover;
    mid-distance patrol/objective; long sightline; and one clear tactical decision. Avoid isometric
    strategy overview.
  atmosphere_and_mood: 'Carry an original canyon marksman mood: patient, lethal, dry, quiet, tactical, and heat-hazed.'
  rendering_and_quality: >-
    Finish as coherent first-person tactical shooter screenshot style, not concept art: optic
    reticle, wind dots, range pips, objective markers, and minimap shapes can appear as abstract
    non-readable HUD. Maintain heavy-denoise clarity and no readable UI text.
  key_features: >-
    Sniper Ghost Warrior Contracts 2 gameplay screenshots; long-range tactical sniper capture with
    desert canyons, optic overlays, distant targets, wind/ballistics tension, and stealth approach
    routes; red canyon rock, tan sand, military olive, black scope vignette, pale sky, and small red
    target marks; harsh noon sun, scope glare, dust haze, muzzle flash, and long terrain shadows;
    rock strata, tactical fabric, matte rifle metal, scrub brush, distant vehicles, heat shimmer,
    and sandy dust; first-person scoped or over-watch composition with reticle logic, target depth,
    terrain cover, and ballistic lane readability; patient, lethal, dry, quiet, and tactical; HUD
    guidance: scope reticle, wind/elevation marks, objective distance, ammo, and detection
    indicators are allowed if precise
  creative_brief: >-
    Use Canyon Marksman Contract as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through tactical marksman references: first-person optics, long sightlines,
    patrol spacing, cover, environmental haze, and readable stealth objective. Avoid
    strategy-tactics framing, readable scope text, and generic military promo composition.
