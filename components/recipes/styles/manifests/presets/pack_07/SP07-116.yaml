visualDna:
  aesthetic: 'Woven wattle architecture: circular buildings of living willow withies and hazel wattle, clay daub infill and tall conical thatch roofs.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Straw gold, willow green-grey, clay ochre and peat-smoke blue; soft earthy palette with low contrast.
  lighting_and_shadow: Misty morning light with smoke seeping through the thatch; soft shadows and a warm glow at the low doorways.
  texture_and_material: Basket-weave wattle, bundled reed thatch, cracked daub with finger marks, sprouting willow shoots on living walls.
  camera_and_composition: Keep the requested view; circular plans and conical roofs dominate, clustered together at ground level.
  atmosphere_and_mood: Quiet, communal and rooted, architecture woven by hand from the marsh.
  rendering_and_quality: Naturalistic painting with tactile weave detail; no ropes, platforms or tree-lashing construction.
  creative_brief: "Woven wattle architecture: circular buildings of living willow withies and hazel wattle, clay daub infill and tall conical thatch roofs. Carry it through woven willow and hazel wattle, conical reed thatch, clay daub infill, circular plans, smoke through thatch in mist. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
