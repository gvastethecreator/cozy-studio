visualDna:
  aesthetic: 'Front-Back Placement Layout: related artwork placed on the front and back of one garment with measured anchors and verifiable scales.'
  subject_treatment: Place the prompt's front and back artwork on the same garment by measured anchors from collar, center and hem, each piece and orientation exact.
  color_and_tone: An inherited palette shared by both the front and the back.
  lighting_and_shadow: Both views shown in comparable, even light and at the same scale.
  texture_and_material: Art and placement guides kept apart, the fabric unchanged.
  camera_and_composition: Front and back flats side by side with anchor distances.
  atmosphere_and_mood: A clear relationship between two sides with different weights.
  rendering_and_quality: Clean layout with one base silhouette and exact texts.
  creative_brief: "Front-Back Placement Layout: related artwork placed on the front and back of one garment with measured anchors and verifiable scales. Carry it through front and back, measured anchors, same silhouette, exact art. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: front and back; measured anchors; same silhouette; exact art
