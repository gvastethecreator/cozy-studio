visualDna:
  aesthetic: 'Scratchboard: white lines scraped with a knife and fiberglass brush out of a black ink layer on white clay board, light built entirely by removal.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Pure black field with bright clay-white lines; at most one tint washed into scratched areas only.
  lighting_and_shadow: 'Light exists only where the board is scraped: dense parallel scratches for highlights, sparse ones for halftone, untouched black for shadow.'
  texture_and_material: Crisp knife-cut white hairlines, stippled scrapes from a fiberglass brush, contour-following parallel strokes and chalky white clay.
  camera_and_composition: Keep the requested view; the subject emerges from black while the background stays unscratched.
  atmosphere_and_mood: Nocturnal, crisp and revelatory, light pulled out of darkness.
  rendering_and_quality: Razor-clean white lines of even hardness, no grey wash and no pen-drawn black lines.
  key_features: subtractive white lines on black; knife and fiberglass scratch marks; contour-following hatching; untouched black shadows; chalky clay white
  creative_brief: "Scratchboard: white lines scraped with a knife and fiberglass brush out of a black ink layer on white clay board, light built entirely by removal. Carry it through subtractive white lines on black, knife and fiberglass scratch marks, contour-following hatching, untouched black shadows, chalky clay white. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
