visualDna:
  aesthetic: >-
    Onimusha: Warlords HD (2019) fixed-screen gameplay: small early-2000s 3D combatants against
    richly pre-rendered Japanese timber, plaster and stone environments.
  subject_treatment: >-
    Keep the prompt's playable subject readable against the environment and any immediate
    interaction. Preserve identity; do not replace it with a named character or named enemy.
  color_and_tone: >-
    Follow the selected scene and explicit palette. Use atmospheric feudal materials and
    supernatural accent colors only where requested; do not impose a fixed red/green scheme.
  lighting_and_shadow: >-
    Maintain the distinction between the scene's composed background lighting and the animated
    foreground subject. Avoid camera-dependent lights or effects that obscure the frame.
  texture_and_material: >-
    Keep the contrast between low-complexity animated character geometry and richly authored
    background surfaces. When feudal settings are requested, distinguish lacquer, dark timber,
    plaster and fitted stone; avoid contemporary PBR depth or uniform modern texture detail.
  camera_and_composition: >-
    Use one authored fixed environmental camera with a smaller animated 3D subject moving through a
    composed background. Preserve the requested output aspect ratio and keep usable depth planes
    visible; if classic 4:3 presentation is requested, preserve that fixed-screen framing. Do not
    invent a free orbit or shoulder camera.
  atmosphere_and_mood: >-
    Show a playable exploration or encounter beat, with suspense only at the requested intensity. Do
    not force a castle rescue, demon reveal or scripted cutscene.
  rendering_and_quality: >-
    Read as an HD-updated 2019 gameplay capture of a classic fixed-camera game, not modern key art.
    Keep the subject and interaction legible; show interface only when the requested output calls
    for it.
avoidRules:
  - unrequested use of Samanosuke, Kaede, named demons, exact castle rooms or key art
  - mixing the 4:3 fixed composition with a free-moving 16:9 camera
  - unrequested supernatural effects, copied health/magic meters or fabricated interface labels
  - modern cinematic depth-of-field that hides scene layout
assets:
