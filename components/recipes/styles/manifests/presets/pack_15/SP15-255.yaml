  color_and_tone: Rust red, ochre and butterscotch sky with dusty whites and cold blue Martian sunsets.
  lighting_and_shadow: Dim hazy sunlight through dust, blue sunsets and dome glow at night.
  texture_and_material: Rust dust, cracked regolith, scuffed suit fabric, dome glass and rover tires.
  camera_and_composition: Wide frontier landscapes with small domes and caravans under huge skies.
  atmosphere_and_mood: Tough, lonely and pioneering, a wild west under a pink sky.
  rendering_and_quality: Dusty cinematic illustration with hazy depth and fine rust grain.
