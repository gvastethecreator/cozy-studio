visualDna:
  aesthetic: 'Silhouette iteration sheet: design variants of the subject as pure black fills on white, same pose and scale, only the outline changing.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a rigid grid of twelve to sixteen outline variants of the subject at identical scale and pose, and that layout replaces the requested framing.
  color_and_tone: Binary black on white, with at most one grey fill marking the selected variant.
  lighting_and_shadow: No light or interior value at all; every decision lives in the outline.
  texture_and_material: Crisp vector-clean or lasso-cut edges, shape language varied between round, square, triangular and spiked.
  camera_and_composition: Four-by-four or three-by-four grid with equal cells, a shared baseline in each cell, identical camera angle throughout.
  atmosphere_and_mood: Decisive and comparative, shape language on trial.
  rendering_and_quality: Solid flat silhouettes with zero internal detail, no texture and no rendering.
  key_features: pure black silhouettes; rigid equal grid; same pose and scale; varied shape language; outline-only design
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Silhouette Iteration Sheet as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
