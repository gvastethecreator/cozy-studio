visualDna:
  aesthetic: >-
    Low-key geometric restraint: long straight contour runs, hard rectangular shadow divisions,
    and thin softened distance marks.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Angular shadow
    cuts clarify existing planes but add no uniforms, insignia, or equipment.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor slate blue, navy,
    muted violet, and isolated amber; maintain explicit local colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep illumination source-bound with small
    highlights over broad cool shadows; invent no lamps or reflections.
  texture_and_material: >-
    Apply texture only to materials already present. Use matte low-noise fills and precise
    reflected color only on reflective surfaces already present.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Align existing lines into
    horizontal or vertical readings without inserting bars, windows, or grids.
  atmosphere_and_mood: >-
    Keep the prompt's emotional tone; geometric severity does not require melancholy.
  rendering_and_quality: >-
    Separate overlapping silhouettes in dark values and retain detail inside shadow without
    lifting all blacks.
  key_features: >-
    Rectilinear shadow blocks; long contour runs; slate-blue low key; thin distance edges.
  creative_brief: "Use rectilinear shadow blocks; long contour runs; slate-blue low key; thin distance edges. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
