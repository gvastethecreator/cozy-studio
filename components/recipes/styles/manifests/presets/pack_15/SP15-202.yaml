  aesthetic: 'Geyserpunk: a culture powered by geysers and hot springs, with steam-timed clocks, terraced mineral pools, pipe organs of vents and bathhouse cities.'
  subject_treatment: Keep the prompt's subject and setting; surround it with erupting geysers, steaming terraced pools and geothermal pipes.
  color_and_tone: Mineral turquoise pools, sulfur yellow and rust orange crusts with white steam.
  lighting_and_shadow: Soft diffused light through drifting steam, bright sun catching spray.
  texture_and_material: Mineral terraces, bubbling mud, copper pipes, wet stone and billowing steam.
  camera_and_composition: Wide views of terraced pools and tall eruptions dwarfing bathers below.
  atmosphere_and_mood: Warm, steamy and rhythmic, a city that lives by the timing of the earth.
  rendering_and_quality: Soft luminous illustration with layered steam and saturated mineral colors.
  creative_brief: "Geyserpunk: a culture powered by geysers and hot springs, with steam-timed clocks, terraced mineral pools, pipe organs of vents and bathhouse cities. Carry it through erupting geysers, mineral terraces, steam clocks, bathhouse cities. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
