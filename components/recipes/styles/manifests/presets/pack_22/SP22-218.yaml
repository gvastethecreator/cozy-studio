visualDna:
  aesthetic: >-
    Render existing three-dimensional forms with smooth continuous surfaces and soft synthetic volume,
    distinguishing this treatment from flat facets or discrete blocks.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Keep existing parts
    and joins distinct; do not merge separate forms or invent new geometry.
  color_and_tone: >-
    Retain the requested palette and use restrained value changes to clarify surface orientation; do not
    force a single glossy or monochrome finish.
  lighting_and_shadow: >-
    Follow the requested lighting direction and use soft surface values to describe it without adding a
    new source or changing exposure.
  texture_and_material: >-
    Keep surface detail low-frequency and preserve the requested material character, whether matte,
    satin or otherwise specified.
  camera_and_composition: >-
    Preserve the requested viewpoint, perspective, crop, framing and placement. Smooth volume does not
    authorize a new angle or sculptural display setup.
  atmosphere_and_mood: >-
    Retain the requested environment and tone; continuous rendering does not add a synthetic backdrop
    or alter the scene.
  rendering_and_quality: >-
    Use smooth curvature and controlled joins to convey volume while keeping the silhouette, part
    boundaries and defining details intact.
avoidRules:
  - melting separate parts or erasing structural joins
  - geometry that changes the requested silhouette
  - details that alter identity or function
