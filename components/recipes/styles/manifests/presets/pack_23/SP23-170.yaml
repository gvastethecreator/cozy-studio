visualDna:
  aesthetic: 'Draw-distance fog world: early 3D worlds wrapped in thick colored fog that hides how little could be drawn, objects popping out of the haze a few steps away.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; surround the subject with thick flat fog that swallows everything beyond a short distance.
  color_and_tone: Flat fog color such as grey-green, purple or orange.
  lighting_and_shadow: Flat ambient light fading into fog color, kept consistent across the whole image.
  texture_and_material: Low-res textures fading into solid fog, kept consistent across the whole image.
  camera_and_composition: Near objects clear, distance a flat wall of fog.
  atmosphere_and_mood: Keep the requested mood with lonely unseen menace.
  rendering_and_quality: Hard fog falloff with objects popping into view.
  creative_brief: "Draw-distance fog world: early 3D worlds wrapped in thick colored fog that hides how little could be drawn, objects popping out of the haze a few steps away. Carry it through thick flat fog, short view distance, popping objects, low-res textures. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thick flat fog; short view distance; popping objects; low-res textures
