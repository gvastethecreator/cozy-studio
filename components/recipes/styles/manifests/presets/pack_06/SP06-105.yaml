visualDna:
  aesthetic: >-
    Retro Fighting Game Select Screen acts as a transferable art-medium router: start from 90s
    arcade fighting game select screen treatment with bold pixel paint, impact gradients, and
    competitive energy, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity and game-art direction system built from playable
    readability, UI or asset grammar, role clarity, production polish, and genre-specific visual
    feedback, then apply the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Render any subject as a high contrast selectable emblem
    with exaggerated contour strength and badge like presence; preserve the prompt subject while
    routing it through tile readability, icon clarity, splash rendering, interface material, sprite
    bounce, shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose,
    object function, or environment legible.
  color_and_tone: >-
    Build color with Saturated arcade elevated edge structure, electric rim colors, hot shadows, and
    posterized flesh/object tones without realism; use color as gameplay hierarchy: rarity glow,
    faction contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or readable
    inventory material, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Dramatic top/rim lighting with hard cel shadow cuts and glossy screen flare
    accents; shape light through game readability: rim separation, UI glow, static-camera dread,
    foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so value structure
    supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Pixel painted brush clusters, low res dithering, chunky anti aliasing, and arcade monitor
    softness; surface detail should support genre grammar through parchment, HUD glass, pixel atlas
    texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Tight icon/portrait framing, diagonal energy slashes, layered
    selection panels, and strong center lock; compose through gameplay-facing hierarchy, atlas
    consistency, menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen
    energy, with scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Competitive, loud, characterful mood without requiring human fighters, faces,
    contest geometry, or UI text; derive mood from playable stakes, collection desire, tactical
    control, cozy routine, survival dread, arcade speed, or heroic confrontation, letting the medium
    alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Crisp retro game polish, stable silhouette, no modern photoreal shading, no readable
    labels; finish with game-production clarity, strong silhouettes, controlled UI-like detail, and
    no unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    90s arcade fighting game select screen treatment with bold pixel paint, impact gradients, and
    competitive energy; gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity; Saturated arcade elevated edge structure, electric rim
    colors, hot shadows, and posterized flesh/object tones without realism; Pixel painted brush
    clusters, low res dithering, chunky anti aliasing, and arcade monitor softness; Tight
    icon/portrait framing, diagonal energy slashes, layered selection panels, and strong center lock
  creative_brief: >-
    Apply Retro Fighting Game Select Screen as an art-style preset over prompt X: preserve the
    user's requested subject, then route mark-making, palette, surface, composition, mood, and final
    craft through 90s arcade fighting game select screen treatment with bold pixel paint, impact
    gradients, and competitive energy, gameplay-readable hierarchy, genre-specific surface language,
    UI-aware composition, and production-art clarity, Pixel painted brush clusters, low res
    dithering, chunky anti aliasing, and arcade monitor softness without requiring the card image's
    original subject.
