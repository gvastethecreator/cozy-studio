visualDna:
  aesthetic: 'Anime fisheye staging: the subject reaches or throws straight toward an ultra-wide lens, the hand swelling to the size of the head while the body shrinks behind it and the edges of the scene curve.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the ultra-wide close camera and extreme reach foreshortening, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the near hand is the brightest, most saturated area of the frame.
  lighting_and_shadow: Front light on the reaching hand, with the body behind falling half a stop darker.
  texture_and_material: Clean cel surfaces; detail concentrated on the near hand, simplified toward the curved edges.
  camera_and_composition: Ultra-wide lens under half a meter from the hand, barrel curvature on straight lines, the face small but readable behind the hand.
  atmosphere_and_mood: Direct, confrontational energy aimed at the viewer without hostility.
  rendering_and_quality: Controlled barrel distortion and believable anatomy through the extreme foreshortening.
  creative_brief: "Anime fisheye staging: the subject reaches or throws straight toward an ultra-wide lens, the hand swelling to the size of the head while the body shrinks behind it and the edges of the scene curve. Carry it through hand reaching into an ultra-wide lens, hand as large as the head, barrel-curved edges, bright near hand, small readable face behind. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hand reaching into an ultra-wide lens; hand as large as the head; barrel-curved edges; bright near hand; small readable face behind
