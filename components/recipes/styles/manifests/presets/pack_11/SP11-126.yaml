  color_and_tone: Brown or black ink on cream paper with blue water.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Engraved ink strokes on laid paper, with the drafting tools visible in the line quality.
  camera_and_composition: Map sheet with neatline border and compass rose, laid out as a real sheet of this drawing type.
  atmosphere_and_mood: Old, careful, geographic and patient, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Hachure relief map: terrain drawn with thousands of short strokes that follow the slopes, dense on steep ground. Carry it through hachure strokes, slopes, rivers, compass rose. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
