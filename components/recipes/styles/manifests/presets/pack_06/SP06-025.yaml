visualDna:
  aesthetic: 'Technical pen drafting: fixed-width tubular nibs in a strict line-weight hierarchy, with ruled straight lines, template ellipses and measured parallel hatching.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Black ink on white or pale vellum; tone only as evenly spaced mechanical hatching or dot screens.
  lighting_and_shadow: 'Minimal shading: section cuts and cast shadows filled with uniform parallel hatching at a fixed angle.'
  texture_and_material: Smooth drafting film or vellum, perfectly even line width per nib, crisp corners, no pressure variation.
  camera_and_composition: Keep the requested subject but present it as orthographic, isometric, cutaway or exploded view with clean construction.
  atmosphere_and_mood: Rational, calm and exacting, the pleasure of understanding how things work.
  rendering_and_quality: Three line weights at most, heavy outline, medium edges, fine hatching; no freehand wobble, no labels or dimensions.
  key_features: fixed-width line hierarchy; ruled and templated geometry; uniform angled hatching; cutaway or exploded views; smooth vellum
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Technical Pen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the requested subject
  - mixing in a second drawing tool
  - painted color fill
  - pressure-varied line
  - freehand sketchiness
  - dimension labels or callout text
  - photo
  - realistic
