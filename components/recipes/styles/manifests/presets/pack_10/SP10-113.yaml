visualDna:
  aesthetic: 'Mirror world: reflections that show a different reality than the scene.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: a reflective surface in the scene shows a different version of the subject or world."
  color_and_tone: Natural palette with contrasting reflection palette, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Natural light, supporting the dream logic without adding stock props.
  texture_and_material: Realistic reflections, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Uncanny, poetic, mysterious and split, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mirror World Surrealism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: reflection shows another reality
