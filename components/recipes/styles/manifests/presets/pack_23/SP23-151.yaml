visualDna:
  aesthetic: 'Hand anti-aliased pixel line: pixel art where curves and diagonals are smoothed by carefully placed intermediate-color pixels, clean lines that look smooth at a distance and deliberate up close.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; draw the subject with smooth curves made of hand-placed intermediate pixels.
  color_and_tone: Clean palette with intermediate tones only along edges.
  lighting_and_shadow: Soft shading with neat ramps, kept consistent across the whole image.
  texture_and_material: Crisp pixels with smoothing steps on curves, kept consistent across the whole image.
  camera_and_composition: Large curving shapes that show off the line quality.
  atmosphere_and_mood: Keep the requested mood with polished crafted calm.
  rendering_and_quality: Precise elegant lines without jaggies, kept consistent across the whole image.
  creative_brief: "Hand anti-aliased pixel line: pixel art where curves and diagonals are smoothed by carefully placed intermediate-color pixels, clean lines that look smooth at a distance and deliberate up close. Carry it through smooth pixel curves, intermediate edge pixels, crisp, deliberate. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: smooth pixel curves; intermediate edge pixels; crisp; deliberate
