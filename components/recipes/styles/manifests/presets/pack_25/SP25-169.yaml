visualDna:
  aesthetic: 'Modular Type Windows: bold letters act as windows that crop the image inside them, creating rhythm across a campaign.'
  subject_treatment: Let the requested word act as windows onto the prompt's subject image, keeping every letter's skeleton and order intact and readable.
  color_and_tone: Enough contrast between text and background, the inner image controlled in density.
  lighting_and_shadow: Coherent image light and crisp flat letter edges.
  texture_and_material: Clean cropping with limited visual texture inside the letters.
  camera_and_composition: Large windows and short words so the whole word reads at once.
  atmosphere_and_mood: Graphic rhythm and the discovery of an image inside language.
  rendering_and_quality: Clean poster where the word reads as silhouette before the image.
  creative_brief: "Modular Type Windows: bold letters act as windows that crop the image inside them, creating rhythm across a campaign. Carry it through image in letters, bold short word, readable skeleton, campaign rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: image in letters; bold short word; readable skeleton; campaign rhythm
