visualDna:
  aesthetic: 'Dark fantasy dream theme: gothic, grim, mythic worlds of ruins, monsters and fading light.'
  subject_treatment: "Translate the prompt's subject into this dream-world theme while keeping it recognizable: the subject is placed in a grim gothic dream-world of ruins, mist and ominous scale."
  color_and_tone: Desaturated greys, blood red and gold accents, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Low dramatic light and fog, supporting the dream logic without adding stock props.
  texture_and_material: Painterly rich textures, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Grim, epic, ominous and mythic, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: gothic ruins; mist; ominous scale
  creative_brief: "Dark fantasy dream theme: gothic, grim, mythic worlds of ruins, monsters and fading light. Carry it through gothic ruins, mist, ominous scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
