visualDna:
  aesthetic: 'In-game screenshot look informed by Sea of Thieves gameplay: first-person pirate adventure capture with stylized ships, bright seas, storm skies, treasure props, and playful crew readability. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Sea of Thieves-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Sea of Thieves-informed palette: turquoise ocean, sunset orange, sail cream, brass gold,
    storm purple, and verdigris green. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through golden horizon, lantern glow, cannon flashes, moonlit waves, and storm
    lightning. Lighting must clarify the playable route, threat, focal subject, or objective and
    avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from painted wood, rope, canvas sails, water spray, treasure metal, skull props,
    and chunky stylized pirate gear. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person ship/deck framing with wheel/cannon/rigging foreground, island
    horizon, crew spacing, and naval action cues. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: 'Sea of Thieves-derived mood: roguish, open-sea, playful, stormy, and adventurous; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: minimal pirate HUD, radial
    item hints, compass, and ship damage cues are allowed if integrated. Maintain heavy-denoise
    clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish,
    or random interface clutter.
  key_features: >-
    Sea of Thieves gameplay screenshots; first-person pirate adventure capture with stylized ships,
    bright seas, storm skies, treasure props, and playful crew readability; turquoise ocean, sunset
    orange, sail cream, brass gold, storm purple, and verdigris green; golden horizon, lantern glow,
    cannon flashes, moonlit waves, and storm lightning; painted wood, rope, canvas sails, water
    spray, treasure metal, skull props, and chunky stylized pirate gear; first-person ship/deck
    framing with wheel/cannon/rigging foreground, island horizon, crew spacing, and naval action
    cues; roguish, open-sea, playful, stormy, and adventurous; HUD guidance: minimal pirate HUD,
    radial item hints, compass, and ship damage cues are allowed if integrated
  creative_brief: "Sea of Thieves Pirate Skies: in-game screenshot language informed by Sea of Thieves, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
