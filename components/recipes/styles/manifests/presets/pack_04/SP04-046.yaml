visualDna:
  aesthetic: >-
    Speedpaint acts as a transferable illustration router: start from Rapid concept-speedpainting
    style focused on ideation clarity, mood-first block-in, and exploratory visual decision-making,
    Value-block workflow, gestural stroke hierarchy, composition-first framing, selective detail
    suppression and production concept-art system built from iteration discipline, silhouette
    testing, material exploration, design readability, and pitch-ready visual decisions, then apply
    the visual behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Gestural brush massing with minimal contour commitment,
    directional stroke flow, and value-shape-first structure; preserve the requested subject while
    routing it through design exploration, asset logic, value blocking, scale cues, iteration rows,
    paintover marks, or production-readability constraints, keeping the requested identity,
    silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Mood-driven tonal clusters with controlled atmospheric bleed and broad hue
    families for fast read hierarchy; use color as concept decision-making: mood scripts, material
    swatches, faction accents, environment atmosphere, asset tier contrast, or readable pass
    separation, with deliberate value grouping, accent control, and process-specific limits rather
    than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Ambient atmospheric lighting established through large value masses and
    early-stage contrast anchors; shape light for ideation clarity through value block-in, keyframe
    contrast, material test highlights, callout illumination, or pitch-frame atmosphere, so value
    structure supports the illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Visible digital brush grain with layered opacity passes, rough-edge blending, and
    process-forward stroke evidence; surface detail should reveal brush passes, photobash
    integration, low-poly facets, callout texture, massing blocks, costume fabrics, foliage
    clusters, or weapon material tiers when named, keeping material scale coherent and avoiding
    noisy filler texture.
  camera_and_composition: >-
    Structure the image through Intentionally unresolved edge zones with simplified depth grouping
    and suggestive form abstraction; compose through production hierarchy, variants, orthographic
    logic, isometric staging, silhouette grids, iteration boards, or cinematic keyframe balance
    without locking one finished illustration, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Energetic, exploratory, rough, expressive, iterative; derive mood from
    exploration, worldbuilding pressure, tactical design, creature unease, kitbash utility,
    cinematic intent, or production-room clarity, letting the style alter interpretation without
    demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Loose concept-stage rendering emphasizing composition testing, readable silhouettes,
    and iterative velocity over polish; finish with concept-art usefulness, readable decisions,
    controlled roughness, and no generic fantasy wallpaper or overpolished final render when
    iteration is intended, clean denoised surfaces where appropriate, and enough process evidence to
    make the style recognizable.
  key_features: >-
    Rapid concept-speedpainting style focused on ideation clarity, mood-first block-in, and
    exploratory visual decision-making; Value-block workflow, gestural stroke hierarchy,
    composition-first framing, selective detail suppression; Mood-driven tonal clusters with
    controlled atmospheric bleed and broad hue families for fast read hierarchy; Visible digital
    brush grain with layered opacity passes, rough-edge blending, and process-forward stroke
    evidence; Intentionally unresolved edge zones with simplified depth grouping and suggestive form
    abstraction
  creative_brief: >-
    Apply Speedpaint as an illustration preset over prompt X: preserve the user's requested subject,
    then route mark-making, palette, surface, composition, mood, and final craft through Rapid
    concept-speedpainting style focused on ideation clarity, mood-first block-in, and exploratory
    visual decision-making, Value-block workflow, gestural stroke hierarchy, composition-first
    framing, selective detail suppression, Visible digital brush grain with layered opacity passes,
    rough-edge blending, and process-forward stroke evidence without requiring the card image's
    original subject.
avoidRules:
  - detailed
  - polished
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic fantasy wallpaper
  - overpolished final render
  - unclear design callouts
  - random kitbash clutter
