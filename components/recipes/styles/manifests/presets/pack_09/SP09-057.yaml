visualDna:
  aesthetic: 'Oil on water: iridescent oil film swirling over water around the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: rainbow oil-film swirls spread on water around the target.'
  color_and_tone: Iridescent rainbow film over dark water, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Soft light for thin-film iridescence, so the effect lights the target and casts believable local light.
  texture_and_material: Thin oil film with swirling interference colors, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Toxic, beautiful, eerie and slick, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: iridescent oil swirls; thin-film color; contained around the target
  creative_brief: "Oil on water: iridescent oil film swirling over water around the target. Carry it through iridescent oil swirls, thin-film color, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
