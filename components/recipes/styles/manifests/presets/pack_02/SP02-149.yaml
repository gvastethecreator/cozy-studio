visualDna:
  aesthetic: 'Side-scan sonar: acoustic strips of the seafloor recorded from a towed fish, turning shapes into amber reliefs with long black acoustic shadows.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Amber, copper and brown tones, dark water column stripe down the center, black shadows.
  lighting_and_shadow: 'Pseudo-light from one side: objects bright where facing the sonar and cast long black shadows away.'
  texture_and_material: Sediment ripples, speckle, streaky scan lines, soft blur along the track.
  camera_and_composition: Top-down swath with a dark vertical nadir band and objects to its sides.
  atmosphere_and_mood: Deep and ghostly, lost things found in the dark.
  rendering_and_quality: Credible sonar mosaic; no coordinates or grid text.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Side-Scan Sonar as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: amber acoustic relief; long black shadows; central nadir stripe; scan-line texture; top-down swath
