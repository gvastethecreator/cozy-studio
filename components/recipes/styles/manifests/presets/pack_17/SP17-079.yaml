visualDna:
  aesthetic: >-
    Fine-line fantasy drawing in the silverpoint tradition, with delicate metallic-gray strokes
    accumulated over a softly toned ground and restrained drawn shadows.
  subject_treatment: >-
    Preserve requested anatomy, identity, expression, pose, count, and detail. Use measured contour
    lines and fine cross-contours to explain existing forms rather than beautifying or redesigning them.
  color_and_tone: >-
    Honor requested colors. If none are specified, keep a quiet warm-gray ground, cool silver-gray
    lines, and a narrow value range with enough dark accents to maintain legibility.
  lighting_and_shadow: >-
    Preserve the prompt's light direction. Build form with layered line density and soft drawn
    shadow groups, avoiding a second source or metallic glow.
  texture_and_material: >-
    Keep lines fine, slightly varied in pressure, and integrated with the toned drawing surface.
    Do not turn the depicted subject into metal or impose scratches on its material.
  camera_and_composition: >-
    Respect the requested crop, viewpoint, scale, and placement. Use line density for separation
    within the existing composition without adding a study frame or annotation panel.
  atmosphere_and_mood: >-
    Allow delicacy, restraint, or unease to emerge from the narrow tonal range and patient lines.
    Do not add manuscript symbols, courtly motifs, or historical narrative.
  rendering_and_quality: >-
    Keep contours fine but distinct, cross-hatching sparse, and larger shadow areas open. Avoid
    broad charcoal masses, polished chrome reflections, and unreadable hairline clutter.
avoidRules:
  - forced metallic objects or reflective chrome
  - unrequested manuscript symbols or annotations
  - broad charcoal smudging
  - dense cross-hatching that closes the forms
  - fixed frame or study-sheet layout
