visualDna:
  aesthetic: 'Frank Quitely page look of the 2000s: fine even contour line, heavy soft realistic bodies, strange plastic faces, meticulous clutter and inventive panel layouts that map time and motion.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in fine even line with heavy realistic weight and inventive time-mapping panels. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Soft digital flat color with muted modern palette.
  lighting_and_shadow: Soft even light with minimal rendering, lit the way Frank Quitely lights its scenes.
  texture_and_material: Modern printed comic paper with fine line, with the surface finish of Frank Quitely.
  camera_and_composition: Inventive layouts that show one action across time.
  atmosphere_and_mood: Keep the requested mood with strange tender heroism.
  rendering_and_quality: Faithful Quitely fine-line comic art, in the recognizable hand of Frank Quitely.
  creative_brief: 'Frank Quitely page look of the 2000s: fine even contour line, heavy soft realistic bodies, strange plastic faces, meticulous clutter and inventive panel layouts that map time and motion. Carry it through Quitely fine line, heavy bodies, time-mapped panels. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
  key_features: Quitely fine line; heavy bodies; time-mapped panels
