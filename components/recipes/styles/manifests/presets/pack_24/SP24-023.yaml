visualDna:
  aesthetic: 'Arctic weather-station solitude: a tiny research hut and instrument masts on endless white ice, painted in cold gouache with one warm window glowing.'
  subject_treatment: Place the prompt's subject at or near a lonely polar outpost, keeping it clear against vast white ice and pale sky.
  color_and_tone: Icy blues and whites, pale lilac shadows and a single warm amber window glow.
  lighting_and_shadow: Low polar sun or long twilight, soft blue shadows stretching across the snow.
  texture_and_material: Matte gouache snow, wind-carved drifts, frosted masts and weathered hut panels.
  camera_and_composition: Very wide frames with a tiny outpost against a huge empty horizon.
  atmosphere_and_mood: Quiet, cold and devoted, one person keeping watch at the edge of the world.
  rendering_and_quality: Clean matte gouache painting with crisp shapes and soft snow gradients.
  creative_brief: "Arctic weather-station solitude: a tiny research hut and instrument masts on endless white ice, painted in cold gouache with one warm window glowing. Carry it through tiny polar outpost, endless ice, warm window glow, long blue shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
