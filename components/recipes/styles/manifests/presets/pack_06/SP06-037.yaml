visualDna:
  aesthetic: 'Aquatint: rosin dust fused to a copper plate so acid bites a fine grain around each particle, producing areas of even tone stepped by repeated stop-outs.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Sepia, bistre or grey-black tone in distinct flat value steps from pale to dark; often combined with a light etched outline.
  lighting_and_shadow: Tonal light and shadow in clearly stepped flat areas, like washes, with crisp borders between steps.
  texture_and_material: Fine speckled granular tone under a loupe, sharp-edged tone patches, embossed plate mark, soft cream paper.
  camera_and_composition: Keep the requested framing; broad tonal masses carry the image, with line only for key contours.
  atmosphere_and_mood: Moody, atmospheric and hushed, like dusk seen through a veil.
  rendering_and_quality: Granular even tone areas in stepped values, crisp stop-out edges, plate mark; no hatching for tone, no brush texture.
  key_features: fine rosin grain tone; stepped flat value areas; crisp stop-out edges; sepia or grey-black ink; light etched outline
  creative_brief: "Aquatint: rosin dust fused to a copper plate so acid bites a fine grain around each particle, producing areas of even tone stepped by repeated stop-outs. Carry it through fine rosin grain tone, stepped flat value areas, crisp stop-out edges, sepia or grey-black ink, light etched outline. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
