visualDna:
  aesthetic: >-
    A pop-anime treatment built on clean graphic shapes and stable, readable
    forms.
  subject_treatment: >-
    Keep the requested identity, proportions and action. Allow a playful contour emphasis
    without bending anatomy or changing what is depicted.
  color_and_tone: >-
    When the prompt leaves color open, use bright flat accents and high-key value
    separation. Explicit palettes and color assignments take priority.
  lighting_and_shadow: >-
    Use crisp graphic highlights and a small, controlled glow; retain the underlying shadow
    structure and keep luminous edges distinct.
  texture_and_material: >-
    Favor smooth digital fills, clear ink edges and restrained grain. Match surface detail
    to the actual subject and blend painted backgrounds without plastic gloss.
  camera_and_composition: >-
    Retain the requested viewpoint and layout. Use contrast and visual rhythm within that
    frame; do not introduce distortion or new objects.
  atmosphere_and_mood: >-
    Buoyant visual energy is available when it matches the prompt; keep the requested mood.
  rendering_and_quality: >-
    Separate flat accents from soft background transitions, keep outlines crisp, and limit
    glow to highlights that clarify form.
  key_features: >-
    High-key color grouping when palette is open; bright flat accents; crisp graphic
    highlights; restrained glow over stable silhouettes.
  creative_brief: "Apply bright accents, graphic highlights and restrained glow without altering the requested forms or scene. Honor explicit palette, mood and framing. Use it as a reusable look on any subject."
