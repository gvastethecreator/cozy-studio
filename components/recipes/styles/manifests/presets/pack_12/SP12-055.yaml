    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express ritual hierarchy, artifact
    weight, ceremonial route pressure, and mythic trial readability without forcing a temple scene.
  color_and_tone: >-
    Grade the image with orchid pink, jade green, and palace gold; mineral gold, moonlit blue, jade,
    orchid, volcanic green, marble white, and prismatic ritual accents; keep tonal hierarchy strong
    enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with altar glow, rune bounce, moon shafts, crystal caustics, brazier halos,
    and sacred backlight; use highlights and shadow pockets to reveal routes, hazards, factions, or
    focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from polished tile, silk screens, and ornate rails; carved stone, polished relic
