visualDna:
  aesthetic: 'Coffee painting: brewed coffee applied in dilutions from pale tea-brown washes to thick espresso reductions on cold-press paper.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Monochrome browns from light honey to near black; warmth varies with dilution, no other pigment.
  lighting_and_shadow: Light is left as bare paper; shadows are built in transparent layered washes.
  texture_and_material: Hard tide-line blooms where washes dry, fine coffee granules settling in the paper tooth, back-runs and soft wet-in-wet edges.
  camera_and_composition: Keep the requested view; loose washes at the edges, most layers at the focal point.
  atmosphere_and_mood: Warm and organic, quiet and slightly nostalgic.
  rendering_and_quality: Visible dilution steps and tide lines; never a sepia filter over a photo.
  key_features: layered coffee washes; tide-line blooms; granules in paper tooth; espresso darks; cold-press paper
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Coffee Painting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
