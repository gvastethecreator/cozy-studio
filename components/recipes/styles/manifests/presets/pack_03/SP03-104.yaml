visualDna:
  aesthetic: 'Two-tone ramp lighting: realistic 3D forms lit through a stepped ramp, so light and shadow snap into two or three clean bands with a colored terminator.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Lit band, shadow band and a thin saturated terminator line between them.
  lighting_and_shadow: One key light; hard banded transitions instead of smooth gradients.
  texture_and_material: Materials keep their color but lose soft shading.
  camera_and_composition: Keep the requested framing; forms turned to show the band edges.
  atmosphere_and_mood: Graphic and stylish, reality simplified into shapes of light.
  rendering_and_quality: Crisp banded lighting on 3D forms; no outlines unless requested.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Two-Tone Ramp Lighting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: two or three light bands; saturated terminator line; hard transitions; single key; graphic 3D forms
