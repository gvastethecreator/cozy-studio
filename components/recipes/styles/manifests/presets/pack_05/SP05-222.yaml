visualDna:
  aesthetic: >-
    Practical technical illustration with maintenance-like line discipline, utility color
    blocks, wet-looking reflected accents, and a lightly offbeat rhythm.
  subject_treatment: >-
    Preserve the requested subject and proportions. Clarify its existing construction with
    functional contour lines and small, deliberate detail clusters; add no tools or vehicles.
  color_and_tone: >-
    Use utility teal, signal amber, concrete gray, and off-white in clear, economical blocks;
    keep bright color functional and sparse.
  lighting_and_shadow: >-
    Set firm cel-shadow planes against narrow reflected highlights, using wet-looking accents
    only where they suit the depicted material.
  texture_and_material: >-
    Keep each material recognizable; add fine scuffs, tidy seams, and restrained reflective
    streaks without turning surfaces into pavement or machinery.
  camera_and_composition: >-
    Honor the requested camera. Use measured alignment and slight rhythm breaks within the frame
    to give the drawing practical order and dry wit.
  atmosphere_and_mood: >-
    Convey procedural calm with a subtle comic lift through exact spacing and small visual
    offsets, without introducing civic props.
  rendering_and_quality: >-
    Favor clean technical contours, flat shadow groups, concise texture, and legible
    utility-color separation.
  key_features: >-
    Maintenance-grid line discipline; teal and amber utility palette; neat surface marks; subtle
    offbeat spacing.
  creative_brief: >-
    Preserve the specified subject, setting, and framing. Apply practical contour lines,
    restrained teal-and-amber blocks, and tidy reflected accents; add no tools, vehicles, or
    street scene.
