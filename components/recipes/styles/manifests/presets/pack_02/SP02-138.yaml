visualDna:
  aesthetic: 'Direct-on-film animation: images scratched, painted and inked straight onto celluloid without a camera, so every frame vibrates with hand-made marks.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: White scratches on black emulsion, or translucent dyes in saturated red, yellow and blue.
  lighting_and_shadow: Projector light through the film; bright lines glowing out of the dark.
  texture_and_material: Jittering scratched lines, dye blotches, dust and emulsion flakes.
  camera_and_composition: Simple bold figures centered on the strip, energetic abstract marks around them.
  atmosphere_and_mood: Raw and musical, marks dancing to an unheard rhythm.
  rendering_and_quality: Handmade celluloid texture; no sprocket holes drawn and no digital vector.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Direct-on-Film Scratch Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: scratched white lines on black; translucent dyes; jittering hand marks; projector glow; bold simple figures
