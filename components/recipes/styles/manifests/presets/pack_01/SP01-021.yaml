visualDna:
  aesthetic: 'Large-format 4x5 sheet film: a view camera on a tripod recording extraordinary detail with smooth, seamless tonal gradation.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Rich, smooth tonal transitions, natural restrained color or deep neutral monochrome, subtle highlight rolloff.
  lighting_and_shadow: Slow, deliberate exposure in natural or window light; full shadow detail and delicate highlights.
  texture_and_material: Grain practically invisible; every stone joint, feather, thread and pore resolved.
  camera_and_composition: Keep the requested framing; corrected vertical lines, and a tilted plane of focus that can run along the subject while the rest falls away.
  atmosphere_and_mood: Monumental and contemplative, slow precision that invites long looking.
  rendering_and_quality: Sheet-film clarity and tonality without digital sharpening halos or HDR; depth rendered through lens movements.
  key_features: view-camera detail; seamless tonal gradation; corrected verticals; tilted focus plane; invisible grain
  creative_brief: "Large-format 4x5 sheet film: a view camera on a tripod recording extraordinary detail with smooth, seamless tonal gradation. Carry it through view-camera detail, seamless tonal gradation, corrected verticals, tilted focus plane, invisible grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
