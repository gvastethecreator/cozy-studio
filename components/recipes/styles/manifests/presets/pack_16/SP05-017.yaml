visualDna:
  aesthetic: >-
    A wandering 90s cel drama look uses long, slashing ink contours, dense black shapes and restrained
    rust-red accents. Slightly dry edge texture gives the drawing a raw, reflective weight.
  subject_treatment: >-
    Preserve the requested identity and proportions. Let existing folds and edges carry elongated
    strokes and clear angular turns; never add a weapon, scar or period costume.
  color_and_tone: >-
    When open, set muted plum and blue-black against a narrow rust-red or warm neutral accent. Keep the
    requested palette and let dark values carry most of the weight.
  lighting_and_shadow: >-
    Use directional cel shadows with a restrained edge highlight. Preserve supplied lighting and avoid
    adding a lantern, window or sunset.
  texture_and_material: >-
    Mix solid cel fills with sparse dry-brush grain and a few broken ink edges. Apply wear as drawing
    texture only; do not make the depicted objects physically damaged.
  camera_and_composition: >-
    Favor long diagonals and clear negative-space breaks inside the existing composition. Keep the
    requested angle and crop; do not stage a walk or confrontation.
  atmosphere_and_mood: >-
    Give the linework quiet gravity through pauses and asymmetrical balance. Preserve the requested
    mood rather than requiring regret, violence or redemption.
  rendering_and_quality: >-
    Keep dark forms legible, contours slightly irregular and background planes simply painted. Avoid
    airbrushed softness and excessive scratch texture.
  key_features: >-
    long slashing contours; dense blue-black cel masses; restrained rust-red accents with sparse
    dry-brush grain
  creative_brief: 'Apply the raw, reflective cel line and restrained palette to the requested subject. Preserve its identity, action, setting and camera; add no swordsman, weapon or historical scene. Use it as a reusable look on any subject.'
