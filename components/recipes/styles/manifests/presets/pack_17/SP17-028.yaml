  color_and_tone: Ink black, bone paper, tarnished silver, sepia wash, oxidized green, and small wax-red accents.
  lighting_and_shadow: Value comes from engraved hatching and broad paper-negative space rather than noisy dark gradients.
  texture_and_material: Etched copperplate lines, dry paper, chipped marble, metal scratches, wax seals without readable marks, and clean ink edges.
  camera_and_composition: Frontal heraldic grouping logic, triangular mass arrangement, tall banner-like accents, and print-safe space without requiring a fixed warband.
