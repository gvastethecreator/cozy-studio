visualDna:
  aesthetic: >-
    Travel Poster (Vintage) acts as a transferable illustration router: start from Vintage
    travel-poster style with idealized destination abstraction, optimistic transit-era polish, and
    graphic promotional clarity, Bottom title-lockup zone, destination-led typographic framing,
    simplified landmark anchors, travel-poster layout discipline and editorial graphic system built
    from poster hierarchy, symbolic compression, typography-as-shape, reproduction limits, and
    immediate visual argument, then apply the visual behavior to prompt X instead of recreating a
    fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Simplified geometric landmark silhouettes with clean
    contour economy, broad shape stacking, and poster-friendly horizon banding; preserve the
    requested subject while converting it into emblem, poster form, editorial metaphor, collage
    fragment, fashion gesture, or information hierarchy, keeping the requested identity, silhouette,
    pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Sunlit flat chroma blocks with warm coastal tones, sky-sea separation, and
    restrained retro print contrast; use color as communication pressure: ink plates, propaganda
    contrast, deco metallic restraint, psychedelic vibration, Bauhaus primaries, vector flatness, or
    vintage print fade, with deliberate value grouping, accent control, and process-specific limits
    rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Even poster illumination with soft midday optimism and minimal shadow
    complexity to maximize graphic legibility; make light serve graphic hierarchy through flat
    poster contrast, airbrush gradients, screenprint layers, symbolic rays, collage mismatch, or
    painted cover drama, so value structure supports the illustration process and does not overwrite
    the requested content.
  texture_and_material: >-
    Render Lithographic print grain with subtle ink spread, paper aging cues, and lightly faded
    archival surface designed subjects; surface detail should reveal screenprint ink, risograph
    grain, paper stock, cut-paper edges, vector fields, album-cover wear, or editorial print finish,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Deliberately simplified depth planes with flattened perspective and
    iconized environment hierarchy; compose through graphic hierarchy, diagonal force, asymmetrical
    grid, ornamental framing, cover impact, information grouping, or fashion elongation without
    readable slogan dependency, with scale, spacing, edge rhythm, and visual hierarchy doing the
    style work.
  atmosphere_and_mood: >-
    Keep the mood Bright, inviting, relaxed, optimistic, escapist; derive mood from propaganda
    urgency, luxe modernity, counterculture heat, editorial wit, travel nostalgia, music-poster
    grit, or cover-story seduction, letting the style alter interpretation without demanding a
    specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Clean promotional illustration finish emphasizing readable forms, aspirational mood,
    and destination-forward composition; finish as deliberate graphic communication with crisp shape
    logic, controlled print artifacts, and no random poster text or literal advertisement clutter,
    clean denoised surfaces where appropriate, and enough process evidence to make the style
    recognizable.
  key_features: >-
    Vintage travel-poster style with idealized destination abstraction, optimistic transit-era
    polish, and graphic promotional clarity; Bottom title-lockup zone, destination-led typographic
    framing, simplified landmark anchors, travel-poster layout discipline; Sunlit flat chroma blocks
    with warm coastal tones, sky-sea separation, and restrained retro print contrast; Lithographic
    print grain with subtle ink spread, paper aging cues, and lightly faded archival surface
    designed subjects; Deliberately simplified depth planes with flattened perspective and iconized
    environment hierarchy
  creative_brief: >-
    Apply Travel Poster (Vintage) as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Vintage travel-poster style with idealized destination abstraction, optimistic
    transit-era polish, and graphic promotional clarity, Bottom title-lockup zone, destination-led
    typographic framing, simplified landmark anchors, travel-poster layout discipline, Lithographic
    print grain with subtle ink spread, paper aging cues, and lightly faded archival surface
    designed subjects without requiring the card image's original subject.
