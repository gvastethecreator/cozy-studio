visualDna:
  aesthetic: 'Bleed-and-Margin Counterpoint: full-bleed images set against tightly contained type areas, the contrast building hierarchy.'
  subject_treatment: Set a full-bleed image of the prompt's subject against a contained type area, keeping points of interest off the trim and every title exact.
  color_and_tone: Text on high-contrast areas, images keeping their source palette.
  lighting_and_shadow: 'Original image light and a flat page with no added shadows.'
  texture_and_material: Clean full-bleed edges and a neutral support in reading areas.
  camera_and_composition: Image expansion alternating with contained text through clear anchors.
  atmosphere_and_mood: Visual breadth and a reading pause, cinematic and calm.
  rendering_and_quality: Crisp spread where no focal point falls into the trim or gutter.
  creative_brief: "Bleed-and-Margin Counterpoint: full-bleed images set against tightly contained type areas, the contrast building hierarchy. Carry it through full-bleed image, contained type, anchored caption, clear trim. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: full-bleed image; contained type; anchored caption; clear trim
