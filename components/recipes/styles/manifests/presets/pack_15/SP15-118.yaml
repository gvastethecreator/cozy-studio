visualDna:
  aesthetic:
    'Draw on illustrated pulp space adventure: sharply tapered fins and wedges, ray-beam arcs, bold
    speed contours, and simplified cosmic machinery create directional energy rather than neutral orbital geometry.'
  subject_treatment:
    Preserve the requested subject, pose, and action; angle unspecified forms into streamlined
    silhouettes and add beam-like graphic accents only where they support the focal action.
  color_and_tone:
    Pair midnight blue or charcoal with oxide orange, cream, and a clear plasma accent such as
    red or cobalt; keep color planes bold and distinctly separated.
  lighting_and_shadow:
    Use hard-edged beam light, warm reflected accents, and large graphic shadows; preserve
    dimensional form without a glossy 3D-render look.
  texture_and_material:
    Combine matte painted metal, canvas, and enamel-like plates with sparse scuffs; use
    inked contour and selective crosshatch to carry the pulp illustration identity.
  camera_and_composition:
    Build a clear directional sweep through wedges, arcs, or speed lines; keep the focal
    subject dominant and treat any background as secondary within the requested setting.
  atmosphere_and_mood:
    Feel daring, inventive, and slightly strange, with the requested scene's stakes rather
    than mandatory danger or combat.
  rendering_and_quality:
    Use decisive inked outlines, broad color planes, and restrained hatching; keep silhouette
    and action readable at small scale.
avoidRules:
  - a required rocket, raygun, or battle
  - photorealistic space imagery
  - speed lines crossing over and obscuring the focal subject
