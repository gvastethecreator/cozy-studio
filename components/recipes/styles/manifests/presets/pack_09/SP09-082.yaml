visualDna:
  aesthetic: 'Sun-bleached fade: colors washed out by years of sun, pale on exposed faces and richer in shadowed folds.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: exposed faces fade to pale washed tones while protected folds keep deeper color. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Pastel-faded versions of the original colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Harsh overhead sun, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Chalky faded pigment and dried surfaces, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Nostalgic, dry, quiet and timeworn, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Sun-bleached fade: colors washed out by years of sun, pale on exposed faces and richer in shadowed folds. Carry it through sun-faded exposed faces, deeper colors in folds, chalky pigment, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sun-faded exposed faces; deeper colors in folds; chalky pigment; surface-level damage; structure intact
