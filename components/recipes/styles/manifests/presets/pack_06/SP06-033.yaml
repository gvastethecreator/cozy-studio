visualDna:
  aesthetic: 'Linocut relief print: soft linoleum carved with V and U gouges into smooth flowing cuts, printed as clean flat ink areas with rhythmic white line patterns.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Flat black or one to three flat colors on white paper; each color a solid, evenly inked shape.
  lighting_and_shadow: Light carved out as rhythmic parallel cut lines that follow the form; shadow as solid ink.
  texture_and_material: Smooth curved cuts without wood grain, slight speckled ink texture where pressure was light, crisp edges on soft linoleum.
  camera_and_composition: Keep the requested framing; bold simplified shapes with decorative line rhythms in skies, water and ground.
  atmosphere_and_mood: Bold, crafty and rhythmic, a handmade poster clarity.
  rendering_and_quality: Clean flowing cuts, flat even color, speckled light-pressure ink; no wood grain and no fine hatching.
  key_features: smooth flowing gouge lines; flat solid colors; rhythmic decorative cut patterns; speckled ink texture; no wood grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Linocut as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
