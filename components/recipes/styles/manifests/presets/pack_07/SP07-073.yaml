visualDna:
  aesthetic: 'Sculpted earth cross-section: a handmade cutaway model sliced through soil, showing capillary root branching, layered strata and rounded cavities with amber gel pockets.'
  subject_treatment: Keep the requested subject, its identity and pose; this preset owns the vertical cross-section through the ground that reveals it, and a requested object stays that object instead of becoming a building.
  color_and_tone: Layered umber, ochre, grey clay and black loam bands, pale root lines, warm glowing amber gel pockets.
  lighting_and_shadow: Even front light across the cut face with warm glow from the amber pockets; a thin strip of daylight above ground.
  texture_and_material: Crumbly soil, pebble layers, fibrous roots branching like capillaries, glossy translucent gel.
  camera_and_composition: Straight-on cutaway with a thin band of surface on top and most of the frame given to the section below.
  atmosphere_and_mood: Hidden and busy, the secret underground half of an ordinary place.
  rendering_and_quality: Model-like cross-section with clean cut edges; no insects, larvae or creatures in the cavities.
  key_features: vertical earth cross-section; capillary root branching; layered soil strata; rounded cavities; amber gel pockets
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Subterranean Bio-Cutaway as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
