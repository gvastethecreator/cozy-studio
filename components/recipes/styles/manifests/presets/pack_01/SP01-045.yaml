visualDna:
  aesthetic: 'Light painting: long-exposure photography where moving lights draw glowing trails, arcs and shapes around a still subject in darkness.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only how light falls on them so the named lighting technique is the unmistakable first read.
  color_and_tone: Vivid colored light trails against black; subject lit briefly or by the trails.
  lighting_and_shadow: Moving handheld sources during a long exposure; ambient darkness; trails wrap around or behind the subject.
  texture_and_material: Smooth glowing ribbons, sparks from steel wool, ghosted movement.
  camera_and_composition: Keep requested framing; tripod-steady background with the trails as graphic lines.
  atmosphere_and_mood: Playful and energetic, stillness wrapped in fast, looping ribbons of light.
  rendering_and_quality: Clean black background and continuous, unbroken light trails with smooth glowing edges.
  key_features: long-exposure light trails; steel-wool sparks; glowing ribbons; dark background; still subject
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Light Painting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
