visualDna:
  aesthetic: 'Fragmented Grid Essays: one grid broken in a single controlled place for emphasis, reading alignments kept everywhere else.'
  subject_treatment: Break the prompt's page grid in one deliberate place for emphasis, keeping the reading alignments, body text and every title exact.
  color_and_tone: Sober palette with one accent at the break, the blocks left plain.
  lighting_and_shadow: Flat design where the break is purely a layout decision.
  texture_and_material: Clean edges and steady text with texture subordinate to the rhythm.
  camera_and_composition: One dominant break per opening or section, the grid recognizable around it.
  atmosphere_and_mood: Editorial tension and emphasis, bold in the moment yet controlled.
  rendering_and_quality: Crisp spread where the rule and its one exception both read clearly.
  creative_brief: "Fragmented Grid Essays: one grid broken in a single controlled place for emphasis, reading alignments kept everywhere else. Carry it through one grid break, kept alignments, accent at break, readable rule. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one grid break; kept alignments; accent at break; readable rule
avoidRules:
  - accidental misalignment
  - many breaks
  - fragmented unreadable text
  - invented quotes, authors or data
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
