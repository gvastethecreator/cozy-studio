visualDna:
  aesthetic: 'Modern TV anime cel over pale watercolor background boards: thin warm-grey lineart that fades to nothing at outer edges, two-tone cel shading and wide airy painted skies.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Figures get slender proportions, small calm faces and few internal lines; secondary contours dissolve into the wash while the focal silhouette stays precise.
  color_and_tone: Desaturated sage, pale amber and blue-grey at low contrast; whites never pure, blacks lifted to soft slate, one warm accent at most.
  lighting_and_shadow: High soft daylight from a broad sky, a single cel shadow tier only slightly darker than the base, no rim light and no bloom.
  texture_and_material: Transparent watercolor granulation in skies and ground, tiny speckled light flecks drifting in the air, clean flat cel fills on figures.
  camera_and_composition: Keep the requested view; favor small focal figures against large open space, a low horizon and detail thinning toward the frame edges.
  atmosphere_and_mood: Wistful, unhurried and still, as if time passes slowly around the subject.
  rendering_and_quality: Lines break and fade selectively, gradients stay smooth and forms stay anatomically stable; restraint instead of effects.
  key_features: fading warm-grey lineart; pale watercolor background boards; lifted slate blacks; single soft shadow tier; drifting light flecks
  creative_brief: "Modern TV anime cel over pale watercolor background boards: thin warm-grey lineart that fades to nothing at outer edges, two-tone cel shading and wide airy painted skies. Carry it through fading warm-grey lineart, pale watercolor background boards, lifted slate blacks, single soft shadow tier, drifting light flecks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
