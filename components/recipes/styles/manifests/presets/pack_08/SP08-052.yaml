visualDna:
  aesthetic: 'Denim on denim: head-to-toe denim in mixed washes, with visible selvedge, contrast topstitching and fading.'
  subject_treatment: "Make the prompt's garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: every garment in denim of different washes — raw indigo, stonewashed and bleached — with rivets and contrast stitching."
  color_and_tone: Raw indigo, mid-blue stonewash and bleached pale blue with copper rivets.
  lighting_and_shadow: Natural daylight that shows the weave and fading, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Twill denim with slub texture, whiskering, selvedge edges and copper rivets.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Rugged, casual, confident and Americana, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: mixed denim washes; contrast topstitching; copper rivets; whiskered fading
  creative_brief: "Denim on denim: head-to-toe denim in mixed washes, with visible selvedge, contrast topstitching and fading. Carry it through mixed denim washes, contrast topstitching, copper rivets, whiskered fading. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
