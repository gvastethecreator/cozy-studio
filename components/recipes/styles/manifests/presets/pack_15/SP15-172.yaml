visualDna:
  aesthetic: 'Compostpunk: a culture that worships decay and soil, with compost cathedrals, worm farms, fungal recyclers and gardens grown from waste.'
  subject_treatment: Keep the prompt's subject and setting; turn waste into soil around it with compost heaps, worms, fungi and new growth.
  color_and_tone: Rich soil browns, rot purples and mushroom creams with fresh sprout greens.
  lighting_and_shadow: Warm steam rising from heaps in cool morning light.
  texture_and_material: Dark soil, worms, fungi, rotting leaves, steam and wooden bins.
  camera_and_composition: Close ground-level views of soil life and wide views of compost structures.
  atmosphere_and_mood: Earthy and hopeful, decay treated as the beginning of everything.
  rendering_and_quality: Richly textured illustration with organic detail and warm steam.
  creative_brief: "Compostpunk: a culture that worships decay and soil, with compost cathedrals, worm farms, fungal recyclers and gardens grown from waste. Carry it through compost heaps, worms and fungi, steaming soil, new growth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: compost heaps; worms and fungi; steaming soil; new growth
