  color_and_tone: Warm gilded copper, silver and rich cabochon reds and blues.
  lighting_and_shadow: Bright metallic highlights on raised forms, dark recesses.
  texture_and_material: Hammer marks, punched grounds, gilding wear and polished stones.
  camera_and_composition: Frontal relief panel filling the card, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with heavy precious splendor.
  rendering_and_quality: Convincing hammered relief with jeweled accents, kept consistent across the whole image.
  creative_brief: "Repoussé gilt metal: thin sheets of copper or silver hammered from behind into relief, then gilded and set with cabochon stones, as on reliquaries and book covers. Carry it through hammered relief, gilded metal, cabochon stones, punched ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
