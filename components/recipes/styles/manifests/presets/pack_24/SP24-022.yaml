visualDna:
  aesthetic: 'Static-glow television room: a dark room lit only by an old television showing static, the grey light flickering over furniture and faces.'
  subject_treatment: Light the prompt's subject only by television static in a dark room, keeping it readable in the cold flickering glow.
  color_and_tone: Cold blue-grey static light against deep black, with faint warm tones in the far background.
  lighting_and_shadow: Flickering screen light from one direction, sharp dark shadows cast behind every object.
  texture_and_material: Screen snow, curved glass, dusty cabinets, patterned upholstery and grainy darkness.
  camera_and_composition: Television in frame or just off it, with the room disappearing into darkness.
  atmosphere_and_mood: Lonely, hypnotic and uneasy, something wants to come through.
  rendering_and_quality: Grainy painterly rendering with flickering light falloff and deep black corners.
  creative_brief: "Static-glow television room: a dark room lit only by an old television showing static, the grey light flickering over furniture and faces. Carry it through television static glow, flickering shadows, dark room, curved screen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: television static glow; flickering shadows; dark room; curved screen
