visualDna:
  aesthetic: 'Flooded memory rooms: familiar interiors half filled with still dark water, furniture drowning quietly while mirrors of the room float on the surface.'
  subject_treatment: Put the prompt's subject inside a half-flooded room, keeping it clear above or just beneath the still water line.
  color_and_tone: Murky teal water, warm drowned lamplight and pale floating objects against dark depths.
  lighting_and_shadow: Dim light reflected and doubled by the water surface, with dark shadow below the waterline.
  texture_and_material: Still glossy water, floating paper and petals, soaked wallpaper and sunken furniture.
  camera_and_composition: Eye level near the waterline, room and reflection mirrored in the frame.
  atmosphere_and_mood: Silent, mournful and suffocating, a memory drowning slowly.
  rendering_and_quality: Painterly realism with precise reflections and soft underwater blur.
  creative_brief: "Flooded memory rooms: familiar interiors half filled with still dark water, furniture drowning quietly while mirrors of the room float on the surface. Carry it through half-flooded interiors, mirrored waterline, floating objects, drowned lamplight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: half-flooded interiors; mirrored waterline; floating objects; drowned lamplight
