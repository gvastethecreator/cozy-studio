visualDna:
  aesthetic: >-
    Retro pulp-fantasy illustration combining smooth airbrushed value transitions with selected
    sharply painted contours and bright edge accents. Airbrush is the tonal method, not a prompt for
    a fixed cover scene.
  subject_treatment: >-
    Preserve the requested identity, anatomy, action, count, and silhouette. Use blended volumes to
    clarify existing forms, then place crisp accents only where the source shape supports them.
  color_and_tone: >-
    Keep explicit palette instructions. If unspecified, use a compact, saturated range with a clear
    warm-cool split and deliberate dark anchors; do not impose a particular metal or gem color.
  lighting_and_shadow: >-
    Follow the requested light source and direction. Use smooth tonal rolls and a few controlled
    highlights to model existing forms without adding a sunset, magical beam, or backlight.
  texture_and_material: >-
    Keep the airbrush transitions clean and let hard-edged brush accents distinguish selected
    surfaces. Preserve material identity; do not turn everything into chrome or polished armor.
  camera_and_composition: >-
    Honor the requested camera, crop, and placement. Use broad value separation to read within the
    given arrangement, without forcing a hero pose, diagonal, or paperback cover layout.
  atmosphere_and_mood: >-
    Carry the requested mood through contrast and color temperature. The retro painting language
    adds no warrior, monster, spell, or adventure episode on its own.
  rendering_and_quality: >-
    Keep transitions deliberate, contours selective, and details crisp where they define identity.
    Avoid plastic shine, poster lettering, and soft gradients that erase form separation.
avoidRules:
  - unrequested fantasy props or action
  - fixed paperback-cover composition or title lettering
  - invented light sources or magical glow
  - chrome-like highlights on every material
  - plastic gradients or blurred contours
