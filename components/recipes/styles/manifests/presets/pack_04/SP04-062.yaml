visualDna:
  aesthetic: 'Hard-ground line etching: lines needled through wax on a copper plate and bitten in acid, printed in black intaglio ink with fine crosshatching.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Warm black or sepia ink on off-white rag paper, with a faint plate tone wiped across the sheet.
  lighting_and_shadow: 'Value built by line density and repeated bites: single fine lines in the light, deep-bitten crosshatch in the shadows.'
  texture_and_material: Slightly wavering, round-ended needle lines, layered crosshatch and an embossed plate mark around the image.
  camera_and_composition: Keep the requested view inside a platemark rectangle with an open paper margin.
  atmosphere_and_mood: Scholarly, precise and old, like a plate from a forgotten book.
  rendering_and_quality: Fine intaglio line detail with plate tone, never smooth tonal shading or carved relief shapes.
  key_features: needled and acid-bitten lines; layered crosshatch; embossed platemark; plate tone; sepia or warm black ink
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Etching (Engraving) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
