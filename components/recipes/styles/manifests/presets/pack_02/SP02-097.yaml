visualDna:
  aesthetic: 'Committee-mangled corporate mascot that was clearly rejected: glossy vector finish on an off-model design whose parts contradict each other, with too many features, dead eyes, a forced grin and stiff presentation pose.'
  subject_treatment: 'Keep the requested subject, identity and action, but draw it as a mascot redesigned by too many stakeholders: mismatched eye sizes and pupils looking different ways, a human-teeth grin, limbs bolted on at wrong angles, an extra accessory nobody asked for, and proportions that fight each other.'
  color_and_tone: Loud clashing brand primaries, sterile white and one sickly off-brand accent color that does not belong.
  lighting_and_shadow: Flat product-shot fill with a glossy highlight stamped on every surface, even where it makes no sense.
  texture_and_material: 'Over-smooth vector gradients, plastic sheen and visible leftover construction: a stray anchor point, a misaligned outline or a half-deleted earlier version.'
  camera_and_composition: Stiff centered presentation pose on a blank studio background, like a slide in a failed pitch deck, with no lettering.
  atmosphere_and_mood: Keep the requested mood with forced cheer that is visibly wrong and faintly unsettling.
  rendering_and_quality: 'Clean vector render of a bad design decision: finished and glossy, but awkward, uncanny and plainly unapproved.'
  key_features: committee-mangled mascot; mismatched eyes; human-teeth grin; bolted-on limbs; forced cheer
  creative_brief: "Committee-mangled corporate mascot that was clearly rejected: glossy vector finish on an off-model design whose parts contradict each other, with too many features, dead eyes, a forced grin and stiff presentation pose. Carry it through committee-mangled mascot, mismatched eyes, human-teeth grin, bolted-on limbs, forced cheer. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
