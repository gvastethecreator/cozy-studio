visualDna:
  aesthetic: >-
    Windpunk expresses motion as tensioned arcs, swept planes and tapered contours whose spacing suggests
    force moving through a form.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and connections. Apply directional curves or
    tension lines to existing contours where they fit; do not convert the subject into a turbine or kite.
  color_and_tone: >-
    Preserve requested colors and organize them into airy light fields with a few grounded mineral or
    signal accents. Keep enough contrast to read the swept silhouette.
  lighting_and_shadow: >-
    Follow the requested light. Use elongated shadow planes to support direction and tension without
    adding wind streaks, a new light source or weather.
  texture_and_material: >-
    Respect actual materials. Use flexible, matte surface variation only where fabric, rope or another
    pliant material is present; do not turn unrelated surfaces into cloth.
  camera_and_composition: >-
    Preserve viewpoint and crop. Let a few sweeping forms lead through the existing composition without
    imposing a rooftop, sky horizon or wind-capture device.
  atmosphere_and_mood: >-
    Suggest momentum and adaptation through curve, spacing and tension while keeping the requested mood
    and setting.
  rendering_and_quality: >-
    Use clean tapered contours, broad flowing color planes and restrained line accents. Preserve part
    connections and avoid cluttered motion trails.
avoidRules:
  - Do not add a windcatcher tower, kite turbine, rooftop or windmill unless requested.
  - Avoid decorative wind streaks that obscure the subject.
  - Do not force a cloth or rope material onto existing forms.
