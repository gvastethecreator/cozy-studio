visualDna:
  aesthetic: 'Heraldry design sheet: one coat of arms repeated in a grid of tincture and division variants, painted in gouache and shell gold on vellum.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a grid of one shield design repeated in different tinctures and divisions, with charge studies, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: 'Heraldic tinctures only: gules, azure, vert, sable, purpure, with gold and silver metals.'
  lighting_and_shadow: Flat heraldic color with a thin black outline and a little burnished gold shine.
  texture_and_material: Opaque gouache fills, crisp black outlines, raised shell gold and vellum grain.
  camera_and_composition: Nine to twelve identical shield shapes in an even grid, a larger study of the main charge beside them.
  atmosphere_and_mood: Proud and ceremonial, a lineage chosen color by color.
  rendering_and_quality: Clean heraldic drawing with consistent charge and no mottos or names.
  creative_brief: "Heraldry design sheet: one coat of arms repeated in a grid of tincture and division variants, painted in gouache and shell gold on vellum. Carry it through one shield in many tinctures, division variants, gouache and shell gold, charge study, even grid. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one shield in many tinctures; division variants; gouache and shell gold; charge study; even grid
