  color_and_tone: Aerospace white, grey and bold stripe colors, true to the Shoji Kawamori palette.
  lighting_and_shadow: Clean hangar light, lit the way Shoji Kawamori lights its scenes.
  texture_and_material: Aerospace panels, joints and intakes, with the surface finish of Shoji Kawamori.
  camera_and_composition: Three-mode design sheet or mid-transformation view, framed the way Shoji Kawamori composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with clever engineering delight.
  rendering_and_quality: Clean design-presentation render with readable panel lines and material separation.
