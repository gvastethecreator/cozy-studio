visualDna:
  aesthetic: >-
    On an explicitly requested ceramic target, fluid ink lines and soft wash marks sit against a clean,
    polished illustrated surface with visible variation in ink load.
  subject_treatment: >-
    Preserve the requested identity, shape, pose, action and function. Apply the treatment only to the
    named ceramic area; never transform another subject into a vessel.
  color_and_tone: >-
    Preserve the specified palette and use open reserves with restrained wash color; do not force blue and
    white or replace colors already requested for the ceramic target.
  lighting_and_shadow: >-
    Follow the requested light direction and keep the polished surface response subtle; do not add a glow,
    halo or extra highlight source.
  texture_and_material: >-
    Use fine brush edges, small ink accumulations and a smooth ceramic response only on the requested
    material target; do not add cracks or wear by default.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. The surface treatment changes
    rendering only, not subject shape or composition.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. The ceramic association does not impose a vase, vessel, cultural
    motif or ceremonial use.
  rendering_and_quality: >-
    Balance liquid line weight with controlled wash and clean reserves; keep the target material readable
    without changing the object's function.
avoidRules:
  - unrequested transformation of the subject into a vessel
  - forced blue-and-white palette or surface cracking
  - unrequested symbols or text
