visualDna:
  aesthetic: >-
    Use coarse scraped marks, blocky angled lines and imperfect contour to create tactile graphic
    friction; let any tilt come from existing form rather than changing the composition.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: favor ash, charcoal and small
    rust accents while respecting prompt-specified colors.
  lighting_and_shadow: >-
    Use hard-edged value blocks and dusty reflected light; do not impose a city or night scene.
  texture_and_material: >-
    Layer rough dry marks and concrete-like grain as a surface treatment without replacing the
    depicted material.
  camera_and_composition: >-
    Let line angles create drift inside the existing layout; maintain camera, silhouette and
    perspective.
  atmosphere_and_mood: >-
    Poetic unease comes from roughness and imbalance; preserve the requested emotional meaning.
  rendering_and_quality: >-
    Use the material marks on any subject; do not add civic icons, buildings, sacred imagery or
    urban props. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Scraped strokes; coarse grain; angled/blocky contour; ash and rust accents; tactile graphic
    friction.
  creative_brief: >-
    Apply this visual treatment to the requested content: Scraped strokes; coarse grain;
    angled/blocky contour; ash and rust accents; tactile graphic friction. Preserve its identity,
    action, materials, composition and requested tone; introduce no persona, scene, franchise cue or
    extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uniform smoothing erasing scraped-stroke texture
  - grain obscuring angled form direction
  - ornament covering the rough silhouette
