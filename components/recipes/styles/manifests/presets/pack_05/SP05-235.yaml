  color_and_tone: Neon pink, electric blue, chrome and night purple.
  lighting_and_shadow: Neon night city light with glossy eighties highlights on eyes and bikes.
  texture_and_material: Glossy hand-painted eighties cel with neon glows and soft grain.
  camera_and_composition: Night highway motorcycle rides and glittering idol stage shots.
  atmosphere_and_mood: Keep the requested mood with glossy simulated romance.
  rendering_and_quality: Glossy 1985 AIC OVA frame with pop cyberpunk and simulated city.
  key_features: Megazone 23 pop; Mikimoto eyes; simulated Tokyo; neon highways
  creative_brief: "AIC Megazone 23 OVA look (1985) with Haruhiko Mikimoto and Toshihiro Hirano: eighties Tokyo as a simulation, idol singers, motorcycles and glossy pop cyberpunk. Carry it through Megazone 23 pop, Mikimoto eyes, simulated Tokyo, neon highways. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
