visualDna:
  aesthetic: >-
    Cottagecore operates as a portable source-router layer: combine Soft handcrafted
    pastoral-romantic style balanced on slow-living warmth, botanical gentleness, and domestic
    natural charm with cultural style-system logic with recognizable design codes, mood grammar, and
    transferable taste rules, so the preset supplies visual behavior rather than a fixed card scene
    or literal sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms re-code,
    stylize, ritualize, polish, decay, brighten, mechanize, soften, or mythologize through Delicate
    organic contouring, airy floral tendrils, soft textile drape lines, and graceful hand-drawn edge
    behavior; identity stays readable through construction grammar, proportion, edge logic, and
    detail scale as this preset is applied.
  color_and_tone: >-
    Map color through identity-bearing color families, accent rules, tonal pressure, era-specific
    contrast, and material color behavior; keep hue roles intentional, value separation clear, and
    palette behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Diffused golden warmth with curtain-soft scatter, candlelike ambient glows, and misty
    morning low-contrast serenity plus mood-led lighting that reinforces the aesthetic code without
    replacing the requested subject as the light-response contract, with readable hierarchy,
    controlled contact detail, and no lighting choice that erases the user's requested content.
  texture_and_material: >-
    Render Natural-fiber linens, hand-thrown ceramic matte grain, wicker weave detail, embroidered
    thread cues, and dried-botanical tactility plus signature finishes, symbolic surfaces, pattern
    systems, ornamental density, polish, grime, gloss, or softness; surface scale, residue, gloss,
    grain, fiber, pores, edges, or signal artifacts must remain coherent across figures, objects,
    and environments.
  camera_and_composition: >-
    Compose with Natural human-scale proportions with close-range framing and gently compressed
    depth for intimate mood plus taste-coded spacing, silhouette discipline, motif placement,
    designed clutter, and reusable visual hierarchy as reusable framing grammar, allowing cards,
    portraits, objects, scenes, and abstract prompts to inherit the style without one required
    layout.
  atmosphere_and_mood: >-
    Carry mood through subculture memory, internet-era design codes, nostalgia, optimism, dread,
    cuteness, or spectacle; the emotional tone should feel specific to Cottagecore while still
    obeying the prompt's subject and context.
  rendering_and_quality: >-
    Finish with coherent art direction, strong subject preservation, clean code recognition, and no
    mood-board vagueness; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Soft handcrafted pastoral-romantic style balanced on slow-living warmth, botanical gentleness,
    and domestic natural charm; Delicate organic contouring, airy floral tendrils, soft textile
    drape lines, and graceful hand-drawn edge behavior; Natural-fiber linens, hand-thrown ceramic
    matte grain, wicker weave detail, embroidered thread cues, and dried-botanical tactility;
    Diffused golden warmth with curtain-soft scatter, candlelike ambient glows, and misty morning
    low-contrast serenity; Natural human-scale proportions with close-range framing and gently
    compressed depth for intimate mood
  creative_brief: >-
    Use Cottagecore after prompt X as a transferable style layer: prompt X supplies subject, action,
    and setting, while the preset supplies Soft handcrafted pastoral-romantic style balanced on
    slow-living warmth, botanical gentleness, and domestic natural charm, Delicate organic
    contouring, airy floral tendrils, soft textile drape lines, and graceful hand-drawn edge
    behavior, Natural-fiber linens, hand-thrown ceramic matte grain, wicker weave detail,
    embroidered thread cues, and dried-botanical tactility, Diffused golden warmth with curtain-soft
    scatter, candlelike ambient glows, and misty morning low-contrast serenity, Natural human-scale
    proportions with close-range framing and gently compressed depth for intimate mood plus
    proportion codes, recurring surface motifs, era cues, pattern pressure, cultural references, and
    designed contrast, palette behavior, light response, material treatment, and finish discipline
    without requiring one specimen, prop bundle, product still, or card composition.
