visualDna:
  aesthetic: 'Pop-performance tailoring: stage-ready suits and coordinated outfits cut for choreography, with sharp shoulders, cropped jackets and matching sets.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: coordinated sharp tailoring — cropped jacket, harness or sash detail, flared or tapered trousers — in matching group colorways, built to move."
  color_and_tone: 'Saturated stage colors: electric blue, white and silver, or crimson and black, per group.'
  lighting_and_shadow: Colored stage washes, backlight and haze, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Satin lapels, metallic trims, patent leather and stretch suiting.
  camera_and_composition: Group formation or dynamic single figure mid-move, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Bold, synchronized, glamorous and energetic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: High-gloss performance finish, with believable fabric weight, seams and fit detail.
  key_features: coordinated stage tailoring; cropped jackets; matching colorways; stage haze; choreographed pose
  creative_brief: "Pop-performance tailoring: stage-ready suits and coordinated outfits cut for choreography, with sharp shoulders, cropped jackets and matching sets. Carry it through coordinated stage tailoring, cropped jackets, matching colorways, stage haze, choreographed pose. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
