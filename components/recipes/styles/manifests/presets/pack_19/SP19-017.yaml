visualDna:
  aesthetic: 'Single-stroke figures: each form painted in one uninterrupted brush stroke whose loading, twist and lift create body, limbs and shading at once.'
  subject_treatment: Paint the prompt's subject with the fewest possible single brush strokes, each stroke forming a whole part of it while keeping pose and identity readable.
  color_and_tone: Black ink or one earthy color, the brush loaded dark at the tip and pale at the heel for built-in gradation.
  lighting_and_shadow: Each stroke carries its own light-to-dark shift from how the brush was loaded, with no added shading.
  texture_and_material: Wet stroke bodies, dry-brush tails where the ink runs out and soft paper absorption.
  camera_and_composition: Sparse composition with lots of empty paper, strokes arranged like a quick confident gesture.
  atmosphere_and_mood: Fast, playful and masterful, the joy of getting it right in one go.
  rendering_and_quality: Few decisive strokes, no corrections, no outlines and no filled areas beyond the strokes.
  creative_brief: "Single-stroke figures: each form painted in one uninterrupted brush stroke whose loading, twist and lift create body, limbs and shading at once. Carry it through one stroke per form, loaded gradation, dry tails, empty paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one stroke per form; loaded gradation; dry tails; empty paper
