visualDna:
  aesthetic:
    A folio-drawn precision-clockwork illustration with fine ink construction lines, visible escapements,
    spring tension, repeated tooth intervals and measured joints, distinct from Steampunk pressure machinery.
  subject_treatment: >-
    Preserve the requested subject and function. Redesign open forms around one focal clock-regulated mechanism:
    a readable escapement or balance wheel, wound spring and regular tooth intervals linked to the subject's
    motion. Where no moving mechanism fits, use measured linkages on an existing form. Avoid broad pressure
    fittings or decorative gearwork.
  color_and_tone:
    Lead with blued steel, graphite ink and aged ivory; use brass only at small pivots and add one restrained
    vermilion or enamel accent. Keep explicit colors and separate repeated parts by value.
  lighting_and_shadow:
    Honor specified lighting. Use narrow accents to reveal moving parts and crisp overlap
    shadows; add no clock-like glow or new source.
  texture_and_material:
    Separate machined teeth, wound springs, enamel, porcelain and steel through fine engraving
    and clean wear. Translate open materials into precision craft.
  camera_and_composition:
    Preserve view and placement. Let measured intervals and interlocking arcs organize
    the form without imposing a dial, tower or radial layout.
  atmosphere_and_mood:
    Create measured tension, ingenuity or precision through controlled repetition. Keep
    the requested mood; public strikes, guilds and clockmakers are optional.
  rendering_and_quality:
    Render as a technical folio illustration with precise black engraving and translucent watercolor planes,
    not a photoreal product shot. Keep one legible escapement and a few clear fine teeth; avoid unreadable
    micro-gears, random dials and mechanical noise.
avoidRules:
  - Do not turn the subject into a clock face or impose a clocktower, guild or public assembly.
  - Do not add dial numerals or a radial layout unless requested.
  - Keep escapement and spring details large enough to read.
