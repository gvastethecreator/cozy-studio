visualDna:
  aesthetic: 'Vertical-scroll webcomic art: clean digital line with soft cel shading over glowing full-color gradient backgrounds, drawn for a phone screen.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Saturated full color, pastel-to-neon gradient backdrops, two-tone cel shadows tinted violet or blue.
  lighting_and_shadow: One soft cel shadow step plus a colored rim light; glow layers set to add light around magic or screens.
  texture_and_material: Screen-native smooth fills, faint airbrush glows, no paper grain and no print dots.
  camera_and_composition: Tall vertical framing with generous empty gradient space above or below the subject, expressive faces read at small size.
  atmosphere_and_mood: Emotional and contemporary, a cliffhanger beat in a serial story.
  rendering_and_quality: Clean anti-aliased line, simple two-step shading and soft glow; polished but not painterly.
  key_features: clean digital line; two-step cel shade; gradient backdrop; colored rim light; tall vertical framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Webtoon Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - print halftone
  - paper grain
  - black and white
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic superhero costume
  - random speech text
  - fake lettering
  - photo-real costume render
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
