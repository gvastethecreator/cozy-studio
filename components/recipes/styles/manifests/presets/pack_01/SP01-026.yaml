visualDna:
  aesthetic: 'Pinhole camera long exposure: a lensless box with a tiny aperture, so everything is equally soft and exposures run from seconds to minutes.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Muted, slightly warm color or soft monochrome; heavy natural darkening toward the corners.
  lighting_and_shadow: 'Long daylight exposure: static light evenly built up, moving light sources smeared into trails.'
  texture_and_material: Soft focus everywhere with no sharp plane, gentle diffraction glow; moving people, animals and water ghosted or erased.
  camera_and_composition: Keep the requested subject and setting; infinite soft depth, wide stretched perspective at the edges, strong vignette.
  atmosphere_and_mood: Dreamy and haunted, time made visible as soft ghosts and smears.
  rendering_and_quality: Uniform lensless softness and time blur, not a tilt-shift or a blurred digital background.
  key_features: lensless uniform softness; ghosted motion; heavy corner vignette; infinite soft depth; minutes-long exposure
  creative_brief: "Pinhole camera long exposure: a lensless box with a tiny aperture, so everything is equally soft and exposures run from seconds to minutes. Carry it through lensless uniform softness, ghosted motion, heavy corner vignette, infinite soft depth, minutes-long exposure. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
