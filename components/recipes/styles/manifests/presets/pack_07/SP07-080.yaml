visualDna:
  aesthetic: 'Analog space-age retrotech: interiors clad in copper and brass hexagonal nodes, organic coral-like ribs, glowing glass tubes and braided cable runs.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the retrotech wall, ceiling and fixture surfaces, and it never bends, loops or breaks the requested structure.
  color_and_tone: Warm copper and brass, amber and teal glass glow, cream enamel; saturated warm with cool accents.
  lighting_and_shadow: Glow from glass tubes and backlit hex nodes, warm pools, soft shadows between the ribs.
  texture_and_material: Brushed copper, patinated brass, frosted glass tubes, braided fabric cable, cream enamel panels.
  camera_and_composition: Keep the requested layout; ribs rise along the walls and hex-node clusters replace flat surfaces.
  atmosphere_and_mood: Warm, humming and exploratory, the future as a 1970s engineer imagined it.
  rendering_and_quality: Rich tactile interior rendering; no circular wall roundels, no central console, no steam.
  key_features: copper-brass hexagonal nodes; organic coral-like ribs; glowing glass tubes; braided cable runs; amber and teal glow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dimensional Retrotech Surfaces as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
