visualDna:
  aesthetic: 'Night-bus sodium limbo: empty late-night buses and stations under orange sodium light, passengers too still and routes that never seem to reach their stop.'
  subject_treatment: Put the prompt's subject on or near a late-night bus or station, keeping it clear under orange sodium light.
  color_and_tone: Monochrome sodium orange and deep brown-black with sickly green interior bus light.
  lighting_and_shadow: Harsh sodium streetlights, window reflections and long shadows cutting across seats.
  texture_and_material: Worn plastic seats, scratched windows, wet asphalt and flickering ceiling panels.
  camera_and_composition: Long bus interiors with repeating seats, or wide empty stops seen through glass.
  atmosphere_and_mood: Lonely, hypnotic and slightly wrong, a ride with no destination.
  rendering_and_quality: Moody painterly realism with strong reflections and grain.
  creative_brief: "Night-bus sodium limbo: empty late-night buses and stations under orange sodium light, passengers too still and routes that never seem to reach their stop. Carry it through sodium orange light, empty late buses, window reflections, endless routes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sodium orange light; empty late buses; window reflections; endless routes
