visualDna:
  aesthetic: >-
    Polished anime painting organizes existing detail into clear layers, with a strong identity contour,
    fine local ornament and broad areas of visual rest.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Refine only details already present;
    do not invent accessories or surface patterns.
  color_and_tone: >-
    Retain the requested palette and its color relationships. Balance richer local detail with broad
    resting areas; do not add colors to imply ornament.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Let existing light clarify the main form and
    preserve its shadow structure beneath fine surface detail.
  texture_and_material: >-
    Use a polished painted finish while keeping distinct materials recognizable. Confine patterns
    to areas and objects already specified by the request.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Keep detail inside the existing forms;
    add no card frame, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Ornate rendering does not add lore or change the depicted
    world.
  rendering_and_quality: >-
    Give the outer contour enough weight to preserve identity, then use finer marks for existing detail.
    Keep the hierarchy legible at reduced size and leave broad quiet regions.
avoidRules:
  - unrequested accessories or surface patterns
  - uniform detail density that competes with the silhouette
  - unrequested card frame or lettering
