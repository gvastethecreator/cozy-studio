visualDna:
  aesthetic: 'Infomercial before-and-after: a split screen contrasting a gray, clumsy "before" struggle with a bright, triumphant "after".'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Left half desaturated or black and white; right half saturated primaries and bright whites.
  lighting_and_shadow: Flat, gloomy light on the before side; overlit high-key light on the after side.
  texture_and_material: Exaggerated mess and frustration versus spotless gleaming results.
  camera_and_composition: Vertical split with a hard dividing line, the same subject in both halves, exaggerated expressions.
  atmosphere_and_mood: Absurd and persuasive, frustration flipped into miracle.
  rendering_and_quality: Late-night video comparison look; no readable price or phone number.
  key_features: hard vertical split; gray before versus bright after; same subject twice; exaggerated struggle; overlit result
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Infomercial as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
