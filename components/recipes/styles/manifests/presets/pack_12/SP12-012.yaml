visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Stardew Valley gameplay screenshots: top-down
    pixel-life-sim capture with cozy interiors, tile-based props, NPC clusters, inventory bar, and
    readable village hub layout. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Stardew Valley-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Stardew Valley-informed palette: warm wood brown, soft lamp yellow, berry red, denim blue,
    plant green, and muted pixel shadows. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through simple warm room pools, fireplace glow, window daylight blocks, and tiny
    highlight pixels. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from 16-bit inspired tiles, simple furniture sprites, food icons, patterned rugs,
    pixel portraits, and hand-placed clutter. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with top-down room or town hub with grid clarity, interactable counters, social spacing,
    and inventory-bar ergonomics. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Stardew Valley-derived mood: cozy, handmade, social, low-stakes, and quietly productive.
    The preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: inventory hotbar, clock,
    money, stamina, and small interaction prompts are part of the style when kept pixel-clean.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Stardew Valley gameplay screenshots; top-down pixel-life-sim capture with cozy interiors,
    tile-based props, NPC clusters, inventory bar, and readable village hub layout; warm wood brown,
    soft lamp yellow, berry red, denim blue, plant green, and muted pixel shadows; simple warm room
    pools, fireplace glow, window daylight blocks, and tiny highlight pixels; 16-bit inspired tiles,
    simple furniture sprites, food icons, patterned rugs, pixel portraits, and hand-placed clutter;
    top-down room or town hub with grid clarity, interactable counters, social spacing, and
    inventory-bar ergonomics; cozy, handmade, social, low-stakes, and quietly productive; HUD
    guidance: inventory hotbar, clock, money, stamina, and small interaction prompts are part of the
    style when kept pixel-clean
  creative_brief: >-
    Use Stardew Tavern Pixel Hub as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Stardew Valley: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
