visualDna:
  aesthetic: 'Perspective construction drawing: the subject built over a two- or three-point perspective grid, with boxes, ellipses and cross-contours left visible under the final line.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a perspective construction drawing with vanishing lines, boxes and ellipses left visible under the final line, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Blue col-erase construction lines under confident black final line on white, light grey marker shadow.
  lighting_and_shadow: One grey marker shadow plane on the underside and a cast shadow projected with visible construction.
  texture_and_material: Ruled vanishing lines, sketched ellipses with minor axes marked, cross-contour lines wrapping curved forms.
  camera_and_composition: Subject large on the sheet, vanishing points marked on or near the edges, horizon line drawn across.
  atmosphere_and_mood: Analytical and confident, form understood from the inside out.
  rendering_and_quality: Construction left visible as the point of the image, no painted finish and no labels.
  creative_brief: "Perspective construction drawing: the subject built over a two- or three-point perspective grid, with boxes, ellipses and cross-contours left visible under the final line. Carry it through visible vanishing lines, construction boxes and ellipses, cross-contours, blue under black line, projected cast shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: visible vanishing lines; construction boxes and ellipses; cross-contours; blue under black line; projected cast shadow
