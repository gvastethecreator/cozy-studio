visualDna:
  aesthetic: >-
    Carbon Fiber (Forged) treats fabrication as visible style language: start from Chopped fiber
    composite, Smooth but visual depth, and Random flakes, then turn manufacturing process, tooling
    marks, seams, tolerances, and industrial material behavior into portable surface behavior rather
    than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Random flakes: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Black/Grey marble look as the material palette, with controlled value separation, local
    color variation, and hue shifts that follow the subject's form rather than flattening it into a
    pasted texture.
  lighting_and_shadow: >-
    Let Glossy clear coat define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Carbon Fiber (Forged) without hiding the
    prompt subject.
  texture_and_material: >-
    Render Smooth but visual depth through constructed regularity, stress points, joins, molded
    edges, and process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores,
    or surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Random flakes as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Fast, expensive by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with High tech, performance material clarity: physically coherent reflectance, clean
    contact detail, controlled micro-texture, readable silhouette behavior, and no noisy
    stock-texture overlay.
  key_features: >-
    Chopped fiber composite; Random flakes; Smooth but visual depth; Glossy clear coat; Random
    flakes
  creative_brief: >-
    Route any subject through Carbon Fiber (Forged) as a transferable man-made material visual
    system while preserving the prompt's subject, action, and setting. Render forged carbon fiber as
    performance material over the input: random black and grey flakes suspended in glossy resin,
    marble-like chaos, visual depth under clear coat, and engineered speed made solid. If vehicles,
    armor, tools, or tech exist, make them feel high-performance; otherwise apply chopped composite
    depth without requiring a supercar.
avoidRules:
