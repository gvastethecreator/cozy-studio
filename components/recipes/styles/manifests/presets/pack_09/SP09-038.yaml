visualDna:
  aesthetic: >-
    Dusty Surface turns material failure into the main visual language: start from Attic find,
    Particulate, and Top surface only, then turn damage history, contamination, corrosion, staining,
    abrasion, and material breakdown into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Finger swipes: preserve identity and pose while letting
    forms age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Grey layer as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Soft define the light response: highlights, occlusion, translucency, specular scatter, matte
    falloff, or rim behavior should reveal Dusty Surface without hiding the prompt subject.
  texture_and_material: >-
    Render Particulate through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Top surface only as reusable material rhythm: macro-friendly for texture tasks,
    but able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Quiet, time by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Old, forgotten material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Attic find; Finger swipes; Particulate; Soft; Top surface only
  creative_brief: >-
    Route any subject through Dusty Surface as a transferable weathering-and-decay visual system
    while preserving the prompt's subject, action, and setting. Summon the quiet blanket of time
    where a fine grey particulate settles on forgotten surfaces like a slow snowfall of decay,
    disturbed only by the calligraphy of a passing finger that reveals the original surface beneath.
    The layer should feel soft and weightless, the visual equivalent of silence accumulating grain
    by grain. Capture the poetry of the undisturbed, time's slowest signature rendered in dust. Use
    Dusty Surface as portable surface/render behavior over any input: map its texture, light
    response, edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a
    literal material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
