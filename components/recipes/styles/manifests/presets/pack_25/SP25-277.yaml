visualDna:
  aesthetic: 'Embroidery Relief Finish: a modifier that turns existing flat artwork into raised apparent embroidery, geometry and letters unchanged.'
  subject_treatment: Give the prompt's existing artwork a raised embroidery look with thread following its masses and stems, keeping its outline and exact letters.
  color_and_tone: Artwork colors kept as thread colors, shading only changing local value.
  lighting_and_shadow: Soft consistent side light with moderate sheen on the thread.
  texture_and_material: Contained relief, coherent stitch direction and clean edges.
  camera_and_composition: Position, scale and crop locked, thread kept out of reserves.
  atmosphere_and_mood: Clear, contained tactility that never competes with the meaning.
  rendering_and_quality: Clean finish with the silhouette preserved and letters exact.
  creative_brief: "Embroidery Relief Finish: a modifier that turns existing flat artwork into raised apparent embroidery, geometry and letters unchanged. Carry it through raised thread, stitch direction, locked outline, exact letters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: raised thread; stitch direction; locked outline; exact letters
