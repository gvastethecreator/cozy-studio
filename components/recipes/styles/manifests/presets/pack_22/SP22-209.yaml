visualDna:
  aesthetic: >-
    Clean modular geometry and controlled curves simplify existing forms into flat shapes while keeping
    their distinguishing silhouette and visual relationships recognizable.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Abstract only secondary
    structure; do not replace the subject with a logo, badge or unrelated geometric sign.
  color_and_tone: >-
    Preserve the requested palette and use flat color areas with clear size hierarchy; do not impose a
    fixed emblem palette.
  lighting_and_shadow: >-
    Follow the requested light and keep value organization simple and consistent; avoid adding realistic
    shading, glow or a new source.
  texture_and_material: >-
    Use a clean vector-like surface without added texture. Keep the actual material identity clear through
    the requested color and form.
  camera_and_composition: >-
    Retain the requested viewpoint, framing, crop and element placement. Geometric reduction does not
    authorize a different arrangement or crop.
  atmosphere_and_mood: >-
    Preserve the requested setting and tone. Modular form is a rendering method, not a new theme or
    symbolic message.
  rendering_and_quality: >-
    Use crisp edges, controlled-radius curves and a readable hierarchy of shape sizes; retain enough
    distinctive detail to identify the subject at reduced size.
avoidRules:
  - unrequested logos, badges or symbolic marks
  - abstraction that removes required identity or function
