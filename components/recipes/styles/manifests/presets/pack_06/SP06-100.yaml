visualDna:
  aesthetic: Toy pocket-camera photo at 128 by 112 pixels in four greys, edge-enhanced and printed on a narrow strip of thermal paper.
  subject_treatment: Keep the prompt subject, action and camera view; capture it as a tiny four-grey dithered photograph printed on thermal paper.
  color_and_tone: Four grey levels only on warm grey-white thermal paper; blacks print slightly brownish and faded.
  lighting_and_shadow: 'Harsh contrast from a tiny sensor: bright areas clip to paper white, shadows fill with dense dither.'
  texture_and_material: Bayer ordered dither, bright edge-enhancement halos, visible printer dot rows and slight thermal fading streaks.
  camera_and_composition: Keep the requested view; close subjects work best, with a slight wide-angle bulge and no printed border frame.
  atmosphere_and_mood: Fond and scrappy, a snapshot kept in a drawer.
  rendering_and_quality: Chunky square photo pixels with ordered dither; no smooth grayscale and no color.
  key_features: 128x112 four-grey photo; Bayer dither; edge-enhancement halos; thermal paper dot rows; faded print
  creative_brief: "Toy pocket-camera photo at 128 by 112 pixels in four greys, edge-enhanced and printed on a narrow strip of thermal paper. Carry it through 128x112 four-grey photo, Bayer dither, edge-enhancement halos, thermal paper dot rows, faded print. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
