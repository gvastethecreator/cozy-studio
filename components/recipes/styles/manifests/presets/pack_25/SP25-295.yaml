visualDna:
  aesthetic: 'Modular Exhibition Captions: repeatable caption modules sharing anchors, margins and hierarchy while their length changes freely.'
  subject_treatment: Set the prompt's captions as modules with shared anchors and hierarchy that grow for longer texts, every title and reference exact.
  color_and_tone: A sober palette by function, with indexes coded consistently.
  lighting_and_shadow: The site lighting respected, captions needing no glow of their own.
  texture_and_material: A matte support with crisp text and discreet separators.
  camera_and_composition: Title, body and reference modules on one shared anchor line.
  atmosphere_and_mood: Clear repetition with varied content and pauses between works.
  rendering_and_quality: Clean captions with complete content and matching indexes.
  creative_brief: "Modular Exhibition Captions: repeatable caption modules sharing anchors, margins and hierarchy while their length changes freely. Carry it through caption modules, shared anchors, flexible length, exact references. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
