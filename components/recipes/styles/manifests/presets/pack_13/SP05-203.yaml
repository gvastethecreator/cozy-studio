visualDna:
  aesthetic: 'Tapered contours and broad clean gradients give existing forms forward visual direction, with bright edge accents following supplied pose or motion.'
  subject_treatment: 'Preserve identity, body proportions, action, and count; direct line accents along movement already shown without changing the gesture.'
  color_and_tone: 'Use clear high values and a limited bright accent against cooler or neutral mids; follow the requested hues.'
  lighting_and_shadow: 'Keep the stated light direction and place crisp highlights on existing edges; use smooth gradients without adding sunbeams.'
  texture_and_material: 'Keep surfaces clean with a few long brushlike strokes aligned to existing contours; add no atmospheric scenery.'
  camera_and_composition: 'Preserve framing, perspective, scale, and count; create momentum inside the original composition without changing crop or viewpoint.'
  atmosphere_and_mood: 'Retain the requested mood; directional energy does not set the emotional tone.'
  rendering_and_quality: 'Keep gradients broad and controlled, contour ends sharp, and focal forms distinct from surrounding planes.'
  key_features: 'Tapered directional contours; broad clean gradients; crisp edge accents; bright value openings; motion aligned to existing forms.'
  creative_brief: 'Let directional linework and clear gradients follow movement already in the prompt. Preserve subject, action, count, camera, and mood; add no new motion or narrative beat.'
