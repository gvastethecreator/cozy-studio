visualDna:
  aesthetic: 'Carpenter pencil sketch: a flat rectangular lead sharpened with a knife, used on its broad side for wide blocky strokes and on its edge for thin lines.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Soft dark graphite greys in wide flat bands, bare paper for lights, a few thin sharp edge lines for accents.
  lighting_and_shadow: Planes of light and shadow blocked in as flat, same-width strokes; each plane one or two passes.
  texture_and_material: Wide chisel strokes with hard parallel sides, abrupt thick-to-thin turns when the pencil rotates, rough paper grain showing through.
  camera_and_composition: Keep the requested framing; the subject is simplified into faceted planes with a strong silhouette.
  atmosphere_and_mood: Blunt, sturdy and quick, a builder’s sure hand.
  rendering_and_quality: Faceted blocky tone with sharp-sided strokes and thin edge accents; no smooth gradients and no fine hatching.
  creative_brief: "Carpenter pencil sketch: a flat rectangular lead sharpened with a knife, used on its broad side for wide blocky strokes and on its edge for thin lines. Carry it through wide flat chisel strokes, thick-to-thin rotation marks, faceted planes, bare paper lights, thin edge accents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: wide flat chisel strokes; thick-to-thin rotation marks; faceted planes; bare paper lights; thin edge accents
