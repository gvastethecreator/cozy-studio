visualDna:
  aesthetic: 'Inlaid Plane Emblems: broad color planes set flush into one simple mass, their edges giving hierarchy and a minimal sense of depth.'
  subject_treatment: Inlay the prompt's subject as two or three broad planes into one simple mass, the joins between color and edge creating minimal depth.
  color_and_tone: Two or three color planes on a neutral base, with one single focus of saturation.
  lighting_and_shadow: Diffuse light revealing the inlay edges with small, soft highlights.
  texture_and_material: Smooth base with shallow inlays, the base material interchangeable.
  camera_and_composition: Off-center focal plane with secondary regions balancing the mass.
  atmosphere_and_mood: Tactile precision and calm, with a small surprise when seen up close.
  rendering_and_quality: The inlay still reads in greyscale without relying on any material texture.
  creative_brief: "Inlaid Plane Emblems: broad color planes set flush into one simple mass, their edges giving hierarchy and a minimal sense of depth. Carry it through flush inlaid planes, neutral base, one saturated focus, shallow depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flush inlaid planes; neutral base; one saturated focus; shallow depth
