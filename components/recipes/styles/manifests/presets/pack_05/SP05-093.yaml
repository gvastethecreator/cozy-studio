visualDna:
  aesthetic: 'Film-quality anime with painterly background art: dry-brush contour accents, detailed sepia and moss landscapes and pale open skies behind clean cel figures.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Figures stay cleanly cel-shaded while their surroundings get painterly depth; do not add a road, a staff or a traveling party.
  color_and_tone: Earthy sepia, moss green, ink blue and parchment, with pale sky values keeping the whole image open.
  lighting_and_shadow: Diffused daylight with long gentle value shifts and atmospheric perspective that fades distant forms toward blue.
  texture_and_material: Dry pigment breaks, paper grain and transparent wash edges in the painted background, flat clean fills on figures.
  camera_and_composition: Keep the requested view; generous depth with foreground, middle and far planes separated by air.
  atmosphere_and_mood: Curious and quietly expansive, the sense of a big world just past the frame.
  rendering_and_quality: Painterly background with tactile detail, crisp cel figures and dry-brush lines only where they clarify form.
  key_features: painterly sepia-moss backgrounds; dry-brush contour accents; atmospheric blue fade; clean cel figures; parchment highlights
  creative_brief: "Film-quality anime with painterly background art: dry-brush contour accents, detailed sepia and moss landscapes and pale open skies behind clean cel figures. Carry it through painterly sepia-moss backgrounds, dry-brush contour accents, atmospheric blue fade, clean cel figures, parchment highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
