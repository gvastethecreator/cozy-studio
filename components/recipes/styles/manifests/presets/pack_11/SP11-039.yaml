visualDna:
  aesthetic: 'Gothic horror: crumbling castles, crypts, candlelit aristocrats and vertical menace.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: framed by tall vertical shadows and pointed-arch shapes, figures made pale and elegant, surfaces aged and decaying, with the threat kept just out of sight."
  color_and_tone: Black, blood red, bone white and candle gold, used consistently across subject and background.
  lighting_and_shadow: Candlelight and moonlight with deep shadow, expressed through the style rather than photographic lighting.
  texture_and_material: Stone, velvet, cobwebs and tarnished silver, visible at a glance as the signature of the style.
  camera_and_composition: Tall vertical framing with looming architecture, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Dread, romantic, decadent and haunted, driven by the construction, color and rhythm.
  rendering_and_quality: Dark painterly finish, with clean, deliberate marks and no accidental noise.
  key_features: pointed arches; crypt; candelabra; pale aristocrat; moonlight
  creative_brief: "Gothic horror: crumbling castles, crypts, candlelit aristocrats and vertical menace. Carry it through pointed arches, crypt, candelabra, pale aristocrat, moonlight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
