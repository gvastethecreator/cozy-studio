visualDna:
  aesthetic: 'Crevice rock garden: thin slabs of stone set on edge in parallel rows like tilted strata, with alpine cushion plants rooted deep in the narrow gaps and gravel mulch over all.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Grey, buff or slate-blue stone, silver and grey-green cushions, tiny saturated flowers in magenta, yellow and white, pale gravel; crisp and bright.
  lighting_and_shadow: Clear mountain light with hard shadows between the slabs, cushions glowing when backlit.
  texture_and_material: Split slate or sandstone slabs on edge, tight silver cushions of saxifrage and dianthus, trailing gentians, grit and gravel mulch, lichen on stone.
  camera_and_composition: Keep the requested view; low and close so the slab ridges run diagonally across the frame, plants in the gaps as jewels.
  atmosphere_and_mood: Rugged, precise and delicate, mountains in miniature.
  rendering_and_quality: Sharp photograph with slab edges and tiny flowers in focus, no lawn or soft beds.
  creative_brief: "Crevice rock garden: thin slabs of stone set on edge in parallel rows like tilted strata, with alpine cushion plants rooted deep in the narrow gaps and gravel mulch over all. Carry it through parallel stone slabs set on edge, alpine cushions in narrow crevices, gravel mulch, tiny saturated flowers, hard crevice shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: parallel stone slabs set on edge; alpine cushions in narrow crevices; gravel mulch; tiny saturated flowers; hard crevice shadows
