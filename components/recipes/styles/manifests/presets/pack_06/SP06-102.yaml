visualDna:
  aesthetic: >-
    Roguelike Tile Glyph System acts as a transferable art-medium router: start from Roguelike tile
    grammar built from stark glyph silhouettes, grid logic, and harsh tactical readability,
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Reduce any subject into symbolic tile chunks, clear
    collision edges, and instantly parsed icon like forms; preserve the prompt subject while routing
    it through tile readability, icon clarity, splash rendering, interface material, sprite bounce,
    shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Low count palette with black gutters, sickly accent colors, and high contrast
    value separation; use color as gameplay hierarchy: rarity glow, faction contrast, tactical
    coding, seasonal warmth, horror warmth, neon route color, or readable inventory material, with
    deliberate value grouping, accent control, and medium-specific limits rather than generic color
    wash.
  lighting_and_shadow: >-
    Handle light through Minimal light logic, mostly value coded planes, with tiny glow accents
    reserved for interaction points; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Chunky pixel pits, chipped edges, procedural speckle, and repeat safe surface motifs;
    surface detail should support genre grammar through parchment, HUD glass, pixel atlas texture,
    tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping material scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Strict orthographic top down or angled tile view with modular
    alignment and no cinematic depth; compose through gameplay-facing hierarchy, atlas consistency,
    menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen energy, with
    scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Tense, procedural, survival focused mood without requiring subterranean pressure,
    corridors, traps, or monsters; derive mood from playable stakes, collection desire, tactical
    control, cozy routine, survival dread, arcade speed, or heroic confrontation, letting the medium
    alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Seamless tile friendly edges, crisp pixel boundaries, readable at thumbnail scale;
    finish with game-production clarity, strong silhouettes, controlled UI-like detail, and no
    unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough craft
    evidence to make the medium recognizable.
  key_features: >-
    Roguelike tile grammar built from stark glyph silhouettes, grid logic, and harsh tactical
    readability; gameplay-readable hierarchy, genre-specific surface language, UI-aware composition,
    and production-art clarity; Low count palette with black gutters, sickly accent colors, and high
    contrast value separation; Chunky pixel pits, chipped edges, procedural speckle, and repeat safe
    surface motifs; Strict orthographic top down or angled tile view with modular alignment and no
    cinematic depth
  creative_brief: >-
    Apply Roguelike Tile Glyph System as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Roguelike tile grammar built from stark glyph silhouettes, grid logic, and harsh
    tactical readability, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity, Chunky pixel pits, chipped edges, procedural speckle,
    and repeat safe surface motifs without requiring the card image's original subject.
