  color_and_tone: Jewel pink, violet, gold and dark glass lead lines.
  lighting_and_shadow: Stained-glass jewel light, lit the way Madoka Magica SHAFT lights its scenes.
  texture_and_material: Leaded stained-glass segmentation, with the surface finish of Madoka Magica SHAFT.
  camera_and_composition: Symmetrical stained-glass compositions, framed the way Madoka Magica SHAFT composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with ominous jeweled beauty.
  rendering_and_quality: Stained-glass animation frame, in the recognizable hand of Madoka Magica SHAFT.
  key_features: Madoka stained glass; jewel light; symbolism
  creative_brief: "SHAFT Puella Magi Madoka Magica look (2011): stained-glass segmentation, cute Ume Aoki designs, jewel light and ominous symbolism. Carry it through Madoka stained glass, jewel light, symbolism. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
