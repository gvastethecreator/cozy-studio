visualDna:
  aesthetic: 'Kaiju suitmation cinema: a performer in a rubber creature suit stomping through detailed miniature sets, shot low to fake enormous scale.'
  subject_treatment: Keep the prompt subject and setting; render them as practical miniatures and suits filmed at giant scale, without adding a monster the prompt did not ask for.
  color_and_tone: Black and white or faded early Eastmancolor, grey smoke, orange fire accents.
  lighting_and_shadow: Hard studio floods mimicking daylight, smoke diffusing it, flickering practical fires.
  texture_and_material: Rubber suit folds, plaster rubble, balsa miniatures, visible wire supports and model water.
  camera_and_composition: Very low camera among the miniatures, forced perspective, smoke and debris in the foreground.
  atmosphere_and_mood: Charming and terrifying at once, handmade catastrophe on a tabletop.
  rendering_and_quality: Practical-effects film look; original creatures only, no famous monster designs.
  key_features: rubber-suit performer; detailed miniatures; low camera forced perspective; smoke and model fire; faded film stock
  creative_brief: "Kaiju suitmation cinema: a performer in a rubber creature suit stomping through detailed miniature sets, shot low to fake enormous scale. Carry it through rubber-suit performer, detailed miniatures, low camera forced perspective, smoke and model fire, faded film stock. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
