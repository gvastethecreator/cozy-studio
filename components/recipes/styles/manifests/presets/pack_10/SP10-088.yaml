visualDna:
  aesthetic: 'Swiss grid composition: strict modular grid, asymmetric layout, bold geometric image blocks without type.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is placed in a strict modular grid of image blocks and color fields."
  color_and_tone: Red, black, white and one accent, used consistently across subject and background.
  lighting_and_shadow: Flat or photographic within blocks, expressed through the style rather than photographic lighting.
  texture_and_material: Clean blocks with precise alignment, visible at card size as the signature of the style.
  camera_and_composition: Asymmetric modular grid, arranged so the subject still reads at card size.
  atmosphere_and_mood: Rational, clean, confident and modern, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp print finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Swiss Grid Composition as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: modular grid; asymmetric blocks; no type
