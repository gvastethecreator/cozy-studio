visualDna:
  aesthetic: 'Photoboothpunk: life told through coin photo booths, with four-frame vertical strips, harsh flash, pulled curtains and faces caught mid-laugh or mid-secret.'
  subject_treatment: Keep the prompt's subject and setting; show it as a four-frame photo booth strip, the same framing repeated with a changing moment in each frame.
  color_and_tone: Silvery black and white or faded chemical color with bright flash-lit skin and dark booth backdrops.
  lighting_and_shadow: Harsh frontal flash with flat faces and a hard dark falloff behind.
  texture_and_material: Glossy chemical print paper, slight developer stains, booth curtain fabric and rounded frame corners.
  camera_and_composition: Four stacked square frames from the same fixed close camera, each a different beat.
  atmosphere_and_mood: Spontaneous, intimate and mischievous, a tiny private theatre behind a curtain.
  rendering_and_quality: Authentic photo booth print rendering with flash glare, grain and slight chemical unevenness.
  creative_brief: "Photoboothpunk: life told through coin photo booths, with four-frame vertical strips, harsh flash, pulled curtains and faces caught mid-laugh or mid-secret. Carry it through four-frame strips, harsh flash, fixed close camera, changing moments. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: four-frame strips; harsh flash; fixed close camera; changing moments
