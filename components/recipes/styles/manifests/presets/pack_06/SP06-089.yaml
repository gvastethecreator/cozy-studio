visualDna:
  aesthetic: 'Text-mode roguelike map: a world drawn in an 80 by 25 character grid using box-drawing lines, shade blocks, dots and symbols in 16 ANSI colors.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns an overhead text-mode map in which every cell is one glyph and creatures are single-character symbols, and adds no score, health bar, logo or readable interface text.
  color_and_tone: 'Sixteen ANSI colors on black: grey walls, brown floors, blue water, green foliage, one bright color for the key creature.'
  lighting_and_shadow: Light radius shown by bright cells around the viewer fading to dim, unexplored cells left black.
  texture_and_material: Monospaced cells, double-line box walls, light and dark shade blocks for rock and water, dotted floors.
  camera_and_composition: Top-down map in a fixed grid; rooms and corridors frame the subject symbol at the center of lit cells.
  atmosphere_and_mood: Tense and cerebral, imagination doing most of the work.
  rendering_and_quality: Strict cell grid with crisp glyphs; single isolated symbols only, never words or sentences.
  key_features: 80x25 character grid; box-drawing walls; shade-block terrain; 16 ANSI colors; lit radius
  creative_brief: "Text-mode roguelike map: a world drawn in an 80 by 25 character grid using box-drawing lines, shade blocks, dots and symbols in 16 ANSI colors. Carry it through 80x25 character grid, box-drawing walls, shade-block terrain, 16 ANSI colors, lit radius. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
