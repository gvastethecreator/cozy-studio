visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through disciplined duel silhouette; urban night-action readability,
    vertical route layering, wet asphalt glow, and covert pressure, using the preset as art
    direction rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express covert movement, chase pressure,
    street-level conflict, evacuation tension, and rooftop-route clarity without requiring one urban
    scene.
  color_and_tone: >-
    Grade the image with electric magenta, cyan, acid green, and glossy black; black glass, wet
    concrete, saturated signage, emergency red, cyan edge light, and toxic green accents; keep tonal
    hierarchy strong enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with neon edge glow and wet reflections; practical neon, police strobes,
    backlit rain, window grids, traffic glow, and hard rim highlights; use highlights and shadow
    pockets to reveal routes, hazards, factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from lacquer armor, rain cloth, and blade shine; rain-slick pavement, carbon
    panels, patched jackets, utility metal, glowing signage substrate, and urban grime; make props,
    clothing, creatures, vehicles, architecture, and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from urban night-action readability, vertical route
    layering, wet asphalt glow, and covert pressure: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood dangerous, nocturnal, stylish, humid, kinetic, and conspiratorial; the result can
    be adult, harsh, seductive, eerie, or violent when prompt X asks for it, but the preset should
    not force a new storyline.
  rendering_and_quality: >-
    Finish as game-cinematic clarity with readable silhouettes, deep contrast, controlled bloom, and
    no menu or HUD dependence; preserve clean focal hierarchy, believable material response,
    heavy-denoise clarity, and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Neon, Samurai, District; disciplined duel silhouette; electric magenta, cyan, acid green, and
    glossy black; neon edge glow and wet reflections; lacquer armor, rain cloth, and blade shine;
    stacked rooftops, underpasses, side routes, cover layers, vanishing street lines, and
    mission-node depth; dangerous, nocturnal, stylish, humid, kinetic, and conspiratorial
  creative_brief: >-
    Apply Neon Samurai District as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
