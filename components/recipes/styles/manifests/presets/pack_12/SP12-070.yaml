visualDna:
  aesthetic: >-
    Source-informed video-game style router for original open-air adventure shrine captures:
    third-person exploration-combat, bow or tool trial readability, clean cel-natural materials,
    puzzle routes, stamina/traversal spacing, and sacred outdoor architecture. Borrow the open-air
    readability of Breath of the Wild-like games, but land as a different fictional shrine-adventure
    with different props, symbols, UI icons, enemies, and architecture.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable shrine-adventure screenshot
    subject: keep clear player/object/threat role, traversal affordance, bow/tool aim relationship,
    puzzle route, and scale readability without copying source characters or named IP elements.
  color_and_tone: >-
    Use an open-air shrine palette: grass green, sky blue, warm stone, pale gold, slate shadow,
    turquoise energy, and weathered wood. Keep value grouping legible and avoid tactical-strategy
    desaturation.
  lighting_and_shadow: >-
    Light the image through soft open-world daylight, moonlight, shrine glow, arrow trails, and
    gentle atmospheric haze. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from painted grass, ancient stone, glowing circuitry, cloth, wood bows, simple
    physics props, and stylized terrain. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person adventure camera, player/tool line, shrine mechanism, traversal route,
    enemy or target spacing, and one clear puzzle/combat decision. Avoid strategy overview and
    box-art hero pose.
  atmosphere_and_mood: >-
    Carry an original wild-shrine adventure mood: quiet, airy, curious, lightly magical, open, and
    exploratory.
  rendering_and_quality: >-
    Finish as coherent third-person adventure gameplay screenshot style, not concept art: sparse
    contextual HUD, stamina/aim cues, item icons, and objective pips can appear abstract and
    non-readable. Maintain heavy-denoise clarity and readable gameplay scale.
  key_features: >-
    The Legend of Zelda: Breath of the Wild gameplay screenshots; third-person open-air adventure
    capture with cel-shaded terrain, shrine technology, bow aiming, and clean traversal affordances;
    grass green, shrine blue, warm stone, sky cyan, moon silver, and orange camp glow; soft
    open-world daylight, moonlight, shrine glow, arrow trails, and gentle atmospheric haze; painted
    grass, ancient stone, glowing circuitry, cloth, wood bows, simple physics props, and stylized
    terrain; third-person exploration/combat framing with bow reticle, climbable shapes, shrine
    axes, and distant landmark readability; quiet, adventurous, airy, curious, and lightly magical;
    HUD guidance: hearts, stamina wheel, minimap, temperature icons, and bow reticle can appear if
    kept clean and authentic to open-world adventure
  creative_brief: >-
    Use Wild Shrine Bow Trial as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through open-air adventure references: third-person camera, clean cel-natural
    materials, shrine mechanisms, bow/tool aiming, traversal routes, and readable puzzle-combat
    state. Avoid direct Zelda cloning, strategy-tactics framing, exact shrine UI, recognizable
    franchise props, and promotional composition.
