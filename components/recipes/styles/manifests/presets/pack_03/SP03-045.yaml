visualDna:
  aesthetic: 'Wireframe on shaded: a grey-shaded 3D model with its mesh edges drawn over the surface, as in a modeling viewport presentation.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Neutral grey shading, dark or colored wire lines, clean background.
  lighting_and_shadow: Soft studio light with ambient occlusion on the grey model.
  texture_and_material: Quad topology and edge loops visible over the shaded form.
  camera_and_composition: Keep the requested view; model centered for presentation.
  atmosphere_and_mood: Technical and proud, craft shown in its structure.
  rendering_and_quality: Clean topology presentation render with no viewport UI or gizmos.
  key_features: grey shaded model; mesh edges overlaid; clean edge loops; ambient occlusion; presentation framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Wireframe on Shaded as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
