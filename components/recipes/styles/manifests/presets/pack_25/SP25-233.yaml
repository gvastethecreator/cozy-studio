visualDna:
  aesthetic: 'Chronological Strip Graphics: events laid on bands along one explicit time scale, durations as lengths and instants as distinct marks.'
  subject_treatment: Place the prompt's events on one explicit time scale, durations as proportional lengths and instants as distinct marks, every time and label exact.
  color_and_tone: Colors by event type backed by text, time shown by position alone.
  lighting_and_shadow: Flat bands with no shadow that could read as an interval.
  texture_and_material: Continuous bands, even tick marks and true gaps where nothing happens.
  camera_and_composition: One shared time axis, named lanes and marked breaks.
  atmosphere_and_mood: A faithful cadence of appearance, persistence and pause.
  rendering_and_quality: Crisp strip with exact interval ends and centered instant marks.
  creative_brief: "Chronological Strip Graphics: events laid on bands along one explicit time scale, durations as lengths and instants as distinct marks. Carry it through proportional time, duration bands, instant marks, shared axis. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: proportional time; duration bands; instant marks; shared axis
