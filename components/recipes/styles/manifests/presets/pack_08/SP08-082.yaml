visualDna:
  aesthetic: 'Deconstructed avant-garde fashion: garments that look taken apart and reassembled — raw hems, exposed seams, asymmetric layers and voluminous black.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: asymmetric layered black and off-black garments with raw edges, inside-out seams, displaced collars and unexpected volumes."
  color_and_tone: Black, ink, charcoal and unbleached cotton; almost monochrome, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Hard, low side light that carves the layers, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Boiled wool, washed cotton, felted knits and raw-edged linen.
  camera_and_composition: Full-figure, stark framing against plain or brutal architecture, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Intellectual, severe, melancholic and poetic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Matte, textured finish with deep blacks, with believable fabric weight, seams and fit detail.
  creative_brief: "Deconstructed avant-garde fashion: garments that look taken apart and reassembled — raw hems, exposed seams, asymmetric layers and voluminous black. Carry it through raw hems and exposed seams, asymmetric black layering, displaced volumes, stark side light, monochrome. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: raw hems and exposed seams; asymmetric black layering; displaced volumes; stark side light; monochrome
