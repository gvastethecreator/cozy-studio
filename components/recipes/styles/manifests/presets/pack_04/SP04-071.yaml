visualDna:
  aesthetic: 'Aquatint: rosin grain fused to a plate and bitten in stages, printing granular tonal washes, with brushed spit-bite acid giving soft pooled tones.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Sepia umber, smoke black or one blue-grey ink on cream, tonal rather than linear.
  lighting_and_shadow: Broad shadow masses in stepped bite tones and soft pooled gradients, only a few accents etched as line.
  texture_and_material: Fine sugary grain in every tone, soft-edged spit-bite pools and a few etched lines for accents.
  camera_and_composition: Keep the requested view with broad, landscape-like massing of tone.
  atmosphere_and_mood: Misty, somber and melancholy, weather seen through grain.
  rendering_and_quality: Granular tone fields with pooled edges; never a smooth digital gradient.
  key_features: rosin grain tone; spit-bite pools; stepped bite values; few etched accents; sepia or blue-grey ink
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Spit-Bite Aquatint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
