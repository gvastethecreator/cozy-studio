  atmosphere_and_mood: Ancient, slow, quiet and alive, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Lichen crust: flat crusty lichen rosettes in orange, yellow and grey growing over the target. Carry it through lichen rosettes, circular crust patches, orange and chartreuse, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
