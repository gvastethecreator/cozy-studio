visualDna:
  aesthetic: >-
    Build high-impact anime action from a compact subject silhouette, elastic contour rhythm, and
    bold force lines that converge into a forward rush. Keep motion legible through sharp
    directional edges and compressed depth. Use dark-blue support values only where they fit the
    requested palette.
  subject_treatment: >-
    Preserve the requested subject identities and count, action, pose, props, wardrobe, setting,
    and tone. Restyle only contours, gesture emphasis, and edge rhythm. Do not add, remove, replace,
    or duplicate people, opponents, props, or scene elements.
  color_and_tone: >-
    Preserve the requested colors and emotional temperature. Where compatible, use dark-blue
    support values and concise cool highlights to clarify the forward motion without introducing
    new light sources or changing the scene's mood.
  lighting_and_shadow: >-
    Use clean local contrast and hard edge highlights aligned with the existing movement. Follow
    the requested lighting context; do not invent flashes, electricity, machinery, or magic.
  texture_and_material: >-
    Keep contours crisp and use a few tapered motion streaks attached to moving forms. Preserve
    requested surfaces and materials; add dust, smoke, grit, or debris only when the request
    includes them.
  camera_and_composition: >-
    When the requested camera leaves room for interpretation, use close foreshortening, compressed
    depth, and converging diagonals to carry the requested movement forward. Preserve an explicitly
    requested viewpoint and do not impose an alley or other setting.
  atmosphere_and_mood: >-
    Let the requested tone lead. Create forward pressure through framing and line direction without
    adding danger, confrontation, or a more intense emotion than requested.
  rendering_and_quality: >-
    Use sharp 2D contours, stable anatomy or object structure, and clear foreground-to-background
    separation. Keep streaks and grain controlled so the requested subject and action remain
    immediately legible.
  key_features: >-
    Compact silhouettes, elastic contours, converging forward diagonals, close foreshortening,
    controlled motion streaks, and clear action readability, all applied to the requested content.
  creative_brief: >-
    Strengthen the requested action with a compact, forward-driving composition, elastic contours,
    and converging lines. Preserve the requested subject, count, props, setting, and tone.
