visualDna:
  aesthetic: 'Kaleidoscope symmetry art: the subject drawn once in one wedge and mirrored six or eight times around a center, forming a radial mandala.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Jewel colors, emerald, sapphire, ruby and gold, on dark or light ground; repeating color rhythm around the circle.
  lighting_and_shadow: Simple even lighting per wedge, a luminous glow toward the center.
  texture_and_material: Crisp mirrored seams, fine repeating ornament, smooth digital brush fills.
  camera_and_composition: The prompt subject repeated radially around a central point, filling a circle or the full square.
  atmosphere_and_mood: Hypnotic, ornate and meditative, a spinning jewel.
  rendering_and_quality: Perfect mirror seams and radial repetition with the subject still recognizable in each wedge; no random asymmetry.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mirror-Tool Kaleidoscope as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: radial mirror symmetry; six or eight repeating wedges; jewel color rhythm; central glow; recognizable repeated subject
