visualDna:
  aesthetic: 'Hyperspectral data cube: an image shown as the top face of a 3D block whose sides display hundreds of spectral bands as rainbow streaks.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Natural or false-color top face, rainbow band gradients on the cube sides, dark background.
  lighting_and_shadow: Flat scientific presentation with slight shading to show the cube form.
  texture_and_material: Fine band striations on the cube edges, pixelated spectral detail.
  camera_and_composition: Isometric cube view, the subject on the top face.
  atmosphere_and_mood: Analytical and beautiful, a scene opened up into its light.
  rendering_and_quality: Clean scientific visualization without any axes, numbers, legends or captions.
  creative_brief: "Hyperspectral data cube: an image shown as the top face of a 3D block whose sides display hundreds of spectral bands as rainbow streaks. Carry it through isometric data cube, subject on the top face, rainbow spectral sides, band striations, dark background. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: isometric data cube; subject on the top face; rainbow spectral sides; band striations; dark background
