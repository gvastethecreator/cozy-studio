  aesthetic: 'Generation Shippunk: life inside vast ark ships traveling for centuries, with farm decks, forgotten corridors, ship-born cultures and a destination nobody alive will see.'
  subject_treatment: Keep the prompt's subject and setting; set it inside a huge centuries-old ark ship with farm decks, worn corridors and ship-born people.
  color_and_tone: Aged metal greys and warm grow-light gold with lush greens and faded paint.
  lighting_and_shadow: Artificial daylight panels over farms and dim flickering corridors beyond.
  texture_and_material: Worn metal decks, soil beds, handmade repairs, faded murals and vines.
  camera_and_composition: Long interior perspectives and cylinder farms curving overhead.
  atmosphere_and_mood: Melancholy and resilient, a world inside a journey.
  rendering_and_quality: Richly detailed illustration with deep interiors and warm grow-light.
  creative_brief: "Generation Shippunk: life inside vast ark ships traveling for centuries, with farm decks, forgotten corridors, ship-born cultures and a destination nobody alive will see. Carry it through farm decks, worn corridors, ship-born cultures, curving interiors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
