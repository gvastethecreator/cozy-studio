visualDna:
  aesthetic: >-
    For Honor (2017) third-person melee capture with heavy practical armor, massive fortified
    terrain and clear guarded combat spacing under natural battlefield light.
  subject_treatment: >-
    Keep the controlled subject, opponent and any immediate combat lane distinguishable at play
    distance. Preserve the requested identity; do not use a named Ubisoft hero or faction as a
    substitute.
  color_and_tone: >-
    Let the chosen environment and prompt control palette. Keep combatants separable by value and
    local color without importing mandatory blue/red team coding.
  lighting_and_shadow: >-
    Use plausible game-scene lighting that keeps weapons, guard direction and bodies legible. Avoid
    dramatic key-art spotlights that erase the battlefield.
  texture_and_material: >-
    Render armor, cloth, leather, ground and debris with the base game's real-time 3D level of
    detail. Avoid later seasonal cosmetic designs unless the request names them.
  camera_and_composition: >-
    Use a third-person gameplay view anchored behind or just above the controlled fighter. In a duel
    frame, keep both fighters and weapon lanes readable; in an objective battle, show enough terrain
    to explain movement. Choose one mode per frame rather than mixing layouts.
  atmosphere_and_mood: >-
    Show an active playable exchange, guard read or objective movement. Preserve the prompt's
    stakes; do not force a kill, siege or capture-point event.
  rendering_and_quality: >-
    Maintain real-time 2017 game-capture clarity and combat scale. Add objective markers, player
    labels or combat UI only if specifically requested and supported by the selected mode.
avoidRules:
  - unrequested use of named heroes, faction gear, emblems or live-service event scenes
  - switching the third-person view to a side-on fighting-game plane
  - unrequested blood, objective markers, combat text or fabricated HUD
  - cinematic blur that hides guard direction or combat spacing
