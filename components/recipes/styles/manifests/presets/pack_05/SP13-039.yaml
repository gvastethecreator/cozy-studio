visualDna:
  aesthetic: 'Akira Amemiya Trigger action look: fast tracking pans with streaked backgrounds, bold graphic speed, flat stylized characters and punchy kinetic energy.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures crisp and bold while the background streaks into horizontal lines of speed behind them. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bold flat colors and streaked background blues and golds.
  lighting_and_shadow: Flat graphic light with bright speed highlights running along the moving figure.
  texture_and_material: Clean flat cel characters over horizontally streaked painted backgrounds.
  camera_and_composition: Side-tracking pans that streak the background while the figure stays sharp.
  atmosphere_and_mood: Keep the requested mood with punchy kinetic speed.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Akira Amemiya Trigger action look: fast tracking pans with streaked backgrounds, bold graphic speed, flat stylized characters and punchy kinetic energy. Carry it through Akira Amemiya pans, streaked backgrounds, bold graphic speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
