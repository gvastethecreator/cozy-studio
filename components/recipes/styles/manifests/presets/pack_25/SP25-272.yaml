visualDna:
  aesthetic: 'Pocket-Frame Compositions: existing pockets and openings used as anchors and frames for the print, never covered.'
  subject_treatment: Anchor the prompt's print on the garment's real pocket or opening, using it as a partial frame while its opening stays free; keep any text exact.
  color_and_tone: Main color contrasting with the fabric, the pocket keeping its own tone.
  lighting_and_shadow: Mockup light that shows the real pocket depth.
  texture_and_material: Flat art and support edge clearly separated at the pocket.
  camera_and_composition: Motif anchored at real pocket corners with margin left at the opening.
  atmosphere_and_mood: A clever but contained composition that lets the garment finish the idea.
  rendering_and_quality: Clean print with registered anchors and a free opening.
  creative_brief: "Pocket-Frame Compositions: existing pockets and openings used as anchors and frames for the print, never covered. Carry it through pocket as frame, free opening, corner anchors, clever composition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pocket as frame; free opening; corner anchors; clever composition
