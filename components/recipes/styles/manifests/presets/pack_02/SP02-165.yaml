visualDna:
  aesthetic: 'Continuous-line toy screen drawing: a picture drawn with two knobs on a silver-grey toy screen, one unbroken dark line of stair-stepped diagonals.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Silver-grey powder screen with thin dark grey lines, inside a red plastic frame edge.
  lighting_and_shadow: Soft screen sheen, no shading except denser zig-zag fills.
  texture_and_material: Stair-stepped diagonals, curves made of tiny steps, faint remnants of shaken-away lines.
  camera_and_composition: Screen seen straight on, the drawing as one continuous connected line.
  atmosphere_and_mood: Patient and nostalgic, a toy mastered with stubborn care.
  rendering_and_quality: Real single-line knob drawing; no brand name on the frame.
  creative_brief: "Continuous-line toy screen drawing: a picture drawn with two knobs on a silver-grey toy screen, one unbroken dark line of stair-stepped diagonals. Carry it through one continuous line, stair-stepped diagonals, silver-grey screen, red toy frame, zig-zag fills. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one continuous line; stair-stepped diagonals; silver-grey screen; red toy frame; zig-zag fills
