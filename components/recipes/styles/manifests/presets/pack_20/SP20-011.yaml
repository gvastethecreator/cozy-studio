visualDna:
  aesthetic: 'Photogravure tone: a photographic image etched into a copper plate and printed in intaglio ink, with deep velvety shadows and soft continuous grain.'
  subject_treatment: Render the prompt's subject as an etched photographic print, keeping its forms and likeness while the plate adds rich ink depth and soft grain.
  color_and_tone: Warm black or sepia ink on soft cream paper, deep rich shadows and gentle luminous highlights.
  lighting_and_shadow: Natural photographic light held in continuous tone, with shadows pooling into dense velvety ink.
  texture_and_material: Fine aquatint-like grain in mid-tones, a visible plate mark and slightly raised ink in the darks.
  camera_and_composition: Classic photographic framing with a wide paper margin and plate mark around the image.
  atmosphere_and_mood: Timeless, quiet and precious, like an early art photograph.
  rendering_and_quality: Continuous-tone intaglio print with fine grain and embossed plate edge, never a digital photo.
  creative_brief: "Photogravure tone: a photographic image etched into a copper plate and printed in intaglio ink, with deep velvety shadows and soft continuous grain. Carry it through velvet etched shadows, fine plate grain, plate mark, warm ink on cream paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: velvet etched shadows; fine plate grain; plate mark; warm ink on cream paper
