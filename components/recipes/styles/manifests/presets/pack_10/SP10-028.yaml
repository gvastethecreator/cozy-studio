visualDna:
  aesthetic: 'Scanography: objects placed on a flatbed scanner — crushed-depth focus, stretched motion and black background.'
  subject_treatment: "Re-render the prompt's image entirely in this representation unit so the subject reads from the pattern of units: the subject is scanned face-down on glass: sharp contact areas, falloff into black and stretched parts where it moved."
  color_and_tone: Hyper-sharp colors against black, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Glass-contact detail, falloff and scan stretch, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Strange, intimate, clinical and surreal, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: flatbed contact sharpness; black falloff; scan stretch
  creative_brief: "Scanography: objects placed on a flatbed scanner — crushed-depth focus, stretched motion and black background. Carry it through flatbed contact sharpness, black falloff, scan stretch. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
