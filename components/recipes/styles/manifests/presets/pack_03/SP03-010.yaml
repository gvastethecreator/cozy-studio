visualDna:
  aesthetic: 'High-end game pipeline render: a real-time engine frame with heavy post-processing — bloom, lens flares, color grading and screen-space effects.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Punchy graded color, strong bloom on emissives, filmic tonemap with lifted blacks.
  lighting_and_shadow: Baked and real-time mix, reflection probes, screen-space reflections with slight edge artifacts.
  texture_and_material: PBR materials, particle effects, decals, slightly repeating tiling textures.
  camera_and_composition: Third-person or cinematic game camera, lens flare from bright sources.
  atmosphere_and_mood: Epic and game-like, a moment made for a trailer.
  rendering_and_quality: Real-time game look with post effects; no HUD, no trams or city clichés.
  key_features: heavy bloom and lens flares; screen-space reflections; particle effects; PBR materials; graded filmic tonemap
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Unity HDRP High-End Game Pipeline as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
