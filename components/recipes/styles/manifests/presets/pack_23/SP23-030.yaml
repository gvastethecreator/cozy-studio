visualDna:
  aesthetic: >-
    Build raster forms from intentional pixel clusters, a compact indexed color set, hard edges and
    dithering that follows volume. Use these as drawing mechanics without tying hue choices or pixel
    scale to a specific hardware target.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and functional details.
    Let cluster placement and dither clarify existing shapes; do not add characters, creatures, gore or
    a narrative event to demonstrate the technique.
  color_and_tone: >-
    Preserve the requested hues and palette relationships. If the palette is open, organize color into
    a compact set of related ramps without adopting unverified hardware colors or discarding specified
    colors.
  lighting_and_shadow: >-
    Follow the requested light and shadow direction. Use compact value steps and form-following dither
    to shape existing volume; do not add a CRT glow, bloom or new light source.
  texture_and_material: >-
    Keep pixel clusters crisp and intentional. Use dither only where it supports existing form or
    material, and avoid continuous gradients, uniform noise or an all-over scanline texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, aspect ratio and arrangement. Do not turn the
    image into a retro game screen, tile map, interface or framed display.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. This is a digital raster treatment, not a decade, genre,
    horror tone or game-world setting.
  rendering_and_quality: >-
    Make each cluster serve silhouette, volume or a requested material cue. Keep hard pixel boundaries
    legible at the intended output size without relying on blur, post-processing or arbitrary noise.
avoidRules:
  - unrequested CRT filter, scanlines or game-screen frame
  - unrequested characters, Lovecraftian creatures, gore or game narrative
  - fixed hardware palette or exact system emulation
  - continuous gradients, blur or uniform pixel noise replacing constructed clusters
