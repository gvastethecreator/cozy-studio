  lighting_and_shadow: Clean office light with red glowing corruption, lit the way Control 2019 lights its levels.
  texture_and_material: Raw concrete, office clutter and particle debris, with the in-engine surface finish of Control 2019.
  camera_and_composition: Third-person view in brutalist halls, framed the way Control 2019 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with uncanny bureaucratic dread.
  rendering_and_quality: Authentic modern ray-traced action screen, matching real Control 2019 screenshots.
  key_features: Control brutalism; telekinesis; red corruption; floating debris
