visualDna:
  aesthetic: >-
    Damask Pattern becomes a transferable textile and ornamental pattern system: start from Damask
    ornamental repeat and Symmetry, then route prompt content through motifs, repeats, weave logic,
    decorative grids, stitched marks, and surface ornament without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Symmetrical floral to wrap, embroider, tile,
    dye, weave, print, or camouflage forms while preserving the prompt subject underneath; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Two tone (e.g. Red/Gold); treat palette as dye, thread, ceramic pigment,
    woven banding, motif hierarchy, or cultural ornament logic, with enough value control that the
    subject remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: use soft fabric light, glazed highlights, stitch shadows,
    woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Silk, velvet as the tactile or mark-making basis; surface detail must follow yarn, fiber,
    glaze, dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props,
    spaces, or close material studies.
  camera_and_composition: >-
    Compose around Repeat as reusable spatial grammar: favor repeat rhythm, motif scale, borders,
    allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Expensive, old as the emotional register; derive mood from craft, ritual, fashion, domestic
    texture, camouflage, ornament, or folk memory, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Luxury, classic: finish with readable pattern scale, tactile detail, and no wallpaper
    pasted over the subject, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Damask ornamental repeat; Symmetrical floral; Two tone (e.g. Red/Gold); Flat; Silk, velvet;
    Repeat; Expensive, old; Luxury, classic; Symmetry
  creative_brief: >-
    Apply damask as luxurious repeat over the input with two-tone symmetry, acanthus and
    fleur-de-lis motifs, silk-velvet sheen, old-world restraint, and dense ornamental rhythm. If
    interiors or textiles exist, reinforce them; otherwise use damask as surface grammar without
    requiring wallpaper, drawing rooms, or candlelight.
