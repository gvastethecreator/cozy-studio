visualDna:
  aesthetic: 'Exoplanet surface environment render: alien terrain under a strange sky, a giant ringed planet or twin suns hanging above, thin atmosphere scattering odd colors.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies the surface of an alien planet with a giant neighbouring world or twin suns in the sky; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Non-terrestrial palette such as rust sand under a teal sky or violet rock under an amber sky; one complementary accent from the sky body.
  lighting_and_shadow: Twin suns throwing two shadows of different color, or planetshine filling shadows with the giant planet's hue.
  texture_and_material: Wind-sculpted rock, fine regolith dust, frost or mineral crusts, with scale cues from boulders and footprints.
  camera_and_composition: Keep the requested camera; the sky body occupies a large part of the frame to set the world instantly.
  atmosphere_and_mood: Lonely and awe-struck, the quiet of a place no one was meant to see.
  rendering_and_quality: Physically based atmospheric scattering with haze layers and crisp near-field regolith detail.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Exoplanet Surface Environment as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: giant sky planet or twin suns; double colored shadows; non-Earth palette; regolith dust; atmospheric haze layers
