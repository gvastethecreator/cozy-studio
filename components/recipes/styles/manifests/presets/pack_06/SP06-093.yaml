visualDna:
  aesthetic: 'Japanese-market 8-bit micro graphics: square pixels in bright candy primaries, with only two colors allowed in each 8 by 1 pixel line segment.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: 'Fifteen fixed saturated colors on black: vivid cyan, magenta, bright yellow, deep blue and grass green; strong complementary pairs.'
  lighting_and_shadow: No gradients; form built from outlines and two-color stripes, shadows as solid dark areas.
  texture_and_material: Horizontal color-clash fringes where two shapes meet in one 8-pixel segment, crisp outlines and small repeated patterns.
  camera_and_composition: Keep the requested view; compact, clearly outlined subjects on a black or single-color field.
  atmosphere_and_mood: Bright and plucky, adventure on a small bedroom machine.
  rendering_and_quality: Square pixels with visible line-clash artifacts; no dithering gradients and no muted colors.
  key_features: square pixels; two colors per 8x1 segment; horizontal clash fringes; candy primaries; black field
  creative_brief: "Japanese-market 8-bit micro graphics: square pixels in bright candy primaries, with only two colors allowed in each 8 by 1 pixel line segment. Carry it through square pixels, two colors per 8x1 segment, horizontal clash fringes, candy primaries, black field. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
