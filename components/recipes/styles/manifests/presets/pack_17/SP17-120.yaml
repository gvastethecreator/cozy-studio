visualDna:
  aesthetic: Chiaroscuro woodcut printed from a key block and two tone blocks in olive, ochre, and dark green-brown, with highlights cut out to reveal pale paper.
  subject_treatment: 'Any prompt subject is built from flat tonal wood blocks: mid tone as the base, darker block for shadow, key block for contour, and carved highlights for light.'
  color_and_tone: Olive, ochre, dark green-brown, black key line, and pale paper highlights.
  lighting_and_shadow: Strong sculptural light from highlight cuts; shadows as flat dark block shapes.
  texture_and_material: Wood grain in the flat tone fields, crisp gouged edges, slight block misalignment.
  camera_and_composition: Monumental composition with a large sculptural subject and simple backdrop.
  atmosphere_and_mood: Heroic, grave, classical, and earthy.
  rendering_and_quality: 'Refined printmaking finish: clean block edges, subtle wood grain, readable shapes.'
  creative_brief: "Chiaroscuro woodcut printed from a key block and two tone blocks in olive, ochre, and dark green-brown, with highlights cut out to reveal pale paper. Carry it through key block plus olive and ochre tone blocks, carved highlights, wood grain fields, monumental sculptural light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: key block plus olive and ochre tone blocks; carved highlights; wood grain fields; monumental sculptural light
