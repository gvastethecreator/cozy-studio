  lighting_and_shadow: Sky light not matching the scene exactly, kept consistent across the whole image.
  texture_and_material: Stretched low-res sky textures and visible seams, kept consistent across the whole image.
  camera_and_composition: Wide view with lots of sky and a small ground.
  atmosphere_and_mood: Keep the requested mood with lonely vast nostalgia.
  rendering_and_quality: Authentic stretched skybox with seams, kept consistent across the whole image.
