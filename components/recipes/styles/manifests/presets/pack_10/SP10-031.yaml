visualDna:
  aesthetic: 'Melting dream surrealism: hard objects softening and drooping over edges under an eerie, precise dream sky.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: one or two rigid elements soften and droop over edges while everything else stays hyper-precise."
  color_and_tone: Clear desert blues, ochre and long shadows, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Low crisp sun with long hard shadows, supporting the dream logic without adding stock props.
  texture_and_material: Glossy precise painting with melting forms, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Uncanny, still, dreamlike and precise, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: melting rigid forms; precise rendering; long shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Melting Dream Surrealism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
