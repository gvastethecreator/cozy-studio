visualDna:
  aesthetic: 'Ghost mannequin apparel photography: a garment shown as if worn by an invisible body, keeping its three-dimensional shape with the interior of the collar visible.'
  subject_treatment: Keep the prompt's object exactly — shape, proportions, color and supplied design; this preset owns the invisible-body presentation of garments; non-garment subjects keep their own form.
  color_and_tone: Neutral white or light grey background, accurate fabric color.
  lighting_and_shadow: Even soft light from both sides and above, gentle shading showing fabric volume.
  texture_and_material: Weave, quilting, stitches, buttons and lining crisp; hollow neck and cuffs.
  camera_and_composition: Straight-on front view, garment centered and symmetrical, hollow opening at the neck.
  atmosphere_and_mood: Clean and informative, the garment seen exactly as it would be worn.
  rendering_and_quality: Seamless composite look with no mannequin, hanger or body visible.
  creative_brief: "Ghost mannequin apparel photography: a garment shown as if worn by an invisible body, keeping its three-dimensional shape with the interior of the collar visible. Carry it through invisible body volume, hollow collar interior, straight-on symmetry, even soft light, neutral background. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: invisible body volume; hollow collar interior; straight-on symmetry; even soft light; neutral background
