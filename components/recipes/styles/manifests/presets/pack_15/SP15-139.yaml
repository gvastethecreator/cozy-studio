  color_and_tone: Brick red, canal green water, painted narrowboat colors and mossy stone grey.
  lighting_and_shadow: Soft English daylight with reflections doubled in still canal water.
  texture_and_material: Brick aqueducts, wooden lock gates, painted boats and iron winding gear.
  camera_and_composition: Long canal perspectives, stepped locks and aqueducts spanning valleys.
  atmosphere_and_mood: Patient and peaceful, a slow engineered world that runs at walking pace.
