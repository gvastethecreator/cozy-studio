visualDna:
  aesthetic: >-
    Hypergraphic action drawing: bold contour locks, interleaved chromatic planes, and
    repeat-recoil rhythm in the width and spacing of existing marks.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Vary contour
    weight only where the supplied action transfers force.
  color_and_tone: >-
    Honor explicitly requested colors. Anchor opposing saturated masses with dark and pale
    neutrals; limit accents and follow explicit color intent.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use supplied light for clean rim
    separation; add no impact flash, burst, or other unrequested effect.
  texture_and_material: >-
    Apply texture only to materials already present. Keep color fields hard and clean with
    sparse boundary grain; add no debris, streaks, or surface noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Align graphic weight with
    the existing action vector and balance it with quiet gaps.
  atmosphere_and_mood: >-
    Preserve stated mood and stakes; impact rhythm is spacing and contour, not added danger or
    intensity.
  rendering_and_quality: >-
    Keep action readable through silhouette and force transfer; avoid distortion, blur, and
    marks that invent events.
  key_features: >-
    Bold contour lock; interleaved chromatic planes; repeat-recoil spacing; source-bound rim
    separation.
  creative_brief: 'Use bold contour lock; interleaved chromatic planes; repeat-recoil spacing; source-bound rim separation. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
