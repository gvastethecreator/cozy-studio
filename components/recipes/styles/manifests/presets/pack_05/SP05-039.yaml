visualDna:
  aesthetic: 'Bright adventure-TV anime: slim clean contours and simple sunlit cel color, with inner power drawn as a translucent, wobbling double outline that hugs a figure like heat shimmer.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Clear sky blue, leaf green, white and warm skin tones; each shimmer outline in its own soft hue at low opacity.
  lighting_and_shadow: Clean midday light, one cel shadow tier, and a pale bounce under chins and brims.
  texture_and_material: Smooth flat fills; the shimmer outline slightly blurred and wavering, never a solid glow.
  camera_and_composition: Keep the requested framing; roomy compositions with clear intervals between figures, readable at a glance like a strategy map.
  atmosphere_and_mood: Playful curiosity sharpened by quiet calculation, bright and open but always a step ahead.
  rendering_and_quality: Crisp lines, minimal texture, and the shimmer halo only where the prompt shows focus or effort.
  key_features: slim clean contour; translucent wobbling aura outline; sunlit cel palette; clear figure intervals; one-tier cel shadow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tactical Adventure Shonen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
