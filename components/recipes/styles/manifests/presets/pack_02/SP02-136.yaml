visualDna:
  aesthetic: 'Charcoal erasure animation: a single charcoal drawing altered, erased and redrawn under the camera, leaving ghost traces of every earlier frame.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Charcoal black and smudged greys on off-white paper, occasional pale blue pastel accent.
  lighting_and_shadow: Drawn tone only; light made by erasing into the charcoal.
  texture_and_material: Smudges, eraser streaks, ghosted previous positions, paper tooth.
  camera_and_composition: Fixed paper under the camera, moving elements trailing their own erased ghosts.
  atmosphere_and_mood: Melancholic and restless, memory that never quite disappears.
  rendering_and_quality: Real charcoal on paper look; not a clean pencil sketch.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Charcoal Erasure Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ghost traces of earlier frames; eraser streaks; smudged charcoal; paper tooth; fixed drawing under camera
