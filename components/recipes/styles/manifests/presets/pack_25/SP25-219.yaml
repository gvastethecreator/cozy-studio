visualDna:
  aesthetic: 'Eight-Page Rhythm Trial: one editorial system applied to eight page roles, cover, contents, opener, body, image, data, notes and back.'
  subject_treatment: Lay out the prompt's publication as eight thumbnails, cover, contents, opener, body, image, data, notes and back, one system and the exact title.
  color_and_tone: Constant color roles with legible contrast on dense and quiet pages.
  lighting_and_shadow: Flat layout with source image light preserved in every image.
  texture_and_material: Coherent type, edges and support across the whole sequence.
  camera_and_composition: Eight page thumbnails in two rows, each page role clearly different.
  atmosphere_and_mood: A sustained publication rhythm rather than eight covers.
  rendering_and_quality: Crisp sequence where every page has a job and folios stay consistent.
  creative_brief: "Eight-Page Rhythm Trial: one editorial system applied to eight page roles, cover, contents, opener, body, image, data, notes and back. Carry it through eight page roles, one system, thumbnail rows, consistent folios. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: eight page roles; one system; thumbnail rows; consistent folios
