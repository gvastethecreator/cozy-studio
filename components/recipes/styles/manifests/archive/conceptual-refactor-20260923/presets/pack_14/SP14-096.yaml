    hierarchy plus oracle converted into repeatable spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Mirror Oracle Refraction Archive after prompt X as a transferable mythic-noir layer:
    prompt X supplies subject, action, setting, and intensity, while this preset supplies mirror
    translated into dark symbolic behavior, oracle translated into dark symbolic behavior plus
    refraction translated into dark symbolic behavior, mirror shaping silhouette rhythm, contour
