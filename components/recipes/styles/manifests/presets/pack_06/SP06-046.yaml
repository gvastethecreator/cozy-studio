visualDna:
  aesthetic: 'Polished digital painting: a painted illustration built on layers with hard round and textured brushes, finished with a sharp focal area and softer, economical surroundings.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Rich RGB color organized in a clear value plan, warm key against cool shadow, saturated accents kept to the focal area.
  lighting_and_shadow: Motivated key light with painted bounce light and rim light; shadows grouped into large simple shapes, glow layers used sparingly.
  texture_and_material: Visible brush strokes and subtle canvas-texture brushes in the background, tighter blended rendering on faces and hero materials.
  camera_and_composition: Keep the requested framing; edges sharpen toward the focal point and soften or lose detail at the borders.
  atmosphere_and_mood: Cinematic, vivid and clear, a finished story illustration.
  rendering_and_quality: Hard-to-soft edge hierarchy, controlled detail density and clean value grouping; no photo textures pasted in and no 3D render gloss.
  key_features: layered hard and textured digital brushwork; focal-area sharpening; warm key and cool shadow; painted rim and bounce light; economical surroundings
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Digital Painting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
