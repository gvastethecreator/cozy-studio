  lighting_and_shadow: Flame light and ember glow, lit the way Atsushi Ohkubo lights its scenes.
  texture_and_material: Bold angular ink and ember effects, with the surface finish of Atsushi Ohkubo.
  camera_and_composition: Angular dynamic compositions, framed the way Atsushi Ohkubo composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with blazing angular bravado.
  rendering_and_quality: Bold graphic action manga illustration, in the recognizable hand of Atsushi Ohkubo.
