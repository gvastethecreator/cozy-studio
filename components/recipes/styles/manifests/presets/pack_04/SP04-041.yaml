visualDna:
  aesthetic: >-
    Fashion Illustration acts as a transferable illustration router: start from Runway sketch,
    Fashion Illustration poster hierarchy, symbolic compression, print surface, graphic color
    pressure, and editorial shape control, 9 heads tall, loose gesture, editorial whitespace and
    editorial graphic system built from poster hierarchy, symbolic compression, typography-as-shape,
    reproduction limits, and immediate visual argument, then apply the visual behavior to prompt X
    instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Loose, gestural, elongated runway sketch gesture, fast
    contour, fabric sweep, and pose-aware line economy without requiring a model card; preserve the
    requested subject while converting it into emblem, poster form, editorial metaphor, collage
    fragment, fashion gesture, or information hierarchy, keeping the requested identity, silhouette,
    pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Watercolor splash, runway accent, gestural pigment; use color as communication
    pressure: ink plates, propaganda contrast, deco metallic restraint, psychedelic vibration,
    Bauhaus primaries, vector flatness, or vintage print fade, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Spontaneous stroke and fashion-line attitude without simulated lighting;
    make light serve graphic hierarchy through flat poster contrast, airbrush gradients, screenprint
    layers, symbolic rays, collage mismatch, or painted cover drama, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Paper, fashion paper tooth, watercolor accents, loose graphite underdrawing, and wet-dry
    pigment blooms around fabric edges; surface detail should reveal screenprint ink, risograph
    grain, paper stock, cut-paper edges, vector fields, album-cover wear, or editorial print finish,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Elongated legs, scale rhythm, edge hierarchy, spacing, and
    composition rules specific to Fashion Illustration; compose through graphic hierarchy, diagonal
    force, asymmetrical grid, ornamental framing, cover impact, information grouping, or fashion
    elongation without readable slogan dependency, with scale, spacing, edge rhythm, and visual
    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Chic, fast, atelier energy, catwalk motion; derive mood from propaganda urgency,
    luxe modernity, counterculture heat, editorial wit, travel nostalgia, music-poster grit, or
    cover-story seduction, letting the style alter interpretation without demanding a specific
    story, location, or actor.
  rendering_and_quality: >-
    Finish with Vogue, stylish, runway fluidity, editorial confidence; finish as deliberate graphic
    communication with crisp shape logic, controlled print artifacts, and no random poster text or
    literal advertisement clutter, clean denoised surfaces where appropriate, and enough process
    evidence to make the style recognizable.
  key_features: >-
    Runway sketch, Fashion Illustration poster hierarchy, symbolic compression, print surface,
    graphic color pressure, and editorial shape control; 9 heads tall, loose gesture, editorial
    whitespace; Watercolor splash, runway accent, gestural pigment; Paper, fashion paper tooth,
    watercolor accents, loose graphite underdrawing, and wet-dry pigment blooms around fabric edges;
    Elongated legs, scale rhythm, edge hierarchy, spacing, and composition rules specific to Fashion
    Illustration
  creative_brief: >-
    Apply Fashion Illustration as an illustration preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Runway sketch, Fashion Illustration poster hierarchy, symbolic compression, print
    surface, graphic color pressure, and editorial shape control, 9 heads tall, loose gesture,
    editorial whitespace, Paper, fashion paper tooth, watercolor accents, loose graphite
    underdrawing, and wet-dry pigment blooms around fabric edges without requiring the card image's
    original subject.
avoidRules:
