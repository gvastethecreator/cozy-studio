visualDna:
  aesthetic: 'Technical callout sheet: the subject drawn in hatched line and grey tone, with circular magnified detail views linked by leader lines.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a product-manual sheet with one hatched hero view and circular magnified callouts, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Black line and neutral grey tone on white, with one blue accent for callout circles and leader lines.
  lighting_and_shadow: Conventional upper-left light rendered as line hatching and flat grey steps, no cast environment shadows.
  texture_and_material: Clean technical line, diagrammatic hatching for curves, material shown by hatch pattern inside each callout.
  camera_and_composition: Large three-quarter hero view, three or four circular callouts around it, leader lines ending in blank tags.
  atmosphere_and_mood: Clear and instructive, every detail pointed out.
  rendering_and_quality: Manual-illustration finish with blank tags instead of words; no painted scene behind the object.
  key_features: hatched hero view; circular magnified callouts; blue leader lines; blank tags; white ground
  creative_brief: "Technical callout sheet: the subject drawn in hatched line and grey tone, with circular magnified detail views linked by leader lines. Carry it through hatched hero view, circular magnified callouts, blue leader lines, blank tags, white ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
