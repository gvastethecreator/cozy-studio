visualDna:
  aesthetic: 'Peel-Reveal Sequence: three views of one label, whole, half peeled and removed, revealing a message underneath with the same artwork kept.'
  subject_treatment: Show the prompt's label in three states, complete, corner peeled and removed to reveal the inner message, keeping artwork and text identical.
  color_and_tone: Colors kept across states, the reveal adding contrast only underneath.
  lighting_and_shadow: Constant light and minimal reflections to compare alignment.
  texture_and_material: A label of coherent thickness and a believable conceptual peel.
  camera_and_composition: Three states with a shared camera and scale and one clear peel edge.
  atmosphere_and_mood: Precise reveal and continuity, a small secret uncovered.
  rendering_and_quality: The peeled layer keeps its art and the inside is identical in every view.
  creative_brief: "Peel-Reveal Sequence: three views of one label, whole, half peeled and removed, revealing a message underneath with the same artwork kept. Carry it through three peel states, same camera, hidden message, kept artwork. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three peel states; same camera; hidden message; kept artwork
