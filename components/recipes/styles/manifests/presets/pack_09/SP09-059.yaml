visualDna:
  aesthetic: 'Soap bubbles: iridescent bubbles floating around or clinging to the target.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: iridescent soap bubbles float around and cling to the target.'
  color_and_tone: Thin-film rainbow iridescence, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Soft backlight on bubble surfaces, so the effect lights the target and casts believable local light.
  texture_and_material: Thin bubbles with swirling colors and reflections, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at a glance.
  atmosphere_and_mood: Playful, light, dreamy and delicate, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: iridescent soap bubbles; thin-film swirls; contained around the target
  creative_brief: "Soap bubbles: iridescent bubbles floating around or clinging to the target. Carry it through iridescent soap bubbles, thin-film swirls, contained around the target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
