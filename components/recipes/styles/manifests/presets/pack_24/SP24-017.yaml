visualDna:
  aesthetic: 'Mirror-maze identity: endless reflective corridors where a figure multiplies into countless copies, a few of them moving on their own.'
  subject_treatment: Place the prompt's subject inside a maze of mirrors, keeping the real subject clear among its many reflections.
  color_and_tone: Cold silver, smoky grey and dim carnival colors reflected and fading into darkness.
  lighting_and_shadow: Scattered bulbs multiplied into infinite rows, with darkness between reflections.
  texture_and_material: Old mirror glass with foxing, scratched silvering, dusty frames and fingerprints.
  camera_and_composition: Repeating reflections receding into infinity, the real figure near center.
  atmosphere_and_mood: Disorienting, lonely and uncanny, not all reflections obey.
  rendering_and_quality: Precise reflective painting with subtle inconsistencies among copies.
  creative_brief: "Mirror-maze identity: endless reflective corridors where a figure multiplies into countless copies, a few of them moving on their own. Carry it through infinite reflections, foxed mirror glass, disobedient copies, carnival bulbs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: infinite reflections; foxed mirror glass; disobedient copies; carnival bulbs
