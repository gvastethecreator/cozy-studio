  lighting_and_shadow: Soft natural light and gentle luminous glows from life forms.
  texture_and_material: Lush painted backgrounds and clean simple cel figures.
  camera_and_composition: Quiet meditative landscapes of mountains and rivers with gentle patient observation.
  atmosphere_and_mood: Keep the requested mood with serene meditative calm.
  rendering_and_quality: Serene painterly Artland television frame with lush natural detail.
  key_features: Mushishi serenity; glowing life forms; lush rural Japan; meditation
  creative_brief: "Artland Mushishi look (2005): serene rural Japan painted in lush natural detail, glowing translucent life forms, quiet healers and slow meditative pacing. Carry it through Mushishi serenity, glowing life forms, lush rural Japan, meditation. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
