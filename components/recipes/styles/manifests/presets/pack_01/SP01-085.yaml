visualDna:
  aesthetic: "Tech hardware hero: a launch-keynote product image with a dark graphite sweep and precise rim lights tracing the object's outline."
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Graphite and black, cool white edge highlights, one small electric accent.
  lighting_and_shadow: Dark ambient with two or three thin rim lights and a faint top light; edges glow, faces stay dark.
  texture_and_material: Anodized, bead-blasted or machined surfaces, clean bevels and precise joints.
  camera_and_composition: Long lens compression, object floating or resting low in frame with deep dark negative space.
  atmosphere_and_mood: Minimal and engineered, quiet confidence in precise machined form.
  rendering_and_quality: Keynote-grade retouch; no cables, dust or warm clutter.
  key_features: dark graphite sweep; precise rim-light outline; machined surfaces; long-lens compression; deep negative space
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tech Hardware Hero as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
