visualDna:
  aesthetic: >-
    Clean manga linework and deliberately placed halftone fields shape the subject through a small number
    of crisp, readable tonal steps.
  subject_treatment: >-
    Preserve the requested identity, pose and action. Use tonal patches to clarify existing planes and
    features without redesigning or adding marks to the subject.
  color_and_tone: >-
    Preserve the requested palette while grouping values into a restrained hierarchy; use halftone within
    those color families rather than replacing them with an imposed monochrome palette.
  lighting_and_shadow: >-
    Follow the requested light direction and reserve halftone for its corresponding shadow planes; avoid
    decorative tone fields that contradict the stated lighting.
  texture_and_material: >-
    Use an even, intentional screen pattern with spacing large enough to remain distinct at final size.
    Keep dot texture local to tonal areas rather than adding general grain.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop and element placement. Tone placement follows the existing
    forms and does not create panels or a new layout.
  atmosphere_and_mood: >-
    Retain the requested mood and setting; let the crisp tonal rhythm support them without adding a
    vignette or narrative device.
  rendering_and_quality: >-
    Combine a clean contour, solid shadow shapes and legible halftone areas; keep pattern frequency
    controlled to avoid moiré and preserve small-scale readability.
avoidRules:
  - moiré or dots too small to read
  - unrequested panels or vignettes
  - extra details that alter identity or function
