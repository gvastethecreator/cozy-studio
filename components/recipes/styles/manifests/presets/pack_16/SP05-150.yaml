visualDna:
  aesthetic: >-
    High-contrast digital anime organized around a clear division of value.
  subject_treatment: >-
    Keep the prompted identity, gesture and context. Use contour emphasis at existing
    boundaries.
  color_and_tone: >-
    If no palette is given, use crimson against black, bone and smoky violet as restrained
    accents; explicit colors override this scheme.
  lighting_and_shadow: >-
    Use red edge glow or ember-like highlights as light treatment on existing forms.
  texture_and_material: >-
    Keep digital ink and cel-like fills controlled; match grain and gloss to the materials
    already depicted.
  camera_and_composition: >-
    Preserve the camera. A division between light and dark can organize existing shapes
    within the supplied composition.
  atmosphere_and_mood: >-
    Suspense may come from a pause across contrasting value zones when requested; otherwise
    follow the prompt's tone.
  rendering_and_quality: >-
    Keep the crimson edge accents crisp, value zones readable and background transitions
    integrated.
  key_features: >-
    Optional crimson accent; red edge glow on existing forms; clear light-dark
    division; controlled digital contour.
  creative_brief: "Apply optional crimson edge light and divided value fields to the prompt's existing forms. Keep its scene, camera and palette intent. Use it as a reusable look on any subject."
