visualDna:
  aesthetic: 'Marker-edge sitcom cartoon: a homemade-looking TV animation drawn with dry felt markers, wobbly outlines and deliberately awkward timing.'
  subject_treatment: Keep the prompt subject, action and setting; redraw them as a hand-made marker cartoon with simple shapes, without adding characters from any existing show.
  color_and_tone: Flat marker fills with streaks, muted primaries, uncolored gaps at the edges.
  lighting_and_shadow: No rendered lighting; flat color only, occasional marker hatching for shadow.
  texture_and_material: Dry marker streaks, uneven line weight, paper tooth and slight line boil.
  camera_and_composition: Static sitcom staging, characters in a row, simple kitchen or living-room layouts.
  atmosphere_and_mood: Deadpan and awkward, humor in long pauses and shrugs.
  rendering_and_quality: Hand-drawn TV softness; not a slick vector cartoon or 3D.
  key_features: dry marker linework; streaky flat fills; line boil; static sitcom staging; awkward deadpan timing
  creative_brief: "Marker-edge sitcom cartoon: a homemade-looking TV animation drawn with dry felt markers, wobbly outlines and deliberately awkward timing. Carry it through dry marker linework, streaky flat fills, line boil, static sitcom staging, awkward deadpan timing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
