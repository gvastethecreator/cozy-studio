visualDna:
  aesthetic: 'Polar expedition punk: steam-powered ice crawlers, fur-clad explorers, frozen ships and heated tents on endless white.'
  subject_treatment: Keep the prompt's subject and setting; send it into polar cold with steam machines, sledges and frost on every surface.
  color_and_tone: Blinding white and ice blue with tarred black machines and warm lantern orange.
  lighting_and_shadow: Low polar sun with long blue shadows and lamps glowing inside frosted windows.
  texture_and_material: Frost-covered iron, fur parkas, canvas tents, sled runners and ice.
  camera_and_composition: Tiny expeditions against vast white horizons, or close frosted faces.
  atmosphere_and_mood: Brave and freezing, stubborn explorers pushing machines into places that do not want them.
  rendering_and_quality: Crisp cold illustration with frost detail and warm light accents.
  creative_brief: "Polar expedition punk: steam-powered ice crawlers, fur-clad explorers, frozen ships and heated tents on endless white. Carry it through steam ice crawlers, frost, fur parkas, lantern-lit tents. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
