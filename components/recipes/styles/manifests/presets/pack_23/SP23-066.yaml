visualDna:
  aesthetic: 'Red-and-blue penwork flourish: fine alternating red and blue pen filigree that sprouts long hairline tendrils, spirals and little beads down the margins of gothic books.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; build or surround the subject with fine red and blue pen filigree tendrils.
  color_and_tone: Vermilion red and ultramarine blue lines on pale cream vellum.
  lighting_and_shadow: No shading; line density alone makes weight, kept consistent across the whole image.
  texture_and_material: Hairline pen strokes, tiny beads, spirals and long trailing lines.
  camera_and_composition: Long vertical flows of flourish with the subject nested inside.
  atmosphere_and_mood: Keep the requested mood with delicate obsessive craft.
  rendering_and_quality: Precise hairlines with even rhythm and no blots.
  creative_brief: "Red-and-blue penwork flourish: fine alternating red and blue pen filigree that sprouts long hairline tendrils, spirals and little beads down the margins of gothic books. Carry it through red and blue filigree, hairline tendrils, spirals, pale vellum. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: red and blue filigree; hairline tendrils; spirals; pale vellum
