  aesthetic: 'Ion Lands Cloudpunk (2020) look: dense voxel cyberpunk city of stacked towers, endless rain, neon signs, flying hovercars and misty depths far below.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as small blocky voxel figures and hovercars built from visible cubes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Neon magenta, cyan and amber glowing through blue rain mist.
  lighting_and_shadow: Neon signs glowing through thick rain fog with deep dark canyons.
  texture_and_material: Visible voxel cubes, rain streaks and glowing volumetric fog.
  camera_and_composition: Third-person chase view behind a hovercar between towers.
  atmosphere_and_mood: Keep the requested mood with lonely rain-soaked melancholy.
  rendering_and_quality: Authentic voxel city indie screen with volumetric fog.
  key_features: Cloudpunk voxels; rain city; hovercars; neon fog
  creative_brief: 'Ion Lands Cloudpunk (2020) look: dense voxel cyberpunk city of stacked towers, endless rain, neon signs, flying hovercars and misty depths far below. Carry it through Cloudpunk voxels, rain city, hovercars, neon fog. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
