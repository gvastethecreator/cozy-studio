  aesthetic: 'Doug Kovacs Dungeon Crawl Classics art: expressive loose ink crowds of peasant adventurers, dungeon mayhem, sketchy energy and chaotic funnel humor.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people as expressive loose-ink crowds of peasant adventurers in chaotic dungeon mayhem. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with sketchy tone, true to the Doug Kovacs palette.
  lighting_and_shadow: Flat sketchy ink light, lit the way Doug Kovacs lights its scenes.
  texture_and_material: Black ink on cheap paper with photocopy grain and slight bleed.
  camera_and_composition: Chaotic crowd composition, framed the way Doug Kovacs composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with chaotic peasant mayhem.
  rendering_and_quality: Expressive loose dungeon crowd ink, in the recognizable hand of Doug Kovacs.
  creative_brief: "Doug Kovacs Dungeon Crawl Classics art: expressive loose ink crowds of peasant adventurers, dungeon mayhem, sketchy energy and chaotic funnel humor. Carry it through Kovacs peasant crowds, loose ink, dungeon mayhem. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
