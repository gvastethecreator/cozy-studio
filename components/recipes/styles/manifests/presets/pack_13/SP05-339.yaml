visualDna:
  aesthetic: 'Naoki Urasawa manga style, as in his long psychological suspense series: grounded realist seinen drawing where ordinary adult faces carry individual wrinkles, heavy eyelids, imperfect noses and ears, and suspense lives in one silent held reaction.'
  subject_treatment: Preserve the requested identity, count, pose and action; draw people with realistic adult proportions, small eyes, individualized features, believable hair and everyday clothing folds, never generic big-eyed anime faces.
  color_and_tone: 'Black-and-white manga page: black ink, grey screentone and paper white, with at most one pale wash of color on a single object.'
  lighting_and_shadow: Flat naturalistic light shaped by screentone gradients and solid black shadow shapes that grow heavier as the tension rises.
  texture_and_material: Clean confident G-pen contour with slight weight variation, sparse economical hatching, dot screentone, white paper showing through; drawn line art, not painting or photo.
  camera_and_composition: 'Cinematic manga panel staging: tight close-ups on a face reacting in silence, steady mid shots in ordinary streets, offices and apartment hallways.'
  atmosphere_and_mood: Keep the requested mood with quiet creeping dread under everyday human warmth.
  rendering_and_quality: Precise realist manga illustration, every face distinct and every gesture observed from life, no glossy digital polish.
  key_features: Naoki Urasawa realism; individualized adult faces; held silent reaction; screentone and hatching; ordinary settings
  creative_brief: "Naoki Urasawa manga style, as in his long psychological suspense series: grounded realist seinen drawing where ordinary adult faces carry individual wrinkles, heavy eyelids, imperfect noses and ears, and suspense lives in one silent held reaction. Carry it through Naoki Urasawa realism, individualized adult faces, held silent reaction, screentone and hatching, ordinary settings. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
