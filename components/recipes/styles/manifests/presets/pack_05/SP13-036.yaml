visualDna:
  aesthetic: 'Shingo Yamashita sakuga as in his Naruto Shippuden and Mob episodes: painterly smear frames, bold colored effect arcs, digital brush textures and high-speed swirling motion.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures dissolving into painterly smears along the arc of their motion, with limbs stretched into brush strokes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Teal and orange smears, warm flour white and bold colored arcs.
  lighting_and_shadow: Painterly light that streaks along the smear arcs.
  texture_and_material: Digital brush smears, painterly effect arcs and loose textured strokes.
  camera_and_composition: Arc-shaped motion staging that sweeps across the frame.
  atmosphere_and_mood: Keep the requested mood with swirling painterly speed.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Shingo Yamashita sakuga as in his Naruto Shippuden and Mob episodes: painterly smear frames, bold colored effect arcs, digital brush textures and high-speed swirling motion. Carry it through Shingo Yamashita smears, painterly arcs, digital brush, speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Shingo Yamashita smears; painterly arcs; digital brush; speed
