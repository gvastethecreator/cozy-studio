visualDna:
  aesthetic: >-
    Ornate dark cel illustration shaped by looping contours, repeated light echoes, and fragile
    decorative accents.
  subject_treatment: >-
    Retain the requested subject and gesture; let fine curling lines echo around existing forms
    without duplicating them.
  color_and_tone: >-
    Violet, slate, and silver organize deep values, with pale echoes kept delicate and any explicit
    colors respected.
  lighting_and_shadow: >-
    Narrow silver rims and faint repeated glints lift shadowed planes without introducing a new
    light source.
  texture_and_material: >-
    Ribbon-fine brush lines, subtle grain, and translucent washes give surfaces a fragile, carefully
    layered finish.
  camera_and_composition: >-
    Hold the requested camera; nested curves and repeated spacing guide the eye without creating a
    spiral scene.
  atmosphere_and_mood: >-
    Subdued and ornate, with unease only when the requested subject calls for it.
  rendering_and_quality: >-
    Keep focal contours crisp against softly lost edges, measured grain, and restrained highlight
    repetition.
  key_features: >-
    Violet-silver echo, fine looping linework, ornate contours, and fragile transitions from light
    into shadow.
  creative_brief: >-
    Apply the dark ornamental line and value language to the requested content while leaving its
    scene, action, and objects unchanged.
