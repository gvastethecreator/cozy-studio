visualDna:
  aesthetic: 'Hook-and-loop fastener: dense nylon hooks and loops covering the target in fuzzy and bristly zones.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in hook-and-loop fabric panels, bristly hooks and fuzzy loops."
  color_and_tone: Black, grey or bright nylon colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft raking light for micro-texture, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Nylon hooks and loops with fuzzy and bristly zones.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Tactile, odd, practical and playful, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: hook-and-loop panels; bristly hooks; fuzzy loops
  creative_brief: "Hook-and-loop fastener: dense nylon hooks and loops covering the target in fuzzy and bristly zones. Carry it through hook-and-loop panels, bristly hooks, fuzzy loops. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
