visualDna:
  aesthetic: >-
    Build graphic emphasis through partial enclosures, off-center axes, and deliberate interruptions.
    Tension comes from how forms occlude one another, not from a prescribed emblem or lore.
  subject_treatment: >-
    Preserve the requested subject, action, proportions, and identity. Let cropped contours and
    overlapping masses support its silhouette; keep defining features visible through the interruptions.
  color_and_tone: >-
    Retain the requested palette. If the prompt leaves color open, use two distinct value families and
    one limited accent; avoid assigning every image the same dark-and-metallic colors.
  lighting_and_shadow: >-
    Use occlusion to shape abrupt, non-linear shadow changes around overlaps while respecting stated
    light. Keep bright edges selective and attached to form; do not add a literal eclipse or new source.
  texture_and_material: >-
    Show local surface variation only where the requested material supports it. Keep surface variation
    localized so the main value shapes stay clean.
  camera_and_composition: >-
    Preserve the requested viewpoint and arrangement. When composition is open, place the main mass
    slightly off-axis and let a partial curve or crop establish hierarchy without requiring a circle,
    halo, or frontal icon.
  atmosphere_and_mood: >-
    Create suspense through an interrupted visual rhythm or withheld closure. Follow the requested
    emotional tone, including bright or playful treatments, without defaulting to grief or solemnity.
  rendering_and_quality: >-
    Keep the principal silhouette, overlap edges, and open spaces distinct at small size. Balance a few
    hard shadow cuts with selective material detail; avoid muddy dark masses.
avoidRules:
  - Do not complete every open curve into a seal or halo.
  - Do not let shadow or ornament close the main negative-space opening.
