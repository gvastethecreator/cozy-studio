visualDna:
  aesthetic: 'Caustic light material response: a clear or liquid target that focuses light into bright dancing networks and bands on the surfaces around it.'
  subject_treatment: Keep the prompt subject and setting; make the target (or the water or glass the prompt names) focus light into caustic patterns on nearby surfaces, without changing anything else.
  color_and_tone: Bright white-gold caustic networks, slight spectral fringes, darker surrounding surfaces.
  lighting_and_shadow: Hard light through the refracting target, caustic nets rippling across floors and walls.
  texture_and_material: Bright web-like light lines, focused hot spots, soft rainbow edges.
  camera_and_composition: Keep the requested framing; the caustic pattern visible beside the target.
  atmosphere_and_mood: Shimmering and serene, light turned into moving lace.
  rendering_and_quality: Photon-accurate caustics; distinct from the photographic glass still life in pack_01.
  key_features: caustic light networks; focused hot spots; rippling bands on nearby surfaces; spectral fringes; refracting target
  creative_brief: "Caustic light material response: a clear or liquid target that focuses light into bright dancing networks and bands on the surfaces around it. Carry it through caustic light networks, focused hot spots, rippling bands on nearby surfaces, spectral fringes, refracting target. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
