visualDna:
  aesthetic: >-
    Use radial speed lines, afterimage trails and impact bursts only to describe motion or force
    already present; keep the vectors directional and the subject readable.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: preserve the prompt palette and
    reserve high-contrast accents for force paths and contact points.
  lighting_and_shadow: >-
    Use sharp value bursts and brief edge highlights to clarify the existing vector; do not add an
    energy aura by default.
  texture_and_material: >-
    Keep speed marks fine and directional, with sparse afterimages; avoid filling the whole frame
    with line noise.
  camera_and_composition: >-
    Align radiating marks to the prompted movement or impact while preserving pose, camera and
    layout.
  atmosphere_and_mood: >-
    Kinetic intensity is a graphic rendering of the requested action, not permission to invent
    action.
  rendering_and_quality: >-
    For still subjects, retain a still composition and use line rhythm only as a subtle graphic
    treatment; add no aura or impact event. Keep important silhouettes and joins legible; no
    watermark, unrequested text or interface.
  key_features: >-
    Directional speed-line forests; impact radials; restrained afterimage trails; force vectors;
    clear silhouette.
  creative_brief: 'Apply this visual treatment to the requested content: Directional speed-line forests; impact radials; restrained afterimage trails; force vectors; clear silhouette. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - speed lines unrelated to prompted motion
  - afterimage trails detached from moving forms
  - impact radials obscuring silhouette
assets:
