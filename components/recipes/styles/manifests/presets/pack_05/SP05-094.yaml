visualDna:
  aesthetic: Comedy TV-anime cel with elastic lineart, exaggerated deadpan faces and punchy flat shapes caught on the beat just after the gag lands.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Exaggerate faces and poses, blank stares, sweat drops and flailing limbs, only around action already in the prompt; do not add a party or tavern.
  color_and_tone: Cheerful yellow, coral and aqua flats over clean mid-values; bright, simple and low in shadow density.
  lighting_and_shadow: Flat bright light with one hard cel shadow tier and quick value pops placed for emphasis.
  texture_and_material: Smooth flat fills, brisk brush flicks, speed marks and simple symbol effects drawn as shapes, never as text.
  camera_and_composition: Keep the requested view; an off-center focal point and slightly tilted framing give comic imbalance.
  atmosphere_and_mood: Light, dry and comic, a beat of awkward silence.
  rendering_and_quality: Simple readable forms, sharp accents and springy line variation, with no excess effects.
  key_features: elastic springy lineart; deadpan exaggerated faces; yellow-coral-aqua flats; sweat-drop symbol shapes; post-gag pause timing
  creative_brief: "Comedy TV-anime cel with elastic lineart, exaggerated deadpan faces and punchy flat shapes caught on the beat just after the gag lands. Carry it through elastic springy lineart, deadpan exaggerated faces, yellow-coral-aqua flats, sweat-drop symbol shapes, post-gag pause timing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
