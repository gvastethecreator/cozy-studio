visualDna:
  aesthetic: 'Shaker plain-style interior: whitewashed plaster, a continuous wooden peg rail at head height, built-in drawer walls and ladder-back furniture hung up out of the way.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Plaster white and scrubbed pine with milk-paint accents in barn red, mustard, blue-green or deep teal; muted, clear, calm.
  lighting_and_shadow: Plain daylight from evenly spaced double-hung windows, soft side shadow, chairs hanging from the rail casting clean silhouettes.
  texture_and_material: Turned maple pegs, flat-panel cherry or pine casework with small turned knobs, woven tape chair seats, oval bentwood boxes with swallowtail laps.
  camera_and_composition: Keep the requested view; frontal and symmetrical, the peg rail running across the frame as a horizon line, floor kept clear.
  atmosphere_and_mood: Orderly, honest and serene, every object earning its place.
  rendering_and_quality: Quiet daylight photograph, crisp joinery, matte milk-paint finish, no decorative clutter or ornament.
  creative_brief: "Shaker plain-style interior: whitewashed plaster, a continuous wooden peg rail at head height, built-in drawer walls and ladder-back furniture hung up out of the way. Carry it through continuous peg rail with hung chairs, built-in drawer walls, milk-paint accent colors, oval bentwood boxes, ladder-back chairs with woven tape. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
