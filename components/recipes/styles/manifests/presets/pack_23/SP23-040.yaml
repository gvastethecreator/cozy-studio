visualDna:
  aesthetic: >-
    Use decisive contours, broad matte planes and shadows built from a few clear shapes. Separate
    silhouettes by value and keep secondary texture subordinate at a consistent scale.
  subject_treatment: >-
    Preserve the requested identity, function, count, pose, action and proportions. Contours clarify
    the existing subject without imposing a regional theme or redesigning its features.
  color_and_tone: >-
    Retain the requested palette and color meaning. Organize it into broad, readable planes without
    forcing particular colors or a narrow range of hues.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Express shadows through a few deliberate forms
    while keeping the light logic consistent.
  texture_and_material: >-
    Keep broad surfaces matte and reserve texture for secondary areas. Preserve material differences
    instead of applying one texture across the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Contour and shadow
    treatment does not prescribe a camera or alter the arrangement.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. Graphic planes change the rendering, not the period,
    location or narrative.
  rendering_and_quality: >-
    Maintain clear contours, broad matte planes and a small number of shadow shapes. Keep secondary
    texture at a coherent scale and avoid visual noise.
avoidRules:
  - unrequested regional or narrative content
  - excessive texture, noisy contours or added shadow complexity
  - unrequested lettering, symbols, borders, interface or layout
