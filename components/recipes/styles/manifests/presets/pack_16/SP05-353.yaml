  color_and_tone: Night navy, headlight white, taillight red and guardrail grey.
  lighting_and_shadow: Headlight beams cutting fog, taillight streaks and dim mountain darkness.
  texture_and_material: Hand-drawn characters with glossy CG cars, painted mountain roads and motion blur.
  camera_and_composition: Drift lines through hairpins, rearview mirror shots and helicopter-like wides.
  atmosphere_and_mood: Keep the requested mood with focused nocturnal tension.
  rendering_and_quality: Classic Initial D frame mixing CG cars and hand-drawn drivers.
  key_features: Initial D touge; CG drifting cars; headlights; mountain hairpins
  creative_brief: "Initial D anime look (1998 onward): mountain touge races at night, CG cars drifting on hand-drawn roads, headlight beams, tofu-shop simplicity and eurobeat intensity. Carry it through Initial D touge, CG drifting cars, headlights, mountain hairpins. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
