visualDna:
  aesthetic: 'Adobe and Pueblo architecture: thick load-bearing walls of sun-dried adobe brick finished in earth plaster, flat roofs on projecting log vigas, stepped setback storeys and rounded parapets.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Earth plaster in the local soil colour — tan, ochre, rose-brown — with weathered grey-silver timber, deep blue or turquoise-painted doors and window frames as the only colour.
  lighting_and_shadow: High dry sun with hard shadows from projecting vigas and canales across the walls; deep dark inside small window openings.
  texture_and_material: Hand-smoothed mud plaster with soft rounded corners, round peeled-log vigas and latilla poles, wooden canales draining the roof, beehive horno ovens, wooden ladders to upper terraces.
  camera_and_composition: Keep the requested view; show the stepped setbacks and viga shadow rhythm, walls thick at openings, sky a large clear field.
  atmosphere_and_mood: Rooted, sun-baked and quiet, shelter shaped by hands and earth.
  rendering_and_quality: Clear daylight photograph with honest hand-worked plaster irregularity; no costumed figures, dreamcatchers or tourist-trade props.
  key_features: sun-dried adobe with earth plaster; projecting log vigas; stepped setback terraces with ladders; wooden canales; rounded soft parapets
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Adobe/Pueblo as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
