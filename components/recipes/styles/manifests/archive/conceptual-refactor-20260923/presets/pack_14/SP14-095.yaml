visualDna:
  aesthetic: >-
    Thorned Solar Relic Icon acts as a transferable mythic-noir router: relic sanctity and preserved
    decay plus damaged sacred-icon discipline and frontal symbolic gravity fused with symbolist
    myth-noir iconography with emblem logic, relic pressure, occult negative space, and adult
    editorial restraint; it carries symbol, omen, ritual authority, and mature editorial restraint
    without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    thorn pressure and sanctified pain translated into edge logic plus flat sacred-plane pressure
    and silhouette-as-emblem treatment; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through solar gold, blood red, obsidian black, and limestone gray plus aged gold,
    varnish brown, black shadow, and chipped ivory together with blackened neutrals, relic gold, ash
    white, bruised crimson, oxidized green, and one disciplined omen accent; values stay separated,
    accents feel intentional, and the dark palette supports the requested content rather than
    swallowing it.
  lighting_and_shadow: >-
    Use hard solar cut and corona-like edge glow plus flat gold-leaf glints with narrow sacred rim
    light with eclipse-like falloff, thin halo edges, candle-density glow, and shadow that behaves
    like symbolic weight; shadows must carry omen weight, rims should clarify form, and glow should
    behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render thorn scratches, solar relic gold, and dry black stems, tarnished metal, velvet dust,
    chipped enamel, and devotional wear plus gold leaf chips, varnish cracks, and painted relic
    surface alongside obsidian polish, ash residue, salt-bone grain, tarnished metal, wax, velvet,
    paper, and carved-stone tactility; surface scale, patina, residue, gloss, grain, and carved or
    sealed edges must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with sun-axis order and cyclical recurrence plus icon-axis balance and sacred flatness
    with shadow depth plus icon axes, seal geometry, threshold spacing, processional rhythm, and
    diagram-like symbolic hierarchy; the style should support portraits, objects, architecture,
    creatures, symbols, and full scenes through reusable spatial grammar instead of one fixed
    layout.
  atmosphere_and_mood: >-
    Carry mood through fragile reverence and dangerous inheritance plus reverence damaged by noir
    suspicion and hushed authority, occult elegance, grief, accusation, secrecy, and a sense of
    ancient systems still operating; the image can become severe, sensual, sacred, violent, quiet,
    or strange when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with crisp icon-surface recognition with controlled cracks and no readable lettering plus
    thorned recognition with denoised dark editorial polish and controlled material truth and
    denoised illustrated finish with crisp symbol reads, controlled blacks, no muddy texture paste,
    and no fake lettering; prioritize clean denoise, readable dark values, strong silhouette
    hierarchy, tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy
    black crush.
  key_features: >-
    relic sanctity and preserved decay plus damaged sacred-icon discipline and frontal symbolic
    gravity; thorn pressure and sanctified pain translated into edge logic plus flat sacred-plane
    pressure and silhouette-as-emblem treatment; thorn scratches, solar relic gold, and dry black
    stems, tarnished metal, velvet dust, chipped enamel, and devotional wear plus gold leaf chips,
    varnish cracks, and painted relic surface; hard solar cut and corona-like edge glow plus flat
    gold-leaf glints with narrow sacred rim light; sun-axis order and cyclical recurrence plus
    icon-axis balance and sacred flatness with shadow depth
  creative_brief: >-
    Apply Thorned Solar Relic Icon after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies relic sanctity and
    preserved decay plus damaged sacred-icon discipline and frontal symbolic gravity, thorn pressure
    and sanctified pain translated into edge logic plus flat sacred-plane pressure and
    silhouette-as-emblem treatment, solar gold, blood red, obsidian black, and limestone gray plus
    aged gold, varnish brown, black shadow, and chipped ivory, hard solar cut and corona-like edge
    glow plus flat gold-leaf glints with narrow sacred rim light, thorn scratches, solar relic gold,
    and dry black stems, tarnished metal, velvet dust, chipped enamel, and devotional wear plus gold
    leaf chips, varnish cracks, and painted relic surface plus sun-axis order and cyclical
    recurrence plus icon-axis balance and sacred flatness with shadow depth, finish discipline, and
    negative controls without requiring a fixed deity, ritual, prop bundle, location, or sample
    composition.
