  color_and_tone: 'Vibrating complementary colors: orange, magenta, green and violet, used consistently across subject and background.'
  lighting_and_shadow: Glow comes from color vibration, not light, expressed through the style rather than photographic lighting.
  texture_and_material: Smooth flowing paint and concentric lines, visible at a glance as the signature of the style.
  camera_and_composition: Centered, radiating composition, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Trippy, hypnotic, ecstatic and strange, driven by the construction, color and rhythm.
  rendering_and_quality: Clean psychedelic illustration, with clean, deliberate marks and no accidental noise.
  key_features: nested repeats; melting contours; paisley; vibrating colors
  creative_brief: "Psychedelic recursion: melting patterns, paisley whorls and repeating concentric forms in vibrating colors. Carry it through nested repeats, melting contours, paisley, vibrating colors. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
