schemaVersion: 1
id: SP10-046
packId: pack_10
name: Paisley Pattern
category: 5. Textile & Ornamental Patterns
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - textile-and-ornamental-patterns
visualDna:
  aesthetic: >-
    Paisley Pattern becomes a transferable textile and ornamental pattern system: start from
    Teardrop shapes, Seamless, and Pattern repeat, then route prompt content through motifs,
    repeats, weave logic, decorative grids, stitched marks, and surface ornament without forcing one
    card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Intricate floral to wrap, embroider, tile, dye,
    weave, print, or camouflage forms while preserving the prompt subject underneath; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Multi-colored; treat palette as dye, thread, ceramic pigment, woven
    banding, motif hierarchy, or cultural ornament logic, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: use soft fabric light, glazed highlights, stitch shadows,
    woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Fabric as the tactile or mark-making basis; surface detail must follow yarn, fiber,
    glaze, dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props,
    spaces, or close material studies.
  camera_and_composition: >-
    Compose around Pattern repeat as reusable spatial grammar: favor repeat rhythm, motif scale,
    borders, allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Boho, intricate as the emotional register; derive mood from craft, ritual, fashion, domestic
    texture, camouflage, ornament, or folk memory, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Textile design: finish with readable pattern scale, tactile detail, and no wallpaper
    pasted over the subject, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Teardrop shapes; Intricate floral; Multi-colored; Flat; Fabric; Pattern repeat; Boho, intricate;
    Textile design; Seamless
  creative_brief: >-
    Route any subject through Paisley Pattern as a transferable ornamental or textile visual system:
    preserve prompt intent while converting surface, motif repetition, weave, symmetry, border
    rhythm, and decorative flow through this preset. Apply paisley as ornamental flow over the input
    with bent teardrop boteh forms, intricate floral curls, multicolor textile repetition, and
    labyrinthine curves that can wrap, mask, or replace surfaces. Keep cultural ornament as pattern
    logic, not as garden setting or literal paradise illustration.
avoidRules:
  - solid color
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
