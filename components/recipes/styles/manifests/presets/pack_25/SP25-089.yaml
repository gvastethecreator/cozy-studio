visualDna:
  aesthetic: 'Inkbound Status Panels: heavy ink masses and generous voids form meters and markers, graphic and decisive without ornamental frames.'
  subject_treatment: Build the prompt's meters and markers from bold ink masses and wide voids, with clean functional edges; keep every value and label exact.
  color_and_tone: Black and bone with one small accent, states readable without color.
  lighting_and_shadow: Flat ink contrast that sets hierarchy and grouping.
  texture_and_material: Very contained print texture, kept away from numbers and meter limits.
  camera_and_composition: Compact panels with clear silhouettes and unframed data.
  atmosphere_and_mood: Graphic weight and forceful reading, bold and uncluttered.
  rendering_and_quality: The voids that encode state are never eroded by texture.
  creative_brief: "Inkbound Status Panels: heavy ink masses and generous voids form meters and markers, graphic and decisive without ornamental frames. Carry it through ink mass meters, wide voids, black and bone, small accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ink mass meters; wide voids; black and bone; small accent
