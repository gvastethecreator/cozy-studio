visualDna:
  aesthetic: Action anime where every cut explodes into sumi ink splatter and brush arcs across paper-white backgrounds.
  subject_treatment: Keep the prompt's subject and action; turn movement and impacts into brush arcs, ink splatter and dry-brush trails.
  color_and_tone: Black ink on warm paper white with a single red accent for blood or cloth.
  lighting_and_shadow: No realistic light; value comes from ink density, wet pools and dry brush.
  texture_and_material: Wet ink pools, dry-bristle streaks, splatter dots and paper grain.
  camera_and_composition: Dynamic diagonals with large empty paper areas around the action.
  atmosphere_and_mood: Explosive and stylish, every lethal movement turned into a single line of poetry.
  rendering_and_quality: Painterly anime action with bold brushwork over clean character line.
  creative_brief: Action anime where every cut explodes into sumi ink splatter and brush arcs across paper-white backgrounds. Carry it through ink splatter, brush arcs, paper white, red accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood.
