visualDna:
  aesthetic: 'Board-game terrain tile: a square or hex cardboard tile illustrated top-down with forest, river, road or ruin that can connect to neighboring tiles at its edges.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; illustrate the subject top-down on a single connectable terrain tile.
  color_and_tone: Bright clear terrain colors with defined edges, kept consistent across the whole image.
  lighting_and_shadow: Soft top-down shading, kept consistent across the whole image.
  texture_and_material: Printed cardboard, rounded corners and slight edge wear.
  camera_and_composition: Single tile seen from directly above on a table.
  atmosphere_and_mood: Keep the requested mood with cozy game-night clarity.
  rendering_and_quality: Clean readable tile with no icons or numbers.
  creative_brief: "Board-game terrain tile: a square or hex cardboard tile illustrated top-down with forest, river, road or ruin that can connect to neighboring tiles at its edges. Carry it through top-down tile, connecting edges, cardboard, terrain illustration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
