visualDna:
  aesthetic: 'Prop design presentation: one object painted to production detail in a three-quarter hero view, with smaller orthographic views and detail zooms.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a prop sheet with one isolated object in a hero view, front and side views and round detail zooms, and that layout replaces the requested framing.
  color_and_tone: True material colors on a neutral light-grey ground, with wear and patina described through small color shifts.
  lighting_and_shadow: Soft upper-left key and neutral fill, with a distinct specular response per material so metal, leather and wood separate.
  texture_and_material: 'Legible material breakdown: grain direction, edge wear, stitching, rivets and scratches placed where hands would touch.'
  camera_and_composition: Hero three-quarter view on the left, front and side orthographic views on the right, two circular detail zooms; no environment.
  atmosphere_and_mood: Tactile and storied, an object that has clearly been used.
  rendering_and_quality: Clean production finish with unlabeled callout lines, each material readable at thumbnail size.
  key_features: isolated hero three-quarter view; front and side orthographics; circular detail zooms; wear placed by use; neutral grey ground
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Prop Design as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable annotations
  - readable text
  - brand logo
  - franchise likeness
  - lone cloaked figure on a cliff edge
  - environment background
  - several unrelated props
  - background
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
