visualDna:
  aesthetic: 'Softbox studio light: large diffused sources close to the subject on a seamless backdrop, giving wraparound light and soft-edged shadows.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Clean neutral color, bright soft whites, gentle grey gradient on the seamless.
  lighting_and_shadow: Big softbox key, fill card opposite, soft contact shadow, no hard edges anywhere.
  texture_and_material: Every surface shown clearly, with long smooth highlight gradients across curves.
  camera_and_composition: Keep the requested framing; subject isolated against the seamless.
  atmosphere_and_mood: Calm and clean, attention on the subject alone.
  rendering_and_quality: Controlled studio exposure; a lighting modifier that keeps the subject unchanged.
  key_features: large softbox key; seamless backdrop; wraparound light; soft contact shadow; smooth gradients
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Softbox Studio as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
