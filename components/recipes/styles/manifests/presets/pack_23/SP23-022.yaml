visualDna:
  aesthetic: >-
    A monochrome drawing language balances assertive dark masses, open reserves and fine line detail.
    Any vegetal abstraction stays within existing surfaces that the user permits for ornament. Scope
    this study to Kelmscott Press and the nineteenth-century medieval revival; it is later book design,
    not medieval source art.
  subject_treatment: >-
    Preserve requested identity, proportions, count, action and functional details. Keep the main form
    legible before adding fine linework, and do not invent vegetation or ornament outside an existing
    or explicitly permitted surface.
  color_and_tone: >-
    Preserve the user's palette. When monochrome is requested, organize value through dark masses and
    open reserves; for a specified color palette, keep those hues and translate the same hierarchy
    without replacing them with black and white.
  lighting_and_shadow: >-
    Preserve the requested lighting and shadows. Use line density to clarify existing value structure
    without adding candlelight, a new light source or a dramatic setting.
  texture_and_material: >-
    Keep fine detail within existing permitted areas and preserve the actual materials of depicted
    subjects. Dense linework does not call for a paper surface, print distress or all-over filigree.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and arrangement. Do not convert the image into
    a book page or add margins, typography, a floral border or printer's marks.
  atmosphere_and_mood: >-
    Keep the user's setting and mood. The historical scope is the Victorian-era Kelmscott medieval
    revival, not a request for a medieval scene, manuscript text or historical props.
  rendering_and_quality: >-
    Maintain a clear hierarchy between solid dark areas, reserved light and fine detail. Keep small
    marks crisp and subordinate to the subject rather than filling every open area.
avoidRules:
  - unrequested book-page layout, typography or printer's marks
  - unrequested floral border, garden or added vegetation
  - ornament on surfaces the user has not permitted
  - false attribution of Kelmscott revival design as medieval source art
