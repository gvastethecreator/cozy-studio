visualDna:
  aesthetic: Build rough color fields from blunt patches, thick seams, frayed edges, and localized abrasion.
  subject_treatment: >-
    Preserve the requested subject and action; carry the treatment through edge wear and layered surfaces
    without imposing clothing or a pose.
  color_and_tone: >-
    Use earth-dark and faded neutral fields with sparse worn red or ochre accents; retain requested
    colors.
  lighting_and_shadow: Use broad, low-contrast shadows to separate patches and a few brighter edge breaks.
  texture_and_material: >-
    Combine coarse textile-like grain, irregular seams, and rubbed surfaces; limit wear to selected
    areas.
  camera_and_composition: >-
    Preserve crop and focal scale; group rough patches around existing contours rather than arranging a
    garment.
  atmosphere_and_mood: Suggest stubborn, weathered resistance through uneven texture and compact contrast.
  rendering_and_quality: Keep material boundaries clear and large shapes readable; avoid generalized grime.
avoidRules:
  - wear distributed equally across every surface
  - frayed marks that break subject identity
  - patches arranged as a jacket by default
