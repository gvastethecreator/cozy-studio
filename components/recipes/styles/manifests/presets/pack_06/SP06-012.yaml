visualDna:
  aesthetic: 'Aerosol spray painting: color laid in layers through cut stencils and freehand can control, with soft sprayed falloff, hard stencil edges and drips.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Saturated fluorescent and primary aerosol colors over a dark or faded fade; smooth sprayed gradients from one color to another.
  lighting_and_shadow: 'Graphic lighting in stencil layers: a dark layer, a mid layer and a sprayed highlight, with glow suggested by soft overspray halos.'
  texture_and_material: Fine speckled mist at the edge of every spray, runs and drips where paint pooled, slightly offset stencil layers on a rough painted surface.
  camera_and_composition: Keep the requested framing; the subject reads as bold layered stencil shapes against a sprayed fade background.
  atmosphere_and_mood: Urgent, loud and improvised, made fast in one session.
  rendering_and_quality: Hard stencil edges mixed with soft freehand fades, visible speckle and drips; no brush marks and no readable tags.
  key_features: layered stencil shapes; soft freehand fades; overspray speckle halos; paint drips and runs; offset registration
  creative_brief: "Aerosol spray painting: color laid in layers through cut stencils and freehand can control, with soft sprayed falloff, hard stencil edges and drips. Carry it through layered stencil shapes, soft freehand fades, overspray speckle halos, paint drips and runs, offset registration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
