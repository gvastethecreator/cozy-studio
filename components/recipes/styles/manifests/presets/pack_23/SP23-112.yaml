  aesthetic: 'Icelandic saga margin drawing: rough lively pen drawings from Icelandic manuscripts, vigorous gods, heroes and sea monsters drawn in brown ink with simple washes.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; draw the subject in vigorous brown-ink lines with rough energetic gestures.
  color_and_tone: Brown ink with faded red and green washes on yellowed vellum.
  lighting_and_shadow: No modeling beyond hatched strokes, kept consistent across the whole image.
  texture_and_material: Rough pen lines, worn vellum, stains and holes.
  camera_and_composition: Single figure or struggle filling a margin or page.
  atmosphere_and_mood: Keep the requested mood with rugged northern vigor.
  rendering_and_quality: Energetic rough drawing with strong character, kept consistent across the whole image.
  creative_brief: "Icelandic saga margin drawing: rough lively pen drawings from Icelandic manuscripts, vigorous gods, heroes and sea monsters drawn in brown ink with simple washes. Carry it through brown ink, rough vigorous line, worn vellum, sea monsters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
