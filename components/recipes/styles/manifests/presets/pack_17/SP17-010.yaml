    Transform any subject with surgical-gothic reliquary logic, glass-and-brass accents, ritual
    restraint, clinical silhouette elongation, and sacred tool geometry without imposing a fixed
    construct.
  color_and_tone: Bone white, old brass, deep umber, oxidized green, black velvet, and minimal red seals.
  lighting_and_shadow: >-
    Clear candle key light and cold window accents isolate instruments, faces, and relic silhouettes
    without murky shadows.
  texture_and_material: Glass reliquaries, polished steel, wax seals, stained parchment, aged wood, and velvet dust.
  camera_and_composition: >-
    Symmetrical close framing with shallow depth, controlled object hierarchy, clean glass
    highlights, and restrained ritual spacing.
  atmosphere_and_mood: >-
    Carry the prompt through Clinical, sacred, tense, and taboo without graphic body horror;
