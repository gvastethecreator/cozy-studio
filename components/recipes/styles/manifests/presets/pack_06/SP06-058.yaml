visualDna:
  aesthetic: '2D polygon art: a flat image divided into a mesh of triangles, each filled with the average color of that area, like a faceted mosaic.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Rich natural colors sampled into triangles, with small gradients or flat fills per facet; denser triangles at the focal area.
  lighting_and_shadow: Light and shadow come only from the colors of neighbouring triangles, creating a crystalline shimmer.
  texture_and_material: Sharp triangle edges, faint lighter seams between facets, flat 2D surface with no 3D depth.
  camera_and_composition: Keep the requested framing; triangle size shrinks at eyes and edges and grows in empty background.
  atmosphere_and_mood: Crystalline, modern and graphic, a gem-cut picture.
  rendering_and_quality: Clean triangulation with adaptive density, subject recognizable through the facets; no 3D render and no noise.
  key_features: 2D triangle mesh; averaged color per facet; adaptive triangle density; faint facet seams; crystalline shimmer
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Polygon Art as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
