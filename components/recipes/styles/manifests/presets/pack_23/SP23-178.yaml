  aesthetic: 'Scrolling-texture water world: early 3D seas, rivers and waterfalls made of a single looping texture sliding across flat polygons, glossy and hypnotic.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; surround the subject with flat water surfaces covered in a looping scrolling texture.
  color_and_tone: Saturated turquoise and blue with white foam patterns.
  lighting_and_shadow: Flat bright water with simple highlights, kept consistent across the whole image.
  texture_and_material: Repeating wave textures, flat water planes and pixel foam.
  camera_and_composition: Wide view of sea, rivers or waterfalls, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with hypnotic looping calm.
  rendering_and_quality: Clean repeating water with visible tiling, kept consistent across the whole image.
  creative_brief: "Scrolling-texture water world: early 3D seas, rivers and waterfalls made of a single looping texture sliding across flat polygons, glossy and hypnotic. Carry it through looping water texture, flat planes, waterfall strips, visible tiling. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: looping water texture; flat planes; waterfall strips; visible tiling
