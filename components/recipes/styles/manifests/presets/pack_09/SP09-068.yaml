visualDna:
  aesthetic: 'Cooled lava rock: porous black-red basalt scoria with vesicles and ropy flow texture.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of cooled lava rock with vesicles and ropy flow texture.'
  color_and_tone: Charcoal black, rust red and ash grey, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Hard side light revealing pores, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Vesicular basalt, scoria and ropy pahoehoe flow, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Harsh, volcanic, primal and rough, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: porous lava rock; vesicles; ropy flow; charcoal and rust
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Lava Rock (Cooled) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
