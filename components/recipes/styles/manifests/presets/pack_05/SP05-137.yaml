visualDna:
  aesthetic: 'Inventor adventure anime: clean cel figures overlaid with faint chalk schematic strokes, construction lines, cross-sections, arcs and dimension ticks without numbers.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Mineral green, chalk white, warm mineral gold and dark ink.
  lighting_and_shadow: Clear pale highlights and stable dark value anchors; chalk lines stay unlit and flat.
  texture_and_material: Chalky dusty strokes over smooth cel fields, lightly granular color.
  camera_and_composition: Keep the requested framing; diagram-like layered spacing with open margins for the schematic lines.
  atmosphere_and_mood: Practical optimism and restless curiosity, every problem already half sketched into a solution.
  rendering_and_quality: Legible construction lines, mineral color and restrained chalk texture, never a readable formula.
  key_features: chalk schematic overlay; unnumbered dimension ticks; mineral green and chalk white; clean cel figures; open diagram margins
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chalk-Schematic Inventor Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
