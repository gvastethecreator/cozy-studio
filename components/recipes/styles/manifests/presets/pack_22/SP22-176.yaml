visualDna:
  aesthetic: >-
    Soft lithographic drawing builds continuous modeled transitions with hand-drawn grain and edges
    that vary in density rather than using a universal screen.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Let drawn transitions describe
    existing form without losing small defining details.
  color_and_tone: >-
    Keep the requested palette and color relationships. Use smooth transitions within the specified
    colors without limiting their number or imposing a monochrome palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Shape gradual transitions around existing
    light and shadow without adding a new source or uniform tone overlay.
  texture_and_material: >-
    Keep grain hand-drawn and selective, varied with the form. Avoid mechanical halftone dots and
    any global aged-paper surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Soft transitions do not add a page,
    border, lettering or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Drawn grain changes the surface treatment without changing
    content or context.
  rendering_and_quality: >-
    Establish large forms and contours, then use gradual drawn transitions with variable edge density.
    Keep small marks crisp enough to retain their identity.
avoidRules:
  - universal mechanical halftone or CMYK dots
  - forced monochrome or unrequested surface aging
  - unrequested page, border, lettering, or period motifs
