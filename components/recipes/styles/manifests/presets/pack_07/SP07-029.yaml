visualDna:
  aesthetic: >-
    Adobe/Pueblo acts as a transferable architecture/interior router: thick limewashed earthen
    walls, deep window reveal, rounded plaster edge, timber/viga rhythm, warm clay pigments; fuse it
    with architectural movement grammar with tectonic mass, historical or speculative lineage,
    facade logic, ornament discipline, and structural silhouette; route spatial grammar, material
    behavior, scale, ornament, and light over prompt X without requiring the default sample anchor,
    fixed spatial set, landscape setup, or object sample.
  subject_treatment: >-
    Preserve prompt subject, action, and context while translating any requested subject through
    load-bearing mass, edge profile, facade rhythm, historic proportion, structural jointing, and
    movement-specific silhouette translation; treat thick limewashed earthen walls, deep window
    reveal, rounded plaster edge, timber/viga rhythm, warm clay pigments as massing, edge, surface,
    joinery, threshold, or ornament behavior rather than a mandatory building scene.
  color_and_tone: >-
    Map color through period or movement-authentic base color, stone or envelope values, restrained
    accent hierarchy, metal or glass notes, and clear mass separation; let source cues such as thick
    limewashed earthen walls, deep window reveal, rounded plaster edge, timber/viga rhythm, warm
    clay pigments decide accent hierarchy, material temperature, and value separation while staying
    attached to the requested content.
  lighting_and_shadow: >-
    Use raking architectural light, deep reveal shadow, facade-edge rim, material bounce, and
    scale-defining contrast; make light reveal joints, relief, material depth, scale, and atmosphere
    from thick limewashed earthen walls, deep window reveal, rounded plaster edge, timber/viga
    rhythm, warm clay pigments without replacing prompt X with a stock architectural render.
  texture_and_material: >-
    Render stone, concrete, plaster, timber, glass, metal, masonry, tile, craft detail, weathering,
    and envelope surface response; prioritize the tactile signals in thick limewashed earthen walls,
    deep window reveal, rounded plaster edge, timber/viga rhythm, warm clay pigments, with
    believable surface response, denoised grain, coherent wear, and no generic wallpaper texture.
  camera_and_composition: >-
    Frame through elevation fragments, sectional cuts, cropped facade anchors, axial or broken
    symmetry, scale cues, and movement-readable massing; convert thick limewashed earthen walls,
    deep window reveal, rounded plaster edge, timber/viga rhythm, warm clay pigments into reusable
    perspective, crop, depth, section, modular rhythm, and negative-space rules instead of one fixed
    style sample layout.
  atmosphere_and_mood: >-
    Carry mood through historical authority, civic ambition, domestic craft, experimental
    instability, or optimistic futurity carried by architecture itself; the preset can support
    adult, strange, sensual, severe, playful, ominous, quiet, or monumental prompts when prompt X
    asks for them while keeping the architectural identity readable.
  rendering_and_quality: >-
    Finish with clean built-form finish with readable structure, no postcard landmark dependency, no
    tourist facade copy, and no text or logo artifacts; keep clean denoise, legible construction,
    stable object or anatomy structure when applicable, no watermark, no fake readable text, no
    logo, no camera prop, and no prompt-literal card copy.
  key_features: >-
    thick limewashed earthen walls, deep window reveal, rounded plaster edge, timber/viga rhythm,
    warm clay pigments; load-bearing mass, edge profile, facade rhythm, historic proportion,
    structural jointing, and movement-specific silhouette translation; stone, concrete, plaster,
    timber, glass, metal, masonry, tile, craft detail, weathering, and envelope surface response;
    elevation fragments, sectional cuts, cropped facade anchors, axial or broken symmetry, scale
    cues, and movement-readable massing
  creative_brief: >-
    Apply Adobe/Pueblo after prompt X as a transferable architecture/interior style layer: prompt X
    supplies subject, action, setting, tone, and intensity, while this preset supplies thick
    limewashed earthen walls, deep window reveal, rounded plaster edge, timber/viga rhythm, warm
    clay pigments, architectural movement grammar with tectonic mass, historical or speculative
    lineage, facade logic, ornament discipline, and structural silhouette, material discipline,
    spatial grammar, and negative controls without requiring a single spatial sample, product-photo
    setup, aisle-like default, or empty abstraction.
