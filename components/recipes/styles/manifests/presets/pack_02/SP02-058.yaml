visualDna:
  aesthetic: 'X-ray radiograph: dense material blocks the beam and shows bright, thin material lets it through and stays dark, revealing the inside of the subject as a glowing negative.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Blue-black film base with bone-white and pale cyan densities; no other color.
  lighting_and_shadow: No surface light at all; brightness equals material density along the beam.
  texture_and_material: Translucent overlapping layers, crisp edges on metal and bone, faint film grain and scatter haze.
  camera_and_composition: Flat projection straight through the subject, centered on a dark film sheet.
  atmosphere_and_mood: Clinical and eerie, the hidden inside of familiar things laid bare.
  rendering_and_quality: Credible radiograph film look; a shader version lives in pack_03 and a playful one in pack_11.
  key_features: density shown as brightness; blue-black film; bone-white metal and bone; overlapping translucency; interior structure
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies X-Ray Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
