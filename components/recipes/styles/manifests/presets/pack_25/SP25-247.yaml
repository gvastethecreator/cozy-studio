visualDna:
  aesthetic: 'Counterform Branch Networks: branches and masses placed so the spaces between them form a second continuous network.'
  subject_treatment: Build a repeating surface from the prompt's subject where the spaces between the masses form a second continuous network of steady width.
  color_and_tone: Two balanced values letting figure and ground swap readings.
  lighting_and_shadow: Flat surface with figure and ground equally sharp.
  texture_and_material: Continuous edges and wide openings with no detail breaking the negative network.
  camera_and_composition: Both networks linked across tile edges with no dead ends.
  atmosphere_and_mood: Controlled ambiguity between full and empty, quietly hypnotic.
  rendering_and_quality: Clean repeat with stable negative widths in both polarities.
  creative_brief: "Counterform Branch Networks: branches and masses placed so the spaces between them form a second continuous network. Carry it through positive and negative networks, steady gaps, linked edges, two values. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: positive and negative networks; steady gaps; linked edges; two values
