visualDna:
  aesthetic: >-
    Animation-style drawing pairs a flexible, depth-aware line with clean color fills and one or two
    deliberately designed shadow steps instead of automatic tonal shading.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, expression and action. Keep defining features
    original to the request; do not borrow recognizable character traits.
  color_and_tone: >-
    Separate the requested colors into clear fill regions and concise shadow shapes. Preserve local color
    relationships instead of introducing a fixed palette.
  lighting_and_shadow: >-
    Follow the requested lighting direction and value pattern. Translate shadows into a small number of
    designed shapes without inventing a new source or flattening explicit lighting cues.
  texture_and_material: >-
    Keep fills clean and avoid a global texture overlay. Preserve material distinctions through the
    requested color and shadow shapes rather than adding surface noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. A cel-rendered image does not
    require an animation layout or a new pose.
  atmosphere_and_mood: >-
    Keep the requested tone. Simplified drawing and shading do not prescribe a character type, expression
    or story setting.
  rendering_and_quality: >-
    Vary line weight to clarify overlap and depth, then keep fill edges and shadow boundaries intentional.
    Avoid gradients and texture that compete with the line hierarchy.
avoidRules:
  - borrowed franchise-specific features
  - global texture or soft gradient shading
