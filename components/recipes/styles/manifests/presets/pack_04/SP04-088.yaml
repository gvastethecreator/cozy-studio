visualDna:
  aesthetic: 'Rough environment pass: the location blocked in with three to five flat lasso-cut value planes stacked in depth, one focal light and almost no texture.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: Near-monochrome planes stepping from dark foreground to pale background, one tint per plane and a single bright focal light.
  lighting_and_shadow: One large light source such as a sky gap, sun shaft or glow defines the focal point, planes silhouetted against it.
  texture_and_material: Hard lasso edges and gradient fills, a touch of textured brush at plane edges, no surface detail.
  camera_and_composition: Keep the requested view; big-shape hierarchy with a dark foreground framing mass and strong recession.
  atmosphere_and_mood: Monumental and quiet, scale decided before detail.
  rendering_and_quality: Early blockout finish, shapes readable at thumbnail size and nothing resolved; distinct from brush-led speedpainting.
  key_features: three to five flat value planes; lasso-cut edges; gradient fills; single focal light; no surface detail
  creative_brief: "Rough environment pass: the location blocked in with three to five flat lasso-cut value planes stacked in depth, one focal light and almost no texture. Carry it through three to five flat value planes, lasso-cut edges, gradient fills, single focal light, no surface detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
