visualDna:
  aesthetic: 'Colorway Family Study: one locked pattern shown in several colorways in equal panels, roles of figure, ground and accent kept in each.'
  subject_treatment: Show the prompt's pattern in three or four colorways in equal panels, geometry locked and the roles of figure, ground and accent kept.
  color_and_tone: Each colorway defined by value and saturation relationships.
  lighting_and_shadow: Identical, even support light in every one of the panels.
  texture_and_material: The same art, masks and finish in every colorway.
  camera_and_composition: Equal panels at one scale and crop with a small palette key.
  atmosphere_and_mood: A color family with distinct personalities and clear kinship.
  rendering_and_quality: Identical coverage and readable detail in every variant.
  creative_brief: "Colorway Family Study: one locked pattern shown in several colorways in equal panels, roles of figure, ground and accent kept in each. Carry it through equal colorway panels, locked geometry, kept roles, palette key. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal colorway panels; locked geometry; kept roles; palette key
