visualDna:
  aesthetic: >-
    Broad marker passes establish the main color planes, with finer ink drawing layered over them to
    define form and selective detail.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Build the existing forms with broad
    color strokes and fine ink accents without adding motion or props.
  color_and_tone: >-
    Retain the requested palette in distinct marker layers; allow darker overlaps to deepen where passes
    cross without introducing arbitrary accent colors.
  lighting_and_shadow: >-
    Follow the requested light direction and represent its shadow planes through controlled marker
    layering; do not add bursts or dramatic light effects.
  texture_and_material: >-
    Show discreet, directional marker bands and slight overlap accumulation. Keep the strokes deliberate,
    with no random splatter, and preserve the depicted material cues.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and arrangement. Tool marks should follow existing shapes without
    shifting or crowding the composition.
  atmosphere_and_mood: >-
    Preserve the requested environment and emotional tone. The hand-rendered marker surface does not
    imply an explosion, impact scene or extra background event.
  rendering_and_quality: >-
    Separate broad marker masses from fine ink accents; maintain clean focal features and controlled
    overlaps so the layered process remains clear at card scale.
avoidRules:
  - unrequested explosive backgrounds or splashes over focal features
  - extra details that alter identity or function
