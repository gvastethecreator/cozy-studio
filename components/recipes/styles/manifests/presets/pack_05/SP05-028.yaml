visualDna:
  aesthetic: 'Road-movie anime: dry brush lines with imperfect tapered ends, flattened slightly oversized forms, dusty grain and long landscapes crossed on foot.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Dusty ochre and sepia against pale cyan sky and deep brown shadow.
  lighting_and_shadow: Late sun in warm and cool value bands with minimal internal shading.
  texture_and_material: Scratched brush edges over subtle analog grain, with clean resting areas.
  camera_and_composition: Keep the requested framing; off-axis focal weight, broad quiet margins and low wide horizons.
  atmosphere_and_mood: Laid-back confidence on a long road, time moving slowly under a wide sky.
  rendering_and_quality: Subdued color, visible brush grain and uncluttered silhouettes.
  key_features: dry brush line; dusty ochre and sepia; long low horizons; analog grain; off-axis focal weight
  creative_brief: "Road-movie anime: dry brush lines with imperfect tapered ends, flattened slightly oversized forms, dusty grain and long landscapes crossed on foot. Carry it through dry brush line, dusty ochre and sepia, long low horizons, analog grain, off-axis focal weight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
