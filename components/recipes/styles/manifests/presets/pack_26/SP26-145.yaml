  lighting_and_shadow: Flat pastel digital light, lit the way Vaporwave 2015 lights its scenes.
  texture_and_material: Glitch artifacts and low-res JPEG, with the surface finish of Vaporwave 2015.
  camera_and_composition: Collaged digital composition, framed the way Vaporwave 2015 composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with melancholy ironic nostalgia.
  rendering_and_quality: Faithful vaporwave cover design, in the recognizable hand of Vaporwave 2015.
  creative_brief: "Vaporwave cover look of the 2010s: low-poly marble busts, glitched Windows 95 windows, pastel pink and teal, dead-mall photos, palm trees and full-width Japanese-style characters as decoration. Carry it through Vaporwave marble bust, pastel glitch, dead mall. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
