visualDna:
  aesthetic: >-
    Semi-realistic painting reduces forms to broad structural planes and clearly separated shape groups,
    with edge hardness changing where forms overlap.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify secondary forms while keeping
    construction, silhouette and identifying features intact.
  color_and_tone: >-
    Organize contrast hierarchically so major value masses separate at a glance. Keep the requested hues
    and material colors.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow placement. Express them through broad plane changes
    without adding a dramatic rim light or new source.
  texture_and_material: >-
    Keep brushwork restrained and surface detail sparse. Retain the character of each requested material
    without overlaying fine texture across the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not introduce an unrequested
    low angle or heroic restaging.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. Broad value shapes do not add a battle, landmark or heroic tone.
  rendering_and_quality: >-
    Maintain a readable silhouette and distinct large value groups, varying edge hardness by overlap.
    Limit high-frequency texture so the main forms remain clear at small display sizes.
avoidRules:
  - unrequested low-angle restaging
  - uniform high-frequency texture
