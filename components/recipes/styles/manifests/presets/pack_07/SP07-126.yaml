visualDna:
  aesthetic: 'Hobby scenic layout: the subject set on a baseboard landscape of static-grass flock, lichen and clump-foliage trees, plaster rock castings and a painted sky backdrop.'
  subject_treatment: Keep the requested subject, its identity and pose; this preset owns the scenic baseboard setting with its cut edge and backdrop, and a requested object stays that object instead of becoming a building.
  color_and_tone: Slightly too-uniform flock greens, dry-brushed grey rock, ochre paths and a soft painted blue backdrop.
  lighting_and_shadow: Even overhead layout lighting with soft shadows; faint seam where the backdrop meets the scenery.
  texture_and_material: Upright static-grass fibres, sponge-like foliage clumps, dry-brushed plaster rock, gloss resin water.
  camera_and_composition: Eye-level at model scale, with the cut edge of the baseboard visible at one side to reveal the model.
  atmosphere_and_mood: Quiet, loving and orderly, a landscape built on evenings and weekends.
  rendering_and_quality: Photograph of a real hobby layout; the flock and foliage read as model materials, not real grass.
