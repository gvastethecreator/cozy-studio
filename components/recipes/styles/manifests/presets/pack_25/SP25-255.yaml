visualDna:
  aesthetic: 'Stitched Line Topologies: apparent stitch paths form nodes, loops and links with a consistent stitch length and traceable routes.'
  subject_treatment: Build a repeating surface from the prompt's subject as apparent stitch paths forming nodes and loops, one stitch length and every route traceable.
  color_and_tone: One or two thread colors, crossings also shown by direction or break.
  lighting_and_shadow: Very soft raking light, the route still clear when flat.
  texture_and_material: Simplified stitches and steady spacing with relief kept subtle.
  camera_and_composition: Routes grouped in open fields with connectable edges.
  atmosphere_and_mood: A regular handmade rhythm, neither rigid nor chaotic.
  rendering_and_quality: Clean pattern with legible knots that stays calm when reduced.
  creative_brief: "Stitched Line Topologies: apparent stitch paths form nodes, loops and links with a consistent stitch length and traceable routes. Carry it through stitch routes, nodes and loops, steady stitch length, traceable paths. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
