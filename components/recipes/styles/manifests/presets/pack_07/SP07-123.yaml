visualDna:
  aesthetic: 'Paper quilling: the subject formed from narrow paper strips rolled into tight coils, teardrops and scrolls, glued edge-up onto a backing board as a shallow relief.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Bright graded strip colors against a plain white or black backing; gradients built strip by strip.
  lighting_and_shadow: Low side light so every coil casts a thin crescent shadow and the relief reads in depth.
  texture_and_material: Paper strip edges only, tight and loose coils, pinched teardrop and eye shapes, tiny glue gaps.
  camera_and_composition: Keep the requested view flattened into a frontal relief on the board, slightly angled to show the strip height.
  atmosphere_and_mood: Delicate, joyful and meticulous, drawing made with rolled paper.
  rendering_and_quality: Macro photograph of a real quilled relief; strip edges crisp, no printed paper surfaces.
