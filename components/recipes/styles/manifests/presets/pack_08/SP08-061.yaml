  creative_brief: "Lace garments: openwork lace with floral motifs that reveals layers and skin through delicate patterns. Carry it through openwork lace, floral motifs, scalloped edges, backlit pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
