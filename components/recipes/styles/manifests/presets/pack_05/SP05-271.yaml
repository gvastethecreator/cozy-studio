  camera_and_composition: Road-trip wides through ruins and eerie mystery reveals.
  atmosphere_and_mood: Keep the requested mood with sunlit uneasy mystery.
  rendering_and_quality: Bright Production I.G television frame with nature-reclaimed ruins.
  key_features: Overgrown concrete; post-collapse Japan; sunlit mystery; road trip
  creative_brief: "Production I.G Heavenly Delusion look (2023): post-collapse Japan reclaimed by nature, sunlit overgrown concrete, eerie monsters and mystery-laced road trips. Carry it through Overgrown concrete, post-collapse Japan, sunlit mystery, road trip. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
