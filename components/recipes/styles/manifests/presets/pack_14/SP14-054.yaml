visualDna:
  aesthetic: >-
    Oracle Wind Legal Instrument acts as a transferable mythic-noir router: oracle translated into
    dark symbolic behavior, wind translated into dark symbolic behavior plus legal translated into
    dark symbolic behavior fused with Greek epic noir with bronze law, laurel governance, oracle
    fragments, maritime strategy, and sun-struck fatalism; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    oracle shaping silhouette rhythm, contour pressure, and symbolic edge control, wind shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus legal shaping silhouette
    rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette pressure,
    emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or
    prop set.
  color_and_tone: >-
    Map color through oracle-weighted accent roles over disciplined dark values, wind-weighted
    accent roles over disciplined dark values plus legal-weighted accent roles over disciplined dark
    values together with Aegean blue-black, bronze, marble ivory, olive green, red thread, smoke
    gray, laurel shadow, and harsh dawn gold; values stay separated, accents feel intentional, and
    the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use oracular glow, smoke-veiled highlights, and hidden source illumination plus thin moving
    highlights through smoke or dust with hard dawn planes, oracle smoke glow, bronze bounce,
    sea-haze contrast, and severe sculptural shadow; shadows must carry omen weight, rims should
    clarify form, and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render ash, smoke, polished bowl surfaces, and old paper, wind-inflected patina, residue, grain,
    and tactile edge behavior plus legal-inflected patina, residue, grain, and tactile edge behavior
    alongside bronze patina, marble dust, olive wood, red thread fiber, sailcloth, ash, salt,
    engraved stone, and spear-edge glints; surface scale, patina, residue, gloss, grain, and carved
    or sealed edges must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with invisible force lines and fluttering document rhythm plus document-like hierarchy and
    rule-bound spacing plus frieze order, labyrinth logic, oath-line diagonals, public-measure
    spacing, and monument-like silhouette balance; the style should support portraits, objects,
    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through prophecy, secrecy, and official ambiguity plus instrumental law and oracle
    procedure and tragic law, public honor, strategic pressure, fatal prophecy, disciplined return,
    and unsentimental heroic aftermath; the image can become severe, sensual, sacred, violent,
    quiet, or strange when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with oracle recognition with denoised dark editorial polish and controlled material truth
    plus wind recognition with denoised dark editorial polish and controlled material truth and
    classical-noir illustration with crisp profiles, restrained grain, readable metal, and no
    museum-label text; prioritize clean denoise, readable dark values, strong silhouette hierarchy,
    tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    oracle translated into dark symbolic behavior, wind translated into dark symbolic behavior plus
    legal translated into dark symbolic behavior; oracle shaping silhouette rhythm, contour
    pressure, and symbolic edge control, wind shaping silhouette rhythm, contour pressure, and
    symbolic edge control plus legal shaping silhouette rhythm, contour pressure, and symbolic edge
    control; ash, smoke, polished bowl surfaces, and old paper, wind-inflected patina, residue,
    grain, and tactile edge behavior plus legal-inflected patina, residue, grain, and tactile edge
    behavior; oracular glow, smoke-veiled highlights, and hidden source illumination plus thin
    moving highlights through smoke or dust; invisible force lines and fluttering document rhythm
    plus document-like hierarchy and rule-bound spacing
  creative_brief: >-
    Apply Oracle Wind Legal Instrument after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies oracle translated
    into dark symbolic behavior, wind translated into dark symbolic behavior plus legal translated
    into dark symbolic behavior, oracle shaping silhouette rhythm, contour pressure, and symbolic
    edge control, wind shaping silhouette rhythm, contour pressure, and symbolic edge control plus
    legal shaping silhouette rhythm, contour pressure, and symbolic edge control, oracle-weighted
    accent roles over disciplined dark values, wind-weighted accent roles over disciplined dark
    values plus legal-weighted accent roles over disciplined dark values, oracular glow,
    smoke-veiled highlights, and hidden source illumination plus thin moving highlights through
    smoke or dust, ash, smoke, polished bowl surfaces, and old paper, wind-inflected patina,
    residue, grain, and tactile edge behavior plus legal-inflected patina, residue, grain, and
    tactile edge behavior plus invisible force lines and fluttering document rhythm plus
    document-like hierarchy and rule-bound spacing, finish discipline, and negative controls without
    requiring a fixed deity, ritual, prop bundle, location, or sample composition.
