visualDna:
  aesthetic: >-
    Fashion-illustration anime line combines long angular strokes, crisp silhouette cuts,
    and narrow seam detail.
  subject_treatment: >-
    Keep figure, garment, and pose; draw seams only on clothing the prompt supplies.
  color_and_tone: >-
    Black, electric teal, acid lime, muted violet, silver; bright planes stay selective.
  lighting_and_shadow: >-
    Hard specular accents against matte shadows; reflections only on supporting surfaces.
  texture_and_material: >-
    Fine stitches on existing textiles and matte treatment elsewhere; no wardrobe
    substitution.
  camera_and_composition: >-
    Preserve crop; diagonal silhouette rhythm only where requested gesture allows.
  atmosphere_and_mood: >-
    Let line contrast suggest elegance or abrasion without imposing a runway scene.
  rendering_and_quality: >-
    Sharp edges, thin accents, controlled reflectance, no all-over gloss.
  key_features: >-
    Angular editorial line, selective stitch detail, electric accents, matte-gloss contrast
  creative_brief: 'Apply a visual treatment centered on angular editorial line, selective stitch detail, electric accents, matte-gloss contrast. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
