visualDna:
  aesthetic: 'Blackwater photography: open ocean at night, with tiny drifting larvae and gelatinous creatures lit by a narrow strobe against total black.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Pure black background, translucent bodies with iridescent blue, orange and violet accents.
  lighting_and_shadow: Snooted strobe from the side, lighting only the creature; no ambient light.
  texture_and_material: Transparent tissue, glowing organs, fine cilia and fins resolved crisply.
  camera_and_composition: Macro lens, creature centered and floating, no seabed or surface visible.
  atmosphere_and_mood: Alien and fragile, strange life drifting through the void.
  rendering_and_quality: Clean black water with no backscatter; not the sunlit blue of daytime underwater.
  creative_brief: "Blackwater photography: open ocean at night, with tiny drifting larvae and gelatinous creatures lit by a narrow strobe against total black. Carry it through total black water, snooted strobe, translucent larvae, iridescent accents, floating macro subject. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: total black water; snooted strobe; translucent larvae; iridescent accents; floating macro subject
