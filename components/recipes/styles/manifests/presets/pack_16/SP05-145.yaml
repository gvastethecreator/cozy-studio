visualDna:
  aesthetic: >-
    A gentle digital-anime finish built from fine contours, smooth transitions
    and integrated background paint.
  subject_treatment: >-
    Preserve the prompt's identity, pose and action. Keep contour emphasis light and
    expression readable.
  color_and_tone: >-
    If color is unspecified, use soft blush, open blue and warm highlights as optional
    accents; obey any requested palette.
  lighting_and_shadow: >-
    Favor gentle highlight transitions and clear soft shadow while respecting the requested
    light direction.
  texture_and_material: >-
    Use smooth digital fills and softly integrated background paint; follow the materials
    actually present.
  camera_and_composition: >-
    Keep the requested viewpoint and staging; maintain the supplied action and subject
    relationships.
  atmosphere_and_mood: >-
    A sense of lift or momentum may support a compatible prompt; its emotional tone remains
    prompt-led.
  rendering_and_quality: >-
    Keep the subject contours clean and background transitions soft without flattening
    depth.
  key_features: >-
    Fine contours; gentle color transitions; optional blush-blue-warm accents; clear
    integration with painted backgrounds.
  creative_brief: >-
    Apply the fine line, soft transitions and optional warm accents to the existing scene.
    Preserve the prompt's content and camera.
