visualDna:
  aesthetic: >-
    MOBA Splash Rendering acts as a transferable art-medium router: start from Premium MOBA splash
    art rendering with heroic readability, sculpted form language, and ability color drama,
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Elevate any subject into a readable champion like focal
    form with exaggerated silhouette logic and clear role cues; preserve the prompt subject while
    routing it through tile readability, icon clarity, splash rendering, interface material, sprite
    bounce, shadow zones, or encounter pressure, keeping the requested identity, silhouette, pose,
    object function, or environment legible.
  color_and_tone: >-
    Build color with Rich complementary palette, one dominant ability hue, cinematic darks, and
    polished high saturation accents; use color as gameplay hierarchy: rarity glow, faction
    contrast, tactical coding, seasonal warmth, horror warmth, neon route color, or readable
    inventory material, with deliberate value grouping, accent control, and medium-specific limits
    rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Multi source rim lighting, spell like bloom accents, deep shadow carving,
    and luminous focal gradients; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Smooth digital paint, sharpened material reads, brushed energy trails, and controlled
    polish on focal surfaces; surface detail should support genre grammar through parchment, HUD
    glass, pixel atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade
    material, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Diagonal splash composition, low to mid heroic angle, large shape
    hierarchy, and strong poster crop; compose through gameplay-facing hierarchy, atlas consistency,
    menu rhythm, parallax layers, tactical grid, encounter scale, or selection-screen energy, with
    scale, spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Epic, competitive, high skill fantasy without requiring heroes, battles, weapons,
    or contest geometry; derive mood from playable stakes, collection desire, tactical control, cozy
    routine, survival dread, arcade speed, or heroic confrontation, letting the medium alter
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Finished key art quality, crisp focal detail, controlled atmospheric depth, no UI or
    title text; finish with game-production clarity, strong silhouettes, controlled UI-like detail,
    and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and enough
    craft evidence to make the medium recognizable.
  key_features: >-
    Premium MOBA splash art rendering with heroic readability, sculpted form language, and ability
    color drama; gameplay-readable hierarchy, genre-specific surface language, UI-aware composition,
    and production-art clarity; Rich complementary palette, one dominant ability hue, cinematic
    darks, and polished high saturation accents; Smooth digital paint, sharpened material reads,
    brushed energy trails, and controlled polish on focal surfaces; Diagonal splash composition, low
    to mid heroic angle, large shape hierarchy, and strong poster crop
  creative_brief: >-
    Apply MOBA Splash Rendering as an art-style preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Premium MOBA splash art rendering with heroic readability, sculpted form language, and ability
    color drama, gameplay-readable hierarchy, genre-specific surface language, UI-aware composition,
    and production-art clarity, Smooth digital paint, sharpened material reads, brushed energy
    trails, and controlled polish on focal surfaces without requiring the card image's original
    subject.
