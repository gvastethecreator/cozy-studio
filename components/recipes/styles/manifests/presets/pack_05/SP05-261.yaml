visualDna:
  aesthetic: 'OLM Berserk television look (1997): muted medieval war palettes, painted freeze-frame stills in dramatic moments, stoic mercenaries, grim castles and a heavy tragic fate.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with nineties realistic designs, heavy medieval armor and cloaks, stoic scarred faces and restrained gestures. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted mud brown, iron grey, dried blood red and cold dusk blue across the whole frame.
  lighting_and_shadow: Overcast battlefield light, torch-lit castle halls and an ominous eclipse glow at climaxes.
  texture_and_material: Late-nineties cel animation with limited movement and painted freeze-frame stills at key moments.
  camera_and_composition: Somber medieval compositions with painted still frames used for the most dramatic beats.
  atmosphere_and_mood: Keep the requested mood with heavy tragic fatalism.
  rendering_and_quality: Somber late-1990s television frame with painted dramatic freeze frames.
  key_features: Berserk 1997 muted palette; painted freeze frames; grim medieval war; eclipse omen
  creative_brief: "OLM Berserk television look (1997): muted medieval war palettes, painted freeze-frame stills in dramatic moments, stoic mercenaries, grim castles and a heavy tragic fate. Carry it through Berserk 1997 muted palette, painted freeze frames, grim medieval war, eclipse omen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
