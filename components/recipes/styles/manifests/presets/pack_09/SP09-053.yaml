visualDna:
  aesthetic: 'Smoke and fog: curling smoke rising from or wrapping the target in soft volumes.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: smoke curls from the target and wraps it loosely without hiding it.'
  color_and_tone: Grey, white or tinted smoke, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Backlight and side light revealing smoke volumes, so the effect lights the target and casts believable local light.
  texture_and_material: Curling smoke wisps and soft volumes, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Mysterious, soft, drifting and quiet, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: curling smoke wisps; soft volumes; contained around the target
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Smoke/Fog as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - unrequested disaster or event
  - effect filling the whole scene
  - hard-edged clutter
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
