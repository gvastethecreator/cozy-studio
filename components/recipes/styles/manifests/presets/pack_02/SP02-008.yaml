visualDna:
  aesthetic: 'Found-footage horror: a frame from a consumer camcorder or phone carried by a panicking person in the dark.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Night-mode green-grey or sickly low-light color, crushed blacks, blown flashlight hotspots.
  lighting_and_shadow: A single flashlight or camera light cone; everything outside it falls to noisy black.
  texture_and_material: Video noise, compression smear, motion blur, lens smudges and interlace tearing.
  camera_and_composition: Shaky handheld, tilted, subject half out of frame, something barely visible in the dark.
  atmosphere_and_mood: Panicked and claustrophobic, dread coming from what the light has not reached.
  rendering_and_quality: Consumer-video low fidelity; no readable timestamp or cinematic lighting.
  key_features: flashlight cone; night-mode green; shaky handheld; video noise and smear; half-seen threat in the dark
  creative_brief: "Found-footage horror: a frame from a consumer camcorder or phone carried by a panicking person in the dark. Carry it through flashlight cone, night-mode green, shaky handheld, video noise and smear, half-seen threat in the dark. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
