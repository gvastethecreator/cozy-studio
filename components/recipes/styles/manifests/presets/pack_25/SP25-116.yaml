  color_and_tone: Continuous material color, contrast coming from the voids themselves.
  lighting_and_shadow: Soft light showing hole depth with clean, quiet shading.
  texture_and_material: Matte surface, clean-edged perforations and uniform apparent thickness.
  camera_and_composition: The gradient aimed at one functional zone, smooth areas left for grip and controls.
  atmosphere_and_mood: A gradual technical rhythm, like the object is quietly breathing.
  rendering_and_quality: Clean concept render where the variation follows a functional idea.
