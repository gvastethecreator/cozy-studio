visualDna:
  aesthetic: >-
    Source-informed video-game style router for original first-person spatial puzzle captures: clean
    modular test rooms, linked gate surfaces, cubes or weighted props, light bridges, hazard pools,
    and readable traversal logic. Borrow the clinical puzzle readability of Portal-like games, but
    land as a different fictional test facility with different props, portal/gate visuals, UI icons,
    wall markings, and device design.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable first-person puzzle screenshot
    subject: keep clear object function, gate relationship, route affordance, hazard, scale, and
    next-action logic without copying source devices or room layouts.
  color_and_tone: >-
    Use a clean puzzle-lab palette: matte white panels, soft grey, orange/blue gate accents, hazard
    green, black seams, and cool fluorescent light. Keep value grouping crisp and readable.
  lighting_and_shadow: >-
    Light the image through clinical overhead light, portal glow, laser beams, panel reflections,
    and deep behind-wall shadow. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from modular wall panels, glass, cube edges, gel splashes, metal rails, cables,
    and clean hard-surface test geometry. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person puzzle camera, foreground tool edge or hands only if useful, linked
    gate surfaces, test prop, hazard, and one clear traversal solution. Avoid poster framing and
    exact chamber copies.
  atmosphere_and_mood: >-
    Carry an original whitewall test mood: clinical, witty, lonely, spatial, precise, and quietly
    dangerous.
  rendering_and_quality: >-
    Finish as coherent first-person puzzle screenshot style, not concept art: minimal HUD, reticle,
    gate cues, object highlights, and hazard indicators can appear abstractly. Maintain
    heavy-denoise clarity, crisp geometry, and no readable signage/logos.
  key_features: >-
    Portal 2 gameplay screenshots; first-person puzzle capture with clean test chambers, portal
    surfaces, laser paths, weighted cubes, and sterile objective readability; white panels, grey
    concrete, orange/blue portals, cyan laser lines, black mechanical gaps, and warning yellow;
    clinical overhead light, portal glow, laser beams, panel reflections, and deep behind-wall
    shadow; modular wall panels, glass, cube edges, gel splashes, metal rails, cables, and clean
    hard-surface test geometry; first-person portal-gun framing with puzzle affordances, destination
    sightlines, object relationships, and chamber logic visible; clinical, witty, spatial,
    experimental, and cleanly mechanical; HUD guidance: almost no HUD; portal reticle and tiny
    interaction cues are enough
  creative_brief: >-
    Use Whitewall Gate Test Chamber as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through first-person spatial puzzle references: clean modular rooms, gate
    mechanics, traversal logic, object affordances, and minimal HUD. Avoid direct Portal cloning,
    exact chamber copies, readable signage, and recognizable device replicas.
