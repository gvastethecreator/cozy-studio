visualDna:
  aesthetic: 'Synthetic-sheet watercolor swirl: watercolor on smooth non-absorbent plastic paper, where pigment floats, swirls and dries in sharp-edged pools and lifted trails.'
  subject_treatment: Let the prompt's subject emerge from floating pigment pools and swirls, keeping its silhouette readable with some wiped-out lights.
  color_and_tone: Intense saturated watercolor that stays bright on the white sheet, mixing in marbled swirls.
  lighting_and_shadow: Lights wiped back to pure white; darks where pigment pooled and dried thick.
  texture_and_material: Hard drying rings, marbled swirls, wiped trails and a slightly glossy smooth surface.
  camera_and_composition: Fluid organic composition with swirling pools framing the subject.
  atmosphere_and_mood: Vibrant, liquid and surprising, color with a mind of its own.
  rendering_and_quality: Authentic floating pigment behavior with sharp dried rings, never absorbed soft washes.
  creative_brief: "Synthetic-sheet watercolor swirl: watercolor on smooth non-absorbent plastic paper, where pigment floats, swirls and dries in sharp-edged pools and lifted trails. Carry it through floating pigment pools, hard drying rings, wiped white lights, glossy sheet. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: floating pigment pools; hard drying rings; wiped white lights; glossy sheet
