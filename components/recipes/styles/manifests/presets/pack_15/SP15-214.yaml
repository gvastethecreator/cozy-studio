visualDna:
  aesthetic: 'Courierpunk: fearless bike messengers of the city, with fixed-gear bikes, huge messenger bags, radio headsets and death-defying traffic runs.'
  subject_treatment: Keep the prompt's subject and setting; turn it into a high-speed bike courier run through dense traffic and city streets.
  color_and_tone: Grimy city greys and taxi yellow with bright jersey colors and red tail lights.
  lighting_and_shadow: Harsh daylight between towers or streaked headlights and tail lights at night.
  texture_and_material: Worn bike frames, bag canvas, rain-slick asphalt, chains and scuffed helmets.
  camera_and_composition: Low fast angles with motion blur, weaving between cars and buses.
  atmosphere_and_mood: Reckless, proud and fast, the city as a racetrack.
  rendering_and_quality: Dynamic illustration with speed streaks and gritty street texture.
  creative_brief: "Courierpunk: fearless bike messengers of the city, with fixed-gear bikes, huge messenger bags, radio headsets and death-defying traffic runs. Carry it through fixed-gear bikes, messenger bags, traffic weaving, speed streaks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fixed-gear bikes; messenger bags; traffic weaving; speed streaks
