visualDna:
  aesthetic:
    An engineered-living language where cell lattices, membrane structures, symbiotic components and
    precise bio-circuit traces interlock as intentional systems, not organic texture alone.
  subject_treatment:
    Preserve identity, anatomy and explicit locks. Restyle open forms, materials and clothing
    with grown joins, cellular panels, living polymer and technical traces; use biology as active design vocabulary.
    In ordinary settings, apply cell/membrane cues to existing garments or materials and connect a precise
    bio-circuit to a function; keep the room layout intact and add no organisms, plants or wall text as set
    dressing unless requested.
  color_and_tone:
    Let explicit palette lead, balancing mineral or synthetic values with living accents. Separate
    translucent, opaque and engineered regions; avoid fixed green glow.
  lighting_and_shadow:
    Follow specified light and sources. Use internal transitions only within translucent
    forms; body horror and clinical drama remain optional.
  texture_and_material:
    Distinguish membrane, living polymer, plant composite, bone-like material, glass and
    metal through translucency, fiber direction and grain; surfaces feel intentionally fabricated.
  camera_and_composition:
    Preserve viewpoint and placement. Use organic planes and technical traces within
    the requested composition; a lab, greenhouse or close-up is not required.
  atmosphere_and_mood:
    Create curiosity, unease or wonder through living growth and engineered order while
    following requested tone.
  rendering_and_quality:
    Use clean organic contours, precise technical ink and broad translucent planes, with
    detail at functional interfaces. Avoid random tendril or circuit clutter.
avoidRules:
  - Do not impose a lab, clinic, greenhouse, organism or body transformation as the default scene.
  - Respect anatomy and material locks; do not add unrequested gore or anatomical change.
  - Avoid uniform biological glow and circuitry unrelated to living function.
