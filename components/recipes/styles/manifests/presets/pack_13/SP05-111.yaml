  color_and_tone: Graded indigo, vermilion and paper beige, true to the Miss Hokusai Production I.G palette.
  lighting_and_shadow: Graded woodblock sky light, lit the way Miss Hokusai Production I.G lights its scenes.
  texture_and_material: Woodblock-inspired flat color and line, with the surface finish of Miss Hokusai Production I.G.
  camera_and_composition: Ukiyo-e compositions, framed the way Miss Hokusai Production I.G composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with Edo artistic wonder.
  rendering_and_quality: Woodblock-inspired feature frame, in the recognizable hand of Miss Hokusai Production I.G.
  key_features: Miss Hokusai Edo; woodblock gradients; ukiyo-e
  creative_brief: "Production I.G Miss Hokusai look (2015) by Keiichi Hara: Edo woodblock world, graded indigo skies, painters’ studios and ukiyo-e staging. Carry it through Miss Hokusai Edo, woodblock gradients, ukiyo-e. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
