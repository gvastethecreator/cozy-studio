visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around precise hairline
    boundaries across broad pale planes, with one controlled interruption in the contour
    rhythm. For color and surface, protect the prompt palette while favoring
    porcelain white, cool gray, and a tiny coral or vermilion note. Fragility can come
    from the contrast between calm precision and one small irregularity; keep the
    requested emotion intact
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through precise hairline boundaries across
    broad pale planes, with one controlled interruption in the contour rhythm; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; protect the prompt palette
    while favoring porcelain white, cool gray, and a tiny coral or vermilion note. Keep
    values legible across the prompted light and dark range; do not crush midtones or
    dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; keep illumination clear and
    diffuse, then use a small hard highlight at the point where the line treatment
    breaks. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; pair smooth matte fields with extremely fine
    paper grain; confine the accent mark instead of spreading stains. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    the original arrangement and let broad quiet areas contrast with tightly resolved
    edges. Use the mark rhythm inside the supplied composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Fragility can come from the contrast
    between calm precision and one small irregularity; keep the requested emotion
    intact. Darkness and tension are optional tonal pressure, never a requirement to add
    danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and precise hairline boundaries across broad
    pale planes, with one controlled interruption in the contour rhythm; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    precise hairline boundaries across broad pale planes, with one controlled
    interruption in the contour rhythm; protect the prompt palette while favoring
    porcelain white, cool gray, and a tiny coral or vermilion note; keep illumination
    clear and diffuse, then use a small hard highlight at the point where the line
    treatment breaks; pair smooth matte fields with extremely fine paper grain; confine
    the accent mark instead of spreading stains; and preserve the original arrangement
    and let broad quiet areas contrast with tightly resolved edges. The five cues should
    read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use precise hairline boundaries across broad
    pale planes, with one controlled interruption in the contour rhythm, protect the
    prompt palette while favoring porcelain white, cool gray, and a tiny coral or
    vermilion note, keep illumination clear and diffuse, then use a small hard highlight
    at the point where the line treatment breaks, and pair smooth matte fields with
    extremely fine paper grain; confine the accent mark instead of spreading stains; the
    prompt supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
