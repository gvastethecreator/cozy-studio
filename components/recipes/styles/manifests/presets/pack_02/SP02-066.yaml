visualDna:
  aesthetic: 'Cinematic silhouette: subjects blocked against a blown-out bright background — sky, doorway or cyclorama — exposed so they fall to pure black.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Saturated sunset, white doorway glow or colored cyc behind; subjects black.
  lighting_and_shadow: All light behind the subject; no front fill; a thin edge of spill on contours.
  texture_and_material: Readable gestures and props defined only by outline.
  camera_and_composition: Keep the requested framing; subjects separated from each other against the brightest area.
  atmosphere_and_mood: Iconic and tense, drama told entirely through shape.
  rendering_and_quality: Clean black shapes against a smooth bright field; no muddy detail.
  key_features: subjects against blown background; pure black shapes; no front fill; separated gestures; smooth bright field
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cinematic Silhouette Backdrop as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
