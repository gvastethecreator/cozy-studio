visualDna:
  aesthetic: 'Wireframe render: only the mesh edges drawn as glowing lines, revealing the topology of the subject against a dark field.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Neon cyan, magenta or white lines on black; brighter where lines converge.
  lighting_and_shadow: No surface shading; line density creates perceived form.
  texture_and_material: Quad and triangle topology, edge loops following the forms.
  camera_and_composition: Keep the requested view; hidden lines removed for clarity.
  atmosphere_and_mood: Technical and ghostly, the hidden structure laid completely bare.
  rendering_and_quality: Clean anti-aliased lines with a subtle glow and no noise.
  key_features: mesh edges only; neon lines on black; visible edge loops; no surface shading; subtle glow
  creative_brief: "Wireframe render: only the mesh edges drawn as glowing lines, revealing the topology of the subject against a dark field. Carry it through mesh edges only, neon lines on black, visible edge loops, no surface shading, subtle glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
