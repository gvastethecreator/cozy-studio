visualDna:
  aesthetic: 'White-hot thermal feed: a surveillance-grade infrared camera shown in greyscale, where heat is white and cold is black, with a slightly soft, noisy sensor image.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: 'Greyscale only: warm bodies bright white, cool ground mid grey, sky and water black.'
  lighting_and_shadow: No visible-light shading; heat bleeds softly into its surroundings as a glow.
  texture_and_material: Low resolution, faint sensor grid, residual heat trails where subjects have been.
  camera_and_composition: Wide surveillance or tracking view, subjects small and glowing.
  atmosphere_and_mood: Cold and watchful, living warmth tracked across the dark.
  rendering_and_quality: White-hot greyscale thermal; the color ironbow palette belongs to pack_01.
  key_features: white-hot greyscale; black cold background; soft heat bloom; residual heat trails; low-resolution sensor
  creative_brief: "White-hot thermal feed: a surveillance-grade infrared camera shown in greyscale, where heat is white and cold is black, with a slightly soft, noisy sensor image. Carry it through white-hot greyscale, black cold background, soft heat bloom, residual heat trails, low-resolution sensor. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
