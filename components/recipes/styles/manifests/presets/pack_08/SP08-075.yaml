visualDna:
  aesthetic: 'Gold leaf gilding: the figure or its garments covered in applied gold leaf with crackle and burnish.'
  subject_treatment: 'Apply this material to the whole figure as a deliberate transformation while keeping identity, face structure, pose and setting readable: gold leaf applied over the figure or garments, with visible leaf edges, crackle and burnished highlights.'
  color_and_tone: Warm gold, rose gold and dark bole underneath, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Warm raking light to show leaf edges and burnish.
  texture_and_material: Gold leaf with crackle, edges and burnished sheen, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the figure.
  atmosphere_and_mood: Sacred, precious, divine and still, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: gold leaf edges; crackle; burnished sheen; warm raking light
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Gold Leaf as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
