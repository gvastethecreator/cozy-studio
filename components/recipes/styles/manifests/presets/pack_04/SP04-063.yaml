visualDna:
  aesthetic: 'Japanese ukiyo-e color woodblock print: key-block outlines in sumi ink, flat colors from separate blocks and bokashi gradients wiped onto the block.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Prussian blue, indigo, soft vermilion, ochre and pale pink on mellow cream paper, with bokashi gradients in skies and water.
  lighting_and_shadow: No cast shadows; form carried by outline and flat color, time of day told by the gradient sky.
  texture_and_material: Visible wood grain in flat areas, crisp carved key lines, slight registration shifts and baren-rubbed pigment mottling.
  camera_and_composition: Keep the requested view with flattened layered depth, a high horizon or a bold cropped foreground.
  atmosphere_and_mood: Calm, rhythmic and seasonal, a moment of passing weather.
  rendering_and_quality: Flat printed color and carved line with no Western shading; any cartouche or seal area left blank.
  key_features: sumi key-block outline; flat block colors; bokashi gradients; visible wood grain; Prussian blue and indigo
  creative_brief: "Japanese ukiyo-e color woodblock print: key-block outlines in sumi ink, flat colors from separate blocks and bokashi gradients wiped onto the block. Carry it through sumi key-block outline, flat block colors, bokashi gradients, visible wood grain, Prussian blue and indigo. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
