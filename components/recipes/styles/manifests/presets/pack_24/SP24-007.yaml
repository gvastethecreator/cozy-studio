visualDna:
  aesthetic: 'Clinical pastel unease: soft mint, pale pink and hospital cream spaces lit by humming fluorescents, where calm institutional order hides something quietly wrong.'
  subject_treatment: Place the prompt's subject in a clean pastel institutional space, keeping it clear while one small detail sits wrong in the orderly scene.
  color_and_tone: Mint green, pale pink, cream and chrome with sickly fluorescent tints and very little shadow contrast.
  lighting_and_shadow: Flat overhead fluorescent light, faint flicker and pale shadows directly beneath objects.
  texture_and_material: Glossy vinyl floors, painted metal, laminated surfaces and crisp linen with faint stains.
  camera_and_composition: Symmetrical corridors and rooms with long vanishing points and too much empty floor.
  atmosphere_and_mood: Calm on the surface, deeply unsettling underneath, a clean nightmare.
  rendering_and_quality: Smooth clean painterly rendering with precise edges and subdued detail.
  creative_brief: "Clinical pastel unease: soft mint, pale pink and hospital cream spaces lit by humming fluorescents, where calm institutional order hides something quietly wrong. Carry it through pastel institutional palette, humming fluorescents, symmetry, one wrong detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pastel institutional palette; humming fluorescents; symmetry; one wrong detail
