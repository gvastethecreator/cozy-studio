visualDna:
  aesthetic: 'Arcadepunk: a culture built inside neon arcades, where tokens are currency, high scores are honor and cabinets glow like shrines.'
  subject_treatment: Keep the prompt's subject and setting; surround it with arcade cabinets, tokens, joysticks and screen glow.
  color_and_tone: Carpet purple, cabinet black and saturated screen colors with neon pink trim.
  lighting_and_shadow: Screen glow lighting faces from below and neon tubes along the ceiling.
  texture_and_material: Worn joysticks, scratched plexiglass, patterned carpet and metal tokens.
  camera_and_composition: Rows of cabinets receding into glow, players framed by screen light.
  atmosphere_and_mood: Obsessive and joyful, rivalries and legends measured in coins and points.
  rendering_and_quality: Vivid illustration with glowing screens and tactile worn details.
  creative_brief: "Arcadepunk: a culture built inside neon arcades, where tokens are currency, high scores are honor and cabinets glow like shrines. Carry it through cabinet rows, screen glow, tokens, neon trim. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
