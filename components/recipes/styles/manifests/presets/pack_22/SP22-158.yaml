visualDna:
  aesthetic: >-
    Smooth airbrush-like value transitions meet crisp edges at real changes of form or material,
    with a few precise line accents.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Apply gradients to existing forms
    without redesigning them as industrial equipment.
  color_and_tone: >-
    Retain the requested palette and relationships. Keep blended transitions inside the established
    colors instead of adding metallic or workshop-inspired hues.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use long controlled highlights only where the
    existing light and material support them.
  texture_and_material: >-
    Interpret smooth surfaces with restrained airbrushed transitions while keeping each material
    distinct. Do not turn every surface into metal or gloss.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not restage the subject as a
    product shot or add a frame, labels or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Airbrush technique does not prescribe a setting or
    background.
  rendering_and_quality: >-
    Balance continuous gradients with a small number of sharp edges that describe existing forms.
    Keep profiles clear and line details sparse.
avoidRules:
  - all-over metallic or glossy material treatment
  - unrequested setting or display background
  - unrequested labels, frame or card layout
assets:
