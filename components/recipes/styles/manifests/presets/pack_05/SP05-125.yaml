visualDna:
  aesthetic: >-
    Build the graphic anime treatment from sturdy dark contours with precise grid-like ticks and
    existing shapes organized into broad size intervals. Let measured sweeping curves and orderly
    directional lines set its rhythm; use high-visibility yellow, warm orange, deep blue-gray, and
    pale neutral for color and matte color blocks with fine grain limited to dark areas for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use sturdy dark contours with precise grid-like
    ticks for edge work, existing shapes organized into broad size intervals for form
    simplification, and measured sweeping curves and orderly directional lines only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with high-visibility yellow, warm orange, deep blue-gray, and pale neutral.
    Place the strongest contrast on the requested focal area and preserve explicit color
    instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: even pale highlights and clearly separated shadow shapes. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with matte color blocks with fine grain limited to dark areas,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use abstract grid intervals that clarify scale among
    existing forms without prescribing a location to organize existing forms; preserve location
    and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey measured resilience and visual steadiness, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with stable silhouettes, measured scale marks, and controlled color blocks; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    sturdy dark contours with precise grid-like ticks; existing shapes organized into broad size
    intervals; high-visibility yellow, warm orange, deep blue-gray, and pale neutral; measured
    sweeping curves and orderly directional lines; matte color blocks with fine grain limited to
    dark areas; abstract grid intervals that clarify scale among existing forms without
    prescribing a location.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with sturdy dark contours
    with precise grid-like ticks, existing shapes organized into broad size intervals, and
    high-visibility yellow, warm orange, deep blue-gray, and pale neutral; use measured sweeping
    curves and orderly directional lines only where movement is already present, and apply matte
    color blocks with fine grain limited to dark areas as the drawing finish.
