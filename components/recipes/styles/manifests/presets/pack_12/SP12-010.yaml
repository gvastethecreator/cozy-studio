visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Dark Souls III gameplay screenshots:
    third-person action-RPG capture with volcanic masonry, lock-on duel spacing, stamina tension,
    and oppressive medieval ruin depth. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Dark Souls III-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Dark Souls III-informed palette: ash grey, ember orange, charred black, dull brass, corpse
    beige, and muted blood red. Keep value grouping legible at gameplay distance, with color accents
    behaving like route, danger, pickup, team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through lava underglow, bonfire orange, smoky occlusion, rimmed armor edges, and
    stark boss-fire contrast. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from sooty stone, scorched metal, cracked shields, worn cloth, ember particles,
    and heavy weathered geometry. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with over-shoulder third-person combat framing with lock-on angle, boss scale, dodge
    lanes, stamina-space readability, and terrain traps. The frame should read as a plausible
    gameplay capture; include UI/HUD only when it matches the source game's visual logic and
    improves clarity.
  atmosphere_and_mood: >-
    Carry a Dark Souls III-derived mood: punishing, solemn, ruined, hot, and ritualistic. The preset
    can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but
    it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: soulslike HUD can appear:
    health/stamina/focus bars, item slot, and boss bar, kept small and era-consistent. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Dark Souls III gameplay screenshots; third-person action-RPG capture with volcanic masonry,
    lock-on duel spacing, stamina tension, and oppressive medieval ruin depth; ash grey, ember
    orange, charred black, dull brass, corpse beige, and muted blood red; lava underglow, bonfire
    orange, smoky occlusion, rimmed armor edges, and stark boss-fire contrast; sooty stone, scorched
    metal, cracked shields, worn cloth, ember particles, and heavy weathered geometry; over-shoulder
    third-person combat framing with lock-on angle, boss scale, dodge lanes, stamina-space
    readability, and terrain traps; punishing, solemn, ruined, hot, and ritualistic; HUD guidance:
    soulslike HUD can appear: health/stamina/focus bars, item slot, and boss bar, kept small and
    era-consistent
  creative_brief: >-
    Use Dark Souls Smouldering Forge as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Dark Souls III: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
