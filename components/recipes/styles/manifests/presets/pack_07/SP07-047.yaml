visualDna:
  aesthetic: 'Topiary wayfinding trap: a hedge maze of tall clipped walls, gravel paths, dead ends and a hidden centre, planned so sightlines are always broken.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Dense dark yew or hornbeam green, pale gravel, a small bright accent at the centre; high contrast between hedge mass and path.
  lighting_and_shadow: Low light cutting across hedge tops leaving paths in deep shade, fog or dusk hiding what is around the corner.
  texture_and_material: Clipped yew or hornbeam walls well above head height, crisp corners, raked gravel paths, a gravel clearing or pavilion at the centre.
  camera_and_composition: Keep the requested view; either a high overhead view revealing the puzzle or a ground view trapped between two walls with a turn ahead.
  atmosphere_and_mood: Uncertain, playful and faintly menacing, the way always turning.
  rendering_and_quality: Crisp photograph with continuous hedge walls and exact corners, no readable maps or signs.
  key_features: head-high clipped hedge walls; dead-end turns; broken sightlines; gravel paths; hidden central clearing
  creative_brief: "Topiary wayfinding trap: a hedge maze of tall clipped walls, gravel paths, dead ends and a hidden centre, planned so sightlines are always broken. Carry it through head-high clipped hedge walls, dead-end turns, broken sightlines, gravel paths, hidden central clearing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
