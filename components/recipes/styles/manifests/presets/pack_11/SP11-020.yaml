    light-response contract, with readable hierarchy, controlled contact detail, and no lighting
    choice that erases the user's requested content.
  texture_and_material: >-
    Render Wood grain, paint chips, sanded-smooth bevel, hand-rubbed oil, age-darkened patina plus
    plastic, clay, yarn, paper, wood, metal, felt, ice, tile, thread, sand, or carved surface
    behavior; surface scale, residue, gloss, grain, fiber, pores, edges, or signal artifacts must
    remain coherent across figures, objects, and environments.
  camera_and_composition: >-
    Compose with Simple geometry, block-cut forms, peg-joint assembly, turned-wood symmetry plus
    object-scale staging, modular silhouette rhythm, clear construction reads, and tactile detail
