visualDna:
  aesthetic: 'Poured pulp painting: an image made by pouring and placing wet colored paper pulp into a sheet, so shapes have soft fibrous edges and the color is inside the paper.'
  subject_treatment: Shape the prompt's subject from pools of colored pulp set into the sheet, keeping its silhouette readable with soft fibrous edges.
  color_and_tone: Earthy and bright pulp colors such as indigo, terracotta and moss, matte and fully saturated in the fiber.
  lighting_and_shadow: Soft even light over a matte surface, with subtle relief where pulp was layered thicker.
  texture_and_material: Fibrous feathered edges, lumpy pulp thickness, deckled borders and matte felted surface.
  camera_and_composition: Simple bold shapes on a full handmade sheet with deckled edges.
  atmosphere_and_mood: Earthy, calm and tactile, color grown into the paper itself.
  rendering_and_quality: Authentic fibrous pulp edges and matte color, never crisp paint strokes.
  creative_brief: "Poured pulp painting: an image made by pouring and placing wet colored paper pulp into a sheet, so shapes have soft fibrous edges and the color is inside the paper. Carry it through color inside the paper, feathered fiber edges, lumpy surface, deckled sheet. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: color inside the paper; feathered fiber edges; lumpy surface; deckled sheet
