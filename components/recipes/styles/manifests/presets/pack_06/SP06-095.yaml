visualDna:
  aesthetic: 16-bit console pixel art with about sixty on-screen colors, using heavy vertical-stripe and checkerboard dither to fake transparency and gradients.
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Steppy, slightly dark 9-bit colors with high contrast; gradients built from dither bands, never smooth ramps.
  lighting_and_shadow: Hard-edged light blocks and dithered glows; shadows as flat dark palette steps.
  texture_and_material: Vertical line dither and checkerboard patterns that a composite signal would blur into mist, water or glass.
  camera_and_composition: Keep the requested view; strong silhouettes and parallax layers separated by value.
  atmosphere_and_mood: Crunchy and energetic, with an edge of attitude.
  rendering_and_quality: Crisp 320 by 224 pixels with deliberate dither everywhere translucency appears; no alpha blending.
  key_features: vertical-stripe dither; checkerboard fake transparency; steppy 9-bit palette; parallax layers; no alpha blending
  creative_brief: "16-bit console pixel art with about sixty on-screen colors, using heavy vertical-stripe and checkerboard dither to fake transparency and gradients. Carry it through vertical-stripe dither, checkerboard fake transparency, steppy 9-bit palette, parallax layers, no alpha blending. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
