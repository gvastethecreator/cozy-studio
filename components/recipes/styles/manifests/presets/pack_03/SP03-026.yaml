visualDna:
  aesthetic: 'Knolling: every part of the subject disassembled and laid out flat at right angles in a tidy grid, seen from straight above.'
  subject_treatment: Keep the prompt subject and action; this preset owns the disassembled overhead grid layout, and nothing else about the request changes.
  color_and_tone: Clean neutral ground, parts in their true colors, strong contrast.
  lighting_and_shadow: Soft overhead light with small, even shadows under every part.
  texture_and_material: Each part crisp and clean, grouped by type and size.
  camera_and_composition: Exactly top-down, parts aligned to a grid with equal spacing.
  atmosphere_and_mood: Satisfying and analytical, an object understood by its pieces.
  rendering_and_quality: Crisp CGI knolling; not a photographic flat lay of whole objects.
  key_features: disassembled parts; right-angle grid; top-down view; grouped by size; even spacing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Knolling (Flat Lay) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
