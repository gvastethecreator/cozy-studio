visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Journey gameplay screenshots: minimal
    third-person desert adventure capture with tiny cloaked figure scale, monumental dunes, simple
    ruins, and poetic route silhouettes. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Journey-adjacent game screenshot
    subject: keep clear role silhouette, player/enemy/object function, scale relationship,
    hitbox-like readability, and interaction affordances without copying source characters or named
    IP elements.
  color_and_tone: >-
    Use a Journey-informed palette: burnt orange sand, rose dusk, gold glints, cobalt night, white
    scarf marks, and sparse turquoise glyph glow. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through low sun bloom, soft horizon haze, rimmed dunes, starry twilight, and
    warm sand bounce. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from smooth sand sheets, cloth folds, simple stone glyphs, flowing particles, and
    elegant low-detail geometry. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with wide third-person travel framing with negative space, small player silhouette,
    slope vectors, and one clear destination landmark. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Journey-derived mood: lonely, sacred, graceful, meditative, and mythic. The preset can
    become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X asks, but it
    should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: almost no HUD; a tiny
    scarf/glyph cue is acceptable, but keep the screen uncluttered. Maintain heavy-denoise clarity,
    crisp focal hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random
    interface clutter.
  key_features: >-
    Journey gameplay screenshots; minimal third-person desert adventure capture with tiny cloaked
    figure scale, monumental dunes, simple ruins, and poetic route silhouettes; burnt orange sand,
    rose dusk, gold glints, cobalt night, white scarf marks, and sparse turquoise glyph glow; low
    sun bloom, soft horizon haze, rimmed dunes, starry twilight, and warm sand bounce; smooth sand
    sheets, cloth folds, simple stone glyphs, flowing particles, and elegant low-detail geometry;
    wide third-person travel framing with negative space, small player silhouette, slope vectors,
    and one clear destination landmark; lonely, sacred, graceful, meditative, and mythic; HUD
    guidance: almost no HUD; a tiny scarf/glyph cue is acceptable, but keep the screen uncluttered
  creative_brief: >-
    Use Journey Crystal Desert Pilgrimage as a transferable game-originals preset. Preserve prompt
    X, then route interpretation through capture references from Journey: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
