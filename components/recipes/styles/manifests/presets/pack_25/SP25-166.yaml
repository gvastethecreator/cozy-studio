visualDna:
  aesthetic: 'Editorial Cut-and-Connect: photo fragments and editorial blocks connected by alignments, scale shifts and purposeful links.'
  subject_treatment: Relate photo fragments of the prompt's subject and editorial text blocks through alignments and functional links, keeping every word exact.
  color_and_tone: Unified palette and a limited editorial accent, subjects left uncolored.
  lighting_and_shadow: Compatible light across fragments or a deliberate designed contrast.
  texture_and_material: Clean cuts and coherent texture between photos and graphics.
  camera_and_composition: One main fragment, subordinate pieces and connections that explain them.
  atmosphere_and_mood: Editorial curiosity and intentional montage, clever and composed.
  rendering_and_quality: Clean editorial layout where each fragment adds something new.
  creative_brief: "Editorial Cut-and-Connect: photo fragments and editorial blocks connected by alignments, scale shifts and purposeful links. Carry it through photo fragments, editorial blocks, functional links, one main piece. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: photo fragments; editorial blocks; functional links; one main piece
avoidRules:
  - disconnected collage
  - invented images as evidence
  - decorative links
  - invented product claims, statistics or awards
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
