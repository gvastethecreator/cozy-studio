visualDna:
  aesthetic: 'Pointillism: the image built from small dots of pure color that mix optically.'
  subject_treatment: "Rebuild the prompt's subject and setting entirely from discrete units so it stays recognizable at card size — unit: small round dots of pure unmixed paint; joints: visible canvas between dots."
  color_and_tone: Complementary pure colors placed side by side, with each unit holding one color so the image is built by juxtaposition.
  lighting_and_shadow: Light comes from bright dot juxtaposition, no blending, as the physical behavior of this unit.
  texture_and_material: small round dots of pure unmixed paint, set with visible canvas between dots, at a unit size that keeps the subject readable.
  camera_and_composition: Keep the prompt framing; unit size and direction follow the subject contours so forms read clearly.
  atmosphere_and_mood: Luminous, calm, patient and vibrant, coming from the handcrafted construction.
  rendering_and_quality: Crisp, consistent units and joints across the whole image, with no smeared or random fill.
  key_features: pure color dots; optical mixing
  creative_brief: "Pointillism: the image built from small dots of pure color that mix optically. Carry it through pure color dots, optical mixing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
