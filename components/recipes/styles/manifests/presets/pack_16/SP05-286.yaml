visualDna:
  aesthetic: >-
    Seasonal naturalism: close deliberate ink at touch points, softly joined midtone masses, and
    restrained surface grain.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Allow precise
    contours at existing contact points without changing age, anatomy, or emotional read.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, work with muted olive,
    russet, cream, and blue-gray; let contrast shift gently while local colors stay true.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use a soft directional key, warm reflected
    edge, and cooler shadow, all consistent with the stated source.
  texture_and_material: >-
    Apply texture only to materials already present. Apply short hatches to existing tactile
    materials only; leave smooth areas smooth and invent no material grain.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Cluster detail at already
    legible focal areas and soften secondary values without reframing.
  atmosphere_and_mood: >-
    Keep user mood; naturalistic surface detail does not force seasonal nostalgia or intimacy.
  rendering_and_quality: >-
    Preserve believable anatomy, restrained texture density, and clear focal contours without
    photographic or 3D drift.
  key_features: >-
    Close contour detail; joined midtones; olive-russet palette; restrained material grain.
  creative_brief: 'Use close contour detail; joined midtones; olive-russet palette; restrained material grain. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
