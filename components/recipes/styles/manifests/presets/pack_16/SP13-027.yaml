visualDna:
  aesthetic: 'Epic battle anime of massed formations: rows of armored riders and spears surging as one red wave across the frame.'
  subject_treatment: Keep the prompt's subject and setting; place it inside a moving formation or charge, individuals simplified into rhythmic repeated shapes.
  color_and_tone: Lacquer crimson and black armor against dust gold and pale sky, banners as bright repeated accents.
  lighting_and_shadow: Low afternoon sun through dust, blocked cel shadows under helmets and a hot rim along the front rank.
  texture_and_material: Lamellar armor plates, banner silk and churned earth drawn with bold simplified cel shapes.
  camera_and_composition: Low angle into the oncoming charge or high wide shots of whole formations sweeping diagonally.
  atmosphere_and_mood: Thunderous and collective, a single unstoppable will carried forward by many riders at once.
  rendering_and_quality: Large-scale battle anime with repeated figures, speed lines and clean readable masses.
  key_features: massed formation; diagonal charge; repeated banners; dust light
  creative_brief: "Epic battle anime of massed formations: rows of armored riders and spears surging as one red wave across the frame. Carry it through massed formation, diagonal charge, repeated banners, dust light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
