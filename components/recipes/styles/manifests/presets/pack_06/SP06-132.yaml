visualDna:
  aesthetic: 'Reduction linocut: one linoleum block carved and printed again and again, each pass removing more and printing a darker color over the last.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Four to six flat colors stacked light to dark, such as cream, yellow, orange, red, deep blue; each color partly transparent over the previous.
  lighting_and_shadow: Light areas are the earliest carved-away colors, shadows the last dark pass; clear stepped value bands.
  texture_and_material: Slight halo of earlier colors peeking at the edges of later ones, speckled ink texture, smooth curved gouge lines.
  camera_and_composition: Keep the requested framing; shapes nest inside each other from light to dark.
  atmosphere_and_mood: Warm, crafted and rich, color built patiently layer by layer.
  rendering_and_quality: Stacked flat color layers with visible edge halos and speckle; no gradients, no black key line drawn separately.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Reduction Linocut as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: one block printed in successive colors; light-to-dark stacked layers; edge halos of earlier colors; speckled ink; nested shapes
