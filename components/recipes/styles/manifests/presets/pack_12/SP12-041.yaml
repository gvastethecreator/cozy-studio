visualDna:
  aesthetic: >-
    Source-informed video-game style router for original painterly first-person wilderness
    exploration captures: simplified landscape shapes, warm dusk smoke, trail navigation, lookout
    structures, radio-like intimacy, and readable route landmarks. Borrow the graphic color
    discipline of Firewatch-like games, but land as a different fictional wilderness with different
    terrain, props, UI icons, and palette variants.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable wilderness exploration screenshot
    subject: keep clear trail/object function, landmark scale, hand/tool presence when useful, route
    affordance, and environmental readability without copying exact locations or posters.
  color_and_tone: >-
    Use a painterly wilderness palette: ember orange, mauve sky, pine green, dusty violet, dry grass
    ochre, smoke blue, and dark bark silhouettes. Keep shapes broad and readable rather than
    pixelated or photoreal.
  lighting_and_shadow: >-
    Light the image through golden-hour haze, flat graphic silhouettes, campfire warmth, radio glow,
    and atmospheric smoke layers. Lighting must clarify the playable route, threat, focal subject,
    or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from painterly low-poly trees, wood cabins, paper maps, radios, trail signs
    without readable text, and dry grass. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with first-person trail view, foreground hand/map/radio/object only if useful,
    mid-ground landmark, route fork, and layered atmospheric landscape. Avoid retro-pixel rendering
    and static tourism poster framing.
  atmosphere_and_mood: >-
    Carry an original emberwood trail mood: lonely, warm, suspicious, contemplative, outdoorsy, and
    smoke-tinted.
  rendering_and_quality: >-
    Finish as coherent first-person painterly exploration screenshot style, not pixel art and not
    concept art: minimal HUD, route/objective cue shapes, and clean color blocks can appear.
    Maintain denoised broad shapes and crisp navigation readability.
  key_features: >-
    Firewatch gameplay screenshots; first-person narrative exploration capture with stylized forest
    planes, ranger lookout towers, warm dusk, and environmental pathfinding; burnt orange sky, pine
    green, lavender shadow, wood brown, sunlit yellow, and smoky blue distance; golden-hour haze,
    flat graphic silhouettes, campfire warmth, radio glow, and atmospheric smoke layers; painterly
    low-poly trees, wood cabins, paper maps, radios, trail signs without readable text, and dry
    grass; first-person walking-sim framing with hands/tools, path curves, lookout landmark, and
    quiet navigational depth; lonely, warm, suspicious, contemplative, and outdoorsy; HUD guidance:
    minimal compass/objective cues or held map/radio interfaces are allowed; avoid gamey clutter
  creative_brief: >-
    Use Emberwood Lookout Trail as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through painterly wilderness exploration references: first-person camera,
    broad color blocking, trail landmarks, smoke/dusk light, and quiet route decisions. Avoid direct
    Firewatch cloning, exact tower-poster composition, and retro pixel downgrade.
