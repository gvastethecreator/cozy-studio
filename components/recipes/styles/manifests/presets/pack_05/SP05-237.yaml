  creative_brief: "Gainax Gunbuster OVA look (1988) by Hideaki Anno: hot-blooded training spirit, colossal combining super robots, space fleets and dramatic heroic poses in color. Carry it through Gunbuster heroics, colossal robots, training spirit, space fleets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
