visualDna:
  aesthetic: 'Traditional goth darkwave: black-on-black romantic layers — lace, velvet, fishnet and silver — with pale skin and dramatic dark makeup.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: layered black lace and velvet, a long coat or corseted top, fishnet or striped hosiery, heavy boots, silver crosses or moons and dark lipstick and eyeliner."
  color_and_tone: Black on black with pale skin, blood red and cold silver accents.
  lighting_and_shadow: Low cold light, candles or moonlight with deep shadow.
  texture_and_material: Crushed velvet, lace, fishnet, patent leather and oxidized silver.
  camera_and_composition: Moody full or three-quarter figure in dim settings, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Melancholic, romantic, nocturnal and dramatic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Rich, low-key finish with deep blacks, with believable fabric weight, seams and fit detail.
  key_features: black lace and velvet layers; silver moons and crosses; dark lipstick; heavy boots; candlelit low key
  creative_brief: "Traditional goth darkwave: black-on-black romantic layers — lace, velvet, fishnet and silver — with pale skin and dramatic dark makeup. Carry it through black lace and velvet layers, silver moons and crosses, dark lipstick, heavy boots, candlelit low key. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
