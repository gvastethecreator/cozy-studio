visualDna:
  aesthetic: >-
    Build the graphic anime treatment from confident heavy contours with compact black shadow
    blocks and angular forms crossed by clean, ribbonlike accent bands. Let tight oscillations
    that gather, curve, and release set its rhythm; use black, cyan, and violet with restrained
    cool-gray neutrals for color and smooth dark fills with sparse dry grain at selected edges for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use confident heavy contours with compact black
    shadow blocks for edge work, angular forms crossed by clean, ribbonlike accent bands for form
    simplification, and tight oscillations that gather, curve, and release only where movement is
    already requested.
  color_and_tone: >-
    Build value groups with black, cyan, and violet with restrained cool-gray neutrals. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard ink shadows edged by selective cyan-violet accents. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth dark fills with sparse dry grain at selected edges,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use compressed diagonals around the focal form with
    deliberate breathing gaps to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey contained tension and poised intensity, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with large readable shadow groups, clean line accents, and minimal particle detail;
    keep detail selective and accents attached to existing forms.
  key_features: >-
    confident heavy contours with compact black shadow blocks; angular forms crossed by clean,
    ribbonlike accent bands; black, cyan, and violet with restrained cool-gray neutrals; tight
    oscillations that gather, curve, and release; smooth dark fills with sparse dry grain at
    selected edges; compressed diagonals around the focal form with deliberate breathing gaps.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with confident heavy
    contours with compact black shadow blocks, angular forms crossed by clean, ribbonlike accent
    bands, and black, cyan, and violet with restrained cool-gray neutrals; use tight oscillations
    that gather, curve, and release only where movement is already present, and apply smooth dark
    fills with sparse dry grain at selected edges as the drawing finish.
