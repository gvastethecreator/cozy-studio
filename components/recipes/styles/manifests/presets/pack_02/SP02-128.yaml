visualDna:
  aesthetic: 'Emergency broadcast signal break: an interrupted transmission where color bars, scanline tears and a warning shape cut through the picture.'
  subject_treatment: Keep the prompt subject as the content of the graphic; this preset owns the on-screen layout, and every band, panel or symbol stays free of readable text.
  color_and_tone: SMPTE-like color bars, harsh red and black warning shapes, gray signal snow.
  lighting_and_shadow: Screen glow only; a CRT lighting a dark room when the screen is shown.
  texture_and_material: Horizontal tearing, rolling bars, snow static, phosphor burn and flicker.
  camera_and_composition: The subject barely visible behind broken bands of signal, bars and a triangle warning symbol.
  atmosphere_and_mood: Hostile and alarming, a transmission that should not be happening.
  rendering_and_quality: Analog signal failure look; the warning uses only symbols, no readable text.
  key_features: color bars; scanline tear; signal snow; warning triangle symbol; subject half lost behind noise
  creative_brief: "Emergency broadcast signal break: an interrupted transmission where color bars, scanline tears and a warning shape cut through the picture. Carry it through color bars, scanline tear, signal snow, warning triangle symbol, subject half lost behind noise. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
