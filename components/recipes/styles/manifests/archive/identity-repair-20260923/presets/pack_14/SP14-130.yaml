visualDna:
  aesthetic: >-
    Use repeated arcs, changing rotational intervals, and an off-center axis to describe recurrence and
    motion. This is a directional geometry treatment, not a required orbit, zodiac, or central emblem.
  subject_treatment: >-
    Preserve the requested subject, action, and proportions. Let rotational spacing support the form
    without turning it into a planet, instrument, or diagram.
  color_and_tone: >-
    Keep the requested hues. Separate the rotating or balancing forms with value and temperature shifts
    rather than a fixed celestial palette.
  lighting_and_shadow: >-
    Follow the prompt's light direction. Curved shadow bands may indicate rotation or balance, but do not
    add a corona, halo, or second source unless requested.
  texture_and_material: >-
    Preserve the stated materials and keep wear, polish, or surface marks sparse. Use texture to show the
    direction of motion only where it follows an existing form.
  camera_and_composition: >-
    Maintain the requested view and crop. When composition is open, offset the axis and vary arc spacing
    to show motion; avoid centering a closed seal or forcing perfect symmetry.
  atmosphere_and_mood: >-
    Suggest recurrence, suspension, or rotational tension through spacing. Preserve the intended mood
    without predicting fate or assigning an omen meaning.
  rendering_and_quality: >-
    Keep arcs clean and intervals legible at small size. Preserve the main subject's contour and avoid
    decorative starfields or diagram labels.
avoidRules:
  - Do not add planets, zodiac glyphs, or instrument parts when the prompt does not request them.
  - Do not collapse every composition into a perfect circle or equal halves.
