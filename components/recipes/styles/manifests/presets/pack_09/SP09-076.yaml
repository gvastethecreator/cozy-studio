visualDna:
  aesthetic: >-
    Chain Link Fence treats fabrication as visible style language: start from Metal diamond mesh,
    Woven wire, and Bent, then turn manufacturing process, tooling marks, seams, tolerances, and
    industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Wire diamonds: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Galvanized Grey as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Metallic define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Chain Link Fence without hiding the prompt subject.
  texture_and_material: >-
    Render Woven wire through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Bent as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Restricted, urban by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Urban, barrier material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Metal diamond mesh; Wire diamonds; Woven wire; Metallic; Bent
  creative_brief: >-
    Route any subject through Chain Link Fence as a transferable man-made material visual system
    while preserving the prompt's subject, action, and setting. Compose the industrial grid of
    galvanized chain link where woven wire diamonds repeat into infinity, a barrier you can see
    through that separates without concealing, each intersection a knot of exclusion. The metallic
    surface should catch light in dull silver repetitions, bending where impact has shaped the mesh
    into memory. Capture the beauty of the permeable boundary, exclusion made transparent. Use Chain
    Link Fence as portable surface/render behavior over any input: map its texture, light response,
    edge wear, color chemistry, and tactile rhythm onto the subject instead of requiring a literal
    material sample, macro tile, wall, landscape, source object, or scene where the material
    naturally appears.
