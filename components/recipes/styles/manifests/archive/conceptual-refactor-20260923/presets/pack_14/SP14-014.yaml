visualDna:
  aesthetic: >-
    Aegean Titan Judgment acts as a transferable mythic-noir router: aegean translated into dark
    symbolic behavior, titan translated into dark symbolic behavior plus judgment translated into
    dark symbolic behavior fused with pantheon-scale legend grammar with regalia pressure, mythic
    jurisdiction, dualities, lineage marks, and sovereign symbolism; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    aegean shaping silhouette rhythm, contour pressure, and symbolic edge control, titan shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus judgment shaping silhouette
    rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette pressure,
    emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory actor or
    prop set.
  color_and_tone: >-
    Map color through Aegean blue-black, marble ivory, and salt-worn bronze, titan-weighted accent
    roles over disciplined dark values plus judgment-weighted accent roles over disciplined dark
    values together with mineral darks, royal metal, storm blue, cinder orange, tidal green, funeral
    rose, sun-gold, and cold ivory accents; values stay separated, accents feel intentional, and the
    dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use sea-haze light and hard sun cuts, titan-weighted rim behavior, occult glow, and charged
    shadow plus judgment-weighted rim behavior, occult glow, and charged shadow with oracular
    backglow, storm breaks, solar slashes, underwater gloom, firelit judgment, and sculptural
    chiaroscuro; shadows must carry omen weight, rims should clarify form, and glow should behave as
    ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render aegean-inflected patina, residue, grain, and tactile edge behavior, titan-inflected
    patina, residue, grain, and tactile edge behavior plus judgment-inflected patina, residue,
    grain, and tactile edge behavior alongside bronze, stone, glass, thorn, bone, water, smoke,
    root, scale, feather, hammered iron, and polished relic surfaces; surface scale, patina,
    residue, gloss, grain, and carved or sealed edges must remain coherent across characters,
    objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with verdict axes and formal weighing balance, aegean converted into repeatable spatial
    rhythm and symbolic hierarchy plus titan converted into repeatable spatial rhythm and symbolic
    hierarchy plus frieze rhythm, ring authority, mirrored duality, oath-path diagonals, heraldic
    massing, and mythic scale contrast; the style should support portraits, objects, architecture,
    creatures, symbols, and full scenes through reusable spatial grammar instead of one fixed
    layout.
  atmosphere_and_mood: >-
    Carry mood through unavoidable judgment and public consequence, aegean pressure, consequence,
    and symbolic tension plus titan pressure, consequence, and symbolic tension and austere
    grandeur, cosmic obligation, sacred violence, stewardship, trial, inheritance, and severe
    ceremonial beauty; the image can become severe, sensual, sacred, violent, quiet, or strange when
    prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with aegean recognition with denoised dark editorial polish and controlled material truth
    plus titan recognition with denoised dark editorial polish and controlled material truth and
    painterly myth-noir polish with grounded material physics, denoised darks, and strong form
    hierarchy; prioritize clean denoise, readable dark values, strong silhouette hierarchy, tactile
    material truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    aegean translated into dark symbolic behavior, titan translated into dark symbolic behavior plus
    judgment translated into dark symbolic behavior; aegean shaping silhouette rhythm, contour
    pressure, and symbolic edge control, titan shaping silhouette rhythm, contour pressure, and
    symbolic edge control plus judgment shaping silhouette rhythm, contour pressure, and symbolic
    edge control; aegean-inflected patina, residue, grain, and tactile edge behavior,
    titan-inflected patina, residue, grain, and tactile edge behavior plus judgment-inflected
    patina, residue, grain, and tactile edge behavior; sea-haze light and hard sun cuts,
    titan-weighted rim behavior, occult glow, and charged shadow plus judgment-weighted rim
