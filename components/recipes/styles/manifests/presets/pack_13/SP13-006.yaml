visualDna:
  aesthetic: 'Isao Takahata The Tale of the Princess Kaguya look (2013): charcoal-sketch lines and delicate watercolor washes, empty paper space, and figures that dissolve into loose strokes when emotion peaks.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with loose charcoal contours, simple gentle faces and watercolor-washed clothing, leaving much of each figure unfinished. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pale watercolor washes of moss green, dusk rose and ink grey on warm white paper.
  lighting_and_shadow: Soft twilight suggested only by pale washes and the glow of untouched paper around figures.
  texture_and_material: Charcoal and brush sketch lines, watercolor bleed and visible warm paper grain.
  camera_and_composition: Airy compositions with wide empty paper space around figures and spirits.
  atmosphere_and_mood: Keep the requested mood with fragile tender reverence.
  rendering_and_quality: Delicate hand-drawn feature frame that looks sketched and washed directly on paper.
  key_features: Takahata charcoal line; watercolor wash; empty paper; dissolving strokes
  creative_brief: "Isao Takahata The Tale of the Princess Kaguya look (2013): charcoal-sketch lines and delicate watercolor washes, empty paper space, and figures that dissolve into loose strokes when emotion peaks. Carry it through Takahata charcoal line, watercolor wash, empty paper, dissolving strokes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
