  color_and_tone: Dark walnut and oak, candle amber, pale linen and a cold grey skylight; strong central brightness falling away up the tiers.
  lighting_and_shadow: One top light from the lantern skylight onto the centre, supplementary candles on the rails, spectators in shadow above.
  texture_and_material: Turned timber balusters on each tier, worn standing rails, a stone or wooden central table, linen cloth, brass instruments.
  camera_and_composition: Keep the requested view; look down from the top tier into the funnel of rings, or up from the centre at the stacked balustrades.
  atmosphere_and_mood: Intense, scholarly and theatrical, every eye pressed toward one point.
