visualDna:
  aesthetic: 'Lighting-Angle Contact Sheet: the same object and artwork shown in a grid of equal cells, changing one light or camera condition per cell.'
  subject_treatment: Show the prompt's product in a grid of equal cells, each changing only one declared light or camera condition, the artwork kept exact.
  color_and_tone: Source color and reference exposure constant across cells.
  lighting_and_shadow: A declared set of frontal, side and raking lights at comparable intensity.
  texture_and_material: The original material and finish stay unchanged in every single cell.
  camera_and_composition: A contact sheet of equal cells with notes kept outside the artwork.
  atmosphere_and_mood: Disciplined comparison, like a careful photographer's test roll.
  rendering_and_quality: Every difference traces back to the one condition that changed.
  creative_brief: "Lighting-Angle Contact Sheet: the same object and artwork shown in a grid of equal cells, changing one light or camera condition per cell. Carry it through equal-cell grid, one change per cell, fixed object, test roll. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal-cell grid; one change per cell; fixed object; test roll
