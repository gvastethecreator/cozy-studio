visualDna:
  aesthetic: 'Mechanical Joint Alphabet: letters assembled from a few bars and arcs with visible joints, like a precise modular kit.'
  subject_treatment: Letter the requested words from a few bars and arcs joined at visible, consistent joints, keeping proportions and every character exact.
  color_and_tone: Color may separate parts in study, the word working in one ink.
  lighting_and_shadow: Flat rendering where joints are drawn as structural gaps.
  texture_and_material: Clean planes and joints of consistent size across the alphabet.
  camera_and_composition: Steady word rhythm with joints placed by construction.
  atmosphere_and_mood: Modular precision and legibility, engineered but still warm and friendly.
  rendering_and_quality: Crisp lettering where each letter breaks into pieces shared by the others.
  creative_brief: "Mechanical Joint Alphabet: letters assembled from a few bars and arcs with visible joints, like a precise modular kit. Carry it through bars and arcs, visible joints, modular kit, consistent pieces. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bars and arcs; visible joints; modular kit; consistent pieces
