visualDna:
  aesthetic: 'Theater rehearsal anime of obsessive repetition: marked stages, bare rehearsals, work lights and actors repeating one line until it breaks.'
  subject_treatment: Keep the prompt's subject and action; set it in rehearsal, repeated, marked with tape and watched by a critical eye.
  color_and_tone: Black box greys and bare work-light white with one colored costume piece.
  lighting_and_shadow: Harsh bare work lights, stark shadows on black walls and an empty auditorium.
  texture_and_material: Tape marks on stage floors, worn shoes, rehearsal clothes and props.
  camera_and_composition: Wide frames of a lone actor on a bare stage and close-ups of strained faces.
  atmosphere_and_mood: Obsessive and raw, an actor pushing one moment again and again toward truth.
  rendering_and_quality: Stark dramatic anime with minimal sets and intense acting.
  key_features: work lights; tape marks; bare stage; repetition
  creative_brief: "Theater rehearsal anime of obsessive repetition: marked stages, bare rehearsals, work lights and actors repeating one line until it breaks. Carry it through work lights, tape marks, bare stage, repetition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
