visualDna:
  aesthetic: 'Anglo-Saxon tinted outline: energetic outline drawings in colored inks, fluttering drapery and nervous lines with only light tints of wash, full of movement.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; draw the subject in lively colored outlines with fluttering hems and light tint.
  color_and_tone: Red, green, brown and blue ink lines with pale wash tints.
  lighting_and_shadow: No modeling; line energy and tint suggest form.
  texture_and_material: Nervous pen lines, fluttering hems and bare vellum.
  camera_and_composition: Figures in motion on bare vellum with minimal ground.
  atmosphere_and_mood: Keep the requested mood with restless windblown energy.
  rendering_and_quality: Quick lively lines, never stiff or filled, kept consistent across the whole image.
  creative_brief: "Anglo-Saxon tinted outline: energetic outline drawings in colored inks, fluttering drapery and nervous lines with only light tints of wash, full of movement. Carry it through colored outlines, fluttering drapery, light tint, nervous line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: colored outlines; fluttering drapery; light tint; nervous line
