visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around scuffed ink masses
    colliding with chipped color edges and a few abruptly broken contour joins. For color and surface, respect the prompt palette and organize it into
    soot-dark neutrals with one or two sharply bounded color accents. Sorcerous
    collision is an abstract energy in the mark-making, not an instruction to add magic,
    combat, or chaos
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through scuffed ink masses colliding with
    chipped color edges and a few abruptly broken contour joins; use detail selectively
    and keep the actual form easy to read. Add no unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; respect the prompt palette
    and organize it into soot-dark neutrals with one or two sharply bounded color
    accents. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; keep highlights small and
    directional, using value collision rather than magical beams or glowing symbols.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use dry soot grain, chipped pigment, and short
    stainlike strokes without turning marks into readable sigils. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    composition and subject count; concentrate mark density where existing forms meet,
    not in invented effects. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Sorcerous collision is an abstract energy
    in the mark-making, not an instruction to add magic, combat, or chaos. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and scuffed ink masses colliding with chipped
    color edges and a few abruptly broken contour joins; keep focal edges crisp, texture
    controlled, and dark values legible. Avoid photoreal or 3D-render drift, watermark,
    logo, and fake readable text.
  key_features: >-
    scuffed ink masses colliding with chipped color edges and a few abruptly broken
    contour joins; respect the prompt palette and organize it into soot-dark neutrals
    with one or two sharply bounded color accents; keep highlights small and
    directional, using value collision rather than magical beams or glowing symbols; use
    dry soot grain, chipped pigment, and short stainlike strokes without turning marks
    into readable sigils; and preserve composition and subject count; concentrate mark
    density where existing forms meet, not in invented effects. The five cues should
    read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use scuffed ink masses colliding with chipped
    color edges and a few abruptly broken contour joins, respect the prompt palette and
    organize it into soot-dark neutrals with one or two sharply bounded color accents,
    keep highlights small and directional, using value collision rather than magical
    beams or glowing symbols, and use dry soot grain, chipped pigment, and short
    stainlike strokes without turning marks into readable sigils; the prompt supplies
    all scene content. Do not add unrequested characters, objects, source-specific lore,
    readable symbols, or a default action.
