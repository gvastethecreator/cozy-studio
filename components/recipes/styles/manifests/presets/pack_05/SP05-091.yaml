visualDna:
  aesthetic: 'Airy digital anime cel with crystalline edge breaks: forms are rimmed by thin faceted highlights and layered with translucent cyan planes of light.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Surfaces keep their real material; the crystal logic lives only in edge highlights and planes of light, never turning objects into glass.
  color_and_tone: Cyan, ice blue and pearl white with a small blush-pink accent; high-key, cool and clean throughout.
  lighting_and_shadow: Broad cool ambient light, crisp refraction-like highlight shards along edges and a restrained cyan bloom.
  texture_and_material: Smooth digital gradients, pinpoint prismatic glints and faint hexagonal sparkle particles floating in the air.
  camera_and_composition: Keep the requested view; depth is built from overlapping translucent planes and an open, calm perspective.
  atmosphere_and_mood: Luminous, tender and spacious, like cold clear morning air.
  rendering_and_quality: Clean tapered cel edges, soft transitions, sharp glints and controlled glow, with no interface elements anywhere.
  key_features: faceted crystal edge highlights; translucent cyan planes; pearl-white high key; prismatic pinpoint glints; restrained cyan bloom
  creative_brief: "Airy digital anime cel with crystalline edge breaks: forms are rimmed by thin faceted highlights and layered with translucent cyan planes of light. Carry it through faceted crystal edge highlights, translucent cyan planes, pearl-white high key, prismatic pinpoint glints, restrained cyan bloom. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
