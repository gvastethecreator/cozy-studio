visualDna:
  aesthetic: 'Radar plan-position scope: a round phosphor display where a rotating sweep paints echoes of ships, land and weather that slowly fade.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Green or amber phosphor on black glass, brighter fresh echoes, dimmer fading trails.
  lighting_and_shadow: Screen glow only; the sweep line brightest, old returns decaying.
  texture_and_material: Phosphor bloom, curved glass reflections, faint range rings without numbers.
  camera_and_composition: Circular scope centered, subject translated into echo blips and land shapes.
  atmosphere_and_mood: Tense and watchful, something approaching in the sweep.
  rendering_and_quality: Analog radar display look; no readable numbers or bearings.
  creative_brief: "Radar plan-position scope: a round phosphor display where a rotating sweep paints echoes of ships, land and weather that slowly fade. Carry it through rotating sweep line, fading phosphor echoes, round scope, range rings, green glow on black. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rotating sweep line; fading phosphor echoes; round scope; range rings; green glow on black
