visualDna:
  aesthetic: 'Blue-hour cinematography: shooting in the short window after sunset, balancing a deep blue ambient sky against warm practical lights rigged in frame.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Cobalt and violet ambience, warm tungsten practicals, skin in mixed cool and warm light.
  lighting_and_shadow: Sky as a vast soft source, practicals boosted to read, a small warm key hidden near a lamp or window.
  texture_and_material: Glowing windows, lamps and lanterns; faint haze catching the light.
  camera_and_composition: Keep the requested framing; include a practical source and some sky.
  atmosphere_and_mood: Quiet and suspended, a scene held between day and night.
  rendering_and_quality: Clean low-light film image with rich blues; no trams or wet-street clichés.
  key_features: deep blue ambient sky; warm practicals in frame; hidden warm key; faint haze; balanced exposure
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Blue Hour Cinematography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
