visualDna:
  aesthetic: >-
    Cinema-still handling: narrow charcoal-blue contours, softened secondary edges, low-contrast
    depth layers, and isolated warm notes.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Let only
    secondary contours recede, with no ghosted copies or time-shifted subjects.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, balance slate blue,
    charcoal, and pale gray with a few amber accents; avoid a blanket sepia cast.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Respect source direction; use gentle plane
    falloff and small warm notes only on existing lit surfaces, without adding fog.
  texture_and_material: >-
    Apply texture only to materials already present. Use nearly uniform fine grain over smooth
    painted transitions; avoid frame borders and coarse film noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Vary sharpness according to
    depth already present and let existing spacing carry a held rhythm.
  atmosphere_and_mood: >-
    Preserve user mood; time is suggested by fading contrast, not nostalgia or flashback
    content.
  rendering_and_quality: >-
    Retain one sharp focal plane, clean silhouettes, and legible midground detail; no blur over
    requested features.
  key_features: >-
    Cinema-still depth; softened secondary edges; charcoal-blue values; isolated amber marks.
  creative_brief: 'Use cinema-still depth; softened secondary edges; charcoal-blue values; isolated amber marks. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
