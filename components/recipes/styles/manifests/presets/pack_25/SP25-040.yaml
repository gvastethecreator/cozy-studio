visualDna:
  aesthetic: 'Semantic Modifier Set: small status indicators added to base icons with one fixed position and meaning across the whole family.'
  subject_treatment: Add requested status indicators to the prompt's base icons at one fixed position, each indicator distinct by shape while the base metaphor stays clear.
  color_and_tone: States distinguished by shape first, with color as a repeat.
  lighting_and_shadow: Flat indicators that stay secondary to the object.
  texture_and_material: The same edge grammar for icon and indicator, with a clear cut between them.
  camera_and_composition: A matrix of bases by indicators, badge position fixed in every cell.
  atmosphere_and_mood: Discreet extra information with priority on the original object.
  rendering_and_quality: Each indicator keeps its meaning on bases with very different silhouettes.
  creative_brief: "Semantic Modifier Set: small status indicators added to base icons with one fixed position and meaning across the whole family. Carry it through fixed badge position, shape-coded states, base matrix, secondary indicators. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fixed badge position; shape-coded states; base matrix; secondary indicators
