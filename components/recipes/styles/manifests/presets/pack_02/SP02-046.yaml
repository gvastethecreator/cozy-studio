visualDna:
  aesthetic: 'Daguerreotype: a one-of-a-kind image on a mirror-polished silver-plated copper plate, finely detailed and flipping between positive and negative as the viewing angle changes.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Cool silver greys with mirror-dark shadows; a blue, rose and gold tarnish halo creeping in from the plate edges.
  lighting_and_shadow: Very bright skylight for a long exposure; soft even modeling, luminous highlights.
  texture_and_material: Mirror sheen, microscopic detail, fine hairline scratches, tarnish bloom and a brass mat edge.
  camera_and_composition: Keep the requested framing inside a small oval or rounded plate; subjects still enough for a long exposure.
  atmosphere_and_mood: Ghostly and precious, a reflection frozen in polished silver.
  rendering_and_quality: Silver-plate look with positive-negative ambiguity in the shadows; no paper texture.
  key_features: mirror silver plate; iridescent tarnish halo; extreme fine detail; brass mat edge; positive-negative shimmer
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Daguerreotype (1840s) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
