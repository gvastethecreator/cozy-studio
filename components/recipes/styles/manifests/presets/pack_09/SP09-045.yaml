visualDna:
  aesthetic: 'Felt: dense matted wool with fuzzy surface and soft rounded edges, like needle-felted craft.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is formed from dense needle-felted wool with soft rounded edges.'
  color_and_tone: Soft saturated wool colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft diffuse light showing fuzz, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Matted wool fibers with fuzzy halo and needle pits.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Cozy, handmade, soft and gentle, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: needle-felted wool; fuzzy halo; rounded edges
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Felt Fabric as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
