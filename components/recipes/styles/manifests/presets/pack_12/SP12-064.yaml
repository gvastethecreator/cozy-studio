visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through defense wave readability; tactical warfront staging, defensive
    geometry, damage history, co-op readability, and last-stand pressure, using the preset as art
    direction rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express defensive pressure, breach
    geometry, faction clarity, barricade rhythm, and survival stakes without forcing one battle
    scene.
  color_and_tone: >-
    Grade the image with wet iron, smoke grey, and ember highlights; smoke grey, worn iron,
    battlefield blue, ember orange, frost white, and siege-banner accents; keep tonal hierarchy
    strong enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with low-key night lighting with practical pools; searchlights, muzzle
    flashes, burning horizons, storm breaks, aurora glow, and smoke-filtered sun; use highlights and
    shadow pockets to reveal routes, hazards, factions, or focal threats without hiding prompt
    content.
  texture_and_material: >-
    Build surfaces from riveted armor and corroded plates; gnarled branches, fruit color, and
    defensive machinery; shattered masonry, scorched metal, splintered wood, wet mud, broken glass,
    ice crust, banners, and supply rigging; make props, clothing, creatures, vehicles, architecture,
    and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from tactical warfront staging, defensive geometry, damage
    history, co-op readability, and last-stand pressure: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood pastoral zone turned tactical; late-hour danger; urgent, battered, heroic, grim,
    tactical, and physically costly; the result can be adult, harsh, seductive, eerie, or violent
    when prompt X asks for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as battle-readable production art with clear factions, clean depth cues, and no chaotic
    poster overcrowding; preserve clean focal hierarchy, believable material response, heavy-denoise
    clarity, and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Iron, Orchard, Defense, Night; defense wave readability; wet iron, smoke grey, and ember
    highlights; low-key night lighting with practical pools; riveted armor and corroded plates;
    protected core, lanes, and fallback positions; pastoral zone turned tactical
  creative_brief: >-
    Apply Iron Orchard Defense Night as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
