visualDna:
  aesthetic: >-
    Source-informed video-game style router for original relic deckbuilder captures: 2D card-battle
    layout with hand silhouettes, enemy intent icons, relic pips, merchant/bazaar staging, and
    readable turn choices. Borrow the clean strategic readability of Slay the Spire-like games, but
    land as a different fictional relic deckbuilder with different creatures, card anatomy, UI
    icons, map props, and relic silhouettes.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable relic deckbuilder screenshot
    subject: keep clear enemy/player/object function, turn decision, card/resource pressure, intent
    cue, and scale relationship without copying source characters or named IP elements.
  color_and_tone: >-
    Use a relic deckbuilder palette: parchment beige, sapphire UI blue, monster red, poison green,
    dull gold, cave purple, bone white, and smoky black. Keep value grouping legible at gameplay
    distance, with color accents behaving like turn cost, danger, resource, intent, pickup, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through card glow, campfire or bazaar warmth, simple enemy stage light, relic
    sparkle, and clean UI contrast. Lighting must clarify turn decision, active threat, focal
    subject, or event objective and avoid generic cinematic bloom that destroys board readability.
  texture_and_material: >-
    Build surfaces from painted card silhouettes, relic icons, rough creature sprites, parchment
    panels, coin piles, bone-market props, and flat stage backdrops. Materials should feel like
    in-engine game assets captured during play, with enough texture identity to separate cards,
    enemies, relics, hazards, and interactables.
  camera_and_composition: >-
    Compose with 2D card-battle layout: hand at bottom, enemies or event object centered, intent
    icons above, relic/resource pips, and one clear turn decision. All cards and UI markings must
    stay wordless and numberless.
  atmosphere_and_mood: >-
    Carry an original relic bazaar deckbuilder mood: strategic, readable, weird, crunchy,
    mercantile, and tabletop-adjacent.
  rendering_and_quality: >-
    Finish as coherent in-engine relic deckbuilder screenshot style, not concept art: cards,
    energy/resource pips, relic row, potions, map/merchant panels, and enemy intent icons can
    appear, but no readable card text, no stat numbers, no exact relic bar UI, and no fake logos.
    Maintain heavy-denoise clarity and crisp focal hierarchy.
  key_features: >-
    original relic deckbuilder gameplay screenshots; 2D card-battle layout with hand silhouettes,
    enemy intent icons, relic pips, merchant or bazaar staging, readable turn choices; parchment
    beige, sapphire blue, monster red, poison green, dull gold, cave purple; card glow, bazaar
    warmth, clean UI contrast; painted card silhouettes, relic icons, rough creature sprites,
    parchment panels, coin piles; hand at bottom, enemies or event object centered, intent icons
    above, relic/resource pips; HUD guidance: cards, pips, relic row, potions, and enemy intent
    icons only, wordless and numberless
  creative_brief: >-
    Use Relic Bazaar Deck Trial as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through relic deckbuilder references: 2D card-battle camera, abstract card
    grammar, intent icons, resource pressure, bazaar/event staging, and readable board state. Avoid
    menus, logos, exact characters, exact levels, direct Slay the Spire cloning, readable text, and
    stat numbers.
