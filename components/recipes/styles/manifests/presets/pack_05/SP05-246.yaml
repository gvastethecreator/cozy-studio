    Retain the requested forms and movement; use elegant arcs and small decorative line rhythms
    within existing shapes.
  color_and_tone: >-
    Jewel blue, turquoise, and amber create a warm-cool balance without mandating a desert palette.
  lighting_and_shadow: >-
    Soft warm light rolls across curved planes, with sharp jewel-like points kept sparse.
  texture_and_material: >-
    Layer smooth painted color with fine ornamental strokes; do not change the depicted materials.
  camera_and_composition: >-
    Preserve the requested composition; use curved transitions and flowing spacing without adding a
    route or landscape.
  atmosphere_and_mood: >-
    Graceful and warm, with energy matched to the requested subject.
  rendering_and_quality: >-
    Keep color rich but controlled, and let delicate line detail sit over clear cel shapes.
  key_features: >-
    Jewel accents, arabesque curves, warm rhythm, and smooth color flow give this finish a distinct
    ornamental motion.
  creative_brief: >-
    Use the curved linework and jewel-toned painted finish on the requested content, without adding
    a caravan, desert, or journey.
