visualDna:
  aesthetic: >-
    A rose-ritual 90s cel style uses poised symmetry, repeated radial line accents and a deep
    garnet-violet value range. Its symbolism is formal visual repetition, not a required flower or
    ceremony.
  subject_treatment: >-
    Keep the requested subject, count and proportions. Emphasize existing forms with measured symmetry
    and fine ornamental contours; do not add a rose, emblem or ritual object.
  color_and_tone: >-
    When color is open, combine rose, garnet, wine and violet with small pale highlights. Preserve
    requested colors and avoid turning the palette into a mandatory flower motif.
  lighting_and_shadow: >-
    Use clean cel shadows and carefully placed rim accents to clarify the central rhythm. Respect
    supplied light and avoid candles or stage lighting.
  texture_and_material: >-
    Pair smooth painted areas with delicate ink ornament and a few etched details. Apply marks to
    existing forms and preserve their actual materials.
  camera_and_composition: >-
    Use axial balance and repeated spacing within the supplied composition. Preserve camera and
    arrangement; do not force a portrait, altar or symmetrical new scene.
  atmosphere_and_mood: >-
    Create solemn formality through rhythm and restraint when the requested mood allows it. Do not
    impose ritual, romance or spiritual meaning.
  rendering_and_quality: >-
    Keep fine lines crisp against broad dark shapes; use ornament selectively and maintain clear focal
    hierarchy.
  key_features: >-
    axial balance; repeated radial ornament; deep rose-garnet and violet cel values with refined ink
  creative_brief: >-
    Apply the formal cel symmetry, radial line rhythm and rose-garnet accents to the requested
    content. Preserve its identity and composition; add no flower, emblem, altar or ceremony.
