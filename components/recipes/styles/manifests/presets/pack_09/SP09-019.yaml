visualDna:
  aesthetic: >-
    Gold Leaf treats fabrication as visible style language: start from Thin foil application,
    Wrinkled foil, and Flaking, then turn manufacturing process, tooling marks, seams, tolerances,
    and industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Crinkles and overlaps: preserve identity and pose while
    letting forms carry manufactured seams, tolerances, pressure marks, and finish logic through
    edge profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Rich Gold as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Metallic reflection define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Gold Leaf without hiding the prompt
    subject.
  texture_and_material: >-
    Render Wrinkled foil through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Flaking as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Expensive, fragile by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Gilded, delicate material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Thin foil application; Crinkles and overlaps; Wrinkled foil; Metallic reflection; Flaking
  creative_brief: >-
    Route any subject through Gold Leaf as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Compose the fragile opulence of gold leaf
    applied in crinkled squares barely thicker than thought, where every wrinkle and overlap records
    the gilder's trembling hand in metallic memory. The surface should catch light like a held
    breath, areas of flat brilliance interrupted by the micro-topography of folded foil. Render the
    paradox of permanence made impossibly delicate. Use Gold Leaf as portable surface/render
    behavior over any input: map its texture, light response, edge wear, color chemistry, and
    tactile rhythm onto the subject instead of requiring a literal material sample, macro tile,
    wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
  - solid gold bar
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
