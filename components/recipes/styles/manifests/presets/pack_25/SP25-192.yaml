visualDna:
  aesthetic: 'Interrupted Ink Letters: heavy ink letters broken by deliberate structural cuts that still leave every letter unmistakable.'
  subject_treatment: Letter the requested words as heavy ink masses with structural cuts placed by anatomy, every distinctive trait and accent kept.
  color_and_tone: One solid ink with the ground showing through the cuts.
  lighting_and_shadow: Flat lettering where the cuts are drawn into the letters.
  texture_and_material: Controlled ink edges, minimal irregularity and wide openings.
  camera_and_composition: Cuts distributed by function rather than one identical stripe.
  atmosphere_and_mood: Printed force and internal pauses, bold and punchy.
  rendering_and_quality: Crisp lettering that still reads when reduced and without texture.
  creative_brief: "Interrupted Ink Letters: heavy ink letters broken by deliberate structural cuts that still leave every letter unmistakable. Carry it through heavy ink, structural cuts, anatomy-led breaks, punchy weight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: heavy ink; structural cuts; anatomy-led breaks; punchy weight
