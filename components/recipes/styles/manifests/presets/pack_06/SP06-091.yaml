visualDna:
  aesthetic: 'Monochrome vector display: bright white beam lines on black, tinted in zones by a translucent printed color overlay sheet laid over the screen.'
  subject_treatment: Keep the prompt subject, action and camera view; draw it as white vector outlines and let the overlay tint horizontal zones of the screen.
  color_and_tone: White lines only, colored by overlay bands such as red at top, green in the middle and blue below; black stays black.
  lighting_and_shadow: No shading; line brightness varies with beam speed, with hot dots at line ends.
  texture_and_material: Sharp beam lines, faint curved-glass reflection, subtle overlay print texture and soft phosphor afterglow.
  camera_and_composition: Keep the requested view; the overlay bands are aligned to the subject so each zone colors a part of it.
  atmosphere_and_mood: Lonely and luminous, cold space with a hand-painted tint.
  rendering_and_quality: Clean continuous white lines, flat overlay tint; no raster pixels and no multicolor lines.
  key_features: white beam lines; translucent color overlay bands; hot line ends; curved-glass reflection; black screen
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies White Beam Vector with Color Overlay as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
