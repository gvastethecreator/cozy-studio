visualDna:
  aesthetic: 'Garment pattern layout: the costume of the subject flattened into sewing pattern pieces printed on pale tissue paper, with a small croquis of the finished garment.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a flat sewing-pattern layout of the garment pieces with a small croquis of the finished piece, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Translucent pale tan tissue, black printed outlines, one or two line colors for different sizes.
  lighting_and_shadow: Flat soft light with faint shadows where the tissue wrinkles or overlaps.
  texture_and_material: Thin tissue with creases and slight transparency, dashed seam allowances, grainline arrows, notch triangles and fold marks.
  camera_and_composition: Top-down layout of nested pattern pieces filling the sheet, the croquis small in one corner.
  atmosphere_and_mood: Methodical and crafty, a costume waiting to be cut.
  rendering_and_quality: Accurate pattern-piece shapes with no piece names, sizes or instructions written.
  creative_brief: "Garment pattern layout: the costume of the subject flattened into sewing pattern pieces printed on pale tissue paper, with a small croquis of the finished garment. Carry it through flat pattern pieces, grainline arrows, notches and dashed seam lines, creased tissue paper, small croquis. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: flat pattern pieces; grainline arrows; notches and dashed seam lines; creased tissue paper; small croquis
