visualDna:
  aesthetic: 'Low-poly blockout concept: the scene modeled as coarse proxy geometry of a few hundred flat-shaded facets, then painted over with quick light, fog and color notes.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: Muted clay-grey or single-tint geometry with loose painted color zones laid over it and one saturated light color.
  lighting_and_shadow: Real-time sun and flat facet shading from the blockout, plus hand-painted glows, fog gradients and light shafts on top.
  texture_and_material: Untextured facets with visible polygon edges, and brush strokes crossing facet boundaries wherever the paintover sits.
  camera_and_composition: Keep the requested view; a slightly wide game-camera perspective keeps the massing readable.
  atmosphere_and_mood: Early and promising, a space that already feels playable in grey boxes.
  rendering_and_quality: Hybrid finish, crisp facet geometry underneath and loose paint marks on top; not a polished low-poly art render.
  key_features: coarse flat-shaded proxy geometry; clay-grey facets; painted glow and fog over the mesh; strokes crossing facet edges; game-camera view
  creative_brief: "Low-poly blockout concept: the scene modeled as coarse proxy geometry of a few hundred flat-shaded facets, then painted over with quick light, fog and color notes. Carry it through coarse flat-shaded proxy geometry, clay-grey facets, painted glow and fog over the mesh, strokes crossing facet edges, game-camera view. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
