visualDna:
  aesthetic: >-
    Manga (Shonen) acts as a transferable illustration router: start from High-energy action manga
    in monochrome print language, Speed vectors, panel impact framing, energy-emphasis effects and
    comic-illustration system built from ink hierarchy, panel-era color, contour exaggeration, print
    artifacts, and sequential-art readability, then apply the visual behavior to prompt X instead of
    recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Aggressive contour weight shifts, speed-line fields, impact
    burst geometry; preserve the requested subject while translating form into panel-ready
    silhouettes, expressive contour weight, stylized anatomy, speed emphasis, or graphic restraint
    only when the preset calls for it, keeping the requested identity, silhouette, pose, object
    function, or setting legible.
  color_and_tone: >-
    Build color with Black, white, and screentone grayscale hierarchy; treat color as comic
    production language: four-color plates, limited spot color, manga monochrome, digital flats,
    noir contrast, webtoon gradients, or painted page atmosphere, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Hard-contrast shadow cuts with directional momentum accents; make light
    read through ink spotting, cel-like value blocks, dramatic rim separation, flat print fill, or
    painted page modeling rather than generic studio illumination, so value structure supports the
    illustration process and does not overwrite the requested content.
  texture_and_material: >-
    Render Visible screentone raster and ink-solid blacks; surface detail should reveal paper tooth,
    newsprint dots, screen tones, digital brush layers, ink pools, gutter discipline, or pixel cells
    at a scale that supports the drawing, keeping material scale coherent and avoiding noisy filler
    texture.
  camera_and_composition: >-
    Structure the image through Exaggerated perspective and motion warping during impact moments;
    compose with panel logic, silhouette clarity, speech-shape space, page rhythm, close-up drama,
    or scroll pacing without requiring a fixed comic-page scene, with scale, spacing, edge rhythm,
    and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Intense, competitive, escalation-driven, mood carried by Manga (Shonen) craft,
    material pressure, and visual restraint; derive mood from era, genre pressure, satire,
    melodrama, horror obsession, pulp energy, or graphic-novel seriousness, letting the style alter
    interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Dynamic editorial panel finish with sharp kinetic readability; finish with clear ink
    decisions, readable stylization, controlled artifacting, and no generic superhero costume or
    random comic text replacing the prompt, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    High-energy action manga in monochrome print language; Speed vectors, panel impact framing,
    energy-emphasis effects; Black, white, and screentone grayscale hierarchy; Visible screentone
    raster and ink-solid blacks; Exaggerated perspective and motion warping during impact moments
  creative_brief: >-
    Apply Manga (Shonen) as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    High-energy action manga in monochrome print language, Speed vectors, panel impact framing,
    energy-emphasis effects, Visible screentone raster and ink-solid blacks without requiring the
    card image's original subject.
