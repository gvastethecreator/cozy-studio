visualDna:
  aesthetic: 'Painted martial-arts manhua: sharp ink figures fully colored with airbrush gradients, glowing energy auras and metallic gold highlights.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Rich jade, crimson and gold over deep indigo, airbrushed gradients and burning white cores in the energy trails.
  lighting_and_shadow: Glow from the energy itself lighting the figure, strong backlit rims, airbrushed soft shadows.
  texture_and_material: Silky flowing robes and hair, gold foil-like highlights on ornaments, mist and ink-splash effects.
  camera_and_composition: Soaring diagonal compositions, figures balanced on impossible points, long swirling trails of cloth and energy.
  atmosphere_and_mood: Grand heroic wuxia drama, elegant and explosive at once.
  rendering_and_quality: Crisp ink contour under smooth airbrush color and metallic sheen; no flat print color, no screentone.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Airbrush Manhua Action as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: airbrush gradient color; energy auras; metallic gold highlights; flowing silk trails; soaring diagonal composition
