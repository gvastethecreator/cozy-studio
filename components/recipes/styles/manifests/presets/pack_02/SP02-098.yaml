visualDna:
  aesthetic: 'Napkin scribble blueprint: a late-night idea sketched in ballpoint on a soft paper cocktail napkin, lines feathering into the tissue.'
  subject_treatment: Keep the prompt subject intact and draw it with this tool on this support; the support is shown only as the drawing surface, never added as an extra object in the scene.
  color_and_tone: Off-white embossed napkin, blue or black ballpoint, coffee or wine ring stains.
  lighting_and_shadow: Warm bar light from one side, faint shadows in the embossed pattern.
  texture_and_material: Ink bleeding and feathering into soft tissue, embossed napkin border, condensation wrinkles.
  camera_and_composition: Napkin seen from above on a bar surface, the sketch filling most of it.
  atmosphere_and_mood: Urgent and inspired, genius scribbled before the idea escapes.
  rendering_and_quality: Real ballpoint on tissue; no readable notes, only lines, arrows and shapes.
  key_features: ballpoint feathering on tissue; embossed napkin border; ring stains; exploded-view arrows; bar light
