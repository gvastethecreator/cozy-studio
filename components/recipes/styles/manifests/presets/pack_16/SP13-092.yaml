  color_and_tone: Phosphor green monochrome with bright white highlights and near-black corners.
  lighting_and_shadow: Infrared illumination falling off quickly, eyes and reflective surfaces glowing.
  texture_and_material: Heavy sensor grain, vignette and slight motion blur over simplified anime shapes.
  camera_and_composition: Handheld, low and tilted, subjects caught at the edge of the beam.
  atmosphere_and_mood: Panicked and claustrophobic, breathing loudly in the dark with nowhere to go.
