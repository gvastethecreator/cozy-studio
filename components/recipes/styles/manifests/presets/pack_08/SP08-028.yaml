visualDna:
  aesthetic: 'Cottagecore: romantic rural wardrobe — puff-sleeve prairie dresses, aprons, knitted cardigans, straw hats and embroidered florals.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a puff-sleeve prairie or smocked dress, linen apron or knitted cardigan, straw hat or headscarf, and simple leather boots or clogs."
  color_and_tone: Cream, sage, faded rose, butter yellow and small calico florals.
  lighting_and_shadow: Soft morning sunlight through leaves, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Linen, cotton calico, hand-knit wool, straw and embroidery, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Gentle full figure in garden, meadow or kitchen, keeping the full outfit silhouette and fit readable at a glance.
  atmosphere_and_mood: Tender, nostalgic, pastoral and calm, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Soft, dreamy, warm finish, with believable fabric weight, seams and fit detail.
  key_features: puff-sleeve prairie dress; linen apron; straw hat; calico florals; soft morning light
  creative_brief: "Cottagecore: romantic rural wardrobe — puff-sleeve prairie dresses, aprons, knitted cardigans, straw hats and embroidered florals. Carry it through puff-sleeve prairie dress, linen apron, straw hat, calico florals, soft morning light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
