visualDna:
  aesthetic: >-
    Group forms into compact dark masses balanced by soft lights and matte watercolor washes with
    restrained transitions. Concentrate detail in a few local focal areas instead of dramatizing the
    whole image.
  subject_treatment: >-
    Preserve requested identity, proportions, pose, count and action. Use value grouping to clarify
    existing forms without monumentalizing them or adding folklore characters.
  color_and_tone: >-
    Preserve the requested palette and time of day. Let compact dark values and soft lights work within
    those colors; do not force a night scene, moonlight or a fixed Swedish palette.
  lighting_and_shadow: >-
    Follow the requested lighting and shadow direction. Keep light soft where the source permits, but
    do not lower the overall exposure or dramatize a bright scene.
  texture_and_material: >-
    Keep matte watercolor washes contained and preserve the actual materials in the image. Do not add
    paper aging, forest textures or blanket pigment noise.
  camera_and_composition: >-
    Preserve the requested viewpoint, scale, crop and arrangement. Do not impose a vast landscape,
    towering figures or a storybook page composition.
  atmosphere_and_mood: >-
    Preserve the user's setting and mood. This reference is a Swedish watercolor illustration by John
    Bauer from 1913, not medieval evidence or a universal Swedish folklore style; do not infer its story
    or forest setting.
  rendering_and_quality: >-
    Keep dark masses compact, soft lights controlled and washes matte. Maintain subject readability and
    avoid global darkness, dramatic glow or overworked detail.
avoidRules:
  - unrequested forest, troll, child, moon or folklore story
  - unrequested monumental scale or landscape
  - forced night lighting or global darkness
  - false attribution of the 1913 source as medieval or universal Swedish style
