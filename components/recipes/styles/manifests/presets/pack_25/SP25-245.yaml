  aesthetic: 'Broken-Lattice Florals: a supporting lattice breaks at controlled points where stylized motifs carry its lines onward.'
  subject_treatment: Build a repeating lattice that breaks at controlled points where stylized motifs from the prompt's subject continue its directions.
  color_and_tone: A quieter support lattice and dominant motifs, the gaps kept active.
  lighting_and_shadow: Flat surface where every separated lattice segment stays visibly separate.
  texture_and_material: Constant lattice strokes and simplified motif masses with clean breaks.
  camera_and_composition: Offset lattice, alternating breaks and continuity at opposite edges.
  atmosphere_and_mood: Order opening up and re-forming again, structured yet free.
  rendering_and_quality: Clean repeat with aligned segments and deliberate open nodes.
