visualDna:
  aesthetic: 'Disposable single-use camera: a fixed-focus plastic lens, a weak built-in flash and fast consumer film, used without thought at close range.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Contrasty consumer color, flash-warmed skin, slightly green fluorescent or orange tungsten background casts, and a hot center.
  lighting_and_shadow: Built-in flash blasting the nearest subject, harsh falloff within two meters, dark background, occasional red-eye and hard shadow outline.
  texture_and_material: Noticeable grain, soft plastic-lens edges, chromatic fringing in the corners, slight motion blur in the background.
  camera_and_composition: Keep the requested subject and setting; eye-level snapshot, slightly off-level, subjects too close or cut at the edges.
  atmosphere_and_mood: Candid and funny, blasted bright foregrounds against sudden careless darkness.
  rendering_and_quality: Cheap-camera honesty — flash hotspot, grain, soft corners — without a drawn date stamp or border.
  key_features: built-in flash hotspot; harsh falloff; plastic-lens softness; corner fringing; consumer film grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Disposable Camera as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
