visualDna:
  aesthetic: 'Absolute black monolith: architecture reduced to matte light-absorbing black volumes with no ornament, readable only by a faint silver edge light and its shadow.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the light-absorbing black material and the vast empty setting around it, and it never bends, loops or breaks the requested structure.
  color_and_tone: Absolute black volumes against silver-grey sky and pale ground; no other color at all.
  lighting_and_shadow: Flat overcast light, a hairline silver highlight on one edge, a crisp pale shadow on the ground.
  texture_and_material: Surfaces show no texture, reflection or detail; only the silhouette and the ground shadow describe form.
  camera_and_composition: Keep the requested geometry; a vast empty ground and one tiny scale cue such as a tree or a boulder.
  atmosphere_and_mood: Austere, silent and ominous, an absence standing in the landscape.
  rendering_and_quality: Minimal photographic rendering with pure black planes; no panels, runes or ornament.
  key_features: matte light-absorbing black volume; hairline silver edge light; vast empty ground; one tiny scale cue; crisp pale shadow
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Absolute Black Monolith as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
