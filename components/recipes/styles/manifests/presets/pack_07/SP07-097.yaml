  aesthetic: 'Oak-panelled courtroom: a hierarchy built in joinery, with a raised bench under a canopy, a railed dock, a jury box, counsel tables and a public gallery, all in dark panelled oak.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Dark oak brown, green leather, brass, cream plaster above the panelling, grey daylight; sober and low saturation.
  lighting_and_shadow: High clerestory or lantern daylight falling on the well of the court, darker panelled edges, green-shaded lamps on the bench.
  texture_and_material: Raised-and-fielded oak panels, turned rails and spindles around the dock, green leather seats, brass rails, carved canopy over the bench.
  camera_and_composition: Keep the requested view; low angle from the well toward the raised bench to stress hierarchy, or from the dock looking out.
  atmosphere_and_mood: Grave, formal and tense, judgement built into the furniture.
  rendering_and_quality: Sober daylight photograph with legible joinery, no readable crests, mottoes or documents.
