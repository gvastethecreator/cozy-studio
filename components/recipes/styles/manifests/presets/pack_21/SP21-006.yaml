visualDna:
  aesthetic: >-
    Dry-pastel illustration built by layering soft pigment across a toothed paper surface, with the
    exposed tooth breaking broad color passages into small coherent flecks.
  subject_treatment: >-
    Keep the requested identity, proportions and action legible. Shape existing forms through grouped
    pastel deposits and selective softened edges rather than a new pose or generic haze.
  color_and_tone: >-
    Respect the requested palette. Build a compact value range from adjacent pastel layers, leaving
    some support visible between marks and reserving the strongest chroma for existing focal forms.
  lighting_and_shadow: >-
    Preserve the requested light direction. Deepen existing shadow groups with denser dry pigment
    and soften selected transitions without spreading a glow beyond the forms.
  texture_and_material: >-
    Let the paper tooth interrupt the pigment visibly. Feather only chosen joins by rubbing; keep
    separate marks in the rest of each passage instead of creating a uniformly blended airbrush.
  camera_and_composition: >-
    Preserve the user's frame, viewpoint and arrangement. Organize pastel edges within the existing
    focal hierarchy without adding a page border, plate edge or print-shop marks.
  atmosphere_and_mood: >-
    Carry the requested mood through pigment density, softness and spacing. Dry pastel does not
    require a nostalgic scene, a theatrical backdrop or a particular subject.
  rendering_and_quality: >-
    Balance visible tooth with clean focal boundaries and readable value groups. Avoid greasy crayon
    lines, lithographic transfer grain and a powder layer spread uniformly across the image.
avoidRules:
  - greasy crayon or lithographic transfer marks
  - uniform powder haze over the whole image
  - blurred focal boundaries
assets:
