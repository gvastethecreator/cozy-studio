visualDna:
  aesthetic: 'Fluoroscopy: live X-ray video frame, grainy greyscale with dark bones and a circular field.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: shown as a grainy live X-ray frame: bones and dense objects dark, soft tissue faint, motion blur."
  color_and_tone: Greyscale inverted, exactly as the instrument maps its signal.
  lighting_and_shadow: No light, because the image shows signal, not ordinary light.
  texture_and_material: Grain and blur, as real instrument artifacts rather than decoration.
  camera_and_composition: Circular field, matching how this instrument actually frames data.
  atmosphere_and_mood: Clinical, live, eerie and intimate, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fluoroscopy as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
