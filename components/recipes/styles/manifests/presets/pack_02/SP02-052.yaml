visualDna:
  aesthetic: 'Holga toy-camera lomography: a plastic 120 camera with a leaky body and a soft plastic lens, often shot on 35 mm so the sprocket holes are exposed.'
  subject_treatment: Keep the prompt subject, action and setting as they are; add only the toy-camera artifacts — leaks, rebate, vignette — never period props.
  color_and_tone: Oversaturated cross-shifted color, red-orange light leaks, dark heavy corners.
  lighting_and_shadow: Whatever light is there, with orange leaks burning in from one edge.
  texture_and_material: Exposed sprocket-hole rebate along an edge, soft blur, overlapping frame edges.
  camera_and_composition: Square-ish frame, heavy vignette, occasional overlap with the neighboring frame.
  atmosphere_and_mood: Spontaneous and experimental, every happy accident gladly embraced.
  rendering_and_quality: Toy-camera artifacts in the negative; distinct from the Lomo LC-A lens look in pack_01.
  key_features: red-orange light leaks; exposed sprocket rebate; heavy vignette; plastic-lens blur; overlapping frames
  creative_brief: "Holga toy-camera lomography: a plastic 120 camera with a leaky body and a soft plastic lens, often shot on 35 mm so the sprocket holes are exposed. Carry it through red-orange light leaks, exposed sprocket rebate, heavy vignette, plastic-lens blur, overlapping frames. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
