visualDna:
  aesthetic: 'Modern minimalist interior built from flush planes: handle-less push-latch joinery, shadow-gap skirting, recessed doors and one pale oak element against microcement and limewash.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Warm mineral white, bone and pale stone greige with one pale oak or travertine accent; no pure white and no saturated color, value steps kept small.
  lighting_and_shadow: Large soft daylight from a slot skylight or recessed window, concealed linear LED in coves, long gentle shadows that reveal the three-millimetre shadow gaps.
  texture_and_material: Seamless trowelled microcement floor, fine limewash walls with soft cloud movement, rift-sawn pale oak with tight grain, honed stone, no visible fixings.
  camera_and_composition: Keep the requested view; favour one-point frontal framing with large empty wall fields, horizon lines aligned to joints and the few objects set off-centre.
  atmosphere_and_mood: Quiet, restrained and exact, where emptiness feels deliberate and calm.
  rendering_and_quality: 'Architectural photograph clarity: straight verticals, crisp shadow gaps, even plaster tone without banding, no staged clutter.'
  key_features: flush handle-less joinery; shadow-gap skirting; warm mineral white limewash; seamless microcement floor; single pale oak accent
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Modern Minimalist as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
