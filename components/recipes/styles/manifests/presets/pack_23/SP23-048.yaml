visualDna:
  aesthetic: >-
    Optional explanatory-sheet format for content explicitly supplied for presentation, separate from
    any illustration technique.
  subject_treatment: >-
    Preserve the supplied subject, image, wording and relationships. Do not add figures, labels or
    explanatory claims to fill unused space.
  color_and_tone: >-
    Preserve the supplied palette and tonal relationships. The sheet structure does not impose a
    theme-specific color treatment.
  lighting_and_shadow: >-
    Preserve the requested lighting within each supplied image. The page format adds no room, light
    source or shadows from unrequested elements.
  texture_and_material: >-
    Preserve the supplied material cues and keep the support neutral unless a surface treatment is
    explicitly requested.
  camera_and_composition: >-
    Only when this profile is explicitly selected, organize supplied content around a primary image and
    add secondary zones only for user-provided details or annotations. Scale the arrangement to the
    available information and preserve the requested wording and spatial relationships.
  atmosphere_and_mood: >-
    Retain the requested mood and context. An explanatory hierarchy does not add a setting, narrative
    or visual motif.
  rendering_and_quality: >-
    Keep provided wording exact and legible. Leave unused space open rather than inventing text, symbols,
    diagrams or decorative marks.
avoidRules:
  - fabricated labels, text or explanatory details
  - unrequested secondary illustrations or decorative framing
  - layout that changes the supplied content or its relationships
assets:
  defaultImage: /assets/recipes/styles/defaults/SP23-048.webp
attributes:
  negativePrompt: fabricated labels, text or explanatory details, unrequested secondary illustrations or decorative framing, layout that changes the supplied content or its relationships
  intentionalPolicy:
    schemaVersion: 1
    kind: representation_profile
    defaultFields:
