visualDna:
  aesthetic: 'Local news chroma-key package: the subject keyed over a background plate on a budget, with telltale green halos and mismatched light.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Studio-blue foreground over an oversaturated background plate; faint green spill on edges.
  lighting_and_shadow: Foreground and background lit differently, so the subject never quite sits in the plate.
  texture_and_material: Hard or fringed key edges, blocky compression around hair, a flat inset rectangle.
  camera_and_composition: Subject standing in front of the plate, a small inset box in an upper corner.
  atmosphere_and_mood: Earnest and slightly clumsy, local television trying its best.
  rendering_and_quality: Standard-definition video with visible compositing flaws; no readable graphics.
  key_features: chroma-key halo; mismatched foreground and plate light; green spill; inset rectangle; SD compression
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Local News Chroma Key Package as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
