  color_and_tone: Molten orange and red glowing against black basalt, charcoal ash and sulfur yellow.
  lighting_and_shadow: Hot glow from lava below lighting faces upward, smoky dark skies above.
  texture_and_material: Black basalt, glassy obsidian, cooling lava crust, ash, soot and heat haze.
  camera_and_composition: Dramatic slopes with glowing rivers cutting through dark rock and tiny figures.
  atmosphere_and_mood: Fierce and proud, a people who live on top of the fire and use it.
  rendering_and_quality: High-contrast glowing illustration with heat shimmer and ash particle detail.
