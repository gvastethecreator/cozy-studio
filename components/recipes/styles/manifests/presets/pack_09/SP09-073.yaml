visualDna:
  aesthetic: >-
    Linoleum Floor treats fabrication as visible style language: start from Retro linoleum pattern,
    Smooth plastic, and Peeling corner, then turn manufacturing process, tooling marks, seams,
    tolerances, and industrial material behavior into portable surface behavior rather than a
    literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Printed pattern: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Beige, pattern as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Waxy sheen define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Linoleum Floor without hiding the prompt subject.
  texture_and_material: >-
    Render Smooth plastic through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Peeling corner as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Nostalgic, home by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Retro, cheap material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Retro linoleum pattern; Printed pattern; Smooth plastic; Waxy sheen; Peeling corner
  creative_brief: >-
    Route any subject through Linoleum Floor as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Apply retro linoleum as printed material
    system: waxy beige surface, repeating mid-century motifs, smooth plastic tiredness, slight
    peeling corners, and nostalgic cheapness preserved in vinyl. If floor, interior, prop, or
    product exists, let pattern sit on it; otherwise use linoleum repetition and worn sheen as
    graphic surface treatment without requiring a kitchen.
