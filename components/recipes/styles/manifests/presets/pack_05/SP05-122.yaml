visualDna:
  aesthetic: 'Grounded cinematic anime: sober adult proportions, thin precise lines, desaturated film-graded color and handheld framing, with sudden violent motion shown as fluorescent streaks.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Soot grey, dull rust and pale concrete, with fluorescent yellow-green streak accents.
  lighting_and_shadow: Motivated practical light from overhead tubes or windows with soft grounded falloff.
  texture_and_material: Grime, scuffs and subtle film grain; lens-like shallow depth of field.
  camera_and_composition: Keep the requested content; handheld off-center framing, tight crops and shallow depth.
  atmosphere_and_mood: Worn tension and dry absurdity, exhausted people in grimy places doing strange things.
  rendering_and_quality: Restrained cinematic finish, grain confined to shadows, main silhouette always clear.
  key_features: desaturated film grade; handheld off-center framing; thin precise lines; fluorescent streak accents; grime and shallow depth
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Muted Cinematic Grime Frenzy as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
