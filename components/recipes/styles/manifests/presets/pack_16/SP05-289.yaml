visualDna:
  aesthetic: >-
    Use ascetic chiaroscuro: blue-black masses, clean bone-gray cutouts, hairline ink edges, and
    scarce engraved hatch.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Hatch defines
    existing forms without adding costume or ornament.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, restrict color to deep ink,
    smoke gray, and bone white, with at most one accent already supported by the prompt.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Respect supplied light; use a narrow hard
    rim against broad shadow, never invent candlelight.
  texture_and_material: >-
    Apply texture only to materials already present. Keep cross-hatch sparse and tied to present
    surface texture; leave smooth areas unornamented.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Use austere negative-space
    balance only within existing geometry, adding no architecture or vignette.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Maintain the user's emotional tone; silence is low
    mark density, not solemnity or gothic content.
  rendering_and_quality: >-
    Protect thin contours from noise, hold dark values clean, and preserve detail within
    high-contrast silhouettes.
  key_features: >-
    Blue-black mass; bone-gray cutout; hairline edge; sparse engraved hatch.
  creative_brief: "Use blue-black mass; bone-gray cutout; hairline edge; sparse engraved hatch. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
