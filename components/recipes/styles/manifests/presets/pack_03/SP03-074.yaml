visualDna:
  aesthetic: 'Neon sign construction: the subject redrawn as one continuous line of bent glass tubing glowing with gas, mounted on a dark backing with visible hardware.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: One to three pure gas colors — ruby red, argon blue, phosphor pink — each tube with a hot white core.
  lighting_and_shadow: 'The tubes are the only light: a colored halo on the backing wall, soft spill on nearby surfaces and black-painted blockout sections left dark.'
  texture_and_material: Glass tube bends with slight thickness change, electrode ends, standoff clips, cable runs and a small transformer box.
  camera_and_composition: Keep the requested view; the tube drawing reads as a clean continuous outline of the subject.
  atmosphere_and_mood: Electric and nocturnal, a hum of light in a dark room.
  rendering_and_quality: Physical glass tubes casting real glow and reflections, not a flat 2D neon stroke; lettering only when the prompt supplies it.
  key_features: continuous bent glass tube line; hot white core; colored halo on backing; blacked-out tube sections; standoffs and transformer
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Neon Sign 3D as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
