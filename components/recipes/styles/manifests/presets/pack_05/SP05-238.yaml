visualDna:
  aesthetic: 'Digital tokusatsu-homage anime: clean cel shading in bold saturated primaries, low telephoto giant-scale framing, and fine glowing grid lines tracing major contours.'
  subject_treatment: Keep the prompt subject, action and setting redrawn in this mechanical anime rendering; this preset owns a low telephoto giant-scale camera, and a plant stays a plant, never a robot or kaiju.
  color_and_tone: Steel white, navy and signal red or cyan in hard blocks, against bright summer-sky blue and towering white cumulus.
  lighting_and_shadow: Crisp midday sun with hard two-tone cel shadows and thin glowing cyan grid lines along the major edges.
  texture_and_material: Smooth digital cel paint with tiny miniature-set detail at ground level so the subject reads colossal.
  camera_and_composition: "Owns a worm's-eye telephoto view: horizon low, depth compressed, the subject towering above tiny rooftops, poles or trees."
  atmosphere_and_mood: Bright heroic summer-afternoon spectacle with a hint of toy-model wonder.
  rendering_and_quality: Clean vector cel lines, two shadow values, glowing grid-line accents and crisp cumulus; no painterly mush.
  key_features: worm's-eye telephoto giant scale; bold primary color blocks; glowing cyan grid-line contours; towering summer cumulus; miniature ground detail
  creative_brief: "Digital tokusatsu-homage anime: clean cel shading in bold saturated primaries, low telephoto giant-scale framing, and fine glowing grid lines tracing major contours. Carry it through worm's-eye telephoto giant scale, bold primary color blocks, glowing cyan grid-line contours, towering summer cumulus, miniature ground detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
