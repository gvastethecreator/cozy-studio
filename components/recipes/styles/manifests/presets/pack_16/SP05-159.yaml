visualDna:
  aesthetic: >-
    A punk-influenced anime finish built from hard dark contours, irregular accents and
    roughened edges.
  subject_treatment: >-
    Preserve identity, anatomy and clothing. Use angular contour breaks and expressive line
    weight, with pose guided by the supplied action.
  color_and_tone: >-
    When the prompt leaves color open, black and crimson with a small acidic accent can set
    the contrast. Keep any explicit palette unchanged.
  lighting_and_shadow: >-
    Group shadows densely and place dirty highlights or a hard rim selectively to keep the
    silhouette clear.
  texture_and_material: >-
    Use rough ink or scuffed grain only on surfaces already depicted.
  camera_and_composition: >-
    Honor the requested framing and preserve figure separation.
  atmosphere_and_mood: >-
    Abrasive tension or alienation may be conveyed through contrast when requested; follow
    the prompt's tone.
  rendering_and_quality: >-
    Let roughened edges remain controlled around a clear focal contour; blend background
    paint without losing the subject.
  key_features: >-
    Hard dark contour; irregular accent color; rough ink edges; dense shadow with dirty
    highlight separation.
  creative_brief: 'Apply the rough line and contrast treatment to the forms already present. Keep requested clothing, palette, action and emotional tone. Use it as a reusable look on any subject.'
