visualDna:
  aesthetic: >-
    NFT Collectible Avatar Render acts as a transferable CGI-style router: start from Collectible
    avatar render language, Profile view, trait accessories and organic and character CGI system
    built from anatomy, grooming, cloth, soft-body simulation, food material, medical cutaway, and
    believable sculpt topology, then apply the 3D/render behavior to prompt X instead of recreating
    a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Clean; preserve the prompt subject while routing it through
    organic form flow, garment dynamics, avatar readability, diagnostic cutaway, or appetizing
    surface simulation, keeping the requested identity, silhouette, pose, object function, or
    environment legible.
  color_and_tone: >-
    Build color with Neon, Gold, Rare traits, rarity gradient; let color follow skin, cloth, food,
    biological tissue, mylar, medical material, fashion fabric, or stylized collectible accents
    without flattening the shader, with deliberate value grouping, exposure control, and
    medium-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Studio, promo ready; shape light through subsurface lift, cloth sheen, food
    steam, rim grooming, diagnostic clarity, reflective foil, or studio character presentation, so
    value structure supports the renderer and does not overwrite the requested content.
  texture_and_material: >-
    Render Plastic, Metal, collectible finish; surface detail should show sculpt topology, pores,
    muscles, wrinkles, cloth weave, droplets, mylar seams, cutaway planes, or organic growth flow,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for NFT Collectible Avatar Render: three quarter or
    orthographic framing, clean silhouette read, material highlights, controlled depth, and vertical
    card composition; compose for model readability through turnarounds, pose-neutral clarity,
    garment silhouette, cutaway hierarchy, appetizing macro, or avatar trait legibility, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Hype, digital, exclusive drop; derive mood from body realism, digital fashion
    spectacle, clinical explanation, collectible identity, craving, celebration, or uncanny organic
    transformation, letting the renderer alter interpretation without demanding a specific story,
    location, or character.
  rendering_and_quality: >-
    Finish with Bored Ape 3D collectible, avatar centric hype; finish with stable anatomy or object
    structure, clean simulation, readable material detail, and no melted limbs or fake plastic skin,
    clean denoised surfaces where appropriate, and enough shader evidence to make the CGI mode
    recognizable.
  key_features: >-
    Collectible avatar render language; Profile view, trait accessories; Neon, Gold, Rare traits,
    rarity gradient; Plastic, Metal, collectible finish; Lookdev camera for NFT Collectible Avatar
    Render: three quarter or orthographic framing, clean silhouette read, material highlights,
    controlled depth, and vertical card composition
  creative_brief: >-
    Apply NFT Collectible Avatar Render as a CGI/render preset over prompt X: preserve the user's
    requested subject, then route modeling, shader response, lighting, material scale, composition,
    mood, and final render craft through Collectible avatar render language, Profile view, trait
    accessories, Plastic, Metal, collectible finish without requiring the card image's original
    subject.
avoidRules:
