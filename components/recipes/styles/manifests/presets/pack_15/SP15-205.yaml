  color_and_tone: Grey and white chalky stone, sea blue and white foam with orange safety harness accents.
  lighting_and_shadow: Bright windy daylight with fast cloud shadows and spray glinting below.
  texture_and_material: Chalk cliff, bolted steel, iron ladders, ropes, nesting straw and sea spray.
  camera_and_composition: Vertical views hanging on the cliff, with the sea far below and birds around.
  atmosphere_and_mood: Windy, loud and daring, everyday life with a huge fall beneath every step.
  rendering_and_quality: Crisp airy illustration with strong vertical depth and flying seabirds.
