  color_and_tone: High-visibility yellow and warm orange against deep blue-grey and pale neutral.
  lighting_and_shadow: Even daylight, pale highlights and clearly separated shadow shapes.
  texture_and_material: Matte color blocks, panel seams and rivets, fine grain only in the darks.
  camera_and_composition: Keep the requested framing; wide clean frames with grid intervals that make scale measurable.
  atmosphere_and_mood: Measured resilience and calm procedure under threat.
  rendering_and_quality: Stable silhouettes, crisp machine edges and controlled color blocks without chaos.
  key_features: hi-vis orange and yellow equipment; grid tick scale marks; sturdy dark contour; matte blue-grey; wide procedural framing
