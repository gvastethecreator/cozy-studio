visualDna:
  aesthetic: 'Balloonpunk: a sky society of patched hot-air balloons, wicker gondolas, sandbag ballast and floating markets tethered above the clouds.'
  subject_treatment: Keep the prompt's subject and setting; lift it into the air on balloons, gondolas and tethers, with ropes and ballast visible.
  color_and_tone: Striped balloon reds, mustard and teal against pale sky blue and cloud white.
  lighting_and_shadow: Bright high-altitude sun with burner flames glowing inside the envelopes.
  texture_and_material: Patched silk envelopes, wicker baskets, hemp nets, sandbags and brass burners.
  camera_and_composition: Views up at clustered balloons and down from gondolas over tiny landscapes.
  atmosphere_and_mood: Buoyant and adventurous, a whole community drifting slowly wherever the wind decides.
  rendering_and_quality: Airy period illustration with bright envelopes and crisp rigging detail.
  creative_brief: "Balloonpunk: a sky society of patched hot-air balloons, wicker gondolas, sandbag ballast and floating markets tethered above the clouds. Carry it through patched envelopes, wicker gondolas, tethers, burner glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: patched envelopes; wicker gondolas; tethers; burner glow
