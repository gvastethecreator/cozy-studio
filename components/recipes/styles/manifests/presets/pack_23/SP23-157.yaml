visualDna:
  aesthetic: 'Low-count pixel portrait: a character portrait in a tiny canvas such as thirty-two pixels square, where every single pixel carries an eye, a brow or a mood.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; reduce the subject to a tiny portrait where each pixel matters.
  color_and_tone: Small bold palette with strong contrast, kept consistent across the whole image.
  lighting_and_shadow: One or two shading steps only, kept consistent across the whole image.
  texture_and_material: Very large visible pixels with no smoothing, kept consistent across the whole image.
  camera_and_composition: Tight head portrait filling a tiny square canvas.
  atmosphere_and_mood: Keep the requested mood with strong expression from minimal means.
  rendering_and_quality: Every pixel intentional and readable, kept consistent across the whole image.
  creative_brief: "Low-count pixel portrait: a character portrait in a tiny canvas such as thirty-two pixels square, where every single pixel carries an eye, a brow or a mood. Carry it through tiny canvas, huge pixels, minimal expression, tight portrait. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tiny canvas; huge pixels; minimal expression; tight portrait
