visualDna:
  aesthetic:
    Ink-wash illustration balancing broad translucent pools, darker deposits and small protected light
    shapes.
  subject_treatment:
    Describe the supplied subject through joined washes and selective boundary marks. Keep essential
    contours and proportions intact.
  color_and_tone:
    Use a restrained value scale within the requested palette. Let overlapping washes deepen locally
    instead of adding unrelated hues.
  lighting_and_shadow:
    Turn volumes with broad wash transitions and localized dark deposits. Reserve the lightest
    values deliberately and keep the focal silhouette clear.
  texture_and_material:
    Place pigment accumulation at a few drying boundaries, soft blooms inside wet passages and
    sharper edges where a wash has dried.
  camera_and_composition:
    Respect the existing frame and viewpoint. Organize wet and dry edge transitions around
    the requested focal hierarchy.
  atmosphere_and_mood:
    Preserve the user-requested emotional direction through contrast and the openness of light
    shapes; do not impose melancholy or a particular setting.
  rendering_and_quality:
    Maintain a clear difference between controlled pooling and accidental stains. Avoid uniform
    watercolor texture on every surface.
avoidRules:
  - uniform stain overlay
  - unmotivated ink splatters
  - lost focal contours
