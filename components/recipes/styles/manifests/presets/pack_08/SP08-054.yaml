visualDna:
  aesthetic: 'Chainmail garments: clothing built from interlocking metal rings that drape heavy and shimmer.'
  subject_treatment: "Make the prompt's garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments made of fine interlocking steel, bronze or silver rings — mail dresses, hoods or shirts — that drape with weight."
  color_and_tone: Steel grey, bronze and silver with warm reflections, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Warm directional light that sparkles on each ring, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Riveted interlocking rings with weight, drape and ring pattern visible.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Protective, ancient, elegant and heavy, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: interlocking metal rings; heavy drape; ring-by-ring sparkle; steel and bronze
  creative_brief: "Chainmail garments: clothing built from interlocking metal rings that drape heavy and shimmer. Carry it through interlocking metal rings, heavy drape, ring-by-ring sparkle, steel and bronze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
