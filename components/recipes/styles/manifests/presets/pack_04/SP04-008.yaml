visualDna:
  aesthetic: >-
    Sin urban fabric Noir Comic (High Contrast) acts as a transferable illustration router: start
    from Hard-boiled monochrome noir style built on brutal contrast logic and silhouette-dominant
    visual storytelling, No greyscale, silhouette framing, white-out rim and comic-illustration
    system built from ink hierarchy, panel-era color, contour exaggeration, print artifacts, and
    sequential-art readability, then apply the visual behavior to prompt X instead of recreating a
    fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Negative-space carving with razor-edged contour breaks,
    stark shape blocking, and subtraction-first silhouette subjects construction; preserve the
    requested subject while translating form into panel-ready silhouettes, expressive contour
    weight, stylized anatomy, speed emphasis, or graphic restraint only when the preset calls for
    it, keeping the requested identity, silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with Black and White only, stark binary, zero greyscale; treat color as comic
    production language: four-color plates, limited spot color, manga monochrome, digital flats,
    noir contrast, webtoon gradients, or painted page atmosphere, with deliberate value grouping,
    accent control, and process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Harsh, single-source key, knife-edge cast shadows; make light read through
    ink spotting, cel-like value blocks, dramatic rim separation, flat print fill, or painted page
    modeling rather than generic studio illumination, so value structure supports the illustration
    process and does not overwrite the requested content.
  texture_and_material: >-
    Render Dry ink grain, splatter accents, rough print-like edges, and gritty black-fill density
    variation; surface detail should reveal paper tooth, newsprint dots, screen tones, digital brush
    layers, ink pools, gutter discipline, or pixel cells at a scale that supports the drawing,
    keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Silhouette-forward composition with compressed midtone absence and
    hard cutout depth cues; compose with panel logic, silhouette clarity, speech-shape space, page
    rhythm, close-up drama, or scroll pacing without requiring a fixed comic-page scene, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Dark, menacing, tense, unforgiving, nocturnal; derive mood from era, genre
    pressure, satire, melodrama, horror obsession, pulp energy, or graphic-novel seriousness,
    letting the style alter interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Ultra-contrast noir rendering prioritizing shadow hierarchy, binary value
    discipline, and aggressive readability; finish with clear ink decisions, readable stylization,
    controlled artifacting, and no generic superhero costume or random comic text replacing the
    prompt, clean denoised surfaces where appropriate, and enough process evidence to make the style
    recognizable.
  key_features: >-
    Hard-boiled monochrome noir style built on brutal contrast logic and silhouette-dominant visual
    storytelling; No greyscale, silhouette framing, white-out rim; Black and White only, stark
    binary, zero greyscale; Dry ink grain, splatter accents, rough print-like edges, and gritty
    black-fill density variation; Silhouette-forward composition with compressed midtone absence and
    hard cutout depth cues
  creative_brief: >-
    Apply Sin urban fabric Noir Comic (High Contrast) as an illustration preset over prompt X:
    preserve the user's requested subject, then route mark-making, palette, surface, composition,
    mood, and final craft through Hard-boiled monochrome noir style built on brutal contrast logic
    and silhouette-dominant visual storytelling, No greyscale, silhouette framing, white-out rim,
    Dry ink grain, splatter accents, rough print-like edges, and gritty black-fill density variation
    without requiring the card image's original subject.
