visualDna:
  aesthetic: 'Scrapbook page: photographs of the subject mounted on patterned paper mats with photo corners, washi tape, die-cut shapes and pressed keepsakes.'
  subject_treatment: Keep the prompt subject as the hero of the arrangement with its identity, clothing and anatomy unchanged; this preset owns the flat scrapbook page layout of mounted prints, mats, tape and keepsakes around the subject.
  color_and_tone: Soft coordinated pastels and patterned papers built around one color from the subject photos; warm aged whites.
  lighting_and_shadow: Soft overhead flat-lay light; tiny shadows under photo corners, brads and raised die-cuts.
  texture_and_material: Deckle-edged mats, translucent washi tape, glossy prints, pressed flowers or feathers, metal brads and non-readable handwriting scribbles.
  camera_and_composition: Top-down flat lay of one page; two or three overlapping photos of the subject form the anchor, keepsakes cluster around the corners.
  atmosphere_and_mood: Warm and personal, a remembered day kept with care.
  rendering_and_quality: Tidy layered page with clear overlaps, crisp tape translucency and no readable journaling.
  key_features: mounted photos with corners; washi tape; deckle mats; pressed keepsakes; flat-lay page
  creative_brief: "Scrapbook page: photographs of the subject mounted on patterned paper mats with photo corners, washi tape, die-cut shapes and pressed keepsakes. Carry it through mounted photos with corners, washi tape, deckle mats, pressed keepsakes, flat-lay page. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
