visualDna:
  aesthetic: Seinen ink illustration whose contours branch like hairline fissures in slate, splitting every form into a few large unequal planes of flat chalky tone.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Chalk white, cool slate and deep graphite carry most values; one small mica-silver glint marks the focal plane and prompt hues survive at half saturation.
  lighting_and_shadow: Pale edge light runs along the fissure lines with quiet flat shadow inside each plane; light reads as reflected off stone, never glowing.
  texture_and_material: Dry pumice-like grain inside the planes, crisp fracture strokes of even width, and bare paper left open between the largest tonal shards.
  camera_and_composition: Keep the requested camera; wide margins of empty chalk-tone space make the subject sit small and isolated inside the requested framing.
  atmosphere_and_mood: Quiet, cold loneliness carried by sparse marks and long empty intervals, never outright tragedy.
  rendering_and_quality: Crisp planar ink drawing with fissure contours and flat chalk fills, no soft gradients; always illustrated, never a photographed crystal or stone.
  key_features: branching fissure contours; few unequal flat planes; chalk, slate and graphite values; single mica-silver glint; wide empty margins
  creative_brief: "Seinen ink illustration whose contours branch like hairline fissures in slate, splitting every form into a few large unequal planes of flat chalky tone. Carry it through branching fissure contours, few unequal flat planes, chalk, slate and graphite values, single mica-silver glint. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
