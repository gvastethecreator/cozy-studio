visualDna:
  aesthetic: 'Geode cavern environment render: a huge underground chamber lined with giant faceted crystal columns, lit by a few small sources and their refracted light.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies a vast underground geode cavern lined with giant crystal columns and still water; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Milky white and pale amethyst crystal against dark wet rock; warm lantern light turned into cold refracted glints.
  lighting_and_shadow: One or two small warm sources refracted and reflected through the crystals, producing caustic flecks and glowing edges; the cave depths stay black.
  texture_and_material: Faceted translucent crystal with internal fractures, wet dark rock, dust motes and mirror-still water reflecting the columns.
  camera_and_composition: Keep the requested camera; crystal columns cross the frame at angles and dwarf anything human-sized.
  atmosphere_and_mood: Silent and awestruck, a cathedral nobody built.
  rendering_and_quality: Path-traced refraction and caustics with light volumetric dust; crystals refract light, never self-glow.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Geode Cavern Environment as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: giant faceted crystal columns; refracted caustic flecks; small warm sources only; still reflecting water; huge scale
