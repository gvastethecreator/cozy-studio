visualDna:
  aesthetic: >-
    A heavy interwar-industrial graphic language built from compact engine-like masses, slanted plate
    contours, exposed structural seams and restrained signal geometry; mechanical weight stays graphic
    rather than photoreal.
  subject_treatment: >-
    Preserve requested identity, anatomy, proportions, action and part connections. Translate existing
    forms with broad panels, compacted volumes and sturdy joints where structurally appropriate; do not
    substitute a train, vehicle, crew or soldier.
  color_and_tone: >-
    Use broad oil-dark iron and worn-steel values with muted olive or tobacco, aged cream and a limited
    signal accent. Preserve explicit palette requests and keep the main silhouette clear from shadow.
  lighting_and_shadow: >-
    Follow the requested lighting. Group shadows into firm broad planes and use restrained edge
    highlights on existing hard surfaces; do not require night, fog, headlamps or searchlights.
  texture_and_material: >-
    Keep material identity intact. Where present, render cast iron, pressed steel, rubber, canvas or worn
    lacquer with broad soot marks and selective chipped paint; avoid uniform grime and glossy PBR shine.
  camera_and_composition: >-
    Preserve viewpoint, crop and layout. Use stacked blocks and purposeful diagonals to communicate
    weight without imposing a railway, convoy, airship, street or poster layout.
  atmosphere_and_mood: >-
    Suggest industrial urgency and resourceful engineering through compression, mass and signal contrast.
    Follow the requested mood and do not add wartime narrative or military identity.
  rendering_and_quality: >-
    Use bold screenprint or lithographic color masses, hard readable contours, reduced shadow zones and
    restrained scuffed-print variation. Keep the subject legible and avoid photoreal polish, noisy soot
    and excessive microdetail.
avoidRules:
  - Do not introduce trains, convoys, airships, uniforms or military insignia unless requested.
  - Do not force a nighttime noir setting, fog, searchlights or a fixed signal system.
  - Avoid dense grime, micro-rivets and unreadable signage.
