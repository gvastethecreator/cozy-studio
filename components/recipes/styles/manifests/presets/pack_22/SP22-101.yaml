visualDna:
  aesthetic: >-
    Traditional oil painting shaped by successive translucent glazes, with volume built through
    intermediate color transitions rather than sharpened digital edges.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Accumulate the existing forms
    through semi-transparent layers without redesigning the subject to fit the medium.
  color_and_tone: >-
    Keep the requested palette in a rich middle-value range, reserving brighter accents for a few
    selected areas without introducing new hues.
  lighting_and_shadow: >-
    Honor the requested light direction and shadow pattern. Let glaze layers describe their existing
    transitions; do not add a light source or substitute digital edge contrast for volume.
  texture_and_material: >-
    Use a fine paint film with intermediate glaze transitions and occasional small brush cuts at
    turning edges. Do not stamp canvas grain or decorative craquelure across the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not reframe to make
    room for an unrequested card layout.
  atmosphere_and_mood: >-
    Keep the requested mood. Layered oil and softened edges do not imply age, nostalgia, fantasy
    or a particular story.
  rendering_and_quality: >-
    Establish silhouette and broad values first, then retain intermediate glaze transitions. Keep
    small details selective and attached to the requested subject.
avoidRules:
  - plastic airbrush blending
  - uniform stamped canvas grain
