visualDna:
  aesthetic: 'Hip-hop period anime: flattened woodblock-style landscapes under loose ink-brush figures, with record-scratch stutter frames of doubled offset outlines and rewind jitter.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Dusty gold, warm brown and subdued blue-grey, with an occasional spray-paint magenta accent.
  lighting_and_shadow: Soft warm-cool bands with few hard shadow groups.
  texture_and_material: Fine vinyl-like scratches and dry print grain over warm flats.
  camera_and_composition: Keep the requested framing; offbeat balance with relaxed weight on one side.
  atmosphere_and_mood: Unhurried swagger and an easy, syncopated rhythm.
  rendering_and_quality: Warm dusty color, scratch texture and stutter outlines only on moving parts.
  key_features: doubled offset stutter outlines; vinyl scratch texture; flattened woodblock landscape; dusty gold and brown; offbeat balance
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Record-Scratch Stutter Swagger as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
