visualDna:
  aesthetic: 'Risograph print: the image separated into two or three soy-ink drums, fluorescent pink, teal or yellow, overprinting on uncoated paper.'
  subject_treatment: Keep the prompt subject, action, setting and framing; apply only this print or drawing technique, without adding slogans, borders, frames or a poster layout.
  color_and_tone: Two or three spot inks only, new colors appearing where they overlap, grainy tints instead of smooth tones.
  lighting_and_shadow: Light shown by leaving paper bare; shadows are denser grain or an overprinted second ink.
  texture_and_material: Coarse stochastic grain, roller streaks, slight ink set-off and uncoated recycled paper fiber.
  camera_and_composition: Keeps the requested framing; each color layer drifts a few millimeters out of register.
  atmosphere_and_mood: Handmade, bright and indie, printed in a small studio.
  rendering_and_quality: Visible misregistration and grain are the finish; no smooth gradients or process color.
  key_features: two to three fluorescent spot inks; overprint mixing; coarse riso grain; misregistration; uncoated paper
  creative_brief: "Risograph print: the image separated into two or three soy-ink drums, fluorescent pink, teal or yellow, overprinting on uncoated paper. Carry it through two to three fluorescent spot inks, overprint mixing, coarse riso grain, misregistration, uncoated paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
