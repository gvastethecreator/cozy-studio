visualDna:
  aesthetic: 'Route-Line Wall Systems: one continuous painted line follows an authorized route along the walls and branches only at documented decision points.'
  subject_treatment: Run one continuous line along the prompt's walls following the supplied route, branching only at real decision points, each arrow tied to one exact destination.
  color_and_tone: Route marked by color, name and a terminal shape, with clear gaps at non-connections.
  lighting_and_shadow: The space light kept, the line itself non-emissive.
  texture_and_material: Conceptual paint or tape of steady width with resolved corners.
  camera_and_composition: Line on the supplied surfaces, never crossing doors or obstacles.
  atmosphere_and_mood: Continuity that walks with the visitor, pausing before each decision.
  rendering_and_quality: Clean line with unambiguous arrows matching the plan.
  creative_brief: "Route-Line Wall Systems: one continuous painted line follows an authorized route along the walls and branches only at documented decision points. Carry it through continuous wall line, documented branches, one destination per arrow, steady width. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: continuous wall line; documented branches; one destination per arrow; steady width
