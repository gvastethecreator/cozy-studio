  lighting_and_shadow: Radar glow and desert sun, lit the way HighFleet 2021 lights its levels.
  texture_and_material: Analog dials, CRT scanlines and riveted steel, with the in-engine surface finish of HighFleet 2021.
  camera_and_composition: Side-view battle or radar screen view, framed the way HighFleet 2021 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with cold strategic dread.
  rendering_and_quality: Authentic dieselpunk strategy screen, matching real HighFleet 2021 screenshots.
