visualDna:
  aesthetic: 'Polaroid 600 integral instant film: a soft plastic-lens snapshot with built-in flash and the washed, dreamy color of instant chemistry — the emulsion look, not the print frame.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Low-contrast creamy highlights, cyan-green cast in the shadows, warm skin under flash, gently faded saturation; blacks never quite black.
  lighting_and_shadow: 'Built-in flash close to the lens: bright soft subject, quick falloff into a dim background, small flash reflections in eyes and glossy surfaces.'
  texture_and_material: Soft overall focus, slightly mottled dye clouds, faint chemical spread unevenness at the image edges; no border drawn.
  camera_and_composition: Keep the requested framing; square-ish crop welcome, subject within a few meters of the flash.
  atmosphere_and_mood: Intimate and playful, a close flash moment already fading into memory.
  rendering_and_quality: Instant-film softness and faded chemistry; no crisp digital detail and no drawn white frame.
  key_features: integral instant color; cyan-green shadows; creamy low-contrast highlights; close flash falloff; soft plastic lens
  creative_brief: "Polaroid 600 integral instant film: a soft plastic-lens snapshot with built-in flash and the washed, dreamy color of instant chemistry — the emulsion look, not the print frame. Carry it through integral instant color, cyan-green shadows, creamy low-contrast highlights, close flash falloff, soft plastic lens. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
