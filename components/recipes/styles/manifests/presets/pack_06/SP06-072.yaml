visualDna:
  aesthetic: 'Tape art: the image built entirely from strips of colored masking, duct and vinyl tape laid on a flat surface and trimmed with a blade.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Flat solid tape colors in a limited set; value from layering light and dark rolls; no gradients.
  lighting_and_shadow: Soft frontal light with a faint sheen on vinyl and duct tape; tiny lift shadows at overlapping ends.
  texture_and_material: Crisp blade-cut curves, torn tape ends, crepe texture on masking tape, cloth weave in duct tape and slight wrinkles.
  camera_and_composition: Keep the requested view; straight strips build planes, trimmed curves describe the silhouette.
  atmosphere_and_mood: Improvised and graphic, a temporary image made fast and bold.
  rendering_and_quality: Clean strip geometry and visible overlaps, consistent strip width; no painted fills.
  key_features: masking, duct and vinyl tape; blade-cut curves; torn ends; flat layered color; strip geometry
  creative_brief: "Tape art: the image built entirely from strips of colored masking, duct and vinyl tape laid on a flat surface and trimmed with a blade. Carry it through masking, duct and vinyl tape, blade-cut curves, torn ends, flat layered color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
