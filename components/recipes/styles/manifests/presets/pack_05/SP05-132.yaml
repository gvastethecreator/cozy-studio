  aesthetic: 'Full-color vertical webcomic action: smooth airbrushed digital painting, narrow dark contours, deep black-violet shadows, glowing cyan eyes and smoky shadow silhouettes rising from the ground.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Black, indigo and violet with cold cyan highlights; skin cool and pale.
  lighting_and_shadow: Deep value falloff and restrained cool rims; glow confined to eyes and a few edges.
  texture_and_material: Soft airbrushed gradients, smoke as feathered wisps, crisp luminous edges.
  camera_and_composition: Keep the requested framing; tall stacked planes and strong vertical scale suited to scroll reading.
  atmosphere_and_mood: Quiet awe and rising dominance, darkness gathering upward toward a cold glow.
  rendering_and_quality: Glossy digital finish with dark tonal depth and thin cyan edges, no panel borders.
  key_features: airbrushed digital painting; glowing cyan eyes; smoky shadow silhouettes; black and violet palette; tall vertical staging
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Full-Color Manhwa Shadow Glow as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
