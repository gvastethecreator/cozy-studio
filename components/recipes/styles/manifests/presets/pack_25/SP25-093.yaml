visualDna:
  aesthetic: 'Membrane Switch HUD: apparent flexible surfaces stretched around controls and status regions, supported at clear points.'
  subject_treatment: Place the prompt's controls and status regions on apparent flexible membranes held by coherent supports, with flat zones for reading; keep labels exact.
  color_and_tone: Neutral base, clear reading and one localized accent on the active control.
  lighting_and_shadow: Broad light revealing surface tension, labels sitting on flat areas.
  texture_and_material: Smooth membrane, support edges and minimal stretch around controls.
  camera_and_composition: Grouped by task with flat reading zones between gently raised controls.
  atmosphere_and_mood: Contained organic tactility with an apparent response under the finger.
  rendering_and_quality: Stretch never changes the position, label or usable size of a control.
  creative_brief: "Membrane Switch HUD: apparent flexible surfaces stretched around controls and status regions, supported at clear points. Carry it through stretched membrane, clear supports, flat reading zones, one active accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stretched membrane; clear supports; flat reading zones; one active accent
