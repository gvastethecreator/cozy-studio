visualDna:
  aesthetic: 'Motion vector pass: each pixel colored by its screen-space velocity, red for horizontal and green for vertical movement, so moving parts glow and still parts go dark.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Dark olive-black for static areas, reds, greens and yellow mixes for moving limbs, brightest where motion is fastest.
  lighting_and_shadow: No lighting; brightness equals speed, so a spinning edge outshines its slow hub.
  texture_and_material: Smooth velocity gradients along swinging limbs, hard color changes where parts move in opposite directions.
  camera_and_composition: Keep the requested camera; the frozen action shows several directions of motion at once.
  atmosphere_and_mood: Kinetic and strange, movement made visible without blur.
  rendering_and_quality: Clean velocity buffer with no motion blur applied and no shading.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Motion Vector Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: red horizontal and green vertical velocity; dark static areas; brightest fastest parts; no blur; opposing motions split by color
