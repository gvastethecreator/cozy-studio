visualDna:
  aesthetic: >-
    Classic anime transformation-profile drawing uses fluid arcs, crisp cel panels, and
    jewel-bright accents; stages are conditional on an explicit sequence request.
  subject_treatment: >-
    Preserve identity, anatomy, age, and count; only for an explicit transformation show
    requested stages and change only named elements.
  color_and_tone: >-
    Amethyst, ivory, cobalt, emerald, warm gold; compact jewel accents, no fixed costume
    palette.
  lighting_and_shadow: >-
    Halo-like edges and phased shadows only when the requested sequence or effect calls for
    them; otherwise match prompt light.
  texture_and_material: >-
    Smooth cel color with translucent motion accents; add no ribbons, particles, symbols, or
    effects unless requested.
  camera_and_composition: >-
    Keep crop and viewpoint; show multiple stages only when asked, preserving sequence order
    and identity.
  atmosphere_and_mood: >-
    Use ceremonial lift only when the requested action supports it; otherwise retain prompt
    mood.
  rendering_and_quality: >-
    Stable outlines, distinct requested phases, clear materials, sparse effects, no
    lettering.
  key_features: >-
    Fluid transformation arcs when requested, continuous subject identity, jewel accents,
    clean cel phases
  creative_brief: 'Apply a transformation-profile layer centered on fluid arcs, jewel accents, and clean cel phases. Preserve the exact subject, action, count, age, setting, camera, and mood. Only when a transformation sequence is explicitly requested, keep one identity through the requested stages and change only elements named in the prompt; otherwise draw one requested state. Add no unrequested costume, accessory, emblem, effect, place, prop, or text. Use it as a reusable look on any subject.'
