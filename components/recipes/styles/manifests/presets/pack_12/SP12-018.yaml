visualDna:
  aesthetic: 'In-game screenshot look informed by Defense Grid 2 gameplay: tower-defense gameplay capture with elevated camera, winding paths, glowing turret ranges, alien waves, and base-defense geometry. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Defense Grid 2-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Defense Grid 2-informed palette: cool steel blue, electric cyan, warning orange, alien
    green, dark storm grey, and white tactical highlights. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through turret beams, shield glow, storm flashes, muzzle bursts, and path-edge
    illumination. Lighting must clarify the playable route, threat, focal subject, or objective and
    avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from sci-fi platforms, modular towers, energy pylons, storm-wet metal, alien
    carapace, and tileable base panels. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with isometric defense view with clear enemy path, turret placement nodes, resource
    counters, and wave-reading depth. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Defense Grid 2-derived mood: methodical, defensive, synthetic, urgent, and strategic; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: tower-defense HUD is allowed:
    wave info, resources, tower icons, range rings, and health cores should be cleanly integrated.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Defense Grid 2 gameplay screenshots; tower-defense gameplay capture with elevated camera,
    winding paths, glowing turret ranges, alien waves, and base-defense geometry; cool steel blue,
    electric cyan, warning orange, alien green, dark storm grey, and white tactical highlights;
    turret beams, shield glow, storm flashes, muzzle bursts, and path-edge illumination; sci-fi
    platforms, modular towers, energy pylons, storm-wet metal, alien carapace, and tileable base
    panels; isometric defense view with clear enemy path, turret placement nodes, resource counters,
    and wave-reading depth; methodical, defensive, synthetic, urgent, and strategic; HUD guidance:
    tower-defense HUD is allowed: wave info, resources, tower icons, range rings, and health cores
    should be cleanly integrated
  creative_brief: "Defense Grid Storm Citadel: in-game screenshot language informed by Defense Grid 2, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
