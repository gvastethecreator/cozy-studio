visualDna:
  aesthetic: >-
    A storybook 90s cel treatment pairs hand-drawn ink with small nested loops, seal-like ornament and
    restrained luminous accents. The magic signal is ornamental line rhythm, not a required spell.
  subject_treatment: >-
    Preserve the requested forms and proportions. Let small interlocking marks follow existing
    contours; do not add a talisman, inscription, costume or magical object.
  color_and_tone: >-
    When open, balance deep blue-violet with parchment, warm gold and a small clear accent. Preserve
    specified colors and avoid filling every surface with ornament.
  lighting_and_shadow: >-
    Combine crisp cel shadows with tiny warm or cool glints on existing edges. Respect the requested
    light; do not invent a glowing seal or spell source.
  texture_and_material: >-
    Use fine hand-inked ornament over smooth painted fills, with slight paper-like grain only when
    compatible with the depicted material.
  camera_and_composition: >-
    Keep the requested framing and layout. Use nested line motifs to guide attention inside the
    composition rather than adding a circular diagram or symbol.
  atmosphere_and_mood: >-
    Give the finish a crafted, storybook cadence through detail and luminous restraint. Preserve the
    requested tone; do not force fantasy or whimsy.
  rendering_and_quality: >-
    Keep ornamental marks small, distinct and subordinate to the main form. Avoid clutter, excessive
    sparkle and generic fantasy glow.
  key_features: >-
    hand-drawn cel contour; small nested seal-like loops; restrained gold and blue-violet glints
  creative_brief: >-
    Apply storybook cel linework and restrained seal-like ornament to the requested content. Preserve
    its identity, action and composition; add no literal seal, spell, costume or fantasy prop.
