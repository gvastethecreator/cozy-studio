  aesthetic: 'Rosemaling: Scandinavian-style decorative folk painting with C- and S-stroke scrolls and flowers on wooden objects.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: painted with flowing one-stroke brush scrolls and stylized flowers framing a simple figure, on a painted wooden object."
  color_and_tone: Deep blue, red and green grounds with cream, ochre and white strokes.
  lighting_and_shadow: Flat painted decoration; object surface sheen, expressed through the style rather than photographic lighting.
  texture_and_material: Oil paint strokes on painted wood with wear, visible at card size as the signature of the style.
  camera_and_composition: Decoration framed by the shape of a chest, plate or bowl.
  atmosphere_and_mood: Homely, festive, rustic and warm, driven by the construction, color and rhythm.
  rendering_and_quality: Confident folk brushwork, with clean, deliberate marks and no accidental noise.
  creative_brief: "Rosemaling: Scandinavian-style decorative folk painting with C- and S-stroke scrolls and flowers on wooden objects. Carry it through C and S strokes, scroll flowers, painted wood object. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
