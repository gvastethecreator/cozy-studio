visualDna:
  aesthetic: >-
    Pixar Style Family Feature CG acts as a transferable cinematic-media router: start from Stylized
    family-animation CG, Pixar-era warmth, emotional precision, lovable imperfection, Soft shadows,
    appeal silhouette, rounded bevels, warm bounce light, material storytelling and
    animation-production system built from motion-era drawing, cel paint, CG polish, stop-motion
    material, vector layers, camera multiplane, and shape acting, then apply the media behavior to
    prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Treat subjects as believable filmed or broadcast subjects
    under Pixar Style Family Feature CG: casting, wardrobe, props, motion cues, and silhouette
    hierarchy follow 3. Animation Styles cinematic and broadcast grammar without locking to one plot
    beat; preserve the requested subject while translating it through cel shapes, squash, puppet
    material, vector rigs, CG feature polish, rotoscoped trace, or painted-frame continuity, keeping
    the requested identity, silhouette, action, object function, or setting legible.
  color_and_tone: >-
    Build color with Vibrant, subsurface, warm bounce, saturated primaries, soft pastel accent; use
    color as animation pipeline evidence: cel palettes, painted backgrounds, limited UPA flats,
    stop-motion set tones, digital compositing, or comic-offset halftone, with deliberate value
    grouping, accent control, and process-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Cinematic 3D, global illumination, soft bounce, ambient occlusion; make
    light follow the animation method through cel shadows, painted depth, puppet set lighting, CG
    bounce, flat graphic value, or rotoscope edge shimmer, so exposure and shadow structure support
    the media process without overwriting the requested content.
  texture_and_material: >-
    Render Stylized realism, clay-model surface, fabric nap, polished plastic, soft subsurface;
    surface detail should reveal acetate grain, paper line, clay/fabric puppet material, vector
    fills, oil smears, pixel cells, or CG shader smoothness when named, keeping artifact scale
    coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Soft exaggeration, rounded forms, expressive proportions,
    appeal-focused silhouette; compose through animation readability, pose clarity, painted-plate
    rhythm, squash arcs, graphic staging, multiplane depth, or frame-by-frame motion logic, with
    frame rhythm, spacing, edge hierarchy, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Heartwarming, fun, sincere, emotionally readable; derive mood from feature warmth,
    rubber-hose chaos, stop-motion tactility, graphic modernism, anime atmosphere, or experimental
    motion craft, letting the media style alter interpretation without demanding a specific story,
    location, or actor.
  rendering_and_quality: >-
    Finish with High budget, cute, emotionally precise, technically invisible; finish with
    production-faithful animation surfaces, readable shapes, controlled artifacts, and no exact
    studio-character copy or random cartoon face substitution, clean denoised surfaces where
    appropriate, and enough process evidence to make the style recognizable.
  key_features: >-
    Stylized family-animation CG, Pixar-era warmth, emotional precision, lovable imperfection; Soft
    shadows, appeal silhouette, rounded bevels, warm bounce light, material storytelling; Vibrant,
    subsurface, warm bounce, saturated primaries, soft pastel accent; Stylized realism, clay-model
    surface, fabric nap, polished plastic, soft subsurface; Soft exaggeration, rounded forms,
    expressive proportions, appeal-focused silhouette
  creative_brief: >-
    Apply Pixar Style Family Feature CG as a cinematic-media preset over prompt X: preserve the
    user's requested subject, then route lens behavior, palette, light, signal or film texture,
    composition, mood, and final media craft through Stylized family-animation CG, Pixar-era warmth,
    emotional precision, lovable imperfection, Soft shadows, appeal silhouette, rounded bevels, warm
    bounce light, material storytelling, Stylized realism, clay-model surface, fabric nap, polished
    plastic, soft subsurface without requiring the card image's original subject.
