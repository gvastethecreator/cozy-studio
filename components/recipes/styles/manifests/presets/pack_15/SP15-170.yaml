visualDna:
  aesthetic: 'Cobpunk: sculpted earthen architecture of cob, adobe and rammed earth, with rounded walls, living roofs and hand-shaped homes.'
  subject_treatment: Keep the prompt's subject and setting; shape its buildings and furniture from sculpted earth, straw and clay by hand.
  color_and_tone: Warm ochre, terracotta and straw gold with living-roof greens.
  lighting_and_shadow: Soft sunlight on curved walls and warm light glowing through round windows.
  texture_and_material: Hand-smoothed clay, straw, rammed-earth layers, bottle windows and grass roofs.
  camera_and_composition: Organic rounded buildings clustered together like a hillside village grown from the ground.
  atmosphere_and_mood: Earthy and gentle, homes that feel grown rather than built.
  rendering_and_quality: Warm tactile illustration with visible handprints in clay walls.
  creative_brief: "Cobpunk: sculpted earthen architecture of cob, adobe and rammed earth, with rounded walls, living roofs and hand-shaped homes. Carry it through curved clay walls, bottle windows, living roofs, handprints. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: curved clay walls; bottle windows; living roofs; handprints
