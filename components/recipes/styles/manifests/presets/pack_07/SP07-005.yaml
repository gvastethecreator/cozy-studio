visualDna:
  aesthetic: 'Bohemian eclectic interior: collected layers of kilims, woven rattan and macramé, carved wood, pottery and hanging plants, gathered over years rather than bought as a set.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Terracotta, ochre and rust grounded by indigo, turquoise and deep plum; many patterns kept in one warm family so the mix holds together.
  lighting_and_shadow: Warm low afternoon light filtered through patterned textiles, pierced-metal lanterns throwing dappled shadow, lots of mid-tone warmth.
  texture_and_material: Hand-knotted and flat-woven rugs stacked on each other, rattan and cane, block-printed cotton, glazed terracotta, trailing leaves, brass trays.
  camera_and_composition: Keep the requested view; layered foreground-to-background depth with a textile or plant edge cropping the frame, asymmetric groupings.
  atmosphere_and_mood: Free, lived-in and warm, a traveller who never unpacked.
  rendering_and_quality: 'Warm editorial photograph: patterns legible but not flattened, depth kept readable, no junk-pile chaos.'
  key_features: stacked flat-woven rugs; rattan and macramé; terracotta with indigo and turquoise; pierced-lantern dappled light; collected asymmetric layers
  creative_brief: "Bohemian eclectic interior: collected layers of kilims, woven rattan and macramé, carved wood, pottery and hanging plants, gathered over years rather than bought as a set. Carry it through stacked flat-woven rugs, rattan and macramé, terracotta with indigo and turquoise, pierced-lantern dappled light, collected asymmetric layers. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
