visualDna:
  aesthetic: >-
    Fine anime ink contour sits over translucent watercolor wash with delicate interior
    strokes.
  subject_treatment: >-
    Keep subject, clothing, and gesture; describe existing folds without adding letters or
    props.
  color_and_tone: >-
    Muted amber, slate blue, warm ivory, faded indigo; soft mids and a dark anchor.
  lighting_and_shadow: >-
    Warm-cool value drift across forms; broad shadows, no invented lamp or window.
  texture_and_material: >-
    Light paper tooth, diluted pigment edges, selective dry brush; no writing by default.
  camera_and_composition: >-
    Maintain viewpoint; use quiet margins without letter-writing composition.
  atmosphere_and_mood: >-
    Stillness comes through restrained contrast; the requested mood sets the tone.
  rendering_and_quality: >-
    Thin wash, legible ink, subtle paper texture; no global sepia haze.
  key_features: >-
    Fine ink contour, transparent pigment wash, amber-slate palette, open margins
  creative_brief: "Apply a visual treatment centered on fine ink contour, transparent pigment wash, amber-slate palette, open margins. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject."
