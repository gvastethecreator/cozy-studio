visualDna:
  aesthetic: >-
    Clockwork Exorcism Tribunal acts as a transferable mythic-noir router: clockwork translated into
    dark symbolic behavior, exorcism translated into dark symbolic behavior plus tribunal translated
    into dark symbolic behavior fused with ritual noir with legalistic omen logic, candle
    compression, confessional shadow, taboo elegance, and ceremonial menace; it carries symbol,
    omen, ritual authority, and mature editorial restraint without locking prompt content to its
    sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    clockwork shaping silhouette rhythm, contour pressure, and symbolic edge control, exorcism
    shaping silhouette rhythm, contour pressure, and symbolic edge control plus tribunal shaping
    silhouette rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette
    pressure, emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory
    actor or prop set.
  color_and_tone: >-
    Map color through clockwork-weighted accent roles over disciplined dark values,
    exorcism-weighted accent roles over disciplined dark values plus tribunal-weighted accent roles
    over disciplined dark values together with velvet black, sealing-wax red, old ivory, tarnished
    brass, moonsteel blue, rain gloss, and restrained poisonous glow; values stay separated, accents
    feel intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use purging glow and hard shadow separation, clockwork-weighted rim behavior, occult glow, and
    charged shadow plus tribunal-weighted rim behavior, occult glow, and charged shadow with low-key
    noir pools, narrow rim cuts, wet reflections, candle bloom, and occult glow that never flattens
    the subject; shadows must carry omen weight, rims should clarify form, and glow should behave as
    ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render blackened brass, clock teeth, oil, and precise metal edges, exorcism-inflected patina,
    residue, grain, and tactile edge behavior plus tribunal-inflected patina, residue, grain, and
    tactile edge behavior alongside wax seals, ledger paper, velvet pile, rain-wet stone, tarnish,
    soot, blade sheen, veils, and powdery ash; surface scale, patina, residue, gloss, grain, and
    carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with gear-like repetition and mechanical verdict rhythm plus judicial order, three-part
    balance, and formal accusation spacing plus interrogation axes, compressed processional bands,
    sealed-grid order, reflected doubles, and off-axis ritual tension; the style should support
    portraits, objects, architecture, creatures, symbols, and full scenes through reusable spatial
    grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through controlled expulsion and ceremonial severity plus cold procedural judgment
    and adult secrecy, suspicion, judgment, mourning, seduction, dread, and the feeling of a private
    rite becoming public; the image can become severe, sensual, sacred, violent, quiet, or strange
    when prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with clockwork recognition with denoised dark editorial polish and controlled material
    truth plus exorcism recognition with denoised dark editorial polish and controlled material
    truth and clean noir illustration with heavy denoise, readable silhouettes, disciplined glow,
    and no accidental UI or readable text; prioritize clean denoise, readable dark values, strong
    silhouette hierarchy, tactile material truth, and no watermark, fake text, logos, accidental UI,
    or muddy black crush.
  key_features: >-
    clockwork translated into dark symbolic behavior, exorcism translated into dark symbolic
    behavior plus tribunal translated into dark symbolic behavior; clockwork shaping silhouette
    rhythm, contour pressure, and symbolic edge control, exorcism shaping silhouette rhythm, contour
    pressure, and symbolic edge control plus tribunal shaping silhouette rhythm, contour pressure,
    and symbolic edge control; blackened brass, clock teeth, oil, and precise metal edges,
    exorcism-inflected patina, residue, grain, and tactile edge behavior plus tribunal-inflected
    patina, residue, grain, and tactile edge behavior; purging glow and hard shadow separation,
    clockwork-weighted rim behavior, occult glow, and charged shadow plus tribunal-weighted rim
    behavior, occult glow, and charged shadow; gear-like repetition and mechanical verdict rhythm
    plus judicial order, three-part balance, and formal accusation spacing
  creative_brief: >-
    Apply Clockwork Exorcism Tribunal after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies clockwork
    translated into dark symbolic behavior, exorcism translated into dark symbolic behavior plus
    tribunal translated into dark symbolic behavior, clockwork shaping silhouette rhythm, contour
    pressure, and symbolic edge control, exorcism shaping silhouette rhythm, contour pressure, and
    symbolic edge control plus tribunal shaping silhouette rhythm, contour pressure, and symbolic
    edge control, clockwork-weighted accent roles over disciplined dark values, exorcism-weighted
    accent roles over disciplined dark values plus tribunal-weighted accent roles over disciplined
    dark values, purging glow and hard shadow separation, clockwork-weighted rim behavior, occult
    glow, and charged shadow plus tribunal-weighted rim behavior, occult glow, and charged shadow,
    blackened brass, clock teeth, oil, and precise metal edges, exorcism-inflected patina, residue,
    grain, and tactile edge behavior plus tribunal-inflected patina, residue, grain, and tactile
    edge behavior plus gear-like repetition and mechanical verdict rhythm plus judicial order,
    three-part balance, and formal accusation spacing, finish discipline, and negative controls
    without requiring a fixed deity, ritual, prop bundle, location, or sample composition.
