visualDna:
  aesthetic: Deep-water anime painting in layered teal values with translucent edge glazes and low-contrast pore marks, as if the subject were seen through fathoms of water.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Blue-green shadows and deep teal with restrained pale cyan accents.
  lighting_and_shadow: Dim color seemingly held inside surfaces, falling off in layered steps with depth; no added glow source.
  texture_and_material: Damp patina, fine mineral grain and pore stipple only on surfaces that can carry them.
  camera_and_composition: Keep the requested framing and number of forms; layered value falloff separates depth.
  atmosphere_and_mood: Solemn, lush pressure, beautiful and costly at once.
  rendering_and_quality: Glazed layers with soft distant edges and crisp near edges, values readable to the back.
  key_features: layered teal value falloff; translucent edge glazes; pore stipple; pale cyan accents; damp patina
  creative_brief: "Deep-water anime painting in layered teal values with translucent edge glazes and low-contrast pore marks, as if the subject were seen through fathoms of water. Carry it through layered teal value falloff, translucent edge glazes, pore stipple, pale cyan accents, damp patina. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
