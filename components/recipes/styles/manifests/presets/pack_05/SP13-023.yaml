visualDna:
  aesthetic: >-
    Use precise anime linework, clean vector-like edges, and deliberate directional geometry to
    express technical momentum. Violet-blue accents may clarify the line paths where they fit the
    requested palette; do not require neon, science-fiction, or electrical content.
  subject_treatment: >-
    Preserve the requested subject identities and count, action, pose, props, wardrobe, setting,
    and tone. Restyle only contour precision, gesture emphasis, and edge rhythm. Do not add, remove,
    replace, or duplicate people, opponents, props, or scene elements.
  color_and_tone: >-
    Preserve the requested palette and emotional temperature. Where compatible, use a restrained
    violet-blue accent on existing edges to separate planes without recoloring or adding objects.
  lighting_and_shadow: >-
    Keep lighting precise and directional, with narrow edge highlights on existing forms. Follow
    the requested light sources; do not invent neon signs, flashes, electricity, machinery, or magic.
  texture_and_material: >-
    Keep finishes clean and controlled. Use thin vector-like trails attached to the requested
    movement, while preserving existing materials and surfaces; add sparks, smoke, grit, or debris
    only when requested.
  camera_and_composition: >-
    When the requested camera leaves room for interpretation, use a controlled oblique view, clean
    plane separation, and directional paths that trace the requested action. Preserve the stated
    viewpoint and do not impose a setting or technical equipment.
  atmosphere_and_mood: >-
    Preserve the requested tone. Let precision and deliberate spacing create the technical feel
    without imposing urgency, danger, heroism, or confrontation.
  rendering_and_quality: >-
    Use sharp technical contours, stable anatomy or object structure, and uncluttered value groups.
    Keep vector marks crisp and secondary to the requested subject and action.
  key_features: >-
    Precise linework, controlled vector paths, clean plane separation, measured directional
    geometry, optional violet-blue edge accents, and clear subject and action readability.
  creative_brief: >-
    Clarify the requested action with precise contours, controlled vector paths, and clean spatial
    separation. Preserve the requested subject, count, props, setting, action, and tone.
