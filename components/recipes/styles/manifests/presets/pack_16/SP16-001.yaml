visualDna:
  aesthetic: >-
    Drawn anime built with the graphic economy of limited animation: economical ink contours,
    opaque cel-color shapes and separately painted background planes. Use stable held-shape clarity,
    variable line weight and a small hierarchy of flat values rather than modeled 3D volume.
  subject_treatment: >-
    Preserve the requested identity, anatomy, pose, action, clothing and expression. Translate forms
    into expressive but economical anime contours; simplify small interior details into legible
    shapes while keeping the requested gesture and role unchanged.
  color_and_tone: >-
    Respect the requested palette and saturation. Organize it into distinct cel-paint regions with
    clear neighboring values and restrained shadow colors; choose supporting pigments from the
    depicted scene instead of imposing a fixed era palette.
  lighting_and_shadow: >-
    Follow the requested light sources, direction and intensity. Where shading is present, group it
    into clean-edged cel shapes; use a soft airbrush transition only when the described light calls
    for one, without inventing another light source or changing the described lighting.
  texture_and_material: >-
    Keep paint fields mostly flat, with restrained pigment variation, fine film grain and slight
    transfer softness across the image. Use airbrush gradients only where the requested image calls
    for them; keep this image-level texture separate from the depicted materials.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, layout and spatial relationships. Keep ink, paint and
    background planes legible within that composition without restaging it.
  atmosphere_and_mood: >-
    Preserve the requested emotional register and narrative. The production-era treatment changes
    drawing and paint, not the scene's genre or emotional intention.
  rendering_and_quality: >-
    Finish as a legible hand-drawn 2D cel illustration with stable contours, bounded shadow masses
    and restrained analog softness. Keep grain and edge variation subtle enough to preserve detail;
    do not shift the image toward 3D rendering or photorealism.
avoidRules:
  - unrequested pioneer or hero archetype
  - unrequested heist, space drama, or source-title plot
  - fixed canon character or franchise scene
  - unrequested uniform, weapon, spacecraft, or prop bundle
  - unrequested heroic diagonal or title-card layout
  - heavy scratches, dust, or frame damage obscuring linework
  - 3d render
  - photorealism
  - watermark
  - signature
  - unrequested text
