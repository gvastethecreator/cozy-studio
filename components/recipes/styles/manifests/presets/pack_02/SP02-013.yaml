    hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Intense, cinematic, bombastic spectacle, summer tentpole; derive mood from
    cinematic tradition, performance tone, genre stakes, projection damage, auteur restraint, camp
    excess, or analog spectacle, letting the media style alter interpretation without demanding a
    specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Polished tentpole digital-cinema finish with clean compositing, high-contrast grade,
