visualDna:
  aesthetic: >-
    Fogbound medieval accusation folklore with rough timber posts, low fog, torch halos, rope knots,
    and occult uncertainty.
  subject_treatment: >-
    Transform the prompt subject into fogbound medieval paranoia with softened silhouettes, low-key
    halo contrast, damp roughness, and communal dread while keeping the original subject intact and
    avoiding trial-scene roles.
  color_and_tone: Damp gray, charred black, torch orange, dirty linen, and muted forest green.
  lighting_and_shadow: >-
    Torches create simple halos and long silhouettes while keeping fog smooth and shadow edges
    readable.
  texture_and_material: Wet timber, rough rope, muddy ground, smoke, ash, hand-cut charms, and damp linen shapes.
  camera_and_composition: >-
    Circular accusation pressure, low fog bands, off-center moral tension, claustrophobic medieval
    spacing, and witness-like silhouettes only as optional depth shapes.
  atmosphere_and_mood: >-
    Carry the prompt through Suspicious, cold, communal, and supernatural; nocturnal aristocracy,
    clinical dread, hunter ritual, plague-court elegance, and suspicious candlelit ceremony; the
    tone should follow prompt X while preserving the preset's medieval-zine identity.
  rendering_and_quality: >-
    Historical fantasy illustration with smooth atmospheric fog, tactile props, defined lines, and
    clean low light.
  creative_brief: >-
    Route any subject through fogbound witch trial paranoia: preserve the prompt while adding
    accusation geometry, low fog, torch halo pressure, edge silhouette tension, and medieval moral
    dread without requiring a village trial scene, central inquisitor, executioner, or accused
    figure. Apply after prompt X: prompt X supplies subject, action, setting, tone, and intensity,
    while this preset supplies a style grammar of Fogbound Witch Trial; Fogbound medieval accusation
    folklore with rough timber posts; low fog; torch halos; rope knots; occult uncertainty, mood,
    material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed
    cast, fixed relic, fixed monster, readable text, or sample-card composition.
  key_features: >-
    Fogbound Witch Trial; Fogbound medieval accusation folklore with rough timber posts; low fog;
    torch halos; rope knots; occult uncertainty
