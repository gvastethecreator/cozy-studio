visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around fine branching and
    vein-like linework only where the prompt already contains organic structure, kept
    quiet and legible. For color and surface, maintain a moonlit ecological
    character through silver-blue highlights and soft teal undertones while honoring
    prompted local colors. Quiet natural calm is central, but the requested emotional
    tone still leads; darkness is not a requirement
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through fine branching and vein-like
    linework only where the prompt already contains organic structure, kept quiet and
    legible; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; maintain a moonlit ecological
    character through silver-blue highlights and soft teal undertones while honoring
    prompted local colors. Keep values legible across the prompted light and dark range;
    do not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use gentle lunar-style falloff
    and cool reflected edges without adding a moon, changing the stated time, or
    inventing flora. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; lay a faint translucent living haze over
    compatible existing surfaces; keep stone, metal, and other materials distinct. Keep
    texture subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    the source framing and let existing organic forms carry the detail, leaving other
    areas calm and uncluttered. Use the mark rhythm inside the supplied composition
    rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Quiet natural calm is central, but the
    requested emotional tone still leads; darkness is not a requirement. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and fine branching and vein-like linework only
    where the prompt already contains organic structure, kept quiet and legible; keep
    focal edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    fine branching and vein-like linework only where the prompt already contains organic
    structure, kept quiet and legible; maintain a moonlit ecological character through
    silver-blue highlights and soft teal undertones while honoring prompted local
    colors; use gentle lunar-style falloff and cool reflected edges without adding a
    moon, changing the stated time, or inventing flora; lay a faint translucent living
    haze over compatible existing surfaces; keep stone, metal, and other materials
    distinct; and preserve the source framing and let existing organic forms carry the
    detail, leaving other areas calm and uncluttered. The five cues should read as one
    mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use fine branching and vein-like linework only
    where the prompt already contains organic structure, kept quiet and legible,
    maintain a moonlit ecological character through silver-blue highlights and soft teal
    undertones while honoring prompted local colors, use gentle lunar-style falloff and
    cool reflected edges without adding a moon, changing the stated time, or inventing
    flora, and lay a faint translucent living haze over compatible existing surfaces;
    keep stone, metal, and other materials distinct; the prompt supplies all scene
    content. Do not add unrequested characters, objects, source-specific lore, readable
    symbols, or a default action.
