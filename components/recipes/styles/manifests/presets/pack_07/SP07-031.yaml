visualDna:
  aesthetic: 'Working space-station interior: beige equipment racks, circular hatches, blue hook-and-loop patches and retention straps, cables bungeed to every wall and no up or down.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the microgravity utility-module surfaces, stowage and floating clutter, and it never bends, loops or breaks the requested structure.
  color_and_tone: Equipment beige, off-white, hook-and-loop blue and cable grey, with small red and yellow handle accents; low contrast.
  lighting_and_shadow: Flat fluorescent strip panels, few shadows, one porthole spilling cool planet light across the clutter.
  texture_and_material: Velcro fuzz, fabric stowage bags, screwed panels, bungee cords, scuffed handrails; labels left blank.
  camera_and_composition: Keep the requested layout; objects float tethered, gear is clipped to walls and ceiling alike.
  atmosphere_and_mood: Cramped, practical and lived-in, a workplace where nothing can be put down.
  rendering_and_quality: Documentary interior photograph realism; never an ornate gold station exterior.
  key_features: beige equipment racks; circular hatches; blue hook-and-loop patches and straps; floating tethered objects; flat fluorescent strip light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Orbital Utility Habitat as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
