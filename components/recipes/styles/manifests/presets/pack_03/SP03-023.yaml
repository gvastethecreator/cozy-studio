visualDna:
  aesthetic: 'Isometric 3D: the scene seen through a parallel orthographic camera at the classic isometric angle, usually as a neat cutaway block.'
  subject_treatment: Keep the prompt subject and action; this preset owns the isometric orthographic camera and cutaway block framing, the explicit exception to keeping the requested view, and nothing else about the request changes.
  color_and_tone: Clean pastel or saturated palette, soft gradients, gentle shadows.
  lighting_and_shadow: Soft top-left key with ambient fill; small crisp contact shadows.
  texture_and_material: Tidy simplified materials with clear separation between every object.
  camera_and_composition: Parallel projection with no perspective, 30-degree axes, the scene cut into a square block.
  atmosphere_and_mood: Orderly and inviting, a tiny world you can take in at a glance.
  rendering_and_quality: Clean isometric render with parallel lines and no perspective distortion at all.
  key_features: isometric orthographic camera; cutaway square block; no perspective; soft top-left key; tidy detail
  creative_brief: "Isometric 3D: the scene seen through a parallel orthographic camera at the classic isometric angle, usually as a neat cutaway block. Carry it through isometric orthographic camera, cutaway square block, no perspective, soft top-left key, tidy detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
