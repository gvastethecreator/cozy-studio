visualDna:
  aesthetic: 'Sahelian earthen architecture of the Niger bend: sun-dried mud-brick walls rendered with mud plaster, tapering buttress pilasters rising into conical pinnacles, and toron palm-wood beams projecting from the walls.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Uniform earth colour of the local clay — warm grey-brown to ochre — with pale dry dust highlights and darker damp patches after replastering; sky and shadow give the contrast.
  lighting_and_shadow: Harsh vertical sun giving short sharp shadows from each toron beam and pilaster, deep dark doorways, soft dust haze at dawn or dusk.
  texture_and_material: Hand-smeared mud plaster with finger marks, rows of projecting palm-wood toron that serve as permanent scaffolding for annual replastering, sloping battered walls, flat roofs with ceramic drain pipes.
  camera_and_composition: Keep the requested view; frontal elevation showing the rhythm of pilasters and toron, walls filling the frame against a pale sky.
  atmosphere_and_mood: Massive, communal and sun-hardened, a building renewed each year.
  rendering_and_quality: Documentary daylight photograph with true earth texture and toron shadow pattern, no invented symbols or costume staging.
  creative_brief: "Sahelian earthen architecture of the Niger bend: sun-dried mud-brick walls rendered with mud plaster, tapering buttress pilasters rising into conical pinnacles, and toron palm-wood beams projecting from the walls. Carry it through mud-plastered sun-dried brick, projecting toron palm beams, buttress pilasters with conical pinnacles, battered walls, ceramic roof drain spouts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mud-plastered sun-dried brick; projecting toron palm beams; buttress pilasters with conical pinnacles; battered walls; ceramic roof drain spouts
