visualDna:
  aesthetic: 'Design-competition exterior render: a building shown in its landscape at human eye height, clean CGI architecture blended with planted foreground and a graded sky.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns the eye-level exterior hero framing with corrected verticals, planted foreground and ghosted entourage, while the requested building keeps its design. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Warm late-afternoon sun on facades against a blue-to-cream graded sky, slightly desaturated greens and glass reflecting the sky.
  lighting_and_shadow: Low sun raking the facade at a steep angle, long soft-edged shadows across paving and interiors glowing faintly through the glass.
  texture_and_material: Crisp mullions, board-formed concrete, timber cladding and stone paving, with soft-focus grasses and trees in the foreground.
  camera_and_composition: Two-point perspective at standing eye height with corrected verticals, building in the middle third and planting framing the edges.
  atmosphere_and_mood: Optimistic and persuasive, a building shown the way its designers hope it will feel.
  rendering_and_quality: Clean exterior visualization with ghosted, motion-blurred adult entourage and light haze; no site plans, arrows or labels.
  key_features: eye-level two-point exterior; corrected verticals; planted soft foreground; ghosted entourage; graded sky with raking sun
  creative_brief: "Design-competition exterior render: a building shown in its landscape at human eye height, clean CGI architecture blended with planted foreground and a graded sky. Carry it through eye-level two-point exterior, corrected verticals, planted soft foreground, ghosted entourage, graded sky with raking sun. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
