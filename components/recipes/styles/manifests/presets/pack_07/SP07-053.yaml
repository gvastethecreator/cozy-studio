visualDna:
  aesthetic: 'Suspended architecture: buildings sit on inverted rock islands torn from the ground, root-hung strata dangling underneath, linked by thin chain bridges across an open void.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Sun-bleached limestone tops, rust-red and ochre strata undersides, deep sky blue and cloud white; values lighten with distance.
  lighting_and_shadow: High hard sun with bright rims on every island edge; undersides lit only by cool bounce from the cloud sea below.
  texture_and_material: Layered sediment strata, dangling roots and dripping stalactites under each island, weathered stone and iron chain above.
  camera_and_composition: Keep the requested view but always show the underside and the empty drop beneath; islands stack in depth through aerial haze.
  atmosphere_and_mood: Vertiginous and sublime, weight hanging where nothing should hold it.
  rendering_and_quality: Aerial-perspective painting with strong value falloff by distance and a sharp, detailed foreground island.
  key_features: inverted rock islands; root-hung strata undersides; chain bridges over void; aerial haze depth; hard high-sun rims
  creative_brief: "Suspended architecture: buildings sit on inverted rock islands torn from the ground, root-hung strata dangling underneath, linked by thin chain bridges across an open void. Carry it through inverted rock islands, root-hung strata undersides, chain bridges over void, aerial haze depth, hard high-sun rims. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
