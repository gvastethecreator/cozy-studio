visualDna:
  aesthetic: >-
    Render in high-gain monochrome with intensifier grain, lens vignette and a faint alignment echo;
    any reticle-like cue stays abstract and peripheral, never interface text.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use phosphor monochrome with a
    restrained green or amber bias only if compatible with the prompt; no natural-color conversion.
  lighting_and_shadow: >-
    Apply sensor-like edge bloom and luminance falloff without claiming an actual heat or infrared
    reading.
  texture_and_material: >-
    Use fine electronic grain, mild vignette and restrained edge echo; preserve the underlying
    material and silhouette.
  camera_and_composition: >-
    Keep the original framing; suggest sensor mediation with peripheral alignment marks rather than
    a fake screen.
  atmosphere_and_mood: >-
    Surveillance-like distance comes from signal texture; retain the prompt's mood without inventing
    a device or operator.
  rendering_and_quality: >-
    Apply sensor texture to any subject without adding a camera, HUD, readable reticle, device or
    surveillance scene. Keep important silhouettes and joins legible; no watermark, unrequested text
    or interface.
  key_features: >-
    Phosphor monochrome; intensifier grain; lens vignette; faint alignment echo; restrained
    infrared-like points.
  creative_brief: 'Apply this visual treatment to the requested content: Phosphor monochrome; intensifier grain; lens vignette; faint alignment echo; restrained infrared-like points. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - grain obscuring silhouette or fine details
  - vignette crushing important values
  - alignment marks resembling an unrequested interface
assets:
