visualDna:
  aesthetic: >-
    Build the graphic anime treatment from lively variable contours that overlap in syncopated
    clusters and overlapping outlines and rounded graphic masses. Let staggered rhythms and
    crossing motion arcs with no fixed direction set its rhythm; use brass gold, amber, dark
    brown, and ink black for color and subtle printed grain with warm amber-gold accents in flat
    color fields for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use lively variable contours that overlap in
    syncopated clusters for edge work, overlapping outlines and rounded graphic masses for form
    simplification, and staggered rhythms and crossing motion arcs with no fixed direction only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with brass gold, amber, dark brown, and ink black. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: warm edge highlights against crisp dark value blocks. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with subtle printed grain with warm amber-gold accents in flat color
    fields, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use an irregular visual rhythm arranged around the
    existing focal forms to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey buoyant disorder and dry wit, while preserving the
    prompt's emotional intent.
  rendering_and_quality: >-
    Finish with amber-black contrast, overlapping shapes, and rhythm carried by spacing; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    lively variable contours that overlap in syncopated clusters; overlapping outlines and rounded
    graphic masses; brass gold, amber, dark brown, and ink black; staggered rhythms and crossing
    motion arcs with no fixed direction; subtle printed grain with warm amber-gold accents in flat
    color fields; an irregular visual rhythm arranged around the existing focal forms.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with lively variable
    contours that overlap in syncopated clusters, overlapping outlines and rounded graphic masses,
    and brass gold, amber, dark brown, and ink black; use staggered rhythms and crossing motion
    arcs with no fixed direction only where movement is already present, and apply subtle printed
    grain with warm amber-gold accents in flat color fields as the drawing finish.
