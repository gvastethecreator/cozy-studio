visualDna:
  aesthetic: 'Gyotaku: the subject printed by inking a real creature or object and pressing thin paper onto it.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: transferred as a direct ink impression: scales, fins and textures captured exactly, with patchy ink and a hand-painted eye."
  color_and_tone: Black or indigo ink on thin cream paper, used consistently across subject and background.
  lighting_and_shadow: Tone comes from ink pressure; no lighting, expressed through the style rather than photographic lighting.
  texture_and_material: Thin mulberry paper with ink texture and uneven pressure.
  camera_and_composition: Flat side-view print with generous empty paper, arranged so the subject still reads at card size.
  atmosphere_and_mood: Quiet, natural, direct and eerie, driven by the construction, color and rhythm.
  rendering_and_quality: Authentic impression print with natural irregularity, with clean, deliberate marks and no accidental noise.
  creative_brief: "Gyotaku: the subject printed by inking a real creature or object and pressing thin paper onto it. Carry it through direct ink impression, scale texture, painted eye, thin paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: direct ink impression; scale texture; painted eye; thin paper
