visualDna:
  aesthetic: 'Monotype: ink rolled and brushed onto a smooth glass or metal plate, wiped back with rags and fingers, then pressed once onto paper so only one soft impression exists.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: Muted ink tones, dark earth or blue-black with a few soft colors; wiped lights glow out of dark rolled areas.
  lighting_and_shadow: 'Subtractive light: highlights wiped out of the ink with rag and finger, giving soft glowing halos.'
  texture_and_material: Squashed ink with fuzzy spread edges, roller marks, rag-wipe textures and fingerprint smears, brush marks flattened by the press.
  camera_and_composition: Keep the requested framing; loose painterly forms with a soft rectangular plate edge.
  atmosphere_and_mood: Ghostly, spontaneous and dreamlike, a painting glimpsed once.
  rendering_and_quality: Soft squashed transfer texture, wiped lights and roller marks; no sharp lines, no repeatable plate detail.
  key_features: ink wiped from a glass plate; squashed soft transfer edges; rag and finger wipe marks; roller streaks; single ghostly impression
  creative_brief: "Monotype: ink rolled and brushed onto a smooth glass or metal plate, wiped back with rags and fingers, then pressed once onto paper so only one soft impression exists. Carry it through ink wiped from a glass plate, squashed soft transfer edges, rag and finger wipe marks, roller streaks, single ghostly impression. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
