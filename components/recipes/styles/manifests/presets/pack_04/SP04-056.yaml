visualDna:
  aesthetic: 'Photobash concept: the subject assembled from cut photographic fragments of rock, metal, foliage and architecture, warped into perspective and unified with painted light.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: One unifying color grade over mismatched photo sources, slight saturation differences still visible under a cohesive overall temperature.
  lighting_and_shadow: Painted overlay light passes pull the sources to one direction, while a few photo shadows still disagree subtly.
  texture_and_material: Photographic micro-detail at real scale, visible cut edges, repeated cloned textures and perspective-warped fragments.
  camera_and_composition: Keep the requested view; strong perspective hides seams and detail density gathers at the focal areas.
  atmosphere_and_mood: Gritty and tangible, realism assembled at speed for a pitch.
  rendering_and_quality: Photoreal-feeling surfaces with visible seams and paint glue in places, never a clean CG render.
  key_features: cut photo fragments; perspective warping; one unifying grade; visible seams and clone repeats; painted light glue
  creative_brief: "Photobash concept: the subject assembled from cut photographic fragments of rock, metal, foliage and architecture, warped into perspective and unified with painted light. Carry it through cut photo fragments, perspective warping, one unifying grade, visible seams and clone repeats, painted light glue. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
