visualDna:
  aesthetic: >-
    Use this drawing language: Editorial satire drawing with selective exaggeration, strong
    symbolic scale, crosshatched ink, fast contour, and coarse newsprint halftone. Apply it to
    the supplied content without requiring a particular cast, place, or story.
  subject_treatment: >-
    Apply crosshatched ink, heavy India-ink strokes, sharp editorial linework, and rapid contour
    marks to the supplied subject while preserving its identity, silhouette, requested action,
    actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: >-
    Use newsprint gray, bile green, red accents, tobacco-stain ochre, and pulp-paper yellow as
    style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use harsh directional contrast that emphasizes the crosshatching as a visual treatment,
    while respecting any lighting instructions in the request.
  texture_and_material: >-
    Render coarse newsprint halftone, ink bleed, and mechanical print artifacts as drawn or
    printed surface marks over the existing material; do not change the subject's actual
    substance or function.
  camera_and_composition: >-
    Use scale, crosshatch direction, and ink blocks to guide attention; apply satire or
    symbolism only to subjects supplied by the user.
  atmosphere_and_mood: >-
    Biting and skeptical; express criticism through visual emphasis only when the requested
    subject supports it.
  rendering_and_quality: >-
    Finish with fast ink strokes, crosshatching, and coarse print texture while preserving
    supplied text and symbols.
  key_features: >-
    crosshatched ink; selective exaggeration; symbolic scale; rapid contour; coarse newsprint
    halftone
  creative_brief: >-
    Render the supplied content with crosshatched ink, heavy India-ink strokes, sharp editorial
    linework, and rapid contour marks. Use newsprint gray, bile green, red accents,
    tobacco-stain ochre, and pulp-paper yellow as style colors while honoring any explicit color
    instructions. Apply coarse newsprint halftone, ink bleed, and mechanical print artifacts as
    drawn or printed marks over the existing material, without changing what the subject is made
    of or how it functions. Preserve the requested subject, action, and setting; follow the
    supplied composition and add no unrequested cast, location, lettering, or gag.
