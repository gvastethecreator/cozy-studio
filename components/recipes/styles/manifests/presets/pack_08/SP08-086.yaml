visualDna:
  aesthetic: 'Monochrome power suit: one strong color from head to toe — sharp-shouldered suit, matching shirt and shoes — cut to command a room.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a sharply tailored suit with strong shoulders in one saturated color, matching shirt or top and matching shoes."
  color_and_tone: A single saturated color — scarlet, cobalt, emerald or white — worn head to toe.
  lighting_and_shadow: Strong, clean studio or architectural light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Crisp wool suiting, silk shirting and polished leather, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Powerful, low-angle or centered full figure, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Authoritative, bold and unflinching, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Sharp, graphic, high-contrast finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Monochrome Power Suit as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: head-to-toe single color; strong shoulders; sharp tailoring; low-angle power framing
