visualDna:
  aesthetic: 'Impressionist oil sketch: short separate strokes of unmixed color laid side by side outdoors, catching one moment of changing daylight rather than fixed forms.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Broken color with no black, shadows made of violet and blue, lights of cream, lemon and pink; complementary strokes vibrate against each other.
  lighting_and_shadow: Strong natural daylight at a specific hour; colored shadows and reflected light matter more than modeled volume.
  texture_and_material: Short thick dabs and commas of paint on a light ground, visible bristle tracks, ground peeking through between strokes.
  camera_and_composition: Keep the requested framing; edges blur where light is strongest and small detail is dropped in favour of patches of color.
  atmosphere_and_mood: Light, fresh and fleeting, a breath of air caught quickly.
  rendering_and_quality: Detail dissolved into distinct strokes, no blending on the canvas, no black outlines; the image resolves only at a distance.
  key_features: short broken strokes of pure color; violet and blue shadows; no black; light ground showing through; blurred edges in bright light
  creative_brief: "Impressionist oil sketch: short separate strokes of unmixed color laid side by side outdoors, catching one moment of changing daylight rather than fixed forms. Carry it through short broken strokes of pure color, violet and blue shadows, no black, light ground showing through, blurred edges in bright light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
