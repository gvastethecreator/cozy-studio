visualDna:
  aesthetic: 'Leather texture: pebbled or embossed leather grain with stitching.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: embossed leather grain and saddle stitching cover the surfaces. The decorative surface pattern is the point: make its figure, veining or motif the first read."
  color_and_tone: Cognac, black, oxblood, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft side light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Grain, stitching and edge paint, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Crafted, warm, rugged and classic, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: leather grain; saddle stitching; decorative surface pattern
  creative_brief: "Leather texture: pebbled or embossed leather grain with stitching. Carry it through leather grain, saddle stitching, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
