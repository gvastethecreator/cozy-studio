visualDna:
  aesthetic: 'Pillow-shaded pixel kitsch: pixel art shaded inward from every outline like a pillow, ignoring any real light, a naive beginner look embraced for comedy and charm.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; shade the subject from its edges inward like a puffy pillow.
  color_and_tone: Bright colors getting lighter toward the center of each shape.
  lighting_and_shadow: No real light source; shading follows outlines, kept consistent across the whole image.
  texture_and_material: Puffy inward ramps and thick outlines, kept consistent across the whole image.
  camera_and_composition: Simple centered subject, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with lovable amateur charm.
  rendering_and_quality: Deliberately naive but clean pixels, kept consistent across the whole image.
  creative_brief: "Pillow-shaded pixel kitsch: pixel art shaded inward from every outline like a pillow, ignoring any real light, a naive beginner look embraced for comedy and charm. Carry it through pillow shading, inward ramps, no light source, puffy forms. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pillow shading; inward ramps; no light source; puffy forms
