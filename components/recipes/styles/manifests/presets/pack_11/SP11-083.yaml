visualDna:
  aesthetic: 'Pyrography: the subject burned into pale wood with a hot pen, tones from light tan to charred black.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: drawn with a hot burning pen: lines, stippled shading and deep scorched blacks following the wood grain."
  color_and_tone: Pale birch or basswood with tan, brown and black burn tones.
  lighting_and_shadow: Tone comes only from burn depth, expressed through the style rather than photographic lighting.
  texture_and_material: Wood grain, scorched lines and slight charring, visible at card size as the signature of the style.
  camera_and_composition: Plaque or wood-slice framing with bark edge, arranged so the subject still reads at card size.
  atmosphere_and_mood: Rustic, warm, patient and handmade, driven by the construction, color and rhythm.
  rendering_and_quality: Fine pyrography with controlled burn tones, with clean, deliberate marks and no accidental noise.
  creative_brief: "Pyrography: the subject burned into pale wood with a hot pen, tones from light tan to charred black. Carry it through burned lines, scorched blacks, wood grain, bark edge. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: burned lines; scorched blacks; wood grain; bark edge
