visualDna:
  aesthetic: >-
    Shape coarse stone masses with deliberate carved channels, repeated cut marks, and a few compact
    rotational patterns.
  subject_treatment: >-
    Preserve the requested subject and proportions; translate existing forms through rough planes and
    precise incisions without adding primitive machinery.
  color_and_tone: >-
    Balance basalt charcoal, flint gray, and warm ash or clay accents; retain any explicitly requested
    palette.
  lighting_and_shadow: Use broad fire-warm or neutral highlights against cool, deep cuts so carved depth remains visible.
  texture_and_material: >-
    Contrast coarse matte stone with selected smooth obsidian-like planes and sparse chalk marks; keep
    material transitions clear.
  camera_and_composition: >-
    Respect the requested framing; let stepped masses and carved intervals support the existing focal
    hierarchy.
  atmosphere_and_mood: >-
    Create weight and measured ingenuity through compact forms, tool-mark rhythm, and restrained
    contrast.
  rendering_and_quality: Keep incisions crisp, stone grain broad, and repeated marks legible without tiny decorative clutter.
avoidRules:
  - mandatory gears, engines, or timing devices
  - inscriptions that resemble unintended readable text
  - dust or grain obscuring carved edges
