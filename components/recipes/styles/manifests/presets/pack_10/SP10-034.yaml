visualDna:
  aesthetic: >-
    Dreamcore becomes a transferable surreal symbolic transformation system: start from Nostalgic
    nightmare, Pastel wrongness, and Familiarity drift, then route prompt content through impossible
    logic, dream scale, symbolic displacement, liminal staging, and psychic texture without forcing
    one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Soft to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Pastel, bloom; use color as emotional unreliability, nostalgic drift,
    uncanny contrast, or symbolic temperature, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Overexposed drive the light response: shape light through impossible shadows, memory haze,
    stage stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Low res photo as the tactile or mark-making basis; surfaces should support the illusion
    with believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled to
    figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Familiarity drift as reusable spatial grammar: favor symbolic focal points, scale
    mismatch, empty thresholds, doubled images, and psychologically charged negative space, adapting
    cleanly to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Nostalgic, wrong as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Internet aesthetic: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Nostalgic nightmare; Soft; Pastel, bloom; Overexposed; Low res photo; Familiarity drift;
    Nostalgic, wrong; Internet aesthetic; Pastel wrongness
  creative_brief: >-
    Apply dreamcore as nostalgic wrongness over the input with overexposed pastel bloom,
    low-res-photo softness, familiar forms slightly misremembered, cheerful daylight turning uneasy,
    and impossible symbolic intrusions. If house, yard, toy, sky, or childhood cue exists, bend it;
    otherwise make the subject feel like a corrupted memory without requiring a domestic setting.
avoidRules:
  - realism
  - dark
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
