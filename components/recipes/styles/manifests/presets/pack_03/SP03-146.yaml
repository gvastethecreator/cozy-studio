visualDna:
  aesthetic: 'UV checker test shader: the model wrapped in a colored checker grid that exposes its texture mapping, with stretching, pinching and seams visible.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Alternating light and dark squares in a rainbow of cell colors, with small orientation arrows instead of any numbers or letters.
  lighting_and_shadow: Simple viewport key and fill light with soft shading, so the grid stays readable on every face.
  texture_and_material: Squares stay square on good areas, stretch into rectangles on strained areas and jump at UV seams.
  camera_and_composition: Keep the requested camera; curved and folded areas of the model face the viewer to show distortion.
  atmosphere_and_mood: Playful and diagnostic, a test pattern wrapped around form.
  rendering_and_quality: Clean viewport-style render with a sharp grid and no other material; seams and stretches left visible.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies UV Checker Grid Shader as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: colored checker grid; stretched cells on strained areas; visible UV seams; orientation arrows only; simple viewport light
