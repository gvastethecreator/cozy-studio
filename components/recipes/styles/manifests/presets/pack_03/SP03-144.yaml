visualDna:
  aesthetic: 'Z-depth render pass: each pixel shows only its distance from the camera, near surfaces white fading smoothly to black at the far clip.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: 'Pure greyscale: white foreground, mid grey middle distance, black background; no hue and no texture color.'
  lighting_and_shadow: No lighting or shadows; value changes only with distance, so flat walls become smooth gradients.
  texture_and_material: Materials disappear; only silhouettes and depth steps remain, with hard value jumps where a near edge overlaps a far one.
  camera_and_composition: Keep the requested camera; compositions with strong recession show the gradient best.
  atmosphere_and_mood: Quiet, foggy and abstract, space turned into a single gradient.
  rendering_and_quality: Clean anti-aliased depth buffer normalized between near and far, with no banding and no noise.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Z-Depth Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: distance as brightness; white near to black far; hard steps at overlapping edges; no texture; no lighting
