visualDna:
  aesthetic: >-
    Build the graphic anime treatment from lightly layered sketch contours with visible searching
    strokes and plain, uncomplicated forms with a few warped peripheral shapes. Let subtle
    wavering interrupted by isolated looping marks set its rhythm; use airy pastels with a small
    acid yellow-green accent for color and pencil-like grain under irregular, translucent color
    washes for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use lightly layered sketch contours with visible
    searching strokes for edge work, plain, uncomplicated forms with a few warped peripheral
    shapes for form simplification, and subtle wavering interrupted by isolated looping marks only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with airy pastels with a small acid yellow-green accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: soft flat values with pale, lightly drawn edges. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with pencil-like grain under irregular, translucent color washes,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use wide open space with a few crooked shapes kept near
    the focal area to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey quiet unease and introspection, while preserving
    the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with airy hand-drawn marks, sparse distortion, and a large share of untouched space;
    keep detail selective and accents attached to existing forms.
  key_features: >-
    lightly layered sketch contours with visible searching strokes; plain, uncomplicated forms
    with a few warped peripheral shapes; airy pastels with a small acid yellow-green accent;
    subtle wavering interrupted by isolated looping marks; pencil-like grain under irregular,
    translucent color washes; wide open space with a few crooked shapes kept near the focal area.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with lightly layered
    sketch contours with visible searching strokes, plain, uncomplicated forms with a few warped
    peripheral shapes, and airy pastels with a small acid yellow-green accent; use subtle wavering
    interrupted by isolated looping marks only where movement is already present, and apply
    pencil-like grain under irregular, translucent color washes as the drawing finish.
