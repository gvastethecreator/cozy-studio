visualDna:
  aesthetic: 'Hand-painted 2D isometric game art: the scene assembled from modular diamond tiles with painted top faces and darker side faces, like a builder game map.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a 2:1 dimetric tile view in which the subject sits on an exposed chunk of ground tiles, and that layout replaces the requested framing.
  color_and_tone: Saturated game palette where each terrain type owns one hue family and every side face steps darker by a fixed value.
  lighting_and_shadow: Fixed top-left light on every asset, with soft painted ambient occlusion where tiles and buildings meet.
  texture_and_material: Soft painted brush texture inside crisp tile edges, repeating modular pieces with small hand-painted variations.
  camera_and_composition: Parallel 2:1 dimetric projection without perspective, the scene resting on a floating chunk of tiles with visible soil sides.
  atmosphere_and_mood: Cozy, orderly and systemic, a small world you want to manage.
  rendering_and_quality: Crisp tile silhouettes and painted surfaces, no 3D render sheen, no interface elements.
  key_features: 2:1 diamond tile grid; painted top faces with darker sides; fixed top-left light; floating ground chunk; modular repeated assets
  creative_brief: "Hand-painted 2D isometric game art: the scene assembled from modular diamond tiles with painted top faces and darker side faces, like a builder game map. Carry it through 2:1 diamond tile grid, painted top faces with darker sides, fixed top-left light, floating ground chunk, modular repeated assets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
