visualDna:
  aesthetic: 'Storm photography: a wide lens capturing the structure of a severe storm — rotating supercells, shelf clouds and walls of rain or dust — towering over the land.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Bruised teal, slate and green-grey clouds, a band of warm light under the storm, dark wet ground.
  lighting_and_shadow: Low sun slipping under the cloud base, lighting the land while the sky is dark; lightning optional in the distance.
  texture_and_material: Striated cloud layers, rain shafts, blowing dust and bending crops.
  camera_and_composition: 16–24 mm, low horizon, storm filling two thirds of the frame, a small structure or figure for scale.
  atmosphere_and_mood: Ominous and awe-struck, a wall of weather advancing slowly.
  rendering_and_quality: Natural contrast with detailed cloud structure; no HDR halos.
  creative_brief: "Storm photography: a wide lens capturing the structure of a severe storm — rotating supercells, shelf clouds and walls of rain or dust — towering over the land. Carry it through rotating supercell or shelf cloud, low horizon, light under the cloud base, small scale marker, rain or dust walls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rotating supercell or shelf cloud; low horizon; light under the cloud base; small scale marker; rain or dust walls
