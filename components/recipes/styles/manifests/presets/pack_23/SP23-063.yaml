  subject_treatment: Preserve the requested identity, count, pose and action with original figures; set the subject inside a small seasonal task scene with neat toy-like fields and buildings.
  color_and_tone: Lapis blue skies, fresh greens, wheat gold and bright costume colors.
  lighting_and_shadow: Clear even daylight with small crisp shadows, kept consistent across the whole image.
  texture_and_material: Fine opaque pigment, delicate detail and a thin gold arc above.
  camera_and_composition: Elevated view of fields, figures and a castle under a curved sky band.
  atmosphere_and_mood: Keep the requested mood with orderly seasonal rhythm.
  rendering_and_quality: Precise miniature detail with bright clean pigment, kept consistent across the whole image.
