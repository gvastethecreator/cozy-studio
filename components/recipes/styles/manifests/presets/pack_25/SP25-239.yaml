visualDna:
  aesthetic: 'Synchronized Telemetry Layout: several signal panels and images sharing one time axis, one cursor and one set of ids.'
  subject_treatment: Lay out the prompt's signals in panels sharing one time axis and one cursor, the detail repeating the exact values at that instant.
  color_and_tone: One color per signal in every panel, alerts only for supplied states.
  lighting_and_shadow: Flat screen with crisp separation between grid, data and cursor.
  texture_and_material: Light grids and one stroke per signal on a clean reading area.
  camera_and_composition: One time axis, a coordinated cursor, a persistent legend and a detail box.
  atmosphere_and_mood: Coordinated attention, every panel clearly from the same moment.
  rendering_and_quality: Crisp layout with exact timestamps, aligned cursors and a static mockup label.
  creative_brief: "Synchronized Telemetry Layout: several signal panels and images sharing one time axis, one cursor and one set of ids. Carry it through shared time axis, one cursor, synced detail, persistent legend. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared time axis; one cursor; synced detail; persistent legend
