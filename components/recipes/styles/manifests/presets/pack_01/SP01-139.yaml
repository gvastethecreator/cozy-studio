  color_and_tone: Violet, blue and white electric corona on black; object interior dark or faintly lit.
  lighting_and_shadow: 'No external light: only the discharge around edges and veins.'
  texture_and_material: Fine radiating spark filaments, beaded streamers and veins traced in light.
  camera_and_composition: Contact-print view, object flat and centered, corona radiating outward.
  atmosphere_and_mood: Uncanny and electric, the object seeming to give off its own aura.
  rendering_and_quality: Contact-print discharge look; not a painted aura or glow filter.
