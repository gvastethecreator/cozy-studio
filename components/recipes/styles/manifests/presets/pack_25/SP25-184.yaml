visualDna:
  aesthetic: 'Ribbon-Terminal Lettering: a few letter terminals extend into flat bands with one or two folds, sharing one common tension.'
  subject_treatment: Letter the requested words and extend two or three terminals into flat folding ribbons, keeping every letter body complete and readable.
  color_and_tone: Two optional values for band orientation, the word legible in one ink.
  lighting_and_shadow: Minimal graphic shade inside each fold with a flat finish.
  texture_and_material: Smooth bands of related thickness with visible ends at every fold.
  camera_and_composition: Extensions gathered on a few letters, clear of critical spaces.
  atmosphere_and_mood: Contained flow and an opening gesture, elegant and restrained.
  rendering_and_quality: Crisp lettering that still reads fully with the ribbons removed.
  creative_brief: "Ribbon-Terminal Lettering: a few letter terminals extend into flat bands with one or two folds, sharing one common tension. Carry it through ribbon terminals, one or two folds, kept letter bodies, visible ends. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ribbon terminals; one or two folds; kept letter bodies; visible ends
