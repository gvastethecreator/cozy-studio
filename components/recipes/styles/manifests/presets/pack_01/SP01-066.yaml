visualDna:
  aesthetic: 'Automotive advertising photography: a vehicle sculpted by long strip reflections along its bodywork, or shown in a rolling shot with blurred wheels and background.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Deep glossy paint color, dark or dusk surroundings, clean specular whites.
  lighting_and_shadow: Huge overhead scrim or light-painted strips creating continuous reflections along every panel; rim light on the silhouette.
  texture_and_material: Mirror-like paint, chrome, glass and leather; reflections shaped deliberately.
  camera_and_composition: Low three-quarter front angle, 35–85 mm; for motion, a panned rolling shot with streaked background and spinning wheels.
  atmosphere_and_mood: Powerful and sleek, weight and speed held in one glossy form.
  rendering_and_quality: High-end automotive retouch with controlled reflections; no badges, plates or readable text.
  key_features: strip reflections along bodywork; low three-quarter angle; rolling shot with blurred wheels; mirror paint; rim-lit silhouette
  creative_brief: "Automotive advertising photography: a vehicle sculpted by long strip reflections along its bodywork, or shown in a rolling shot with blurred wheels and background. Carry it through strip reflections along bodywork, low three-quarter angle, rolling shot with blurred wheels, mirror paint, rim-lit silhouette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
