visualDna:
  aesthetic: 'Data-Encoded Textile Marks: hand-drawn marks that encode a supplied dataset, spread over the garment with a readable key.'
  subject_treatment: Encode the prompt's supplied numbers as one drawn mark per unit, grouped by shape and placed in printable zones, with the exact title and a small key.
  color_and_tone: Color by category backed by shape, with no size or brightness scaling.
  lighting_and_shadow: Flat graphic source with mockup light leaving the count untouched.
  texture_and_material: Original strokes with contained hand variation and comparable area.
  camera_and_composition: Main code in a readable zone and the key in a secondary spot.
  atmosphere_and_mood: A personal, narrative rhythm grounded in explicit data.
  rendering_and_quality: Clean print with countable marks and no unit cut by a seam.
  creative_brief: "Data-Encoded Textile Marks: hand-drawn marks that encode a supplied dataset, spread over the garment with a readable key. Carry it through one mark per unit, shape by group, readable key, exact title. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one mark per unit; shape by group; readable key; exact title
