visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through masked route planning and soft-footed staging; ritual architecture,
    mythic scale, ceremonial lanes, relic energy, and sacred spatial order, using the preset as art
    direction rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express ritual hierarchy, artifact
    weight, ceremonial route pressure, and mythic trial readability without forcing a temple scene.
  color_and_tone: >-
    Grade the image with mineral gold, moonlit blue, jade, orchid, volcanic green, marble white, and
    prismatic ritual accents; keep tonal hierarchy strong enough for gameplay readability, thumbnail
    clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with heat shimmer and mirror haze; altar glow, rune bounce, moon shafts,
    crystal caustics, brazier halos, and sacred backlight; use highlights and shadow pockets to
    reveal routes, hazards, factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from polished tile, silk screens, and ornate rails; silk, mirror floors, and
    masked ornament; carved stone, polished relic metal, paper talismans, wet moss, lacquer,
    crystal, incense haze, and worn ritual cloth; make props, clothing, creatures, vehicles,
    architecture, and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from ritual architecture, mythic scale, ceremonial lanes,
    relic energy, and sacred spatial order: lane rhythm, scale contrast, objective hierarchy,
    readable negative space, encounter depth, and motion vectors should adapt to portraits, objects,
    creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood luxury deception; elegant stealth pressure; reverent, mysterious, dangerous,
    mythic, ceremonial, and charged with old power; the result can be adult, harsh, seductive,
    eerie, or violent when prompt X asks for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as ornate but legible game-art finish with disciplined focal hierarchy and no generic
    fantasy postcard staging; preserve clean focal hierarchy, believable material response,
    heavy-denoise clarity, and no readable UI, text, logos, or stock key-art gloss.
  creative_brief: >-
    Apply Mirage Palace Stealth Gala as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
  key_features: >-
