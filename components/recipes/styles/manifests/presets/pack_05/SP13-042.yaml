visualDna:
  aesthetic: 'Anime storyboard triptych: one requested action split into three side-by-side panels showing anticipation, the peak of action and the follow-through, with the same subject in each.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns a three-panel layout of anticipation, action and follow-through, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette identical across all three panels; only the middle panel gets the strongest value contrast.
  lighting_and_shadow: The same light direction in all panels so the three read as one continuous moment.
  texture_and_material: Clean cel rendering in every panel, thin dark gutters between them and no drawn text or panel numbers.
  camera_and_composition: Three equal vertical panels, the camera shifting slightly closer in the middle panel and pulling back for the follow-through.
  atmosphere_and_mood: Clear, satisfying cause and effect, like a well-timed animation key sequence.
  rendering_and_quality: Consistent model and costume across the panels, with each pose readable on its own.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Three-Beat Action Triptych as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: three equal panels; anticipation, peak, follow-through; same subject and light in each; thin textless gutters; closer middle panel
