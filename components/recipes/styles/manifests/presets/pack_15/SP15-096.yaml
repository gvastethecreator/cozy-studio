visualDna:
  aesthetic:
    'Bodypunk illustration treats the body as the meeting point of agency and designed technology:
    fitted sensory wearables, tendon-like cable routes, second-skin panels and articulated external supports.
    Make a purposeful interface between living form and constructed design, not a layer of nerve-pattern texture.'
  subject_treatment:
    Preserve requested identity, action and explicit anatomy or reference locks. Design unspecified
    clothing, equipment or surfaces as fitted second skins, sensory bands, articulated supports and flexible
    interfaces that follow movement. Keep new external components functionally connected; changing supplied
    anatomy or adding invasive grafts requires that transformation to be requested. In a scene without a person,
    express body contact through one fitted seam or tactile sensory surface integrated into an existing seat,
    back or armrest; preserve familiar furniture and room context without requiring a new cable.
  color_and_tone:
    Use supplied skin, fabric or material colors with selective mineral red, electric blue, ivory
    or amber sensory accents. Respect palette and localize signals.
  lighting_and_shadow:
    Follow specified light and sources. Use gentle soft-form transitions and crisp contour
    shadows; do not impose clinical glare or dramatic glow.
  texture_and_material:
    Distinguish skin from flexible polymer, woven sensor bands, soft padding and articulated
    hard supports. Place tactile fibers and translucent interfaces at purposeful contact points; do not coat
    the whole body in the same synthetic membrane.
  camera_and_composition:
    Preserve view and subject placement. Let contour paths guide the eye without forcing
    portrait, examination or close-up.
  atmosphere_and_mood:
    Suggest sensory awareness, vulnerability, strength or care through tactile contrast;
    retain requested mood, including horror when specifically requested.
  rendering_and_quality:
    Use contour-following fibers, restrained translucent layers and clear separation between
    marks and anatomy. Use medical detail only when called for.
avoidRules:
  - Do not impose a clinic, procedure, body modification or injury narrative.
  - Respect anatomy locks; do not add unrequested grafts, exposed anatomy or gore.
  - Avoid nerve wiring that obscures body structure.
