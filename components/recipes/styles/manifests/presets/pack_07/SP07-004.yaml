visualDna:
  aesthetic: 'Scandinavian hygge interior: pale scrubbed pine and birch, rounded low furniture, layered wool and linen, and many small warm light sources against long northern dusk.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Cream, oat, pale birch and soft grey with honey-warm light; one muted accent such as lingonberry red or moss green; low contrast.
  lighting_and_shadow: Several low warm points — candles, a small woodstove, shaded table lamps — against cool blue window light; soft enveloping shadow, no overhead glare.
  texture_and_material: Soap-scrubbed pine floorboards, sheepskin, chunky knit and felted wool, washed linen, matte glazed stoneware, whitewashed panelling.
  camera_and_composition: Keep the requested view; slightly close framing that feels enclosed, soft textiles in the foreground, warm and cool light zones side by side.
  atmosphere_and_mood: Snug, gentle and sheltered against the cold outside.
  rendering_and_quality: 'Soft natural-light photograph: tactile fibres readable, warm highlights gentle, no glossy surfaces or hard metal dominating.'
  key_features: scrubbed pale pine; layered wool and sheepskin; many small warm light points; cool blue window dusk; rounded low furniture
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Scandinavian Hygge as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
