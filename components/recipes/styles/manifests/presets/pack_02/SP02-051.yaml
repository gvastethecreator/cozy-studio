visualDna:
  aesthetic: '90s disposable-camera lab print: a 4x6 drugstore print from a single-use camera, with flash, warm lab color and a slightly off exposure.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Warm orange-magenta lab cast, punchy reds, green-tinted shadows, blown flash faces.
  lighting_and_shadow: Built-in flash at night, harsh falloff; or bright hazy daylight.
  texture_and_material: Visible grain, soft plastic lens, slightly crooked horizon, matte print surface.
  camera_and_composition: Snapshot framing, subjects cut at the edges, horizon tilted.
  atmosphere_and_mood: Carefree and chaotic, the best night of a 90s summer.
  rendering_and_quality: Drugstore print look with no date stamp; distinct from the modern single-use look in pack_01.
  key_features: warm lab print cast; flash-blown faces; grain; tilted snapshot framing; matte 4x6 surface
  creative_brief: "90s disposable-camera lab print: a 4x6 drugstore print from a single-use camera, with flash, warm lab color and a slightly off exposure. Carry it through warm lab print cast, flash-blown faces, grain, tilted snapshot framing, matte 4x6 surface. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
