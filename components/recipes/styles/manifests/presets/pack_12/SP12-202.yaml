  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as comic-page heroes inside panels. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Comic print colors and halftone, true to the Comix Zone 1995 palette.
  lighting_and_shadow: Flat comic light, lit the way Comix Zone 1995 lights its levels.
  texture_and_material: Printed halftone and ink, with the in-engine surface finish of Comix Zone 1995.
  camera_and_composition: Comic page panel view, framed the way Comix Zone 1995 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with rowdy comic-book action.
  rendering_and_quality: Authentic Mega Drive comic brawler screen, matching real Comix Zone 1995 screenshots.
  creative_brief: 'Sega Technical Institute Comix Zone (1995) look: brawler set inside comic book pages, heroes jumping between panels, hand-drawn villains and halftone effects. Carry it through Comix Zone panels, halftone, page brawl. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
