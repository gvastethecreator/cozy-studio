visualDna:
  aesthetic: >-
    Charged editorial ink: broken scratch contours, heavy black silhouettes, abrupt chromatic
    slashes, and exposed pigment.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Sharpen marks
    around gestures already present without inventing performance or movement.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, anchor charcoal and black
    with crimson, an acidic accent, and dirty cream; explicit palette requests take priority.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow the given source with hard
    highlight cuts and warm-cool contrast; create no spotlight or stage glow.
  texture_and_material: >-
    Apply texture only to materials already present. Use scuffed pigment and short hatching only
    on existing rough materials; keep smooth surfaces clean.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Alternate dense and open
    mark zones on existing shapes, with no stage, crowd, or instrument additions.
  atmosphere_and_mood: >-
    Retain the requested mood; abrasiveness is ink quality, not rebellion or alienation.
  rendering_and_quality: >-
    Keep silhouettes readable through texture and protect identity details from excessive
    scratch marks.
  key_features: >-
    Broken scratch ink; heavy black silhouette; crimson-acid accent; source-bound hard light.
  creative_brief: >-
    Use broken scratch ink; heavy black silhouette; crimson-acid accent; source-bound hard
    light. Keep the requested subjects, action, setting, palette, framing and mood; add no scene
    content.
