  aesthetic: 'Vertex-colored low poly: early 3D models with no textures at all, color painted directly on vertices so gradients blend across big simple polygons.'
  subject_treatment: Preserve the requested identity, count, pose and action with original characters; render the subject with simple polygons colored only by blended vertex colors.
  color_and_tone: Soft blended gradients across large polygons, kept consistent across the whole image.
  lighting_and_shadow: Baked vertex shading with no real shadows, kept consistent across the whole image.
  texture_and_material: No textures, visible polygon edges and color blends.
  camera_and_composition: Clean composition of simple models, kept consistent across the whole image.
  atmosphere_and_mood: Keep the requested mood with soft minimal dream.
  rendering_and_quality: Clean low poly with smooth color gradients, kept consistent across the whole image.
  creative_brief: "Vertex-colored low poly: early 3D models with no textures at all, color painted directly on vertices so gradients blend across big simple polygons. Carry it through vertex colors, no textures, blended gradients, low poly. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
