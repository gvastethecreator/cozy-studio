visualDna:
  aesthetic: >-
    Round, elastic contours pair with brief squash-and-stretch and short comic smears; make reaction
    timing and buoyant affection the drawing rhythm, without inventing a gag or relationship.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: bright, clean cel values with
    cheerful pastel accents and clear separation between subject and ground; keep the accent colors
    attached to the prompt.
  lighting_and_shadow: >-
    Use crisp cel shadow shapes and a small rim highlight to punctuate an existing expression or
    impact; do not turn stillness into motion.
  texture_and_material: >-
    Keep outlines smooth and rounded; reserve smear marks for motion already present, and keep fills
    clean rather than gritty.
  camera_and_composition: >-
    Let contour compression and extension emphasize the existing pose; keep the prompted crop,
    silhouette and layout.
  atmosphere_and_mood: >-
    Playful timing and warm buoyancy come from the line rhythm; preserve whatever emotional register
    the prompt requests.
  rendering_and_quality: >-
    Keep deformation local and reversible: preserve recognizable identity and construction, and add
    no blush, hearts, props or reaction marks unless requested. Keep important silhouettes and joins
    legible; no watermark, unrequested text or interface.
  key_features: >-
    Comic smears; expressive reaction timing; controlled squash-and-stretch; readable rounded
    silhouettes; buoyant tension; bright cartoon clarity.
  creative_brief: >-
    Apply this visual treatment to the requested content: Comic smears; expressive reaction timing;
    controlled squash-and-stretch; readable rounded silhouettes; buoyant tension; bright cartoon
    clarity. Preserve its identity, action, materials, composition and requested tone; introduce no
    persona, scene, franchise cue or extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - identity-changing squash-and-stretch
  - smear trails detached from prompted motion
  - motion blur obscuring contour
  - grain obscuring the clean rounded line
