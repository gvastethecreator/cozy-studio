visualDna:
  aesthetic: 'Noise dissolve shader: the named subject disappearing along a threshold driven by procedural noise, leaving ragged holes with a thin glowing burn edge.'
  subject_treatment: Keep the prompt subject, setting, camera and normal CGI beauty render; this shader adds only its one named effect on the stated geometry, computed in the renderer rather than photographed.
  color_and_tone: Subject in its own colors, a hot orange-to-white or cold cyan edge band, the background showing through the holes.
  lighting_and_shadow: Normal scene light; the glowing edge casts faint light onto nearby surfaces.
  texture_and_material: Cloudy noise-shaped holes, a crisp emissive rim of fixed width, small ember or ash particles drifting off the edge.
  camera_and_composition: Keep the requested camera; the dissolve front sweeps across the subject in one direction.
  atmosphere_and_mood: Eerie and final, something being erased from the world.
  rendering_and_quality: Clean alpha-clip shader with a sharp emissive edge; no paper burn texture and no painted smoke.
  creative_brief: "Noise dissolve shader: the named subject disappearing along a threshold driven by procedural noise, leaving ragged holes with a thin glowing burn edge. Carry it through noise-driven holes, thin emissive edge band, ember particles off the edge, one-direction dissolve front, background through holes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: noise-driven holes; thin emissive edge band; ember particles off the edge; one-direction dissolve front; background through holes
