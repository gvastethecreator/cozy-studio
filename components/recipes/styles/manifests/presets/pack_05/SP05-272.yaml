visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around short broken reflection
    bars and thin interference lines that describe existing reflective surfaces, not
    machinery. For color and surface, retain the prompted colors inside a cool
    steel-blue, charcoal, and muted silver value range with minimal oil-slick accents.
    Mourning may appear as a subdued, cool value balance; do not make the image
    nocturnal or mechanical by default
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through short broken reflection bars and
    thin interference lines that describe existing reflective surfaces, not machinery;
    use detail selectively and keep the actual form easy to read. Add no unrequested
    subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain the prompted colors
    inside a cool steel-blue, charcoal, and muted silver value range with minimal
    oil-slick accents. Keep values legible across the prompted light and dark range; do
    not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; keep the original light source
    and break its reflections into narrow, discontinuous bands with visible dark detail.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; reserve smooth enamel-like sheen for already
    glossy material and use quiet graphite grain on matte areas. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; use
    repeated reflection lengths to pace existing forms while preserving their number,
    orientation, and framing. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Mourning may appear as a subdued, cool
    value balance; do not make the image nocturnal or mechanical by default. Darkness
    and tension are optional tonal pressure, never a requirement to add danger or
    rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and short broken reflection bars and thin
    interference lines that describe existing reflective surfaces, not machinery; keep
    focal edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    short broken reflection bars and thin interference lines that describe existing
    reflective surfaces, not machinery; retain the prompted colors inside a cool
    steel-blue, charcoal, and muted silver value range with minimal oil-slick accents;
    keep the original light source and break its reflections into narrow, discontinuous
    bands with visible dark detail; reserve smooth enamel-like sheen for already glossy
    material and use quiet graphite grain on matte areas; and use repeated reflection
    lengths to pace existing forms while preserving their number, orientation, and
    framing. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use short broken reflection bars and thin
    interference lines that describe existing reflective surfaces, not machinery, retain
    the prompted colors inside a cool steel-blue, charcoal, and muted silver value range
    with minimal oil-slick accents, keep the original light source and break its
    reflections into narrow, discontinuous bands with visible dark detail, and reserve
    smooth enamel-like sheen for already glossy material and use quiet graphite grain on
    matte areas; the prompt supplies all scene content. Do not add unrequested
    characters, objects, source-specific lore, readable symbols, or a default action.
