visualDna:
  aesthetic: 'Low-poly abstraction: subjects built from flat-shaded triangles with visible facets.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is triangulated into flat-shaded polygons with no smoothing."
  color_and_tone: Gradient-sampled flat colors across facets, used consistently across subject and background.
  lighting_and_shadow: Facet shading from one soft light, expressed through the style rather than photographic lighting.
  texture_and_material: Flat triangular facets with crisp edges, visible at card size as the signature of the style.
  camera_and_composition: Clean centered subject on a simple faceted ground, arranged so the subject still reads at card size.
  atmosphere_and_mood: Modern, crystalline, clean and graphic, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp flat-shaded finish, with clean, deliberate marks and no accidental noise.
  key_features: flat-shaded triangles; visible facets; gradient colors
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Low Poly Abstract as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - curved
  - smooth
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
