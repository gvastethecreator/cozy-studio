visualDna:
  aesthetic: 'Shinji Aramaki Appleseed film look (2004): cel-shaded 3D characters, sterile white utopian arcologies, glossy tactical landmates and clinical motion-capture action.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people as cel-shaded CG figures with smooth faces, tactical armor and glossy mechanical exosuits. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Sterile white, pale aqua, chrome silver and tactical olive accents.
  lighting_and_shadow: Clean bright arcology light, reflective glass and cold rim light.
  texture_and_material: Cel-shaded 3D surfaces, smooth gradients and glossy mechanical panels.
  camera_and_composition: Motion-capture action choreography and sweeping flyovers across white utopian towers.
  atmosphere_and_mood: Keep the requested mood with clinical sterile severity.
  rendering_and_quality: Glossy cel-shaded CG frame with sterile utopian architecture.
  key_features: Aramaki cel-shaded CG; sterile arcology; glossy landmates; clinical action
  creative_brief: "Shinji Aramaki Appleseed film look (2004): cel-shaded 3D characters, sterile white utopian arcologies, glossy tactical landmates and clinical motion-capture action. Carry it through Aramaki cel-shaded CG, sterile arcology, glossy landmates, clinical action. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
