visualDna:
  aesthetic: 'Interlocking Toy Volumes: pieces with obvious original connectors lock together into one compact, recognizable metaphor.'
  subject_treatment: Assemble the prompt's subject from a few pieces with an original, obvious connector system, every connection explaining the function.
  color_and_tone: Colors assigned by piece function, one dominant mass and limited accents.
  lighting_and_shadow: One broad common light with short contact shadows between the parts.
  texture_and_material: Smooth matte materials, large joints and original connectors.
  camera_and_composition: Compact build with visible connections and no loose meaningless parts.
  atmosphere_and_mood: The pleasure of building and a clear assembly, playful and precise.
  rendering_and_quality: The pieces can be mentally taken apart and the fit still makes sense.
  creative_brief: "Interlocking Toy Volumes: pieces with obvious original connectors lock together into one compact, recognizable metaphor. Carry it through original connectors, locking pieces, functional colors, compact build. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
