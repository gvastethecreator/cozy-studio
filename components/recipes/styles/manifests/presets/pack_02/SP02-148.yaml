visualDna:
  aesthetic: 'CT volume rendering: a stack of X-ray slices reconstructed into a 3D view where dense materials appear as ivory solids and softer layers as translucent shells.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Ivory and bone white for dense parts, translucent amber or blue for softer layers, black ground.
  lighting_and_shadow: Soft virtual lighting on reconstructed surfaces, subtle ambient occlusion.
  texture_and_material: Slightly stepped surfaces from slice reconstruction, porous bone and corrosion detail.
  camera_and_composition: Three-quarter view of the object with the outer layer cut away to reveal the inside.
  atmosphere_and_mood: Archaeological and uncanny, secrets revealed without opening anything.
  rendering_and_quality: Scientific volume render with no labels, scale bars or measurements.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies CT Volume Rendering as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ivory reconstructed solids; translucent outer shell; cut-away reveal; slice stepping; black background
