visualDna:
  aesthetic: 'Industrial Plate Navigation: sturdy plates of steady proportion carry text and arrows, their bolts clearly holding them up and kept off the information.'
  subject_treatment: Mount the prompt's sign text and arrows on sturdy matte plates with visible fixings outside the reading area, every word and arrow exact.
  color_and_tone: A matte contrasting field with clear type and a limited zone accent.
  lighting_and_shadow: Descriptive light with fixings casting no shadow over letters.
  texture_and_material: Conceptual plates and consistent bolts, any wear kept off information.
  camera_and_composition: Clear technical margins, anchors outside the text and aligned plates.
  atmosphere_and_mood: Sober visual robustness that feels dependable rather than theatrical.
  rendering_and_quality: Clean plates with defined edges and exact text.
  creative_brief: "Industrial Plate Navigation: sturdy plates of steady proportion carry text and arrows, their bolts clearly holding them up and kept off the information. Carry it through bolted plates, fixings off text, matte field, aligned system. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bolted plates; fixings off text; matte field; aligned system
