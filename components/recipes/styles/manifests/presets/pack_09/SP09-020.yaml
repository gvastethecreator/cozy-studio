visualDna:
  aesthetic: 'Copper patina: aged copper with verdigris green bloom over bronze-brown metal.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of copper with verdigris patina in recesses and bright copper on worn edges."
  color_and_tone: Verdigris green, teal and warm copper orange, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft overcast light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Copper sheet with oxidized verdigris crust and worn bright edges.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Aged, weathered, noble and calm, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: verdigris patina; bright worn copper edges; teal and orange
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Copper Patina as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
