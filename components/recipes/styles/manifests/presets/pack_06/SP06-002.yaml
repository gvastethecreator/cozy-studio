visualDna:
  aesthetic: 'Soft transparent watercolor: diluted pigment flooded wet-in-wet onto damp cold-press paper, with the white of the paper serving as the only white.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Pale transparent washes that granulate and mix on the paper; soft blues, sap greens and rose, values rarely darker than a mid-tone.
  lighting_and_shadow: Highlights are reserved untouched paper; shadows are a second glaze laid over a dry first wash, never opaque paint.
  texture_and_material: Cold-press paper tooth, granulating pigment in the valleys, cauliflower blooms where wet met damp, hard tide lines at the edges of dried pools.
  camera_and_composition: Keep the requested framing; edges of the image fade into bare paper instead of a hard rectangular border.
  atmosphere_and_mood: Gentle and airy, a scene breathing through damp light.
  rendering_and_quality: Soft bled edges beside a few crisp dry-brush accents; no white paint, no opaque cover, no digital gradient.
  key_features: wet-in-wet bleeding washes; reserved paper whites; granulation and blooms; hard tide lines; vignette into bare paper
  creative_brief: "Soft transparent watercolor: diluted pigment flooded wet-in-wet onto damp cold-press paper, with the white of the paper serving as the only white. Carry it through wet-in-wet bleeding washes, reserved paper whites, granulation and blooms, hard tide lines, vignette into bare paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
