visualDna:
  aesthetic: 'Quiet luxury: impeccably cut, unbranded clothes in the finest materials, where wealth is legible only to those who know.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a double-faced cashmere coat, fine-gauge knit and perfectly tailored trousers in tonal neutrals, with no visible logos or hardware."
  color_and_tone: Cream, camel, taupe, navy and soft grey; tonal and low-contrast.
  lighting_and_shadow: Soft, warm natural light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Double-faced cashmere, vicuña-like wool, silk and suede, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Relaxed, elegant framing with restrained composition, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Assured, discreet and effortless, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Refined, soft-contrast finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Quiet luxury: impeccably cut, unbranded clothes in the finest materials, where wealth is legible only to those who know. Carry it through unbranded cashmere, tonal neutrals, perfect tailoring, discreet wealth, soft warm light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: unbranded cashmere; tonal neutrals; perfect tailoring; discreet wealth; soft warm light
