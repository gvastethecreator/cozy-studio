  color_and_tone: Rich jewel tones with glowing elemental accents, true to the Gacha Splash Art Character palette.
  lighting_and_shadow: Glowing elemental light and soft bloom, lit the way Gacha Splash Art Character lights its scenes.
  texture_and_material: Polished digital painting with ornate detail, with the surface finish of Gacha Splash Art Character.
  camera_and_composition: Dynamic splash compositions with flowing fabric, framed the way Gacha Splash Art Character composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with dazzling heroic spectacle.
  rendering_and_quality: Polished gacha splash illustration, in the recognizable hand of Gacha Splash Art Character.
  creative_brief: "Modern gacha game splash art look as in miHoYo and Cygames releases: ornate fantasy outfits, dynamic flowing fabric, glowing elemental effects and polished anime-realist rendering. Carry it through Gacha splash, ornate outfits, elemental glow, flowing fabric. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
