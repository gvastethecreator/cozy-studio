visualDna:
  aesthetic: 'Late nineties Y2K translucent product language: candy-colored see-through plastic shells revealing electronics, rounded bubbly forms and playful consumer tech.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; rebuild the subject as a rounded bubbly product in candy translucent plastic showing its insides. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Translucent blueberry, tangerine, lime and grape, true to the Y2K Translucent palette.
  lighting_and_shadow: Bright light glowing through plastic, lit the way Y2K Translucent lights its scenes.
  texture_and_material: Translucent colored plastic and visible circuits, with the surface finish of Y2K Translucent.
  camera_and_composition: Three-quarter product view on white, framed the way Y2K Translucent composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cheerful millennial optimism.
  rendering_and_quality: Clean industrial design studio render with honest materials and precise seams.
  creative_brief: "Late nineties Y2K translucent product language: candy-colored see-through plastic shells revealing electronics, rounded bubbly forms and playful consumer tech. Carry it through Y2K translucent, candy plastic, visible insides. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Y2K translucent; candy plastic; visible insides
