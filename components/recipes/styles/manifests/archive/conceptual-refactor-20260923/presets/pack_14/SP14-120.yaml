    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    paired-form tension and two-sided silhouette pressure, dual authority and elevated symbolic mass
    without forcing a deity portrait plus wave-pull contour and paired force moving through the
    prompt form; forms should inherit silhouette pressure, emblem logic, ritual posture, edge
    weight, and motif placement instead of a mandatory actor or prop set.
