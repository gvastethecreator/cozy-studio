visualDna:
  aesthetic: 'Minimalist photography: one subject isolated in a large field of plain tone, with two or three colors and nothing else competing.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Two or three flat tones, pale or dark ground, one contrasting accent.
  lighting_and_shadow: Soft even light or a single clean shadow; no busy texture.
  texture_and_material: Surfaces simplified to flat planes; detail kept only on the subject.
  camera_and_composition: Subject small and placed on a third or at an edge, with at least two thirds negative space.
  atmosphere_and_mood: Calm and spare, silence given as much weight as the subject.
  rendering_and_quality: Clean photographic minimalism; no clutter, no heavy grading.
  key_features: single isolated subject; vast negative space; two or three tones; one accent color; clean edges
  creative_brief: "Minimalist photography: one subject isolated in a large field of plain tone, with two or three colors and nothing else competing. Carry it through single isolated subject, vast negative space, two or three tones, one accent color, clean edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
