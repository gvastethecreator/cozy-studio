visualDna:
  aesthetic: >-
    Use winding hatch arcs, scratched line and ink pools to build graphic pressure around an
    existing focal point; do not add a literal spiral or vortex.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep a compressed dark palette
    with controlled high-value accents; preserve requested colors.
  lighting_and_shadow: >-
    Shape pressure with converging value and ink density, not invented light or flame.
  texture_and_material: >-
    Layer engraved hatch and scratch in arcs that follow existing forms; keep detail deliberate and
    readable.
  camera_and_composition: >-
    Concentrate mark direction toward the prompt's existing focus while keeping the composition
    stable.
  atmosphere_and_mood: >-
    Unease comes from the engraving rhythm; keep panic at the level requested by the prompt.
  rendering_and_quality: >-
    Use the arc logic on any subject without adding spirals, eyes, a vortex, distortion or threat.
    Keep important silhouettes and joins legible; no watermark, unrequested text or interface.
  key_features: >-
    Winding hatch arcs; scratched engraving; ink pools; directional pressure; focused dark/light
    contrast.
  creative_brief: >-
    Apply this visual treatment to the requested content: Winding hatch arcs; scratched engraving;
    ink pools; directional pressure; focused dark/light contrast. Preserve its identity, action,
    materials, composition and requested tone; introduce no persona, scene, franchise cue or extra
    motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - hatch arcs obscuring the focal contour
  - scratch marks unrelated to form direction
  - spiral-like distortion altering source geometry
