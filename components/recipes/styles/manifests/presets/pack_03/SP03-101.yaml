visualDna:
  aesthetic: 'Volumetric cloud lighting: rendered clouds with dense cores and backlit edges glowing silver, casting moving shadows across the land.'
  subject_treatment: Keep the prompt subject, geometry and camera; the sky above the existing setting becomes rendered volumetric clouds that shape the light.
  color_and_tone: Dark blue-grey cloud cores, silver and gold edges, patchy sunlit ground.
  lighting_and_shadow: Sun behind clouds; bright silver linings, crepuscular gaps, cloud shadows on the ground.
  texture_and_material: Billowing cumulus detail, wispy edges, sun breaking through holes.
  camera_and_composition: Keep the requested framing; a slice of sky and the shadowed ground.
  atmosphere_and_mood: Dramatic and changing, weather deciding what is lit.
  rendering_and_quality: High-detail volumetric clouds with fine wisps and no blocky noise.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Volumetric Cloud Silver Lining as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
