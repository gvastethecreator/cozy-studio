visualDna:
  aesthetic: 'Subsurface scattering material: light enters the surface, travels inside and glows back out, so thin areas shine warm like wax, jade or backlit skin.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Warm inner glow in reds, ambers or greens; soft saturated transmission at thin edges.
  lighting_and_shadow: Backlight or side light producing glowing edges and soft terminator lines.
  texture_and_material: Soft waxy surface, blurred inner detail, faint veins or clouds inside.
  camera_and_composition: Keep the requested framing; a light behind or beside the target to reveal the glow.
  atmosphere_and_mood: Warm and alive, the material holding light like a heartbeat.
  rendering_and_quality: Physically based scattering; not a flat emissive glow.
  key_features: light glowing through thin areas; soft terminator; waxy inner clouds; backlit translucency; warm transmission
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Subsurface Scattering (SSS) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
