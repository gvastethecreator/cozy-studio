visualDna:
  aesthetic: 'Data center grid: a sealed technical hall of hot and cold aisle containment, perforated raised floor, overhead cable trays and racks blinking in a cold white light.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Matte black racks, cool white and pale grey surfaces, yellow fibre raceway, tiny blue, green and amber status LEDs; clinical, cool, high order.
  lighting_and_shadow: Even cold LED strips above the aisles, glow of status lights in the dark rack faces, hard shadow lines from cable trays.
  texture_and_material: Perforated steel floor tiles, mesh rack doors, bundled patch cables combed into looms, yellow fibre trays, sealed containment doors with rubber gaskets.
  camera_and_composition: Keep the requested view; use the modular grid of racks and floor tiles as order, oblique or overhead views rather than a centred aisle.
  atmosphere_and_mood: Cold, humming and inhuman, order sealed in chilled air.
  rendering_and_quality: Crisp technical photograph with clean cable dressing and tiny LED points, no readable screens or monitor walls.
  key_features: hot and cold aisle containment; perforated raised floor; yellow fibre raceway; blinking status LEDs; combed cable looms
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Data Center Grid as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
