visualDna:
  aesthetic: >-
    Pulp Magazine Cover acts as a transferable illustration router: start from Mid-century
    pulp-cover illustration style with sensational composition, high-urgency editorial drama, and
    lurid trade texture-impact intent, Masthead-safe title zone, blurb-driven layout logic,
    sensational focal center, newsstand-impact color blocking and editorial graphic system built
    from poster hierarchy, symbolic compression, typography-as-shape, reproduction limits, and
    immediate visual argument, then apply the visual behavior to prompt X instead of recreating a
    fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Painterly contour emphasis with bold gesture silhouettes,
    kinetic focal diagonals, and headline-oriented compositional framing; preserve the requested
    subject while converting it into emblem, poster form, editorial metaphor, collage fragment,
    fashion gesture, or information hierarchy, keeping the requested identity, silhouette, pose,
    object function, or setting legible.
  color_and_tone: >-
    Build color with Aggressive warm primaries with acid yellow-red pushes, deep shadow anchors, and
    high-contrast attention-grab hierarchy; use color as communication pressure: ink plates,
    propaganda contrast, deco metallic restraint, psychedelic vibration, Bauhaus primaries, vector
    flatness, or vintage print fade, with deliberate value grouping, accent control, and
    process-specific limits rather than a generic palette wash.
  lighting_and_shadow: >-
    Handle light through Hard-edged spotlight contrast with half-lit faces, dramatic shadow wedges,
    and suspense-driven value staging; make light serve graphic hierarchy through flat poster
    contrast, airbrush gradients, screenprint layers, symbolic rays, collage mismatch, or painted
    cover drama, so value structure supports the illustration process and does not overwrite the
    requested content.
  texture_and_material: >-
    Render Cheap coated-pulp paper feel with visible print wear, ink soak variation, and subtle
    halftone residue; surface detail should reveal screenprint ink, risograph grain, paper stock,
    cut-paper edges, vector fields, album-cover wear, or editorial print finish, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Perspective pushed toward action-forward staging with near field
    exaggeration and compressed narrative depth; compose through graphic hierarchy, diagonal force,
    asymmetrical grid, ornamental framing, cover impact, information grouping, or fashion elongation
    without readable slogan dependency, with scale, spacing, edge rhythm, and visual hierarchy doing
    the style work.
  atmosphere_and_mood: >-
    Keep the mood Tense, sensational, urgent, dramatic, lurid; derive mood from propaganda urgency,
    luxe modernity, counterculture heat, editorial wit, travel nostalgia, music-poster grit, or
    cover-story seduction, letting the style alter interpretation without demanding a specific
    story, location, or actor.
  rendering_and_quality: >-
    Finish with High-energy cover-art finish prioritizing immediate shelf readability, dramatic
    hooks, and tabloid-level visual punch; finish as deliberate graphic communication with crisp
    shape logic, controlled print artifacts, and no random poster text or literal advertisement
    clutter, clean denoised surfaces where appropriate, and enough process evidence to make the
    style recognizable.
  key_features: >-
    Mid-century pulp-cover illustration style with sensational composition, high-urgency editorial
    drama, and lurid trade texture-impact intent; Masthead-safe title zone, blurb-driven layout
    logic, sensational focal center, newsstand-impact color blocking; Aggressive warm primaries with
    acid yellow-red pushes, deep shadow anchors, and high-contrast attention-grab hierarchy; Cheap
    coated-pulp paper feel with visible print wear, ink soak variation, and subtle halftone residue;
    Perspective pushed toward action-forward staging with near field exaggeration and compressed
    narrative depth
  creative_brief: >-
    Apply Pulp Magazine Cover as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    Mid-century pulp-cover illustration style with sensational composition, high-urgency editorial
    drama, and lurid trade texture-impact intent, Masthead-safe title zone, blurb-driven layout
    logic, sensational focal center, newsstand-impact color blocking, Cheap coated-pulp paper feel
    with visible print wear, ink soak variation, and subtle halftone residue without requiring the
    card image's original subject.
