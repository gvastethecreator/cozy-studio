    fiber, damp paper, mask lacquer, dust, mist, and minimal noise-controlled texture; cel edges,
    painted surfaces, grain, cloth, metal, water, sweat, smoke, or atmosphere must stay coherent
    across people, objects, environments, action, and abstractions.
  camera_and_composition: >-
    Frame around string-like lines and spotlight isolation, alongside stage trap framing and
