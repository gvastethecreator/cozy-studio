visualDna:
  aesthetic: 'Terrazzo: polished composite with scattered stone and glass chips in a cement matrix.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the surface shows scattered colored chips set in a smooth matrix. The decorative surface pattern is the point: make its figure, veining or motif the first read."
  color_and_tone: Cream matrix with terracotta, green and black chips, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft even light on polished surface, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Polished chips flush in matrix, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Playful, modern, crafted and bright, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: scattered chips; polished matrix; decorative surface pattern
  creative_brief: "Terrazzo: polished composite with scattered stone and glass chips in a cement matrix. Carry it through scattered chips, polished matrix, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
