visualDna:
  aesthetic: Combine broad painted planes with repeated ornamental curves and balanced, emblematic spacing.
  subject_treatment: >-
    Preserve the requested content; echo its existing contours with bounded ornament and repeated color
    shapes rather than adding figures or banners.
  color_and_tone: >-
    Set warm brass and painted earth tones against one clear turquoise accent; keep the palette flexible
    when the request specifies colors.
  lighting_and_shadow: Use warm highlights on selected edges and clean shadows that separate the ornamental layers.
  texture_and_material: >-
    Pair painted wood-like matte color with restrained metallic sheen, keeping each material response
    distinct.
  camera_and_composition: >-
    Respect the requested framing; organize the image around repeated arcs and a calm central balance
    rather than a civic procession.
  atmosphere_and_mood: Give forms a ceremonial, legendary weight through repetition, symmetry, and warm-cool contrast.
  rendering_and_quality: Keep ornament sparse, edges clean, and broad color planes dominant over small surface marks.
avoidRules:
  - a required public ceremony or procession
  - ornament repeated so densely that it becomes a texture field
  - extra figures or banners added only to signal myth
