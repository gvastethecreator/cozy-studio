visualDna:
  aesthetic: >-
    School Portrait acts as a transferable photographic style router: begin from Awkward yearbook
    studio, Laser depth field, and portrait and studio photography system built from lens
    discipline, subject hierarchy, controlled retouching, and believable surface detail, then apply
    the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Stiff central composition; preserve prompt identity while using
    focal priority, flattering or deliberately institutional distance, surface realism, and edge
    control without requiring a human face, keeping the original subject, pose, species, object, or
    environment legible.
  color_and_tone: >-
    Grade with Blue mottled depth field; grade neutrals, skinlike or material tones, backdrop color,
    cosmetic warmth, and controlled contrast as photographic capture decisions, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Flat studio; make key, fill, rim, catchlight, background falloff, and shadow shape visibly
    drive the style, preserving believable exposure, shadow density, highlight rolloff, and source
    motivation.
  texture_and_material: >-
    Render Cheesy studio texture; retain pores, fabric, hair, props, paper, backdrop sweep, and
    small surface imperfections at a believable photographic scale, avoiding both waxy smoothing and
    noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Forced frontal stiffness; use portrait lens compression, central authority,
    intimate framing distance, frontal ID geometry, or editorial negative space without forcing one
    sitter, with lens distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Awkward, funny; derive mood from proximity, pose pressure, institutional polish,
    intimacy, ceremony, awkwardness, or studio control, so the preset changes interpretation without
    demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Nostalgic, cheesy; finish as real photography with clean optics, plausible
    retouching, readable focal hierarchy, and no painterly or CGI substitution, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: >-
    Awkward yearbook studio; Laser depth field; Blue mottled depth field; Flat studio; Forced
    frontal stiffness
  creative_brief: >-
    Apply School Portrait as a photographic preset over prompt X: preserve the user's requested
    subject, then route Awkward yearbook studio, Blue mottled depth field, Flat studio, Cheesy
    studio texture, and Forced frontal stiffness through optics, exposure, palette, surface
    response, timing, and finish without requiring the card image's original subject.
