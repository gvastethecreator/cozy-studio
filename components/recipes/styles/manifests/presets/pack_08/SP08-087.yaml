visualDna:
  aesthetic: 'Balletcore: dancewear as fashion — wrap cardigans, leotards, tulle skirts, leg warmers and ribbon-tied flats in soft blush tones.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a wrap cardigan or leotard, a soft tulle or jersey skirt, leg warmers and satin ribbon-tied flats, with hair in a neat bun."
  color_and_tone: Blush pink, ballet white, dove grey and black, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Soft, diffuse rehearsal-studio light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Tulle, ribbed knit, satin ribbon and fine jersey, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Graceful full figure with elegant line, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Delicate, disciplined, romantic and quiet, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Soft, airy finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Balletcore: dancewear as fashion — wrap cardigans, leotards, tulle skirts, leg warmers and ribbon-tied flats in soft blush tones. Carry it through wrap cardigan and tulle, satin ribbon flats, leg warmers, blush palette, graceful line. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: wrap cardigan and tulle; satin ribbon flats; leg warmers; blush palette; graceful line
