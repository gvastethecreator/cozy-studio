visualDna:
  aesthetic: 'Cutaway Instruction Plates: one bounded part of the exterior removed to show only the documented inside, with context and wall thickness kept.'
  subject_treatment: Remove one bounded part of the prompt's object to show only its documented inner parts, keeping the outside recognizable and every callout exact.
  color_and_tone: Neutral exterior, a distinct cut plane and a few interior codes tied to the legend.
  lighting_and_shadow: Coherent descriptive shading, with cut lines and callouts kept independent of it.
  texture_and_material: Consistent section hatching, unknown hidden surfaces left plain.
  camera_and_composition: Main view with a clear cut boundary and details only for real meetings.
  atmosphere_and_mood: Contained technical curiosity, one opening revealing one relationship.
  rendering_and_quality: Crisp plate where the section matches the model and nothing floats.
  creative_brief: "Cutaway Instruction Plates: one bounded part of the exterior removed to show only the documented inside, with context and wall thickness kept. Carry it through bounded cutaway, documented interior, section hatching, kept exterior. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: bounded cutaway; documented interior; section hatching; kept exterior
