visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Surviving Mars gameplay screenshots:
    colony-builder capture with domes, red terrain, resource pipes, garden interiors, drone paths,
    and readable management scale. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Surviving Mars-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Surviving Mars-informed palette: Mars red, dome glass blue, white habitat shells,
    hydroponic green, yellow hazard marks, and shadowed basalt. Keep value grouping legible at
    gameplay distance, with color accents behaving like route, danger, pickup, team, magic, or
    objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through hard Martian sun, glass-dome reflections, night colony LEDs, dust storm
    haze, and greenhouse glow. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from modular domes, cables, solar panels, rover tracks, pressurized corridors,
    garden beds, and UI-like planning overlays. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with elevated management camera with colony clusters, build nodes, resource lines, drone
    movement, and infrastructure hierarchy. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Surviving Mars-derived mood: optimistic, technical, fragile, logistical, and
    frontier-scientific. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: builder HUD is allowed:
    resource bars, build palette, dome status, and management overlays should look functional.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Surviving Mars gameplay screenshots; colony-builder capture with domes, red terrain, resource
    pipes, garden interiors, drone paths, and readable management scale; Mars red, dome glass blue,
    white habitat shells, hydroponic green, yellow hazard marks, and shadowed basalt; hard Martian
    sun, glass-dome reflections, night colony LEDs, dust storm haze, and greenhouse glow; modular
    domes, cables, solar panels, rover tracks, pressurized corridors, garden beds, and UI-like
    planning overlays; elevated management camera with colony clusters, build nodes, resource lines,
    drone movement, and infrastructure hierarchy; optimistic, technical, fragile, logistical, and
    frontier-scientific; HUD guidance: builder HUD is allowed: resource bars, build palette, dome
    status, and management overlays should look functional
  creative_brief: >-
    Use Surviving Mars Orbital Garden as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Surviving Mars: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
