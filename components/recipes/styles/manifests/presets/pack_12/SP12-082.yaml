visualDna:
  aesthetic: >-
    A contemporary real-time dark ARPG frame with handcrafted environments, grounded PBR material
    response, and small playable figures set against larger navigable spaces. Maintain Diablo IV's
    balance between believable regional world-building and details simplified or emphasized for
    gameplay readability.
  subject_treatment: >-
    Keep the prompt's actors, action, and objects at believable in-world scale. When a playable
    character is present, make its silhouette readable against ground and architecture; do not add
    an enemy, effect, or combat event by default.
  color_and_tone: >-
    Regional dusty ochre, beige plaster, oxidized brown and muted carmine; colder settings use fog
    blue-grey and dull green. Separate small actors from the ground through local value.
  lighting_and_shadow: >-
    Directional real-time daylight and long shadows or compact firelit interiors; restrained weather
    and reflected light follow the chosen region and requested scene.
  texture_and_material: >-
    Use modern PBR response across stone or plaster, wood, cloth, metal, and terrain, with local
    wear and weather affecting surfaces. The official direction is believability rather than literal
    realism; retain handcrafted construction and avoid one uniform polished finish.
  camera_and_composition: >-
    Stable steep raised three-quarter ARPG camera, minimal horizon and broad navigable ground plane.
    A complete small playable figure remains readable among surrounding structures and local
    targets.
  atmosphere_and_mood: >-
    Keep the world grounded, dark-medieval, and navigable. Environmental weather and local warmth
    can tell a story, but no specific region, event, enemy, or combat encounter is required.
  rendering_and_quality: >-
    Modern real-time dark ARPG rendering with camera-scaled authored detail, grounded PBR materials
    and clear playable space. Include interface only when explicitly requested.
avoidRules:
  - cutscene close-up or low-angle key art in place of the elevated gameplay camera
  - unreadable playable scale or terrain hierarchy
  - universal red lighting, black crush or indiscriminate fog
  - unrequested canonical characters, locations, monsters or skills
  - unrequested HUD, map, interface, logos or captions; preserve explicitly requested UI and text
  - anime or cel-shaded grammar
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
