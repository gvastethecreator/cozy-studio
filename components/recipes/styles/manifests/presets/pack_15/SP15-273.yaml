visualDna:
  aesthetic: 'Potterypunk: a world where everything is fired clay, with ceramic machines, glazed armor, kiln cities, terracotta pipes and crackle-glaze surfaces.'
  subject_treatment: Keep the prompt's subject and setting; rebuild it in fired clay, with glazed ceramic surfaces, terracotta and kiln marks.
  color_and_tone: Terracotta orange, celadon green, cobalt blue glaze and cream crackle.
  lighting_and_shadow: Soft daylight on glossy glaze and warm kiln glow at night.
  texture_and_material: Terracotta, glossy glaze, crackle patterns, throwing rings and kiln ash.
  camera_and_composition: Workshop and city views crowded with ceramic forms.
  atmosphere_and_mood: Earthy, delicate and ingenious, a civilization that could shatter.
  rendering_and_quality: Tactile illustration with glossy glaze highlights and clay texture.
  creative_brief: "Potterypunk: a world where everything is fired clay, with ceramic machines, glazed armor, kiln cities, terracotta pipes and crackle-glaze surfaces. Carry it through ceramic machines, glazed armor, kiln cities, crackle glaze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ceramic machines; glazed armor; kiln cities; crackle glaze
