visualDna:
  aesthetic: 'Analog Texture Continuity: shared grain, edges and light tie photography and graphics into one coherent printed campaign surface.'
  subject_treatment: Coordinate grain, edges and light between the prompt's photography and graphics into one editorial surface, the copy crisp and exact.
  color_and_tone: One unified palette with enough contrast for the copy and locked brand colors.
  lighting_and_shadow: Compatible light across images, with graphics integrated and no fake shadows.
  texture_and_material: Fine shared grain and controlled cut edges, with text left clean and sharp.
  camera_and_composition: A clear hierarchy between photo, brand and text, texture never dominating.
  atmosphere_and_mood: Tactile cohesion and an analog character, warm and deliberate.
  rendering_and_quality: Printed-looking campaign whose identity survives with less texture.
  creative_brief: "Analog Texture Continuity: shared grain, edges and light tie photography and graphics into one coherent printed campaign surface. Carry it through shared grain, matched light, clean type, one printed surface. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared grain; matched light; clean type; one printed surface
