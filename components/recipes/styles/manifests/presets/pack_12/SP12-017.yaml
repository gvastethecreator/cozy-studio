  lighting_and_shadow: Flat comic light with ink shadows, lit the way Rollerdrome 2022 lights its levels.
  texture_and_material: Thick ink lines and cel fills, with the in-engine surface finish of Rollerdrome 2022.
  camera_and_composition: Third-person view mid-trick over bowls, framed the way Rollerdrome 2022 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with stylish deadly flow.
  rendering_and_quality: Authentic comic cel action screen, matching real Rollerdrome 2022 screenshots.
  key_features: Rollerdrome ink lines; skate arena; bullet time
  creative_brief: 'Roll7 Rollerdrome (2022) look: comic cel-shaded 3D with thick ink lines, seventies-futurist blood sport arenas, roller skaters firing pistols mid-trick and bullet time. Carry it through Rollerdrome ink lines, skate arena, bullet time. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
