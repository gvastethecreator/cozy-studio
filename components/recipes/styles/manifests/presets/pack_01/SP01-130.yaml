visualDna:
  aesthetic: 'Wide-angle wildlife: a remote-triggered or very close wide lens placing the animal large in the foreground with its whole habitat stretching behind.'
  subject_treatment: Keep the prompt subject and setting; this preset owns the camera placement and lens described below, nothing else.
  color_and_tone: Natural daylight color with a bright sky and a well-exposed animal.
  lighting_and_shadow: Soft daylight or low sun with fill so the animal and landscape are both detailed.
  texture_and_material: Fur or feathers crisp up close; landscape receding in deep focus.
  camera_and_composition: 16–24 mm very close to the animal, low angle, deep depth of field showing sky and horizon.
  atmosphere_and_mood: Intimate yet expansive, the animal inside its whole world.
  rendering_and_quality: Natural wide-angle perspective with mild edge stretch; not telephoto compression.
  creative_brief: "Wide-angle wildlife: a remote-triggered or very close wide lens placing the animal large in the foreground with its whole habitat stretching behind. Carry it through animal large and close, habitat stretching behind, low wide angle, deep focus, visible sky. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: animal large and close; habitat stretching behind; low wide angle; deep focus; visible sky
