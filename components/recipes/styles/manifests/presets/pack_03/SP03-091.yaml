visualDna:
  aesthetic: 'Thin-film iridescent coating: a microscopically thin layer over the target that shifts hue with viewing angle, like oil on water or a beetle shell.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Angle-dependent bands of teal, magenta, gold and violet over a dark or metallic base.
  lighting_and_shadow: Hue changes across curvature; highlights shift color at grazing angles.
  texture_and_material: Smooth glossy coat with rainbow gradients flowing along the form.
  camera_and_composition: Keep the requested framing; curved surfaces to show the color flop.
  atmosphere_and_mood: Magical and shimmering, color that refuses to stay still.
  rendering_and_quality: Physically based thin-film interference; not a rainbow texture.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Thin-Film Iridescent Coating as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: angle-dependent hue shift; oil-slick rainbow bands; dark base; glossy coat; grazing-angle color flop
