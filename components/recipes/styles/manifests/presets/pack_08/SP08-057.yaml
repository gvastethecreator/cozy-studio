visualDna:
  aesthetic: 'Tweed tailoring: suits and coats of rough woven wool tweed with flecked color and heritage structure.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: tailored garments in textured tweed with herringbone or check weaves and visible colored flecks.'
  color_and_tone: Heather brown, moss, mustard fleck and charcoal herringbone, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Soft overcast countryside light, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Rough wool tweed with herringbone, houndstooth and flecks, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Scholarly, rural, dignified and warm, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: flecked wool tweed; herringbone and check; heritage tailoring; overcast light
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tweed Suit as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
