visualDna:
  aesthetic: 'In-game screenshot look informed by Dishonored 2 gameplay: first-person stealth immersive-sim capture with aristocratic interiors, mask-like silhouettes, vertical routes, and assassination sandbox clarity. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Dishonored 2-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Dishonored 2-informed palette: oil-paint teal, tobacco brown, brass gold, blood red,
    marble cream, and cold moon blue. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through window shafts, candle pools, supernatural blue abilities, hard guard
    silhouettes, and dusty indoor contrast. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from painted plaster, brass machinery, velvet curtains, worn stone, whale-oil
    devices, masks, and aristocratic clutter. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person stealth framing with ledges, guard patrol sightlines, blink routes,
    props, and alternate entry paths. The frame should read as a plausible gameplay capture; include
    UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Dishonored 2-derived mood: decadent, predatory, conspiratorial, elegant, and violent; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: ability icons, mana/health
    bars, objective markers, and stealth cues can appear if they feel like immersive-sim HUD.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Dishonored 2 gameplay screenshots; first-person stealth immersive-sim capture with aristocratic
    interiors, mask-like silhouettes, vertical routes, and assassination sandbox clarity; oil-paint
    teal, tobacco brown, brass gold, blood red, marble cream, and cold moon blue; window shafts,
    candle pools, supernatural blue abilities, hard guard silhouettes, and dusty indoor contrast;
    painted plaster, brass machinery, velvet curtains, worn stone, whale-oil devices, masks, and
    aristocratic clutter; first-person stealth framing with ledges, guard patrol sightlines, blink
    routes, props, and alternate entry paths; decadent, predatory, conspiratorial, elegant, and
    violent; HUD guidance: ability icons, mana/health bars, objective markers, and stealth cues can
    appear if they feel like immersive-sim HUD
  creative_brief: "Dishonored Aristocrat Stealth: in-game screenshot language informed by Dishonored 2, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
