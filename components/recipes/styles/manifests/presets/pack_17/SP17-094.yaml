visualDna:
  aesthetic: 'Cinematic martial pageantry, a technique study rather than a copy of any roster: original fighters with tailored combat gear and supernatural techniques that belong to each character. Keep realistic, sculpted body rendering and a theatrical finish, while making role, weapon and power silhouette as distinctive as the palette.'
  subject_treatment: >-
    Preserve the requested subject, action and explicit clothing. When a fighter or fantasy
    character is present, make their identity readable through a specific combat silhouette:
    headwear or mask, high collar, fitted or layered tunic, wraps, segmented armor, metal guards,
    waist panels and a signature weapon as the subject warrants. Treat these as a coordinated,
    functional design rather than generic flowing silk and ornaments. Integrate a fitting
    supernatural effect into the body, weapon or action silhouette (for example fire, ice,
    lightning, shadow or transformation); do not replace the requested identity or outfit with a
    stock fighter.
  color_and_tone: >-
    Use vivid, character-coded color relationships: jade or verdigris, royal blue, lacquer red,
    bone, plum, ember and brushed gold can combine with deep neutral armor and warm skin. Give each
    focal character or power a clear dominant hue and counter-color; keep jade available but never
    make it the default identity for every costume.
  lighting_and_shadow: >-
    Use cinematic directional light and a readable warm/cool split to reveal sculpted anatomy,
    fabric construction and armor edges. Let a fitting supernatural power cast a localized color
    onto nearby forms; preserve dangerous contrast and keep the fighter's face, hands and equipment
    clear against the stage.
  texture_and_material: >-
    Separate skin, layered woven combat cloth, quilted panels, fitted leather, engraved metal guards
    and hard lacquer with precise material response. Costume ornament follows armor joints, seam
    construction and rank; it must support a distinctive fighting silhouette rather than dissolve
    into loose silk and jewelry.
  camera_and_composition: >-
    Honor requested framing. Prioritize the fighter's identifying silhouette, weapon and
    supernatural action before scenic ornament. In an action image, separate combat roles with
    distinct counter-directions and keep moving cloth or effects subordinate to the main gesture; do
    not require a two-fighter side-on game plane.
  atmosphere_and_mood: >-
    Balance disciplined martial intent with immediate supernatural danger and realm-scale spectacle.
    Ceremonial ornament should communicate character, faction or rank; the scene should feel
    perilous and mythic, not like decorative fashion pageantry.
  rendering_and_quality: >-
    Painted cinematic key art over sculpted, naturalistic anatomy: precise garment construction,
    crisp metal and cloth separation, expressive but grounded faces, and supernatural effects with
    clear designed shapes. Concentrate fine detail on identity-bearing costume and equipment; keep
    the action legible at thumbnail size.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
