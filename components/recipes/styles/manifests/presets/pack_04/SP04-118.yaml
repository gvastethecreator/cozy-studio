visualDna:
  aesthetic: 'Field guide plate: one species painted in gouache as male, female and juvenile, with a flight or gait silhouette, egg or cocoon and a track.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a field-guide plate showing sexes, life stages, a flight or gait silhouette and a track of one species, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Accurate naturalist color on a pale cream ground, plumage or coat variants side by side for comparison.
  lighting_and_shadow: Soft even light with tiny contact shadows, identical on every figure so markings compare fairly.
  texture_and_material: Opaque gouache feathers, fur and scales, clean edges, small black silhouettes and footprint marks.
  camera_and_composition: Figures in strict profile arranged in two rows at one scale, silhouettes and track below.
  atmosphere_and_mood: Observant and patient, a species learned at a glance.
  rendering_and_quality: Identification-grade clarity with no habitat scene and no species names.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Field Guide Species Plate as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: male, female and juvenile; profile figures at one scale; flight or gait silhouette; track and egg; cream ground
