visualDna:
  aesthetic: 'Cottage bloom layering: a small garden crammed with self-seeding flowers, herbs and vegetables in tiers of height, spilling over narrow brick or stone paths and low walls.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Pastel pinks, lavender blues, cream and white with deep purple and apricot accents, fresh greens, weathered brick red; soft, mixed and cheerful.
  lighting_and_shadow: Soft morning or overcast light, dappled shade from a fruit tree, flower heads backlit by low sun.
  texture_and_material: Foxgloves, hollyhocks, delphiniums, roses on old walls, lavender and catmint edging, mossy brick paths, drystone walls, a wooden gate.
  camera_and_composition: Keep the requested view; eye-level through layered flowers, tall spires in the back, low plants overhanging the path in front.
  atmosphere_and_mood: Abundant, informal and homely, a garden that grew itself.
  rendering_and_quality: Natural-light photograph with individual plant species legible, no plastic flowers or show-garden gloss.
  key_features: tiered self-seeding flowers; foxglove and hollyhock spires; plants spilling over mossy brick paths; roses on old walls; lavender edging
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cottage Bloom Layering as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
