visualDna:
  aesthetic: 'Minimalist fog landscape: a single simple element isolated in thick fog, with most of the frame left as empty pale space.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Soft grey, cream or pale blue, very low contrast, one dark shape as the anchor.
  lighting_and_shadow: Diffused fog light, no shadows, gradual fading of distant objects.
  texture_and_material: Fog gradients, faint distant forms, crisp detail only on the nearest element.
  camera_and_composition: Small subject placed off-center in large negative space, horizon dissolved or absent.
  atmosphere_and_mood: Quiet and solitary, the world reduced to one line.
  rendering_and_quality: Smooth fog gradients without banding, and no busy detail competing with the anchor.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Minimalist Fog Landscape as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: one element in fog; vast negative space; low-contrast pale palette; dissolving distance; off-center anchor
