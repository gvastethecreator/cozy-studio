visualDna:
  aesthetic: 'Thumbprint critters: oval fingerprints pressed from colored ink pads, turned into animals and bugs with a few fine pen lines.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Bright stamp-pad colors on white paper, each print uneven in density, black fine-liner details.
  lighting_and_shadow: No modeled light; lighter and darker areas come from how hard each finger was pressed.
  texture_and_material: Visible fingerprint ridges and whorls inside every blob, patchy ink, crisp thin pen legs and faces.
  camera_and_composition: Small characters spread across open white paper, simple action lines and tiny pen-drawn props.
  atmosphere_and_mood: Funny, tiny and homemade, a rainy-afternoon craft.
  rendering_and_quality: Real fingerprint texture with minimal pen additions; no painted fills and no outlines around prints.
  creative_brief: "Thumbprint critters: oval fingerprints pressed from colored ink pads, turned into animals and bugs with a few fine pen lines. Carry it through fingerprint ridges in ink blobs, stamp-pad colors, fine black pen details, white paper, tiny characters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fingerprint ridges in ink blobs; stamp-pad colors; fine black pen details; white paper; tiny characters
