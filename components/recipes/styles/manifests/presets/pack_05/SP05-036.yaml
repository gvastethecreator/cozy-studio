visualDna:
  aesthetic: >-
    Build the graphic anime treatment from broad angular contours supported by fine structural
    accents and broad and compact value shapes with scale contrast inside the existing subject.
    Let slow weight shifts crossed by brief angled strokes set its rhythm; use charcoal, soft
    gray, and worn red or gold accents for color and soft layered value gradients with restrained
    paper grain for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use broad angular contours supported by fine
    structural accents for edge work, broad and compact value shapes with scale contrast inside
    the existing subject for form simplification, and slow weight shifts crossed by brief angled
    strokes only where movement is already requested.
  color_and_tone: >-
    Build value groups with charcoal, soft gray, and worn red or gold accents. Place the strongest
    contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: diffused value transitions with narrow pale edge highlights. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with soft layered value gradients with restrained paper grain,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use expansive asymmetrical blocks with scale shifts
    among existing forms to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey mournful gravity and measured tension, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with broad readable planes, restrained grain, and no ornamental clutter; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    broad angular contours supported by fine structural accents; broad and compact value shapes
    with scale contrast inside the existing subject; charcoal, soft gray, and worn red or gold
    accents; slow weight shifts crossed by brief angled strokes; soft layered value gradients with
    restrained paper grain; expansive asymmetrical blocks with scale shifts among existing forms.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with broad angular
    contours supported by fine structural accents, broad and compact value shapes with scale
    contrast inside the existing subject, and charcoal, soft gray, and worn red or gold accents;
    use slow weight shifts crossed by brief angled strokes only where movement is already present,
    and apply soft layered value gradients with restrained paper grain as the drawing finish.
