  color_and_tone: Printed flat paper colors, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Soft side light showing facets, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Paper facets, creases and tabs, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at card size.
  atmosphere_and_mood: Crafted, geometric, charming and light, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: folded paper facets; glue tabs
