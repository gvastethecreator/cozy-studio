visualDna:
  aesthetic: >-
    Crochet-inspired marks use consistent loops and stitch direction to describe existing shapes,
    with clean silhouettes and restrained surface fuzz.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use stitch rhythm as a rendering
    treatment without replacing the subject with a generic plush form.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use thread-like value differences within
    those colors rather than imposing a yarn palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Let small shadows between marks describe form
    without adding a new light source or environment.
  texture_and_material: >-
    Keep loop scale consistent and align stitch direction to each existing form. Avoid invasive fuzz
    and preserve materials not designated for a stitched appearance.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Stitch texture does not add a display
    base, frame, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Loop marks describe surface rhythm and do not create a new
    character, prop or scene.
  rendering_and_quality: >-
    Establish silhouette and large value groups before adding loops. Keep stitch size readable and
    preserve the details that identify the original subject.
avoidRules:
  - replacing the subject with a generic plush shape
  - oversized loops or fuzz that erase defining details
  - unrequested frame, lettering or layout
