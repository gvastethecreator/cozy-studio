  color_and_tone: Bone white, opal cyan, pearl violet, black velvet, muted crimson, and tarnished silver.
  lighting_and_shadow: Soft nacre rim light over deep velvet shadow, with small crimson or silver focus accents.
  texture_and_material: Polished bone, nacre, velvet, old ribbon, ceramic glaze, candle wax, and smooth ink.
  camera_and_composition: Mask-like symmetry broken by one off-center threat cue, elegant negative space, and courtly distance applied to any subject type.
  atmosphere_and_mood: Carry the prompt through Seductive, predatory, aristocratic, calm, and uncanny; adult editorial tension, devotional sensuality, medicinal unease, feudal decadence, and symbolic medieval weirdness; the tone should follow prompt X while preserving the preset's medieval-zine identity.
