visualDna:
  aesthetic: Bright friendly anime cel with rounded silhouettes, simplified volumes and clean sky-blue accents set against warm cream.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Round off corners and group small details into friendly shapes; do not add a mascot creature, a crowd or banners.
  color_and_tone: Clear sky blue, warm cream, soft grass green and sandy earth, saturated but gentle and evenly balanced.
  lighting_and_shadow: Even diffuse daylight with soft round highlights describing volume and pale blue shadows.
  texture_and_material: Smooth cel shading and satin highlights with almost no surface noise or grain.
  camera_and_composition: Keep the requested view; uncluttered spacing with repeated rounded shapes leading to the focal point.
  atmosphere_and_mood: Optimistic, generous and easygoing, a world where everyone gets along.
  rendering_and_quality: Stable silhouettes, soft shadow edges and clean color blocking with every corner rounded.
  key_features: rounded silhouettes; sky-blue accents on cream; soft round highlights; pale blue shadows; uncluttered color blocks
  creative_brief: "Bright friendly anime cel with rounded silhouettes, simplified volumes and clean sky-blue accents set against warm cream. Carry it through rounded silhouettes, sky-blue accents on cream, soft round highlights, pale blue shadows, uncluttered color blocks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
