visualDna:
  aesthetic: 'Loose, character-first expressionist gothic drawing: wiry and hunched anatomy, hooked or angular profiles, expressive faces and props whose shape helps tell the pose, all cut by bold near-black masses. The signature is the collision of weighty silhouettes with restless hand-drawn line, not simply a dark palette or thick comic outline.'
  subject_treatment: >-
    Preserve the requested person, creature, count and action, then exaggerate fatigue or intent
    through a bent spine, long forearm, tight grip, raised collar, hooked tool or sharply turned
    face where appropriate. Keep gesture and expression legible; do not automatically add a
    four-person party, medieval armor or a monster.
  color_and_tone: >-
    Near-black and umber structural masses with parchment-ochre light, restrained rust-red and cold
    slate accents. Faces and hands emerge in a few sharp light shapes against deep graphic shadow.
  lighting_and_shadow: >-
    Use a concentrated torch, fire or other motivated warm light against large, uneven black shadow
    forms. Let light break across a cheek, knuckle or worn material in a few sharp patches; use the
    shadow to heighten mood and gesture, not to obscure the subject in uniform darkness.
  texture_and_material: >-
    Let variable ink contours, dry broken strokes and sparse angular hatching describe cloth folds,
    skin, wood, metal and stone. Put roughness in the mark direction and silhouette; keep broad dark
    areas solid enough to read. Avoid a generic paper-grain overlay or evenly distributed scratches.
  camera_and_composition: >-
    Keep the prompt's requested viewpoint. Compress surrounding forms to make the main person and
    their task feel confined; let a face, hand, weapon or carried object form a readable gesture
    chain. Do not force a party lineup, game battle lane or wide establishing view on an
    illustration.
  atmosphere_and_mood: >-
    Favor the design's melancholic, morose and psychologically pressured tone, with weary courage
    and unease rather than indiscriminate gore. Preserve the prompt's emotional direction; a quiet
    subject can remain quiet while retaining the drawn tension.
  rendering_and_quality: >-
    Render as hand-drawn 2D digital illustration with imperfect line, articulated bodies and large
    graphic blacks. Keep edges deliberately rough and local detail selective, so the image feels
    made by a drawing hand rather than a clean vector, watercolor wash or realistic 3D render.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
