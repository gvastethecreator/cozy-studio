visualDna:
  aesthetic: 'Artificial turf: synthetic grass blades in dense uniform rows over the target.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in synthetic turf blades with a rubber-crumb base.'
  color_and_tone: Bright artificial green with black rubber crumb, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Bright daylight, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Uniform plastic blades and rubber crumb infill, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Artificial, playful, suburban and odd, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: plastic turf blades; rubber crumb; uniform green
  creative_brief: "Artificial turf: synthetic grass blades in dense uniform rows over the target. Carry it through plastic turf blades, rubber crumb, uniform green. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
