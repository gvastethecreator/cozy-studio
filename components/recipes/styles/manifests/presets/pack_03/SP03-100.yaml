visualDna:
  aesthetic: 'Physical sky scattering: a simulated atmosphere where sun angle sets the sky color through Rayleigh and Mie scattering, from deep blue noon to red dusk.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: 'Sky gradients driven by sun height: blue overhead, orange-pink at the horizon, aerial perspective haze.'
  lighting_and_shadow: Directional sun plus sky dome light; long colored shadows at low sun.
  texture_and_material: Distant objects fading into blue haze; sun disk with a soft glow.
  camera_and_composition: Keep the requested framing; some sky or distance to show the scattering.
  atmosphere_and_mood: Vast and airy, the whole atmosphere doing the lighting.
  rendering_and_quality: Physically based sky gradients rendered smoothly, without HDR banding or halos.
  creative_brief: "Physical sky scattering: a simulated atmosphere where sun angle sets the sky color through Rayleigh and Mie scattering, from deep blue noon to red dusk. Carry it through sun-angle sky gradients, aerial perspective haze, directional sun with sky dome, colored long shadows, soft sun disk. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sun-angle sky gradients; aerial perspective haze; directional sun with sky dome; colored long shadows; soft sun disk
