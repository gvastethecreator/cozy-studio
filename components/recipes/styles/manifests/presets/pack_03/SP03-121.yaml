visualDna:
  aesthetic: 'Écorché muscle study: the subject shown as a flayed anatomical sculpture, each muscle a distinct striated form wrapping the bone like a classical art-school figure.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; show it without skin, with every muscle group, tendon and superficial vein sculpted as an anatomical study, never wounded or bloody (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: Muted terracotta and brick-red muscle, pearly ivory tendons and fascia, bone white at the joints.
  lighting_and_shadow: Single high sculpture key from the upper side carving each muscle belly with soft rounded shadow.
  texture_and_material: Fine directional striations along the fibers, glossy tendon sheaths and crisp origin and insertion points.
  camera_and_composition: Keep the requested view; the pose shows muscles in contraction and stretch.
  atmosphere_and_mood: Studious and powerful, the machinery of movement laid bare without horror.
  rendering_and_quality: Clean museum-model finish with no blood, gore, wounds or exposed organs.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Écorché Muscle Study as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: flayed muscle groups; fiber striations; ivory tendons; single high sculpture key; clean museum finish
