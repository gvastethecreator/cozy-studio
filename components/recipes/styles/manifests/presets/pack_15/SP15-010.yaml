visualDna:
  aesthetic: >-
    Meshlight Signal Exchange operates as a portable punk-spectrum router: combine Meshlight Signal
    Exchange identity cues through mesh antennas; modded coats; canopy silhouettes; wearable nodes;
    steam color layers; Mesh-network cyberpunk poster language built from antenna canopies with
    network punk grammar with mesh communication, neon signal pressure, hacker-adjacent DIY systems,
    rain glass, drones, and cooperative circuitry, so the preset supplies retrofit style behavior
    rather than a required venue, mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through signal
    bands, cable paths, antenna arcs, mesh-node grouping, rain-slick contour, improvised
    electronics, and data-lit body or object edges; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through cyan rain, magenta signal, black ice, acid green, electric blue, violet
    shadow, wet concrete gray, and small safety-color accents; keep dominant, support, and accent
    values readable, avoid muddy black, and let palette code materials, signals, climate, ritual,
    salvage, or repair pressure.
  lighting_and_shadow: >-
    Use neon spill, monitor glow, rain reflection, signal pulse, drone LEDs, firewall bloom, and
    cold rim separation; lighting should reveal the punk system, preserve the user's subject,
    separate near and distant value planes, and avoid crushed blacks or noisy dark texture.
  texture_and_material: >-
    Render glass, wet plastic, taped circuit boards, cable bundles, matte rubber, spray paint,
    antenna metal, and soft digital bloom; keep material scale coherent, surface marks motivated,
    and tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through mesh-like spacing, compressed signal lanes, overhead cable arcs, node clusters,
    and readable subject dominance without forced urban passage or server-interior-system staging as
    reusable framing grammar for characters, creatures, objects, vehicles, environments, symbols, or
    full scenes without one required card layout.
  atmosphere_and_mood: >-
    Carry mood through paranoid speed, illicit coordination, humid intimacy, cooperative defense,
    cold precision, and electric public-style-level pressure; the tone may become adult, romantic,
    violent, comic, sensual, eerie, civic, or strange when prompt X asks, while the punk family
    remains legible.
  rendering_and_quality: >-
    Finish with clean neon-punk illustration with controlled glow, readable circuitry, denoised rain
    texture, and no fake readable UI; prioritize clean denoise, bold readable shapes, controlled
    grit, prompt preservation, no watermark, no readable text, and no generic concept-art polish.
  key_features: >-
    mesh antennas; modded coats; canopy silhouettes; wearable nodes; steam color layers;
    Mesh-network cyberpunk poster language built from antenna canopies
  creative_brief: >-
    Use Meshlight Signal Exchange after prompt X as a transferable punk-spectrum layer: prompt X
    supplies subject, action, setting, tone, and intensity, while the preset supplies mesh antennas,
    modded coats, canopy silhouettes, wearable nodes, steam color layers, Mesh-network cyberpunk
    poster language built from antenna canopies, color logic, light response, material behavior,
    composition rhythm, mood pressure, and finish discipline without requiring a fixed venue, fixed
    cast, fixed machine, repeated prop bundle, or sample-card composition.
