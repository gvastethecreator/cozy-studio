visualDna:
  aesthetic: >-
    Oath Knife Binding acts as a transferable mythic-noir router: sworn obligation made clearly
    expressed as dark symbolic order, blade-oath severity and ritual incision logic plus binding
    rite pressure and tightened oath mechanics fused with ritual noir with legalistic omen logic,
    candle compression, confessional shadow, taboo elegance, and ceremonial menace; it carries
    symbol, omen, ritual authority, and mature editorial restraint without locking prompt content to
    its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    oath-bound contour and promise-weighted silhouette pressure, blade-line contour, decisive cuts,
    and danger held in silhouette plus bound-edge logic and tightened silhouette pressure; forms
    should inherit silhouette pressure, emblem logic, ritual posture, edge weight, and motif
    placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through sealing-wax red, black vow shadow, and pale witness marks, dark steel, wax
    red, and old ivory tension plus wax red, cord black, and old ivory restraint together with
    velvet black, sealing-wax red, old ivory, tarnished brass, moonsteel blue, rain gloss, and
    restrained poisonous glow; values stay separated, accents feel intentional, and the dark palette
    supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use narrow witness glints and solemn rim separation, thin blade glints and sharp value cuts plus
    thin glints caught on cord, wax, and compressed edges with low-key noir pools, narrow rim cuts,
    wet reflections, candle bloom, and occult glow that never flattens the subject; shadows must
    carry omen weight, rims should clarify form, and glow should behave as ritual evidence rather
    than decorative haze.
  texture_and_material: >-
    Render wax, cord, old paper, rubbed metal, and pressure marks, dark steel, wax, cord, and
    powdery fingerprints plus cord, wax, blade sheen, and compressed paper fibers alongside wax
    seals, ledger paper, velvet pile, rain-wet stone, tarnish, soot, blade sheen, veils, and powdery
    ash; surface scale, patina, residue, gloss, grain, and carved or sealed edges must remain
    coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with oath-line diagonals and binding intervals, knife-line diagonals and close ritual
    pressure plus tightened intervals and constraint-based visual order plus interrogation axes,
    compressed processional bands, sealed-grid order, reflected doubles, and off-axis ritual
    tension; the style should support portraits, objects, architecture, creatures, symbols, and full
    scenes through reusable spatial grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through sworn obligation and irreversible consequence, controlled threat and
    irreversible decision plus vow enforcement and controlled danger and adult secrecy, suspicion,
    judgment, mourning, seduction, dread, and the feeling of a private rite becoming public; the
    image can become severe, sensual, sacred, violent, quiet, or strange when prompt X asks for it,
    while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with clean vow-sign readability with severe dark editorial polish plus sharp metal
    readability with disciplined denoise and no glossy toy drift and clean noir illustration with
    heavy denoise, readable silhouettes, disciplined glow, and no accidental UI or readable text;
    prioritize clean denoise, readable dark values, strong silhouette hierarchy, tactile material
    truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    sworn obligation made clearly expressed as dark symbolic order, blade-oath severity and ritual
    incision logic plus binding rite pressure and tightened oath mechanics; oath-bound contour and
    promise-weighted silhouette pressure, blade-line contour, decisive cuts, and danger held in
    silhouette plus bound-edge logic and tightened silhouette pressure; wax, cord, old paper, rubbed
    metal, and pressure marks, dark steel, wax, cord, and powdery fingerprints plus cord, wax, blade
    sheen, and compressed paper fibers; narrow witness glints and solemn rim separation, thin blade
    glints and sharp value cuts plus thin glints caught on cord, wax, and compressed edges;
    oath-line diagonals and binding intervals, knife-line diagonals and close ritual pressure plus
    tightened intervals and constraint-based visual order
  creative_brief: >-
    Apply Oath Knife Binding after prompt X as a transferable mythic-noir layer: prompt X supplies
    subject, action, setting, and intensity, while this preset supplies sworn obligation made
    clearly expressed as dark symbolic order, blade-oath severity and ritual incision logic plus
    binding rite pressure and tightened oath mechanics, oath-bound contour and promise-weighted
    silhouette pressure, blade-line contour, decisive cuts, and danger held in silhouette plus
    bound-edge logic and tightened silhouette pressure, sealing-wax red, black vow shadow, and pale
    witness marks, dark steel, wax red, and old ivory tension plus wax red, cord black, and old
    ivory restraint, narrow witness glints and solemn rim separation, thin blade glints and sharp
    value cuts plus thin glints caught on cord, wax, and compressed edges, wax, cord, old paper,
    rubbed metal, and pressure marks, dark steel, wax, cord, and powdery fingerprints plus cord,
    wax, blade sheen, and compressed paper fibers plus oath-line diagonals and binding intervals,
    knife-line diagonals and close ritual pressure plus tightened intervals and constraint-based
    visual order, finish discipline, and negative controls without requiring a fixed deity, ritual,
    prop bundle, location, or sample composition.
