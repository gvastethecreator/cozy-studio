visualDna:
  aesthetic: 'Sky island environment render: inverted-cone rock islands hanging above a cloud sea, root-bound undersides, waterfalls pouring off their edges into mist.'
  subject_treatment: "Environment direction (retained on purpose): this preset supplies an archipelago of floating rock islands above a sea of clouds, linked by bridges and falling water; the prompt's subject, action and camera stay and are placed inside that world instead of being replaced by a stock scene."
  color_and_tone: Warm sunlit tops in grass green and sandstone, cool violet-blue undersides, white-gold cloud sea.
  lighting_and_shadow: High sun lighting island tops while undersides fall into blue shade; islands cast soft shadows onto the cloud layer.
  texture_and_material: Exposed strata and dangling roots under each island, rope and chain bridges, mist trails from the waterfalls.
  camera_and_composition: Keep the requested camera; islands stack at different heights and sizes to sell great depth and scale.
  atmosphere_and_mood: Dizzy, bright and wondrous, a world with no ground.
  rendering_and_quality: Volumetric cloud sea with aerial perspective between islands; clear scale cues from bridges and trees.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Floating Sky Island Archipelago as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
