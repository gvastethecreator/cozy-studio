tags:
  - anime-character-and-lifestyle
  - anime-style-spectrum
visualDna:
  aesthetic: >-
    Create a small warm/cool edge echo across an existing reflective boundary or adjacent contour; a
    slight continuity slip should disturb a stable image without becoming a dream collage.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep the base palette coherent
    and shift only the echoed edge between warm and cool; preserve prompt color.
  lighting_and_shadow: >-
    Use controlled reflected highlights and a narrow offset glint; do not invent a light source or
    reflective surface.
  texture_and_material: >-
    Retain original materials; use a fine doubled edge or shifted reflection rather than blur,
    distortion or added objects.
  camera_and_composition: >-
    Keep the composition stable while allowing a localized alignment drift at an existing boundary;
    preserve the original crop.
  atmosphere_and_mood: >-
    Uncanny continuity comes from a nearly correct reflection; do not add surreal events or chaos.
  rendering_and_quality: >-
    If no reflective plane is present, use a subtle contour echo on an existing boundary; add no
    mirror, duplicate subject or collage. Keep important silhouettes and joins legible; no
    watermark, unrequested text or interface.
  key_features: >-
    Offset reflection edge; warm/cool echo; localized alignment slip; stable surrounding forms;
    restrained uncanny detail.
  creative_brief: 'Apply this visual treatment to the requested content: Offset reflection edge; warm/cool echo; localized alignment slip; stable surrounding forms; restrained uncanny detail. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - multiple reflection echoes obscuring source form
  - alignment slip altering subject identity
  - unrequested duplicate forms
assets:
