visualDna:
  aesthetic: 'Azulejo: glazed blue-and-white painted tiles with ornate repeats.'
  subject_treatment: "Apply this motif as glazed tiles on the surface of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: blue-and-white glazed tile repeats with ornate borders."
  color_and_tone: Cobalt blue on white glaze, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Glazed ceramic tiles with grout, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Mediterranean, fresh, ornate and bright, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: blue-white glazed tiles; ornate repeats
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Azulejo Tile as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
