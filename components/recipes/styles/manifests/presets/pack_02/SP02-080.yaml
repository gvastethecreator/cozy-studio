visualDna:
  aesthetic: 'Anamorphic overflare: bright lights pointed into an anamorphic lens so long horizontal blue streaks and veiling flares cross the frame.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Glossy blue and cyan streaks, bright whites, deep cool blacks.
  lighting_and_shadow: Practical lights, flashlights and searchlights aimed near the lens, creating streaks and glowing veils.
  texture_and_material: Horizontal flare lines, oval highlights, lens veiling over the image.
  camera_and_composition: Keep the requested framing; light sources placed in or at the edge of frame.
  atmosphere_and_mood: Kinetic and glossy, spectacle blazing across the lens.
  rendering_and_quality: True anamorphic flare behavior on invented designs, never any franchise ships or costumes.
  key_features: long horizontal blue flares; oval highlights; lens veiling; lights aimed at the lens; glossy blacks
  creative_brief: "Anamorphic overflare: bright lights pointed into an anamorphic lens so long horizontal blue streaks and veiling flares cross the frame. Carry it through long horizontal blue flares, oval highlights, lens veiling, lights aimed at the lens, glossy blacks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
