visualDna:
  aesthetic: 'Casein paint illustration: milk-protein paint laid in opaque velvety layers, the matte workhorse medium of mid-century magazine and book illustration.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Rich but softly chalky color with high chroma in the lights, warm-cool contrast between planes, velvety deep darks that are never glossy.
  lighting_and_shadow: 'Clear storytelling light: a warm key and cool shadows, shapes modeled in a few firm planes and soft transitions.'
  texture_and_material: Velvety matte film on illustration board, soft dry-brush scumbles over dark underlayers, slight brush ridges in the lights.
  camera_and_composition: Keep the requested framing; clear, narrative staging with a readable focal figure and simplified background.
  atmosphere_and_mood: Warm, sturdy and adventurous, an old illustrated story come alive.
  rendering_and_quality: Firm planes, soft scumbled edges and bright opaque highlights; velvet-matte everywhere, never glossy or airbrushed.
  key_features: velvety matte opaque film; warm key and cool shadows; dry-brush scumbles over dark; firm modeled planes; mid-century illustration staging
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Casein Paint as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
