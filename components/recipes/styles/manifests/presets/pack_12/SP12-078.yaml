visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Mark of the Ninja gameplay screenshots: 2D
    stealth side-view capture with black silhouettes, guard vision cones, inked interiors, and
    readable shadow mechanics. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Mark of the Ninja-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Mark of the Ninja-informed palette: deep black, muted teal, blood red, paper beige, cool
    blue shadow, and small gold lamp accents. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through hard stealth shadow, lantern cones, silhouette cutouts, alarm red, and
    graphic fog. Lighting must clarify the playable route, threat, focal subject, or objective and
    avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from inked walls, tatami, paper screens, rooftops, cloth folds, traps, and crisp
    vector-like character silhouettes. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with side-view stealth composition with visibility zones, noise rings, patrol routes,
    vents, and multi-level infiltration paths. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Mark of the Ninja-derived mood: silent, lethal, elegant, graphic, and tactical. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: vision cones, noise
    indicators, ability icons, objective markers, and alert states are coherent stealth UI. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Mark of the Ninja gameplay screenshots; 2D stealth side-view capture with black silhouettes,
    guard vision cones, inked interiors, and readable shadow mechanics; deep black, muted teal,
    blood red, paper beige, cool blue shadow, and small gold lamp accents; hard stealth shadow,
    lantern cones, silhouette cutouts, alarm red, and graphic fog; inked walls, tatami, paper
    screens, rooftops, cloth folds, traps, and crisp vector-like character silhouettes; side-view
    stealth composition with visibility zones, noise rings, patrol routes, vents, and multi-level
    infiltration paths; silent, lethal, elegant, graphic, and tactical; HUD guidance: vision cones,
    noise indicators, ability icons, objective markers, and alert states are coherent stealth UI
  creative_brief: >-
    Use Mark of the Ninja Lotus Heist as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Mark of the Ninja: camera, HUD
    grammar, material language, color coding, encounter readability, and in-engine finish. Coherent
    HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact
    levels, and promotional key art.
