visualDna:
  aesthetic: >-
    Gentle anime cel drawing uses rounded fine contours, understated shadows, and open focal
    detail.
  subject_treatment: >-
    Preserve subject, action, count; soften requested edges without adding animals, symbols,
    or embraces.
  color_and_tone: >-
    Warm ochre, sky blue, moss green, cream, brick red; balance warm and cool mids.
  lighting_and_shadow: >-
    Broad gentle light and low-contrast shadows; neutral unless prompt supplies a source.
  texture_and_material: >-
    Light pigment wash and fine pencil-like contour; no seasonal debris or sparkle.
  camera_and_composition: >-
    Maintain composition; overlaps and closeness follow only requested relationships.
  atmosphere_and_mood: >-
    Compassion or grief only when present; softness is rendering, not plot.
  rendering_and_quality: >-
    Stable anatomy, delicate contours, distinct mids, no haze or oversoften.
  key_features: >-
    Rounded fine contour, warm-cool values, subtle wash, closeness only when requested
  creative_brief: 'Apply a visual treatment centered on rounded fine contour, warm-cool values, subtle wash, closeness only when requested. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
