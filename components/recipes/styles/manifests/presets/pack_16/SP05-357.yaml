visualDna:
  aesthetic: 'Table tennis anime of spin and pressure: balls curving impossibly, tables warped by tension and faces locked in concentration.'
  subject_treatment: Keep the prompt's subject and action; show spin and pressure through curved trajectories and subtly warped space.
  color_and_tone: Table blue and green, white ball highlights and cool gym greys.
  lighting_and_shadow: Even gym lighting with sharp highlights on the ball and glossy table.
  texture_and_material: Rubber paddles, glossy table surfaces and sweat drawn with crisp line.
  camera_and_composition: Tight table-level framings, curved ball trails and warped perspective under pressure.
  atmosphere_and_mood: Claustrophobic and precise, a tiny table becoming an entire battlefield.
  rendering_and_quality: Clean sports anime with elegant spin trails and subtle perspective distortion.
  key_features: curving ball trail; warped table; paddle spin; concentration
  creative_brief: "Table tennis anime of spin and pressure: balls curving impossibly, tables warped by tension and faces locked in concentration. Carry it through curving ball trail, warped table, paddle spin, concentration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
