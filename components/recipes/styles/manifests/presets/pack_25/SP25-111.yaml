visualDna:
  aesthetic: 'Open-Core Appliances: one structural opening in the housing reveals how the functional core sits inside the outer shell.'
  subject_treatment: Open the prompt's product housing at one structural zone that reveals the relationship between its working core and its shell, with visible supports.
  color_and_tone: Controlled contrast between core and housing, with every connection kept visible.
  lighting_and_shadow: One common light that shows depth inside without turning it into a stage.
  texture_and_material: Sober finishes on housing and core, with clear edges and supports.
  camera_and_composition: The opening aimed at understanding the function, not at showing every part.
  atmosphere_and_mood: Constructive transparency and contained curiosity, honest about how it works.
  rendering_and_quality: Clean concept render where the opening never cuts a support or floats the core.
  creative_brief: "Open-Core Appliances: one structural opening in the housing reveals how the functional core sits inside the outer shell. Carry it through structural opening, visible core, clear supports, honest construction. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: structural opening; visible core; clear supports; honest construction
