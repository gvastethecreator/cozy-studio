visualDna:
  aesthetic: >-
    Deliberately naive painting shows small hand-made irregularities in contour and pictorial perspective,
    using expressive color relationships in place of heavy realism.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and part relationships. Keep irregularities
    intentional and local; do not omit, duplicate or misconnect defining forms.
  color_and_tone: >-
    Use expressive relationships among the requested colors with clear value separation. Do not impose
    a fixed palette or let reduced shading erase important distinctions.
  lighting_and_shadow: >-
    Respect the requested lighting and shadow direction. Keep value modeling simple without replacing
    explicit light cues or imposing heavy photographic shading.
  texture_and_material: >-
    Show dry, opaque tool marks and slight variation in filled areas. Keep marks attached to form rather
    than adding random roughness across the image.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Allow only small pictorial
    perspective irregularities that do not distort the requested structure.
  atmosphere_and_mood: >-
    Keep the requested tone. Naive mark-making does not imply childishness, comedy or a specific narrative.
  rendering_and_quality: >-
    Retain recognizable silhouettes and complete structure while allowing visible hand-drawn variation.
    Avoid structural mistakes disguised as looseness.
avoidRules:
  - duplicated or missing defining parts
  - heavy photographic shading
