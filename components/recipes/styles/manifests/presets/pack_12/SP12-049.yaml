  color_and_tone: Moonlit indigo, blood crimson and gilded gold, true to the Symphony of the Night 1997 palette.
  lighting_and_shadow: Moonlight through gothic windows and candles, lit the way Symphony of the Night 1997 lights its levels.
  texture_and_material: Lavish 32-bit sprite art and painted backgrounds, with the in-engine surface finish of Symphony of the Night 1997.
  camera_and_composition: Side-view metroidvania castle view, framed the way Symphony of the Night 1997 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with elegant gothic menace.
  rendering_and_quality: Authentic PlayStation 2D gothic screen, matching real Symphony of the Night 1997 screenshots.
  key_features: Symphony of the Night sprites; gothic castle; Kojima elegance
  creative_brief: 'Konami Castlevania: Symphony of the Night (1997) look: lavish 2D gothic sprite art with Ayami Kojima inspired elegance, moonlit castle halls, huge animated bosses and rich backgrounds. Carry it through Symphony of the Night sprites, gothic castle, Kojima elegance. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
