visualDna:
  aesthetic: 'Organic digital sculpture presentation: the subject sculpted as flowing soft volumes whose planes follow muscle, growth and gravity, polypainted and shown on a turntable plinth.'
  subject_treatment: Keep the prompt subject, action, pose, setting and camera view and rebuild its surfaces in this organic CGI method; never force a T-pose and never turn a requested object into an avatar.
  color_and_tone: Muted polypaint in naturalistic hues of moss green, flesh and bark brown, with darker cavity tint and lighter peaks.
  lighting_and_shadow: Soft three-point studio light with a warm key and cool rim, subsurface glow in thin parts like ears and fins.
  texture_and_material: Muscle flow, skin folds, pores, wrinkles and bark grain sculpted into the surface, with no hard edges or panel seams.
  camera_and_composition: Keep the requested view; the form placed on a simple round plinth against a dark gradient.
  atmosphere_and_mood: Alive and tactile, a creature that seems to breathe under the light.
  rendering_and_quality: Polypainted sculpt with real subsurface and form flow, distinct from a bare matcap sculpt and from a finished film-textured asset.
  key_features: flowing muscle and growth planes; polypaint color; cavity tint; subsurface in thin parts; round turntable plinth
  creative_brief: "Organic digital sculpture presentation: the subject sculpted as flowing soft volumes whose planes follow muscle, growth and gravity, polypainted and shown on a turntable plinth. Carry it through flowing muscle and growth planes, polypaint color, cavity tint, subsurface in thin parts, round turntable plinth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - forced T-pose
  - object turned into an avatar
  - franchise likeness
  - readable text
  - logo
  - matcap-only grey clay
  - panel seams
  - hard edge
  - robot
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - melted anatomy
  - fake plastic skin
  - bad topology
  - rigging-breaking pose
  - text
  - readable labels
  - UI overlay
  - real person likeness
  - prompt literal card reuse
