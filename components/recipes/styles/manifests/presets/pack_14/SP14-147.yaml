visualDna:
  aesthetic: Akan Anansi illustration uses clever turns of line, Asante woven-strip structure, and a
    selected Ananse Ntontan sign. Treat the sign as one authored mark on a suitable textile or fitting, not a web
    texture repeated over the image or each matching object.
  subject_treatment:
    Preserve the requested subject, action, ethnicity, anatomy, and any explicit costume lock.
    Where textiles or ornament are unspecified, adapt Asante-style woven-strip construction
    and supplementary-weft geometry to a suitable existing panel or seam. Place one Ananse Ntontan motif on one
    such surface; if several matching surfaces exist, choose one and leave the others quiet. Do not turn the
    subject into a spider.
  color_and_tone:
    Use a clear textile palette of black, cream, maroon, yellow, green, and warm ochre, selected
    in purposeful blocks rather than all at once. Use these hues as bounded stripe or mark
    accents; preserve requested base colors of cloth and wood while keeping the pattern's contrast and focal point.
  lighting_and_shadow:
    Keep the scene's existing light, with sharp highlights tracing woven relief or lacquered
    color and shadows separating the pattern from the subject. Do not impose moonlight or a night setting.
  texture_and_material:
    Make woven strips, supplementary weft, stamped or painted adinkra-like marks, and thread
    edges distinct where cloth or designed surfaces allow. Keep the web mark and dense weave
    to a selected area, letting broad fabric and material fields remain plain; do not repeat it on every chair,
    fitting, or panel.
  camera_and_composition:
    Honor the requested scene. A clever line reversal or crossing path may guide attention
    toward the focal action. Place the selected web sign only where an existing textile or fitting supports it;
    do not require a literal spider web, repeated medallions, or a central textile panel.
  atmosphere_and_mood:
    Express intelligence, mischief, resourcefulness, and consequence, allowing the prompt
    to be serious or playful. Avoid turning every image into a joke or a dark trick.
  rendering_and_quality:
    Use authored graphic illustration with confident contours, broad color shapes, readable
    figure-ground, and fine thread detail limited to the chosen textile area. Keep material edges visibly drawn
    rather than product-rendered. Make the result a complete scene, not a fabric swatch.
avoidRules:
  - Preserve explicit identity, ethnicity, costume, and action locks; do not assign Akan identity to a requested
    person.
  - Do not force Anansi, a spider as the subject, a village, or a folktale setting; the web motif can be adapted
    to existing woven or ornamental surfaces.
  - Avoid using every adinkra mark at once, generic pan-African decoration, or treating all Ghanaian textiles
    as the same tradition.
