visualDna:
  aesthetic: 'Volumetric fog lighting: participating media fills the scene, so every light becomes a visible cone and depth fades into haze.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera; add a controlled volume of fog in which the existing lights become visible, without inventing new scenery.
  color_and_tone: Desaturated hazy distance, glowing light cones, darker foreground silhouettes.
  lighting_and_shadow: Spot and point lights carving visible cones; objects casting shadow beams through the fog.
  texture_and_material: Density variation, drifting wisps and noise in the volume.
  camera_and_composition: Keep the requested framing; layers of depth fading into the fog.
  atmosphere_and_mood: Mysterious and deep, space measured by fading haze.
  rendering_and_quality: Clean volumetric scattering with smooth density, free of banding or blotches.
  key_features: visible light cones; atmospheric depth fade; shadow beams through fog; drifting wisps; silhouetted foreground
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Volumetric Fog as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - changing the geometry
  - adding a new environment
  - adding fog the preset does not own
  - readable text
  - logo
  - clear
  - vacuum
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
