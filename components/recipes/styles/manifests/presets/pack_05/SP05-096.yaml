visualDna:
  aesthetic: High-saturation digital anime with candy-neon color planes, chromatic aberration fringes and deliberately impossible, tilted perspective.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Keep subjects recognizable and fold the perspective around them without adding cards, chess pieces or dice.
  color_and_tone: Magenta, cyan and yellow on dark violet, oversaturated with rainbow-shifted edges.
  lighting_and_shadow: Hard clean highlights, emissive graphic edges and colored rather than grey shadows.
  texture_and_material: Flat opaque color, polished accents and thin chromatic fringing on contours.
  camera_and_composition: 'Keep the framing but bend the perspective: several vanishing points, floating planes and upside-down elements.'
  atmosphere_and_mood: Bold, cerebral and kinetic, a world that plays by other rules.
  rendering_and_quality: Sharp silhouettes that stay readable despite the distortion, with clean color separation.
  key_features: candy-neon planes; chromatic aberration fringes; multiple vanishing points; colored shadows; floating inverted elements
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Hyper-Saturated Impossible Perspective Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
