visualDna:
  aesthetic: >-
    Anime linework layers smooth curved planes with refracted color accents and crisp cel
    edges.
  subject_treatment: >-
    Keep subject, spacing, materials; reflections only on wet or glossy surfaces already
    present.
  color_and_tone: >-
    Deep teal, amber, pearl gray, muted burgundy, compact pale highlights.
  lighting_and_shadow: >-
    Warm-cool contrast only when supported; otherwise follow prompt lighting without
    inventing night.
  texture_and_material: >-
    Broken reflective strokes on existing glass or wet surfaces; dry forms stay matte.
  camera_and_composition: >-
    Preserve crop; curved overlaps come only from forms already shown.
  atmosphere_and_mood: >-
    Stillness or intimacy is never presumed; retain the requested mood and relationships.
  rendering_and_quality: >-
    Clear planes, small highlight masks, stable contours, no rain haze or blur.
  key_features: >-
    Curved plane layering, deep-teal-amber contrast, local reflected strokes, prompt-led
    mood and spacing
  creative_brief: 'Apply a visual treatment centered on curved plane layering, deep-teal-amber contrast, local reflected strokes, prompt-led mood and spacing. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
