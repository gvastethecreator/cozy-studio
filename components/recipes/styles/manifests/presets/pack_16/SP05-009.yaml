  color_and_tone: Rust, sodium orange, grimy teal and deep shadow blue.
  lighting_and_shadow: Smoky industrial light, sodium lamps and exhaust-lit haze.
  texture_and_material: Hand-drawn dense line detail, painted cel grime, smoke and cable tangles.
  camera_and_composition: Vertical canyon compositions, speeding bikes through machinery, fisheye moments.
  atmosphere_and_mood: Keep the requested mood with restless industrial energy.
  rendering_and_quality: Obsessively detailed hand-drawn OVA frame with rough energetic lines.
  key_features: Koji Morimoto density; pipes and cables; retro-future city; rough lines; smoky haze
  creative_brief: "Koji Morimoto and Studio 4°C late-eighties OVA look: hyper-dense hand-drawn machinery, tangled pipes, cables and signs, rough energetic lines and retro-future cities. Carry it through Koji Morimoto density, pipes and cables, retro-future city, rough lines, smoky haze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
