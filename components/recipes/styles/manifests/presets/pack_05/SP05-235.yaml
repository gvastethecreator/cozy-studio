visualDna:
  aesthetic: 'Y2K pop-cyber gloss: candy-jelly highlights, bubble gradients, chrome-pink rims, and edges dissolving into ordered pixel dither.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Vivid pink, cyan, violet and a small lime accent on white or deep indigo, with glossy bright gradients.
  lighting_and_shadow: Big soft jelly specular blobs and a white window-shaped highlight on curved surfaces, with cel shadows in clean violet.
  texture_and_material: Translucent gel-plastic surfaces, bubble gradients, and ordered four-by-four pixel dither on edges and falloffs.
  camera_and_composition: Keep the requested view; float small glossy bubble shapes and dither patches around the subject.
  atmosphere_and_mood: Playful, synthetic and giddy, a toy-bright simulation of summer.
  rendering_and_quality: Vector-clean outlines, glossy gel highlights and ordered dither transitions; no grime and no photorealism.
  key_features: candy-jelly gel highlights; bubble gradients; chrome-pink rims; ordered pixel dither; pink, cyan and lime palette
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pop-Cyber Simulation Gloss as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
