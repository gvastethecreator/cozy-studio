  color_and_tone: 'Contrast cool blue-gray or green neutrals with limited warm accents where the palette permits; do not impose an emotional cast through color.'
  lighting_and_shadow: 'Keep the stated light source and direction; use a broad soft key and warmer bounce only when existing light supports it.'
  texture_and_material: 'Favor matte color and fine material-specific strokes; texture describes only surfaces specified in the request.'
  camera_and_composition: 'Maintain crop, viewpoint, spacing, and count; use warm and cool planes to separate existing layers, not rearrange them.'
  atmosphere_and_mood: 'Preserve the requested tone; color temperature is a visual relationship, not an emotional instruction.'
  rendering_and_quality: 'Use smooth fill transitions, rounded contour joins, and soft-edged shadows with readable value boundaries.'
  key_features: 'Cool ambient planes against warm accents; rounded contour joins; soft value transitions; clear layered separation; matte finish.'
