visualDna:
  aesthetic:
    'Treat forms like a hand-assembled xerox zine: torn image planes, paste-over blocks, rough marker
    contours, coarse halftones, and slight print misregistration make the graphic language legible.'
  subject_treatment:
    Preserve the requested subject, action, and framing; simplify unspecified forms into bold
    cut-paper silhouettes and re-layer selected details like pasted clippings without turning every image into
    a page or poster.
  color_and_tone:
    Use paper cream, toner black, and a few saturated ink colors such as red, cobalt, or acid
    green; let uncoated paper remain light and keep the focal silhouette distinct from collage fragments.
  lighting_and_shadow:
    Prefer flat printed value blocks and small paste-layer shadows; reserve deeper shadow
    for overlaps and folds so the image reads as reproduced print rather than a photographed paper surface.
  texture_and_material:
    Make grain belong to toner, halftone, rough cut edges, staples, and tape seams; keep
    the subject's large color and value regions clean enough to read.
  camera_and_composition:
    Keep the source framing and dominant subject; use one strong diagonal or asymmetric
    pasted strip to create zine energy, with supporting fragments kept subordinate.
  atmosphere_and_mood:
    Carry a self-published, urgent, resourceful voice that can be playful, tender, angry,
    or strange according to the requested content.
  rendering_and_quality:
    Render crisp illustration with controlled photocopy grit, clear silhouette edges,
    and legible large shapes; avoid letting paper noise replace drawing.
avoidRules:
  - a compulsory magazine page or poster layout
  - unrequested readable lettering or logos
  - uniform dirt or grain that obscures the subject
