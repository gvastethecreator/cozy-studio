visualDna:
  aesthetic: 'Desktop 3D-print model: the subject printed in plastic filament with fine horizontal layer lines, support scars and a slight elephant-foot flare at the base.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: 'Single-color filament per part: matte grey, bone white, silk gold or translucent green; flat color with subtle sheen.'
  lighting_and_shadow: Cool desk light grazing the layers so every line shows as a fine ridge; soft shadow on the build plate.
  texture_and_material: Stacked 0.2 mm layer lines, stringing wisps, rough support-contact scars, seam line zipping up one side.
  camera_and_composition: Keep the requested view as a macro on a textured build plate or desk, close enough to show the layers.
  atmosphere_and_mood: Freshly made and nerdy, the object still warm off the printer.
  rendering_and_quality: Macro photograph of a real print with honest defects; never a smooth resin cast or CG render.
  creative_brief: "Desktop 3D-print model: the subject printed in plastic filament with fine horizontal layer lines, support scars and a slight elephant-foot flare at the base. Carry it through visible horizontal layer lines, support scars, stringing wisps, single-color filament, macro on a build plate. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: visible horizontal layer lines; support scars; stringing wisps; single-color filament; macro on a build plate
