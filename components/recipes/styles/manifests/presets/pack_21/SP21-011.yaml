visualDna:
  aesthetic: 'Inclusion paper ground: light painting on thick handmade paper full of pressed petals, grass fibers and seeds, with deckled edges framing the image.'
  subject_treatment: Paint the prompt's subject lightly over the flecked handmade sheet, keeping its shape clear while petals and fibers show through the paint.
  color_and_tone: Soft washes of color over an off-white sheet flecked with pink, green and gold inclusions.
  lighting_and_shadow: Gentle diffuse light, with raking side light revealing the uneven fibrous paper surface.
  texture_and_material: Pressed petals, stray fibers, seed flecks, lumpy handmade surface and soft torn deckle edges.
  camera_and_composition: The whole sheet visible with its deckled border, the subject floating over the flecked ground.
  atmosphere_and_mood: Gentle, botanical and handmade, like a keepsake from a garden.
  rendering_and_quality: Light translucent paint that lets the inclusions show, never covering the paper character.
  creative_brief: "Inclusion paper ground: light painting on thick handmade paper full of pressed petals, grass fibers and seeds, with deckled edges framing the image. Carry it through pressed petals in paper, deckled edges, light washes, fibrous surface. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: pressed petals in paper; deckled edges; light washes; fibrous surface
