visualDna:
  aesthetic: 'Tintype: a collodion positive on a thin black-lacquered iron plate, fast, cheap and made in a portable darkroom.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Creamy olive-grey highlights on a dark brown-black ground; orthochromatic dark reds and pale blues.
  lighting_and_shadow: Hard daylight or skylight, strong falloff at the plate edges.
  texture_and_material: Black lacquered edges where the collodion stops, pour lines, scratches, rust spots and dents.
  camera_and_composition: Keep the requested framing; a Petzval lens with a sharp center and soft swirl.
  atmosphere_and_mood: Stoic and raw, a hard-won portrait on a scrap of metal.
  rendering_and_quality: Iron-plate collodion look on dark metal; not a glass plate and not a paper print.
  key_features: black iron plate; olive-grey creamy highlights; lacquered edges and pour lines; rust and scratches; Petzval swirl
  creative_brief: "Tintype: a collodion positive on a thin black-lacquered iron plate, fast, cheap and made in a portable darkroom. Carry it through black iron plate, olive-grey creamy highlights, lacquered edges and pour lines, rust and scratches, Petzval swirl. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
