visualDna:
  aesthetic: >-
    Let diluted ink washes build broad forms from transparent darks and clear reserves. Alternate
    softened wash edges with a few loaded brush marks so the wash itself describes the subject.
  subject_treatment: >-
    Preserve the requested identity, action and defining details. Shape each form with localized
    stains and open light areas instead of laying a separate cloud over the image.
  color_and_tone: >-
    Respect the requested colors and value relationships. Keep diluted darks transparent enough to
    preserve separation between neighboring forms and the original palette.
  lighting_and_shadow: >-
    Follow the described lighting. Use unpainted reserves and wash density to express its existing
    light and shadow without inventing fog, a new source or a time of day.
  texture_and_material: >-
    Show pigment pooling only in selected areas and vary washed edges with a small number of loaded
    marks. Keep the pigment behavior distinct from the materials depicted.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and arrangement. Keep the major light reserves and
    wash shapes inside the existing composition.
  atmosphere_and_mood: >-
    Preserve the requested mood and narrative. Wash transparency describes paint and does not make
    the subject ghostly or the setting misty.
  rendering_and_quality: >-
    Resolve silhouette and large value shapes first. Keep darks distinct and stop before neighboring
    washes merge into a muddy field that hides the requested content.
avoidRules:
  - uniform wash laid over every shape
  - muddy darks that erase value separation
  - unrequested ghostly or fog effects
  - unrequested horror or violence
