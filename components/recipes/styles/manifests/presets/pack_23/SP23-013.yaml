visualDna:
  aesthetic: >-
    Interlaced color-plane construction: existing colors form bounded woven fields with slightly
    stepped edges and tonal hatching at a consistent fiber scale, without turning the whole image
    into a hanging textile.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, action and defining details. Translate the
    existing forms into interlaced color regions without adding motifs or reshaping their structure.
  color_and_tone: >-
    Retain the requested palette and value relationships. Build tonal shifts with restrained textile
    hatching inside existing color areas; do not introduce a millefleurs palette or pattern.
  lighting_and_shadow: >-
    Follow the requested illumination and shadow direction. Use hatch density to express existing
    value changes without adding a light source or metallic fiber highlights.
  texture_and_material: >-
    Keep the woven rhythm local to the image treatment and preserve the actual materials of depicted
    objects and support. Do not add a global cloth surface, physical folds, hanging fabric or damage.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Do not add a textile
    border, display setting or ornamental frame.
  atmosphere_and_mood: >-
    Keep the requested mood and setting. Interlaced marks alone do not imply a historical scene,
    floral field or tapestry display.
  rendering_and_quality: >-
    Keep stepped boundaries subtle and fiber scale consistent across forms. Make hatching readable
    without obscuring edges or adding uniform noise, distress or decorative clutter.
avoidRules:
  - unrequested hanging textile, curtain, folds or ornamental frame
  - unrequested millefleurs field or unicorn motif
