visualDna:
  aesthetic: 'Seamless catalog packshot: the object alone on a pure white or light grey infinity cove, lit for truth rather than drama.'
  subject_treatment: Keep the prompt's object exactly — shape, proportions, color and supplied design; this preset owns the seamless backdrop and neutral catalog framing.
  color_and_tone: Neutral whites, controlled light greys, accurate object color.
  lighting_and_shadow: Shadowless softbox sweep from above and both sides, with only a faint contact shadow.
  texture_and_material: Clean, true surface detail; no dust and no styling props.
  camera_and_composition: Straight-on or slight three-quarter, object centered, corrected perspective.
  atmosphere_and_mood: Objective and frictionless, the object shown with nothing to distract from it.
  rendering_and_quality: Retail catalog precision with clean edges on a seamless background.
  key_features: infinity cove background; shadowless softbox sweep; faint contact shadow; centered object; corrected perspective
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Seamless Packshot as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
