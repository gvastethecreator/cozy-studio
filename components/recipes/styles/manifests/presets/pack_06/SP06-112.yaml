visualDna:
  aesthetic: 'Sci-fi equipment icon kit: hard-surface items rendered at three-quarter view as matching inventory icons with emissive accent strips.'
  subject_treatment: Keep the prompt subject and its design; present it as a standalone game asset on a plain field, and build a gameplay scene or interface only when the prompt asks for one.
  color_and_tone: Gunmetal, white ceramic and black rubber with one emissive accent color shared by the whole set.
  lighting_and_shadow: Studio key from top-left, cool rim light on the right, subtle glow from emissive strips.
  texture_and_material: Panel lines, beveled edges, brushed metal, matte polymer and small warning-stripe details without text.
  camera_and_composition: Each item at the same three-quarter angle, centered with equal padding in a grid on a dark gradient field.
  atmosphere_and_mood: Precise and collectible, gear laid out before a mission.
  rendering_and_quality: Crisp silhouettes, consistent scale and light across the kit; no labels or numbers.
  key_features: three-quarter icon angle; emissive accent strips; panel lines and bevels; dark gradient field; equal grid padding
  creative_brief: "Sci-fi equipment icon kit: hard-surface items rendered at three-quarter view as matching inventory icons with emissive accent strips. Carry it through three-quarter icon angle, emissive accent strips, panel lines and bevels, dark gradient field, equal grid padding. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - gun requirement
  - soldier requirement
  - labels on items
  - motion blur
  - inconsistent proportions
  - changing costume
  - cluttered background
  - watermark
  - text
  - wrong medium
  - generic AI gloss
  - muddy noise
  - uncontrolled texture chatter
  - readable text
  - signature
  - low resolution
  - readable UI text
  - logo clutter
  - generic screenshot
  - unplayable visual clutter
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
