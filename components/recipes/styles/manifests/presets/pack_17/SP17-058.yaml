visualDna:
  aesthetic: 'A dark inversion of medieval ink fantasy plates: blackened vellum, bone linework, oxidized washes, carved silhouettes, and manuscript discipline without readable script.'
  subject_treatment: Any prompt subject becomes a dark illuminated plate, beast, relic, figure, architecture fragment, or symbolic scenelet rendered through inverted ink and medieval plate order.
  color_and_tone: Blackened brown, soot black, bone white, verdigris, dried umber, old red, and tarnished gold used as small support accents.
  lighting_and_shadow: Muted candle-edge contrast, white ink cuts, halo-like plate geometry, and open dark grounds kept readable.
  texture_and_material: Ink wash, scratched vellum, engraved white highlights, soot stains, and controlled medieval print texture.
  camera_and_composition: Vertical plate composition with one large focal subject, broad dark margins, small decorative non-text marks, and disciplined negative space.
  atmosphere_and_mood: Somber, antique, occult, scholastic, and grim without becoming black sludge.
  rendering_and_quality: Denoised inverted manuscript illustration with clean contours, broad value groups, and restrained plate ornament.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dark Medieval Ink Plate as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
  key_features: blackened vellum; bone ink; dark medieval plate; inverted manuscript logic; oxidized accents; textless scholastic horror
