visualDna:
  aesthetic: 'Basketball anime of misdirection and speed: invisible passes, afterimages and players who seem to vanish into the flow.'
  subject_treatment: Keep the prompt's subject and action; make it move with deceptive speed, afterimages and misdirected attention.
  color_and_tone: Cool arena blues and whites with a pale ghostly accent for the fast player.
  lighting_and_shadow: Bright arena light from above, with semi-transparent afterimages glowing softly behind the moving player.
  texture_and_material: Smooth cel with translucent motion trails and crisp ball highlights.
  camera_and_composition: Wide play frames with multiple afterimages and defenders looking the wrong way.
  atmosphere_and_mood: Slippery and clever, the thrill of something happening where nobody was looking.
  rendering_and_quality: Clean sports anime with translucent effects and precise choreography.
  key_features: afterimages; misdirection; translucent trails; wrong-way defenders
  creative_brief: "Basketball anime of misdirection and speed: invisible passes, afterimages and players who seem to vanish into the flow. Carry it through afterimages, misdirection, translucent trails, wrong-way defenders. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
