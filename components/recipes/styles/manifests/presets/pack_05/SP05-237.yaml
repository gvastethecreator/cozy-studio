visualDna:
  aesthetic: 'Painted anime key art: broad beveled planes laid in with a flat digital brush, silhouettes backlit by an ember-red rim, and deep empty blacks.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Ember red, gold and pale cream against ink black and charcoal, with the hottest values reserved for the rim.
  lighting_and_shadow: Strong backlight or underlight rim of ember and gold; the front of forms sits in near-black with bevel-edge highlights.
  texture_and_material: Flat-brush painted planes with visible stroke edges, sparse scuffs, and soft drifting ember specks.
  camera_and_composition: Keep the requested view; place the horizon low so the silhouette stands monumental against a glowing sky or void.
  atmosphere_and_mood: Solemn resolve and sacrifice, heroic stillness before the end.
  rendering_and_quality: Painterly flat-brush key art with a crisp silhouette, rim glow and restrained bloom; not cel line art.
  key_features: backlit ember rim; broad flat-brush beveled planes; near-black silhouettes; drifting ember specks; low monumental horizon
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Monumental Ignition Sacrifice as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
