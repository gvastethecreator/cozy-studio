visualDna:
  aesthetic: 'Silent film: 1920s orthochromatic cinema with heavy stage makeup, an iris vignette and hand-cranked flicker, often tinted sepia or blue.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Monochrome tinted amber-sepia for day or blue for night; orthochromatic dark lips and pale eyes.
  lighting_and_shadow: Bright arc or daylight studio light, flat faces, crisp shadows on painted sets.
  texture_and_material: Scratches, dust, frame-edge flicker and soft focus from old lenses.
  camera_and_composition: Locked-off wide theatrical framing or a circular iris closing on the subject.
  atmosphere_and_mood: Expressive and nostalgic, big gestures in a silent flickering world.
  rendering_and_quality: Projected nitrate print look; invented characters only, never a recognizable screen comedian.
  key_features: iris vignette; sepia or blue tint; flicker and scratches; heavy stage makeup; theatrical framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Silent Film as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
