visualDna:
  aesthetic: >-
    On an explicitly requested enamel target, opaque color planes follow existing forms and meet at firm,
    readable joins, with a small local material highlight rather than transmitted light.
  subject_treatment: >-
    Preserve the requested identity, structure, pose, action and function. Segment only the named enamel
    target and do not add jewelry, icons, metal or new objects.
  color_and_tone: >-
    Preserve the requested colors on and around the target. Use dense opaque color areas without forcing
    a particular palette or adding highlights as new hues.
  lighting_and_shadow: >-
    Follow the requested illumination and keep any enamel highlight local and consistent with it; do not
    make the color areas glow or transmit light.
  texture_and_material: >-
    Use smooth, dense fill with a restrained local enamel sheen only on the requested surface; avoid print
    grain and reflective foil effects.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. Segment boundaries follow the existing
    target shape without creating a frame or alternate layout.
  atmosphere_and_mood: >-
    Keep the requested setting and emotional tone. The material treatment carries no required symbol,
    jewelry, heraldry or cultural meaning.
  rendering_and_quality: >-
    Separate the large opaque areas with clearly weighted joins and simple material highlights; prioritize
    silhouette and value clarity over micro-detail.
avoidRules:
  - enamel segmentation outside the requested material target
  - unrequested jewelry, frames, emblems or symbols
  - transmitted light or print grain
