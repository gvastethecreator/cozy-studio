visualDna:
  aesthetic: 'Encaustic hot-wax painting: pigmented beeswax melted, brushed on and fused with heat, then scraped and re-layered so color sits inside a translucent skin.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Deep saturated colors seen through amber-tinted wax, warm honey glow in the lights, cloudy semi-transparent layers over darker underlayers.
  lighting_and_shadow: Light enters the wax and glows back out, giving soft luminous edges and gentle rounded shadow transitions.
  texture_and_material: Thick waxy skin with pooled drips, torch-fused melted edges, scraped channels revealing earlier colors, a soft satin sheen.
  camera_and_composition: Keep the requested framing; fine details melt away while the main shapes stay firm.
  atmosphere_and_mood: Warm, intimate and ancient, like something sealed in amber.
  rendering_and_quality: Softened fused edges, visible scraping and layering depth, translucent color over opaque; no crisp hatching or photographic detail.
  key_features: translucent fused wax layers; scraped channels revealing underlayers; amber honey glow; soft melted edges; satin wax sheen
  creative_brief: "Encaustic hot-wax painting: pigmented beeswax melted, brushed on and fused with heat, then scraped and re-layered so color sits inside a translucent skin. Carry it through translucent fused wax layers, scraped channels revealing underlayers, amber honey glow, soft melted edges, satin wax sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
