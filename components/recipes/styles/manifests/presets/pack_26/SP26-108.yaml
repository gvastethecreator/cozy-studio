visualDna:
  aesthetic: 'Reid Miles Blue Note Records cover look of the 1950s and 1960s: bold modernist typography as image, cropped Francis Wolff black-and-white photographs, one strong tint color and asymmetric grids.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render the subject as a cropped high-contrast black-and-white photograph under bold modernist type. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black-and-white photo with one bold tint of blue, orange or green.
  lighting_and_shadow: Moody smoky studio photo light, lit the way Reid Miles lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Asymmetric modernist grid with extreme crops, framed the way Reid Miles composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with cool modernist swing.
  rendering_and_quality: Faithful Blue Note era jazz cover design, in the recognizable hand of Reid Miles.
  creative_brief: 'Reid Miles Blue Note Records cover look of the 1950s and 1960s: bold modernist typography as image, cropped Francis Wolff black-and-white photographs, one strong tint color and asymmetric grids. Carry it through Reid Miles bold type, cropped photo, one tint color. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
