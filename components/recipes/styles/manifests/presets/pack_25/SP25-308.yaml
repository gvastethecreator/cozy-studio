visualDna:
  aesthetic: 'Mass-Swap Match Cuts: two very different scenes joined by a cut where the main mass keeps its exact position, size and direction.'
  subject_treatment: Show the prompt's two scenes as a before and after pair joined by one dominant shape in the same position and size, the cut declared and words exact.
  color_and_tone: Palettes changing per scene while the main mass keeps comparable contrast.
  lighting_and_shadow: Coherent light in each scene, the match coming from composition.
  texture_and_material: Different materials allowed, one silhouette or axis always shared.
  camera_and_composition: The mass anchor and bounding box explicit in both frames.
  atmosphere_and_mood: Setup, match and reveal, energy concentrated in one satisfying swap.
  rendering_and_quality: Crisp pair of frames with a checkable match across the cut.
  creative_brief: "Mass-Swap Match Cuts: two very different scenes joined by a cut where the main mass keeps its exact position, size and direction. Carry it through matched mass, same position, declared cut, two scenes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: matched mass; same position; declared cut; two scenes
