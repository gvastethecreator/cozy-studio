visualDna:
  aesthetic: 'Romance manga art: hair-fine pen lines, large glistening eyes, floral and sparkle screentones and decorative flower borders floating around the subject.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Monochrome with soft gray tones and gradient screentone; whites kept pure for sparkles and petals.
  lighting_and_shadow: Soft backlight bloom, very light shadows, highlights drawn as star sparkles and white halos around hair.
  texture_and_material: Floral pattern screentone, bubble and sparkle overlays, flowing hair drawn in hundreds of fine strands.
  camera_and_composition: Emotional close-up or elegant half figure, subject turned three-quarters, petals and sparkles framing the negative space.
  atmosphere_and_mood: Tender, dreamy and wistful, a heartbeat stretched into a moment.
  rendering_and_quality: Delicate controlled line with elongated graceful proportions; never rough, heavy or muscular.
  key_features: hair-fine pen lines; floral screentone; sparkle highlights; large glistening eyes; flower-framed negative space
  creative_brief: "Romance manga art: hair-fine pen lines, large glistening eyes, floral and sparkle screentones and decorative flower borders floating around the subject. Carry it through hair-fine pen lines, floral screentone, sparkle highlights, large glistening eyes, flower-framed negative space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - heavy black shadows
  - gritty texture
  - rough
  - ugly
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - readable fake text
  - watermark
  - logo clutter
  - muddy AI texture
  - generic fantasy slop
  - generic superhero costume
  - random speech text
  - fake lettering
  - photo-real costume render
  - text
  - readable labels
  - logo
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
