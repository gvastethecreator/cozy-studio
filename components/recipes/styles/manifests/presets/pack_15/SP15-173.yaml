visualDna:
  aesthetic: 'Watershedpunk: communities that harvest every drop, with fog nets, rain towers, stepwells, aqueducts and water shrines in dry lands.'
  subject_treatment: Keep the prompt's subject and setting; channel water through it with nets, stepwells, cisterns and aqueducts.
  color_and_tone: Dry ochre and terracotta with precious clear blues of collected water.
  lighting_and_shadow: Harsh sun on dry land and cool shade over glinting water pools.
  texture_and_material: Stone stepwells, fog nets, clay pipes, cisterns and wet moss in the shade.
  camera_and_composition: Deep stepwell perspectives and dry landscapes crossed by thin water channels.
  atmosphere_and_mood: Reverent and resourceful, water treated as the most sacred thing there is.
  rendering_and_quality: Precise illustration with geometric stone structures and glinting water.
  creative_brief: "Watershedpunk: communities that harvest every drop, with fog nets, rain towers, stepwells, aqueducts and water shrines in dry lands. Carry it through stepwells, fog nets, aqueducts, water shrines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stepwells; fog nets; aqueducts; water shrines
