visualDna:
  aesthetic: 'Constructivism: dynamic diagonals, bold wedges and photomontage-free graphic propaganda energy.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is built from strong diagonal wedges, bars and circles pushing across the frame."
  color_and_tone: Red, black and cream, used consistently across subject and background.
  lighting_and_shadow: Flat graphic contrast, expressed through the style rather than photographic lighting.
  texture_and_material: Flat printed shapes with crisp edges, visible at card size as the signature of the style.
  camera_and_composition: Steep diagonals and radiating wedges, arranged so the subject still reads at card size.
  atmosphere_and_mood: Urgent, heroic, industrial and forceful, driven by the construction, color and rhythm.
  rendering_and_quality: Bold print-like finish, with clean, deliberate marks and no accidental noise.
  key_features: dynamic diagonals; red wedges; black bars; cream ground
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Constructivism as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - soft
  - nature
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
