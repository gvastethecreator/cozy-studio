visualDna:
  aesthetic: >-
    A restrained 90s noir cel style uses broad ink-black shapes, slow smoke-like contour ribbons and
    sparse warm highlights. Its jazz character is quiet syncopation rather than fast action.
  subject_treatment: >-
    Preserve the requested identity, gesture and materials. Let a few contours drift in long, fluid
    arcs while keeping the main silhouette clear; add no pipe, hat or detective.
  color_and_tone: >-
    When open, use slate blue, blue-gray and deep ink with a few brass or amber notes. Keep requested
    colors and avoid high-saturation neon.
  lighting_and_shadow: >-
    Group shadows into broad calm planes and use small warm highlights only on existing lit areas. Do
    not add a lamp, spotlight or smoke source.
  texture_and_material: >-
    Use smooth painted cel fields, spare ink grain and softly layered haze-like shapes. Keep haze
    abstract and material-specific highlights accurate.
  camera_and_composition: >-
    Allow spacious negative areas and a slow, off-center balance within the given frame. Preserve
    camera and layout; do not create a portrait or bar setting.
  atmosphere_and_mood: >-
    Keep the visual tempo cool and observant through pauses and low contrast accents. Do not force
    melancholy, nightlife or a noir plot.
  rendering_and_quality: >-
    Hold crisp silhouette edges against softer background planes, with restrained grain and few
    decorative marks. Avoid speed streaks and heavy digital effects.
  key_features: >-
    broad ink shadows; slow smoke-like line ribbons; slate-blue field with sparse brass warmth
  creative_brief: 'Use quiet noir cel values, fluid line accents and measured negative space on the requested content. Preserve subject, action, environment and framing; add no detective, instrument or smoke prop. Use it as a reusable look on any subject.'
