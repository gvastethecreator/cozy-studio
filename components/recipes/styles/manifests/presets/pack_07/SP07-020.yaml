visualDna:
  aesthetic: 'Memphis design interior: playful anti-functional postmodern furniture built from clashing geometric volumes, laminate, terrazzo and bold squiggle patterns.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Pastel pink, mint, butter yellow and lilac clashing with primary red, cobalt and black-and-white graphic patterns; flat, high-key color.
  lighting_and_shadow: Bright even studio-like light with hard small shadows under blocky furniture, no moody falloff.
  texture_and_material: Glossy plastic laminate, speckled terrazzo, squiggle and confetti-printed surfaces, lacquered MDF volumes, chrome ball feet.
  camera_and_composition: Keep the requested view; frontal flat framing like a stage set, objects stacked as colored blocks, asymmetrical balance.
  atmosphere_and_mood: Cheeky, loud and irreverent, good taste deliberately broken.
  rendering_and_quality: Clean bright photograph with saturated flat color and crisp pattern edges, no grime or beige.
  key_features: clashing geometric furniture volumes; squiggle and confetti patterns; plastic laminate; speckled terrazzo; pastel versus primary color clash
  creative_brief: "Memphis design interior: playful anti-functional postmodern furniture built from clashing geometric volumes, laminate, terrazzo and bold squiggle patterns. Carry it through clashing geometric furniture volumes, squiggle and confetti patterns, plastic laminate, speckled terrazzo, pastel versus primary color clash. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
