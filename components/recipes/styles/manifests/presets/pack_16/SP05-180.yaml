visualDna:
  aesthetic: >-
    A precision-action 90s cel treatment uses exact contour breaks, sharply cut shadow wedges and
    motion marks with clear timing. Impact is a line-and-shape relation, not an added fight.
  subject_treatment: >-
    Preserve the requested identity, anatomy and object geometry. Clarify force transfer only in
    motion already present, with controlled deformation and crisp edges.
  color_and_tone: >-
    When open, use disciplined dark cel values with one clear high-contrast accent. Preserve requested
    colors and separate the focal action from surrounding forms.
  lighting_and_shadow: >-
    Use crisp shadows and clean rim separation to make existing movement readable. Preserve supplied
    light; do not insert an impact flash or new source.
  texture_and_material: >-
    Keep fills smooth and linework precise, with only a slight directional smear at edges already
    moving. Respect material response and avoid noisy grain.
  camera_and_composition: >-
    Clarify existing action vectors and recoil spacing within the supplied frame. Preserve camera,
    crop and pose; do not stage an attack or close-up.
  atmosphere_and_mood: >-
    Give the image a controlled, decisive rhythm through anticipation and release where the prompt
    already contains motion. Preserve its tone.
  rendering_and_quality: >-
    Keep moving and static edges distinct, effects crisp and anatomy or object structure stable. Avoid
    broad blur and unrelated speed lines.
  key_features: >-
    precise contour breaks; sharply cut cel-shadow wedges; timing and force lines tied to existing
    action
  creative_brief: 'Apply precise cel contours, shadow wedges and restrained timing marks to the requested content. Preserve its identity, action, setting and composition; add no fighter, impact event or weapon. Use it as a reusable look on any subject.'
