visualDna:
  aesthetic: 'Neoclassical architecture: a temple front of correctly proportioned columns and pediment, rusticated base, strict bilateral symmetry and calm ashlar walls.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: White marble, pale honey limestone and stucco, grey lead roofs and verdigris domes; low saturation, clear light-to-shadow value steps.
  lighting_and_shadow: Clear raking sun that models column fluting and the deep shadow behind the portico, or even soft light for a calm frontal read.
  texture_and_material: Fluted columns in Doric, Ionic or Corinthian order, finely jointed ashlar, rusticated ground storey, carved entablature and pediment relief, stone steps.
  camera_and_composition: Keep the requested view; frontal symmetry on the central axis, steps leading up to the portico, pediment near the top third.
  atmosphere_and_mood: Serene, rational and authoritative, order made permanent.
  rendering_and_quality: Clean architectural photograph with correct column entasis and orders, crisp mouldings, no readable inscriptions.
  key_features: pedimented temple portico; fluted columns of a correct order; rusticated base; strict bilateral symmetry; pale ashlar stone
  creative_brief: "Neoclassical architecture: a temple front of correctly proportioned columns and pediment, rusticated base, strict bilateral symmetry and calm ashlar walls. Carry it through pedimented temple portico, fluted columns of a correct order, rusticated base, strict bilateral symmetry, pale ashlar stone. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
