visualDna:
  aesthetic: 'Confocal fluorescence microscopy: stained structures glowing in separate colored channels against black, sharp in thin optical sections.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Glowing green, magenta, cyan and red channels on pure black, overlaps turning white or yellow.
  lighting_and_shadow: Laser-excited emission from the stains themselves, with no conventional light or shadow.
  texture_and_material: Fine filaments, nuclei, membranes and branching cells with crisp edges.
  camera_and_composition: Microscope field of view, cells filling the frame, no ground.
  atmosphere_and_mood: Luminous and alive, a hidden neon forest inside living things.
  rendering_and_quality: Scientific micrograph look; no scale bars or labels.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Confocal Fluorescence Microscopy as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: glowing colored channels; black background; thin optical section; filament and nucleus detail; channel overlap
