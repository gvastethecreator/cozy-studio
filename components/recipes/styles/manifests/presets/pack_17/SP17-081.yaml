visualDna:
  aesthetic: >-
    Chalk drawing on a deep, matte ground, using broad pale strokes, broken edges, and rubbed
    midtones. The dark support carries the shadows while chalk describes form and highlights.
  subject_treatment: >-
    Preserve requested identity, anatomy, expression, pose, count, and function. Simplify into
    readable contours and chalk masses without changing the subject into a silhouette icon.
  color_and_tone: >-
    Honor explicit palettes. If unspecified, use a dark neutral ground, warm-white chalk, and a few
    restrained gray steps; do not require a monochrome result when the prompt specifies color.
  lighting_and_shadow: >-
    Follow the stated light and gather chalk into existing lit planes. Preserve shadow direction and
    leave dark stock open; do not add rim light, glow, or a new source.
  texture_and_material: >-
    Use powdery edges, short smears, and sparse chalk crumbs only on the drawing surface. Preserve
    the material identity and surface condition of the depicted subject.
  camera_and_composition: >-
    Respect the requested view, crop, and placement. Balance light marks against the existing dark
    forms without forcing a centered portrait or chalkboard frame.
  atmosphere_and_mood: >-
    Let the contrast between exposed ground and rubbed chalk reinforce the requested mood. Do not
    imply a classroom board, cave wall, or ghostly subject through the medium choice alone.
  rendering_and_quality: >-
    Keep chalk marks broad enough to read, vary their edge softness deliberately, and preserve
    essential facial or functional detail. Avoid noisy dust, digital blur, and chalk over every edge.
avoidRules:
  - forced chalkboard, cave, or wall setting
  - chalk texture applied to the depicted subject
  - unrequested spectral glow or figures
  - uniform powder noise or all-over smearing
  - changed palette when the prompt specifies color
