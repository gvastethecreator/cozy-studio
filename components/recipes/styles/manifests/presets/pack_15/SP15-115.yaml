visualDna:
  aesthetic:
    'Rework a coherent story-derived silhouette or emblem through contemporary DIY defiance:
    hand-cut shapes, patched planes, and repurposed details make the narrative feel remade rather than
    reverently preserved; avoid generic folk-pattern decoration.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; apply one coherent story-token as a
    hand-cut, patched, or repurposed mark on an existing compatible surface. Use named myths only when
    requested; otherwise keep the narrative motif invented, and do not add a creature or prop.
  color_and_tone:
    Let the requested palette lead; use tactile contrasts such as ink, worn cloth, brass, or enamel only
    as local DIY accents, and preserve any named mythic reference without assigning it new meanings.
  lighting_and_shadow:
    Preserve the requested light source and time of day; use clear local contrast to make the story-token
    readable without adding magical lighting or changing the setting.
  texture_and_material:
    Combine one coherent narrative motif with visible DIY alteration; avoid generic floral folk ornament,
    rural horror craft, or mixing cultural motifs. Keep named traditions coherent when the prompt identifies one.
  camera_and_composition:
    Keep the existing subject and composition dominant; place the story-token within an existing surface
    rather than adding a creature, talisman object, shrine, procession, or altar.
  atmosphere_and_mood:
    Suggest a legend remixed in the present through its altered mark and repair language; let the prompt set
    the emotional tone and keep the scene contemporary when no other setting is requested.
  rendering_and_quality:
    Keep folk-derived contours and punk interventions crisp and distinct; use decorative
    detail selectively so the transformed silhouette remains dominant.
avoidRules:
  - a mandatory civic procession or shrine
  - incoherent mixing of mythic symbol systems
  - DIY ornament obscuring the subject's defining silhouette
  - generic folk-pattern decoration, unrequested creatures, or added mythic props
