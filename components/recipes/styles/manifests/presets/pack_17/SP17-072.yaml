visualDna:
  aesthetic: Endless modern-war gothic where trench geometry, ruined cathedrals, drone silhouettes, gaslight, and medieval heraldic decay merge into permanent conflict without real-world flags.
  subject_treatment: Preserve prompt X as a war-gothic figure, relic, beast, emplacement, ruined shrine, armored silhouette, or battlefield omen while avoiding fixed soldiers or specific wars.
  color_and_tone: Mud gray, bone, oxidized green, dull brass, black iron, ember red, smoke blue, and desaturated field cloth.
  lighting_and_shadow: Overcast battlefield light, ember rim, searchlight slice, and clean open shadows that avoid murky realism.
  texture_and_material: Mud plates, torn cloth, dented metal, cracked stone, smoke shapes, barbed geometry simplified into readable marks.
  camera_and_composition: Vertical gothic-wargame card with one symbolic focal subject, trench/cathedral support planes, and no UI or insignia.
  atmosphere_and_mood: Exhausted, martial, sacred, hopeless, adult, and tactical.
  rendering_and_quality: Stylized grimdark war illustration with broad value groups, readable silhouettes, controlled grime, and no real-world propaganda.
  creative_brief: "Endless modern-war gothic where trench geometry, ruined cathedrals, drone silhouettes, gaslight, and medieval heraldic decay merge into permanent conflict without real-world flags. Carry it through trench cathedral, drone shadow, ruined heraldry, permanent war mood, mud-gray palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
