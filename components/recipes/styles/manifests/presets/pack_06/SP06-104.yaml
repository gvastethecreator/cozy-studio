visualDna:
  aesthetic: 'Diegetic sci-fi HUD: translucent holographic panels, brackets and arcs projected into the world around the subject, glowing cyan and magenta.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a layer of in-world holographic interface around and over the subject, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Dark scene grade with cyan primary and magenta or amber secondary glows; interface additive and luminous.
  lighting_and_shadow: Holograms cast soft colored light on nearby surfaces; the rest of the scene stays low-key.
  texture_and_material: Thin vector lines, segmented arcs, hexagon grids, faint scanlines and slight chromatic fringing on the projections.
  camera_and_composition: Keep the requested view; brackets frame the focal point, panels sit on an asymmetric grid with safe margins.
  atmosphere_and_mood: Focused and tense, information wrapped around the moment.
  rendering_and_quality: Crisp luminous lines with no legible glyphs; interface never hides the subject.
  key_features: holographic brackets; segmented arcs; hexagon grid; scanlines; cyan and magenta glow
  creative_brief: "Diegetic sci-fi HUD: translucent holographic panels, brackets and arcs projected into the world around the subject, glowing cyan and magenta. Carry it through holographic brackets, segmented arcs, hexagon grid, scanlines, cyan and magenta glow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
