visualDna:
  aesthetic: 'Overscale Folio Rhythm: dramatic changes of scale and visible page numbers articulate chapters while the text stays the main read.'
  subject_treatment: Use large chapter numbers and folios as the structure of the prompt's pages, large at openings and small in the body, the text always the main read.
  color_and_tone: Folios in controlled value, high-contrast titles and a legible body.
  lighting_and_shadow: Flat layout with numbers printed directly on the page.
  texture_and_material: Clean type, a sober support and discreet image edges.
  camera_and_composition: Big folios in transition zones, reduced on dense pages by one rule.
  atmosphere_and_mood: A rhythm of openings and forward motion, bold and structured.
  rendering_and_quality: Crisp spread where folios match real pages and never read as data.
  creative_brief: "Overscale Folio Rhythm: dramatic changes of scale and visible page numbers articulate chapters while the text stays the main read. Carry it through giant chapter numbers, small body folios, scale rhythm, clear chapters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: giant chapter numbers; small body folios; scale rhythm; clear chapters
