visualDna:
  aesthetic: 'Environment concept render: the location staged as a designed game or film space with foreground, middle and background planes, a landmark and a readable path through it.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Warm, saturated foreground cooling to desaturated blue in the distance through atmospheric perspective; the landmark holds the brightest value.
  lighting_and_shadow: One directional sun with global illumination; light pools mark the path, shadowed foreground frames the view.
  texture_and_material: Tileable rock, wood and plaster materials with trim-sheet edges and scattered set dressing that tells how the place is used.
  camera_and_composition: Keep the requested location and camera; organize it into three depth planes with the path leading the eye to one landmark.
  atmosphere_and_mood: Inviting and explorable, a place that makes you want to walk to the landmark.
  rendering_and_quality: Production previs finish with height fog and GI; clear value grouping per depth plane, no empty vista.
  key_features: three depth planes; landmark with brightest value; guiding path; atmospheric blue falloff; storytelling set dressing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Environment Design as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - franchise likeness
  - recognizable game or film world
  - readable text
  - readable signage
  - logo
  - HUD or UI overlay
  - city skyline at sunset
