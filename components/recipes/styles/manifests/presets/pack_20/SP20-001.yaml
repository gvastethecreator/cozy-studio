visualDna:
  aesthetic: Layered print illustration with small controlled registration differences between color plates.
  subject_treatment:
    Keep the requested shapes aligned as a readable whole. Limit color-plate displacement to edge
    fringes; it must not become a duplicated subject.
  color_and_tone:
    Separate the user palette into a few printed color layers. Let overprints produce darker intersections
    rather than arbitrary extra colors.
  lighting_and_shadow:
    Build shading from overlapping color shapes and sparse screening, preserving the requested
    direction of illumination.
  texture_and_material:
    Use mild ink-transfer variation and a consistent paper-scale grain. Registration offsets
    remain small relative to the smallest important form.
  camera_and_composition:
    Preserve framing, pose and camera. The registration shift belongs to the print layers,
    not to the depicted geometry.
  atmosphere_and_mood:
    Keep the requested tone. Print imperfection adds physical character without mandatory nostalgia,
    decay or poster content.
  rendering_and_quality:
    Retain sharp master silhouettes and controlled plate fringes. Avoid global blur or uncontrolled
    chromatic aberration.
avoidRules:
  - large ghost duplicates
  - uncontrolled color fringing
  - invented poster typography
