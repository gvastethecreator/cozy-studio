visualDna:
  aesthetic: 'Pod architecture: rooms and shells molded as cornerless white polymer capsules with seamless joints, rounded thresholds and soft cyan light embedded in the seams.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the seamless capsule enclosure and its molded polymer surfaces, and it never bends, loops or breaks the requested structure.
  color_and_tone: Gloss white and pale grey with soft cyan seam glow and one warm accent material such as tan upholstery; very high key.
  lighting_and_shadow: Indirect cove light from recessed seams, almost shadowless, gentle gradients along the curved walls.
  texture_and_material: Glossy molded polymer, generous fillets instead of corners, no visible screws, grout or panel gaps.
  camera_and_composition: Keep the requested layout and view; every edge becomes a radius and openings become rounded ovals.
  atmosphere_and_mood: Calm, clinical and optimistic, a future that has been sanded smooth.
  rendering_and_quality: Clean product-grade render with soft reflections; no clouds, rings or orbital setting added by default.
  key_features: cornerless white polymer shells; seamless molded joints; rounded oval thresholds; cyan seam glow; shadowless cove light
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Futuristic Pod as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
