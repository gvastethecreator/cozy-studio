visualDna:
  aesthetic: 'Mid-century gouache picture book: opaque matte paint in flat geometric shapes, stylized foliage and animals reduced to playful modernist forms.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Chalky opaque palette of mustard, teal, tomato red and off-white, flat design contrast.
  lighting_and_shadow: Even matte illumination; shadows are flat darker shapes, never gradients.
  texture_and_material: Chalky gouache with dry-brush drag at shape edges and slight streaks inside flat areas.
  camera_and_composition: Flattened decorative space, repeating patterned foliage, subject placed as a bold graphic shape.
  atmosphere_and_mood: Cheerful atomic-age optimism, stylish and gently humorous.
  rendering_and_quality: Opaque flat shapes with visible brush edges; no transparency and no photographic modeling.
  key_features: opaque matte gouache; flat geometric shapes; mustard-teal-tomato palette; dry-brush edges; patterned foliage
  creative_brief: "Mid-century gouache picture book: opaque matte paint in flat geometric shapes, stylized foliage and animals reduced to playful modernist forms. Carry it through opaque matte gouache, flat geometric shapes, mustard-teal-tomato palette, dry-brush edges, patterned foliage. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
