visualDna:
  aesthetic: 'Grain-shaded flat illustration: simple rounded vector shapes shaded not by gradients but by speckled noise grain brushed along one side of each form.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Warm muted palette, terracotta, mustard, sage and dusty blue, with shadow grain in a darker shade of the same hue.
  lighting_and_shadow: One light direction; each form gets a band of stippled grain on its shadow side fading into flat color.
  texture_and_material: Fine sandy noise grain, crisp vector edges, flat fills elsewhere, no outlines.
  camera_and_composition: Keep the requested framing; forms simplified with slightly exaggerated proportions and generous space.
  atmosphere_and_mood: Warm, cozy and calm, a contemporary editorial feel.
  rendering_and_quality: Crisp shapes with directional grain shading only; no smooth gradients, no line art, no 3D.
  creative_brief: "Grain-shaded flat illustration: simple rounded vector shapes shaded not by gradients but by speckled noise grain brushed along one side of each form. Carry it through rounded flat vector shapes, directional noise-grain shading, warm muted palette, no outlines, generous space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: rounded flat vector shapes; directional noise-grain shading; warm muted palette; no outlines; generous space
