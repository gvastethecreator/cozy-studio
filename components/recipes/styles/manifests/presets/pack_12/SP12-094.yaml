visualDna:
  aesthetic: >-
    Original 2001 PS2 survival-horror representation, distinguished by the original's looking-down
    camera rather than the remake's close shoulder view.
  subject_treatment: >-
    Keep the playable figure small but readable in a larger hostile space; nearby actions remain
    clear while distant forms lose definition.
  color_and_tone: >-
    Muted blue-green, gray, brown-black, and dirty cream with occasional dim amber practicals;
    retain low chroma and modest local contrast.
  lighting_and_shadow: >-
    Simple pools of illumination and broad dark areas; visibility falls away through the environment
    rather than through a heavy modern effect.
  texture_and_material: >-
    Use restrained PS2-scale geometry, soft low-resolution textures, and simple material separation;
    keep immediate routes recognizable and avoid modern microdetail.
  camera_and_composition: >-
    An elevated external camera looking down toward the player, with variable scene framing and
    environmental foreground; not an over-the-shoulder follow camera. The recent official Konami
    comparison explicitly contrasts the original looking-down view with the remake.
  atmosphere_and_mood: >-
    Slow observation, vulnerable traversal, and uncertainty; don't turn every scene into combat or a
    monster reveal.
  rendering_and_quality: >-
    Period-informed 2001 PS2 survival-horror capture: restrained geometry and soft diffuse textures,
    simple local light, broad shadows and thick distance fog. No modern shoulder camera or
    high-resolution PBR finish.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
