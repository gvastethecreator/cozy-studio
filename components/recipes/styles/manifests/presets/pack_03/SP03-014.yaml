visualDna:
  aesthetic: 'Chrome and polished metal: mirror-grade reflective surfaces showing the whole environment, with sharp or anisotropic streaked highlights.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Silver chrome, warm gold or rose copper, deep black reflections of dark surroundings.
  lighting_and_shadow: Reflections of lights and windows as bright shapes; brushed areas stretching highlights into streaks.
  texture_and_material: Mirror polish, fine anisotropic brushing, subtle fingerprints or dust only if asked.
  camera_and_composition: Keep the requested framing; interesting surroundings to reflect.
  atmosphere_and_mood: Sleek and precise, a form made of reflections.
  rendering_and_quality: Accurate mirror reflections with correct distortion; no grey plastic.
  key_features: mirror reflections of surroundings; anisotropic streaks; gold or copper tints; black reflected darks; precise highlights
  creative_brief: "Chrome and polished metal: mirror-grade reflective surfaces showing the whole environment, with sharp or anisotropic streaked highlights. Carry it through mirror reflections of surroundings, anisotropic streaks, gold or copper tints, black reflected darks, precise highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - changing the surroundings
  - changing the camera
  - converting every object in the scene
  - readable text
  - logo
  - matte
  - rough
