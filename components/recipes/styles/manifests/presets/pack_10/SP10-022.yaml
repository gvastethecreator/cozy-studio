visualDna:
  aesthetic: 'Pixel sorting: rows or columns of pixels sorted by brightness into long streaks.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: bright or dark ranges of pixels are sorted into vertical or horizontal streaks from a threshold."
  color_and_tone: Original palette stretched into gradient streaks, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Long sorted pixel streaks with sharp thresholds, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at a glance.
  atmosphere_and_mood: Digital, flowing, eerie and precise, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: brightness-sorted streaks; threshold edges
  creative_brief: "Pixel sorting: rows or columns of pixels sorted by brightness into long streaks. Carry it through brightness-sorted streaks, threshold edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
