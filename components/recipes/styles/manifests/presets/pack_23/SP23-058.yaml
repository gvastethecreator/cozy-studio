visualDna:
  aesthetic: >-
    Suggest shallow modeled depth with restrained highlights and shadows, then add fine drawing marks
    and dry-pigment accents to existing forms. Keep the relief cue subtle and integrated.
  subject_treatment: >-
    Preserve the requested identity, function, count, pose, action, proportions and geometry. Relief
    shading follows existing forms; drawn accents add no writing, symbols or new content.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use restrained opaque accents within those
    colors without imposing a fixed pigment or material color.
  lighting_and_shadow: >-
    Follow the requested light direction. Use shallow value changes to clarify existing form without
    inventing relief, new shadows or a new light source.
  texture_and_material: >-
    Preserve the materials already depicted. Keep dry-pigment marks fine and local to existing
    surfaces rather than turning the full image into a new material.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, scale and spatial relationships. Relief cues only affect
    rendering; they do not add elements or alter the requested arrangement.
  atmosphere_and_mood: >-
    Preserve the requested scene and mood. Low-relief modeling and fine marks change image treatment
    only; they do not add a setting, period or narrative.
  rendering_and_quality: >-
    Keep the relief restrained, drawing marks legible and pigment accents selective. Avoid raised
    edges that distort the silhouette or marks that resemble lettering.
avoidRules:
  - unrequested changes to geometry or depicted material
  - excessive relief, noisy pigment or mark-like lettering
  - unrequested symbols or lettering that create new content
