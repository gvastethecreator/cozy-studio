  atmosphere_and_mood: >-
    Keep the mood mood carried by fingerprinted clay, stop-motion pose increments, miniature set
    lighting, handmade material charm; derive mood from toy-like clarity, technical breakdown,
    handmade stop-motion, abstract motion, retro CGI novelty, or procedural mathematical wonder,
