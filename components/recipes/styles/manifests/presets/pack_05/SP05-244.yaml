visualDna:
  aesthetic: >-
    Formal cel illustration shaped by tall visual rhythms, textile-inspired repeats, and carefully
    balanced ornament.
  subject_treatment: >-
    Keep the requested subject and gesture; use measured outlines and repeating internal marks
    without adding ceremonial dress.
  color_and_tone: >-
    Muted indigo, parchment, and restrained cinnabar or gold create composed contrast; honor
    specified colors.
  lighting_and_shadow: >-
    Even, deliberate light reveals the main planes; small highlights keep ornamental details clear.
  texture_and_material: >-
    Fine repeated strokes and restrained fabric-like texture function as surface treatment, not as a
    material change.
  camera_and_composition: >-
    Preserve the requested framing; use vertical spacing and visual symmetry without adding a court
    or formal scene.
  atmosphere_and_mood: >-
    Solemn and poised, with no imposed ritual or destiny.
  rendering_and_quality: >-
    Keep ornament sparse, edge control clean, and detail scale consistent across the image.
  key_features: >-
    Tall rhythm, textile-like line repeats, measured symmetry, and composed color give the cel work
    a formal calm.
  creative_brief: >-
    Give the requested content a tall, ornamental visual rhythm and controlled cel finish, without
    court, costume, or ceremony.
