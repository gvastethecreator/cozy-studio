visualDna:
  aesthetic: >-
    Precise anime contour contrasts straight structured edges with small ruffle-like rhythms
    and cel shadows.
  subject_treatment: >-
    Preserve age, identity, action, clothing; detail trim only when already present.
  color_and_tone: >-
    Black, ivory, plum, sharp red; contrast serves legibility, not a role change.
  lighting_and_shadow: >-
    Clear directional light and smooth shadows; no split identity or spotlight.
  texture_and_material: >-
    Satin only where shown; otherwise matte fills and patterns confined to present surfaces.
  camera_and_composition: >-
    Keep layout; distinguish existing shapes through value, not panels or staged duality.
  atmosphere_and_mood: >-
    Poise or playfulness follows the requested mood; impose no disguise or dominance.
  rendering_and_quality: >-
    Refined edges, prompt-led materials, sparse details, no costume motifs.
  key_features: >-
    Structured contour, ruffle rhythm, black-ivory-red values, contrast without wardrobe
    change
  creative_brief: 'Apply a visual treatment centered on structured contour, ruffle rhythm, black-ivory-red values, contrast without wardrobe change. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
