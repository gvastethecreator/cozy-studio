visualDna:
  aesthetic: 'Circuit board: the subject laid out as copper traces, pads and components on a PCB.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject's silhouette is formed by copper traces, vias and chip pads on green solder mask."
  color_and_tone: Green solder mask, copper gold and white silkscreen marks.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: PCB substrate with traces and pads, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Technical, intricate, electric and precise, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  key_features: copper traces; vias; component pads; illustrative only
  creative_brief: "Circuit board: the subject laid out as copper traces, pads and components on a PCB. Carry it through copper traces, vias, component pads, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
