schemaVersion: 1
id: SP10-063
packId: pack_10
name: Chainmail
category: 6. Material Surface Textures
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - abstract-and-experimental
  - material-surface-textures
visualDna:
  aesthetic: >-
    Chainmail becomes a transferable material surface transformation system: start from Interlinked
    rings, Ring pattern, and Drape, then route prompt content through physical surface grain,
    reflectance, damage, joinery, pores, seams, and tactile structure without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Rings to coat, wrap, weather, polish, crack,
    scale, link, or embed forms while preserving the prompt composition; preserve anatomy, object
    identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Steel; let color follow material depth, veins, patina, oxidation, fiber
    direction, shimmer, or manufactured finish, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Metallic drive the light response: show reflectance honestly through gloss, matte falloff,
    iridescence, metallic shear, or micro-shadow, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Metal links as the tactile or mark-making basis; surface behavior needs coherent grain,
    chips, cracks, pores, links, flakes, scales, strands, or inclusions, scaled to figures, props,
    spaces, or close material studies.
  camera_and_composition: >-
    Compose around Drape as reusable spatial grammar: support macro texture studies and full-scene
    use through directional grain, repeat, drape, fracture, or patch rhythm, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Strong, protective as the emotional register; derive mood from durability, luxury, decay,
    tactility, craft, armor, novelty, or contamination, without flattening strong, strange, darker,
    or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Medieval, armor: finish with material clarity, controlled micro-detail, and no stock
    texture pasted over forms, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Interlinked rings; Rings; Steel; Metallic; Metal links; Drape; Strong, protective; Medieval,
    armor; Ring pattern
  creative_brief: >-
    Route any subject through Chainmail as a transferable material-surface visual system: preserve
    prompt intent while converting form, grain, reflectivity, wear, pores, seams, and tactile relief
    through this preset. Apply chainmail structure to the input: interlocked metal rings, flexible
    armor flow, repeated circular links, and cool steel highlights should wrap or replace surfaces
    without forcing medieval characters.
avoidRules:
  - plate armor
  - wrong material
  - generic stock texture
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
assets:
  defaultImage: /assets/recipes/styles/defaults/SP10-063.webp
attributes:
  negativePrompt: >-
    plate armor, wrong material, generic stock texture, literal card scene, style-card boilerplate,
    muddy noise, watermark
