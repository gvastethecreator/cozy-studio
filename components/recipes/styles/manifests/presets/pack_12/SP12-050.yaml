visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through communication failure pressure; infection spread and containment
    retreat; illicit route planning, horror escalation, underworld thresholds, trap timing, and
    stealth readability, using the preset as art direction rather than a required scene, mission,
    character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express stealth timing, illicit access,
    trap pressure, corruption, pursuit routes, and horror reveal logic without requiring one heist
    shot.
  color_and_tone: >-
    Grade the image with cold white, signal red, and blue-grey steel; inky black, sick green, opera
    red, copper shadow, moonlit blue, rust, and carnival poison color; keep tonal hierarchy strong
    enough for gameplay readability, thumbnail clarity, and subject recognition.
  lighting_and_shadow: >-
    Drive the lighting with radio beacon through snowfall; blinking radio beacon and static glow;
    beacon glow in cold air; knife-edge spotlights, emergency bulbs, sick fluorescents, moon
    slashes, lantern pools, and signal static; use highlights and shadow pockets to reveal routes,
    hazards, factions, or focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from velvet curtains, rusted rails, wet tile, bone props, thorned stone, pirate
    rigging, train metal, and corrupted signage; make props, clothing, creatures, vehicles,
    architecture, and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from illicit route planning, horror escalation, underworld
    thresholds, trap timing, and stealth readability: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood panic under cold weather; dangerous, clandestine, haunted, predatory, decadent,
    and unstable; the result can be adult, harsh, seductive, eerie, or violent when prompt X asks
    for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as adult genre-game finish with controlled darkness, readable threats, and no flattened
    spooky fog; preserve clean focal hierarchy, believable material response, heavy-denoise clarity,
    and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Polar, Signal, Tower, Outbreak; communication failure pressure; cold white, signal red, and
    blue-grey steel; radio beacon through snowfall; velvet curtains, rusted rails, wet tile, bone
    props, thorned stone, pirate rigging, train metal, and corrupted signage; vertical signal
    landmark and perimeter route; panic under cold weather
  creative_brief: >-
    Apply Polar Signal Tower Outbreak as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
