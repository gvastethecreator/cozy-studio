visualDna:
  aesthetic: >-
    Stained Glass becomes a transferable discrete mark, mosaic, and glass segmentation system: start
    from Stained glass segmentation, Lead lines, and Simplified shapes, then route prompt content
    through dots, tiles, grout, lead came, optical mixing, and segmented luminous surfaces without
    forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Black lead came to rebuild forms from dots,
    glass cells, tile units, grout lines, or lead outlines while preserving silhouette; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Glowing, saturated; use color as optical mixing, glass translucency, tile
    pigment, grout contrast, and luminous segmentation, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Backlit drive the light response: shape light through dot vibration, tile highlights,
    stained-glass glow, or shallow relief shadow, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Glass imperfections as the tactile or mark-making basis; surfaces require individual
    marks, tile gaps, lead seams, pigment density, and unit-to-unit variation, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Simplified shapes as reusable spatial grammar: favor readable silhouettes, local
    unit scale changes, tessellated flow, and segmented rhythm, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Reverent, bright as the emotional register; derive mood from craft, sacred light, optical
    vibration, public art, and patient mark-making, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Luminous, leaded glass: finish with coherent units, controlled outlines, and no
    blurred pseudo-mosaic mush, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Stained glass segmentation; Black lead came; Glowing, saturated; Backlit; Glass imperfections;
    Simplified shapes; Reverent, bright; Luminous, leaded glass; Lead lines
  creative_brief: >-
    Apply stained-glass segmentation over the input with cobalt and ruby panes, black lead came,
    backlit saturation, glass imperfections, and simplified luminous shapes. If icons, figures,
    architecture, or symbols exist, make them reverent; otherwise convert the subject into leaded
    color fields without requiring saints, windows, or sermon imagery.
avoidRules:
  - opaque
  - blurred mush
  - continuous brush rendering
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
