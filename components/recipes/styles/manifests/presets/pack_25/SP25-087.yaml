visualDna:
  aesthetic: 'Optical Ghost Registers: a modifier that adds faint afterimages behind the current readout, like an old optical display remembering itself.'
  subject_treatment: Add a faint, slightly offset afterimage behind the prompt's existing readouts, keeping the current values locked, dominant and exact.
  color_and_tone: Echoes lower in value and saturation than the active data.
  lighting_and_shadow: Soft glow on the echo with the current reading kept crisp and clear.
  texture_and_material: Light optical persistence with a small bounded offset and clean active letter edges.
  camera_and_composition: Composition and data of the input kept exactly, no new positions.
  atmosphere_and_mood: Subtle visual memory of an old optical system, calm and eerie.
  rendering_and_quality: The current reading is identified before the echo is noticed.
  creative_brief: "Optical Ghost Registers: a modifier that adds faint afterimages behind the current readout, like an old optical display remembering itself. Carry it through faint afterimage, locked current values, small offset, old optics. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: faint afterimage; locked current values; small offset; old optics
