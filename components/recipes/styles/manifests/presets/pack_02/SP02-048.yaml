visualDna:
  aesthetic: 'Autochrome: an early color glass plate whose image is built from a mosaic of dyed potato-starch grains, soft and pointillist.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Soft muted pastels — dusty rose, sage, violet, ochre — grainy color speckle, dim luminous highlights.
  lighting_and_shadow: Bright daylight for long exposures; soft shadows and gentle glow.
  texture_and_material: Visible starch-grain color speckle, slight softness and dark clumps of grains.
  camera_and_composition: Keep the requested framing; still subjects for the long exposure.
  atmosphere_and_mood: Dreamy and tender, color remembered rather than seen.
  rendering_and_quality: Pointillist color-screen look on glass; no modern saturated color.
  key_features: starch-grain color mosaic; muted pastel palette; soft pointillist speckle; dim glow; glass plate softness
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Autochrome (1900s) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
