visualDna:
  aesthetic: 'Norman McLaren experimental animation look of the 1940s to 1970s: images scratched and painted directly onto film stock, dancing abstract shapes, pixilation, optical rhythms and visual music.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; scratch and paint the subject directly onto film stock as dancing abstract rhythms. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Hand-painted film dyes in vivid red, blue and yellow on black leader.
  lighting_and_shadow: Projector light through scratched and painted film, lit the way Norman McLaren lights its scenes.
  texture_and_material: Scratched emulsion, painted film dyes and sprocket holes.
  camera_and_composition: Film strip frames with abstract rhythmic shapes, framed the way Norman McLaren composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with playful rhythmic abstraction.
  rendering_and_quality: Faithful hand-made experimental film frames, in the recognizable hand of Norman McLaren.
  creative_brief: "Norman McLaren experimental animation look of the 1940s to 1970s: images scratched and painted directly onto film stock, dancing abstract shapes, pixilation, optical rhythms and visual music. Carry it through McLaren drawn-on-film, scratched emulsion, visual music. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: McLaren drawn-on-film; scratched emulsion; visual music
