visualDna:
  aesthetic: 'Hinged Monograms: two initials share one geometric articulation, joining like a hinge while each letter keeps its own strokes.'
  subject_treatment: Build the requested initials into one monogram joined at a single compatible stroke that works as a shared hinge; keep every letter readable and exact.
  color_and_tone: Monochrome final mark, studied with one distinct value per letter before merging into one ink.
  lighting_and_shadow: Even flat graphic light, with the articulation drawn in the contour itself.
  texture_and_material: Related stroke weights with clean joins and clearly separated terminals on both letters.
  camera_and_composition: The hinge axis organizes the mark freely, with room for asymmetry beyond a square box.
  atmosphere_and_mood: Contained motion, as if the letters could swing open without ever coming apart.
  rendering_and_quality: Optically corrected join, with the more complex letter tuned so it never dominates by density.
  creative_brief: "Hinged Monograms: two initials share one geometric articulation, joining like a hinge while each letter keeps its own strokes. Carry it through shared hinge stroke, readable initials, contained motion, one-ink monogram. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: shared hinge stroke; readable initials; contained motion; one-ink monogram
