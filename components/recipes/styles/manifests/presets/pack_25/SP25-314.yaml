visualDna:
  aesthetic: "Interlocking Panel Choreography: styleframes where panels give way and slide into each other's space without ever covering text."
  subject_treatment: Show the prompt's panels in keyframes where one yields space and another slides into it, edges and contents kept and every word exact.
  color_and_tone: Constant color per panel or function across the move.
  lighting_and_shadow: Flat or shallow common depth with no shadow over text.
  texture_and_material: Clean edges, shared radii and panels carried as locked layers.
  camera_and_composition: Declared entry and exit zones and a stable reading area at arrival.
  atmosphere_and_mood: A choreography of giving and taking space, polite and precise.
  rendering_and_quality: Crisp keyframes with complete text and one focus at a time.
  creative_brief: "Interlocking Panel Choreography: styleframes where panels give way and slide into each other's space without ever covering text. Carry it through yielding panels, interlocking slides, locked contents, one focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: yielding panels; interlocking slides; locked contents; one focus
