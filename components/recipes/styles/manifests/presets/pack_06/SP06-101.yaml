visualDna:
  aesthetic: >-
    JRPG Pixel Diorama Grammar acts as a transferable art-medium router: start from Compact JRPG
    pixel art diorama language with nostalgic 16 bit readability and toy like spatial charm,
    gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity and game-art direction system built from playable readability, UI or
    asset grammar, role clarity, production polish, and genre-specific visual feedback, then apply
    the medium behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Translate any subject into small modular clusters, readable
    silhouettes, stepped edge logic, and charm first simplification; preserve the prompt subject
    while routing it through tile readability, icon clarity, splash rendering, interface material,
    sprite bounce, shadow zones, or encounter pressure, keeping the requested identity, silhouette,
    pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Warm limited elevated edge structure, soft dusk accents, separated roof
    light/shadow bands, and selective jewel color highlights; use color as gameplay hierarchy:
    rarity glow, faction contrast, tactical coding, seasonal warmth, horror warmth, neon route
    color, or readable inventory material, with deliberate value grouping, accent control, and
    medium-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through Stable top left pixel lighting with blocky cast shadows and simple ambient
    occlusion under forms; shape light through game readability: rim separation, UI glow,
    static-camera dread, foil flare, ability-color drama, safe-zone warmth, or velocity streaks, so
    value structure supports the medium and does not overwrite the requested content.
  texture_and_material: >-
    Render Hand placed dithering, tiny tile noise, one pixel highlight ticks, and restrained pattern
    repetition; surface detail should support genre grammar through parchment, HUD glass, pixel
    atlas texture, tarnished metal, foil frame, arsenal bevels, or cozy handmade material, keeping
    material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Locked isometric or three quarter diorama framing with stacked depth
    layers and tidy grid rhythm; compose through gameplay-facing hierarchy, atlas consistency, menu
    rhythm, parallax layers, tactical grid, encounter scale, or selection-screen energy, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Adventurous, cozy, exploratory mood without requiring towns, buildings, roads, or
    NPCs; derive mood from playable stakes, collection desire, tactical control, cozy routine,
    survival dread, arcade speed, or heroic confrontation, letting the medium alter interpretation
    without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Crisp pixel scale, no interpolation blur, clean sprite readability, and consistent
    palette discipline; finish with game-production clarity, strong silhouettes, controlled UI-like
    detail, and no unreadable screenshot clutter, clean denoised surfaces where appropriate, and
    enough craft evidence to make the medium recognizable.
  key_features: >-
    Compact JRPG pixel art diorama language with nostalgic 16 bit readability and toy like spatial
    charm; gameplay-readable hierarchy, genre-specific surface language, UI-aware composition, and
    production-art clarity; Warm limited elevated edge structure, soft dusk accents, separated roof
    light/shadow bands, and selective jewel color highlights; Hand placed dithering, tiny tile
    noise, one pixel highlight ticks, and restrained pattern repetition; Locked isometric or three
    quarter diorama framing with stacked depth layers and tidy grid rhythm
  creative_brief: >-
    Apply JRPG Pixel Diorama Grammar as an art-style preset over prompt X: preserve the user's
    requested subject, then route mark-making, palette, surface, composition, mood, and final craft
    through Compact JRPG pixel art diorama language with nostalgic 16 bit readability and toy like
    spatial charm, gameplay-readable hierarchy, genre-specific surface language, UI-aware
    composition, and production-art clarity, Hand placed dithering, tiny tile noise, one pixel
    highlight ticks, and restrained pattern repetition without requiring the card image's original
    subject.
