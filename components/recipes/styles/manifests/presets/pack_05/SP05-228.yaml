visualDna:
  aesthetic: 'Madhouse Casshern Sins look (2008): tall slender robots and androids in a decaying world, Yoshihiko Umakoshi designs, washed pastel skies and elegiac painterly ruins.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures as tall slender androids with elegant limbs and weathered faces, moving through rust and ruin. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Washed pastel skies, bone white metal, rust orange and faded teal.
  lighting_and_shadow: Soft melancholic daylight through haze and dusty god rays.
  texture_and_material: Painterly ruins, rusted metal flakes and elegant clean cel lines.
  camera_and_composition: Lonely wide ruins with single figures and slow elegiac framing.
  atmosphere_and_mood: Keep the requested mood with elegiac machine sorrow.
  rendering_and_quality: Melancholy Madhouse television frame with painterly decay and lonely machines.
  key_features: Casshern Sins elegy; slender androids; ruin; washed pastel skies
  creative_brief: "Madhouse Casshern Sins look (2008): tall slender robots and androids in a decaying world, Yoshihiko Umakoshi designs, washed pastel skies and elegiac painterly ruins. Carry it through Casshern Sins elegy, slender androids, ruin, washed pastel skies. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
