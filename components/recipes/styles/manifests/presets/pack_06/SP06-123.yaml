visualDna:
  aesthetic: 'Meticulous fine-line painting on sized silk: every form drawn first in hair-thin even ink outlines, then filled with many thin layers of mineral and plant color.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: Soft layered color, malachite green, azurite blue, cinnabar and pale gold, on an aged honey-toned silk ground; gradations built by repeated thin washes.
  lighting_and_shadow: Even, shadowless light; volume made by gradating color inside each outline from edge to center.
  texture_and_material: Fine visible silk weave, flat mineral pigment slightly powdery, hair-fine ink contours of perfectly even thickness.
  camera_and_composition: Keep the requested framing; subjects sit in open space on the silk ground with careful, elegant spacing.
  atmosphere_and_mood: Refined, patient and serene, attention given to every feather and petal.
  rendering_and_quality: Every hair, vein and feather individually outlined and tinted; no loose brushwork, no cast shadows, no blending across outlines.
  creative_brief: "Meticulous fine-line painting on sized silk: every form drawn first in hair-thin even ink outlines, then filled with many thin layers of mineral and plant color. Carry it through hair-thin even ink outlines, layered mineral color washes, aged honey silk ground, gradated color inside each outline, shadowless meticulous detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hair-thin even ink outlines; layered mineral color washes; aged honey silk ground; gradated color inside each outline; shadowless meticulous detail
