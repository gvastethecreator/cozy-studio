visualDna:
  aesthetic: 'Orbiting Part Icons: one main form and one secondary element linked by an open asymmetric arc that represents a real relationship.'
  subject_treatment: Link the prompt's subject with one secondary element through an open arc that stands for a real relationship in the app.
  color_and_tone: Dominant primary mass, an accent secondary element and a lower-contrast arc.
  lighting_and_shadow: One shared light with consistent contact across both forms.
  texture_and_material: Sober surfaces and an arc thick enough to read at small size.
  camera_and_composition: Asymmetric open orbit with the secondary element away from key traits.
  atmosphere_and_mood: Contained dynamic relationship, lively but never cosmic by default.
  rendering_and_quality: Removing the arc clearly breaks the meaning of the icon.
  creative_brief: "Orbiting Part Icons: one main form and one secondary element linked by an open asymmetric arc that represents a real relationship. Carry it through open arc, main form, secondary element, real relationship. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: open arc; main form; secondary element; real relationship
