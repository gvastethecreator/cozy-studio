visualDna:
  aesthetic: 'Level blockout greybox: the location rebuilt from untextured boxes, ramps and cylinders with prototype grid materials, the stage before any art pass.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Neutral mid-grey primitives, orange and dark-grey prototype grid tiles on walkable floors, one flat blue sky.
  lighting_and_shadow: Single default directional light with simple sharp shadows and flat ambient; no mood lighting.
  texture_and_material: Faceless primitive volumes, grid tiles showing one-meter measurements, no detail beyond the block silhouettes.
  camera_and_composition: Keep the requested location and camera; landmarks become tall simple blocks, paths become ramps and steps.
  atmosphere_and_mood: Honest and structural, a place stripped to space and scale.
  rendering_and_quality: Editor-viewport render with crisp edges, no fog, no post effects and no textures besides the grid.
  creative_brief: "Level blockout greybox: the location rebuilt from untextured boxes, ramps and cylinders with prototype grid materials, the stage before any art pass. Carry it through grey primitive volumes, orange prototype grid floors, one-meter measure tiles, default directional light, no detail. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: grey primitive volumes; orange prototype grid floors; one-meter measure tiles; default directional light; no detail
