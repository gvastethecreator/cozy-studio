visualDna:
  aesthetic: 'Composited digital-effects anime: crisp cel characters layered over richly lit, near-photographic painted backgrounds with volumetric light shafts, drifting embers and shallow depth-of-field blur.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Nocturnal navy and ivory with glowing cyan or gold particle accents.
  lighting_and_shadow: Motivated volumetric beams, bloom around light sources, a controlled rim on characters.
  texture_and_material: Clean cel on figures, finely detailed painted backgrounds, particles soft and round.
  camera_and_composition: Keep the requested framing; lens-like depth with blurred foreground elements, sharp midground and bokeh in the distance.
  atmosphere_and_mood: Calm formality in the moment before a storm.
  rendering_and_quality: 'Tight compositing: sharp cel edges, soft volumetric light, particles and bloom kept in check.'
  key_features: cel figures over detailed painted backgrounds; volumetric light shafts; drifting embers and bokeh; navy and ivory; shallow depth of field
  creative_brief: "Composited digital-effects anime: crisp cel characters layered over richly lit, near-photographic painted backgrounds with volumetric light shafts, drifting embers and shallow depth-of-field blur. Carry it through cel figures over detailed painted backgrounds, volumetric light shafts, drifting embers and bokeh, navy and ivory, shallow depth of field. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
