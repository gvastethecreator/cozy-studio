visualDna:
  aesthetic: >-
    Monumental high-contrast graphics with broad beveled planes, a warm flare-like accent, and deep shadow.
  subject_treatment: >-
    Keep the prompt’s subject and silhouette recognizable. Emphasize its existing planes with
    bold contour cuts and directional highlights; add no heroic gear or weapon.
  color_and_tone: >-
    Contrast ember red, gold, and pale cream with ink black and charcoal; reserve the hottest
    values for a few focal edges.
  lighting_and_shadow: >-
    Use hard cel shadows against a sweeping warm highlight, treated as graphic color rather than
    a required flame or source.
  texture_and_material: >-
    Respect the original material while adding clean bevel-like highlights, sparse scuffs, and
    large smooth color planes.
  camera_and_composition: >-
    Honor the requested framing and scale. Use broad value masses and open darks to carry
    presence without changing the subject's pose or viewpoint.
  atmosphere_and_mood: >-
    Create intensity and resolve through scale contrast, warm light, and deliberate empty darks,
    without a sacrifice narrative.
  rendering_and_quality: >-
    Keep outlines crisp, shadows decisive, highlight shapes broad and clean, and glow tightly
    controlled.
  key_features: >-
    Broad beveled planes; warm flare highlights; ember-red and gold accents; deep cel shadows.
  creative_brief: >-
    Preserve the specified subject, action, and composition. Apply bold beveled highlights,
    ember-gold accents, and deep shadows; add no weapon, flames, or heroic pose.
