visualDna:
  aesthetic: 'Use this drawing language: Squigglevision drawing with continuously jittering contour, simple forms, shallow space, soft television texture, and deliberately low-action framing. Apply it to the supplied content without requiring a particular cast, place, or story.'
  subject_treatment: Apply persistent contour jitter, loose tremulous lines, simple forms, and low-key staging to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use muted beige, dusty teal, pencil gray, soft salmon, washed blue, and off-white as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use soft low-key fill with minimal shadow variation as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render low-fi TV scan softness, simple fill texture, vibrating edge artifacts, and hand-drawn jitter as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Let outlines tremble slightly around stable simple shapes; low-action conversational spacing is used only when the input supports it.
  atmosphere_and_mood: Understated, nervous, and wry; convey tension through jitter and pauses.
  rendering_and_quality: Finish with soft low-fi fill and a subtle vibrating contour without adding blur to the whole image.
  key_features: jittering contour; loose line drift; simple forms; shallow space; low-action framing; soft TV texture
  creative_brief: Render the supplied content with persistent contour jitter, loose tremulous lines, simple forms, and low-key staging. Use muted beige, dusty teal, pencil gray, soft salmon, washed blue, and off-white as style colors while honoring any explicit color instructions. Apply low-fi TV scan softness, simple fill texture, vibrating edge artifacts, and hand-drawn jitter as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
