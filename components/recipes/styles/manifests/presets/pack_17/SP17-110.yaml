visualDna:
  aesthetic: 'Old risograph zine found on a windowsill: sun-bleached aqua and butter yellow inks, soft low contrast, yellowed newsprint, and gentle fading toward the exposed edge.'
  subject_treatment: Render prompt X with soft, simplified shapes and loose halftone, as if the image has quietly faded for years; silhouettes remain clear, detail relaxes.
  color_and_tone: Faded aqua, butter yellow, pale overprint green, and yellowed newsprint; no deep blacks.
  lighting_and_shadow: Soft washed light with low contrast; the brightest areas are bare yellowed paper.
  texture_and_material: Soft newsprint fiber, loose halftone, gentle fade gradient, faint fold crease, and mild ink rub.
  camera_and_composition: Relaxed open composition with plenty of air, one clear subject, and a few secondary shapes.
  atmosphere_and_mood: Nostalgic, sleepy, sunny, and wistful.
  rendering_and_quality: 'Clean reproduction of an aged print: faded but not dirty, readable shapes, no grime or digital haze.'
  creative_brief: "Old risograph zine found on a windowsill: sun-bleached aqua and butter yellow inks, soft low contrast, yellowed newsprint, and gentle fading toward the exposed edge. Carry it through sun-bleached aqua and butter yellow, low contrast, yellowed newsprint, gentle edge fade, relaxed halftone. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sun-bleached aqua and butter yellow; low contrast; yellowed newsprint; gentle edge fade; relaxed halftone
