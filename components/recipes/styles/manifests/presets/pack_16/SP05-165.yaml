visualDna:
  aesthetic: >-
    A spectral 90s cel look uses pale blue contour echoes, long translucent sweeps and deep nocturnal
    shadow masses. Pressure is shown as one visual afterimage around the focal form, never as another
    being.
  subject_treatment: >-
    Preserve the requested subject and count. Offset a faint contour echo from the existing silhouette
    and let it fade into a few long lines; do not create a duplicate person or spirit character.
  color_and_tone: >-
    When open, favor ice blue, lavender-gray and deep navy, with warm accents kept small. Preserve the
    prompt palette and maintain a readable dark-to-light hierarchy.
  lighting_and_shadow: >-
    Keep solid cel shadows decisive while a translucent edge echo provides contrast. Follow requested
    lighting and avoid adding a moon, halo source or supernatural event.
  texture_and_material: >-
    Use clear painted cel shapes with soft transparent line trails and restrained background haze.
    Keep the echo graphic, not a new material or object.
  camera_and_composition: >-
    Let the existing contour echo create depth around the focal form within the supplied frame.
    Preserve camera and placement; do not add a landscape or oversized figure.
  atmosphere_and_mood: >-
    Suggest pressure through stillness, scale contrast and a fading outline. Preserve the requested
    emotion; do not impose rivalry, haunting or spiritual lore.
  rendering_and_quality: >-
    Separate solid outlines from translucent trails and keep the main form dominant. Avoid blurred
    duplicate silhouettes or diffuse full-frame glow.
  key_features: >-
    pale blue contour echo; translucent sweeping trails; dark nocturnal cel shapes with a clear focal
    silhouette
  creative_brief: "Apply the spectral contour and cel-shadow treatment to the requested content. Keep its subject count, identity, action, setting and composition; add no spirit, rival or supernatural scene. Use it as a reusable look on any subject."
