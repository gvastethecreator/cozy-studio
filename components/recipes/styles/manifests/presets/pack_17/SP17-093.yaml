visualDna:
  aesthetic: >-
    For Honor (2017) painted art direction: credible medieval construction pushed into massive
    heroic scale, practical martial silhouettes and battered faction colors against monumental
    fortifications.
  subject_treatment: >-
    Preserve explicit identity and action. Favor functional layers, load-bearing joins and
    substantial weight; exaggerate scale and silhouette without turning every object into decorative
    fantasy armor.
  color_and_tone: >-
    Cold iron and grey-brown stone with muted heraldic yellow, blue or red, broken by warm sunlight
    and pale battle smoke.
  lighting_and_shadow: >-
    Broad daylight across fortified masses, dark occluded foreground and selective bright openings;
    make silhouettes and occupied ground readable.
  texture_and_material: >-
    Hammered plate over mail and quilted fabric, worn painted surfaces and massive fitted stone;
    visible fastenings and localized field damage.
  camera_and_composition: >-
    Layered foreground action, midground ramparts and a large pale atmospheric opening; compressed
    monumental scale and clear lines of force. Preserve explicit framing.
  atmosphere_and_mood: >-
    Embattled endurance, discipline and physical impact; practical martial grandeur rather than
    magical apocalypse.
  rendering_and_quality: >-
    Painterly production concept art with broad value planning and selectively resolved
    construction. Brush-built atmosphere around concrete silhouettes, not uniformly detailed
    historical photography.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
