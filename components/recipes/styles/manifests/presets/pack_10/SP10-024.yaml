visualDna:
  aesthetic: 'CRT monitor: phosphor scanlines, curved glass, glow and RGB subpixel mask.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: the image is shown on a curved CRT with visible scanlines and phosphor glow."
  color_and_tone: Phosphor-bright colors with bloom, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Scanlines, shadow mask dots and curved-glass vignette, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Retro, glowing, nostalgic and warm, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: CRT scanlines; phosphor glow; curved glass
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies CRT Monitor as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
