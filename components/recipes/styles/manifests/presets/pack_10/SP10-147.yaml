visualDna:
  aesthetic: 'Divisionism: short directional dashes and dots of separated color.'
  subject_treatment: "Rebuild the prompt's subject and setting entirely from discrete units so it stays recognizable at card size — unit: short directional dashes of pure color; joints: small gaps."
  color_and_tone: Sunlit complementary pairs, with each unit holding one color so the image is built by juxtaposition.
  lighting_and_shadow: Vibrating light from separated colors, as the physical behavior of this unit.
  texture_and_material: short directional dashes of pure color, set with small gaps, at a unit size that keeps the subject readable.
  camera_and_composition: Keep the prompt framing; unit size and direction follow the subject contours so forms read clearly.
  atmosphere_and_mood: Radiant, energetic, luminous and warm, coming from the handcrafted construction.
  rendering_and_quality: Crisp, consistent units and joints across the whole image, with no smeared or random fill.
  creative_brief: "Divisionism: short directional dashes and dots of separated color. Carry it through directional color dashes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: directional color dashes
