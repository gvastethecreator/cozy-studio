visualDna:
  aesthetic: 'Modern architectural photography: buildings of concrete, glass and steel photographed with corrected verticals and hard sun sculpting planes.'
  subject_treatment: Keep the prompt subject and setting; show built form as clean volumes and planes, with people only as small scale markers.
  color_and_tone: Cool neutral concrete, deep sky blue, black glass reflections, crisp whites.
  lighting_and_shadow: Hard direct sun raking across facades, shadow edges as graphic lines, reflections on glass.
  texture_and_material: Board-formed concrete grain, steel joints and glass reflections resolved precisely.
  camera_and_composition: Shift-lens perspective correction, perfectly vertical lines, symmetrical or strong diagonal composition, lots of sky or negative space.
  atmosphere_and_mood: Imposing and calm, geometry and shadow doing all of the talking.
  rendering_and_quality: Architectural-magazine clarity; distinct from cosy cabins and from HDR listing photos.
  key_features: corrected verticals; hard sun on concrete planes; glass reflections; symmetrical geometry; tiny human scale
  creative_brief: "Modern architectural photography: buildings of concrete, glass and steel photographed with corrected verticals and hard sun sculpting planes. Carry it through corrected verticals, hard sun on concrete planes, glass reflections, symmetrical geometry, tiny human scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
