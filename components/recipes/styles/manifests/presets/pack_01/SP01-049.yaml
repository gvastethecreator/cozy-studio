visualDna:
  aesthetic: 'Bright food photography: food styled for appetite and lit from one soft window side, shot at 45 degrees or straight down, as in a cookbook.'
  subject_treatment: Keep the prompt subject; if it is food, style it fresh and at its best; if not, borrow food-styling light, surfaces and props around it without turning it into food.
  color_and_tone: Warm, fresh, saturated color; creamy whites, golden crusts, glossy greens; shadows soft and slightly warm.
  lighting_and_shadow: Large diffused side window, white bounce card opposite, gentle backlight for steam and gloss.
  texture_and_material: Crumb, crust, glaze, droplets and steam rendered crisp; linen, wood and stoneware props with real wear.
  camera_and_composition: 45-degree or overhead angle, 50–100 mm, shallow focus falling off behind the hero bite, a few crumbs or herbs as scatter.
  atmosphere_and_mood: Warm and inviting, the plate just set down and still steaming.
  rendering_and_quality: Cookbook polish with real texture; no plastic-looking food or oversaturated grade.
  key_features: soft side window with bounce; 45-degree or overhead angle; steam and glaze highlights; linen and stoneware props; shallow focus
  creative_brief: "Bright food photography: food styled for appetite and lit from one soft window side, shot at 45 degrees or straight down, as in a cookbook. Carry it through soft side window with bounce, 45-degree or overhead angle, steam and glaze highlights, linen and stoneware props, shallow focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
