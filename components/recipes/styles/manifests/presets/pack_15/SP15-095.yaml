visualDna:
  aesthetic:
    A fungal design language built from load-bearing mycelial branching, woven hyphae, layered cap-and-gill
    rhythms, pore clusters and spore-bearing forms; growth supplies structure.
  subject_treatment:
    Preserve subject and locks. Redesign open structures through branching supports, fibrous
    joins, nested lamellae and porous grown composites, adapting fungal architecture instead of adding a mushroom
    prop. Keep existing silhouettes and functions recognizable; use load-bearing hyphae, pores and gill rhythms
    on existing forms rather than cap-shaped furniture or decor unless requested.
  color_and_tone:
    Use mycelium ivory, umber, rust, bruise violet and muted spore hues with value separation.
    Respect explicit palettes; avoid automatic toxic green.
  lighting_and_shadow:
    Honor specified lighting. Let gills, pores or spore veils catch light when present;
    do not invent glow or floating spores.
  texture_and_material:
    Contrast woven hyphae, velvety caps, fine gills, porous rind and spore dust with controlled
    marks. Apply fungal material logic to open choices, not as a surface filter.
  camera_and_composition:
    Preserve view and scale. Arrange branching supports and nested growth rhythms around
    the focal form; no forest, mushroom cluster or macro view is required.
  atmosphere_and_mood:
    Suggest interdependence, persistence, abundance or uncanny growth according to requested
    tone; woodland fantasy is not implied.
  rendering_and_quality:
    Use branching linework, matte planes and crisp radial lamellae with sparse pore accents.
    Keep structure legible; avoid spore noise and generic biotech circuitry.
avoidRules:
  - Do not replace the subject with a mushroom or impose a forest floor.
  - Do not add floating spores, bioluminescence or decomposition as defaults.
  - Keep hyphae structural or connective rather than decorative wallpaper.
