visualDna:
  aesthetic: 'Overscale Index Wayfinding: huge index letters or numbers identify each zone from afar while small secondary text explains the destinations.'
  subject_treatment: Identify the prompt's zones with a huge index letter or number and readable secondary destinations beside it, every character and arrow exact.
  color_and_tone: High-contrast index, sober secondaries and one route accent with arrow and text.
  lighting_and_shadow: The real or supplied light kept, the index readable up close too.
  texture_and_material: Flat graphics with crisp edges and whole numerals.
  camera_and_composition: Index on a surface visible from the approach, directory at a test height.
  atmosphere_and_mood: Recognition from far away followed by easy close reading.
  rendering_and_quality: Clean sign with complete characters and exact destination matches.
  creative_brief: "Overscale Index Wayfinding: huge index letters or numbers identify each zone from afar while small secondary text explains the destinations. Carry it through giant index, small secondaries, far and near reading, exact arrows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: giant index; small secondaries; far and near reading; exact arrows
