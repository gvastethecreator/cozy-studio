visualDna:
  aesthetic: 'Color-block set still life: an object placed on a built set of flat colored paper planes and blocks, lit with hard light for crisp graphic shadows.'
  subject_treatment: Keep the prompt's object or subject exactly — shape, proportions, color, materials and any supplied design — and present it as the hero of a commercial photograph.
  color_and_tone: Two or three bold flat colors (mustard, teal, coral, cobalt, pink) that contrast with the object.
  lighting_and_shadow: Single hard light at a steep angle creating long, clean-edged shadows across the planes.
  texture_and_material: Matte paper and painted board planes; the object's material crisp against them.
  camera_and_composition: Straight-on or slight elevation, geometric steps, arches or cylinders as plinths, strong negative space.
  atmosphere_and_mood: Playful and graphic, a small object turned into a bold sculpture by color and shadow.
  rendering_and_quality: Clean set photography; not CGI, no gradient backdrops.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Color-Block Set Still Life as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: flat colored paper planes; hard steep light; long clean shadows; geometric plinths; bold contrast
