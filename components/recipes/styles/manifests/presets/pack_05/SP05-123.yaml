visualDna:
  aesthetic: 'Fire-brigade anime: flames drawn as flat stylized tongues with a hard white-hot core, orange body and scarlet edge, set in radiating halo rings over strong dark contours and film grain.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Charcoal and ivory with bright orange, scarlet and warm yellow; every flame core pure white.
  lighting_and_shadow: 'Fire as the primary source: warm uplight, decisive silhouette shadows, subtle light-leak bloom.'
  texture_and_material: Dense flat color, light speckle grain and painted spark flecks.
  camera_and_composition: Keep the requested framing; concentric halo rings centered on the focal area with broad negative space.
  atmosphere_and_mood: Fervent, almost liturgical heat, fire treated as ritual rather than disaster.
  rendering_and_quality: Strong silhouette cuts, limited warm bloom and carefully placed ring geometry.
  key_features: white-hot flame cores; flat stylized flame tongues; radiating halo rings; charcoal and orange palette; light-leak film grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies White-Core Flame Halo Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
