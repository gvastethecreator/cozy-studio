visualDna:
  aesthetic: 'Redscale film: color negative loaded backwards and exposed through its base, so the red-sensitive layer dominates and the whole scene burns red, orange and amber.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Brick red shadows, orange midtones, yellow to cream highlights, almost no blue or green; more exposure shifts the image toward yellow.
  lighting_and_shadow: Needs generous light and overexposure; bright skies turn pale yellow, shadows dense rust-brown.
  texture_and_material: Grainy, slightly soft emulsion with warm dye clouds; the scene reads as if shot through heat.
  camera_and_composition: Keep the requested framing; bright open scenes and skies show the red-to-yellow shift best.
  atmosphere_and_mood: Scorched and strange, a familiar scene seen through burning heat.
  rendering_and_quality: In-camera reversed-film color, not a red duotone filter; tonal range preserved inside the warm band.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Redscale Film as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: red-orange-amber palette; yellow highlights; rust-brown shadows; no blues; warm grain
