visualDna:
  aesthetic: 'Film noir: 1940s black-and-white crime cinema built from one hard key light, slatted shadows and oppressive darkness.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Monochrome with deep charcoal blacks, silver highlights and very few midtones.
  lighting_and_shadow: Hard low-angle key through blinds, banisters or window frames throwing striped shadows; faces half lost in black.
  texture_and_material: Fine silver grain, cigarette smoke or fog catching the key light, glossy dark surfaces.
  camera_and_composition: Low or tilted angles, 35–40 mm, deep focus with a looming foreground shape and a subject trapped in shadow.
  atmosphere_and_mood: Fatalistic and tense, danger hiding in every band of shadow.
  rendering_and_quality: Projected 35 mm black-and-white print; an everyday domestic action keeps its setting under the noir light.
  key_features: slatted hard key; black-and-white low key; tilted low angles; smoke in the beam; subject half in shadow
  creative_brief: "Film noir: 1940s black-and-white crime cinema built from one hard key light, slatted shadows and oppressive darkness. Carry it through slatted hard key, black-and-white low key, tilted low angles, smoke in the beam, subject half in shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
