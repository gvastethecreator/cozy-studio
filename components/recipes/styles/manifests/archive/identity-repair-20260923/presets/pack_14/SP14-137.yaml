visualDna:
  aesthetic: >-
    Thin translucent painted layers overlap broad opaque shapes. Partial concealment and selective clear
    edges suggest depth without a deep stage or photographic haze.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Retain the requested palette, mixing existing hues gently at overlaps while preserving distinct
    foreground and background values.
  lighting_and_shadow: >-
    Use the requested light direction with soft value transitions. Layer translucency is a painting
    method, not an added lamp, fog or luminous veil.
  texture_and_material: >-
    Keep represented materials recognizable beneath controlled glazing. Do not turn clothing, bodies or
    solid objects into transparent matter.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Place soft overlays only across existing
    secondary forms, preserving focal anatomy, layout and requested legibility.
  atmosphere_and_mood: Ambiguous, poised depth with a calm surface; respect a brighter or more playful requested mood.
  rendering_and_quality: >-
    Use a small number of broad glazes and crisp counteredges. Avoid stacked uniform gradients and milky
    low contrast.
avoidRules:
  - transparent solid anatomy
  - uniform fog overlay
  - fixed central altar composition
