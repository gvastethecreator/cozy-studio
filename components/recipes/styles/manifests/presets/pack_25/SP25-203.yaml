visualDna:
  aesthetic: 'Image-Index Publications: images, numbers and short entries form a consultable system with a steady rhythm, like a well-made catalog.'
  subject_treatment: Relate the prompt's images, numbers and short entries through one consultable index, each image with exactly one entry and a unique number.
  color_and_tone: Sober palette and legible numbers, with an optional section accent.
  lighting_and_shadow: Images keep their own light on a flat, neutral layout.
  texture_and_material: Clean image edges, sharp text and a discreet paper support.
  camera_and_composition: Images and entries aligned, one dominant image and varied spacing.
  atmosphere_and_mood: Clear consultation and an archive rhythm, tidy and satisfying.
  rendering_and_quality: Crisp catalog page where no number repeats and every image has its entry.
  creative_brief: "Image-Index Publications: images, numbers and short entries form a consultable system with a steady rhythm, like a well-made catalog. Carry it through numbered images, short entries, one dominant image, consultable index. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: numbered images; short entries; one dominant image; consultable index
avoidRules:
  - images with no entry
  - decorative numbers
  - illegible thumbnails
  - invented quotes, authors or data
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
