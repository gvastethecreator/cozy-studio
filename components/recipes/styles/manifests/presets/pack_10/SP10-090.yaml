  aesthetic: 'Neo-geo minimalism: cool, slick geometric forms with fluorescent accents and industrial surfaces.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is reduced to slick geometric cells, bars and conduits."
  color_and_tone: Fluorescent accents on grey and white, used consistently across subject and background.
  lighting_and_shadow: Clean flat light, expressed through the style rather than photographic lighting.
  texture_and_material: Smooth industrial surfaces, visible at a glance as the signature of the style.
  camera_and_composition: Grid-based cells, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Cool, detached, slick and ironic, driven by the construction, color and rhythm.
  rendering_and_quality: Clean finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Neo-geo minimalism: cool, slick geometric forms with fluorescent accents and industrial surfaces. Carry it through geometric cells, fluorescent accents, industrial slick. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
