visualDna:
  aesthetic: >-
    A rough 90s cel finish uses heavy broken ink, chiseled shadow planes and sparse iron-gray or
    rust-red accents. Its ruin signal is distressed rendering texture, not a ruined setting.
  subject_treatment: >-
    Preserve the requested identity and construction. Emphasize existing edges with rough angular line
    and dense shadow; do not damage, armor or age the subject.
  color_and_tone: >-
    When color is open, use soot black, iron gray and a restrained rust red. Honor requested hues and
    keep muted contrast rather than adding blood or fire.
  lighting_and_shadow: >-
    Use broad, hard shadow masses with irregular but readable boundaries. Keep the supplied light
    direction and avoid dramatic flames or backlight.
  texture_and_material: >-
    Layer dry ink, sparse crosshatching and chipped-looking paint marks as surface rendering. Do not
    make intact objects physically broken or corroded.
  camera_and_composition: >-
    Use weighty diagonal shapes and dense focal grouping within the existing composition. Preserve the
    requested camera and location.
  atmosphere_and_mood: >-
    Let gravity come from visual weight and rough edges only when it fits the prompt. Do not impose
    tragedy, war or desolation.
  rendering_and_quality: >-
    Keep the silhouette legible beneath heavy blacks; vary line pressure and confine hatching to
    selected planes. Avoid muddy grain.
  key_features: >-
    broken heavy ink; chiseled shadow planes; iron-gray and rust-red accents with selective
    crosshatching
  creative_brief: "Apply distressed cel linework and weighty shadow planes to the requested content. Preserve its identity, materials, action and setting; add no ruin, armor, battle or damage. Use it as a reusable look on any subject."
