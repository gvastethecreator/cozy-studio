visualDna:
  aesthetic: >-
    Translate painterly masses into controlled discrete tonal patterns, applying ordered dithering only
    where it describes a transition rather than replacing the image with random pixel noise.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Retain the original
    shape relationships while simplifying tonal transitions into patterned marks.
  color_and_tone: >-
    Preserve the requested hues and overall value relationships. Consolidate nearby tones only as needed
    for the pattern; do not substitute colors or impose a fixed palette.
  lighting_and_shadow: >-
    Follow the requested illumination and use orderly tonal patterns to express its existing gradients
    and shadows without adding a new light source.
  texture_and_material: >-
    Keep the dither pattern consistent in scale and direction within each tonal region. Do not add a
    separate print texture, screen noise or material change.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Quantized shading does not authorize
    a new crop, layout or arrangement.
  atmosphere_and_mood: >-
    Retain the requested setting and emotional tone; patterned transitions do not add a retro display
    treatment or new narrative.
  rendering_and_quality: >-
    Resolve silhouette and broad painted values first, then use selective repeatable patterns for tonal
    transitions. Keep the pattern legible and avoid random speckle.
avoidRules:
  - random speckle presented as ordered dithering
  - dithering that obscures the main silhouette
  - details that alter identity or function
