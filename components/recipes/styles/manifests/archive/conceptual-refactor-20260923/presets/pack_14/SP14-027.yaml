visualDna:
  aesthetic: >-
    Ashen Worldtree Threshold acts as a transferable mythic-noir router: liminal authority and
    permission-tested boundary magic, ashen translated into dark symbolic behavior plus worldtree
    translated into dark symbolic behavior fused with Norse saga noir with rune law, ash-world
    memory, frost authority, longnight endurance, and iron oath momentum; it carries symbol, omen,
    ritual authority, and mature editorial restraint without locking prompt content to its sample
    image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    boundary-crossing contour and guarded transition behavior, ashen shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus worldtree shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through ash gray, bone white, and dead ember accents, worldtree-weighted accent roles
    over disciplined dark values plus threshold-weighted accent roles over disciplined dark values
    together with frost blue, ash gray, iron black, blood-rust, yew green, glacier white, raven
    dark, and low ember warmth; values stay separated, accents feel intentional, and the dark
    palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use edge glows that reveal passage pressure without opening the whole image, ashen-weighted rim
    behavior, occult glow, and charged shadow plus worldtree-weighted rim behavior, occult glow, and
    charged shadow with longnight rim light, cold sky breaks, forge glow, ice reflection, funeral
    ember, and hard northern silhouette cuts; shadows must carry omen weight, rims should clarify
    form, and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render soot, matte residue, carbon dust, and weathered relic surfaces, charred bark, rune cuts,
    and frost dust plus worn threshold edges, seal residue, and rubbed boundary marks alongside
    rune-carved wood, hammered iron, ice crust, ash, fur-like matte softness, bone, soot, quench
    steam, and weathered stone; surface scale, patina, residue, gloss, grain, and carved or sealed
    edges must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with world-axis verticality and ash-branch division plus threshold division, guarded
    negative space, and transition lines plus saga-panel rhythm, runic axes, oath-line diagonals,
    worldtree verticality, weighing symmetry, and last-stand mass pressure; the style should support
    portraits, objects, architecture, creatures, symbols, and full scenes through reusable spatial
    grammar instead of one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through exhausted prophecy and end-cycle gravity plus entry denied, permission
    tested, and liminal tension and stoic dread, winter sovereignty, fatal courage, ancestral
    memory, lawful violence, and the patience of old vows; the image can become severe, sensual,
    sacred, violent, quiet, or strange when prompt X asks for it, while the preset supplies mythic
