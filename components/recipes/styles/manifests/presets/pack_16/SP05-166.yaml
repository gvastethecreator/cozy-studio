visualDna:
  aesthetic: >-
    A restrained 90s cel drama style uses soft-edged transitions inside clean shadow groups, calm
    contours and a narrow cool rim. Emotion rests in small shifts of form rather than spectacle.
  subject_treatment: >-
    Preserve the requested identity, proportions and expression. Use simple, accurate contours and
    restrained interior detail; do not turn a quiet subject into a redemptive hero.
  color_and_tone: >-
    When color is open, use muted blue-violet shadows, gentle warm neutrals and a limited red accent.
    Preserve specified hues and avoid dramatic saturation.
  lighting_and_shadow: >-
    Use broad, soft transitions alongside clearly bounded cel shadows. Respect the requested light and
    avoid a dramatic backlight or added glow.
  texture_and_material: >-
    Keep fills smooth and ink clean, with subtle grain only in broad painted areas. Retain each
    material's surface and do not add distress.
  camera_and_composition: >-
    Maintain the requested crop and spacing, with attention on clear form and quiet detail. Do not
    force a close portrait or a lone figure.
  atmosphere_and_mood: >-
    Let restraint come from an absence of extra marks and a measured value range. Preserve the
    prompt's mood; add no sorrow, redemption or conflict.
  rendering_and_quality: >-
    Use legible anatomy or object structure, gentle value transitions and minimal effects. Keep the
    finish polished without denoising away all line character.
  key_features: >-
    quiet contour work; clean cel groups with gentle transitions; cool rim and restrained warm accents
  creative_brief: "Restyle the requested content with calm cel drawing, measured shadows and quiet color. Preserve its identity, action, mood and camera; introduce no redemption narrative, costume or prop. Use it as a reusable look on any subject."
