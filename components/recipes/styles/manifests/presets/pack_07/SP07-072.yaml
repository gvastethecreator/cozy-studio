visualDna:
  aesthetic: 'Bottle curio miniature: the subject built at tiny scale inside a corked glass bottle, as if assembled through the neck with tweezers and fine rigging.'
  subject_treatment: Keep the requested subject, its identity and pose; this preset owns the corked-bottle presentation that encloses it, and a requested object stays that object instead of becoming a building.
  color_and_tone: Pale aqua glass tint over the scene, cork brown, warm wood base; the bottle shifts colors toward green at its thickest.
  lighting_and_shadow: Soft side light with long bright reflections down the curved glass and a caustic glow on the tabletop.
  texture_and_material: Curved glass refraction bending the miniature at the edges, bubbles in the glass, cork grain, thread-fine rigging.
  camera_and_composition: The whole bottle is visible and lying or standing on a surface; the subject sits within it and never outside.
  atmosphere_and_mood: Curious and patient, a collector cabinet piece full of impossible care.
  rendering_and_quality: Still-life photograph with accurate glass refraction; the scene stays contained, never an open seascape.
  key_features: subject enclosed in a corked bottle; aqua glass tint; refraction bending the miniature; fine rigging; caustic glow on the table
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bottle-Glass Curio Miniature as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
