visualDna:
  aesthetic:
    A heavy interwar industrial-retro language of compact engine masses, pressed steel, piston rhythm,
    exhaust routes, riveted plate and stark signal marks; mechanical force is not a required war story.
  subject_treatment:
    Preserve requested identity, action and locked form. Restyle open structures with compact
    engine housings, plate-built contours, bolted joints and purposeful exhaust or fuel lines. Keep the
    mechanical cue integrated into an existing subject or fixture rather than adding a factory set or separate
    machinery. When no mechanism exists, convey engine mass through blocky silhouettes and print rhythm
    instead of inventing equipment; vehicles and military subjects remain optional.
  color_and_tone:
    Build charcoal, iron and worn-steel masses with muted olive, tobacco, aged cream and a small
    warning accent. Preserve palette locks and separate silhouette from shadow.
  lighting_and_shadow:
    Respect specified lighting and sources. Use broad cut shadows and hard-surface highlights;
    when open, favor smoky contrast without forcing night, searchlights or fog.
  texture_and_material:
    Distinguish pressed steel, cast iron, rubber, canvas and worn lacquer with scuffed
    paint and oil-dark recesses. Give open material choices a heavy finish without uniform grime.
  camera_and_composition:
    Preserve viewpoint and crop. Use compact volumes and purposeful diagonals without
    imposing a train, convoy, airship, street or poster layout.
  atmosphere_and_mood:
    Suggest industrial urgency, endurance or speed through mass and mechanical rhythm while
    retaining the requested tone. Wartime drama and noir are optional.
  rendering_and_quality:
    Use bold screenprint/lithograph masses, hard contours, reduced shadows and selective
    scuffed-print variation. Keep engine structure readable; do not invent text or signage unless requested.
avoidRules:
  - Do not force a train, convoy, airship, uniform, military insignia or wartime plot.
  - Do not require night, fog, searchlights or a fixed signal system.
  - Avoid dense grime and micro-rivets; add no text or signage unless requested.
