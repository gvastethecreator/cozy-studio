visualDna:
  aesthetic: >-
    Death Stranding (2019) third-person traversal gameplay: burdened technical silhouette against
    broad wet volcanic terrain, sparse engineered route markers and overcast mineral colors.
  subject_treatment: >-
    Preserve requested identity and action. Where equipment is unspecified, use credible modular
    load, tensioned straps and a center of gravity that visibly affects balance; footsteps and
    traversable ground remain clear.
  color_and_tone: >-
    Natural mineral gray, muted green, cold sky, restrained warm signals; preserve terrain value
    separation.
  lighting_and_shadow: >-
    Weather-shaped open light and soft distance falloff; terrain shadows remain useful for judging
    path.
  texture_and_material: Modern PS4-era real-time terrain and equipment detail, weather response, restrained particles.
  camera_and_composition: >-
    Third-person follow framing with enough distance to read footing and next route;
    horizon/obstacles aid navigation.
  atmosphere_and_mood: >-
    Lonely but purposeful movement; occasional shared infrastructure suggests asynchronous
    connection.
  rendering_and_quality: >-
    Original 2019 real-time capture character; exclude Director's Cut assumptions and do not call
    this official footage.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
