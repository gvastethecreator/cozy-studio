visualDna:
  aesthetic: >-
    Snow (Powder) behaves like a controlled elemental effect layer: start from Fresh snowfall,
    Fluffy, and Compression, then turn motion, temperature, particles, translucency, refraction,
    glow, and transient energy behavior into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Soft mounds: preserve identity and pose while letting forms
    emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use White, Blue shadow as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Subsurface scattering define the light response: highlights, occlusion, translucency,
    specular scatter, matte falloff, or rim behavior should reveal Snow (Powder) without hiding the
    prompt subject.
  texture_and_material: >-
    Render Fluffy through flow direction, particle density, turbulence, glow falloff, splashes,
    trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Compression as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Quiet, cold by using movement, danger, spectacle, instability, temperature, and
    sensory intensity; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Winter, soft material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Fresh snowfall; Soft mounds; Fluffy; Subsurface scattering; Compression
  creative_brief: >-
    Route any subject through Snow (Powder) as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Compose the soft geometry of fresh powder
    snow mounding in gentle drifts, where subsurface scattering turns the white into pale blue in
    the shadows and each flake catches a microscopic sparkle of winter light. The surface must feel
    cold and fluffy, a blanket of frozen silence that softens every edge it touches. Capture the
    quiet of new snow, the world rendered in a single note of white. Use Snow as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
