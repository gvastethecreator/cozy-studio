visualDna:
  aesthetic: 'Anime extreme-wide staging: the subject is tiny, under a twentieth of the frame height, while the path of its movement sweeps one grand clean arc across a vast landscape or interior.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the extreme wide shot where a tiny subject draws one grand arc through vast space, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the landscape stays in soft layered values while the subject and its arc carry the only sharp contrast.
  lighting_and_shadow: Broad atmospheric light with aerial perspective; a small bright highlight marks the subject.
  texture_and_material: Painted background layers with atmospheric haze; the arc is formed by existing material such as dust, wake, spray or footprints.
  camera_and_composition: Very wide establishing view from a high distant vantage, the arc spanning at least two thirds of the frame width.
  atmosphere_and_mood: Epic scale and solitude, one small life moving through a huge world.
  rendering_and_quality: Clean readable arc, a tiny but unmistakable subject, and painterly depth layers.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tiny-Figure Grand Arc Wide as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: tiny subject under one twentieth of frame height; one grand movement arc; vast layered space; high distant vantage; arc from existing material
