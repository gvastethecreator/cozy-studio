visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around repeated parallel
    dry-brush marks of measured length, interrupted by a single clean dark anchor where
    the prompt has a focal edge. For color and surface, retain the prompt
    palette while gently bleaching pigment toward warm paper, faded ochre, and softened
    charcoal. Discipline is a visual cadence, not a command to make subjects cruel,
    uniformed, or emotionally severe
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through repeated parallel dry-brush marks of
    measured length, interrupted by a single clean dark anchor where the prompt has a
    focal edge; use detail selectively and keep the actual form easy to read. Add no
    unrequested subject or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain the prompt palette
    while gently bleaching pigment toward warm paper, faded ochre, and softened
    charcoal. Keep values legible across the prompted light and dark range; do not crush
    midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; compress highlight contrast as
    if pigment has faded under exposure, without adding sunlight or changing the source
    lighting. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use matte paper tooth and disciplined abrasion;
    keep repeated strokes varied enough to avoid a mechanical pattern fill. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    number and placement of subjects; let mark repetition reinforce existing alignments
    without forming ranks or formations. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Discipline is a visual cadence, not a
    command to make subjects cruel, uniformed, or emotionally severe. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and repeated parallel dry-brush marks of
    measured length, interrupted by a single clean dark anchor where the prompt has a
    focal edge; keep focal edges crisp, texture controlled, and dark values legible.
    Avoid photoreal or 3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    repeated parallel dry-brush marks of measured length, interrupted by a single clean
    dark anchor where the prompt has a focal edge; retain the prompt palette while
    gently bleaching pigment toward warm paper, faded ochre, and softened charcoal;
    compress highlight contrast as if pigment has faded under exposure, without adding
    sunlight or changing the source lighting; use matte paper tooth and disciplined
    abrasion; keep repeated strokes varied enough to avoid a mechanical pattern fill;
    and preserve number and placement of subjects; let mark repetition reinforce
    existing alignments without forming ranks or formations. The five cues should read
    as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use repeated parallel dry-brush marks of
    measured length, interrupted by a single clean dark anchor where the prompt has a
    focal edge, retain the prompt palette while gently bleaching pigment toward warm
    paper, faded ochre, and softened charcoal, compress highlight contrast as if pigment
    has faded under exposure, without adding sunlight or changing the source lighting,
    and use matte paper tooth and disciplined abrasion; keep repeated strokes varied
    enough to avoid a mechanical pattern fill; the prompt supplies all scene content. Do
    not add unrequested characters, objects, source-specific lore, readable symbols, or
    a default action.
