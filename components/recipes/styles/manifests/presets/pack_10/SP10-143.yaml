  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject is abstracted into schematic symbols and wires."
  color_and_tone: Black lines on white, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Clean vector schematic, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Technical, precise, clever and clean, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Wiring schematic: symbols for resistors, switches and nodes connected by right-angle lines. Carry it through schematic symbols, right-angle wires, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
