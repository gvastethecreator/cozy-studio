visualDna:
  aesthetic: High-contrast underground dungeon zine with clean black xerox ink, acid colors, occult symbols, and monster-card energy.
  subject_treatment: Translate any subject into acid zine icon logic with chunky silhouette weight, stare-like graphic emphasis, occult key-shape rhythm, thick contour breaks, and handmade weirdness without forcing a mascot.
  color_and_tone: Dominant black ink over neon lime, lavender, hot pink, poison green, and occasional cyan or red.
  lighting_and_shadow: Light is graphic rather than realistic, built from flat color fields and black silhouette mass.
  texture_and_material: Controlled photocopier texture, tidy halftone, restrained stipple, hand-inked hatching, clean paper tooth, and misregistered fills.
  camera_and_composition: Poster-front icon hierarchy, boxed-panel pressure, tight graphic crop, thick border logic, and zine pacing without requiring a monster subject.
  atmosphere_and_mood: Carry the prompt through Occult, punk, playful dark, dungeon crawling, and abrasive; abrasive underground humor, occult craft, lurid dungeon play, copier damage, and punk handmade danger; the tone should follow prompt X while preserving the preset's medieval-zine identity.
  rendering_and_quality: Crisp screenprint-zine finish with heavy denoise, controlled print texture, and readable clean black shapes.
  creative_brief: 'Reusable visual system for any subject needing acid zine punch, boxed graphic force, thick handmade borders, and occult print weirdness. Apply after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies a style grammar of Acid Dungeon Zine; High contrast underground dungeon zine with clean black xerox ink; acid colors; occult symbols; monster card energy; acid zine icon logic with chunky silhouette weight, mood, material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster, readable text, or sample-card composition.'
  key_features: Acid Dungeon Zine; High contrast underground dungeon zine with clean black xerox ink; acid colors; occult symbols; monster card energy; acid zine icon logic with chunky silhouette weight
