  color_and_tone: Madder red, indigo, saffron, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Flatweave wool with slits, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at a glance.
  atmosphere_and_mood: Nomadic, bold, warm and ancient, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  creative_brief: "Kilim: flat-woven geometric diamonds, hooks and stepped motifs. Carry it through kilim stepped diamonds, flatweave. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
