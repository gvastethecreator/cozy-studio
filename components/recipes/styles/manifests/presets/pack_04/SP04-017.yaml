visualDna:
  aesthetic: 'Classic watercolor storybook: light pencil underdrawing tinted with transparent washes, small animals and cottages observed with naturalist care.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Botanical pastels, sage, fawn and soft blue, warm neutrals, white paper left for highlights.
  lighting_and_shadow: Soft diffuse daylight, pale cool shadow washes, paper white as the brightest light.
  texture_and_material: Cold-press paper grain, feathered wash edges fading into white vignettes, fine pencil detail on fur.
  camera_and_composition: Small intimate vignettes floating on white paper, subject at eye level of a small animal.
  atmosphere_and_mood: Tender, pastoral and comforting, a quiet afternoon in the hedgerow.
  rendering_and_quality: Delicate observed drawing with transparent layered washes; no digital flats and no hard outlines.
  key_features: pencil underdrawing; transparent watercolor washes; vignette on white paper; naturalist animal detail; botanical pastels
  creative_brief: "Classic watercolor storybook: light pencil underdrawing tinted with transparent washes, small animals and cottages observed with naturalist care. Carry it through pencil underdrawing, transparent watercolor washes, vignette on white paper, naturalist animal detail, botanical pastels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
