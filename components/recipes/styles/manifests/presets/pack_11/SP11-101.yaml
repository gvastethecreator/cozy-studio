  lighting_and_shadow: Flat flash light, expressed through the style rather than photographic lighting.
  texture_and_material: Wobbly gelatin, printed grain and faded color, visible at a glance as the signature of the style.
  camera_and_composition: Tabletop framing with dated tablecloth, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Kitschy, strange, nostalgic and funny, driven by the construction, color and rhythm.
  rendering_and_quality: Faded vintage print photograph, with clean, deliberate marks and no accidental noise.
  creative_brief: "Retro cookbook: overlit 1960s-70s food photos with gelatin molds, aspics and garish garnishes. Carry it through gelatin mold, suspended items, flash, faded print. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
