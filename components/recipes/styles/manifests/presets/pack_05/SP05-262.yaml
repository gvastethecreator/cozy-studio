visualDna:
  aesthetic: 'Madhouse Monster television look (2004): faithful Naoki Urasawa realism in animation, muted European cities, hospitals and small towns, quiet suspense and ordinary adult faces.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Urasawa-derived realistic designs, individualized adult faces, heavy coats and restrained anxious expressions. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Muted German winter tones, grey-green, beige, pale blue and dim hospital white.
  lighting_and_shadow: Cold diffuse European daylight, dim hospital corridors and warm but uneasy lamplight at night.
  texture_and_material: Realistic restrained digital cel with painted European architecture and subdued detail.
  camera_and_composition: Quiet observation shots, long corridors and slow push-ins on faces realizing something.
  atmosphere_and_mood: Keep the requested mood with creeping moral suspicion.
  rendering_and_quality: Faithful realist Madhouse television frame with slow-burning suspense.
  key_features: Monster anime realism; European cities; hospitals; quiet suspense
  creative_brief: "Madhouse Monster television look (2004): faithful Naoki Urasawa realism in animation, muted European cities, hospitals and small towns, quiet suspense and ordinary adult faces. Carry it through Monster anime realism, European cities, hospitals, quiet suspense. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
