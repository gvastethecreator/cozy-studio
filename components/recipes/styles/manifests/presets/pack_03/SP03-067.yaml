visualDna:
  aesthetic: 'Cyber implant integration: machined chrome and white ceramic modules set flush into skin, with the seam between flesh and metal as the focal detail.'
  subject_treatment: Keep the prompt subject, pose, setting and camera; add implant modules into the body along natural anatomical lines as a declared design change, never replacing the whole body with a robot.
  color_and_tone: Warm natural skin tones against cool chrome and white ceramic, with one small cyan or amber status light.
  lighting_and_shadow: Soft key on the skin with subsurface warmth, plus a hard rim that picks out the metal edges and the seam line.
  texture_and_material: Pores and fine hair running right up to precise machined gaps, a faint flush at the seam, brushed and polished metal.
  camera_and_composition: Keep the requested view; the implant sits where the camera naturally lands, such as temple, jaw, forearm or spine.
  atmosphere_and_mood: Quietly uncanny, the body upgraded with calm surgical precision.
  rendering_and_quality: Photoreal skin and metal rendered together, the join clean and believable rather than gory or bolted on.
  key_features: flush implant modules; skin-to-metal seam; chrome and white ceramic; small status light; subsurface skin with hard metal rim
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Flush-Seam Cyber Implant as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
