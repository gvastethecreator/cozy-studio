visualDna:
  aesthetic: 'Pressure-Chamber Readouts: connected geometric chambers show levels through a clearly drawn fill surface and apparent volume.'
  subject_treatment: Show the prompt's levels as connected chambers of simple geometry with a crisp fill line matching each supplied value; keep labels exact.
  color_and_tone: Full, empty and limit separated by value and edge, solid and readable.
  lighting_and_shadow: One soft common light on the volumes, marks and reading kept frontal.
  texture_and_material: Smooth chambers of consistent wall thickness with minimal ducts.
  camera_and_composition: Main and auxiliary chambers sized by the data, never by decoration.
  atmosphere_and_mood: Contained pressure and stability, steady, legible and reassuring.
  rendering_and_quality: Levels match the stated values and never change with perspective.
  creative_brief: "Pressure-Chamber Readouts: connected geometric chambers show levels through a clearly drawn fill surface and apparent volume. Carry it through connected chambers, exact fill lines, geometric volumes, steady levels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: connected chambers; exact fill lines; geometric volumes; steady levels
