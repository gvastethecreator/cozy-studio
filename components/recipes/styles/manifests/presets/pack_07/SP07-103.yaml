visualDna:
  aesthetic: 'Picturesque landscape park: an idealised pastoral scene built at estate scale, with a serpentine lake, rolling grazed grass, clumps of trees and an eye-catcher temple or ruin, fenced by a hidden ha-ha.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Soft grass greens, blue-grey water, dark tree clumps, pale stone of the eye-catcher, hazy distance; painterly, low contrast.
  lighting_and_shadow: Soft hazy light with mist over water, long shadows of tree clumps on the turf, the eye-catcher lit against darker woods.
  texture_and_material: Grazed turf running to the water, oak and beech clumps, cedar specimens, a sunken ha-ha wall, a classical temple or sham ruin, reeds at the lake edge.
  camera_and_composition: Keep the requested view; long view across water to an eye-catcher, tree clumps framing the sides like stage wings.
  atmosphere_and_mood: Serene, idyllic and composed, a painting made of land.
  rendering_and_quality: Painterly landscape photograph with hazy recession, no flower beds or formal hedges.
  creative_brief: "Picturesque landscape park: an idealised pastoral scene built at estate scale, with a serpentine lake, rolling grazed grass, clumps of trees and an eye-catcher temple or ruin, fenced by a hidden ha-ha. Carry it through serpentine lake, grazed turf to the water, tree clumps as stage wings, eye-catcher temple or ruin, hidden ha-ha. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: serpentine lake; grazed turf to the water; tree clumps as stage wings; eye-catcher temple or ruin; hidden ha-ha
