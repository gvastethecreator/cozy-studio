visualDna:
  aesthetic: '1960s mod style: sharp slim tailoring and graphic geometric dresses — two-button suits, fishtail parkas, shift dresses, go-go boots and bold op-art patterns.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a slim two-button suit with narrow tie and Chelsea boots or a fishtail parka, or a geometric shift dress with go-go boots and a bob haircut."
  color_and_tone: Black and white op-art, primary red, mustard and target-motif blues.
  lighting_and_shadow: Crisp, bright studio or city daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Mohair suiting, PVC, wool crepe and patent leather, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Graphic, centered full figure with clean background, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Sharp, cool, youthful and optimistic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Crisp, graphic finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Sixties Mod as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: slim two-button suit; geometric shift dress; go-go boots; op-art patterns; bob haircut
