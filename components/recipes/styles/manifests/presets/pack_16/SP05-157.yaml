visualDna:
  aesthetic: >-
    Kinetic digital anime built around vertical lift, directional contour and readable
    motion marks.
  subject_treatment: >-
    Keep the requested subject and action. Extend silhouettes along movement and use
    speed-line deformation only on forms that are actually moving.
  color_and_tone: >-
    Honor explicit colors. If the prompt leaves them open, use value contrast to separate
    motion from its surroundings without imposing a fixed palette.
  lighting_and_shadow: >-
    Use a narrow directional rim and grouped shadows to support the action; keep glow
    controlled and secondary.
  texture_and_material: >-
    Keep ink edges stable and use trailing smears as graphic motion marks, not as added
    surface material.
  camera_and_composition: >-
    Keep the given view and framing. Where the action permits, use vertical stacks, rising
    diagonals and compressed lanes to direct movement.
  atmosphere_and_mood: >-
    Let upward force and counter-direction support the energy requested in the prompt.
  rendering_and_quality: >-
    Keep pose and action readable while controlling smears and integrating forms with the
    painted background.
  key_features: >-
    Vertical lift; elongated action silhouettes; rising diagonals; trailing smears and
    compressed motion lanes.
  creative_brief: "Emphasize vertical movement and speed marks only when the supplied action supports them. Preserve the subject, camera, palette and scene. Use it as a reusable look on any subject."
