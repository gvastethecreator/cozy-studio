visualDna:
  aesthetic: >-
    Use this drawing language: Grotesque caricature drawing with bulbous distortion, mismatched
    feature scale, unstable redraw contours, lumpy surface marks, and sickly accent colors.
    Apply it as a rendering treatment to user-provided content; let the user control subject and
    context.
  subject_treatment: >-
    Apply wobbly uneven contours, spasming line weight, broken construction, scratchy redraws,
    elastic form distortion to the supplied subject while preserving its identity, silhouette,
    requested action, actual material, and function. Change the drawn treatment, not the
    underlying content.
  color_and_tone: >-
    Use bruised purple, deep yellow, clammy gray, and sickly green as style colors while
    honoring any explicit color requirements in the request.
  lighting_and_shadow: >-
    Use unflattering fluorescent-like glare with stark overhead highlights as a visual
    treatment, while respecting any lighting instructions in the request.
  texture_and_material: >-
    Render pitted irregular marks, oily-looking highlights, and blotchy grain as drawn or
    printed surface marks over the existing material; do not change the subject's actual
    substance or function.
  camera_and_composition: >-
    Use inflated scale and mismatched contours for hierarchy; crop tightly only when the
    requested content benefits from it, and preserve enough space to read the original form.
  atmosphere_and_mood: >-
    Uneasy, grotesque, and funny; make the humor emerge from distorted form and awkward timing.
  rendering_and_quality: >-
    Finish as a purposefully rough cartoon with controlled distortion, variable line weight, and
    a legible silhouette.
  key_features: >-
    bulbous distortion; mismatched feature scale; unstable contour redraw; scratchy marks;
    sickly accents
  creative_brief: >-
    Render the supplied content with wobbly uneven contours, spasming line weight, broken
    construction, scratchy redraws, elastic form distortion. Use bruised purple, deep yellow,
    clammy gray, and sickly green as style colors while honoring any explicit color
    instructions. Apply pitted irregular marks, oily-looking highlights, and blotchy grain as
    drawn or printed marks over the existing material, without changing what the subject is made
    of or how it functions. Preserve the requested subject, action, and setting; follow the
    supplied composition and add no unrequested cast, location, lettering, or gag.
