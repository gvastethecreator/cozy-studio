visualDna:
  aesthetic: 'VHS tape glitch: tracking errors, chroma bleed, tape noise bands and wobbling horizontal lines.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: the image wobbles with tracking lines, color bleed and a few tape-noise bands."
  color_and_tone: Washed-out colors with red and cyan bleed, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Tracking bands, head-switching noise at the bottom and soft analog blur.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Nostalgic, degraded, eerie and analog, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: tracking bands; chroma bleed; head-switching noise
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies VHS Glitch as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
