visualDna:
  aesthetic: 'Silhouette double exposure: a clean subject silhouette used as a mask, filled with a second scene that blends softly into a pale background.'
  subject_treatment: Keep the prompt's main subject as the outer silhouette and fill it with a second image drawn from the prompt's setting or theme; this preset owns that nested layout.
  color_and_tone: Mostly muted or monochrome with one tinted inner scene; a light, near-white background around the silhouette.
  lighting_and_shadow: The inner scene keeps its own light; the silhouette edge fades softly into white where the two images meet.
  texture_and_material: Smooth photographic blending, soft feathered mask edges, fine details of the inner scene following the silhouette contour.
  camera_and_composition: Centered silhouette, often in profile, the inner scene arranged so its horizon or key shape lines up with features of the outline.
  atmosphere_and_mood: Poetic, reflective and dreamlike, two worlds inside one form.
  rendering_and_quality: Clean mask edge with soft internal fades; no hard collage cut lines and no cluttered background.
  key_features: subject silhouette as a mask; second scene inside; soft feathered fade to white; aligned inner horizon; muted tinted palette
  creative_brief: "Silhouette double exposure: a clean subject silhouette used as a mask, filled with a second scene that blends softly into a pale background. Carry it through subject silhouette as a mask, second scene inside, soft feathered fade to white, aligned inner horizon, muted tinted palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
