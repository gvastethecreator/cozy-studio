visualDna:
  aesthetic: 'Trullo architecture of Apulia: thick whitewashed drystone walls under conical roofs corbelled from overlapping grey limestone slabs, each cone topped with a carved pinnacle and one cone per room.'
  subject_treatment: Keep the requested building type, site, camera and any reference massing; in preserve mode re-clad only facade materials, openings, ornament and finish, and rebuild roof, massing and structure in this system only when a redesign is requested.
  color_and_tone: Brilliant lime white walls against weathered grey and lichen-yellow stone cones, red earth and olive green around; bright, clean contrast.
  lighting_and_shadow: Strong Mediterranean sun with sharp shadows on the stepped slab courses of each cone; cool dark interiors seen through small doors.
  texture_and_material: Dry-laid limestone chiancarelle slabs in concentric rings, rough lime-washed walls, small deep-set openings, stone steps and drystone field walls.
  camera_and_composition: Keep the requested view; show a cluster of cones of different heights, the ring coursing readable, whitewash against sky.
  atmosphere_and_mood: Rustic, sunlit and whimsical in shape, built without mortar.
  rendering_and_quality: Clear daylight photograph with each slab ring legible and lime texture honest, no painted-on stone or fantasy exaggeration.
