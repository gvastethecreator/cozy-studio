visualDna:
  aesthetic: >-
    Metal Gear Solid 3: Snake Eater (original 2004 PS2) overhead stealth gameplay: olive-yellow
    camouflage, compact modeled figures, layered alpha-card foliage and softly blurred diffuse
    textures.
  subject_treatment: >-
    Preserve the requested identity, count and action. Keep the playable operative readable as a
    compact modeled figure with clear joint bends and silhouette separation from foliage. For
    military subjects, late-Cold-War camouflage fatigues, webbing, small utility pouches and matte
    field equipment define the practical silhouette; do not replace the actor with a named
    character.
  color_and_tone: >-
    Muted terrain-matched greens, khaki, brown, and stone, without modern-remake
    saturation/sharpness.
  lighting_and_shadow: Broken canopy light, dark cover pockets, and brighter openings create readable stealth choices.
  texture_and_material: Compact PS2-era foliage/ground textures, simple material transitions, low-resolution rendering.
  camera_and_composition: >-
    Original elevated overhead third-person stealth camera, diagonally down onto a compact but
    readable controlled figure, surrounding cover and navigable routes. Keep the player about
    one-sixth to one-fifth of the image height in a representative card and show tactical
    sightlines; preserve explicit composition requests. No later Subsistence free-orbit or Delta
    shoulder camera.
  atmosphere_and_mood: Watchful survival and concealment, tension from exposure and proximity rather than horror fog.
  rendering_and_quality: >-
    Original 2004 PlayStation 2 real-time rendering: visible angular limb and terrain meshes, soft
    low-resolution diffuse texture sampling, planar alpha-cut leaf clusters, baked-looking mottled
    shade, limited specular response and modest draw distance. Preserve the authored game image
    rather than laying a pixel filter over modern photorealistic forest art. No Delta PBR terrain,
    photogrammetry, cinematic bokeh or modern shoulder camera.
avoidRules:
  - unrequested named characters, copied level layouts or franchise symbols
  - invented interface text, meters or logos when no interface was requested
  - obscured player silhouette, unusable terrain or effects that hide the requested action
  - cinematic promotional posing or a camera that contradicts the selected gameplay profile
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
