  color_and_tone: Ink black, paper white and red accents, true to the Sawaki Takeyasu palette.
  lighting_and_shadow: Paper-white glow, lit the way Sawaki Takeyasu lights its scenes.
  texture_and_material: Bold sumi-e brush and paper grain, with the surface finish of Sawaki Takeyasu.
  camera_and_composition: Sweeping brush compositions, framed the way Sawaki Takeyasu composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with bold brush impact.
  rendering_and_quality: Sumi-e brush illustration, in the recognizable hand of Sawaki Takeyasu.
  key_features: Sawaki Takeyasu sumi-e; brush strokes; ukiyo-e
  creative_brief: "Sawaki Takeyasu sumi-e illustration look as in Okami: bold ink brushstrokes, celestial brush art, ukiyo-e inspired forms and sweeping impact strokes. Carry it through Sawaki Takeyasu sumi-e, brush strokes, ukiyo-e. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
