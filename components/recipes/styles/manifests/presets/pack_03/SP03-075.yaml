  aesthetic: 'Carved ice: the target sculpted from clear block ice, with frosted chisel marks, trapped bubbles and edges beginning to melt.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Clear icy blue-white, cyan in thick areas, frosted white on carved surfaces.
  lighting_and_shadow: Backlight glowing through the ice, cool refraction, drips catching highlights.
  texture_and_material: Chisel grooves, frost bloom, trapped air columns, meltwater drops at the base.
  camera_and_composition: Keep the requested framing; a dark or colored background to show the clarity.
  atmosphere_and_mood: Cold and fleeting, a careful carving that is already melting away.
  rendering_and_quality: Refractive ice with frosted carving marks; not glass.
  key_features: clear block ice; frosted chisel marks; trapped bubbles; melting drips; backlit cyan glow
