visualDna:
  aesthetic: >-
    Anime ink uses deliberate signal breaks, slight contour offsets, and small blank gaps.
  subject_treatment: >-
    Keep the original silhouette; displace only a thin local edge, never duplicate a
    subject.
  color_and_tone: >-
    Carbon black, steel blue, pale graphite, with sparse cyan or vermilion signal accents.
  lighting_and_shadow: >-
    Level cool fill, isolated bright edges, and simple shadows without invented light
    sources.
  texture_and_material: >-
    Fine scanline-like grain and broken strokes stay local; large planes remain clean.
  camera_and_composition: >-
    Keep crop and viewpoint; asymmetric gaps suggest interference without panels or scenery.
  atmosphere_and_mood: >-
    Quiet interruption creates unease only when that tone is requested.
  rendering_and_quality: >-
    Readable forms, sparse signal artifacts, and no fake text or full-frame static.
  key_features: >-
    Broken contour rhythm, local scanline grain, cyan signal accents, asymmetric pauses
  creative_brief: 'Apply a visual treatment centered on broken contour rhythm, local scanline grain, cyan signal accents, asymmetric pauses. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
