visualDna:
  aesthetic: 'Parasitepunk: strange organisms that ride their hosts, from clever hitchhiker creatures to crowns of living growth, shown as eerie partnerships rather than horror.'
  subject_treatment: Keep the prompt's subject and setting; attach a strange hitchhiking organism to it that changes how it looks or behaves, without gore.
  color_and_tone: Pale skin and grey tones with sickly green, violet and orange organism accents.
  lighting_and_shadow: Dim light with the organisms glowing faintly in dark places.
  texture_and_material: Glossy tendrils, soft growths, crowns of fungus-like forms and pale fabric.
  camera_and_composition: Close portraits of host and passenger, and crowds where many carry organisms.
  atmosphere_and_mood: Eerie and fascinating, the unsettling question of who is really in control.
  rendering_and_quality: Detailed eerie illustration with glossy organic forms and restraint.
  creative_brief: "Parasitepunk: strange organisms that ride their hosts, from clever hitchhiker creatures to crowns of living growth, shown as eerie partnerships rather than horror. Carry it through hitchhiker organisms, glowing growths, host partnerships, eerie calm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hitchhiker organisms; glowing growths; host partnerships; eerie calm
