visualDna:
  aesthetic: 'Hand-drawn outlines wobble slightly and color fills meet them with small irregularities, suggesting assembled shapes without losing clarity.'
  subject_treatment: 'Preserve identity, proportions, gesture, and count; use gentle line variation rather than misshapen anatomy or altered design.'
  color_and_tone: 'Keep a clear base palette with lightly mixed accents and visible color variation; explicit user colors take precedence.'
  lighting_and_shadow: 'Use broad simple light and soft-edged shadows; follow the specified lighting without adding a glow.'
  texture_and_material: 'Show sparse dry-brush strokes, uneven pigment edges, and overlapping passes while retaining the actual material.'
  camera_and_composition: 'Keep crop, viewpoint, scale, spacing, and count; let irregular line edges create a handmade feel without changing layout.'
  atmosphere_and_mood: 'Preserve the requested mood; imperfect surface marks describe the drawing process and do not limit quality or emotion.'
  rendering_and_quality: 'Keep structure carefully readable beneath imperfect edges; this is intentionally hand-drawn, not low-resolution or careless.'
  key_features: 'Slightly wavering ink; irregular fill edges; overlapping pigment passes; broad simple shadows; clear assembled silhouettes.'
  creative_brief: 'Use controlled line wobble and uneven pigment at the surface while keeping forms structurally sound. Keep subject, action, count, camera, and mood from the request. Use it as a reusable look on any subject.'
