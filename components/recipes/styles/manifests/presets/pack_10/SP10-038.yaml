visualDna:
  aesthetic: 'Vaporwave theme: pastel 80s-90s digital nostalgia with classical busts, grids and sunsets.'
  subject_treatment: "Translate the prompt's subject into this dream-world theme while keeping it recognizable: the subject is placed in a pastel digital-nostalgia world with grids, gradients and classical motifs."
  color_and_tone: Pink, teal, lavender and sunset gradients, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Neon glow, supporting the dream logic without adding stock props.
  texture_and_material: Glossy digital surfaces, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Nostalgic, ironic, dreamy and hazy, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: pastel gradient; grid floor; classical motifs; neon
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Vaporwave as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
