visualDna:
  aesthetic: 'Neon practical noir: interiors lit only by neon tubes and signs rigged in frame, shot wide open in haze with a cool film grade.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Magenta, red and cyan tube light, deep blacks, skin taking the color of the nearest tube.
  lighting_and_shadow: Hard colored practicals as key and edge, very low ambient, haze revealing each tube.
  texture_and_material: Glass tubes, chrome, smoke, sweat and lacquer catching colored highlights.
  camera_and_composition: Keep the requested framing; at least one tube visible or clearly motivating the light.
  atmosphere_and_mood: Lonely and electric, a late hour humming with color.
  rendering_and_quality: Clean saturated practicals without readable signage; not the rainy-street cliché.
  key_features: neon tubes as the only light; colored practical key and edge; haze; deep blacks; unreadable signs
  creative_brief: "Neon practical noir: interiors lit only by neon tubes and signs rigged in frame, shot wide open in haze with a cool film grade. Carry it through neon tubes as the only light, colored practical key and edge, haze, deep blacks, unreadable signs. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
