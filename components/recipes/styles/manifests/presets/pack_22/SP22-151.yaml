visualDna:
  aesthetic: >-
    Drawn manga illustration is finished as a color print: linework remains primary while broad local
    color areas carry a restrained, tactile ink character.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Use variable-weight contours and
    restrained interior lines to clarify the given subject without animation-style redesign.
  color_and_tone: >-
    Preserve requested hues and relationships, organizing color in broad, separated local areas with
    modest tonal variation instead of introducing an unrelated grading scheme.
  lighting_and_shadow: >-
    Keep the requested light direction and shadow structure. Translate it through printed color and
    contained value shifts without cinematic glow or an extra source.
  texture_and_material: >-
    Allow slight ink variation along color boundaries while preserving the subject's stated materials;
    do not add artificial age, stains or blanket paper wear.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. Print treatment changes surface
    rendering only, not the scene arrangement.
  atmosphere_and_mood: >-
    Preserve the requested setting and tone; use the drawn color-print finish without adding dialogue,
    sound cues or a separate narrative moment.
  rendering_and_quality: >-
    Keep black contours variable in weight and interior marks economical; separate large color regions
    cleanly so the result reads as an illustration rather than an animation frame.
avoidRules:
  - unrequested speech balloons or sound effects
  - extra details that alter identity or function
