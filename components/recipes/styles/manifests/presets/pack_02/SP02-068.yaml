visualDna:
  aesthetic: 'Bokeh macro: a fast macro lens wide open so one tiny plane is sharp and background lights melt into large glowing discs.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Glowing colored discs of light, clean subject color, soft dark gaps.
  lighting_and_shadow: Point lights or sparkling highlights far behind the subject; subject softly front-lit.
  texture_and_material: Round or cat-eye bokeh discs, some with onion-ring texture; crisp subject detail.
  camera_and_composition: Keep the requested framing; background lights behind the subject.
  atmosphere_and_mood: Delicate and magical, a tiny world glowing in soft light.
  rendering_and_quality: Optical bokeh with smooth falloff; not a digital blur filter.
  key_features: paper-thin focus plane; large glowing bokeh discs; cat-eye edges; crisp small subject; point lights behind
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bokeh (Macro) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
