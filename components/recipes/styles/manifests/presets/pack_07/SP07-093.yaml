visualDna:
  aesthetic: 'Flooded column cistern: a vast underground reservoir hall of reused stone columns carrying brick cross vaults, standing in shallow still water that doubles every column.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Warm amber uplights on red-brown brick and honey stone, black-green water, dark depths between columns; strong warm-to-black range.
  lighting_and_shadow: Low lights at column bases throwing warm light up the shafts, reflections in still water, darkness swallowing the far rows.
  texture_and_material: Mismatched stone columns and capitals, thin Roman-style brick in herringbone vaults, lime mineral tide lines, dripping water rings, moss at the waterline.
  camera_and_composition: Keep the requested view; stand low near the waterline so columns and their reflections form a symmetrical forest receding in diagonal rows.
  atmosphere_and_mood: Cavernous, still and echoing, the city's hidden reservoir.
  rendering_and_quality: Low-light photograph with glassy reflections and precise brick coursing, no fantasy glow effects.
  creative_brief: "Flooded column cistern: a vast underground reservoir hall of reused stone columns carrying brick cross vaults, standing in shallow still water that doubles every column. Carry it through forest of stone columns in still water, brick cross vaults, warm uplights at column bases, mirror reflections, mineral tide lines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
