visualDna:
  aesthetic: 'Stele ink rubbing: damp paper pressed over a carved stone relief and dabbed with an ink pad, so raised surfaces print black and carved recesses stay pale.'
  subject_treatment: Show the prompt's subject as if carved in shallow stone relief and captured by rubbing, keeping its outline and main forms clear.
  color_and_tone: Black or charcoal ink dabbed onto thin paper, with pale recessed lines and gradations from pad pressure.
  lighting_and_shadow: No light source; raised areas print dark, carved lines stay white and edges soften with pad texture.
  texture_and_material: Dabbed pad mottling, thin crinkled paper, stone pits and cracks printing as white specks.
  camera_and_composition: Flat frontal impression with the relief filling the sheet and a soft ragged edge.
  atmosphere_and_mood: Ancient, archival and ceremonial, a trace taken from stone.
  rendering_and_quality: Authentic rubbing with pad mottling and stone damage, never a clean drawing.
  creative_brief: "Stele ink rubbing: damp paper pressed over a carved stone relief and dabbed with an ink pad, so raised surfaces print black and carved recesses stay pale. Carry it through raised areas dark, carved lines pale, pad mottling, stone cracks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: raised areas dark; carved lines pale; pad mottling; stone cracks
