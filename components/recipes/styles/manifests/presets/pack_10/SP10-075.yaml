visualDna:
  aesthetic: >-
    Cross Stitch becomes a transferable textile and ornamental pattern system: start from Pixel art
    with thread, X pattern, and Low resolution, then route prompt content through motifs, repeats,
    weave logic, decorative grids, stitched marks, and surface ornament without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using X stitches to wrap, embroider, tile, dye,
    weave, print, or camouflage forms while preserving the prompt subject underneath; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Thread colors; treat palette as dye, thread, ceramic pigment, woven
    banding, motif hierarchy, or cultural ornament logic, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Fabric texture drive the light response: use soft fabric light, glazed highlights, stitch
    shadows, woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless
    the prompt explicitly asks for it.
  texture_and_material: >-
    Render Aida cloth as the tactile or mark-making basis; surface detail must follow yarn, fiber,
    glaze, dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props,
    spaces, or close material studies.
  camera_and_composition: >-
    Compose around Low resolution as reusable spatial grammar: favor repeat rhythm, motif scale,
    borders, allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Traditional, cute as the emotional register; derive mood from craft, ritual, fashion,
    domestic texture, camouflage, ornament, or folk memory, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Craft, homey: finish with readable pattern scale, tactile detail, and no wallpaper
    pasted over the subject, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Pixel art with thread; X stitches; Thread colors; Fabric texture; Aida cloth; Low resolution;
    Traditional, cute; Craft, homey; X pattern
  creative_brief: >-
    Apply cross-stitch encoding to the input: X-shaped thread marks, linen grid, limited color
    cells, and analog pixel logic should embroider any subject without requiring samplers or
    readable text.
avoidRules:
  - smooth
  - drawn
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
