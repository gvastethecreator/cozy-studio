  aesthetic: 'Salt crust: white crystalline salt deposits crusting over the target, as if dried by sea spray.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: white salt crystals crust on edges and recesses with efflorescence blooms. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: White salt over darker base colors, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Bright coastal light sparkling on crystals, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Crystalline salt crust, blooms and granules, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Coastal, dry, bleached and ancient, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Salt Crust as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
