visualDna:
  aesthetic: 'Compressed Diorama Icons: a tiny space of two or three planes condenses one action, seen through one consistent camera.'
  subject_treatment: Condense the prompt's subject into a micro space of two or three planes that shows one action, dropping any scenery that does not explain it.
  color_and_tone: Short palette with the background lower in contrast than the functional figure.
  lighting_and_shadow: One common light from a single direction, gentle and clear.
  texture_and_material: Clean surfaces and a uniform scale of detail across the small scene.
  camera_and_composition: Consistent camera and compressed depth, the space kept inside the icon outline.
  atmosphere_and_mood: A small habitable scene that is still instantly legible.
  rendering_and_quality: The action reads at small size and keeps one single focus.
  creative_brief: "Compressed Diorama Icons: a tiny space of two or three planes condenses one action, seen through one consistent camera. Carry it through two or three planes, one action, compressed depth, single focus. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two or three planes; one action; compressed depth; single focus
