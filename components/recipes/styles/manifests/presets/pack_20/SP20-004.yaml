visualDna:
  aesthetic: Engraved illustration describing form with ordered families of fine incised lines.
  subject_treatment:
    Preserve requested identity and proportions. Place line families according to curvature and
    plane direction rather than decorating the subject with repeated motifs.
  color_and_tone:
    Use a restrained ink-ground relationship while respecting user color requirements. Build intermediate
    values through line density.
  lighting_and_shadow:
    Align hatching with the form and use secondary cross-lines only in deeper shadows. Keep highlighted
    planes comparatively open.
  texture_and_material:
    Maintain crisp incised marks with small pressure variations. Distinguish line density from
    random scratches or a uniform grid.
  camera_and_composition:
    Honor requested framing and viewpoint. Vary detail density around the existing focal hierarchy
    without adding a specimen plate or labels.
  atmosphere_and_mood:
    Carry the requested mood through line spacing and contrast. Do not impose historical objects
    or scientific context.
  rendering_and_quality:
    Keep lines separated at the intended viewing scale, with clean negative spaces and selective
    dense accents.
avoidRules:
  - uniform crosshatch grid
  - unrequested specimen labels
  - random scratch noise
