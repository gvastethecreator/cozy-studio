visualDna:
  aesthetic: 'Fujifilm Velvia 50 color slide: a slow, ultra-saturated landscape reversal film shot on a tripod, with dense blacks and almost no exposure latitude.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Electric greens, deep cobalt skies, scarlet and magenta reds pushed hard; warm-magenta bias in dawn and dusk light; shadows fall to rich black.
  lighting_and_shadow: 'Narrow latitude: highlights hold only where exposure is exact, shadows block to black; best under soft dawn light or low sun after rain.'
  texture_and_material: Almost invisible fine grain; crisp micro-detail in leaves, rock and water; wet surfaces glossy and saturated.
  camera_and_composition: Keep the requested framing; tripod-still sharpness front to back, as if shot at a small aperture.
  atmosphere_and_mood: Vivid and dramatic, saturated color pushing against dense black shadow.
  rendering_and_quality: 'Projected-slide intensity: high contrast, saturated but clean color, no HDR halos or digital clarity.'
  key_features: ultra-saturated slide; electric greens; magenta dawn bias; crushed black shadows; near-invisible grain
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Fujifilm Velvia 50 as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
