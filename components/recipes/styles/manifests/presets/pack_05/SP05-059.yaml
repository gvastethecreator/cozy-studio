visualDna:
  aesthetic: 'Madhouse Dennou Coil look (2007) by Mitsuo Iso: augmented-reality glasses revealing glitching digital creatures in ordinary towns, hand-drawn realism and fluid acting.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with simple grounded designs, glasses, ordinary town clothes and precise natural acting. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Summer town greens, sky blue and glitch pink and cyan.
  lighting_and_shadow: Ordinary summer daylight with glowing augmented-reality effects floating in the air.
  texture_and_material: Clean hand-drawn cel with pixel glitch overlays and translucent digital creatures.
  camera_and_composition: Ordinary small-town framing suddenly interrupted by glitching digital phenomena.
  atmosphere_and_mood: Keep the requested mood with curious digital uncanniness.
  rendering_and_quality: Precise Madhouse television frame with augmented-reality glitch effects and natural acting.
  key_features: Dennou Coil AR glasses; digital glitches; ordinary towns; Iso realism
  creative_brief: "Madhouse Dennou Coil look (2007) by Mitsuo Iso: augmented-reality glasses revealing glitching digital creatures in ordinary towns, hand-drawn realism and fluid acting. Carry it through Dennou Coil AR glasses, digital glitches, ordinary towns, Iso realism. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
