visualDna:
  aesthetic: 'Dronepunk: skies thick with delivery, police and hobby drones, swarms forming shapes, and people living under a constant buzz.'
  subject_treatment: Keep the prompt's subject and setting; fill the air around it with drones of many sizes, some forming swarms or shapes.
  color_and_tone: Hazy sky grey and dusk orange with tiny blinking red, green and white drone lights.
  lighting_and_shadow: Drone spotlights pinning subjects from above, blinking navigation lights in the dusk.
  texture_and_material: Carbon rotor arms, plastic shells, tethered packages and strung-up drone nets.
  camera_and_composition: Low angles looking up into swarms, or top-down views from a drone above.
  atmosphere_and_mood: Buzzing and watched, freedom and surveillance sharing the same crowded sky.
  rendering_and_quality: Detailed illustration with many small readable drones and crisp lights.
  creative_brief: "Dronepunk: skies thick with delivery, police and hobby drones, swarms forming shapes, and people living under a constant buzz. Carry it through drone swarms, spotlights from above, blinking nav lights, rotor haze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: drone swarms; spotlights from above; blinking nav lights; rotor haze
