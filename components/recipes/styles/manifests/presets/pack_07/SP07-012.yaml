visualDna:
  aesthetic: 'Rustic cabin interior: saddle-notched round logs or hand-hewn beams with adze marks, a fieldstone hearth, and plank furniture made on site.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Honey and smoke-darkened timber, grey-brown fieldstone, charcoal iron, wool reds and forest greens; firelight amber against cool blue window light.
  lighting_and_shadow: Firelight and oil lamps as key light, warm and low, deep shadow in the roof; small windows admit cool daylight.
  texture_and_material: Chinked log walls, adze-scarred beams, dry-laid or mortared river stone, forged iron hooks and hinges, wool blankets, wide rough floorboards.
  camera_and_composition: Keep the requested view; show log coursing or beam rhythm, a lived-in foreground, the hearth or window as the light anchor.
  atmosphere_and_mood: Rough, warm and self-reliant, a shelter far from everything.
  rendering_and_quality: Low-light photograph with visible timber grain and stone joints, soft firelit falloff, no synthetic finish or taxidermy props.
  key_features: saddle-notched chinked logs; adze-marked beams; fieldstone hearth; forged iron hardware; firelight against cool window light
  creative_brief: "Rustic cabin interior: saddle-notched round logs or hand-hewn beams with adze marks, a fieldstone hearth, and plank furniture made on site. Carry it through saddle-notched chinked logs, adze-marked beams, fieldstone hearth, forged iron hardware, firelight against cool window light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
