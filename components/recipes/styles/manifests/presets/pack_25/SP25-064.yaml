visualDna:
  aesthetic: 'Ledger-and-Tab Interface: clear rows and index tabs create a register you read like a well-kept ledger, crisp and textureless.'
  subject_treatment: Build the prompt's records as clear rows under stable headers with index tabs tied to the content; keep every column name and value exact.
  color_and_tone: Neutral background, a very discreet row alternation and one accent for selection.
  lighting_and_shadow: Flat reading with value hierarchy, crisp and even across the table.
  texture_and_material: Fine register lines, clean type and index tabs with defined edges.
  camera_and_composition: Columns aligned by data type, headers visible even in dense layouts.
  atmosphere_and_mood: Archive order with contained warmth, neat and trustworthy.
  rendering_and_quality: Numbers, long labels and empty cells keep their alignment and meaning.
  creative_brief: "Ledger-and-Tab Interface: clear rows and index tabs create a register you read like a well-kept ledger, crisp and textureless. Carry it through ledger rows, index tabs, stable headers, one selection accent. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ledger rows; index tabs; stable headers; one selection accent
