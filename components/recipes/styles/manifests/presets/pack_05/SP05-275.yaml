visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around slightly offset contour
    echoes and shifting halftone density that create ambiguity without multiplying the
    subject. For color and surface, retain local color while arranging
    charcoal, pale gray, and one small red accent into clear value groups. Rumor-like
    uncertainty may come from offset marks, not from adding a crowd, civic setting, or
    conflict
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through slightly offset contour echoes and
    shifting halftone density that create ambiguity without multiplying the subject; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; retain local color while
    arranging charcoal, pale gray, and one small red accent into clear value groups.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; soften overlap areas and keep
    a few edges crisp under the prompt's existing illumination. Keep shadow detail and
    material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; alternate fine screenlike dots with clean
    unprinted gaps; avoid adding text, signage, or crowded detail. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    all subjects and their spacing; let density variation imply competing emphasis
    within the supplied frame. Use the mark rhythm inside the supplied composition
    rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Rumor-like uncertainty may come from
    offset marks, not from adding a crowd, civic setting, or conflict. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and slightly offset contour echoes and shifting
    halftone density that create ambiguity without multiplying the subject; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    slightly offset contour echoes and shifting halftone density that create ambiguity
    without multiplying the subject; retain local color while arranging charcoal, pale
    gray, and one small red accent into clear value groups; soften overlap areas and
    keep a few edges crisp under the prompt's existing illumination; alternate fine
    screenlike dots with clean unprinted gaps; avoid adding text, signage, or crowded
    detail; and preserve all subjects and their spacing; let density variation imply
    competing emphasis within the supplied frame. The five cues should read as one
    mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use slightly offset contour echoes and shifting
    halftone density that create ambiguity without multiplying the subject, retain local
    color while arranging charcoal, pale gray, and one small red accent into clear value
    groups, soften overlap areas and keep a few edges crisp under the prompt's existing
    illumination, and alternate fine screenlike dots with clean unprinted gaps; avoid
    adding text, signage, or crowded detail; the prompt supplies all scene content. Do
    not add unrequested characters, objects, source-specific lore, readable symbols, or
    a default action.
