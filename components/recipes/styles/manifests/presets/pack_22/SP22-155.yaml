visualDna:
  aesthetic: >-
    Graphic flat color areas combine with designed colored halftones, making the print pattern part of
    the palette and volume rather than an all-over surface effect.
  subject_treatment: >-
    Preserve the requested subject, identity, pose and action. Use clean graphic contours and sparse
    interior detail to keep its existing features distinct.
  color_and_tone: >-
    Preserve the requested hues in a compact palette, assigning separate halftone fields to selected
    color areas instead of converting the image to grayscale.
  lighting_and_shadow: >-
    Follow the requested illumination; use halftone to reinforce existing value groupings without
    adding light bursts or changing the shadow direction.
  texture_and_material: >-
    Keep printing dots deliberate, regular and localized to chosen color areas; separate patterns cleanly
    and avoid general grain or noise across the image.
  camera_and_composition: >-
    Maintain the requested viewpoint, crop and arrangement. Graphic tone stays inside the illustration
    and does not create panels, signage or an alternate layout.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. The pop quality comes from color and print rhythm, not from
    extra lettering or a new narrative cue.
  rendering_and_quality: >-
    Pair broad flat masses with a few crisp, legible halftone zones and minimal clean line details; keep
    pattern scale controlled for small-format clarity.
avoidRules:
  - unrequested panels, signs or full comic layouts
  - general grain or dots too small to read
  - extra details that alter identity or function
