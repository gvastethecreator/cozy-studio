packId: pack_03
name: 3D Icon
category: 4. 3D Styles
version: 1
supportedTasks:
  - image_generate
  - image_edit
  - style_preset_card
tags:
  - 3d-and-cgi-rendering
  - 3d-styles
visualDna:
  aesthetic: >-
    3D Icon acts as a transferable CGI-style router: start from App icon render, Front facing, soft
    shadow base and 3D style system built from modeling language, mesh abstraction, projection
    rules, topology display, toy material, paper logic, or stylized shader constraints, then apply
    the 3D/render behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Rounded corners; preserve the prompt subject while
    rebuilding it through the preset-specific 3D language; use facets, voxels, topology lines, clay,
    paper folds, toon bands, or procedural motion forms only when the preset calls for them, keeping
    the requested identity, silhouette, pose, object function, or environment legible.
  color_and_tone: >-
    Build color with Vibrant, gradient; use color through material simplification, cel ramps, toy
    plastic, paper fiber, retro CGI gradients, voxel palettes, or procedural motion accents, with
    deliberate value grouping, exposure control, and medium-specific limits rather than generic
    color wash.
  lighting_and_shadow: >-
    Handle light through Soft studio; shape light through the style constraint: simplified GI, toon
    bands, clay softness, wire visibility, toy shadows, paper fold light, or retro speculars, so
    value structure supports the renderer and does not overwrite the requested content.
  texture_and_material: >-
    Render Smooth plastic/glass, UI grade finish; surface detail should show the named construction
    system; cube faces, mesh edges, fold creases, clay fingerprints, topology overlays, procedural
    blobs, or low-poly facets should appear only when they belong to the preset, keeping material
    scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Squircle; compose through projection, topology readability, object
    grouping, axis discipline, exploded or arranged parts, or stylized scale rhythm, with scale,
    spacing, edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Friendly, UI, app store ready; derive mood from toy-like clarity, technical
    breakdown, handmade stop-motion, abstract motion, retro CGI novelty, or procedural mathematical
    wonder, letting the renderer alter interpretation without demanding a specific story, location,
    or character.
  rendering_and_quality: >-
    Finish with macOS Big Sur glossy modern platform icon, squircle elegance; finish with
    intentional stylization, clean geometry, stable silhouettes, and no accidental photoreal
    overwrite unless the preset asks for it, clean denoised surfaces where appropriate, and enough
    shader evidence to make the CGI mode recognizable.
  key_features: >-
    App icon render; Front facing, soft shadow base; Vibrant, gradient; Smooth plastic/glass, UI
    grade finish; Squircle
  creative_brief: >-
    Apply 3D Icon as a CGI/render preset over prompt X: preserve the user's requested subject, then
    route modeling, shader response, lighting, material scale, composition, mood, and final render
    craft through App icon render, Front facing, soft shadow base, Smooth plastic/glass, UI grade
    finish without requiring the card image's original subject.
avoidRules:
  - flat
  - 2d icon
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - readable text
  - signature
  - accidental photorealism
  - generic smooth mesh
  - wrong geometry language
  - messy topology
assets:
