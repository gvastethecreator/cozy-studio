  aesthetic: 'Nintendo EAD Tokyo Super Mario 3D World (2013) look: bright toy-box 3D platformer, candy-colored floating blocks, glossy plastic surfaces, clean shadows and cheerful diorama levels.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people as tiny round glossy toy-like figures with big eyes and chunky shoes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Candy red, sky blue, grass green and sunny yellow.
  lighting_and_shadow: Bright soft daylight with clean drop shadows, lit the way Super Mario 3D World 2013 lights its levels.
  texture_and_material: Glossy plastic toy surfaces, with the in-engine surface finish of Super Mario 3D World 2013.
  camera_and_composition: Three-quarter overhead platformer camera, framed the way Super Mario 3D World 2013 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with bouncy cheerful play.
  rendering_and_quality: Authentic Wii U toy platformer screen, matching real Super Mario 3D World 2013 screenshots.
  key_features: Mario 3D World toy blocks; glossy plastic; diorama levels
  creative_brief: 'Nintendo EAD Tokyo Super Mario 3D World (2013) look: bright toy-box 3D platformer, candy-colored floating blocks, glossy plastic surfaces, clean shadows and cheerful diorama levels. Carry it through Mario 3D World toy blocks, glossy plastic, diorama levels. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
