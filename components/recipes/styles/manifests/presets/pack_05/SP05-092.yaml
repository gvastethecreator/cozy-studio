visualDna:
  aesthetic: Ornate dark anime cel in which each focal contour is echoed by fine silver after-image lines, as if the moment had been drawn several times over.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Echo lines trail existing forms by a small offset and fade out; never duplicate the subject into a second figure.
  color_and_tone: Deep violet, slate and ink black in a low cold key, with silver and pale lilac reserved for the echoes.
  lighting_and_shadow: Narrow silver rim light and faint repeated glints along the echo lines while large planes sink into violet shadow.
  texture_and_material: Ribbon-fine brush lines, translucent layered washes and subtle grain held inside the darks.
  camera_and_composition: Keep the requested view; nested curves and repeated spacing lead the eye inward toward the focal form.
  atmosphere_and_mood: Hushed, ornate and uneasy, a moment that feels already lived.
  rendering_and_quality: Crisp focal contour, softly lost secondary edges and echo lines decreasing in opacity outward.
  key_features: silver after-image echo lines; violet-slate low key; narrow silver rims; ribbon-fine brush line; fading repetition
  creative_brief: "Ornate dark anime cel in which each focal contour is echoed by fine silver after-image lines, as if the moment had been drawn several times over. Carry it through silver after-image echo lines, violet-slate low key, narrow silver rims, ribbon-fine brush line, fading repetition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
