visualDna:
  aesthetic: >-
    A high-impact 90s cel treatment centers on a bright curved aura shell, a hot focal core and clean
    radial streaks. The planetary scale comes from the arc around a form, not a planet or battle.
  subject_treatment: >-
    Preserve the requested form and action. Wrap a curved energy contour around the existing focal
    shape only when effects suit the request; do not turn it into a fighter.
  color_and_tone: >-
    When color is open, set ivory-gold or white-hot accents against deep cobalt and indigo. Preserve
    requested colors and keep the brightest region compact.
  lighting_and_shadow: >-
    Use hard cel shadows around a controlled luminous arc, with short outward streaks tied to existing
    movement. Keep the requested light direction and avoid a new explosion.
  texture_and_material: >-
    Keep the aura smooth and luminous while retaining inked edges and clean painted fills on solid
    forms. Do not make every surface emit light.
  camera_and_composition: >-
    Let one broad arc organize visual force within the supplied composition. Preserve framing, scale
    and subject placement; do not require a planet, sky or impact scene.
  atmosphere_and_mood: >-
    Convey scale through the size and curve of the existing effect, not through a cosmic setting.
    Preserve the requested tone and event.
  rendering_and_quality: >-
    Use crisp silhouettes, a readable light core and a few distinct streaks. Keep glow bounded and
    avoid soft bloom obscuring form.
  key_features: >-
    broad curved aura shell; compact ivory-gold focal light; radial streaks that trace existing motion
  creative_brief: >-
    Apply the curved aura and impact-line language to the requested content where luminous effects
    fit. Preserve its identity, action, palette and composition; add no planet, fighter or battle.
