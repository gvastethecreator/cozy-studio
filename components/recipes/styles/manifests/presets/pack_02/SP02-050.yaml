visualDna:
  aesthetic: 'Polaroid instant print: the whole physical print, with its square image, wide white frame thicker at the bottom and instant-film chemistry.'
  subject_treatment: Keep the prompt subject, action and setting as they are; present them as the image inside a white-framed instant print, never adding period clothes or props.
  color_and_tone: Soft creamy color, cyan-green shadows, warm highlights, slightly faded blacks.
  lighting_and_shadow: Built-in flash or bright daylight; close flash falloff.
  texture_and_material: White plastic frame, developer spread marks along the edges, soft plastic-lens focus.
  camera_and_composition: Square image centered in a frame with a wider bottom border, shown flat.
  atmosphere_and_mood: Intimate and playful, a moment you can hold in your hand.
  rendering_and_quality: Physical instant print object; the emulsion look alone belongs to Polaroid 600 in pack_01.
  key_features: white frame with wide bottom; square image; developer spread marks; cyan-green shadows; close flash
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Polaroid (Instant) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
