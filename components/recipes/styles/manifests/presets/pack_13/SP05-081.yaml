visualDna:
  aesthetic: 'Rounded 2D animation contours taper to fine ends and settle into compact cel shadows; expression reads through precise facial marks rather than caricature.'
  subject_treatment: 'Keep the prompted identity, age, proportions, costume, and action; use minute eyelid, brow, and mouth accents only to carry the supplied expression.'
  color_and_tone: 'Separate gentle warm neutrals from cool accents in clear value groups; let the requested palette set the hues and reserve saturation for existing focal forms.'
  lighting_and_shadow: 'Use broad soft light, shallow cel shadows, and a thin clean highlight edge; follow the stated direction without adding a bounce source.'
  texture_and_material: 'Favor smooth painted fills with sparse fine marks on surfaces already present; keep texture subordinate to contour and preserve each prompted material.'
  camera_and_composition: 'Preserve the requested crop, viewpoint, scale, spacing, and count; create separation through contour overlap and a quiet detail hierarchy within the frame.'
  atmosphere_and_mood: 'Keep the requested mood; make subtle expression legible without turning a neutral scene shy, comforting, or cheerful.'
  rendering_and_quality: 'Use clean closed contours, stable proportions, readable facial features, and restrained soft transitions; avoid a glossy digital finish.'
  key_features: 'Fine tapered contours; minute facial marks; compact soft cel shadows; gentle warm and cool separation; sparse surface detail.'
  creative_brief: "Build expression from tiny facial shifts and tapered linework over soft cel planes. Preserve the subject, action, count, camera, and mood from the request; add no scene props. Use it as a reusable look on any subject."
