visualDna:
  aesthetic: 'Wet asphalt: dark aggregate surface slick with water and mirror reflections.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is coated in dark asphalt aggregate made glossy and reflective by water."
  color_and_tone: Near-black with grey aggregate and reflected lights, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Night light with reflections of lamps, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Asphalt aggregate with wet sheen and puddle reflections, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Urban, moody, nocturnal and slick, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: wet asphalt aggregate; mirror reflections; night sheen
  creative_brief: "Wet asphalt: dark aggregate surface slick with water and mirror reflections. Carry it through wet asphalt aggregate, mirror reflections, night sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
