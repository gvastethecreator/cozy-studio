visualDna:
  aesthetic: 'Diorama lighting: small warm lights and a soft key scaled to a miniature, with shallow macro depth of field that makes any scene read as a handmade model.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Cozy saturated palette, warm practical dots, soft cool fill.
  lighting_and_shadow: Tiny point lights in windows and lamps, a soft overhead key, short soft shadows.
  texture_and_material: 'Surfaces read as painted model materials: flocked grass, resin water, plaster rock.'
  camera_and_composition: Keep the requested framing; macro focus falloff at the edges.
  atmosphere_and_mood: Cozy and toy-like, a world you could hold in your hands.
  rendering_and_quality: Miniature lighting and macro depth; geometry itself stays as requested.
  key_features: miniature-scaled lights; macro depth falloff; cozy saturated palette; model-kit materials; tiny window glows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Diorama Lighting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
