  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in 2D but light it with soft volumetric shading and glowing lantern light. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Warm lantern amber against cold blue snow, true to the SPA Studios palette.
  lighting_and_shadow: Volumetric lighting on 2D characters with soft glowing edges.
  texture_and_material: Hand-drawn 2D line with painted volumetric shading, with the surface finish of SPA Studios.
  camera_and_composition: Cinematic feature framing with deep snowy space, framed the way SPA Studios composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with warm wintry tenderness.
  rendering_and_quality: Faithful volumetric-lit 2D feature frame, in the recognizable hand of SPA Studios.
  creative_brief: 'SPA Studios look of 2019: hand-drawn 2D characters given volumetric lighting and soft texture as if 3D, glowing lantern light, snowy Nordic villages and warm-cold color contrast. Carry it through SPA volumetric 2D, lantern light, snow. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
