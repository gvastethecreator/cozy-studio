visualDna:
  aesthetic: >-
    Reduce contours to the smallest set that still identifies the requested form; use a broad quiet
    value field and one muted accent where it helps.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: favor restrained values and a
    single muted accent; preserve colors essential to the prompt.
  lighting_and_shadow: >-
    Use soft, broad value transitions and minimal shadow; keep requested lighting recognizable.
  texture_and_material: >-
    Keep surfaces clean and marks sparse, leaving deliberate negative space rather than adding
    decorative texture.
  camera_and_composition: >-
    Preserve framing and scale; let empty space emerge around existing forms without deleting
    requested elements.
  atmosphere_and_mood: >-
    Quietness is visual economy, not a forced calm mood; honor the requested emotion.
  rendering_and_quality: >-
    Simplify rendering only; preserve identity, count, detail the prompt requires and all
    compositional relationships. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Minimal line count; broad value field; one muted accent; negative space; humble scale.
  creative_brief: 'Apply this visual treatment to the requested content: Minimal line count; broad value field; one muted accent; negative space; humble scale. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - decorative marks obscuring minimal contour hierarchy
  - negative space removing required subject detail
  - weak values merging essential forms
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-104.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
    unrequested default-image characters, costume details, props or setting, unrequested
    default-image framing, garbled pseudo-text, unrequested interface overlay, watermark,
