visualDna:
  aesthetic: 'Liquid mercury: mirror liquid metal that pools, beads and ripples over the target.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of liquid mirror metal that holds its form while rippling and beading."
  color_and_tone: Chrome silver reflecting surroundings, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Environment reflections and hard highlights, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Liquid metal with ripples, beads and mirror reflection, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Uncanny, fluid, futuristic and cold, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: liquid mirror metal; ripples and beads; environment reflections
  creative_brief: "Liquid mercury: mirror liquid metal that pools, beads and ripples over the target. Carry it through liquid mirror metal, ripples and beads, environment reflections. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
