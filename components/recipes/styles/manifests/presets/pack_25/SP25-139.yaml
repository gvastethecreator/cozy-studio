visualDna:
  aesthetic: 'Shelf Family Comparison: a whole product family shown front-on at one scale, same hierarchy and light, to judge how well the variants stand apart.'
  subject_treatment: Show the prompt's product variants side by side at one scale with one shared hierarchy, names and codes exact, plus a small shelf-distance view.
  color_and_tone: Family palette with redundant names and codes per variant.
  lighting_and_shadow: Identical light and exposure across the whole family.
  texture_and_material: Same materials and finishes so only the graphics change.
  camera_and_composition: Fronts at equal scale and distance with one shelf-thumbnail control.
  atmosphere_and_mood: Recognizable kinship and an easy choice between variants.
  rendering_and_quality: Each variant keeps its own data and reads without the small text.
  creative_brief: "Shelf Family Comparison: a whole product family shown front-on at one scale, same hierarchy and light, to judge how well the variants stand apart. Carry it through equal-scale fronts, shared hierarchy, shelf thumbnail, exact names. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: equal-scale fronts; shared hierarchy; shelf thumbnail; exact names
