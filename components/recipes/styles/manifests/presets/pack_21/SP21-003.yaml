visualDna:
  aesthetic: Opaque painted illustration organized into broad color planes with selective visible brush edges.
  subject_treatment:
    Preserve defining shapes and proportions while grouping small surface details into larger planar
    statements.
  color_and_tone:
    Build a compact palette from the requested colors. Separate light, middle and dark planes clearly
    without outlining every boundary.
  lighting_and_shadow:
    Represent illumination as connected changes of plane and value. Reserve soft transitions
    for selected turning surfaces.
  texture_and_material:
    Use matte paint coverage with occasional dry drag at a few edges. Keep the bulk of each
    plane calm and opaque.
  camera_and_composition:
    Preserve user viewpoint and placement. Alternate found and lost edges around the requested
    focal hierarchy.
  atmosphere_and_mood:
    Retain the requested mood through chroma, value spacing and edge softness instead of substituting
    a storybook scene.
  rendering_and_quality:
    Maintain readable planes, intentional brush boundaries and restrained microtexture. Avoid
    photographic gloss or a blanket canvas overlay.
avoidRules:
  - blanket canvas texture
  - indiscriminate soft blending
  - unrequested photographic gloss
