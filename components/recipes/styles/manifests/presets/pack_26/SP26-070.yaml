visualDna:
  aesthetic: 'Frank Frazetta fantasy paperback painting look: muscular dynamic figures, dark swirling backgrounds, dramatic firelight, loose oil brushwork and primal energy.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; paint the subject as a muscular dynamic figure emerging from dark swirling oil paint. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Dark umber, firelight orange, blood red and deep shadow.
  lighting_and_shadow: Dramatic firelight carving figures out of darkness, lit the way Frank Frazetta lights its scenes.
  texture_and_material: Loose expressive oil brushwork with unfinished edges, with the surface finish of Frank Frazetta.
  camera_and_composition: Dynamic low-angle figures emerging from darkness, framed the way Frank Frazetta composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with primal heroic ferocity.
  rendering_and_quality: Primal oil fantasy paperback painting, in the recognizable hand of Frank Frazetta.
  creative_brief: "Frank Frazetta fantasy paperback painting look: muscular dynamic figures, dark swirling backgrounds, dramatic firelight, loose oil brushwork and primal energy. Carry it through Frazetta muscular figures, firelight, loose oil, dark swirls. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Frazetta muscular figures; firelight; loose oil; dark swirls
