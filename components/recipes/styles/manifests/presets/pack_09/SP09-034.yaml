visualDna:
  aesthetic: >-
    Mold & Mildew turns material failure into the main visual language: start from Damp corner,
    Fuzzy, dusty, and Stains, then turn damage history, contamination, corrosion, staining,
    abrasion, and material breakdown into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Fuzzy spots: preserve identity and pose while letting forms
    age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Black, Green, Grey as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Mold & Mildew without hiding the prompt subject.
  texture_and_material: >-
    Render Fuzzy, dusty through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Stains as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Rotting, damp by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Gross, unhealthy material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Damp corner; Fuzzy spots; Fuzzy, dusty; Matte; Stains
  creative_brief: >-
    Route any subject through Mold & Mildew as a transferable weathering-and-decay visual system
    while preserving the prompt's subject, action, and setting. Capture the organic creep of decay
    where fuzzy colonies of black, green, and grey spread across damp surfaces like a map of neglect
    drawn by spores. The texture should feel dusty and soft, a living carpet of dissolution eating
    its way through the man-made one millimeter at a time. Render the unsettling beauty of rot,
    nature reclaiming territory in the quiet language of mold. Use Mold & Mildew as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
