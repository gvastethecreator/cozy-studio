visualDna:
  aesthetic: 'Feature-film VFX path tracing: an unbiased CPU render tuned for photoreal creatures, skin, volumes and plate-matched lighting in a color-managed pipeline.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Natural filmic color with ACES-like rolloff, restrained saturation, deep but detailed shadows.
  lighting_and_shadow: Physically accurate area and HDRI lighting, multiple scattering in smoke and fog, soft realistic shadows.
  texture_and_material: Layered skin with subsurface scattering, pores and sweat, micro-displacement on scales and fabric.
  camera_and_composition: Cinematic lens with real depth of field, creature or character at dramatic scale.
  atmosphere_and_mood: Grounded and believable, the impossible rendered as real.
  rendering_and_quality: Photoreal VFX finish with film grain matching; no plastic CG sheen.
  key_features: photoreal subsurface skin; volumetric multiple scattering; micro-displacement; filmic color management; plate-matched realism
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Arnold Feature Film Path Tracer as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
