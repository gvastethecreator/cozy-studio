visualDna:
  aesthetic: >-
    Paired contour registers: a true edge and a partial reversed-value echo, with breaks where
    the two fail to align.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Echo existing
    silhouettes or reflections only, never duplicate features or introduce a mirror.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, reuse muted indigo, olive,
    smoked gray, and pale ochre on opposing value sides instead of adding accent colors.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Follow the supplied source; reverse
    highlight and shadow only across reflective boundaries already present, with no new glints
    or lights.
  texture_and_material: >-
    Apply texture only to materials already present. Separate transparent wash from narrow hard
    edges only on existing reflective materials; keep broken ink dry and sparse elsewhere.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Align partial reversed
    contours to existing axes or reflective planes without moving or flipping subjects.
  atmosphere_and_mood: >-
    Preserve the requested emotional tone. Carry the requested emotion; perceptual dissonance
    comes only from contour and value reversal.
  rendering_and_quality: >-
    Maintain one primary contour for each form; keep secondary echoes partial, low-contrast, and
    subordinate to identity.
  key_features: >-
    Partial reversed contour; paired value polarity; existing-reflection echo; clear identity
    contours.
  creative_brief: "Use partial reversed contour; paired value polarity; existing-reflection echo; clear identity contours. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
