visualDna:
  aesthetic: >-
    Golden Age Comic acts as a transferable illustration router: start from 1940s flagship lead
    archetype comic, Superman style, golden-age boldness, truth-justice-energy, pulp optimism,
    4-color process, halftone pattern, speech balloon and comic-illustration system built from ink
    hierarchy, panel-era color, contour exaggeration, print artifacts, and sequential-art
    readability, then apply the visual behavior to prompt X instead of recreating a fixed demo
    image.
  subject_treatment: >-
    Transform any prompt subject through Thick ink, thick confident ink, emblematic square-jawed
    simplification, and four-color action-read silhouette logic; preserve the requested subject
    while translating form into panel-ready silhouettes, expressive contour weight, stylized
    anatomy, speed emphasis, or graphic restraint only when the preset calls for it, keeping the
    requested identity, silhouette, pose, object function, or setting legible.
  color_and_tone: >-
    Build color with CMYK dots (Ben-Day), primary lead archetype primaries, newsprint nostalgia;
    treat color as comic production language: four-color plates, limited spot color, manga
    monochrome, digital flats, noir contrast, webtoon gradients, or painted page atmosphere, with
    deliberate value grouping, accent control, and process-specific limits rather than a generic
    palette wash.
  lighting_and_shadow: >-
    Handle light through Flat, high-key fill, minimal shadows; make light read through ink spotting,
    cel-like value blocks, dramatic rim separation, flat print fill, or painted page modeling rather
    than generic studio illumination, so value structure supports the illustration process and does
    not overwrite the requested content.
  texture_and_material: >-
    Render Cheap paper, ink hierarchy, panel readability, stylized contour, print-era surface, and
    comic color discipline; surface detail should reveal paper tooth, newsprint dots, screen tones,
    digital brush layers, ink pools, gutter discipline, or pixel cells at a scale that supports the
    drawing, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through emblematic pose, cover-panel force, clean central read, diagonal
    energy, and space for balloon-like graphic shapes without real text; compose with panel logic,
    silhouette clarity, speech-shape space, page rhythm, close-up drama, or scroll pacing without
    requiring a fixed comic-page scene, with scale, spacing, edge rhythm, and visual hierarchy doing
    the style work.
  atmosphere_and_mood: >-
    Keep the mood Action, classic, square-jawed heroism, serial cliffhanger; derive mood from era,
    genre pressure, satire, melodrama, horror obsession, pulp energy, or graphic-novel seriousness,
    letting the style alter interpretation without demanding a specific story, location, or actor.
  rendering_and_quality: >-
    Finish with Vintage, bold, four-color grit, golden-age optimism; finish with clear ink
    decisions, readable stylization, controlled artifacting, and no generic superhero costume or
    random comic text replacing the prompt, clean denoised surfaces where appropriate, and enough
    process evidence to make the style recognizable.
  key_features: >-
    1940s flagship lead archetype comic, Superman style, golden-age boldness, truth-justice-energy,
    pulp optimism; 4-color process, halftone pattern, speech balloon; CMYK dots (Ben-Day), primary
    lead archetype primaries, newsprint nostalgia; Cheap paper, ink hierarchy, panel readability,
    stylized contour, print-era surface, and comic color discipline; emblematic pose, cover-panel
    force, clean central read, diagonal energy, and space for balloon-like graphic shapes without
    real text
  creative_brief: >-
    Apply Golden Age Comic as an illustration preset over prompt X: preserve the user's requested
    subject, then route mark-making, palette, surface, composition, mood, and final craft through
    1940s flagship lead archetype comic, Superman style, golden-age boldness, truth-justice-energy,
    pulp optimism, 4-color process, halftone pattern, speech balloon, Cheap paper, ink hierarchy,
    panel readability, stylized contour, print-era surface, and comic color discipline without
    requiring the card image's original subject.
avoidRules:
