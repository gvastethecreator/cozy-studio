visualDna:
  aesthetic: 'Aerosol tag handstyle: the subject drawn in fast continuous spray-can strokes on a wall, with overspray halos, gravity drips and a consistent cap width.'
  subject_treatment: Keep the prompt subject recognizable and draw it as a one-line spray-can handstyle on a wall surface; any letter-like flourishes stay illegible.
  color_and_tone: Matte black or chrome silver lines with at most one high-contrast accent color, on the wall’s own color.
  lighting_and_shadow: Flat daylight on the wall; the only value change is overspray halo around each stroke.
  texture_and_material: Soft-edged spray lines of even width, drips running down from slow points, rough concrete, brick or steel showing through.
  camera_and_composition: Keep the requested view as the wall surface seen flat, the drawing spanning it in one sweeping gesture.
  atmosphere_and_mood: Fast, defiant and kinetic, drawn before anyone could stop it.
  rendering_and_quality: Raw single-color spray line on a real wall surface; not a 3D sculpture or a digital vector.
  key_features: one continuous spray line; overspray halos; gravity drips; even cap width; wall surface visible
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Graffiti (Tag) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
