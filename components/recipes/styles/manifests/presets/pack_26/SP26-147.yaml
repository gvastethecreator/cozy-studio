  color_and_tone: Soft pastel Sunday supplement color on cream paper.
  lighting_and_shadow: Flat printed color with no cast shadows, lit the way Winsor McCay lights its scenes.
  texture_and_material: Printed comic page on off-white paper with slight ink spread and paper tooth.
  camera_and_composition: Full Sunday page with panels that stretch as the dream grows.
  atmosphere_and_mood: Keep the requested mood with wondrous dreaming vertigo.
  rendering_and_quality: Faithful early newspaper Sunday page, in the recognizable hand of Winsor McCay.
