  aesthetic: 'Earth-sheltered pastoral architecture: dwellings dug into turf mounds with round doors and round windows, lime-plastered faces and hand-hewn oak frames.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Meadow greens, warm ochre lime plaster, honey oak and small brass accents; soft, sunny, mid-saturation palette.
  lighting_and_shadow: Low late-afternoon sun with long soft shadows on the turf and warm window glow beginning inside.
  texture_and_material: Turf with wildflowers over the roofs, trowel-marked lime plaster, adzed oak lintels, worn flagstone thresholds.
  camera_and_composition: Keep the requested view; low eye level at doorstep height so the round openings and turf curve dominate.
  atmosphere_and_mood: Snug, settled and unhurried, homes that belong to the hill.
  rendering_and_quality: Warm naturalistic illustration with soft edges; an original design, never a copy of a known film village.
  key_features: turf-mound roofs; round doors and windows; lime-plastered faces; adzed oak frames; low warm afternoon sun
