visualDna:
  aesthetic: >-
    Plastic (Injection Molded) treats fabrication as visible style language: start from Injection
    molded plastic, Smooth or orange peel, and Sink marks, then turn manufacturing process, tooling
    marks, seams, tolerances, and industrial material behavior into portable surface behavior rather
    than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Parting lines: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Bright, saturated as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Subsurface scattering (slight) define the light response: highlights, occlusion,
    translucency, specular scatter, matte falloff, or rim behavior should reveal Plastic (Injection
    Molded) without hiding the prompt subject.
  texture_and_material: >-
    Render Smooth or orange peel through constructed regularity, stress points, joins, molded edges,
    and process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Sink marks as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Artificial, toy by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Mass produced, cheap material clarity: physically coherent reflectance, clean
    contact detail, controlled micro-texture, readable silhouette behavior, and no noisy
    stock-texture overlay.
  key_features: >-
    Injection molded plastic; Parting lines; Smooth or orange peel; Subsurface scattering (slight);
    Sink marks
  creative_brief: >-
    Route any subject through Plastic (Injection Molded) as a transferable man-made material visual
    system while preserving the prompt's subject, action, and setting. Apply injection-molded
    plastic language to the input: saturated uniform color, faint parting lines, subtle sink marks,
    slight orange-peel texture, and edge translucency from shallow subsurface light. If toy,
    product, prop, or casing exists, reinforce manufacture; otherwise convert surfaces into
    artificial molded material without requiring a consumer product shot.
