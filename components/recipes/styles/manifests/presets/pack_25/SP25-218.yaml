visualDna:
  aesthetic: 'Foldout Atlas Structure: a foldout that ties one overview to anchored detail panels and references in consistent positions.'
  subject_treatment: Lay out the prompt's foldout with one wide overview and anchored detail panels, folds kept off the legend and every label exact.
  color_and_tone: A common palette with redundant codes linking overview and details.
  lighting_and_shadow: A flat main view plus a neutral folded presentation.
  texture_and_material: Conceptual stock with fold lines kept away from critical information.
  camera_and_composition: The overview on one wide panel with details anchored to exact regions.
  atmosphere_and_mood: Informative expansion and discovery as the page opens.
  rendering_and_quality: Crisp foldout where every detail matches one exact region.
  creative_brief: "Foldout Atlas Structure: a foldout that ties one overview to anchored detail panels and references in consistent positions. Carry it through wide overview, anchored details, folds off legend, exact labels. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: wide overview; anchored details; folds off legend; exact labels
