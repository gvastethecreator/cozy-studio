visualDna:
  aesthetic: >-
    Build a palimpsest of partially erased contours and precise restored edges: a worn underlying mark
    remains visible beneath a sparse, newly articulated line system.
  subject_treatment: >-
    Preserve the requested subject, anatomy and action. Confine erasure and restoration to secondary
    marks within existing forms; do not add corpses, bones, machinery or a second figure.
  color_and_tone: >-
    Separate faded ash-like underlayers from a few crisp pale or copper accents. Honor requested colors,
    using value loss and recovery rather than a compulsory green glow.
  lighting_and_shadow: >-
    Respect the requested light. Describe receding layers with softened value and restored contours with
    concise contrast, without inventing luminous sources.
  texture_and_material: >-
    Contrast dry rubbed pigment with thin newly drawn marks; preserve depicted materials and keep
    abrasion local instead of coating everything in decay.
  camera_and_composition: >-
    Preserve the requested crop and hierarchy. Let a few incomplete marks resolve near the focal area
    without duplicating the primary silhouette.
  atmosphere_and_mood: >-
    Suggest uncanny persistence through disappearance and return of marks. Follow the requested tone
    without imposing death imagery or horror.
  rendering_and_quality: >-
    Keep defining features intact and restoration lines sparse. Make the distinction between faded
    substrate and renewed contour readable at card size.
avoidRules:
  - unrequested corpse, skeleton, receiver or ritual imagery
  - erasure of defining features
  - a duplicated subject used as a ghost
assets:
  defaultImage: /assets/recipes/styles/defaults/SP15-114.webp
attributes:
  negativePrompt: >-
    unrequested corpse, skeleton, receiver or ritual imagery, erasure of defining features, a duplicated
