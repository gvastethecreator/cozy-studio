visualDna:
  aesthetic: 'Conservatory bioclimate: a glasshouse climate machine of thin glazing bars, heating pipes and misting lines, where humidity and filtered light are the architecture.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Milky white glass light, many saturated greens, white-painted iron or timber glazing bars, rust and verdigris on pipes; soft low contrast through haze.
  lighting_and_shadow: Daylight diffused by fogged glass and mist, leaf shadows softened by humidity, shafts where vents open; no hard sun edges.
  texture_and_material: Condensation beads and runs on panes, white-painted glazing bars, cast-iron heating pipes under slatted benches, gravel floors, misting nozzles, algae on glass.
  camera_and_composition: Keep the requested view; layer foliage foreground, midground subject and fogged glass background; avoid a centred glass corridor.
  atmosphere_and_mood: Warm, dripping and hushed, a tropical air held behind glass.
  rendering_and_quality: Soft humid photograph with real condensation and haze, varied plant species, no plant-shop display.
  key_features: condensation-beaded glass; white-painted glazing bars; misting haze; cast-iron heating pipes; layered tropical foliage
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Conservatory Bioclimate as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
