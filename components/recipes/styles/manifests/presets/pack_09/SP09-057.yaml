visualDna:
  aesthetic: >-
    Oil on Water behaves like a controlled elemental effect layer: start from Puddle rainbow,
    Liquid, and Fluid, then turn motion, temperature, particles, translucency, refraction, glow, and
    transient energy behavior into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Swirls: preserve identity and pose while letting forms
    emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Thin film interference as the material palette, with controlled value separation, local
    color variation, and hue shifts that follow the subject's form rather than flattening it into a
    pasted texture.
  lighting_and_shadow: >-
    Let Reflective define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Oil on Water without hiding the prompt subject.
  texture_and_material: >-
    Render Liquid through flow direction, particle density, turbulence, glow falloff, splashes,
    trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Fluid as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Dirty but pretty by using movement, danger, spectacle, instability, temperature,
    and sensory intensity; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Iridescent, fluid material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Puddle rainbow; Swirls; Liquid; Reflective; Fluid
  creative_brief: >-
    Route any subject through Oil on Water as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Compose oil-on-water interference as fluid
    color behavior over the input: thin-film rainbow swirls, magenta-cyan-gold calligraphy, dark
    liquid underlayer, and mesmerizing surface contamination. If puddle, water, street, or
    industrial context exists, reinforce it; otherwise use iridescent film as abstract overlay
    without forcing parking lot or gutter. Use Oil on Water as portable surface/render behavior over
    any input: map its texture, light response, edge wear, color chemistry, and tactile rhythm onto
    the subject instead of requiring a literal material sample, macro tile, wall, landscape, source
    object, or scene where the material naturally appears.
avoidRules:
