visualDna:
  aesthetic: >-
    Fine-stroke opaque tempera painting models form with legible short crosshatched marks and
    disciplined tonal transitions.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Build volume with small strokes that
    follow existing forms without adding unrequested ornament, costume or historical motifs.
  color_and_tone: >-
    Enrich nearby values with restrained color variation inside the requested palette. Do not impose
    jewel hues, metallic gold or any other fixed accent color.
  lighting_and_shadow: >-
    Respect the requested light and shadow. Use controlled opaque transitions rather than adding
    a bright rim, reflective object or new illumination.
  texture_and_material: >-
    Keep the paint surface subtly satiny and detail selective while preserving the requested material
    appearance of the represented subject.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not impose a miniature,
    icon or decorative border layout unless one is requested.
  atmosphere_and_mood: >-
    Retain the requested atmosphere. Fine crosshatching does not imply jewelry, ceremony, antiquity
    or a storybook scene.
  rendering_and_quality: >-
    Let short strokes remain legible where they turn form, but limit microdetail to selected areas.
    Keep edges controlled without making every boundary equally sharp.
avoidRules:
  - decorative crosshatching unrelated to form
  - uniform microdetail
