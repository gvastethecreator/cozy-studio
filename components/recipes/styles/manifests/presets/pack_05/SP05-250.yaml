visualDna:
  aesthetic: Quiet anime cel with matte painted planes organized by simple geometry, squares, triangles and verticals, under broad gentle light.
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Simplify secondary detail and let the subject settle into stable geometric shapes; add no religion, halos or temples.
  color_and_tone: Natural earth tones, pale gold and muted blue-grey, matte and low in saturation.
  lighting_and_shadow: Broad soft morning light with no rays or halos and a single soft shadow tier.
  texture_and_material: Matte gouache-like planes, fine grain and clean transitions between edges.
  camera_and_composition: Keep the requested view; centered symmetrical balance and steady horizontals.
  atmosphere_and_mood: Calm, ethical and steady, a promise quietly kept.
  rendering_and_quality: Clean silhouettes, gentle shadows and a modest amount of detail.
  key_features: matte gouache planes; simple stable geometry; pale gold and blue-grey; no rays or halos; centered balance
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Grounded Matte Geometry Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
