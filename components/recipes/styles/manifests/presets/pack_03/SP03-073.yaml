visualDna:
  aesthetic: 'Papercraft 3D: the subject built from cut and layered cardstock, with visible paper thickness, folds and glue tabs.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Matte craft-paper colors, soft pastels and earth tones, white cut edges.
  lighting_and_shadow: Soft directional light revealing layers and fold shadows.
  texture_and_material: Paper grain, cut edges, layered depth, slightly curled pieces.
  camera_and_composition: Keep the requested view; shallow depth shows the craft scale.
  atmosphere_and_mood: Handmade and gentle, a world cut from paper.
  rendering_and_quality: Tactile papercraft render with cuts and glue, distinct from folded-only origami.
  key_features: layered cardstock; visible paper thickness; cut edges; fold shadows; paper grain
  creative_brief: "Papercraft 3D: the subject built from cut and layered cardstock, with visible paper thickness, folds and glue tabs. Carry it through layered cardstock, visible paper thickness, cut edges, fold shadows, paper grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
