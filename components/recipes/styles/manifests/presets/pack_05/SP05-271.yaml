visualDna:
  aesthetic: Post-abandonment seinen illustration in eroded straight ink contours and fine powdery grain, every broad plane bleached and dusted like concrete left for years in the sun.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Warm concrete gray, dust beige and muted ochre highlights, with greens and prompt colors lowered to half saturation.
  lighting_and_shadow: Existing highlights spread into soft bleached falloff; shadows are pale, warm and low in contrast.
  texture_and_material: Dry mineral speckle, gently abraded line edges and powdery stipple inside flat planes.
  camera_and_composition: Keep the requested camera; the picture organizes into broad quiet planes and a few exact straight edges.
  atmosphere_and_mood: Hushed, sunlit mystery of a place that time has quietly taken back.
  rendering_and_quality: Faded, low-contrast illustrated finish with straight edges eroded yet still legible; never photographic.
  key_features: eroded straight contours; powdery bleached planes; concrete gray and dust ochre; soft washed-out highlights; mineral speckle
  creative_brief: "Post-abandonment seinen illustration in eroded straight ink contours and fine powdery grain, every broad plane bleached and dusted like concrete left for years in the sun. Carry it through eroded straight contours, powdery bleached planes, concrete gray and dust ochre, soft washed-out highlights, mineral speckle. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
