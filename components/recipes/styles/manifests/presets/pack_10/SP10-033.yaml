  color_and_tone: Vibrant rainbow, magenta, acid green and orange, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Glowing, self-luminous color, supporting the dream logic without adding stock props.
  texture_and_material: Swirling patterns and vibrating outlines, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at card size.
  atmosphere_and_mood: Euphoric, intense, trippy and alive, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  key_features: swirling saturated color; vibrating contours
