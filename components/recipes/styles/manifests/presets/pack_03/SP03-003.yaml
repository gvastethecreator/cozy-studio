visualDna:
  aesthetic: 'Biased GPU production render: fast, clean motion-graphics lighting with crisp speculars, smooth gradients and controlled global illumination.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Clean saturated brand-like colors, smooth gradient backgrounds, bright whites.
  lighting_and_shadow: Large area lights and gradient domes, soft shadows, crisp specular strips on edges.
  texture_and_material: Satin plastics, brushed metal, frosted glass, perfectly clean surfaces.
  camera_and_composition: Centered floating objects, orthographic or long-lens feel, generous negative space.
  atmosphere_and_mood: Polished and upbeat, motion design frozen at its best frame.
  rendering_and_quality: Noise-free biased GI with crisp edges; no gritty realism.
  key_features: clean motion-graphics lighting; crisp specular strips; gradient backgrounds; floating objects; satin plastics
  creative_brief: "Biased GPU production render: fast, clean motion-graphics lighting with crisp speculars, smooth gradients and controlled global illumination. Carry it through clean motion-graphics lighting, crisp specular strips, gradient backgrounds, floating objects, satin plastics. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
