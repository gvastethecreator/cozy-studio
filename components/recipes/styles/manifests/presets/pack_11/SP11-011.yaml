visualDna:
  aesthetic: 'Chrome horizon synthwave: glowing grid floors, a striped sunset sun, chrome edges and magenta-cyan night haze.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: placed on a glowing perspective grid under a striped setting sun, edges rimmed in chrome and neon, silhouettes simplified."
  color_and_tone: Magenta, cyan, violet and hot orange with deep indigo night.
  lighting_and_shadow: Neon rim light, glowing grid lines and sunset backlight.
  texture_and_material: Chrome reflections, scanline haze and airbrushed gradients, visible at card size as the signature of the style.
  camera_and_composition: Low wide shot toward the horizon with the grid receding.
  atmosphere_and_mood: Nostalgic, cool, electric and dreamy, driven by the construction, color and rhythm.
  rendering_and_quality: Polished retro airbrush and neon render, with clean, deliberate marks and no accidental noise.
  key_features: perspective grid; striped sun; chrome rim; magenta-cyan haze
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chrome Horizon Voltage as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
