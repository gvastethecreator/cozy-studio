visualDna:
  aesthetic: 'Cyanotype photographic print: an iron-salt print exposed by sunlight under a negative, giving a Prussian-blue image on watercolor paper.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Prussian blue shadows to paper-white highlights, no other color.
  lighting_and_shadow: The original scene light translated into blue values; soft highlight edges.
  texture_and_material: Watercolor paper tooth, brushed coating edges, slight uneven wash.
  camera_and_composition: Keep the requested framing; brushed coating visible at the margins.
  atmosphere_and_mood: Cool and contemplative, a blue memory printed by the sun.
  rendering_and_quality: Contact-print photographic cyanotype, not a botanical photogram or blueprint.
  key_features: Prussian blue monochrome; watercolor paper tooth; brushed coating edges; sun-printed tones; white highlights
  creative_brief: "Cyanotype photographic print: an iron-salt print exposed by sunlight under a negative, giving a Prussian-blue image on watercolor paper. Carry it through Prussian blue monochrome, watercolor paper tooth, brushed coating edges, sun-printed tones, white highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
