visualDna:
  aesthetic: 'Prism effect: a glass prism or crystal held in front of the lens, splitting light into rainbow smears and ghost reflections at the frame edges.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Natural base color with spectral rainbow streaks and soft pastel ghosts.
  lighting_and_shadow: A bright source refracted through the prism; flares and rainbows bending across the frame.
  texture_and_material: Hazy refracted edges, softly doubled shapes and thin spectral fringes along contours.
  camera_and_composition: Keep the requested framing; one edge of the frame softened by the prism.
  atmosphere_and_mood: Dreamy and experimental, reality slipping through glass.
  rendering_and_quality: Real in-camera refraction through glass; never a digital rainbow overlay.
  key_features: prism rainbow smears; ghost reflections at the edge; spectral fringes; doubled shapes; hazy refraction
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Prism Effect as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
