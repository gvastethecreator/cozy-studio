visualDna:
  aesthetic: 'Victorian fairy-tale book plate: detailed pen drawing built from fine parallel hatching and crosshatching, lightly hand-tinted with a few watercolors.'
  subject_treatment: Keep the prompt subject, its body proportions, action and setting, and redraw them in this medium; simplify shapes for a young reader without enlarging heads or shrinking bodies.
  color_and_tone: Black ink on cream paper, pale tints of rose, moss and sky blue applied sparingly and unevenly.
  lighting_and_shadow: Light from the upper left, shadows made of layered hatching, strong white highlights left as paper.
  texture_and_material: Engraving-like parallel lines, crosshatch shadows, foxed cream paper with slight tint bleed.
  camera_and_composition: Theatrical framed tableau, characters in period costume, detailed but clear foreground action.
  atmosphere_and_mood: Old-fashioned, curious and gently eerie, a tale told by candlelight.
  rendering_and_quality: Precise hatched pen detail with restrained tinting; no flat digital color and no outlines-only drawing.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Victorian Hatched Storybook Plate as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: fine parallel hatching; crosshatch shadows; sparing hand tints; cream foxed paper; theatrical tableau
