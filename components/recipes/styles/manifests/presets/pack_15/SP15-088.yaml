visualDna:
  aesthetic:
    A functional repair language where renewed use is visible in load-bearing patches, replacement
    parts, stitched or bolted joins, reclaimed contrast and careful maintenance.
  subject_treatment:
    'Preserve subject and locks. Redesign open structures with repairs following stress, wear
    and function: a replaced panel, reinforced seam, fitted splice or adapted part, not patchwork for its own
    sake.'
  color_and_tone:
    Contrast original and replacement materials through restrained warm/cool or old/new values.
    Preserve palette; use small repair marks only where they clarify intervention.
  lighting_and_shadow:
    Respect specified lighting. Define added joins and repaired edges with local value separation;
    invent no work lamp or workshop glow.
  texture_and_material:
    'Show reused, mended and replacement materials through real differences: frayed textile
    beside stitching, oxidized metal beside a fitted plate, worn polish beside a new fastener.'
  camera_and_composition:
    Preserve crop and placement. Let repair paths support focal hierarchy; do not require
    a tabletop, repair bench or maker portrait.
  atmosphere_and_mood:
    Communicate care, adaptation and continued use without prescribing poverty, crisis or
    community action. Follow requested context.
  rendering_and_quality:
    Use clean functional seams, tactile print texture and selective detail at repair junctions.
    Keep repairs plausible; avoid random patches and uniform distress. Preserve the requested scene;
    show repair through existing subjects and objects, without invented slogans, posters, labels or workshop props unless requested.
avoidRules:
  - Do not make every design broken, distressed or patched.
  - Do not impose a workshop, repair scene, poverty narrative or community plot.
  - Tie each repair to a visible functional need.
  - Preserve the requested scene; do not add repair slogans, posters, labels or workshop props unless requested.
