visualDna:
  aesthetic: 'Cross stitch: X-shaped stitches forming pixel-like motifs on even-weave fabric.'
  subject_treatment: "Apply this motif built from cross stitches on the fabric of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: X-stitch motifs on an even-weave grid."
  color_and_tone: Embroidery floss colors, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: X stitches on aida cloth, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at a glance.
  atmosphere_and_mood: Homely, handmade, charming and patient, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: X stitches; even-weave grid
  creative_brief: "Cross stitch: X-shaped stitches forming pixel-like motifs on even-weave fabric. Carry it through X stitches, even-weave grid. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
