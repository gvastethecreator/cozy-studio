visualDna:
  aesthetic: >-
    Oak Wood (Raw) translates natural material behavior into form: start from Unfinished oak plank,
    Rough wood grain, and Grain direction, then turn natural formation, growth, erosion, and
    geological or biological irregularity into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Grain lines: preserve identity and pose while letting forms
    grow, erode, polish, fracture, or soften through edge profile, surface breakup, thickness,
    contact marks, and detail scale.
  color_and_tone: >-
    Use Pale brown as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Soft ambient define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Oak Wood (Raw) without hiding the prompt
    subject.
  texture_and_material: >-
    Render Rough wood grain through organic variation, non-repeating edge wear, local pores, growth
    marks, and natural scale shifts; keep grain scale, residue, buildup, fractures, fiber, pores, or
    surface tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Grain direction as reusable material rhythm: macro-friendly for texture tasks,
    but able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Rustic, solid by using age, weather, habitat pressure, and sensory association;
    the material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Lumber yard, natural material clarity: physically coherent reflectance, clean
    contact detail, controlled micro-texture, readable silhouette behavior, and no noisy
    stock-texture overlay.
  key_features: Unfinished oak plank; Grain lines; Rough wood grain; Soft ambient; Grain direction
  creative_brief: >-
    Route any subject through Oak Wood (Raw) as a transferable natural-material visual system while
    preserving the prompt's subject, action, and setting. Tactile direction for raw oak: the grain
    tells a story of slow growth and sun-filled years. Capture the fibrous resistance beneath the
    fingertip, where every ridge and furrow is a line of natural poetry. Let the wood breathe with
    the dry warmth of a lumber yard at dawn, honest and unadorned. Use Oak Wood as portable
    surface/render behavior over any input: map its texture, light response, edge wear, color
    chemistry, and tactile rhythm onto the subject instead of requiring a literal material sample,
    macro tile, wall, landscape, source object, or scene where the material naturally appears.
