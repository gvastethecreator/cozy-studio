visualDna:
  aesthetic: >-
    Sequins treats fabrication as visible style language: start from Disco dress, Scaly plastic, and
    Flipping, then turn manufacturing process, tooling marks, seams, tolerances, and industrial
    material behavior into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Overlapping discs: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Metallic, reversible as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Sparkle define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Sequins without hiding the prompt subject.
  texture_and_material: >-
    Render Scaly plastic through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Flipping as reusable material rhythm: macro-friendly for texture tasks, but able
    to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Party, flashy by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Glam, cheap material clarity: physically coherent reflectance, clean contact detail,
    controlled micro-texture, readable silhouette behavior, and no noisy stock-texture overlay.
  key_features: Disco dress; Overlapping discs; Scaly plastic; Sparkle; Flipping
  creative_brief: >-
    Route any subject through Sequins as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Compose the kinetic glitter of sequins
    overlapping like metallic scales, each disc a tiny mirror that flips between two worlds of color
    with every shift of light, creating a surface that refuses to be still. The scaly plastic should
    catch sparkle at a thousand points simultaneously, cheap and glamorous in equal measure. Capture
    the joy of unapologetic shine, fashion as optical event. Use Sequins as portable surface/render
    behavior over any input: map its texture, light response, edge wear, color chemistry, and
    tactile rhythm onto the subject instead of requiring a literal material sample, macro tile,
    wall, landscape, source object, or scene where the material naturally appears.
avoidRules:
