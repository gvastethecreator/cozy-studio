visualDna:
  aesthetic: 'Acoustic camera: an ordinary photo overlaid with colored sound hotspots showing where noise comes from.'
  subject_treatment: "Keep the prompt subject's geometry, pose and setting; replace only its appearance with what this instrument records: a normal photo with translucent sound-intensity blobs over the loud sources, red at the center fading to blue."
  color_and_tone: Normal photo with red to blue overlay, exactly as the instrument maps its signal.
  lighting_and_shadow: Ordinary light plus overlay, because the image shows signal, not ordinary light.
  texture_and_material: Soft overlay blobs, as real instrument artifacts rather than decoration.
  camera_and_composition: Fixed camera view, matching how this instrument actually frames data.
  atmosphere_and_mood: Technical, revealing, strange and diagnostic, coming from seeing what eyes cannot.
  rendering_and_quality: Believable instrument output with correct signal logic, artifacts and resolution for that sensor.
  creative_brief: "Acoustic camera: an ordinary photo overlaid with colored sound hotspots showing where noise comes from. Carry it through sound hotspots, photo overlay. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: sound hotspots; photo overlay
