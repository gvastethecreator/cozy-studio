  camera_and_composition: >-
    Structure the image through Compose for Etching (Engraving) using its key spatial cues:
    Hatching, crosshatching, fine-line density; compose through print registration, border
    discipline, mark-direction rhythm, negative-space carving, tag flow, ornamental line weight, or
    edition-like balance, with scale, spacing, edge rhythm, and visual hierarchy doing the style
    work.
  atmosphere_and_mood: >-
    Keep the mood Serious, valuable, mint-condition reverence, time-capsule gravitas; derive mood
