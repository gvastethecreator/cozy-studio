visualDna:
  aesthetic: 'Rigid-body destruction simulation: the named structure fracturing into Voronoi chunks mid-collapse, with debris arcs, dust bursts and secondary splinters frozen in one frame.'
  subject_treatment: "Portable environment render: keep the prompt's subject, action, location and camera; only how that environment is built, simulated and rendered changes, never where it is."
  color_and_tone: Material colors of the structure plus pale dust and darker fresh fracture faces; grading stays natural.
  lighting_and_shadow: Directional key revealing each chunk as a separate solid, dust volumes catching light and shadowing debris behind them.
  texture_and_material: Clean interior fracture surfaces contrasting weathered exteriors, bent rebar or splintered beams, fine particle dust and gravel.
  camera_and_composition: Keep the requested location and camera; the collapse moves along one clear direction with a falling debris arc.
  atmosphere_and_mood: Violent and suspended, the loud instant a structure gives up.
  rendering_and_quality: Simulation-accurate chunk sizes grading from large to small, with slight motion blur on the fastest pieces.
  creative_brief: "Rigid-body destruction simulation: the named structure fracturing into Voronoi chunks mid-collapse, with debris arcs, dust bursts and secondary splinters frozen in one frame. Carry it through Voronoi fracture chunks, fresh interior fracture faces, debris arc, dust volume bursts, large-to-small chunk grading. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Voronoi fracture chunks; fresh interior fracture faces; debris arc; dust volume bursts; large-to-small chunk grading
