  lighting_and_shadow: Harsh battlefield light, smoke haze and green scope glow.
  texture_and_material: Gritty hand-painted cel, mud, oil and dented armor.
  camera_and_composition: Ground-level walker charges, cockpit scope views and grim trench shots.
  atmosphere_and_mood: Keep the requested mood with grim expendable attrition.
  rendering_and_quality: Gritty 1983 real-robot television frame with dented disposable hardware and grime.
  key_features: VOTOMS squat walkers; mud and oil; stoic soldiers; attrition
  creative_brief: "Sunrise Armored Trooper VOTOMS look (1983): squat disposable four-meter armored walkers, grimy battlefields, gritty cel with Norio Shioyama designs and grim expendable soldiers. Carry it through VOTOMS squat walkers, mud and oil, stoic soldiers, attrition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
