visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine dark contours threaded by thin cyan accents and
    reflective planes and sharply blocked negative shapes. Let long linear trails interrupted by
    short, quiet breaks set its rhythm; use blue-black and charcoal with narrow cyan highlights
    for color and broken reflective highlights and fine surface streaks over matte dark fields for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine dark contours threaded by thin cyan
    accents for edge work, reflective planes and sharply blocked negative shapes for form
    simplification, and long linear trails interrupted by short, quiet breaks only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with blue-black and charcoal with narrow cyan highlights. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: cool reflected accents against deep shadow, without implying a new
    light source. Keep shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with broken reflective highlights and fine surface streaks over matte
    dark fields, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use guarded negative space, off-center balance, and a
    narrow path through the frame to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey lonely secrecy and restrained unease, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with thin cyan line accents, dark reflective values, and generous negative space; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    fine dark contours threaded by thin cyan accents; reflective planes and sharply blocked
    negative shapes; blue-black and charcoal with narrow cyan highlights; long linear trails
    interrupted by short, quiet breaks; broken reflective highlights and fine surface streaks over
    matte dark fields; guarded negative space, off-center balance, and a narrow path through the
    frame.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine dark contours
    threaded by thin cyan accents, reflective planes and sharply blocked negative shapes, and
    blue-black and charcoal with narrow cyan highlights; use long linear trails interrupted by
    short, quiet breaks only where movement is already present, and apply broken reflective
    highlights and fine surface streaks over matte dark fields as the drawing finish.
