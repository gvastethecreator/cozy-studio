visualDna:
  aesthetic: >-
    Treat the named lineage as a technique reference: observational naturalism, believable weight,
    quiet contour economy and environmental detail integrated into the same visual space.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use restrained, natural color
    and nuanced values; keep skin, object and setting colors faithful to the prompt.
  lighting_and_shadow: >-
    Favor plausible ambient daylight and soft contact shadows; follow the stated source and time of
    day.
  texture_and_material: >-
    Use fine, economical line and small grounded texture; detail the environment only where it is
    already present.
  camera_and_composition: >-
    Compose with patient observation and natural spacing; do not force a human-centered shot or
    landscape.
  atmosphere_and_mood: >-
    Quiet realism comes from observed form and weight; preserve the requested tone rather than
    making every subject solemn.
  rendering_and_quality: >-
    Apply the drawing and observation method to any subject; do not copy a character, shot, costume
    or scene from the referenced artist. Keep important silhouettes and joins legible; no watermark,
    unrequested text or interface.
  key_features: >-
    Observational naturalism; economical contour; believable weight; quiet environmental
    integration; nuanced light.
  creative_brief: 'Apply this visual treatment to the requested content: Observational naturalism; economical contour; believable weight; quiet environmental integration; nuanced light. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - distorted proportions obscuring observed weight
  - decorative effects concealing naturalistic contour
  - surface glare masking material cues
