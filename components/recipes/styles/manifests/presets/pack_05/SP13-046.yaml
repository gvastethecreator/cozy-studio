visualDna:
  aesthetic: 'Anime secondary-motion staging: the body has just stopped or turned, and everything loose on it, including hair, cloak, sleeves and straps, keeps flowing in long lagging S-curves that show where the movement came from.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the secondary-motion emphasis on cloth, hair and loose parts, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; cloth and hair take slightly lighter underside tones so their curves read clearly.
  lighting_and_shadow: Soft key light that runs along each fabric fold and hair lock, giving every curve a light and a dark side.
  texture_and_material: Flowing cel-shaded fabric and hair with clean tapering tips; no streaks or blur.
  camera_and_composition: Medium-full shot with space on the side the loose parts trail toward, the body near a third line.
  atmosphere_and_mood: Graceful, lingering momentum after a decisive move.
  rendering_and_quality: Clear S-curves of consistent lag and still, sharp faces and hands.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Cloth-and-Hair Follow-Through Trails as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: lagging S-curves in hair and cloth; body already stopped or turned; tapering tips; light along each fold; trailing space
