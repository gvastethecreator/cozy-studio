  color_and_tone: Military blue, alien flesh red, cold command teal.
  lighting_and_shadow: Cold command-room glow and orange battlefield flare light across swarms.
  texture_and_material: Clean digital cel with CG mechs and swarms.
  camera_and_composition: Command-room wides and massive swarm battles covering entire landscapes.
  atmosphere_and_mood: Keep the requested mood with grim extinction pressure.
  rendering_and_quality: Grim military mecha frame with extinction-scale alien swarms.
  key_features: Muv-Luv surface fighters; alien swarms; grim command; extinction scale
