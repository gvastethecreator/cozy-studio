visualDna:
  aesthetic: '90s TV anime: hand-painted cel animation with pastel-and-neon color, sparkle overlays and the soft grain of a broadcast tape.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Pastel pinks, lilacs and sky blues with neon accents, soft airbrushed gradients.
  lighting_and_shadow: Two-tone cel shading with airbrushed highlights, backlit rim glows, sunset skies.
  texture_and_material: Cel paint texture, sparkle and speed-line overlays, VHS softness.
  camera_and_composition: Dramatic diagonal poses, hair and ribbons flowing, painted skies behind.
  atmosphere_and_mood: Nostalgic and romantic, sparkle and melancholy in one frame.
  rendering_and_quality: Broadcast cel look with slight grain; original characters, no franchise designs.
  key_features: pastel-neon cel palette; airbrushed highlights; sparkle overlays; flowing hair; VHS softness
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Anime (90s Aesthetic) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - modern digital anime
  - modern digital
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - watermark
  - logo clutter
  - generic stock footage
  - uncontrolled noise
  - random cartoon face
  - unreadable motion smear
  - fake subtitles
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
