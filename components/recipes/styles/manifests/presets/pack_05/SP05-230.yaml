  color_and_tone: Black ink with grey tone and cold empty whites.
  lighting_and_shadow: Faint cold light from distant fixtures swallowed by vast darkness.
  texture_and_material: Scratchy architectural pen line, heavy black voids and industrial texture.
  camera_and_composition: Tiny lone figures lost inside colossal megastructures that vanish into darkness.
  atmosphere_and_mood: Keep the requested mood with vast silent desolation.
  rendering_and_quality: Scratchy cyberpunk manga illustration with immense silent architectural scale.
  key_features: Tsutomu Nihei megastructures; silence; scratchy line; vast scale
  creative_brief: "Tsutomu Nihei BLAME! manga look: endless megastructures, vast silent industrial voids, sketchy scratchy line, tiny lone wanderers and cold biomechanical horror. Carry it through Tsutomu Nihei megastructures, silence, scratchy line, vast scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
