visualDna:
  aesthetic: 'Hand-carved rubber stamp: simple motifs cut into a soft rubber block, inked from a pad and pressed by hand, often repeated across the sheet.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing as an impression of this print process; ink transfer, plate or block marks, registration and paper identify the process without requiring any particular scene.
  color_and_tone: One or two stamp-pad inks, such as red, black, navy or green, with density varying from impression to impression.
  lighting_and_shadow: No modeling; forms shown by solid areas and carved lines only, occasional partial darkness where ink pooled.
  texture_and_material: Incomplete impressions with pale patches where pressure missed, halo of ink at the carved edges, slightly tilted repeats, paper fiber visible.
  camera_and_composition: Keep the requested subject; it may repeat several times in a loose hand-placed arrangement.
  atmosphere_and_mood: Homemade, cheerful and a little clumsy, a craft-table charm.
  rendering_and_quality: Uneven hand-pressed ink coverage and slightly rotated repeats; no perfect alignment, no gradients, no readable text.
  key_features: hand-carved rubber motif; patchy incomplete impressions; ink halos at edges; tilted repeats; one or two pad inks
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Carved Rubber Stamp as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
