visualDna:
  aesthetic: 'Obsidian: black volcanic glass with conchoidal fractures, razor edges and glassy sheen.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is knapped from obsidian, with shell-like fracture scars and sharp edges."
  color_and_tone: Glossy black with smoky brown and rainbow sheen, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Hard rim light showing the glassy edges, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Volcanic glass with conchoidal ripples and translucent edges, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Dangerous, sleek, dark and primordial, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: black volcanic glass; conchoidal fractures; razor edges; rainbow sheen
  creative_brief: "Obsidian: black volcanic glass with conchoidal fractures, razor edges and glassy sheen. Carry it through black volcanic glass, conchoidal fractures, razor edges, rainbow sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
