visualDna:
  aesthetic: 'Ironbow thermal imaging: a longwave infrared camera mapping temperature to a black-purple-red-orange-yellow-white palette, so heat, not light, defines the image.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: 'Ironbow palette: cold areas deep indigo and purple, warm bodies orange, hottest points yellow-white.'
  lighting_and_shadow: No visible light logic; shapes read by temperature, with heat bleeding softly into cold surroundings.
  texture_and_material: Surface detail replaced by smooth thermal gradients; breath, hot spots and cooling trails visible.
  camera_and_composition: Keep the requested framing; the thermal palette is the transferable part.
  atmosphere_and_mood: Revealing and clinical, hidden heat made suddenly visible.
  rendering_and_quality: Radiometric camera look with soft low-resolution gradients; no UI crosshairs or readable scale.
  key_features: ironbow palette; heat as brightness; smooth thermal gradients; hot white peaks; no visible-light shading
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ironbow Thermal Imaging as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
