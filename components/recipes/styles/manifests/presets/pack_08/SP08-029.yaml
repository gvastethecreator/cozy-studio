visualDna:
  aesthetic: 'Dark academia: scholarly tailoring in autumnal darks — tweed blazers, turtlenecks, pleated trousers, long wool coats, oxfords and wire glasses.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: a tweed blazer or long wool coat, turtleneck or collared shirt with sweater vest, pleated trousers or skirt, oxford shoes and round wire glasses.'
  color_and_tone: Chocolate brown, charcoal, burgundy, forest green and ivory, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Dim library lamplight or grey autumn light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Tweed, wool, corduroy, leather and aged paper tones, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Contemplative three-quarter or full figure among books or old architecture.
  atmosphere_and_mood: Brooding, intellectual, melancholic and romantic, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Moody, warm-shadowed finish, with believable fabric weight, seams and fit detail.
  key_features: tweed blazer and turtleneck; long wool coat; oxfords; wire glasses; autumnal dark palette
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dark Academia as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
