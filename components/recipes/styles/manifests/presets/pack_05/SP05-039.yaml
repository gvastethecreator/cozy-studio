visualDna:
  aesthetic: >-
    Build the graphic anime treatment from precise diagram-like lines layered over clean animated
    contours and modular shapes linked by branching, non-literal connector lines. Let sequenced
    paths that fork, loop, and pause set its rhythm; use clear blue, white, and selected bright
    accents against ink-dark for color and clean flat fields with fine rule lines and no legible
    labels for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use precise diagram-like lines layered over clean
    animated contours for edge work, modular shapes linked by branching, non-literal connector
    lines for form simplification, and sequenced paths that fork, loop, and pause only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with clear blue, white, and selected bright accents against ink-dark. Place
    the strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: even graphic values and sharply defined edges. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean flat fields with fine rule lines and no legible labels,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use orderly clusters linked across layered space, with
    clear intervals to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey playful strategic clarity, while preserving the
    prompt's emotional intent.
  rendering_and_quality: >-
    Finish with crisp segments, simple color logic, and a small number of diagram lines; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    precise diagram-like lines layered over clean animated contours; modular shapes linked by
    branching, non-literal connector lines; clear blue, white, and selected bright accents against
    ink-dark; sequenced paths that fork, loop, and pause; clean flat fields with fine rule lines
    and no legible labels; orderly clusters linked across layered space, with clear intervals.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with precise diagram-like
    lines layered over clean animated contours, modular shapes linked by branching, non-literal
    connector lines, and clear blue, white, and selected bright accents against ink-dark; use
    sequenced paths that fork, loop, and pause only where movement is already present, and apply
    clean flat fields with fine rule lines and no legible labels as the drawing finish.
