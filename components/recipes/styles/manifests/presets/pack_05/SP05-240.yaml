visualDna:
  aesthetic: >-
    Triadic riot graphics using sharp triangular cuts, three-part color rhythm, angular
    contours, and tightly controlled high-energy contrast.
  subject_treatment: >-
    Keep the requested subject and silhouette. Carry its existing divisions through crisp
    triangular line accents and directional marks without adding weapons or armor.
  color_and_tone: >-
    Organize ember orange, hot yellow, and electric cyan as distinct accents over charcoal and
    neutral midtones; avoid mixing them into mud.
  lighting_and_shadow: >-
    Use hard cel-shadow wedges with clean warm and cool edge highlights; do not create literal
    fire or energy weapons.
  texture_and_material: >-
    Respect the original material; add sharp painted facets, fine scratches, and brief color
    slashes without changing its substance.
  camera_and_composition: >-
    Keep the requested framing. Use triangular visual paths and counter-slanting marks within it
    rather than forcing a battle pose.
  atmosphere_and_mood: >-
    Create rebellious energy through asymmetry, clipped accents, and a quick three-beat rhythm,
    independent of subject matter.
  rendering_and_quality: >-
    Favor crisp edges, strong cel-shadow separation, bounded color fields, and minimal glow for
    a clean graphic finish.
  key_features: >-
    Triadic accent palette; triangular contour cuts; hard shadow wedges; counter-slanting
    rhythm.
  creative_brief: >-
    Retain the specified subject, action, and setting. Use three-part color accents, triangular
    line cuts, and crisp shadows; add no fire, weapon, armor, or battle pose.
