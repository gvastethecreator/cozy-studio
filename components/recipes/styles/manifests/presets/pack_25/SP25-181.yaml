visualDna:
  aesthetic: 'Plotter-Facet Lettering: curves approximated by straight segments of related length, like letters traced by a pen plotter, anatomy kept intact.'
  subject_treatment: Letter the requested words with curves built from straight segments of related length and joins, keeping every character's anatomy and every sign exact.
  color_and_tone: One high-contrast ink with the facets left crisp and ungraded.
  lighting_and_shadow: Flat graphic rendering with the segments drawn as pure line and shape.
  texture_and_material: Clean contours and controlled joins so every segment reads.
  camera_and_composition: Word rhythm built from widths and spaces rather than identical letter boxes.
  atmosphere_and_mood: Tool-made precision and angular tension, distinctly engineered and exact.
  rendering_and_quality: Crisp lettering where segments follow one logic through curves and signs.
  creative_brief: "Plotter-Facet Lettering: curves approximated by straight segments of related length, like letters traced by a pen plotter, anatomy kept intact. Carry it through segmented curves, plotter logic, angular joins, exact characters. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: segmented curves; plotter logic; angular joins; exact characters
