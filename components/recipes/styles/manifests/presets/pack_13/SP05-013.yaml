visualDna:
  aesthetic: >-
    Tapered anime contour joins organic curves to segmented engineered seams over compact
    cel planes.
  subject_treatment: >-
    Keep silhouette and proportions; segment only forms that support mechanical detail.
  color_and_tone: >-
    Iron charcoal, mineral teal, muted ochre; three clear value bands and one warm accent.
  lighting_and_shadow: >-
    One hard key, broad shadows, and narrow edge light only along existing contours.
  texture_and_material: >-
    Smooth cel fills with sparse etched seams and short hatch; no blanket noise.
  camera_and_composition: >-
    Respect camera; clipped diagonals and bounded negative space carry tension without added
    walls.
  atmosphere_and_mood: >-
    Interrupted edges and compressed spacing suggest pressure; the requested mood leads.
  rendering_and_quality: >-
    Stable anatomy and crisp micro-detail, restrained cel bands, no gloss.
  key_features: >-
    Organic-mechanical contours, compact cel shadows, mineral teal, compressed negative
    space
  creative_brief: >-
    Apply a visual treatment centered on organic-mechanical contours, compact cel shadows,
    mineral teal, compressed negative space. Preserve the exact subject, action, count, age,
    costume, setting, camera, and mood. Add nothing outside the prompt.
