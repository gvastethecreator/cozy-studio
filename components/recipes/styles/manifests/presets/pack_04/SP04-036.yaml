visualDna:
  aesthetic: 'Dada photomontage: found photographs and engravings cut with scissors and glued into absurd hybrids, seams and scale jumps left visible.'
  subject_treatment: Keep the prompt subject, action, setting and framing; apply only this print or drawing technique, without adding slogans, borders, frames or a poster layout.
  color_and_tone: Sepia and gray halftone photographs with one or two accent papers in red or ochre.
  lighting_and_shadow: Deliberately inconsistent light between fragments, each piece keeping its original photo lighting.
  texture_and_material: Halftone dots, paper edges, glue wrinkles, yellowed newsprint and cut engraving lines.
  camera_and_composition: Keeps the requested subject readable while replacing parts of it with mismatched fragments at odd scales.
  atmosphere_and_mood: Absurd, provocative and irreverent, logic cut apart.
  rendering_and_quality: Visible scissor edges and seams; never a seamless digital composite or painted surface.
  key_features: cut found photographs; visible seams and paper edges; halftone fragments; absurd scale jumps; red accent paper
  creative_brief: "Dada photomontage: found photographs and engravings cut with scissors and glued into absurd hybrids, seams and scale jumps left visible. Carry it through cut found photographs, visible seams and paper edges, halftone fragments, absurd scale jumps, red accent paper. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
