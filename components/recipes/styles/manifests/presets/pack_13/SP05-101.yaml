visualDna:
  aesthetic: >-
    Let watercolor blooms, pigment granulation and wet-paper movement soften or dissolve selected
    contours; preserve the subject through value and silhouette.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use translucent washes and
    natural pigment mixing; preserve prompt colors and avoid flattening everything into solid fills.
  lighting_and_shadow: >-
    Allow blooms and edge loss where wash gathers; keep requested light direction and focal values
    legible.
  texture_and_material: >-
    Show paper tooth, ink pooling, granulation and selective disappearing linework; leave deliberate
    unpainted space.
  camera_and_composition: >-
    Keep the source layout stable while washes flow within existing forms; do not turn abstractions
    into new objects.
  atmosphere_and_mood: >-
    Fluidity comes from pigment behavior and negative space; retain the prompt's mood and
    readability.
  rendering_and_quality: >-
    Apply the wet-media mechanics to any subject without adding water, scenery or abstract forms
    absent from the prompt. Keep important silhouettes and joins legible; no watermark, unrequested
    text or interface.
  key_features: >-
    Watercolor blooms; disappearing contour; ink pools; pigment granulation; wet-paper texture;
    negative space.
  creative_brief: >-
    Apply this visual treatment to the requested content: Watercolor blooms; disappearing contour;
    ink pools; pigment granulation; wet-paper texture; negative space. Preserve its identity,
    action, materials, composition and requested tone; introduce no persona, scene, franchise cue or
    extra motif.
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - uniform opaque fills erasing pigment blooms
  - continuous hard outlines enclosing every form
  - wash bleed obscuring the silhouette
assets:
  defaultImage: /assets/recipes/styles/defaults/SP05-101.webp
attributes:
  negativePrompt: >-
    photoreal cosplay rendering, 3D render look, plastic airbrush gloss obscuring the style's
    defining marks, undifferentiated anime filter erasing the preset's signature mechanics,
    unrequested default-image characters, costume details, props or setting, unrequested
