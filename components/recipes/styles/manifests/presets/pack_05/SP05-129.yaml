visualDna:
  aesthetic: 'Madhouse One-Punch Man look (2015): hyper-detailed muscular monsters and heroes contrasted with a plain round-lined deadpan hero drawn with dot eyes, and spectacular sakuga destruction.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the calm deadpan figure with plain round lines and dot eyes, and everyone else with hyper-detailed muscles and dramatic faces. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Bright comic primaries, city grey and explosive yellow impact bursts.
  lighting_and_shadow: Explosive impact flashes and dramatic rim light on the detailed fighters.
  texture_and_material: Contrast of plain simple line and dense detailed rendering, debris clouds.
  camera_and_composition: Epic destruction wide shots cut against calm deadpan close-ups of the plain hero.
  atmosphere_and_mood: Keep the requested mood with deadpan heroic satire.
  rendering_and_quality: Spectacular sakuga television frame with deadpan contrast between plain and detailed figures.
  key_features: One-Punch contrast; plain dot-eyed hero; detailed monsters; destruction
  creative_brief: "Madhouse One-Punch Man look (2015): hyper-detailed muscular monsters and heroes contrasted with a plain round-lined deadpan hero drawn with dot eyes, and spectacular sakuga destruction. Carry it through One-Punch contrast, plain dot-eyed hero, detailed monsters, destruction. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
