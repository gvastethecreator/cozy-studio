visualDna:
  aesthetic: >-
    Painted contours and bounded pigment areas describe depth through overlap, relative scale and
    clear spatial layers rather than photographic blur. This study refers specifically to the
    Ilkhanid-period Great Mongol Shahnama corpus, not Persian or Islamic painting as a whole.
  subject_treatment: >-
    Preserve requested identity, proportions, count, action and relationships. Keep existing forms
    readable as painted planes; do not truncate them, extend them beyond the frame or restage the scene.
  color_and_tone: >-
    Preserve the requested palette and value range. Separate overlapping forms with clear pigment
    boundaries without requiring gold, a fixed historical palette or saturated colors.
  lighting_and_shadow: >-
    Follow the requested illumination and shadow direction. Use overlap and relative scale to clarify
    depth without adding atmospheric haze, a new light source or photographic depth of field.
  texture_and_material: >-
    Use clean, intentional pigment boundaries and distribute detail by spatial plane. Preserve the
    depicted materials; do not add paper grain, carpet texture or other material cues unless requested.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation and arrangement. Layered space does not
    authorize a different camera, panoramic layout or forms extending past the frame.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. The historical reference is a specific Ilkhanid manuscript
    tradition with cross-cultural artistic exchange; do not infer a Persian or Mongol story, costume,
    architecture, carpet or script from the style label.
  rendering_and_quality: >-
    Keep contours legible and depth cues deliberate. Avoid photographic blur and prevent detail in one
    plane from overwhelming the requested subject or spatial relationships.
avoidRules:
  - unrequested Persian or Mongol narrative, costume or architecture
  - unrequested carpet, calligraphy or paper texture
  - photographic depth of field or global blur
  - unrequested panoramic restaging or forms beyond the frame
