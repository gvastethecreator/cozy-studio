visualDna:
  aesthetic: 'Procedural vine overgrowth: branching stems grown by a space-colonization algorithm, climbing and wrapping every surface of the subject toward the light.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; grow procedural vines, roots and leaves over it along its surfaces without hiding its silhouette or changing what it is (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: Fresh leaf greens and dark stems with small pale blossoms, laid over the subject's own colors.
  lighting_and_shadow: Directional sunlight with dappled leaf shadows on the subject beneath and backlit translucent leaves.
  texture_and_material: Branch thickness tapering from root to tip, tendrils gripping edges and leaves turned toward the light.
  camera_and_composition: Keep the requested view; the growth direction of the vines leads the eye upward across the subject.
  atmosphere_and_mood: Patient and reclaiming, nature quietly taking something back.
  rendering_and_quality: Branching with correct taper and attachment, with no floating leaves or random green noise.
  creative_brief: "Procedural vine overgrowth: branching stems grown by a space-colonization algorithm, climbing and wrapping every surface of the subject toward the light. Carry it through algorithmic branching vines, taper from root to tip, tendrils gripping edges, dappled leaf shadows, growth toward light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: algorithmic branching vines; taper from root to tip; tendrils gripping edges; dappled leaf shadows; growth toward light
