visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Castle Crashers gameplay screenshots: 2D co-op
    beat-em-up capture with thick cartoon outlines, side-scrolling castle lanes, chunky enemies, and
    four-player chaos readability. Apply this after prompt X; prompt X supplies the subject, action,
    setting, and intensity while this preset supplies capture language, camera grammar, material
    behavior, playable readability, and finish. Do not recreate an exact official level, character,
    logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Castle Crashers-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Castle Crashers-informed palette: flat knight primaries, grass green, castle grey, orange
    fire, candy gore red, and simple shadow colors. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through mostly flat stage lighting with spell pops, impact flashes, torch
    accents, and no realistic global illumination. Lighting must clarify the playable route, threat,
    focal subject, or objective and avoid generic cinematic bloom that destroys screenshot
    readability.
  texture_and_material: >-
    Build surfaces from vector-like cartoon sprites, simple tiled ground, bold weapons, goofy armor
    shapes, and exaggerated hit effects. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with side-view brawler lane with multiplayer spacing, enemy crowds, pickup readability,
    and foreground/background stage layers. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Castle Crashers-derived mood: violent, playful, chaotic, arcade-like, and comic without
    becoming childish. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: co-op health bars, player
    icons, XP numbers, and pickup prompts are allowed when they support brawler screenshot logic.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Castle Crashers gameplay screenshots; 2D co-op beat-em-up capture with thick cartoon outlines,
    side-scrolling castle lanes, chunky enemies, and four-player chaos readability; flat knight
    primaries, grass green, castle grey, orange fire, candy gore red, and simple shadow colors;
    mostly flat stage lighting with spell pops, impact flashes, torch accents, and no realistic
    global illumination; vector-like cartoon sprites, simple tiled ground, bold weapons, goofy armor
    shapes, and exaggerated hit effects; side-view brawler lane with multiplayer spacing, enemy
    crowds, pickup readability, and foreground/background stage layers; violent, playful, chaotic,
    arcade-like, and comic without becoming childish; HUD guidance: co-op health bars, player icons,
    XP numbers, and pickup prompts are allowed when they support brawler screenshot logic
  creative_brief: >-
    Use Castle Crashers Co-op Siege as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from Castle Crashers: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
