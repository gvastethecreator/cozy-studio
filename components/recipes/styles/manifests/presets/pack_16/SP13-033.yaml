    marionette accent system held inside disciplined cel values; anchor it in peat black, cold
    indigo, mineral gray, crimson omen accents, sickly cyan reflections, and desaturated skin tones;
    keep value separation clean, cel flats intentional, accents purposeful, and palette behavior
    attached to the requested content.
  lighting_and_shadow: >-
    Use spotlight isolation and theatrical shadow falloff, alongside a grotesque light logic using
