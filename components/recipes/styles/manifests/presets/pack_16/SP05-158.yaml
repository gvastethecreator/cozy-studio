visualDna:
  aesthetic: >-
    Quiet digital anime built from softened edges, selective detail and gentle integration
    with painted backgrounds.
  subject_treatment: >-
    Keep requested forms recognizable. Let secondary contours recede and use partial detail
    without omitting any detail the prompt requires.
  color_and_tone: >-
    Follow the supplied palette. If open, keep contrast muted and reserve a restrained
    accent for the focal form.
  lighting_and_shadow: >-
    Use weak rim glow and soft darkness while retaining enough value separation to read the
    subject.
  texture_and_material: >-
    Use fine paper-like grain and soft surface transitions only where they suit the depicted
    material.
  camera_and_composition: >-
    Preserve the given frame; near-silent spacing may direct attention to existing negative
    space.
  atmosphere_and_mood: >-
    Quiet tension may come from gaps and low contrast when compatible; follow the prompt's
    emotional tone.
  rendering_and_quality: >-
    Balance selective detail and soft transitions with a clear focal silhouette; keep fine
    marks subordinate.
  key_features: >-
    Softened edge; partial detail; weak rim glow; selective contrast; negative
    space and painted-background integration.
  creative_brief: "Apply selective detail, softened edges and restrained light to the prompt's existing content. Preserve its scene, camera and requested tone. Use it as a reusable look on any subject."
