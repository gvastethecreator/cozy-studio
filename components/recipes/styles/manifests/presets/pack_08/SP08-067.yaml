  lighting_and_shadow: Bright light making each bubble glint, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Bubble wrap with rows of air cells, creases and tape.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at card size; the material effect stays on the clothing.
  atmosphere_and_mood: Playful, absurd, pop and inventive, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
