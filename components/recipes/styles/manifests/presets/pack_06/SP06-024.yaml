visualDna:
  aesthetic: 'Conté crayon drawing: square sticks of hard pressed chalk in sanguine red, bistre brown, black and white used on a mid-toned buff paper.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this drawing tool only; line quality, pressure response and paper behavior must identify the tool even on a simple object.
  color_and_tone: Earth range of red, brown and black for shadows, white for highlights, and the buff paper serving as the mid-tone.
  lighting_and_shadow: 'Strong sculptural light: dark crayon only in shadows, white only on the brightest planes, paper tone left between.'
  texture_and_material: Firm square-edge strokes, crisp corners of the stick for lines and the flat side for tone, paper grain visible through light passes.
  camera_and_composition: Keep the requested framing; broad sculptural planes with confident contour lines.
  atmosphere_and_mood: Warm, classical and sculptural, like an old study sheet.
  rendering_and_quality: Controlled hard chalk hatching with crisp edges, three values plus paper tone; less smudging than charcoal.
  key_features: sanguine, bistre and black crayon; white chalk highlights; buff paper as mid-tone; square-stick hatching; sculptural planes
  creative_brief: "Conté crayon drawing: square sticks of hard pressed chalk in sanguine red, bistre brown, black and white used on a mid-toned buff paper. Carry it through sanguine, bistre and black crayon, white chalk highlights, buff paper as mid-tone, square-stick hatching. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
