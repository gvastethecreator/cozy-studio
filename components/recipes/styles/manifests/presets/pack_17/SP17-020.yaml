visualDna:
  aesthetic: >-
    Futuristic crusader armor with medieval plate grammar, lit sigils, modular joints, and ritual
    tech.
  subject_treatment: >-
    Transform any subject with techno-crusader armor language: sealed plate segmentation,
    servo-joint rhythm, relic-battery accents, tabard-like planes, oath-hardware geometry, and
    faceless devotional tech without requiring a full paladin suit.
  color_and_tone: Black steel, off-white cloth, red seal accents, amber LEDs, and cold blue edge light.
  lighting_and_shadow: Hard rim light and simple seam glow define armor planes while keeping all major details visible.
  texture_and_material: >-
    Ceramic plating, scratched steel, woven tabards, rubberized joints, enamel symbols, and dusty
    circuitry.
  camera_and_composition: >-
    Three-quarter armor-design hierarchy, low heroic angle, optional helm or shield geometry, and
    strong heraldic symmetry without requiring a full suit showcase.
  atmosphere_and_mood: >-
    Carry the prompt through Disciplined, militant, sacred, and technological; sacred futurism,
    oath-bound technology, analog prophecy, relic machinery, and luminous feudal strangeness; the
    tone should follow prompt X while preserving the preset's medieval-zine identity.
  rendering_and_quality: >-
    Armored fantasy illustration with clean silhouette, defined linework, tactile materials, and
    limited VFX.
  creative_brief: >-
    Route any subject through techno crusader armor language: preserve the prompt while adding
    sealed plate rhythm, oath hardware, relic batteries, servo geometry, and future medieval
    devotion without requiring a knight suit. Apply after prompt X: prompt X supplies subject,
    action, setting, tone, and intensity, while this preset supplies a style grammar of Techno
    Crusader Armor; Futuristic crusader armor with medieval plate grammar; lit sigils; modular
    joints; ritual tech; servo joint rhythm, mood, material behavior, framing logic, and denoised
    medieval-zine finish without requiring a fixed cast, fixed relic, fixed monster, readable text,
    or sample-card composition.
  key_features: >-
    Techno Crusader Armor; Futuristic crusader armor with medieval plate grammar; lit sigils;
    modular joints; ritual tech; servo joint rhythm
