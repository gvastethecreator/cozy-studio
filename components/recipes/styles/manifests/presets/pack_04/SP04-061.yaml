visualDna:
  aesthetic: 'Linocut relief print: the image carved into linoleum with V and U gouges, uncarved areas printed as flat solid ink and carved areas left paper white.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: One or two flat ink colors, usually black plus one warm color, on cream paper with no gradients.
  lighting_and_shadow: 'Light expressed by how much is carved away: bold white gouge strokes in highlights, solid black in shadow.'
  texture_and_material: Directional gouge strokes following the forms, chattering chisel edges, speckled uneven ink roll with paper showing through the solids.
  camera_and_composition: Keep the requested view; forms simplified into bold shapes and strong black-white pattern areas.
  atmosphere_and_mood: Bold, handmade and earthy, carved with a strong hand.
  rendering_and_quality: Chunky relief print with slight ink squash at the edges; no fine hairlines and no halftone.
  key_features: V and U gouge strokes; flat solid ink areas; speckled ink roll; one or two colors; directional carving rhythm
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Linocut Print as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
