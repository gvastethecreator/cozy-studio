visualDna:
  aesthetic: 'Orbital ribbon habitat: a landscape laid on the inside of a vast ring, the ground rising into the sky on both sides, held in by charcoal containment walls.'
  subject_treatment: Keep the requested subject, action and geometry stable; this preset owns the ring-habitat setting whose horizon curves upward, and it never bends, loops or breaks the requested structure.
  color_and_tone: Ocean cyan bands, green and ochre land strips, atmospheric blue haze and charcoal walls; natural and airy.
  lighting_and_shadow: Sunlight falling from overhead through shade panels, the far arc of the ring hazed and bright.
  texture_and_material: Real terrain, clouds and water on the near ground, fading to a map-like band as the ring rises away.
  camera_and_composition: Keep the requested subject in the foreground; the horizon never falls away but always climbs upward.
  atmosphere_and_mood: Expansive and uncanny, the whole world overhead.
  rendering_and_quality: Naturalistic landscape rendering with correct aerial haze along the rising arc; never a globe view.
  key_features: horizon curving upward; landscape band overhead; charcoal containment walls; ocean-cyan strips; aerial haze along the arc
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Orbital Ribbon Habitat as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
