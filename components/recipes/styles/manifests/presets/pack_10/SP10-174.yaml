visualDna:
  aesthetic: 'Die-cut layers: stacked laser-cut paper layers creating depth.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is built from stacked die-cut paper layers with shadows."
  color_and_tone: Tonal paper layers, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Cut paper edges and layered shadows, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at a glance.
  atmosphere_and_mood: Delicate, deep, crafted and magical, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Die-cut layers: stacked laser-cut paper layers creating depth. Carry it through stacked die-cut layers, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stacked die-cut layers; physical print process
