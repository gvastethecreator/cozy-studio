visualDna:
  aesthetic: >-
    Layer offset rectangular planes with broad signal arcs, short scanline intervals, and a localized
    veil of fine static.
  subject_treatment: >-
    Preserve the requested subject and action; integrate signal patterns into existing forms without
    adding a crowd or broadcast room.
  color_and_tone: >-
    Anchor charcoal and warm cream with restrained cyan or phosphor green and a small red accent; follow
    requested palette.
  lighting_and_shadow: Use a contained halo and narrow signal edges; keep other illumination tied to the requested scene.
  texture_and_material: Contrast matte planes, glassy highlights, and patterned static localized to a few areas.
  camera_and_composition: >-
    Preserve crop; use offset layers, one or two broad arcs, and open negative space rather than a fixed
    monitor wall.
  atmosphere_and_mood: Suggest transmission and low-grade interference through rhythm and spacing, not a venue or audience.
  rendering_and_quality: Keep the underlying silhouette stable and separate signal marks from structural edges.
avoidRules:
  - static spread equally across all forms
  - arcs that distort the focal silhouette
  - offset planes becoming a literal wall of screens
