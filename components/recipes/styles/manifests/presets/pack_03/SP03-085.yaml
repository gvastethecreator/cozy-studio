visualDna:
  aesthetic: 'Progressive preview render: a path-traced image stopped early, still full of grain and bright fireflies before it converges.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Correct colors under heavy speckle; shadows grainy and slightly colored.
  lighting_and_shadow: Realistic light with noisy soft shadows; caustics and small lights sparkling as fireflies.
  texture_and_material: Dense per-pixel noise, especially in dark areas and glossy reflections.
  camera_and_composition: Final framing, the noise strongest in shadows and interiors.
  atmosphere_and_mood: Anticipating and raw, an image caught in the middle of being born.
  rendering_and_quality: Unconverged path-trace grain; not film grain and not a denoised image.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Progressive Preview Noise Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: heavy sample noise; bright fireflies; grainy shadows; unconverged glossy reflections; correct underlying light
