  color_and_tone: Indigo, violet and teal with a few warm window lights.
  lighting_and_shadow: Moonlight tint everywhere, warm pools around lights, kept consistent across the whole image.
  texture_and_material: Same crisp pixels with cool shifted colors, kept consistent across the whole image.
  camera_and_composition: Village or landscape with a few glowing points.
  atmosphere_and_mood: Keep the requested mood with hushed nocturnal quiet.
