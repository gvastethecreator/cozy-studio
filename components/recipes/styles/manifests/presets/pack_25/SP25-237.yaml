visualDna:
  aesthetic: 'Slope-Chart Editorials: two columns of values joined by straight lines, the slopes telling the story of who rose and who fell.'
  subject_treatment: Show the prompt's supplied before and after values as a slope chart, two labeled columns joined by lines, one highlighted line and every value exact.
  color_and_tone: Grey lines for context and one or two bold highlight colors for the story.
  lighting_and_shadow: Flat editorial chart with no shading or depth.
  texture_and_material: Clean lines, round end dots and crisp editorial type.
  camera_and_composition: Two aligned value columns with labels at both ends and a headline above.
  atmosphere_and_mood: Editorial and pointed, a story told by a single rising or falling line.
  rendering_and_quality: Crisp chart where line ends sit exactly on their stated values.
  creative_brief: "Slope-Chart Editorials: two columns of values joined by straight lines, the slopes telling the story of who rose and who fell. Carry it through two value columns, joining slopes, highlighted line, headline. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: two value columns; joining slopes; highlighted line; headline
