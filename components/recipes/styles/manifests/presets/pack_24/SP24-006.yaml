visualDna:
  aesthetic: >-
    Death Stranding (2019) art direction as environmental concept painting: immense wet volcanic
    space contrasted with small precise industrial systems, burdened human scale and uncanny traces
    of connection.
  subject_treatment: >-
    Preserve explicit subject and action. Unspecified designs contrast soft weatherproof forms with
    modular hard equipment, tensioned straps and narrow technical accents; make carried weight and
    balance credible.
  color_and_tone: >-
    Basalt black, moss olive, cloud ivory and desaturated blue, interrupted by tiny industrial amber
    or signal orange accents. Natural colors remain broad and quiet.
  lighting_and_shadow: >-
    Large cold overcast sky creates diffuse wet reflections; atmospheric distance softens enormous
    terrain planes while manufactured edges catch precise light.
  texture_and_material: >-
    Eroded volcanic rock, short moss and wet sand oppose clean modular cases, matte polymer and
    weathered fabric; small amber translucent elements, not decorative neon circuitry.
  camera_and_composition: >-
    A distinct small anchor and a vast traversable void, with one engineered line crossing organic
    terrain. Preserve explicit framing; never reduce the subject to an invisible speck.
  atmosphere_and_mood: >-
    Isolation, burden and tenuous connection; sublime open terrain contains a subtle alien absence
    rather than picturesque tourism.
  rendering_and_quality: >-
    Atmospheric production painting with broad mineral masses, sparse exact industrial edges and
    quiet weather; noticeably authored brush transitions, not a stock hiking photograph.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
