visualDna:
  aesthetic: 'Japanese Zen interior built on the tatami module: sliding shoji and fusuma panels, an alcove for one object, exposed post-and-beam in unpainted hinoki or cedar.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Straw-green tatami, pale unfinished wood, warm paper white, earth-brown clay walls, charcoal accents; very little saturated color.
  lighting_and_shadow: Daylight diffused through washi paper shoji, low and even, deep soft shadow under the eaves and in the alcove; low seated eye level.
  texture_and_material: Woven rush tatami with cloth-bound edges, planed hinoki grain, clay-plastered walls with straw fibre, washi paper lattice, black iron kettle.
  camera_and_composition: Keep the requested view; low seated camera height, frontal view of sliding panels and the tatami grid, one object carrying the whole room.
  atmosphere_and_mood: Still, attentive and spare, with space left for silence.
  rendering_and_quality: Soft photograph with very gentle contrast; straight lattice lines, readable rush weave and wood grain, no clutter or plastic.
  key_features: tatami module floor; washi paper shoji light; unpainted hinoki post and beam; clay-plaster walls; single-object alcove
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Japanese Zen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
