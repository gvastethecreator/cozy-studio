visualDna:
  aesthetic: >-
    Construct forms from abrupt cut edges and overlapping flat planes; vary scale and direction to create
    handmade rhythm.
  subject_treatment: >-
    Preserve the requested subject and action; simplify existing contours into overlapping color shapes
    without replacing them.
  color_and_tone: >-
    Set paper cream and ink-dark values against one strong red, magenta, or blue accent; keep requested
    colors intact.
  lighting_and_shadow: Use shallow overlap shadows and broad value breaks without inventing a new light source.
  texture_and_material: Contrast fibrous edges, matte pigment, and a few narrow seam marks; keep scuffs local.
  camera_and_composition: >-
    Preserve the requested crop; use irregular overlaps and one clear diagonal around the existing focal
    point.
  atmosphere_and_mood: Create direct, handmade energy through interruption, contrast, and uneven rhythm.
  rendering_and_quality: Keep overlaps crisp, ink masses bold, and surface marks subordinate to the main silhouette.
avoidRules:
  - machine-clean edges throughout
  - texture that obscures the overlap structure
  - repeated layers that become a page mockup
