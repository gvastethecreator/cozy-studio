visualDna:
  aesthetic: 'Osamu Dezaki direction look as in Ashita no Joe 2 and Aim for the Ace: painted pastel postcard freeze frames, triple-take zooms, split screens and harmonica-light melancholy.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with seventies-eighties realistic designs, strong faces and sporting clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Pastel chalk postcard colors over dramatic darks, true to the Osamu Dezaki palette.
  lighting_and_shadow: Dramatic backlight and hazy glow, lit the way Osamu Dezaki lights its scenes.
  texture_and_material: Painted pastel-chalk freeze frames over cel, with the surface finish of Osamu Dezaki.
  camera_and_composition: Triple-take zooms and split screens, framed the way Osamu Dezaki composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with melancholy frozen memory.
  rendering_and_quality: Painterly postcard freeze-frame illustration, in the recognizable hand of Osamu Dezaki.
  key_features: Dezaki postcard freeze; triple takes; split screens
  creative_brief: "Osamu Dezaki direction look as in Ashita no Joe 2 and Aim for the Ace: painted pastel postcard freeze frames, triple-take zooms, split screens and harmonica-light melancholy. Carry it through Dezaki postcard freeze, triple takes, split screens. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
