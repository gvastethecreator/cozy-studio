visualDna:
  aesthetic: >-
    Rainpunk makes water movement legible with continuous channel-like curves, repeated flow intervals
    and broken reflective planes.
  subject_treatment: >-
    Preserve requested identity, silhouette, action and connections. Apply flowing contours or reflective
    bands to existing forms where compatible; do not add gutters, umbrellas or hydraulic machinery.
  color_and_tone: >-
    Preserve the user's palette, using cool mineral blue, teal or steel reflections with a restrained
    warm accent when suitable. Keep flowing planes distinct from shadows.
  lighting_and_shadow: >-
    Follow the requested light. Use selective reflected value bands only on surfaces that could carry
    them; do not add rain, glow or a new source.
  texture_and_material: >-
    Retain real materials. Where water or glazed surfaces are present, use clean reflections and
    localized wet texture; leave other surfaces in their requested finish.
  camera_and_composition: >-
    Preserve viewpoint, crop and placement. Let a few nested curves follow the existing composition
    without turning it into a waterworks diagram or landscape.
  atmosphere_and_mood: >-
    Suggest renewal and persistence through connected flow and reflection, while keeping the requested
    weather, setting and tone.
  rendering_and_quality: >-
    Use smooth directional bands, crisp channel edges and sparse rhythm marks. Keep reflections
    controlled and avoid fog, splash clutter or dense surface noise.
avoidRules:
  - Do not introduce rainfall, cisterns, gutters, umbrellas or waterworks unless requested.
  - Avoid all-over wet gloss, fog and splash effects.
  - Keep flow marks attached to existing forms rather than adding pipes.
