visualDna:
  aesthetic: 'Wet-sand sculpture: the subject packed from bucket-molded sand and carved with palette knives and straws, finished with drip-castle spires and crumbling edges.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Tan and ochre wet sand darkening toward the damp base, pale dry crust on exposed edges, small white shell accents.
  lighting_and_shadow: Low raking beach sun that picks out every carved line; soft blue sky fill in the shadows.
  texture_and_material: Granular crust, drip ridges, knife-carved planes, shell and pebble inclusions, edges already slumping as they dry.
  camera_and_composition: Keep the requested view at low ground level, with a hint of beach and tide line to set the fleeting scale.
  atmosphere_and_mood: Fleeting and sunny, a monument that the next wave will take.
  rendering_and_quality: Outdoor photograph of real sand with visible grain; never hard stone, never plastic.
  key_features: bucket-molded and knife-carved sand; drip-castle spires; dry crust on wet sand; shell inclusions; low raking beach sun
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Wet-Sand Ephemeral Modeling as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
