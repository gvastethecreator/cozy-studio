visualDna:
  aesthetic: >-
    Painted volume and fluid shadow shapes meet flexible, pressure-sensitive contours whose tension gives
    the drawing a hand-rendered rhythm.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep the form firm by default; change
    proportions or bend shapes only when reinterpretation is explicitly requested.
  color_and_tone: >-
    Preserve the requested palette and use broad modeled color areas to describe volume, without forcing
    a particular hue range or saturation.
  lighting_and_shadow: >-
    Respect the specified illumination and use fluid painted shadows that follow existing forms; do not
    invent a light source or distort the scene to create movement.
  texture_and_material: >-
    Keep visible brush texture and varied contour edges; preserve the depicted materials rather than
    replacing them with pure vector smoothness.
  camera_and_composition: >-
    Retain the requested viewpoint, framing, crop and element placement. Contour flexibility does not
    authorize a changed pose or rearranged scene.
  atmosphere_and_mood: >-
    Keep the requested tone and setting. Expressive line tension can add visual liveliness without adding
    comedy, slapstick or a new event.
  rendering_and_quality: >-
    Combine stable large painted shapes with selectively elastic contours and flowing shadow edges; keep
    defining features clear and proportions intact.
avoidRules:
  - unrequested bending or proportion changes
  - uniform vector-like outlines
