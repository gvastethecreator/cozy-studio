visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around stacked translucent gray
    washes with crisp negative-space windows that keep selected contours unusually
    exact. For color and surface, preserve local hues under a cool graphite,
    smoke-gray, and silver value structure, using no fixed accent color. Calculation can
    feel withheld through selective clarity, while the scene stays as calm, lively, or
    direct as requested
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through stacked translucent gray washes with
    crisp negative-space windows that keep selected contours unusually exact; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; preserve local hues under a
    cool graphite, smoke-gray, and silver value structure, using no fixed accent color.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; soften broad transitions but
    retain a few sharply bounded highlight islands on surfaces already catching light.
    Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use layered ink wash and fine graphite dust
    rather than literal smoke; leave the material underneath identifiable. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count;
    concentrate clarity around the prompt's existing focal area and let peripheral edges
    soften without moving or cropping subjects. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Calculation can feel withheld through
    selective clarity, while the scene stays as calm, lively, or direct as requested.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and stacked translucent gray washes with crisp
    negative-space windows that keep selected contours unusually exact; keep focal edges
    crisp, texture controlled, and dark values legible. Avoid photoreal or 3D-render
    drift, watermark, logo, and fake readable text.
  key_features: >-
    stacked translucent gray washes with crisp negative-space windows that keep selected
    contours unusually exact; preserve local hues under a cool graphite, smoke-gray, and
    silver value structure, using no fixed accent color; soften broad transitions but
    retain a few sharply bounded highlight islands on surfaces already catching light;
    use layered ink wash and fine graphite dust rather than literal smoke; leave the
    material underneath identifiable; and concentrate clarity around the prompt's
    existing focal area and let peripheral edges soften without moving or cropping
    subjects. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use stacked translucent gray washes with crisp
    negative-space windows that keep selected contours unusually exact, preserve local
    hues under a cool graphite, smoke-gray, and silver value structure, using no fixed
    accent color, soften broad transitions but retain a few sharply bounded highlight
    islands on surfaces already catching light, and use layered ink wash and fine
    graphite dust rather than literal smoke; leave the material underneath identifiable;
    the prompt supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
