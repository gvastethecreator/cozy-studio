visualDna:
  aesthetic: 'Golden-age cel feature animation: hand-inked characters on clear cels over lush watercolor and gouache backgrounds, shot through a multiplane camera for layered depth.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: 'Rich storybook palette: deep forest greens, dusk violets, warm lantern golds; cels flat and luminous against softer painted backgrounds.'
  lighting_and_shadow: Painted light in the backgrounds, soft airbrushed shadow tones on the cels, glowing highlights on lanterns and eyes.
  texture_and_material: Clean ink contours with thin-thick variation, gouache and watercolor granulation in backgrounds.
  camera_and_composition: 'Multiplane depth: blurred foreground foliage, crisp midground action, hazy painted distance.'
  atmosphere_and_mood: Enchanted and tender, a fairy tale unfolding in painted layers.
  rendering_and_quality: Hand-made 35 mm cel feature finish; original designs only, no studio characters.
  key_features: inked cels over painted backgrounds; multiplane depth; storybook palette; airbrushed cel shadow; luminous highlights
  creative_brief: "Golden-age cel feature animation: hand-inked characters on clear cels over lush watercolor and gouache backgrounds, shot through a multiplane camera for layered depth. Carry it through inked cels over painted backgrounds, multiplane depth, storybook palette, airbrushed cel shadow, luminous highlights. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
