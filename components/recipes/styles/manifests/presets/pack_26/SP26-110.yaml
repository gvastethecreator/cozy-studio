  color_and_tone: Wild mid-century orange, turquoise, magenta and black, true to the Jim Flora palette.
  lighting_and_shadow: Flat printed light, lit the way Jim Flora lights its scenes.
  texture_and_material: Printed record sleeve on board with slight ring wear and soft paper grain.
  camera_and_composition: Crazy tilted mid-century perspective, framed the way Jim Flora composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with zany exuberant swing.
  rendering_and_quality: Faithful mid-century cartoon jazz cover design, in the recognizable hand of Jim Flora.
