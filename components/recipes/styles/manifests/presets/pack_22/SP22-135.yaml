visualDna:
  aesthetic: >-
    Cartoon illustration condenses forms into broad, easily distinguished shapes with simple defined
    shadows and sparse small details.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify detail without enlarging the
    head, eyes or other features unless the request explicitly asks for that reinterpretation.
  color_and_tone: >-
    Organize color into a few clear value groups and place accents sparingly. Retain the requested palette
    and the local colors needed to distinguish forms.
  lighting_and_shadow: >-
    Follow the requested lighting with concise shadow shapes. Keep the light direction clear without
    adding a new source or unsupported glossy highlights.
  texture_and_material: >-
    Use smooth, mostly even color and preserve the character of represented materials. Do not add a
    plastic sheen or a global texture layer.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Compact shapes do not require
    a changed pose, close crop or exaggerated proportions.
  atmosphere_and_mood: >-
    Keep the requested tone. Reduced detail does not make the subject childish, cute or comedic by default.
  rendering_and_quality: >-
    Make contours broad enough to read at small sizes and shadows simple enough to remain distinct.
    Keep the original structure clear while reducing secondary detail.
avoidRules:
  - unrequested feature enlargement
  - plastic gloss
