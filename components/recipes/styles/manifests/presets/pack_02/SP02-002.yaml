visualDna:
  aesthetic: 'Spaghetti western: 1960s widescreen frontier cinema that alternates extreme wide landscapes with extreme close-ups of eyes, under merciless sun.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Sun-bleached ochre, dusty yellow and burnt sienna, pale blue sky, dark sweat-stained shadows.
  lighting_and_shadow: Hard overhead noon sun, squinting faces, short black shadows, dust glowing in backlight.
  texture_and_material: Dust, stubble, sweat, cracked leather and grit in every wrinkle; coarse grain.
  camera_and_composition: '2.35:1 widescreen feel inside the frame: either a tiny figure on a vast horizon or a face cropped from brow to lip.'
  atmosphere_and_mood: Operatic and tense, a long silence stretched before sudden violence.
  rendering_and_quality: Faded Techniscope color and grain; no clean modern grade.
  key_features: extreme close-up versus extreme wide; noon sun; sun-bleached ochre; dust and sweat; widescreen tension
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Spaghetti Western as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
