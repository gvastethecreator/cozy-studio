visualDna:
  aesthetic: 'Dusted pigment stencil: loose powdered pigment dusted through stencils onto paper, leaving soft velvety color fields with feathered edges and loose grains.'
  subject_treatment: Build the prompt's subject from stenciled fields of dusted powder, keeping its silhouette clear with soft powdery edges.
  color_and_tone: Rich raw pigments such as ultramarine, cadmium red and yellow ochre, intensely saturated and matte.
  lighting_and_shadow: No modeled light; density of dusted powder creates lighter and darker areas.
  texture_and_material: Velvety powder, stray grains, soft feathered stencil edges and faint fingerprints in the dust.
  camera_and_composition: Bold stencil shapes on white paper with generous space around them.
  atmosphere_and_mood: Vivid, soft and fragile, color that could blow away.
  rendering_and_quality: Authentic dusted powder texture and matte saturation, never liquid paint.
  creative_brief: "Dusted pigment stencil: loose powdered pigment dusted through stencils onto paper, leaving soft velvety color fields with feathered edges and loose grains. Carry it through dusted raw pigment, velvety matte fields, feathered stencil edges, loose grains. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: dusted raw pigment; velvety matte fields; feathered stencil edges; loose grains
