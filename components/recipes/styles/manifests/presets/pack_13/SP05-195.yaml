visualDna:
  aesthetic: >-
    Hand-drawn anime line uses elastic contours, hand-cut color blocks, and small pattern
    accents.
  subject_treatment: >-
    Retain age, clothing, accessories, action, count; pattern only existing surfaces.
  color_and_tone: >-
    Turquoise, sunshine yellow, cherry red, violet, charcoal in balanced groups.
  lighting_and_shadow: >-
    Flat ambient values with crisp local highlights; imply no specific light source.
  texture_and_material: >-
    Textile pattern or marker grain only on fabric or surfaces named in prompt.
  camera_and_composition: >-
    Respect composition; stagger color masses within existing forms, add no group or
    accessories.
  atmosphere_and_mood: >-
    DIY energy is optional; match the requested mood and setting.
  rendering_and_quality: >-
    Crisp edges, slight hand-drawn irregularity, no distressed print wear.
  key_features: >-
    Elastic hand-drawn contour, bright color blocks, local surface pattern, slight line
    irregularity
  creative_brief: >-
    Apply a visual treatment centered on elastic hand-drawn contour, bright color blocks,
    local surface pattern, slight line irregularity. Preserve the exact subject, action,
    count, age, costume, setting, camera, and mood. Add nothing outside the prompt.
