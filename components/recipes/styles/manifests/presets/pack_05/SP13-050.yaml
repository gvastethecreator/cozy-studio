visualDna:
  aesthetic: 'Anime insert shot: an extreme close-up of the exact point where the requested action makes contact, such as a hand, foot or hoof meeting a surface, with the rest of the subject cropped away.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the extreme close-up on the exact point of contact of the action, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the contact point is the brightest and sharpest area, the surroundings darker.
  lighting_and_shadow: Tight hard key light raking across the contact surface to show pressure and texture.
  texture_and_material: Magnified surface detail at the contact, like skin creases, wood grain or ice crystals, with small displaced particles only if the materials would shed them.
  camera_and_composition: Macro framing where the contact fills the center third, very shallow depth and nothing else of the subject visible.
  atmosphere_and_mood: Tactile and precise, the whole action compressed into one touch.
  rendering_and_quality: Detailed but clean cel rendering at macro scale, with the kind of contact instantly readable.
  creative_brief: "Anime insert shot: an extreme close-up of the exact point where the requested action makes contact, such as a hand, foot or hoof meeting a surface, with the rest of the subject cropped away. Carry it through extreme close-up of the contact point, subject cropped away, raking hard key light, magnified surface detail, very shallow depth. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: extreme close-up of the contact point; subject cropped away; raking hard key light; magnified surface detail; very shallow depth
