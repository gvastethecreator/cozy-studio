  color_and_tone: Bright ocean blue, warm red and gold, clean white and dark outlines.
  lighting_and_shadow: High summer sun, broad pale highlights and clear cel shadow groups.
  texture_and_material: Clean flat color with lightly softened pigment edges.
  camera_and_composition: Keep the requested framing; roomy balance, flexible diagonals and generous negative space.
  atmosphere_and_mood: Playful openness and generous momentum, a sunny, big-hearted adventure with room to stretch.
  rendering_and_quality: Vivid flat colors, legible outlines and little small-scale detail.
  key_features: rubbery exaggerated anatomy; huge grins; bold rounded outlines; ocean blue, red and gold; flexible diagonals
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Elastic Big-Grin Adventure Cel as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
