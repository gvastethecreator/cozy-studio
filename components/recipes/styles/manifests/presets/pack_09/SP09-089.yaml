  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in soft brushed suede with napped fingerprint marks."
  color_and_tone: Tan, camel, olive or dusty rose suede, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft side light for nap direction, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Napped suede with finger marks and matte softness, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Warm, soft, rich and tactile, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Brushed suede: velvety leather nap that shows light and dark finger marks. Carry it through brushed suede nap, finger marks, matte softness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
