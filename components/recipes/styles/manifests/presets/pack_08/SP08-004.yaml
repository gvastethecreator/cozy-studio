visualDna:
  aesthetic: 'Boho festival style: sun-faded layers of flowing prints, fringe, crochet and handmade jewelry worn loose for dancing outdoors.'
  subject_treatment: 'Redress the prompt''s wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: flowing printed maxi dress or wide trousers, crochet or fringed layer, suede boots or sandals, stacked beaded and silver jewelry, and a flower or feather accent.'
  color_and_tone: Sun-bleached terracotta, mustard, sage, cream and turquoise, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Low golden-hour backlight with dust and lens glow, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Crochet, suede fringe, cotton voile, embroidery, beads and hammered silver.
  camera_and_composition: Loose, joyful full figure in open air, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Free, sunny, romantic and wandering, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Warm, hazy, film-like finish, with believable fabric weight, seams and fit detail.
  key_features: flowing printed layers; fringe and crochet; stacked beaded jewelry; sun-bleached palette; golden backlight
  creative_brief: 'Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Boho Festival as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user''s subject instead of forcing this preset''s sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula.'
