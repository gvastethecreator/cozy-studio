visualDna:
  aesthetic: 'Structural contours, broad quiet color fields, and a small number of crisp value boundaries create an economical graphic finish.'
  subject_treatment: 'Preserve all prompted forms, proportions, and meaningful details; simplify surface marks only, never remove structural information.'
  color_and_tone: 'Use a restrained range of neutral or cool values with an accent drawn from the prompt; do not default to gray.'
  lighting_and_shadow: 'Keep the stated light direction and organize shadows into a few clear shapes; retain nuance when requested.'
  texture_and_material: 'Use matte fills with material-specific edge marks in small doses; avoid implying a new material from the finish.'
  camera_and_composition: 'Keep crop, viewpoint, perspective, spacing, and count; separate existing forms rather than adding negative space.'
  atmosphere_and_mood: 'Let the prompt set the emotion; sparse rendering does not impose a mood.'
  rendering_and_quality: 'Use deliberate line breaks, clean shape edges, and enough contrast for each form to remain identifiable.'
  key_features: 'Structural contours; broad quiet fills; few clear shadow groups; limited surface noise; precise material accents.'
  creative_brief: "Reduce surface noise and organize values around the structure of existing forms. Preserve subject, action, count, camera, and mood without adding props. Use it as a reusable look on any subject."
avoidRules:
  - realistic
  - 3d render
  - photo
  - live action
  - western comic
  - ugly
