visualDna:
  aesthetic: 'Product studio render: a single object rendered with studio HDRI reflections on a gradient backdrop, showing exact material swatches and finishes.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Neutral grey or black gradient backdrop, accurate material color, clean highlights.
  lighting_and_shadow: Studio HDRI with long softbox reflections, soft ground shadow and a subtle reflection floor.
  texture_and_material: Mold-texture plastics, anodized metal, stitched leather, cut gems with precise highlights.
  camera_and_composition: Centered three-quarter product view, object filling the frame.
  atmosphere_and_mood: Precise and desirable, a design object at its launch.
  rendering_and_quality: Crisp product visualization with no clutter and no photographic imperfections.
  key_features: studio HDRI softbox reflections; gradient backdrop; accurate material swatches; ground shadow; centered product
  creative_brief: "Product studio render: a single object rendered with studio HDRI reflections on a gradient backdrop, showing exact material swatches and finishes. Carry it through studio HDRI softbox reflections, gradient backdrop, accurate material swatches, ground shadow, centered product. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - 2d illustration
  - hand-drawn
  - photograph without CGI cues
  - franchise likeness
  - studio character likeness
  - celebrity likeness
  - readable text
  - software logo
  - replacing the subject with a renderer demo scene
  - environment
  - messy
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - raw viewport
  - unlit preview
  - wrong render engine
  - cheap preview noise
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
