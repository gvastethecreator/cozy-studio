visualDna:
  aesthetic: >-
    A deliberately authored low-resolution raster illustration builds forms from purposeful pixel
    clusters, short tonal ramps, drawn contours, sparse hand-shaped hatching and broad, subdued color
    masses. Treat these as transferable rendering choices rather than a fixed palette or resolution.
  subject_treatment: >-
    Preserve the requested subject, identity, count, pose, action, proportions and functional details.
    Make the silhouette and major value groups readable before adding small pixel clusters; do not
    introduce a game character, portrait or event to demonstrate the technique.
  color_and_tone: >-
    Preserve the requested palette and color relationships. When the palette is open, use restrained
    related color masses and short ramps rather than a presumed DOS or VGA hardware palette.
  lighting_and_shadow: >-
    Follow the requested light sources and shadow direction. Build existing value transitions with
    compact stepped ramps and selective hatching; do not invent torchlight, dramatic darkness or a
    game-scene light source.
  texture_and_material: >-
    Use intentional pixel clusters and limited hatching to describe the actual materials already
    present. Keep texture local and varied by material; do not replace drawn structure with uniform
    noise, grain or a faux screenshot filter.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, orientation, aspect ratio and arrangement. Do not recast
    the image as a game screen, title frame, HUD or fixed retro display format.
  atmosphere_and_mood: >-
    Keep the user's setting and mood. The raster treatment does not prescribe an era, genre,
    historical scene or combat narrative.
  rendering_and_quality: >-
    Let pixel placement organize form at the intended output size. Keep cluster edges deliberate,
    tonal ramps compact and broad color masses calm; avoid arbitrary pixel reduction or decorative
    noise that weakens legibility.
avoidRules:
  - unrequested game HUD, DOS frame or title screen
  - unrequested character portrait, combat or game-world scene
  - fixed hardware palette, resolution or aspect ratio borrowed from a game
  - uniform pixel noise replacing deliberate clusters
