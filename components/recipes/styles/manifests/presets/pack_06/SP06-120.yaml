visualDna:
  aesthetic: 'Boss encounter key art: a colossal threat towering over a tiny challenger, cinematic painterly rendering built on extreme scale contrast.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a low-angle key-art composition built on extreme scale contrast between threat and challenger, with blank panels and icon shapes instead of any readable text, numbers or logos.
  color_and_tone: Dark smoky base with one ominous color for the boss (ember red, poison green or cold violet) and a small warm light on the hero.
  lighting_and_shadow: Strong backlight and rim light on the colossus, silhouetted challenger, smoke and ash catching light.
  texture_and_material: Rough painted detail on the boss, drifting ash, embers and dust, simplified foreground ground plane.
  camera_and_composition: Low angle from behind the small challenger, boss filling the upper two thirds, diagonal tension lines.
  atmosphere_and_mood: Ominous and awe-struck, the moment before an impossible fight.
  rendering_and_quality: Cinematic painterly finish, clear silhouettes at both scales; no health bars or titles.
  key_features: extreme scale contrast; low angle from behind the hero; boss rim light; drifting ash; one ominous color
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Boss Encounter Key Art Tension as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - copied game characters
  - known game HUD layout
  - readable interface text
  - numbers and stat values
  - publisher or studio logo
  - boss health bar
  - title lettering
  - gore
  - watermark
  - text
  - monster requirement
  - combat scene
  - weapon requirement
  - wrong medium
  - generic AI gloss
