visualDna:
  aesthetic: >-
    Soft, dusty illustration with muted layered values, drifting particulate marks, sparse
    mechanical line accents, and a restrained amber signal.
  subject_treatment: >-
    Keep the requested subject recognizable. Soften secondary edges and retain crisp line
    accents only on its existing focal details; add no drone or pilot.
  color_and_tone: >-
    Use sand, smoke gray, faded olive, and dusty blue, with a small amber highlight against
    subdued values.
  lighting_and_shadow: >-
    Layer broad soft shadows with narrow, pale edge light; keep haze subtle and avoid a forced
    sunset or dust storm.
  texture_and_material: >-
    Retain the subject’s material with fine dust grain, rubbed edges, and sparse particulate
    specks rather than coating it uniformly.
  camera_and_composition: >-
    Preserve the requested crop and view. Leave breathing room around the subject and let a few
    drifting marks create depth.
  atmosphere_and_mood: >-
    Carry a quiet, lamenting mood through subdued contrast and suspended detail, without a
    desert or military narrative.
  rendering_and_quality: >-
    Blend soft atmospheric layers with crisp focal contours; keep grain fine, color separation
    clear, and highlights restrained.
  key_features: >-
    Dust-softened layers; sparse crisp contours; sand and slate palette; small amber signals.
  creative_brief: >-
    Keep the specified subject, pose, and setting. Use dust-softened values, sparse particulate
    marks, and quiet amber accents; add no drone, pilot, desert, or storm.
