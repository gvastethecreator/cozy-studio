visualDna:
  aesthetic: 'Flowchart: boxes, diamonds and arrows connecting steps.'
  subject_treatment: "Present the prompt's subject as an illustrative diagram in this visual language, keeping it recognizable; labels are unreadable marks and nothing claims to be real data: the subject's parts become connected nodes and decision diamonds."
  color_and_tone: Pastel boxes with dark lines, following the conventions of this diagram language.
  lighting_and_shadow: Flat diagrammatic presentation with no dramatic lighting, unless the medium implies a surface such as paper or chalk.
  texture_and_material: Clean vector shapes, as the medium the diagram is drawn or printed on.
  camera_and_composition: Diagram layout with clear hierarchy, legend-like zones and the subject as the central readable figure.
  atmosphere_and_mood: Logical, playful, clear and structured, coming from the diagram language.
  rendering_and_quality: Clean, precise diagram rendering with consistent line weights and no random marks.
  creative_brief: "Flowchart: boxes, diamonds and arrows connecting steps. Carry it through boxes, diamonds, arrows, illustrative only. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: boxes; diamonds; arrows; illustrative only
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
