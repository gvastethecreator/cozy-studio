visualDna:
  aesthetic: 'Horror anime of empty institutions after hours: corridors, fluorescent hum, repeated doors and a feeling that the building is watching.'
  subject_treatment: Keep the prompt's subject and setting; place it in a too-clean, too-empty space where something is slightly wrong.
  color_and_tone: Sickly fluorescent green-white, beige walls and dim blue shadows with no warm color at all.
  lighting_and_shadow: Flat overhead fluorescent light, one flickering tube and dark doorways that swallow the light.
  texture_and_material: Linoleum floors, painted cinder block and glass partitions drawn with clean, cold line.
  camera_and_composition: Long one-point perspective corridors with the subject small, or a single door filling the frame.
  atmosphere_and_mood: Quietly wrong and uneasy, like an empty school or hospital that should not be empty.
  rendering_and_quality: Clean, restrained horror anime with precise perspective and minimal effects.
  key_features: one-point corridors; fluorescent hum; repeated doors; emptiness
  creative_brief: "Horror anime of empty institutions after hours: corridors, fluorescent hum, repeated doors and a feeling that the building is watching. Carry it through one-point corridors, fluorescent hum, repeated doors, emptiness. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
