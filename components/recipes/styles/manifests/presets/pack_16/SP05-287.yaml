visualDna:
  aesthetic: >-
    Pop-digital cel structure: crisp silhouette planes, flat high-chroma blocks, and one
    restrained gradient layer behind sharp separations.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Graphic
    simplification cannot caricature or add symbols.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use bright azure, coral or
    magenta, lemon, and deep charcoal as controlled blocks when compatible with the requested
    palette.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep highlights crisp and bloom confined
    to supplied light; add no stage lights or luminous objects.
  texture_and_material: >-
    Apply texture only to materials already present. Favor smooth digital fills and narrow
    gradients over painterly grain; keep each material legible.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Align broad silhouettes and
    diagonal color blocks to existing geometry, never force a stage or profile.
  atmosphere_and_mood: >-
    Preserve user mood; chromatic brightness requires no buoyancy, spectacle, or sung emotion.
  rendering_and_quality: >-
    Hold hard edges at focal shapes and smooth gradients behind them; add no UI, lettering, or
    poster layout.
  key_features: >-
    High-chroma flats; crisp layer separation; one gradient depth layer; controlled edge bloom.
  creative_brief: 'Use high-chroma flats; crisp layer separation; one gradient depth layer; controlled edge bloom. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
