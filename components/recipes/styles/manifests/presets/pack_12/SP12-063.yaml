  color_and_tone: Saturated desert gold, neon blue and pink, true to the F-Zero GX 2003 palette.
  lighting_and_shadow: Bright GameCube bloom and track lights, lit the way F-Zero GX 2003 lights its levels.
  texture_and_material: Glossy machines with speed blur, with the in-engine surface finish of F-Zero GX 2003.
  camera_and_composition: Low chase camera on twisting tracks, framed the way F-Zero GX 2003 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with dizzying hyper speed.
  rendering_and_quality: Authentic GameCube racer screen, matching real F-Zero GX 2003 screenshots.
  key_features: F-Zero GX loops; hover machines; hyper speed
  creative_brief: 'Amusement Vision F-Zero GX (2003) look: hyper-speed anti-gravity racing on twisting tubes and loops, saturated alien cities and deserts, thirty rival machines and extreme speed lines. Carry it through F-Zero GX loops, hover machines, hyper speed. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
