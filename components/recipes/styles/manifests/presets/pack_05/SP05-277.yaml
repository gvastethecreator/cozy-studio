visualDna:
  aesthetic: Scratchy seinen anime drawing of scraped, slightly offset strokes that alternate rust-red oxidized marks with thin cool neon edge slips, like a poster scraped off a metal shutter.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Oxidized orange-red and rust brown over stable midtones, with contained violet or cyan slips on the edges.
  lighting_and_shadow: Colored rim accents sit only on edges that could catch them; ambient light stays low and even.
  texture_and_material: Dry scraped pigment, tiny oxidized specks and palette-knife scrapes in the backgrounds.
  camera_and_composition: Keep the requested framing; broken stroke intervals add unease inside the existing negative space.
  atmosphere_and_mood: Restless young-adult dread or tenderness, raw and nervous.
  rendering_and_quality: Scraped marks stay controlled while faces and key forms remain clean and readable.
  key_features: scraped offset strokes; rust red with neon violet or cyan slips; oxidized specks; palette-knife scrapes; nervous stroke rhythm
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rusted Neon Adolescent Dread Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
