visualDna:
  aesthetic: 'Maglevpunk: a city stitched together by floating magnetic trains, silent rails through buildings and sky-high stations.'
  subject_treatment: Keep the prompt's subject and setting; run silent floating trains and glowing rails through or past it.
  color_and_tone: Sleek white and silver with glowing blue rail lines against dusk skies.
  lighting_and_shadow: Glowing rail strips, streaking train lights and reflective station glass.
  texture_and_material: Smooth composite train shells, magnetic rails, glass stations and concrete pylons.
  camera_and_composition: Sweeping curves of elevated rails and trains frozen mid-glide through the city.
  atmosphere_and_mood: Silent and swift, a city that moves without a sound.
  rendering_and_quality: Sleek illustration with smooth curves and luminous rail lines.
  creative_brief: "Maglevpunk: a city stitched together by floating magnetic trains, silent rails through buildings and sky-high stations. Carry it through floating trains, glowing rails, sky stations, silent speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
