visualDna:
  aesthetic: 'Carapace architecture: roofs and walls of overlapping iridescent shell plates on segmented ribs, jointed buttresses and amber resin membranes as windows.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Black-green chitin with oil-slick blue, violet and bronze sheen, glowing amber resin panes; dark and glossy.
  lighting_and_shadow: Iridescent sheen shifting across the plates with angle; backlit amber membranes glow from inside at dusk.
  texture_and_material: Glossy shell plates with fine punctures and growth lines, flexible segment joints, veined translucent resin.
  camera_and_composition: Keep the requested view; segmented ribs set a repeating arthropod rhythm along roofs and walls.
  atmosphere_and_mood: Alien, elegant and slightly unsettling, a building that could have molted.
  rendering_and_quality: Precise specular rendering of iridescent surfaces; architecture only, with no insects or creatures.
  creative_brief: "Carapace architecture: roofs and walls of overlapping iridescent shell plates on segmented ribs, jointed buttresses and amber resin membranes as windows. Carry it through overlapping iridescent shell plates, segmented rib structure, jointed buttresses, amber resin membrane windows, oil-slick sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
