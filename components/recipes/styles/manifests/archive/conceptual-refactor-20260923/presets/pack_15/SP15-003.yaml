visualDna:
  aesthetic: >-
    Pressure Lace Automata operates as a portable punk-spectrum router: combine Pressure Lace
    Automata identity cues through lace struts; pressure gauges; articulated hands; porcelain faces;
    brass needlework; Steampunk automata poster language built from porcelain planes with
    industrial-retrofuture punk grammar with visible labor systems, mechanical silhouettes, public
    engineering, soot-softened graphic planes, and utility-first rebellion, so the preset supplies
    retrofit style behavior rather than a required venue, mascot, prop bundle, or card composition.
  subject_treatment: >-
    Preserve prompt X's subject, action, scale, and setting while translating forms through
    gear-scale massing, valve rhythm, rivet restraint, belt or rail geometry, worker-poster contour,
    and machine-adjacent costume or surface logic; motifs can become contour, surface, costume,
    equipment, atmosphere, or infrastructure without replacing the prompt.
  color_and_tone: >-
    Map color through smoky brass, tarnished copper, oil umber, rail black, aged ivory, pressure
    red, and warm cream value blocks; keep dominant, support, and accent values readable, avoid
    muddy black, and let palette code materials, signals, climate, ritual, salvage, or repair
    pressure.
  lighting_and_shadow: >-
    Use amber machine glow, steam-diffused shadow, furnace rim, gauge-color pinpoints, and
    posterized industrial bounce; lighting should reveal the punk system, preserve the user's
    subject, separate near and distant value planes, and avoid crushed blacks or noisy dark texture.
  texture_and_material: >-
    Render brass plates, cast iron, leather belts, enamel gauges, soot washes, heavy paper grain,
    glass dots, and controlled worn edges; keep material scale coherent, surface marks motivated,
    and tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
    Compose through large readable machinery rhythm, labor-poster spacing, civic scale cues,
    diagonal belt paths, and open negative space around the requested subject as reusable framing
    grammar for characters, creatures, objects, vehicles, environments, symbols, or full scenes
    without one required card layout.
  atmosphere_and_mood: >-
    Carry mood through defiant craft, collective utility, late-shift pressure, practical optimism,
    machine reverence, and civic invention; the tone may become adult, romantic, violent, comic,
    sensual, eerie, civic, or strange when prompt X asks, while the punk family remains legible.
  rendering_and_quality: >-
    Finish with screenprint-to-gouache industrial illustration with denoised soot, clean dark-gray
    shadows, broad shapes, and no rivet-noise overload; prioritize clean denoise, bold readable
    shapes, controlled grit, prompt preservation, no watermark, no readable text, and no generic
    concept-art polish.
  key_features: >-
    lace struts; pressure gauges; articulated hands; porcelain faces; brass needlework; Steampunk
    automata poster language built from porcelain planes
  creative_brief: >-
    Use Pressure Lace Automata after prompt X as a transferable punk-spectrum layer: prompt X
    supplies subject, action, setting, tone, and intensity, while the preset supplies lace struts,
    pressure gauges, articulated hands, porcelain faces, brass needlework, Steampunk automata poster
    language built from porcelain planes, color logic, light response, material behavior,
    composition rhythm, mood pressure, and finish discipline without requiring a fixed venue, fixed
    cast, fixed machine, repeated prop bundle, or sample-card composition.
