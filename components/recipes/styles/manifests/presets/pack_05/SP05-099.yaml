visualDna:
  aesthetic: 'Gritty TV-anime cel with heavy dark-brown lineart and nested contour echoes: two or three parallel strokes trace each major outline like growth rings.'
  subject_treatment: Keep the prompt subject, action, setting and camera and redraw them in this fantasy anime finish; a neutral household task stays that task and never becomes a quest, battle or cooking vignette. Silhouettes are weighted forward and low with squared shoulders; do not add a shield, barrier, collar or weapon the prompt did not ask for.
  color_and_tone: Aged bronze, stone grey and earth brown with one small amber accent; a mid-dark key with compressed, never clipped highlights.
  lighting_and_shadow: Hard low side light catches raised edges in thin bronze rims, while a deep three-tone cel shadow holds the large forms together.
  texture_and_material: Scuffed dry-brush over the cel fills, chipped-edge highlights and faint scratches read as rendering wear rather than a new material.
  camera_and_composition: Keep the requested view; a slightly low angle and heavy diagonals push the weight of the subject toward the viewer.
  atmosphere_and_mood: Steadfast and hard-won, a quiet refusal to fall.
  rendering_and_quality: Firm outer contours, textured midtones and exactly one controlled specular highlight on each focal form.
  key_features: nested concentric contour echoes; heavy dark-brown lineart; bronze edge rims; three-tone cel shadow; scuffed dry-brush wear
  creative_brief: "Gritty TV-anime cel with heavy dark-brown lineart and nested contour echoes: two or three parallel strokes trace each major outline like growth rings. Carry it through nested concentric contour echoes, heavy dark-brown lineart, bronze edge rims, three-tone cel shadow, scuffed dry-brush wear. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
