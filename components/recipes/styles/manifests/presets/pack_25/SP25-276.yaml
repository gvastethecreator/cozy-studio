visualDna:
  aesthetic: 'Faded Ink Finish: a modifier that reduces ink coverage in a controlled way, like a well-loved print, while silhouette and message stay intact.'
  subject_treatment: Reduce the ink coverage of the prompt's existing print in controlled areas, protecting its outline, letters and key counters exactly.
  color_and_tone: Original colors kept, wear only thinning coverage on the same fabric.
  lighting_and_shadow: The same presentation light for original and finished print.
  texture_and_material: Controlled ink loss tied to coverage, never holes that change characters.
  camera_and_composition: Geometry and placement locked, small letters in protected zones.
  atmosphere_and_mood: Sober, believable wear with a warm vintage feeling.
  rendering_and_quality: Clean finish with a separate wear mask and recoverable outlines.
  creative_brief: "Faded Ink Finish: a modifier that reduces ink coverage in a controlled way, like a well-loved print, while silhouette and message stay intact. Carry it through controlled ink loss, protected letters, locked placement, vintage wear. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: controlled ink loss; protected letters; locked placement; vintage wear
