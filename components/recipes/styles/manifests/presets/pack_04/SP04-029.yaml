  aesthetic: 'Glossy die-cut sticker: the subject drawn as a bold simplified vinyl sticker with a thick white cut border and a laminate shine.'
  subject_treatment: 'Keep the prompt subject, action and identity; this preset explicitly owns the sticker format: one isolated subject with a thick white die-cut border on a plain backing, and nothing else about the request changes.'
  color_and_tone: Saturated flat vector colors with one shade tone and a white border around everything.
  lighting_and_shadow: One glossy laminate highlight streak across the sticker and a small soft drop shadow on the backing.
  texture_and_material: Smooth vinyl surface, subtle laminate sheen, slightly lifted corner of the sticker.
  camera_and_composition: One centered subject with a clean silhouette, plain pale backing around it.
  atmosphere_and_mood: Playful and punchy, a collectible little treasure.
  rendering_and_quality: Crisp decal-ready shapes readable at small size; no background scene and no readable text.
  key_features: thick white die-cut border; flat saturated vector; laminate highlight streak; lifted corner; isolated silhouette
  creative_brief: "Glossy die-cut sticker: the subject drawn as a bold simplified vinyl sticker with a thick white cut border and a laminate shine. Carry it through thick white die-cut border, flat saturated vector, laminate highlight streak, lifted corner, isolated silhouette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
