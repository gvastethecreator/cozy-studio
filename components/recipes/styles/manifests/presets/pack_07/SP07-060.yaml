visualDna:
  aesthetic: 'Cartoon haunted architecture: rubbery crooked buildings that lean, bulge and twist, drawn with thick ink outlines and flat cel shading.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Moonlit violet and indigo base, toxic lime glow from openings, black ink; flat fills with one shadow tone each.
  lighting_and_shadow: One flat moon backlight rim plus lime glow spilling from windows; two-tone cel shadows with hard edges.
  texture_and_material: No surface texture beyond simple shingle and plank line patterns; wobbling hand-inked contours.
  camera_and_composition: Keep the requested view; exaggerate lean and squash so the silhouette reads as a caricature of the structure.
  atmosphere_and_mood: Spooky-comic and mischievous, frightening only in the way a cartoon is.
  rendering_and_quality: Clean animation background finish with crisp ink and flat color; no realistic horror, gore or monsters.
  key_features: crooked rubbery silhouettes; thick ink outlines; flat two-tone cel shading; violet and toxic-lime palette; moon backlight rim
  creative_brief: "Cartoon haunted architecture: rubbery crooked buildings that lean, bulge and twist, drawn with thick ink outlines and flat cel shading. Carry it through crooked rubbery silhouettes, thick ink outlines, flat two-tone cel shading, violet and toxic-lime palette, moon backlight rim. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
