visualDna:
  aesthetic: >-
    Drawing on mid-value colored paper, using the support as a continuous middle tone and placing
    broad dark and light marks selectively over it.
  subject_treatment: >-
    Preserve the requested identity, proportions and action. Model existing forms with connected
    dark masses and reserved chalk lights instead of replacing them with symbols or contours.
  color_and_tone: >-
    Let the paper carry the middle value, using charcoal or a palette-matched dark pigment for shadows
    and opaque chalk for chosen highlights. Keep the requested color direction recognizable.
  lighting_and_shadow: >-
    Follow the requested illumination: group the dark marks on its shadow side and place chalk only
    on existing planes that face the light. Do not add a separate spotlight.
  texture_and_material: >-
    Keep the support's even midtone visible between marks. Use broad rubbed charcoal and small opaque
    chalk accents without simulating an engraved plate or a black plate ground.
  camera_and_composition: >-
    Preserve the supplied framing, viewpoint and placement. Use value grouping to clarify the existing
    focal structure without introducing a portrait pose or new layout.
  atmosphere_and_mood: >-
    Carry the requested mood through the balance of open paper, dark mass and light accents; the
    drawing method does not imply a studio, memorial or historical scene.
  rendering_and_quality: >-
    Keep the three value families distinct and edges selective. Avoid crosshatching as the main value
    method, crushed dark grounds, and chalk outlining every edge.
avoidRules:
  - engraved crosshatching as the primary value method
  - dark plate ground with burnished highlights
  - chalk outlining every contour
