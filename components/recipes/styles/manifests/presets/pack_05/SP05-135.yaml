visualDna:
  aesthetic: 'Rule-breaking action anime: the picture cracked into angular glass-like shards, each shard shifting color and halftone, with uneven broken contours and abrupt cutout breaks.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Black and warm coral base; individual shards flip to bright yellow or cobalt.
  lighting_and_shadow: Hard edge separation, each shard lit on its own terms with small bright cuts.
  texture_and_material: Rough ink, broken halftone dot fields and dry scattered texture in the shard gaps.
  camera_and_composition: Keep the requested framing; fracture lines radiate from one focal point and the subject stays readable across the shards.
  atmosphere_and_mood: Mischief and unstable luck, the rules visibly breaking.
  rendering_and_quality: Broken contour, small shard displacement and a tightly controlled accent palette.
  key_features: glass-shard fracture; halftone that changes per shard; coral and black with yellow or cobalt; broken contours; radial fracture focal point
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Broken-Rule Halftone Shatter as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
