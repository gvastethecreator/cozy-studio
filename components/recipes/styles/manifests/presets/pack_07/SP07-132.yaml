visualDna:
  aesthetic: 'Anamorphic alignment: fragments scattered through deep space line up into one perfect shape only from the camera position and are broken from anywhere else.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into scattered fragments that assemble only from this single viewpoint, and that advertised structural change is the purpose of the preset.
  color_and_tone: One strong flat color or material for the aligned shape against the natural tones of the setting.
  lighting_and_shadow: Real light and shadows on each fragment betray their different depths while the shape stays unified.
  texture_and_material: Painted or built fragments on walls, floors, rocks and posts at very different distances.
  camera_and_composition: Locked at the single alignment point; small clues at the edges reveal the fragments are far apart.
  atmosphere_and_mood: Delightful and uncanny, a trick that only works right here.
  rendering_and_quality: Photographic realism with exact alignment; no flat overlay or composited graphic.
  creative_brief: "Anamorphic alignment: fragments scattered through deep space line up into one perfect shape only from the camera position and are broken from anywhere else. Carry it through fragments at different depths, one perfect shape from one viewpoint, flat strong color, shadows revealing depth, edge clues to the trick. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: fragments at different depths; one perfect shape from one viewpoint; flat strong color; shadows revealing depth; edge clues to the trick
