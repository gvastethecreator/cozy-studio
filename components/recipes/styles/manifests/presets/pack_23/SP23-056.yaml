  - portable-visual-study
  - visual-evaluation-pending
visualDna:
  aesthetic: >-
    Optional fine pigment opacity and subtle porosity on one explicitly authorized existing surface
    target. This modifier affects surface treatment only.
  subject_treatment: >-
    Preserve the base image silhouette, identity, count, proportions, pose, action and linework.
    Do not reshape or redraw content to make room for surface texture.
  color_and_tone: >-
    Preserve the base image palette and value relationships. Change no color unless separately
    authorized for the selected target.
  lighting_and_shadow: >-
    Preserve the base image lighting and shadow shapes. Surface porosity must not introduce a light,
    shadow or contrast change.
  texture_and_material: >-
    Apply fine opaque-grain cues only to the explicitly authorized existing material target. Keep
    contours clear and do not add damage, wear or texture beyond that target.
  camera_and_composition: >-
    Preserve the base image viewpoint, crop, scale and placement exactly. This modifier does not alter
    composition or add elements.
  atmosphere_and_mood: >-
    Preserve the base image setting and mood. Surface treatment adds no period, narrative or scene.
  rendering_and_quality: >-
    Keep any added grain fine and subordinate. Leave the underlying silhouette, line and shadow
    structure unchanged so the modifier can be removed without altering the image geometry.
avoidRules:
  - surface texture outside the explicitly authorized material target
  - changes to the base silhouette, linework, palette or shadow structure
  - unrequested wear, damage or graphic content
assets:
  defaultImage: /assets/recipes/styles/defaults/SP23-056.webp
attributes:
  negativePrompt: >-
    surface texture outside the explicitly authorized material target, changes to the base silhouette,
    linework, palette or shadow structure, unrequested wear, damage or graphic content
  intentionalPolicy:
    schemaVersion: 1
    kind: modifier
    defaultFields:
      - texture_and_material
    requires: materialTarget
    medium: fine-porous-pigment-surface-treatment
    constraints:
      - field: texture_and_material
        group: surface-treatment
        value: fine-opaque-grain-on-authorized-material-target
    avoidRules:
      - text: surface texture outside the explicitly authorized material target
        field: texture_and_material
      - text: changes to the base silhouette, linework, palette or shadow structure
        field: subject_treatment
      - text: unrequested wear, damage or graphic content
        field: global
  sourceMetadata:
