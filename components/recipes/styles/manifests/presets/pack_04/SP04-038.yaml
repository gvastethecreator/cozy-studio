visualDna:
  aesthetic: '1930s park poster screenprint: landscapes simplified into a few flat silhouette layers of separated earth-toned inks.'
  subject_treatment: Keep the prompt subject and action; this preset owns the layered scenic poster composition of stacked landscape planes, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Six to eight flat inks, rust, ochre, forest green, slate blue and cream, sky in stepped color bands.
  lighting_and_shadow: Time of day shown by color banding in the sky and a few flat shadow shapes on the mountains.
  texture_and_material: Flat screen-mesh ink with slight edge spread, uncoated poster stock.
  camera_and_composition: Horizontal strata from foreground silhouette to far peaks, one landmark centered and monumental.
  atmosphere_and_mood: Majestic, nostalgic and civic, nature presented with pride.
  rendering_and_quality: Clear flat shape separation with no photographic detail; no title band.
  key_features: flat separated earth inks; stacked silhouette strata; banded sky; monumental landmark; screen-mesh texture
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies National Park Poster (WPA) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
