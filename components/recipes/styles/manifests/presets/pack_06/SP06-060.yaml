visualDna:
  aesthetic: 'Terminal glyph art: an image made entirely of monospaced characters on a fixed grid, with denser glyphs for dark or bright areas depending on the screen.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Phosphor green or amber glyphs on black, a few brightness levels only; optional single-color variant.
  lighting_and_shadow: Values come from glyph density and weight; the brightest areas use heavy characters, the darkest are empty cells.
  texture_and_material: Strict character grid, soft phosphor glow around glyphs, faint scanlines, no individual pixels outside characters.
  camera_and_composition: Keep the requested framing at low resolution; the subject silhouette must stay readable from a distance.
  atmosphere_and_mood: Retro, hacker-like and mysterious, an image hidden in code.
  rendering_and_quality: Every mark a glyph cell on a regular grid, no readable words or sentences; shape emerges from density.
  key_features: monospaced glyph grid; density-based values; phosphor green or amber on black; soft glow and scanlines; no readable words
  creative_brief: "Terminal glyph art: an image made entirely of monospaced characters on a fixed grid, with denser glyphs for dark or bright areas depending on the screen. Carry it through monospaced glyph grid, density-based values, phosphor green or amber on black, soft glow and scanlines, no readable words. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
