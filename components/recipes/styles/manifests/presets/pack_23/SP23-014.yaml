visualDna:
  aesthetic: >-
    Embroidery-inspired mark construction, distinct from woven color planes: continuous thread-like
    contours, parallel stitch fills, discreet ground texture, exposed support gaps and slight tension
    variation.
  subject_treatment: >-
    Preserve requested identity, proportions, count, action and details. Use stitched marks to describe
    existing contours and filled areas rather than changing a subject's shape or material.
  color_and_tone: >-
    Preserve the requested palette and tonal hierarchy. Separate contours and stitch fills with
    existing colors; do not force historical colors or add Latin lettering.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Keep thread-like marks visually legible without
    inventing a directional light source or glossy fiber highlights.
  texture_and_material: >-
    Keep parallel stitch marks within the forms they describe, over only a discreet support weave.
    Leave some support visible and preserve the actual materials of depicted subjects; avoid a blanket
    cloth filter.
  camera_and_composition: >-
    Preserve requested viewpoint, crop, scale and arrangement. Do not impose a horizontal frieze or
    side-view layout.
  atmosphere_and_mood: >-
    Preserve the requested mood and setting. Embroidery marks do not imply a battle, historical
    narrative or staged tableau.
  rendering_and_quality: >-
    At medium viewing size, keep the continuous outline distinct from parallel fill stitches and the
    lightly textured support. Use small tension variations without turning them into random noise.
avoidRules:
  - unrequested battle, horses or Latin lettering
  - unrequested frieze or side-view composition
  - blanket cloth texture over the full image
assets:
