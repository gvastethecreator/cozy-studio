visualDna:
  aesthetic: '1960s psychedelic concert poster: every form melting into liquid swirls, vibrating complementary colors and dense wave patterns filling the sheet.'
  subject_treatment: Keep the prompt subject and action; this preset owns the all-over swirling poster composition, with no lettering or band members, and it never adds slogans, lettering or empty title plates.
  color_and_tone: Clashing complementaries of equal value, orange on blue, magenta on green, so edges optically vibrate.
  lighting_and_shadow: No natural light; flat color planes pulse through concentric contour bands.
  texture_and_material: Screenprint ink with slight overlap halos, contour lines echoing outward like ripples.
  camera_and_composition: Central melting subject with radiating waves, no empty space left anywhere on the sheet.
  atmosphere_and_mood: Ecstatic, dizzy and sensory, a sound made visible.
  rendering_and_quality: Dense decorative overload with fluid forms; no readable letterforms and no musicians unless asked.
  key_features: melting liquid swirls; vibrating equal-value complementaries; ripple contour bands; all-over density; screenprint halos
  creative_brief: "1960s psychedelic concert poster: every form melting into liquid swirls, vibrating complementary colors and dense wave patterns filling the sheet. Carry it through melting liquid swirls, vibrating equal-value complementaries, ripple contour bands, all-over density, screenprint halos. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
