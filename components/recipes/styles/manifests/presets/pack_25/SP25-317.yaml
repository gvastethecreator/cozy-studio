visualDna:
  aesthetic: 'Cutout Stop-Motion Frames: styleframes built from real paper cutouts on a table, moved frame by frame with visible handmade charm.'
  subject_treatment: Show the prompt's subject and words as paper cutouts on a tabletop in keyframes, each piece moved slightly per frame, every word exact.
  color_and_tone: Colored craft paper, cardboard browns and a soft painted backdrop.
  lighting_and_shadow: Soft top light with small real shadows under each lifted cutout.
  texture_and_material: Paper fibre, cut edges, a little glue shine and hand-cut imperfections.
  camera_and_composition: Locked overhead or frontal camera with pieces moving across frames.
  atmosphere_and_mood: Handmade, playful and warm, a craft studio at night.
  rendering_and_quality: Crisp photographic frames with tactile paper detail and real cut edges.
  creative_brief: "Cutout Stop-Motion Frames: styleframes built from real paper cutouts on a table, moved frame by frame with visible handmade charm. Carry it through paper cutouts, frame-by-frame moves, small shadows, locked camera. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: paper cutouts; frame-by-frame moves; small shadows; locked camera
