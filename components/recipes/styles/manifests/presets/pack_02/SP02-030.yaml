visualDna:
  aesthetic: 'Premium TV nature documentary: patient telephoto, slow motion and sweeping aerials, graded for spectacle and clarity.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Rich natural color, golden savannah light, deep ocean teal, lush greens, clean blacks.
  lighting_and_shadow: Low sun, backlight on fur and spray, soft overcast in forests.
  texture_and_material: Fur, feathers, water droplets and dust shown in slow-motion clarity.
  camera_and_composition: Long telephoto behavior shots, slow-motion peak moments, or wide aerial sweeps with tiny animals.
  atmosphere_and_mood: Awe-filled and patient, the drama of the natural world unfolding.
  rendering_and_quality: High-end documentary grade; no narrator, captions or channel logo.
  key_features: slow-motion peak moment; telephoto patience; sweeping aerials; rich natural grade; documentary clarity
  creative_brief: "Premium TV nature documentary: patient telephoto, slow motion and sweeping aerials, graded for spectacle and clarity. Carry it through slow-motion peak moment, telephoto patience, sweeping aerials, rich natural grade, documentary clarity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
