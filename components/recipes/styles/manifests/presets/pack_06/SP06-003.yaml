visualDna:
  aesthetic: 'Contemporary acrylic painting: fast-drying opaque color laid in clean flat shapes with taped or hard edges, layered one over another without blending.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing in this paint medium; only edges, layering, paint body and surface change, while identity, proportions and camera stay as requested.
  color_and_tone: High-key synthetic hues such as cadmium-free orange, phthalo turquoise and quinacridone pink, each shape a single flat value, strong complementary pairs.
  lighting_and_shadow: Light and shadow simplified into two or three flat value steps per form; cast shadows as crisp, colored shapes.
  texture_and_material: Faint primed canvas grain under a satin-matte plastic skin, slight ridges where a flat brush stopped, no oily sheen.
  camera_and_composition: Keep the requested framing; forms read as interlocking flat color areas with clear silhouettes.
  atmosphere_and_mood: Bright, direct and sunny, energy carried by bold color contrast.
  rendering_and_quality: Hard, clean edges between opaque layers, no soft blending or glazing, color fields even from edge to edge.
  key_features: opaque hard-edged color shapes; two or three flat value steps; complementary high-key palette; satin-matte acrylic skin; crisp colored cast shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Acrylic (Modern) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
