visualDna:
  aesthetic: >-
    When explicitly requested, fine ornamental lines add a measured detail rhythm inside selected areas
    while the main image remains governed by its base style.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Apply detail only to regions
    authorized by the user; do not create seals, alphabets, magical diagrams or new symbols.
  color_and_tone: >-
    Preserve the specified palette and use broad reserves with only localized color; do not introduce
    extra hues as part of the ornament.
  lighting_and_shadow: >-
    Keep the requested lighting and shadow structure. Fine detail must follow existing forms without
    adding a glow, halo or lighting effect.
  texture_and_material: >-
    Use precise thin lines and controlled repetition as a localized accent, not an all-over pattern or
    an external frame.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement; do not fill empty areas or reorganize
    the composition to accommodate ornament.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. Decorative linework does not imply a religious or historical
    subject.
  rendering_and_quality: >-
    Keep the principal silhouette and large forms dominant, using small-scale linework sparingly so the
    accent does not obscure identity or function.
avoidRules:
  - unrequested seals, writing, diagrams or symbolic marks
  - unrequested external frames or border ornament
  - detail that obscures identity or function
assets:
  defaultImage: /assets/recipes/styles/defaults/SP22-184.webp
attributes:
  negativePrompt: unrequested seals, writing, diagrams or symbolic marks, unrequested external frames or border ornament, detail that obscures identity or function
  intentionalPolicy:
