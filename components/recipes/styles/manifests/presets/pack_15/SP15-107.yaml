visualDna:
  aesthetic:
    'Use pastel retro-consumer futurism: checker or tiled planes, contained pastel gradients,
    chrome-trimmed curves, soft cathode halos, and shallow reflections on existing surfaces create
    synthetic nostalgia without adding a new landscape or view.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; let selected existing planes, edges,
    or reflections carry tile geometry and softened retro color. Do not add a window, coastline, ocean,
    palms, or sunset scene to communicate Vaporpunk.
  color_and_tone:
    Blend lavender, pale cyan, pink, cream, and washed teal in localized planes or reflections, with
    chrome or dark purple used sparingly for structure; retain the requested focal contrast and palette.
  lighting_and_shadow:
    Preserve the requested light source, direction, and time of day; use gradients as surface color and
    keep any cathode-like halo local rather than bathing the scene in sunset light.
  texture_and_material:
    Combine smooth tile, chrome trim, glassy reflections, and softly faded print; keep
    surfaces calm and avoid adding digital glitch artifacts.
  camera_and_composition:
    Use receding tile divisions or gentle reflective bands to lead toward the subject;
    preserve the requested setting and keep the background subordinate.
  atmosphere_and_mood:
    Suggest dreamy consumer-retro nostalgia through restrained color and surface rhythm; do not
    introduce a coast, horizon, sunset view, or commercial interior.
  rendering_and_quality:
    Keep large shapes soft-edged but defined, with concise highlights and enough contrast
    for a readable thumbnail.
avoidRules:
  - a mandatory mall, arcade, CRT, or empty commercial interior
  - heavy glitch effects
  - pastel haze that erases the focal subject
  - an unrequested coast, ocean, palm silhouette, sunset horizon, or scenic window view
