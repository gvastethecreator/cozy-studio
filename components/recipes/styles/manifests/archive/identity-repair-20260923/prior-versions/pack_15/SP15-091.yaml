visualDna:
  aesthetic: >-
    Desertpunk uses spare, heat-adaptive geometry: broad shade planes, dry layered surfaces and a narrow
    cooling accent set against open mineral values.
  subject_treatment: >-
    Preserve the requested subject, proportions and action. Favor compact silhouettes and clear overlap;
    apply dry surface variation only to compatible existing forms and do not add condenser equipment.
  color_and_tone: >-
    Let requested colors lead, with mineral ochre, clay, chalk and a restrained cool-water accent where
    suitable. Keep the warm-cool contrast clear without forcing a desert palette.
  lighting_and_shadow: >-
    Respect stated lighting and time. Separate forms with broad, hard-edged value planes when compatible;
    do not invent harsh noon light, a sun disk or a heat glow.
  texture_and_material: >-
    Preserve material identity. Use matte, dry grain locally on suitable surfaces and keep wear sparse;
    do not coat the subject with sand or dust.
  camera_and_composition: >-
    Preserve the requested view and crop. Use open negative space and staggered shade-like planes where
    existing geometry permits, without imposing a horizon or wasteland.
  atmosphere_and_mood: >-
    Convey adaptation under constraint through economical shapes and a limited cooling accent; keep the
    requested mood and avoid post-apocalyptic assumptions.
  rendering_and_quality: >-
    Use broad graphic planes, controlled particulate marks and a legible silhouette. Avoid dense grit,
    heat haze and tiny machinery.
avoidRules:
  - Do not add a desert horizon, condenser tower, dust storm or shade structure unless requested.
  - Avoid forced noon lighting, heat haze and uniform sand texture.
  - Do not replace the requested subject with climate infrastructure.
