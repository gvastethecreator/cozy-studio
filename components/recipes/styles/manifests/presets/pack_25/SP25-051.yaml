visualDna:
  aesthetic: 'Tensioned Membrane Tokens: one smooth surface stretched between three or four fixed points forms an expressive, clearly built icon.'
  subject_treatment: Stretch the prompt's subject as one membrane between three or four persistent points, letting its hollows and curves explain the metaphor.
  color_and_tone: One main color in broad value bands, with the support points in a secondary contrast.
  lighting_and_shadow: Diffuse light revealing curvature and tension with soft, even highlights.
  texture_and_material: Smooth membrane of uniform apparent thickness, taut and wrinkle-free.
  camera_and_composition: Asymmetric support points balanced around one dominant void.
  atmosphere_and_mood: Stable tension and resilient lightness, held rather than inflated.
  rendering_and_quality: The tension points stay identifiable even when the view shifts slightly.
  creative_brief: "Tensioned Membrane Tokens: one smooth surface stretched between three or four fixed points forms an expressive, clearly built icon. Carry it through stretched membrane, three or four anchors, dominant void, taut curves. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stretched membrane; three or four anchors; dominant void; taut curves
