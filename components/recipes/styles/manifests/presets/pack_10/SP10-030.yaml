visualDna:
  aesthetic: >-
    Dithering (1-bit) becomes a transferable digital signal artifact system: start from MacPaint
    style, Atkinson dither, and No greyscale, then route prompt content through compression errors,
    scan hardware, pixel logic, channel shifts, and broken media encoding without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Pixel patterns to corrupt, quantize, sort,
    smear, scan, posterize, or channel-split forms without losing silhouette intent; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Black and White only; bind color to device behavior: phosphor masks, CMYK
    dots, RGB offsets, tape bleed, or indexed palettes, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Pattern density drive the light response: make light feel emitted, scanned, clipped, banded,
    or sampled rather than normally photographed, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Checkerboard, noise as the tactile or mark-making basis; texture should come from pixels,
    scanlines, blocks, dither matrices, data drag, or print dots, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around No greyscale as reusable spatial grammar: use raster alignment, artifact seams,
    frame tears, grid pressure, and controlled signal breakdown, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Retro, binary as the emotional register; derive mood from damaged playback, obsolete
    interfaces, surveillance, latency, and media failure, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Retro computer: finish with intentional artifacts, sharp enough structure, and no
    random muddy AI noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    MacPaint style; Pixel patterns; Black and White only; Pattern density; Checkerboard, noise; No
    greyscale; Retro, binary; Retro computer; Atkinson dither
  creative_brief: >-
    Route any subject through Dithering (1-bit) as a transferable signal-distortion visual system:
    preserve prompt intent while converting form, motion, edge fidelity, pixel structure,
    compression behavior, and digital failure rhythm through this preset. Apply one-bit dithering to
    the input: black-white thresholds, ordered or error-diffused pixel patterns, harsh quantization,
    and optical gray made from binary marks should keep the subject readable at low fidelity.
avoidRules:
