visualDna:
  aesthetic: >-
    Build forms from small, deliberate pixel clusters with clean edges and stable separation between
    material, light and shadow. Use selective relief cues without turning detail into noise.
  subject_treatment: >-
    Preserve the requested identity, function, count, pose, action, proportions and functional parts.
    Cluster rendering follows existing shapes instead of replacing them with symbols.
  color_and_tone: >-
    Retain the requested palette and color relationships. Separate existing material and value groups
    clearly without imposing colors or a fixed number of hues.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Use stable, compact value clusters to describe the
    existing light without introducing new sources or changing its direction.
  texture_and_material: >-
    Preserve represented materials while keeping surface detail selective. Use small clusters to
    suggest form and material rather than applying a uniform raster texture.
  camera_and_composition: >-
    Preserve the requested viewpoint, apparent scale, crop and spatial arrangement. Pixel clusters
    refine the existing image without setting a new perspective or layout.
  atmosphere_and_mood: >-
    Preserve the requested setting and mood. Rasterized relief changes the rendering only; it does
    not imply a game interface, world or narrative.
  rendering_and_quality: >-
    Keep clusters clear at the intended viewing size and preserve detail selectively. Separate
    material, light and shadow without dense noise or continuous gradients.
avoidRules:
  - unrequested changes to subject identity, function, pose or viewpoint
  - dense pixel noise or raster texture replacing material distinctions
  - unrequested symbols, lettering, interface or layout
