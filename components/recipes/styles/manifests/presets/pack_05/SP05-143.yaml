  aesthetic: 'Urban night noir anime: fine dark contours threaded by thin cyan lines, an unnaturally starry sky over a blue-black city, and faint glowing cyan edges on figures.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Blue-black and charcoal with narrow cyan highlights and pinpoint stars.
  lighting_and_shadow: Cool reflected accents against deep shadow, without adding a new light fixture.
  texture_and_material: Broken reflective highlights and fine surface streaks over matte dark fields.
  camera_and_composition: Keep the requested framing; guarded negative space, off-center balance and a large sky where the view allows.
  atmosphere_and_mood: Lonely secrecy and restrained unease, a quiet city under a sky that feels false.
  rendering_and_quality: Thin cyan line accents, dark reflective values and generous empty space.
  key_features: false starfield sky; thin cyan contour threads; blue-black city; glowing cyan edges; guarded negative space
  creative_brief: "Urban night noir anime: fine dark contours threaded by thin cyan lines, an unnaturally starry sky over a blue-black city, and faint glowing cyan edges on figures. Carry it through false starfield sky, thin cyan contour threads, blue-black city, glowing cyan edges, guarded negative space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
