visualDna:
  aesthetic: 'Digital collage: hard-masked photo cutouts, flat geometric shapes, duotone gradient maps and halftone overlays layered in software.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Two or three duotone pairs such as teal and coral or ink and lemon; flat color blocks in pure hues.
  lighting_and_shadow: 'Stylized light: cutouts carry uniform crisp drop shadows at one angle regardless of their source light.'
  texture_and_material: Pixel-clean mask edges, halftone dot overlays, scanned paper grain as a subtle layer and flat vector shapes.
  camera_and_composition: Keep the requested view; elements overlap in clear layers with generous negative space and a strong central focus.
  atmosphere_and_mood: Playful and editorial, clean surrealism with a design sensibility.
  rendering_and_quality: Crisp masks, consistent drop-shadow angle, clean flat color; no torn paper or glue.
  key_features: hard-masked cutouts; duotone gradient maps; halftone overlays; flat geometric shapes; uniform drop shadows
  creative_brief: "Digital collage: hard-masked photo cutouts, flat geometric shapes, duotone gradient maps and halftone overlays layered in software. Carry it through hard-masked cutouts, duotone gradient maps, halftone overlays, flat geometric shapes, uniform drop shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
