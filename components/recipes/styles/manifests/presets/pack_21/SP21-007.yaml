visualDna:
  aesthetic: >-
    Layered pigment illustration in which a few deliberate incisions through a dry upper color reveal
    a contrasting underlayer carried by the same image.
  subject_treatment: >-
    Preserve the requested subject and proportions. Place reveal marks along selected existing edges
    and planes so they clarify form instead of converting it into carved lettering or ornament.
  color_and_tone: >-
    Use colors from the requested palette for both layers, keeping their value difference large enough
    for the revealed ground to read as a purposeful part of the depicted form.
  lighting_and_shadow: >-
    Follow the requested illumination. Keep the exposed underlayer within existing lit or shadowed
    regions; incisions are marks in the pigment, not a new light source.
  texture_and_material: >-
    Show narrow, crisp channels where the upper pigment has been scraped aside, with limited roughness
    at their ends. Keep the lower layer flat and continuous rather than building a raised ridge.
  camera_and_composition: >-
    Preserve the requested viewpoint and framing. Use a small number of reveals to support the existing
    focal structure without changing crop or adding a print border.
  atmosphere_and_mood: >-
    Retain the requested mood through the amount and spacing of exposed marks. Scraping pigment does
    not require a distressed, antique or archaeological subject.
  rendering_and_quality: >-
    Make each incision intentional, legible and consistent with its form. Avoid hatch families,
    repeated decorative scratches and plate-printed relief effects.
avoidRules:
  - repeated decorative scratches unrelated to form
  - raised or embossed channels
  - carved-print hatch families
