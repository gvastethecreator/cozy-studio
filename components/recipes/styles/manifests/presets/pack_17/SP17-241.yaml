visualDna:
  aesthetic: 'David Trampier old-school role-playing ink: clean confident line work, bold spotted blacks, moody dungeon interiors, grotesque idols and understated mysterious menace.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw the subject in clean confident ink line with bold spotted blacks in moody dungeon settings. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink on white with deep spotted blacks.
  lighting_and_shadow: Torchlit darkness expressed in solid blacks, lit the way David Trampier lights its scenes.
  texture_and_material: Black ink on cheap paper with photocopy grain and slight bleed.
  camera_and_composition: Classic book-plate framing, framed the way David Trampier composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with quiet mysterious menace.
  rendering_and_quality: Classic old-school role-playing ink plate, in the recognizable hand of David Trampier.
  creative_brief: "David Trampier old-school role-playing ink: clean confident line work, bold spotted blacks, moody dungeon interiors, grotesque idols and understated mysterious menace. Carry it through Trampier clean line, spotted blacks, dungeon idols. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Trampier clean line; spotted blacks; dungeon idols
