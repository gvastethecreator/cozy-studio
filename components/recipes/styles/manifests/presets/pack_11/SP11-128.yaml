  aesthetic: 'Piping isometric: single-line pipe runs drawn on a 30-degree grid with valves, flanges and elbows as symbols.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: rebuilt as pipe runs on an isometric grid: single lines, valve and flange symbols, flow arrows and elbows."
  color_and_tone: Black line work on white, with one accent color.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Clean CAD-like lines on paper, with the drafting tools visible in the line quality.
  camera_and_composition: Isometric sheet with a flow arrow and title block left blank.
  atmosphere_and_mood: Industrial, systematic, precise and clean, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Piping isometric: single-line pipe runs drawn on a 30-degree grid with valves, flanges and elbows as symbols. Carry it through isometric grid, single-line pipes, valve symbols. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
