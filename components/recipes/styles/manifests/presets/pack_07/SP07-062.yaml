visualDna:
  aesthetic: 'Canopy rope vernacular: platforms and huts lashed to giant tree trunks with catenary ropes, woven palm panels, radial floor joists and swaying rope bridges, no nails anywhere.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Warm bark browns, straw gold weaving, deep leaf greens and small patches of sky; natural mid-contrast palette.
  lighting_and_shadow: Dappled high sun through the leaves, bright coins of light on platforms, deep green shade between trunks.
  texture_and_material: Lashing knots, frayed fibre rope, woven palm and rattan panels, bark contact points and hanging vines.
  camera_and_composition: Keep the requested view; layer platforms vertically between trunks so height and suspension read clearly.
  atmosphere_and_mood: Airy, resourceful and alive, a structure that sways with the forest.
  rendering_and_quality: Naturalistic illustration with detailed knots and weaving; no galvanized hardware or polished metal.
  key_features: catenary rope lashings; radial platforms around trunks; woven palm panels; rope bridges; dappled canopy light
  creative_brief: "Canopy rope vernacular: platforms and huts lashed to giant tree trunks with catenary ropes, woven palm panels, radial floor joists and swaying rope bridges, no nails anywhere. Carry it through catenary rope lashings, radial platforms around trunks, woven palm panels, rope bridges, dappled canopy light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
