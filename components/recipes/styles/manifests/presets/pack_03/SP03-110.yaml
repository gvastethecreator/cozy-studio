visualDna:
  aesthetic: 'Engineering half-section: the subject sliced exactly in half on one clean plane, the cut faces capped in flat color so walls, cavities and mechanisms read at once.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns one clean section plane through the requested subject; the uncut half stays fully modeled and nothing appears inside that the subject would not contain. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Cut faces capped in one flat signal color such as vermilion or safety yellow, exterior surfaces in their true neutral materials.
  lighting_and_shadow: Soft key from the cut side so internal cavities show depth and occlusion, while the exterior half is lit normally.
  texture_and_material: Wall thickness, ribs, threads, cavities and bearings exposed at the cut; the caps perfectly flat and untextured.
  camera_and_composition: Three-quarter view looking into the section plane, the cut face turned about forty-five degrees toward the camera.
  atmosphere_and_mood: Analytical and revealing, the inside of a thing shown plainly.
  rendering_and_quality: Precise boolean section with crisp cap edges and no hatching, dimension lines or labels.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Half-Section Engineering Cutaway as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: single section plane; flat colored cut caps; exposed wall thickness; cavities with occlusion; untouched exterior half
