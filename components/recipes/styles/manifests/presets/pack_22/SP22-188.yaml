visualDna:
  aesthetic: >-
    Brush pressure and speed shape flowing curves and planes through broad starts, fine tapers, diluted
    ink and carefully held reserves, without forming written characters.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Apply brush rhythm to the
    existing subject; do not replace it with letters, symbols or a writing instrument.
  color_and_tone: >-
    Keep the requested palette and use diluted dark values with measured color accents; do not force a
    monochrome image if color is specified.
  lighting_and_shadow: >-
    Follow the requested light direction and use wash density to describe its existing shadows; do not add
    a glow, halo or unsupported source.
  texture_and_material: >-
    Use controlled wash blooms, tapered brush edges and open reserves; keep the surface clean and avoid
    adding paper scrolls, seals or simulated text.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Brush flow follows the existing forms
    and does not reorganize the image into a calligraphic layout.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. Calligraphic mark behavior carries no required language,
    religion, cultural symbol or historical setting.
  rendering_and_quality: >-
    Vary stroke width through pressure and velocity, then balance diluted darks with clear reserves; keep
    the subject readable and avoid accidental glyph-like marks.
avoidRules:
  - unrequested writing, glyphs, seals or invented symbols
  - unrequested religious or cultural motifs
  - extra details that alter identity or function
