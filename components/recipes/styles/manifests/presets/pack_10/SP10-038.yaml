visualDna:
  aesthetic: >-
    Vaporwave becomes a transferable surreal symbolic transformation system: start from 80s computer
    aesthetic, Windows 95 UI, and Glitch, then route prompt content through impossible logic, dream
    scale, symbolic displacement, liminal staging, and psychic texture without forcing one card
    scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Grid to bend, displace, fuse, haunt,
    miniaturize, exaggerate, or estrange prompt subjects without forcing a fixed scene; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Pink, Cyan; use color as emotional unreliability, nostalgic drift,
    uncanny contrast, or symbolic temperature, with enough value control that the subject remains
    readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Neon drive the light response: shape light through impossible shadows, memory haze, stage
    stillness, glow, fog, or dreamlike exposure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Marble bust, palm tree as the tactile or mark-making basis; surfaces should support the
    illusion with believable texture, collage edges, flesh-metal seams, or unreal smoothness, scaled
    to figures, props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Glitch as reusable spatial grammar: favor symbolic focal points, scale mismatch,
    empty thresholds, doubled images, and psychologically charged negative space, adapting cleanly
    to portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Chill, nostalgic as the emotional register; derive mood from wonder, dread, absurdity,
    nostalgia, erotic tension, menace, or utopian unease when the prompt allows, without flattening
    strong, strange, darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Aesthetic, retro: finish with deliberate weirdness, controlled realism, and no
    generic fantasy scene lock, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    80s computer aesthetic; Grid; Pink, Cyan; Neon; Marble bust, palm tree; Glitch; Chill,
    nostalgic; Aesthetic, retro; Windows 95 UI
  creative_brief: >-
    Apply vaporwave nostalgia to the input: chrome gradients, pastel magenta-cyan haze,
    faux-classical fragments, sunset grids, and slowed consumer-future melancholy should stylize any
    subject without requiring a mall, bust, or palm backdrop.
avoidRules:
  - modern
  - nature
  - literal fantasy scene lock
  - generic dream blur
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
