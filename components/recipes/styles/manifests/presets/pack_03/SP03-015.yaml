visualDna:
  aesthetic: 'Claymation stop-motion: the subject sculpted in plasticine and posed on a miniature set, with fingerprints, tool marks and slight frame-to-frame boil.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild them in this 3D medium without changing the requested view.
  color_and_tone: Saturated but slightly chalky plasticine colors, warm miniature set lighting.
  lighting_and_shadow: Small hard studio lamps with soft fill, crisp little shadows on the set.
  texture_and_material: Fingerprints, smoothing marks, tiny cracks and wire armature bulges in soft clay.
  camera_and_composition: Keep the requested view; macro depth of field reveals the miniature scale.
  atmosphere_and_mood: Handmade and charming, a world pressed together by patient fingers.
  rendering_and_quality: Physical plasticine look with visible handling marks, never smooth plastic CG.
  key_features: plasticine with fingerprints; miniature set; small hard lamps; macro depth; handmade imperfection
  creative_brief: "Claymation stop-motion: the subject sculpted in plasticine and posed on a miniature set, with fingerprints, tool marks and slight frame-to-frame boil. Carry it through plasticine with fingerprints, miniature set, small hard lamps, macro depth, handmade imperfection. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
