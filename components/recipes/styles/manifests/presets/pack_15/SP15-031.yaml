    Render mycelium mats, translucent membranes, living ribs, nerve fibers, wet bark, petri-glass
    accents, spores, and organic circuit lattices; keep material scale coherent, surface marks
    motivated, and tactile details strong enough to route style without becoming pasted grunge.
  camera_and_composition: >-
