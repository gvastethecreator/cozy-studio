visualDna:
  aesthetic: 'Natural-history skeleton mount: the subject reduced to its articulated bones, wired together in a lifelike pose on slender iron rods like a museum display.'
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; show it as its own articulated skeleton mounted on a thin iron armature, anatomically plausible for the creature (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: Aged ivory to tea-brown bone with darker staining at the joints, a black iron armature and a neutral gallery backdrop.
  lighting_and_shadow: Museum gallery spots from above casting crisp rib shadows across the plinth and floor.
  texture_and_material: Bone porosity, suture lines on the skull, worn joint surfaces, wire loops and brass pins at the joints.
  camera_and_composition: Keep the requested view; the full skeleton reads as a silhouette of ribs and limb bones.
  atmosphere_and_mood: Solemn and scholarly, a life reconstructed from what remains.
  rendering_and_quality: Plausible bone count and joints for the species or invented creature, with no flesh and no gore.
  creative_brief: "Natural-history skeleton mount: the subject reduced to its articulated bones, wired together in a lifelike pose on slender iron rods like a museum display. Carry it through articulated bones, iron armature rods, ivory to tea-brown bone, rib shadows from gallery spots, brass joint pins. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: articulated bones; iron armature rods; ivory to tea-brown bone; rib shadows from gallery spots; brass joint pins
