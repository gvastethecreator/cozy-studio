visualDna:
  aesthetic: Grounded seinen realism in slightly unsteady hand-inked contours and short observational hatching, like a court sketch artist's anime; edges misregister a hair around the focal face or object.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Subdued slate, tobacco brown and paper-cream neutrals with saturation kept below a third; stronger hue only where the prompt asks for an accent.
  lighting_and_shadow: Plausible soft-edged daylight or room light with a few precise highlight cuts on eyes, knuckles or metal; no theatrical beams.
  texture_and_material: Dry pencil grain under thin opaque ink, hatching that follows each plane, and a faint doubled line at the focal edge.
  camera_and_composition: Keep the requested camera; observational eye-level feel with slightly sharper edges on the focal subject than on its surroundings.
  atmosphere_and_mood: 'Doubt and scrutiny: calm on the surface, with watchful unease living in the hesitant lines.'
  rendering_and_quality: Realistic proportions, restrained anime simplification of faces, crisp focal edges and softer peripheral hatching; drawn, never photographic.
  key_features: unsteady observational ink contours; short plane-following hatches; slate, tobacco and paper palette; slight focal misregistration; realistic proportions
  creative_brief: "Grounded seinen realism in slightly unsteady hand-inked contours and short observational hatching, like a court sketch artist's anime; edges misregister a hair around the focal face or object. Carry it through unsteady observational ink contours, short plane-following hatches, slate, tobacco and paper palette, slight focal misregistration. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
