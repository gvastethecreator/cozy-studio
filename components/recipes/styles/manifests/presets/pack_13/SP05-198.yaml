visualDna:
  aesthetic: >-
    Anime cel drawing uses translucent contour layers, pearly transitions, and delicate
    filament marks.
  subject_treatment: >-
    Keep silhouette and materials; transparency only on parts already described as
    translucent.
  color_and_tone: >-
    Sea-glass teal, violet, pearl, citron, deep blue; cool highlights and clear shadows.
  lighting_and_shadow: >-
    Transmitted light only for depicted transparent forms; opaque parts use firm cel
    shadows.
  texture_and_material: >-
    Soft wash and fine accents locally; no tentacles, aquatic subjects, clutter, or makeover
    details.
  camera_and_composition: >-
    Preserve camera; airy overlap only among shapes already in the prompt.
  atmosphere_and_mood: >-
    Wonder or playfulness follows prompt; surface treatment works on ordinary subjects too.
  rendering_and_quality: >-
    Separate translucent accents from opaque planes; avoid muddy gradients and excess
    ornament.
  key_features: >-
    Pearly translucent layers, sea-glass-violet palette, local filament marks, clear opaque
    forms
  creative_brief: 'Apply a visual treatment centered on pearly translucent layers, sea-glass-violet palette, local filament marks, clear opaque forms. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
