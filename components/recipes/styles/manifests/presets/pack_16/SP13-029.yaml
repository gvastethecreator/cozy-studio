  aesthetic: 'Siege anime at the moment walls break: fire, splintered timber, embers and bodies of smoke pushing through a gap.'
  subject_treatment: Keep the prompt's subject and setting; put it at a threshold being forced open, with fire and debris driving through the frame.
  color_and_tone: Ember orange and ash grey against night blue, sparks as bright points.
  lighting_and_shadow: Firelight from the breach, hard orange rims and deep blue shadow on the far side.
  texture_and_material: Splintered wood, cracked stone, smoke and flying sparks drawn as bold effect animation.
  camera_and_composition: Framed through the breach or from inside looking out at the flood of light and debris.
  atmosphere_and_mood: Violent and desperate, the roar of a wall giving way and no time left to choose.
  rendering_and_quality: Dynamic effects-heavy anime with readable silhouettes against the fire.
  key_features: breaching gap; embers; fire rim light; debris effects
  creative_brief: "Siege anime at the moment walls break: fire, splintered timber, embers and bodies of smoke pushing through a gap. Carry it through breaching gap, embers, fire rim light, debris effects. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
