visualDna:
  aesthetic: >-
    Build the graphic anime treatment from calm, clean contours punctuated by tightly snapped
    marks and ordinary forms simplified into stable color blocks. Let short linear rhythms that
    sharpen the existing gesture set its rhythm; use cool fluorescent tones, pale neutrals, and
    one warm accent for color and smooth flat fills with very limited texture for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use calm, clean contours punctuated by tightly
    snapped marks for edge work, ordinary forms simplified into stable color blocks for form
    simplification, and short linear rhythms that sharpen the existing gesture only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with cool fluorescent tones, pale neutrals, and one warm accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: even cool-white value separation with no implied light fixture.
    Keep shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth flat fills with very limited texture, preserving depicted
    materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use clear horizontal or diagonal lanes within the
    requested composition to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey calm timing interrupted by a sharp visual accent,
    while preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with quiet base shapes, sharp directional lines, and minimal detail; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    calm, clean contours punctuated by tightly snapped marks; ordinary forms simplified into
    stable color blocks; cool fluorescent tones, pale neutrals, and one warm accent; short linear
    rhythms that sharpen the existing gesture; smooth flat fills with very limited texture; clear
    horizontal or diagonal lanes within the requested composition.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with calm, clean contours
    punctuated by tightly snapped marks, ordinary forms simplified into stable color blocks, and
    cool fluorescent tones, pale neutrals, and one warm accent; use short linear rhythms that
    sharpen the existing gesture only where movement is already present, and apply smooth flat
    fills with very limited texture as the drawing finish.
