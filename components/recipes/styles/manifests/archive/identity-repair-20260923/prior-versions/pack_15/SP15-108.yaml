visualDna:
  aesthetic: >-
    Use nested rounded rectangles, paired circular forms, and linked ribbon-like curves to create a
    precise tactile analog rhythm.
  subject_treatment: >-
    Preserve requested subject and function; translate contours into nested arcs and precise internal
    divisions without requiring a device portrait.
  color_and_tone: >-
    Combine warm cream, smoky charcoal, muted amber, and cool blue-green, using small accents to
    distinguish planes.
  lighting_and_shadow: >-
    Place controlled glints on selected edges and concise shadows around nested forms; follow requested
    illumination.
  texture_and_material: >-
    Contrast molded matte planes, translucent bands, brushed-metal accents, and paper-like grain through
    distinct finish changes.
  camera_and_composition: Preserve the crop; organize paired circles and nested contours around the existing focal area.
  atmosphere_and_mood: Blend analog curiosity with forward-looking order without forcing nostalgia or a period scene.
  rendering_and_quality: Keep nested geometry legible, material transitions clean, and fine marks sparse.
avoidRules:
  - dense control-like marks obscuring the main forms
  - ribbon curves tangled or detached from the composition
  - a literal device replacing requested subject matter
