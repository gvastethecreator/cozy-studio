  aesthetic: 'Penguin tricolour paperback look from the 1930s to 1950s: three horizontal bands, a white center panel with Gill Sans title and author, a small bird roundel and genre color coding.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; reduce the subject to a tiny emblem or none at all, letting the three-band typographic grid carry the cover. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: One genre color such as orange, green or blue with a white center band.
  lighting_and_shadow: Flat printed light on uncoated stock, lit the way Penguin Tricolour Paperback Cover lights its scenes.
  texture_and_material: Worn uncoated paper, faded ink and softened corners.
  camera_and_composition: Flat frontal paperback with three horizontal bands, framed the way Penguin Tricolour Paperback Cover composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with modest classic order.
  rendering_and_quality: Faithful vintage tricolour paperback design, in the recognizable hand of Penguin Tricolour Paperback Cover.
  creative_brief: "Penguin tricolour paperback look from the 1930s to 1950s: three horizontal bands, a white center panel with Gill Sans title and author, a small bird roundel and genre color coding. Carry it through Penguin three bands, Gill Sans, genre color, worn paperback. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
