visualDna:
  aesthetic: 'Celestial atlas plate: the subject drawn as a hand-colored engraved constellation figure over a star field of graded dots and a coordinate grid.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a star-atlas plate where the subject becomes a constellation figure over plotted stars and a coordinate grid, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Deep midnight blue ground, pale gold stars, figure in thin cream line with soft wash tints.
  lighting_and_shadow: No lighting; stars sized by magnitude as bright dots with tiny rays.
  texture_and_material: Engraved hairlines, stippled Milky Way band, faint curved coordinate lines and aged paper edges.
  camera_and_composition: The constellation figure filling a circular or rectangular chart, coordinate arcs curving across it.
  atmosphere_and_mood: Mythic and quiet, a story written in the stars.
  rendering_and_quality: Precise engraved chart with no star names, degree numbers or captions.
  creative_brief: "Celestial atlas plate: the subject drawn as a hand-colored engraved constellation figure over a star field of graded dots and a coordinate grid. Carry it through constellation figure, magnitude-sized star dots, curved coordinate grid, midnight blue and gold, engraved hairlines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: constellation figure; magnitude-sized star dots; curved coordinate grid; midnight blue and gold; engraved hairlines
