visualDna:
  aesthetic: >-
    Anime drawing pairs a structural ink line with controlled translucent washes. Broken contours,
    soft wet edges and open gaps let the line carry the form.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Keep the structural line clear
    around defining features, hands and other small parts.
  color_and_tone: >-
    Preserve the requested palette and color relationships. Keep washes transparent and subordinate
    to the drawn structure rather than bleaching or replacing local colors.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use localized wash density to describe existing
    shadows without adding a new source or broad atmospheric haze.
  texture_and_material: >-
    Use selective wet edges and localized pigment pooling. Preserve each depicted material and leave
    intentional open gaps; do not apply a global paper or watercolor filter.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Variable contours do not rearrange
    the image; add no card frame or lettering.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Wash texture does not add weather, scenery or an anime-world
    backdrop.
  rendering_and_quality: >-
    Establish the silhouette and key linework first, then apply controlled wash. Keep the eyes, hands
    and other defining details distinct at reduced size.
avoidRules:
  - broad wash that obscures defining features or small parts
  - uniform paper texture or pigment overlay across the image
  - unrequested card frame or lettering
