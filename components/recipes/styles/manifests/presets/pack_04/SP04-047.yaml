visualDna:
  aesthetic: 'Film matte painting: a photoreal digital painting made to extend a live-action plate, with invisible seams between painted architecture, photo texture and sky.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and repaint them with this concept-art method; the method sets marks, values and finish but never adds a sheet, grid or panel layout.
  color_and_tone: 'Filmic grade with strong atmospheric perspective: distant planes lifted toward the sky color and desaturated, the foreground holding the deepest blacks.'
  lighting_and_shadow: One sun or moon direction shared by every element, soft haze scatter, and cast shadows matched in hardness and temperature across all layers.
  texture_and_material: Photographic-scale surface detail near camera, simplified painted detail with distance, crisp rooflines and ridge silhouettes, fine aerial haze.
  camera_and_composition: Keep the requested view; build it from five or more receding depth planes with a clear horizon and a believable lens.
  atmosphere_and_mood: Vast, still and believable, a place that seems to have always existed.
  rendering_and_quality: Seamless photoreal finish with no visible brushwork in the near field; depth is carried by haze and value, never by blur.
  key_features: invisible plate seams; five or more haze planes; one shared light direction; photographic near detail; photoreal finish
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Matte Painting as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
