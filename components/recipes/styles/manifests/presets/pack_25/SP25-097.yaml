visualDna:
  aesthetic: 'Contour-Line Gauges: meters filled with stacked contour lines like a topographic map, the number of rings rising with each value.'
  subject_treatment: Draw the prompt's values as shapes filled with nested contour lines, one ring per declared step, so the level reads like elevation; keep labels exact.
  color_and_tone: Earthy or monochrome ramps with one highlight on the current level line.
  lighting_and_shadow: Flat cartographic rendering with depth suggested only by line density.
  texture_and_material: Fine even contour lines, crisp step labels and a paper-map calm.
  camera_and_composition: Frontal gauges with a clear step legend and the current line emphasized.
  atmosphere_and_mood: Exploratory and grounded, like reading terrain rather than a machine.
  rendering_and_quality: The count of contour steps matches each value, with no invented rings.
  creative_brief: "Contour-Line Gauges: meters filled with stacked contour lines like a topographic map, the number of rings rising with each value. Carry it through nested contour rings, step legend, highlighted level, map calm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: nested contour rings; step legend; highlighted level; map calm
