visualDna:
  aesthetic: >-
    Golden Hour acts as a transferable photographic style router: begin from Sunset/Sunrise light,
    Warm cast, and lighting-first photographic system where the preset is defined by source
    placement, exposure behavior, shadow design, and light color, then apply the photographic
    behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Long shadows; preserve the prompt subject while letting light
    carve silhouette, volume, specular response, motion, and separation, keeping the original
    subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Warm Gold, Orange, Red; treat color as a consequence of source temperature, gel
    choice, exposure rolloff, neon spill, flame warmth, or low-light sensor response, with value
    separation and white balance choices that feel captured in-camera rather than painted over.
  lighting_and_shadow: >-
    Use Directional, soft; make source direction, softness, beam width, bounce, haze, catchlight, or
    motion trail legible enough to be the main style cue, preserving believable exposure, shadow
    density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Glowing atmosphere; show how surfaces react to the light through rim edges, glossy kick,
    matte falloff, fog particles, grain, or illuminated dust, avoiding both waxy smoothing and noisy
    texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Lens flare; compose to reveal the light event through silhouettes, negative
    space, beam paths, frontal flash flattening, or long-exposure gesture, with lens distance,
    depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Warm, happy; derive mood from theatrical control, nocturnal pressure, warmth,
    mystery, kinetic exposure, or graphic shadow tension, so the preset changes interpretation
    without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Warm editorial realism; finish with photographic exposure discipline, controlled
    highlights, clean shadow structure, and no random glow pasted over the image, high-resolution
    photographic detail, and disciplined denoise without losing natural grain where the preset needs
    it.
  key_features: Sunset/Sunrise light; Warm cast; Warm Gold, Orange, Red; Directional, soft; Lens flare
  creative_brief: >-
    Apply Golden Hour as a photographic preset over prompt X: preserve the user's requested subject,
    then route Sunset/Sunrise light, Warm Gold, Orange, Red, Directional, soft, Glowing atmosphere,
    and Lens flare through optics, exposure, palette, surface response, timing, and finish without
    requiring the card image's original subject.
