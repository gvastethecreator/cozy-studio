visualDna:
  aesthetic: 'Anime ground-skim staging: the camera races just above the ground ahead of the subject, so the near ground rushes in stretched detail at the bottom of the frame and the subject looms toward the lens from a low angle.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the ankle-height camera racing along the ground ahead of the subject, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; the rushing ground is the most saturated band and the sky stays light.
  lighting_and_shadow: Backlight or high side light that throws the subject shadow toward the camera across the ground.
  texture_and_material: Ground detail such as grass, stones or planks stretched into short streaks near the lens and sharp further back.
  camera_and_composition: Lens at ankle height, horizon in the lower third, subject approaching head-on or at a slight angle.
  atmosphere_and_mood: Low, fast and immersive, as if running alongside.
  rendering_and_quality: Controlled ground streaking only in the near band and a crisp, stable subject.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ground-Skim Low Tracking Shot as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: ankle-height camera ahead of subject; near ground stretched into streaks; horizon in lower third; shadow toward camera; looming low angle
