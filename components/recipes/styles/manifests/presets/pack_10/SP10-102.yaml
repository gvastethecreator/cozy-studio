visualDna:
  aesthetic: 'Slit-scan: each column captured at a different moment, stretching and warping moving subjects.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: moving parts of the subject stretch and bend across columns while static parts stay sharp."
  color_and_tone: Original palette in stretched streaks, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Stretched warped streaks, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Temporal, uncanny, fluid and strange, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  creative_brief: "Slit-scan: each column captured at a different moment, stretching and warping moving subjects. Carry it through slit-scan stretch, time-warped columns. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: slit-scan stretch; time-warped columns
