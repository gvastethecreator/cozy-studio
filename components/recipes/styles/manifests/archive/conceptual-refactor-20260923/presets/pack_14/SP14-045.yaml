visualDna:
  aesthetic: >-
    Bronze Spear Public Oath acts as a transferable mythic-noir router: sworn obligation made
    clearly expressed as dark symbolic order, bronze translated into dark symbolic behavior plus
    spear translated into dark symbolic behavior fused with Greek epic noir with bronze law, laurel
    governance, oracle fragments, maritime strategy, and sun-struck fatalism; it carries symbol,
    omen, ritual authority, and mature editorial restraint without locking prompt content to its
    sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through long
    thrust-line silhouette and martial oath emphasis plus oath-bound contour and promise-weighted
    silhouette pressure; forms should inherit silhouette pressure, emblem logic, ritual posture,
    edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through bronze, verdigris green, smoke gray, and dark marble values plus sealing-wax
    red, black vow shadow, and pale witness marks together with Aegean blue-black, bronze, marble
    ivory, olive green, red thread, smoke gray, laurel shadow, and harsh dawn gold; values stay
    separated, accents feel intentional, and the dark palette supports the requested content rather
    than swallowing it.
  lighting_and_shadow: >-
    Use warm metal bounce and hard rim glints plus narrow witness glints and solemn rim separation
    with hard dawn planes, oracle smoke glow, bronze bounce, sea-haze contrast, and severe
    sculptural shadow; shadows must carry omen weight, rims should clarify form, and glow should
    behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render bronze patina, engraved scratches, hammered planes, and oily smoke, bronze point, leather
    wrap, and dust-bright edge plus wax, cord, old paper, rubbed metal, and pressure marks alongside
    bronze patina, marble dust, olive wood, red thread fiber, sailcloth, ash, salt, engraved stone,
    and spear-edge glints; surface scale, patina, residue, gloss, grain, and carved or sealed edges
    must remain coherent across characters, objects, scenes, and abstractions.
  camera_and_composition: >-
    Frame with oath-line diagonals and binding intervals, bronze converted into repeatable spatial
    rhythm and symbolic hierarchy plus spear converted into repeatable spatial rhythm and symbolic
    hierarchy plus frieze order, labyrinth logic, oath-line diagonals, public-measure spacing, and
    monument-like silhouette balance; the style should support portraits, objects, architecture,
    creatures, symbols, and full scenes through reusable spatial grammar instead of one fixed
    layout.
  atmosphere_and_mood: >-
    Carry mood through sworn obligation and irreversible consequence, bronze pressure, consequence,
    and symbolic tension plus spear pressure, consequence, and symbolic tension and tragic law,
    public honor, strategic pressure, fatal prophecy, disciplined return, and unsentimental heroic
    aftermath; the image can become severe, sensual, sacred, violent, quiet, or strange when prompt
    X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with clean vow-sign readability with severe dark editorial polish plus bronze recognition
    with denoised dark editorial polish and controlled material truth and classical-noir
    illustration with crisp profiles, restrained grain, readable metal, and no museum-label text;
    prioritize clean denoise, readable dark values, strong silhouette hierarchy, tactile material
    truth, and no watermark, fake text, logos, accidental UI, or muddy black crush.
  key_features: >-
    sworn obligation made clearly expressed as dark symbolic order, bronze translated into dark
    symbolic behavior plus spear translated into dark symbolic behavior; long thrust-line silhouette
    and martial oath emphasis plus oath-bound contour and promise-weighted silhouette pressure;
    bronze patina, engraved scratches, hammered planes, and oily smoke, bronze point, leather wrap,
    and dust-bright edge plus wax, cord, old paper, rubbed metal, and pressure marks; warm metal
    bounce and hard rim glints plus narrow witness glints and solemn rim separation; oath-line
    diagonals and binding intervals, bronze converted into repeatable spatial rhythm and symbolic
    hierarchy plus spear converted into repeatable spatial rhythm and symbolic hierarchy
  creative_brief: >-
    Apply Bronze Spear Public Oath after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies sworn obligation
    made clearly expressed as dark symbolic order, bronze translated into dark symbolic behavior
    plus spear translated into dark symbolic behavior, long thrust-line silhouette and martial oath
    emphasis plus oath-bound contour and promise-weighted silhouette pressure, bronze, verdigris
    green, smoke gray, and dark marble values plus sealing-wax red, black vow shadow, and pale
    witness marks, warm metal bounce and hard rim glints plus narrow witness glints and solemn rim
    separation, bronze patina, engraved scratches, hammered planes, and oily smoke, bronze point,
    leather wrap, and dust-bright edge plus wax, cord, old paper, rubbed metal, and pressure marks
    plus oath-line diagonals and binding intervals, bronze converted into repeatable spatial rhythm
    and symbolic hierarchy plus spear converted into repeatable spatial rhythm and symbolic
    hierarchy, finish discipline, and negative controls without requiring a fixed deity, ritual,
    prop bundle, location, or sample composition.
