visualDna:
  aesthetic: >-
    Showa-era psychological folklore crossing into invasive floral body horror: blooms are a
    contaminating force that claims bodies and familiar rooms, not pretty decoration.
  subject_treatment: >-
    Preserve explicit identity, action and count. Develop unspecified edges and seams into invasive
    floral rhythms, roots and petal clusters that merge beauty with bodily unease; keep the main
    subject readable.
  color_and_tone: >-
    Use the game's recognizable opposition: dense crimson/black floral growth against washed cyan,
    blue-green, or gray air. Keep the split local to the image; avoid a global red-blue filter.
  lighting_and_shadow: >-
    Ordinary spaces sit in cold, low-contrast overcast light; the transformed side gains saturated
    red spill and denser shadow. Let the two states visibly contaminate each other.
  texture_and_material: >-
    Ground infestation in 1960s wood, paper, plaster, cloth, skin, and ground. Petals cluster,
    stalks bridge surfaces, and organic matter follows seams rather than appearing as a floral
    overlay.
  camera_and_composition: >-
    Preserve the user's camera and crop. Build tension with a calm human-scale anchor surrounded or
    bisected by invading organic forms; asymmetry carries the beautiful-versus-horrifying turn.
  atmosphere_and_mood: >-
    Restrained Showa familiarity, folklore, social pressure, and an intimate, almost ceremonial
    dread; the red bloom should feel beautiful until its spread becomes inescapable.
  rendering_and_quality: >-
    Detailed psychological-horror concept painting: believable Showa-era materials contrast with
    precise invasive petal and filament forms. Soft painted atmosphere and severe cool-to-crimson
    value grouping, not a flower embellishment or a game capture.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
