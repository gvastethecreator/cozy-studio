visualDna:
  aesthetic: 'Composition thumbnail grid: the same scene explored in twelve small pencil-framed rectangles, each testing a different camera and shot size.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a grid of twelve framing studies of the one subject and scene, and that layout replaces the requested framing.
  color_and_tone: Three grey values per thumbnail, graphite on white bond paper, no color.
  lighting_and_shadow: Light simplified to one lit shape against dark masses in each thumbnail to test focal pull.
  texture_and_material: Soft graphite blocking, marker-grey fills, ruled rectangle frames drawn freehand.
  camera_and_composition: 'Twelve equal rectangles in a three-by-four grid: worm’s-eye, overhead, dutch angle, extreme wide, over-the-shoulder and tight close framings of one scene.'
  atmosphere_and_mood: Analytical and suspenseful, searching for the strongest shot.
  rendering_and_quality: Stamp-size value studies only, no detail, no finished frame.
  key_features: three-by-four thumbnail grid; one scene in twelve framings; three grey values; freehand frames; varied camera heights
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Composition Thumbnail Grid as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
