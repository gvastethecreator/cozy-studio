visualDna:
  aesthetic: >-
    Source-informed video-game style router for original immersive art-deco first-person shooter
    captures: undersea pressure halls, brass machinery, wet tile, plasmid-like ability effects,
    enemy silhouettes, and route/combat readability. Borrow the art-deco material pressure of
    BioShock-like games, but land as a different fictional drowned city with different signage
    shapes, enemies, weapons, UI icons, and architectural motifs.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable drowned-deco first-person
    screenshot subject: keep clear threat/object function, route affordance, weapon or hand scale,
    interactable pickup logic, and readable combat spacing without copying source characters or
    named IP elements.
  color_and_tone: >-
    Use an immersive drowned-deco palette: oxidized teal, brass gold, wet black, nicotine amber,
    coral red, sea green, and porcelain white. Keep value grouping legible at gameplay distance and
    avoid pixel-art downgrade or generic sci-fi blue wash.
  lighting_and_shadow: >-
    Light the image through flickering deco lamps, watery caustics, electrical arcs, muzzle flashes,
    and deep corridor shadows. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from brass deco trim, cracked tiles, wet glass, peeling posters without readable
    slogans, riveted metal, and sea growth. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with first-person camera, playable corridor/atrium route, weapon/hand edge, interactable
    object, enemy spacing, and environmental cover. The frame should read as a captured gameplay
    moment, not a retro sprite scene or poster.
  atmosphere_and_mood: >-
    Carry an original drowned-deco mood: decayed, theatrical, paranoid, wet, retro-futurist, and
    pressure-sealed.
  rendering_and_quality: >-
    Finish as coherent first-person immersive shooter screenshot style, not pixel art and not
    concept art: sparse contextual HUD, ability/weapon cues, pickup glow, and route lighting can
    appear. Maintain heavy-denoise clarity, crisp focal hierarchy, and no readable signage/logos.
  key_features: >-
    BioShock gameplay screenshots; first-person immersive-sim capture with art-deco underwater
    corridors, leaking glass, plasmid hands, and environmental horror staging; green seawater,
    tarnished gold, rust orange, red alarm glow, black ocean void, and sickly neon signage shapes;
    flickering deco lamps, watery caustics, electrical arcs, muzzle flashes, and deep corridor
    shadows; brass deco trim, cracked tiles, wet glass, peeling posters without readable slogans,
    riveted metal, and sea growth; first-person weapon/plasmid framing with corridor depth,
    interactable props, enemy silhouettes, and resource pickup readability; decayed, theatrical,
    paranoid, wet, and retro-futurist; HUD guidance: health/eve meters, ammo counters, plasmid
    icons, and objective arrows are allowed if they match immersive-sim screenshot logic
  creative_brief: >-
    Use Drowned Deco Pressure Hall as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through immersive art-deco shooter references: first-person camera,
    brass/wet-tile material language, pressure-hall lighting, ability effects, and playable route
    readability. Avoid direct BioShock cloning, exact signage, retro pixel downgrade, and
    promotional composition.
