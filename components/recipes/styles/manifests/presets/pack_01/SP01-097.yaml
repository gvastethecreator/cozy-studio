visualDna:
  aesthetic: 'Kodak Tri-X pushed to 1600–3200: black-and-white film underexposed in low light and overdeveloped, giving hard contrast and gritty, clumped grain.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Monochrome with chalky whites, few midtones, and shadows blocked to solid black.
  lighting_and_shadow: Scarce available light — one bulb, a fire, a doorway — with deep falloff; highlights burn, shadows lose all detail.
  texture_and_material: Coarse, clumped, sharp-edged grain across the whole frame, strongest in midtone greys; slight motion blur tolerated.
  camera_and_composition: Keep the requested framing; handheld 35 mm closeness.
  atmosphere_and_mood: Raw and urgent, grit and blackness crowding every scrap of light.
  rendering_and_quality: 'Push-processed darkroom print: high contrast and grit, not a clean box-speed tonal scale.'
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Kodak Tri-X Pushed as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: push-processed grit; clumped coarse grain; blocked black shadows; chalky highlights; low available light
