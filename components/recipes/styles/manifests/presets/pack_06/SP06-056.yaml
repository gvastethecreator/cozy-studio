visualDna:
  aesthetic: 'Synthwave digital art: an eighties retro-future look with glowing neon outlines, a striped setting sun and a perspective grid receding to the horizon.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Deep purple and indigo night fading to hot pink and orange at the horizon, cyan and magenta neon lines, chrome highlights.
  lighting_and_shadow: Backlit silhouettes against the sunset, neon edge glow and bloom, deep dark foregrounds.
  texture_and_material: Glowing laser lines, faint CRT scanlines, chrome gradients, soft star field.
  camera_and_composition: Keep the requested subject, set against a low horizon with a one-point perspective grid when the setting allows.
  atmosphere_and_mood: Nostalgic, nocturnal and cool, a dream of a neon future.
  rendering_and_quality: Clean glowing vector-like neon, smooth gradients, crisp silhouettes; no cars, roads or sunsets unless the prompt asks.
  key_features: purple-to-pink retro gradient; neon cyan and magenta lines; striped sun; perspective grid horizon; chrome highlights
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Synthwave as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
