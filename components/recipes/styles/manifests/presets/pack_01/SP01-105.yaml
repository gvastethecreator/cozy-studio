visualDna:
  aesthetic: 'Reflection-layered street photography: shooting through window glass so the room behind and the street reflected on it overlap in one ambiguous frame.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: 'Two color worlds blended: warm interior light mixing with cool reflected daylight; semi-transparent overlaps.'
  lighting_and_shadow: Balanced exposure between inside and outside so both layers read; dark areas of one layer reveal the other.
  texture_and_material: Glass imperfections, bullseye distortion, condensation or dust on the pane, crisp edges where layers meet.
  camera_and_composition: Camera close to the glass, subject inside framed by reflected shapes from outside (or the reverse); no single clear depth plane.
  atmosphere_and_mood: Dreamlike and ambiguous, two moments folded into one surface of glass.
  rendering_and_quality: In-camera optical overlap, not a digital double exposure or blend-mode composite.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Reflection-Layered Street as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: through-glass layering; reflected street over interior; semi-transparent overlap; glass flaws; ambiguous depth
