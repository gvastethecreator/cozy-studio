visualDna:
  aesthetic: 'Cork: granulated cork board with speckled texture and soft pinholes.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is made of granulated cork with speckled texture."
  color_and_tone: Warm tan, brown and dark speckles, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft warm light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Granular cork with pinholes and compressed grains, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Warm, light, natural and homely, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: granulated cork; speckled texture; pinholes
  creative_brief: "Cork: granulated cork board with speckled texture and soft pinholes. Carry it through granulated cork, speckled texture, pinholes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
