visualDna:
  aesthetic: 'Pinscreen animation: an image formed by thousands of pins pushed to different depths and lit from the side, so their shadows create soft grey tones.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Monochrome silver greys from white to deep black, velvety and engraving-like.
  lighting_and_shadow: Oblique light casting pin shadows; darkness where pins stand out, light where they sink.
  texture_and_material: Fine stippled grain of pin tips, soft transitions like mezzotint.
  camera_and_composition: Frontal framing of the screen, forms emerging and dissolving into darkness.
  atmosphere_and_mood: Haunting and dreamlike, memories surfacing out of shadow.
  rendering_and_quality: Pinscreen tonality with no hard outlines; not a photograph or drawing.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Pinscreen Animation as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: pin-shadow tones; velvety grey stipple; forms emerging from darkness; no outlines; oblique light
