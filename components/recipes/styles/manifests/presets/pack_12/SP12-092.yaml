visualDna:
  aesthetic: >-
    Represent the original Darkest Dungeon (2016) combat presentation as hand-drawn 2D character
    units in a compressed side-view encounter. Keep the readable line-and-ink drawing, expressive
    profile silhouettes and dark, narrow setting; this is a game-screen representation, not a
    cinematic adaptation or merely a black texture pass.
  subject_treatment: >-
    Keep the requested active party members and opposing threat count, roles and action legible
    across the horizontal battle lane. Use individually posed, visibly different silhouettes and
    expressive face/hand gestures; the four-hero formation is contextual, not mandatory when the
    prompt specifies another count.
  color_and_tone: >-
    Use near-black and dark umber as structural masses, with parchment/ochre light, muted red or
    rust and cool stone or green-blue accents where the scene supports them. Separate player units,
    enemy and wall with value and hue rather than adding general brightness.
  lighting_and_shadow: >-
    Let a torch, fire or other scene light create a compact warm focal pool against deep uneven
    darkness. Preserve facial and weapon silhouettes with small lit edges; do not add cinematic
    volumetric beams or glossy 3D highlights.
  texture_and_material: >-
    Keep cloth, skin, armor, wood and stone in the game's hand-inked 2D grammar: variable contour,
    angular black shadow shapes and occasional short hatching. It may be rough, but retain
    form-specific mark direction and distinct unit silhouettes; do not use pixel clusters, realistic
    materials or uniform grunge.
  camera_and_composition: >-
    Lock combat to a mostly side-on tactical tableau with heroes on one side, enemy or enemies
    opposite and a stable ground line. Keep units large enough to read pose and role, with a
    confined dungeon wall behind them. A portrait card can crop a portion of the wider battle lane,
    but must retain the left-right encounter relation and not become a close-up character poster.
  atmosphere_and_mood: >-
    Show a consequential turn-based beat—aim, advance, defend, strike or recover—with pressure
    carried by stillness and dark surroundings. Use psychological unease and fatigue without forcing
    stress icons, gore or a horror reveal.
  rendering_and_quality: >-
    Use the 2016 hand-illustrated sprite-and-background look with rough expressive outlines,
    articulated cutout units and limited, highly controlled color. Include interface only when
    requested or visibly appropriate to the source frame; never fabricate text or status values.
avoidRules:
  - unrequested use of the named hero roster, exact enemy designs, hamlet or dungeon layout
  - changing the tactical side view to pixel-platformer or third-person 3D
  - unrequested gore, stress symbols, torch icons or fabricated status text
  - wide cinematic staging that makes units too small to read
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
