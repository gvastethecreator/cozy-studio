visualDna:
  aesthetic: 'Smoke photography style: the subject drawn as thin wisps of backlit smoke on black.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject's outline is traced by curling smoke filaments on black."
  color_and_tone: White or tinted smoke on pure black, used consistently across subject and background.
  lighting_and_shadow: Hard side backlight on smoke, expressed through the style rather than photographic lighting.
  texture_and_material: Thin curling smoke filaments, visible at a glance as the signature of the style.
  camera_and_composition: Subject centered against black, arranged so the subject still reads at a glance.
  atmosphere_and_mood: Ethereal, delicate, mysterious and fleeting, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp high-contrast finish, with clean, deliberate marks and no accidental noise.
  key_features: smoke filaments tracing form; black ground
  creative_brief: "Smoke photography style: the subject drawn as thin wisps of backlit smoke on black. Carry it through smoke filaments tracing form, black ground. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
