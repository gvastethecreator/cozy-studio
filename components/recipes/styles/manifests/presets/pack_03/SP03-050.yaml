visualDna:
  aesthetic: >-
    Motion Graphics acts as a transferable CGI-style router: start from Motion Graphics procedural
    3D shapes, kinetic hierarchy, abstract product rhythm, keyframed graphic motion and 3D style
    system built from modeling language, mesh abstraction, projection rules, topology display, toy
    material, paper logic, or stylized shader constraints, then apply the 3D/render behavior to
    prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through adapt the requested subject through procedural 3D shapes,
    kinetic hierarchy, abstract product rhythm, keyframed graphic motion while preserving its
    identity; preserve the prompt subject while rebuilding it through the preset-specific 3D
    language; use facets, voxels, topology lines, clay, paper folds, toon bands, or procedural
    motion forms only when the preset calls for them, keeping the requested identity, silhouette,
    pose, object function, or environment legible.
  color_and_tone: >-
    Build color with palette and exposure choices that support procedural 3D shapes, kinetic
    hierarchy, abstract product rhythm, keyframed graphic motion; use color through material
    simplification, cel ramps, toy plastic, paper fiber, retro CGI gradients, voxel palettes, or
    procedural motion accents, with deliberate value grouping, exposure control, and medium-specific
    limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through light behavior that reveals procedural 3D shapes, kinetic hierarchy,
    abstract product rhythm, keyframed graphic motion; shape light through the style constraint:
    simplified GI, toon bands, clay softness, wire visibility, toy shadows, paper fold light, or
    retro speculars, so value structure supports the renderer and does not overwrite the requested
    content.
  texture_and_material: >-
    Render procedural 3D shapes, kinetic hierarchy, abstract product rhythm, keyframed graphic
    motion; surface detail should show the named construction system; cube faces, mesh edges, fold
    creases, clay fingerprints, topology overlays, procedural blobs, or low-poly facets should
    appear only when they belong to the preset, keeping material scale coherent and avoiding noisy
    filler texture.
  camera_and_composition: >-
    Structure the image through scale rhythm, spacing, and composition rules shaped by procedural 3D
    shapes, kinetic hierarchy, abstract product rhythm, keyframed graphic motion; compose through
    projection, topology readability, object grouping, axis discipline, exploded or arranged parts,
    or stylized scale rhythm, with scale, spacing, edge rhythm, and visual hierarchy doing the style
    work.
  atmosphere_and_mood: >-
    Keep the mood mood carried by procedural 3D shapes, kinetic hierarchy, abstract product rhythm,
    keyframed graphic motion; derive mood from toy-like clarity, technical breakdown, handmade
    stop-motion, abstract motion, retro CGI novelty, or procedural mathematical wonder, letting the
    renderer alter interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with finished Motion Graphics CGI with procedural 3D shapes, kinetic hierarchy, abstract
    product rhythm, keyframed graphic motion and controlled detail; finish with intentional
    stylization, clean geometry, stable silhouettes, and no accidental photoreal overwrite unless
    the preset asks for it, clean denoised surfaces where appropriate, and enough shader evidence to
    make the CGI mode recognizable.
  key_features: >-
    Motion Graphics procedural 3D shapes, kinetic hierarchy, abstract product rhythm, keyframed
    graphic motion; palette and exposure choices that support procedural 3D shapes, kinetic
    hierarchy, abstract product rhythm, keyframed graphic motion; scale rhythm, spacing, and
    composition rules shaped by procedural 3D shapes, kinetic hierarchy, abstract product rhythm,
    keyframed graphic motion
  creative_brief: >-
    Apply Motion Graphics as a CGI/render preset over prompt X: preserve the user's requested
    subject, then route modeling, shader response, lighting, material scale, composition, mood, and
    final render craft through Motion Graphics procedural 3D shapes, kinetic hierarchy, abstract
    product rhythm, keyframed graphic motion without requiring the card image's original subject.
