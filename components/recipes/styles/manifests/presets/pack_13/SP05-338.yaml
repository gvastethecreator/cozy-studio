visualDna:
  aesthetic: >-
    Use acute contour cuts, hard cel-shadow planes and restrained ember accents to suggest
    combustion through shape language without depicting fire.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep a high-contrast base with
    small ember colors; preserve prompt-specific color and avoid blanket orange.
  lighting_and_shadow: >-
    Use sharp shadow cuts and tiny hot-edge accents only where supported by the prompt light.
  texture_and_material: >-
    Keep fill surfaces clean and angular; do not melt, char or transform materials unless requested.
  camera_and_composition: >-
    Align angular accents with existing forms and action; preserve layout and avoid an explosion
    composition.
  atmosphere_and_mood: >-
    Combustion is an angular visual rhythm, not an added event; honor calm or still prompts.
  rendering_and_quality: >-
    Apply the angular treatment to any subject without adding flames, smoke, melting, blast or
    damage. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Acute angular cuts; hard cel shadows; restrained ember accents; icon-like contrast; crisp
    contour.
  creative_brief: 'Apply this visual treatment to the requested content: Acute angular cuts; hard cel shadows; restrained ember accents; icon-like contrast; crisp contour. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - ember glow obscuring angular shadow cuts
  - unprompted flame or smoke effects
  - angular cuts damaging subject-defining edges
