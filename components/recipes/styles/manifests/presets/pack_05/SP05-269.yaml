  camera_and_composition: Tense overhead table compositions and cold close-ups on calm calculating eyes.
  atmosphere_and_mood: Keep the requested mood with cold calculating tension.
  rendering_and_quality: Smoky psychological Madhouse television frame with postwar gloom.
