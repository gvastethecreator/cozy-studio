  color_and_tone: Two-tone or jewel palette per tile type, used consistently across subject and background.
  lighting_and_shadow: Flat or subtle tile sheen, expressed through the style rather than photographic lighting.
  texture_and_material: Rhombus tiles with fine grout lines, visible at card size as the signature of the style.
  camera_and_composition: Five-fold radial tiling, arranged so the subject still reads at card size.
  atmosphere_and_mood: Mathematical, mysterious, ordered and unusual, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp precise finish, with clean, deliberate marks and no accidental noise.
