visualDna:
  aesthetic: 'Futurist dynamism: repeated overlapping forms and force lines expressing speed and motion.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is repeated in successive overlapping positions with sharp force lines."
  color_and_tone: Bright reds, blues and metallic greys, used consistently across subject and background.
  lighting_and_shadow: Dynamic light fragments, expressed through the style rather than photographic lighting.
  texture_and_material: Repeated contours, force lines and fragmented planes, visible at card size as the signature of the style.
  camera_and_composition: Diagonal motion across the frame, arranged so the subject still reads at card size.
  atmosphere_and_mood: Fast, violent, mechanical and exhilarating, driven by the construction, color and rhythm.
  rendering_and_quality: Energetic painted finish, with clean, deliberate marks and no accidental noise.
  creative_brief: "Futurist dynamism: repeated overlapping forms and force lines expressing speed and motion. Carry it through repeated motion contours, force lines, diagonal speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: repeated motion contours; force lines; diagonal speed
