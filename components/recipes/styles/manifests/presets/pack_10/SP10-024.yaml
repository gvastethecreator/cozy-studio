visualDna:
  aesthetic: >-
    CRT Monitor becomes a transferable digital signal artifact system: start from Close up screen,
    Scanlines, and Curved screen, then route prompt content through compression errors, scan
    hardware, pixel logic, channel shifts, and broken media encoding without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using RGB phosphor mask to corrupt, quantize, sort,
    smear, scan, posterize, or channel-split forms without losing silhouette intent; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Glowing phosphors; bind color to device behavior: phosphor masks, CMYK
    dots, RGB offsets, tape bleed, or indexed palettes, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Screen glow drive the light response: make light feel emitted, scanned, clipped, banded, or
    sampled rather than normally photographed, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Shadow mask grid as the tactile or mark-making basis; texture should come from pixels,
    scanlines, blocks, dither matrices, data drag, or print dots, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Curved screen as reusable spatial grammar: use raster alignment, artifact seams,
    frame tears, grid pressure, and controlled signal breakdown, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Retro, tech as the emotional register; derive mood from damaged playback, obsolete
    interfaces, surveillance, latency, and media failure, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Retro tech: finish with intentional artifacts, sharp enough structure, and no random
    muddy AI noise, preserving prompt X as the base content and the preset as the style router.
  key_features: >-
    Close up screen; RGB phosphor mask; Glowing phosphors; Screen glow; Shadow mask grid; Curved
    screen; Retro, tech; Retro tech; Scanlines
  creative_brief: >-
    Apply CRT phosphor display logic to the input: RGB triad texture, scanline hum, curved-glass
    bloom, warm electronic glow, and slight convergence errors should make any subject feel emitted
    by an old monitor.
avoidRules:
  - lcd
  - sharp pixels
  - clean photo realism
  - random AI smear
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
