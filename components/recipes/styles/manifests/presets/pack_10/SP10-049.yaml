visualDna:
  aesthetic: >-
    Houndstooth becomes a transferable textile and ornamental pattern system: start from Broken
    check pattern, Grid, and Repeat, then route prompt content through motifs, repeats, weave logic,
    decorative grids, stitched marks, and surface ornament without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Jagged checks to wrap, embroider, tile, dye,
    weave, print, or camouflage forms while preserving the prompt subject underneath; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Black and White; treat palette as dye, thread, ceramic pigment, woven
    banding, motif hierarchy, or cultural ornament logic, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flat drive the light response: use soft fabric light, glazed highlights, stitch shadows,
    woven occlusion, or flat printed illumination, avoiding generic glamour lighting unless the
    prompt explicitly asks for it.
  texture_and_material: >-
    Render Wool as the tactile or mark-making basis; surface detail must follow yarn, fiber, glaze,
    dye bleed, thread crossings, repeat seams, or tile breaks, scaled to figures, props, spaces, or
    close material studies.
  camera_and_composition: >-
    Compose around Repeat as reusable spatial grammar: favor repeat rhythm, motif scale, borders,
    allover fields, woven diagonals, and pattern-to-subject adaptation, adapting cleanly to
    portraits, objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Professional as the emotional register; derive mood from craft, ritual, fashion, domestic
    texture, camouflage, ornament, or folk memory, without flattening strong, strange, darker, or
    adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Fashion, classic: finish with readable pattern scale, tactile detail, and no
    wallpaper pasted over the subject, preserving prompt X as the base content and the preset as the
    style router.
  key_features: >-
    Broken check pattern; Jagged checks; Black and White; Flat; Wool; Repeat; Professional; Fashion,
    classic; Grid
  creative_brief: >-
    Apply houndstooth as jagged woven authority over the input with broken black-white checks, sharp
    tooth-like repetition, flat fashion clarity, and controlled agitation. If clothing or fabric
    exists, use it directly; otherwise map the pattern onto forms without requiring boardroom or
    professional staging.
avoidRules:
  - floral
  - organic
  - generic wallpaper overlay
  - pattern pasted flat
  - literal card scene
