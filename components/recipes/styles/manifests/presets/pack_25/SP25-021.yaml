visualDna:
  aesthetic: 'Open-Joint Monoline: uniform line icons that leave small deliberate gaps at every joint, separating parts while the silhouette still reads as one.'
  subject_treatment: Draw the prompt's subject or requested actions as monoline icons whose stroke joints open with small optical gaps, keeping each metaphor distinct.
  color_and_tone: One ink for the body, with any secondary accent repeating what the shape already says.
  lighting_and_shadow: Pure flat line work, crisp and even, with every stroke standing on its own.
  texture_and_material: Uniform stroke width with clean terminals and equal apparent weight on diagonals.
  camera_and_composition: Icons aligned by optical weight on equal boxes, extra air around important gaps.
  atmosphere_and_mood: Light precision and openness, calm and legible rather than fragile.
  rendering_and_quality: Gaps survive at the smallest size and no crossing produces a darker spot.
  creative_brief: "Open-Joint Monoline: uniform line icons that leave small deliberate gaps at every joint, separating parts while the silhouette still reads as one. Carry it through open stroke joints, uniform monoline, equal boxes, light precision. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: open stroke joints; uniform monoline; equal boxes; light precision
