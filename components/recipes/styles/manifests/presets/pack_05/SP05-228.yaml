visualDna:
  aesthetic: >-
    Quiet pale rendering with worn enamel-like highlights, dust-softened edges, delicate
    synthetic line rhythms, and generous white space.
  subject_treatment: >-
    Keep the requested subject recognizable. Draw fine, graceful contours and a few carefully
    worn edges on its existing forms; add no robot or machine fragments.
  color_and_tone: >-
    Stay mostly in bone, soft white, silver, and pale blue-gray, reserving darker values for
    essential contour and structure.
  lighting_and_shadow: >-
    Use soft, cool cel shadows and diffuse white highlights, with limited contrast and no
    visible light source.
  texture_and_material: >-
    Preserve material identity while suggesting enamel through smooth highlight bands, faint
    dust grain, and small worn flecks.
  camera_and_composition: >-
    Honor the given framing. Let spare negative space and quiet line spacing carry the
    composition without shrinking the subject.
  atmosphere_and_mood: >-
    Build elegiac calm through pale values, delicate marks, and stillness, without adding a
    lonely landscape or character.
  rendering_and_quality: >-
    Keep outlines fine but stable, shadow edges soft, whites clean, and texture sparse enough to
    retain clarity.
  key_features: >-
    Pale enamel-like highlights; dust-softened detail; fine contours; quiet white and blue-gray
    palette.
  creative_brief: >-
    Preserve the specified subject and composition. Apply pale tonal bands, delicate contours,
    and faint worn texture; add no robot, landscape, or isolated character.
