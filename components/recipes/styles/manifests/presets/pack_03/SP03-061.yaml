visualDna:
  aesthetic: 'Hard-surface modeling: the subject rebuilt as engineered panels with chamfered edges, boolean cuts and support-looped bevels that each catch a thin line of light.'
  subject_treatment: Keep the prompt subject, action, setting and camera view; rebuild the subject's construction in this hard-surface method as one hero image, never a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Two-tone painted panels in gunmetal and one secondary color, with bare metal exposed only at edges and fasteners.
  lighting_and_shadow: Rim and top light placed to run a bright bevel line along every panel edge while the flat faces stay mid-grey.
  texture_and_material: Panel seams, recessed bolts, vent slots, boolean-cut ports and light edge scuffs, with the flat faces kept clean.
  camera_and_composition: Keep the requested view; a three-quarter silhouette shows how the plates stack and which way the panels flow.
  atmosphere_and_mood: Tactical and exact, every plate designed to move, fasten or protect.
  rendering_and_quality: Bevel highlights consistent in width, with no pinching or smoothing artifacts on the flat faces.
  key_features: chamfered bevel highlight lines; boolean-cut ports; panel seams and recessed bolts; two-tone paint; stacked plates
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Hard Surface Modeling as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
