visualDna:
  aesthetic: >-
    Alcohol Ink becomes a transferable fluid and organic behavior system: start from Fluid painting,
    Gold veins, and Liquid, then route prompt content through flow, branching, cellular membranes,
    diffusion, turbulence, and living surface logic without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Hard drying edges to bend, pool, branch, bloom,
    spike, foam, or dissolve forms while preserving the prompt intent; preserve anatomy, object
    identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Translucent, vibrant; let hues follow fluid thickness, chemical bloom,
    interference, biological growth, or vapor density, with enough value control that the subject
    remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Backlit drive the light response: use reflection, translucency, subsurface scattering, glow,
    or backlit edges to reveal fluid structure, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Fluid dynamics as the tactile or mark-making basis; surfaces need coherent viscosity,
    membranes, droplets, filaments, bubbles, grains, or particulate fields, scaled to figures,
    props, spaces, or close material studies.
  camera_and_composition: >-
    Compose around Liquid as reusable spatial grammar: favor flow direction, cellular repetition,
    eddies, radial forces, tendrils, and macro-to-wide scalability, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Dreamy, fluid as the emotional register; derive mood from instability, growth, toxicity,
    delicacy, pressure, and organic motion, without flattening strong, strange, darker, or adult
    prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Abstract art, flow: finish with clean fluid physics, readable boundaries, and
    restrained micro-noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Fluid painting; Hard drying edges; Translucent, vibrant; Backlit; Fluid dynamics; Liquid;
    Dreamy, fluid; Abstract art, flow; Gold veins
  creative_brief: >-
    Route any subject through Alcohol Ink as a transferable fluid or organic process visual system:
    preserve prompt intent while converting form, surface tension, flow, translucency, edge
    softness, and material motion through this preset. Apply alcohol-ink bloom to the input:
    translucent pigment clouds, solvent halos, soft feathered borders, and luminous color pooling
    should dissolve surfaces while keeping enough contour to recognize the prompt.
avoidRules:
  - solid
  - dry
  - stiff solids
  - muddy fluid mixing
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
