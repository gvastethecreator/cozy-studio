visualDna:
  aesthetic: 'Figure-ground plan: buildings as solid black shapes, streets and open space as white.'
  subject_treatment: "Treat the prompt's subject as the thing being documented, keeping it recognizable; all labels, numbers and notes are unreadable marks: reduced to solid black buildings and white open space, so the subject shape emerges from streets and squares."
  color_and_tone: Pure black and white, following the conventions of this drawing type.
  lighting_and_shadow: No scene lighting; depth and emphasis come only from line weight, hatching and flat tone.
  texture_and_material: Flat print, with the drafting tools visible in the line quality.
  camera_and_composition: Top-down plan, laid out as a real sheet of this drawing type.
  atmosphere_and_mood: Stark, graphic, analytic and bold, from careful, purposeful drafting.
  rendering_and_quality: Precise technical drafting with consistent line weights and believable conventions.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Urban Figure-Ground Plan as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: black buildings; white streets
