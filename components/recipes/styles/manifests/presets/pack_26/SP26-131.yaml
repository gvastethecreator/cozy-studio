  color_and_tone: Stark black ink on white, true to the Raymond Pettibon palette.
  lighting_and_shadow: Flat ink on paper, lit the way Raymond Pettibon lights its scenes.
  texture_and_material: Raw ink brushwork and photocopy grain, with the surface finish of Raymond Pettibon.
  camera_and_composition: Single stark ink panel, framed the way Raymond Pettibon composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with sardonic suburban dread.
  rendering_and_quality: Faithful eighties hardcore punk cover, in the recognizable hand of Raymond Pettibon.
