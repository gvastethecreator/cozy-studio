visualDna:
  aesthetic: >-
    Water Splash behaves like a controlled elemental effect layer: start from High speed liquid,
    Liquid, and Surface tension, then turn motion, temperature, particles, translucency, refraction,
    glow, and transient energy behavior into portable surface behavior rather than a literal
    material sample.
  subject_treatment: >-
    Transform any prompt subject through Droplets: preserve identity and pose while letting forms
    emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface breakup,
    thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Clear, Blue tint as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Refractive, Caustic define the light response: highlights, occlusion, translucency, specular
    scatter, matte falloff, or rim behavior should reveal Water Splash without hiding the prompt
    subject.
  texture_and_material: >-
    Render Liquid through flow direction, particle density, turbulence, glow falloff, splashes,
    trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Surface tension as reusable material rhythm: macro-friendly for texture tasks,
    but able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Refreshing, dynamic by using movement, danger, spectacle, instability,
    temperature, and sensory intensity; the material should color the scene's feeling while
    preserving the user's requested subject and setting.
  rendering_and_quality: >-
    Finish with Fresh, clean material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: High speed liquid; Droplets; Liquid; Refractive, Caustic; Surface tension
  creative_brief: >-
    Route any subject through Water Splash as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Capture the frozen ballet of water in
    mid-splash where droplets hang suspended in a corona of liquid tension, each sphere a tiny lens
    bending light through its crystalline transparency. Surface tension should feel stretched to its
    absolute limit, a moment of chaos ordered by physics into fleeting perfection. Render the
    sculpture of the instantaneous, a splash arrested at its most beautiful. Use Water Splash as
    portable surface/render behavior over any input: map its texture, light response, edge wear,
    color chemistry, and tactile rhythm onto the subject instead of requiring a literal material
    sample, macro tile, wall, landscape, source object, or scene where the material naturally
    appears.
avoidRules:
