  aesthetic: 'Levitation: people and objects floating calmly in mid-air as if gravity paused.'
  subject_treatment: "Keep the prompt's subject and setting, but apply this structural distortion to them: the subject and some objects float in mid-air while the rest stays grounded."
  color_and_tone: Natural palette, applied consistently so the dream logic reads as one world.
  lighting_and_shadow: Natural light with cast shadows below, supporting the dream logic without adding stock props.
  texture_and_material: Realistic textures, rendered with enough realism that the impossible feels believable.
  camera_and_composition: Keep the prompt framing; place the distortion or dream element where it reads instantly at a glance.
  atmosphere_and_mood: Weightless, calm, magical and quiet, arising from the mechanism rather than added scenery.
  rendering_and_quality: Painterly or photoreal finish chosen by the prompt, with clean edges and no muddy haze.
  creative_brief: "Levitation: people and objects floating calmly in mid-air as if gravity paused. Carry it through floating subjects, paused gravity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: floating subjects; paused gravity
