  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is covered in large overlapping dragon scales with ridges and metallic sheen.'
  color_and_tone: Bronze, crimson, emerald or obsidian with metallic highlights, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Hard raking light showing ridges, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Thick overlapping scales with ridges, scratches and metallic sheen.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Powerful, armored, mythic and fierce, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: large overlapping dragon scales; ridges; metallic sheen; battle scratches
  creative_brief: "Dragon scale: large armored overlapping scales with ridges, metallic sheen and battle scratches. Carry it through large overlapping dragon scales, ridges, metallic sheen, battle scratches. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
