visualDna:
  aesthetic: 'Toy-scale sectional cutaway: the subject built in painted toy wood with its front face removed, revealing stacked compartments and every internal part in miniature.'
  subject_treatment: Keep the requested subject, its identity and pose; this preset owns the open-front sectional cutaway that shows its interior, and a requested object stays that object instead of becoming a building.
  color_and_tone: Pastel wall fields, painted toy-wood primaries and natural beech edges; bright, soft and even.
  lighting_and_shadow: Each compartment lit by its own small warm source, soft front fill, gentle shadows inside the cut edges.
  texture_and_material: Painted wood with softened corners, tiny textile and paper details, visible cut section edges in raw wood.
  camera_and_composition: Straight-on elevation of the open section so every compartment reads at once, like a toy display.
  atmosphere_and_mood: Curious and cozy, the pleasure of seeing how everything fits inside.
  rendering_and_quality: Clean toy photography with legible compartments; no figures and no product-packaging look.
  key_features: front face removed; stacked miniature compartments; painted toy wood; raw-wood section edges; straight-on elevation
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Toy-Scale Sectional Cutaway as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
