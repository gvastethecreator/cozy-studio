visualDna:
  aesthetic: 'Humanist reportage: tender black-and-white photographs of ordinary people at eye level with a 50 mm lens, finding dignity and gentle humor in everyday life.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Soft monochrome with long grey midtones, gentle contrast, no crushed blacks.
  lighting_and_shadow: Overcast daylight or soft window light; shadows open and forgiving.
  texture_and_material: Moderate grain; worn clothes, bread, stone and hands rendered warmly.
  camera_and_composition: 50 mm at eye level, subjects close enough to read expression, simple backgrounds, a small humorous or tender detail.
  atmosphere_and_mood: Warm and compassionate, quiet affection for people going about their day.
  rendering_and_quality: Soft darkroom print; distinct from gritty high-contrast street photography.
  creative_brief: "Humanist reportage: tender black-and-white photographs of ordinary people at eye level with a 50 mm lens, finding dignity and gentle humor in everyday life. Carry it through tender everyday moment, soft grey monochrome, 50 mm eye level, overcast light, gentle humor. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: tender everyday moment; soft grey monochrome; 50 mm eye level; overcast light; gentle humor
