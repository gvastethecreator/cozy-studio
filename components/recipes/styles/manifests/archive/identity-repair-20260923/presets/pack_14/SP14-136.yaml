visualDna:
  aesthetic: >-
    Pigment gathers in dark tide lines and softly branches into lighter washes. Selected edges bleed
    while a few dry contours anchor the image.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Keep the requested palette; concentrate existing hues at wet boundaries and let their lighter values
    open outward without adding a fixed blue-black grade.
  lighting_and_shadow: >-
    Preserve requested lighting. Model volume through wash density and clear reserves, not atmospheric
    glow.
  texture_and_material: >-
    Show localized pigment migration at illustrated edges, preserving the depicted material and avoiding
    a global aged-paper overlay.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Guide the bleed along existing form
    boundaries; keep focal features and any requested text sharp.
  atmosphere_and_mood: Quiet instability and organic flow; no obligatory spirit, water scene, snow or supernatural event.
  rendering_and_quality: >-
    Control wet and dry edges at a readable scale. Keep silhouettes coherent instead of dissolving the
    whole subject.
avoidRules:
  - global blur
  - aged-paper overlay
  - new supernatural elements
assets:
  defaultImage: /assets/recipes/styles/defaults/SP14-136.webp
