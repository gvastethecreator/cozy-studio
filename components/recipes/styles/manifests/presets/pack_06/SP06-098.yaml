visualDna:
  aesthetic: 'Compact 16-bit pixel art: small round-bodied sprites with thick near-black outlines on large flat pastel backgrounds.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Candy-bright saturated 9-bit colors, pink, mint, sky blue and lemon, with two-step shading only.
  lighting_and_shadow: Minimal shading; one bright highlight pixel cluster and one darker step per shape.
  texture_and_material: Thick outlines, rounded blobby forms, simple repeated background shapes such as clouds, hills and bricks.
  camera_and_composition: Keep the requested view; big-headed subjects centered on clean pastel fields with lots of air.
  atmosphere_and_mood: Cheerful and bouncy, cute even when the subject is spooky.
  rendering_and_quality: Crisp compact sprites with clean outlines; no dither noise and no muddy colors.
  key_features: round compact sprites; thick near-black outlines; candy-bright palette; two-step shading; pastel backgrounds
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Candy-Bright Compact Sprite as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
