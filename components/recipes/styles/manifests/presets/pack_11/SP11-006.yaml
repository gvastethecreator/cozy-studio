visualDna:
  aesthetic: 'Chalkboard art: colored-chalk illustration on a black slate board, like a hand-drawn tavern or café board, with bold outlines and drop shadows.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: drawn in white and colored chalk on black slate with bold outlines, side-of-chalk shading and simple drop shadows; decorative borders and flourishes frame it but carry no words."
  color_and_tone: Black-green slate with chalk white, dusty pastel red, yellow, teal and pink.
  lighting_and_shadow: Flat light; tone comes from chalk pressure and smudge.
  texture_and_material: Chalk dust, smudges, eraser ghosts of earlier drawings and slate grain.
  camera_and_composition: Board-shaped framing with the subject centered and ornamental corners.
  atmosphere_and_mood: Handmade, homely, charming and a little dusty, driven by the construction, color and rhythm.
  rendering_and_quality: Chalk illustration with confident strokes and visible erasures, with clean, deliberate marks and no accidental noise.
  key_features: colored chalk on slate; drop shadows; ornamental flourishes; eraser ghosts
  creative_brief: "Chalkboard art: colored-chalk illustration on a black slate board, like a hand-drawn tavern or café board, with bold outlines and drop shadows. Carry it through colored chalk on slate, drop shadows, ornamental flourishes, eraser ghosts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
