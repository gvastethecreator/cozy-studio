visualDna:
  aesthetic: 'German Expressionist cinema: 1920s films with painted, crooked sets, shadows drawn on the walls and performers moving like marionettes.'
  subject_treatment: Keep the prompt subject, action and setting; translate them through this genre's camera, lighting, film stock and grade, without adding genre costumes, sets or plot events the prompt did not ask for.
  color_and_tone: Stark black and white or green-tinted monochrome, painted light and shadow shapes.
  lighting_and_shadow: Painted and real shadows exaggerated and elongated, looming silhouettes thrown across slanted walls.
  texture_and_material: Canvas flats painted with jagged lines, heavy theatrical makeup, film scratches.
  camera_and_composition: Tilted, zig-zag perspectives, doorways and windows as sharp trapezoids, figures small against distorted architecture.
  atmosphere_and_mood: Nightmarish and uncanny, the world bent by a troubled mind.
  rendering_and_quality: Silent-era print with deliberate artifice; not realistic architecture.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies German Expressionist Cinema as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: painted crooked sets; elongated looming shadows; zig-zag perspective; theatrical makeup; stark monochrome
