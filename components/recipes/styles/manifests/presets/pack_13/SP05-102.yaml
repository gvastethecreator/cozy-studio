visualDna:
  aesthetic: >-
    Ground proportions and weight in fine wear, selective hatching and practical surface detail; do
    not add age, fatigue, injury or labor history.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: keep colors subdued but preserve
    the prompt's palette and the natural color of important materials.
  lighting_and_shadow: >-
    Use practical hard light and grounded cast shadows, following the requested direction and
    exposure.
  texture_and_material: >-
    Add fine scuffs and hatching only where form or source material supports them; avoid generic
    grime.
  camera_and_composition: >-
    Use unsentimental framing and stable perspective while preserving the supplied crop and focal
    point.
  atmosphere_and_mood: >-
    Realist restraint is a rendering choice, not a mandate for bleakness; keep the prompt's
    emotional register.
  rendering_and_quality: >-
    Apply physical clarity to any form without aging, distressing, masculinizing or injuring the
    subject. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Grounded proportions; selective wear; fine hatching; practical hard light; material realism;
    composed restraint.
  creative_brief: "Apply this visual treatment to the requested content: Grounded proportions; selective wear; fine hatching; practical hard light; material realism; composed restraint. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject."
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - generic grime obscuring material-specific wear
  - over-smoothed contours removing grounded structure
  - hatching merging important planes
