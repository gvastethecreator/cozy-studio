visualDna:
  aesthetic: 'Diorama box: a miniature scene built inside an open box with layered depth.'
  subject_treatment: "Rebuild the prompt's subject as a physical crafted object made this way, keeping its identity, pose and action readable: built as a miniature scene inside a shadow box with layered cut-outs and props."
  color_and_tone: Warm crafted colors, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Soft light from above, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Paper, wood and miniature props, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at card size.
  atmosphere_and_mood: Intimate, charming, crafted and deep, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: shadow box; layered miniature scene
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Diorama Box as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
