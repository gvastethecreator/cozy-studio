visualDna:
  aesthetic: >-
    A drawing technique, not a copy of any work: loose, fluctuating contour, elastic drawing
    rhythm, bent planes and brushy spatial push/pull; preserve the subject's recognizable structure.
  subject_treatment: >-
    Preserve the requested identity, count, pose, action, material and setting. Apply the drawing
    treatment to the existing forms without substituting subjects, adding accessories or changing
    their function.
  color_and_tone: >-
    Palette defaults apply only where the prompt leaves color open: use bold, simple color planes
    and flexible value shifts; retain the prompt palette.
  lighting_and_shadow: >-
    Let shadow shapes bend with the existing pose and lighting; avoid adding a sprint or kinetic
    blur by default.
  texture_and_material: >-
    Alternate clean and rough brush edges with elastic contour changes; do not morph material
    identity.
  camera_and_composition: >-
    Push and pull the existing forms within the given camera and layout; preserve count, pose intent
    and perspective.
  atmosphere_and_mood: >-
    Lively distortion belongs to the rendering, not a new action or character; follow the requested
    energy level.
  rendering_and_quality: >-
    Apply controlled drawing elasticity to any subject; add no limbs, expressions, sprint, gag or
    copied scene. Keep important silhouettes and joins legible; no watermark, unrequested text or
    interface.
  key_features: >-
    Elastic contour; bent plane rhythm; loose brush marks; graphic push/pull.
  creative_brief: 'Apply this visual treatment to the requested content: Elastic contour; bent plane rhythm; loose brush marks; graphic push/pull. Preserve its identity, action, materials, composition and requested tone; introduce no persona, scene, franchise cue or extra motif. Use it as a reusable look on any subject.'
avoidRules:
  - photoreal cosplay rendering
  - 3D render look
  - plastic airbrush gloss obscuring the style's defining marks
  - undifferentiated anime filter erasing the preset's signature mechanics
  - unrequested default-image characters, costume details, props or setting
  - unrequested default-image framing
  - garbled pseudo-text
  - unrequested interface overlay
  - watermark
  - unrequested logo or signature artifact
  - elastic distortion changing identity or construction
  - bent planes breaking requested perspective
  - brush noise obscuring silhouette
  - existing franchise characters
  - series logo or title lettering
  - 'signature costumes, emblems or props from the referenced work'
  - recreated scenes from the referenced work
