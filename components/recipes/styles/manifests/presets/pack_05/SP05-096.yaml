visualDna:
  aesthetic: >-
    High-saturation cel illustration built from candy-bright color planes, angular rhythms, and
    deliberately unstable perspective.
  subject_treatment: >-
    Keep subjects recognizable; sharpen their edges into clear geometric masses without adding game
    pieces or symbols.
  color_and_tone: >-
    Use confident magenta, cyan, and yellow against dark violet values, while preserving any
    explicit palette request.
  lighting_and_shadow: >-
    Hard, clean highlights separate the color planes; emissive edges stay graphic and controlled.
  texture_and_material: >-
    Flat opaque color, polished accents, and crisp boundaries make the visual logic feel designed
    rather than textured.
  camera_and_composition: >-
    Retain the requested framing while introducing selective perspective tension and angular
    overlaps within the existing scene.
  atmosphere_and_mood: >-
    Bold, cerebral, and kinetic; let the requested subject determine the mood.
  rendering_and_quality: >-
    Maintain sharp silhouettes, clean color separation, and perspective that remains readable
    despite distortion.
  key_features: >-
    Impossible angles, candy-neon contrast, and floating color relationships create a precise,
    high-energy graphic finish.
  creative_brief: >-
    Apply the angular color logic and vivid cel finish to the requested content; do not turn it into
    an arena, contest, or interface.
