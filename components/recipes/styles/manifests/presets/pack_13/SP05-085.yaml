visualDna:
  aesthetic: 'Stable anime contours are interrupted by small broken segments and offset color edges; graphic disregistration sits on the surface rather than replacing the form.'
  subject_treatment: 'Preserve identity, anatomy, expression, and count; confine offsets to the same silhouette so they never read as another pose or duplicate subject.'
  color_and_tone: 'Pair quiet base values with abrupt saturated patches attached to existing shapes; keep the requested palette and contrast.'
  lighting_and_shadow: 'Use clean flat shadows and hard-edged color blocks; follow the given light without adding a burst.'
  texture_and_material: 'Add sparse pixel-like breaks and misregistered pigment edges over smooth fills; preserve the surface material beneath them.'
  camera_and_composition: 'Keep the supplied crop, viewpoint, scale, layout, and count; vary edge density locally without creating panels, insets, or objects.'
  atmosphere_and_mood: 'Retain the requested emotional state; graphic interruptions are a drawing treatment, not an instruction to prescribe a new emotion.'
  rendering_and_quality: 'Keep the base drawing clean and readable beneath controlled edge breaks; avoid marks resembling text, interface elements, or watermarks.'
  key_features: 'Broken contour segments; slight color registration offsets; sparse pixel-like marks; saturated patches against stable base values.'
  creative_brief: 'Layer controlled misregistration over a legible drawing, keeping each offset attached to an existing form. Preserve subject, action, count, camera, and mood; add no text or props. Use it as a reusable look on any subject.'
