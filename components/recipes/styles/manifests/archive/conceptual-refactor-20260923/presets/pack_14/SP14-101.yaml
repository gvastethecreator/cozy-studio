visualDna:
  aesthetic: >-
    Blackwater Totem Memory acts as a transferable mythic-noir router: blackwater translated into
    dark symbolic behavior, totem translated into dark symbolic behavior plus memory translated into
    dark symbolic behavior fused with symbolist myth-noir iconography with emblem logic, relic
    pressure, occult negative space, and adult editorial restraint; it carries symbol, omen, ritual
    authority, and mature editorial restraint without locking prompt content to its sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    totemic vertical mass and memory-bearing silhouette, blackwater shaping silhouette rhythm,
    contour pressure, and symbolic edge control plus memory shaping silhouette rhythm, contour
    pressure, and symbolic edge control; forms should inherit silhouette pressure, emblem logic,
    ritual posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through blackwater blue, oil-dark green, and silver reflection breaks, totem-weighted
    accent roles over disciplined dark values plus memory-weighted accent roles over disciplined
    dark values together with blackened neutrals, relic gold, ash white, bruised crimson, oxidized
    green, and one disciplined omen accent; values stay separated, accents feel intentional, and the
    dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use glossy dark reflections and hidden underlight, totem-weighted rim behavior, occult glow, and
    charged shadow plus memory-weighted rim behavior, occult glow, and charged shadow with
    eclipse-like falloff, thin halo edges, candle-density glow, and shadow that behaves like
    symbolic weight; shadows must carry omen weight, rims should clarify form, and glow should
    behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render wet mineral film and slow ripple distortion plus dark carved wood, river stain, and
    hand-rubbed texture alongside obsidian polish, ash residue, salt-bone grain, tarnished metal,
    wax, velvet, paper, and carved-stone tactility; surface scale, patina, residue, gloss, grain,
    and carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with mnemonic rings, echo repeats, and archived spacing, blackwater converted into
    repeatable spatial rhythm and symbolic hierarchy plus totem converted into repeatable spatial
    rhythm and symbolic hierarchy plus icon axes, seal geometry, threshold spacing, processional
    rhythm, and diagram-like symbolic hierarchy; the style should support portraits, objects,
    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through remembered obligation and preserved witness, blackwater pressure,
    consequence, and symbolic tension plus totem pressure, consequence, and symbolic tension and
    hushed authority, occult elegance, grief, accusation, secrecy, and a sense of ancient systems
    still operating; the image can become severe, sensual, sacred, violent, quiet, or strange when
    prompt X asks for it, while the preset supplies mythic consequence.
  rendering_and_quality: >-
    Finish with blackwater recognition with denoised dark editorial polish and controlled material
    truth plus totem recognition with denoised dark editorial polish and controlled material truth
    and denoised illustrated finish with crisp symbol reads, controlled blacks, no muddy texture
    paste, and no fake lettering; prioritize clean denoise, readable dark values, strong silhouette
    hierarchy, tactile material truth, and no watermark, fake text, logos, accidental UI, or muddy
    black crush.
  key_features: >-
    blackwater translated into dark symbolic behavior, totem translated into dark symbolic behavior
    plus memory translated into dark symbolic behavior; totemic vertical mass and memory-bearing
    silhouette, blackwater shaping silhouette rhythm, contour pressure, and symbolic edge control
    plus memory shaping silhouette rhythm, contour pressure, and symbolic edge control; wet mineral
    film and slow ripple distortion plus dark carved wood, river stain, and hand-rubbed texture;
    glossy dark reflections and hidden underlight, totem-weighted rim behavior, occult glow, and
    charged shadow plus memory-weighted rim behavior, occult glow, and charged shadow; mnemonic
    rings, echo repeats, and archived spacing, blackwater converted into repeatable spatial rhythm
    and symbolic hierarchy plus totem converted into repeatable spatial rhythm and symbolic
    hierarchy
  creative_brief: >-
    Apply Blackwater Totem Memory after prompt X as a transferable mythic-noir layer: prompt X
    supplies subject, action, setting, and intensity, while this preset supplies blackwater
    translated into dark symbolic behavior, totem translated into dark symbolic behavior plus memory
    translated into dark symbolic behavior, totemic vertical mass and memory-bearing silhouette,
    blackwater shaping silhouette rhythm, contour pressure, and symbolic edge control plus memory
    shaping silhouette rhythm, contour pressure, and symbolic edge control, blackwater blue,
    oil-dark green, and silver reflection breaks, totem-weighted accent roles over disciplined dark
    values plus memory-weighted accent roles over disciplined dark values, glossy dark reflections
    and hidden underlight, totem-weighted rim behavior, occult glow, and charged shadow plus
    memory-weighted rim behavior, occult glow, and charged shadow, wet mineral film and slow ripple
    distortion plus dark carved wood, river stain, and hand-rubbed texture plus mnemonic rings, echo
    repeats, and archived spacing, blackwater converted into repeatable spatial rhythm and symbolic
    hierarchy plus totem converted into repeatable spatial rhythm and symbolic hierarchy, finish
    discipline, and negative controls without requiring a fixed deity, ritual, prop bundle,
    location, or sample composition.
