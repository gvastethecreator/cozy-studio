visualDna:
  aesthetic: 'Use this drawing language: Uncanny icon-cartoon treatment with polished vector shapes, over-regular symmetry, frozen cheer, disproportionate feature scale, and sterile glossy fill. Apply it as a rendering treatment to user-provided content; let the user control subject and context.'
  subject_treatment: Apply smooth vector contours, near-symmetry, polished simple shapes, and tiny controlled alignment errors to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use primary blue, bright red, yellow, sterile white, warm peach, and glossy green as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use even product-like fill with restrained specular accents as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render smooth vector-like fill, restrained sheen, clean highlights, and sterile surface finish as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Balance the requested subject with icon-like spacing and type-free surfaces; preserve its identity and requested function.
  atmosphere_and_mood: Sterile, cheerful, and faintly wrong; maintain that contrast through form and surface.
  rendering_and_quality: Finish with smooth vector fill, sterile gloss, precise symmetry, and one controlled sign of awkwardness.
  key_features: polished vector shapes; over-regular symmetry; frozen cheer; uneven feature scale; sterile gloss
  creative_brief: Render the supplied content with smooth vector contours, near-symmetry, polished simple shapes, and tiny controlled alignment errors. Use primary blue, bright red, yellow, sterile white, warm peach, and glossy green as style colors while honoring any explicit color instructions. Apply smooth vector-like fill, restrained sheen, clean highlights, and sterile surface finish as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
