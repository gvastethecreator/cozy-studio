visualDna:
  aesthetic: 'Creature iteration page: six to nine quick graphite and grey-marker variants of one creature concept, each testing a different adaptation.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a page of six to nine variants of the subject as a creature, one circled as the pick, and that layout replaces the requested framing.
  color_and_tone: Graphite grey and cool grey markers on off-white bond paper, one flat color wash only on the selected variant.
  lighting_and_shadow: Simple top-light shading on each variant, with shadows laid as single marker tones.
  texture_and_material: Loose searching graphite lines, marker bleed, eraser corrections and overlapping construction.
  camera_and_composition: Variants in a loose grid at matching scale and the same three-quarter angle, the favorite ringed with a pen circle.
  atmosphere_and_mood: Curious and generative, a creature evolving on the page.
  rendering_and_quality: Rough exploratory drawings, none finished, the chosen one slightly more developed than the rest.
  key_features: six to nine creature variants; graphite and grey marker; one color-washed pick; pen circle; matching angle and scale
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Creature Design Iteration as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
