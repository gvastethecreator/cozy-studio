visualDna:
  aesthetic: 'Water damage: tide lines, swelling, staining and bloom where water soaked the target.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: tide-line stains, swelling, warping and mineral bloom where water soaked the surfaces. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Brown tide lines, grey bloom and darkened wet zones.
  lighting_and_shadow: Soft window light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Warped swollen surfaces, tide lines and bloom, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Melancholic, neglected, damp and quiet, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: tide-line stains; swelling; mineral bloom; surface-level damage; structure intact
  creative_brief: "Water damage: tide lines, swelling, staining and bloom where water soaked the target. Carry it through tide-line stains, swelling, mineral bloom, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
