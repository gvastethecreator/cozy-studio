visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around long dry directional
    strokes that skim existing silhouettes and taper into sparse mineral abrasion. For color and surface, maintain prompt hues in muted earth, faded blue-gray,
    and chalk highlights without requiring a landscape palette. Redemption is a possible
    emotional reading, not a mandatory journey or heroic turn
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through long dry directional strokes that
    skim existing silhouettes and taper into sparse mineral abrasion; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; maintain prompt hues in muted
    earth, faded blue-gray, and chalk highlights without requiring a landscape palette.
    Keep values legible across the prompted light and dark range; do not crush midtones
    or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; keep the specified light
    source while using broad open midtones and a few thin edge highlights. Keep shadow
    detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; use dry brush drag and soft pigment loss,
    preserving smooth, reflective, or delicate materials where they appear. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; retain
    the supplied pose and camera; align stroke direction with forms already present
    rather than adding wind or travel cues. Use the mark rhythm inside the supplied
    composition rather than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Redemption is a possible emotional
    reading, not a mandatory journey or heroic turn. Darkness and tension are optional
    tonal pressure, never a requirement to add danger or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and long dry directional strokes that skim
    existing silhouettes and taper into sparse mineral abrasion; keep focal edges crisp,
    texture controlled, and dark values legible. Avoid photoreal or 3D-render drift,
    watermark, logo, and fake readable text.
  key_features: >-
    long dry directional strokes that skim existing silhouettes and taper into sparse
    mineral abrasion; maintain prompt hues in muted earth, faded blue-gray, and chalk
    highlights without requiring a landscape palette; keep the specified light source
    while using broad open midtones and a few thin edge highlights; use dry brush drag
    and soft pigment loss, preserving smooth, reflective, or delicate materials where
    they appear; and retain the supplied pose and camera; align stroke direction with
    forms already present rather than adding wind or travel cues. The five cues should
    read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use long dry directional strokes that skim
    existing silhouettes and taper into sparse mineral abrasion, maintain prompt hues in
    muted earth, faded blue-gray, and chalk highlights without requiring a landscape
    palette, keep the specified light source while using broad open midtones and a few
    thin edge highlights, and use dry brush drag and soft pigment loss, preserving
    smooth, reflective, or delicate materials where they appear; the prompt supplies all
    scene content. Do not add unrequested characters, objects, source-specific lore,
    readable symbols, or a default action.
