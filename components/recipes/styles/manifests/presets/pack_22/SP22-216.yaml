visualDna:
  aesthetic: >-
    Build readable three-dimensional forms from consistent discrete volume blocks, with stepped contours
    and restrained bevels that follow the structure.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Arrange blocks to
    describe existing parts rather than adding loose cubes or changing the subject.
  color_and_tone: >-
    Preserve the requested palette and separate planes with block-level values; do not impose a fixed
    game palette or arbitrary color variation.
  lighting_and_shadow: >-
    Respect the requested light direction and use coherent block-face values to express it without
    adding a new source or unsupported glow.
  texture_and_material: >-
    Keep block size consistent at the chosen scale and the surface compact. Distinguish the volume-based
    construction from flat pixel clusters and avoid unrelated material changes.
  camera_and_composition: >-
    Preserve the requested viewpoint, projection, crop, framing and placement. Do not force an isometric
    view or a game scene.
  atmosphere_and_mood: >-
    Retain the requested setting and tone; volumetric blocks are a construction method, not a required
    digital world.
  rendering_and_quality: >-
    Resolve the overall silhouette and major volumes before block details. Use bevels only when they
    clarify an edge, and keep essential structure recognizable.
avoidRules:
  - detached decorative cubes
  - block detail that obscures the subject's structure
  - details that alter identity or function
