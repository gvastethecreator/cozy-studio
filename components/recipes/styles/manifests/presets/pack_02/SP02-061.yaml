visualDna:
  aesthetic: 'Magic-hour backlight cinematography: the low sun placed directly behind the subject, with a bounce board filling faces and a warm film grade.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Amber-gold highlights, honey skin from warm bounce, lifted cool shadows, gentle halation.
  lighting_and_shadow: Sun as a hard backlight and rim, large bounce fill from the front at a 3:1 ratio, dust and hair glowing.
  texture_and_material: Flare veils, backlit dust, glowing hair and fabric edges.
  camera_and_composition: Keep the requested framing; lens facing into the sun so flare and rim read.
  atmosphere_and_mood: Romantic and fleeting, the last few minutes of good light on set.
  rendering_and_quality: Filmic highlight rolloff and flare veiling; the still-photo golden hour lives in pack_01.
  key_features: sun directly behind subject; bounce-filled faces; rim and flare; warm film grade; 3:1 ratio
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Magic Hour Backlight as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
