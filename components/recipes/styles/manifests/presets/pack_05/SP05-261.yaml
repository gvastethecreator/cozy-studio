visualDna:
  aesthetic: 'Brush-ink anime illustration of wide crescent value sweeps: each form sits half-swallowed in a curved black mass, and a thin scar of bare midtone runs along its lit edge.'
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Ink-black masses, bone-gray planes and one muted violet accent; the prompt colors appear mainly inside the narrow scar of exposed midtone.
  lighting_and_shadow: A narrow crescent rim light against broad soft occlusion at roughly 1:8, always from the prompt's own light direction.
  texture_and_material: Smooth pooled ink washes with dry-brush breaks where a crescent sweep turns, and paper grain showing through the midtone scar.
  camera_and_composition: Keep the requested framing; curved value arcs steer the eye around the subject like a partial eclipse, without adding a moon or sun.
  atmosphere_and_mood: Heavy, patient and withheld; the weight comes from how much of each form stays hidden.
  rendering_and_quality: Large confident brush sweeps, one crisp scar line per form, and deep values kept legible as violet-black rather than dead flat black.
  key_features: crescent black value sweeps; thin midtone scar on lit edges; bone gray with muted violet; 1:8 rim-to-occlusion; dry-brush breaks
  creative_brief: "Brush-ink anime illustration of wide crescent value sweeps: each form sits half-swallowed in a curved black mass, and a thin scar of bare midtone runs along its lit edge. Carry it through crescent black value sweeps, thin midtone scar on lit edges, bone gray with muted violet, 1:8 rim-to-occlusion, dry-brush breaks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
