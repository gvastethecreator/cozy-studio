visualDna:
  aesthetic: 'Satoru Utsunomiya realist sakuga: naturalistic observed motion, round soft forms, accurate weight shifts and the beauty of ordinary movement broken into clear beats.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with naturalistic rounded forms and accurate weight shifts through each beat of the action. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Soft countryside greens, stone greys and warm sky light.
  lighting_and_shadow: Soft natural daylight consistent across all three panels.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Three side-by-side panels showing the start, peak and landing of one motion.
  atmosphere_and_mood: Keep the requested mood with observed natural grace.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Satoru Utsunomiya realist sakuga: naturalistic observed motion, round soft forms, accurate weight shifts and the beauty of ordinary movement broken into clear beats. Carry it through Satoru Utsunomiya realism, triptych beats, natural weight, soft forms. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: Satoru Utsunomiya realism; triptych beats; natural weight; soft forms
