visualDna:
  aesthetic: 'Chibi platformer sprite: a two-to-three-heads-tall pixel character drawn with squash and stretch, shown as a small sprite sheet of key poses.'
  subject_treatment: Keep the prompt subject and its design; present it as a standalone game asset on a plain field, and build a gameplay scene or interface only when the prompt asks for one.
  color_and_tone: Bright saturated palette with three-step ramps and a darker hue-shifted outline color per material.
  lighting_and_shadow: Simple top-left light, one highlight cluster per form and a small oval shadow under each pose.
  texture_and_material: Clean 32 to 48 pixel sprites, selective outlines, squash on landing and stretch on jumps.
  camera_and_composition: Orthographic side view, poses in a tidy row on a plain white or pale field, consistent scale and pivot.
  atmosphere_and_mood: Bouncy and cheerful, instantly lovable at small size.
  rendering_and_quality: Pixel-perfect clusters with consistent proportions across poses; no background scene.
  key_features: chibi proportions; squash and stretch; sprite-sheet row; hue-shifted outlines; plain field
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Chibi Platformer Sprite Bounce as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
