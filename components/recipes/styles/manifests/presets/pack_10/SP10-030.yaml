visualDna:
  aesthetic: '1-bit dithering: pure black and white pixels arranged in ordered or error-diffusion dither patterns.'
  subject_treatment: "Re-render the prompt's image entirely in this representation unit so the subject reads from the pattern of units: the image is reduced to 1-bit black and white pixels with dither patterns for grey values."
  color_and_tone: Pure black and white, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Ordered or diffusion dither pattern, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Retro, crisp, lo-fi and graphic, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: 1-bit pixels; dither patterns
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dithering (1-bit) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
