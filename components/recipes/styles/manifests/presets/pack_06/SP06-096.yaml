visualDna:
  aesthetic: 'Late arcade pixel art: very large hand-pixeled sprites with dense painterly clusters, dozens of palettes and exhaustive mechanical detail.'
  subject_treatment: Keep the prompt subject, action and camera view; redraw it inside this display system's resolution, palette and pixel-cluster limits without adding any game interface.
  color_and_tone: Rich but controlled palettes of about sixteen colors per sprite, warm metal browns against cool greys, bright flashes for sparks.
  lighting_and_shadow: Consistent top-left light with hand-placed highlights, selective dark outlines and pixel-drawn smoke and debris.
  texture_and_material: Rivets, dents, rust streaks, cloth folds and debris all resolved in pixel clusters; puffs of pixel smoke and flying shards.
  camera_and_composition: Keep the requested view; the main sprite fills much of the frame, surrounded by small secondary detail.
  atmosphere_and_mood: Loud and generous, every inch of the sprite showing off craft.
  rendering_and_quality: Hand-placed clusters with no stray pixels; enormous detail kept readable.
  key_features: huge hand-pixeled sprites; dense clusters; rivets and debris; pixel smoke; selective outlines
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Dense Arcade Mega-Sprite as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
