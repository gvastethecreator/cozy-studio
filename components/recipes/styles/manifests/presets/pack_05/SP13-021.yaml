visualDna:
  aesthetic: 'Yutaka Nakamura sakuga as in his BONES action scenes: bodies launched forward with extreme perspective, square chunky debris flying in blocky shapes, dust clouds and sharp shadow flashes.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures with compact muscular action poses, clothes snapping with speed and limbs thrust toward the viewer in extreme perspective. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Neutral street palette with sharp white impact flashes and warm dust tones across the whole frame.
  lighting_and_shadow: Flat daylight broken by sudden hard shadow flashes that snap across figures at the moment of impact.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Forward rush straight at the lens, with blocky debris and dust bursting outward around the figure.
  atmosphere_and_mood: Keep the requested mood with explosive forward momentum.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  key_features: Yutaka Nakamura blocky debris; extreme perspective rush; shadow flashes; dust bursts
  creative_brief: "Yutaka Nakamura sakuga as in his BONES action scenes: bodies launched forward with extreme perspective, square chunky debris flying in blocky shapes, dust clouds and sharp shadow flashes. Carry it through Yutaka Nakamura blocky debris, extreme perspective rush, shadow flashes, dust bursts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
