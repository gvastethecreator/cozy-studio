visualDna:
  aesthetic: 'Deep-sea deco architecture: stepped Art Deco setbacks built for crushing depth, domed pressure-glass windows in riveted brass frames, coral and barnacles colonizing every ledge.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Blue-green murk, verdigris copper, wet brass glints and warm amber from lit windows; black beyond ten metres.
  lighting_and_shadow: Warm light glowing out of the windows, cold blue shafts from the surface far above, rapid falloff into darkness.
  texture_and_material: Riveted brass, verdigris patina, barnacle crust, coral fans and condensation beads on thick convex glass.
  camera_and_composition: Keep the requested view; suspended particles and blue haze swallow distant forms, silhouettes read through murk.
  atmosphere_and_mood: Pressurized, silent and opulent, luxury holding its breath against the ocean.
  rendering_and_quality: Underwater volumetric rendering with drifting particulate and softened distance; brass highlights stay crisp up close.
  key_features: stepped deco setbacks; domed pressure-glass portholes; riveted brass and verdigris; coral and barnacle crust; blue murk falloff
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Abyssal Deco Pressure as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
