visualDna:
  aesthetic: 'Ilford HP5 Plus at box speed 400: classic black-and-white documentary negative with a long, even grey scale and honest, moderate grain.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Pure monochrome; full range from paper-white to deep black with generous midtone greys; neutral, untoned.
  lighting_and_shadow: Medium contrast with open shadows; available light rendered as it falls, skies slightly light without a filter.
  texture_and_material: Visible, soft-edged grain even in midtones; skin, wool, stone and wood keep real texture.
  camera_and_composition: Keep the requested framing; 35 mm documentary rendering with natural lens falloff.
  atmosphere_and_mood: Observant and sober, an even grey calm that lets the moment speak.
  rendering_and_quality: Darkroom-print look on neutral fiber paper; no crushed shadows, no push-processing grit, no digital clarity.
  key_features: box-speed black-and-white; long neutral grey scale; moderate soft grain; open shadows; documentary honesty
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ilford HP5 Plus as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
