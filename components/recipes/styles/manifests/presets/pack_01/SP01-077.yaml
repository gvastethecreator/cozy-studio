visualDna:
  aesthetic: 'Clinical medical photography: standardized documentation under bright even light against a sterile blue or neutral background.'
  subject_treatment: Keep the prompt subject and action; this preset owns the standardized clinical documentation framing, and the setting stays the prompt's.
  color_and_tone: Accurate neutral color, sterile blue drapes, clean whites, no mood grading.
  lighting_and_shadow: Bright twin flashes or surgical light, shadowless and even.
  texture_and_material: Stainless steel, gauze, skin and plaster recorded accurately without beautification.
  camera_and_composition: Straight-on standardized view, subject centered on a plain drape, optional plain scale ruler without numbers.
  atmosphere_and_mood: Sterile and factual, careful attention without any emotion.
  rendering_and_quality: Clinical accuracy; no gore, no moody shadows, no readable labels.
  key_features: sterile blue drape; shadowless twin flash; standardized straight-on view; accurate color; plain scale
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Medical Photography as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
