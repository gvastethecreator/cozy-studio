visualDna:
  aesthetic: >-
    Signalpunk turns transmission into visible geometry: spaced pulse bands, nested arcs and clean
    interruptions at insulated gaps organize the existing form.
  subject_treatment: >-
    Preserve the requested subject, proportions, action and part connections. Map signal arcs or pulse
    intervals onto compatible contours; do not require a coil device, token or ritual object.
  color_and_tone: >-
    Keep the user's palette in control, with copper or warm metal contrasted against ceramic-like light
    planes and a limited electric-blue accent where suitable. Keep pulse marks distinct from shadow
    values.
  lighting_and_shadow: >-
    Follow the stated lighting. Add controlled luminous-looking edges only to the signal shapes already
    requested; do not invent a corona source or time of day.
  texture_and_material: >-
    Preserve material identity. Where present, contrast smooth ceramic insulation with clean copper
    conductor marks; keep surfaces mostly quiet so the pulse geometry remains clear.
  camera_and_composition: >-
    Preserve camera and placement. Use nested or offset arcs and measured gaps only where they fit the
    composition; do not force a central radial arrangement.
  atmosphere_and_mood: >-
    Create a charged, anticipatory rhythm through pulse spacing and contrast while retaining the
    requested mood; do not turn signal geometry into ceremony or lore.
  rendering_and_quality: >-
    Use precise line bands, crisp breaks and restrained edge bloom over broad quiet shapes. Avoid blurred
    coronas, dense wiring and decorative text.
avoidRules:
  - Do not add a ritual, signal token or literal coil apparatus unless requested.
  - Avoid all-over electric corona, blurred glow and dense wire bundles.
  - Do not add readable glyphs or interface text when the prompt does not request them.
