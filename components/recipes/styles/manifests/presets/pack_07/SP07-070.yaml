visualDna:
  aesthetic: 'Tabletop gingerbread construction: baked cookie panels cut to shape and glued with piped royal icing, candy inlays and sugar-glass windows at model scale.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Toasted ginger brown, bright white icing, peppermint red and gumdrop colors, amber sugar glass; warm and festive.
  lighting_and_shadow: Warm tabletop lamp glow, candle light passing through sugar-glass panes, soft shadows on a floured board.
  texture_and_material: Cookie crumb and baked blistering, piped icing beads and drips, crushed-candy panes, sugar sparkle.
  camera_and_composition: Keep the requested view as a tabletop macro so the baked seams and icing joints stay in focus.
  atmosphere_and_mood: Warm, handmade and a little mischievous, baking as construction.
  rendering_and_quality: Food macro of a real baked build; the model scale is obvious, unlike full-size candy architecture.
  key_features: baked cookie panels; piped royal icing seams; candy inlays; sugar-glass panes; tabletop macro scale
  creative_brief: "Tabletop gingerbread construction: baked cookie panels cut to shape and glued with piped royal icing, candy inlays and sugar-glass windows at model scale. Carry it through baked cookie panels, piped royal icing seams, candy inlays, sugar-glass panes, tabletop macro scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
