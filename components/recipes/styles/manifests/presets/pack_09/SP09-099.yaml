  color_and_tone: Black, cognac, oxblood or navy leather, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft side light showing pebble grain, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Raised pebble grain with soft sheen, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Luxurious, durable, tactile and classic, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Pebbled leather: full-grain leather with raised pebble texture and soft sheen. Carry it through pebble-grain leather, stitched seams, soft sheen. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
