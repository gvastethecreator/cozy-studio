visualDna:
  aesthetic: >-
    Institutional Liminal Dread Style acts as a transferable anime-prestige router: institutional
    dread and rule-bound visual order, alongside threshold unease and suspended transition; fuse it
    with prestige anime horror with negative space, body unease, ritual geometry, liminal dread, and
    controlled visual silence; it routes era, genre, line economy, cel or digital finish, and
    performance tone without locking prompt content to the source title or sample image.
  subject_treatment: >-
    Preserve the prompt subject, action, and context while restyling forms through contours paced by
    institutional tension, readable pose energy, and silhouette discipline, alongside contours paced
    by liminal tension, readable pose energy, and silhouette discipline; identity should remain
    readable through anime contour, expression economy, pose energy, shape simplification, and
    effect hierarchy instead of a required canon character or title scene.
  color_and_tone: >-
    Map color through a institutional accent system held inside disciplined cel values, alongside a
    liminal accent system held inside disciplined cel values; anchor it in peat black, cold indigo,
    mineral gray, crimson omen accents, sickly cyan reflections, and desaturated skin tones; keep
    value separation clean, cel flats intentional, accents purposeful, and palette behavior attached
    to the requested content.
  lighting_and_shadow: >-
    Use a institutional light logic using cel rim, glow behavior, and blocked shadow, alongside a
    liminal light logic using cel rim, glow behavior, and blocked shadow; combine it with weak
    nocturnal top-light, spotlight isolation, occult rim, red omen glow, and deep occlusion around
    visual absences; shadows should read as anime light design, rims should clarify form, and glow
    or effects should support the prompt rather than replacing it.
  texture_and_material: >-
    Render cel paint and ink grain tuned to institutional material contrast, alongside cel paint and
    ink grain tuned to liminal material contrast; anchor surfaces in water-dark stone, frayed fiber,
    damp paper, mask lacquer, dust, mist, and minimal noise-controlled texture; cel edges, painted
    surfaces, grain, cloth, metal, water, sweat, smoke, or atmosphere must stay coherent across
    people, objects, environments, action, and abstractions.
  camera_and_composition: >-
    Frame around corridor-like repetition converted into abstract spacing, alongside in-between
    spacing, empty pauses, and transition lines, then extend it with void-first framing,
    institutional emptiness, spotlight traps, ritual geometry, and suppressed horizon cues; the
    style should support portraits, props, machines, performances, landscapes, symbols, and full
    scenes through reusable anime staging grammar instead of one fixed card layout.
  atmosphere_and_mood: >-
    Carry mood through authority, emptiness, and liminal anxiety, alongside not-yet-arrived tension
    and quiet dread; braid it with listening-state tension, dread, shame, taboo ceremony, unseen
    presence, and quiet psychological collapse; the preset can become funny, sensual, violent,
    quiet, tragic, romantic, or strange when prompt X asks for it while preserving the chosen anime
    lineage.
  rendering_and_quality: >-
    Finish with clean anime finishing that keeps institutional identity readable without noisy
    denoise, alongside clean anime finishing that keeps liminal identity readable without noisy
    denoise; enforce minimal high-control horror anime finish with shape economy, denoised darks,
    and no gore-as-shortcut dependency; prioritize clean denoise, stable anatomy or object
    structure, readable effects, controlled grain, no watermark, no fake text, no signature, and no
    photoreal or 3D-render drift.
  key_features: >-
    institutional dread and rule-bound visual order, alongside threshold unease and suspended
    transition; contours paced by institutional tension, readable pose energy, and silhouette
    discipline, alongside contours paced by liminal tension, readable pose energy, and silhouette
    discipline; cel paint and ink grain tuned to institutional material contrast, alongside cel
    paint and ink grain tuned to liminal material contrast; a institutional light logic using cel
    rim, glow behavior, and blocked shadow, alongside a liminal light logic using cel rim, glow
    behavior, and blocked shadow; corridor-like repetition converted into abstract spacing,
    alongside in-between spacing, empty pauses, and transition lines
  creative_brief: >-
    Apply Institutional Liminal Dread Style after prompt X as a transferable anime-prestige layer:
    prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies
    institutional dread and rule-bound visual order, alongside threshold unease and suspended
    transition, alongside contours paced by institutional tension, readable pose energy, and
    silhouette discipline, alongside contours paced by liminal tension, readable pose energy, and
    silhouette discipline; a institutional accent system held inside disciplined cel values,
    alongside a liminal accent system held inside disciplined cel values; a institutional light
    logic using cel rim, glow behavior, and blocked shadow, alongside a liminal light logic using
    cel rim, glow behavior, and blocked shadow; cel paint and ink grain tuned to institutional
    material contrast, alongside cel paint and ink grain tuned to liminal material contrast and
    corridor-like repetition converted into abstract spacing, alongside in-between spacing, empty
    pauses, and transition lines, finish discipline, and negative controls without requiring a fixed
    canon cast, title scene, prop bundle, location, sport, instrument, weapon, or card composition.
