visualDna:
  aesthetic: >-
    Digital painting uses deliberate lost and found edges, allowing selected contours to merge with
    neighboring values while keeping the overall form readable.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Soften or merge only selected
    secondary contours; retain the edges that define important parts and recognition.
  color_and_tone: >-
    Work with related values and reserve stronger contrast for a few clear accents. Keep the requested
    palette and enough separation to distinguish adjacent forms.
  lighting_and_shadow: >-
    Follow the requested light direction and shadow pattern. Gradual transitions may merge edges where
    values meet, but do not introduce mist or obscure a form to simulate softness.
  texture_and_material: >-
    Use fine, economical brushwork and contained transitions. Preserve material cues where they carry
    identity instead of dissolving every surface into atmosphere.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Edge softness does not call
    for tighter framing or changes to the subject layout.
  atmosphere_and_mood: >-
    Keep the requested mood. The style does not require sadness, fog, dusk or an empty setting.
  rendering_and_quality: >-
    Place the clearest edges at identity-defining details and vary softness elsewhere. Keep all important
    parts legible; avoid global haze or loss of structure.
avoidRules:
  - automatic fog or haze
  - obscured subject-defining details
