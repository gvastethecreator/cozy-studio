visualDna:
  aesthetic: >-
    Fine, controlled engraved lines follow the turning forms; coherent cross-hatching builds tone
    through line direction and spacing, with clean areas reserved for light.
  subject_treatment: >-
    Trace the requested forms and their volume with modulated line density. Preserve identity,
    proportions, pose, action and the distinctions between adjacent forms.
  color_and_tone: >-
    Preserve the requested palette. Use its existing darker tones for engraved marks and leave
    already-light regions open rather than converting the image to monochrome.
  lighting_and_shadow: >-
    Describe the existing light and shadow pattern through line direction and density. Keep the
    requested light source and do not add a new one.
  texture_and_material: >-
    Keep strokes fine and deliberate, with cross-hatching that follows each surface. Do not replace
    the depicted material with metal or add photographic grain.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. Linework supports existing depth
    without turning the image into a map, plate or diagram.
  atmosphere_and_mood: >-
    Let controlled line rhythm carry the engraving character while preserving the requested mood
    and setting.
  rendering_and_quality: >-
    Keep hatch direction coherent within each form, vary density to separate volumes and retain
    crisp open highlights. Do not let lines merge into a dark uniform patch.
avoidRules:
  - random scratch marks or photographic grain
  - unrequested plate, border, diagram or legend
