  lighting_and_shadow: Rich painted window light, candle glow and sparkling dust in sunbeams.
  texture_and_material: Immaculate detailed cel with painterly backgrounds and glittering light particles.
  camera_and_composition: Composed cinematic shots, hands on letters, gloves, wide painted European vistas.
  atmosphere_and_mood: Keep the requested mood with tender postwar grief.
  rendering_and_quality: Luxurious Kyoto Animation frame with extraordinary detail in eyes and light.
  key_features: Violet Evergarden eyes; postwar Europe; letters; painted light
  creative_brief: "Kyoto Animation Violet Evergarden look (2018): extraordinarily detailed eyes with jewel-like irises, postwar European towns, letters and typewriters, lush painted light and grief after war. Carry it through Violet Evergarden eyes, postwar Europe, letters, painted light. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
