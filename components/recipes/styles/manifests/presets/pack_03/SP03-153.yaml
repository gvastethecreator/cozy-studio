visualDna:
  aesthetic: 'Unlit albedo pass: the scene shown only in its surface base colors and painted textures, with every trace of light, shadow and reflection removed.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Flat true material colors at even brightness; dark objects stay dark by pigment, never by shadow.
  lighting_and_shadow: 'None: no key, no ambient occlusion, no speculars; form reads only from color and texture changes.'
  texture_and_material: Printed patterns, painted markings and wood grain fully visible, glossy surfaces as matte as paper.
  camera_and_composition: Keep the requested camera; overlapping forms of similar color merge into flat shapes.
  atmosphere_and_mood: Flat, bright and uncanny, a world without light.
  rendering_and_quality: Clean diffuse-color buffer with crisp texture detail and no shading of any kind.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Unlit Albedo Pass as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: base color only; no shadows or highlights; flat merged shapes; full texture detail; matte gloss
