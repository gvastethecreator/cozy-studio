visualDna:
  aesthetic: "Exploded Assembly Board: a design board that lays the product's real parts apart along assembly axes, beside a small assembled view for control."
  subject_treatment: Lay the prompt's product parts apart along assembly axes on a clean board, keeping shape, orientation and correspondence, with a small assembled view.
  color_and_tone: Colors per part or source material, with discreet thin axis lines.
  lighting_and_shadow: One soft common light for every part, grounded on the board.
  texture_and_material: Original materials and thickness kept, with only the supplied parts shown.
  camera_and_composition: Compact ordered layout with readable axes and an assembled control view.
  atmosphere_and_mood: Constructive understanding and sequence, calm like a designer's pin-up board.
  rendering_and_quality: Part count and joining points match between assembled and exploded views.
  creative_brief: "Exploded Assembly Board: a design board that lays the product's real parts apart along assembly axes, beside a small assembled view for control. Carry it through design board layout, assembly axes, assembled control view, exact part count. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: design board layout; assembly axes; assembled control view; exact part count
