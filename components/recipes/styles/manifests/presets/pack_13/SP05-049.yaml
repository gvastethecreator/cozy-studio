visualDna:
  aesthetic: >-
    Nocturne-leaning anime illustration uses fine black contours, dense matte masses, and
    silver edges.
  subject_treatment: >-
    Preserve subject and wardrobe; apply fabric detail only to textiles already present.
  color_and_tone: >-
    Black, plum, cool silver, muted sea green; distinguish darks from material mids.
  lighting_and_shadow: >-
    Narrow edge highlights over quiet shadows; add no architectural or night setting.
  texture_and_material: >-
    Velvet or lace detail only on those existing materials; otherwise matte ink and cel
    fill.
  camera_and_composition: >-
    Respect camera; balance dense dark shapes with open space, no architectural frame.
  atmosphere_and_mood: >-
    Severity through contrast only when requested; do not darken a light mood.
  rendering_and_quality: >-
    Deliberate blacks, selective fine detail, open mids, no ornate border.
  key_features: >-
    Dense matte silhouette, cool silver edge, dark plum values, selective material ornament
  creative_brief: 'Apply a visual treatment centered on dense matte silhouette, cool silver edge, dark plum values, selective material ornament. Preserve the exact subject, action, count, age, costume, setting, camera, and mood. Add nothing outside the prompt. Use it as a reusable look on any subject.'
