visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on The Banner Saga gameplay screenshots:
    hand-painted tactical-RPG capture with icy strongholds, Viking silhouettes, square-grid
    positioning, and storybook battlefield clarity. Apply this after prompt X; prompt X supplies the
    subject, action, setting, and intensity while this preset supplies capture language, camera
    grammar, material behavior, playable readability, and finish. Do not recreate an exact official
    level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable The Banner Saga-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a The Banner Saga-informed palette: snow white, slate blue, oxblood cloth, muted gold, cold
    grey armor, and warm campfire accents. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through flat overcast snowlight, torch pools, rimmed silhouettes, and painterly
    value blocks rather than glossy 3D lighting. Lighting must clarify the playable route, threat,
    focal subject, or objective and avoid generic cinematic bloom that destroys screenshot
    readability.
  texture_and_material: >-
    Build surfaces from illustrated snow, wool cloaks, carved shields, old timber, simple armor
    planes, and crisp 2D cutout edges. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with isometric tactical grid with large readable units, threat spacing, turn-order
    logic, and landscape silhouettes behind the fight. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a The Banner Saga-derived mood: grim, mythic, exhausted, noble, and winter-bound. The
    preset can become adult, violent, eerie, seductive, cozy, tactical, or absurd when prompt X
    asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: turn-order cards, stat pips,
    tile markers, and ability icons are allowed as part of tactical readability. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    The Banner Saga gameplay screenshots; hand-painted tactical-RPG capture with icy strongholds,
    Viking silhouettes, square-grid positioning, and storybook battlefield clarity; snow white,
    slate blue, oxblood cloth, muted gold, cold grey armor, and warm campfire accents; flat overcast
    snowlight, torch pools, rimmed silhouettes, and painterly value blocks rather than glossy 3D
    lighting; illustrated snow, wool cloaks, carved shields, old timber, simple armor planes, and
    crisp 2D cutout edges; isometric tactical grid with large readable units, threat spacing,
    turn-order logic, and landscape silhouettes behind the fight; grim, mythic, exhausted, noble,
    and winter-bound; HUD guidance: turn-order cards, stat pips, tile markers, and ability icons are
    allowed as part of tactical readability
  creative_brief: >-
    Use Banner Saga Glacier Tactics as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through capture references from The Banner Saga: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
