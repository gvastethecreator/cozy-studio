  color_and_tone: Terracotta, sand, sage, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Soft warm light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Burnished plaster sheen, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at a glance.
  atmosphere_and_mood: Calm, earthy, warm and soft, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  creative_brief: "Tadelakt: burnished lime plaster with soft sheen and subtle cloudy variation. Carry it through burnished plaster, cloudy sheen, decorative surface pattern. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
