visualDna:
  aesthetic: >-
    Streetwear Hypebeast operates as a portable fashion-costume router: combine Streetwear hype
    grammar, capsule-drop exclusivity, sneaker culture pressure with subcultural dress-code logic
    with identity signals, music or scene memory, attitude, and symbolic styling pressure, so the
    preset supplies styling behavior rather than a fixed outfit card, required wearer, or literal
    garment sample.
  subject_treatment: >-
    Preserve the prompt's subject, motion, and context while forms re-code, roughen, glamorize,
    cuff, patch, distress, polish, exaggerate, or accessorize through Oversized silhouette, boxy
    hoodie cut, dropped shoulders, wide-leg cargo; identity stays readable as silhouette, fit,
    layering, body-volume logic, edge behavior, and styling hierarchy shift into this preset.
  color_and_tone: >-
    Map color through identity colors, denim or leather anchors, subculture accents, worn neutrals,
    high-contrast trims, and era-coded saturation; keep textile values separated, accents
    intentional, material color believable, and palette behavior attached to the subject instead of
    pasted wardrobe decoration.
  lighting_and_shadow: >-
    Use Harsh direct flash, nighttime bounce, billboard-color glow, social-feed contrast plus club,
    daylight, editorial, neon, chrome, or DIY light cues that reveal texture and attitude without
    forcing a venue as the styling light contract, revealing cut, drape, surface response, trim,
    transparency, or armor structure without erasing prompt readability.
  texture_and_material: >-
    Render Heavyweight cotton, ripstop nylon, pebbled leather, retroreflective tape, mesh paneling
    plus denim, leather, cotton, lace, vinyl, boots, badges, knit, metal hardware, embroidery,
    print, and worn textile history; keep fabric scale, seams, fibers, shine, opacity, folds,
    hardware, elemental edges, or body-surface treatment coherent across the whole prompt.
  camera_and_composition: >-
    Compose with Oversized drop-culture massing, sneaker-scale emphasis and flash-compressed
    streetwear silhouette plus attitude-led silhouette, accessory grouping, dress-code readability,
    body-line rhythm, and reusable styling emphasis as reusable fashion framing grammar, allowing
    portraits, objects, creatures, environments, action, and abstract prompts to inherit styling
    without one required pose.
  atmosphere_and_mood: >-
    Carry mood through rebellion, nostalgia, romance, nightlife, softness, defiance, handmade
    culture, or academic/intellectual taste; the tone should feel specific to Streetwear Hypebeast
    while still obeying the prompt's adult, cute, severe, sensual, strange, or practical intent when
    supplied.
  rendering_and_quality: >-
    Finish with authentic subculture styling, material age, clear identity cues, and no
    costume-party caricature unless requested; prioritize clean style recognition, believable
    material physics, prompt preservation, controlled detail, and no watermark, fake text, or
    accidental UI.
  key_features: >-
    Streetwear hype grammar, capsule-drop exclusivity, sneaker culture pressure; Oversized
    silhouette, boxy hoodie cut, dropped shoulders, wide-leg cargo; Heavyweight cotton, ripstop
    nylon, pebbled leather, retroreflective tape, mesh paneling; Harsh direct flash, nighttime
    bounce, billboard-color glow, social-feed contrast; Oversized drop-culture massing,
    sneaker-scale emphasis and flash-compressed streetwear silhouette
  creative_brief: >-
    Use Streetwear Hypebeast after prompt X as a transferable fashion/costume layer: prompt X
    supplies subject, motion, setting, tone, and intensity, while the preset supplies Streetwear
    hype grammar, capsule-drop exclusivity, sneaker culture pressure, Oversized silhouette, boxy
    hoodie cut, dropped shoulders, wide-leg cargo, Heavyweight cotton, ripstop nylon, pebbled
    leather, retroreflective tape, mesh paneling, Harsh direct flash, nighttime bounce,
    billboard-color glow, social-feed contrast, Oversized drop-culture massing, sneaker-scale
    emphasis and flash-compressed streetwear silhouette plus signature layers, footwear cues, hair
    volume, accessory codes, patches, hardware, textile wear, and stance-driven silhouette, palette
    behavior, light response, material treatment, silhouette grammar, and finish discipline without
    requiring one body type, fixed outfit, venue, prop bundle, or card composition.
