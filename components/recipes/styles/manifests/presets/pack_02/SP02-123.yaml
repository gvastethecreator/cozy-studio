visualDna:
  aesthetic: 'Public access cable crawl: a community-bulletin slide from a character generator, with gradient backgrounds, clip-art and scrolling bands, played over VHS noise.'
  subject_treatment: Keep the prompt subject as the content of the graphic; this preset owns the on-screen layout, and every band, panel or symbol stays free of readable text.
  color_and_tone: Royal blue to purple gradients, saturated yellow and magenta bands, VHS color bleed.
  lighting_and_shadow: Flat graphic light; no scene lighting beyond the inset photo.
  texture_and_material: Pixelated clip-art, drop-shadowed shapes, scanlines, chroma noise and an unsteady crawl band.
  camera_and_composition: 'Title-safe slide layout: an inset still of the subject, empty title bars, a crawl band at the bottom.'
  atmosphere_and_mood: Endless and oddly comforting, community notices looping through the night.
  rendering_and_quality: Analog cable character-generator look with all text replaced by blank bars.
  key_features: gradient bulletin slide; pixel clip-art; blank crawl band; inset still photo; VHS noise
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Public Access Cable Crawl as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
