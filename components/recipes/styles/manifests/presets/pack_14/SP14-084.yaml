    Orbital Death Spiral acts as a transferable mythic-noir router: cosmic orbit law and
    gravitational ritual order, mortuary omen design and beautiful fatality plus collapsing
    recurrence and hypnotic inward motion fused with cosmological omen design with orbital law,
    astral records, meridian axes, eclipse timing, and catastrophic elegance; it carries symbol,
    omen, ritual authority, and mature editorial restraint without locking prompt content to its
    sample image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through
    forms organized by orbital pull, mass hierarchy, and circular pressure, mortality-weighted
    silhouette pressure and final-form restraint plus forms drawn through spiral contour, inward
    pull, and rotational stress; forms should inherit silhouette pressure, emblem logic, ritual
    posture, edge weight, and motif placement instead of a mandatory actor or prop set.
  color_and_tone: >-
    Map color through bone pale accents against funeral darks, orbital-weighted accent roles over
    disciplined dark values plus spiral-weighted accent roles over disciplined dark values together
    with void black, star salt, eclipse gold, lunar blue, nebula bruise, comet white, auroral green,
    and severe red warning notes; values stay separated, accents feel intentional, and the dark
    palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use planetary rim light and motion-like glow trails plus rotating highlight bands and tightening
    shadow arcs with planetary rim light, occult backlight, starfall sparks, auroral veils, lunar
    frost, and signal-like bell illumination; shadows must carry omen weight, rims should clarify
    form, and glow should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render black celestial dust, polished instrument rings, and abraded orbit marks, bone dust,
    funeral polish, and cold edge wear plus abraded circular marks, dark residue, and
