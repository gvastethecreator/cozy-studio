visualDna:
  aesthetic: >-
    Transparent watercolor builds form with washes of varied pigment load, controlled wet and dry
    edges, and protected light areas.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Model the existing forms with layered
    washes and keep light reserves inside the shapes they describe.
  color_and_tone: >-
    Use the requested colors with transparent value changes. Let the support show only where the
    requested image calls for light; do not impose a beige or pastel palette.
  lighting_and_shadow: >-
    Respect the requested light direction and shadows. Translate their value structure into wash
    density without adding a window, daylight condition or other source.
  texture_and_material: >-
    Localize pigment granulation where color gathers and keep drying edges controlled. Avoid a blanket
    paper texture or uniform grain over unrelated areas.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not reserve space for
    an unrequested card border or label.
  atmosphere_and_mood: >-
    Keep the requested atmosphere. Transparent washes alone do not make the scene dreamy, nostalgic
    or softened out of focus.
  rendering_and_quality: >-
    Separate important forms through clear wash boundaries and deliberate light reserves. Keep
    granulation local so it does not obscure the requested content.
avoidRules:
  - global blur that obscures contours
  - uniform granulation noise
