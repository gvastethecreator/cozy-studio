  lighting_and_shadow: Floodlights from high angles, hard shadows under the eyes and glowing irises.
  texture_and_material: Grass blades, sweat and jersey fabric with graphic line overlays.
  camera_and_composition: Fisheye distortion toward the ball, extreme close-ups on eyes with the goal behind.
  atmosphere_and_mood: Predatory and obsessive, a player who wants the goal more than anything else.
