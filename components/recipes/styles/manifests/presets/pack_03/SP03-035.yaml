visualDna:
  aesthetic: 'HDRI environment lighting: a captured 360-degree environment lights the subject and appears in every reflection, so light and reflections match a real place.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera; light it with an environment map that fits the prompt's setting, visible mainly in reflections, not as a new backdrop.
  color_and_tone: Color and warmth taken from the environment — sunset gold, overcast grey or interior tungsten.
  lighting_and_shadow: Soft sky light plus a sun or window hotspot; shadows matching the environment.
  texture_and_material: Reflective surfaces mirroring the environment with recognizable windows or sky.
  camera_and_composition: Keep the requested framing; glossy surfaces placed to catch the reflections.
  atmosphere_and_mood: Grounded and believable, the object truly belonging somewhere.
  rendering_and_quality: Image-based lighting with correct reflections; no mismatched studio look.
  key_features: image-based lighting; environment in reflections; matched sun hotspot; environment-derived color; grounded shadows
  creative_brief: "HDRI environment lighting: a captured 360-degree environment lights the subject and appears in every reflection, so light and reflections match a real place. Carry it through image-based lighting, environment in reflections, matched sun hotspot, environment-derived color, grounded shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - changing the geometry
  - adding a new environment
  - adding fog the preset does not own
  - readable text
  - logo
  - studio background
  - wrong medium
  - flat 2d paintover
  - muddy AI noise
  - uncontrolled texture chatter
  - watermark
  - signature
  - flat lighting
  - random glow overlay
  - crushed black
  - no shadow logic
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
