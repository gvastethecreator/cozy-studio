visualDna:
  aesthetic: 'Over-under split shot: a dome port held half in the water, so the waterline cuts the frame and shows the world above and below at once.'
  subject_treatment: Keep the prompt subject, action and setting; this preset owns the camera position and lens, so re-stage only the viewpoint as described.
  color_and_tone: Warm sunlit air above, green or turquoise water below, the two separated by a bright wavy waterline.
  lighting_and_shadow: Daylight from above; sun rays and caustics below the surface; the upper half usually brighter.
  texture_and_material: Droplets on the upper dome, refraction bending shapes at the line, particles and bubbles in the water.
  camera_and_composition: Waterline crossing the middle or lower third, subject spanning both halves when possible, wide lens at water level.
  atmosphere_and_mood: Curious and double, two worlds meeting at one thin trembling line.
  rendering_and_quality: Real optical split with refraction at the waterline, not a stitched composite.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Over-Under Split Shot as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: waterline splits the frame; above and below at once; dome droplets; underwater caustics; subject across both halves
