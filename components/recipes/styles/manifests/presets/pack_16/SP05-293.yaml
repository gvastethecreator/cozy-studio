visualDna:
  aesthetic: >-
    Rough density: irregular hatch clusters at focal edges, mottled paint in broad value fields,
    and solid dark contour anchors.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Rough marks
    must not obscure identity or turn forms into variants.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, use deep umber, smoked
    gold, desaturated olive, and blue-gray in robust but limited value groups.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Keep warm local highlights tied to the
    stated source against larger cool or dark masses; add no spectacle light.
  texture_and_material: >-
    Apply texture only to materials already present. Concentrate dry brush and short rough
    hatching on present textured materials; invent no relics or surface types.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Place dense texture near
    existing overlaps while keeping silhouette channels and quiet planes readable.
  atmosphere_and_mood: >-
    Keep the requested emotional tone; density is a drawing property, not grandeur.
  rendering_and_quality: >-
    Balance rough edge noise with stable dark anchors and open midtones; use no global grunge
    overlay.
  key_features: >-
    Irregular hatch clusters; mottled broad washes; solid dark anchors; controlled density.
  creative_brief: "Use irregular hatch clusters; mottled broad washes; solid dark anchors; controlled density. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject."
