visualDna:
  aesthetic: >-
    Anime painting combines soft modeled forms and fine, partly integrated linework with small
    drawn highlights and restrained pearlescent shifts.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Integrate line into painted edges
    selectively while keeping defining features legible.
  color_and_tone: >-
    Retain the requested palette. Keep any iridescent color shift subtle and inside existing hues;
    do not introduce a new dominant color or apply sheen across the image.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Place small highlights only where that light
    already meets a surface; do not create another source or a glow effect.
  texture_and_material: >-
    Distinguish polished surfaces through their existing material cues, with smooth paint transitions
    and selective drawn reflections. Avoid a uniform metallic or foil-like finish.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not add a card frame, lettering
    or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Pearlescent variation is a paint behavior and does not
    change the scene or narrative.
  rendering_and_quality: >-
    Build soft volume first, then use a few small, material-specific highlights. Keep the line and
    painted edges subordinate to the requested subject rather than polishing every surface equally.
avoidRules:
  - all-over metallic sheen or foil-like finish
  - highlights that introduce new dominant hues
  - unrequested card frame or lettering
