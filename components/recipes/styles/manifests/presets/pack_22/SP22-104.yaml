visualDna:
  aesthetic: >-
    Line-first mixed-media drawing in which a structural pen contour carries form and transparent
    watercolor adds selective color masses.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Establish the existing structure with
    varied, occasionally broken lines before adding washes that leave portions of the form open.
  color_and_tone: >-
    Keep color subordinate to the drawing while respecting the requested palette. Use wash value to
    support the line rather than replace its shape information.
  lighting_and_shadow: >-
    Follow the requested illumination. Use line density and wash value to express its existing shadow
    pattern without inventing a new source.
  texture_and_material: >-
    Keep washes light, with localized pigment marks and little surface noise. Vary line weight through
    the form instead of using one uniform digital contour.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not add a card panel
    or recompose around a border that was not requested.
  atmosphere_and_mood: >-
    Retain the requested mood. A drawn line and watercolor wash should not add an unrequested
    travel-journal setting, narrative or decorative annotation.
  rendering_and_quality: >-
    Keep the drawing legible without color and let washes clarify rather than blur its structure.
    Avoid photographic shading that competes with the line.
avoidRules:
  - uniform digital outline
  - photographic shading
