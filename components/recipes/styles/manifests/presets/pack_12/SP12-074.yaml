visualDna:
  aesthetic: >-
    Source-informed video-game style router for original analog occult deckbuilder captures: tactile
    horror tabletop play with candlelit surfaces, low-fi card lanes, physical counters, oppressive
    darkness, escape-room board logic, and hand-scale card decisions. Borrow the candlelit
    decision-state clarity of games like Inscryption, but land as a different fictional game with
    different props, card anatomy, symbols, board layout, and opponent staging. Apply this after
    prompt X; prompt X supplies the subject, action, setting, and intensity while this preset
    supplies capture language, camera grammar, material behavior, playable readability, and finish.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable candlebone deck-table state: the
    subject can become card tokens, table hazards, carved icons, small encounter figures,
    scale/counter pressure, or board affordances while keeping clear role silhouette and decision
    logic. Avoid turning every prompt into a fixed cabin story or copying named game characters.
  color_and_tone: >-
    Use an analog occult deckbuilder palette: soot black, candle amber, aged paper, bone ivory,
    oxidized green, dried blood red, desaturated wood brown, and dirty brass. Keep the image dark
    but denoised and readable, with color accents behaving like cost, danger, sacrifice, route, or
    objective cues rather than glossy decoration.
  lighting_and_shadow: >-
    Light the image through candle pools, desk-lamp falloff, weak moon spill, glowing sigil pips,
    and hard tabletop shadows. Lighting must clarify the current card-table decision, board lanes,
    active threat, or puzzle object and avoid neon bloom, arena spotlights, or cinematic fantasy
    glare.
  texture_and_material: >-
    Build surfaces from worn card stock, scratched wood, wax, bone or teeth counters, hand-inked
    symbols, tarnished metal clips, dusty tabletop props, and low-fi in-engine materials. Materials
    should feel captured during play, not like a polished trading-card renderer or glossy esports
    board.
  camera_and_composition: >-
    Compose with a low first-person tabletop view or slightly angled locked card-table camera: hand
    cards, lane grid, draw pile, scale/counter object, sacrifice/energy tokens, and one active
    decision. The frame should read as a plausible gameplay capture; UI should be diegetic and
    wordless, built from table objects, icons, dots, pips, and silhouettes only.
  atmosphere_and_mood: >-
    Carry an original candlebone deck-table mood: intimate, predatory, occult, analog,
    claustrophobic, and puzzle-horror. The preset can become adult, violent, eerie, seductive, cozy,
    tactical, or absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine gameplay screenshot style, not concept art: analog card-table HUD
    is central, but all cards and counters must remain wordless and numberless. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, low-fi material
    restraint, and no fake logos, glossy arena boards, readable card text, stat numbers, or random
    interface clutter.
  key_features: >-
    original analog occult deckbuilder gameplay screenshots; tactile horror tabletop capture with
    candlelit surfaces, low-fi card lanes, analog counters, oppressive darkness, escape-room board
    state, and hand-scale card decisions; soot black, candle amber, aged paper, bone ivory, oxidized
    green, dried blood red, desaturated wood brown, and dirty brass; candle pools, desk-lamp
    falloff, weak moon spill, glowing sigil pips, and hard tabletop shadows; worn card stock,
    scratched wood, wax, bone or teeth counters, hand-inked symbols, tarnished metal clips, dusty
    tabletop props, and low-fi in-engine materials; low first-person tabletop view or slightly
    angled locked card-table camera; intimate, predatory, occult, analog, claustrophobic, and
    puzzle-horror; HUD guidance: diegetic card-table HUD built from table objects, icons, dots,
    pips, silhouettes, counters, and physical affordances only
  creative_brief: >-
    Use Candlebone Deck Table as a transferable game-originals preset. Preserve prompt X, then
    route interpretation through analog horror deckbuilder references: tactile tabletop camera,
    physical card grammar, candlelit material language, decision-state readability, and low-fi
    in-engine finish. Coherent diegetic HUD is allowed when it belongs on the table; avoid menus,
    logos, exact cards, exact characters, glossy digital arena boards, readable text, stat numbers,
    direct Inscryption cloning, and promotional key art.
