visualDna:
  aesthetic: 'Messy ballpoint-pen zine drawing pushed through a cheap copier: looping blue-black biro scribble, overworked shading tangles, uneven pressure, and gray toner haze at the page edges.'
  subject_treatment: 'Keep prompt X intact but render it as an obsessive notebook drawing: contours are found through many searching loops, shadows are dense scribble knots, and details that matter are gone over again and again until the pen almost tears the page.'
  color_and_tone: Copier-gray blue-black ink on slightly gray paper, with one optional flat highlighter-yellow or red-pen accent patch.
  lighting_and_shadow: No modeled light; value comes from scribble density, with the darkest knots placed where shadows gather.
  texture_and_material: Ballpoint groove lines, ink blobs at stroke starts, copier toner speckle kept sparse, and faint paper-edge shadow from the glass.
  camera_and_composition: Close off-balance crop that feels drawn directly on a page, with one dominant subject and unfinished edges fading into bare paper.
  atmosphere_and_mood: Restless, nervous, intimate, funny-desperate, and handmade.
  rendering_and_quality: High-quality reproduction of a deliberately untidy pen drawing; clear silhouette and readable face or form despite the scrawl, without digital cleanup.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Ballpoint Scrawl Copier Zine as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
  key_features: looping ballpoint scribble; overworked tangles; copier gray; searching contours; unfinished bare-paper edges; highlighter accent
