  lighting_and_shadow: Harsh highlights, psychedelic backlight and glowing space nebulae.
  texture_and_material: Hand-painted cels with glossy highlights and Dezaki pastel freeze frames.
  camera_and_composition: Split screens, triple-take zooms and freeze-frame pastel postcards at key moments.
  atmosphere_and_mood: Keep the requested mood with swaggering pulp adventure.
  rendering_and_quality: Stylish 1982 hand-painted frame with Dezaki postcard effects.
  key_features: Buichi Terasawa designs; Dezaki freeze frames; psychedelic space; pulp glamour
  creative_brief: "Buichi Terasawa designs directed by Osamu Dezaki in Space Adventure Cobra (1982): sexy pulp space opera, heavy shading, glossy bodies, psychedelic space backdrops and Dezaki freeze frames. Carry it through Buichi Terasawa designs, Dezaki freeze frames, psychedelic space, pulp glamour. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
