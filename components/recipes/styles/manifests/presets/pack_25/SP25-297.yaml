visualDna:
  aesthetic: 'Tiled Mosaic Signage: station names and directions set in small glazed ceramic tiles, built into the wall with a tiled border.'
  subject_treatment: Set the prompt's words and arrows in small glazed ceramic tiles inside a tiled border panel on the wall, every letter built tile by tile and exact.
  color_and_tone: Cream and white fields with deep blue, green or red letters and borders.
  lighting_and_shadow: Soft platform or corridor light with gentle glaze reflections.
  texture_and_material: Glossy square tiles, grout lines and a slightly irregular handmade grid.
  camera_and_composition: Frontal panel centered on the wall with a decorative tiled border.
  atmosphere_and_mood: Timeless and civic, the charm of an old underground station.
  rendering_and_quality: Crisp mosaic with even grout and letters built cleanly from whole tiles.
  creative_brief: "Tiled Mosaic Signage: station names and directions set in small glazed ceramic tiles, built into the wall with a tiled border. Carry it through glazed tile letters, tiled border, grout grid, civic charm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: glazed tile letters; tiled border; grout grid; civic charm
