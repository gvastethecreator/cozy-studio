visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Sekiro: Shadows Die Twice gameplay screenshots:
    third-person shinobi duel capture with Japanese temple rooftops, posture combat, grappling
    routes, and precise sword-spacing. Apply this after prompt X; prompt X supplies the subject,
    action, setting, and intensity while this preset supplies capture language, camera grammar,
    material behavior, playable readability, and finish. Do not recreate an exact official level,
    character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Sekiro: Shadows Die Twice-adjacent
    game screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Sekiro: Shadows Die Twice-informed palette: weathered wood, autumn red, faded gold, ink
    black, mist grey, and steel-blue blade highlights. Keep value grouping legible at gameplay
    distance, with color accents behaving like route, danger, pickup, team, magic, or objective cues
    rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through soft mountain daylight, lantern amber, sword sparks, deathblow red, and
    fogged courtyard shadow. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from aged timber, tatami, rope, lacquer armor, dry leaves, roof tiles, and
    disciplined samurai cloth detail. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with over-shoulder lock-on combat camera with boss distance, posture pressure, arena
    edge clarity, and vertical grapple points. The frame should read as a plausible gameplay
    capture; include UI/HUD only when it matches the source game's visual logic and improves
    clarity.
  atmosphere_and_mood: >-
    Carry a Sekiro: Shadows Die Twice-derived mood: severe, elegant, lethal, disciplined, and
    historical-fantastic. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: posture bars, health nodes,
    item quick slots, and lock-on markers are allowed when they preserve action readability.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Sekiro: Shadows Die Twice gameplay screenshots; third-person shinobi duel capture with Japanese
    temple rooftops, posture combat, grappling routes, and precise sword-spacing; weathered wood,
    autumn red, faded gold, ink black, mist grey, and steel-blue blade highlights; soft mountain
    daylight, lantern amber, sword sparks, deathblow red, and fogged courtyard shadow; aged timber,
    tatami, rope, lacquer armor, dry leaves, roof tiles, and disciplined samurai cloth detail;
    over-shoulder lock-on combat camera with boss distance, posture pressure, arena edge clarity,
    and vertical grapple points; severe, elegant, lethal, disciplined, and historical-fantastic; HUD
    guidance: posture bars, health nodes, item quick slots, and lock-on markers are allowed when
    they preserve action readability
  creative_brief: >-
    Use Sekiro Temple Duel as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through capture references from Sekiro: Shadows Die Twice: camera, HUD grammar,
    material language, color coding, encounter readability, and in-engine finish. Coherent HUD is
    allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and
    promotional key art.
