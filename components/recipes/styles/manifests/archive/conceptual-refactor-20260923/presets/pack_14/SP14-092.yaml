    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through judgment held at the edge of collapse, equinox pressure, consequence, and
    symbolic tension plus axis pressure, consequence, and symbolic tension and fatalism,
    astronomical dread, prophetic calm, state secrecy, alarm, wonder, and the beauty of a system
