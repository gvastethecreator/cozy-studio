  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Matsumoto designs, lopsided heads, scratchy wobbly lines, lanky limbs and scruffy street clothes. Wardrobe details apply only when the prompt leaves clothing open.
