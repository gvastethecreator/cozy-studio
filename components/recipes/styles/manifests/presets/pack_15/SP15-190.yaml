visualDna:
  aesthetic: 'Inkbodypunk: living tattoos that move across the skin, crawl off arms, fight, dance and tell stories in bold ink.'
  subject_treatment: Keep the prompt's subject and setting; cover the skin of its figures with bold tattoos that move, escape or come alive.
  color_and_tone: Bold black ink and traditional tattoo reds, greens and yellows on warm skin tones.
  lighting_and_shadow: Warm parlor lamps and soft light on skin, ink shapes casting small shadows as they lift off.
  texture_and_material: Skin, bold ink linework, needles and parlor leather chairs.
  camera_and_composition: Close views of tattooed skin with designs mid-movement.
  atmosphere_and_mood: Rebellious and magical, stories that refuse to stay still on the body.
  rendering_and_quality: Bold illustration with crisp tattoo linework and warm skin.
  creative_brief: "Inkbodypunk: living tattoos that move across the skin, crawl off arms, fight, dance and tell stories in bold ink. Carry it through moving tattoos, ink creatures escaping, parlor light, bold lines. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: moving tattoos; ink creatures escaping; parlor light; bold lines
