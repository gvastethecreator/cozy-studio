visualDna:
  aesthetic: >-
    Dry-pastel rendering joins broad, soft masses with grain-edged transitions and compact drawing
    accents.
  subject_treatment: >-
    Preserve requested identity, proportions, pose and action. Describe existing forms with connected
    masses while keeping defining contours and details legible.
  color_and_tone: >-
    Dry pastel names the drawing material, not a pastel color palette. Use the requested colors with
    broad tonal transitions and local contrast.
  lighting_and_shadow: >-
    Follow the requested light and shadow pattern. Broad tonal marks may soften transitions without
    changing the scene lighting or adding a glow.
  texture_and_material: >-
    Concentrate grain at pigment transitions and broken edges rather than spreading uniform noise.
    Do not force a paper-colored background or obscure the requested surface.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Do not add a study-sheet
    arrangement, card border or empty display space unless requested.
  atmosphere_and_mood: >-
    Keep the requested mood. Dry pastel and soft marks do not require a mythic subject, nostalgia
    or a gentle mood.
  rendering_and_quality: >-
    Maintain large readable shapes and use compact accents selectively. Keep the grain attached to
    pigment transitions instead of turning it into a screen-wide texture.
avoidRules:
  - uniform surface noise
  - broad smears that obscure form
