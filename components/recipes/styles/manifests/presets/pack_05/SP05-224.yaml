visualDna:
  aesthetic: >-
    A severe, orderly style defined by precise orthogonal contours, pale architectural value
    planes, and small signal accents; structure comes from linework, not added buildings.
  subject_treatment: >-
    Preserve the subject’s identity and proportions. Emphasize its existing straight edges and
    divisions with clean, measured contours; do not reshape it into architecture.
  color_and_tone: >-
    Use white, cool gray, pale steel, and deep blue shadow, with a very small cyan or red
    accent.
  lighting_and_shadow: >-
    Separate forms with crisp, cool cel shadows and broad even highlights; keep emissive accents
    thin and localized.
  texture_and_material: >-
    Maintain the requested material with smooth, clean surfaces, subtle panel-like divisions,
    and almost no incidental grain.
  camera_and_composition: >-
    Respect the requested camera and layout. Echo existing lines with parallel spacing and
    deliberate negative space, without imposing a vertical city view.
  atmosphere_and_mood: >-
    Convey severity through exact alignment, cool restraint, and quiet emptiness rather than a
    sterile urban setting.
  rendering_and_quality: >-
    Favor immaculate contour precision, flat shadow bands, clean whites, and restrained detail;
    preserve silhouette clarity.
  key_features: >-
    Orthogonal line precision; cool-white planes; deep blue shadows; minimal signal accents.
  creative_brief: >-
    Keep the specified subject, scale, and setting. Apply clean orthogonal contours, cool-white
    color separation, and precise shadows; add no buildings, corridors, or city.
