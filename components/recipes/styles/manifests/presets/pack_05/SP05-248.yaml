    Balance small material detail against broad clean shapes; keep the main action easy to read.
  key_features: >-
    Organic texture, practical detail, warm reflected light, and careful process-like staging give
    this cel work its grounded quality.
  creative_brief: >-
    Restyle the requested content with tactile surfaces and clear process-led detail, without
    introducing ingredients, cooking, or food.
