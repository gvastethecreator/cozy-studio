visualDna:
  aesthetic: 'Flat-shaded low poly: subjects and scenes built from a small number of large triangles, each facet one flat color, rendered like a simple real-time game scene.'
  subject_treatment: Rebuild the prompt's subject and setting in this digital construction; the preset owns the geometry, while subject identity, action and palette intent stay as requested.
  color_and_tone: Soft pastel or bright saturated palettes with each facet a single tone; value shifts only from facet orientation to the light.
  lighting_and_shadow: One directional sun with flat per-facet shading, simple soft ambient occlusion, crisp faceted shadow shapes.
  texture_and_material: No textures; clean hard polygon edges, visible triangle structure, matte surfaces.
  camera_and_composition: Keep the requested framing; forms simplified to a few hundred faces with clear silhouettes.
  atmosphere_and_mood: Calm, toy-like and tidy, a minimal game world.
  rendering_and_quality: Uniform flat facets with hard edges and simple lighting; no smooth shading, no high-poly detail, no photo textures.
  key_features: large flat-shaded triangles; one color per facet; hard polygon edges; single directional sun; minimal geometry
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Flat-Shaded Low Poly as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
