  creative_brief: "Satoshi Kon manga and film look: grounded realistic adults, mirrors and reflections, seamless match-cuts where reality slips into illusion. Carry it through Satoshi Kon mirrors, reality slips, match cuts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
