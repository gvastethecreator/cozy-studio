visualDna:
  aesthetic: 'Scientific simulation visualization: the scene shown as grey context geometry with a measured field drawn over it as streamlines, isosurfaces and arrow glyphs.'
  subject_treatment: "Portable environment render: keep the prompt's subject and location; they become the geometry of a scientific data visualization with the measured field drawn around them."
  color_and_tone: Neutral light-grey geometry, one perceptual colormap (viridis or blue-to-red diverging) carrying the data, dark or white clean background.
  lighting_and_shadow: Soft even studio light with ambient occlusion so shapes read; the data layers are self-lit and never shaded dark.
  texture_and_material: Matte untextured context surfaces, thin tube streamlines, semi-transparent isosurface shells and small cone glyphs pointing along flow.
  camera_and_composition: Keep the requested view, pulled back just enough that the whole field and its source read at once.
  atmosphere_and_mood: Calm, exact and explanatory, beauty coming from measured order.
  rendering_and_quality: Clean anti-aliased render with no photographic texture; the colormap is continuous and never rainbow-banded.
  key_features: streamline tubes; translucent isosurfaces; cone arrow glyphs; single perceptual colormap; grey matte context geometry
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Scientific Visualization as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
