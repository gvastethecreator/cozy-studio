visualDna:
  aesthetic: '16-bit pseudo-3D: one flat tiled ground layer rotated and scaled line by line toward a horizon, with flat sprites riding on top.'
  subject_treatment: Keep the prompt subject and action recognizable; this preset owns a low chase camera looking along an affine-scaled floor plane toward a flat painted horizon, and adds no score, health bar, logo or readable interface text.
  color_and_tone: A 256-color console palette with saturated sky gradients in hard bands and a brightly tiled ground.
  lighting_and_shadow: No real lighting; sprites carry a small flat oval shadow on the plane.
  texture_and_material: Ground tiles stretch into huge blocky pixels near the camera and shimmer into aliased noise near the horizon.
  camera_and_composition: Low tilted view; the plane fills the lower two thirds and meets a flat parallax backdrop at a straight horizon.
  atmosphere_and_mood: Soaring and optimistic, speed over an endless flat world.
  rendering_and_quality: Visible affine stretching and horizon aliasing; sprites never scale smoothly.
  key_features: affine-scaled floor plane; stretched near pixels; horizon shimmer; flat parallax backdrop; scaled sprites
  creative_brief: "16-bit pseudo-3D: one flat tiled ground layer rotated and scaled line by line toward a horizon, with flat sprites riding on top. Carry it through affine-scaled floor plane, stretched near pixels, horizon shimmer, flat parallax backdrop, scaled sprites. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
