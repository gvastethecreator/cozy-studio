  color_and_tone: Gold ground with deep blues and reds, with each unit holding one color so the image is built by juxtaposition.
  lighting_and_shadow: Shimmering gold catching light unevenly, as the physical behavior of this unit.
  texture_and_material: glass and gold-leaf tesserae set at slight angles, set with dark mortar gaps, at a unit size that keeps the subject readable.
  camera_and_composition: Keep the prompt framing; unit size and direction follow the subject contours so forms read clearly.
  atmosphere_and_mood: Sacred, radiant, formal and eternal, coming from the handcrafted construction.
  rendering_and_quality: Crisp, consistent units and joints across the whole image, with no smeared or random fill.
  creative_brief: "Byzantine mosaic: glass and gold-leaf tesserae set at angles to shimmer. Carry it through gold-leaf tesserae, angled shimmer. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
