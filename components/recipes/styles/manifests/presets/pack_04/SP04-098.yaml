visualDna:
  aesthetic: 'Fantasy world map concept: a hand-drawn ink and watercolor map on aged paper with pictorial mountains, forests and hatched coastlines.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a top-down hand-drawn map of the region or realm the subject implies, and that layout replaces the requested framing.
  color_and_tone: 'Sepia ink and muted watercolor washes on tea-stained paper: sage lowlands, ochre highlands, grey-blue sea.'
  lighting_and_shadow: No cast light; relief shown with side-lit pictorial mountain symbols and hachures.
  texture_and_material: Dip-pen lines, hachures, stippled coastlines, paper creases and foxing spots.
  camera_and_composition: Top-down map with a compass rose and an empty decorative cartouche, landmasses filling the sheet.
  atmosphere_and_mood: Inviting to adventure, a realm waiting to be explored.
  rendering_and_quality: Hand-crafted finish; place names replaced by blank space or illegible scribble.
  key_features: dip-pen and watercolor; pictorial mountains and forests; hatched coastlines; compass rose; blank cartouche
  creative_brief: "Fantasy world map concept: a hand-drawn ink and watercolor map on aged paper with pictorial mountains, forests and hatched coastlines. Carry it through dip-pen and watercolor, pictorial mountains and forests, hatched coastlines, compass rose, blank cartouche. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
