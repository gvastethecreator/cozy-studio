visualDna:
  aesthetic: 'Botanical iron glasshouse: a Victorian curvilinear palm house of wrought-iron ribs and small curved panes, planted as a display with specimen palms, tiered beds and a spiral stair to a gallery.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: White-painted or dark green ironwork, pale glass, deep glossy greens, terracotta pots and tiles; bright and light with jewel accents of flowers.
  lighting_and_shadow: Daylight through curved glass casting a fine net of rib shadows over leaves and paths; glowing from inside at dusk.
  texture_and_material: Curved wrought-iron ribs, overlapping curved glass panes, cast-iron spiral stairs and galleries, encaustic tile paths, raised beds and giant water-lily tanks.
  camera_and_composition: Keep the requested view; show the curvature of the vault overhead or the whole glass silhouette from outside, planting layered below.
  atmosphere_and_mood: Wondrous, collected and bright, the world's plants under one roof.
  rendering_and_quality: Crisp photograph with continuous iron curves and a legible rib-shadow net; humidity haze belongs to Conservatory Bioclimate, not here.
  key_features: curvilinear wrought-iron glass vault; net of rib shadows; specimen palms; cast-iron spiral stair and gallery; giant water-lily tank
  creative_brief: "Botanical iron glasshouse: a Victorian curvilinear palm house of wrought-iron ribs and small curved panes, planted as a display with specimen palms, tiered beds and a spiral stair to a gallery. Carry it through curvilinear wrought-iron glass vault, net of rib shadows, specimen palms, cast-iron spiral stair and gallery, giant water-lily tank. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
