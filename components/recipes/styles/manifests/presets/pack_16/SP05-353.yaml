  aesthetic: 'In-car racing anime of nocturnal tension: dashboard glow, gripping hands, mirrors full of headlights and the road rushing at the windshield.'
  subject_treatment: Keep the prompt's subject and action; view it from inside a vehicle or at close range, tension carried by hands, eyes and mirrors.
  color_and_tone: Dark cabin blacks with dashboard amber, headlight white and taillight red reflections.
  lighting_and_shadow: Dashboard glow from below, passing streetlights sweeping across faces and hands.
  texture_and_material: Leather steering wheels, gauges, glass reflections and speed-blurred road.
  camera_and_composition: Tight cockpit framings, mirror shots and over-the-shoulder views through the windshield.
  atmosphere_and_mood: Tense and focused, a quiet cabin while the world outside moves far too fast.
  rendering_and_quality: Precise mechanical anime detail with smooth light sweeps and motion blur.
  key_features: dashboard glow; mirror headlights; gripping hands; windshield rush
  creative_brief: "In-car racing anime of nocturnal tension: dashboard glow, gripping hands, mirrors full of headlights and the road rushing at the windshield. Carry it through dashboard glow, mirror headlights, gripping hands, windshield rush. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
