visualDna:
  aesthetic: 'Sparks: hot sparks spraying from the target in bright streaks.'
  subject_treatment: 'Contain the effect on or immediately around the target named in the prompt (object, figure, hand, weapon or surface), keeping the target, its pose and the setting; the effect never becomes a new event or fills the scene: bright sparks spray from a point on the target in streaks.'
  color_and_tone: Orange-gold streaks with white-hot centers, concentrated around the target while the rest of the scene keeps its palette.
  lighting_and_shadow: Sparks lighting the target in warm flashes, so the effect lights the target and casts believable local light.
  texture_and_material: Streaking sparks and glowing particles, with physically plausible motion, density and falloff.
  camera_and_composition: Keep the prompt framing; place the effect where it interacts with the target so its shape and motion read at card size.
  atmosphere_and_mood: Industrial, energetic, fiery and alive, coming from the effect rather than added scenery.
  rendering_and_quality: Photoreal or cinematic VFX quality with clean edges, readable motion and no noisy haze over the whole frame.
  key_features: spark spray streaks; white-hot centers; contained around the target
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Sparks as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - material applied to the background instead of the target
  - unrequested sample object or habitat
  - readable text
  - logo
  - muddy noisy texture
  - unrequested disaster or event
  - effect filling the whole scene
  - fire
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
