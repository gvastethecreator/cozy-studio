visualDna:
  aesthetic: >-
    Broad matte areas meet narrow controlled reflective accents, creating a contrast in surface response
    while keeping form and silhouette simple.
  subject_treatment: >-
    Keep the requested subject, identity, anatomy, action and setting. Apply the visual treatment to its
    existing shapes; do not replace it with an emblem, ritual, character or prop from a sample card.
  color_and_tone: >-
    Preserve the requested colors. Distinguish surface response with restrained highlight values rather
    than forcing black stone, gold or jade.
  lighting_and_shadow: >-
    Follow the requested light source. Place compact reflections only on materials that support them; do
    not add luminous outlines.
  texture_and_material: >-
    Keep each requested material intact. Express the contrast through its existing roughness and
    reflectance rather than coating every object in lacquer.
  camera_and_composition: >-
    Keep the requested viewpoint, crop and spatial arrangement. Keep the requested framing; concentrate
    reflectance near existing changes of plane and leave large low-detail areas.
  atmosphere_and_mood: Cool precision and tactile contrast without imposing sacred objects, rituals or menace.
  rendering_and_quality: >-
    Balance clean matte masses and few crisp glints. Avoid wet-look skin, chrome everywhere and uniform
    sparkling detail.
avoidRules:
  - all-over lacquer coating
  - wet-look skin
  - uniform sparkle
assets:
