visualDna:
  aesthetic: >-
    Build the graphic anime treatment from fine deliberate black strokes with selective heavier
    emphasis and hard-edged rectangles, wedges, and isolated vermilion marks. Let measured pauses,
    exact turns, and delayed repetition set its rhythm; use ink black and bone white punctuated by
    restrained red for color and dry matte paper grain over otherwise clean, flat fields for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use fine deliberate black strokes with selective
    heavier emphasis for edge work, hard-edged rectangles, wedges, and isolated vermilion marks
    for form simplification, and measured pauses, exact turns, and delayed repetition only where
    movement is already requested.
  color_and_tone: >-
    Build value groups with ink black and bone white punctuated by restrained red. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: firm black-to-white shadow blocks with minimal midtone. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with dry matte paper grain over otherwise clean, flat fields,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use static asymmetric balance with one isolated accent
    and ample empty space to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey cerebral suspense and controlled stillness, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with crisp edges, limited color, and quiet fields with isolated accents; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    fine deliberate black strokes with selective heavier emphasis; hard-edged rectangles, wedges,
    and isolated vermilion marks; ink black and bone white punctuated by restrained red; measured
    pauses, exact turns, and delayed repetition; dry matte paper grain over otherwise clean, flat
    fields; static asymmetric balance with one isolated accent and ample empty space.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with fine deliberate black
    strokes with selective heavier emphasis, hard-edged rectangles, wedges, and isolated vermilion
    marks, and ink black and bone white punctuated by restrained red; use measured pauses, exact
    turns, and delayed repetition only where movement is already present, and apply dry matte
    paper grain over otherwise clean, flat fields as the drawing finish.
