visualDna:
  aesthetic: 'Wax seal: artwork stamped into a pool of colored sealing wax.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork is stamped into a pool of sealing wax on paper."
  color_and_tone: Red, black, gold or green wax, as produced by the printing process on the stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Glossy wax with crisp relief, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Antique, secret, formal and romantic, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  creative_brief: "Wax seal: artwork stamped into a pool of colored sealing wax. Carry it through stamped wax relief, physical print process. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: stamped wax relief; physical print process
