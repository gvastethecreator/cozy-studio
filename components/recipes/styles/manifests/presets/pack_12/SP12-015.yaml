visualDna:
  aesthetic: 'In-game screenshot look informed by Axiom Verge gameplay: retro metroidvania capture with biomechanical ruins, alien machinery, side-view corridors, glitch weapons, and readable tile hazards. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Axiom Verge-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Axiom Verge-informed palette: deep purple, toxic green, rusty red, bone white, black void,
    and electric blue glitch accents. Keep value grouping legible at gameplay distance, with color
    accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through pixel bloom from energy nodes, dark room contrast, weapon flashes, and
    monitor-like color bands. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from pixelated bio-circuit walls, alien statues, ribbed machinery, corrupted
    tiles, and crunchy particle bursts. Materials should feel like in-engine game assets captured
    during play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with side-view exploration frame with platforms, doors, enemies, secret routes, and
    small character scale against strange architecture. The frame should read as a plausible
    gameplay capture; include UI/HUD only when it matches the source game's visual logic and
    improves clarity.
  atmosphere_and_mood: 'Axiom Verge-derived mood: lonely, alien, retro, corrupted, and exploratory; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: retro health bars, weapon
    icons, map blocks, and glitch readouts are allowed if sparse and period-correct. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Axiom Verge gameplay screenshots; retro metroidvania capture with biomechanical ruins, alien
    machinery, side-view corridors, glitch weapons, and readable tile hazards; deep purple, toxic
    green, rusty red, bone white, black void, and electric blue glitch accents; pixel bloom from
    energy nodes, dark room contrast, weapon flashes, and monitor-like color bands; pixelated
    bio-circuit walls, alien statues, ribbed machinery, corrupted tiles, and crunchy particle
    bursts; side-view exploration frame with platforms, doors, enemies, secret routes, and small
    character scale against strange architecture; lonely, alien, retro, corrupted, and exploratory;
    HUD guidance: retro health bars, weapon icons, map blocks, and glitch readouts are allowed if
    sparse and period-correct
  creative_brief: "Axiom Verge Ancient Tech Temple: in-game screenshot language informed by Axiom Verge, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
