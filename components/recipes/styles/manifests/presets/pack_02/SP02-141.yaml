visualDna:
  aesthetic: 'Pictorialist platinum print: an early-1900s art photograph made with a soft-focus lens and printed in platinum on matte paper to look like a painting.'
  subject_treatment: Keep the prompt subject, action and setting as they are — a modern object stays modern; change only the photographic process, print surface and tonal response of the era, never the clothing, props or scenery.
  color_and_tone: Long, delicate scale of warm silver greys, velvety blacks, no harsh whites.
  lighting_and_shadow: Mist, backlight and diffuse window light; glowing halated highlights.
  texture_and_material: Matte paper absorbing the image, soft-focus bloom around every edge.
  camera_and_composition: Keep the requested framing; asymmetric painterly composition with atmosphere.
  atmosphere_and_mood: Poetic and hushed, the world softened into a reverie.
  rendering_and_quality: Platinum-print tonality with soft-focus glow; not crisp documentary.
  creative_brief: "Pictorialist platinum print: an early-1900s art photograph made with a soft-focus lens and printed in platinum on matte paper to look like a painting. Carry it through soft-focus bloom, long warm grey scale, matte platinum paper, misty backlight, painterly composition. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: soft-focus bloom; long warm grey scale; matte platinum paper; misty backlight; painterly composition
