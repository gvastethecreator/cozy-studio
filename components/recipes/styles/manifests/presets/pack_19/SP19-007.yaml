visualDna:
  aesthetic: Illustration constructed from broad, flat-nib ink passes with squared shoulders and clipped turns.
  subject_treatment:
    Keep the requested identity and proportions. Rebuild large shapes with adjacent nib-width bands,
    shifting stroke direction to describe planes rather than tracing every edge.
  color_and_tone:
    Use the requested palette in a small number of clearly separated ink values. Let overlaps deepen
    selectively and keep small accents subordinate to the main band structure.
  lighting_and_shadow:
    Form shadows by tightening and overlapping broad passes while leaving open ground for light.
    Follow the prompt's lighting without inventing a scene source.
  texture_and_material:
    Keep the flat nib edge crisp with slight ink skips only at selected starts and overlaps. Use
    stroke width, not fine crosshatching, to control tonal density.
  camera_and_composition:
    Preserve the requested composition and camera. Use changes in band direction to separate existing
    forms without adding a border or graphic layout.
  atmosphere_and_mood:
    Carry the requested tone through the weight and spacing of the bands; the marker-like construction
    does not require signage or street art.
  rendering_and_quality:
    Keep nib widths consistent within each mark group and maintain readable gaps between neighboring
    silhouettes. Avoid thin etched line families and airbrushed transitions.
avoidRules:
  - fine engraved crosshatching
  - airbrushed gradients
  - unrequested lettering or signage
