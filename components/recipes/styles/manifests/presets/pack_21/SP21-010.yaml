visualDna:
  aesthetic: >-
    Opaque-paint illustration on prepared paper, formed with loaded palette-knife deposits whose
    raised ridges turn across depicted shapes and leave neighboring areas broadly calm.
  subject_treatment: >-
    Preserve the requested identity, proportions and action. Use the direction of each paint deposit
    to clarify existing planes without changing the subject into a sculpted object.
  color_and_tone: >-
    Respect the requested palette. Mix opaque colors in compact groups and place the strongest light
    and dark deposits within the existing value structure, not as decorative accents.
  lighting_and_shadow: >-
    Follow the requested lighting. Let the paint ridges catch restrained highlights in that same
    direction while keeping their relief subordinate to the depicted form.
  texture_and_material: >-
    Show discrete knife-set ridges, occasional scraped gaps and broad flat passages. The texture is
    thick pigment on prepared paper, not an embossed support, fabric weave or universal crust.
  camera_and_composition: >-
    Keep the requested framing and viewpoint. Vary deposit scale inside the existing focal hierarchy
    without tilting the image into a painted-object mockup.
  atmosphere_and_mood: >-
    Retain the requested mood through paint density and edge rhythm. Impasto does not require a
    dramatic studio, landscape, still life or any other prescribed scene.
  rendering_and_quality: >-
    Balance physical paint ridges with readable silhouettes and quiet transitions. Avoid deep relief,
    conflicting surface highlights and a palette-knife mark on every edge.
avoidRules:
  - deep sculptural extrusions or embossed support
  - highlights that contradict the requested lighting
  - knife ridges applied uniformly across the image
