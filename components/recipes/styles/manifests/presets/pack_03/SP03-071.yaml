visualDna:
  aesthetic: 'Glassmorphism interface render: layered frosted-glass panels floating over blurred color blobs, each pane with a thin bright edge and a soft inner glow.'
  subject_treatment: Keep the prompt subject and its identity; this preset owns a layered frosted-glass interface composition with blank textless controls, where the prompt subject appears as the blurred color field behind the glass. It stays one hero image and never becomes a multi-view asset sheet unless the prompt asks for one.
  color_and_tone: Vivid gradient blobs behind the glass softened to pastel through the frost, with white pane edges at low opacity.
  lighting_and_shadow: Soft diffuse light; each pane carries a thin specular edge along the top and a faint drop shadow below.
  texture_and_material: Frosted blur of varying strength, a fine noise grain in the frost, rounded rectangles with hairline borders.
  camera_and_composition: Frontal or gently tilted view with three to five panes stacked in depth and generous negative space.
  atmosphere_and_mood: Light, calm and airy, an interface made of mist and glass.
  rendering_and_quality: Every control left blank, pill shapes and circles in place of words, numbers or text icons; distinct from matte extruded clay UI.
  key_features: stacked frosted panes; blurred gradient blobs behind; hairline bright edges; blank pill controls; soft drop shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Glassmorphism UI as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
