visualDna:
  aesthetic: 'Film-emulated CG: a fully computer-generated shot graded to look photographed on 35 mm film, with grain, halation, gate weave and lens imperfections.'
  subject_treatment: Keep the prompt subject, action and setting and render them as 3D CGI through this renderer's light transport, sampling and material response, without swapping in a renderer demo subject.
  color_and_tone: Film print color with soft rolloff, warm halation around highlights, slightly lifted blacks.
  lighting_and_shadow: Naturalistic CG lighting softened by film response and bloom.
  texture_and_material: Fine organic grain over everything, slight chromatic aberration and vignette.
  camera_and_composition: Anamorphic or spherical cinema framing with realistic depth of field.
  atmosphere_and_mood: Nostalgic and cinematic, digital worlds dressed as old celluloid.
  rendering_and_quality: CG with film emulation baked in; no clean digital sharpness.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Film-Emulated CG Beauty Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: CG graded as 35 mm film; organic grain; highlight halation; gate weave; lens vignette
