visualDna:
  aesthetic: 'Clear action contours follow existing overlaps, with rounded ink joins and distinct planes that make the depicted motion easy to read.'
  subject_treatment: 'Preserve the exact action, identity, anatomy, and count; clarify existing overlaps without inventing a handoff, interaction, or gesture.'
  color_and_tone: 'Use distinct local colors and moderate saturation to separate forms; follow explicit palette and avoid mandatory warmth.'
  lighting_and_shadow: 'Keep contact shadows clear under the provided source; use clean value edges where forms overlap.'
  texture_and_material: 'Use smooth fills with brief material-specific brush marks; imply no new material or object.'
  camera_and_composition: 'Keep framing, viewpoint, scale, spacing, and count; guide the eye along movement already in the prompt without changing blocking.'
  atmosphere_and_mood: 'Retain the requested mood; kinetic linework does not assign an emotional tone or relationship.'
  rendering_and_quality: 'Keep contours continuous where needed and motion accents sparse; maintain clear object boundaries.'
  key_features: 'Directional action contours; rounded joins; clear overlap planes; moderate color separation; sparse material marks.'
  creative_brief: 'Clarify movement and overlaps already present with directional linework and readable color planes. Preserve scene, count, camera, and mood; add no new interaction.'
