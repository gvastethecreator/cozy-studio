visualDna:
  aesthetic: 'Linkage motion study: a mechanism drawn in successive ghosted positions through one full cycle, pivots circled and trace paths plotted.'
  subject_treatment: Keep the prompt subject as the thing documented; this reference profile owns a motion study where the subject mechanism is shown in ghosted successive positions through its cycle, stays a sheet, and shows callouts as blank tags, arrows and symbols instead of invented text or numbers.
  color_and_tone: Black line for the key position, progressively paler grey ghosts, one red trace path on cream paper.
  lighting_and_shadow: No shading; overlap and fading line weight show time.
  texture_and_material: Ruled links, compass-drawn pivot circles, dotted trace curves and small curved arrows.
  camera_and_composition: Side-view orthographic of the mechanism, positions overlapping in one frame, the traced path looping through it.
  atmosphere_and_mood: Rhythmic and ingenious, movement frozen into a diagram.
  rendering_and_quality: Clean diagram with consistent link lengths across positions and no angle numbers.
  creative_brief: "Linkage motion study: a mechanism drawn in successive ghosted positions through one full cycle, pivots circled and trace paths plotted. Carry it through ghosted successive positions, circled pivots, red trace path, curved motion arrows, side-view diagram. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: ghosted successive positions; circled pivots; red trace path; curved motion arrows; side-view diagram
