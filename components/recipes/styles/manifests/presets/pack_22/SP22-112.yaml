visualDna:
  aesthetic: >-
    Layered digital painting uses firm modeling and clean boundaries among base color, reflected color,
    highlights and shadow; its polish belongs to the depicted material, not a card surface.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Describe each form and surface by its
    own material response instead of making every element reflective.
  color_and_tone: >-
    Confine saturated reflections to selected areas and balance them with quieter neutral shadows. Retain
    the requested palette without applying a rainbow cast across the whole image.
  lighting_and_shadow: >-
    Respect the requested light sources, direction and intensity. Use designed highlights only where the
    represented form and lighting support them.
  texture_and_material: >-
    Keep boundaries between material, highlight and shadow clean. Render a polished pictorial surface
    without simulating foil, holographic coating or a universal metallic finish.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and element placement. Reflected color does not
    require a new angle or rearranged subject.
  atmosphere_and_mood: >-
    Keep the requested mood. Saturated reflections do not add magic, spectacle or an iridescent setting.
  rendering_and_quality: >-
    Separate material color, reflected light and shadow with controlled edges. Keep highlights localized
    and the full palette legible rather than coating every surface in shine.
avoidRules:
  - global rainbow sheen
  - uniformly metallic materials
