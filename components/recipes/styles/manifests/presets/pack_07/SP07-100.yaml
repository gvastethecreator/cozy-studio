visualDna:
  aesthetic: 'White-cube gallery: a neutral exhibition box of seamless white walls, pale polished concrete floor and track lights, where one object is presented as if nothing else exists.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Pure matte white walls, pale grey concrete, the exhibited object as the only colour; high key and silent.
  lighting_and_shadow: Ceiling track spots aimed at the object, soft even wash on the walls, one crisp shadow under the object.
  texture_and_material: Seamless skim-plastered walls without skirting, sealed polished concrete, recessed track lighting, a low white plinth, no labels.
  camera_and_composition: Keep the requested view; frontal, one object centred with large empty white margins, sightline to a second room through a wide opening.
  atmosphere_and_mood: Reverent, cool and exacting, anything placed here becomes art.
  rendering_and_quality: Clean gallery photograph with even white without clipping, no wall text or labels.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies White-Cube Gallery as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: seamless white walls; polished pale concrete; track spotlights; single object on a low plinth; large empty margins
