  color_and_tone: Brown-black ink, warm gray aquatint, and cream paper; optional single hand-tinted watercolor wash.
  lighting_and_shadow: Theatrical light with deep aquatint shadow and brightly lit caricatured faces.
  texture_and_material: Lively etched line, aquatint grain, slight plate tone, and occasional hand-tint wash.
  camera_and_composition: Stage-like composition with a main caricatured figure or group and receding secondary grotesques.
  atmosphere_and_mood: Mocking, grotesque, darkly funny, and sharp.
  rendering_and_quality: 'Refined old print quality: exaggerated but controlled drawing, readable groups, no digital noise.'
