visualDna:
  aesthetic: >-
    A grounded dark-fantasy illustration governed by old-master tonal hierarchy: natural color,
    deliberate shadow grouping, a small number of highly finished focal details, and believable but
    consciously composed forms. It translates Diablo IV's handcrafted dark-medieval art direction
    without inheriting the game's camera or real-time rendering.
  subject_treatment: >-
    Preserve explicit identity, action and count. Design unspecified forms with heavy believable
    anatomy, broad worn cloth and armor masses, severe archaic ornament and restrained sacred or
    infernal motifs that belong to the subject.
  color_and_tone: >-
    Region-sensitive natural color: dusty ochre, oxidized warmth, dull carmine and bone; colder
    scenes use pale grass and foggy blue-grey. Restrained saturation and rich deep shadows,
    preserving explicit colors.
  lighting_and_shadow: >-
    Build controlled directional light and deep but legible shadows, with atmospheric light or wet
    reflections only when the requested scene supports them. A warm fire-lit interior can contrast a
    cooler exterior, but neither weather nor a fire source is mandatory.
  texture_and_material: >-
    Make material identity and deliberate construction visible through painted value and edge
    changes: rough stone, salvaged wood, leather, metal, skin, fur, and cloth should not collapse
    into one texture. Use wear and dampness where the depicted scene supports them.
  camera_and_composition: >-
    Keep the requested viewpoint and crop. Organize the illustration with an old-master-like tonal
    focal hierarchy, not an imposed ARPG view, cathedral, monster, or cinematic close-up.
  atmosphere_and_mood: >-
    Grim physical humanity under religious and infernal pressure: weight, fatigue, mortality and
    uncertain sanctity. Menacing even in warm light, without requiring one particular character or
    location.
  rendering_and_quality: >-
    Render as a composed painting with broad tonal masses, a restrained edge hierarchy, natural
    local color, and selective fine detail. Do not simulate PBR gloss or copy game-engine
    screenshots; those belong to the paired capture profile.
avoidRules:
  - overriding explicitly requested subject, action, identity, count or camera
  - generic neutral rendering that removes the reference visual grammar
  - unrequested franchise characters, logos or exact scene copies
  - interface overlays, text or frames unless requested
