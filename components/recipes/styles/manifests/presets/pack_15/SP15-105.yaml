visualDna:
  aesthetic:
    Express rave culture through embodied rhythm, narrow UV accents, reflective tape, and fluid
    laser-like color bands that trace and reconnect around existing forms; treat these as controlled
    graphic accents rather than a new venue or lighting rig.
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; carry movement through existing clothing
    seams, reflective marks, and a few bounded light accents. Do not add club scenery or props unless asked.
  color_and_tone:
    Use magenta, electric blue, or acid green as restrained accents against the requested palette and
    tonal range; let one hue lead and do not recolor every surface.
  lighting_and_shadow:
    Preserve the requested key light, exposure, direction, and time of day; confine colored glow to a few
    sharp reflective edges instead of using a whole-scene strobe or neon wash.
  texture_and_material:
    Contrast mesh, vinyl, reflective foil, hand-applied body color, and practical light
    hardware; avoid turning all surfaces into glossy chrome.
  camera_and_composition:
    Use curved light paths and overlapping rhythm bands to suggest collective motion
    while preserving a readable focal silhouette and the user's requested framing.
  atmosphere_and_mood:
    Carry communal release, intensity, and mutual care where the prompt supports it; do
    not equate rave culture with emergency or rescue.
  rendering_and_quality:
    Keep glow bounded, bodies and objects legible, and colored motion shapes distinct;
    use strong light-dark rests so the palette reads at small scale.
avoidRules:
  - a compulsory nightclub, crowd, or rescue scenario
  - uniform neon glow over every surface
  - light trails that erase the focal form
  - global color or lighting changes that replace the requested illumination
