visualDna:
  aesthetic: 'In-game screenshot look informed by Monster Hunter: World gameplay: third-person beast-hunt capture with enormous creature scale, open biomes, weapon commitment, scout trails, and campsite expedition logic. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Monster Hunter: World-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Monster Hunter: World-informed palette: storm grey, moss green, hide brown, bone white,
    lightning violet, and orange campfire accents. Keep value grouping legible at gameplay distance,
    with color accents behaving like route, danger, pickup, team, magic, or objective cues rather
    than decorative wash.
  lighting_and_shadow: >-
    Light the image through weather flashes, dappled forest/plains light, monster attack glow, camp
    torches, and dust from heavy movement. Lighting must clarify the playable route, threat, focal
    subject, or objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from scaled hides, giant weapons, leather straps, mud, grass, claws, field gear,
    and tactile creature anatomy. Materials should feel like in-engine game assets captured during
    play, with enough texture identity to separate props, terrain, characters, hazards, and
    interactables.
  camera_and_composition: >-
    Compose with third-person hunt camera with player small against monster, attack telegraphs,
    terrain use, and readable chase paths. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Monster Hunter: World-derived mood: predatory, adventurous, physical, dangerous, and ecological; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: health/stamina, minimap, item
    bar, monster status, and damage numbers can appear if they support hunt readability. Maintain
    heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake logos,
    stock-photo polish, or random interface clutter.
  key_features: >-
    Monster Hunter: World gameplay screenshots; third-person beast-hunt capture with enormous
    creature scale, open biomes, weapon commitment, scout trails, and campsite expedition logic;
    storm grey, moss green, hide brown, bone white, lightning violet, and orange campfire accents;
    weather flashes, dappled forest/plains light, monster attack glow, camp torches, and dust from
    heavy movement; scaled hides, giant weapons, leather straps, mud, grass, claws, field gear, and
    tactile creature anatomy; third-person hunt camera with player small against monster, attack
    telegraphs, terrain use, and readable chase paths; predatory, adventurous, physical, dangerous,
    and ecological; HUD guidance: health/stamina, minimap, item bar, monster status, and damage
    numbers can appear if they support hunt readability
  creative_brief: "Monster Hunter Thunder Plains: in-game screenshot language informed by Monster Hunter: World, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
