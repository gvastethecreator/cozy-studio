visualDna:
  aesthetic: 'Bauhaus design: primary shapes, clean grids, sans-serif-era modernism reduced to circle, square and triangle.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: the subject is simplified into circles, squares, triangles and bold bars arranged on a clean grid."
  color_and_tone: Red, yellow, blue, black and off-white, used consistently across subject and background.
  lighting_and_shadow: Flat, shadowless color, expressed through the style rather than photographic lighting.
  texture_and_material: Flat printed color with crisp geometric edges, visible at card size as the signature of the style.
  camera_and_composition: Balanced asymmetric grid composition, arranged so the subject still reads at card size.
  atmosphere_and_mood: Rational, bold, modern and clear, driven by the construction, color and rhythm.
  rendering_and_quality: Crisp poster-like finish, with clean, deliberate marks and no accidental noise.
  key_features: circle square triangle; primary colors; clean grid; flat shapes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Bauhaus Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - readable text
  - logo
  - real artist signature
  - copying a specific famous artwork
  - muddy noisy texture
  - organic
  - messy
  - realistic perspective
  - generic polygon filter
  - literal card scene
  - style-card boilerplate
  - muddy noise
  - watermark
  - text
  - readable labels
  - UI overlay
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
