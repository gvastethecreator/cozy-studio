visualDna:
  aesthetic: >-
    Render simplified three-dimensional volumes with softened edges, matte surfaces and short contact
    shadows, keeping scale legible without miniature-scene cues.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Simplify volume
    without changing the subject into architecture, a diorama or a miniature.
  color_and_tone: >-
    Retain the requested palette and use subtle value variation across broad surfaces; do not force a
    narrow palette or color treatment.
  lighting_and_shadow: >-
    Follow the requested light direction and use compact contact shadows only where forms meet. Do not
    add a staged light source, elevated viewpoint or tilt-shift blur.
  texture_and_material: >-
    Keep materials matte and surface variation small in scale. Preserve differences among the requested
    materials instead of applying one finish everywhere.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and spatial relationships. Clear scale does not
    prescribe a camera height or a constructed setting.
  atmosphere_and_mood: >-
    Retain the requested setting and mood. Soft volumes do not add architecture, vegetation or a
    construction scene.
  rendering_and_quality: >-
    Use softened but controlled edges, readable contact and broad surface variation. Keep detail
    subordinate so the overall scale remains understandable.
avoidRules:
  - unrequested scene construction or change of scale
  - camera or layout changes not requested by the user
  - details that alter identity or function
