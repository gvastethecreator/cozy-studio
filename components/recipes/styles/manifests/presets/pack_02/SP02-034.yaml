visualDna:
  aesthetic: 'Moody miniature stop-motion: handcrafted puppets with replacement faces animated frame by frame in dark, detailed miniature sets.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Muted teal, plum and ochre with warm practical lights; deep shadows.
  lighting_and_shadow: Tiny practical lamps and hard studio spots at miniature scale, crisp shadows, pools of warm light.
  texture_and_material: Fingerprints in clay, knitted and felted costumes, carved wood, visible seams on faces.
  camera_and_composition: Shallow macro depth of field that reveals the miniature scale, low angles among the sets.
  atmosphere_and_mood: Eerie and tender, handmade dread with a beating heart.
  rendering_and_quality: Physical stop-motion look with slight frame jitter; not smooth CG.
  key_features: handcrafted puppets; replacement-face seams; miniature practical lights; macro shallow focus; tactile fabrics
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Moody Miniature Stop-Motion as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
