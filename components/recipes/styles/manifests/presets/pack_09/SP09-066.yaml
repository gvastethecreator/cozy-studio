visualDna:
  aesthetic: 'Beach sand: fine packed sand sculpted into the target, with grain texture and crumbling edges.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is sculpted from packed beach sand with crumbling edges and fine grain.'
  color_and_tone: Warm beige, golden and wet darker sand, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Low sun raking the grains, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Packed fine sand grains with crumbling edges and shell fragments.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Fleeting, playful, warm and fragile, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: packed sand sculpture; crumbling edges; fine grains; wet and dry tones
  creative_brief: "Beach sand: fine packed sand sculpted into the target, with grain texture and crumbling edges. Carry it through packed sand sculpture, crumbling edges, fine grains, wet and dry tones. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
