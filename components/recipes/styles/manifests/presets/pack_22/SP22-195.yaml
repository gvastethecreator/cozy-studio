visualDna:
  aesthetic: >-
    Layered relief cues use broad raised planes and consistent edge thickness where forms overlap,
    with color and surface detail kept subordinate to the subject.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Show depth at existing overlaps
    without rebuilding the scene as a physical model.
  color_and_tone: >-
    Keep the requested palette and color relationships. Render edge planes with nearby colors rather
    than forcing a cardboard brown or painted craft palette.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use small contact shadows to clarify existing
    overlaps without adding a fixed light source.
  texture_and_material: >-
    Keep edge thickness restrained and surface texture compact. Preserve requested materials; do not
    replace the whole scene with cardboard or packaging.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Do not convert the image into a package,
    frame, page or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Relief cues describe depth without adding a diorama or new
    background context.
  rendering_and_quality: >-
    Resolve silhouette and broad planes first, then add visible edge cues only at relevant overlaps.
    Avoid uniform thickness that makes every element look assembled.
avoidRules:
  - packaging or diorama reconstruction
  - cardboard material applied indiscriminately across the scene
  - unrequested frame, lettering or layout
