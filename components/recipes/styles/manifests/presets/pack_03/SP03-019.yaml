visualDna:
  aesthetic: 'Hologram material: the target rebuilt from projected light — translucent, scanlined and flickering — standing on its projector beam.'
  subject_treatment: Change only the material of the prompt's main subject (or the object the prompt names) into this material; its shape, pose, surroundings, lighting setup and camera stay as requested.
  color_and_tone: Cyan and blue light with magenta interference fringes, darker transparent interior.
  lighting_and_shadow: The hologram emits light but casts no shadow; faint beam from a base below.
  texture_and_material: Horizontal scanlines, glitch offsets, see-through edges brighter than the core.
  camera_and_composition: Keep the requested framing; the surroundings visible through the target.
  atmosphere_and_mood: Futuristic and ghostly, present and absent at once.
  rendering_and_quality: Additive light projection with scanlines; no readable interface text.
  key_features: translucent projected light; scanlines; flicker glitch offsets; bright fresnel edges; no cast shadow
  creative_brief: "Hologram material: the target rebuilt from projected light — translucent, scanlined and flickering — standing on its projector beam. Carry it through translucent projected light, scanlines, flicker glitch offsets, bright fresnel edges, no cast shadow. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
