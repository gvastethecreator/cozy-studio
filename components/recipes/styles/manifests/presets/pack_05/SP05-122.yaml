visualDna:
  aesthetic: >-
    Build the graphic anime treatment from rough hard contours with short, jagged marks and blocky
    planes with uneven breaks and compressed shapes. Let abrupt starts, abrupt halts, and compact
    reverberations set its rhythm; use soot gray and dull rust with fluorescent yellow-green
    accents for color and matte scuffing, smeared dry texture, and sparse fluorescent streaks for
    finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use rough hard contours with short, jagged marks
    for edge work, blocky planes with uneven breaks and compressed shapes for form simplification,
    and abrupt starts, abrupt halts, and compact reverberations only where movement is already
    requested.
  color_and_tone: >-
    Build value groups with soot gray and dull rust with fluorescent yellow-green accents. Place
    the strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: irregular fluorescent contrast against deep, stable shadow masses.
    Keep shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with matte scuffing, smeared dry texture, and sparse fluorescent
    streaks, preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use tight off-center grouping with broken lines and
    compressed margins to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey worn tension and dry absurdity, while preserving
    the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with grain confined to selected shadows, with the main silhouette kept clear; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    rough hard contours with short, jagged marks; blocky planes with uneven breaks and compressed
    shapes; soot gray and dull rust with fluorescent yellow-green accents; abrupt starts, abrupt
    halts, and compact reverberations; matte scuffing, smeared dry texture, and sparse fluorescent
    streaks; tight off-center grouping with broken lines and compressed margins.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with rough hard contours
    with short, jagged marks, blocky planes with uneven breaks and compressed shapes, and soot
    gray and dull rust with fluorescent yellow-green accents; use abrupt starts, abrupt halts, and
    compact reverberations only where movement is already present, and apply matte scuffing,
    smeared dry texture, and sparse fluorescent streaks as the drawing finish.
