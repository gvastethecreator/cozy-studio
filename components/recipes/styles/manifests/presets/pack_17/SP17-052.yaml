  lighting_and_shadow: Flat ominous light with ember accents, hard silhouette cuts, and charred edge contrast.
  texture_and_material: Burnt paper, bone markers, soot, scratched ink, brass pins as abstract dots, and dry ash.
  camera_and_composition: Topographic tension, diagonal siege pressure, symbolic spacing, and map-like composition that remains textless and adapts to any subject.
