visualDna:
  aesthetic: >-
    Burlap Sack turns material failure into the main visual language: start from Potato sack, Rough
    fiber, and Loose weave, then turn damage history, contamination, corrosion, staining, abrasion,
    and material breakdown into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Coarse weave: preserve identity and pose while letting
    forms age, stain, corrode, abrade, swell, chip, or collapse through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Tan, Brown as the material palette, with controlled value separation, local color variation,
    and hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Burlap Sack without hiding the prompt subject.
  texture_and_material: >-
    Render Rough fiber through layer loss, residue buildup, chipped edges, stains, cracks, and
    uneven surface failure; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Loose weave as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Poor, rural by using neglect, time, moisture, heat, friction, and environmental
    pressure; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Rustic, cheap material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Potato sack; Coarse weave; Rough fiber; Matte; Loose weave
  creative_brief: >-
    Route any subject through Burlap Sack as a transferable weathering-and-decay visual system while
    preserving the prompt's subject, action, and setting. Capture the rough honesty of burlap where
    coarse jute fibers interlace in a grid of tan and brown utility, each thread a visible record of
    plant turned to purpose. The surface must feel dry and scratchy to the eye, a loose weave that
    hints at the grain it once carried. Render the dignity of the cheap and functional, beauty found
    in necessity's simplest weave. Use Burlap Sack as portable surface/render behavior over any
    input: map its texture, light response, edge wear, color chemistry, and tactile rhythm onto the
    subject instead of requiring a literal material sample, macro tile, wall, landscape, source
    object, or scene where the material naturally appears.
