visualDna:
  aesthetic: 'Kodak Portra 400 color negative: a forgiving portrait stock rated at 400 and usually overexposed by a stop, giving creamy low-contrast color and flattering skin.'
  subject_treatment: Keep the prompt subject, action, setting and framing; change only the capture — emulsion color, grain, contrast curve, halation and lens behavior — so the named film or process is the first read. Do not age the costume, props or setting to match the film, and do not add frame borders, rebates or sprocket holes.
  color_and_tone: Peach and apricot skin, warm neutral whites, pastel highlights that roll off instead of clipping, soft sage greens and muted blues; shadows lifted and slightly warm.
  lighting_and_shadow: 'Wide latitude: bright skies and faces both hold detail; shadows open rather than crushed, highlight shoulder gentle.'
  texture_and_material: Fine, even, tight grain visible in flat midtones and skies; no digital smoothing on skin.
  camera_and_composition: Keep the requested framing; 35 mm or 120 rendering with natural lens falloff and modest depth of field.
  atmosphere_and_mood: Tender and unhurried, warmth and softness keeping every edge gentle.
  rendering_and_quality: 'Lab-scanned negative look: soft contrast curve, fine grain across the frame, no HDR clarity or oversaturation.'
  key_features: overexposed color negative; peach skin tones; pastel highlight rolloff; lifted warm shadows; fine even grain
  creative_brief: "Kodak Portra 400 color negative: a forgiving portrait stock rated at 400 and usually overexposed by a stop, giving creamy low-contrast color and flattering skin. Carry it through overexposed color negative, peach skin tones, pastel highlight rolloff, lifted warm shadows, fine even grain. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
