visualDna:
  aesthetic: Clinical thriller ink that maps fine branching seam lines and pale faceted planes across the surface of objects and architecture, like a dissection diagram drawn on porcelain, without revealing any interior.
  subject_treatment: Redraw the prompt's nonhuman subject or object and its setting in this treatment; the image stays free of people, and a gentle prompt stays gentle in content.
  color_and_tone: Bone, ceramic gray and pale celadon, with a very limited crimson stress accent at one seam junction.
  lighting_and_shadow: Precise pale edge glints against soft shadow under even cabinet light, with no spotlight.
  texture_and_material: Matte porcelain fields, hairline seams of constant width and tiny dry crazing cracks.
  camera_and_composition: Keep the requested framing; seam lines follow the form's own contours and panel breaks, nothing is opened or cut.
  atmosphere_and_mood: Cold, intrusive curiosity about a form studied too closely.
  rendering_and_quality: Precise diagrammatic seams on faceted planes, clean and illustrated rather than a photographed object.
  key_features: branching seam lines on surfaces; pale faceted planes; bone and ceramic gray; single crimson junction; porcelain crazing
  creative_brief: "Clinical thriller ink that maps fine branching seam lines and pale faceted planes across the surface of objects and architecture, like a dissection diagram drawn on porcelain, without revealing any interior. Carry it through branching seam lines on surfaces, pale faceted planes, bone and ceramic gray, single crimson junction, porcelain crazing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
