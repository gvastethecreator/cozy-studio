visualDna:
  aesthetic: 'In-game screenshot look informed by Blasphemous gameplay: dark pixel-art metroidvania capture with Catholic-gothic architecture, grotesque enemies, side-view combat, and ornate suffering iconography. It never recreates an exact official level, character, logo or marketing art.'
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Blasphemous-adjacent game
    screenshot subject: keep clear role silhouette, player/enemy/object function, scale
    relationship, hitbox-like readability, and interaction affordances without copying source
    characters or named IP elements.
  color_and_tone: >-
    Use a Blasphemous-informed palette: bone white, dried blood red, black stone, candle gold,
    desaturated blue, and sickly flesh tones. Keep value grouping legible at gameplay distance, with
    color accents behaving like route, danger, pickup, team, magic, or objective cues rather than
    decorative wash.
  lighting_and_shadow: >-
    Light the image through candle halos, stained light shafts, spell glows, hit flashes, and deep
    basilica shadow. Lighting must clarify the playable route, threat, focal subject, or objective
    and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from detailed pixel masonry, wax, iron, embroidered cloth, thorned relics,
    grotesque bodies, and crunchy sprite animation. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with side-scrolling combat frame with altar depth, enemy spacing, platform edges, and
    boss/arena readability. The frame should read as a plausible gameplay capture; include UI/HUD
    only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: 'Blasphemous-derived mood: penitent, brutal, sacred, grotesque, and solemn; it follows the tone of the requested scene without forcing a fixed mission or story.'
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: health/fervor bars, flask
    icons, and boss bar can appear as ornate pixel UI. Maintain heavy-denoise clarity, crisp focal
    hierarchy, readable gameplay scale, and no fake logos, stock-photo polish, or random interface
    clutter.
  key_features: >-
    Blasphemous gameplay screenshots; dark pixel-art metroidvania capture with Catholic-gothic
    architecture, grotesque enemies, side-view combat, and ornate suffering iconography; bone white,
    dried blood red, black stone, candle gold, desaturated blue, and sickly flesh tones; candle
    halos, stained light shafts, spell glows, hit flashes, and deep basilica shadow; detailed pixel
    masonry, wax, iron, embroidered cloth, thorned relics, grotesque bodies, and crunchy sprite
    animation; side-scrolling combat frame with altar depth, enemy spacing, platform edges, and
    boss/arena readability; penitent, brutal, sacred, grotesque, and solemn; HUD guidance:
    health/fervor bars, flask icons, and boss bar can appear as ornate pixel UI
  creative_brief: "Blasphemous Basilica Last Stand: in-game screenshot language informed by Blasphemous, covering camera, HUD grammar, material language, color coding, encounter readability, and in-engine finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact characters, exact levels, and promotional key art. A reusable, transferable visual system for any subject, keeping that subject's identity, action and setting."
