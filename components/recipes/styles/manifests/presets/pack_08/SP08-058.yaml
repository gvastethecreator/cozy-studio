visualDna:
  aesthetic: 'Sequin couture: garments covered in overlapping sequins or paillettes that scatter points of light.'
  subject_treatment: "Make the prompt's garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments covered edge to edge in overlapping sequins or paillettes that shift color and sparkle with movement."
  color_and_tone: Gold, silver, midnight blue or ruby with scattered sparkle.
  lighting_and_shadow: Hard points of light and spotlights creating glitter, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Overlapping sequins and paillettes with individual reflections, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Glamorous, festive, dazzling and theatrical, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: overlapping sequins; scattered sparkle; spotlight glitter; shifting color
  creative_brief: "Sequin couture: garments covered in overlapping sequins or paillettes that scatter points of light. Carry it through overlapping sequins, scattered sparkle, spotlight glitter, shifting color. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
