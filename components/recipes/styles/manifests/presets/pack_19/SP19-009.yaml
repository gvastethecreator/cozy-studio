visualDna:
  aesthetic: Direct wet-ink illustration with parallel channels pulled through broad deposited masses.
  subject_treatment:
    Keep the requested identity and proportions. Establish solid form first, then rake short
    directional channels through selected masses to reveal planes and internal structure.
  color_and_tone:
    Honor the requested palette. Use deposited ink for dark anchors and exposed support in pulled
    channels for light; avoid changing the subject's named colors.
  lighting_and_shadow:
    Follow the requested light direction by varying channel spacing and mass coverage within
    existing planes. Do not add a new source to justify the marks.
  texture_and_material:
    Make the pulled channels visibly parallel within each local passage, with wet-ink ridges at
    their ends. Change direction by form; do not cover the entire image with one comb pattern.
  camera_and_composition:
    Preserve the requested camera and composition. Restrict raked marks to selected planes so
    major silhouette and negative-space decisions remain clear.
  atmosphere_and_mood:
    Let alternating solid masses and opened channels support the requested mood without adding
    craft tools, an archival setting or a required scene.
  rendering_and_quality:
    Keep channels distinct enough to describe volume at reduced size. Avoid uniform striping,
    accidental cuts across identity-defining features and decorative text.
avoidRules:
  - uniform full-frame striping
  - channels that cut through identity-defining details
  - unrequested labels or craft tools
