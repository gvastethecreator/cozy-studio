visualDna:
  aesthetic: 'Late-night infomercial gloss: an overlit demonstration set where a miracle product performs, surrounded by starbursts and arrows.'
  subject_treatment: Keep the prompt subject, action and setting; render them as a frame of this broadcast format, without adding a presenter, host, audience or readable caption the prompt did not ask for.
  color_and_tone: Hot red, yellow and blue graphics over bright white; glossy saturated products.
  lighting_and_shadow: Overlit high-key from every direction; hard specular gloss on the product.
  texture_and_material: Chrome, plastic, bubbling liquids and spotless counters, with glossy sheen.
  camera_and_composition: Product front and center, textless starburst and arrow callout shapes pointing at it.
  atmosphere_and_mood: Frantic and overexcited, every second a miracle demonstration.
  rendering_and_quality: Glossy late-night video with callout shapes that stay textless.
  key_features: overlit demo set; textless starburst callouts; glossy product; hot primaries; frantic energy
  creative_brief: "Late-night infomercial gloss: an overlit demonstration set where a miracle product performs, surrounded by starbursts and arrows. Carry it through overlit demo set, textless starburst callouts, glossy product, hot primaries, frantic energy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
