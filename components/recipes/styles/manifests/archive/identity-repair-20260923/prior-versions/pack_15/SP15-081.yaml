visualDna:
  aesthetic: >-
    A hand-built industrial illustration language driven by visible pressure systems: interlocking gear
    arcs, valve geometry, articulated joints and curved channels integrated into existing forms.
  subject_treatment: >-
    Preserve the requested subject, silhouette, proportions, pose, action and part connections. Translate
    existing contours into a few articulated joints, pressure channels or stepped housings where they
    fit; never replace the subject with machinery.
  color_and_tone: >-
    Anchor warm brass and copper against soot-dark iron and aged ivory, with one restrained accent.
    Preserve explicit requested colors and keep focal, supporting and shadow values distinct.
  lighting_and_shadow: >-
    Follow the requested light direction. Use broad warm edge planes on existing metal forms and clear
    soot-gray shadow shapes; do not add a glow source, steam or time of day.
  texture_and_material: >-
    Respect the materials the prompt supplies. Where metal is present, distinguish brushed brass,
    patinated copper and cast iron with local scuffs, enamel details or restrained pigment grain; keep
    fasteners sparse and legible.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop and placement. Use overlapping mechanical curves and diagonal
    channels only where they can be mapped to existing forms, keeping the requested subject dominant and
    negative space open.
  atmosphere_and_mood: >-
    Suggest ingenious, hands-on resistance through visible joins, pressure rhythm and warm-cool material
    contrast. Keep the requested tone; do not imply a Victorian era, labor scene or civic setting.
  rendering_and_quality: >-
    Use matte screenprint-to-gouache shapes, clean contour bands, broad color planes and controlled wear.
    Vary detail scale; avoid micro-rivet noise, pasted grime and photorealistic rendering.
avoidRules:
  - Do not introduce a Victorian room, foundry, workshop or fixed cast unless requested.
  - Do not replace an unrelated subject with a gear, boiler, automaton or printing machine.
  - Avoid dense rivet wallpaper, pasted grime and readable labels or logos.
