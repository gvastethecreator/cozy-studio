visualDna:
  aesthetic: >-
    Vast mythic medieval epic where gold sigils, ruined kingdoms, and divine weather dominate the
    frame.
  subject_treatment: >-
    Transform any subject with gilded rune-epic language using oathlike glow, antlered or halo-like
    geometry as optional shape rhythm, legendary vertical elegance, gold-on-stone authority, and
    divine ruin scale without forcing an oracle figure.
  color_and_tone: >-
    Weathered gold, storm blue, moss green, bone white, and blackened umber with radiant rune
    accents.
  lighting_and_shadow: >-
    Holy rim light breaks through clouds, with long shadows and glowing inscriptions as secondary
    light sources.
  texture_and_material: Engraved metal, mossy stone, torn banners, ancient parchment, and luminous etched rune lines.
  camera_and_composition: >-
    Heroic scale through wide negative planes, centered relic hierarchy, gilded vertical accents,
    and mythic distance pressure that adapts to the prompt subject.
  atmosphere_and_mood: >-
    Carry the prompt through Grand, elegiac, haunted, and ancient, with wonder balanced by ruin;
    ruined majesty, moral dread, sacred pressure, weathered myth, and restrained grimdark wonder
    without gore shortcuts; the tone should follow prompt X while preserving the preset's
    medieval-zine identity.
  rendering_and_quality: >-
    High-detail fantasy illustration with painterly polish, ornate surfaces, and readable
    silhouettes.
  creative_brief: >-
    Route any subject through gilded rune epic grandeur: preserve the prompt while adding golden
    myth, oathlike rune geometry, divine ruin, and colossal medieval scale without copying a
    specific franchise or card figure. Apply after prompt X: prompt X supplies subject, action,
    setting, tone, and intensity, while this preset supplies a style grammar of Gilded Rune Epic;
    Vast mythic medieval epic where gold sigils; ruined kingdoms; divine weather dominate the frame;
    antlered or halo like geometry as optional shape rhythm; legendary vertical elegance, mood,
    material behavior, framing logic, and denoised medieval-zine finish without requiring a fixed
    cast, fixed relic, fixed monster, readable text, or sample-card composition.
  key_features: >-
    Gilded Rune Epic; Vast mythic medieval epic where gold sigils; ruined kingdoms; divine weather
    dominate the frame; antlered or halo like geometry as optional shape rhythm; legendary vertical
    elegance
