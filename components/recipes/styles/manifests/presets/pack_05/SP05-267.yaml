visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around one or two controlled
    carmine ink strokes that split, taper, and feather into dry pigment along existing
    edges. For color and surface, preserve the requested palette and reserve
    carmine, oxblood, or warm red for narrow value accents rather than literal blood.
    Severance can be expressed as an abrupt break in visual continuity; preserve the
    prompt's mood and avoid assuming violence
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through one or two controlled carmine ink
    strokes that split, taper, and feather into dry pigment along existing edges; use
    detail selectively and keep the actual form easy to read. Add no unrequested subject
    or action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; preserve the requested
    palette and reserve carmine, oxblood, or warm red for narrow value accents rather
    than literal blood. Keep values legible across the prompted light and dark range; do
    not crush midtones or dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; use a slim raking highlight to
    distinguish the ink edge from its ground while keeping the original illumination
    intact. Keep shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; combine dense black ink with a limited capillary
    feather and dry paper bite; keep all marks non-gory and material-aware. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; let the
    red stroke support the existing focal path without adding injury cues or a new
    gesture. Use the mark rhythm inside the supplied composition rather than replacing
    it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Severance can be expressed as an abrupt
    break in visual continuity; preserve the prompt's mood and avoid assuming violence.
    Darkness and tension are optional tonal pressure, never a requirement to add danger
    or rewrite the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and one or two controlled carmine ink strokes
    that split, taper, and feather into dry pigment along existing edges; keep focal
    edges crisp, texture controlled, and dark values legible. Avoid photoreal or
    3D-render drift, watermark, logo, and fake readable text.
  key_features: >-
    one or two controlled carmine ink strokes that split, taper, and feather into dry
    pigment along existing edges; preserve the requested palette and reserve carmine,
    oxblood, or warm red for narrow value accents rather than literal blood; use a slim
    raking highlight to distinguish the ink edge from its ground while keeping the
    original illumination intact; combine dense black ink with a limited capillary
    feather and dry paper bite; keep all marks non-gory and material-aware; and let the
    red stroke support the existing focal path without adding injury cues or a new
    gesture. The five cues should read as one mark-and-value system, not as extra scene
    content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use one or two controlled carmine ink strokes
    that split, taper, and feather into dry pigment along existing edges, preserve the
    requested palette and reserve carmine, oxblood, or warm red for narrow value accents
    rather than literal blood, use a slim raking highlight to distinguish the ink edge
    from its ground while keeping the original illumination intact, and combine dense
    black ink with a limited capillary feather and dry paper bite; keep all marks
    non-gory and material-aware; the prompt supplies all scene content. Do not add
    unrequested characters, objects, source-specific lore, readable symbols, or a
    default action.
