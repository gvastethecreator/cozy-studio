visualDna:
  aesthetic: >-
    Smoke/Fog behaves like a controlled elemental effect layer: start from Thick fog, Gaseous, and
    Turbulence, then turn motion, temperature, particles, translucency, refraction, glow, and
    transient energy behavior into portable surface behavior rather than a literal material sample.
  subject_treatment: >-
    Transform any prompt subject through Soft gradients: preserve identity and pose while letting
    forms emit, flow, spark, vaporize, splash, glow, or scatter through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Grey, White as the material palette, with controlled value separation, local color
    variation, and hue shifts that follow the subject's form rather than flattening it into a pasted
    texture.
  lighting_and_shadow: >-
    Let Diffused define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Smoke/Fog without hiding the prompt subject.
  texture_and_material: >-
    Render Gaseous through flow direction, particle density, turbulence, glow falloff, splashes,
    trails, and vapor edges; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Turbulence as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Mysterious, blind by using movement, danger, spectacle, instability, temperature,
    and sensory intensity; the material should color the scene's feeling while preserving the user's
    requested subject and setting.
  rendering_and_quality: >-
    Finish with Atmospheric, soft material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Thick fog; Soft gradients; Gaseous; Diffused; Turbulence
  creative_brief: >-
    Route any subject through Smoke/Fog as a transferable elemental/FX visual system while
    preserving the prompt's subject, action, and setting. Apply thick fog as volumetric treatment
    around the input: grey-white gradients, softened edges, staged loss of detail, cool damp
    density, and slow turbulence veiling form. Preserve recognizable subject cues as half-seen
    silhouettes or partial contours; avoid replacing the input with empty mist unless the prompt
    already asks for abstraction.
avoidRules:
  - hard-edged clutter
  - wrong material
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
