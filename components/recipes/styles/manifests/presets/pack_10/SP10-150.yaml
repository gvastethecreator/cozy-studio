visualDna:
  aesthetic: 'Micro-mosaic: tiny glass rods cut into minute tesserae, painterly and fine.'
  subject_treatment: "Rebuild the prompt's subject and setting entirely from discrete units so it stays recognizable at card size — unit: minute glass smalti cut from rods; joints: nearly invisible joints."
  color_and_tone: Rich painterly colors, with each unit holding one color so the image is built by juxtaposition.
  lighting_and_shadow: Soft glassy sheen, as the physical behavior of this unit.
  texture_and_material: minute glass smalti cut from rods, set with nearly invisible joints, at a unit size that keeps the subject readable.
  camera_and_composition: Keep the prompt framing; unit size and direction follow the subject contours so forms read clearly.
  atmosphere_and_mood: Precious, delicate, refined and patient, coming from the handcrafted construction.
  rendering_and_quality: Crisp, consistent units and joints across the whole image, with no smeared or random fill.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Micro-Mosaic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: minute smalti; painterly fine
