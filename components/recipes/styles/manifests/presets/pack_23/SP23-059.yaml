visualDna:
  aesthetic: 'Carolingian classical miniature: book painting that revives late antique modeling, sketchy illusionistic brushwork, draped figures and architecture under soft purple and gold.'
  subject_treatment: Preserve the requested identity, count, pose and action with original figures; give figures classical drapery folds and lively sketchy modeling with antique poise.
  color_and_tone: Purple, ochre, muted green and flesh tones with touches of burnished gold.
  lighting_and_shadow: Soft illusionistic modeling with quick white highlights on drapery.
  texture_and_material: Loose brushwork on vellum, feathery strokes and slightly flaking gold.
  camera_and_composition: Figures under painted arches or in shallow stage-like space.
  atmosphere_and_mood: Keep the requested mood with dignified antique grandeur.
  rendering_and_quality: Painterly and quick, never smooth or photographic, kept consistent across the whole image.
  creative_brief: "Carolingian classical miniature: book painting that revives late antique modeling, sketchy illusionistic brushwork, draped figures and architecture under soft purple and gold. Carry it through classical drapery, sketchy modeling, painted arches, purple and gold. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
