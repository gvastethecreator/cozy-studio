visualDna:
  aesthetic: 'Mylar foil balloon: the subject rebuilt as an inflated metallic-foil balloon, two flat sheets heat-sealed at the rim and puffed into soft pillowed forms.'
  subject_treatment: Keep the prompt subject, action, pose, setting and camera view and rebuild its surfaces in this organic CGI method; never force a T-pose and never turn a requested object into an avatar.
  color_and_tone: Mirror silver, gold, rose gold or candy-tinted foil reflecting the surroundings in warped color.
  lighting_and_shadow: Bright studio or party lights producing broad warped reflections and hot specular spots along the curves.
  texture_and_material: Crimped heat-sealed edge seams, radial pinch wrinkles where forms narrow, a small valve tail and no hard volumes.
  camera_and_composition: Keep the requested view; the flat-sided pillowed profile reads clearly and floats slightly.
  atmosphere_and_mood: Festive and slightly absurd, a celebration you could pop with a pin.
  rendering_and_quality: Thin inflated foil with seams and wrinkles, distinct from twisted latex balloon animals and from solid chrome.
  key_features: heat-sealed crimped rim seam; pillowed flat-sheet volumes; pinch wrinkles; warped mirror reflections; floating lightness
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mylar Foil Balloon Render as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
