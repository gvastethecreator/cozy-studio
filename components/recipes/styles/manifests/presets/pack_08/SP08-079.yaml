visualDna:
  aesthetic: Refractive veil design uses transparent fabric, lens-like bending and prismatic edge shifts to create concealment cues while retaining a present, readable wearer.
  subject_treatment: Apply optical distortion to requested veil or garment panels, bending the visible background through their surface. Keep face, pose and overall contour readable unless complete concealment is explicitly requested.
  color_and_tone: Keep the material mostly transparent with small spectral edge colors; adapt the refraction hue to the prompt and avoid tinting unrelated surfaces.
  lighting_and_shadow: Preserve the scene's light and use localized lens glints or caustic edges on refractive fabric. Do not warp the whole environment or add a stealth scene.
  texture_and_material: Use sheer organza, fine refractive film or liquid-crystal-like layers with heat-shimmer ripples and glass-like edge highlights, never a rigid glass shell by default.
  camera_and_composition: Preserve crop, viewpoint and pose. Keep transparent panels aligned to the garment and subject; do not make the wearer vanish or change camera perspective.
  atmosphere_and_mood: Suggest elusive elegance through a slight contour break and refracted color, without assigning camouflage, espionage or a hidden identity.
  rendering_and_quality: Keep distortion localized and internally consistent; preserve facial and fabric detail around the refractive edge.
  key_features: Transparent veil panels; lens-bent contour edges; localized background displacement; fine prismatic fringe.
  creative_brief: "Add refractive veil surfaces to the requested clothing with transparent panels, subtle lens bending and prismatic edges. Preserve wearer, identity, pose, role, scene and frame; keep concealment localized unless total invisibility is explicitly requested. Use it as a reusable look on any subject."
avoidRules:
  - fully opaque normal fabric
  - generic cosplay
  - plastic toy armor
  - muddy fantasy outfit
  - fixed outfit
