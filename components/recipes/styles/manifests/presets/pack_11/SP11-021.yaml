visualDna:
  aesthetic: 'Sticker art: die-cut vinyl sticker with thick white border and glossy print.'
  subject_treatment: "Rebuild the prompt's subject as a physical crafted object made this way, keeping its identity, pose and action readable: printed as a die-cut vinyl sticker with a thick white border."
  color_and_tone: Bold flat colors with white border, true to the craft material rather than the original subject palette.
  lighting_and_shadow: Glossy light on vinyl, like a tabletop product or studio photograph of the craft object.
  texture_and_material: Glossy vinyl and white border, showing how the object was actually made.
  camera_and_composition: Tabletop or studio framing at the craft object's real scale, close enough that joins, stitches or seams read at card size.
  atmosphere_and_mood: Playful, bold, graphic and collectible, coming from the handmade or toy quality.
  rendering_and_quality: Photoreal craft-object rendering with believable scale, material detail and construction evidence.
  key_features: die-cut sticker; white border; glossy
  creative_brief: "Sticker art: die-cut vinyl sticker with thick white border and glossy print. Carry it through die-cut sticker, white border, glossy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
