visualDna:
  aesthetic:
    Break a clean digital image locally with displaced RGB contours, compression blocks, clipped pixel
    clusters, and interrupted interface-like fragments, keeping most of the subject's structure stable.
  subject_treatment:
    Preserve the requested subject, identity, and action; offset only selected edges, reflections,
    or secondary details so corruption reads as a deliberate digital disturbance rather than anatomy damage.
  color_and_tone:
    Use a stable base palette with brief cyan, magenta, or red channel slips; keep the main value
    grouping coherent and avoid converting every region into neon.
  lighting_and_shadow:
    Maintain the underlying light logic and use channel offsets as graphic edge events;
    do not let glitch marks act as an all-over lighting effect.
  texture_and_material:
    Contrast clean rendered regions with sparse pixel stair-steps, compression smears,
    and raster breaks; avoid analog dust, film grain, and physical paper textures.
  camera_and_composition:
    Preserve the requested camera and silhouette; use a few short horizontal or stepped
    disruptions, with negative space around the focal form.
  atmosphere_and_mood:
    Create unstable, rebellious digital energy without implying a specific device, game
    interface, or cyberpunk city.
  rendering_and_quality:
    Keep corruption sharply localized and the core subject readable at thumbnail scale;
    preserve facial, limb, and object continuity.
avoidRules:
  - global image tearing or unreadable pixel noise
  - analog scanlines and monitor frames dominating the image
  - glitch marks that alter identity or anatomy
