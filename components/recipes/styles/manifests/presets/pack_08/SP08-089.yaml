visualDna:
  aesthetic: 'Modest layered tailoring: long, covering silhouettes built from elegant layers — maxi coats, wide trousers, long tunics and draped headscarves — with refined color play.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: long-line layered pieces — maxi coat or abaya-like overlayer, long tunic, wide trousers or maxi skirt and a softly draped headscarf."
  color_and_tone: Tonal layering in sage, dusty rose, sand, navy and cream.
  lighting_and_shadow: Soft, flattering daylight, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Crepe, chiffon, fine wool, silk jersey and satin trims.
  camera_and_composition: Elegant full-length framing that shows the layered silhouette, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Graceful, dignified and serene, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Refined, soft editorial finish, with believable fabric weight, seams and fit detail.
  creative_brief: "Modest layered tailoring: long, covering silhouettes built from elegant layers — maxi coats, wide trousers, long tunics and draped headscarves — with refined color play. Carry it through long-line layers, draped headscarf, tonal color play, wide trousers or maxi skirt, graceful full length. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: long-line layers; draped headscarf; tonal color play; wide trousers or maxi skirt; graceful full length
