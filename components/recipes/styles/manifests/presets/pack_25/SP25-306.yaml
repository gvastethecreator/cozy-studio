visualDna:
  aesthetic: 'Mechanical Index Motion: styleframes of states changing in discrete steps with a short shared settle, like a mechanical flip or dial.'
  subject_treatment: Show the prompt's state change as keyframes of discrete steps with a brief settle, identifiers and order kept and every value exact.
  color_and_tone: Color per supplied state backed by position or label.
  lighting_and_shadow: Constant display light with the moment of change visible.
  texture_and_material: Clean segments or flip panels with crisp, well-defined edges.
  camera_and_composition: Explicit rest positions for each state and one fixed reference.
  atmosphere_and_mood: Step, stop and a small settle with a shared mechanical cadence.
  rendering_and_quality: Crisp keyframes with clear end states and no fake intermediate values.
  creative_brief: "Mechanical Index Motion: styleframes of states changing in discrete steps with a short shared settle, like a mechanical flip or dial. Carry it through discrete steps, brief settle, exact states, fixed reference. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: discrete steps; brief settle; exact states; fixed reference
