visualDna:
  aesthetic: 'Anime action frame staged vertically: the subject rises through stacked horizontal layers of the scene seen from beside, with open space kept above it to pull the eye upward.'
  subject_treatment: Keep the prompt subject, count, action, props and setting; this preset owns the tall vertical layering and rising side-view staging, and adds no opponent, sports gear, extra prop or danger.
  color_and_tone: Keep the prompt palette; values lighten layer by layer toward the top, with restrained white-blue accents at the highest edges.
  lighting_and_shadow: Directional highlights on upward-facing edges; no lightning, flashes or new light sources.
  texture_and_material: Fine vertical motion marks under the rising subject only; surfaces stay clean and layered.
  camera_and_composition: A tall portrait frame from a side-on or slight low angle, the subject in the lower half and at least a third of the frame left open above it.
  atmosphere_and_mood: Lift and ascent carried by spacing and line direction, not by heroics.
  rendering_and_quality: Powerful but controlled contours with clear vertical separation between layers.
  key_features: stacked horizontal layers; subject rising from lower half; open space above; values lightening upward; side-on tall framing
  creative_brief: "Anime action frame staged vertically: the subject rises through stacked horizontal layers of the scene seen from beside, with open space kept above it to pull the eye upward. Carry it through stacked horizontal layers, subject rising from lower half, open space above, values lightening upward, side-on tall framing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
