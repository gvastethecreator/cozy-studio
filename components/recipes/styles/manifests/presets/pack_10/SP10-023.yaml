visualDna:
  aesthetic: >-
    VHS Glitch becomes a transferable digital signal artifact system: start from Bad tracking tape,
    Tracking scars, and Tracking error, then route prompt content through compression errors, scan
    hardware, pixel logic, channel shifts, and broken media encoding without forcing one card scene.
  subject_treatment: >-
    Keep the user's subject recognizable while using Warping at bottom to corrupt, quantize, sort,
    smear, scan, posterize, or channel-split forms without losing silhouette intent; preserve
    anatomy, object identity, or scene intent beneath the abstraction.
  color_and_tone: >-
    Build the palette from Chroma noise, bleeding; bind color to device behavior: phosphor masks,
    CMYK dots, RGB offsets, tape bleed, or indexed palettes, with enough value control that the
    subject remains readable after the style layer is applied.
  lighting_and_shadow: >-
    Let Flicker drive the light response: make light feel emitted, scanned, clipped, banded, or
    sampled rather than normally photographed, avoiding generic glamour lighting unless the prompt
    explicitly asks for it.
  texture_and_material: >-
    Render Static, scanlines as the tactile or mark-making basis; texture should come from pixels,
    scanlines, blocks, dither matrices, data drag, or print dots, scaled to figures, props, spaces,
    or close material studies.
  camera_and_composition: >-
    Compose around Tracking error as reusable spatial grammar: use raster alignment, artifact seams,
    frame tears, grid pressure, and controlled signal breakdown, adapting cleanly to portraits,
    objects, environments, and action scenes.
  atmosphere_and_mood: >-
    Use Nostalgic, horror as the emotional register; derive mood from damaged playback, obsolete
    interfaces, surveillance, latency, and media failure, without flattening strong, strange,
    darker, or adult prompt intent when it is relevant.
  rendering_and_quality: >-
    Resolve as Retro, lo-fi: finish with intentional artifacts, sharp enough structure, and no
    random muddy AI noise, preserving prompt X as the base content and the preset as the style
    router.
  key_features: >-
    Bad tracking tape; Warping at bottom; Chroma noise, bleeding; Flicker; Static, scanlines;
    Tracking error; Nostalgic, horror; Retro, lo-fi; Tracking scars
  creative_brief: >-
    Apply VHS decay as signal damage over the input with bad tracking bands, chroma bleed, scanline
    vibration, bottom-edge warping, magnetic dropout, and lo-fi analog horror nostalgia. If faces or
    figures exist, let scanlines tear through them; otherwise corrupt shapes, surfaces, and edges
    without requiring a portrait or timestamp.
