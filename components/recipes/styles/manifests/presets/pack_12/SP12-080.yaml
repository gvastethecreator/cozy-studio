visualDna:
  aesthetic: >-
    Source-informed video-game style router for original classic soulslike captures: third-person
    old-gen action-RPG play with rough stone, narrow combat routes, fog-gate pressure, stamina
    spacing, hostile ruin geometry, understated HUD, and readable dungeon traversal. Borrow the
    lock-on camera discipline and material restraint associated with Dark Souls-era games, but land
    as a different fictional ruined keep with different enemies, props, architecture, UI icons, and
    route silhouettes. Apply this after prompt X; prompt X supplies the subject, action, setting,
    and intensity while this preset supplies capture language, camera grammar, material behavior,
    playable readability, and finish.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable hollow-keep action-RPG screenshot
    subject: keep clear role silhouette, enemy/player/object function, hitbox-like readability,
    trap or route affordance, and scale relationship without copying source characters or named IP
    elements.
  color_and_tone: >-
    Use a classic soulslike ruin palette: ash grey, dead green, damp stone blue, rust brown, dull
    steel, faded leather, torch amber, and sickly fog white. Keep value grouping legible at gameplay
    distance and avoid black-gold epic polish, neon fantasy accents, or clean heroic color scripts.
  lighting_and_shadow: >-
    Light the image through torch pools, overcast ruin light, fog-gate glow, weapon sparks, hollow
    eyes, and shallow dungeon occlusion. Lighting must clarify the playable route, threat, trap,
    ladder, doorway, or stamina-combat space and avoid eclipse backlight, cathedral god rays, and
    cinematic bloom.
  texture_and_material: >-
    Build surfaces from rough stone blocks, moss, wet stairs, cracked plaster, tarnished chain, old
    cloth, dull shields, rusty blades, simple wood, and old-gen asset limits. Materials should feel
    like in-engine game assets captured during play, not modern ultra-detailed PBR concept art.
  camera_and_composition: >-
    Compose with third-person lock-on or traversal-combat framing: player low in frame, enemy or
    trap ahead, narrow route, ledge/drop/fog gate/lever/ladder as affordance, readable dodge lane,
    and modest HUD. The frame should feel played, not staged as a boss postcard or centered throne
    reveal.
  atmosphere_and_mood: >-
    Carry an original hollow-keep soulslike mood: lonely, punishing, archaic, damp, hostile, and
    quietly tragic. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine gameplay screenshot style, not concept art: small classic souls
    HUD can include health/stamina/focus bars, item slot shapes, lock-on cue, and boss bar only when
    useful. Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, old-gen
    restraint, and no fake logos, modern fantasy key-art polish, or random interface clutter.
  key_features: >-
    original classic soulslike gameplay screenshots; third-person old-gen action-RPG capture with
    rough stone, narrow combat routes, fog-gate pressure, stamina spacing, hostile ruin geometry,
    understated HUD, and dungeon readability; ash grey, dead green, damp stone blue, rust brown,
    dull steel, faded leather, torch amber, and sickly fog white; torch pools, overcast ruin light,
    fog-gate glow, weapon sparks, hollow eyes, and shallow dungeon occlusion; rough stone blocks,
    moss, wet stairs, cracked plaster, tarnished chain, old cloth, dull shields, rusty blades,
    simple wood, and old-gen asset limits; third-person lock-on or traversal-combat framing with
    route affordance and readable dodge lane; lonely, punishing, archaic, damp, hostile, and quietly
    tragic; HUD guidance: small classic soulslike HUD only when useful
  creative_brief: >-
    Use Hollow Keep Lock-On as a transferable game-originals preset. Preserve prompt X, then route
    interpretation through classic soulslike capture references: third-person lock-on camera,
    old-gen material restraint, narrow route readability, fog-gate/trap affordances, stamina-combat
    spacing, and sparse HUD grammar. Avoid menus, logos, exact characters, exact levels, Dark Souls
    level cloning, Elden Ring-style eclipse throne imagery, modern cinematic key art, and
    promotional composition.
