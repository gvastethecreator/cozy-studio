  aesthetic: 'Sergio Toppi page look of the 1970s to 2000s: dense decorative pen hatching, figures fused with landscape, panel borders dissolved into mosaic-like page designs and vast empty white space.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; fuse the subject with the landscape through dense decorative pen hatching and broken panel borders. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink hatching with rare ochre or sepia accents.
  lighting_and_shadow: Flat white paper light shaped by hatching density.
  texture_and_material: Fine pen hatching on bright white board, with the surface finish of Sergio Toppi.
  camera_and_composition: Free mosaic page layout with no fixed grid.
  atmosphere_and_mood: Keep the requested mood with mythic solemn grandeur.
  rendering_and_quality: Faithful Toppi hatched pen page, in the recognizable hand of Sergio Toppi.
  creative_brief: 'Sergio Toppi page look of the 1970s to 2000s: dense decorative pen hatching, figures fused with landscape, panel borders dissolved into mosaic-like page designs and vast empty white space. Carry it through Toppi decorative hatching, mosaic layout. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
