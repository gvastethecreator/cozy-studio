visualDna:
  aesthetic: 'Instanced foliage overgrowth: moss, ivy, grass and saplings scattered across the scene by slope, occlusion and age masks, as if decades of growth had been simulated.'
  subject_treatment: "Portable environment render: keep the prompt's subject, location and camera; only surfaces gain scattered vegetation, and every object keeps its shape and era."
  color_and_tone: Fresh greens and yellow-greens over the original materials, darker damp green in crevices, original colors showing through gaps.
  lighting_and_shadow: Soft sky light filtering through leaf canopies, dappled light on surfaces, dense ambient occlusion under growth.
  texture_and_material: Thousands of individual leaf and grass instances, ivy following edges and cracks, moss on upward faces, roots lifting joints.
  camera_and_composition: Keep the requested view; growth thickens toward the ground and in sheltered corners so shapes stay readable.
  atmosphere_and_mood: Quiet and patient, nature slowly taking things back.
  rendering_and_quality: Dense instanced vegetation with individual leaves resolved; no flat green texture paint-over.
  creative_brief: "Instanced foliage overgrowth: moss, ivy, grass and saplings scattered across the scene by slope, occlusion and age masks, as if decades of growth had been simulated. Carry it through mask-driven scatter by slope and occlusion, ivy along edges, moss on upward faces, leaf instances, roots lifting joints. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: mask-driven scatter by slope and occlusion; ivy along edges; moss on upward faces; leaf instances; roots lifting joints
