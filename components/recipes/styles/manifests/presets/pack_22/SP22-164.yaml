visualDna:
  aesthetic: >-
    Stylized dimensional rendering simplifies major volumes and differentiates surfaces with subtle
    painted material cues and softly controlled edges.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Apply dimensional simplification
    to the existing subject without changing what it is or how it functions.
  color_and_tone: >-
    Retain the requested palette and use clear local colors. Avoid adding plastic-like color or
    changing material appearance beyond what the request supports.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use broad, controlled shading without adding
    a new light source or environment.
  texture_and_material: >-
    Keep matte or satin cues only where the depicted material supports them. Preserve visible details
    and avoid smoothing every surface into plastic.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Add no pedestal, assembly joints,
    lettering, frame or card layout.
  atmosphere_and_mood: >-
    Keep the requested setting and tone. Dimensional rendering does not alter the narrative or
    create new background context.
  rendering_and_quality: >-
    Simplify broad volume transitions while keeping edges slightly softened, not melted. Retain the
    small details and silhouette that identify the original subject.
avoidRules:
  - redesigning the subject as a toy or model
  - unrequested plastic surfaces, joints, or display props
  - unrequested lettering, frame or card layout
