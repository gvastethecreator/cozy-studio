visualDna:
  aesthetic: >-
    Atmospheric cel painting with softened edges, layered low contrast, and rough, earth-toned brush
    texture.
  subject_treatment: >-
    Retain the requested forms and action; let secondary contours blur slightly while focal edges
    stay clear.
  color_and_tone: >-
    Muted clay, olive, charcoal, and dusk blue create a subdued range; adapt to explicit palette
    choices.
  lighting_and_shadow: >-
    Diffuse side light and broad shadows create gentle separation without inventing haze or a new
    light source.
  texture_and_material: >-
    Smudged pigment, soft streaks, and uneven grain give the image a vulnerable, tactile finish.
  camera_and_composition: >-
    Honor the given viewpoint; use edge softness and tonal layering to separate existing planes.
  atmosphere_and_mood: >-
    Quiet and exposed, with vulnerability expressed through contrast rather than added narrative.
  rendering_and_quality: >-
    Keep the focal subject legible against loosely painted surroundings; avoid muddy detail.
  key_features: >-
    Earthy color, brushed softness, diffused contrast, and selectively lost edges create a gentle,
    vulnerable mood.
  creative_brief: >-
    Carry the requested subject and place through muted, tactile color and softened brush edges
    without adding smoke, mud, or a fantasy landscape.
