visualDna:
  aesthetic: 'Ceremonial ink anime that flips into photographic negative: broad black brush contours, huge ivory fields, and one region inverted so shadows turn white and highlights black.'
  subject_treatment: Redraw the prompt subject, action and setting in this anime drawing language and keep all three; a quiet everyday activity stays quiet and in place, and effect marks attach only to motion or energy the prompt already contains, never adding a fight, weapon or franchise costume.
  color_and_tone: Black, ivory and deep violet; the inverted region swaps black and white and carries one saturated crimson flash.
  lighting_and_shadow: Stark top light and deep shadow masses cut by crisp white gaps; inside the inverted zone light reads as black.
  texture_and_material: Solid ink fields with faint paper grain and dry-brush tails on the longest strokes.
  camera_and_composition: Keep the requested framing; formal, near-symmetric staging with one strong diagonal and wide negative space.
  atmosphere_and_mood: Solemn grandeur that turns suddenly cold, stillness broken by one stark flash.
  rendering_and_quality: Flat masses and clean negative cuts, with the inversion confined to one region or silhouette.
  key_features: partial photographic-negative inversion; broad black brush contour; ivory negative space; single crimson flash; formal diagonal
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Inverted Negative Ink Opera as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
