visualDna:
  aesthetic: >-
    Combine opaque gouache color, hand-painted volume and moderately softened edges. Reduce fine
    detail selectively as for clear reproduction while keeping the painted image identifiable.
  subject_treatment: >-
    Preserve requested identity, proportions, pose, action and scene. Reproduction simplification may
    clarify forms but must not remove defining features or add period-specific content.
  color_and_tone: >-
    Retain the requested palette and color relationships. Use opaque color and intermediate tones
    without imposing sepia, faded hues or a restricted historical palette.
  lighting_and_shadow: >-
    Follow the requested lighting and contrast. Model the existing volume with painted tonal steps
    without adding a new light source or arbitrary shadows.
  texture_and_material: >-
    Keep gouache strokes controlled and any printed-ink quality discreet. Do not force aged paper,
    card damage or an indiscriminate printed surface over the scene.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, pose and placement. Reproduction handling does not add
    a card frame, page, lettering or layout.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Gouache reproduction changes paint handling only; it does
    not imply nostalgia, an earlier era or physical wear.
  rendering_and_quality: >-
    Resolve broad painted forms first, then soften edges only moderately and reduce nonessential
    detail. Keep contours and values clear enough to recognize the requested subject.
avoidRules:
  - sepia, faded color or physical aging imposed as nostalgia
  - excessive print softness that obscures the painted forms
  - unrequested frame, lettering or layout
