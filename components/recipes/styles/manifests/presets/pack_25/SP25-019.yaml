visualDna:
  aesthetic: 'Responsive Mark Set: one identity shown as a primary, a reduced and a minimal version side by side, with the same proportions and core traits.'
  subject_treatment: Present the prompt's subject mark in three sizes, primary, reduced and minimal, removing only detail that the small sizes cannot hold; keep requested text exact.
  color_and_tone: Source colors kept in every version, with a monochrome test row beneath.
  lighting_and_shadow: Flat presentation of the artwork, identical in every size.
  texture_and_material: Source edges and proportions kept, with only authorized apertures widened for reduction.
  camera_and_composition: Rows of primary, reduced and minimal marks at declared scales with optical alignment.
  atmosphere_and_mood: Continuity of identity across scales, confident and systematic.
  rendering_and_quality: Each simplification visibly improves reading at its own size.
  creative_brief: "Responsive Mark Set: one identity shown as a primary, a reduced and a minimal version side by side, with the same proportions and core traits. Carry it through three size tiers, monochrome test row, aligned scales, kept identity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three size tiers; monochrome test row; aligned scales; kept identity
avoidRules:
  - silent redesign
  - minimal version that becomes another mark
  - automatic scaling shown as optical correction
  - real brand or trademark
  - copying a specific famous design
  - real artist signature
  - misspelled or altered requested text
  - extra invented words or letters
  - lorem ipsum placeholder text
  - watermark
  - franchise likeness
  - real person likeness
  - prompt literal card reuse
