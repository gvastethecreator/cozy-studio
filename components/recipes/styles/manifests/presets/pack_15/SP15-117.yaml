visualDna:
  aesthetic:
    'Use an optimistic atomic-age design language: streamlined mid-century silhouettes, orbit diagrams,
    radial starbursts, enamel panels, and terrazzo-like graphic blocks, applied as period-flavored form design
    rather than a required reactor scene.'
  subject_treatment:
    Preserve the requested subject and action; shape unspecified hardware, clothing, or architecture
    with smooth aerodynamic curves, rounded corners, and a few atomic orbit motifs.
  color_and_tone:
    Favor warm cream, turquoise, coral, leaf green, and polished chrome notes, with dark graphite
    used as a small structural counterweight; retain any explicitly requested palette.
  lighting_and_shadow:
    Use clean bright key light, broad enamel highlights, and soft-edged shadows that keep
    the design buoyant and legible rather than ominous.
  texture_and_material:
    Render smooth enamel, chrome trim, terrazzo chips, and molded plastics with restrained
    wear; keep material changes broad and graphic.
  camera_and_composition:
    Balance rounded masses around the subject with orbit or radial accents; preserve
    requested framing and use the atomic-age geometry to direct the eye, not to replace the subject.
  atmosphere_and_mood:
    Suggest confident public futurism and everyday invention; maintain an optimistic note
    without requiring a city, laboratory, or mid-century character.
  rendering_and_quality:
    Use polished illustration with clear contours, simplified reflective shapes, and a
    small number of crisp graphic accents; avoid realistic lens effects.
avoidRules:
  - a mandatory reactor, atom icon, or laboratory
  - dystopian ruin replacing the optimistic design language
  - chrome reflections that obscure form
