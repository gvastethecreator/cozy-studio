visualDna:
  aesthetic: >-
    Treat dream-collapse as edge behavior: stable primary contours against peripheral planes
    that slip or soften only at existing boundaries.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Never warp the
    requested subject or substitute one scene for another.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, blend pale warm and cool
    pastels over a stable dark anchor; retain local colors without surreal shifts.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Use graded shadows and restrained bounce
    from existing sources; add no glow, bloom, or lighting event.
  texture_and_material: >-
    Apply texture only to materials already present. Allow soft washes to bleed at existing
    background boundaries while keeping principal edges and materials intact.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Loosen depth only inside
    existing background, with no camera tilt, inserts, or duplication.
  atmosphere_and_mood: >-
    Keep requested mood; spatial instability is a rendering behavior, not a dream narrative.
  rendering_and_quality: >-
    Keep a stable focal silhouette and contain edge slippage to secondary boundaries; avoid
    melting, blur, or morphing.
  key_features: >-
    Stable focal contours; peripheral edge slippage; graded pastel values; fixed scene geometry.
  creative_brief: >-
    Use stable focal contours; peripheral edge slippage; graded pastel values; fixed scene
    geometry. Keep the requested subjects, action, setting, palette, framing and mood; add no
    scene content.
