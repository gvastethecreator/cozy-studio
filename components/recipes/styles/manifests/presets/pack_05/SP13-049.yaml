  aesthetic: 'Masahiro Ando action direction as in Sword of the Stranger: grounded fast motion, low tracking camera skimming terrain and precise dynamic choreography.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw figures and animals racing close to the ground, with realistic motion and kicked-up debris. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Golden barley, earth browns, dusty gold light and clear sky blue.
  lighting_and_shadow: Warm low sunlight skimming the ground and lighting the flying debris.
  texture_and_material: Hand-drawn key animation on clean digital cel, with visible drawing energy in lines, effects and debris.
  camera_and_composition: Low tracking shot skimming the ground toward or alongside the subject.
  atmosphere_and_mood: Keep the requested mood with rushing grounded speed.
  rendering_and_quality: Showpiece sakuga key frame where the drawing itself carries the motion, never a generic still pose.
  creative_brief: "Masahiro Ando action direction as in Sword of the Stranger: grounded fast motion, low tracking camera skimming terrain and precise dynamic choreography. Carry it through Masahiro Ando low tracking, ground skim, grounded speed. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
