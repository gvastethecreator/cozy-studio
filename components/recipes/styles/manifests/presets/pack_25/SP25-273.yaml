visualDna:
  aesthetic: 'Hand-Drawn Metric Patterns: slightly imperfect hand-drawn units that still keep an exact count and a declared code.'
  subject_treatment: Draw the prompt's supplied quantities as hand-made marks, one per unit in declared groups, each mark worth the same and every number exact.
  color_and_tone: Colors by class backed by symbols, ink variation never changing weight.
  lighting_and_shadow: Flat art, the irregularity coming from the hand gesture alone.
  texture_and_material: Hand strokes with limited variation and a comparable area per mark.
  camera_and_composition: Groups by sequence or category with room left for the key.
  atmosphere_and_mood: A human, repeatable rhythm with small local deviations.
  rendering_and_quality: Clean print with countable complete marks and consistent values.
  creative_brief: "Hand-Drawn Metric Patterns: slightly imperfect hand-drawn units that still keep an exact count and a declared code. Carry it through hand-drawn units, exact counts, grouped marks, human rhythm. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: hand-drawn units; exact counts; grouped marks; human rhythm
