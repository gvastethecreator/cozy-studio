visualDna:
  aesthetic: 'Cobweb: dense dusty spider silk draped in layers over the target.'
  subject_treatment: 'Apply this material to the surfaces of the target named in the prompt, keeping the target''s shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target is draped in thick layers of dusty cobweb strands and sheets.'
  color_and_tone: Grey-white strands with dust and dark gaps, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Backlight catching the strands, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Silk strands, sagging sheets and dust, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Abandoned, eerie, still and forgotten, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: dusty cobweb layers; backlit strands; sagging sheets
  creative_brief: "Cobweb: dense dusty spider silk draped in layers over the target. Carry it through dusty cobweb layers, backlit strands, sagging sheets. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
