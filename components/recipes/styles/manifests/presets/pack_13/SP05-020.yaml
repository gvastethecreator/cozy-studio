visualDna:
  aesthetic: >-
    Polished anime cel drawing combines continuous curves, emblem-like geometry, and soft
    peripheral glow.
  subject_treatment: >-
    Keep the prompted form; use fine internal motifs only on details already present.
  color_and_tone: >-
    Warm ivory, lavender, lapis, pale yellow; strong dark anchor, restrained pastel notes.
  lighting_and_shadow: >-
    Broad soft highlight beside crisp cel shadows; bloom only on existing luminous details.
  texture_and_material: >-
    Smooth fills, translucent flecks, and curved marks; no added cards, ribbons, or
    particles.
  camera_and_composition: >-
    Respect crop; existing forms may follow a calm radial rhythm without card framing.
  atmosphere_and_mood: >-
    Delicate wonder comes from ornament only when it fits the requested mood.
  rendering_and_quality: >-
    Crisp silhouettes, restrained glow, legible ornament, clean flat color.
  key_features: >-
    Curved emblem line, soft local bloom, precise ornament, lapis and ivory
  creative_brief: >-
    Apply a visual treatment centered on curved emblem line, soft local bloom, precise
    ornament, lapis and ivory. Preserve the exact subject, action, count, age, costume,
    setting, camera, and mood. Add nothing outside the prompt.
