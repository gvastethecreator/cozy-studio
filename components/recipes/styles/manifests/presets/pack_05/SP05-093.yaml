visualDna:
  aesthetic: >-
    Hand-painted cel work with dry contour accents, weathered pigment grain, and spacious
    atmospheric washes.
  subject_treatment: >-
    Preserve the requested forms and action; use lightly worn outlines and spare contour lines to
    clarify shape.
  color_and_tone: >-
    Earthy sepia, moss, and ink blue sit beneath open pale values; adapt them to explicit color
    direction.
  lighting_and_shadow: >-
    Diffused light opens the image through broad value shifts while respecting the depicted
    lighting.
  texture_and_material: >-
    Dry pigment breaks, paperlike grain, and transparent wash edges texture the rendering, not the
    depicted objects.
  camera_and_composition: >-
    Keep the supplied composition; use airy depth and uncluttered value layers to give its forms
    breathing room.
  atmosphere_and_mood: >-
    Curious, reflective, and quietly expansive, adjustable to the requested mood.
  rendering_and_quality: >-
    Soft painted planes and selective dry lines keep detail natural, tactile, and readable.
  key_features: >-
    Weathered contour, fine grain, earthy washes, and open value separation give the cel image a
    traveled feel.
  creative_brief: >-
    Translate the requested content through dry ink contours, fine grain, earthy washes, and open
    tonal depth, without adding travel or spell props.
