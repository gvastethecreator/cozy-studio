visualDna:
  aesthetic: 'Folded Silhouette Icons: one apparent sheet folded once or twice into a compact silhouette that carries the whole app metaphor.'
  subject_treatment: Build the prompt's subject as an app icon from one sheet with one or two decisive folds, every fold carrying meaning rather than decoration.
  color_and_tone: Three related values separating front, back and void, with strong silhouette contrast.
  lighting_and_shadow: Broad side light with a short contact shadow and soft, even fold shading.
  texture_and_material: 'Thin apparent thickness and a smooth matte surface with almost no visible grain.'
  camera_and_composition: Compact silhouette with one main void and folds visible from the chosen view.
  atmosphere_and_mood: Built lightness and a quiet surprise, crisp rather than crumpled or fragile.
  rendering_and_quality: Still recognizable as a flat silhouette once material and shadow are removed.
  creative_brief: "Folded Silhouette Icons: one apparent sheet folded once or twice into a compact silhouette that carries the whole app metaphor. Carry it through one folded sheet, decisive folds, three values, compact silhouette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: one folded sheet; decisive folds; three values; compact silhouette
