visualDna:
  aesthetic: 'Space-telescope false-color imaging: narrowband exposures of gas mapped to gold, teal and blue channels, with sharp multi-spike stars.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: 'Mapped palette: sulfur and hydrogen as gold and amber, oxygen as teal and blue; deep black space.'
  lighting_and_shadow: Emission glow from within the gas; dark dust silhouetted against bright regions.
  texture_and_material: Sculpted gas walls, pillars and filaments at huge scale, stars with six- or eight-point diffraction spikes.
  camera_and_composition: Scientific framing of the object, no horizon, no ground.
  atmosphere_and_mood: Monumental and awe-struck, cosmic structures shown as sculpture.
  rendering_and_quality: Processed space-telescope image with mapped color; distinct from natural-color amateur astrophotography.
  key_features: gold-teal narrowband mapping; multi-point diffraction spikes; sculpted gas pillars; black space; scientific framing
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Telescope (Hubble) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
