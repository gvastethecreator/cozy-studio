visualDna:
  aesthetic: 'High-key portraiture: a bright, nearly shadowless white world where the subject floats in clean light and soft pastel accents.'
  subject_treatment: Subject in light-toned wardrobe or with pale props, open expression, full or half figure placed against endless white.
  color_and_tone: Whites, creams and soft pastels dominate; dark values limited to eyes, hair and small accents.
  lighting_and_shadow: Background blown 1–2 stops over the key, large wrap-around soft sources, minimal shadow under the chin only.
  texture_and_material: Airy fabrics, sheer layers, soft hair; skin luminous but real.
  camera_and_composition: Clean centered or rule-of-thirds placement, lots of white negative space, eye-level camera.
  atmosphere_and_mood: Fresh, weightless, optimistic, and serene.
  rendering_and_quality: Clean exposure without clipping skin, smooth white field, crisp eyes.
  creative_brief: "High-key portraiture: a bright, nearly shadowless white world where the subject floats in clean light and soft pastel accents. Carry it through blown white background, shadowless wrap light, pastel accents, floating subject, clean negative space. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: blown white background; shadowless wrap light; pastel accents; floating subject; clean negative space
