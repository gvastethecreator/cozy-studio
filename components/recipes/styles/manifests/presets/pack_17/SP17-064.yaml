visualDna:
  aesthetic: Grimdark monochrome pixel art with one-bit discipline, hard tile silhouettes, dithered candle gloom, and medieval dungeon weight.
  subject_treatment: Translate any prompt subject into pixel-native silhouettes, tiles, creatures, portraits, relics, or scenelets while preserving the prompt content and avoiding HUD/game UI.
  color_and_tone: Black, bone white, ash gray, green-gray, and optional single rust pixel accent; strict limited palette.
  lighting_and_shadow: Pixel-cluster candlelight, rim dither, hard value steps, and no smooth gradients.
  texture_and_material: Hand-placed pixels, chunky dithering, tile seams, sprite-like contour, and clean upscaled edges.
  camera_and_composition: Vertical card crop that can show a sprite portrait, isometric tile fragment, side-view scenelet, or symbolic pixel object with no interface.
  atmosphere_and_mood: Bleak, old-game, cursed, stark, and playable without nostalgia cuteness.
  rendering_and_quality: Authentic limited-palette pixel art reproduced cleanly, no AI painterly smearing, no fake CRT text.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Monochrome Dungeon Pixels as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
  key_features: one-bit dungeon pixels; hard tile shapes; chunky dither; bone black palette; no HUD; grim medieval game mood
avoidRules:
  - smooth digital painting
  - fake pixel filter over painting
  - visible HUD
  - health bars
  - inventory icons
  - cute chibi sprites
  - readable game text
  - watermark
  - text
  - readable labels
  - readable runes
  - logo
  - UI overlay
  - franchise likeness
  - prompt literal card reuse
  - fixed medieval scene
  - generic fantasy card art
  - muddy noisy dark texture
