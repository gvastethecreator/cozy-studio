visualDna:
  aesthetic: 'Use this drawing language: Grotesque social-satire drawing with irregular silhouettes, normalized distortion, environmental wear, toxic color notes, and lopsided composition. Social context remains optional; the supplied content controls setting and story.'
  subject_treatment: Apply irregular clean outlines, lopsided silhouettes, friendly deformity marks, and restrained exaggeration to the supplied subject while preserving its identity, silhouette, requested action, actual material, and function. Change the drawn treatment, not the underlying content.
  color_and_tone: Use toxic yellow, smoke gray, bruised mauve, dull green, cheap tan, and muted domestic pink as style colors while honoring any explicit color requirements in the request.
  lighting_and_shadow: Use flat sour-toned fill with restrained directional contrast as a visual treatment, while respecting any lighting instructions in the request.
  texture_and_material: Render grime-like speckling, worn edge marks, dent-like drawn accents, and dusty cel grain as drawn or printed surface marks over the existing material; do not change the subject's actual substance or function.
  camera_and_composition: Use asymmetrical contours and degraded texture for visual pressure; add social symbols only when they are present in the request.
  atmosphere_and_mood: Bleak and satirical with an odd warmth; social critique remains contextual rather than mandatory.
  rendering_and_quality: Finish with dusty TV-cel texture, lopsided contour, worn material marks, and subdued toxic accents.
  key_features: irregular silhouette; lopsided contour; toxic color notes; worn graphic marks; optional social symbolism
  creative_brief: Render the supplied content with irregular clean outlines, lopsided silhouettes, friendly deformity marks, and restrained exaggeration. Use toxic yellow, smoke gray, bruised mauve, dull green, cheap tan, and muted domestic pink as style colors while honoring any explicit color instructions. Apply grime-like speckling, worn edge marks, dent-like drawn accents, and dusty cel grain as drawn or printed marks over the existing material, without changing what the subject is made of or how it functions. Preserve the requested subject, action, and setting; follow the supplied composition and add no unrequested cast, location, lettering, or gag.
