visualDna:
  aesthetic: >-
    A transferable ink-led illustrated treatment built around angular contour cuts that
    resolve into rounded, soft-edged strokes before crossing into the focal form. For color and surface, keep the prompt's colors, balancing quiet ink neutrals
    with a small warm ochre, blush, or coral passage. Compassion can emerge as a
    softening of marks, not as a required injury, curse, or reconciliation story
  subject_treatment: >-
    Preserve the requested subject, action, count, pose, expression, setting, and
    material identity. Restyle its contours through angular contour cuts that resolve
    into rounded, soft-edged strokes before crossing into the focal form; use detail
    selectively and keep the actual form easy to read. Add no unrequested subject or
    action.
  color_and_tone: >-
    Respect the prompt's colors and emotional temperature; keep the prompt's colors,
    balancing quiet ink neutrals with a small warm ochre, blush, or coral passage. Keep
    values legible across the prompted light and dark range; do not crush midtones or
    dim a bright request.
  lighting_and_shadow: >-
    Respect the stated light source, direction, and time; transition from a defined edge
    highlight to a soft reflected wash without changing source direction or time. Keep
    shadow detail and material transitions visible.
  texture_and_material: >-
    Preserve each material's identity; contrast dry, crisp line ends with a gentle
    watercolor bloom, keeping both treatments selective and surface-aware. Keep texture
    subordinate to form and avoid a uniform grime overlay.
  camera_and_composition: >-
    Preserve the requested framing, perspective, subject placement, and count; preserve
    the original focal hierarchy; let line hardness soften locally rather than imposing
    a new pose or close-up. Use the mark rhythm inside the supplied composition rather
    than replacing it.
  atmosphere_and_mood: >-
    Follow the prompt's requested mood first. Compassion can emerge as a softening of
    marks, not as a required injury, curse, or reconciliation story. Darkness and
    tension are optional tonal pressure, never a requirement to add danger or rewrite
    the scene.
  rendering_and_quality: >-
    Use clean, stable illustrated forms and angular contour cuts that resolve into
    rounded, soft-edged strokes before crossing into the focal form; keep focal edges
    crisp, texture controlled, and dark values legible. Avoid photoreal or 3D-render
    drift, watermark, logo, and fake readable text.
  key_features: >-
    angular contour cuts that resolve into rounded, soft-edged strokes before crossing
    into the focal form; keep the prompt's colors, balancing quiet ink neutrals with a
    small warm ochre, blush, or coral passage; transition from a defined edge highlight
    to a soft reflected wash without changing source direction or time; contrast dry,
    crisp line ends with a gentle watercolor bloom, keeping both treatments selective
    and surface-aware; and preserve the original focal hierarchy; let line hardness
    soften locally rather than imposing a new pose or close-up. The five cues should
    read as one mark-and-value system, not as extra scene content.
  creative_brief: >-
    Apply this style after the prompt while locking its subject, action, count, pose,
    camera, context, and requested mood. Use angular contour cuts that resolve into
    rounded, soft-edged strokes before crossing into the focal form, keep the prompt's
    colors, balancing quiet ink neutrals with a small warm ochre, blush, or coral
    passage, transition from a defined edge highlight to a soft reflected wash without
    changing source direction or time, and contrast dry, crisp line ends with a gentle
    watercolor bloom, keeping both treatments selective and surface-aware; the prompt
    supplies all scene content. Do not add unrequested characters, objects,
    source-specific lore, readable symbols, or a default action.
