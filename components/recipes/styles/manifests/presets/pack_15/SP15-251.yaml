visualDna:
  aesthetic: 'Mirrorpunk: a culture obsessed with haunted mirrors, with silvered halls, cracked reflections, reflections that move on their own and doors into mirror worlds.'
  subject_treatment: Keep the prompt's subject and setting; multiply and distort it through antique mirrors where reflections disagree with reality.
  color_and_tone: Tarnished silver, antique gold frames and cool grey-blue with deep black shadows.
  lighting_and_shadow: Candle and moonlight bouncing endlessly between facing mirrors.
  texture_and_material: Silvered glass, tarnish, cracks, gilded frames and dust sheets.
  camera_and_composition: Infinite mirror corridors and figures facing reflections that differ.
  atmosphere_and_mood: Uncanny and hypnotic, the fear that your reflection has its own plans.
  rendering_and_quality: Precise reflective illustration with layered mirror depth and tarnish.
  creative_brief: "Mirrorpunk: a culture obsessed with haunted mirrors, with silvered halls, cracked reflections, reflections that move on their own and doors into mirror worlds. Carry it through haunted mirrors, disagreeing reflections, infinite corridors, tarnished silver. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: haunted mirrors; disagreeing reflections; infinite corridors; tarnished silver
