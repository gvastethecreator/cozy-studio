visualDna:
  aesthetic: 'Torn-paper mosaic: the subject built from hundreds of fingernail-sized hand-torn paper bits sorted by color like mosaic tesserae.'
  subject_treatment: Keep the prompt subject, pose, action and camera view; rebuild the picture in this medium so the material sits on the image surface and never replaces clothing, skin or anatomy.
  color_and_tone: Color mixed optically by neighboring scraps; each scrap one flat tone, warm and cool bits interleaved for gradients.
  lighting_and_shadow: Soft even light; value comes from scrap color, with slight lift shadows at overlapping torn edges.
  texture_and_material: White fibrous torn edges around every scrap, magazine gloss beside matte paper, faint glue sheen.
  camera_and_composition: Keep the requested view; scrap size shrinks at the focal point and grows in the background.
  atmosphere_and_mood: Patient and playful, an image that resolves only from a distance.
  rendering_and_quality: Readable from afar, clearly torn scraps up close; no cut straight edges.
  key_features: hand-torn scraps; white fiber edges; optical color mixing; smaller scraps at the focus; glue sheen
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Torn Paper Mosaic as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
