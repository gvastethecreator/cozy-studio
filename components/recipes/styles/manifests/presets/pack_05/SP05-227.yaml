visualDna:
  aesthetic: 'Technical-pen tangle drawing: dense 0.1 mm fine-liner cable lines layered over rust-stained watercolor blooms, with small cold cyan glints.'
  subject_treatment: Redraw the prompt subject, action, setting and camera in this mechanical anime rendering; a plant, animal, object or person keeps its identity and is never turned into a robot, hangar or battle scene.
  color_and_tone: Oxidized orange and brown watercolor blooms over slate and black ink, with isolated cold cyan glints.
  lighting_and_shadow: Shadow built from tangled line density; watercolor blooms carry warm reflected light and cyan glints mark wet edges.
  texture_and_material: Hairline pen tangles, cauliflower watercolor blooms and backruns, dry scratches and rust speckle.
  camera_and_composition: Keep the requested view; run line tangles in slanting downward rhythms that thicken toward the bottom of the frame.
  atmosphere_and_mood: Brittle, tense and worn, the quiet of something slowly giving way.
  rendering_and_quality: Hairline fine-liner precision against loose rust watercolor, with selective cyan glints and a readable silhouette.
  key_features: dense 0.1 mm fine-liner tangles; rust watercolor blooms and backruns; slate and black ink; cold cyan glints; downward slanting line rhythm
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Rust-Wire Descent as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
