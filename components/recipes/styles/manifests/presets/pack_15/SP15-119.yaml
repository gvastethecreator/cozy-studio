visualDna:
  aesthetic:
    'Make visible reuse the design signature: mismatched recovered panels, repurposed hardware, rope
    or cable tethers, patched canvas, and deliberate repair seams show how a form was adapted from what was
    available.'
  subject_treatment:
    Preserve the requested subject and action; translate unspecified structures or accessories
    into visibly reused components and practical repairs without changing the subject into a vehicle or scrap
    heap.
  color_and_tone:
    Pair weathered steel, canvas, oxide, wood, and charcoal with a few clean repair marks or
    weld-warm accents; retain enough unweathered color to keep the focal form clear.
  lighting_and_shadow:
    Use directional light to reveal joins, layered panels, and patched edges; keep weld
    or signal glow small and functional.
  texture_and_material:
    Distinguish rusted metal, tarred seams, salt wood, canvas, and replacement fasteners;
    concentrate weathering around contact and repair points.
  camera_and_composition:
    Let joins and tethers make readable diagonals around the subject; preserve the source
    framing and avoid dense junk accumulation.
  atmosphere_and_mood:
    Suggest resilience and inventive reuse, which can be hopeful, rough, cosmic, maritime,
    or urban as the prompt requires.
  rendering_and_quality:
    Use broad, clean material shapes and clearly drawn repair logic; keep scars subordinate
    to the subject's silhouette.
avoidRules:
  - a required spaceship, scrapbike, sail, or wreck
  - random junk piles without functional joins
  - uniform rust or grime hiding the repair logic
