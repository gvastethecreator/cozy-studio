  aesthetic: 'Taxidermy parlor stillness: cluttered old parlors crowded with mounted animals under glass domes, dozens of glass eyes watching in perfect silence.'
  subject_treatment: Set the prompt's subject among mounted animals and glass domes in a dim parlor, keeping it clear while the animals seem to watch.
  color_and_tone: Dusty browns, faded velvet reds, amber lamplight and glinting glass eyes.
  lighting_and_shadow: Weak lamplight and dusty window beams, with glinting highlights in every glass eye.
  texture_and_material: Fur, feathers, glass domes, dust, velvet upholstery and dark varnished wood.
  camera_and_composition: Crowded interiors with animals filling shelves and corners around the subject.
  atmosphere_and_mood: Silent, watchful and suffocating, a room holding its breath.
  rendering_and_quality: Rich detailed painterly realism with precise reflections in the glass.
  creative_brief: "Taxidermy parlor stillness: cluttered old parlors crowded with mounted animals under glass domes, dozens of glass eyes watching in perfect silence. Carry it through mounted animals, glass domes, watching glass eyes, dusty velvet parlor. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
