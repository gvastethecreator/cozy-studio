visualDna:
  aesthetic: >-
    Economical hand-inked drawing pairs expressive curves and large flat color fields with slight,
    controlled irregularity in the marks.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Simplify shapes without changing their
    function or introducing caricature unless explicitly requested.
  color_and_tone: >-
    Preserve the requested palette while grouping color into a few broad, separated areas; avoid imposing
    a nostalgic or artificially aged grade.
  lighting_and_shadow: >-
    Respect the requested light direction and describe shadow with simple color shapes, keeping the value
    pattern consistent with the scene.
  texture_and_material: >-
    Keep fills mostly clean with a slight hand-made variation in contour or print edge when appropriate;
    do not add torn paper, folds or distress by default.
  camera_and_composition: >-
    Retain the requested viewpoint, crop, framing and placement. Flat color is a rendering choice, not a
    reason to create panels, borders or a page layout.
  atmosphere_and_mood: >-
    Preserve the requested mood and setting; the simplified print language should not create a retro story
    or a new emotional beat.
  rendering_and_quality: >-
    Use confident curved lines, clear silhouettes and large color blocks, keeping detail spare and the
    image crisp without reducing resolution.
avoidRules:
  - unrequested panels, borders or imitation paper damage
  - extra details that alter identity or function
