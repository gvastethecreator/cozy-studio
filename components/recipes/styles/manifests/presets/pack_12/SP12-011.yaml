visualDna:
  aesthetic: 'Frictional Games SOMA (2015) look: first-person horror inside a deep-sea research station, flooded industrial corridors, flickering lights, leaking bulkheads and dark abyssal ocean beyond thick windows.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render people and machines as uncanny figures in diving suits and cabled machinery, seen from first person. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Abyssal blue-black, sodium orange, rust and cold teal.
  lighting_and_shadow: Flickering station lights and flashlight beams in dark water.
  texture_and_material: Wet rusty metal, cables, algae and fogged glass.
  camera_and_composition: First-person view through flooded corridors, framed the way SOMA 2015 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with crushing existential dread.
  rendering_and_quality: Authentic mid-2010s undersea horror screen, matching real SOMA 2015 screenshots.
  key_features: SOMA undersea station; flooded corridors; abyss windows
  creative_brief: 'Frictional Games SOMA (2015) look: first-person horror inside a deep-sea research station, flooded industrial corridors, flickering lights, leaking bulkheads and dark abyssal ocean beyond thick windows. Carry it through SOMA undersea station, flooded corridors, abyss windows. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
