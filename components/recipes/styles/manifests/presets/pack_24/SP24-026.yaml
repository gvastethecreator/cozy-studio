visualDna:
  aesthetic: 'Whiteout mountain rescue: rescuers roped together on a storm-blasted ridge, painted in near-white charcoal and chalk where snow and sky merge.'
  subject_treatment: Put the prompt's subject into an alpine whiteout, keeping it readable as a dark shape inside swirling snow.
  color_and_tone: Near-white greys, charcoal silhouettes and a single red jacket or flare.
  lighting_and_shadow: Flat diffused whiteout light with almost no shadows and a glowing flare.
  texture_and_material: Charcoal smudges, chalk snow, frozen rope, ice-crusted clothing and wind streaks.
  camera_and_composition: Figures roped in a line along a diagonal ridge, horizon lost in white.
  atmosphere_and_mood: Urgent, brave and disoriented, holding the rope in nothing.
  rendering_and_quality: Expressive charcoal and chalk drawing with strong wind direction.
  creative_brief: "Whiteout mountain rescue: rescuers roped together on a storm-blasted ridge, painted in near-white charcoal and chalk where snow and sky merge. Carry it through whiteout blending snow and sky, roped rescuers, red accent, wind streaks. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: whiteout blending snow and sky; roped rescuers; red accent; wind streaks
