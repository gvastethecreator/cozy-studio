visualDna:
  aesthetic:
    'Make witchcraft feel handmade and defiantly improvised through hand-cut arcane marks, knotted
    seams, wax-like pigment, and colored thread integrated into a few existing surfaces rather than
    through added props or a ritual setting.'
  subject_treatment:
    Preserve the requested subject, action, setting, and framing; apply repaired bindings or one coherent
    hand-cut mark to compatible existing clothing or surfaces. Do not add pouches, tools, devices, or a
    witch/spellcasting identity unless requested.
  color_and_tone:
    Balance wax red, herb green, soot, parchment, and tarnished copper; use a small electric
    glow only as a deliberate sign of active magic, not as the defining palette.
  lighting_and_shadow:
    Preserve the requested light source, direction, and time of day; use at most a small warm or colored
    accent on the mark itself, without implying a candle or darkening the room.
  texture_and_material:
    Render wax-like pigment, dyed thread, patched cloth, or worn leather only where those materials already
    fit the subject; keep marks personal and visibly handmade rather than adding plant bundles or devices.
  camera_and_composition:
    Keep any knot or mark attached to an existing form; preserve open space and the requested framing
    instead of adding a standalone talisman, altar, or prop arrangement.
  atmosphere_and_mood:
    Carry resourceful, intimate occult defiance through the handmade marks themselves; let the requested
    setting and emotional tone remain in control.
  rendering_and_quality:
    Keep handmade edges and material joins legible, reserve luminous effects for purposeful
    magic, and maintain a clear subject silhouette.
avoidRules:
  - a required witch, altar, or spellcasting action
  - mixing unrelated symbol systems into one visual vocabulary
  - a fixed bundle of herbs, seals, charms, and devices in every image
  - effects that erase the focal silhouette
  - unrequested candles, herb bundles, altar dressing, or ritual-room architecture
