visualDna:
  aesthetic: >-
    Concrete (Raw) treats fabrication as visible style language: start from Construction wall,
    Porous, dusty, and Cracks, then turn manufacturing process, tooling marks, seams, tolerances,
    and industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Formwork holes: preserve identity and pose while letting
    forms carry manufactured seams, tolerances, pressure marks, and finish logic through edge
    profile, surface breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use Grey as the material palette, with controlled value separation, local color variation, and
    hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Matte define the light response: highlights, occlusion, translucency, specular scatter,
    matte falloff, or rim behavior should reveal Concrete (Raw) without hiding the prompt subject.
  texture_and_material: >-
    Render Porous, dusty through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Cracks as reusable material rhythm: macro-friendly for texture tasks, but able to
    wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Cold, urban by using use, fabrication, utility, and cultural material association;
    the material should color the scene's feeling while preserving the user's requested subject and
    setting.
  rendering_and_quality: >-
    Finish with Brutalist, industrial material clarity: physically coherent reflectance, clean
    contact detail, controlled micro-texture, readable silhouette behavior, and no noisy
    stock-texture overlay.
  key_features: Construction wall; Formwork holes; Porous, dusty; Matte; Cracks
  creative_brief: >-
    Route any subject through Concrete (Raw) as a transferable man-made material visual system while
    preserving the prompt's subject, action, and setting. Summon the brutal honesty of raw concrete
    with its pinhole air bubbles and formwork tie-hole scars like a fossil record of the day it was
    poured. The surface must feel dusty and porous, grey as an overcast sky, heavy with the gravity
    of the built world. This is the face of function refusing to apologize, the unadorned truth of
    the urban. Use Concrete as portable surface/render behavior over any input: map its texture,
    light response, edge wear, color chemistry, and tactile rhythm onto the subject instead of
    requiring a literal material sample, macro tile, wall, landscape, source object, or scene where
    the material naturally appears.
