visualDna:
  aesthetic: 'Mid-century modern interior: low horizontal lines, walnut and teak casework on tapered splayed legs, molded plywood curves, open plan with a floating room divider.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Walnut brown, teak amber, warm off-white, with mustard, olive, burnt orange or teal accents in tweed and enamel; medium contrast, warm overall.
  lighting_and_shadow: Low-sun daylight through clerestory or floor-to-ceiling glazing, cone and globe pendants, warm pools of light across low furniture.
  texture_and_material: Book-matched walnut veneer, oiled teak, nubby wool tweed, terrazzo or cork floors, slatted wood screens and ribbed glass.
  camera_and_composition: Keep the requested view; eye level held low to stress horizontals, long credenzas and rooflines running parallel to the frame edge.
  atmosphere_and_mood: Optimistic, warm and relaxed, a confident post-war modernity.
  rendering_and_quality: 'Period magazine interior clarity: clean grain, soft warm contrast, restrained staging, no replica of a named designer chair.'
  key_features: tapered splayed legs; book-matched walnut veneer; low horizontal proportion; mustard and teal tweed accents; slatted wood divider
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mid-Century Modern as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
