visualDna:
  aesthetic: >-
    A transferable game-art direction built from tokenized palette, material, encounter, and mood
    cues: route prompt X through premium racing spectacle; competitive arena energy, lane logic,
    player-role clarity, speed trails, and readable match flow, using the preset as art direction
    rather than a required scene, mission, character, or card image.
  subject_treatment: >-
    Preserve the user's subject while translating silhouette, role, scale, equipment, route
    pressure, and encounter readability with this grammar: express competition roles, lane tension,
    speed control, ranked focus, and contest readability without forcing a sports broadcast.
  color_and_tone: >-
    Grade the image with transparent cyan, magenta refraction, and black chrome; team-color
    contrast, hot magenta, cobalt, obsidian, sand gold, lava red, and prismatic highlights; keep
    tonal hierarchy strong enough for gameplay readability, thumbnail clarity, and subject
    recognition.
  lighting_and_shadow: >-
    Drive the lighting with hologram streaks and lens-split glow; low-key night lighting with
    practical pools; track strips, arena floods, energy gates, holographic trails, trophy glints,
    and motion-lit edges; use highlights and shadow pockets to reveal routes, hazards, factions, or
    focal threats without hiding prompt content.
  texture_and_material: >-
    Build surfaces from polished arena floors, volcanic glass, carbon helmets, crystal barriers,
    dust tracks, neon rails, and worn competition gear; make props, clothing, creatures, vehicles,
    architecture, and terrain share the same production-world logic.
  camera_and_composition: >-
    Use reusable game-composition grammar from competitive arena energy, lane logic, player-role
    clarity, speed trails, and readable match flow: lane rhythm, scale contrast, objective
    hierarchy, readable negative space, encounter depth, and motion vectors should adapt to
    portraits, objects, creatures, environments, and action scenes.
  atmosphere_and_mood: >-
    Keep the mood late-hour danger; competitive, fast, theatrical, sharp, high-stakes, and
    crowd-charged; the result can be adult, harsh, seductive, eerie, or violent when prompt X asks
    for it, but the preset should not force a new storyline.
  rendering_and_quality: >-
    Finish as high-motion game-art finish with crisp lane readability, controlled streaks, and no
    fake broadcast overlay; preserve clean focal hierarchy, believable material response,
    heavy-denoise clarity, and no readable UI, text, logos, or stock key-art gloss.
  key_features: >-
    Holographic, Grand, Prix, Night; premium racing spectacle; transparent cyan, magenta refraction,
    and black chrome; hologram streaks and lens-split glow; polished arena floors, volcanic glass,
    carbon helmets, crystal barriers, dust tracks, neon rails, and worn competition gear; wide
    speedway and luminous finish line; late-hour danger
  creative_brief: >-
    Apply Holographic Grand Prix Night as a reusable video-game art-direction router over prompt X:
    preserve the user's subject and intent, then translate palette, lighting, material logic, route
    readability, encounter mood, and production finish through this preset.
