visualDna:
  aesthetic: >-
    Soft-edged anime painting builds continuous volume while retaining recognizable form planes,
    fine drawing and localized light transitions.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Soften selected edges without
    washing out defining features or changing the subject's material.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Keep brightening local to existing lit
    areas without laying a white veil over the image.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Use gentle transitions only where existing
    forms meet light; do not add glow, halo or another source.
  texture_and_material: >-
    Use fine brushwork and restrained gradation. Keep surfaces and materials distinct rather than
    smoothing every area into a shared haze.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Soft edges do not change framing;
    add no card frame or lettering.
  atmosphere_and_mood: >-
    Keep the requested setting and mood. Soft rendering does not alter the narrative or add effects
    to the background.
  rendering_and_quality: >-
    Retain clear main planes and stronger line at overlaps, with softness kept to selected transitions.
    Preserve facial and small structural detail without indiscriminate bloom.
avoidRules:
  - indiscriminate bloom, halos, or a white haze over the image
  - softened edges that erase facial or material detail
  - unrequested card frame or lettering
