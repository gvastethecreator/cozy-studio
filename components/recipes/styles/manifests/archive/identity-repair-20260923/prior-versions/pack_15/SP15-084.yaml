visualDna:
  aesthetic: >-
    A high-tech punk image language segments existing forms with sharp signal bands, layered reflective
    planes and controlled emissive color; circuitry-like geometry follows the subject instead of imposing
    a neon city.
  subject_treatment: >-
    Preserve requested identity, anatomy, proportions, action and part relationships. Translate existing
    forms with segmented edges, modular surface divisions and a few signal traces; do not add devices,
    implants or interface panels as substitute subjects.
  color_and_tone: >-
    Use high-contrast cyan, magenta, violet or acid-green accents against dark or neutral values when
    compatible with the prompt. Preserve explicit colors and keep luminous accents selective rather than
    forcing a fixed neon palette.
  lighting_and_shadow: >-
    Follow requested lighting. Use contained bloom and crisp colored edge bands only around existing
    emissive or reflective features; do not add a new light source, rain glow or nighttime setting.
  texture_and_material: >-
    Preserve each requested material. Where supplied, distinguish glass, polymer, rubber, coated metal
    and circuit-like surfaces with selective reflection and clean segmentation; do not lay rain, wetness
    or digital noise over every surface.
  camera_and_composition: >-
    Preserve viewpoint, crop and placement. Organize visual complexity with layered signal planes and
    clear subject separation without forcing a street, server room, screen or city skyline.
  atmosphere_and_mood: >-
    Carry tension, speed, intimacy or cooperation through contrast and signal rhythm according to the
    request; do not prescribe a dystopian mood or narrative.
  rendering_and_quality: >-
    Use clean graphic contours, distinct color regions and restrained digital bloom. Keep small
    interface-like marks abstract and subordinate; avoid noisy texture, smeared glow and pseudo-readable
    UI.
avoidRules:
  - >-
    Do not introduce a city, rain, server room, drone, medical clinic or wearable device unless
    requested.
  - Avoid pseudo-readable interface text, logos and all-over neon bloom when not requested.
  - Avoid dense circuitry wallpaper and reflections that obscure the subject.
