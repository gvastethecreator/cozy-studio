visualDna:
  aesthetic: >-
    Biopunk fuses engineered organic form with technical surface language through branching circuit-like
    lines, translucent membranes, nested cellular planes and restrained living gradients.
  subject_treatment: >-
    Preserve requested identity, anatomy, proportions and action. Apply biological patterning to existing
    surfaces; change anatomy, add grafts or introduce new organisms only when explicitly requested.
  color_and_tone: >-
    Keep the prompt's palette in control. Separate translucent and opaque planes with clear value shifts;
    use a restrained mineral or cellular accent rather than a fixed green scheme.
  lighting_and_shadow: >-
    Follow the requested lighting. Use soft internal color transitions only where existing translucent
    material supports them; do not add a biological glow or new light source.
  texture_and_material: >-
    Preserve each material. Where present, distinguish membrane, polymer, glass, bone-like and
    plant-derived surfaces through controlled translucency and local grain; avoid gore and glossy
    synthetic uniformity.
  camera_and_composition: >-
    Preserve viewpoint, crop and placement. Use layered organic planes and branching traces within the
    requested composition without imposing a lab, greenhouse or built environment.
  atmosphere_and_mood: >-
    Let curiosity or unease emerge from the contrast between living pattern and engineered order. Keep
    the requested tone and do not make body horror the default.
  rendering_and_quality: >-
    Use clean organic contours, precise technical traces and broad translucent color planes. Keep detail
    selective and anatomy readable; avoid random tentacles, pore-level realism and noisy texture.
avoidRules:
  - Do not add grafts, mutations, organisms, lab equipment or greenhouse architecture unless requested.
  - Do not change human anatomy or identity without an explicit transformation request.
  - Avoid gore, random tentacle clutter and uniform biological glow.
