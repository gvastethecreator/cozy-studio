visualDna:
  aesthetic: >-
    Build the graphic anime treatment from heavy clean contours with sharp tapered ends and
    compact angular forms set off by broad dark masses. Let long directional slashes balanced by
    held pauses set its rhythm; use cool blue-gray and black with one strong warm accent for color
    and smooth cel fields with little surface grain for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use heavy clean contours with sharp tapered ends
    for edge work, compact angular forms set off by broad dark masses for form simplification, and
    long directional slashes balanced by held pauses only where movement is already requested.
  color_and_tone: >-
    Build value groups with cool blue-gray and black with one strong warm accent. Place the
    strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: hard shadow blocks with a narrow bright edge. Keep shadows grouped
    and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with smooth cel fields with little surface grain, preserving depicted
    materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use staggered close spacing and forceful diagonals
    inside the requested crop to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey brazen confidence and contained restlessness, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with decisive line weight, broad dark values, and sparse directional marks; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    heavy clean contours with sharp tapered ends; compact angular forms set off by broad dark
    masses; cool blue-gray and black with one strong warm accent; long directional slashes
    balanced by held pauses; smooth cel fields with little surface grain; staggered close spacing
    and forceful diagonals inside the requested crop.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with heavy clean contours
    with sharp tapered ends, compact angular forms set off by broad dark masses, and cool
    blue-gray and black with one strong warm accent; use long directional slashes balanced by held
    pauses only where movement is already present, and apply smooth cel fields with little surface
    grain as the drawing finish.
