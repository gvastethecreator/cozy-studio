visualDna:
  aesthetic: Grimy dark-fantasy anime ink where scuffed black masses collide with chipped color edges and contour joins break abruptly, as if two drawings were forced together.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Soot-dark neutrals with one or two sharply bounded accents such as acid yellow or bruise violet.
  lighting_and_shadow: Small directional highlights; value collisions do the work instead of glowing magic effects.
  texture_and_material: Dry soot grain, chipped pigment and short stain-like strokes that never become sigils.
  camera_and_composition: Keep the requested framing and count; mark density concentrates where forms meet.
  atmosphere_and_mood: Cramped, volatile grime energy, a room that might ignite.
  rendering_and_quality: Controlled collision marks with every form still readable.
  key_features: scuffed ink masses; chipped color edges; broken contour joins; soot neutrals with bounded accent; stain-like strokes
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Grimy Sorcery Collision Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
