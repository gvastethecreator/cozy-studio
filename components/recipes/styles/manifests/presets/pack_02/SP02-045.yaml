visualDna:
  aesthetic: 'Pixel-art animation: 16-bit sprites and tiles with a limited indexed palette, animated in a few hand-placed frames.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them in this animation medium; a non-character subject keeps its identity and no studio-like cast or mascot is added.
  color_and_tone: Indexed palette of 16–32 colors, stepped shading ramps, crisp dark outlines.
  lighting_and_shadow: Light built from stepped color ramps and dithering; flickering light as palette cycling.
  texture_and_material: Pixel-perfect edges on a strict grid, dithering for gradients.
  camera_and_composition: Side-view or three-quarter game scene, sprite centered, tiled background.
  atmosphere_and_mood: Nostalgic and playful, a game world alive in few pixels.
  rendering_and_quality: Clean pixel grid with no anti-aliasing or blur.
  key_features: indexed palette; pixel grid; stepped shading ramps; dithering; sprite animation frames
  creative_brief: "Pixel-art animation: 16-bit sprites and tiles with a limited indexed palette, animated in a few hand-placed frames. Carry it through indexed palette, pixel grid, stepped shading ramps, dithering, sprite animation frames. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - exact studio character copy
  - franchise likeness
  - mascot likeness
  - celebrity likeness
  - readable fake text
  - adding a studio-like cast the prompt did not ask for
  - vector
  - smooth gradients
  - smooth
  - official card scene
  - fixed thumbnail subject
  - prompt replaced by sample image
  - watermark
  - logo clutter
  - generic stock footage
  - uncontrolled noise
  - random cartoon face
  - unreadable motion smear
  - fake subtitles
  - text
  - readable labels
  - logo
  - UI overlay
  - real person likeness
  - prompt literal card reuse
