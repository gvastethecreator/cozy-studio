visualDna:
  aesthetic: 'Grown sanctuary architecture: living beech and ash trunks trained into tall lancet arches, pale limestone shells grafted between them, and branch forks forming the window tracery.'
  subject_treatment: Keep the requested structure or object, its function, footprint and camera; rebuild its walls, roof, openings and ornament in this construction logic, and never swap it for a castle, temple or fixed fantasy landmark.
  color_and_tone: Bone-white limestone, silver-grey bark, fern and moss greens, thin silver inlay lines; low saturation in a high, airy value key.
  lighting_and_shadow: Soft canopy-filtered daylight with green bounce and no hard sun; the branch tracery throws lace-like shadow patterns across the pale stone.
  texture_and_material: Bark grain fusing seamlessly into chiselled limestone, lichen at the footings, silver wire inlay tracing every joint, leaves growing through the tracery.
  camera_and_composition: Keep the requested view; stress tall narrow proportions, trunks reading as columns and the canopy closing overhead like a vault.
  atmosphere_and_mood: Hushed, ancient and gentle, a building that was grown over centuries rather than laid.
  rendering_and_quality: Painterly-realist architectural illustration with fine linework in the tracery and soft foliage edges; no HDR glare or blown haze.
  key_features: trunks trained into lancet arches; branch-fork window tracery; pale limestone with silver inlay; filtered green canopy light; moss and lichen at the footings
  creative_brief: "Grown sanctuary architecture: living beech and ash trunks trained into tall lancet arches, pale limestone shells grafted between them, and branch forks forming the window tracery. Carry it through trunks trained into lancet arches, branch-fork window tracery, pale limestone with silver inlay, filtered green canopy light, moss and lichen at the footings. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
