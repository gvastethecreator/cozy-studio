visualDna:
  aesthetic: >-
    Iron Harvest Stewardship acts as a transferable mythic-noir router: iron translated into dark
    symbolic behavior, harvest translated into dark symbolic behavior plus stewardship translated
    into dark symbolic behavior fused with pantheon-scale legend grammar with regalia pressure,
    mythic jurisdiction, dualities, lineage marks, and sovereign symbolism; it carries symbol, omen,
    ritual authority, and mature editorial restraint without locking prompt content to its sample
    image.
  subject_treatment: >-
    Keep the user's prompt subject, action, and context intact while reshaping identity through iron
    shaping silhouette rhythm, contour pressure, and symbolic edge control, harvest shaping
    silhouette rhythm, contour pressure, and symbolic edge control plus stewardship shaping
    silhouette rhythm, contour pressure, and symbolic edge control; forms should inherit silhouette
    pressure, emblem logic, ritual posture, edge weight, and motif placement instead of a mandatory
    actor or prop set.
  color_and_tone: >-
    Map color through iron black, rust red, and dry harvest gold plus iron black, dry gold, and
    field-brown undertones together with mineral darks, royal metal, storm blue, cinder orange,
    tidal green, funeral rose, sun-gold, and cold ivory accents; values stay separated, accents feel
    intentional, and the dark palette supports the requested content rather than swallowing it.
  lighting_and_shadow: >-
    Use iron-weighted rim behavior, occult glow, and charged shadow, harvest-weighted rim behavior,
    occult glow, and charged shadow plus stewardship-weighted rim behavior, occult glow, and charged
    shadow with oracular backglow, storm breaks, solar slashes, underwater gloom, firelit judgment,
    and sculptural chiaroscuro; shadows must carry omen weight, rims should clarify form, and glow
    should behave as ritual evidence rather than decorative haze.
  texture_and_material: >-
    Render hammered iron, oxidized edges, and hard matte wear plus worked metal, cut fiber, and
    seasonal dust alongside bronze, stone, glass, thorn, bone, water, smoke, root, scale, feather,
    hammered iron, and polished relic surfaces; surface scale, patina, residue, gloss, grain, and
    carved or sealed edges must remain coherent across characters, objects, scenes, and
    abstractions.
  camera_and_composition: >-
    Frame with protective spacing and resource-order hierarchy, iron converted into repeatable
    spatial rhythm and symbolic hierarchy plus harvest converted into repeatable spatial rhythm and
    symbolic hierarchy plus frieze rhythm, ring authority, mirrored duality, oath-path diagonals,
    heraldic massing, and mythic scale contrast; the style should support portraits, objects,
    architecture, creatures, symbols, and full scenes through reusable spatial grammar instead of
    one fixed layout.
  atmosphere_and_mood: >-
    Carry mood through labor, stewardship, and hard-earned abundance plus custodial duty and
    responsible power and austere grandeur, cosmic obligation, sacred violence, stewardship, trial,
    inheritance, and severe ceremonial beauty; the image can become severe, sensual, sacred,
    violent, quiet, or strange when prompt X asks for it, while the preset supplies mythic
    consequence.
  rendering_and_quality: >-
    Finish with iron recognition with denoised dark editorial polish and controlled material truth
