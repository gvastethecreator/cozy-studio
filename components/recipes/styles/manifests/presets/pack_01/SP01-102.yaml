visualDna:
  aesthetic: 'Layered color street photography: saturated color and hard light organized into three or four planes of depth, each holding its own small action.'
  subject_treatment: Keep the prompt subject, action and setting; render them as an unposed moment seen by a working photographer, without inventing an event, crowd or location the prompt did not ask for.
  color_and_tone: Rich saturated color fields — saffron, cobalt, crimson, white — separated by deep shadow gaps.
  lighting_and_shadow: Strong low sun that splits the scene into bright color planes and black shadow shapes.
  texture_and_material: Sun-baked walls, cloth, skin and dust rendered with slide-like density and fine grain.
  camera_and_composition: 28–50 mm, a cropped foreground figure or object, a midground gesture and a background incident, all readable at once.
  atmosphere_and_mood: Busy yet composed, many small lives stacked into one complex, balanced frame.
  rendering_and_quality: Saturated documentary color without HDR; separation comes from light and color, not sharpening.
  creative_brief: "Layered color street photography: saturated color and hard light organized into three or four planes of depth, each holding its own small action. Carry it through three or four depth planes, saturated color fields, black shadow gaps, foreground crop, simultaneous small actions. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: three or four depth planes; saturated color fields; black shadow gaps; foreground crop; simultaneous small actions
