    material-forward fashion transformation with drape, surface, tactility, body-volume logic, and
    fabric-as-style behavior, so the preset supplies styling behavior rather than a fixed outfit
    card, required wearer, or literal garment sample.
  subject_treatment: >-
    Preserve the prompt's subject, motion, and context while forms wrap, coat, glaze, harden,
    dissolve, ripple, fold, bind, sparkle, veil, plate, or mineralize through Crackle seams,
    ball-joint segmentation, bisque proportion cues, glassy focal nodes and hinged articulation
    logic; identity stays readable as silhouette, fit, layering, body-volume logic, edge behavior,
    and styling hierarchy shift into this preset.
  color_and_tone: >-
    Map color through material-native hue, surface highlights, depth values, transparency shifts,
    metallic accents, and tactile color variation; keep textile values separated, accents
    intentional, material color believable, and palette behavior attached to the subject instead of
    pasted wardrobe decoration.
  lighting_and_shadow: >-
    Use Glossy porcelain highlights, display-spot precision and soft window daylight plus
    material-revealing light with gloss, rim, translucency, sparkle, subsurface, matte falloff, or
    volumetric separation as the styling light contract, revealing cut, drape, surface response,
    trim, transparency, or armor structure without erasing prompt readability.
  texture_and_material: >-
    Render Ceramic bisque, high-fire glaze, glassy highlights, mohair-like softness, painted blush
    and crackle-kintsugi plus fabric grain, fur, chain, knit, satin, lace, leather, polymer, smoke,
    water, fire, gel, gold leaf, stone, or skin surface; keep fabric scale, seams, fibers, shine,
    opacity, folds, hardware, elemental edges, or body-surface treatment coherent across the whole
    prompt.
  camera_and_composition: >-
    Compose with Compose for Porcelain Doll using its key spatial cues: Glossy bisque, glassy focal
