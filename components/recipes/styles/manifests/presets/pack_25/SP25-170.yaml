visualDna:
  aesthetic: 'Graphic Scale Collisions: a huge element meets a tiny one, the tension between scales creating one unmistakable reading point.'
  subject_treatment: Set a huge and a tiny element of the prompt's subject against each other so the scale contrast creates one clear reading point, the copy exact.
  color_and_tone: Short palette with the focus of contrast where the two scales meet.
  lighting_and_shadow: Coherent light when objects share a scene, shadows matching the scale.
  texture_and_material: Sober materials and proportional detail, secondary elements kept simple.
  camera_and_composition: One large and one small element linked by alignment, contact or a meaningful gap.
  atmosphere_and_mood: A surprise of scale and a clear message, never arbitrary gigantism.
  rendering_and_quality: Clean campaign image where the scale contrast reinforces the message.
  creative_brief: "Graphic Scale Collisions: a huge element meets a tiny one, the tension between scales creating one unmistakable reading point. Carry it through huge meets tiny, one reading point, linked scales, short palette. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: huge meets tiny; one reading point; linked scales; short palette
