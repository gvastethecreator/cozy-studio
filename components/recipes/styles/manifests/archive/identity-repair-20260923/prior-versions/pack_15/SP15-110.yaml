visualDna:
  aesthetic: >-
    Introduce small channel offsets, broken scanline intervals, and warped secondary contours against a
    stable underlying form.
  subject_treatment: Preserve requested identity, proportions, pose, and action; shift only secondary edges or regions.
  color_and_tone: Retain the requested palette, using cyan, magenta, or red separation as localized accents.
  lighting_and_shadow: Keep existing illumination stable; displacement does not require additional glow.
  texture_and_material: Use crisp pixel-edge shifts and controlled band interruptions rather than diffuse noise.
  camera_and_composition: Hold the original crop and primary silhouette steady while displacing a few internal planes.
  atmosphere_and_mood: Create unease through controlled misalignment while following the requested tone.
  rendering_and_quality: Keep the core structure readable first and bound each displacement.
avoidRules:
  - global tearing that moves the whole silhouette
  - duplicated or missing defining features
  - random noise without controlled edge displacement
assets:
  defaultImage: /assets/recipes/styles/defaults/SP15-110.webp
attributes:
  negativePrompt: >-
    global tearing that moves the whole silhouette, duplicated or missing defining features, random noise
