visualDna:
  aesthetic: 'Permanent-marker drawing: bold felt-tip lines of near-fixed width, solid black fills and ink bleeding into the paper fibers at stroke ends.'
  subject_treatment: Keep the prompt subject, action, setting and camera, and redraw them entirely with this process's own physical mark, so the same subject would read differently in any neighbouring ink or print technique.
  color_and_tone: Carbon black with one or two cool grey marker layers on bright copier paper.
  lighting_and_shadow: Shadows as flat solid black shapes and a single grey marker tone, no gradients.
  texture_and_material: Chisel and bullet-tip stroke edges, streaky fills, bleed halos and slight show-through of overlapping passes.
  camera_and_composition: Keep the requested view with strong silhouettes and big black shapes.
  atmosphere_and_mood: Loud, immediate and graphic, drawn without hesitation.
  rendering_and_quality: Bold marker graphic with streaky fills; no fine hairlines and no painted rendering.
  key_features: fixed-width felt-tip line; solid black fills; bleed halos; one grey marker; streaky passes
  creative_brief: "Permanent-marker drawing: bold felt-tip lines of near-fixed width, solid black fills and ink bleeding into the paper fibers at stroke ends. Carry it through fixed-width felt-tip line, solid black fills, bleed halos, one grey marker, streaky passes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
