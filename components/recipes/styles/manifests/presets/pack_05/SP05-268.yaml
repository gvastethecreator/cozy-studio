visualDna:
  aesthetic: 'Seinen anime ink with selective chromatic edge doubling: magenta and cyan outlines slip two or three pixels off an otherwise stable black contour, like misregistered two-color print.'
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Deep neutral grays and navy fills, with saturated pink and blue-cyan kept as separate thin bands along the edges.
  lighting_and_shadow: Colored reflected light is suggested only by the offset edges; no signs, lamps or night setting are added.
  texture_and_material: Clean flat fills with slight pigment bloom confined to the colored edge bands.
  camera_and_composition: Keep the requested framing and a steady silhouette; the offset color, not the camera, carries all the energy.
  atmosphere_and_mood: Pressured, over-bright and quietly desperate under a calm surface.
  rendering_and_quality: A stable black keyline with two offset color ghosts and flat fills; no all-over glow haze.
  key_features: magenta and cyan edge offsets; stable black keyline; misregistered print feel; navy-gray fills; localized pigment bloom
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Neon Despair Pressure Style as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
