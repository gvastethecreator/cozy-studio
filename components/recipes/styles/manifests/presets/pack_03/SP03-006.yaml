visualDna:
  aesthetic: >-
    V-Ray ArchViz Raytracer acts as a transferable CGI-style router: start from Architectural
    visualization, Clean lines, adaptive sampling and renderer-pipeline system built from sampling
    behavior, shader evaluation, light transport, denoise strategy, and engine-specific production
    polish, then apply the 3D/render behavior to prompt X instead of recreating a fixed demo image.
  subject_treatment: >-
    Transform any prompt subject through Precise; preserve the prompt subject while translating it
    through the renderer strengths: path tracing, biased sampling, real-time GI, product-studio
    preview, or feature-film shading, keeping the requested identity, silhouette, pose, object
    function, or environment legible.
  color_and_tone: >-
    Build color with Warm neutral exposure, architectural balance, believable material color; make
    color come from color management, HDR response, spectral bloom, engine tonemapping, material
    albedo, and physically plausible exposure, with deliberate value grouping, exposure control, and
    medium-specific limits rather than generic color wash.
  lighting_and_shadow: >-
    Handle light through IES lights, sun, adaptive dome; let engine-specific GI, ray tracing, Lumen,
    caustics, volume scattering, HDRI, or studio reflection control drive value hierarchy, so value
    structure supports the renderer and does not overwrite the requested content.
  texture_and_material: >-
    Render Photorealistic materials, layered BRDF; surface detail should reveal BSDF behavior,
    sampling clarity, shader networks, displacement, adaptive refinement, and material truth rather
    than a pasted texture, keeping material scale coherent and avoiding noisy filler texture.
  camera_and_composition: >-
    Structure the image through Lookdev camera for V Ray ArchViz Raytracer: three quarter or
    orthographic framing, clean silhouette read, material highlights, controlled depth, and vertical
    card composition; compose for renderer readability through focal hierarchy, product or VFX
    staging, material swatches, path-traced depth, and clean engine output, with scale, spacing,
    edge rhythm, and visual hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Inviting, expensive, aspirational, clean real estate polish; derive mood from
    render fidelity, production confidence, cinematic polish, engine interactivity, or industrial
    design clarity, letting the renderer alter interpretation without demanding a specific story,
    location, or character.
  rendering_and_quality: >-
    Finish with ArchViz clarity, catalog realism, interior design lighting discipline; finish with
    credible CGI output, controlled noise, accurate reflections, stable geometry, and no raw
    viewport or cheap preview look, clean denoised surfaces where appropriate, and enough shader
    evidence to make the CGI mode recognizable.
  key_features: >-
    Architectural visualization; Clean lines, adaptive sampling; Warm neutral exposure,
    architectural balance, believable material color; Photorealistic materials, layered BRDF;
    Lookdev camera for V Ray ArchViz Raytracer: three quarter or orthographic framing, clean
    silhouette read, material highlights, controlled depth, and vertical card composition
  creative_brief: >-
    Apply V-Ray ArchViz Raytracer as a CGI/render preset over prompt X: preserve the user's
    requested subject, then route modeling, shader response, lighting, material scale, composition,
    mood, and final render craft through Architectural visualization, Clean lines, adaptive
    sampling, Photorealistic materials, layered BRDF without requiring the card image's original
    subject.
