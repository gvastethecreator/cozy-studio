visualDna:
  aesthetic: 'Mobius architecture: a road, deck or building band twisted once and joined to itself, so its top surface flows onto its underside without an edge crossing.'
  subject_treatment: Keep the requested subject recognisable; this preset openly changes its structure into a single-surface band with one twist that makes inside become outside, and that advertised structural change is the purpose of the preset.
  color_and_tone: Clean structural whites and greys with the functional colors of the surface, such as asphalt or lane paint.
  lighting_and_shadow: Sun catching the twist so the surface turns from light to shadow in one continuous gradient.
  texture_and_material: Continuous paving, railings or glazing that run unbroken across the twist.
  camera_and_composition: An angle that shows the whole loop and the twist, so the single surface can be followed with the eye.
  atmosphere_and_mood: Elegant, endless and slightly dizzying, a path that never reaches an edge.
  rendering_and_quality: Precise architectural rendering with continuous surface details that never jump.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Mobius Loop Architecture as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: band twisted once and joined; top flowing onto underside; continuous paving across the twist; whole-loop view; light-to-shadow gradient
