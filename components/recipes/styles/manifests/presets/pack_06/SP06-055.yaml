visualDna:
  aesthetic: 'Glitch art: an image corrupted digitally, with RGB channels split apart, rows of pixels displaced sideways and blocks of compression artifacts breaking the picture.'
  subject_treatment: Redraw the prompt's subject, pose, setting and framing with this digital mark system as one finished picture; it never becomes a concept board, turnaround sheet or 3D object render.
  color_and_tone: Original image colors with red, green and blue channel offsets, electric cyan and magenta fringes, occasional flat digital color bars.
  lighting_and_shadow: The underlying light stays, but is sliced by horizontal tears and blocky smears.
  texture_and_material: Horizontal line displacement, 8x8 compression blocks, pixel sorting streaks, scanline dropouts, datamosh smears.
  camera_and_composition: Keep the requested framing; the subject stays recognizable under the corruption.
  atmosphere_and_mood: Unstable, electric and uneasy, a signal about to fail.
  rendering_and_quality: Crisp digital artifacts with deliberate placement, subject readable through them; no analog film grain and no painterly brushwork.
  key_features: RGB channel split; horizontal pixel displacement; compression block artifacts; pixel sorting streaks; recognizable subject under corruption
  creative_brief: "Glitch art: an image corrupted digitally, with RGB channels split apart, rows of pixels displaced sideways and blocks of compression artifacts breaking the picture. Carry it through RGB channel split, horizontal pixel displacement, compression block artifacts, pixel sorting streaks, recognizable subject under corruption. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
