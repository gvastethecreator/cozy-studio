visualDna:
  aesthetic: 'JPEG artifacts: heavy 8×8 block compression, ringing around edges and color blocking.'
  subject_treatment: "Keep the prompt's image intact and pass it through this signal failure at a controlled strength so the subject stays readable: the image is heavily compressed into visible 8×8 blocks with ringing around edges."
  color_and_tone: Posterized colors with block banding, as produced by the medium, not added as decoration.
  lighting_and_shadow: Lighting comes from the source image; the artifact reshapes values and edges without inventing new light.
  texture_and_material: Blocky compression and edge ringing, at a consistent unit size across the frame.
  camera_and_composition: Keep the prompt framing; concentrate the effect so the main subject remains the clear read at card size.
  atmosphere_and_mood: Degraded, internet-worn, crude and ironic, coming from the medium itself.
  rendering_and_quality: Clean, deliberate digital artifact with a consistent unit and no random speckle or smeared noise.
  key_features: 8x8 blocks; edge ringing; color banding
  creative_brief: "JPEG artifacts: heavy 8×8 block compression, ringing around edges and color blocking. Carry it through 8x8 blocks, edge ringing, color banding. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
