visualDna:
  aesthetic: 'Foil stamping: metallic foil pressed into paper with slight impression.'
  subject_treatment: "Physical print finish: present the prompt's subject as artwork on a printed support (card, paper, cover) finished with this process, keeping the subject recognizable: the artwork's key lines and shapes are foil-stamped in metallic gold or silver on dark stock."
  color_and_tone: Gold or silver foil on navy, black or deep green stock.
  lighting_and_shadow: Raking light across the printed support to reveal relief, gloss or foil.
  texture_and_material: Metallic foil with crisp edges and slight deboss, on quality paper or board stock.
  camera_and_composition: Close angled view of the printed piece so the finish and the subject both read at card size.
  atmosphere_and_mood: Luxurious, elegant, precious and formal, carried by the tactile finish.
  rendering_and_quality: Crisp product-photography finish with accurate paper and ink detail; no readable text.
  key_features: metallic foil; crisp impression; physical print process
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Foil Stamping as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
