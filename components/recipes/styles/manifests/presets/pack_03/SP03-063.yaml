visualDna:
  aesthetic: 'Isometric 3D relief map: the location sculpted as a tabletop terrain block with stepped contour terraces, a flat water plane and miniature landmarks.'
  subject_treatment: "Profile: keep the prompt's location and its landmarks; this preset owns the elevated isometric relief-map view and tabletop scale, and nothing else about the request changes."
  color_and_tone: Hypsometric tints from sea teal through meadow green and tan to white peaks; landmarks in warm clean accent colors.
  lighting_and_shadow: One low sun from the upper left casting long terrain shadows that make elevation readable; soft ambient occlusion in valleys.
  texture_and_material: Smooth matte terrain with visible contour steps, simplified clumped trees and small toy-like buildings; cut edges show layered strata.
  camera_and_composition: Fixed isometric or 30° elevated orthographic view of a square or round map block floating on a plain background.
  atmosphere_and_mood: Curious and inviting, a whole place small enough to hold.
  rendering_and_quality: Clean stylized render with crisp contour edges and no fog, every region readable at a glance.
  key_features: tabletop terrain block; stepped contour terraces; hypsometric tints; low sun relief shadows; cut strata edges
  creative_brief: "Isometric 3D relief map: the location sculpted as a tabletop terrain block with stepped contour terraces, a flat water plane and miniature landmarks. Carry it through tabletop terrain block, stepped contour terraces, hypsometric tints, low sun relief shadows, cut strata edges. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
