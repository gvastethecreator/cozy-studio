visualDna:
  aesthetic: "Differential growth: the subject's surfaces grown into dense crinkled ruffles like lettuce coral, kale or brain folds, where the edge outgrows the center."
  subject_treatment: Keep the prompt subject recognizable with its pose, setting and camera view; rebuild its surfaces as densely ruffled differential-growth folds while its silhouette stays readable (a declared change), without forcing a T-pose or turning an object into an avatar.
  color_and_tone: One organic hue per form, such as coral pink, pale sea green or bone white, darker deep inside the folds.
  lighting_and_shadow: Soft top light with deep occlusion between the ruffles and subsurface glow on the thin fold edges.
  texture_and_material: Ever-smaller wavy frills, thin membrane edges of consistent thickness, no seams and no repeating tiles.
  camera_and_composition: Keep the requested view; the silhouette stays clear while the surface boils with folds.
  atmosphere_and_mood: Hypnotic and alive, a form that kept growing after it was finished.
  rendering_and_quality: Simulation-grown surface with self-avoiding folds, not noise displacement or fractal copies.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Differential Growth Folds as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: crinkled ruffled edges; edge-outgrows-center folds; deep fold occlusion; subsurface on thin edges; single organic hue
