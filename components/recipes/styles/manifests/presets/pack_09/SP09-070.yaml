visualDna:
  aesthetic: >-
    Polystyrene (Styrofoam) treats fabrication as visible style language: start from Packing foam,
    Beaded, and Broken beads, then turn manufacturing process, tooling marks, seams, tolerances, and
    industrial material behavior into portable surface behavior rather than a literal material
    sample.
  subject_treatment: >-
    Transform any prompt subject through Beads: preserve identity and pose while letting forms carry
    manufactured seams, tolerances, pressure marks, and finish logic through edge profile, surface
    breakup, thickness, contact marks, and detail scale.
  color_and_tone: >-
    Use White as the material palette, with controlled value separation, local color variation, and
    hue shifts that follow the subject's form rather than flattening it into a pasted texture.
  lighting_and_shadow: >-
    Let Subsurface scattering define the light response: highlights, occlusion, translucency,
    specular scatter, matte falloff, or rim behavior should reveal Polystyrene (Styrofoam) without
    hiding the prompt subject.
  texture_and_material: >-
    Render Beaded through constructed regularity, stress points, joins, molded edges, and
    process-specific finish; keep grain scale, residue, buildup, fractures, fiber, pores, or surface
    tension coherent across the whole image.
  camera_and_composition: >-
    Compose around Broken beads as reusable material rhythm: macro-friendly for texture tasks, but
    able to wrap objects, figures, environments, and props without forcing one sample view.
  atmosphere_and_mood: >-
    Keep the mood Disposable, white by using use, fabrication, utility, and cultural material
    association; the material should color the scene's feeling while preserving the user's requested
    subject and setting.
  rendering_and_quality: >-
    Finish with Cheap, packaging material clarity: physically coherent reflectance, clean contact
    detail, controlled micro-texture, readable silhouette behavior, and no noisy stock-texture
    overlay.
  key_features: Packing foam; Beads; Beaded; Subsurface scattering; Broken beads
  creative_brief: >-
    Route any subject through Polystyrene (Styrofoam) as a transferable man-made material visual
    system while preserving the prompt's subject, action, and setting. Summon the cellular geometry
    of expanded polystyrene where fused white beads create a surface of dimpled spheres, each one a
    tiny void of trapped air, the subsurface scattering giving the material a ghostly translucence
    at the edges. Broken beads should reveal the internal cell structure like a cross-section of
    frozen foam. Capture the accidental sculpture of the disposable, packaging as industrial
    archaeology. Use Polystyrene as portable surface/render behavior over any input: map its
    texture, light response, edge wear, color chemistry, and tactile rhythm onto the subject instead
    of requiring a literal material sample, macro tile, wall, landscape, source object, or scene
    where the material naturally appears.
