visualDna:
  aesthetic: 'Tilt-shift miniature: a tilted lens plane from a high vantage point so only a thin band is sharp, making real scenes look like toy models.'
  subject_treatment: Keep the prompt subject, action and setting; change only the capture technique described here, so the subject reads clearly through it.
  color_and_tone: Slightly boosted saturation and contrast that make surfaces look painted.
  lighting_and_shadow: Bright daylight with clear small shadows, like a lit model table.
  texture_and_material: Sharp band of detail across the middle; heavy blur above and below.
  camera_and_composition: High downward angle, thin horizontal or diagonal focus band on the subject, strong blur fading to top and bottom.
  atmosphere_and_mood: Playful and toy-like, a busy world shrunk to a tabletop.
  rendering_and_quality: Optical tilt blur with a clean gradient; not a straight top-down drone view.
  key_features: thin tilted focus band; high vantage; blur top and bottom; boosted toy-like color; small crisp shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tilt-Shift (Miniature) as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
