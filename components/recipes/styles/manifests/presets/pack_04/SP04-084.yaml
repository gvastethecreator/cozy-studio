visualDna:
  aesthetic: 'Material exploration board: a design sketch of the subject beside a grid of candidate swatches and material spheres, each testing a different surface.'
  subject_treatment: Keep the prompt subject and its identity as the thing being designed; this deliverable owns a material board with a central subject study flanked by a swatch matrix and zoom callouts, and that layout replaces the requested framing.
  color_and_tone: Material-true hues grouped by role (primary, secondary, trim) on a neutral grey board.
  lighting_and_shadow: Identical studio lighting on every swatch and sphere so gloss, roughness and translucency compare fairly.
  texture_and_material: Each swatch a distinct surface such as hammered copper, crazed enamel, oiled leather, frosted glass or lichen-crusted stone.
  camera_and_composition: Subject study at center or left, swatch squares and spheres in a tidy grid, circular zoom callouts on the subject.
  atmosphere_and_mood: Analytical and tactile, searching for the right skin.
  rendering_and_quality: Swatches physically rendered, the subject sketch semi-finished with materials applied in zones.
  key_features: swatch grid; material spheres; central semi-finished subject study; identical swatch lighting; circular zoom callouts
  creative_brief: "Material exploration board: a design sketch of the subject beside a grid of candidate swatches and material spheres, each testing a different surface. Carry it through swatch grid, material spheres, central semi-finished subject study, identical swatch lighting, circular zoom callouts. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
