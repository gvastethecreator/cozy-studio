visualDna:
  aesthetic: 'Burlap decay: coarse sackcloth surfaces frayed, stained and patched.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: the target's fabric surfaces fray at seams and edges, with stains and rough patches. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Sack brown with darker stains and pale frayed threads.
  lighting_and_shadow: Dim natural light, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Coarse weave, loose threads, stains and patches, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Poor, worn, rustic and humble, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: frayed burlap; stains; patched weave; surface-level damage; structure intact
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Burlap Sack as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
