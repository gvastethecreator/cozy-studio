visualDna:
  aesthetic: 'MRI slice: a thin cross-section through the subject where soft tissues separate into smooth grey tones, water bright or dark depending on the weighting.'
  subject_treatment: Keep the prompt subject, action and setting as the thing being imaged; this preset replaces visible-light appearance with what the sensor records, and adds no readable readout, label or diagnosis.
  color_and_tone: Smooth greyscale with bright fat or fluid, dark air and bone, no color.
  lighting_and_shadow: No surface light; contrast comes from tissue signal.
  texture_and_material: Soft internal structures, clean edges, faint ringing or motion artifacts at borders.
  camera_and_composition: Straight sagittal, axial or coronal slice, subject centered on black.
  atmosphere_and_mood: Calm and revealing, a quiet map of an inside.
  rendering_and_quality: Clinical MRI look with no text, markers or diagnosis.
  creative_brief: "MRI slice: a thin cross-section through the subject where soft tissues separate into smooth grey tones, water bright or dark depending on the weighting. Carry it through thin cross-section slice, smooth greyscale soft tissue, black background, sagittal or axial view, faint ringing. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: thin cross-section slice; smooth greyscale soft tissue; black background; sagittal or axial view; faint ringing
