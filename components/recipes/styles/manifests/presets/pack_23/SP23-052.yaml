visualDna:
  aesthetic: >-
    Build an image from fluid geometric masses, crisp color boundaries and luminous value contrasts,
    using curve rhythms to connect forms without surface texture.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Reorganize neither
    the subject nor its parts; let fluid geometry clarify existing forms.
  color_and_tone: >-
    Retain the requested palette and establish clear boundaries between color masses. Do not force
    extreme saturation, a fixed light-dark scheme or particular hues.
  lighting_and_shadow: >-
    Follow the requested illumination and express it through deliberate luminous contrasts without
    adding suns, halos, new light sources or unsupported glow.
  texture_and_material: >-
    Keep surfaces clean and untextured unless the request specifies otherwise. Preserve the materials
    represented rather than turning all forms into a uniform finish.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and relationships. Geometric rhythm does not add
    circular composition, symmetry or a new arrangement.
  atmosphere_and_mood: >-
    Retain the requested setting and mood. Curved rhythms and luminous contrast remain visual treatment
    and do not add motifs, transformations or narrative.
  rendering_and_quality: >-
    Keep boundaries sharp, curves intentional and broad values coherent. Use enough shape variation to
    maintain identity without relying on texture or excessive saturation.
avoidRules:
  - unrequested motifs or narrative imagery
  - forced extreme saturation, halos or circular symmetry
  - details that alter identity or function
