visualDna:
  aesthetic: >-
    On an explicitly requested metallic or gilt target, flat painted pigment simulates a restrained
    material color with clear-edged shapes and a static, illustrated sheen.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose, action and function. Apply the effect only to
    the material target the user identifies; do not turn unrelated shapes into ornaments.
  color_and_tone: >-
    Preserve the requested palette and local color. Use a gold-like pigment only when the user specifies
    that accent or the target is already gilt; do not recolor the rest of the image.
  lighting_and_shadow: >-
    Follow the requested illumination and represent the pigment with a static painted value shift; do not
    add a reflective flash or a new light source.
  texture_and_material: >-
    Keep the simulation flat and pictorial on the authorized target only; it does not guarantee physical
    foil, holography or interactive reflectivity.
  camera_and_composition: >-
    Retain the requested viewpoint, crop and arrangement. The material accent follows the existing target
    without creating a frame, emblem or new composition.
  atmosphere_and_mood: >-
    Preserve the requested setting and tone. A metallic-pigment accent does not add religious, ceremonial
    or heraldic meaning.
  rendering_and_quality: >-
    Use simple, clean-edged pigment areas with restrained highlights and clear separation from adjacent
    colors; keep the effect localized and legible.
avoidRules:
  - metallic pigment outside the requested material target
  - guaranteed physical foil or holographic behavior
  - unrequested frames, emblems or symbols
