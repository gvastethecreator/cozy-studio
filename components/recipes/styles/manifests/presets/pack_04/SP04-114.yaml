visualDna:
  aesthetic: 'Newspaper op-ed spot illustration: a small conceptual scene of tiny figures and oversized symbols, drawn in flat shapes with fine grain.'
  subject_treatment: Keep the prompt subject, action, setting and framing; apply only this print or drawing technique, without adding slogans, borders, frames or a poster layout.
  color_and_tone: Limited palette of three or four colors, typically navy, coral, cream and mustard, with dry grain texture.
  lighting_and_shadow: Flat shapes with a single cast-shadow shape per object at a consistent angle.
  texture_and_material: Dry digital grain and pencil-like speckle inside flat shapes, crisp silhouette edges.
  camera_and_composition: Keeps the requested subject but stages it as a metaphor with dramatic scale contrast, tiny people and huge objects.
  atmosphere_and_mood: Thoughtful, wry and a little anxious, an idea about the times.
  rendering_and_quality: Economical shape design with textured flats; no headlines, no borders and no speech bubbles.
  creative_brief: "Newspaper op-ed spot illustration: a small conceptual scene of tiny figures and oversized symbols, drawn in flat shapes with fine grain. Carry it through conceptual metaphor staging, tiny figures and huge symbols, three to four color palette, dry grain texture, single cast shadows. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: conceptual metaphor staging; tiny figures and huge symbols; three to four color palette; dry grain texture; single cast shadows
