visualDna:
  aesthetic: 'Overscale Object Fragments: a huge crop of one recognizable part of the subject becomes the whole structure of the ad.'
  subject_treatment: Use one enlarged, still recognizable fragment of the prompt's subject as the composition, keeping its identity and proportions, with the copy set exact.
  color_and_tone: The subject palette kept, the copy set against a quiet zone.
  lighting_and_shadow: Light that reveals the fragment and keeps its details readable.
  texture_and_material: Relevant material detail shown at a believable, readable scale.
  camera_and_composition: A bold but identifiable crop with a clear relationship to the copy.
  atmosphere_and_mood: Presence and curiosity created by the sheer scale of the crop.
  rendering_and_quality: Crisp campaign photography where the fragment identifies the subject.
  creative_brief: "Overscale Object Fragments: a huge crop of one recognizable part of the subject becomes the whole structure of the ad. Carry it through giant crop, recognizable fragment, quiet copy zone, bold scale. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: giant crop; recognizable fragment; quiet copy zone; bold scale
