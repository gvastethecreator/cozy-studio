visualDna:
  aesthetic: 'Real-time hatching shader: lit 3D geometry shaded with stacked hatch textures, one layer of strokes per tone, so darker areas gain cross-hatching automatically.'
  subject_treatment: Keep the prompt subject's geometry, pose, setting and camera exactly; this preset replaces only the beauty render with the named shader or render-pass output computed from that 3D geometry, never a sensor capture.
  color_and_tone: Dark ink strokes on warm paper white, or one ink color; tone comes only from stroke density.
  lighting_and_shadow: A single directional light; each shading step swaps in a denser hatch layer, shadows fully cross-hatched.
  texture_and_material: Strokes mapped onto the surface in UV space, following the geometry, at constant screen density with slight texture swimming.
  camera_and_composition: Keep the requested camera; strong single-light modeling shows all hatch levels.
  atmosphere_and_mood: Bookish and moody, an engraving that turns in 3D.
  rendering_and_quality: Non-photorealistic render with even stroke density and clean silhouettes; distinct from hand-drawn ink and from cel shading.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Tonal Art Map Hatching Shader as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: stacked hatch texture layers; tone by stroke density; strokes follow surface UVs; one directional light; clean silhouettes
