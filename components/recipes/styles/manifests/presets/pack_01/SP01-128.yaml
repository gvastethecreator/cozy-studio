visualDna:
  aesthetic: 'Focus-stacked specimen photography: dozens of macro frames merged so a small specimen is sharp from front to back on a clean white or black background.'
  subject_treatment: Keep the prompt subject and setting; apply this nature-photography approach to them without substituting a landscape, animal or plant the prompt did not ask for.
  color_and_tone: Accurate neutral color, clean white or black ground, subtle iridescence where present.
  lighting_and_shadow: Diffused dome lighting from all sides, minimal shadow, no hot spots on shiny shells.
  texture_and_material: Every hair, facet, pore and ridge resolved across the whole depth of the specimen.
  camera_and_composition: Specimen centered, straight lateral or dorsal view, generous clean margin.
  atmosphere_and_mood: Precise and scientific, wonder through exhaustive clarity.
  rendering_and_quality: Museum-plate clarity with no blurred planes and no stacking halos.
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Focus-Stacked Specimen as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
  key_features: front-to-back sharpness; clean white or black ground; diffused dome light; centered specimen; scientific view
