visualDna:
  aesthetic: 'Luxury penthouse interior: book-matched marble slabs, satin brass inlays, full-height glazing and custom millwork, everything built in and seamlessly joined.'
  subject_treatment: Keep the requested room function, occupants, action and constraints; rebuild its shell, surfaces, joinery, furniture vocabulary and light in this interior system, adding only the pieces that room needs rather than a sample furniture set.
  color_and_tone: Warm ivory, Calacatta white with gold-grey veining, smoked bronze and taupe; satin brass as the single metallic; muted, rich, medium contrast.
  lighting_and_shadow: 'Layered hospitality lighting: dimmed cove light, pin spots on stone and art, warm under-cabinet strips, night sky or dusk through glass kept dark.'
  texture_and_material: Mirror-matched marble with continuous veining, satin brushed brass, smoked glass, silk-wool rugs, lacquered or fluted walnut panels.
  camera_and_composition: Keep the requested view; wide lens held level, veining and brass lines symmetrical where possible, reflections controlled.
  atmosphere_and_mood: Hushed, expensive and composed, with calm at great height.
  rendering_and_quality: 'High-end architectural photograph: clean reflections, continuous vein matching, no gaudy gold overload or skyline postcard.'
  key_features: book-matched marble veining; satin brass inlay; layered cove and pin-spot light; smoked glass; built-in custom millwork
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Luxury Penthouse as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
