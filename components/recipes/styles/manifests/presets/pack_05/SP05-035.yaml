visualDna:
  aesthetic: >-
    Build the graphic anime treatment from sharp clear contours with long slanted accents and
    narrow stretched forms organized by tall, stacked planes. Let sweeping diagonals, taut curves,
    and controlled stops set its rhythm; use cold slate, muted olive, sand neutrals, and a small
    warm accent for color and broad untextured value masses with sparse dry abrasion for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use sharp clear contours with long slanted accents
    for edge work, narrow stretched forms organized by tall, stacked planes for form
    simplification, and sweeping diagonals, taut curves, and controlled stops only where movement
    is already requested.
  color_and_tone: >-
    Build value groups with cold slate, muted olive, sand neutrals, and a small warm accent. Place
    the strongest contrast on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: cool grouped shadows with a small warm edge highlight. Keep
    shadows grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with broad untextured value masses with sparse dry abrasion,
    preserving depicted materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use vertical depth layers and steep diagonals that
    clarify scale within the given frame to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey disciplined unease and resilient focus, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with strong silhouette, broad values, and texture kept away from the main contour; keep
    detail selective and accents attached to existing forms.
  key_features: >-
    sharp clear contours with long slanted accents; narrow stretched forms organized by tall,
    stacked planes; cold slate, muted olive, sand neutrals, and a small warm accent; sweeping
    diagonals, taut curves, and controlled stops; broad untextured value masses with sparse dry
    abrasion; vertical depth layers and steep diagonals that clarify scale within the given frame.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with sharp clear contours
    with long slanted accents, narrow stretched forms organized by tall, stacked planes, and cold
    slate, muted olive, sand neutrals, and a small warm accent; use sweeping diagonals, taut
    curves, and controlled stops only where movement is already present, and apply broad
    untextured value masses with sparse dry abrasion as the drawing finish.
