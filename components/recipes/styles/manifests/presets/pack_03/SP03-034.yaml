visualDna:
  aesthetic: 'Three-point CGI lighting rig: a key, a fill and a back light placed around the subject for clean shape, separation and balanced exposure.'
  subject_treatment: Keep the prompt subject, geometry, setting and camera unchanged; replace only the CGI lighting setup and its render behavior, without adding a new environment.
  color_and_tone: Neutral balanced color, clean whites and a controlled, moderate contrast.
  lighting_and_shadow: Soft key 45 degrees to the side, dimmer fill opposite, bright back light outlining the edge.
  texture_and_material: Material detail clearly readable on the key side, separated from the background.
  camera_and_composition: Keep the requested framing; subject clearly separated from a darker backdrop.
  atmosphere_and_mood: Clear and professional, the subject presented at its best.
  rendering_and_quality: Clean studio lighting with no clutter in the light setup.
  key_features: key, fill and back light; 45-degree key; edge separation; balanced exposure; dark backdrop
  creative_brief: "Three-point CGI lighting rig: a key, a fill and a back light placed around the subject for clean shape, separation and balanced exposure. Carry it through key, fill and back light, 45-degree key, edge separation, balanced exposure. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
