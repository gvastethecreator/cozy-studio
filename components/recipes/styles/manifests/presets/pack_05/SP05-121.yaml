visualDna:
  aesthetic: >-
    Build the graphic anime treatment from smooth tapered contours crossed by fine patterned
    strokes and flowing forms with soft edges and delicate ornamental repeats. Let luminous arcs
    that flare briefly and taper into calm curves set its rhythm; use winter blue, warm amber, and
    muted cream for color and clean cel color with faint seasonal grain for finish.
  subject_treatment: >-
    Preserve the requested content and framing. Use smooth tapered contours crossed by fine
    patterned strokes for edge work, flowing forms with soft edges and delicate ornamental repeats
    for form simplification, and luminous arcs that flare briefly and taper into calm curves only
    where movement is already requested.
  color_and_tone: >-
    Build value groups with winter blue, warm amber, and muted cream. Place the strongest contrast
    on the requested focal area and preserve explicit color instructions.
  lighting_and_shadow: >-
    Treat lighting graphically: warm accent glows balanced by cool shadow groups. Keep shadows
    grouped and respect any light direction already requested.
  texture_and_material: >-
    Render existing surfaces with clean cel color with faint seasonal grain, preserving depicted
    materials and adding no props or effects.
  camera_and_composition: >-
    Within the requested camera and crop, use nested asymmetrical curves that leave the existing
    scene legible to organize existing forms; preserve location and action.
  atmosphere_and_mood: >-
    Let line weight, spacing, and value convey tender ceremony and restrained resolve, while
    preserving the prompt's emotional intent.
  rendering_and_quality: >-
    Finish with delicate line detail, clean cel shapes, and gentle warm-cool contrast; keep detail
    selective and accents attached to existing forms.
  key_features: >-
    smooth tapered contours crossed by fine patterned strokes; flowing forms with soft edges and
    delicate ornamental repeats; winter blue, warm amber, and muted cream; luminous arcs that
    flare briefly and taper into calm curves; clean cel color with faint seasonal grain; nested
    asymmetrical curves that leave the existing scene legible.
  creative_brief: >-
    Keep the requested subject, action, location, and crop. Render them with smooth tapered
    contours crossed by fine patterned strokes, flowing forms with soft edges and delicate
    ornamental repeats, and winter blue, warm amber, and muted cream; use luminous arcs that flare
    briefly and taper into calm curves only where movement is already present, and apply clean cel
    color with faint seasonal grain as the drawing finish.
