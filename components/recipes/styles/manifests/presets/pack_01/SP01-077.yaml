visualDna:
  aesthetic: >-
    Medical Photography acts as a transferable photographic style router: begin from Clinical
    medical documentation, Clean depth field, and technical capture system built from diagnostic
    optics, surveillance position, scientific sensor behavior, and evidence-grade readability, then
    apply the photographic behavior to prompt X instead of recreating a fixed card scene.
  subject_treatment: >-
    Treat any prompt subject through Clean hyper-detailed framing; preserve prompt identity while
    translating it through device constraints, evidence logic, extreme scale, or diagnostic signal,
    keeping the original subject, pose, species, object, or environment legible.
  color_and_tone: >-
    Grade with Sterile red-blue accents; use palette as sensor output: thermal gradients, monochrome
    electron depth, CCTV compression, medical neutral color, or astrophotographic false color, with
    value separation and white balance choices that feel captured in-camera rather than painted
    over.
  lighting_and_shadow: >-
    Use Bright surgical light; make light come from device behavior, flash documentation, emissive
    heat, telescope exposure, glass reflections, or clinical illumination, preserving believable
    exposure, shadow density, highlight rolloff, and source motivation.
  texture_and_material: >-
    Render Sterile surface, metal, medical sheen; render scan noise, compression, measurement
    surfaces, medical cleanliness, forensic detail, microtexture, or signal artifacts as capture
    evidence, avoiding both waxy smoothing and noisy texture overlays that hide the prompt content.
  camera_and_composition: >-
    Compose through Medical Photography diagnostic capture constraints, device-specific signal,
    evidence clarity, and technical photographic neutrality; compose through mounted POV, deadpan
    documentation, miniature focal bands, abstract cropping, evidence scale, or instrument framing,
    with lens distance, depth, timing, and focal hierarchy doing the style work.
  atmosphere_and_mood: >-
    Keep the mood Sterile, intense; derive mood from surveillance, diagnosis, evidence, scientific
    alienness, minimalism, procedural restraint, or technical unease, so the preset changes
    interpretation without demanding a specific story, location, or character.
  rendering_and_quality: >-
    Finish with Clinical, sharp; finish with exact capture logic, readable signal, controlled
    artifacts, and no cinematic beauty-lighting overwrite, high-resolution photographic detail, and
    disciplined denoise without losing natural grain where the preset needs it.
  key_features: >-
    Clinical medical documentation; Clean depth field; Sterile red-blue accents; Bright surgical
    light; Medical Photography diagnostic capture constraints, device-specific signal, evidence
    clarity, and technical photographic neutrality
  creative_brief: >-
    Apply Medical Photography as a photographic preset over prompt X: preserve the user's requested
    subject, then route Clinical medical documentation, Sterile red-blue accents, Bright surgical
    light, Sterile surface, metal, medical sheen, and Medical Photography diagnostic capture
    constraints, device-specific signal, evidence clarity, and technical photographic neutrality
    through optics, exposure, palette, surface response, timing, and finish without requiring the
    card image's original subject.
