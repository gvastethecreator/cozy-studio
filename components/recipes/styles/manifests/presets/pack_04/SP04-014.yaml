visualDna:
  aesthetic: 'Pixel comic art: comic inking translated into pixels, one-pixel black outlines, ordered-dither halftone shading and a strict indexed palette on a visible grid.'
  subject_treatment: Keep the prompt subject, action and setting and redraw them as one single comic image in this medium; never add panels, gutters, speech balloons, captions or sound-effect lettering the prompt did not ask for.
  color_and_tone: Indexed palette of about 32 colors, dithered ramps between neighboring tones, deep navy used instead of pure black shadow.
  lighting_and_shadow: Baked sprite shading with hand-placed pixel clusters; a single light direction shown by bright edge pixels.
  texture_and_material: Hard square pixels with intentional aliasing, checkerboard and Bayer dither patterns standing in for print halftone.
  camera_and_composition: Splash-page framing at low resolution, chunky readable silhouettes, perspective simplified to fit the grid.
  atmosphere_and_mood: Nostalgic and playful, a comic splash drawn on an old console.
  rendering_and_quality: Crisp nearest-neighbor pixels, no anti-aliasing, no smooth gradients and no blur.
  key_features: one-pixel black outlines; ordered-dither shading; indexed 32-color palette; visible pixel grid; chunky silhouettes
  creative_brief: "Pixel comic art: comic inking translated into pixels, one-pixel black outlines, ordered-dither halftone shading and a strict indexed palette on a visible grid. Carry it through one-pixel black outlines, ordered-dither shading, indexed 32-color palette, visible pixel grid, chunky silhouettes. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
avoidRules:
  - added panels or gutters
  - speech balloons
  - sound-effect lettering
  - franchise hero costume
  - chest emblem of a known hero
  - smooth gradients
