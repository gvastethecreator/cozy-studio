visualDna:
  aesthetic: 'Hazed window shafts: large film lights pushed through windows into a room filled with haze, so the light becomes solid beams.'
  subject_treatment: Keep the prompt subject, action, setting and framing constant; change only the cinematic lighting setup, its haze and its grade, so the light is the difference, not a new location.
  color_and_tone: Warm or daylight-white beams against grey-brown ambient, lifted shadows from the haze.
  lighting_and_shadow: Hard HMI-like source outside the windows, crisp parallel beams, subjects stepping in and out of light.
  texture_and_material: Haze density, dust motes and window mullion patterns printed on the floor.
  camera_and_composition: Keep the requested framing; beams crossing the frame diagonally past the subject.
  atmosphere_and_mood: Solemn and reverent, a quiet room filled with visible light.
  rendering_and_quality: Film-set volumetrics with smooth haze and no banding.
  key_features: hard source through windows; hazed interior; parallel beams; mullion patterns on the floor; lifted shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Hazed Window Shafts as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
