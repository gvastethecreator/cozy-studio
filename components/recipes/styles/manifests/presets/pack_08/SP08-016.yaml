visualDna:
  aesthetic: 'Normcore: deliberately plain everyday clothes worn with intent — the fashion is in the anonymity.'
  subject_treatment: "Redress the prompt's wearer in this wardrobe while keeping their identity, age, body, pose, action and setting: plain fleece or crewneck, straight jeans or khakis, white sneakers or basic sandals, nothing branded or decorative."
  color_and_tone: Muted washed blues, grey, beige and white, applied to garments and accessories while skin, setting and props keep their natural color.
  lighting_and_shadow: Flat, honest daylight or fluorescent light, shaped to reveal garment cut, drape, texture and fit on the wearer.
  texture_and_material: Fleece, washed denim, cotton jersey and scuffed canvas, rendered with correct weave, weight, sheen and stitching.
  camera_and_composition: Straightforward, centered, almost deadpan framing, keeping the full outfit silhouette and fit readable at card size.
  atmosphere_and_mood: Ironic, unbothered and quietly cool, carried by the wearer's posture, styling and attitude.
  rendering_and_quality: Documentary-plain finish without glamour retouching, with believable fabric weight, seams and fit detail.
  key_features: plain fleece and straight jeans; white sneakers; no branding; deadpan framing; flat daylight
  creative_brief: "Normcore: deliberately plain everyday clothes worn with intent — the fashion is in the anonymity. Carry it through plain fleece and straight jeans, white sneakers, no branding, deadpan framing, flat daylight. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
