visualDna:
  aesthetic: >-
    Overlap flat rectangular and slanted color slabs with deliberate offsets, crisp edges, and sparse
    bright interruptions.
  subject_treatment: >-
    Preserve requested content and function; translate existing planes into layered color shapes without
    adding signage or a public event.
  color_and_tone: Use charcoal and cream with cyan and one hard red or amber accent; keep each layer distinct.
  lighting_and_shadow: Use simple contact shadows between selected planes and contain any glow to a small area.
  texture_and_material: Favor matte flat color and smooth edges; keep torn fibers from becoming the main surface.
  camera_and_composition: Preserve the requested crop; offset a few planes around the focal subject and leave open gaps.
  atmosphere_and_mood: Feel direct and alert through clean signal contrast and abrupt layer changes.
  rendering_and_quality: Keep the color hierarchy immediate and layers crisp without invented marks.
avoidRules:
  - layers collapsing into torn-paper collage
  - glow spread across every surface
  - logo-like marks added without request
assets:
