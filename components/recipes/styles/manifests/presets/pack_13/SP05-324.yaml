visualDna:
  aesthetic: 'Rumiko Takahashi manga look as in Ranma 1/2: round clean faces, elastic slapstick bodies, martial-arts comedy, quick panel timing and cheerful romantic chaos.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Takahashi designs, round faces, big simple eyes and springy energetic bodies. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Black ink with light tone, and bright flat color in color pages.
  lighting_and_shadow: Flat bright comic light, lit the way Rumiko Takahashi lights its scenes.
  texture_and_material: Clean round brush-pen line and light tone, with the surface finish of Rumiko Takahashi.
  camera_and_composition: Quick comic panels and slapstick action, framed the way Rumiko Takahashi composes its shots and pages.
  atmosphere_and_mood: Keep the requested mood with bouncy romantic slapstick.
  rendering_and_quality: Clean lively comedy manga illustration, in the recognizable hand of Rumiko Takahashi.
  key_features: Rumiko Takahashi roundness; slapstick; rom-com; martial comedy
  creative_brief: "Rumiko Takahashi manga look as in Ranma 1/2: round clean faces, elastic slapstick bodies, martial-arts comedy, quick panel timing and cheerful romantic chaos. Carry it through Rumiko Takahashi roundness, slapstick, rom-com, martial comedy. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
