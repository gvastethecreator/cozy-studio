visualDna:
  aesthetic: 'Xeriscape climate grammar: a dry-climate garden that needs no irrigation, arranged as sculptural succulents and drought grasses over gravel mulch with dry creek beds for rare rain.'
  subject_treatment: Keep the requested site, subject, action and camera; reorganise ground plane, planting, edging and paths in this garden system only where the prompt has outdoor ground, and add no garden to an interior, object or portrait prompt.
  color_and_tone: Blue-grey agave, silver sage, straw grasses, ochre and rose stone, decomposed granite tan; bright dry palette with hard shadows.
  lighting_and_shadow: Hard high sun casting sharp rosette shadows, or low desert light turning grasses gold; very little shade.
  texture_and_material: Agave and yucca rosettes, barrel cactus, desert spoon, bunch grasses, decomposed granite paths, river-rock dry creek beds, boulders, dry-laid stone walls.
  camera_and_composition: Keep the requested view; spaced sculptural plants with bare gravel between them, a dry creek line leading the eye.
  atmosphere_and_mood: Sparse, sun-hardened and resourceful, beauty in drought.
  rendering_and_quality: Sharp daylight photograph with crisp spines and rosette edges, no lawn, no cartoon cacti.
  key_features: spaced agave and yucca rosettes; decomposed granite paths; river-rock dry creek bed; silver drought grasses; hard sun shadows
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Xeriscape Climate Grammar as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
