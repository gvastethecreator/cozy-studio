visualDna:
  aesthetic: 'Blackbird Interactive Homeworld: Deserts of Kharak (2016) look: real-time strategy across vast desert dunes, colossal land carriers, tracked vehicles leaving dust trails and buried alien wrecks.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; render vehicles and people as small detailed military sci-fi units seen from a high strategy camera. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Desert ochre, dusty tan, steel grey and signal orange.
  lighting_and_shadow: Harsh desert sun with long dune shadows and dust haze.
  texture_and_material: Weathered industrial metal, sand drifts and dust trails.
  camera_and_composition: High tilted RTS camera over the dunes, framed the way Deserts of Kharak 2016 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with vast lonely desert warfare.
  rendering_and_quality: Authentic mid-2010s desert RTS screen, matching real Deserts of Kharak 2016 screenshots.
  key_features: Kharak land carriers; desert dunes; dust trails; RTS camera
  creative_brief: 'Blackbird Interactive Homeworld: Deserts of Kharak (2016) look: real-time strategy across vast desert dunes, colossal land carriers, tracked vehicles leaving dust trails and buried alien wrecks. Carry it through Kharak land carriers, desert dunes, dust trails, RTS camera. Use it as a reusable look on any subject, keeping the prompt''s own subject, action, setting and mood.'
