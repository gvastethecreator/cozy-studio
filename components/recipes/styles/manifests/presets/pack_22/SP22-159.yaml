visualDna:
  aesthetic: >-
    Opaque enamel-like paint uses compact color facets oriented to the existing form, with firm edges
    and small reflections contained within its silhouette.
  subject_treatment: >-
    Preserve the requested identity, proportions, pose and action. Place facets at existing changes
    of plane without adding seams or dividing the subject into invented pieces.
  color_and_tone: >-
    Keep the requested palette and relationships. Use dense color areas and clean shadow shapes;
    do not introduce rainbow shifts or new dominant hues.
  lighting_and_shadow: >-
    Follow the requested light direction and contrast. Keep highlights within the lit form and avoid
    reflections that imply another source.
  texture_and_material: >-
    Suggest a smooth painted surface through opaque color and contained shine. Preserve materials in
    the request and avoid a foil or physical print finish.
  camera_and_composition: >-
    Preserve the requested viewpoint, pose, crop and placement. Faceted color does not add seams,
    labels, a frame or a card layout.
  atmosphere_and_mood: >-
    Keep the requested scene and mood. Enamel-like paint is a local rendering choice, not a new
    setting or object treatment for every surface.
  rendering_and_quality: >-
    Resolve broad form planes first, then add firm boundaries and a few compact highlights. Keep
    facet sizes subordinate to the subject's identifying shape.
avoidRules:
  - invented seams or panel lines
  - rainbow reflections or foil-like finish
  - unrequested labels, frame or card layout
