visualDna:
  aesthetic: 'Refined copperplate line engraving: swelling and tapering burin lines, disciplined parallel and cross hatching, dot-and-lozenge fills, and crisp black ink on bright plate-toned paper.'
  subject_treatment: 'Any prompt subject is modeled entirely by engraved line: contour lines follow the form, hatch direction describes surface, and value comes from line thickness and spacing, never from wash.'
  color_and_tone: Black ink on warm white paper with a faint plate-tone edge; strictly monochrome.
  lighting_and_shadow: Classical directional light described by hatch density, with clean highlights left as untouched paper.
  texture_and_material: Swelling burin lines, cross-hatch lattices, dot-and-lozenge patterns, and a subtle plate mark.
  camera_and_composition: Formal, well-balanced composition with a clearly modeled focal subject and orderly receding background planes.
  atmosphere_and_mood: Precise, authoritative, antique, and composed.
  rendering_and_quality: 'Museum-grade engraving clarity: every line intentional and crisp, no scribble, no noise, readable at thumbnail size.'
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Copperplate Burin Engraving as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed relic, fixed creature, readable text, or a repeated Pack 17 thumbnail formula."
  key_features: swelling burin lines; form-following hatch; dot-and-lozenge fills; monochrome plate tone; classical order
