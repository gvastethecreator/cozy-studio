visualDna:
  aesthetic: 'Solarpunk: hopeful green-tech communities where plants, solar glass and handmade repair live together.'
  subject_treatment: "Rebuild the prompt's subject, action and setting through this construction while keeping them recognizable: set in a lived-in green city: terraces of gardens, solar canopies, wind sails, stained-glass panels and people working together."
  color_and_tone: Sunny greens, warm whites, sky blue and copper, used consistently across subject and background.
  lighting_and_shadow: Bright warm daylight filtered through leaves and glass, expressed through the style rather than photographic lighting.
  texture_and_material: Living plants, bamboo, glass, copper and weathered wood, visible at card size as the signature of the style.
  camera_and_composition: Wide inhabited view with foreground gardens and deep city layers.
  atmosphere_and_mood: Hopeful, communal, fresh and calm, driven by the construction, color and rhythm.
  rendering_and_quality: Clean detailed illustration or painting, with clean, deliberate marks and no accidental noise.
  key_features: rooftop gardens; solar canopies; wind sails; communal life
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Solarpunk as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
