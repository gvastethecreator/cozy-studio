visualDna:
  aesthetic: 'Inertial Ribbon Transitions: styleframes where one connected ribbon drags the first scene away and brings in the next with believable inertia.'
  subject_treatment: Show the prompt's transition as keyframes of one flat ribbon carrying the first content out and the next in, ends traceable and words exact.
  color_and_tone: Ribbon color tied to the identity on compatible backgrounds.
  lighting_and_shadow: Consistent light across the ribbon folds with every edge visible.
  texture_and_material: A ribbon of controlled width with limited twist.
  camera_and_composition: Declared entry, turn and exit, content revealed by the ribbon itself.
  atmosphere_and_mood: Drag, delay and inertia with one dominant direction and reading pauses.
  rendering_and_quality: Crisp keyframes with a continuous ribbon outline and traceable ends.
  creative_brief: "Inertial Ribbon Transitions: styleframes where one connected ribbon drags the first scene away and brings in the next with believable inertia. Carry it through carrying ribbon, inertia, traceable ends, one direction. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
  key_features: carrying ribbon; inertia; traceable ends; one direction
