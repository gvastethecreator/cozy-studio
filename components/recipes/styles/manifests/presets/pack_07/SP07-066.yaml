visualDna:
  aesthetic: 'Microscale brick build: the subject assembled from tiny studded plastic bricks, plates and tiles so the studs become surface texture and curves turn into steps.'
  subject_treatment: Keep the requested subject, its identity, pose and camera, and rebuild it as a handmade tabletop miniature in this material; a requested object stays that object and never turns into a house or building.
  color_and_tone: Flat injection-molded primaries, greys and tans with no gradient inside a single brick; glossy but solid color.
  lighting_and_shadow: Soft studio key with small specular glints on every stud and hard little shadows in the stepped seams.
  texture_and_material: Round studs, crisp part seams, offset plates, smooth tiles on finished faces; plain studs with no lettering.
  camera_and_composition: Keep the requested view as a macro on a neutral base; the stepped silhouette must read at thumbnail size.
  atmosphere_and_mood: Clever and tactile, a builder solving every curve with small parts.
  rendering_and_quality: Macro photograph of a real brick model, generic parts only, no minifigures and no brand marks.
  key_features: studs as surface texture; stepped brick curves; offset plate seams; flat molded primaries; macro on a neutral base
  creative_brief: "Apply this as a reusable style router after prompt X: prompt X supplies subject, action, setting, tone, and intensity, while this preset supplies Studded ABS Brick System as medium, palette, mark language, composition logic, material behavior, and finish. Preserve the user's subject instead of forcing this preset's sample-card subject, fixed character, fixed prop, readable text, or a repeated thumbnail formula."
