visualDna:
  aesthetic: >-
    Diorama Box operates as a portable source-router layer: combine Handcrafted miniature diorama
    style with playful stagecraft depth, layered cutout worldbuilding, and tactile craft-theater
    charm with hand-built object logic with toy scale, assembly marks, tactile charm, and playful
    construction, so the preset supplies visual behavior rather than a fixed card scene or literal
    sample.
  subject_treatment: >-
    Preserve the prompt's subject plus requested motion and context while letting forms simplify,
    assemble, soften, hinge, stitch, fold, carve, or snap together through Flat cutout silhouettes,
    stacked layer edges, profile-stage geometry, and parallax-driven contour readability; identity
    stays readable through construction grammar, proportion, edge logic, and detail scale as this
    preset is applied.
  color_and_tone: >-
    Map color through material-native color blocks, toy-safe saturation, handmade variance, and
    clean separation between parts; keep hue roles intentional, value separation clear, and palette
    behavior attached to the subject's forms instead of pasted decoration.
  lighting_and_shadow: >-
    Use Miniature-box top/side illumination with focused peep-stage warmth and shadow layering that
    enhances depth illusion plus small-scale object lighting, crisp edge readability, soft contact
    shadows, and material-specific highlights as the light-response contract, with readable
    hierarchy, controlled contact detail, and no lighting choice that erases the user's requested
    content.
  texture_and_material: >-
    Render Cardboard grain, glue seams, felt and fiber accents, soft craft stuffing cues, and
    stick-frame handcrafted irregularity plus plastic, clay, yarn, paper, wood, metal, felt, ice,
    tile, thread, sand, or carved surface behavior; surface scale, residue, gloss, grain, fiber,
    pores, edges, or signal artifacts must remain coherent across figures, objects, and
    environments.
  camera_and_composition: >-
    Compose with Forced-perspective micro-staging with deliberate scale compression between near and
    rear craft planes plus object-scale staging, modular silhouette rhythm, clear construction
    reads, and tactile detail hierarchy as reusable framing grammar, allowing cards, portraits,
    objects, scenes, and abstract prompts to inherit the style without one required layout.
  atmosphere_and_mood: >-
    Carry mood through play, collectability, handmade care, nostalgia, miniature engineering, and
    physical charm; the emotional tone should feel specific to Diorama Box while still obeying the
    prompt's subject and context.
  rendering_and_quality: >-
    Finish with clean craft detail, readable construction, deliberate imperfections, and no
    accidental realism collapse; prioritize clean style recognition, prompt preservation, controlled
    detail, and a finished image with no watermark, fake text, or accidental UI.
  key_features: >-
    Handcrafted miniature diorama style with playful stagecraft depth, layered cutout worldbuilding,
    and tactile craft-theater charm; Flat cutout silhouettes, stacked layer edges, profile-stage
    geometry, and parallax-driven contour readability; Cardboard grain, glue seams, felt and fiber
    accents, soft craft stuffing cues, and stick-frame handcrafted irregularity; Miniature-box
    top/side illumination with focused peep-stage warmth and shadow layering that enhances depth
    illusion; Forced-perspective micro-staging with deliberate scale compression between near and
    rear craft planes
  creative_brief: >-
    Use Diorama Box after prompt X as a transferable style layer: prompt X supplies subject, action,
    and setting, while the preset supplies Handcrafted miniature diorama style with playful
    stagecraft depth, layered cutout worldbuilding, and tactile craft-theater charm, Flat cutout
    silhouettes, stacked layer edges, profile-stage geometry, and parallax-driven contour
    readability, Cardboard grain, glue seams, felt and fiber accents, soft craft stuffing cues, and
    stick-frame handcrafted irregularity, Miniature-box top/side illumination with focused
    peep-stage warmth and shadow layering that enhances depth illusion, Forced-perspective
    micro-staging with deliberate scale compression between near and rear craft planes plus clearly
    expressed joins, simplified proportions, craft tolerances, modular parts, and maker-process
    evidence, palette behavior, light response, material treatment, and finish discipline without
    requiring one specimen, prop bundle, product still, or card composition.
avoidRules:
  - full scale
  - melted craft
  - generic toy render
  - featureless plastic
  - fixed specimen
  - literal card scene
  - generic stock texture
  - muddy noise
  - watermark
  - readable text
