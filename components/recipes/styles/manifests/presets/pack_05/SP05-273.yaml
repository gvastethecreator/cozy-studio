visualDna:
  aesthetic: Nocturnal nature anime painting with fine silver vein-like linework traced through leaves, bark, antler, water and skin, as if living structure glowed faintly from inside.
  subject_treatment: Redraw the prompt's subject, action, count and setting in this seinen ink treatment; a gentle or everyday prompt stays gentle in content while only marks, values and palette change.
  color_and_tone: Deep blue-teal night values with silver-blue highlights and pale mint light inside the veins.
  lighting_and_shadow: Gentle lunar falloff from above, cool reflected edges, and veins lit from within at very low intensity.
  texture_and_material: Translucent haze on organic surfaces over soft gouache-like fills, while stone and metal stay matte.
  camera_and_composition: Keep the requested framing; organic forms carry the fine detail while other areas stay calm and open.
  atmosphere_and_mood: Hushed nocturnal calm, the whole world breathing slowly.
  rendering_and_quality: Soft painterly fills with fine crisp vein lines and no heavy blacks anywhere.
  key_features: silver vein linework through organic forms; blue-teal night palette; faint inner glow; lunar falloff; translucent haze
  creative_brief: "Nocturnal nature anime painting with fine silver vein-like linework traced through leaves, bark, antler, water and skin, as if living structure glowed faintly from inside. Carry it through silver vein linework through organic forms, blue-teal night palette, faint inner glow, lunar falloff, translucent haze. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
