visualDna:
  aesthetic: 'Cracked mud: dried mud coating the target and splitting into polygon cracks.'
  subject_treatment: "Apply this material to the surfaces of the target named in the prompt, keeping the target's shape, proportions, function, pose and setting; if no target is named, apply it to the main subject only: dried mud coats the target and splits into polygon cracks, curling at edges. Default intensity is moderate; follow the prompt if it asks for light or heavy wear."
  color_and_tone: Clay brown and ochre with dark crack lines, kept on the material while the rest of the scene keeps its own palette.
  lighting_and_shadow: Harsh sun with crisp shadows in cracks, chosen to reveal how the material reflects, absorbs or transmits light.
  texture_and_material: Dried mud plates, polygon cracks and curls, at a believable physical scale relative to the target.
  camera_and_composition: Keep the prompt framing, but make the material surface large and sharp enough to read its grain, pores or structure at card size.
  atmosphere_and_mood: Parched, rough, earthy and harsh, carried by the material itself rather than by added props.
  rendering_and_quality: Photoreal material rendering with correct micro-detail, edges and light response; no smeared or noisy surfaces.
  key_features: dried mud polygon cracks; curled edges; parched clay; surface-level damage; structure intact
  creative_brief: "Cracked mud: dried mud coating the target and splitting into polygon cracks. Carry it through dried mud polygon cracks, curled edges, parched clay, surface-level damage, structure intact. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
