visualDna:
  aesthetic: 'Fire dress: garments formed of controlled flame and embers, with a glowing core and flickering edges.'
  subject_treatment: 'Make the prompt''s garments out of this material while keeping the wearer, their skin, face, pose, action and setting unchanged: garments made of controlled flame with a glowing core, flickering edges and falling embers, never burning the wearer.'
  color_and_tone: Orange, gold and red flame with white-hot core, on the target material while the rest of the scene keeps its natural color.
  lighting_and_shadow: Self-illuminating flame lighting the wearer and surroundings, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Flame tongues, embers and heat shimmer, with correct scale, weight and surface behavior at every fold and edge.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Fierce, ceremonial, dangerous and magnificent, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
  key_features: flame-made garment; glowing core; falling embers; self-illumination
  creative_brief: "Fire dress: garments formed of controlled flame and embers, with a glowing core and flickering edges. Carry it through flame-made garment, glowing core, falling embers, self-illumination. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
