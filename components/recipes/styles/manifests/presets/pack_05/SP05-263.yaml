visualDna:
  aesthetic: 'Hiroya Oku Gantz manga look: photo-traced hyperrealistic Tokyo backgrounds, 3D-modeled figures with glossy black suits, cold nihilistic tension and alien absurdity.'
  subject_treatment: Preserve the requested identity, count, pose, action and any requested clothing; draw people with Oku realism, photographic ordinary faces, glossy black tight suits with circular nodes and ordinary Tokyo clothes. Wardrobe details apply only when the prompt leaves clothing open.
  color_and_tone: Glossy black, cold white, Tokyo night grey and electric blue node glows.
  lighting_and_shadow: Harsh flat apartment light and cold streetlights with glossy suit reflections.
  texture_and_material: Photo-traced backgrounds, digitally modeled figures and screentone gradients.
  camera_and_composition: Cinematic photographic framing, wide Tokyo streets and sudden absurd alien reveals.
  atmosphere_and_mood: Keep the requested mood with cold nihilistic absurdity.
  rendering_and_quality: Hyperreal digital manga illustration with photographic Tokyo detail.
  key_features: Hiroya Oku photorealism; glossy black suits; Tokyo streets; alien absurdity
  creative_brief: "Hiroya Oku Gantz manga look: photo-traced hyperrealistic Tokyo backgrounds, 3D-modeled figures with glossy black suits, cold nihilistic tension and alien absurdity. Carry it through Hiroya Oku photorealism, glossy black suits, Tokyo streets, alien absurdity. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
