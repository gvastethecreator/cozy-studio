  color_and_tone: Gothic stone brown, lava orange and teal energy.
  lighting_and_shadow: "Colored light baked onto walls in soft blotches, glowing orange lava and bright jump pad beams."
  texture_and_material: "Stone and metal textures that look sharp from afar and blurry up close, curved gothic arches made of visible straight segments."
  camera_and_composition: First-person view with weapon, framed the way Quake III Arena 1999 frames its gameplay screens.
  atmosphere_and_mood: Keep the requested mood with frantic arena bloodsport.
  rendering_and_quality: "A 1999 PC frame at 640 by 480 in first person: a chunky weapon at bottom center, health and ammo number shapes at the bottom."
  key_features: "Quake III gothic arena; blocky gladiators; jump pads; lava"
  creative_brief: "id Software Quake III Arena (1999) look: fast first-person arena shooter with gothic and tech architecture, jump pads, lava pits, floating items and blocky armored gladiators. Carry it through Quake III gothic arena, blocky gladiators, jump pads, lava. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
