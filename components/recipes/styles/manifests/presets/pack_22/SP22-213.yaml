visualDna:
  aesthetic: >-
    Build forms from intentional square pixel clusters on a consistent logical grid, using designed
    blocks rather than applying a pixel filter to a finished image.
  subject_treatment: >-
    Preserve the requested identity, proportions, count, pose, action and function. Shape clusters to
    describe the existing subject without adding objects or converting the image into a sprite sheet.
  color_and_tone: >-
    Preserve the requested palette and value relationships. Group colors deliberately within clusters
    and avoid arbitrary color changes from pixel to pixel; do not impose a fixed palette.
  lighting_and_shadow: >-
    Follow the requested light direction and organize its existing highlights and shadows into clear
    pixel groups without adding a light source or display effect.
  texture_and_material: >-
    Keep block sizes and stair-step edges coherent at the chosen scale. Avoid screen noise, simulated
    display artifacts and material changes to the depicted forms.
  camera_and_composition: >-
    Preserve the requested viewpoint, crop, framing and placement. The pixel grid does not prescribe a
    game view, interface or layout.
  atmosphere_and_mood: >-
    Retain the requested setting and tone. Pixel construction is a rendering method, not a required
    retro theme or narrative.
  rendering_and_quality: >-
    Establish the silhouette and large value groups before smaller clusters; keep essential features
    readable and use consistent pixel scale without inconsistent antialiasing.
avoidRules:
  - mixed pixel scales or inconsistent antialiasing
  - arbitrary per-pixel color noise
  - details that alter identity or function
