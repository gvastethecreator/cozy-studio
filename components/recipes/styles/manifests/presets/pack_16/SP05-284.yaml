  aesthetic: 'Hayao Miyazaki and Studio Ghibli feature animation as in Castle in the Sky: Welsh-inspired mining towns, ornithopter flying machines, towering cumulus clouds and overgrown floating ruins.'
  subject_treatment: Preserve the requested identity, count, pose and action; draw people with classic early Ghibli designs, round faces, dot-highlight eyes, sturdy limbs and practical work clothes and goggles.
  color_and_tone: Sky blue, cloud white, moss green, brass and warm stone ochre.
  lighting_and_shadow: Bright high-altitude sunlight, huge glowing clouds, warm interior lamps.
  texture_and_material: Hand-painted watercolor and gouache backgrounds, riveted metal machines, moss on stone.
  camera_and_composition: Dizzying heights and vertical drops, flying machines crossing the frame, giant cloud walls.
  atmosphere_and_mood: Keep the requested mood with soaring adventurous wonder.
  rendering_and_quality: Classic 1980s hand-drawn Ghibli feature frame with airy painted skies.
  key_features: Ghibli clouds; flying machines; floating ruins; round faces; brass and moss
  creative_brief: "Hayao Miyazaki and Studio Ghibli feature animation as in Castle in the Sky: Welsh-inspired mining towns, ornithopter flying machines, towering cumulus clouds and overgrown floating ruins. Carry it through Ghibli clouds, flying machines, floating ruins, round faces, brass and moss. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
