    background, action, official card scene, fixed thumbnail subject, prompt replaced by sample
    image, readable fake text, watermark, logo clutter, muddy AI texture, generic fantasy slop,
    generic fantasy wallpaper, overpolished final render, unclear design callouts, random kitbash
    clutter
