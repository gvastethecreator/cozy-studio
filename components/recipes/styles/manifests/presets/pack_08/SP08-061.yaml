  color_and_tone: Ivory, black or dusty rose lace over contrasting layers.
  lighting_and_shadow: Backlight that shows the openwork pattern, chosen to reveal how this material reflects, absorbs or transmits light.
  texture_and_material: Fine lace with floral motifs, mesh ground and scalloped edges.
  camera_and_composition: Frame the full figure or the garment area large enough that the material reads at a glance; the material effect stays on the clothing.
  atmosphere_and_mood: Delicate, romantic, heirloom and intricate, carried by how the material moves and catches light.
  rendering_and_quality: Photorealistic material rendering with believable physics, clean edges and no smeared or noisy surfaces.
