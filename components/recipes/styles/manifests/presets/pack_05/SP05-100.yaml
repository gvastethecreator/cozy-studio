visualDna:
  aesthetic: >-
    Luminous cel painting built from vertical mineral-like planes, warm points of light, and layered
    depth.
  subject_treatment: >-
    Preserve the requested subject and gesture; articulate form with tall facet-like value shifts
    and small precise details.
  color_and_tone: >-
    Pair amber and pale gold with cool teal shadows; let a supplied palette take precedence.
  lighting_and_shadow: >-
    Warm localized highlights sit against cooler ambient values, with glow kept soft and contained.
  texture_and_material: >-
    Use crisp faceted accents, subtle grain, and smooth color transitions while keeping the depicted
    materials intact.
  camera_and_composition: >-
    Keep the requested framing; build depth through stacked vertical shapes and shifts of scale
    already present.
  atmosphere_and_mood: >-
    Hopeful and humble in mood, with no required adventure or setting.
  rendering_and_quality: >-
    Maintain clean cel edges, layered distance, and readable contrast without excessive bloom.
  key_features: >-
    Vertical depth, mineral facets, amber highlights, and cool shadow color make the composition
    feel quietly luminous.
  creative_brief: >-
    Give the requested content a vertically layered, warmly lit cel finish; do not add a crystal
    cavern or fixed fantasy scene.
