visualDna:
  aesthetic: 'Dark fantasy art direction of eroded grandeur: colossal ruined architecture, worn stone and dim gold, with a tiny figure against oppressive scale.'
  subject_treatment: Keep the prompt subject, action, setting and camera; this art direction sets palette, light, shape language and finish, and adds no interface elements.
  color_and_tone: Desaturated ash grey, bone and ochre with one dim gold or ember accent; low overall saturation.
  lighting_and_shadow: Overcast diffuse light, pale god-rays through ruins, deep atmospheric perspective and faint ember glows.
  texture_and_material: Pitted, eroded stone, rusted and tarnished metal, torn banners, moss and ash drifts.
  camera_and_composition: Keep the requested view; when unspecified, a low patient frame with huge negative space above a small figure.
  atmosphere_and_mood: Melancholic and oppressive, the ruin of a vanished age.
  rendering_and_quality: Painterly realism with restrained detail and heavy atmosphere; no glossy fantasy color.
  key_features: colossal ruins; tiny figure; desaturated ash palette; pale god-rays; eroded stone and tarnish
  creative_brief: "Dark fantasy art direction of eroded grandeur: colossal ruined architecture, worn stone and dim gold, with a tiny figure against oppressive scale. Carry it through colossal ruins, tiny figure, desaturated ash palette, pale god-rays, eroded stone and tarnish. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
