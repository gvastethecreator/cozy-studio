  lighting_and_shadow: Stormy light, glowing sunset, eerie dim otherworld light.
  texture_and_material: Rich hand-painted texture, dense line detail and swirling water.
  camera_and_composition: Still composed shots with long silences, towers on horizons, strange crowds of birds.
  atmosphere_and_mood: Keep the requested mood with grave mournful wonder.
  rendering_and_quality: Late-Ghibli painterly hand-drawn feature frame with heavy textured brushwork.
  key_features: Late Miyazaki gravity; otherworld towers; strange birds; painterly seas; mourning
