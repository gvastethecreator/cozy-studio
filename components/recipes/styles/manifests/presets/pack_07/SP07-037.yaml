visualDna:
  aesthetic: 'Immersive aquarium optics: a room seen through or beside thick acrylic water walls, where blue attenuation, refraction and caustics shape everything.'
  subject_treatment: Keep the requested place, its function, occupants and action; bring this space type's materials, wear, circulation logic and light onto it, and turn it into that space type only when the prompt asks for that place.
  color_and_tone: Cyan to deep ultramarine with depth, warm colours absorbed first, silhouettes nearly black against the glowing tank; cool low key.
  lighting_and_shadow: Light coming from the water itself, rippling caustic nets on floors and faces, dark room around the glowing panel.
  texture_and_material: Thick curved acrylic with slight distortion at the edges, suspended particles, bubbles, wet stone and rock, dark polished floor catching caustics.
  camera_and_composition: Keep the requested view; silhouettes in the foreground against a large bright water field, no tunnel corridor.
  atmosphere_and_mood: Hypnotic, cool and dreamlike, as if breathing underwater.
  rendering_and_quality: Photograph with correct depth colour loss, clean caustics and particle depth, no fish mascots.
  key_features: blue depth attenuation; rippling caustic nets; thick curved acrylic distortion; suspended particles; dark silhouettes against glowing water
  creative_brief: "Immersive aquarium optics: a room seen through or beside thick acrylic water walls, where blue attenuation, refraction and caustics shape everything. Carry it through blue depth attenuation, rippling caustic nets, thick curved acrylic distortion, suspended particles, dark silhouettes against glowing water. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
