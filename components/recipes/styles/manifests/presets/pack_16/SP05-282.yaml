visualDna:
  aesthetic: >-
    Observational anime drawing: responsive medium-weight ink, natural proportions, soft cel
    modeling, and resolved small gestures.
  subject_treatment: >-
    Keep the requested identities, count, anatomy, proportions, pose and action. Contour
    variation may clarify existing gestures but must not create or idealize them.
  color_and_tone: >-
    Honor explicitly requested colors. When no palette is specified, favor muted umber, ochre,
    cream, and blue-gray while keeping each material's stated color recognizable.
  lighting_and_shadow: >-
    Respect the supplied light sources and direction. Model with broad natural illumination,
    restrained warm bounce, cool neutral fill, and soft contact shadows from present forms.
  texture_and_material: >-
    Apply texture only to materials already present. Keep surfaces matte with brief fine
    hatching only on materials already textured; avoid glossy filter finishes.
  camera_and_composition: >-
    Preserve the requested viewpoint, relative placement, and crop. Distribute detail among
    supplied subjects and leave remaining areas in quiet, readable value groups.
  atmosphere_and_mood: >-
    Keep the requested emotion; observational line and natural proportions do not require warmth
    or intimacy.
  rendering_and_quality: >-
    Protect anatomy and small details with even denoise, gentle value separation, and no plastic
    smoothing.
  key_features: >-
    Responsive medium ink; natural proportion; soft cel modeling; locally resolved gestures.
  creative_brief: 'Use responsive medium ink; natural proportion; soft cel modeling; locally resolved gestures. Keep the requested subjects, action, setting, palette, framing and mood; add no scene content. Use it as a reusable look on any subject.'
