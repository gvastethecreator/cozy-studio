  aesthetic: 'Split-Weight Navigation: very light navigation contrasts with a dense working surface and bold primary actions.'
  subject_treatment: Give the prompt's app a light narrow navigation and a denser main work area with one bold primary action; keep requested labels exact.
  color_and_tone: Low-weight navigation, well-contrasted content and one accent for the main action.
  lighting_and_shadow: Discreet depth only between navigation and the active zone.
  texture_and_material: Neutral surfaces, clear icons and controls of different weights.
  camera_and_composition: Narrow but legible navigation, with the width reserved for the real task.
  atmosphere_and_mood: Easy access and deep concentration while working, in one unified space.
  rendering_and_quality: Navigation stays visible and the dense zone feels like the same app.
