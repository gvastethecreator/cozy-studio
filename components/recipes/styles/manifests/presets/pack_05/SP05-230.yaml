visualDna:
  aesthetic: >-
    Monumental graphic rendering built from long structural lines, blocky value masses, broad
    voids, and rare cold highlights; scale is a visual relation, not a required setting.
  subject_treatment: >-
    Preserve the subject’s identity and proportions. Clarify its existing structure with long
    clean contours and large shadow groupings without enlarging or replacing it.
  color_and_tone: >-
    Use charcoal, slate, blue-black, and steel, with very sparse cyan or white highlights.
  lighting_and_shadow: >-
    Set large hard cel-shadow shapes against a few cold edge glints; keep illuminated areas
    broad, quiet, and subordinate.
  texture_and_material: >-
    Keep existing materials legible. Limit texture to precise seams, faint wear, and controlled
    grain against expansive simple areas.
  camera_and_composition: >-
    Keep the requested view and scale. Use long aligned contours and open negative space within
    the established framing.
  atmosphere_and_mood: >-
    Create silence and scale through still spacing, strong value grouping, and minimal accents,
    without adding a megastructure or vessel.
  rendering_and_quality: >-
    Use clean block shadows, sharp silhouettes, disciplined line density, and a low glow
    threshold to preserve quiet.
  key_features: >-
    Long structural contours; broad dark masses; open negative space; sparse cold highlights.
  creative_brief: >-
    Keep the specified subject, scale, and setting. Use long structural lines, broad shadow
    masses, and sparse cold glints; add no megastructure, vessel, or space scene.
