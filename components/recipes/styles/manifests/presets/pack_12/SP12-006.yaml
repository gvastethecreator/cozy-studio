visualDna:
  aesthetic: >-
    Capture-derived video-game style router based on Bloodstained: Ritual of the Night gameplay
    screenshots: gothic side-scrolling action-RPG capture with ornate libraries, spell effects,
    readable boss spacing, and layered parallax interiors. Apply this after prompt X; prompt X
    supplies the subject, action, setting, and intensity while this preset supplies capture
    language, camera grammar, material behavior, playable readability, and finish. Do not recreate
    an exact official level, character, logo, or marketing key art.
  subject_treatment: >-
    Preserve the user's subject and transform it into a playable Bloodstained: Ritual of the
    Night-adjacent game screenshot subject: keep clear role silhouette, player/enemy/object
    function, scale relationship, hitbox-like readability, and interaction affordances without
    copying source characters or named IP elements.
  color_and_tone: >-
    Use a Bloodstained: Ritual of the Night-informed palette: violet velvet, candle gold, book
    brown, moon blue, crimson magic, and porcelain skin highlights without copying characters. Keep
    value grouping legible at gameplay distance, with color accents behaving like route, danger,
    pickup, team, magic, or objective cues rather than decorative wash.
  lighting_and_shadow: >-
    Light the image through candelabra pools, stained glass rim, spell bloom, boss hit flashes, and
    deep library shadow bands. Lighting must clarify the playable route, threat, focal subject, or
    objective and avoid generic cinematic bloom that destroys screenshot readability.
  texture_and_material: >-
    Build surfaces from 2.5D gothic masonry, leather books, polished floors, embroidered costumes,
    demon silhouettes, and clean effect particles. Materials should feel like in-engine game assets
    captured during play, with enough texture identity to separate props, terrain, characters,
    hazards, and interactables.
  camera_and_composition: >-
    Compose with side-view combat lane with boss arena symmetry, jump arcs, magic projectiles,
    platforms, and health-bar readability. The frame should read as a plausible gameplay capture;
    include UI/HUD only when it matches the source game's visual logic and improves clarity.
  atmosphere_and_mood: >-
    Carry a Bloodstained: Ritual of the Night-derived mood: ornate, occult, dramatic, and
    arcade-readable. The preset can become adult, violent, eerie, seductive, cozy, tactical, or
    absurd when prompt X asks, but it should not force a fixed mission or story scene.
  rendering_and_quality: >-
    Finish as a coherent in-engine screenshot style, not concept art: boss health bars, MP meters,
    damage numbers, and item icons are allowed if they match a gothic action-RPG screenshot.
    Maintain heavy-denoise clarity, crisp focal hierarchy, readable gameplay scale, and no fake
    logos, stock-photo polish, or random interface clutter.
  key_features: >-
    Bloodstained: Ritual of the Night gameplay screenshots; gothic side-scrolling action-RPG capture
    with ornate libraries, spell effects, readable boss spacing, and layered parallax interiors;
    violet velvet, candle gold, book brown, moon blue, crimson magic, and porcelain skin highlights
    without copying characters; candelabra pools, stained glass rim, spell bloom, boss hit flashes,
    and deep library shadow bands; 2.5D gothic masonry, leather books, polished floors, embroidered
    costumes, demon silhouettes, and clean effect particles; side-view combat lane with boss arena
    symmetry, jump arcs, magic projectiles, platforms, and health-bar readability; ornate, occult,
    dramatic, and arcade-readable; HUD guidance: boss health bars, MP meters, damage numbers, and
    item icons are allowed if they match a gothic action-RPG screenshot
  creative_brief: >-
    Use Bloodstained Arcane Library Boss as a transferable game-originals preset. Preserve prompt X,
    then route interpretation through capture references from Bloodstained: Ritual of the Night:
    camera, HUD grammar, material language, color coding, encounter readability, and in-engine
    finish. Coherent HUD is allowed when the reference game uses it; avoid menus, logos, exact
    characters, exact levels, and promotional key art.
