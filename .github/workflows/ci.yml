name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Weekly macOS portability smoke (DoD §12).
    - cron: '17 6 * * 1'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

  portability-windows:
    name: Windows portability smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Server typecheck
        run: bun run build:server

      - name: Migration fixture
        run: bun run apps/local-server/src/dbMigrationFixture.ts

      - name: Studio init (isolated home)
        shell: bash
        run: |
          export HOME="${RUNNER_TEMP}/studio-home"
          export TEMP="${RUNNER_TEMP}/studio-temp"
          mkdir -p "$HOME" "$TEMP"
          bun run studio:init

  portability-macos:
    name: macOS portability smoke
    runs-on: macos-latest
    # Scheduled / release path — not required on every PR (cost), but required by DoD §12.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Server typecheck
        run: bun run build:server

      - name: Migration fixture
        run: bun run apps/local-server/src/dbMigrationFixture.ts

      - name: Studio init (isolated home)
        run: |
          export HOME="${RUNNER_TEMP}/studio-home"
          export TEMP="${RUNNER_TEMP}/studio-temp"
          mkdir -p "$HOME" "$TEMP"
          bun run studio:init

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
