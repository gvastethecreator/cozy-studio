  texture_and_material: Late analog hand-painted cel over painted backgrounds, subtle film grain, soft cel edge halation.
  camera_and_composition: Long contemplative shots of the city, reflections, ferry rides and still observation.
  atmosphere_and_mood: Keep the requested mood with quiet contemplative techno-noir.
  rendering_and_quality: Precise 1995 Production I.G feature frame with cinematic realism.
