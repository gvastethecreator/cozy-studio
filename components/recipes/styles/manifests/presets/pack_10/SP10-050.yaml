visualDna:
  aesthetic: 'Tartan: intersecting colored stripes forming a woven plaid sett.'
  subject_treatment: "Apply this motif woven into the fabric of the target named in the prompt (garment, object, upholstery, wall); if none is named, use it on the main subject's clothing or surface. Keep shape, pose and setting: a tartan sett of crossing stripes with twill diagonals."
  color_and_tone: Deep green, navy, red and yellow lines, on the patterned surface while the rest of the scene keeps its palette.
  lighting_and_shadow: Natural light that follows the surface, so the pattern bends with folds and curves.
  texture_and_material: Woven wool twill, with the pattern scaled correctly to the target.
  camera_and_composition: Keep the prompt framing; show enough of the patterned surface for the motif to read at card size.
  atmosphere_and_mood: Rugged, clan-proud, warm and bold, carried by the pattern and its colors.
  rendering_and_quality: Crisp, correctly repeating pattern that wraps believably around form, without smeared or random motifs.
  key_features: tartan sett; twill diagonals
  creative_brief: "Tartan: intersecting colored stripes forming a woven plaid sett. Carry it through tartan sett, twill diagonals. Use it as a reusable look on any subject, keeping the prompt's own subject, action, setting and mood."
